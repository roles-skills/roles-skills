summary: As lideranças jurídicas sêniores garantem que a organização aja dentro da lei e gira bem o seu risco jurídico. Lideram a equipe jurídica interna, gerem os assessores jurídicos externos e aconselham o conselho de administração e a direção executiva sobre os assuntos jurídicos mais significativos da organização. Em uma organização de saúde digital, isso inclui a base legal para o uso de dados de saúde, os grandes contratos de tecnologia e de dados, a propriedade intelectual em software e os deveres legais da organização.
health_context:
- A organização é um órgão público ou trabalha com eles, por isso suas decisões podem ser contestadas e ela deve agir dentro de suas competências.
- O uso de dados de saúde e de cuidados em escala, inclusive para IA e pesquisa, traz alto risco jurídico e de reputação.
- Os grandes contratos de tecnologia são longos, valiosos e difíceis de encerrar, por isso seus termos jurídicos moldam a organização por anos.
- As lideranças jurídicas trabalham em estreita colaboração com o conselho de administração, o responsável pela proteção de dados e colegas de segurança clínica e de governança da informação.
levels:
- title: Chefia adjunta de serviços jurídicos
  summary: As chefias adjuntas de serviços jurídicos lideram uma área importante da função jurídica, como o direito comercial, de tecnologia e de dados, e substituem a chefia de serviços jurídicos.
  responsibilities:
  - Liderar uma área importante do trabalho jurídico, como o direito comercial, de tecnologia e de dados, ou as disputas e o direito do trabalho.
  - Aconselhar diretorias sobre assuntos de alto risco, incluindo grandes contratações e programas de dados.
  - Gerir o painel de advogados externos e o orçamento para assessoria jurídica externa.
  - Definir padrões jurídicos, modelos e treinamentos para a organização.
  - Liderar e desenvolver várias equipes ou especialistas jurídicos.
  - Substituir a chefia de serviços jurídicos.
  qualifications:
  - Advogado qualificado e habilitado ao exercício da profissão, com ampla experiência após a qualificação, incluindo a liderança de uma equipe jurídica.
  job_evaluation_notes: Os conhecimentos estão no nível 8 pelo conhecimento especializado em várias áreas do direito. Os recursos de informação estão no nível 5, e não no 6, porque a função não gere sistemas de informação de toda a organização.
- title: Chefia de serviços jurídicos
  summary: As chefias de serviços jurídicos lideram a função jurídica da organização, definem sua abordagem do risco jurídico e aconselham a direção executiva e o conselho de administração.
  responsibilities:
  - Liderar a função jurídica interna e o uso de advogados externos.
  - Aconselhar a direção executiva e o conselho de administração sobre risco jurídico, deveres legais e grandes decisões.
  - Definir o apetite ao risco jurídico da organização e suas posições sobre questões-chave, como o uso de dados e a contratação.
  - Liderar o trabalho jurídico nos assuntos mais significativos, como grandes disputas, inquéritos públicos e parcerias.
  - Administrar o orçamento dos serviços jurídicos e demonstrar a relação custo-benefício.
  - Liderar e desenvolver a equipe jurídica e as operações jurídicas.
  qualifications:
  - Advogado qualificado e habilitado ao exercício da profissão, com ampla experiência sênior na liderança de serviços jurídicos.
  job_evaluation_notes: Os recursos financeiros estão no nível 4 porque a função administra o orçamento dos serviços jurídicos, e não orçamentos de vários serviços.
- title: Consultoria jurídica geral
  summary: A consultoria jurídica geral é a pessoa advogada mais sênior da organização, com responsabilidade corporativa pelos serviços jurídicos e pelo risco jurídico, e muitas vezes lidera também a governança corporativa como secretaria do conselho.
  responsibilities:
  - Ter a responsabilidade corporativa pelos assuntos jurídicos e pelo risco jurídico da organização.
  - Aconselhar o conselho de administração e sua presidência sobre as competências, os deveres e a governança da organização.
  - Garantir que as grandes estratégias, parcerias e programas de dados sejam legais.
  - Liderar a resposta às ameaças jurídicas mais graves, como revisões judiciais e ações regulatórias.
  - Liderar os serviços jurídicos e, muitas vezes, a governança corporativa e a secretaria do conselho.
  - Representar a organização perante reguladores, parceiros e órgãos governamentais.
  qualifications:
  - Advogado qualificado e habilitado ao exercício da profissão, com ampla experiência em nível executivo ou de conselho.
  job_evaluation_notes: Os recursos financeiros estão no nível 4 porque a função administra o orçamento dos serviços jurídicos e de governança, e não as finanças da organização.
