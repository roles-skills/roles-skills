summary: A equipe de comunicação ajuda a organização a explicar o que faz às equipes, aos pacientes, ao público, aos parceiros e à imprensa. Escreve e publica conteúdo, conduz a comunicação interna e campanhas, gere canais digitais e de redes sociais, trata consultas da imprensa e protege a reputação da organização, especialmente durante incidentes e indisponibilidades.
health_context:
- As comunicações sobre serviços de saúde devem ser exatas, claras e acessíveis, porque os pacientes podem agir com base nelas.
- As campanhas muitas vezes buscam mudar comportamentos, como incentivar pacientes e equipes de cuidados a usar um novo serviço digital.
- Indisponibilidades de serviços, incidentes cibernéticos e violações de dados exigem comunicação rápida e cuidadosa com pacientes, equipes, parceiros e a imprensa.
- Histórias sobre pacientes exigem consentimento e devem proteger a confidencialidade.
levels:
- title: Profissional de comunicação
  summary: Escreve e publica conteúdo para canais internos e externos e apoia a equipe de comunicação no trabalho rotineiro com a imprensa e em campanhas.
  responsibilities:
  - Escrever e editar notícias, conteúdo da intranet, boletins e publicações em redes sociais.
  - Publicar conteúdo aprovado no site, na intranet e nas redes sociais.
  - Registrar consultas da imprensa e monitorar a cobertura.
  - Apoiar campanhas e eventos com conteúdo e logística.
  - Conferir a exatidão, a acessibilidade e a linguagem simples do conteúdo.
  qualifications:
  - Experiência na escrita para diferentes públicos, ou qualificação em comunicação ou área afim, ou experiência equivalente.
- title: Profissional sênior de comunicação
  summary: Planeja e entrega a comunicação de projetos e serviços, trata consultas rotineiras da imprensa e gere canais.
  responsibilities:
  - Planejar e entregar a comunicação de projetos e mudanças de serviço.
  - Responder a consultas rotineiras da imprensa e redigir comunicados e declarações.
  - Gerir os planos de conteúdo dos canais digitais e de redes sociais e reportar o desempenho.
  - Escrever estudos de caso, incluindo histórias de pacientes, com consentimento.
  - Orientar colegas sobre como escrever com clareza para pacientes e para o público.
  - Orientar profissionais de comunicação.
  qualifications:
  - Graduação ou qualificação em comunicação ou área afim, ou experiência equivalente.
- title: Liderança de comunicação
  summary: Lidera a comunicação de um grande programa ou área, como a comunicação interna ou os canais digitais, e trata o trabalho sensível com a imprensa.
  responsibilities:
  - Liderar a comunicação e o engajamento de um grande programa, como um novo sistema clínico.
  - Planejar e avaliar campanhas que incentivem pacientes e equipes a adotar serviços digitais.
  - Tratar consultas sensíveis da imprensa e preparar porta-vozes.
  - Planejar com as equipes operacionais a comunicação de incidentes e indisponibilidades de serviços.
  - Aconselhar lideranças sobre como comunicar mudanças e mensagens difíceis.
  - Supervisionar profissionais de comunicação.
  qualifications:
  - Graduação ou qualificação profissional em comunicação, ou experiência equivalente.
  - Experiência no planejamento e na avaliação de campanhas.
- title: Gerente de comunicação
  summary: Gere o trabalho e os canais da equipe de comunicação e lidera o tratamento da imprensa e a comunicação de incidentes.
  responsibilities:
  - Gerir a equipe de comunicação, seu plano de trabalho e seu orçamento.
  - Liderar o trabalho reativo e proativo com a imprensa, inclusive durante incidentes e violações de dados.
  - Gerir os canais, a marca e os padrões de conteúdo da organização.
  - Aconselhar diretorias sobre comunicação e riscos de reputação.
  - Avaliar a comunicação e reportar seu efeito.
  - Trabalhar com organizações parceiras em comunicações conjuntas.
  qualifications:
  - Uma qualificação profissional em comunicação, ou experiência equivalente.
  - Experiência substancial em relações com a imprensa e na gestão de comunicação.
  job_evaluation_notes: O esforço emocional reflete o tratamento ocasional de material aflitivo durante incidentes e em histórias de pacientes.
- title: Chefia de comunicação
  summary: Lidera a comunicação e o engajamento da organização, define sua estratégia e aconselha o conselho de administração sobre reputação.
  responsibilities:
  - Definir a estratégia de comunicação e de engajamento da organização.
  - Liderar e desenvolver a função de comunicação e gerir seu orçamento.
  - Aconselhar a presidência executiva e o conselho de administração sobre reputação, relacionamento com as partes interessadas e risco de comunicação.
  - Liderar a comunicação em crises durante grandes incidentes.
  - Construir relacionamentos com parceiros sêniores, jornalistas e grupos de pacientes.
  - Dar forma à maneira como a organização explica ao público seus serviços digitais e o uso que faz dos dados.
  qualifications:
  - Uma qualificação profissional em comunicação, ou experiência equivalente.
  - Ampla experiência na liderança da comunicação de uma organização complexa.
