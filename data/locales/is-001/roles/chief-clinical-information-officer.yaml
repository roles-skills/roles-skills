summary: Yfirmaður klínískra upplýsinga (CCIO) er æðsti klíníski leiðtogi stafrænna mála. Hann mótar klíníska stefnu stafrænnar þjónustu stofnunarinnar, stýrir klínískri upplýsingafræði og klínísku öryggi og tryggir að stafræn fjárfesting bæti umönnun og öryggi sjúklinga og vinnulíf klínísks starfsfólks og umönnunarstarfsfólks. Hann er yfirleitt starfandi klínískur starfsmaður sem situr í framkvæmdastjórn eða ráðleggur henni.
health_context:
- CCIO færir ákvörðunum um stafræn mál klínískan trúverðugleika, svo flest störf krefjast skráðs klínísks starfsmanns sem sinnir enn einhverju klínísku starfi.
- Hann er æðsta röddin fyrir öryggi sjúklinga í stafrænni þjónustu, og vinnur með yfirmanni klínísks öryggis og leiðtogum lækninga og hjúkrunar.
- Hann leiðir klínískt starfsfólk gegnum umfangsmiklar breytingar, svo sem endurnýjun rafrænnar sjúkraskrár, þar sem upptaka og öryggi velta á klínískri forystu.
- Hann hjálpar til við að vega stafrænan metnað á móti raunveruleika klínísks vinnuálags, mönnunar og áhættu.
levels:
- title: Aðstoðaryfirmaður klínískra upplýsinga
  summary: Stýrir stórum hlutum klínískrar stafrænnar áætlunar fyrir hönd CCIO, svo sem umönnunarumhverfi, fagstétt eða stórri áætlun um klínískt kerfi, og er staðgengill CCIO.
  responsibilities:
  - Stýra klínískri stefnu fyrir stóra áætlun, umönnunarumhverfi eða fagstétt.
  - Stýra teymi klínískra upplýsingafræðinga og klínískra leiðtoga og setja forgangsröðun og staðla.
  - Ráðleggja áætlunarstjórnum og framkvæmdastjórn um klíníska áhættu og ávinning stafrænnar fjárfestingar.
  - Stýra klínískum hönnunar- og öryggishópum og taka klínískar ákvarðanir innan framseldrar heimildar.
  - Byggja upp net klínískra talsmanna og stýra klínískri þátttöku í umfangsmiklum breytingum.
  - Vera staðgengill CCIO á framkvæmdafundum og gagnvart samstarfsstofnunum.
  qualifications:
  - Gild skráning hjá klínískri fagstofnun, með mikla klíníska reynslu og reynslu af klínískri forystu.
  - Meistaragráða í klínískri upplýsingafræði eða heilbrigðisupplýsingafræði eða forystu, eða sambærileg reynsla af forystu í klínískum stafrænum breytingum.
  job_evaluation_notes: Umönnun sjúklinga er metin á stigi 6 fyrir mjög sérhæfða ráðgjöf um umönnun sjúklinga þvert á stafræna þjónustu stofnunarinnar.
- title: Yfirmaður klínískra upplýsinga
  summary: Æðsti klíníski leiðtogi stofnunarinnar í stafrænum málum, ábyrgur fyrir klínískri stefnu stafrænnar þjónustu hennar og fyrir því að stýra klínískri upplýsingafræði, með áhrif á klínískt öryggi á vettvangi stofnunarinnar.
  responsibilities:
  - Móta klíníska stafræna stefnu og tryggja að hún styðji klíníska stefnu og umönnunarstefnu stofnunarinnar.
  - Ráðleggja stjórn og framkvæmdastjórn um klíníska áhættu, ávinning og forgangsröðun stafrænnar fjárfestingar.
  - Stýra klínískri upplýsingafræði og klínískri hönnunarnefnd og hafa umsjón með klínísku öryggi heilbrigðisupplýsingatækni.
  - Leiða klíníska leiðtoga þvert á stofnunina og samstarfsaðila hennar gegnum umfangsmiklar stafrænar breytingar.
  - Tryggja að öryggi sjúklinga, klínískar sannanir og upplifun starfsfólks móti allar stórar ákvarðanir um stafræn mál.
  - Vera fulltrúi stofnunarinnar í faglegum, fræðilegum og þvert á stofnanir klínískum stafrænum netum.
  qualifications:
  - Gild skráning hjá klínískri fagstofnun, með mikla klíníska reynslu og reynslu af æðri forystu.
  - Umfangsmikil reynsla af forystu í klínískri stafrænni stefnu og breytingum á vettvangi stofnunar.
  job_evaluation_notes: Umönnun sjúklinga er metin á stigi 6 frekar en 7 því CCIO ráðleggur um klíníska þjónustu en ber yfirleitt ekki ábyrgð á að veita hana. Fjárhagsleg ábyrgð og ábyrgð á fólki er lægri en hjá öðrum framkvæmdahlutverkum því stórar stafrænar fjárhagsáætlanir og teymi heyra yfirleitt undir yfirmann stafrænna mála eða upplýsinga.
