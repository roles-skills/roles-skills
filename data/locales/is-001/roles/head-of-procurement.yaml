summary: Innkaupastjórinn og yfirstjórn viðskiptamála stýra því hvernig stofnunin kaupir vörur og þjónustu og stýrir birgjum sínum. Þeir móta innkaupastefnu og viðskiptastefnu, tryggja að útgjöld séu lögmæt og skili hagkvæmri nýtingu fjármuna og ráðleggja stjórn um viðskiptalega áhættu. Í stafrænni heilbrigðisstofnun veita þeir tæknisamningum og samningum um klínísk kerfi, seiglu birgja og útgöngu sérstaka athygli.
health_context:
- Stórir tæknisamningar og samningar um klínísk kerfi geta mótað þjónustu í áratug, svo viðskiptaleiðtogar skipuleggja samvirkni, færanleika og framtíðarsamkeppni frá byrjun.
- Mikilvægir birgjar styðja þjónustu sem er rekin allan sólarhringinn, svo brestur birgja og netatvik í aðfangakeðjunni eru áhætta á stjórnarstigi.
- Reglur um opinber innkaup gilda og stofnunin verður að geta varið innkaupaákvarðanir sínar ef þær eru véfengdar.
- Ætlast er til að stofnunin skili samfélagslegu virði og kolefnisminnkun með útgjöldum sínum.
- Viðskiptaleiðtogar vinna oft með öðrum heilbrigðis- og velferðarstofnunum að sameiginlegum innkaupum og sameiginlegum samningum.
levels:
- title: Innkaupastjóri
  summary: Stýrir innkaupasviðinu, setur innkaupaverklag og staðla og stýrir innkaupa- og kaupateymum.
  responsibilities:
  - Stýra og stjórna innkaupa- og kaupateymum.
  - Setja innkaupaverklag, sniðmát og viðmiðunarmörk stofnunarinnar, í samræmi við reglur um opinber innkaup og fjármálareglur.
  - Tryggja flóknustu og verðmætustu innkaupin og ákvarðanir um val.
  - Stýra innkaupaferlinum og tryggja að innkaup hefjist í tæka tíð.
  - Skila skýrslu um innkaupafylgni, sparnað og samfélagslegt virði til endurskoðunarnefndar.
  - Hafa fjárhagsáætlun innkaupateymisins á sinni könnu og þróa færni teymisins.
  qualifications:
  - Viðurkennd fagmenntun í innkaupum á hæsta stigi, eða meistaragráða í tengdri grein, eða sambærileg reynsla.
  - Umfangsmikil reynsla af forystu innkaupa samkvæmt reglum um opinber innkaup.
  job_evaluation_notes: Auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 8c. Stefna er á stigi 5 því starfið setur innkaupaverklag fyrir alla stofnunina, og svigrúm til athafna er á stigi 6 því það túlkar innkaupareglur og stefnu til að setja staðla stofnunarinnar. Fjárhagslegar auðlindir eru á stigi 5 því það stýrir því hvernig útgjöld eru keypt þvert á margar þjónustur; samskipti eru á stigi 6 fyrir umdeildar valákvarðanir og kærur.
- title: Viðskiptastjóri
  summary: Stýrir innkaupum, vöruflokkastjórnun og samningastjórnun saman sem einu viðskiptasviði og mótar viðskiptastefnuna.
  responsibilities:
  - Stýra viðskiptasviðinu, þar á meðal innkaupum, vöruflokkastjórnun og samningastjórnun.
  - Móta viðskiptastefnuna, þar á meðal nálgun við tækni- og skýjasamninga og innilokun.
  - Stýra samningaviðræðum við lykilbirgja, svo sem birgja klínískra kerfa og skýjaþjónustu.
  - Stýra viðbrögðum við bresti birgja og alvarlegum samningsdeilum.
  - Ráðleggja framkvæmdastjórum um viðskiptalega áhættu, hagkvæma nýtingu fjármuna og viðskiptarök stórra fjárfestinga.
  - Stýra samstarfi í viðskiptamálum við aðrar heilbrigðis- og velferðarstofnanir.
  qualifications:
  - Viðurkennd fagmenntun í innkaupum á hæsta stigi, eða meistaragráða í tengdri grein, eða sambærileg reynsla.
  - Umfangsmikil reynsla af forystu viðskiptasviða.
  job_evaluation_notes: Auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 8d. Þekking er á stigi 8 fyrir þekkingu þvert á innkaup, vöruflokkastjórnun, samningastjórnun og viðskiptarétt, og svigrúm til athafna er á stigi 6 því starfið mótar viðskiptastefnuna. Samskipti eru á stigi 6 fyrir samningaviðræður um mjög umdeild viðskiptamál við lykilbirgja.
- title: Framkvæmdastjóri innkaupa og viðskipta
  summary: Er æðsti viðskiptaleiðtogi stofnunarinnar, ábyrgur fyrir innkaupa- og viðskiptastefnu og ráðleggur stjórn um viðskiptastefnu og áhættu.
  responsibilities:
  - Móta innkaupa- og viðskiptastefnu og áætlun stofnunarinnar, samþykkta af stjórn.
  - Ráðleggja stjórn og framkvæmdastjórn um viðskiptastefnu, áhættu og stærstu samninga og fjárfestingar.
  - Tryggja fylgni stofnunarinnar við reglur um opinber innkaup og viðbúnað hennar til að verjast kærum.
  - Stýra framkvæmdatengslum við lykilbirgja og innkaupastofnanir hins opinbera.
  - Setja markmið um samfélagslegt virði og sjálfbær innkaup og skila skýrslu um árangur til stjórnar.
  - Stýra og þróa yfirstjórn viðskiptamála og viðskiptafærni stofnunarinnar.
  - Bera ábyrgð á viðskiptaskuldbindingum stofnunarinnar og samningasafni þvert á allar þjónustur.
  qualifications:
  - Viðurkennd fagmenntun í innkaupum á hæsta stigi, eða meistaragráða í tengdri grein, eða sambærileg reynsla.
  - Umfangsmikil reynsla af forystu viðskiptasviða á framkvæmdastigi.
  job_evaluation_notes: Auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 9. Stefna er á stigi 6 fyrir ábyrgð á vettvangi stofnunarinnar á innkaupa- og viðskiptastefnu, fjárhagslegar auðlindir eru á stigi 6 fyrir ábyrgð á vettvangi stofnunarinnar á viðskiptaskuldbindingum hennar, og svigrúm til athafna er á stigi 6 því starfið setur viðskiptamarkmið og staðla. Tilfinningalegt erfiði er á stigi 2 fyrir stöku útsetningu fyrir streituvaldandi deilum, brestum birgja og kærum.
