summary: Stjórnendur stafræns verkefnasafns hjálpa stofnuninni að velja, fylgjast með og stýra safni sínu af stafrænum verkefnum, áætlunum og vörum svo hún fjárfesti í því starfi sem gagnast sjúklingum, klínísku starfsfólki og umönnunarstarfsfólki mest. Þeir stýra stjórnarháttum og skýrslugjöf safnsins, hjálpa leiðtogum að forgangsraða með góðum gögnum og tryggja að safnið skili þeim ávinningi sem lofað var.
health_context:
- Stafræn vinna keppir um fjármagn við umönnun í fremstu víglínu, svo verkefnasafnsstjórar hjálpa leiðtogum að sýna ávinning stafrænnar fjárfestingar fyrir sjúklinga og starfsfólk.
- Stjórnarhættir verkefnasafns verða að fela í sér fullvissu í klínísku öryggi, upplýsingastjórnun og netöryggi, svo verkefnasafnsstjórar fylgjast með þessu samhliða tíma, kostnaði og umfangi.
- Mörg stafræn verkefni velta á getu klínískra teyma og rekstrarteyma, svo sem klínísku starfsfólki til að prófa eða starfsfólki til að þjálfa, svo verkefnasafnsstjórar fylgjast með árekstrum eftirspurnar á þjónustu.
- Fjármögnun kemur oft frá nokkrum uppsprettum með eigin skýrslureglur og fresti, svo verkefnasafnsstjórar halda skýrslugjöf nákvæmri og á réttum tíma.
levels:
- title: Greinandi stafræns verkefnasafns
  responsibilities:
  - Safna og athuga stöðu-, áhættu-, fjármála- og ávinningsgögn frá verkefnum þvert á safnið.
  - Viðhalda verkefnasafnsskránni og mælaborðum og koma auga á eyður eða ósamræmi í skýrslugjöf.
  - Undirbúa skjöl og skýrslur fyrir stjórnarhópa verkefnasafnsins.
  - Fylgjast með fullvissuáföngum, svo sem klínísku öryggissamþykki og persónuverndarmati, þvert á verkefni.
  - Styðja verkefnasafnsstjóra með greiningu á forgangsröðun og skipulagi.
  qualifications:
  - Háskólagráða eða viðeigandi menntun, eða sambærileg reynsla af greiningu eða skýrslugjöf.
  job_evaluation_notes: UK GDaD PCF setur bæði greinanda- og stjórnendastigið á HEO eða SEO. Þessi viðmiðun setur greinandann í launaflokk 5, því það er námsstig sem skilar skýrslu til verkefnasafnsstjóra, og stjórnandann í launaflokk 6, svo stigin tvö eru ekki í sama launaflokki.
- title: Stjórnandi stafræns verkefnasafns
  responsibilities:
  - Samræma safn stafrænna verkefna og áætlana, svo sem alla stafræna vinnu eins sviðs.
  - Hjálpa teymum að fylgja stjórnarháttum, fullvissu og afhendingarferlum og gera þau hófleg.
  - Styðja leiðtoga við að forgangsraða vinnu með gögnum um þörf, ávinning, áhættu og getu.
  - Skila skýrslu um frammistöðu, áhættu og ávinning verkefnasafnsins skýrt til stjórna og hagsmunaaðila.
  - Koma auga á árekstra eftirspurnar á klínísk teymi og rekstrarteymi þvert á verkefni og hjálpa til við að leysa þá.
  qualifications:
  - Reynsla af stjórnun verkefnasafns, áætlana eða verkefna, eða sambærileg reynsla.
- title: Eldri stjórnandi stafræns verkefnasafns
  responsibilities:
  - Stýra stafrænu verkefnasafni stofnunarinnar, eða stórum hluta þess, og stjórnarháttum þess og fullvissuferlum.
  - Fylgjast með og greina niðurstöður og ávinning þvert á safnið og bregðast við vandamálum til að hjálpa teymum að afhenda.
  - Tryggja að safnið uppfylli staðla, þar á meðal fullvissu í klínísku öryggi, upplýsingastjórnun og netöryggi.
  - Ráðleggja æðstu stjórnendum um forgangsröðun, fjárfestingar og málamiðlanir, með skýrum gögnum.
  - Stýra skýrslugjöf verkefnasafns til fjármögnunaraðila og ytri stofnana.
  - Vera línustjóri greinenda og stjórnenda verkefnasafns.
  qualifications:
  - Umfangsmikil reynsla af stjórnun verkefnasafns eða áætlana, á stigi sem jafngildir meistaragráðu.
  job_evaluation_notes: Ekkert stig er í launaflokki 7 því UK GDaD PCF færist frá stjórnanda stafræns verkefnasafns (HEO/SEO) til eldri stjórnanda stafræns verkefnasafns (G7).
- title: Yfirmaður stafræns verkefnasafns
  responsibilities:
  - Stýra sviði stafræns verkefnasafns og teymi verkefnasafnsstjóra.
  - Móta stefnu, stýringar og stjórnarhætti verkefnasafnsins og tryggja að þær séu notaðar.
  - Veita framkvæmdaleiðtogum innsýn í framtíð safnsins, svo þeir geti tekið fjárfestingarákvarðanir.
  - Tryggja að ávinningur safnsins fyrir sjúklinga, starfsfólk og stofnunina náist og sé skýrt frá honum.
  - Takast á við áhættu á vettvangi verkefnasafnsins og vísa vandamálum til framkvæmdastjórnar.
  - Stýra fjárhagsáætlun og getu sviðsins.
  qualifications:
  - Umfangsmikil reynsla af forystu í verkefnasafnsstjórnun í flókinni stofnun.
  job_evaluation_notes: Fjárhagslegar auðlindir eru metnar á stigi 5 því yfirmaður stafræns verkefnasafns hefur umsjón með fjárfestingum þvert á allt stafræna verkefnasafnið, sem nær yfir nokkrar þjónustur; upplýsingaauðlindir eru á stigi 6 því verkefnasafnsskráin og skýrslugjöf ná yfir alla stofnunina.
