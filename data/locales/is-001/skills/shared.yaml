      - mótað klíníska stefnu fyrir stafræna þjónustu stofnunarinnar
      - leitt klíníska leiðtoga þvert á stofnanir gegnum stafrænar breytingar
      - ráðlagt stjórn um klíníska áhættu og ávinning stafrænnar fjárfestingar
governance-and-compliance:
  name: Stjórnarhættir fyrirtækja og fylgni
  description: 'Að styðja stjórnarhætti stofnunarinnar: stjórnir, nefndir, fundarsköp, stefnur, yfirlýsingar um hagsmunatengsl og fylgni við lagalegar skyldur og regluverkskyldur.'
