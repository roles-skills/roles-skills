summary: 'Geschäftsarchitektinnen und -architekten schaffen ein klares, zusammenhängendes Bild davon, wie die Organisation Gesundheit und Pflege erbringt: ihre Fähigkeiten, Dienste, Versorgungspfade, Prozesse und Informationen. Sie nutzen dieses Bild, um zu zeigen, wo Veränderung nötig ist, um Strategie mit Programmen zu verbinden und sicherzustellen, dass digitaler Wandel die Versorgung der Patientinnen und Patienten und den Arbeitsalltag von klinischem Personal und Pflegepersonal verbessert.'
health_context:
- Versorgungspfade überschreiten Teams, Einrichtungen und Organisationen; deshalb modellieren Geschäftsarchitektinnen und -architekten Dienste aus Sicht der Patientin oder des Patienten und nicht nur nach Abteilungen.
- Veränderungen in klinischen Prozessen können Patientensicherheit und Arbeitsbelastung beeinträchtigen; deshalb werden Modelle mit klinischem Personal und Pflegepersonal erarbeitet und an der Praxis geprüft.
- Gesundheits- und Pflegestrategie wird von Politik, Regulierung und Finanzierungsregeln geprägt, die Architektinnen und Architekten in praktische Änderungen von Fähigkeiten übersetzen müssen.
- Viele Fähigkeiten werden mit Partnerorganisationen geteilt; deshalb helfen Architektinnen und Architekten zu vereinbaren, wer was tut und wo Informationen fließen müssen.
levels:
- title: Geschäftsarchitekt/in in Ausbildung
  responsibilities:
  - Methoden der Geschäftsarchitektur wie Fähigkeits-, Wertstrom- und Prozessmodellierung durch Schulung und Praxis lernen.
  - Informationen über Dienste und Versorgungspfade durch Interviews, Dokumente und Beobachtung zusammentragen.
  - Fähigkeitskarten und Prozessmodelle mit Anleitung von Geschäftsarchitektinnen und -architekten entwerfen.
  - Bei Workshops mit klinischem Personal, Pflegepersonal und Führungskräften helfen und die Ergebnisse aufschreiben.
  qualifications:
  - Ein Studienabschluss oder gleichwertige Erfahrung in Wirtschaft, Analyse oder einem verwandten Fach.
  - Spezialausbildung in Methoden der Geschäftsarchitektur, auf dem Niveau eines postgradualen Diploms oder gleichwertige Erfahrung.
  job_evaluation_notes: 'Höher eingeordnet als der Gruppenvorschlag des UK GDaD PCF (Entgeltgruppe 5): Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 6. Das Wissen wird auf der Stufe bewertet, die die Stelle verlangt, sobald die Ausbildung weit genug fortgeschritten ist, um die Arbeit zu leisten.'
- title: Associate Geschäftsarchitekt/in
  responsibilities:
  - Fähigkeiten, Dienste und Versorgungspfade für einen Teil der Organisation modellieren.
  - Modelle analysieren, um Lücken, Doppelungen und Schmerzpunkte für Patientinnen, Patienten und Mitarbeitende zu finden.
  - Informationen aus verschiedenen Teams und Organisationen zusammenführen, um Entscheidungen über Veränderungen zu untermauern.
  - Komplexe Probleme von Diensten Interessengruppen mit klaren Modellen und einfacher Sprache erklären.
  - Das Repository der Geschäftsarchitektur korrekt halten und mit Anwendungs- und Datenmodellen verknüpfen.
  qualifications:
  - Spezialwissen in Geschäftsarchitektur oder Business-Analyse, auf Masterniveau oder gleichwertige Erfahrung.
  - Erfahrung mit Business-Analyse oder Service-Design.
  job_evaluation_notes: 'Höher eingeordnet als der Gruppenvorschlag des UK GDaD PCF (Entgeltgruppe 6): Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 7. Das Wissen wird auf Masterniveau oder gleichwertig bewertet, weil die Stelle Dienste und Versorgungspfade über Teams und Organisationen hinweg modelliert und analysiert.'
- title: Geschäftsarchitekt/in
  responsibilities:
  - Aktuelle und angestrebte Geschäftsarchitekturen für einen großen Leistungsbereich entwickeln, etwa Akutversorgung oder Gemeindedienste.
  - Strategie und Politik in Änderungen der Fähigkeiten und eine Roadmap der Veränderung übersetzen.
  - Prüfen, ob der Umfang von Programmen und Projekten zur angestrebten Geschäftsarchitektur passt.
  - Mit klinischen Leitungen bewerten, wie vorgeschlagene Änderungen Versorgungspfade, Sicherheit und Arbeitsbelastung beeinflussen.
  - Andere Geschäftsarchitektinnen und -architekten in Methoden und Werkzeugen anleiten.
  qualifications:
  - Umfangreiche Erfahrung in Geschäftsarchitektur, Business-Analyse oder Service-Design, auf einem Niveau, das einem Masterabschluss entspricht.
  job_evaluation_notes: 'Höher eingeordnet als der Gruppenvorschlag des UK GDaD PCF (Entgeltgruppe 7): Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 8a. Planung, Richtlinien und Handlungsfreiheit werden über dem Profil der Entgeltgruppe 7 bewertet, weil die Stelle Strategie in eine Roadmap der Veränderung für einen großen Leistungsbereich übersetzt.'
- title: Leitende/r Geschäftsarchitekt/in
  responsibilities:
  - Die Praxis der Geschäftsarchitektur leiten und für ihre Ergebnisse verantwortlich sein.
  - Die organisationsweite Sicht auf Fähigkeiten, Dienste und Versorgungspfade pflegen und leicht verständlich halten.
  - Direktorinnen und Direktoren zu den Prioritäten der Veränderung und dazu beraten, wie Investitionsportfolios zur Strategie passen.
  - Mit Partnerorganisationen gemeinsame Fähigkeiten und Zuständigkeiten über Versorgungspfade hinweg vereinbaren.
  - Geschäftsarchitektinnen und -architekten führen und entwickeln.
  qualifications:
  - Umfassende Erfahrung in der Leitung von Geschäftsarchitektur in einer komplexen Organisation.
