summary: Die Leitung Einkauf und das Führungsteam Handel leiten, wie die Organisation Waren und Dienstleistungen kauft und ihre Anbieter steuert. Sie legen Einkaufsrichtlinie und Handelsstrategie fest, stellen sicher, dass Ausgaben rechtmäßig sind und ein gutes Preis-Leistungs-Verhältnis bieten, und beraten den Vorstand zum kommerziellen Risiko. In einer Organisation für digitale Gesundheit und Pflege widmen sie Technologie- und Verträgen über klinische Systeme, der Resilienz von Anbietern und dem Ausstieg besondere Aufmerksamkeit.
health_context:
- Große Technologie- und Verträge über klinische Systeme können Dienste ein Jahrzehnt prägen; Handelsleitungen planen daher von Anfang an Interoperabilität, Portabilität und künftigen Wettbewerb.
- Kritische Anbieter stützen Dienste, die rund um die Uhr laufen; Ausfälle von Anbietern und Cybervorfälle in der Lieferkette sind daher Risiken auf Vorstandsebene.
- Das öffentliche Vergaberecht gilt, und die Organisation muss ihre Vergabeentscheidungen verteidigen können, wenn sie angefochten werden.
- Von der Organisation wird erwartet, dass sie mit ihren Ausgaben gesellschaftlichen Mehrwert und Kohlenstoffminderung erbringt.
- Handelsleitungen arbeiten oft mit anderen Gesundheits- und Pflegeorganisationen an gemeinsamem Einkauf und gemeinsamen Verträgen.
levels:
- title: Leiter/in Einkauf
  summary: Leitet die Einkaufsfunktion, legt Einkaufsverfahren und -standards fest und führt die Einkaufs- und Beschaffungsteams.
  responsibilities:
  - Die Einkaufs- und Beschaffungsteams führen und steuern.
  - Die Einkaufsverfahren, Vorlagen und Schwellenwerte der Organisation im Einklang mit dem Vergaberecht und den Finanzregeln festlegen.
  - Die komplexesten und wertvollsten Beschaffungen und deren Zuschlagsentscheidungen absichern.
  - Die Beschaffungspipeline steuern und sicherstellen, dass Beschaffungen rechtzeitig beginnen.
  - Dem Prüfungsausschuss über Einkaufs-Compliance, Einsparungen und gesellschaftlichen Mehrwert berichten.
  - Das Budget des Einkaufsteams verantworten und die Fähigkeiten des Teams entwickeln.
  qualifications:
  - Eine anerkannte berufliche Einkaufsqualifikation auf höchstem Niveau oder ein Masterabschluss in einem verwandten Fach oder gleichwertige Erfahrung.
  - Umfassende Erfahrung in der Leitung des Einkaufs nach dem Vergaberecht.
  job_evaluation_notes: Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 8c. Richtlinien liegen auf Stufe 5, weil die Stelle Einkaufsverfahren für die gesamte Organisation festlegt, und die Handlungsfreiheit liegt auf Stufe 6, weil sie Einkaufsregeln und -strategie auslegt, um die Standards der Organisation zu setzen. Die finanziellen Ressourcen liegen auf Stufe 5, weil sie steuert, wie Ausgaben über viele Dienste hinweg beschafft werden; die Kommunikation liegt auf Stufe 6 für umstrittene Zuschlagsentscheidungen und Rügen.
- title: Leiter/in Handel
  summary: Leitet Einkauf, Kategoriemanagement und Vertragsmanagement gemeinsam als eine Handelsfunktion und legt die Handelsstrategie fest.
  responsibilities:
  - Die Handelsfunktion leiten, einschließlich Einkauf, Kategoriemanagement und Vertragsmanagement.
  - Die Handelsstrategie festlegen, einschließlich des Ansatzes zu Technologie- und Cloud-Verträgen und Abhängigkeit.
  - Verhandlungen mit strategischen Anbietern wie Anbietern klinischer Systeme und Cloud-Anbietern leiten.
  - Die Reaktion auf den Ausfall von Anbietern und schwere Vertragsstreitigkeiten leiten.
  - Geschäftsleitungsmitglieder zu kommerziellem Risiko, Preis-Leistungs-Verhältnis und der Wirtschaftlichkeitsbetrachtung großer Investitionen beraten.
  - Gemeinsame Handelsarbeit mit anderen Gesundheits- und Pflegeorganisationen leiten.
  qualifications:
  - Eine anerkannte berufliche Einkaufsqualifikation auf höchstem Niveau oder ein Masterabschluss in einem verwandten Fach oder gleichwertige Erfahrung.
  - Umfassende Erfahrung in der Leitung von Handelsfunktionen.
  job_evaluation_notes: Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 8d. Das Wissen liegt auf Stufe 8 für Wissen über Einkauf, Kategoriemanagement, Vertragsmanagement und Handelsrecht, und die Handlungsfreiheit liegt auf Stufe 6, weil die Stelle die Handelsstrategie festlegt. Die Kommunikation liegt auf Stufe 6 für Verhandlungen über stark umstrittene Handelsangelegenheiten mit strategischen Anbietern.
- title: Direktor/in Einkauf und Handel
  summary: Ist die oberste Handelsführungskraft der Organisation, verantwortlich für Einkaufs- und Handelsrichtlinie, und berät den Vorstand zu Handelsstrategie und Risiko.
  responsibilities:
  - Die Einkaufs- und Handelsrichtlinie und -strategie der Organisation festlegen, vom Vorstand genehmigt.
  - Vorstand und Geschäftsleitung zu Handelsstrategie, Risiko und den größten Verträgen und Investitionen beraten.
  - Die Einhaltung des Vergaberechts durch die Organisation und ihre Bereitschaft zur Verteidigung gegen Rügen absichern.
  - Die Beziehungen der Geschäftsleitung zu strategischen Anbietern und Einkaufsorganisationen des öffentlichen Sektors leiten.
  - Ziele für gesellschaftlichen Mehrwert und nachhaltige Beschaffung setzen und dem Vorstand über Ergebnisse berichten.
  - Das Führungsteam Handel und die Handelskompetenzen der Organisation führen und entwickeln.
  - Für die kommerziellen Verpflichtungen der Organisation und das Vertragsportfolio über alle Dienste hinweg verantwortlich sein.
  qualifications:
  - Eine anerkannte berufliche Einkaufsqualifikation auf höchstem Niveau oder ein Masterabschluss in einem verwandten Fach oder gleichwertige Erfahrung.
  - Umfassende Erfahrung in der Leitung von Handelsfunktionen auf Geschäftsleitungsebene.
  job_evaluation_notes: Anzeigen im Gesundheitssektor verorten diese Rolle in Entgeltgruppe 9. Richtlinien liegen auf Stufe 6 für die unternehmensweite Verantwortung für Einkaufs- und Handelsrichtlinie, finanzielle Ressourcen auf Stufe 6 für die unternehmensweite Verantwortung für die kommerziellen Verpflichtungen der Organisation, und die Handlungsfreiheit liegt auf Stufe 6, weil die Stelle Handelsziele und -standards setzt. Die emotionale Anstrengung liegt auf Stufe 2 für gelegentliche Konfrontation mit belastenden Streitigkeiten, Anbieterausfällen und Rügen.
