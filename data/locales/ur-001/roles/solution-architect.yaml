summary: حل کے آرکیٹیکٹ ڈیزائن کرتے ہیں کہ کوئی نئی یا تبدیل شدہ خدمت شروع سے آخر تک کیسے کام کرے گی، صارفین کی ضروریات اور طبی کام کے بہاؤ سے لے کر ایپلیکیشنز، ڈیٹا، انضمام، ہوسٹنگ اور سلامتی تک۔ وہ یقینی بناتے ہیں کہ ہر حل ادارے کے فنِ تعمیر کے مطابق ہو، اس کی حفاظت، رازداری اور باہمی مطابقت کی ضروریات پوری کرے، اور اسے سستے طریقے سے بنایا، چلایا اور اس کی معاونت کی جا سکے۔
health_context:
- حل اکثر خریدے گئے طبی نظاموں، اندرونی خدمات اور مشترکہ پلیٹ فارموں کو ملاتے ہیں، اس لیے معماروں کو سپلائرز کی حدود کے پار ڈیزائن کرنا ہوتا ہے۔
- ڈیزائن کے انتخاب طبی خطرات پیدا کر سکتے ہیں، جیسے گم شدہ نتائج یا مریض کا غلط ملاپ، اس لیے حل کے ڈیزائن طبی حفاظت کے مقدمے میں شامل ہوتے ہیں۔
- مریضوں کی معلومات کے ہر نئے بہاؤ کو قانونی بنیاد اور ڈیٹا کے تحفظ کے اثرات کے جائزے کی ضرورت ہوتی ہے، اس لیے معمار معلومات کے نظم و ضبط کے ساتھ قریبی کام کرتے ہیں۔
- HL7 FHIR جیسے معیارات استعمال کرتے ہوئے صحت اور نگہداشت کے دیگر اداروں کے ساتھ باہمی مطابقت عموماً بنیادی تقاضا ہوتی ہے۔
- کچھ حلوں میں ایسا سافٹ ویئر شامل ہوتا ہے جو طبی آلہ ہے، جو ڈیزائن، یقین دہانی اور سپلائر کے تقاضوں کو بدل دیتا ہے۔
levels:
- title: ایسوسی ایٹ حل کا آرکیٹیکٹ
  responsibilities:
  - حل کے ڈیزائن کو باخبر کرنے کے لیے مصنوعات کی ٹیموں، معالجین اور سپلائرز سے تقاضے جمع کرنا۔
  - موجودہ اور ہدفی حالت کے خاکے بنانا، جیسے سیاق و سباق، ڈیٹا کا بہاؤ اور انضمام کے نقطۂ نظر۔
  - نگرانی میں حل کے ڈیزائن اور فیصلوں کے ریکارڈ کے حصوں کا مسودہ بنانا۔
  - ڈیزائن کو فنِ تعمیر کے معیارات، سلامتی اور معلومات کے نظم و ضبط کے تقاضوں کے مقابلے میں جانچنا۔
  - ڈیزائن کے اختیار والے اداروں میں جائزے کے لیے ڈیزائن تیار کرنے میں مدد دینا۔
  qualifications:
  - حل کے ڈیزائن کا ماہرانہ علم، ماسٹرز کی سطح پر یا اس کے برابر تجربہ۔
  - تجزیے، ترقی یا تکنیکی ڈیزائن کا تجربہ۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 6) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 7 میں رکھتے ہیں۔ علم کو ماسٹرز کی سطح یا اس کے برابر پر جانچا گیا ہے کیونکہ یہ کام ایپلیکیشنز، ڈیٹا، انضمام اور سلامتی میں ڈیزائن کرتا ہے۔"
- title: حل کا آرکیٹیکٹ
  responsibilities:
  - کم خطرے والی خدمات، جیسے عملے کے آلات یا مریضوں کے لیے سادہ خدمات، کے لیے شروع سے آخر تک حل ڈیزائن کرنا۔
  - متبادل کا موازنہ کرنا، بشمول خریدنا، بنانا اور مشترکہ پلیٹ فارموں کا دوبارہ استعمال، اور واضح وجوہات کے ساتھ ایک کی سفارش کرنا۔
  - جہاں کھلے معیارات موجود ہوں انہیں استعمال کرتے ہوئے حل کے لیے انضمام، ڈیٹا کے بہاؤ اور شناخت اور رسائی ڈیزائن کرنا۔
  - حل کے لیے خطرات کی نشاندہی اور ڈیٹا کے تحفظ کے اثرات کے جائزوں میں حصہ ڈالنا۔
  - ڈیزائن کے اختیار والے اداروں کو ڈیزائن پیش کرنا اور فراہمی کی ٹیموں کی تعمیر سے لے کر شروعات تک معاونت کرنا۔
  - ایسوسی ایٹ حل کے معماروں کی تربیت کرنا اور ان کے کام کا جائزہ لینا۔
  qualifications:
  - حل کے ڈیزائن یا سافٹ ویئر انجینئرنگ کا خاطر خواہ تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 7) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 8a میں رکھتے ہیں۔ منصوبہ بندی، پالیسی اور عمل کی آزادی کو درجہ 7 کے خاکے سے اوپر جانچا گیا ہے کیونکہ یہ کام شروع سے آخر تک ڈیزائن کا مالک ہے اور ڈیزائن کے اختیار والے اداروں کو متبادل کی سفارش کرتا ہے۔"
- title: سینئر حل کا آرکیٹیکٹ
  responsibilities:
  - درمیانے خطرے کے پیچیدہ حل ڈیزائن کرنا، جیسے طبی نظام یا کئی اداروں میں استعمال ہونے والی خدمات۔
  - خریداریوں میں سپلائرز کی مصنوعات کی تکنیکی جانچ کی قیادت کرنا، بشمول باہمی مطابقت، سلامتی اور حفاظت۔
  - جہاں حل چوبیس گھنٹے نگہداشت کی معاونت کرتا ہو وہاں لچک اور کاروبار کے تسلسل کے لیے ڈیزائن کرنا۔
  - طبی حفاظت کے افسروں کے ساتھ کام کرنا تاکہ ڈیزائن کے فیصلے اور خطرے کے کنٹرول حفاظتی مقدمے میں درج ہوں۔
  - دوسرے حل کے معماروں کی تربیت کرنا اور ان کے کام کا جائزہ لینا۔
  qualifications:
  - کئی شعبوں میں پیچیدہ حل ڈیزائن کرنے کا وسیع تجربہ، جو ماسٹرز کی ڈگری سے بلند سطح کا ہو۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 8a) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 8b میں رکھتے ہیں۔ علم سطح 8 پر جانچا گیا ہے کیونکہ یہ کام کئی شعبوں میں ماہرانہ علم کا تقاضا کرتا ہے، جیسے ایپلیکیشنز، ڈیٹا، انضمام، سلامتی اور طبی حفاظت۔"
- title: لیڈ حل کا آرکیٹیکٹ
  responsibilities:
  - کسی پروگرام یا پیچیدہ شعبے، جیسے برقی مریض ریکارڈ کی تبدیلی، کے لیے حل کے فنِ تعمیر کی قیادت کرنا۔
  - یقینی بنانا کہ پروگرام بھر کے حل یکساں، باہم مطابق اور ہدفی فنِ تعمیر کے ساتھ ہم آہنگ ہوں۔
  - پروگرام کے بورڈوں کو ڈیزائن کے خطرات، انحصار، سپلائرز کے انتخاب اور لاگتوں پر مشورہ دینا۔
  - ڈیزائن کے اختیار والے اداروں میں دوسرے حل کے معماروں کے ڈیزائن کی یقین دہانی کرنا۔
  - حل کے معماروں کی ٹیم کی قیادت کرنا اور اسے ترقی دینا۔
  qualifications:
  - پیچیدہ پروگراموں کے لیے حل کے فنِ تعمیر کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 8b) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 8c میں رکھتے ہیں۔ منصوبہ بندی، پالیسی اور افراد کو درجہ 8b کے خاکے سے اوپر جانچا گیا ہے کیونکہ یہ کام پورے پروگرام کے فنِ تعمیر کی منصوبہ بندی کرتا ہے اور حل کے معماروں کی ٹیم کی قیادت کرتا ہے۔"
- title: پرنسپل حل کا آرکیٹیکٹ
  responsibilities:
  - ادارے کے سب سے بڑے یا سب سے اہم پروگراموں کے لیے حل کے فنِ تعمیر کی قیادت کرنا۔
  - ادارے کے لیے حل کے فنِ تعمیر کے معیارات، نمونے اور طریقے طے کرنا۔
  - ڈائریکٹروں اور شراکت دار اداروں کو اہم، مشترکہ صحت اور نگہداشت کی خدمات کے ڈیزائن پر مشورہ دینا۔
  - پروگراموں، سپلائرز اور شراکت دار اداروں کے درمیان ڈیزائن کے مشکل ترین تنازعات حل کرنا۔
  - حل کے فنِ تعمیر کی مشق کی قیادت کرنا اور اس کے افراد کو ترقی دینا۔
  qualifications:
  - متعدد پروگراموں یا اداروں میں حل کے فنِ تعمیر کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 8c) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 8d میں رکھتے ہیں۔ عمل کی آزادی سطح 6 ہے کیونکہ یہ کام ادارے کے حل کے فنِ تعمیر کے معیارات طے کرتا ہے؛ مالی وسائل اور افراد سطح 4 ہیں کیونکہ یہ مشق اور اس کے بجٹ کی قیادت کرتا ہے۔"
