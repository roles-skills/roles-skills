summary: بنیادی ڈھانچے کے انجینئر وہ نیٹ ورک، سرور، اسٹوریج، کلاؤڈ پلیٹ فارم اور ہوسٹنگ ڈیزائن کرتے، بناتے، چلاتے اور ان کی معاونت کرتے ہیں جن پر ادارے کی ڈیجیٹل خدمات منحصر ہیں۔ وہ اس بنیادی ڈھانچے کو دستیاب، محفوظ اور قابلِ بحالی رکھتے ہیں، اور سپلائرز اور معماروں کے ساتھ مل کر اسے محفوظ طریقے سے بدلتے ہیں۔ صحت کی نگہداشت میں ایک بنیادی ڈھانچے کی ناکامی ہسپتالوں اور کمیونٹی کی خدمات میں طبی نظاموں کو ایک ساتھ روک سکتی ہے۔
health_context:
- طبی نظاموں کو بہت اعلیٰ دستیابی کی ضرورت ہوتی ہے، اس لیے بنیادی ڈھانچہ لچک کے لیے ڈیزائن کیا جاتا ہے اور تبدیلیوں کی منصوبہ بندی طبی سرگرمی کے گرد کی جاتی ہے۔
- انجینئر ضرورت پر دستیابی کے نظام الاوقات میں شریک ہوتے ہیں، کیونکہ رات یا ہفتے کے آخر میں بنیادی ڈھانچے کی خرابیاں مریضوں کی نگہداشت روک سکتی ہیں۔
- نیٹ ورک طبی آلات کو جوڑتے ہیں، جیسے انفیوژن پمپ، مریض کے مانیٹر اور امیجنگ کا سازوسامان، جنہیں IEC 80001-1 کے مطابق نیٹ ورک کی تقسیم اور احتیاط سے تبدیلی کی ضرورت ہے۔
- صحت کی نگہداشت رینسم ویئر کا بار بار ہدف ہے، اس لیے بیک اپ کو محفوظ، جانچا ہوا اور طے شدہ بحالی کے اوقات کے اندر بحال کرنے کے قابل ہونا چاہیے۔
- بنیادی ڈھانچے میں اکثر پرانی اور نئی ٹیکنالوجی ملی ہوتی ہے، بشمول پرانے طبی نظام جن میں آسانی سے پیچ نہیں لگایا جا سکتا، اس لیے انجینئر تلافی کنٹرول لگاتے ہیں۔
levels:
- title: ایسوسی ایٹ بنیادی ڈھانچے کا انجینئر
  responsibilities:
  - بنیادی ڈھانچے کے انجینئروں کی معمول کے کاموں میں معاونت کرنا، جیسے سرور کی تعمیر، بیک اپ کی جانچ اور نیٹ ورک کی تبدیلیاں۔
  - بنیادی ڈھانچے کی نگرانی کرنا اور انتباہات اور خرابیوں کی درست ٹیم کو اطلاع دینا۔
  - تمام کام میں تبدیلی، سلامتی اور معلومات کے نظم و ضبط کے طریقۂ کار کی پیروی کرنا۔
  - ترتیب اور اثاثوں کی تفصیلات درستی سے درج کرنا۔
  - بنیادی ڈھانچے کی اپرنٹس شپ یا اس کے برابر قابلیت کی طرف کام کرنا۔
  qualifications:
  - بنیادی ڈھانچے یا نیٹ ورکنگ کی اپرنٹس شپ یا اس کے برابر میں داخل یا اس کی طرف کام کرتا ہوا۔
  job_evaluation_notes: علم کو اس سطح پر جانچا گیا ہے جو تربیت کے اتنا مکمل ہو جانے کے بعد کام کے لیے درکار ہے کہ کام کیا جا سکے۔
- title: بنیادی ڈھانچے کا انجینئر
  responsibilities:
  - وہ سرور، اسٹوریج، نیٹ ورک اور کلاؤڈ خدمات بنانا، ترتیب دینا اور برقرار رکھنا جو طبی اور کارپوریٹ نظاموں کی میزبانی کرتی ہیں۔
  - طبی نظاموں کو دستیاب رکھنے کی ضرورت کے مقابلے میں سلامتی کے خطرے کا توازن رکھتے ہوئے بنیادی ڈھانچے میں فوری پیچ لگانا۔
  - بیک اپ اور بحالی چلانا اور جانچنا، بشمول اہم طبی نظاموں کے لیے۔
  - طبی انجینئرنگ کی ٹیموں کے ساتھ کام کرتے ہوئے طبی آلات اور دیگر طبی سازوسامان کے لیے تقسیم شدہ نیٹ ورکوں کی معاونت کرنا۔
  - بنیادی ڈھانچے کی خرابیوں کی تحقیقات کرنا اور انہیں درست کرنا، بشمول ضرورت پر دستیابی کے نظام الاوقات کے حصے کے طور پر۔
  - اسکرپٹس اور کوڈ کے طور پر بنیادی ڈھانچے کے ذریعے معمول کے کاموں کو خودکار بنانا۔
  qualifications:
  - کمپیوٹنگ یا متعلقہ مضمون میں ڈگری، متعلقہ تکنیکی اسناد، یا اس کے برابر تجربہ۔
  - پیداواری بنیادی ڈھانچے کی معاونت کا تجربہ۔
  job_evaluation_notes: ذہنی مشقت ناقابلِ پیش گوئی خرابیوں پر بار بار طویل ارتکاز کی عکاسی کرتی ہے، بشمول دفتری اوقات کے بعد ضرورت پر دستیابی کا کام۔
- title: سینئر بنیادی ڈھانچے کا انجینئر
  responsibilities:
  - معماروں کے ڈیزائن سے بنیادی ڈھانچے کے حل ڈیزائن اور تعمیر کرنا، اس لچک کے ساتھ جو طبی خدمات کو درکار ہے۔
  - طبی سرگرمی کے گرد بنیادی ڈھانچے کی بڑی تبدیلیوں کی منصوبہ بندی کرنا اور ان کی قیادت کرنا، جیسے ڈیٹا سینٹر کی منتقلی، نیٹ ورک کی تجدید اور کلاؤڈ پر منتقلی۔
  - اہم طبی نظاموں کے لیے آفت سے بحالی اور رینسم ویئر سے بحالی ڈیزائن کرنا اور جانچنا۔
  - بنیادی ڈھانچے کے واقعات کے تکنیکی ردعمل کی قیادت کرنا اور ان کی وجوہات کی اصلاح کو آگے بڑھانا۔
  - ان پرانے نظاموں اور طبی آلات کے لیے تلافی کنٹرول کا انتظام کرنا جن میں پیچ نہیں لگایا جا سکتا۔
  - بنیادی ڈھانچے کے انجینئروں کی قیادت کرنا اور ان کی تربیت کرنا۔
  qualifications:
  - پیداواری بنیادی ڈھانچہ ڈیزائن کرنے اور چلانے کا خاطر خواہ تجربہ، جو پوسٹ گریجویٹ ڈپلومہ کے برابر سطح کا ہو۔
  job_evaluation_notes: ذہنی مشقت واقعات اور پیچیدہ تبدیلیوں کے دوران، بشمول دفتری اوقات کے بعد، بار بار طویل ارتکاز کی عکاسی کرتی ہے۔
- title: لیڈ بنیادی ڈھانچے کا انجینئر
  responsibilities:
  - کسی بڑے پلیٹ فارم یا خدمات کے گروہ کے بنیادی ڈھانچے کی قیادت کرنا اور اس کی تکنیکی سمت طے کرنا۔
  - تیسرے فریق کے بنیادی ڈھانچے کے سپلائرز کا انتظام کرنا اور دستیابی اور بحالی کے لیے انہیں خدمت کی سطحوں کا پابند رکھنا۔
  - بنیادی ڈھانچے کے پروگراموں کی نگرانی کرنا، جیسے نیٹ ورک کی تجدید یا کلاؤڈ ہوسٹنگ پر منتقلی۔
  - یقینی بنانا کہ بنیادی ڈھانچہ سلامتی، معلومات کے نظم و ضبط اور طبی آلات کے نیٹ ورک کے معیارات پر پورا اترے۔
  - بنیادی ڈھانچے کی ٹیموں کی قیادت کرنا اور ان کی مہارتیں بڑھانا۔
  qualifications:
  - پیچیدہ، اعلیٰ دستیابی کی خدمات کے لیے بنیادی ڈھانچے کی انجینئرنگ کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: UK GDaD PCF لیڈ اور پرنسپل بنیادی ڈھانچے کے انجینئر دونوں کے لیے درجہ 8b تجویز کرتا ہے۔ یہ حوالہ لیڈ کو درجہ 8a میں رکھتا ہے، تاکہ دونوں سطحیں الگ درجوں میں ہوں، دوسرے تکنیکی خاندانوں کے لیڈ اور پرنسپل کرداروں کے مطابق۔
- title: پرنسپل بنیادی ڈھانچے کا انجینئر
  responsibilities:
  - بنیادی ڈھانچے کی حکمتِ عملی اور روڈ میپ تیار کرنا تاکہ سرمایہ کاری طبی خدمات کے لیے لچکدار، محفوظ اور پائیدار ہوسٹنگ فراہم کرے۔
  - حکمتِ عملی کے بنیادی ڈھانچے اور نیٹ ورک کے سپلائرز کے ساتھ آپریشنل تعلقات کا مالک ہونا۔
  - سینئر رہنماؤں کو بنیادی ڈھانچے کے خطرے پر مشورہ دینا، بشمول زندگی کے اختتام کی ٹیکنالوجی، ناکامی کے واحد مقامات اور سائبر لچک۔
  - خدمت کے مالکان کے ساتھ طبی نظاموں کے لیے بحالی کے وقت اور بحالی کے نقطے کے اہداف طے کرنا، اور یقینی بنانا کہ بنیادی ڈھانچہ انہیں پورا کر سکے۔
  - پورے ادارے میں بنیادی ڈھانچے کی انجینئرنگ کے پیشے کی قیادت کرنا اور اس کی صلاحیت بڑھانا۔
  qualifications:
  - متعدد ٹیموں یا اداروں میں بنیادی ڈھانچے کی انجینئرنگ کی قیادت کا وسیع تجربہ۔
