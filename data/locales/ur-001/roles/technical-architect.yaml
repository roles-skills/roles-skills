summary: "تکنیکی آرکیٹیکٹ ادارے کی ڈیجیٹل صحت کی خدمات کا تکنیکی ڈھانچہ ڈیزائن کرتے ہیں، یعنی اجزا، پلیٹ فارم، ہوسٹنگ، انضمام کے نمونے، اور غیر عملی خصوصیات جیسے سلامتی، کارکردگی اور لچک۔ وہ ڈیولپروں اور ڈیو آپس انجینئروں کے ساتھ قریبی کام کرتے ہیں، فراہمی کی ٹیموں کو تکنیکی قیادت دیتے ہیں، اور یقینی بناتے ہیں کہ خدمات دیرپا بنائی جائیں اور انہیں چلانا محفوظ ہو۔"
health_context:
- طبی خدمات کو اکثر اعلیٰ دستیابی اور تیز بحالی کی ضرورت ہوتی ہے، اس لیے تکنیکی ڈیزائن میں ناکامی اور کم کارکردگی کے ساتھ چلنے کی منصوبہ بندی ہونی چاہیے۔
- ڈیزائن کو پہلے سے طے شدہ طور پر خفیہ کاری، رسائی کے کنٹرول اور آڈٹ کے ذریعے رازدارانہ صحت کی معلومات کی حفاظت کرنی چاہیے۔
- خدمات اکثر HL7 FHIR APIs اور پیغام رسانی کے ذریعے بہت سے طبی نظاموں اور مشترکہ پلیٹ فارموں سے جڑتی ہیں، اس لیے انضمام کے نمونے ڈیزائن کا مرکز ہیں۔
- کیشنگ، دوبارہ کوشش اور وقت کے سنبھالنے جیسے تکنیکی ڈیزائن کے انتخاب طبی خطرات پیدا کر سکتے ہیں، اس لیے معمار حفاظتی مقدموں میں حصہ ڈالتے ہیں۔
- پرانے طبی نظام اور طبی آلات ٹیکنالوجی، نیٹ ورکنگ اور ہوسٹنگ کے انتخاب کو محدود کر سکتے ہیں۔
levels:
- title: ایسوسی ایٹ تکنیکی آرکیٹیکٹ
  responsibilities:
  - تکنیکی خاکے بنانا اور موجودہ خدمات کے اجزا، ہوسٹنگ اور انضمام کو دستاویز کرنا۔
  - رہنمائی کے ساتھ ٹیکنالوجی کے متبادل پر تحقیق کرنا اور ان کے فوائد اور نقصانات کا خلاصہ بنانا۔
  - ڈیولپروں کے ساتھ مل کر جانچنا کہ تعمیر طے شدہ ڈیزائن اور نمونوں کی پیروی کرتی ہے۔
  - تکنیکی فیصلے درج کرنا اور ڈیزائن کی دستاویزات کو تازہ رکھنا۔
  qualifications:
  - کمپیوٹنگ یا متعلقہ مضمون میں ڈگری، یا سافٹ ویئر یا بنیادی ڈھانچے کی انجینئرنگ کا برابر تجربہ۔
  - تکنیکی ڈیزائن کا ماہرانہ علم، پوسٹ گریجویٹ ڈپلومہ کی سطح پر یا اس کے برابر تجربہ۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 5) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 6 میں رکھتے ہیں۔ علم کو پوسٹ گریجویٹ ڈپلومہ کی سطح پر جانچا گیا ہے، اور معلومات کے وسائل کو سطح 5 پر کیونکہ یہ کام بڑے معلوماتی نظاموں کے حصے ڈیزائن کرتا ہے۔"
- title: تکنیکی آرکیٹیکٹ
  responsibilities:
  - کسی خدمت کا تکنیکی فنِ تعمیر ڈیزائن کرنا، بشمول اجزا، ہوسٹنگ، انضمام اور سلامتی۔
  - فراہمی کی ٹیموں کو ڈیزائن کے نمونے فراہم کرنا اور ان کے تکنیکی ڈیزائن اور کوڈ کے ڈھانچے کا جائزہ لینا۔
  - خدمت کے مالکان کے ساتھ غیر عملی تقاضے طے کرنا، جیسے دستیابی، کارکردگی اور بحالی کے اہداف۔
  - تکنیکی قرض اور غیر معاون ٹیکنالوجی کی نشاندہی کرنا، اور اسے درست کرنے کی منصوبہ بندی کرنا۔
  - طبی حفاظت کے مقدمے کے لیے تکنیکی خطرات اور کنٹرول کی نشاندہی کرنا۔
  qualifications:
  - تکنیکی فنِ تعمیر کا ماہرانہ علم، ماسٹرز کی سطح پر یا اس کے برابر تجربہ۔
  - پیداواری سافٹ ویئر یا بنیادی ڈھانچہ ڈیزائن کرنے یا بنانے کا تجربہ۔
  job_evaluation_notes: UK GDaD PCF کے گریڈ کی تجویز درجہ 7 کے مطابق درجہ بندی کی گئی ہے، جو اس کردار کے لیے صحت کے شعبے کے اشتہارات سے مطابقت رکھتی ہے۔ علم کو ماسٹرز کی سطح یا اس کے برابر پر جانچا گیا ہے کیونکہ یہ کام تکنیکی فنِ تعمیر کے پورے دائرے میں ماہرانہ علم کا تقاضا کرتا ہے۔
- title: سینئر تکنیکی آرکیٹیکٹ
  responsibilities:
  - بڑی، پیچیدہ یا زیادہ خطرے والی خدمات، جیسے طبی نظام اور مشترکہ انضمام کے پلیٹ فارم، کے تکنیکی ڈیزائن کی قیادت کرنا۔
  - ایک یا زیادہ فراہمی کی ٹیموں کے لیے تکنیکی سمت طے کرنا اور خطرہ بڑھانے والے ڈیزائن کو چیلنج کرنا۔
  - لچک، آفت سے بحالی اور محفوظ چلانے کے لیے ڈیزائن کرنا، اور جانچنا کہ ٹیمیں اس کی جانچ کرتی ہیں۔
  - خدمت کے مالکان، طبی رہنماؤں اور سینئر اسٹیک ہولڈرز کو تکنیکی خطرات اور سمجھوتے سادہ زبان میں سمجھانا۔
  - تکنیکی معماروں اور سینئر ڈیولپروں کی رہنمائی اور تربیت کرنا۔
  qualifications:
  - پیچیدہ خدمات کے تکنیکی ڈیزائن کا خاطر خواہ تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
  job_evaluation_notes: "UK GDaD PCF کے گریڈ کی تجویز (درجہ 7) سے اوپر درجہ بندی کی گئی ہے۔ صحت کے شعبے کے اشتہارات اس کردار کو درجہ 8a میں رکھتے ہیں۔ منصوبہ بندی، پالیسی اور عمل کی آزادی کو درجہ 7 کے خاکے سے اوپر جانچا گیا ہے کیونکہ یہ کام کم نگرانی کے ساتھ کئی ٹیموں کے لیے تکنیکی سمت طے کرتا ہے۔"
- title: لیڈ تکنیکی آرکیٹیکٹ
  responsibilities:
  - مشترکہ نمونے اور معیارات طے کرتے ہوئے کئی خدمات یا ٹیموں میں تکنیکی فنِ تعمیر کی قیادت کرنا۔
  - ڈیزائن کے اختیار والے اداروں میں ڈیزائن کے تکنیکی معیار کی یقین دہانی کرنا، بشمول سلامتی، لچک اور باہمی مطابقت۔
  - انٹرپرائز معماروں اور انجینئرنگ کے رہنماؤں کے ساتھ مل کر ادارے کے ٹیکنالوجی روڈ میپ کو شکل دینا۔
  - سینئر رہنماؤں کو ٹیکنالوجی کے انتخاب، پلیٹ فارم میں سرمایہ کاری اور تکنیکی خطرے پر مشورہ دینا۔
  - تکنیکی معماروں کی قیادت کرنا اور انہیں ترقی دینا۔
  qualifications:
  - پیچیدہ خدمات کے لیے تکنیکی فنِ تعمیر کی قیادت کا وسیع تجربہ۔
- title: پرنسپل تکنیکی آرکیٹیکٹ
  responsibilities:
  - ادارے کی تکنیکی فنِ تعمیر کی حکمتِ عملی، اصول اور معیارات طے کرنا۔
  - پورے ادارے میں تکنیکی ڈیزائن کا نظم و ضبط چلانا، بشمول تکنیکی ڈیزائن کے اختیار والا ادارہ۔
  - انتظامی ٹیم کو بڑے ٹیکنالوجی کے فیصلوں پر مشورہ دینا، جیسے ہوسٹنگ کی حکمتِ عملی اور پلیٹ فارموں کی یکجائی۔
  - اداروں کے درمیان تکنیکی اور معیارات کی برادریوں میں ادارے کی نمائندگی کرنا۔
  - پورے ادارے میں معماروں کو متاثر کرنا اور انہیں ترقی دینا۔
  qualifications:
  - متعدد ٹیموں یا اداروں میں تکنیکی فنِ تعمیر کی قیادت کا وسیع تجربہ۔
