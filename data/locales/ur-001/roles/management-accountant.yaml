- title: زیر تربیت انتظامی اکاؤنٹنٹ
  summary: زیر تربیت انتظامی اکاؤنٹنٹ، جنہیں کبھی کبھی مالیاتی تجزیہ کار کہا جاتا ہے، کسی تسلیم شدہ اکاؤنٹنسی کی قابلیت کی طرف کام کرتے ہوئے بجٹ رکھنے والوں کے ایک سلسلے کے لیے بجٹ کی رپورٹیں اور تجزیہ تیار کرتے ہیں۔
  responsibilities:
  - بجٹ رکھنے والوں کے گروہ کے لیے ماہانہ بجٹ رپورٹیں تیار کرنا اور اہم فرق کی وضاحت کرنا۔
  - رپورٹوں کی درستی یقینی بنانے کے لیے ماہ کے اختتام کے جرنل، واجب الادا اخراجات اور اصلاحات پوسٹ کرنا۔
  - جانچنا کہ خرچ لاگتی مراکز، منصوبوں اور سرمائے اور آمدنی کے درمیان درست طور پر کوڈ ہو۔
  - پیش گوئی کی معلومات جمع کرنا اور بجٹ رکھنے والوں کے ساتھ پیش گوئیاں اپ ڈیٹ کرنا۔
  - رہنمائی کے تحت کاروباری مقدمات کے لیے لاگت کی معلومات بنانا۔
  - کسی تسلیم شدہ اکاؤنٹنسی کی قابلیت کی طرف کام کرنا۔
  qualifications:
  - ڈگری یا اکاؤنٹنگ کی درمیانی سطح کی قابلیت، اور کسی تسلیم شدہ اکاؤنٹنسی کی قابلیت کی طرف کام کرتا ہوا، یا اس کے برابر تجربہ۔
  job_evaluation_notes: علم کو اس سطح پر جانچا گیا ہے جو تربیت کے اتنا آگے بڑھ جانے کے بعد کام کے لیے درکار ہے کہ کام کیا جا سکے۔ مالی وسائل تفویض کردہ بجٹ کی نگرانی کے لیے سطح 3 ہیں۔
- title: انتظامی اکاؤنٹنٹ
  summary: انتظامی اکاؤنٹنٹ اہل اکاؤنٹنٹ ہیں جو کسی ڈائریکٹوریٹ یا خدمات کے گروہ کے لیے بجٹ سازی، نگرانی اور پیش گوئی چلاتے ہیں، اور بجٹ رکھنے والوں کو ان کی مالیات پر مشورہ دیتے ہیں۔
  responsibilities:
  - کسی ڈائریکٹوریٹ یا خدمات کے گروہ کے لیے ماہانہ رپورٹنگ اور پیش گوئی کے چکر کی قیادت کرنا۔
  - بجٹ رکھنے والوں کو خرچ، خطرات اور بجٹ کے اندر رہنے کے اقدامات پر مشورہ دینا۔
  - عملے کی لاگتوں، معاہدوں اور لائسنسوں سمیت سالانہ بجٹ تیار کرنا۔
  - ڈیجیٹل خرچ، جیسے سافٹ ویئر کی ترقی، لائسنس اور ہارڈ ویئر، پر سرمائے اور آمدنی کے قواعد لاگو کرنا۔
  - کاروباری مقدمات اور متبادل کے جائزوں کے لیے مالی ماڈل بنانا۔
  - زیر تربیت اکاؤنٹنٹس کی نگرانی کرنا اور انہیں ترقی دینا۔
  qualifications:
  - کوئی تسلیم شدہ اکاؤنٹنسی کی قابلیت، یا اس کے برابر تجربہ۔
- title: سینئر انتظامی اکاؤنٹنٹ
  summary: سینئر انتظامی اکاؤنٹنٹ کسی بڑے ڈائریکٹوریٹ یا بڑے ڈیجیٹل پروگرام کے مالی انتظام کی قیادت کرتے ہیں، بشمول پیچیدہ پیش گوئی، لاگت کا حساب اور کاروباری مقدمات۔
  responsibilities:
  - کسی بڑے ڈائریکٹوریٹ یا بڑے ڈیجیٹل پروگرام کے لیے بجٹ سازی اور پیش گوئی کی قیادت کرنا۔
  - منظرناموں کا ماڈل بنانا، جیسے مالی وسائل میں تبدیلیاں، فراہمی میں تاخیر، اور سرمائے سے کلاؤڈ رکنیت کی لاگتوں کی طرف منتقلی۔
  - پورے عرصے کی لاگتوں، فوائد اور رقم کی قدر سمیت اہم سرمایہ کاریوں کے مالی مقدمے کی قیادت کرنا۔
  - خدمت اور مصنوعے کی لاگت کا حساب بنانا، جیسے ڈیجیٹل خدمت چلانے کی مکمل لاگت۔
  - سینئر منیجروں اور پروگرام کے بورڈوں کو مالی کارکردگی اور خطرات پیش کرنا۔
  - اکاؤنٹنٹس اور زیر تربیت افراد کی ایک چھوٹی ٹیم کا انتظام کرنا۔
  qualifications:
  - کوئی تسلیم شدہ اکاؤنٹنسی کی قابلیت، اہلیت کے بعد خاطر خواہ تجربے کے ساتھ، یا اس کے برابر۔
  job_evaluation_notes: مالی وسائل سطح 4 ہیں کیونکہ یہ کام بجٹ رکھنے والوں کے ساتھ مل کر کسی ڈائریکٹوریٹ یا پروگرام کا بجٹ طے کرتا ہے۔
- title: مالیاتی کاروباری شریک
  summary: مالیاتی کاروباری شریک کسی ڈائریکٹوریٹ کی قیادت، اکثر ڈیجیٹل، ڈیٹا اور ٹیکنالوجی، کے حصے کے طور پر کام کرتے ہیں، مالی معلومات کو فیصلوں میں بدلتے ہیں اور یقینی بناتے ہیں کہ سرمایہ کاری رقم کی قدر فراہم کرے۔
  responsibilities:
  - کسی ڈائریکٹوریٹ کی قیادت کی ٹیم، جیسے ڈیجیٹل، ڈیٹا اور ٹیکنالوجی، کے سینئر مالیاتی مشیر کے طور پر کام کرنا۔
  - ڈائریکٹوریٹ کے مالی منصوبے کی قیادت کرنا، خرچ کو ترجیحات، افرادی قوت اور سرمایہ کاری سے جوڑتے ہوئے۔
  - سپلائر کے خرچ، لائسنس کے استعمال اور کلاؤڈ کی لاگتوں سمیت رقم کی قدر پر رہنماؤں کو چیلنج کرنا اور ان کی معاونت کرنا۔
  - بڑی ڈیجیٹل سرمایہ کاریوں کے کاروباری مقدمات کی قیادت کرنا اور سرمایہ کاری کے بورڈوں میں مالیات کی نمائندگی کرنا۔
  - یقینی بنانا کہ ڈیجیٹل خرچ مالی وسائل کے قواعد، خرچ کے کنٹرول، اور سرمائے اور آمدنی کی حدود پر پورا اترے۔
  - ڈائریکٹوریٹ کی معاونت کرنے والے انتظامی اکاؤنٹنٹس کا براہِ راست انتظام کرنا۔
  qualifications:
  - کوئی تسلیم شدہ اکاؤنٹنسی کی قابلیت، اہلیت کے بعد وسیع تجربے کے ساتھ، بشمول کاروباری شراکت۔
  job_evaluation_notes: مالی وسائل سطح 5 ہیں کیونکہ یہ کام ڈائریکٹوریٹ کی کئی خدمات کے بجٹ طے کرتا ہے۔
