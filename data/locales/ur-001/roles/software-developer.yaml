summary: سافٹ ویئر ڈیولپر ادارے کی ڈیجیٹل صحت کی خدمات کے پیچھے موجود سافٹ ویئر بناتے، جانچتے اور برقرار رکھتے ہیں، جیسے مریضوں کے لیے ایپس، طبی نظام، انضمام کی خدمات اور ڈیٹا کے پلیٹ فارم۔ وہ کثیر شعبہ جاتی مصنوعاتی ٹیموں میں کام کرتے ہیں، ایسا کوڈ لکھتے ہیں جو محفوظ، پائیدار، قابلِ رسائی اور قابلِ دیکھ بھال ہو، اور اپنی خدمات کو براہِ راست چلنے کے دوران سہارا دیتے ہیں۔
health_context:
- سافٹ ویئر مریضوں کی نگہداشت پر اثر ڈال سکتا ہے، اس لیے ڈیولپر طبی خطرے کے انتظام کے عمل پر عمل کرتے ہیں اور حفاظتی مقدموں میں شواہد کا حصہ ڈالتے ہیں۔
- کوڈ اکثر رازدارانہ صحت کی معلومات سنبھالتا ہے، اس لیے ڈیولپر پہلے سے طے شدہ طور پر معلومات کے نظم و ضبط اور محفوظ کوڈنگ کے طریقے اپناتے ہیں۔
- بہت سی خدمات صحت اور نگہداشت کے دیگر نظاموں کے ساتھ ڈیٹا کا تبادلہ کرتی ہیں، جس کے لیے HL7 FHIR جیسے کھلے باہمی مطابقت کے معیارات استعمال ہوتے ہیں۔
- کچھ سافٹ ویئر طبی آلے کے طور پر منضبط ہو سکتا ہے، اس لیے ڈیولپروں کو معلوم ہونا چاہیے کہ ضابطہ جاتی مشورہ کب مانگنا ہے۔
levels:
- title: اپرنٹس سافٹ ویئر ڈیولپر
  responsibilities:
  - منظم تربیت اور جوڑی دار کام کے ذریعے ٹیم کی زبانیں، آلات اور کام کے طریقے سیکھنا۔
  - قریبی نگرانی میں کوڈ کے چھوٹے، اچھی طرح متعین ٹکڑے لکھنا اور جانچنا۔
  - محفوظ کوڈنگ، معلومات کے نظم و ضبط اور طبی حفاظت کے طریقۂ کار پر عمل کرنا۔
  - ٹیم کی تقریبات میں حصہ لینا، جیسے روزانہ کھڑے ہو کر میٹنگ، منصوبہ بندی اور جائزے۔
  - اپرنٹس شپ یا اس کے برابر قابلیت کی طرف کام کرنا۔
  qualifications:
  - سافٹ ویئر ڈیولپمنٹ کی اپرنٹس شپ یا اس کے برابر میں داخل یا اس کی طرف کام کرتا ہوا۔
  job_evaluation_notes: علم کو اس سطح پر جانچا گیا ہے جو تربیت کے اتنا مکمل ہو جانے کے بعد کام کے لیے درکار ہے کہ کام کیا جا سکے؛ معلومات کے وسائل دوسروں کے ڈیزائن کردہ نظاموں پر کام کی عکاسی کرتے ہیں۔
- title: جونیئر سافٹ ویئر ڈیولپر
  responsibilities:
  - رہنمائی کے ساتھ صارف کی کہانیوں پر کام کرتے ہوئے ٹیم کی مصنوعات کی خصوصیات بنانا اور جانچنا۔
  - خودکار ٹیسٹ لکھنا اور خرابیاں دور کرنا، بشمول ان خدمات میں جو مریضوں کی نگہداشت کی معاونت کرتی ہیں۔
  - طبی حفاظت کے مقدموں میں شواہد کا حصہ ڈالنا، جیسے جانچ کے نتائج اور تبدیلی کے ریکارڈ۔
  - معلومات کے نظم و ضبط کے قواعد کی پیروی کرتے ہوئے صحت کے ڈیٹا کو محفوظ طریقے سے سنبھالنا۔
  - ٹیم کے معاونتی انتظامات کے حصے کے طور پر رہنمائی کے تحت براہِ راست چلتی خدمات کی معاونت کرنا۔
  qualifications:
  - کمپیوٹنگ یا متعلقہ مضمون میں ڈگری، مکمل اپرنٹس شپ، یا اس کے برابر تجربہ۔
- title: سافٹ ویئر ڈیولپر
  responsibilities:
  - مناسب طریقے منتخب کرتے ہوئے خصوصیات اور خدمات کو آزادانہ طور پر ڈیزائن کرنا، بنانا اور جانچنا۔
  - کوڈ کا جائزہ لینا اور ٹیم کے انجینئرنگ کے معیارات برقرار رکھنے میں مدد دینا۔
  - HL7 FHIR جیسے کھلے معیارات کے ذریعے صحت اور نگہداشت کے دیگر نظاموں کے ساتھ انضمام بنانا۔
  - خطرات کی نشاندہی میں حصہ لینا اور طبی حفاظت کے کنٹرول کو کوڈ اور ٹیسٹوں میں شامل کرنے میں مدد دینا۔
  - براہِ راست چلتی خدمات کے مسائل کی تحقیقات کرنا اور انہیں درست کرنا، بشمول دفتری اوقات کے بعد کی معاونت جہاں خدمت کو اس کی ضرورت ہو۔
  - جونیئر اور اپرنٹس ڈیولپروں کی رہنمائی کرنا۔
  qualifications:
  - کمپیوٹنگ یا متعلقہ مضمون میں ڈگری، یا اس کے برابر تجربہ۔
  - پیداواری سافٹ ویئر بنانے اور اس کی معاونت کرنے کا تجربہ۔
- title: سینئر سافٹ ویئر ڈیولپر
  responsibilities:
  - اہم خصوصیات اور خدمات کے تکنیکی ڈیزائن اور فراہمی کی قیادت کرنا۔
  - ٹیم کے لیے انجینئرنگ کے معیارات طے کرنا اور برقرار رکھنا، بشمول جانچ، سلامتی اور رسائی۔
  - ایسے تکنیکی فیصلے کرنا جو صارفین کی ضروریات، طبی حفاظت، سلامتی اور لاگت کے درمیان توازن رکھیں۔
  - ٹیم کی خدمات کے واقعات کی تحقیقات کی قیادت کرنا اور اصلاحات کو آگے بڑھانا۔
  - طبی حفاظت کے افسروں کے ساتھ مل کر یقینی بنانا کہ حفاظتی کنٹرول ڈیزائن میں شامل ہوں اور جانچے جائیں۔
  - ٹیم کے ڈیولپروں کی تربیت کرنا اور انہیں ترقی دینا۔
  qualifications:
  - پیداواری سافٹ ویئر ڈیزائن کرنے، بنانے اور اس کی معاونت کرنے کا خاطر خواہ تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
- title: لیڈ سافٹ ویئر ڈیولپر
  responsibilities:
  - تکنیکی سمت طے کرتے ہوئے کسی مصنوعے یا ٹیموں کے گروہ کی انجینئرنگ کی قیادت کرنا۔
  - یقینی بنانا کہ سافٹ ویئر حفاظت، سلامتی، لچک اور باہمی مطابقت کے لیے ڈیزائن کیا گیا ہو۔
  - مصنوعات کے روڈ میپ کو شکل دینے کے لیے معماروں، مصنوعات کے منیجروں اور طبی رہنماؤں کے ساتھ کام کرنا۔
  - ڈیولپروں کی مشق کی برادری کی قیادت کرنا اور ٹیموں میں معیارات طے کرنا۔
  - ڈیولپروں کا براہِ راست انتظام یا ان کی قیادت کرنا، ان کی ترقی اور کارکردگی کی معاونت کرنا۔
  qualifications:
  - پیچیدہ خدمات کے لیے سافٹ ویئر انجینئرنگ کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: UK GDaD PCF لیڈ اور پرنسپل ڈیولپر دونوں کو اکثر G7 یا G6 میں درج کرتا ہے؛ یہ حوالہ لیڈ کو درجہ 8a اور پرنسپل کو درجہ 8b میں رکھتا ہے۔
- title: پرنسپل سافٹ ویئر ڈیولپر
  responsibilities:
  - ادارے کی سافٹ ویئر ڈیولپمنٹ کے لیے انجینئرنگ کی حکمتِ عملی، معیارات اور طریقے طے کرنا۔
  - سینئر رہنماؤں کو ٹیکنالوجی کے انتخاب، خطرات اور سرمایہ کاری پر مشورہ دینا۔
  - خدمات میں سب سے پیچیدہ تکنیکی مسائل کے حل کی قیادت کرنا۔
  - اداروں کے درمیان اور اوپن سورس انجینئرنگ کی برادریوں میں ادارے کی نمائندگی کرنا۔
  - لیڈ ڈیولپروں کی قیادت کرنا اور انہیں ترقی دینا، اور ادارے کی انجینئرنگ کی صلاحیت بڑھانا۔
  qualifications:
  - متعدد ٹیموں یا اداروں میں انجینئرنگ کی قیادت کا وسیع تجربہ۔
