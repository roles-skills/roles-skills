summary: ڈیجیٹل پورٹ فولیو کے مینیجر ادارے کو اپنے ڈیجیٹل منصوبوں، پروگراموں اور مصنوعات کے پورٹ فولیو کو منتخب کرنے، اس کا سراغ رکھنے اور اس کے نظم و ضبط میں مدد دیتے ہیں تاکہ وہ اس کام میں سرمایہ کاری کرے جو مریضوں، معالجین اور نگہداشتی عملے کے لیے سب سے زیادہ مفید ہو۔ وہ پورٹ فولیو کے نظم و ضبط اور رپورٹنگ کو چلاتے ہیں، رہنماؤں کو اچھے شواہد کے ساتھ ترجیحات طے کرنے میں مدد دیتے ہیں، اور یقینی بناتے ہیں کہ پورٹ فولیو وہ فوائد فراہم کرے جن کا وعدہ کیا گیا تھا۔
health_context:
- ڈیجیٹل کام مالی وسائل کے لیے اگلی صف کی نگہداشت سے مقابلہ کرتا ہے، اس لیے پورٹ فولیو کے مینیجر رہنماؤں کو مریضوں اور عملے کے لیے ڈیجیٹل سرمایہ کاری کے فوائد دکھانے میں مدد دیتے ہیں۔
- پورٹ فولیو کے نظم و ضبط میں طبی حفاظت، معلومات کے نظم و ضبط اور سائبر سلامتی کی یقین دہانی شامل ہونی چاہیے، اس لیے پورٹ فولیو کے مینیجر ان کا وقت، لاگت اور دائرہ کار کے ساتھ سراغ رکھتے ہیں۔
- بہت سے ڈیجیٹل منصوبے طبی اور آپریشنل ٹیموں کی گنجائش پر منحصر ہیں، جیسے جانچ کے لیے معالج یا تربیت کے لیے عملہ، اس لیے پورٹ فولیو کے مینیجر خدمات پر طلب کے ٹکراؤ پر نظر رکھتے ہیں۔
- مالی وسائل اکثر کئی ذرائع سے آتے ہیں جن کے اپنے رپورٹنگ کے قواعد اور آخری تاریخیں ہوتی ہیں، اس لیے پورٹ فولیو کے مینیجر رپورٹنگ کو درست اور بروقت رکھتے ہیں۔
levels:
- title: ڈیجیٹل پورٹ فولیو کا تجزیہ کار
  responsibilities:
  - پورٹ فولیو کے منصوبوں سے صورتِ حال، خطرے، مالیات اور فوائد کا ڈیٹا جمع کرنا اور اس کی جانچ کرنا۔
  - پورٹ فولیو کا رجسٹر اور ڈیش بورڈ برقرار رکھنا، اور رپورٹنگ میں خلا یا عدم مطابقت کی نشاندہی کرنا۔
  - پورٹ فولیو کے نظم و ضبط کے بورڈوں کے لیے کاغذات اور رپورٹیں تیار کرنا۔
  - منصوبوں میں یقین دہانی کے سنگ میلوں کا سراغ رکھنا، جیسے طبی حفاظت کی منظوری اور ڈیٹا کے تحفظ کے اثرات کے جائزے۔
  - ترجیح اور منصوبہ بندی کے تجزیے میں پورٹ فولیو کے مینیجروں کی معاونت کرنا۔
  qualifications:
  - ڈگری یا متعلقہ قابلیت، یا تجزیے یا رپورٹنگ کا برابر تجربہ۔
  job_evaluation_notes: UK GDaD PCF تجزیہ کار اور مینیجر دونوں سطحوں کو HEO یا SEO میں رکھتا ہے۔ یہ حوالہ تجزیہ کار کو درجہ 5 میں رکھتا ہے کیونکہ یہ سیکھنے کی سطح ہے جو پورٹ فولیو کے مینیجر کو رپورٹ کرتی ہے، اور مینیجر کو درجہ 6 میں، تاکہ دونوں سطحیں ایک ہی درجے میں نہ ہوں۔
- title: ڈیجیٹل پورٹ فولیو کا مینیجر
  responsibilities:
  - ڈیجیٹل منصوبوں اور پروگراموں کے پورٹ فولیو کو مربوط کرنا، جیسے کسی ڈائریکٹوریٹ کا تمام ڈیجیٹل کام۔
  - ٹیموں کو نظم و ضبط، یقین دہانی اور فراہمی کے عمل کی پیروی میں مدد دینا، اور انہیں متناسب بنانا۔
  - ضرورت، فائدے، خطرے اور گنجائش کے شواہد کی مدد سے رہنماؤں کو کام کو ترجیح دینے میں معاونت کرنا۔
  - بورڈوں اور اسٹیک ہولڈرز کو پورٹ فولیو کی کارکردگی، خطرات اور فوائد واضح طور پر رپورٹ کرنا۔
  - منصوبوں میں طبی اور آپریشنل ٹیموں پر طلب کے ٹکراؤ کی نشاندہی کرنا اور انہیں حل کرنے میں مدد دینا۔
  qualifications:
  - پورٹ فولیو، پروگرام یا منصوبے کے انتظام کا تجربہ، یا اس کے برابر تجربہ۔
- title: سینئر ڈیجیٹل پورٹ فولیو کا مینیجر
  responsibilities:
  - ادارے کے ڈیجیٹل پورٹ فولیو، یا اس کے بڑے حصے، اور اس کے نظم و ضبط اور یقین دہانی کے عمل کا انتظام کرنا۔
  - پورٹ فولیو بھر میں نتائج اور فوائد کا سراغ رکھنا اور ان کا تجزیہ کرنا، اور ٹیموں کو فراہمی میں مدد دینے کے لیے مسائل پر عمل کرنا۔
  - یقینی بنانا کہ پورٹ فولیو معیارات پر پورا اترے، بشمول طبی حفاظت، معلومات کے نظم و ضبط اور سائبر سلامتی کی یقین دہانی۔
  - واضح شواہد کی مدد سے سینئر رہنماؤں کو ترجیح، سرمایہ کاری اور سمجھوتوں پر مشورہ دینا۔
  - مالی وسائل فراہم کرنے والوں اور بیرونی اداروں کو پورٹ فولیو کی رپورٹنگ کا انتظام کرنا۔
  - پورٹ فولیو کے تجزیہ کاروں اور مینیجروں کا براہِ راست انتظام کرنا۔
  qualifications:
  - پورٹ فولیو یا پروگرام کے انتظام کا وسیع تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
  job_evaluation_notes: درجہ 7 کی کوئی سطح نہیں ہے کیونکہ UK GDaD PCF ڈیجیٹل پورٹ فولیو کے مینیجر (HEO/SEO) سے سینئر ڈیجیٹل پورٹ فولیو کے مینیجر (G7) کی طرف جاتا ہے۔
- title: سربراہ ڈیجیٹل پورٹ فولیو
  responsibilities:
  - ڈیجیٹل پورٹ فولیو کے شعبے اور پورٹ فولیو کے مینیجروں کی ٹیم کی قیادت کرنا۔
  - پورٹ فولیو کی حکمتِ عملی، کنٹرول اور نظم و ضبط طے کرنا، اور یقینی بنانا کہ وہ استعمال ہوں۔
  - انتظامی رہنماؤں کو پورٹ فولیو کے مستقبل کے بارے میں بصیرت دینا تاکہ وہ سرمایہ کاری کے فیصلے کر سکیں۔
  - یقینی بنانا کہ پورٹ فولیو کے مریضوں، عملے اور ادارے کے لیے فوائد حاصل ہوں اور رپورٹ کیے جائیں۔
  - پورٹ فولیو کی سطح کے خطرات کو دیکھنا اور مسائل کو انتظامی ٹیم تک پہنچانا۔
  - شعبے کے بجٹ اور صلاحیت کا انتظام کرنا۔
  qualifications:
  - کسی پیچیدہ ادارے میں پورٹ فولیو کے انتظام کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: مالی وسائل سطح 5 پر جانچے گئے ہیں کیونکہ سربراہ ڈیجیٹل پورٹ فولیو کئی خدمات پر محیط پورے ڈیجیٹل پورٹ فولیو کی سرمایہ کاری کی نگرانی کرتا ہے؛ معلومات کے وسائل سطح 6 ہیں کیونکہ پورٹ فولیو کا رجسٹر اور رپورٹنگ پورے ادارے کا احاطہ کرتی ہے۔
