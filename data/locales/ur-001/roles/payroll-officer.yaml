summary: تنخواہ کے افسر یقینی بناتے ہیں کہ عملے کے ہر رکن کو درستی سے اور وقت پر تنخواہ ملے۔ وہ نئے آنے والوں، رخصت ہونے والوں اور تبدیلیوں پر کارروائی کرتے ہیں، تنخواہ اور کٹوتیوں کا حساب لگاتے ہیں، تنخواہ کی جانچ چلاتے ہیں، اور تنخواہ کے سوالات کا جواب دیتے ہیں۔ ڈیجیٹل صحت کی نگہداشت کے ادارے میں تنخواہ میں مختلف معاہدوں اور تنخواہ کے قواعد والا طبی، ڈیجیٹل اور کارپوریٹ عملہ شامل ہو سکتا ہے، اور یہ اکثر ایسے مشترکہ یا بیرونی تنخواہ کے نظام پر چلتی ہے جس کی ٹیم کو جانچ اور یقین دہانی کرنی ہوتی ہے۔
health_context:
- طبی عملے کی تنخواہ پیچیدہ ہو سکتی ہے، جیسے غیر معمولی اوقات، ضرورت پر دستیابی اور متعدد معاہدے، جن کا تنخواہ کے شعبے کو درست حساب لگانا ہوتا ہے۔
- تنخواہ کے قواعد اور سالانہ تنخواہ میں اضافے اکثر قومی سطح پر یا مالی وسائل دینے والوں کی طرف سے طے ہوتے ہیں، اور انہیں فوری اور درستی سے لاگو کیا جانا چاہیے۔
- تنخواہ عموماً ادارے کی سب سے بڑی واحد لاگت ہے، اس لیے غلطیاں اور دھوکہ دہی عوامی رقم اور عملے کے اعتماد پر بڑا اثر ڈالتی ہیں۔
- تنخواہ کا ڈیٹا انتہائی حساس ذاتی معلومات ہے، بشمول صحت، خاندان اور بینک کی تفصیلات، اس لیے معلومات کا نظم و ضبط کام کا مرکزی حصہ ہے۔
- تنخواہ افرادی قوت اور ڈیوٹی کے نظام الاوقات کے نظاموں کے درست ڈیٹا پر منحصر ہے، اس لیے افسر انسانی وسائل اور نظام کی ٹیموں کے ساتھ قریبی کام کرتے ہیں۔
levels:
- title: تنخواہ کا افسر
  summary: تنخواہ کے افسر عملے کے ایک گروہ کے لیے تنخواہ میں تبدیلیوں پر کارروائی کرتے اور تنخواہ کا حساب لگاتے ہیں، طریقۂ کار کی پیروی کرتے ہیں اور ہر تنخواہ بند ہونے سے پہلے اپنے کام کی جانچ کرتے ہیں۔
  responsibilities:
  - مجاز فارموں سے تنخواہ کے نظام میں نئے آنے والوں، رخصت ہونے والوں اور معاہدے کی تبدیلیوں کو درج کرنا۔
  - اوور ٹائم، اضافی الاؤنس، بیماری اور خاندانی رخصت کی ادائیگیوں سمیت تنخواہ کا حساب لگانا۔
  - ٹیکس، پنشن اور دیگر کٹوتیاں درست طور پر لاگو کرنا۔
  - عملے اور منیجروں کے تنخواہ کے سوالات کا نرمی اور رازداری سے جواب دینا۔
  - تنخواہ کے نتائج میں غلطیوں کی جانچ کرنا اور تنخواہ بند ہونے سے پہلے انہیں درست کرنا۔
  - تنخواہ کے کنٹرول اور معلومات کے نظم و ضبط کے قواعد کی پیروی کرنا۔
  qualifications:
  - ابتدائی سطح کی تنخواہ کی قابلیت، یا تنخواہ کی کارروائی کا برابر تجربہ۔
  job_evaluation_notes: مالی وسائل سطح 3 ہیں کیونکہ یہ کام وہ تنخواہ تیار کرتا ہے جو ادارہ عملے کو جاری کرتا ہے۔ جسمانی مہارتیں تیز اور درست ڈیٹا اندراج کے لیے سطح 3 ہیں۔
- title: سینئر تنخواہ کا افسر
  summary: سینئر تنخواہ کے افسر تنخواہ کے پیچیدہ معاملات سنبھالتے ہیں، تنخواہ کے افسروں کے کام کی جانچ کرتے ہیں، اور تنخواہ کی مطابقتیں اور گوشوارے چلانے میں مدد دیتے ہیں۔
  responsibilities:
  - تنخواہ کے پیچیدہ معاملات حل کرنا، جیسے بقایا تنخواہ، متعدد معاہدے اور تنخواہ کی قربانی۔
  - زائد ادائیگیوں کو حساسیت کے ساتھ اور پالیسی کے مطابق وصول کرنا۔
  - تنخواہ کی کھاتے سے مطابقت کرنا، اور ٹیکس اور پنشن کی مطابقتیں تیار کرنا۔
  - تنخواہ کے افسروں کے کام کی جانچ کرنا اور تنخواہ کے حصوں پر دستخط کرنا۔
  - تنخواہ میں اضافے اور قواعد کی تبدیلیوں کو شروع ہونے سے پہلے تنخواہ کے نظام میں جانچنا۔
  - تنخواہ کے افسروں کو تربیت دینا اور منیجروں کو تنخواہ کا بنیادی مشورہ دینا۔
  qualifications:
  - تنخواہ کی درمیانی سطح کی قابلیت، یا اس کے برابر تجربہ۔
- title: تنخواہ کی ٹیم کا رہنما
  summary: تنخواہ کی ٹیم کے رہنما تنخواہ کی ٹیم کا روزمرہ انتظام کرتے ہیں، تنخواہ کا پورا چکر چلاتے ہیں، اور یقینی بناتے ہیں کہ قانونی رپورٹنگ اور پنشن کے گوشوارے درست اور وقت پر ہوں۔
  responsibilities:
  - تنخواہ کے چکر کی منصوبہ بندی کرنا اور اسے چلانا، یقینی بنانا کہ آخری تاریخیں، جانچ اور ادائیگی کی ڈیڈ لائنیں پوری ہوں۔
  - تنخواہ کی جانچ پر دستخط کرنا اور اہم فرق کی تحقیقات کرنا۔
  - تنخواہ کی قانونی رپورٹنگ اور پنشن کے گوشواروں کا انتظام کرنا۔
  - تنخواہ کی ٹیم کا روزمرہ انتظام کرنا، بشمول کام کا بوجھ، تربیت اور معیار کی جانچ۔
  - تنخواہ کے ڈیٹا کا معیار اور بروقت ہونا بہتر بنانے کے لیے انسانی وسائل اور ڈیوٹی کے نظام الاوقات کی ٹیموں کے ساتھ کام کرنا۔
  - بالا سطح پر بھیجے گئے تنخواہ کے سوالات اور شکایات کا جواب دینا۔
  qualifications:
  - تنخواہ کی اعلیٰ سطح کی قابلیت، یا اس کے برابر تجربہ۔
  - مکمل تنخواہ چلانے کا تجربہ۔
- title: تنخواہ کا مینیجر
  summary: تنخواہ کے مینیجر ادارے کی تنخواہ کی خدمت کے ذمہ دار ہیں، خواہ وہ ادارے کے اندر چلے یا فراہم کنندہ کے ذریعے، اور رہنماؤں کو یقین دلاتے ہیں کہ تنخواہ درست، قانونی اور اچھی طرح کنٹرول شدہ ہے۔
  responsibilities:
  - تنخواہ کی خدمت اور اس کی ٹیم کا انتظام کرنا، اور کارکردگی اور درستی پر رپورٹ دینا۔
  - کسی تنخواہ فراہم کنندہ یا مشترکہ خدمت کے ساتھ معاہدے اور تعلقات کا انتظام کرنا۔
  - تنخواہ کے کنٹرول طے کرنا، جیسے منظوری کی حدیں، استثنا کی رپورٹیں اور فرائض کی علیحدگی۔
  - تنخواہ کے قواعد، تنخواہ میں اضافے، پنشن اور ٹیکس میں تبدیلیوں کی منصوبہ بندی کرنا، اور یقینی بنانا کہ انہیں درست طور پر لاگو کیا جائے۔
  - نظام اور انسانی وسائل کی ٹیموں کے ساتھ کام کرتے ہوئے تنخواہ کے نظام کی تبدیلیوں اور اپ گریڈ کی قیادت کرنا۔
  - بجٹ، پیش گوئیوں اور سالانہ حسابات کے لیے تنخواہ کی معلومات فراہم کرنا۔
  - تنخواہ کی ناکامیوں اور سنگین غلطیوں کے ردعمل کی قیادت کرنا۔
  qualifications:
  - تنخواہ کی اعلیٰ سطح کی قابلیت یا کوئی تسلیم شدہ اکاؤنٹنسی کی قابلیت، یا اس کے برابر تجربہ۔
  - تنخواہ کی خدمت کے انتظام کا تجربہ۔
  job_evaluation_notes: مالی وسائل سطح 4 ہیں کیونکہ یہ کام ادارے کی پوری تنخواہ، جو اس کی سب سے بڑی لاگت ہے، کا ذمہ دار ہے۔ افراد سطح 3 ہیں کیونکہ تنخواہ کی ٹیم چھوٹی ہے۔
