- title: سروس ڈیسک کا تجزیہ کار
  summary: سروس ڈیسک کا تجزیہ کار عملے کی کالوں اور ٹکٹوں کا جواب دیتا ہے، اسکرپٹس اور علمی مضامین کی مدد سے پہلے رابطے پر عام مسائل حل کرتا ہے، اور دوسرے مسائل درست ٹیم تک پہنچاتا ہے۔
  responsibilities:
  - عملے کی کالوں، چیٹوں اور خود خدمتی ٹکٹوں کا جواب دینا، اور ہر ایک کو خدمت کے انتظام کے آلے میں درستی سے درج کرنا۔
  - اسکرپٹس اور علمی مضامین کی مدد سے پہلے رابطے پر عام مسائل حل کرنا، جیسے پاس ورڈ کی بحالی، کھاتے کھولنا اور پرنٹر کی خرابیاں۔
  - ادارے کے طریقۂ کار کی پیروی کرتے ہوئے کھاتوں یا رسائی میں تبدیلی سے پہلے فون کرنے والے کی شناخت کی جانچ کرنا۔
  - پوچھنا کہ مسئلہ مریضوں کی نگہداشت پر کیسے اثر ڈالتا ہے، ترجیح طے کرنا، اور واقعے کو درست حل کرنے والی ٹیم تک پہنچانا۔
  - صارفین کو ان کے ٹکٹوں پر باخبر رکھنا اور بند کرنے سے پہلے تصدیق کرنا کہ اصلاح کام کرتی ہے۔
  - ٹکٹوں میں غیر ضروری مریضوں کی تفصیلات کے بغیر صرف ضروری معلومات درج کرنا۔
  qualifications:
  - آئی ٹی میں سطح 3 کی قابلیت، آئی ٹی کی معاونت کی اپرنٹس شپ، یا اس کے برابر تجربہ۔
  - کام یا تعلیم کے ذریعے حاصل کی گئی اچھی گاہک خدمت اور کی بورڈ کی مہارت۔
  job_evaluation_notes: UK GDaD PCF اس سطح کے لیے درجہ 4 تجویز کرتا ہے۔ یہ حوالہ اسکرپٹ والے پہلے درجے کے سروس ڈیسک کے کام کو درجہ 3 سے شروع کرتا ہے، اور زیادہ پیچیدہ خرابیاں حل کرنے والے تجزیہ کاروں کو درجہ 4 میں رکھتا ہے۔ ذہنی مشقت ناقابلِ پیش گوئی کالوں پر بار بار ارتکاز کی عکاسی کرتی ہے؛ جذباتی مشقت طبی علاقوں میں دباؤ میں عملے کی بار بار کالوں کی عکاسی کرتی ہے۔
- title: تکنیکی سروس ڈیسک کا تجزیہ کار
  summary: تکنیکی سروس ڈیسک کا تجزیہ کار پہلے رابطے پر زیادہ پیچیدہ خرابیاں حل کرتا ہے، بشمول آلات اور طبی نظاموں تک رسائی کی دور سے اصلاحات، اور طبی علاقوں سے فوری کالیں سنبھالتا ہے۔
