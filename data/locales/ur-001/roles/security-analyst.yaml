  job_evaluation_notes: ذہنی مشقت ناقابلِ پیش گوئی انتباہات کی نگرانی اور چھانٹی پر بار بار طویل ارتکاز کی عکاسی کرتی ہے۔
- title: سلامتی کے آپریشنز کا تجزیہ کار
