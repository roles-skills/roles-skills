summary: سائبر سلامتی کے مینیجر ادارے کے نظاموں، ڈیٹا اور خدمات کو سائبر خطرات سے بچانے کے ادارے کے طریقے کی قیادت کرتے ہیں۔ وہ سلامتی کی پالیسی طے کرتے ہیں، سائبر خطرے کا انتظام کرتے ہیں، سلامتی کے آپریشنز اور انجینئرنگ کی نگرانی کرتے ہیں، بڑے سائبر واقعات کے ردعمل کی قیادت کرتے ہیں، اور سلامتی سے آگاہ ثقافت بناتے ہیں۔ صحت کی نگہداشت میں وہ یقینی بناتے ہیں کہ حملہ ہونے پر طبی خدمات محفوظ طریقے سے چلتی رہیں اور جلدی بحال ہوں۔
health_context:
- صحت کی نگہداشت کے ادارے پر سائبر حملہ طبی نظاموں کو روک سکتا ہے اور مریضوں کو خطرے میں ڈال سکتا ہے، اس لیے سائبر سلامتی مریضوں کی حفاظت اور کاروبار کے تسلسل کا حصہ ہے۔
- صحت کی نگہداشت کے اداروں کو اکثر شعبے کے سائبر سلامتی کے معیارات پورے کرنے اور سنگین واقعات متعلقہ حکام کو رپورٹ کرنے ہوتے ہیں۔
- طبی عملے کو نظاموں تک تیز رسائی کی ضرورت ہے، اس لیے سلامتی کی پالیسیاں معالجین کے ساتھ ڈیزائن کی جاتی ہیں اور قابلِ استعمال ہونے کے لیے جانچی جاتی ہیں۔
- سلامتی بہت سے سپلائرز پر منحصر ہے، بشمول طبی نظاموں کے سپلائرز اور مشترکہ خدمات، اس لیے سپلائر کی یقین دہانی کردار کا بنیادی حصہ ہے۔
- طبی آلات اور پرانے نظام طویل مدتی خطرات پیدا کرتے ہیں جن کا انتظام طبی انجینئرنگ اور طبی حفاظت کی ٹیموں کے ساتھ کیا جاتا ہے۔
levels:
- title: سائبر سلامتی کا مینیجر
  summary: سائبر سلامتی کا مینیجر سائبر سلامتی کے شعبے، یا اس کے کسی بڑے حصے، کو چلاتا ہے، سائبر خطرے، سلامتی کے آپریشنز اور یقین دہانی کا انتظام کرتا ہے۔
  responsibilities:
  - سلامتی کے آپریشنز، کمزوریوں کے انتظام اور یقین دہانی کا کام چلانا، اور ان کی کارکردگی پر رپورٹ دینا۔
  - سائبر خطرے کا رجسٹر برقرار رکھنا، اور یقینی بنانا کہ طبی خدمات کو لاحق خطرات کا جائزہ لیا جائے اور ان کا کوئی مالک ہو۔
  - سلامتی کی پالیسیاں اور معیارات لکھنا اور برقرار رکھنا، اور جانچنا کہ ان پر عمل ہو رہا ہے۔
  - واقعات کے انتظام اور طبی اور آپریشنل رہنماؤں کے ساتھ کام کرتے ہوئے سائبر واقعات کے ردعمل کی قیادت کرنا۔
  - تمام عملے، بشمول طبی عملے، کے لیے سلامتی کی آگاہی کی تربیت اور فشنگ کی مشقیں چلانا۔
  - سلامتی کے تجزیہ کاروں اور انجینئروں کا براہِ راست انتظام کرنا۔
  qualifications:
  - واقعے کے ردعمل اور خطرے کے انتظام سمیت سائبر سلامتی کا وسیع تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
  - سلامتی کی کوئی تسلیم شدہ پیشہ ورانہ سند، یا اس کے برابر تجربہ۔
  job_evaluation_notes: ذہنی اور جذباتی مشقت دباؤ میں، اکثر دفتری اوقات کے بعد، سائبر واقعات کے ردعمل کی قیادت کی عکاسی کرتی ہے جہاں مریضوں کی نگہداشت خطرے میں ہو سکتی ہے۔
- title: سینئر سائبر سلامتی کا مینیجر
  summary: سینئر سائبر سلامتی کا مینیجر کئی ٹیموں میں سائبر سلامتی کی قیادت کرتا ہے، شعبے کے معیارات کے مقابلے میں یقین دہانی کا انتظام کرتا ہے، اور ادارے کے سلامتی کی بہتری کے پروگرام کو چلاتا ہے۔
  responsibilities:
  - آپریشنز، انجینئرنگ اور یقین دہانی کی سائبر سلامتی کی ٹیموں کی قیادت کرنا۔
  - ادارے کا سائبر سلامتی کی بہتری کا پروگرام چلانا اور اس کے بجٹ کا انتظام کرنا۔
  - شعبے کے سائبر سلامتی کے معیارات اور ISO/IEC 27001 کے کنٹرول کے مقابلے میں یقین دہانی کا انتظام کرنا، اور آڈٹ کے لیے شواہد تیار کرنا۔
  - بڑے سائبر واقعات کے ردعمل کی قیادت کرنا، اور کاروبار کے تسلسل اور طبی رہنماؤں کے ساتھ بحالی کی منصوبہ بندی اور جانچ کرنا۔
  - سپلائرز اور مشترکہ خدمات کی سلامتی کا جائزہ لینا، اور معاہدوں میں سلامتی کے تقاضوں پر اتفاق کرنا۔
  - پروگرام کے بورڈوں کو نئی طبی اور ڈیجیٹل خدمات کے سلامتی کے خطرات پر مشورہ دینا۔
  qualifications:
  - کسی پیچیدہ ادارے میں سائبر سلامتی کی ٹیموں کی قیادت کا وسیع تجربہ۔
  - سلامتی کی کوئی تسلیم شدہ پیشہ ورانہ سند، یا اس کے برابر تجربہ۔
  job_evaluation_notes: ذہنی اور جذباتی مشقت بڑے سائبر واقعات کے ردعمل کی قیادت کی عکاسی کرتی ہے، جو دنوں یا ہفتوں تک جاری رہ سکتے ہیں اور مریضوں کی نگہداشت کو خطرے میں ڈال سکتے ہیں۔
- title: سربراہ سائبر سلامتی
  summary: سربراہ سائبر سلامتی ادارے کی سائبر سلامتی کی حکمتِ عملی طے کرتا ہے اور اس کے سائبر خطرے کے انتظام، سلامتی کے آپریشنز اور بڑے واقعات کے ردعمل کا جواب دہ ہے۔
  responsibilities:
  - ادارے کی ڈیجیٹل اور طبی حکمتِ عملیوں کے مطابق سائبر سلامتی کی حکمتِ عملی طے کرنا۔
  - بورڈ اور انتظامی ٹیم کو سائبر خطرے، خطرہ برداشت کرنے کی حد اور سرمایہ کاری پر مشورہ دینا۔
  - ریگولیٹرز، شراکت داروں اور عوام کے ساتھ ابلاغ سمیت بڑے سائبر واقعات کے ادارے کے ردعمل کی قیادت کرنا۔
  - ایسی سلامتی کی ثقافت بنانا جس میں تمام عملہ، بشمول معالجین، خطرات کو سمجھے اور ان کی اطلاع دے۔
  - صحت کی نگہداشت کے سائبر سلامتی کے نیٹ ورکوں میں اور شراکت دار اداروں کے ساتھ ادارے کی نمائندگی کرنا۔
  - سائبر سلامتی کے شعبے کی قیادت کرنا اور اسے ترقی دینا، اور اس کے بجٹ کا انتظام کرنا۔
  qualifications:
  - بڑے واقعے کے ردعمل سمیت کسی بڑے ادارے کے لیے سائبر سلامتی کی قیادت کا وسیع تجربہ۔
- title: چیف انفارمیشن سیکیورٹی آفیسر
  summary: چیف انفارمیشن سیکیورٹی آفیسر پورے ادارے میں، اور اکثر ان شراکت دار اداروں میں جو اس کی خدمات مشترکہ طور پر استعمال کرتے ہیں، سائبر سلامتی کی ادارہ جاتی ذمہ داری رکھتا ہے۔
  responsibilities:
  - سائبر سلامتی کی ادارہ جاتی ذمہ داری رکھنا، اور بورڈ کو اس پر رپورٹ دینا۔
  - بورڈ کے ساتھ سلامتی کے خطرے کی برداشت کی حد طے کرنا، اور یقینی بنانا کہ وہ پورے ادارے کے فیصلوں کو شکل دے۔
  - مشترکہ خدمات اور شراکت دار اداروں میں، جہاں ادارہ انہیں فراہم کرتا ہے، سائبر سلامتی کی قیادت کرنا۔
  - انتظامی ٹیم اور متعلقہ حکام کے ساتھ کام کرتے ہوئے سب سے سنگین سائبر واقعات کے ادارے کے ردعمل کی ہدایت کرنا۔
  - شراکت داروں اور شعبے کے اداروں کے ساتھ کام کر کے صحت اور نگہداشت کے شعبے میں سائبر سلامتی کی مشق کو شکل دینا۔
  - سلامتی کے شعبے کی قیادت کرنا اور کئی خدمات کے بجٹ رکھنا۔
  qualifications:
  - بورڈ کی سطح پر، یا کئی اداروں کے لیے، سائبر سلامتی کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: یہ سطح بڑے اداروں، یا ان اداروں کے لیے موزوں ہے جو شراکت داروں کو مشترکہ ڈیجیٹل خدمات فراہم کرتے ہیں۔ چھوٹے اداروں میں عموماً سربراہ سائبر سلامتی درجہ 8c پر سلامتی کا سب سے سینئر کردار ہوتا ہے۔
