summary: مواد کے ڈیزائنر صحت اور نگہداشت کی معلومات اور خدمات کو واضح بناتے ہیں، تاکہ مریض، نگہداشت کرنے والے، معالج اور نگہداشتی عملہ سمجھ سکیں کہ انہیں کیا جاننے اور کیا کرنے کی ضرورت ہے۔ وہ صارفین کی ضروریات کے شواہد سے مواد ڈیزائن کرتے ہیں، سادہ زبان میں لکھتے ہیں، طبی ماہرین کے ساتھ کام کرتے ہیں تاکہ وہ درست رہے، اور مواد کی پوری زندگی، تخلیق سے لے کر جائزے اور ریٹائرمنٹ تک، کی دیکھ بھال کرتے ہیں۔
health_context:
- لوگ اکثر صحت کا مواد اس وقت پڑھتے ہیں جب وہ فکرمند، بیمار یا جلدی میں ہوں، اس لیے مواد کم صحت خواندگی والے لوگوں کے لیے سمجھنے اور اس پر عمل کرنے میں آسان ہونا چاہیے۔
- غلط یا پرانی صحت کی معلومات نقصان پہنچا سکتی ہیں، اس لیے مواد کے ڈیزائنر جائزے کی تاریخوں اور نامزد طبی جائزہ کاروں کے ساتھ طبی یقین دہانی کے عمل کی پیروی کرتے ہیں۔
- کچھ موضوعات حساس یا زیادہ خطرے والے ہیں، جیسے فوری علامات، ذہنی صحت، ادویات اور زندگی کے آخری ایام کی نگہداشت، اس لیے مواد کے ڈیزائنر لہجے اور درستی پر معالجین اور صارف تحقیق کاروں کے ساتھ قریبی کام کرتے ہیں۔
- طبی نظاموں کو بھی واضح مواد کی ضرورت ہے، جیسے لیبل، ہدایات اور انتباہات، اس لیے مواد کے ڈیزائنر طبی کام کے بہاؤ میں غلطیاں کم کرنے میں مدد دیتے ہیں۔
- صحت کا مواد قابلِ رسائی اور شمولیتی ہونا چاہیے، بشمول ان لوگوں کے لیے جو معاون ٹیکنالوجی استعمال کرتے ہیں، دوسری زبان میں پڑھتے ہیں، یا آسان پڑھنے کی شکلوں کی ضرورت رکھتے ہیں۔
levels:
- title: ایسوسی ایٹ مواد کا ڈیزائنر
  responsibilities:
  - تربیت اور نگرانی میں کام کے ذریعے مواد کے ڈیزائن کے طریقے، طرزِ تحریر کی رہنما کتاب اور طبی جائزے کا عمل سیکھنا۔
  - موجودہ مواد کی معیاری جانچ، متن کی تدوین اور اپ ڈیٹ کرنا۔
  - یقین دہانی کے مراحل کی پیروی کرتے ہوئے مواد کے انتظامی نظام کے ذریعے مواد شائع کرنا۔
  - مواد کو رسائی کے لیے جانچنا، جیسے عنوانات، لنک کا متن اور متبادل متن۔
  qualifications:
  - کسی متعلقہ شعبے میں قابلیت یا اپرنٹس شپ کی طرف کام کرتا ہوا، یا اس کے برابر تجربہ۔
- title: جونیئر مواد کا ڈیزائنر
  responsibilities:
  - زیادہ سینئر مواد کے ڈیزائنروں کی ہدایت کے ساتھ صحت کا مواد اور خدمت کا مواد لکھنا اور اپ ڈیٹ کرنا۔
  - تحقیق اور ڈیٹا کا استعمال کرتے ہوئے پہچاننا کہ صارفین کو کیا جاننے کی ضرورت ہے اور وہ کون سے الفاظ استعمال کرتے ہیں۔
  - درستی کی جانچ کے لیے طبی جائزہ کاروں کے ساتھ کام کرنا، اور طبی اصطلاحات کو سادہ زبان میں سمجھانا۔
  - مواد کی اشاعت، جائزے کی تاریخوں اور مواد کی ٹیم کی انتظامیہ کی معاونت کرنا۔
  qualifications:
  - ڈگری یا متعلقہ قابلیت، یا ویب کے لیے لکھنے کا برابر تجربہ۔
- title: مواد کا ڈیزائنر
  responsibilities:
  - صارف کے پورے سفر کے لیے مواد ڈیزائن کرنا، جیسے خدمت تلاش کرنا، ملاقات کی تیاری اور بعد کی نگہداشت۔
  - غلطی کے امکان کو کم کرنے کے لیے طبی نظاموں کے لیے مواد ڈیزائن کرنا، جیسے لیبل، ہدایات اور انتباہات۔
  - مواد کو واضح اور قابلِ استعمال رکھتے ہوئے طبی ماہرین کے ساتھ درستی پر اتفاق کرنا۔
  - صارفین کے ساتھ مواد کی جانچ کرنا، بشمول کم صحت خواندگی والے لوگ اور معاون ٹیکنالوجی استعمال کرنے والے لوگ۔
  - طرزِ تحریر کی رہنما کتاب اور مواد کے نمونوں میں حصہ ڈالنا۔
  qualifications:
  - ڈگری یا متعلقہ قابلیت، یا اس کے برابر تجربہ۔
  - ڈیجیٹل خدمات کے لیے مواد ڈیزائن کرنے کا تجربہ۔
- title: سینئر مواد کا ڈیزائنر
  responsibilities:
  - بڑے یا نمایاں شعبوں، جیسے کسی بڑی بیماری کے شعبے یا عوامی صحت کی مہم، کے لیے مواد کی حکمتِ عملی تیار کرنا۔
  - حساس اور زیادہ خطرے والے موضوعات کے لیے مواد ڈیزائن کرنا، جیسے فوری علامات، ذہنی صحت اور زندگی کے آخری ایام کی نگہداشت۔
  - صحت کے مواد کے ذخیرے کے لیے طبی یقین دہانی، شواہد کے ذرائع اور جائزے کے چکر قائم کرنا۔
  - معیار کی یقین دہانی کے لیے دوسروں کے کام کا جائزہ لینا، اور مواد کے ڈیزائنروں کا انتظام یا ان کی رہنمائی کرنا۔
  - ٹیم کے ساتھ صارف کی کہانیاں لکھنا اور ان کا نقشہ بنانا۔
  qualifications:
  - مواد کے ڈیزائن کا خاطر خواہ تجربہ، جو ماسٹرز کی ڈگری کے برابر سطح کا ہو۔
  job_evaluation_notes: جذباتی مشقت سطح 2 ہے کیونکہ سینئر مواد کے ڈیزائنر باقاعدگی سے تکلیف دہ موضوعات پر کام کرتے ہیں، جیسے سنگین بیماری، خود کو نقصان اور سوگ۔
- title: لیڈ مواد کا ڈیزائنر
  responsibilities:
  - مواد کے ڈیزائنروں کی ٹیم کی ہدایت کرنا اور کئی ٹیموں میں مواد کے معیار کی یقین دہانی کرنا۔
  - یقینی بنانا کہ صحت کا مواد طبی یقین دہانی، رسائی اور طرزِ تحریر کے معیارات پورے کرے۔
  - ٹیموں کو وسائل دینے اور مواد کے مسائل حل کرنے کے لیے سینئر طبی، ابلاغ اور مصنوعات کے رہنماؤں کے ساتھ کام کرنا۔
  - ادارے کی سب سے حساس یا زیادہ خطرے والی معلومات کے مواد کی قیادت کرنا۔
  - مواد کے ڈیزائنروں کا براہِ راست انتظام کرنا اور انہیں ترقی دینا۔
  qualifications:
  - ٹیموں میں مواد کے ڈیزائن کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: درجہ 8a کی کوئی سطح نہیں ہے، کیونکہ UK GDaD PCF لیڈ مواد کے ڈیزائنر کو G7 یا G6 میں رکھتا ہے اور یہ حوالہ تجویز کردہ درجہ 8b کی پیروی کرتا ہے۔ پالیسی سطح 5 ہے کیونکہ لیڈ خدمات کے ایک سلسلے کے لیے مواد کے معیارات طے کرتا ہے؛ جذباتی مشقت سطح 2 ہے، جیسا کہ سینئر مواد کے ڈیزائنروں کے لیے۔
- title: سربراہ مواد کا ڈیزائن
  responsibilities:
  - ایسی مواد کی حکمتِ عملی تیار کرنا جو ادارے کے مقاصد اور مریضوں اور عملے کی ضروریات پوری کرے۔
  - صحت کی معلومات کے مواد اور اس کی طبی یقین دہانی کے لیے ادارے کے معیارات طے کرنا۔
  - بھرتی اور ترقی سمیت مواد کے ڈیزائن کی ایسی ٹیم کی قیادت کرنا جو حکمتِ عملی پر عمل کر سکے۔
  - صحت کی معلومات کے خطرات کا انتظام کرنے کے لیے سینئر طبی اور ابلاغ کے رہنماؤں کے ساتھ کام کرنا۔
  - پورے ادارے میں مواد کے کام کو ترجیح دینا۔
  qualifications:
  - مواد کے ڈیزائن اور مواد کی مشق کی قیادت کا وسیع تجربہ۔
  job_evaluation_notes: UK GDaD PCF لیڈ مواد کے ڈیزائنر اور سربراہ مواد کے ڈیزائن دونوں کو G7 یا G6 میں رکھتا ہے، تجویز کردہ درجہ 8b کے ساتھ۔ یہ حوالہ سربراہ کو درجہ 8c میں رکھتا ہے، صارف مرکوز ڈیزائن کے دوسرے پیشوں کے سربراہوں کے مطابق، کیونکہ سربراہ پورے ادارے کے لیے مواد کی حکمتِ عملی اور معیارات طے کرتا ہے۔
