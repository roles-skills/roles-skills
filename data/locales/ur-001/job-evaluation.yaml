# ملازمت کی جانچ کے عناصر کا اردو ترجمہ۔ کنجیاں انگریزی عناصر کے شناخت کنندے ہیں۔
# پوائنٹس انگریزی فائل کے مطابق ہی رہتے ہیں۔
communication:
  name: ابلاغ اور تعلقات کی مہارتیں
  description: ساتھیوں، مریضوں، عوام اور شراکت داروں سے بات چیت کرنے اور ان کے ساتھ تعلقات بنانے کے لیے درکار مہارتیں۔ اس میں دیکھا جاتا ہے کہ معلومات کتنی پیچیدہ، حساس یا متنازع ہیں، اور سمجھنے یا قبول کرنے میں کیا رکاوٹیں ہیں۔
  levels:
    "1": زیادہ تر ساتھیوں کے ساتھ زبانی طور پر معمول کی معلومات دیتا یا لیتا ہے۔
    "2": ساتھیوں اور دوسروں کے ساتھ زبانی، تحریری یا برقی طور پر معمول کی معلومات دیتا یا لیتا ہے۔
    "3": ایسی معمول کی معلومات دیتا ہے جن میں نرمی یا قائل کرنے کی ضرورت ہو، یا پیچیدہ اور حساس معلومات، یا گروہوں کو سادہ تربیت دیتا ہے۔
    "4": پیچیدہ، حساس یا متنازع معلومات دیتا ہے جن میں قائل کرنے، مذاکرات یا تربیت کی مہارت درکار ہو، یا انتہائی پیچیدہ معلومات۔
    "5": انتہائی پیچیدہ یا متنازع معلومات دیتا ہے جن میں ترقی یافتہ قائل کرنے اور مذاکرات کی مہارت درکار ہو، بڑے گروہوں کو پیش کش کرتا ہے، یا قبولیت میں نمایاں رکاوٹوں کے باوجود ابلاغ کرتا ہے۔
    "6": قبولیت میں نمایاں رکاوٹوں کے باوجود انتہائی پیچیدہ اور انتہائی متنازع معلومات ابلاغ کی اعلیٰ ترین مہارت کے ساتھ دیتا ہے۔
knowledge:
  name: علم، تربیت اور تجربہ
  description: کام کرنے کے لیے درکار علم اور تجربہ، خواہ کسی بھی ذریعے سے ہو، بشمول باضابطہ تربیت، قابلیت اور تجربہ۔
  levels:
    "1": چند معمول کے طریقے، جو مختصر تعارفی تربیت میں کام کے دوران سیکھے جاتے ہیں۔
    "2": معمول کے طریقوں کا ایک سلسلہ، جو کام کے دوران تربیت اور تعارف سے سیکھا جاتا ہے۔
    "3": طریقوں کا ایک سلسلہ، جن میں سے کچھ غیر معمولی ہیں، اور جن کے لیے بنیادی نظریاتی علم درکار ہے (مثلاً سطح 3 کی قابلیت یا اس کے برابر تجربہ)۔
    "4": طریقوں کا ایک سلسلہ، جن میں زیادہ تر غیر معمولی ہیں، اور جن کے لیے درمیانی سطح کا نظریاتی علم درکار ہے (مثلاً فاؤنڈیشن ڈگری یا اس کے برابر تجربہ)۔
    "5": کسی تخصص میں مہارت، جس کی بنیاد نظریے یا عملی تجربے پر ہو (ڈگری کی سطح یا اس کے برابر)۔
    "6": تخصص کے پورے دائرے میں ماہرانہ علم (پوسٹ گریجویٹ ڈپلومہ کی سطح یا اس کے برابر)۔
    "7": تخصص کے پورے دائرے میں اعلیٰ درجے کا ماہرانہ علم (ماسٹرز کی سطح یا اس کے برابر)۔
    "8": اعلیٰ علم (ڈاکٹریٹ اور مزید تربیت یا اس کے برابر)، یا ایک سے زیادہ شعبوں میں ماہرانہ علم جو طویل عرصے میں بنا ہو۔
analytical:
  name: تجزیاتی اور فیصلہ سازی کی مہارتیں
  description: معلومات پر عمل کرنے، مسائل حل کرنے اور فیصلے کرنے کے لیے درکار تجزیہ اور فیصلہ۔
  levels:
    "1": سیدھے سادے حقائق یا حالات پر فیصلے۔
    "2": حقائق یا حالات پر فیصلے، جن میں سے کچھ کے لیے تجزیہ درکار ہے۔
    "3": حقائق یا حالات کے ایک سلسلے پر فیصلے، جن کے لیے تجزیہ یا متبادل کا موازنہ درکار ہے۔
    "4": پیچیدہ حقائق یا حالات پر فیصلے، جن کے لیے تجزیہ، تعبیر اور متبادل کا موازنہ درکار ہے۔
    "5": انتہائی پیچیدہ حقائق یا حالات پر فیصلے، جن کے لیے تجزیہ، تعبیر اور متبادل کا موازنہ درکار ہے۔
planning:
  name: منصوبہ بندی اور تنظیمی مہارتیں
  description: سرگرمیوں، پروگراموں، خدمات یا حکمتِ عملیوں کو چلانے کے لیے درکار منصوبہ بندی اور تنظیم۔
  levels:
    "1": اپنے روزمرہ کے کام کی ترتیب بناتا ہے۔
    "2": سیدھے سادے کاموں یا سرگرمیوں کی منصوبہ بندی کرتا ہے، جن میں سے کچھ جاری رہتی ہیں۔
    "3": کئی پیچیدہ سرگرمیوں کی منصوبہ بندی کرتا ہے اور ضرورت کے مطابق منصوبوں میں رد و بدل کرتا ہے۔
    "4": پیچیدہ سرگرمیوں یا حکمتِ عملیوں کے وسیع سلسلے کی منصوبہ بندی کرتا ہے اور ضرورت کے مطابق ان میں رد و بدل کرتا ہے۔
    "5": طویل مدتی حکمتِ عملی کے منصوبے بناتا ہے، جن میں غیر یقینی صورتِ حال ہوتی ہے اور اثرات پورے ادارے پر پڑتے ہیں۔
physical-skills:
  name: جسمانی مہارتیں
  description: درکار جسمانی مہارتیں، جیسے ہاتھ کی چابکدستی، ہم آہنگی، کی بورڈ کی مہارت اور گاڑی چلانا۔
  levels:
    "1": جسمانی مہارتوں کی ضرورت بہت کم ہے۔
    "2": مشق سے حاصل ہونے والی مہارتیں، جیسے کی بورڈ کا عام استعمال یا گاڑی چلانا۔
    "3": ترقی یافتہ مہارتیں جن میں رفتار یا درستی درکار ہو، جیسے کی بورڈ کا ترقی یافتہ استعمال۔
    "4": انتہائی ترقی یافتہ مہارتیں جن میں باریکی یا رفتار اور ہاتھ اور آنکھ کی اعلیٰ ہم آہنگی درکار ہو۔
    "5": باریکی، رفتار اور ہم آہنگی کی اعلیٰ ترین سطح۔
patient-care:
  name: مریضوں اور گاہکوں کی نگہداشت کی ذمہ داری
  description: مریضوں اور گاہکوں کا جائزہ لینے، ان کا علاج کرنے، ان کی دیکھ بھال کرنے یا انہیں مشورہ دینے کی ذمہ داری۔ زیادہ تر ڈیجیٹل اور کارپوریٹ کرداروں کے لیے یہ محض اتفاقی رابطہ ہے۔
  levels:
    "1": اتفاقی رابطے کے دوران مریضوں، گاہکوں یا رشتہ داروں کی مدد کرتا ہے۔
    "2": مریضوں یا عوام کو براہِ راست عمومی غیر طبی مشورہ، معلومات یا خدمات دیتا ہے۔
    "3": ذاتی نگہداشت، بنیادی طبی تکنیکی خدمات یا بنیادی طبی مشورہ دیتا ہے۔
    "4": طبی نگہداشت انجام دیتا ہے، طبی تکنیکی خدمات فراہم کرتا ہے، یا مریضوں کی نگہداشت کے بارے میں مشورہ دیتا ہے۔
    "5": نگہداشت کے پروگرام بناتا ہے، ماہرانہ طبی تکنیکی خدمات فراہم کرتا ہے، یا مریض کی نگہداشت پر ماہرانہ مشورہ دیتا ہے۔
    "6": ماہرانہ نگہداشت تیار کرتا ہے، انتہائی ماہرانہ مشورہ دیتا ہے، یا طبی خدمت کے ایک حصے کا جواب دہ ہے۔
    "7": طبی یا نگہداشتی خدمت کی فراہمی کا جواب دہ ہے۔
    "8": طبی یا نگہداشتی خدمات کی ادارہ جاتی ذمہ داری۔
policy:
  name: پالیسی اور خدمات کی ترقی کی ذمہ داری
  description: پالیسیوں اور خدمات کو تیار کرنے اور نافذ کرنے کی ذمہ داری، اور یہ کہ ان کے اثرات کہاں تک پہنچتے ہیں۔
  levels:
    "1": دوسروں کی طے کردہ پالیسیوں پر عمل کرتا ہے؛ تبدیلیوں پر رائے دے سکتا ہے۔
    "2": اپنے شعبے کی پالیسیاں نافذ کرتا ہے اور اس کے طریقوں میں تبدیلیاں تجویز کرتا ہے۔
    "3": اپنے شعبے کی پالیسیاں نافذ کرتا ہے اور ایسی تبدیلیاں تجویز کرتا ہے جو دوسرے شعبوں پر اثر ڈالتی ہیں۔
    "4": پالیسی نافذ کرتا ہے اور کسی خدمت یا کئی شعبوں کے لیے پالیسی یا خدمات تیار کرتا ہے۔
    "5": کسی ڈائریکٹوریٹ کے لیے پالیسیوں یا خدمات کا ایک سلسلہ نافذ اور تیار کرتا ہے۔
    "6": پورے ادارے یا اس سے باہر بڑی پالیسی یا خدمات کی ترقی کی ادارہ جاتی ذمہ داری۔
financial-resources:
  name: مالی اور مادی وسائل کی ذمہ داری
  description: رقم، بجٹ، سازوسامان، ذخیرہ، عمارتوں اور دیگر اثاثوں کی ذمہ داری۔
  levels:
    "1": اپنے کام میں استعمال ہونے والے سازوسامان اور وسائل کی ذاتی دیکھ بھال کرتا ہے۔
    "2": نقدی یا قیمتی اشیا سنبھالتا ہے، دوسروں کے استعمال کے سازوسامان کی دیکھ بھال کرتا ہے، ذخیرہ کنٹرول کرتا ہے، یا چھوٹی ادائیگیوں کی منظوری دیتا ہے۔
    "3": ادائیگیوں کی منظوری دیتا ہے، کچھ اثاثے یا سامان خریدتا ہے، تفویض کردہ بجٹ کی نگرانی کرتا ہے یا اسے رکھتا ہے، یا اثاثوں کی دیکھ بھال کرتا ہے۔
    "4": کسی محکمے یا خدمت کا بجٹ رکھتا یا طے کرتا ہے، یا اس کے اثاثے خریدتا یا ان کی دیکھ بھال کرتا ہے۔
    "5": کئی خدمات کے بجٹ رکھتا یا طے کرتا ہے، یا اثاثوں کا انتظام کرتا ہے۔
    "6": ادارے کے مالی معاملات یا اثاثوں کی ادارہ جاتی ذمہ داری۔
people:
  name: افراد کی ذمہ داری
  description: عملے کا انتظام کرنے، ان کی نگرانی کرنے، انہیں تربیت دینے یا ان کی ترقی کی ذمہ داری، یا انسانی وسائل کی خدمات فراہم کرنے کی ذمہ داری۔
  levels:
    "1": نئے یا کم تجربہ کار ساتھیوں کو اپنے کام کے معمولات دکھاتا ہے۔
    "2": روزمرہ عملے کی نگرانی یا ہم آہنگی کرتا ہے، دوسروں کو باقاعدگی سے تربیت دیتا ہے، یا انسانی وسائل کا بنیادی مشورہ دیتا ہے۔
    "3": روزمرہ عملے کے ایک گروہ کا انتظام کرتا ہے، بنیادی یا ماہرانہ تربیت دیتا ہے، یا انسانی وسائل کا بنیادی مشورہ دیتا ہے۔
    "4": کسی شعبۂ کار یا محکمے کا براہِ راست انتظام کرتا ہے، بنیادی فرض کے طور پر تربیتی پروگرام بناتا ہے، یا انسانی وسائل کی پوری خدمات فراہم کرتا ہے۔
    "5": کئی محکموں کا براہِ راست انتظام کرتا ہے، یا پورے ادارے میں تربیت یا انسانی وسائل کے بڑے حصے کا انتظام کرتا ہے۔
    "6": ادارے کے افراد یا انسانی وسائل کے شعبۂ کار کی ادارہ جاتی ذمہ داری۔
information-resources:
  name: معلومات کے وسائل کی ذمہ داری
  description: معلومات اور معلوماتی نظاموں کی ذمہ داری، خواہ کاغذی ہوں یا ڈیجیٹل، بشمول ریکارڈ، ڈیٹا اور انہیں رکھنے والے نظام۔
  levels:
    "1": وہ معلومات درج کرتا ہے جو ملازم خود پیدا کرتا ہے۔
    "2": دوسروں کا مرتب کردہ ڈیٹا درج یا محفوظ کرتا ہے، یا کبھی کبھار رپورٹیں یا سوالات لکھتا ہے۔
    "3": باضابطہ کارروائی قلم بند کرتا ہے، باقاعدگی سے رپورٹیں یا سوالات لکھتا ہے، یا معلوماتی نظاموں کی دیکھ بھال کو اہم فرض کے طور پر انجام دیتا ہے۔
    "4": دوسروں کی وضاحتوں کے مطابق معلوماتی نظام ڈھالتا یا ڈیزائن کرتا ہے، یا مرکزی فرض کے طور پر کسی محکمے کے معلوماتی نظام چلاتا ہے۔
    "5": بڑے معلوماتی نظام ڈیزائن اور تیار کرتا ہے، یا مرکزی فرض کے طور پر کئی خدمات کے معلوماتی نظام چلاتا ہے۔
    "6": مرکزی فرض کے طور پر پورے ادارے کے معلوماتی نظاموں کا انتظام اور ترقی کرتا ہے۔
    "7": ادارے کے معلوماتی نظاموں کی ادارہ جاتی ذمہ داری۔
research:
  name: تحقیق اور ترقی کی ذمہ داری
  description: باضابطہ تحقیق، ترقی، تشخیص، آڈٹ، جانچ اور آزمائشوں کی ذمہ داری۔
  levels:
    "1": اپنے کام کے لیے سروے یا آڈٹ کرتا ہے؛ کبھی کبھار تحقیق یا جانچ میں حصہ لیتا ہے۔
    "2": کام کے حصے کے طور پر باقاعدگی سے تحقیق، ترقی، آزمائشیں، یا سازوسامان اور نظاموں کی جانچ کرتا ہے۔
    "3": مرکزی فرض کے طور پر باضابطہ پروگراموں کے اندر تحقیق یا ترقی کرتا ہے۔
    "4": تحقیق اور ترقی کے پروگراموں کو مربوط کرتا ہے اور انجام دیتا ہے۔
    "5": ادارے کے مقاصد کی معاونت کرنے والے تحقیق اور ترقی کے پروگرام شروع اور تیار کرتا ہے۔
    "6": ایسے تحقیق اور ترقی کے پروگرام شروع اور تیار کرتا ہے جن کے اثرات ادارے سے باہر تک پہنچتے ہیں۔
freedom-to-act:
  name: عمل کی آزادی
  description: ملازم کس حد تک خود طے کرتا ہے کہ کیا کرنا ہے اور کیسے، اور اس کے کام کی کتنی قریب سے نگرانی ہوتی ہے۔
  levels:
    "1": طے شدہ طریقۂ کار کے اندر کام کرتا ہے، قریب ہی نگرانی موجود رہتی ہے۔
    "2": معیاری طریقۂ کار اور نظیر کی پیروی کرتا ہے؛ عموماً پوچھنے کے لیے کوئی دستیاب ہوتا ہے؛ کام کی جانچ ہو سکتی ہے۔
    "3": متعین پالیسیوں اور طریقۂ کار کی پیروی کرتا ہے؛ کام کی نگرانی کے بجائے انتظام ہوتا ہے۔
    "4": نتائج متعین ہیں، مگر ملازم وسیع پالیسی کے اندر خود طے کرتا ہے کہ انہیں کیسے حاصل کرنا ہے۔
    "5": عمومی پالیسیوں کے اندر کام کرتا ہے، اور اکثر معاملات میں خود طے کرتا ہے کہ ان کی تعبیر کیسے کی جائے۔
    "6": مجموعی پالیسی اور حکمتِ عملی کی تعبیر کر کے اہداف اور معیارات طے کرتا ہے۔
physical-effort:
  name: جسمانی مشقت
  description: درکار جسمانی مشقت، اس کی تعدد، دورانیے اور شدت کو مدنظر رکھتے ہوئے۔
  levels:
    "1": بیٹھنا، کھڑا ہونا اور چلنا، جسمانی مشقت بہت کم۔
    "2": محدود حالت میں بار بار بیٹھنا یا کھڑا ہونا، یا کبھی کبھار ہلکی سے درمیانی مشقت۔
    "3": طویل وقت تک بار بار ہلکی مشقت، یا مختصر وقت کے لیے بار بار درمیانی مشقت۔
    "4": مسلسل ہلکی مشقت، طویل وقت تک بار بار درمیانی مشقت، یا کبھی کبھار شدید مشقت۔
    "5": مسلسل درمیانی مشقت، یا بار بار شدید مشقت۔
mental-effort:
  name: ذہنی مشقت
  description: درکار توجہ، اس کی تعدد، دورانیے اور کام کے قابلِ پیش گوئی ہونے کو مدنظر رکھتے ہوئے۔
  levels:
    "1": عمومی توجہ؛ قابلِ پیش گوئی کام پر کبھی کبھار ارتکاز۔
    "2": قابلِ پیش گوئی کام پر بار بار ارتکاز، یا ناقابلِ پیش گوئی کام پر کبھی کبھار ارتکاز۔
    "3": ناقابلِ پیش گوئی کام پر بار بار ارتکاز، یا کبھی کبھار طویل ارتکاز۔
    "4": بار بار طویل ارتکاز، یا کبھی کبھار شدید ارتکاز۔
    "5": بار بار شدید ارتکاز۔
emotional-effort:
  name: جذباتی مشقت
  description: ملازمت کے جذباتی تقاضے، جو تکلیف دہ حالات سے براہِ راست یا بالواسطہ سامنا کرنے سے پیدا ہوتے ہیں، جیسے تکلیف دہ مقدمات کے ریکارڈ پڑھنا یا سنگین واقعات سنبھالنا۔
  levels:
    "1": تکلیف دہ حالات سے شاذ و نادر سامنا، یا کبھی کبھار بالواسطہ سامنا۔
    "2": تکلیف دہ حالات سے کبھی کبھار سامنا، یا بار بار بالواسطہ سامنا۔
    "3": تکلیف دہ حالات سے بار بار سامنا، یا انتہائی تکلیف دہ حالات سے کبھی کبھار سامنا۔
    "4": صدمہ خیز حالات سے کبھی کبھار سامنا، یا انتہائی تکلیف دہ حالات سے بار بار سامنا۔
working-conditions:
  name: کام کے حالات
  description: ناخوشگوار حالات یا خطرات سے سامنا۔ زیادہ تر دنوں میں تقریباً مسلسل اسکرین کا استعمال سطح 2 میں شمار ہوتا ہے۔
  levels:
    "1": ناخوشگوار حالات سے شاذ و نادر سامنا۔
    "2": کبھی کبھار ناخوشگوار حالات، بار بار سفر یا کھلی فضا میں کام، یا زیادہ تر دنوں میں تقریباً مسلسل اسکرین کا استعمال۔
    "3": بار بار ناخوشگوار حالات، یا کبھی کبھار انتہائی ناخوشگوار حالات۔
    "4": خطرات سے کچھ سامنا، یا بار بار انتہائی ناخوشگوار حالات۔
    "5": خطرات سے کافی سامنا۔
