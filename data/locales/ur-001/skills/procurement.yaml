# data/skills/procurement.yaml کا اردو ترجمہ۔ کنجیاں انگریزی مہارت کے شناخت کنندے ہیں۔
proc-purchase-to-pay:
  name: خریداری سے ادائیگی
  description: ادارے کے خریداری کے نظام اور مالی کنٹرول کے ذریعے آرڈر اٹھانا، منظور کرنا اور وصولی کی تصدیق کرنا، اور رسید اور ادائیگی کے سوالات حل کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - "خریداری کے آرڈر کے بغیر ادائیگی نہیں" کے اصول اور اس کی اہمیت کی وضاحت کرنا
      - خریداری کے نظام میں مطالبہ اٹھانا
    working: |
      آپ یہ کر سکتے ہیں:
      - خریداری کے آرڈر بنانا اور ان میں ترمیم کرنا اور انہیں معاہدوں کے مقابلے میں جانچنا
      - سپلائرز اور مالیات کے ساتھ رسید، وصولی اور ادائیگی کے سوالات حل کرنا
      - خریداری کے نظام میں کیٹلاگ اور سپلائر کے ریکارڈ برقرار رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی خدمت کے لیے خریداری سے ادائیگی کا عمل چلانا، تعمیل اور پیچھے رہ جانے والے کام کی نگرانی کرنا
      - معاہدے سے باہر کے خرچ اور بچت کی نشاندہی کے لیے خرچ کے ڈیٹا کا تجزیہ کرنا
      - مالیات کے ساتھیوں کے ساتھ مل کر عمل اور کنٹرول کو بہتر بنانا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی خریداری سے ادائیگی کی پالیسی، کنٹرول اور نظام طے کرنا
      - مکمل برقی خریداری اور رسیدوں کی طرف منتقلی کی قیادت کرنا
proc-procurement-process:
  name: خریداری کا عمل
  description: تعمیل کے مطابق خریداریاں چلانا، منصوبہ بندی اور تصریح سے لے کر بازار تک پہنچنے کے راستے، ٹینڈر، منظوری اور معاہدے پر دستخط تک، بشمول فریم ورک اور متحرک خریداری کے نظاموں سے خریداری۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - خریداری کے مراحل اور لاگو ہونے والی حدوں کی وضاحت کرنا
      - ادارے کے قواعد کی پیروی کرتے ہوئے کم قدر کی خریداریوں کے لیے قیمتیں حاصل کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - معیاری ٹیمپلیٹ استعمال کرتے ہوئے فریم ورک سے قیمتیں اور طلبیاں چلانا
      - ٹینڈر کی دستاویزات تیار کرنا اور برقی ٹینڈر کے نظام پر وضاحتی سوالات کا انتظام کرنا
      - ہر خریداری کا واضح آڈٹ سراغ رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - بازار تک پہنچنے کا درست راستہ اور طریقہ منتخب کرتے ہوئے پیچیدہ ٹینڈروں کی منصوبہ بندی کرنا اور ان کی قیادت کرنا
      - صارفین کی ڈیجیٹل اور طبی نظاموں کے لیے نتائج پر مبنی تصریحات لکھنے میں مدد کرنا
      - معاہدے کی منظوری تک وقت کے نظام الاوقات، خطرات اور اسٹیک ہولڈرز کا انتظام کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے خریداری کے طریقۂ کار اور ٹیمپلیٹ طے کرنا
      - سب سے پیچیدہ، زیادہ قدر یا نئی خریداریوں کی قیادت کرنا
      - بورڈ کے لیے خریداری کے فیصلوں کی یقین دہانی کرنا
proc-tender-evaluation:
  name: ٹینڈر کی جانچ
  description: جانچ کے معیار اور وزن ڈیزائن کرنا، اور معیار، قیمت اور سماجی قدر کی منصفانہ اور اچھی طرح درج کی گئی جانچ چلانا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ جانچ کو شائع شدہ معیار کی پیروی کیوں کرنی چاہیے
      - جانچ میں حصہ لینے سے پہلے مفادات کے ٹکراؤ کا اعلان کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - بولیوں کی تعمیل اور مکملیت کی جانچ کرنا
      - جانچ کرنے والوں کی معاونت کرنا اور اسکور اور اعتدال کے نوٹس درج کرنا
      - رہنمائی کے تحت قیمت کی جانچ کے ماڈل تیار کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - جانچ کے معیار، وزن اور اسکورنگ کی رہنمائی ڈیزائن کرنا
      - اعتدال کی قیادت کرنا اور منظوری کی رپورٹیں اور بولی دہندگان کے لیے رائے لکھنا
      - نظام کے ٹینڈروں کے لیے مظاہروں اور طبی یا صارف کے منظرناموں کی جانچ کی منصوبہ بندی کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے جانچ کے معیارات اور قیمت اور معیار کے طریقے کو طے کرنا
      - جب جانچ کے فیصلوں کو چیلنج کیا جائے تو ان کا دفاع کرنا
      - زیادہ خطرے والی خریداریوں پر جانچ کا جائزہ لینا
proc-procurement-law-and-policy:
  name: سرکاری خریداری کے قواعد اور پالیسی
  description: سرکاری خریداری کے قواعد، ادارے کے مالی قواعد اور خریداری کی پالیسی کو لاگو کرنا تاکہ خریداری قانونی، شفاف اور منصفانہ ہو۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ عوامی رقم منصفانہ، کھلے اور قانونی طور پر خرچ کی جانی چاہیے
      - ادارے کی حدوں اور منظوری کے قواعد پر عمل کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - سیدھی سادی خریداری پر موزوں خریداری کے قواعد لاگو کرنا
      - اعلانات شائع کرنا اور شفافیت کے قواعد پر پورا اترنے والے ریکارڈ رکھنا
      - پہچاننا کہ کب کوئی درخواست قواعد توڑنے کا خطرہ پیدا کرتی ہے اور اسے اٹھانا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - پیچیدہ خریداریوں اور معاہدوں میں تبدیلیوں کے قانونی راستے پر مشورہ دینا
      - چیلنج کے خطرے کا انتظام کرنا اور توقف اور بریفنگ کو درست طور پر سنبھالنا
      - ادارے کے لیے خریداری کی پالیسی اور رہنمائی لکھنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - خریداری کے نئے قواعد کی تعبیر کرنا اور ادارے کے ردعمل کی قیادت کرنا
      - بورڈ کو خریداری کی تعمیل اور خطرے پر مشورہ دینا
      - قانونی مشیروں کے ساتھ مل کر باضابطہ چیلنجوں کا انتظام کرنا
proc-market-analysis:
  name: بازار کا تجزیہ اور رابطہ
  description: رسد کے بازاروں کو سمجھنا، خریداری سے پہلے سپلائرز سے رابطہ کرنا، اور تقاضوں، بازار تک پہنچنے کے راستوں اور تجارتی ماڈلوں کو شکل دینے کے لیے بازار کے شواہد کا استعمال کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - فریم ورک اور سپلائر کے ڈیٹا بیس میں سپلائرز تلاش کرنا
      - وضاحت کرنا کہ بازار سے ابتدائی رابطہ تمام سپلائرز کے لیے منصفانہ کیوں ہونا چاہیے
    working: |
      آپ یہ کر سکتے ہیں:
      - کسی تقاضے کے لیے بازار کی معلومات، قیمتیں اور سپلائر کی تفصیلات جمع کرنا
      - معلومات کی درخواست چلانا اور جوابات کا خلاصہ بنانا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - رسد کے بازار، اس کی مسابقت، خطرات اور رجحانات کا تجزیہ کرنا
      - مسابقت کو بگاڑے بغیر بازار سے ابتدائی رابطے کی قیادت کرنا، جیسے سپلائرز کے دن
      - تقاضوں اور تجارتی ماڈلوں کو شکل دینے کے لیے بازار کے شواہد کا استعمال کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - بازاروں کو شکل دینا، مثلاً نئے یا چھوٹے سپلائرز کی حوصلہ افزائی کر کے
      - دوسرے خریدار اداروں کے ساتھ بازار کی حکمتِ عملی کی قیادت کرنا
proc-negotiation:
  name: تجارتی گفت و شنید
  description: سپلائرز کے ساتھ قیمت، شرائط اور کارکردگی پر اتفاق کے لیے گفت و شنید کی منصوبہ بندی اور انعقاد جو رقم کی قدر دے اور خطرے کا انتظام کرے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ سرکاری خریداری میں کن چیزوں پر گفت و شنید ہو سکتی ہے اور کن پر نہیں
    working: |
      آپ یہ کر سکتے ہیں:
      - کم قدر یا معمول کی خریداریوں کے لیے قیمتوں اور شرائط پر گفت و شنید کرنا
      - دوسروں کی قیادت میں ہونے والی گفت و شنید کے لیے ڈیٹا اور متبادل تیار کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - اہداف، حدود اور متبادل موقف طے کرتے ہوئے گفت و شنید کی منصوبہ بندی کرنا اور اس کی قیادت کرنا
      - معاہدوں میں تبدیلیوں، تجدید اور تنازعات کے تصفیے پر گفت و شنید کرنا
      - گفت و شنید کو قانونی اور اچھی طرح درج رکھنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - حکمتِ عملی کے سپلائرز کے ساتھ زیادہ قدر اور زیادہ خطرے والی گفت و شنید کی قیادت کرنا
      - دوسروں کو گفت و شنید کی تربیت دینا اور ادارے کا گفت و شنید کا طریقہ طے کرنا
proc-category-management:
  name: زمرے کا انتظام
  description: خرچ کے کسی زمرے، جیسے سافٹ ویئر، کلاؤڈ اور ٹیکنالوجی کی خدمات، کا ایسی زمرے کی حکمتِ عملی کے ذریعے انتظام جو طلب کو یکجا کرے، تقاضوں کو شکل دے اور کئی سالوں کی خریداریوں کی منصوبہ بندی کرے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ زمرہ کیا ہے اور زمرے کے منصوبے کیوں اہم ہیں
    working: |
      آپ یہ کر سکتے ہیں:
      - کسی زمرے کے لیے خرچ اور معاہدوں کا تجزیہ کرنا اور معاہدوں کا رجسٹر تازہ رکھنا
      - زمرے کے منصوبے کی معاونت کرنا، جیسے تجدیدوں اور بچتوں کا سراغ رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - بجٹ رکھنے والوں اور تکنیکی رہنماؤں کے ساتھ مل کر زمرے کی حکمتِ عملی لکھنا اور اسے پورا کرنا
      - زمرے کے لیے خریداریوں اور معاہدوں کی تجدید کی راہداری کی منصوبہ بندی کرنا
      - زمرے کے لیے بچتوں، قدر اور خطرات کا سراغ رکھنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے لیے زمرے کے انتظام کا طریقہ طے کرنا
      - سب سے زیادہ خرچ اور خطرے والے زمروں کی قیادت کرنا اور انہیں ادارے کی حکمتِ عملی کے ساتھ ہم آہنگ کرنا
      - مشترکہ خریداری پر دوسرے اداروں کے ساتھ کام کرنا
proc-technology-procurement:
  name: ٹیکنالوجی اور کلاؤڈ کی خریداری
  description: سافٹ ویئر، کلاؤڈ خدمات، لائسنس، ہارڈ ویئر اور ڈیجیٹل خدمات کی خریداری، بشمول خدمت کے طور پر سافٹ ویئر، تجارتی ماڈل، لائسنسنگ، اور سلامتی، ڈیٹا کے تحفظ اور باہمی مطابقت کی وہ شرائط جن کی صحت کی ٹیکنالوجی کو ضرورت ہوتی ہے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ٹیکنالوجی خریدنے کے اہم طریقوں کی وضاحت کرنا، جیسے لائسنس، رکنیتیں اور خدمات
      - پہچاننا کہ طبی نظاموں کو سلامتی، طبی حفاظت اور ڈیٹا کے تحفظ کی جانچ کی ضرورت ہوتی ہے
    working: |
      آپ یہ کر سکتے ہیں:
      - فریم ورک کے ذریعے معیاری سافٹ ویئر، ہارڈ ویئر اور لائسنس خریدنا
      - لائسنس کی تعداد، تجدید اور اضافی ادائیگی کی تاریخوں کا سراغ رکھنا
      - دستاویزات میں سلامتی اور ڈیٹا کے تحفظ کے معیاری تقاضے شامل کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - درست تجارتی ماڈل منتخب کرتے ہوئے کلاؤڈ، خدمت کے طور پر سافٹ ویئر اور طبی نظام خریدنا
      - تکنیکی، طبی حفاظت اور معلومات کے نظم و ضبط کے رہنماؤں کے ساتھ مل کر تقاضے بنانا
      - معاہدوں میں باہمی مطابقت، کھلے معیارات، ڈیٹا کی ملکیت اور اخراج کی شرائط شامل کرنا
      - تجدید کے وقت منتقلی اور مسابقت کی منصوبہ بندی کر کے کسی ایک فراہم کنندہ میں پھنسنے سے بچنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ٹیکنالوجی اور کلاؤڈ کے لیے ادارے کی تجارتی حکمتِ عملی طے کرنا
      - ادارہ جاتی معاہدوں اور حکمتِ عملی کے پلیٹ فارموں پر گفت و شنید کی قیادت کرنا
      - ڈیجیٹل رہنماؤں کو ٹیکنالوجی کے انتخاب کے تجارتی خطرات پر مشورہ دینا
proc-contract-management:
  name: معاہدے کا انتظام
  description: منظوری کے بعد معاہدوں کا انتظام، بشمول آغاز، کارکردگی، ادائیگیاں، تبدیلیاں، تنازعات، تجدید اور اخراج، تاکہ ادارے کو وہ ملے جس کی اس نے ادائیگی کی ہے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - کوئی معاہدہ تلاش کرنا اور اس کی اہم تاریخیں، قدر اور مالک بیان کرنا
      - معاہدے کے رجسٹر میں معاہدوں کی تبدیلیاں اور دستاویزات درج کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - خدمت کی سطحوں اور کارکردگی کے اہم اشاروں کے مقابلے میں سپلائر کی کارکردگی کی نگرانی کرنا
      - معاہدے کے جائزے کی میٹنگیں تیار کرنا اور اقدامات کا سراغ رکھنا
      - معاہدے میں ترامیم پر کارروائی کرنا اور معاہدے کے مقابلے میں رسیدوں کی جانچ کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - معاہدوں کے پورٹ فولیو کا انتظام کرنا، بشمول طبی اور ٹیکنالوجی کے معاہدے
      - جب کارکردگی کم پڑے تو معاہدے کے تدارک، جیسے خدمت کے کریڈٹ، استعمال کرنا
      - خریداری کے قواعد کے اندر تبدیلیوں، تنازعات اور تجدیدوں کا انتظام کرنا
      - اخراج کی ابتدائی منصوبہ بندی کرنا اور معاہدے ختم ہونے سے پہلے اخراج کے منصوبوں کی جانچ کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے معاہدوں کے انتظام کا فریم ورک اور معیارات طے کرنا
      - حکمتِ عملی کے اور زیادہ خطرے والے معاہدوں کے انتظام کی قیادت کرنا
      - بڑے تنازعات حل کرنا اور خاتمے یا دوبارہ خریداری کا فیصلہ کرنا
proc-supplier-relationship-management:
  name: سپلائر کے تعلقات کا انتظام
  description: اہم سپلائرز کے ساتھ حکمتِ عملی کے تعلقات بنانا تاکہ خطرے کا انتظام ہو، کارکردگی بہتر ہو، اور وقت کے ساتھ مصنوعات اور خدمات ترقی پائیں۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ مریضوں کے انحصار والی خدمات کے لیے سپلائرز کے اچھے تعلقات کیوں اہم ہیں
      - سپلائرز کے ساتھ پیشہ ورانہ انداز میں معاملہ کرنا اور رابطے درج کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - سپلائر کے رابطوں، بالا سطح تک پہنچانے کے راستوں اور ریکارڈ کو تازہ رکھنا
      - تقاضوں کے مقابلے میں سپلائر کی مالی صحت اور بیمے کی جانچ کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - سپلائرز کو خطرے اور قدر کے لحاظ سے تقسیم کرنا اور ہر گروہ کے انتظام کی منصوبہ بندی کرنا
      - اہم سپلائرز کے ساتھ حکمتِ عملی کے جائزے چلانا، بشمول روڈ میپ اور بہتری کے منصوبے
      - سپلائر کے خطرات کا انتظام کرنا، جیسے مالی ناکامی، سائبر واقعات اور رسد کی زنجیر کے مسائل
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی سپلائر کے تعلقات کی حکمتِ عملی طے کرنا
      - حکمتِ عملی کے سپلائرز کے ساتھ اعلیٰ سطح کے تعلقات کی قیادت کرنا
      - جب کوئی اہم سپلائر ناکام ہو تو ردعمل کی قیادت کرنا
proc-exit-planning:
  name: اخراج کی منصوبہ بندی اور ڈیٹا کی واپسی
  description: معاہدے کے خاتمے کی منصوبہ بندی اور انتظام، بشمول نئے سپلائر کی طرف منتقلی، ڈیٹا کی واپسی اور حذف کرنا، اور مریضوں اور عملے کے لیے خدمات کا تسلسل۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ ہر معاہدے کو اخراج کے منصوبے کی ضرورت کیوں ہے
      - معاہدے کے اخراج اور ڈیٹا کی واپسی کی شرائط تلاش کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - اخراج کے منصوبوں اور اثاثوں اور ڈیٹا کے رجسٹر کو تازہ رکھنا
      - نوٹس کی مدتوں اور اخراج کے سنگ میلوں کا سراغ رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - تکنیکی، ڈیٹا اور طبی رہنماؤں کے ساتھ مل کر اخراج اور منتقلی کے منصوبے لکھنا
      - یقینی بنانا کہ ڈیٹا قابلِ استعمال، معیاری شکلوں میں واپس کیا جائے اور پھر محفوظ طریقے سے حذف کیا جائے
      - منتقلی کے خطرات کا انتظام کرنا تاکہ نگہداشت میں خلل نہ پڑے
    expert: |
      آپ یہ کر سکتے ہیں:
      - اخراج، منتقلی اور ڈیٹا کی واپسی کے لیے ادارے کے معیارات طے کرنا
      - حکمتِ عملی کے طبی اور ٹیکنالوجی کے معاہدوں سے اخراج کی قیادت کرنا
proc-social-value:
  name: سماجی قدر اور پائیدار خریداری
  description: خریداری اور معاہدوں کو سماجی قدر، ماحولیاتی پائیداری اور منصفانہ رسد کی زنجیروں کی فراہمی کے لیے استعمال کرنا، اور سپلائرز جو فراہم کرتے ہیں اسے ناپنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ ادارے کے لیے سماجی قدر اور پائیدار خریداری کا کیا مطلب ہے
    working: |
      آپ یہ کر سکتے ہیں:
      - ٹینڈروں میں سماجی قدر اور پائیداری کے معیاری سوالات شامل کرنا
      - سپلائرز سے سماجی قدر کی رپورٹیں جمع کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - معاہدے کے مطابق سماجی قدر اور پائیداری کے معیار طے کرنا
      - سپلائر کے وعدوں کا انتظام کرنا، جیسے مقامی ملازمتیں، مہارتیں اور کاربن میں کمی
      - رسد کی زنجیروں میں جبری مشقت اور انسانی حقوق کی دیگر خلاف ورزیوں جیسے خطرات کی جانچ کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی سماجی قدر اور پائیدار خریداری کی پالیسی طے کرنا
      - بورڈ کو سماجی قدر اور کاربن کے نتائج پر رپورٹ دینا
