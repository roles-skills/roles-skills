# data/skills/corporate-services.yaml کا اردو ترجمہ۔ کنجیاں انگریزی مہارت کے شناخت کنندے ہیں۔
corp-administration:
  name: دفتری انتظامیہ
  description: وہ انتظامی عمل چلانا جو کسی ٹیم یا خدمت کو کام کرتا رکھتے ہیں، جیسے فائلنگ، آرڈر دینا، ڈیٹا اندراج، ریکارڈ، اور دفتری طریقۂ کار پر عمل۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - فائلنگ، آرڈر دینے اور ڈیٹا اندراج کے دفتری طریقۂ کار پر عمل کرنا
      - اپنے کام کے درست ریکارڈ رکھنا
    working: |
      آپ یہ کر سکتے ہیں:
      - کم نگرانی کے ساتھ کسی ٹیم کے لیے انتظامی عمل کا ایک سلسلہ چلانا
      - ریکارڈ اور ڈیٹا میں غلطیاں تلاش کرنا اور درست کرنا
      - کام کے سادہ طریقے تجویز کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی خدمت یا ڈائریکٹوریٹ کے لیے انتظامی معاونت کو منظم کرنا
      - انتظامی طریقۂ کار لکھنا اور بہتر بنانا
      - دوسرے منتظمین کو تربیت دینا اور ان کے کام کی جانچ کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - پورے ادارے میں انتظامی خدمات ڈیزائن کرنا
      - سادہ، ڈیجیٹل انتظامی عمل کی طرف منتقلی کی قیادت کرنا
corp-office-software:
  name: ڈیجیٹل دفتری آلات
  description: ورڈ پروسیسنگ، اسپریڈ شیٹ، پریزنٹیشن، ای میل، مشترکہ دستاویزات اور تعاون کے آلات کو تیزی اور درستی سے استعمال کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - دستاویزات، ای میل اور سادہ اسپریڈ شیٹ بنانا اور ان میں ترمیم کرنا
      - فائلوں کو درست جگہ پر محفوظ اور شیئر کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - اچھی طرح ترتیب دی گئی دستاویزات اور پریزنٹیشن تیزی اور درستی سے تیار کرنا
      - ڈیٹا کو ترتیب دینے، چھاننے اور اس کا خلاصہ بنانے کے لیے اسپریڈ شیٹ استعمال کرنا
      - مشترکہ دستاویزات اور ورژنوں کا انتظام کرنے کے لیے تعاون کے آلات استعمال کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - ٹیمپلیٹ، ٹریکر اور سادہ خودکار کام کے بہاؤ بنانا
      - دستاویزات کو سب کے لیے قابلِ رسائی بنانا
      - ساتھیوں کی مدد کرنا کہ وہ دفتری آلات سے زیادہ سے زیادہ فائدہ اٹھائیں
    expert: |
      آپ یہ کر سکتے ہیں:
      - ٹیمپلیٹ، دستاویزات کے انتظام اور تعاون کے آلات کے معیارات طے کرنا
      - پورے ادارے میں نئے دفتری آلات اپنانے کی قیادت کرنا
corp-diary-and-meeting-management:
  name: ڈائری اور میٹنگوں کا انتظام
  description: ڈائریوں، میٹنگوں اور سفر کا انتظام تاکہ لوگوں کا وقت اچھی طرح استعمال ہو اور میٹنگوں میں درست لوگ، کاغذات اور کمرے ہوں۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے آلات استعمال کرتے ہوئے میٹنگیں اور کمرے بک کرنا
      - دعوت نامے اور کاغذات بروقت بھیجنا
    working: |
      آپ یہ کر سکتے ہیں:
      - ٹیم کی ڈائریوں کا انتظام کرنا اور ٹکراؤ حل کرنا
      - بیرونی شراکت داروں کے ساتھ سفر، تقریبات اور میٹنگوں کا انتظام کرنا
      - یقینی بنانا کہ میٹنگوں سے پہلے کاغذات اور اقدامات تیار ہوں
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی سینئر رہنما کی ڈائری کا انتظام کرنا اور ان کے ساتھ مل کر ترجیحات طے کرنا
      - فیصلہ کرنا کہ کن چیزوں کے لیے ان کا وقت درکار ہے اور کن کو دوسرے سنبھال سکتے ہیں
      - بورڈ یا قیادتی ٹیم کی میٹنگوں کے سالانہ چکر کی منصوبہ بندی کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - انتظامی ٹیم کے لیے کاروباری چکر چلانا
      - یقینی بنانا کہ سینئر رہنماؤں کا وقت ادارے کی ترجیحات پر مرکوز رہے
corp-minute-taking:
  name: کارروائی قلم بند کرنا اور میٹنگ کے ریکارڈ
  description: گفتگو، فیصلوں اور اقدامات کو درستی اور اختصار کے ساتھ ریکارڈ کرنا، اور میٹنگوں کے باضابطہ ریکارڈ رکھنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ٹیم کی میٹنگوں میں اقدامات اور فیصلوں کے نوٹس لینا
    working: |
      آپ یہ کر سکتے ہیں:
      - معمول کی میٹنگوں کی درست، مختصر کارروائی اور اقدامات کے اندراج لکھنا
      - اقدامات کے مالکان کے ساتھ ان کی پیروی کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - بورڈ اور کمیٹی کی میٹنگوں کی باضابطہ کارروائی قلم بند کرنا، بشمول پیچیدہ یا متنازع گفتگو
      - میٹنگوں کے ایسے باضابطہ ریکارڈ رکھنا جو آڈٹ اور تحقیقات میں ٹھہر سکیں
      - صدرِ مجلس کو مشورہ دینا کہ ریکارڈ میں کیا دکھایا جانا چاہیے
    expert: |
      آپ یہ کر سکتے ہیں:
      - پورے ادارے میں میٹنگوں کے باضابطہ ریکارڈ کے معیارات طے کرنا
      - کارروائی قلم بند کرنے والوں کو تربیت دینا اور ان کے کام کے معیار کی جانچ کرنا
corp-correspondence-management:
  name: خط و کتابت اور استفسارات کی دیکھ بھال
  description: خطوط، ای میلوں، فون کالوں اور استفسارات کو فوری اور شائستگی سے سنبھالنا اور انہیں درست شخص تک پہنچانا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - فون کالوں اور ای میلوں کا شائستگی سے جواب دینا اور درست پیغامات لینا
      - استفسارات کو درست شخص تک پہنچانا
    working: |
      آپ یہ کر سکتے ہیں:
      - معمول کی خط و کتابت اور استفسارات خود سنبھالنا
      - دوسروں کے دستخط کے لیے خطوط اور جوابات کا مسودہ بنانا
      - خط و کتابت کے اندراج رکھنا اور جوابات کی یاد دہانی کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی سینئر رہنما کی خط و کتابت کا انتظام کرنا، بشمول حساس خطوط اور شکایتی خطوط
      - ایسے جوابات کا مسودہ بنانا جن میں نرمی، درستی اور فیصلے کی ضرورت ہو
      - یقینی بنانا کہ جوابات آخری تاریخوں کے اندر دیے جائیں
    expert: |
      آپ یہ کر سکتے ہیں:
      - اعلیٰ افسران کی خط و کتابت کے لیے عمل اور معیارات طے کرنا
      - انتہائی حساس خط و کتابت سنبھالنا، بشمول ریگولیٹرز، شراکت داروں اور ذرائع ابلاغ کے ساتھ
corp-pmo-reporting:
  name: منصوبے اور پورٹ فولیو دفتر کی معاونت
  description: منصوبے اور پورٹ فولیو دفتر کے عمل چلانا، جیسے منصوبے، رجسٹر، رپورٹنگ، دستاویزات پر کنٹرول اور یقین دہانی کی جانچ۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - منصوبے کی دستاویزات کو ورژن کنٹرول کے ساتھ درست جگہ پر رکھنا
      - کہنے پر اقدامات، خطرات اور مسائل کے اندراج کو اپ ڈیٹ کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - کئی منصوبوں کے لیے منصوبے، رجسٹر اور ٹریکر برقرار رکھنا
      - تازہ ترین معلومات جمع کرنا اور باقاعدہ صورتِ حال کی رپورٹیں تیار کرنا
      - جانچنا کہ منصوبے طے شدہ طریقے پر چل رہے ہیں
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - پورٹ فولیو کی رپورٹنگ ڈیزائن کرنا اور منصوبوں میں پیش رفت، خطرات اور فوائد کا تجزیہ کرنا
      - یقین دہانی کی جانچ اور گیٹ وے جائزے چلانا
      - منصوبے کے منیجروں کو طریقے اور کنٹرول پر مشورہ دینا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے لیے پورٹ فولیو دفتر قائم کرنا اور اس کی قیادت کرنا
      - سینئر رہنماؤں کو پورٹ فولیو کے بارے میں واضح اور قابلِ اعتماد بصیرت دینا
      - منصوبے اور پورٹ فولیو کے انتظام کے معیارات اور آلات طے کرنا
corp-assurance-and-audit:
  name: یقین دہانی اور آڈٹ سے رابطہ
  description: اس بات کی یقین دہانی جمع کرنا کہ کنٹرول کام کرتے ہیں، اندرونی اور بیرونی آڈٹ کی معاونت کرنا، اور آڈٹ کی سفارشات کو تکمیل تک ان کا سراغ رکھنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ ادارے میں آڈٹ اور یقین دہانی کیسے کام کرتے ہیں
      - پوچھے جانے پر شواہد فراہم کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - آڈٹ اور معائنوں کے لیے شواہد کو مربوط کرنا
      - آڈٹ کی سفارشات کا سراغ رکھنا اور تاخیر والے اقدامات کی یاد دہانی کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے اہم خطرات پر یقین دہانی کی نقشہ سازی کی منصوبہ بندی کرنا
      - دائرہ کار اور نتائج پر اتفاق کے لیے اندرونی اور بیرونی آڈیٹرز کے ساتھ کام کرنا
      - کمیٹیوں کو یقین دہانی کے خلا پر رپورٹ دینا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کا یقین دہانی کا فریم ورک ڈیزائن کرنا
      - آڈٹ کمیٹی اور بورڈ کو یقین دہانی کی مضبوطی پر مشورہ دینا
corp-policy-management:
  name: پالیسی کا انتظام
  description: ادارے کی پالیسیاں اور طریقۂ کار لکھنا، ان کا جائزہ لینا، منظور کرنا اور شائع کرنا، اور جانچنا کہ لوگ ان پر عمل کرتے ہیں۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - اپنے کام پر لاگو ہونے والی پالیسیاں تلاش کرنا اور ان پر عمل کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - پالیسی کا رجسٹر تازہ رکھنا اور مالکان کو جائزوں کی یاد دلانا
      - جانچنا کہ پالیسیاں درست ٹیمپلیٹ اور منظوری کے راستے کا استعمال کرتی ہیں
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - موضوع کے ماہرین کے ساتھ مل کر پالیسیوں کا مسودہ بنانا اور جائزہ لینا
      - پالیسیوں کو قانون، معیارات اور مساوات کے فرائض کے مقابلے میں جانچنا
      - تعمیل کی نگرانی کرنا اور خلا کی اطلاع دینا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے لیے پالیسی کا فریم ورک طے کرنا
      - بورڈ کو پالیسی کی ترجیحات اور خطرات پر مشورہ دینا
corp-internal-communications:
  name: اندرونی ابلاغ
  description: انٹرانیٹ، خبرناموں، بریفنگ اور تقریبات جیسے ذرائع سے عملے کو باخبر اور مصروف رکھنا، خاص طور پر تبدیلی کے دوران۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - اندرونی ذرائع، جیسے انٹرانیٹ، پر مواد شائع کرنا
      - ادارے کے اسلوب اور لہجے کی پیروی کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - عملے کے لیے خبریں، بریفنگ اور خبرنامے لکھنا اور ان کی تدوین کرنا
      - اندرونی ذرائع کے مواد کی منصوبہ بندی کرنا اور شمولیت کو ناپنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - بڑی تبدیلی، جیسے نئے طبی نظام، کے لیے اندرونی ابلاغ کی منصوبہ بندی کرنا
      - رہنماؤں کو مشورہ دینا کہ عملے کو کیسے شامل کیا جائے اور مشکل پیغامات کو کیسے سنبھالا جائے
      - ذرائع کو بہتر بنانے کے لیے رائے اور ڈیٹا کا استعمال کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - اندرونی ابلاغ اور عملے کی شمولیت کی حکمتِ عملی طے کرنا
      - انتظامی ٹیم کو ثقافت اور شمولیت پر مشورہ دینا
corp-media-relations:
  name: ذرائع ابلاغ سے تعلقات
  description: صحافیوں کے ساتھ تعلقات بنانا، ذرائع ابلاغ کے استفسارات سنبھالنا، اخباری بیانات لکھنا اور ترجمانوں کو تیار کرنا، بشمول واقعات کے دوران۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ ادارہ ذرائع ابلاغ کے استفسارات کو کیسے سنبھالتا ہے
      - ذرائع ابلاغ کے استفسارات فوری طور پر ابلاغ کی ٹیم تک پہنچانا
    working: |
      آپ یہ کر سکتے ہیں:
      - ذرائع ابلاغ کے معمول کے استفسارات درج کرنا اور ان کا جواب دینا
      - منظوری کے لیے اخباری بیانات اور اعلانات کا مسودہ بنانا
      - ذرائع ابلاغ کی کوریج کی نگرانی کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - حساس اور فوری ردعمل والے استفسارات سنبھالنا، بشمول واقعات یا ڈیٹا کی خلاف ورزیوں کے بارے میں
      - ترجمانوں کو بریف کرنا اور تیار کرنا
      - صحت اور ٹیکنالوجی کے صحافیوں کے ساتھ تعلقات بنانا
    expert: |
      آپ یہ کر سکتے ہیں:
      - بڑے واقعات اور بحرانوں کے دوران ذرائع ابلاغ سے نمٹنے کی قیادت کرنا
      - سینئر اسٹیک ہولڈرز کے ساتھ ادارے کی ساکھ کی حفاظت کرنا اور اسے بڑھانا
      - بورڈ کو ساکھ کے خطرے پر مشورہ دینا
corp-communications-strategy:
  name: ابلاغ کی حکمتِ عملی اور منصوبہ بندی
  description: ایسے ابلاغ اور مہمات کی منصوبہ بندی جو ادارے کے اہداف پورے کریں، سامعین کی بصیرت کا استعمال کرتے ہوئے، اور ان کے اثر کی تشخیص۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - جس ابلاغی منصوبے پر آپ کام کر رہے ہیں اس کے مقاصد کی وضاحت کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - منصوبوں کے لیے سامعین، پیغامات اور ذرائع کے ساتھ ابلاغی منصوبے لکھنا
      - ابلاغی سرگرمی کے نتائج ناپنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - ایسی مہمات کی منصوبہ بندی کرنا جو رویہ بدلیں، جیسے مریضوں کو ڈیجیٹل خدمت استعمال کرنے کی ترغیب دینا
      - مہمات کو بہتر بنانے کے لیے سامعین کی بصیرت اور تشخیص کا استعمال کرنا
      - واقعات اور خدمات کی بندش کے لیے ابلاغ کی منصوبہ بندی کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے لیے ابلاغ کی حکمتِ عملی طے کرنا
      - بحران کے ابلاغ کی قیادت کرنا
      - بورڈ کو ساکھ اور اسٹیک ہولڈرز کی شمولیت پر مشورہ دینا
