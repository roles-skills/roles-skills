# data/skills/human-resources.yaml کا اردو ترجمہ۔ کنجیاں انگریزی مہارت کے شناخت کنندے ہیں۔
hr-hr-administration:
  name: انسانی وسائل کی انتظامیہ
  description: ملازمت کے لائف سائیکل کے انتظامی عمل کو درستی اور رازداری کے ساتھ چلانا، معاہدوں اور نئے آنے والوں سے لے کر تبدیلیوں، غیر حاضری کے ریکارڈ اور رخصت ہونے والوں تک۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - نئے آنے والوں، تبدیلیوں اور رخصت ہونے والوں کے لیے ادارے کے طریقۂ کار پر عمل کرنا
      - ذاتی ریکارڈ کو رازدارانہ اور تازہ رکھنا
    working: |
      آپ یہ کر سکتے ہیں:
      - معاہدے، ترمیمی خطوط اور ملازمت کی جانچ درست طور پر تیار کرنا
      - انسانی وسائل اور تنخواہ کے نظام میں تبدیلیوں پر آخری تاریخوں کے مطابق کارروائی کرنا
      - انسانی وسائل کے عمل کے بارے میں منیجروں اور عملے کے معمول کے سوالات کا جواب دینا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - انسانی وسائل کی انتظامی خدمت چلانا، معیار کی جانچ کرنا اور خدمت کے معیارات پورے کرنا
      - عمل اور ٹیمپلیٹ بہتر بنانا، اور جہاں ممکن ہو معمول کے مراحل کو خودکار بنانا
      - پیچیدہ یا غیر معمولی معاملات حل کرنا، جیسے زائد ادائیگیاں یا معاہدے کی غلطیاں
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے لیے انسانی وسائل کا آپریٹنگ ماڈل اور خدمت کے معیارات ڈیزائن کرنا
      - ڈیجیٹل، خود خدمتی انسانی وسائل کے عمل کی طرف منتقلی کی قیادت کرنا
      - ایسے کنٹرول طے کرنا جو انسانی وسائل اور تنخواہ کے ڈیٹا کو درست اور قانونی رکھیں
hr-employment-policy:
  name: ملازمت کا قانون اور افراد کی پالیسی
  description: ملازمت کے قانون کو لاگو کرنا اور ادارے کی افرادی پالیسیوں کو لکھنا، ان کی تعبیر کرنا اور ان کا جائزہ لینا تاکہ عملے کے ساتھ قانونی، منصفانہ اور یکساں سلوک ہو۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - اہم افرادی پالیسیوں اور ان کے مل جانے کی جگہ کی وضاحت کرنا
      - پہچاننا کہ کب کسی سوال کے لیے انسانی وسائل کے مشیر کا مشورہ درکار ہے
    working: |
      آپ یہ کر سکتے ہیں:
      - افرادی پالیسیوں کو معمول کے معاملات پر لاگو کرنا اور منیجروں کو ان کی وضاحت کرنا
      - کسی پالیسی کے پیچھے ملازمت کے قانون کے اصولوں کی نشاندہی کرنا
      - پالیسی کے ریکارڈ رکھنا اور پالیسی کے جائزے کی تاریخوں کا سراغ رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - پیچیدہ معاملات کے لیے ملازمت کے قانون اور پالیسی کی تعبیر کرنا اور خطرے پر مشورہ دینا
      - مساوات کے اثرات کے جائزوں کے ساتھ افرادی پالیسیوں کا مسودہ بنانا اور ان کا جائزہ لینا
      - پالیسی کی تبدیلیوں پر عملے کے نمائندوں سے مشاورت کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کا افرادی پالیسی کا فریم ورک اور قانونی خطرے سے نمٹنے کا طریقہ طے کرنا
      - ملازمت کے قانون میں تبدیلیوں کا اندازہ لگانا اور ادارے کے ردعمل کی منصوبہ بندی کرنا
      - بورڈ کو ملازمت کے خطرے اور ذمہ داری پر مشورہ دینا
hr-employee-relations:
  name: ملازمین کے تعلقات کے مقدمات کی دیکھ بھال
  description: ملازمین کے تعلقات کے باضابطہ اور غیر رسمی مقدمات، جیسے طرزِ عمل، اہلیت، شکایت، حاضری اور کام پر وقار، کو منصفانہ طور پر اور پالیسی اور ملازمت کے قانون کے مطابق سنبھالنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - طرزِ عمل، اہلیت، شکایت اور حاضری کے طریقۂ کار کے اہم مراحل کی وضاحت کرنا
      - باضابطہ میٹنگوں میں درست نوٹس لینا اور مقدمے کے ریکارڈ کو رازدارانہ رکھنا
    working: |
      آپ یہ کر سکتے ہیں:
      - منیجروں کو سیدھے سادے معاملات اور طریقۂ کار کے اگلے قدم پر مشورہ دینا
      - تحقیقات کی معاونت کرنا، مقدمے کے کاغذات تیار کرنا اور سماعتوں کا انتظام کرنا
      - انفرادی معاملات پر عملے کے نمائندوں کے ساتھ تعمیری طور پر کام کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - پیچیدہ مقدمات کا بوجھ سنبھالنا اور سماعت کے پینلوں کو منصفانہ نتائج پر مشورہ دینا
      - تحقیقات کرنا یا ان کی قیادت کرنا، بشمول وہ جو واقعات یا حفاظتی تدابیر سے جڑی ہوں
      - تنازعات کے بڑھنے سے پہلے انہیں حل کرنے کے لیے ابتدائی حل اور ثالثی کا استعمال کرنا
      - مقدمات میں رجحانات کو پہچاننا اور ان کی وجوہات پر عمل کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے ملازمین کے تعلقات اور شراکت دارانہ کام کے طریقے کی قیادت کرنا
      - انتہائی حساس یا زیادہ خطرے والے مقدمات سنبھالنا، بشمول ملازمت کے دعوے
      - اجتماعی معاہدوں پر گفت و شنید کرنا اور اجتماعی تنازعات حل کرنا
hr-recruitment-and-selection:
  name: بھرتی اور انتخاب
  description: لوگوں کو منصفانہ اور مؤثر طریقے سے متوجہ کرنا، جانچنا اور مقرر کرنا، ملازمت کے ڈیزائن اور اشتہار سے لے کر مختصر فہرست، جانچ، پیشکش اور ملازمت سے پہلے کی جانچ تک۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ادارے کے بھرتی کے عمل کے مراحل کی وضاحت کرنا
      - ملازمت سے پہلے کی جانچ سمیت منصفانہ اور محفوظ بھرتی کے قواعد پر عمل کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - درخواست دہندگان کے سراغ کے نظام کے ذریعے بھرتی کی مہمات چلانا
      - اشتہارات، مختصر فہرست اور انٹرویو کے انتظامات میں منیجروں کی مدد کرنا
      - ملازمت سے پہلے کی جانچ مکمل کرنا اور مشروط پیشکشیں کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - منیجروں کو ملازمت کے ڈیزائن، انتخاب کے طریقوں اور منصفانہ جانچ پر مشورہ دینا
      - ماہرانہ کرداروں کے لیے جانچ ڈیزائن کرنا، جیسے ڈیجیٹل کرداروں کے لیے تکنیکی مشقیں
      - بھرتی میں لگنے والے وقت، معیار اور تنوع کو بہتر بنانے کے لیے بھرتی کے ڈیٹا کا تجزیہ کرنا
      - امیدوار کے تجربے اور آجر کے برانڈ کا انتظام کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی بھرتی کی حکمتِ عملی اور خدمت کے معیارات طے کرنا
      - بھرتی کی ٹیکنالوجی اور ایجنسیوں کے انتخاب اور استعمال کی قیادت کرنا
      - یقینی بنانا کہ پورے ادارے میں بھرتی شمولیتی اور قانونی ہو
hr-talent-attraction:
  name: ہنر مند افراد کو متوجہ کرنا اور تلاش
  description: آجر کی برانڈنگ، براہِ راست تلاش، نیٹ ورکس اور ابتدائی کیریئر کے راستوں کے ذریعے کمیاب مہارتوں والے لوگوں، جیسے ڈیجیٹل، ڈیٹا اور ٹیکنالوجی کے ماہرین، کو تلاش کرنا اور ان سے رابطہ کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ کن مہارتوں کے لیے بھرتی مشکل ہے اور کیوں
      - ملازمت کے اشتہارات کو ادارے کے ذرائع اور نیٹ ورکس کے ذریعے شیئر کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - ایسے اشتہارات لکھنا جو ماہر امیدواروں کو متوجہ کریں اور سادہ زبان استعمال کریں
      - امیدواروں کے لیے ملازمت کے بورڈوں، پیشہ ورانہ نیٹ ورکس اور ہنر مند افراد کے ذخیروں میں تلاش کرنا
      - تقریبات کی معاونت کرنا، جیسے کیریئر میلے اور کھلے دن
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کمیاب ڈیجیٹل اور ڈیٹا کرداروں کے لیے ہنر مند افراد کی راہداریاں اور برادریاں بنانا
      - بھرتی کرنے والی ٹیموں کے ساتھ مل کر آجر کی قدر کی پیشکش کو شکل دینا
      - بھرنے میں مشکل کرداروں پر مشورہ دینے کے لیے تنخواہ اور رسد کے بازار کے ڈیٹا کا استعمال کرنا
      - ابتدائی کیریئر کے راستے بنانا، جیسے اپرنٹس شپ اور گریجویٹ اسکیمیں
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی ہنر مند افراد کو متوجہ کرنے کی حکمتِ عملی اور آجر کا برانڈ طے کرنا
      - ہنر مند افراد کی رسد بڑھانے کے لیے شراکت داروں، جیسے جامعات اور دیگر آجروں، کے ساتھ کام کرنا
      - اضافی تنخواہ، ایجنسیوں کے استعمال اور متبادل تلاش کے ماڈلوں پر فیصلوں کی قیادت کرنا
hr-workforce-planning:
  name: افرادی قوت کی منصوبہ بندی
  description: ادارے کو درکار افرادی قوت کی پیش گوئی کرنا، اس کا موازنہ موجودہ افرادی قوت سے کرنا، اور بھرتی، ترقی، ازسرِنو ڈیزائن اور برقرار رکھنے کے ذریعے خلا کو پُر کرنے کی منصوبہ بندی کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ محفوظ اور پائیدار خدمات کے لیے افرادی قوت کی منصوبہ بندی کیوں اہم ہے
      - منظور شدہ آسامیوں اور خالی آسامیوں کی درست معلومات فراہم کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - منیجروں سے افرادی قوت کے منصوبے کا ڈیٹا جمع کرنا اور اس کی جانچ کرنا
      - سادہ منظرناموں کا ماڈل بنانا، جیسے عملے کے چھوڑ جانے اور خالی آسامیوں کے رجحانات
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی ڈائریکٹوریٹ کے لیے افرادی قوت کی منصوبہ بندی کی قیادت کرنا اور اسے خدمات اور مالی منصوبوں سے جوڑنا
      - مہارتوں کے خلا کی نشاندہی کرنا اور انہیں پُر کرنے کے طریقوں کی سفارش کرنا
      - نئے کرداروں، کیریئر کے راستوں اور مہارتوں کے امتزاج کی منصوبہ بندی کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی افرادی قوت کی حکمتِ عملی اور طویل مدتی منصوبہ طے کرنا
      - مالیات اور خدمات کے رہنماؤں کے ساتھ مل کر خدمات میں افرادی قوت کے مفاہمتی فیصلے کرنا
      - صحت اور نگہداشت کے نظام کے شراکت داروں کے ساتھ مل کر افرادی قوت کے منصوبوں کو شکل دینا
hr-workforce-information:
  name: افرادی قوت کی معلومات اور انسانی وسائل کے نظام
  description: انسانی وسائل اور افرادی قوت کے نظاموں اور ڈیٹا کا انتظام کرنا، اور افرادی قوت کے ڈیٹا کو رپورٹوں اور بصیرت میں بدلنا، جیسے عملے کے چھوڑ جانے، غیر حاضری، خالی آسامیوں، تنوع اور تنخواہ کے فرق کا تجزیہ۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - انسانی وسائل کے نظام میں افرادی قوت کا ڈیٹا درست طور پر درج کرنا
      - وضاحت کرنا کہ افرادی قوت کا ڈیٹا درست اور رازدارانہ کیوں ہونا چاہیے
    working: |
      آپ یہ کر سکتے ہیں:
      - افرادی قوت کی معیاری رپورٹیں چلانا اور ان میں غلطیوں کی جانچ کرنا
      - افرادی قوت کے بارے میں معلومات کی معمول کی درخواستوں کا جواب دینا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - رجحانات تلاش کرنے کے لیے افرادی قوت کے ڈیٹا کا تجزیہ کرنا اور منیجروں کو ان کی وضاحت کرنا
      - افرادی قوت کے اشاروں کے لیے ڈیش بورڈ اور رپورٹیں ڈیزائن کرنا
      - قانونی اور مساوات کی رپورٹنگ تیار کرنا، جیسے تنخواہ کے فرق کا تجزیہ
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی افرادی قوت کی معلومات کی حکمتِ عملی اور ڈیٹا کے معیارات طے کرنا
      - انسانی وسائل کے نظاموں کے انتخاب اور ترقی کی قیادت کرنا
      - بورڈ کے فیصلوں کو باخبر کرنے کے لیے افرادی قوت کی بصیرت کا استعمال کرنا
hr-reward-and-job-evaluation:
  name: معاوضہ اور ملازمت کی جانچ
  description: تنخواہ اور معاوضے کے قواعد لاگو کرنا، اور ملازمتوں کو ملازمت کی جانچ کی اسکیم کے مطابق یکساں طور پر جانچنا تاکہ انہیں درست درجے میں رکھا جائے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ تنخواہ کے درجے، اضافے اور الاؤنس کیسے کام کرتے ہیں
      - وضاحت کرنا کہ ملازمتوں کا درجہ ملازمت کی جانچ سے طے ہوتا ہے، ملازمت میں موجود شخص سے نہیں
    working: |
      آپ یہ کر سکتے ہیں:
      - تنخواہ کے قواعد لاگو کرنا، جیسے ابتدائی تنخواہ، تحفظ اور الاؤنس
      - جانچنا کہ جانچ کے لیے جانے سے پہلے ملازمت کی تفصیلات مکمل ہیں
      - تربیت یافتہ رکن کے طور پر ملازمت کی جانچ کے پینلوں میں حصہ لینا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - ملازمت کی جانچ کے پینلوں اور یکسانیت کی جانچ کی قیادت کرنا
      - نئے اور تبدیل شدہ کرداروں، بشمول ڈیجیٹل اور ڈیٹا کرداروں، کے درجے پر مشورہ دینا
      - بازار کے شواہد کی مدد سے بھرتی اور برقرار رکھنے کے اضافی معاوضوں پر مشورہ دینا
    expert: |
      آپ یہ کر سکتے ہیں:
      - طے شدہ تنخواہ کے فریم ورک کے اندر ادارے کی معاوضے کی حکمتِ عملی طے کرنا
      - پورے ادارے میں ملازمت کی جانچ کی سالمیت کی یقین دہانی کرنا
      - مساوی تنخواہ کے جائزوں کی قیادت کرنا اور ان کے نتائج پر عمل کرنا
hr-learning-design-and-delivery:
  name: تعلم کا ڈیزائن اور فراہمی
  description: سیکھنے کی ضروریات کا تجزیہ کرنا، پھر سیکھنے کو بالمشافہ، آن لائن اور کام کے بہاؤ میں ڈیزائن کرنا، فراہم کرنا اور اس کی تشخیص کرنا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - تربیت، تعلم اور ترقی کے فرق کی وضاحت کرنا
      - کورسوں کے انعقاد میں مدد دینا اور تربیت کے ریکارڈ رکھنا
    working: |
      آپ یہ کر سکتے ہیں:
      - اچھی طرح متعین تربیتی نشستیں بالمشافہ اور آن لائن فراہم کرنا
      - تعلم کے انتظامی نظام میں سادہ ای لرننگ بنانا
      - سیکھنے والوں کی رائے جمع کرنا اور اس کا خلاصہ بنانا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - سیکھنے کی ضروریات کا تجزیہ کرنا اور انہیں پورا کرنے کے لیے ملے جلے پروگرام ڈیزائن کرنا
      - سیکھنے کے نتائج طے کرنا اور صرف اطمینان نہیں بلکہ اثر کی تشخیص کرنا
      - تعلم کو تمام عملے کے لیے قابلِ رسائی اور شمولیتی بنانا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی تعلم کی حکمتِ عملی اور معیارات طے کرنا
      - تعلم کی پیشکش، اس کی ٹیکنالوجی اور اس کی مالی معاونت کی قیادت کرنا
      - تعلم میں ادارے کی سرمایہ کاری کا منافع دکھانا
hr-skills-frameworks-and-career-pathways:
  name: مہارتوں کے فریم ورک اور کیریئر کے راستے
  description: مہارتوں اور کرداروں کے فریم ورک، جیسے یہ حوالہ، UK GDaD PCF اور ESCO، کا استعمال کرداروں کو بیان کرنے، مہارتوں کے خلا کا جائزہ لینے اور کیریئر کے راستے بنانے کے لیے۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ مہارتوں کا فریم ورک کیا ہے اور وہ کرداروں اور سطحوں کو کیسے بیان کرتا ہے
      - فریم ورک میں کسی ملازمت کا کردار کا خاکہ اور مہارتیں تلاش کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - ملازمت کی تفصیلات کو فریم ورک کے کرداروں، سطحوں اور مہارتوں سے ملانا
      - مہارتوں کے خود جائزوں میں عملے اور منیجروں کی مدد کرنا
      - کیریئر کے راستوں کی معلومات تازہ رکھنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کسی ٹیم یا پیشے کے لیے مہارتوں کے خلا کا تجزیہ کرنا اور نتائج کی رپورٹ دینا
      - فریم ورک کی سطحوں کا استعمال کرتے ہوئے کیریئر کے راستے اور ترقی کے راستے ڈیزائن کرنا
      - یکساں ملازمت کی تفصیلات اور جانچ لکھنے کے لیے فریم ورک کی مہارتوں کا استعمال کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - طے کرنا کہ ادارہ پیشوں میں مہارتوں کے فریم ورک کو کیسے استعمال کرتا ہے
      - افرادی قوت، تعلم اور معاوضے کی حکمتِ عملی کو باخبر کرنے کے لیے مہارتوں کے ڈیٹا کا استعمال کرنا
      - دیگر اداروں کے ساتھ مشترکہ فریم ورک کی ترقی میں حصہ ڈالنا
hr-organisational-development:
  name: ادارہ جاتی ترقی
  description: ثقافت، قیادت، شمولیت، ٹیم کی مؤثریت اور فلاح کی شواہد پر مبنی مداخلتوں کے ذریعے ادارے کے کام کرنے کے طریقے کو بہتر بنانا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - وضاحت کرنا کہ ثقافت، قیادت اور شمولیت عملے اور مریضوں کی نگہداشت پر کیسے اثر ڈالتی ہیں
      - عملے کے سروے اور سننے کی تقریبات کے انعقاد میں مدد کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - معیاری آلات استعمال کرتے ہوئے ٹیم کی نشستوں اور ورکشاپوں کی سہولت کاری کرنا
      - کسی ٹیم کے لیے عملے کے سروے کے نتائج کا تجزیہ کرنا اور اقدامات تجویز کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - ادارہ جاتی مسائل کی تشخیص کرنا اور انہیں حل کرنے کے لیے مداخلتیں ڈیزائن کرنا
      - ٹیم کی ترقی، قیادت کی ترقی اور شمولیت کے پروگراموں کی قیادت کرنا
      - شواہد کی مدد سے مداخلتوں کے اثر کی تشخیص کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارہ جاتی ترقی کی حکمتِ عملی اور ثقافت کا پروگرام طے کرنا
      - اعلیٰ افسران کی تربیت کرنا اور بڑے پیمانے پر ثقافتی تبدیلی کی قیادت کرنا
      - ثقافت اور شمولیت کی پیمائشوں کو نگہداشت کے معیار اور کارکردگی سے جوڑنا
hr-organisational-change:
  name: ادارہ جاتی تبدیلی اور مشاورت
  description: ڈھانچوں، کرداروں اور کام کے نمونوں میں تبدیلیوں کی منصوبہ بندی اور انتظام، بشمول باضابطہ مشاورت، دوبارہ تعیناتی اور اضافی افراد کی چھانٹی، پالیسی اور ملازمت کے قانون کے مطابق۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ادارہ جاتی تبدیلی کے عمل کے اہم مراحل کی وضاحت کرنا
      - تبدیلی کے انتظامی کام میں معاونت کرنا، جیسے مشاورت کے خطوط اور میٹنگیں
    working: |
      آپ یہ کر سکتے ہیں:
      - منیجروں کو مشاورتی دستاویزات اور عملے کی بریفنگ تیار کرنے میں مدد دینا
      - مشاورت کے دوران جوابات اور اقدامات کا سراغ رکھنا
      - دوبارہ تعیناتی اور انتخاب کے عمل میں عملے کی مدد کرنا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - کاروباری مقدمے سے نفاذ تک کسی ڈائریکٹوریٹ کے لیے ادارہ جاتی تبدیلی کی قیادت کرنا
      - عملے اور ان کے نمائندوں سے مشاورت کرنا اور ان کی رائے کا جواب دینا
      - تبدیلی کے قانونی اور مساوات کے خطرات کا انتظام کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - پورے ادارے کی تنظیمِ نو اور خدمات کی منتقلی کی قیادت کرنا
      - شراکت دارانہ کام سمیت تبدیلی کے لیے ادارے کا طریقہ ڈیزائن کرنا
      - بڑی تبدیلی کے افراد پر اثر اور خطرے کے بارے میں بورڈ کو مشورہ دینا
hr-people-strategy:
  name: افرادی حکمتِ عملی اور انسانی وسائل کی قیادت
  description: ادارے کی افرادی حکمتِ عملی طے کرنا، انسانی وسائل کے شعبے کی قیادت کرنا، اور ثقافت، افرادی قوت اور ملازمت کے خطرے پر بورڈ کو مشورہ دینا۔
  levels:
    awareness: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی افرادی حکمتِ عملی اور اپنے کام کی اس کی معاونت کی وضاحت کرنا
    working: |
      آپ یہ کر سکتے ہیں:
      - واضح اقدامات اور پیمائشوں کے ساتھ کسی خدمت کے افرادی منصوبوں میں حصہ ڈالنا
      - افرادی منصوبے کے مقابلے میں پیش رفت کی رپورٹ دینا
    practitioner: |
      آپ یہ کر سکتے ہیں:
      - افرادی حکمتِ عملی کے مطابق کسی ڈائریکٹوریٹ کے لیے افرادی منصوبے لکھنا اور ان کی قیادت کرنا
      - سینئر رہنماؤں کو افراد کے خطرات اور ترجیحات پر مشورہ دینا
      - انسانی وسائل کے شعبے کے ایک حصے کی قیادت کرنا، اس کے معیارات اور ترجیحات طے کرنا
    expert: |
      آپ یہ کر سکتے ہیں:
      - ادارے کی افرادی حکمتِ عملی طے کرنا اور انسانی وسائل کے شعبے کی قیادت کرنا
      - بورڈ کو ثقافت، افرادی قوت اور ملازمت کے خطرے پر مشورہ دینا
      - افراد کے معاملات میں شراکت داروں اور ریگولیٹرز کے سامنے ادارے کی نمائندگی کرنا
