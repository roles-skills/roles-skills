# درجوں کی اردو وضاحتیں۔ کنجیاں انگریزی درجوں کے کوڈ ہیں۔
"1":
  title: درجہ 1
  stage: ابتدائی
  knowledge: بنیادی خواندگی اور حساب کتاب؛ کام کے دوران سادہ معمول کے کام سیکھتا یا سیکھتی ہے۔
  autonomy: واضح ہدایات پر عمل کرتا یا کرتی ہے؛ کام کی اکثر جانچ ہوتی ہے۔
  scope: اپنے معمول کے کام۔
  leadership: کوئی نہیں۔
  accountability: معمول کے کاموں کی درست تکمیل۔
"2":
  title: درجہ 2
  stage: معاونت
  knowledge: کام کے شعبے کے معمولات اور طریقۂ کار سے واقف ہوتا یا ہوتی ہے؛ ابتدائی سطح کی قابلیت ہو سکتی ہے۔
  autonomy: طے شدہ طریقۂ کار کے مطابق کام کرتا یا کرتی ہے، نگرانی دستیاب رہتی ہے۔
  scope: ٹیم کے اندر اپنے کام۔
  leadership: نئے آنے والوں کو معمول کے کام دکھا سکتا یا سکتی ہے۔
  accountability: اپنے معمول کے کام کا معیار اور بروقت تکمیل۔
"3":
  title: درجہ 3
  stage: معاونت
  knowledge: کئی طریقوں کا علم، جن میں سے کچھ غیر معمولی ہوتے ہیں؛ عموماً سطح 3 کی قابلیت یا اس کے برابر تجربہ۔
  autonomy: طریقۂ کار کے اندر کام کرتا یا کرتی ہے؛ اپنے کام کی ترتیب خود طے کرتا یا کرتی ہے؛ مسائل بالا افسر کو بھیجتا یا بھیجتی ہے۔
  scope: اپنا کام اور وسیع تر ٹیم کے کچھ کام۔
  leadership: معمول کا کام تقسیم کر سکتا یا سکتی ہے یا دوسروں کو طریقۂ کار کی تربیت دے سکتا یا سکتی ہے۔
  accountability: اپنے کام اور رکھے گئے ریکارڈ کی درستی۔
"4":
  title: درجہ 4
  stage: معاونت اور ابتدائی پیشہ ورانہ مشق
  knowledge: کام کے شعبے کا تفصیلی علم، جو عموماً فاؤنڈیشن ڈگری، اپرنٹس شپ یا اس کے برابر تجربے سے حاصل ہوتا ہے۔
  autonomy: رہنما اصولوں کے اندر کام کرتا یا کرتی ہے؛ روزمرہ کے بیشتر مسائل خود حل کرتا یا کرتی ہے؛ مشورے کے لیے منیجر دستیاب ہوتا ہے۔
  scope: اپنا کام اور ایک متعین خدمت یا عمل۔
  leadership: چھوٹی ٹیم کی نگرانی کر سکتا یا سکتی ہے یا دوسروں کے کام کو مربوط کر سکتا یا سکتی ہے۔
  accountability: ایک متعین خدمت یا عمل کی فراہمی۔
"5":
  title: درجہ 5
  stage: پیشہ ور
  knowledge: پیشہ ورانہ یا تکنیکی علم، جو عموماً ڈگری یا اس کے برابر تجربے سے حاصل ہوتا ہے۔
  autonomy: پیشہ ورانہ معیارات کے اندر وسیع اہداف کے مطابق کام کرتا یا کرتی ہے؛ اپنے کام کی منصوبہ بندی خود کرتا یا کرتی ہے۔
  scope: ٹیم یا مصنوعہ کے اندر اپنا پیشہ ورانہ کام۔
  leadership: معاون عملے اور اپرنٹسوں کی رہنمائی اور ان کے کام کی جانچ کر سکتا یا سکتی ہے۔
  accountability: اپنے پیشہ ورانہ کام کا معیار۔
"6":
  title: درجہ 6
  stage: تجربہ کار پیشہ ور
  knowledge: کئی طریقوں میں مہارت کا علم، جو مزید تربیت یا تجربے سے بنتا ہے۔
  autonomy: آزادانہ کام کرتا یا کرتی ہے؛ اپنے شعبے کے لیے پالیسی کی تعبیر کرتا یا کرتی ہے؛ پیچیدہ معاملات میں مشورہ لیتا یا لیتی ہے۔
  scope: ایک مصنوعہ، خدمت یا کام کا سلسلہ۔
  leadership: چھوٹی ٹیم کی قیادت یا ساتھیوں کی رہنمائی کر سکتا یا سکتی ہے۔
  accountability: اپنے کام کے سلسلے کے نتائج اور دیے گئے مشورے کا معیار۔
"7":
  title: درجہ 7
  stage: سینئر یا ماہر
  knowledge: اعلیٰ درجے کا ماہرانہ علم، جو عموماً ماسٹرز کی سطح یا اس کے برابر تجربے کے مساوی ہوتا ہے۔
  autonomy: ادارے کی پالیسی کے مطابق کام کرتا یا کرتی ہے؛ نتائج حاصل کرنے کا طریقہ خود طے کرتا یا کرتی ہے؛ ایسا ماہر ہے جس سے دوسرے رجوع کرتے ہیں۔
  scope: کئی مصنوعات یا خدمات، یا ایک ماہرانہ شعبہ۔
  leadership: ایک ٹیم یا پیشہ ورانہ مشق کے ایک شعبے کی قیادت کرتا یا کرتی ہے۔
  accountability: ایک خدمت یا ماہرانہ شعبے کی فراہمی، اور بجٹ ہو تو اس کی بھی۔
8a:
  title: درجہ 8a
  stage: رہنما
  knowledge: ایک شعبے اور اس کے انتظام کا ماہرانہ علم۔
  autonomy: ایک خدمت کے لیے ادارے کی پالیسی کی تعبیر کرتا یا کرتی ہے؛ ٹیم کی سمت طے کرتا یا کرتی ہے۔
  scope: ایک خدمتی علاقہ یا پورے ادارے میں ایک شعبہ۔
  leadership: ٹیم کا انتظام کرتا یا کرتی ہے، یا براہِ راست انتظامی ذمہ داری کے بغیر ایک شعبے کی قیادت کرتا یا کرتی ہے۔
  accountability: ایک خدمتی علاقہ، اس کا عملہ اور اس کا بجٹ۔
8b:
  title: درجہ 8b
  stage: رہنما
  knowledge: کئی شعبوں یا ایک بڑی خدمت کا ماہرانہ علم۔
  autonomy: ایک بڑے علاقے کی پالیسی اور حکمتِ عملی تشکیل دیتا یا دیتی ہے۔
  scope: کئی خدمات یا ٹیمیں، یا اعلیٰ سطح کا ایک شعبہ۔
  leadership: منیجروں کا انتظام کرتا یا کرتی ہے، یا ایک شعبے میں اعلیٰ ترین اتھارٹی ہے۔
  accountability: کئی خدمات، ان کا عملہ اور ان کے بجٹ۔
8c:
  title: درجہ 8c
  stage: سینئر رہنما
  knowledge: ماہرانہ علم، اور ادارے اور شعبے کی وسیع سمجھ۔
  autonomy: ایک شعبۂ کار کی حکمتِ عملی طے کرتا یا کرتی ہے؛ ڈائریکٹر کو جواب دہ ہے۔
  scope: ایک شعبۂ کار یا محکمہ۔
  leadership: انتظام کی کئی تہوں کے ذریعے ایک شعبۂ کار کی قیادت کرتا یا کرتی ہے۔
  accountability: ایک شعبۂ کار کی کارکردگی، افرادی قوت اور بجٹ۔
8d:
  title: درجہ 8d
  stage: سینئر رہنما
  knowledge: شعبہ ہائے کار اور وسیع تر صحت و نگہداشت کے نظام میں حکمتِ عملی کا علم۔
  autonomy: پورے ادارے کی حکمتِ عملی تشکیل دیتا یا دیتی ہے؛ ڈائریکٹر کی نیابت کرتا یا کرتی ہے۔
  scope: ایک بڑا شعبۂ کار یا کئی شعبہ ہائے کار۔
  leadership: کئی شعبہ ہائے کار یا ایک بڑے محکمے کی قیادت کرتا یا کرتی ہے۔
  accountability: بڑے شعبہ ہائے کار، بڑے بجٹ اور پورے ادارے کے خطرات۔
"9":
  title: درجہ 9
  stage: پیشے کا سربراہ یا ڈائریکٹر
  knowledge: حکمتِ عملی کی مہارت اور پورے نظام میں قیادت۔
  autonomy: انتظامی ٹیم کے ساتھ مل کر ادارے کی حکمتِ عملی طے کرتا یا کرتی ہے۔
  scope: ادارہ، اور پورے نظام میں اس کے شراکت دار۔
  leadership: ایک پیشے یا ڈائریکٹوریٹ کی قیادت کرتا یا کرتی ہے۔
  accountability: پورے ادارے کے نتائج، بجٹ اور خطرات۔
