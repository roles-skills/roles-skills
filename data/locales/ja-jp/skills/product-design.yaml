# data/skills/product-design.yaml の日本語訳。キーは英語のスキル id。
pd-health-research-ethics:
  name: 患者およびケア職員との倫理的な調査
  description: 患者、介護者、臨床医、ケア職員を対象とする調査を、安全かつ倫理的に計画し実施する。インフォームドコンセント、保護、脆弱な状況にある人々への調査、正式な倫理審査がいつ必要かの判断を含む。
  levels:
    awareness: |
      できること:
      - 患者やケア職員を対象とする調査に、インフォームドコンセント、保護、個人データへの配慮が必要な理由を説明する
      - 調査セッションで、チームの同意、保護、データ取り扱いの手順に従う
    working: |
      できること:
      - インフォームドコンセントを得て、参加者の心身の健康とプライバシーを守る調査セッションを計画する
      - 体調が悪い人、苦痛を感じている人、脆弱な状況にある人に合わせてセッションを調整し、やめるべきときを知る
      - 調査中に生じた保護上の懸念を見分けて報告する
    practitioner: |
      できること:
      - 調査に正式な倫理審査や研究ガバナンスの承認が必要かどうかを判断し、必要なものを準備する
      - 子ども、認知症の人、危機にある人など、脆弱な状況にある人々を対象に、安全な調査を計画する
      - 臨床リードやケア職員と協力して、ケアを妨げずに臨床現場で調査を計画する
      - 苦痛を伴うセッションの後、調査員自身の心身の健康を支える
    expert: |
      できること:
      - 患者、介護者、ケア職員との倫理的な調査に関する組織の基準を定める
      - チームを横断して調査の実務を保証し、高リスクの調査について助言する
      - 倫理、保護、ガバナンスの各機関に対して、調査の実務を代表して説明する
pd-safety-critical-design:
  name: 臨床安全とヒューマンファクターのための設計
  description: ヒューマンファクターの原則を適用し、臨床リスク管理プロセスと連携して、臨床医、ケア職員、患者が安全に行動できるサービス、インターフェース、ワークフローを設計する。
  levels:
    awareness: |
      できること:
      - 設計上の選択が、患者の取り違えや用量の誤りなど、ケアにおける誤りの原因にも防止にもなりうることを説明する
      - 患者識別バナーやアレルギー警告など、安全上重要な情報のための組織のパターンを使う
    working: |
      できること:
      - あいまいなラベルや不要なアラートを減らすなどして、安全な操作を簡単な操作にするインターフェースを設計する
      - 中断や時間的プレッシャーを含む、現実的な臨床シナリオで設計をテストする
      - 設計に関連するハザードを臨床安全責任者に伝え、設計がそれをどう管理するかを記録する
    practitioner: |
      できること:
      - タスク分析や使用エラー分析などのヒューマンファクター手法を、複雑な臨床ワークフローに適用する
      - サービス全体でアラート疲れと認知的負荷を減らすように設計する
      - 臨床安全ケースのための設計の根拠と、規制対象ソフトウェアのためのユーザビリティの根拠を提供する
    expert: |
      できること:
      - 安全上重要な設計に関する組織の基準とパターンを定める
      - 最もリスクの高い臨床サービスでのヒューマンファクターの取り組みを主導する
      - ポートフォリオ全体で、設計に関連するリスクについて臨床安全およびプロダクトのリーダーに助言する
pd-health-content:
  name: 健康情報コンテンツ
  description: 正確で、臨床的に保証され、健康リテラシーのレベルが異なる人々にも理解しやすく、行動に移しやすい、健康・ケアのコンテンツを作成する。
  levels:
    awareness: |
      できること:
      - 健康情報が正確で、最新で、理解しやすくなければならない理由を説明する
      - 健康コンテンツについて、チームのスタイルガイドと臨床レビューのプロセスに従う
    working: |
      できること:
      - 症状や助けを求めるタイミングなど、健康リテラシーの低い人でも理解して行動できる健康コンテンツを書く
      - 臨床レビュー担当者と協力して、わかりやすさを損なわずに正確性を確認する
      - 医学用語をわかりやすい言葉で説明し、病気、検査、治療に一貫した名称を使う
    practitioner: |
      できること:
      - 緊急の症状、薬、終末期ケアなど、機微でリスクの高いテーマのコンテンツを設計する
      - 一連の健康コンテンツのために、臨床的な保証、レビュー日、根拠となる情報源を整える
      - 意見が分かれるコンテンツで、臨床的な精密さ、法的要件、利用者の理解のバランスをとる
    expert: |
      できること:
      - 健康情報コンテンツとその臨床的保証に関する組織の基準を定める
      - サービスとチャネルを横断して、健康情報のコンテンツ戦略を主導する
      - 健康情報のリスクについて、臨床およびコミュニケーションのシニアリーダーに助言する
