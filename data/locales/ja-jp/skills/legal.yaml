# data/skills/legal.yaml の日本語訳。キーは英語のスキル id。
legal-legal-research:
  name: 法的調査
  description: 法的な問いに答えるために、法令、判例、ガイダンス、先例を見つけ、読み、要約する。
  levels:
    awareness: |
      できること:
      - 法務データベースと組織のノウハウを使って、法令、ガイダンス、先例の文書を見つける
      - 法律用語を正しく使う
    working: |
      できること:
      - 定義された法的な問いを調査し、情報源を明確に要約する
      - 情報源が最新で信頼できるものかを確認する
      - 先例とノウハウのライブラリを最新に保つ
    practitioner: |
      できること:
      - 既存の法律が新しい技術にどう適用されるかなど、複雑または新しい問いを調査する
      - 食い違う情報源を分析し、理由のある見解にたどり着く
      - 法律とガイダンスの変更を追い、それが組織に与える影響を説明する
    expert: |
      できること:
      - 組織にとって最も複雑でリスクの高い問いに関する調査を主導する
      - 法的な展開を予測し、組織が備えられるようにする
      - デジタルヘルスとケアに影響する法律やガイダンスの協議に貢献する
legal-contract-drafting-and-review:
  name: 契約の起案とレビュー
  description: 技術、ソフトウェアライセンス、クラウド、サービス、データ処理の契約など、契約や合意を起案し、レビューし、交渉する。
  levels:
    awareness: |
      できること:
      - 当事者、期間、支払い、責任、終了など、契約の主な部分を説明する
      - 承認されたテンプレートから標準的な文書を準備する
    working: |
      できること:
      - 秘密保持契約や簡単なサービス契約などの定型的な契約を、組織の基準に照らしてレビューする
      - 契約に修正を入れ、変更点を説明する
      - 責任の上限なしや自動更新など、弁護士のレビューが必要な条項を見つける
    practitioner: |
      できること:
      - ソフトウェアライセンス、クラウドホスティング、システムインテグレーション、データ処理契約など、複雑な契約を起案し、交渉する
      - 責任の上限、サービスレベル、終了、エスクローなど、リスクの配分について助言する
      - 契約が、患者データ、サービスの継続性、ソフトウェアとデータに対する組織の権利を守るようにする
      - 契約のテンプレートとプレイブックを書き、維持する
    expert: |
      できること:
      - 組織の契約の基準とリスクの立場を定める
      - 最も価値が高い、またはリスクの高い契約の交渉を主導する
      - パートナーシップや合弁事業など、戦略的な商取引の取り決めについて、シニアリーダーに助言する
legal-legal-advice:
  name: 法的助言
  description: 同僚が適法な判断をし、法的リスクを管理するのに役立つ、明確で実用的で正確な法的助言を行う。
  levels:
    awareness: |
      できること:
      - 同僚がいつ法的助言を必要とし、どう得られるかを説明する
      - 明確な指示を受け、案件の事実を記録する
    working: |
      できること:
      - 弁護士がレビューするための、定型的な案件の助言案を準備する
      - 承認済みのガイダンスを使って、単純な質問に答える
      - 一連の事実から法的論点を見つける
    practitioner: |
      できること:
      - 自分の専門分野で、独立した法的助言を行う
      - 法的リスクをわかりやすい言葉で説明し、実用的な選択肢を勧告する
      - 契約の締結、データ共有、サービスの変更など、法的効果を持つ決定について助言する
      - 外部の弁護士や法廷弁護士をいつ依頼するかを判断する
    expert: |
      できること:
      - 組織の最も重大な法的リスクについて、取締役会と経営陣に助言する
      - 新しい、議論を呼ぶ、または価値の高い案件について、最終的な助言を行う
      - 法的リスクに対する組織の許容度を定める
      - 外部の助言を含め、組織全体の法的助言の質を保証する
legal-litigation-and-disputes:
  name: 訴訟と紛争解決
  description: 契約紛争、雇用に関する請求、臨床過誤請求の窓口業務を含め、紛争と請求を防止し、管理し、解決する。
  levels:
    awareness: |
      できること:
      - 請求や紛争の主な段階を説明する
      - 請求を記録し、期限を正確に追跡する
    working: |
      できること:
      - 案件のための文書と証拠を集めて整理する
      - 年表、書証の綴り、証人陳述書の案を準備する
      - 定型的な案件で、外部の弁護士、保険会社、補償制度と連絡を取る
    practitioner: |
      できること:
      - 最初の通知から和解または審問まで、紛争と請求を担当する
      - 請求の勝算と価値を評価し、方針を勧告する
      - 和解を交渉し、代替的紛争解決を活用する
      - 請求から得た教訓が、安全、契約、サービスの改善につながるようにする
    expert: |
      できること:
      - 組織の最も重大な、または注目度の高い紛争を主導する
      - 訴訟、和解、請求の報告に関する組織の取り組み方を定める
      - 偶発債務と評判リスクについて、取締役会に助言する
legal-information-and-data-law:
  name: 情報・データ法
  description: データ保護、秘密保持、情報公開、サイバーセキュリティに関する法を、保健・ケアのデータとデジタルサービスに適用する。
  levels:
    awareness: |
      できること:
      - データ保護と秘密保持の基本原則を説明する
      - 情報請求とデータ侵害を見分けて、正しく回す
    working: |
      できること:
      - データ共有契約とデータ処理契約を、テンプレートに照らしてレビューする
      - 情報請求とデータ主体の権利に関する請求への回答を支援する
      - 一般的な状況で健康データを使う適法な根拠を説明する
    practitioner: |
      できること:
      - デジタルサービスのデータ保護、秘密保持義務、情報アクセス法について助言する
      - 国際的な移転を含め、データ共有契約とデータ処理の条件を起案し、交渉する
      - AI や分析プラットフォームなどの新しい技術のデータ保護影響評価について助言する
      - データ侵害、規制当局の問い合わせ、苦情について助言する
    expert: |
      できること:
      - 保健・ケアのデータ利用に関する組織の法的立場を定める
      - 研究、データプラットフォーム、AI など、リスクの高い、または新しいデータ利用を主導する
      - 情報法について、規制当局に対して組織を代表する
legal-legal-administration:
  name: 法務事務
  description: 案件管理、文書管理、記録、期限、請求書の処理など、法務チームの事務プロセスを運営する。
  levels:
    awareness: |
      できること:
      - 案件管理システムで案件を開き、更新し、閉じる
      - 法的文書を安全に保管し、取り出す
      - 法的情報と個人情報の秘密を守る
    working: |
      できること:
      - チームのスケジュール、期限、重要な日付を管理する
      - 法的文書、書証の綴り、署名用の書類一式を準備し、書式を整える
      - 外部の弁護士からの請求書を確認し、処理する
      - 契約と証書の台帳を管理する
    practitioner: |
      できること:
      - 法務チームの事務を運営し、そのプロセスを改善する
      - 業務量、外部の弁護士への支出、処理期間を報告する
      - 案件管理や電子署名ツールなど、法務技術を管理する
    expert: |
      できること:
      - 組織のリーガルオペレーションのモデルを設計する
      - 法務技術の選定と活用を主導する
      - 法務サービスのサービス基準と業績指標を定める
legal-employment-law:
  name: 雇用法
  description: 組織の人事方針、契約、変革プログラム、雇用に関する紛争に雇用法を適用する。
  levels:
    awareness: |
      できること:
      - 職員の主な雇用上の権利を説明する
      - 法的助言が必要な雇用上の問題を見分ける
    working: |
      できること:
      - 雇用に関する請求や審問のための書類の準備を手伝う
      - 雇用契約と方針をテンプレートに照らしてレビューする
    practitioner: |
      できること:
      - 解雇、差別、職員の転籍、再編などの雇用問題について助言する
      - 雇用に関する請求を管理し、和解合意を交渉する
      - 請負人の利用と、デジタル専門職の雇用上の地位について助言する
    expert: |
      できること:
      - 大規模な人員の変更とその法的リスクについて、取締役会に助言する
      - 注目度の高い、または複雑な雇用紛争を主導する
      - 法的義務と優れた実務に適合するよう、人事方針を形づくる
legal-intellectual-property:
  name: 知的財産
  description: 著作権、ライセンス、オープンソース、商標を含め、ソフトウェア、データ、コンテンツ、発明の知的財産を保護し、活用する。
  levels:
    awareness: |
      できること:
      - ソフトウェア、データ、コンテンツが知的財産権で保護されていることを説明する
      - 契約やプロジェクトが、いつ所有権の問題を生じさせるかを見分ける
    working: |
      できること:
      - 定型的な契約の知的財産条項を確認する
      - ライセンスと登録された権利の記録を保管する
      - 主なオープンソースライセンスの種類とその条件を説明する
    practitioner: |
      できること:
      - 職員、供給者、パートナーが作ったソフトウェア、データ、コンテンツを誰が所有するかについて助言する
      - 組織のコードのオープンソースとしての公開を含め、ライセンスと知的財産の条件を起案する
      - 組織のデータとソフトウェアの商業利用と、便益の共有について助言する
    expert: |
      できること:
      - 組織の知的財産とオープンソースの方針を定める
      - 組織のデータとソフトウェアに関わる商業化とパートナーシップを主導する
      - 重大な知的財産紛争を解決する
legal-procurement-law:
  name: 公共調達法
  description: 調達ルートの選択から、契約の締結、異議申立てまで、物品、サービス、技術の購入に公共調達の規則を適用する。
  levels:
    awareness: |
      できること:
      - 公的機関が調達の規則に従わなければならない理由を説明する
      - 購入活動に、いつ調達または法的助言が必要かを見分ける
    working: |
      できること:
      - 入札書類の整合性と完全性を確認する
      - 公正で透明なプロセスを示すために必要な記録の保管を支援する
    practitioner: |
      できること:
      - フレームワーク、随意契約、競争的手続きなど、調達ルートについて助言する
      - 評価、締結の決定、締結後の契約変更について助言する
      - 供給者からの異議申立てや苦情に対応する
      - パートナーシップにおける補助金管理と競争上のリスクについて助言する
    expert: |
      できること:
      - 調達の法的リスクに対する組織の取り組み方を定める
      - イノベーションパートナーシップなど、高額または新しい調達を主導する
      - 重大な調達上の異議申立てに対して防御する
legal-health-and-care-law:
  name: 医療・ケア法
  description: 同意、能力、臨床過誤、サービスと製品の規制、組織の法定の義務を含め、保健・ケアのサービスを規律する法を適用する。
  levels:
    awareness: |
      できること:
      - 組織の主な法定の義務と権限を説明する
      - 患者の安全、同意、臨床過誤に関わる事柄を見分ける
    working: |
      できること:
      - インシデント、検視審問、臨床上の請求に関する法務を支援する
      - 組織のサービスに適用される規制の枠組みを説明する
    practitioner: |
      できること:
      - サービスをいつ提供または委託できるかを含め、組織の権限と義務について助言する
      - 医療機器としてのソフトウェアなど、デジタルヘルス製品の規制について助言する
      - デジタルサービスが関わる請求について、臨床過誤の補償制度や外部の弁護士と連絡を取る
      - デジタルサービスにおける同意、能力、患者の権利について助言する
    expert: |
      できること:
      - 組織の法定の義務とガバナンスについて、取締役会に助言する
      - 公的調査、司法審査、大規模なインシデントに関する法務を主導する
      - 新しい保健・ケア法への組織の対応を形づくる
