# data/skills/procurement.yaml の日本語訳。キーは英語のスキル id。
proc-purchase-to-pay:
  name: 購買から支払いまで
  description: 組織の購買システムと財務統制を通じて、発注の起票、承認、検収を行い、請求書と支払いの問い合わせを解決する。
  levels:
    awareness: |
      できること:
      - 「発注書なし、支払いなし」の規則と、それが重要な理由を説明する
      - 購買システムで購買依頼を起票する
    working: |
      できること:
      - 発注書を作成・修正し、契約に照らして確認する
      - 仕入先や財務部門とともに、請求書、検収、支払いの問い合わせを解決する
      - 購買システムのカタログと仕入先の記録を維持する
    practitioner: |
      できること:
      - サービスの購買から支払いまでのプロセスを運営し、遵守状況と滞留を監視する
      - 支出データを分析して、契約外の支出と削減できる箇所を見つける
      - 財務の同僚とともに、プロセスと統制を改善する
    expert: |
      できること:
      - 組織の購買から支払いまでの方針、統制、システムを定める
      - 完全な電子購買・電子請求書への移行を主導する
proc-procurement-process:
  name: 調達プロセス
  description: 計画と仕様から、調達ルート、入札、締結、契約署名までの適法な調達を運営する。フレームワークやダイナミック・パーチェシング・システムを通じた購入を含む。
  levels:
    awareness: |
      できること:
      - 調達の段階と、適用される基準額を説明する
      - 組織の規則に従って、少額の購入の見積りを取る
    working: |
      できること:
      - 標準テンプレートを使って、見積りとフレームワークからの個別発注を実行する
      - 入札書類を準備し、電子入札システムで質問への回答を管理する
      - 各調達の明確な監査証跡を残す
    practitioner: |
      できること:
      - 適切な調達ルートと手続きを選び、複雑な入札を計画し、主導する
      - 利用者がデジタルシステムや臨床システムの成果ベースの仕様書を書くのを手伝う
      - 契約の締結まで、スケジュール、リスク、ステークホルダーを管理する
    expert: |
      できること:
      - 組織の調達手順とテンプレートを定める
      - 最も複雑で、高額で、または新しい調達を主導する
      - 取締役会のために調達の決定を保証する
proc-tender-evaluation:
  name: 入札評価
  description: 評価基準と重みづけを設計し、品質、価格、社会的価値の評価を、公正かつ十分に記録して行う。
  levels:
    awareness: |
      できること:
      - 評価が公表された基準に従わなければならない理由を説明する
      - 評価に参加する前に利益相反を申告する
    working: |
      できること:
      - 入札書類が要件を満たし、完全であるかを確認する
      - 評価者を支援し、スコアと調整の記録を残す
      - 指導を受けながら、価格評価モデルを準備する
    practitioner: |
      できること:
      - 評価基準、重みづけ、採点のガイダンスを設計する
      - 調整を主導し、締結報告書と入札者へのフィードバックを書く
      - システム入札のために、デモンストレーションや、臨床・利用者シナリオのテストを計画する
    expert: |
      できること:
      - 組織の評価基準と、価格と品質への取り組み方を定める
      - 評価の決定が異議を唱えられたときに、それを擁護する
      - 高リスクの調達の評価をレビューする
proc-procurement-law-and-policy:
  name: 公共調達の規則と方針
  description: 購買が適法で、透明で、公正であるよう、公共調達の規則、組織の財務規則、調達方針を適用する。
  levels:
    awareness: |
      できること:
      - 公的資金は公正に、公開で、適法に使わなければならないことを説明する
      - 組織の基準額と承認規則に従う
    working: |
      できること:
      - 単純な購入に合った調達の規則を適用する
      - 透明性の規則を満たす通知を公表し、記録を残す
      - 依頼が規則に違反するおそれがあるときにそれを見抜いて指摘する
    practitioner: |
      できること:
      - 複雑な調達と契約変更の適法なルートについて助言する
      - 異議申立てのリスクを管理し、待機期間と説明を正しく扱う
      - 組織の調達方針とガイダンスを書く
    expert: |
      できること:
      - 新しい調達規則を解釈し、組織の対応を主導する
      - 調達のコンプライアンスとリスクについて、取締役会に助言する
      - 法律顧問とともに、正式な異議申立てに対応する
proc-market-analysis:
  name: 市場分析と市場との対話
  description: 供給市場を理解し、調達前に供給者と対話し、市場の根拠を使って、要件、調達ルート、商取引モデルを形づくる。
  levels:
    awareness: |
      できること:
      - フレームワークと供給者データベースで供給者を見つける
      - 早期の市場との対話が、すべての供給者に公正でなければならない理由を説明する
    working: |
      できること:
      - 要件のために、市場の情報、価格、供給者の詳細を集める
      - 情報提供依頼を実施し、回答を要約する
    practitioner: |
      できること:
      - 供給市場、その競争、リスク、傾向を分析する
      - 競争を歪めることなく、供給者向けの説明会など、早期の市場との対話を主導する
      - 市場の根拠を使って、要件と商取引モデルを形づくる
    expert: |
      できること:
      - 新規または小規模の供給者を後押しするなどして、市場を形づくる
      - 他の購買組織とともに市場戦略を主導する
proc-negotiation:
  name: 商取引の交渉
  description: 費用対効果を確保し、リスクを管理する価格、条件、成果で合意するために、供給者との交渉を計画し、実行する。
  levels:
    awareness: |
      できること:
      - 公共調達で何が交渉でき、何ができないかを説明する
    working: |
      できること:
      - 少額または定型的な購入の価格と条件を交渉する
      - 他の人が主導する交渉のために、データと選択肢を準備する
    practitioner: |
      できること:
      - 目標、限度、代替案を定めて、交渉を計画し、主導する
      - 契約の変更、更新、紛争の和解を交渉する
      - 交渉を適法に保ち、十分に記録する
    expert: |
      できること:
      - 戦略的な供給者との、高額でリスクの高い交渉を主導する
      - 他の人に交渉をコーチし、組織の交渉の取り組み方を定める
proc-category-management:
  name: カテゴリーマネジメント
  description: 需要をまとめ、要件を形づくり、複数年にわたって調達を計画するカテゴリー戦略を通じて、ソフトウェア、クラウド、技術サービスなどの支出カテゴリーを管理する。
  levels:
    awareness: |
      できること:
      - カテゴリーとは何か、カテゴリー計画が重要な理由を説明する
    working: |
      できること:
      - カテゴリーの支出と契約を分析し、契約台帳を最新に保つ
      - 更新や削減の追跡など、カテゴリー計画を支援する
    practitioner: |
      できること:
      - 予算責任者や技術リードとともに、カテゴリー戦略を書いて実行する
      - カテゴリーの調達と契約更新のパイプラインを計画する
      - カテゴリーの削減額、価値、リスクを追跡する
    expert: |
      できること:
      - 組織のカテゴリーマネジメントの取り組み方を定める
      - 支出とリスクが最大のカテゴリーを率い、組織の戦略と整合させる
      - 共同購買について、他の組織と協力する
proc-technology-procurement:
  name: 技術とクラウドの調達
  description: サービスとしてのソフトウェア、商取引モデル、ライセンス、そして医療技術が必要とするセキュリティ、データ保護、相互運用性の条件を含め、ソフトウェア、クラウドサービス、ライセンス、ハードウェア、デジタルサービスを購入する。
  levels:
    awareness: |
      できること:
      - ライセンス、サブスクリプション、サービスなど、技術の主な購入方法を説明する
      - 臨床システムにセキュリティ、臨床安全、データ保護の確認が必要であることを認識する
    working: |
      できること:
      - フレームワークを通じて、標準的なソフトウェア、ハードウェア、ライセンスを購入する
      - ライセンス数、更新、精算日を追跡する
      - 標準的なセキュリティとデータ保護の要件を文書に含める
    practitioner: |
      できること:
      - 適切な商取引モデルを選んで、クラウド、サービスとしてのソフトウェア、臨床システムを購入する
      - 技術、臨床安全、情報ガバナンスのリードとともに要件を作る
      - 相互運用性、オープンスタンダード、データの所有、終了の条件を契約に含める
      - 更新時に移植性と競争を計画して、ロックインを避ける
    expert: |
      できること:
      - 技術とクラウドに関する組織の商取引戦略を定める
      - エンタープライズ契約と戦略的プラットフォームの交渉を主導する
      - 技術の選択がもたらす商取引上のリスクについて、デジタルリーダーに助言する
proc-contract-management:
  name: 契約管理
  description: 組織が支払った分を確実に得られるよう、稼働開始、実績、支払い、変更、紛争、更新、終了を含め、締結後の契約を管理する。
  levels:
    awareness: |
      できること:
      - 契約を見つけ、その重要な日付、金額、オーナーを説明する
      - 契約の変更と文書を契約台帳に記録する
    working: |
      できること:
      - サービスレベルと主要業績指標に照らして、供給者の実績を監視する
      - 契約レビュー会議を準備し、対応を追跡する
      - 契約の変更を処理し、請求書を契約に照らして確認する
    practitioner: |
      できること:
      - 臨床および技術の契約を含め、契約のポートフォリオを管理する
      - 実績が不足したときに、サービスクレジットなどの契約上の救済措置を使う
      - 調達規則の範囲で、変更、紛争、更新を管理する
      - 終了を早めに計画し、契約が終わる前に終了計画をテストする
    expert: |
      できること:
      - 組織の契約管理の枠組みと基準を定める
      - 戦略的でリスクの高い契約の管理を主導する
      - 大きな紛争を解決し、解約または再調達を決める
proc-supplier-relationship-management:
  name: 供給者関係管理
  description: リスクを管理し、実績を向上させ、時間をかけて製品とサービスを発展させるために、主要な供給者との戦略的な関係を築く。
  levels:
    awareness: |
      できること:
      - 患者が頼るサービスにとって、良好な供給者関係が重要な理由を説明する
      - 供給者と専門家らしく関わり、連絡を記録する
    working: |
      できること:
      - 供給者の連絡先、エスカレーション経路、記録を最新に保つ
      - 供給者の財務の健全性と保険を要件に照らして確認する
    practitioner: |
      できること:
      - リスクと価値で供給者を区分し、各グループの管理方法を計画する
      - ロードマップと改善計画を含め、主要な供給者との戦略的なレビューを実施する
      - 財務上の破綻、サイバーインシデント、サプライチェーンの問題など、供給者のリスクを管理する
    expert: |
      できること:
      - 組織の供給者関係戦略を定める
      - 戦略的な供給者との経営層の関係を主導する
      - 重要な供給者が破綻したときの対応を主導する
proc-exit-planning:
  name: 終了計画とデータの返却
  description: 新しい供給者への移行、データの返却と削除、患者と職員のためのサービスの継続性を含め、契約の終了を計画し、管理する。
  levels:
    awareness: |
      できること:
      - すべての契約に終了計画が必要な理由を説明する
      - 契約の終了とデータ返却の条件を見つける
    working: |
      できること:
      - 終了計画と、資産・データの台帳を最新に保つ
      - 通知期間と終了のマイルストーンを追跡する
    practitioner: |
      できること:
      - 技術、データ、臨床のリードとともに、終了と移行の計画を書く
      - データが使える標準形式で返却され、その後安全に削除されるようにする
      - ケアが中断されないよう、移行のリスクを管理する
    expert: |
      できること:
      - 終了、移行、データ返却に関する組織の基準を定める
      - 戦略的な臨床・技術契約からの終了を主導する
proc-social-value:
  name: 社会的価値と持続可能な調達
  description: 調達と契約を使って、社会的価値、環境の持続可能性、公正なサプライチェーンを実現し、供給者が提供したものを測定する。
  levels:
    awareness: |
      できること:
      - 社会的価値と持続可能な調達が組織にとって何を意味するかを説明する
    working: |
      できること:
      - 標準的な社会的価値と持続可能性の質問を入札に含める
      - 供給者から社会的価値の報告を集める
    practitioner: |
      できること:
      - 契約に合った、社会的価値と持続可能性の基準を定める
      - 地域の雇用、スキル、炭素削減など、供給者のコミットメントを管理する
      - 強制労働やその他の人権侵害といったリスクがないか、サプライチェーンを確認する
    expert: |
      できること:
      - 組織の社会的価値と持続可能な調達の方針を定める
      - 社会的価値と炭素の成果を取締役会に報告する
