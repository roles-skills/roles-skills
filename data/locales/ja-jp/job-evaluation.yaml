# 職務評価の要素(日本語)。キーは英語の要素 id。
communication:
  name: コミュニケーションと関係構築のスキル
  description: 同僚、患者、市民、パートナーとコミュニケーションをとり、関係を築くために必要なスキル。情報がどれほど複雑、機微、または議論を呼ぶものか、また理解や受け入れを妨げる障壁を考慮する。
  levels:
    "1": 主に同僚と、定型的な情報を口頭でやりとりする。
    "2": 同僚やその他の人と、定型的な情報を口頭、文書、または電子的にやりとりする。
    "3": 配慮や説得を要する定型的な情報、複雑または機微な情報、または集団への簡単な研修を行う。
    "4": 説得、交渉、または研修のスキルを要する複雑、機微、または議論を呼ぶ情報、あるいは非常に複雑な情報を伝える。
    "5": 高度な説得と交渉を要する非常に複雑または議論を呼ぶ情報を伝える、大人数に発表する、または受け入れに大きな障壁がある状況で伝える。
    "6": 受け入れに大きな障壁がある、非常に複雑で非常に議論を呼ぶ情報を、最高水準のコミュニケーションスキルで伝える。
knowledge:
  name: 知識、研修、経験
  description: 仕事を行うために必要な知識と経験。正式な研修、資格、経験など、どのような方法で得たものでもよい。
  levels:
    "1": 短い導入研修で実務の中で学べる、少数の定型的な手順。
    "2": 実務での研修と導入研修を通じて学ぶ、さまざまな定型的な手順。
    "3": 一部非定型の、基礎レベルの理論を要するさまざまな手順(たとえばレベル 3 の資格または同等の経験)。
    "4": 大半が非定型の、中級レベルの理論を要するさまざまな手順(たとえば短期大学相当の学位または同等の経験)。
    "5": 理論または実務経験に裏づけられた、ある専門分野の熟練(学位レベルまたは同等)。
    "6": 専門分野の全範囲にわたる専門知識(大学院ディプロマレベルまたは同等)。
    "7": 専門分野の全範囲にわたる高度に発達した専門知識(修士レベルまたは同等)。
    "8": 高度な知識(博士号に追加の研修を加えたもの、または同等)、あるいは長い期間をかけて培った複数分野にわたる専門知識。
analytical:
  name: 分析と判断のスキル
  description: 情報を処理し、問題を解決し、意思決定をするために必要な分析と判断。
  levels:
    "1": 単純な事実や状況についての判断。
    "2": 一部に分析を要する、事実や状況についての判断。
    "3": 分析または選択肢の比較を要する、さまざまな事実や状況についての判断。
    "4": 分析、解釈、選択肢の比較を要する、複雑な事実や状況についての判断。
    "5": 分析、解釈、選択肢の比較を要する、非常に複雑な事実や状況についての判断。
planning:
  name: 計画と組織化のスキル
  description: 活動、プログラム、サービス、または戦略を進めるために必要な計画と組織化。
  levels:
    "1": 自分の日々の仕事を整理する。
    "2": 単純なタスクや活動を計画する。一部は継続的なもの。
    "3": 複数の複雑な活動を計画し、必要に応じて計画を調整する。
    "4": 幅広い複雑な活動や戦略を計画し、必要に応じて調整する。
    "5": 不確実性があり、組織全体に影響が及ぶ長期の戦略計画を立てる。
physical-skills:
  name: 身体的スキル
  description: 器用さ、協調、キーボード操作、運転など、必要な身体的スキル。
  levels:
    "1": 身体的スキルはほとんど必要ない。
    "2": 標準的なキーボード操作や運転など、練習で身につくスキル。
    "3": 高度なキーボード操作など、速さや正確さを要する発達したスキル。
    "4": 正確さや速さと、高い手と目の協調を要する高度に発達したスキル。
    "5": 最高水準の正確さ、速さ、協調。
patient-care:
  name: 患者・利用者のケアに対する責任
  description: 患者や利用者を評価し、治療し、ケアし、または助言することへの責任。ほとんどのデジタル職や管理部門の職では、偶発的な接触にとどまる。
  levels:
    "1": 偶発的な接触の中で、患者、利用者、または家族を手助けする。
    "2": 患者や市民に直接、一般的な非臨床の助言、情報、サービスを提供する。
    "3": 身の回りのケア、基本的な臨床技術サービス、または基本的な臨床上の助言を行う。
    "4": 臨床ケアを行う、臨床技術サービスを提供する、または患者のケアについて助言する。
    "5": ケアのプログラムを開発する、専門的な臨床技術サービスを提供する、または患者のケアについて専門的な助言を行う。
    "6": 専門的なケアを開発する、高度に専門的な助言を行う、または臨床サービスの一部に責任を負う。
    "7": 臨床またはケアのサービスの提供に責任を負う。
    "8": 臨床またはケアのサービスに対する組織全体の責任。
policy:
  name: 方針とサービス開発に対する責任
  description: 方針とサービスを開発して実行することへの責任と、その影響が及ぶ範囲。
  levels:
    "1": 他の人が定めた方針に従う。変更に意見を述べることがある。
    "2": 自分の領域の方針を実行し、その慣行の変更を提案する。
    "3": 自分の領域の方針を実行し、他の領域に影響する変更を提案する。
    "4": 方針を実行し、あるサービスまたは複数の領域の方針やサービスを開発する。
    "5": ディレクトレートのさまざまな方針やサービスを実行し、開発する。
    "6": 組織の内外にわたる主要な方針やサービス開発に対する組織全体の責任。
financial-resources:
  name: 財務・物的資源に対する責任
  description: 資金、予算、機器、在庫、建物、その他の資産に対する責任。
  levels:
    "1": 自分の仕事で使う機器や資源を自分で管理する。
    "2": 現金や貴重品を扱う、他の人が使う機器を管理する、在庫を管理する、または少額の支払いを承認する。
    "3": 支払いを承認する、一部の資産や物品を購入する、委任された予算を監視または保有する、または資産を維持する。
    "4": 部門やサービスの予算を保有または設定する、またはその資産を購入または維持する。
    "5": 複数のサービスの予算を保有または設定する、または資産を管理する。
    "6": 組織の財務または資産に対する組織全体の責任。
people:
  name: 人に対する責任
  description: 職員を管理し、監督し、教育し、または育成することへの責任、または人事(HR)サービスを提供することへの責任。
  levels:
    "1": 新しい同僚や経験の浅い同僚に、自分の作業の進め方を示す。
    "2": 職員を日々監督または調整する、他の人を定期的に研修する、または基本的な人事の助言を行う。
    "3": 職員のグループを日々管理する、中核的または専門的な研修を教える、または中核的な人事の助言を行う。
    "4": 機能または部門をライン管理する、主な職務として研修プログラムを設計する、または人事サービスの全範囲を提供する。
    "5": 複数の部門をライン管理する、または組織全体の研修や人事の大部分を管理する。
    "6": 組織の人員または人事機能に対する組織全体の責任。
information-resources:
  name: 情報資源に対する責任
  description: 紙かデジタルかを問わず、記録、データ、それらを保持するシステムを含む、情報と情報システムに対する責任。
  levels:
    "1": 職務の担当者が作成した情報を記録する。
    "2": 他の人がまとめたデータを入力または保管する、またはときどき報告書やクエリを書く。
    "3": 正式な議事録を取る、定期的に報告書やクエリを書く、または情報システムの保守を重要な職務として行う。
    "4": 他の人の仕様に合わせて情報システムを調整または設計する、または主な職務として部門の情報システムを運用する。
    "5": 大規模な情報システムを設計・開発する、または主な職務として複数のサービスの情報システムを運用する。
    "6": 主な職務として、組織全体の情報システムを管理・開発する。
    "7": 組織の情報システムに対する組織全体の責任。
research:
  name: 研究開発に対する責任
  description: 正式な研究、開発、評価、監査、テスト、試験に対する責任。
  levels:
    "1": 自分の仕事のための調査や監査を行う。ときどき研究やテストに参加する。
    "2": 職務の一部として、研究、開発、試験、または機器・システムのテストを定期的に行う。
    "3": 主な職務として、正式なプログラムの中で研究または開発を行う。
    "4": 研究開発プログラムを調整し、実施する。
    "5": 組織の目標を支える研究開発プログラムを発案し、開発する。
    "6": 組織の外にまで影響が及ぶ研究開発プログラムを発案し、開発する。
freedom-to-act:
  name: 行動の自由度
  description: 職務の担当者が何をどう行うかをどの程度自分で決めるか、また仕事がどれほど厳密に監督されるか。
  levels:
    "1": 定められた手順の範囲で働き、監督が近くにある。
    "2": 標準的な手順と先例に従い、たいてい相談できる人がいる。仕事が確認されることがある。
    "3": 定められた方針と手順に従い、仕事は監督されるというより管理される。
    "4": 成果は定められているが、広い方針の範囲で、達成の方法は担当者が決める。
    "5": 一般的な方針の範囲で働き、多くの場合、その解釈を自分で決める。
    "6": 全体的な方針と戦略を解釈して、目標と基準を定める。
physical-effort:
  name: 身体的負荷
  description: 必要な身体的負荷を、頻度、継続時間、強度を考慮して評価したもの。
  levels:
    "1": 座る、立つ、歩くが中心で、身体的負荷はほとんどない。
    "2": 制限された姿勢で座る・立つことが多い、またはときどき軽度から中程度の負荷がある。
    "3": 長時間の軽い負荷が頻繁にある、または短時間の中程度の負荷が頻繁にある。
    "4": 軽い負荷が継続する、長時間の中程度の負荷が頻繁にある、またはときどき強い負荷がある。
    "5": 中程度の負荷が継続する、または強い負荷が頻繁にある。
mental-effort:
  name: 精神的負荷
  description: 必要な集中を、頻度、継続時間、仕事の予測しやすさを考慮して評価したもの。
  levels:
    "1": 一般的な注意。予測できる仕事にときどき集中する。
    "2": 予測できる仕事に頻繁に集中する、または予測できない仕事にときどき集中する。
    "3": 予測できない仕事に頻繁に集中する、またはときどき長時間集中する。
    "4": 長時間の集中が頻繁にある、またはときどき強い集中が必要になる。
    "5": 強い集中が頻繁に必要になる。
emotional-effort:
  name: 感情的負荷
  description: つらい状況に直接または間接的にさらされることから生じる、仕事の感情面の負担。たとえば、痛ましい事例の記録を読む、重大なインシデントに対応するなど。
  levels:
    "1": つらい状況にさらされることはまれである、またはときどき間接的にさらされる。
    "2": つらい状況にときどきさらされる、または間接的に頻繁にさらされる。
    "3": つらい状況に頻繁にさらされる、またはきわめてつらい状況にときどきさらされる。
    "4": 心的外傷を伴う状況にときどきさらされる、またはきわめてつらい状況に頻繁にさらされる。
working-conditions:
  name: 労働条件
  description: 不快な条件や危険にさらされること。ほとんどの日にほぼ連続して画面を使う場合はレベル 2 とする。
  levels:
    "1": 不快な条件にさらされることはまれである。
    "2": 不快な条件がときどきある、移動や屋外での作業が多い、またはほとんどの日にほぼ連続して画面を使う。
    "3": 不快な条件が頻繁にある、またはきわめて不快な条件がときどきある。
    "4": 危険にある程度さらされる、またはきわめて不快な条件が頻繁にある。
    "5": 危険にかなりさらされる。
