summary: >
  デリバリーマネージャーは、多職種チームが、患者、臨床医、ケア職員にとって機能するデジタルヘルスサービスを提供するのを支援する。アジャイルとリーンの仕事の進め方を用いて、チームがうまく働ける条件を整え、障害を取り除き、リスクと依存関係を管理し、持続可能な速度でデリバリーを前に進める。
health_context:
  - 患者のケアを支えるサービスへのリリースは、臨床安全と情報ガバナンスのチェックを通過しなければならないため、デリバリーマネージャーはこれらをチームの計画と完了の定義に組み込む。
  - デリバリーは、患者のそばを離れられる時間が限られた臨床医やケア職員に依存することが多いため、デリバリーマネージャーは臨床のシフト表に合わせて、リサーチ、テスト、研修を計画する。
  - 稼働中の臨床サービスの変更には慎重なタイミングが必要なため、デリバリーマネージャーは運用チームと稼働開始を計画し、臨床の繁忙期を避けてサポート体制を整える。
  - チームは臨床システムの供給者や他の保健・ケア組織に依存することが多いため、デリバリーマネージャーは外部の依存関係と契約を管理する。
levels:
  - title: アソシエイト デリバリーマネージャー
    responsibilities:
      - スタンドアップ、計画、ショーアンドテル、振り返りなど、チームの儀式を進行する。
      - チームのボード、リスク・課題ログ、依存関係の記録を最新に保つ。
      - 各リリースの前に必要な、臨床安全、情報ガバナンス、アクセシビリティのタスクを追跡する。
      - 臨床のシフト表に合わせて、リサーチとテストのために、臨床医、ケア職員、患者とのセッションを手配する。
      - より大きなチームのデリバリーマネージャーに同行して支え、指導を受けながら作業の一部を提供する。
    qualifications:
      - デリバリーチームで、またはデリバリーチームとともに働いた一定の経験、または同等の経験。
  - title: デリバリーマネージャー
    responsibilities:
      - ディスカバリー、アルファ、ベータ、稼働を通じて、デジタルヘルスのプロダクトやサービスのデリバリーを主導する。
      - 稼働開始時のサポート、研修、ロールバック計画を含め、運用および臨床チームとリリースを計画する。
      - 臨床安全、情報ガバナンス、アクセシビリティの保証が、最後ではなくデリバリーと歩調を合わせて行われるようにする。
      - チームの予算、供給者との契約、人員配置を管理する。
      - 進捗、リスク、便益を、ガバナンス委員会に平易な言葉で報告する。
      - 健全なチーム文化を築き、チームメンバーにアジャイルな仕事の進め方をコーチする。
    qualifications:
      - アジャイルの手法でデジタルプロダクトやサービスを提供した相当の経験。
    job_evaluation_notes: UK GDaD PCF には、アソシエイト(EO/HEO)とデリバリーマネージャー(SEO/G7)の間にデリバリーマネージャーのレベルがないため、バンド 6 のレベルはない。
  - title: シニア デリバリーマネージャー
    responsibilities:
      - 救急医療で使われるものや中核的な臨床システムを置き換えるものなど、複雑またはリスクの高いサービスのデリバリーを主導する。
      - 複数のチームにわたるデリバリーのリスク、課題、依存関係の主なエスカレーション先となる。
      - 臨床安全責任者や運用リードとともに、拠点や組織をまたぐ大規模な展開を計画する。
      - サービスの予算、商業的取り決め、供給者の実績を管理する。
      - デリバリーマネージャーをライン管理し、育成する。
    qualifications:
      - 複雑なデジタルサービスをそのライフサイクル全体にわたって提供した豊富な経験。
  - title: デリバリーマネジメント責任者
    responsibilities:
      - デリバリーマネジメント専門職を率い、アジャイルデリバリーに関する組織の基準を定める。
      - ポートフォリオ全体で、デリバリーマネージャーを採用し、育成し、配置する。
      - デリバリーの進め方が、チームを不必要に遅らせることなく、臨床安全、情報ガバナンス、保証の要件を満たすようにする。
      - デリバリーのリスク、キャパシティ、優先順位について、経営層と臨床のリーダーに助言する。
      - 専門職の予算と人員計画を管理する。
    qualifications:
      - 複数のチームにわたってデリバリーを率い、デリバリーの実践を率いた豊富な経験。
