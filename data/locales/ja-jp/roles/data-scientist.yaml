summary: >
  データサイエンティストは、統計、機械学習、その他の高度な手法を使って、保健・ケアのデータのパターンを見つけ、サービスが計画し、予測し、ケアを改善するのに役立つモデルを構築する。典型的な仕事には、需要の予測、早期の支援から恩恵を受けそうな患者の特定、サービス変更の効果の評価がある。臨床医やアナリストと密接に協力し、モデルが妥当で、公正で、安全に使われるようにする。
health_context:
  - 患者に関する意思決定を支えるモデルは、誤りやバイアスがあれば害を及ぼしうるため、モデルは使用する集団で検証され、臨床安全が評価される。
  - 健康データはケアへのアクセスの不平等を反映しているため、各患者集団のバイアスを測定して対処しない限り、モデルは健康格差を繰り返したり悪化させたりしうる。
  - 診断や治療に情報を提供するモデルなど、一部のモデルは医療機器として規制されうるし、AI 規制も適用されうる。
  - データサイエンスは、連結された詳細な患者データを必要とすることが多いため、作業は仮名化されたデータを使い、合意された情報ガバナンス上の根拠のもと、安全な環境で行われる。
  - 臨床医と患者は、モデルの出力を理解し信頼する必要があるため、説明と、不確実性の平易なコミュニケーションが重要である。
levels:
  - title: トレーニー データサイエンティスト
    responsibilities:
      - 体系的な研修を通じて、チームの統計・機械学習の手法、ツール、安全な働き方を学ぶ。
      - 監督のもとで、仮名化された健康データセットを準備し、探索する。
      - 単純な統計分析を実行して解釈し、より経験のあるデータサイエンティストと結果を確認する。
      - 情報ガバナンス、開示管理、倫理の手順に従う。
      - データサイエンスのアプレンティスシップまたは同等の資格の取得に向けて取り組む。
    qualifications:
      - データサイエンスのアプレンティスシップまたは同等のものに在籍している、または取得を目指している。
    job_evaluation_notes: 知識は、仕事ができるだけの研修が終わった時点で職務が必要とするレベルで評価している。
  - title: アソシエイト データサイエンティスト
    responsibilities:
      - 指導を受けながら、需要予測などの基本的な統計・機械学習モデルを構築し、テストする。
      - 安全な環境で、モデリングのために健康データセットを準備し、連結する。
      - 患者集団ごとのモデルの性能を測定し、差を報告する。
      - 結果とその不確実性を、アナリストやサービスチームに発表する。
      - 作業が再現できるよう、データソース、手法、前提を文書化する。
    qualifications:
      - 数量的な分野の学位、データサイエンスのアプレンティスシップ、または同等の経験。
  - title: データサイエンティスト
    responsibilities:
      - 適切な手法を選び、リスク層別化や在院日数の予測など、複雑なモデルを自立して開発する。
      - 臨床医とモデルを検証し、地域の患者データで正確で、公正で、有用であるかを確認する。
      - 各モデルの想定用途、データ、性能、限界を文書化し、臨床安全ケースに根拠を提供する。
      - 適切な統計手法を使って、サービス変更の効果を評価する。
      - モデルとその不確実性を、臨床や非技術系の聴衆に説明する。
      - アソシエイトとトレーニーのデータサイエンティストを支援する。
    qualifications:
      - 数量的な分野の学位、または同等の経験。
      - 統計または機械学習モデルの構築と検証の経験。
  - title: プリンシパル データサイエンティスト
    responsibilities:
      - サービス計画と患者のケアを支えるデータサイエンスのプロジェクトの範囲を定め、設計し、主導する。
      - どの手法、ツール、データが適しているかを判断し、実現不可能または安全でない計画に異議を唱える。
      - 臨床安全と情報ガバナンスの同僚とともに、モデルの検証、バイアス評価、監視を計画する。
      - モデルをどのように大規模に展開し、サポートするかを、プロダクトチームと合意する。
      - データサイエンティストの小さなチームを管理し、育成する。
    qualifications:
      - データサイエンスの提供における相当の経験(定量的な分野の修士または博士相当のレベル)。
  - title: リード データサイエンティスト
    responsibilities:
      - データサイエンスのチームを率い、その方向性、優先順位、基準を定める。
      - データサイエンスがケアを改善できる機会を見つけ、臨床・サービスのリーダーとともにその根拠を示す。
      - モデルが運用中も安全で公正であり続けるよう、設計、検証、監視されるようにする。
      - 同意、バイアス、機微なデータの利用など、複雑な倫理・データ上の課題を解決する。
      - コーチング、採用、研修を通じて、データサイエンスの能力を築く。
    qualifications:
      - データサイエンスのチームを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF は、リードデータサイエンティストとデータサイエンス責任者のどちらも G7 または G6 としている。このリファレンスは、リードをバンド 8a、責任者をバンド 8b に置き、2 つのレベルが別のバンドになるようにしている。
  - title: データサイエンス責任者
    responsibilities:
      - 組織の戦略と優先事項に沿って、組織全体のデータサイエンスと AI の方向性を定める。
      - 組織のモデルと AI の倫理、安全、保証を主導し、それについて取締役会に助言する。
      - リソース、予算、データサイエンス成果物の品質を監督する。
      - データサイエンスと AI について、保健・ケアのパートナー、研究者、規制当局に対して組織を代表する。
      - 専門職を横断して、データサイエンスの能力とキャリアを築く。
    qualifications:
      - 組織全体でデータサイエンスを率いた豊富な経験。
