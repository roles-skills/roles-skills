summary: >
  変更・リリースマネージャーは、IT サービスへの変更が、評価され、承認され、スケジュールされ、安全に実施されるようにし、リリースが計画されて調整されるようにする。変更諮問委員会を運営し、構成管理データベースを担い、チームと供給者にまたがるリリースを調整する。医療では、臨床システムへの変更が、患者のケアを守るようにタイミングとテストが計られるようにする。
health_context:
  - 臨床システムへの変更は患者に害を及ぼしうるため、変更の評価には、臨床安全レビューと、臨床リスク管理プロセスの根拠が含まれる。
  - 臨床サービスは毎日稼働しているため、変更の時間枠は臨床サービスと合意され、最も忙しい時間帯を避ける。
  - 多くの変更は臨床システムの供給者から来るため、供給者がリリースを管理している場合でも、評価しなければならない。
  - 緊急のセキュリティパッチなどの緊急変更では、サイバーリスクと、ケアを妨げるリスクのバランスをとらなければならない。
  - 正確な構成管理データベースは、変更がどの臨床サービスに影響しうるかを示す。
levels:
  - title: 構成アナリスト
    responsibilities:
      - 各コンポーネントが支える臨床サービスを含め、構成管理データベースの記録を維持する。
      - 構成の記録を検出ツールと照らして確認し、ギャップや誤りを修正する。
      - 変更諮問委員会向けの変更記録と議題を準備する。
      - 構成アイテムとそれらの関係に関する定型の問い合わせに答える。
    qualifications:
      - IT サービスマネジメントの基礎資格、IT のレベル 3 の資格、または同等の経験。
    job_evaluation_notes: UK GDaD PCF はこのレベルにバンド 6(HEO/SEO)を示唆している。このリファレンスは、このレベルが変更・リリースマネージャーへの事務的な支援を提供し、スキルの大半が認知レベルで、変更・リリースアナリストより下に位置するため、バンド 4 に置いている。構成管理データベースの維持が主な職務であるため、情報資源はバンドのプロファイルより高い。
  - title: 変更・リリースアナリスト
    responsibilities:
      - 臨床サービスと患者の安全への影響を含め、変更依頼のリスクと影響を評価する。
      - 臨床・運用サービスと変更の時間枠を合意しながら、リリースを計画し、スケジュールする。
      - 各変更に、テスト、ロールバック計画、必要な場合は臨床安全の承認があるかを確認する。
      - DevOps チーム、供給者、サービスデスクとリリースを調整する。
      - 事後にリリースをレビューし、今後の変更を計画する。
    qualifications:
      - IT 運用、リリース、または変更の仕事の経験。
      - IT サービスマネジメントの基礎資格、または同等の経験。
  - title: 変更・リリースマネージャー
    responsibilities:
      - 変更が患者のケアに影響する場合は臨床・運用の代表者を交えて、変更諮問委員会を主宰する。
      - 技術的な変更を判断し、緊急のセキュリティパッチなどの緊急変更を承認する。
      - 社内チームと供給者にまたがって、リリースとその依存関係を調整する。
      - 変更、リリース、構成管理のプロセスと構成管理データベースを担う。
      - 変更の衝突や失敗した変更のエスカレーション先を務める。
      - 変更の成功、失敗した変更、変更が原因のインシデントを報告し、改善を推進する。
    qualifications:
      - 変更・リリース管理の相当の経験(学位相当のレベル)。
      - IT サービスマネジメントの中級資格、または同等の経験。
    job_evaluation_notes: このロールが多くのチームと供給者にまたがってリリースとその依存関係をスケジュールするため、計画はバンドのプロファイルより高い。
