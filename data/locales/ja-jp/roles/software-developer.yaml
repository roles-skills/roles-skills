summary: >
  ソフトウェア開発者は、患者向けアプリ、臨床システム、連携サービス、データプラットフォームなど、組織のデジタルヘルスサービスを支えるソフトウェアを構築、テスト、保守する。多職種のプロダクトチームで働き、安全で、堅牢で、アクセスしやすく、保守しやすいコードを書き、本番稼働中のサービスを支える。
health_context:
  - ソフトウェアは患者のケアに影響しうるため、開発者は臨床リスク管理プロセスに従い、安全ケースに根拠を提供する。
  - コードは機密性の高い健康情報を扱うことが多いため、開発者は情報ガバナンスと安全なコーディングの実践を標準として適用する。
  - 多くのサービスは HL7 FHIR などのオープンな相互運用性標準を使って、他の保健・ケアのシステムとデータを交換する。
  - 一部のソフトウェアは医療機器として規制されうるため、開発者は規制に関する助言をいつ求めるべきかを知る必要がある。
levels:
  - title: アプレンティス ソフトウェア開発者
    responsibilities:
      - 体系的な研修とペアワークを通じて、チームの言語、ツール、仕事の進め方を学ぶ。
      - 密接な監督のもとで、小さく明確に定義されたコードを書き、テストする。
      - 安全なコーディング、情報ガバナンス、臨床安全の手順に従う。
      - スタンドアップ、計画、振り返りなど、チームの儀式に参加する。
      - アプレンティスシップまたは同等の資格の取得に向けて取り組む。
    qualifications:
      - ソフトウェア開発のアプレンティスシップまたは同等のものに在籍している、または取得を目指している。
    job_evaluation_notes: 知識は、仕事ができるだけの研修が終わった時点で職務が必要とするレベルで評価している。情報資源は、他の人が設計したシステムでの作業を反映している。
  - title: ジュニア ソフトウェア開発者
    responsibilities:
      - 指導を受けながら、ユーザーストーリーをもとに、チームのプロダクトの機能を構築し、テストする。
      - 患者ケアを支えるサービスを含め、自動テストを書き、不具合を修正する。
      - テスト結果や変更記録など、臨床安全ケースに根拠を提供する。
      - 情報ガバナンスの規則に従って、健康データを安全に扱う。
      - チームのサポート体制の一環として、指導を受けながら本番サービスを支える。
    qualifications:
      - コンピューティングまたは関連分野の学位、修了したアプレンティスシップ、または同等の経験。
  - title: ソフトウェア開発者
    responsibilities:
      - 適切な手法を選び、機能とサービスを自立して設計、構築、テストする。
      - コードをレビューし、チームのエンジニアリング基準の維持を手助けする。
      - HL7 FHIR などのオープンな標準を使って、他の保健・ケアのシステムとの連携を構築する。
      - ハザードの特定に参加し、臨床安全の管理策をコードとテストに組み込むのを手助けする。
      - サービスが必要とする場合は時間外対応を含め、本番サービスの問題を調査し、修正する。
      - ジュニアとアプレンティスの開発者をメンターする。
    qualifications:
      - コンピューティングまたは関連分野の学位、または同等の経験。
      - 本番ソフトウェアの構築と支援の経験。
  - title: シニア ソフトウェア開発者
    responsibilities:
      - 重要な機能とサービスの技術設計と提供を主導する。
      - テスト、セキュリティ、アクセシビリティを含め、チームのエンジニアリング基準を設定し、維持する。
      - 利用者のニーズ、臨床安全、セキュリティ、コストのバランスをとった技術的な決定を行う。
      - チームのサービスについてインシデント調査を主導し、修正を推進する。
      - 臨床安全責任者と協力して、安全の管理策が設計に組み込まれ、テストされるようにする。
      - チームの開発者をコーチし、育成する。
    qualifications:
      - 本番ソフトウェアの設計、構築、支援における相当の経験(修士相当のレベル)。
  - title: リード ソフトウェア開発者
    responsibilities:
      - プロダクトまたは複数のチームのエンジニアリングを率い、技術的な方向性を定める。
      - ソフトウェアが安全性、セキュリティ、レジリエンス、相互運用性を考慮して設計されるようにする。
      - アーキテクト、プロダクトマネージャー、臨床リードと協力して、プロダクトのロードマップを形づくる。
      - 開発者のコミュニティ・オブ・プラクティスを率い、チームを横断して基準を定める。
      - 開発者をライン管理または率い、その成長と実績を支援する。
    qualifications:
      - 複雑なサービスのソフトウェアエンジニアリングを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF は、リード開発者とプリンシパル開発者のどちらも最もよく G7 または G6 としている。このリファレンスでは、リードをバンド 8a、プリンシパルをバンド 8b に置いている。
  - title: プリンシパル ソフトウェア開発者
    responsibilities:
      - 組織のソフトウェア開発のエンジニアリング戦略、基準、実践を定める。
      - 技術の選択、リスク、投資について、シニアリーダーに助言する。
      - サービスを横断して、最も複雑な技術的課題の解決を主導する。
      - 組織を横断するコミュニティやオープンソースのエンジニアリングコミュニティで、組織を代表する。
      - リード開発者を率い、育成し、組織のエンジニアリング能力を高める。
    qualifications:
      - 複数のチームや組織にわたってエンジニアリングを率いた豊富な経験。
