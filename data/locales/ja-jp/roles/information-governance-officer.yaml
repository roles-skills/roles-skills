summary: >
  情報ガバナンス職員は、組織が個人情報と健康情報を適法、安全、倫理的に扱うのを助ける。データ保護と秘密保持についてチームに助言し、情報に関する権利の請求を扱い、データ保護影響評価を支援し、データ侵害を管理し、組織が情報ガバナンスの標準を満たしていることを示す根拠を集める。
health_context:
  - データ保護法は健康情報に追加の保護を与えているため、適法な利用、セキュリティ、透明性の水準は高い。
  - デジタルヘルスサービスは、多くのケア組織の間でデータを共有することが多いため、情報共有契約とデータフローは慎重にレビューする必要がある。
  - 患者と一般の人々は、自分の記録や組織の情報にアクセスする法的権利を持ち、そこには厳格な期限がある。
  - 健康情報に関わるデータ侵害は、実際の害と苦痛を引き起こしうるため、インシデントは迅速かつ慎重な対応が必要である。
  - 分析、研究、AI など、データの新しい利用は、同意、秘密保持、市民の信頼に関する問いを生む。
levels:
  - title: 情報ガバナンス担当職員
    summary: 定められた手順に従い、情報に関する権利の請求、インシデントの記録、研修の記録、根拠の収集について、情報ガバナンスチームを支援する。
    responsibilities:
      - 情報に関する権利の請求を記録し、受領を通知し、追跡し、回答のための情報を集める。
      - データ侵害とヒヤリハットを記録し、レビューのために事実を集める。
      - 情報資産登録簿やデータフローマップなど、情報ガバナンスの登録簿を最新に保つ。
      - 年次の情報ガバナンス自己評価のための根拠を集める。
      - 職員の情報ガバナンス研修の修了状況を追跡する。
      - 職員からの定型の情報ガバナンスの質問に答える。
    qualifications:
      - 事務または記録の仕事の経験、またはデータ保護の基礎レベルの資格、または同等の経験。
    job_evaluation_notes: 感情的負荷は、請求、記録、侵害の報告書に含まれるつらい内容に間接的に触れることが頻繁にあることを反映している。
  - title: シニア 情報ガバナンス担当職員
    summary: 情報に関する権利の請求とインシデントの担当件数を抱え、データ保護影響評価と情報共有についてチームを支援する。
    responsibilities:
      - 法的な期限内に、黒塗りや適用除外の適用を含め、情報に関する権利の請求を扱う。
      - データ侵害とヒヤリハットを評価して調査し、クローズまでアクションを追跡する。
      - プロジェクトチームが、データ保護影響評価を完成させ、データフローを説明するのを手助けする。
      - レビュー用に、情報共有契約とプライバシー通知を起草する。
      - 職員向けに、情報ガバナンスの研修とブリーフィングを実施する。
      - アクセスと記録管理の監査を実施する。
    qualifications:
      - データ保護または情報ガバナンスの認められた資格、または同等の経験。
  - title: 情報ガバナンスリード
    summary: ディレクトレートまたはプログラムに専門的な情報ガバナンスの助言を行い、データ保護影響評価と複雑なケースを主導する。
    responsibilities:
      - 適法な根拠、同意、秘密保持、保存について、プロダクトチームとサービスに助言する。
      - 複雑なシステムのデータ保護影響評価をレビューし、管理策を勧告する。
      - 複雑または論争的な、情報に関する権利の請求と内部レビューを扱う。
      - 重大なデータ侵害を調査し、規制当局に通知すべきかを勧告する。
      - パートナー組織との情報共有契約をレビューする。
      - 情報ガバナンス担当職員を監督し、コーチする。
    qualifications:
      - データ保護または情報ガバナンスの認められた専門資格、または同等の経験。
      - 医療またはケアの環境でデータ保護について助言した経験。
  - title: 情報ガバナンスマネージャー
    summary: チーム、ケースワーク、保証プログラム、研修を含め、情報ガバナンスサービスを日々管理する。
    responsibilities:
      - 情報ガバナンスチームとそのケースワークを管理し、法的な期限が守られるようにする。
      - 情報ガバナンスの保証プログラムと年次の自己評価を計画し、運営する。
      - 情報ガバナンスの方針と手順を書いてレビューする。
      - 情報リスクについてシニアマネージャーに助言し、情報リスク登録簿を維持する。
      - セキュリティ、臨床安全、広報の同僚と協力して、重大インシデントへの対応を主導する。
      - 全職員向けの情報ガバナンス研修を設計し、監督する。
    qualifications:
      - データ保護または情報ガバナンスの認められた専門資格、または同等の経験。
      - 医療またはケアにおける情報ガバナンスの相当の経験。
  - title: 情報ガバナンス責任者
    summary: 組織の情報ガバナンスを率い、その方針と戦略を定め、情報リスクとコンプライアンスについてシニアリーダーに助言する。
    responsibilities:
      - 組織の情報ガバナンスの戦略、方針、枠組みを定める。
      - 情報ガバナンスと記録のサービスを率い、その職員を育成する。
      - 情報リスクの経営責任者、取締役会、その委員会に、情報リスクとコンプライアンスについて助言する。
      - 複雑な開示、共有、侵害通知の問題について、最終的な判断を下す。
      - 規制当局、監査人、パートナー組織に対して、組織を代表する。
      - 新しいデジタルサービス、データ利用、AI が、最初からプライバシーと透明性を考慮して設計されるようにする。
    qualifications:
      - データ保護または情報ガバナンスの認められた専門資格、または同等の経験。
      - 医療またはケアで情報ガバナンスを率いた豊富な経験。
