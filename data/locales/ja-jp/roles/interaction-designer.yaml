summary: >
  インタラクションデザイナーは、患者向けのアプリやフォームから、臨床医がベッドサイドで使う画面まで、患者、介護者、臨床医、ケア職員が組織のデジタルヘルスサービスをどう使うかを設計する。シンプルで、アクセスしやすく、安全なインタラクションを設計し、実際の利用者とテストし、サービスが一貫して親しみやすく感じられるよう、共有のデザインシステムを使う。
health_context:
  - 臨床医は、時間的プレッシャー、中断、共有端末のもとでシステムを使うことが多いため、設計は迅速で正確な作業を支え、安全な操作を簡単な操作にしなければならない。
  - 不十分なデザインは、患者の取り違えや用量の読み違えなど臨床上の害を引き起こしうるため、デザイナーはヒューマンファクターの原則を適用し、臨床安全責任者と協力する。
  - 多くの利用者は、体調がすぐれない、不安を抱えている、高齢である、または障害があるため、設計はアクセシビリティ標準を満たし、デジタルスキルやヘルスリテラシーの低い人にも機能しなければならない。
  - アラートや警告は、人が気づき信頼して初めて役に立つため、デザイナーはアラート疲れを減らし、安全上重要な情報を見えるように保つのを手助けする。
levels:
  - title: アソシエイト インタラクションデザイナー
    responsibilities:
      - 研修とペアワークを通じて、インタラクションデザインの手法とチームのデザインシステムを学ぶ。
      - 監督のもとで、スケッチ、ワイヤーフレーム、簡単なプロトタイプを作成する。
      - 利用者とのデザインのテストを手伝い、何がうまくいき何がうまくいかないかを記録する。
      - 患者の識別や安全警告のパターンを含め、アクセシビリティ標準とデザインシステムのパターンに従う。
    qualifications:
      - デザインまたは関連分野の資格やアプレンティスシップの取得を目指している、または同等の経験。
  - title: ジュニア インタラクションデザイナー
    responsibilities:
      - より上位のデザイナーの指示を受けながら、フォーム、フロー、画面など、サービスの一部を設計し、プロトタイプ化する。
      - 患者、介護者、職員とデザインをテストし、学んだことにもとづいて変更する。
      - 支援技術と連携して機能する、アクセスしやすいインタラクションを設計する。
      - 誤りの可能性をどう減らすかを含め、デザイン上の決定をチームに説明する。
    qualifications:
      - デザインまたは関連する科目の学位、または同等の経験。
  - title: インタラクションデザイナー
    responsibilities:
      - 初期のコンセプトから、詳細でテスト済みのデザインまで、デジタルヘルスのプロダクトのインタラクションを設計する。
      - 臨床のワークフローに合わせて設計し、中断を含む現実的なシナリオで、臨床医やケア職員とテストする。
      - デザインに関係するハザードを臨床安全責任者に提起し、デザインがそれをどう管理するかを記録する。
      - 安全上重要な情報のパターンを含め、デザインシステムを使い、それに貢献する。
      - 開発者と密接に協力して、デザインが意図どおりに構築され、アクセスしやすいままであるようにする。
    qualifications:
      - デザインまたは関連する科目の学位、または同等の経験。
      - 利用者とともにデジタルサービスを設計した経験。
    job_evaluation_notes: UK GDaD PCF は、インタラクションデザイナーを、シニアインタラクションデザイナーと同じ、示唆されるバンド 7 の SEO または G7 に置いている。このリファレンスは、2 つのインタラクションデザイナーのレベルが同じバンドにならないよう、PCF のスキルレベルが同一であるサービスデザイナーのレベルと同じバンド 6 に置いている。
  - title: シニア インタラクションデザイナー
    responsibilities:
      - 多くのケア現場で使われる臨床システムなど、複雑なサービスのインタラクションデザインを主導する。
      - タスク分析などのヒューマンファクターの手法を、安全上重要な臨床ワークフローに適用する。
      - 臨床安全ケース、およびソフトウェアが規制対象の場合はユーザビリティファイルに、デザインの根拠を提供する。
      - チームのデザインの方向性とグッドプラクティスを定めるのを手助けし、他のデザイナーをメンターする。
      - リサーチとデータからデザイン上の決定を行い、それを臨床およびプロダクトのリーダーに説明する。
    qualifications:
      - インタラクションデザインの相当の経験(修士相当のレベル)。
  - title: リード インタラクションデザイナー
    responsibilities:
      - 複数のチームやサービスにわたって、インタラクションデザインの方向性を定め、質を保証する。
      - 組織全体のチームが再利用する、アクセスしやすく安全上重要なパターンを含め、デザインシステムを率いる。
      - 臨床安全責任者とともに、最もリスクの高い臨床サービスのヒューマンファクターの作業を主導する。
      - プロダクトと臨床のシニアリーダーと協力して、主要なサービスのデザインコンセプトを開発する。
      - インタラクションデザイナーをライン管理し、育成する。
    qualifications:
      - チームを横断してインタラクションデザインを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF がリードインタラクションデザイナーを G7 または G6 に置き、このリファレンスが示唆されたバンド 8b に従うため、バンド 8a のレベルはない。リードデザイナーが一連のサービスのデザイン標準を定めるため、方針はレベル 5 とする。
  - title: インタラクションデザイン責任者
    responsibilities:
      - インタラクションデザイン専門職を率い、その戦略、基準、仕事の進め方を定める。
      - サービスが使いやすく、アクセスしやすく、安全であるよう、デザインと組織の戦略に影響を与える。
      - 組織のデザインシステムを担い、それがアクセシビリティと臨床安全のニーズを満たすようにする。
      - 採用、キャリアパス、研修を含め、デザインの能力を築く。
      - 保健・ケアのシステム全体の同僚と、共有のデザインパターンに取り組む。
    qualifications:
      - デザインとデザインの実践を率いた豊富な経験。
