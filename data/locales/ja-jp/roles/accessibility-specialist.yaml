summary: >
  アクセシビリティスペシャリストは、組織のデジタルヘルスサービスを、障害のある人や長期の疾患のある人を含め、できるだけ多くの人が使えるようにするのを助ける。サービスをアクセシビリティ標準に照らして、また支援技術でテストし、チームに助言して研修を行い、サービス、臨床システム、健康情報が設計、調達、構築される方法にアクセシビリティを組み込むのを支援する。
health_context:
  - 保健・ケアのサービスを最も必要とする多くの人は、障害がある、高齢である、長期の疾患とともに暮らしているため、アクセスしにくいサービスは人々がケアを受けるのを妨げうる。
  - 臨床医とケア職員にもアクセスのニーズがあるため、供給者から購入したものを含め、社内の臨床システムもアクセスしやすくなければならない。
  - 健康情報は複雑で、文書、手紙、動画など多くの形式で公開されることが多いため、スペシャリストは、やさしい日本語などの読みやすい形式や代替形式を含め、そのすべてをアクセスしやすくするのをチームに手助けする。
  - 臨床ワークフローのアクセシビリティの問題は、たとえば警告がスクリーンリーダーで読み上げられないといった形で、安全上の問題になりうるため、スペシャリストは臨床安全責任者とこれらのリスクに取り組む。
levels:
  - title: ジュニア アクセシビリティスペシャリスト
    responsibilities:
      - 監督のもとで、ウェブページ、アプリ、文書をアクセシビリティ標準に照らしてテストする。
      - チームが修正できるよう、アクセシビリティの問題を明確に記録し、説明する。
      - スクリーンリーダーや拡大鏡などの支援技術を使ったテストを手伝う。
      - アクセシビリティ声明と課題ログを最新に保つのを手伝う。
    qualifications:
      - デジタルのテスト、デザイン、または開発の一定の経験、または同等の経験。
  - title: アクセシビリティスペシャリスト
    responsibilities:
      - 患者向けサービス、臨床システム、健康情報のアクセシビリティ監査を実施する。
      - さまざまな支援技術でテストし、障害のある利用者へのリサーチを支援する。
      - 修正方法や、フォーム、アラート、安全上重要な情報のアクセスしやすいパターンについて、チームに助言する。
      - 調達と受け入れの際に、供給者の製品のアクセシビリティをレビューする。
      - 研修とガイダンスを作成し、より若手の同僚をコーチする。
    qualifications:
      - アクセシビリティのテストと最新のアクセシビリティ標準の経験、または同等の経験。
  - title: シニア アクセシビリティスペシャリスト
    responsibilities:
      - ディスカバリーから稼働中のサービスまで、チームの仕事の進め方にアクセシビリティを組み込む。
      - 調達やサービス評価でアクセシビリティをどう保証するかを含め、アクセシビリティ戦略に貢献する。
      - アクセシビリティの問題が患者の安全に影響しうる場合は、臨床安全責任者と協力する。
      - デザイナー、開発者、コンテンツデザイナー、供給者向けのアクセシビリティ研修を作成して提供する。
      - 他のアクセシビリティスペシャリストを率いる、または管理する。
    qualifications:
      - アクセシビリティの相当の経験(修士相当のレベル)。
  - title: アクセシビリティ責任者
    responsibilities:
      - 患者向けサービスと社内サービスについて、組織のアクセシビリティのビジョン、戦略、基準を定める。
      - サービス全体でアクセシビリティの法律と標準への準拠を保証し、シニアリーダーに報告する。
      - アクセシビリティの要件が、臨床システムの調達と供給者との契約の一部になるようにする。
      - 障害のある患者や職員が排除されないよう、組織の優先事項に影響を与える。
      - アクセシビリティチームとコミュニティ・オブ・プラクティスを率い、育成する。
    qualifications:
      - 複雑な組織でアクセシビリティを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF がアクセシビリティ責任者を G7 または G6 に置き、このリファレンスが示唆されたバンド 8b に従うため、バンド 8a のレベルはない。
