summary: >
  デジタルポートフォリオマネージャーは、組織がデジタルのプロジェクト、プログラム、プロダクトのポートフォリオを選び、追跡し、統治するのを助け、患者、臨床医、ケア職員に最も役立つ仕事に投資できるようにする。ポートフォリオのガバナンスと報告を運営し、リーダーが十分な根拠をもって優先順位をつけるのを助け、ポートフォリオが約束した便益をもたらすようにする。
health_context:
  - デジタルの仕事は第一線のケアと資金を競うため、ポートフォリオマネージャーは、リーダーが患者と職員にとってのデジタル投資の便益を示すのを助ける。
  - ポートフォリオのガバナンスには、臨床安全、情報ガバナンス、サイバーセキュリティの保証が含まれなければならないため、ポートフォリオマネージャーはこれらを期間、コスト、範囲とともに追跡する。
  - 多くのデジタルプロジェクトは、テストを行う臨床医や研修を受ける職員など、臨床・運用チームのキャパシティに依存するため、ポートフォリオマネージャーはサービスへの需要の衝突に目を配る。
  - 資金は、独自の報告規則と期限を持つ複数の財源から来ることが多いため、ポートフォリオマネージャーは報告を正確かつ期限どおりに保つ。
levels:
  - title: デジタルポートフォリオアナリスト
    responsibilities:
      - ポートフォリオ全体のプロジェクトから、状況、リスク、財務、便益のデータを集めて確認する。
      - ポートフォリオ登録簿とダッシュボードを維持し、報告のギャップや不整合を見つける。
      - ポートフォリオのガバナンス委員会向けの資料と報告書を作成する。
      - 臨床安全の承認やデータ保護影響評価など、プロジェクト全体の保証のマイルストーンを追跡する。
      - 優先順位づけと計画の分析で、ポートフォリオマネージャーを支援する。
    qualifications:
      - 学位または関連資格、または分析や報告に関する同等の経験。
    job_evaluation_notes: UK GDaD PCF は、アナリストとマネージャーの両レベルを HEO または SEO に置いている。このリファレンスは、アナリストをポートフォリオマネージャーに報告する学習段階のレベルであるためバンド 5 に、マネージャーをバンド 6 に置き、2 つのレベルが同じバンドにならないようにしている。
  - title: デジタルポートフォリオマネージャー
    responsibilities:
      - 1 つのディレクトレートのすべてのデジタル業務など、デジタルプロジェクトとプログラムのポートフォリオを調整する。
      - チームがガバナンス、保証、デリバリーのプロセスに従い、それが過不足のないものになるよう支援する。
      - ニーズ、便益、リスク、キャパシティの根拠を用いて、リーダーが仕事に優先順位をつけるのを支援する。
      - ポートフォリオの実績、リスク、便益を、委員会とステークホルダーに明確に報告する。
      - プロジェクト全体で臨床・運用チームへの需要の衝突を見つけ、その解決を手助けする。
    qualifications:
      - ポートフォリオ、プログラム、またはプロジェクトマネジメントの経験、または同等の経験。
  - title: シニア デジタルポートフォリオマネージャー
    responsibilities:
      - 組織のデジタルポートフォリオまたはその大部分と、そのガバナンスおよび保証のプロセスを管理する。
      - ポートフォリオ全体の成果と便益を追跡・分析し、チームがデリバリーできるよう課題に対処する。
      - ポートフォリオが、臨床安全、情報ガバナンス、サイバーセキュリティの保証を含む標準を満たすようにする。
      - 優先順位づけ、投資、トレードオフについて、明確な根拠をもってシニアリーダーに助言する。
      - 資金提供者や外部機関へのポートフォリオ報告を管理する。
      - ポートフォリオアナリストとマネージャーをライン管理する。
    qualifications:
      - ポートフォリオまたはプログラムマネジメントの豊富な経験(修士相当のレベル)。
    job_evaluation_notes: UK GDaD PCF がデジタルポートフォリオマネージャー(HEO/SEO)からシニアデジタルポートフォリオマネージャー(G7)へ移るため、バンド 7 のレベルはない。
  - title: デジタルポートフォリオ責任者
    responsibilities:
      - デジタルポートフォリオ機能とポートフォリオマネージャーのチームを率いる。
      - ポートフォリオの戦略、統制、ガバナンスを定め、それが使われるようにする。
      - 経営層が投資の判断を下せるよう、ポートフォリオの将来についての洞察を提供する。
      - ポートフォリオが患者、職員、組織にもたらす便益が実現され、報告されるようにする。
      - ポートフォリオレベルのリスクに対処し、課題を経営チームにエスカレーションする。
      - 機能の予算と能力を管理する。
    qualifications:
      - 複雑な組織でポートフォリオマネジメントを率いた豊富な経験。
    job_evaluation_notes: デジタルポートフォリオ責任者が複数のサービスにまたがるデジタルポートフォリオ全体の投資を監督するため、財務資源はレベル 5 で評価している。ポートフォリオ登録簿と報告が組織全体に及ぶため、情報資源はレベル 6 とする。
