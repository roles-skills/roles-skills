summary: >
  ユーザーリサーチャーは、チームが、患者、介護者、臨床医、ケア職員を含め、保健・ケアのサービスを利用し提供する人々を理解するのを助ける。リサーチを安全かつ倫理的に計画して実施し、学んだことを明確な洞察に変え、サービスを最も使いにくい人々のニーズを含め、実際のニーズに関する根拠にもとづいて、デジタルヘルスサービスの意思決定が行われるようにする。
health_context:
  - 調査の参加者は、体調がすぐれない、不安を抱えている、または脆弱な状況にあることが多いため、リサーチャーはインフォームド・コンセント、セーフガーディング、参加者のウェルビーイングを慎重に計画する。
  - リサーチでは、病気、喪失、不十分なケアといったつらい体験を聞くことがあるため、リサーチャーには、自分自身とチームへの感情面の影響に対処する支援が必要である。
  - 臨床医とケア職員は患者のそばを離れる時間がほとんどないため、リサーチャーは、多くは観察と短いセッションを通じて、ケアを妨げずに臨床現場でのリサーチを計画する。
  - 一部のリサーチは正式な保健研究にあたる、または患者データを使うため、リサーチャーは、倫理やリサーチガバナンスの承認とデータ保護のチェックがいつ適用されるかを知る必要がある。
  - 健康格差は現実にあるため、リサーチャーは、デジタルスキルが低い人、障害のある人、英語が限られた人、サービスをほとんど使わない人を含めるよう意識的に努める。
levels:
  - title: アソシエイト ユーザーリサーチャー
    responsibilities:
      - 研修と経験のあるリサーチャーとの協働を通じて、ユーザーリサーチの手法を学ぶ。
      - 同意とセーフガーディングの手順に従い、メモを取り、セッションの運営と参加者の募集を手伝う。
      - リサーチデータを、安全に、情報ガバナンスの規則に沿って保管する。
      - リサーチデータの分析を手伝い、発見をチームと共有する。
    qualifications:
      - 関連分野の資格またはアプレンティスシップの取得を目指している、または同等の経験。
    job_evaluation_notes: 患者や介護者へのリサーチでは、病気、喪失、不十分なケアについて聞くことが多いため、感情的負荷はユーザーリサーチャーのすべてのレベルでレベル 2 とする。リサーチはここではレベル 2 から評価し、リサーチが主な職務になるとレベル 3 に上がる。
  - title: ジュニア ユーザーリサーチャー
    responsibilities:
      - より上位のリサーチャーの指導を受けながら、患者、介護者、職員とのリサーチセッションを計画し、実施する。
      - ケア現場で、インタビュー、ユーザビリティテスト、コンテキスト観察などの手法を用いる。
      - インフォームド・コンセントを得て、参加者のニーズに合わせてセッションを調整し、セーフガーディング上の懸念を提起する。
      - 発見を分析し、明確で実行可能な洞察としてチームに提示する。
      - サービスを使いにくい人を含め、多様な参加者を募集する。
    qualifications:
      - 社会科学や心理学など、関連する科目の学位、または同等の経験。
  - title: ユーザーリサーチャー
    responsibilities:
      - 多職種チームのためにユーザーリサーチを計画して実施し、問いと参加者に合った手法を選ぶ。
      - 臨床のワークフローと安全上重要なタスクを理解するため、臨床医とケア職員の職場でリサーチを行う。
      - 脆弱な状況にある人々へのリサーチを安全に計画し、倫理やリサーチガバナンスの承認がいつ必要かを判断する。
      - 安全性とアクセシビリティに関する根拠を含め、チームが優先順位をつけるのに役立つ洞察を共有する。
      - チームをリサーチに巻き込み、利用者を直接理解できるようにする。
    qualifications:
      - 関連する科目の学位、または同等の経験。
      - ユーザーリサーチの計画と実施の経験。
  - title: シニア ユーザーリサーチャー
    responsibilities:
      - 複数のケア現場にまたがるサービスや、危機にある人々に役立つサービスなど、複雑なサービスのリサーチを計画し、主導する。
      - リサーチを、サービスのより広い計画や他のチームのリサーチと整合させる。
      - 脆弱な状況にある人々への安全なリサーチを計画し、倫理とリサーチガバナンスの申請書を準備する。
      - ユーザーリサーチャーを監督し、育成し、その仕事の質と倫理を保証する。
      - 新しいチームや臨床のステークホルダーとともに、ユーザー中心の実践を築く。
    qualifications:
      - ユーザーリサーチの相当の経験(修士相当のレベル)。
  - title: リード ユーザーリサーチャー
    responsibilities:
      - 複数のチームまたはプログラム全体にわたって、ユーザーリサーチを率い、整合させる。
      - チームがユーザー中心で根拠にもとづく取り組み方をとり、リサーチが健康格差の影響を最も受ける人々に届くようにする。
      - 同意、セーフガーディング、データの取り扱い、参加者のウェルビーイングを含め、リサーチの実践を定め、保証する。
      - リサーチリポジトリや参加者パネルなど、チームが安全に再利用できる共有のリサーチ資産を築く。
      - ユーザーリサーチャーをライン管理し、育成する。
    qualifications:
      - チームを横断してユーザーリサーチを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF がリードユーザーリサーチャーを G7 または G6 に置き、このリファレンスが示唆されたバンド 8b に従うため、バンド 8a のレベルはない。財務資源は、参加者の募集や謝礼などのリサーチ予算のためレベル 3 とする。
  - title: ユーザーリサーチ責任者
    responsibilities:
      - ユーザーリサーチ専門職を率い、その戦略、基準、倫理を定める。
      - 患者、介護者、ケア職員に関する根拠をもって、組織の戦略と優先順位に影響を与える。
      - キャリアパスと採用を含め、リサーチ人材を惹きつけ、築き、育成する。
      - 組織全体のリサーチの実践を保証し、リスクの高いリサーチのエスカレーション先となる。
      - 倫理、セーフガーディング、リサーチガバナンスの機関に対して、リサーチの実践を代表する。
    qualifications:
      - ユーザーリサーチと研究の実践を率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF は、リードユーザーリサーチャーとユーザーリサーチ責任者の両方を、示唆されるバンド 8b の G7 または G6 に置いている。このリファレンスは、責任者が組織全体で専門職を率い、そのリサーチプログラムを始動させるため、他のユーザー中心デザイン専門職の責任者に合わせて、責任者をバンド 8c に置いている。
