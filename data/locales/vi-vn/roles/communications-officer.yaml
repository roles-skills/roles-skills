summary: Nhân viên truyền thông giúp tổ chức giải thích những gì mình làm cho nhân viên, bệnh nhân, công chúng, đối tác và báo chí. Họ viết và đăng nội dung, thực hiện truyền thông nội bộ và các chiến dịch, quản lý các kênh số và mạng xã hội, xử lý các yêu cầu của báo chí và bảo vệ danh tiếng của tổ chức, đặc biệt khi có sự cố và gián đoạn dịch vụ.
health_context:
- Truyền thông về các dịch vụ y tế phải chính xác, rõ ràng và dễ tiếp cận, vì bệnh nhân có thể hành động theo đó.
- Các chiến dịch thường nhằm thay đổi hành vi, như khuyến khích bệnh nhân và nhân viên chăm sóc dùng một dịch vụ số mới.
- Gián đoạn dịch vụ, sự cố an ninh mạng và vi phạm dữ liệu cần truyền thông nhanh chóng, cẩn trọng với bệnh nhân, nhân viên, đối tác và báo chí.
- Các câu chuyện về bệnh nhân cần có sự đồng ý và phải bảo vệ bí mật thông tin.
levels:
- title: Cán bộ truyền thông
  summary: Viết và đăng nội dung cho các kênh nội bộ và bên ngoài và hỗ trợ nhóm truyền thông trong công việc thường lệ về báo chí và chiến dịch.
  responsibilities:
  - Viết và biên tập tin tức, nội dung mạng nội bộ, bản tin và bài đăng mạng xã hội.
  - Đăng nội dung đã được phê duyệt lên trang web, mạng nội bộ và mạng xã hội.
  - Ghi nhận các yêu cầu của báo chí và theo dõi việc đưa tin.
  - Hỗ trợ các chiến dịch và sự kiện bằng nội dung và hậu cần.
  - Kiểm tra nội dung về độ chính xác, khả năng tiếp cận và ngôn ngữ giản dị.
  qualifications:
  - Có kinh nghiệm viết cho các đối tượng khác nhau, hoặc bằng cấp về truyền thông hoặc một ngành liên quan, hoặc kinh nghiệm tương đương.
- title: Cán bộ truyền thông cao cấp
  summary: Lập kế hoạch và thực hiện truyền thông cho các dự án và dịch vụ, xử lý các yêu cầu thường lệ của báo chí và quản lý các kênh.
  responsibilities:
  - Lập kế hoạch và thực hiện truyền thông cho các dự án và thay đổi dịch vụ.
  - Trả lời các yêu cầu thường lệ của báo chí và soạn thảo thông cáo báo chí và tuyên bố.
  - Quản lý kế hoạch nội dung cho các kênh số và mạng xã hội, và báo cáo hiệu quả.
  - Viết các nghiên cứu điển hình, kể cả câu chuyện của bệnh nhân, khi có sự đồng ý.
  - Tư vấn cho đồng nghiệp về cách viết rõ ràng cho bệnh nhân và công chúng.
  - Huấn luyện các cán bộ truyền thông.
  qualifications:
  - Có bằng đại học hoặc bằng cấp về truyền thông hoặc một ngành liên quan, hoặc kinh nghiệm tương đương.
- title: Trưởng nhóm truyền thông
  summary: Dẫn dắt truyền thông cho một chương trình hoặc mảng lớn, như truyền thông nội bộ hoặc các kênh số, và xử lý công việc nhạy cảm với báo chí.
  responsibilities:
  - Dẫn dắt truyền thông và thu hút sự tham gia cho một chương trình lớn, như một hệ thống lâm sàng mới.
  - Lập kế hoạch và đánh giá các chiến dịch khuyến khích bệnh nhân và nhân viên áp dụng các dịch vụ số.
  - Xử lý các yêu cầu nhạy cảm của báo chí và chuẩn bị người phát ngôn.
  - Lập kế hoạch truyền thông cho các sự cố và gián đoạn dịch vụ cùng các nhóm vận hành.
  - Tư vấn cho các lãnh đạo về cách truyền đạt thay đổi và các thông điệp khó.
  - Giám sát các cán bộ truyền thông.
  qualifications:
  - Có bằng đại học hoặc bằng cấp nghề nghiệp về truyền thông, hoặc kinh nghiệm tương đương.
  - Có kinh nghiệm lập kế hoạch và đánh giá các chiến dịch.
- title: Quản lý truyền thông
  summary: Quản lý công việc và các kênh của nhóm truyền thông, và dẫn dắt việc làm việc với báo chí và truyền thông cho các sự cố.
  responsibilities:
  - Quản lý nhóm truyền thông, kế hoạch công việc và ngân sách của nhóm.
  - Dẫn dắt công việc báo chí mang tính ứng phó và chủ động, kể cả khi có sự cố và vi phạm dữ liệu.
  - Quản lý các kênh, thương hiệu và tiêu chuẩn nội dung của tổ chức.
  - Tư vấn cho các giám đốc về truyền thông và các rủi ro danh tiếng.
  - Đánh giá truyền thông và báo cáo tác động của chúng.
  - Làm việc với các tổ chức đối tác về truyền thông chung.
  qualifications:
  - Có bằng cấp nghề nghiệp về truyền thông, hoặc kinh nghiệm tương đương.
  - Có kinh nghiệm dày dặn về quan hệ báo chí và quản lý truyền thông.
  job_evaluation_notes: Nỗ lực cảm xúc phản ánh việc thỉnh thoảng phải xử lý tài liệu gây đau buồn khi có sự cố và trong các câu chuyện của bệnh nhân.
- title: Trưởng bộ phận truyền thông
  summary: Dẫn dắt truyền thông và thu hút sự tham gia cho tổ chức, đề ra chiến lược và tư vấn cho hội đồng về danh tiếng.
  responsibilities:
  - Đề ra chiến lược truyền thông và thu hút sự tham gia cho tổ chức.
  - Dẫn dắt và phát triển chức năng truyền thông và quản lý ngân sách của chức năng này.
  - Tư vấn cho giám đốc điều hành và hội đồng về danh tiếng, việc thu hút các bên liên quan và rủi ro truyền thông.
  - Dẫn dắt truyền thông trong khủng hoảng khi có các sự cố lớn.
  - Xây dựng quan hệ với các đối tác cấp cao, nhà báo và các nhóm bệnh nhân.
  - Định hình cách tổ chức giải thích các dịch vụ số và việc sử dụng dữ liệu của mình cho công chúng.
  qualifications:
  - Có bằng cấp nghề nghiệp về truyền thông, hoặc kinh nghiệm tương đương.
  - Có kinh nghiệm sâu rộng trong việc dẫn dắt truyền thông cho một tổ chức phức tạp.
