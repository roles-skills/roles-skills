summary: Nhà thiết kế nội dung làm cho thông tin và dịch vụ y tế và chăm sóc trở nên rõ ràng, để bệnh nhân, người chăm sóc, bác sĩ lâm sàng và nhân viên chăm sóc hiểu được những gì họ cần biết và làm. Họ thiết kế nội dung từ bằng chứng về nhu cầu của người dùng, viết bằng ngôn ngữ giản dị, phối hợp với các chuyên gia lâm sàng để giữ cho nội dung chính xác, và chăm lo nội dung trong suốt vòng đời, từ khi tạo ra đến khi rà soát và ngừng sử dụng.
health_context:
- Mọi người thường đọc nội dung sức khỏe khi đang lo lắng, ốm đau hoặc vội vã, nên nội dung phải dễ hiểu và dễ làm theo đối với những người ít hiểu biết về sức khỏe.
- Thông tin sức khỏe sai hoặc lỗi thời có thể gây hại, nên nhà thiết kế nội dung tuân theo quy trình đảm bảo lâm sàng với ngày rà soát và người rà soát lâm sàng có tên.
- Một số chủ đề nhạy cảm hoặc rủi ro cao, như triệu chứng khẩn cấp, sức khỏe tâm thần, thuốc và chăm sóc cuối đời, nên nhà thiết kế nội dung làm việc chặt chẽ với bác sĩ lâm sàng và nhà nghiên cứu người dùng về giọng điệu và độ chính xác.
- Các hệ thống lâm sàng cũng cần nội dung rõ ràng, như nhãn, hướng dẫn và cảnh báo, nên nhà thiết kế nội dung giúp giảm sai sót trong quy trình lâm sàng.
- Nội dung sức khỏe phải dễ tiếp cận và hòa nhập, kể cả với những người dùng công nghệ hỗ trợ, đọc bằng ngôn ngữ khác hoặc cần định dạng dễ đọc.
levels:
- title: Nhà thiết kế nội dung trợ lý
  responsibilities:
  - Học các phương pháp thiết kế nội dung, hướng dẫn phong cách và quy trình rà soát lâm sàng qua đào tạo và công việc có giám sát.
  - Thực hiện các kiểm tra chuẩn, biên tập văn bản và cập nhật nội dung hiện có.
  - Đăng nội dung bằng hệ thống quản lý nội dung, theo các bước đảm bảo.
  - Kiểm tra nội dung về khả năng tiếp cận, như tiêu đề, văn bản liên kết và văn bản thay thế.
  qualifications:
  - Đang hướng tới bằng cấp hoặc chương trình học nghề trong lĩnh vực liên quan, hoặc kinh nghiệm tương đương.
- title: Nhà thiết kế nội dung sơ cấp
  responsibilities:
  - Viết và cập nhật nội dung sức khỏe và nội dung dịch vụ, theo chỉ đạo của các nhà thiết kế nội dung cấp cao hơn.
  - Dùng nghiên cứu và dữ liệu để xác định người dùng cần biết gì và những từ ngữ họ dùng.
  - Làm việc với những người rà soát lâm sàng để kiểm tra độ chính xác, và giải thích các thuật ngữ y khoa bằng ngôn ngữ giản dị.
  - Hỗ trợ việc đăng nội dung, ngày rà soát và công tác hành chính của nhóm nội dung.
  qualifications:
  - Có bằng đại học hoặc bằng cấp liên quan, hoặc kinh nghiệm tương đương về viết cho web.
- title: Nhà thiết kế nội dung
  responsibilities:
  - Thiết kế nội dung xuyên suốt toàn bộ hành trình của người dùng, như tìm một dịch vụ, chuẩn bị cho cuộc hẹn và chăm sóc sau đó.
  - Thiết kế nội dung cho các hệ thống lâm sàng, như nhãn, hướng dẫn và cảnh báo, để giảm khả năng sai sót.
  - Thống nhất độ chính xác với các chuyên gia lâm sàng trong khi vẫn giữ nội dung rõ ràng và dễ dùng.
  - Kiểm thử nội dung với người dùng, kể cả những người ít hiểu biết về sức khỏe và những người dùng công nghệ hỗ trợ.
  - Đóng góp vào hướng dẫn phong cách và các mẫu nội dung.
  qualifications:
  - Có bằng đại học hoặc bằng cấp liên quan, hoặc kinh nghiệm tương đương.
  - Có kinh nghiệm thiết kế nội dung cho các dịch vụ số.
- title: Nhà thiết kế nội dung cao cấp
  responsibilities:
  - Xây dựng chiến lược nội dung cho các mảng lớn hoặc được chú ý, như một mảng bệnh lý lớn hoặc một chiến dịch y tế công cộng.
  - Thiết kế nội dung cho các chủ đề nhạy cảm và rủi ro cao, như triệu chứng khẩn cấp, sức khỏe tâm thần và chăm sóc cuối đời.
  - Thiết lập việc đảm bảo lâm sàng, nguồn bằng chứng và chu kỳ rà soát cho một khối nội dung sức khỏe.
  - Rà soát công việc của người khác để bảo đảm chất lượng, và quản lý hoặc kèm cặp các nhà thiết kế nội dung.
  - Viết và lập sơ đồ các câu chuyện người dùng cùng nhóm.
  qualifications:
  - Có kinh nghiệm dày dặn về thiết kế nội dung, ở mức tương đương bằng thạc sĩ.
  job_evaluation_notes: Nỗ lực cảm xúc ở mức 2 vì các nhà thiết kế nội dung cao cấp thường xuyên làm việc với các chủ đề gây đau buồn, như bệnh nặng, tự hại và mất người thân.
- title: Trưởng nhóm thiết kế nội dung
  responsibilities:
  - Chỉ đạo một nhóm các nhà thiết kế nội dung và bảo đảm chất lượng nội dung trên nhiều nhóm.
  - Bảo đảm nội dung sức khỏe đáp ứng các tiêu chuẩn về đảm bảo lâm sàng, khả năng tiếp cận và phong cách.
  - Làm việc với các lãnh đạo lâm sàng, truyền thông và sản phẩm cấp cao để bố trí nguồn lực cho các nhóm và giải quyết các vấn đề về nội dung.
  - Dẫn dắt nội dung cho thông tin nhạy cảm hoặc rủi ro cao nhất của tổ chức.
  - Quản lý trực tiếp và phát triển các nhà thiết kế nội dung.
  qualifications:
  - Có kinh nghiệm sâu rộng trong việc dẫn dắt thiết kế nội dung trên nhiều nhóm.
  job_evaluation_notes: Không có cấp vai trò ở Bậc 8a, vì UK GDaD PCF xếp trưởng nhóm thiết kế nội dung ở ngạch G7 hoặc G6 và tài liệu tham khảo này theo Bậc 8b được đề xuất. Chính sách ở mức 5 vì trưởng nhóm đề ra tiêu chuẩn nội dung cho nhiều dịch vụ; nỗ lực cảm xúc ở mức 2, như với các nhà thiết kế nội dung cao cấp.
- title: Trưởng bộ phận thiết kế nội dung
  responsibilities:
  - Xây dựng chiến lược nội dung đáp ứng các mục tiêu của tổ chức và nhu cầu của bệnh nhân và nhân viên.
  - Đề ra tiêu chuẩn của tổ chức về nội dung thông tin sức khỏe và việc đảm bảo lâm sàng cho nội dung đó.
  - Dẫn dắt một nhóm thiết kế nội dung có khả năng thực hiện chiến lược, kể cả tuyển dụng và phát triển.
  - Làm việc với các lãnh đạo lâm sàng và truyền thông cấp cao để quản lý các rủi ro của thông tin sức khỏe.
  - Sắp xếp thứ tự ưu tiên công việc nội dung trong toàn tổ chức.
  qualifications:
  - Có kinh nghiệm sâu rộng trong việc dẫn dắt thiết kế nội dung và một ngành thực hành nội dung.
  job_evaluation_notes: UK GDaD PCF xếp cả trưởng nhóm thiết kế nội dung và trưởng bộ phận thiết kế nội dung ở ngạch G7 hoặc G6, với Bậc 8b được đề xuất. Tài liệu tham khảo này xếp trưởng bộ phận ở Bậc 8c, phù hợp với các trưởng bộ phận của các ngành thiết kế lấy người dùng làm trung tâm khác, vì trưởng bộ phận đề ra chiến lược và tiêu chuẩn nội dung cho toàn tổ chức.
