summary: 'Bedrijfsarchitecten bouwen een duidelijk, samenhangend beeld van hoe de organisatie gezondheid en zorg levert: haar capaciteiten, diensten, zorgpaden, processen en informatie. Zij gebruiken dat beeld om te laten zien waar verandering nodig is, om strategie met programma’s te verbinden en te zorgen dat digitale verandering de zorg voor patiënten en het werkende leven van clinici en zorgpersoneel verbetert.'
health_context:
- Zorgpaden overschrijden teams, omgevingen en organisaties, dus bedrijfsarchitecten modelleren diensten vanuit het perspectief van de patiënt en niet alleen per afdeling.
- Verandering in klinische processen kan de patiëntveiligheid en de werkdruk van personeel raken, dus modellen worden samen met clinici en zorgpersoneel gebouwd en getoetst aan de echte praktijk.
- Strategie voor gezondheid en zorg wordt gevormd door beleid, regelgeving en financieringsregels, die architecten moeten vertalen naar praktische wijzigingen in capaciteiten.
- Veel capaciteiten worden gedeeld met partnerorganisaties, dus architecten helpen afspreken wie wat doet en waar informatie moet stromen.
levels:
- title: Trainee bedrijfsarchitect
  responsibilities:
  - Methoden van bedrijfsarchitectuur, zoals modelleren van capaciteiten, waardestromen en processen, leren via training en praktijk.
  - Informatie over diensten en zorgpaden verzamelen via interviews, documenten en observatie.
  - Capaciteitenkaarten en procesmodellen opstellen met begeleiding van bedrijfsarchitecten.
  - Helpen bij het houden van workshops met clinici, zorgpersoneel en managers en de resultaten uitwerken.
  qualifications:
  - Een bachelor of gelijkwaardige ervaring in bedrijfskunde, analyse of een verwant vak.
  - Gespecialiseerde training in methoden van bedrijfsarchitectuur, op het niveau van een postdoctoraal diploma of gelijkwaardige ervaring.
  job_evaluation_notes: 'Hoger ingeschaald dan het voorstel voor rang van het UK GDaD PCF (Band 5): vacatures in de gezondheidssector plaatsen deze rol op Band 6. Kennis wordt gescoord op het niveau dat de functie vraagt zodra de training ver genoeg is gevorderd om het werk te doen.'
- title: Associate bedrijfsarchitect
  responsibilities:
  - Capaciteiten, diensten en zorgpaden modelleren voor een deel van de organisatie.
  - Modellen analyseren om hiaten, dubbel werk en knelpunten voor patiënten en personeel te vinden.
  - Informatie van verschillende teams en organisaties samenbrengen om beslissingen over verandering te onderbouwen.
  - Complexe problemen in diensten aan belanghebbenden uitleggen met duidelijke modellen en gewone taal.
  - De opslagplaats van bedrijfsarchitectuur nauwkeurig houden en koppelen aan modellen van applicaties en data.
  qualifications:
  - Gespecialiseerde kennis van bedrijfsarchitectuur of bedrijfsanalyse, op masterniveau of gelijkwaardige ervaring.
  - Ervaring met bedrijfsanalyse of servicedesign.
  job_evaluation_notes: 'Hoger ingeschaald dan het voorstel voor rang van het UK GDaD PCF (Band 6): vacatures in de gezondheidssector plaatsen deze rol op Band 7. Kennis wordt gescoord op masterniveau of gelijkwaardig, omdat de functie diensten en zorgpaden over teams en organisaties heen modelleert en analyseert.'
- title: Bedrijfsarchitect
  responsibilities:
  - Huidige en beoogde bedrijfsarchitecturen ontwikkelen voor een groot servicegebied, zoals spoedzorg of gemeenschapsdiensten.
  - Strategie en beleid vertalen naar wijzigingen in capaciteiten en een roadmap van verandering.
  - Controleren of de reikwijdte van programma’s en projecten past bij de beoogde bedrijfsarchitectuur.
  - Met klinische leiders beoordelen hoe voorgestelde wijzigingen zorgpaden, veiligheid en werkdruk van personeel raken.
  - Andere bedrijfsarchitecten begeleiden in methoden en instrumenten.
  qualifications:
  - Aanzienlijke ervaring met bedrijfsarchitectuur, bedrijfsanalyse of servicedesign, op een niveau gelijkwaardig aan een master.
  job_evaluation_notes: 'Hoger ingeschaald dan het voorstel voor rang van het UK GDaD PCF (Band 7): vacatures in de gezondheidssector plaatsen deze rol op Band 8a. Planning, beleid en handelingsvrijheid worden hoger gescoord dan het profiel van Band 7 omdat de functie strategie omzet in een roadmap van verandering voor een groot servicegebied.'
- title: Lead bedrijfsarchitect
  responsibilities:
  - De praktijk van bedrijfsarchitectuur leiden en verantwoordelijk zijn voor de resultaten ervan.
  - Het beeld van de hele organisatie van capaciteiten, diensten en zorgpaden bijhouden en het gemakkelijk te begrijpen houden.
  - Directeuren adviseren over de prioriteiten voor verandering en hoe investeringsportfolio’s bij de strategie passen.
  - Met partnerorganisaties samenwerken om gedeelde capaciteiten en verantwoordelijkheden over zorgpaden af te spreken.
  - Bedrijfsarchitecten leiden en ontwikkelen.
  qualifications:
  - Uitgebreide ervaring met het leiden van bedrijfsarchitectuur in een complexe organisatie.
