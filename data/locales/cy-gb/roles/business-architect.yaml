summary: >
  Mae penseiri busnes yn llunio golwg glir a chydgysylltiedig o sut mae'r sefydliad yn darparu iechyd a gofal:
  ei alluoedd, ei wasanaethau, ei lwybrau gofal, ei brosesau, a'i wybodaeth. Maen nhw'n defnyddio'r olwg honno i
  ddangos lle mae angen newid, i gysylltu strategaeth â rhaglenni, ac i sicrhau bod newid digidol yn gwella gofal
  i gleifion a bywydau gwaith clinigwyr a staff gofal.
health_context:
  - Mae llwybrau gofal yn croesi timau, lleoliadau, a sefydliadau, felly mae penseiri busnes yn modelu gwasanaethau o safbwynt y claf, nid fesul adran yn unig.
  - Gall newid mewn prosesau clinigol effeithio ar ddiogelwch cleifion a llwyth gwaith staff, felly caiff modelau eu hadeiladu gyda chlinigwyr a staff gofal a'u gwirio yn erbyn ymarfer go iawn.
  - Caiff strategaeth iechyd a gofal ei llunio gan bolisi, rheoleiddio, a rheolau cyllido, y mae'n rhaid i benseiri eu trosi'n newidiadau ymarferol i alluoedd.
  - Mae llawer o alluoedd yn cael eu rhannu â sefydliadau partner, felly mae penseiri'n helpu i gytuno pwy sy'n gwneud beth a ble mae'n rhaid i wybodaeth lifo.
levels:
  - title: Pensaer busnes dan hyfforddiant
    slug: pensaer-busnes-dan-hyfforddiant
    responsibilities:
      - Dysgu dulliau pensaernïaeth busnes, fel modelu galluoedd, ffrydiau gwerth, a phrosesau, drwy hyfforddiant ac ymarfer.
      - Casglu gwybodaeth am wasanaethau a llwybrau gofal drwy gyfweliadau, dogfennau, ac arsylwi.
      - Drafftio mapiau galluoedd a modelau prosesau gydag arweiniad gan benseiri busnes.
      - Helpu i redeg gweithdai gyda chlinigwyr, staff gofal, a rheolwyr, ac ysgrifennu'r allbynnau.
    qualifications:
      - Gradd neu brofiad cyfatebol mewn busnes, dadansoddi, neu bwnc cysylltiedig.
      - Hyfforddiant arbenigol mewn dulliau pensaernïaeth busnes, ar lefel diploma ôl-raddedig neu brofiad cyfatebol.
    job_evaluation_notes: "Wedi'i fandio uwchlaw awgrym gradd UK GDaD PCF (Band 5): mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 6. Caiff gwybodaeth ei sgorio ar y lefel sydd ei hangen ar y swydd unwaith y bydd yr hyfforddiant yn ddigon cyflawn i wneud y gwaith."
  - title: Pensaer busnes cyswllt
    slug: pensaer-busnes-cyswllt
    responsibilities:
      - Modelu galluoedd, gwasanaethau, a llwybrau gofal ar gyfer rhan o'r sefydliad.
      - Dadansoddi modelau i ddod o hyd i fylchau, dyblygu, a phwyntiau poen i gleifion a staff.
      - Dwyn ynghyd wybodaeth gan wahanol dimau a sefydliadau i lywio penderfyniadau ar newid.
      - Egluro problemau gwasanaeth cymhleth i randdeiliaid gan ddefnyddio modelau clir ac iaith glir.
      - Cadw'r storfa pensaernïaeth busnes yn gywir ac wedi'i chysylltu â modelau cymwysiadau a data.
    qualifications:
      - Gwybodaeth arbenigol am bensaernïaeth busnes neu ddadansoddi busnes, ar lefel gradd meistr neu brofiad cyfatebol.
      - Profiad o ddadansoddi busnes neu ddylunio gwasanaethau.
    job_evaluation_notes: "Wedi'i fandio uwchlaw awgrym gradd UK GDaD PCF (Band 6): mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 7. Caiff gwybodaeth ei sgorio ar lefel gradd meistr neu gyfatebol, gan fod y swydd yn modelu ac yn dadansoddi gwasanaethau a llwybrau gofal ar draws timau a sefydliadau."
  - title: Pensaer busnes
    slug: pensaer-busnes
    responsibilities:
      - Datblygu pensaernïaeth busnes bresennol a tharged ar gyfer maes gwasanaeth mawr, fel gofal brys neu wasanaethau cymunedol.
      - Trosi strategaeth a pholisi'n newidiadau i alluoedd ac yn fap ffordd o newid.
      - Gwirio bod cwmpas rhaglenni a phrosiectau'n ffitio'r bensaernïaeth busnes darged.
      - Gweithio gydag arweinwyr clinigol i asesu sut mae newidiadau arfaethedig yn effeithio ar lwybrau gofal, diogelwch, a llwyth gwaith staff.
      - Arwain penseiri busnes eraill mewn dulliau ac offer.
    qualifications:
      - Profiad sylweddol o bensaernïaeth busnes, dadansoddi busnes, neu ddylunio gwasanaethau, ar lefel sy'n cyfateb i radd meistr.
    job_evaluation_notes: "Wedi'i fandio uwchlaw awgrym gradd UK GDaD PCF (Band 7): mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 8a. Caiff cynllunio, polisi, a rhyddid i weithredu eu sgorio uwchlaw proffil Band 7 gan fod y swydd yn troi strategaeth yn fap ffordd o newid ar gyfer maes gwasanaeth mawr."
  - title: Pensaer busnes arweiniol
    slug: pensaer-busnes-arweiniol
    responsibilities:
      - Arwain ymarfer pensaernïaeth busnes a bod yn atebol am ei allbynnau.
      - Cynnal y golwg ar draws y sefydliad o alluoedd, gwasanaethau, a llwybrau gofal, a'i chadw'n hawdd ei deall.
      - Cynghori cyfarwyddwyr ar flaenoriaethau newid a sut mae portffolios buddsoddi'n ffitio'r strategaeth.
      - Gweithio gyda sefydliadau partner i gytuno ar alluoedd a chyfrifoldebau a rennir ar draws llwybrau gofal.
      - Arwain a datblygu penseiri busnes.
    qualifications:
      - Profiad helaeth o arwain pensaernïaeth busnes mewn sefydliad cymhleth.
