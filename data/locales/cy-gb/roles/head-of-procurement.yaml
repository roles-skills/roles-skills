summary: >
  Mae pennaeth caffael a'r tîm arwain masnachol yn arwain sut mae'r sefydliad yn prynu nwyddau a gwasanaethau ac
  yn rheoli ei gyflenwyr. Maen nhw'n gosod polisi caffael a strategaeth fasnachol, yn sicrhau bod gwariant yn
  gyfreithlon ac yn rhoi gwerth am arian, ac yn cynghori'r bwrdd ar risg fasnachol. Mewn sefydliad gofal iechyd
  digidol maen nhw'n rhoi sylw arbennig i gontractau technoleg a systemau clinigol, gwydnwch cyflenwyr, ac ymadael.
health_context:
  - Gall contractau technoleg a systemau clinigol mawr lunio gwasanaethau am ddegawd, felly mae arweinwyr masnachol yn cynllunio ar gyfer y gallu i ryngweithredu, hygludedd, a chystadleuaeth yn y dyfodol o'r dechrau.
  - Mae cyflenwyr hanfodol yn cefnogi gwasanaethau sy'n rhedeg 24/7, felly mae methiant cyflenwyr a digwyddiadau seiber yn y gadwyn gyflenwi'n risgiau ar lefel y bwrdd.
  - Mae rheolau caffael cyhoeddus yn berthnasol, ac mae'n rhaid i'r sefydliad allu amddiffyn ei benderfyniadau caffael os cânt eu herio.
  - Disgwylir i'r sefydliad gyflawni gwerth cymdeithasol a lleihau carbon drwy ei wariant.
  - Mae arweinwyr masnachol yn aml yn gweithio gyda sefydliadau iechyd a gofal eraill ar brynu cydweithredol a chontractau a rennir.
levels:
  - title: Pennaeth caffael
    slug: pennaeth-caffael
    summary: Yn arwain y swyddogaeth gaffael, gan osod gweithdrefnau a safonau caffael a rheoli'r timau caffael a phrynu.
    responsibilities:
      - Arwain a rheoli'r timau caffael a phrynu.
      - Gosod gweithdrefnau, templedi, a throthwyon caffael y sefydliad, yn unol â rheolau caffael cyhoeddus a rheolau ariannol.
      - Sicrhau'r caffaeliadau mwyaf cymhleth a gwerth uchel a'u penderfyniadau dyfarnu.
      - Rheoli'r gyfres o gaffaeliadau sydd ar y gweill a sicrhau bod caffaeliadau'n dechrau mewn pryd.
      - Adrodd ar gydymffurfio â chaffael, arbedion, a gwerth cymdeithasol i'r pwyllgor archwilio.
      - Dal cyllideb y tîm caffael a datblygu sgiliau'r tîm.
    qualifications:
      - Cymhwyster proffesiynol caffael cydnabyddedig ar y lefel uchaf, neu radd meistr mewn pwnc cysylltiedig, neu brofiad cyfatebol.
      - Profiad helaeth o arwain caffael o dan reolau caffael cyhoeddus.
    job_evaluation_notes: Mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 8c. Mae polisi ar lefel 5 gan fod y swydd yn gosod gweithdrefnau caffael ar gyfer y sefydliad cyfan, ac mae rhyddid i weithredu ar lefel 6 gan ei bod yn dehongli rheolau a strategaeth gaffael i osod safonau'r sefydliad. Mae adnoddau ariannol ar lefel 5 gan ei bod yn rheoli sut y caiff gwariant ei brynu ar draws llawer o wasanaethau; mae cyfathrebu ar lefel 6 am benderfyniadau dyfarnu a heriau dadleuol.
  - title: Pennaeth masnachol
    slug: pennaeth-masnachol
    summary: Yn arwain caffael, rheoli categorïau, a rheoli contractau gyda'i gilydd fel un swyddogaeth fasnachol, ac yn gosod y strategaeth fasnachol.
    responsibilities:
      - Arwain y swyddogaeth fasnachol, gan gynnwys caffael, rheoli categorïau, a rheoli contractau.
      - Gosod y strategaeth fasnachol, gan gynnwys y dull o ymdrin â chontractau technoleg a chwmwl a chael eich cloi i mewn.
      - Arwain negodiadau gyda chyflenwyr strategol, fel darparwyr systemau clinigol a chwmwl.
      - Arwain yr ymateb i fethiant cyflenwyr ac anghydfodau contract difrifol.
      - Cynghori cyfarwyddwyr gweithredol ar risg fasnachol, gwerth am arian, a'r achos masnachol dros fuddsoddiadau mawr.
      - Arwain gwaith masnachol cydweithredol gyda sefydliadau iechyd a gofal eraill.
    qualifications:
      - Cymhwyster proffesiynol caffael cydnabyddedig ar y lefel uchaf, neu radd meistr mewn pwnc cysylltiedig, neu brofiad cyfatebol.
      - Profiad helaeth o arwain swyddogaethau masnachol.
    job_evaluation_notes: Mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 8d. Mae gwybodaeth ar lefel 8 am wybodaeth ar draws caffael, rheoli categorïau, rheoli contractau, a chyfraith masnach, ac mae rhyddid i weithredu ar lefel 6 gan fod y swydd yn gosod y strategaeth fasnachol. Mae cyfathrebu ar lefel 6 am negodi materion masnachol dadleuol iawn gyda chyflenwyr strategol.
  - title: Cyfarwyddwr caffael a masnachol
    slug: cyfarwyddwr-caffael-a-masnachol
    summary: Uwch arweinydd masnachol y sefydliad, yn atebol am bolisi caffael a masnachol, ac yn cynghori'r bwrdd ar strategaeth a risg fasnachol.
    responsibilities:
      - Gosod polisi a strategaeth caffael a masnachol y sefydliad, wedi'u cymeradwyo gan y bwrdd.
      - Cynghori'r bwrdd a'r tîm gweithredol ar strategaeth fasnachol, risg, a'r contractau a'r buddsoddiadau mwyaf.
      - Sicrhau bod y sefydliad yn cydymffurfio â rheolau caffael cyhoeddus a'i fod yn barod i amddiffyn heriau.
      - Arwain perthnasoedd gweithredol â chyflenwyr strategol a sefydliadau prynu'r sector cyhoeddus.
      - Gosod nodau gwerth cymdeithasol a chaffael cynaliadwy ac adrodd ar ganlyniadau i'r bwrdd.
      - Arwain a datblygu'r tîm arwain masnachol a sgiliau masnachol y sefydliad.
      - Bod yn atebol am ymrwymiadau masnachol a phortffolio contractau'r sefydliad ar draws pob gwasanaeth.
    qualifications:
      - Cymhwyster proffesiynol caffael cydnabyddedig ar y lefel uchaf, neu radd meistr mewn pwnc cysylltiedig, neu brofiad cyfatebol.
      - Profiad helaeth o arwain swyddogaethau masnachol ar lefel weithredol.
    job_evaluation_notes: Mae hysbysebion yn y sector iechyd yn rhoi'r rôl hon ar Fand 9. Mae polisi ar lefel 6 am gyfrifoldeb corfforaethol am bolisi caffael a masnachol, mae adnoddau ariannol ar lefel 6 am gyfrifoldeb corfforaethol am ymrwymiadau masnachol y sefydliad, ac mae rhyddid i weithredu ar lefel 6 gan fod y swydd yn gosod nodau a safonau masnachol. Mae ymdrech emosiynol ar lefel 2 am gysylltiad achlysurol ag anghydfodau, methiannau cyflenwyr, a heriau sy'n achosi straen.
