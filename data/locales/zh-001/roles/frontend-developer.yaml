summary: >
  前端开发人员构建组织数字健康服务的用户界面，例如面向患者的网站和应用、在线表单，以及临床医生和照护人员在照护过程中使用的界面。他们编写无障碍、快速、安全的代码，使其适合所有人使用，包括身体不适、焦虑或使用旧设备的人，并与设计师、研究人员和临床医生在多学科产品团队中合作。
health_context:
  - 许多用户身体不适、疼痛、年长或有残障，因此无障碍以及简洁、平和的界面是必不可少的，而不是可有可无的。
  - 临床信息（例如药物剂量、检查结果或预约时间）显示得令人困惑或错误可能伤害患者，因此前端工作遵循临床风险管理流程。
  - 界面经常显示保密的健康信息，因此开发人员在设计时考虑隐私，例如在共享设备上和繁忙的临床区域中。
  - 临床医生在时间压力下使用界面，且经常被打断，因此界面必须快速、可预测且不易误读。
  - 患者通过各种设备和网络连接访问服务，因此服务采用渐进增强并能在慢速网络上运行。
levels:
  - title: 学徒前端开发人员
    responsibilities:
      - 通过系统化培训和结对编程学习团队的设计系统、编程语言和工具。
      - 在密切督导下按照组织的设计系统构建小型界面组件。
      - 在同事的支持下，使用屏幕阅读器等辅助技术测试组件。
      - 在使用测试数据和上线数据时遵循信息治理和临床安全流程。
      - 攻读学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读软件开发学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 初级前端开发人员
    responsibilities:
      - 在指导下根据用户故事为面向患者和面向员工的服务构建和测试界面功能。
      - 使用组织的设计系统和模式，使各项服务的外观和行为保持一致。
      - 修复无障碍缺陷，并对照 WCAG 等无障碍标准检查页面。
      - 确保日期、剂量和结果等临床信息完全按规定显示。
      - 为临床安全案例提供证据，例如测试结果和变更截图。
    qualifications:
      - 计算机或相关学科的学位、已完成的学徒培训，或同等经验。
  - title: 前端开发人员
    responsibilities:
      - 独立为健康服务设计和构建无障碍、响应式的界面，选择合适的方法。
      - 与设计师和用户研究员合作，与患者、临床医生和照护人员一起测试原型。
      - 构建调用健康数据 API（例如 HL7 FHIR 服务）的界面，并安全地处理错误和缺失数据。
      - 参加危害研讨会，将确认步骤和清晰警示等安全控制措施构建到界面中。
      - 在浏览器中保护保密信息，例如在共享设备上谨慎管理会话和缓存。
      - 审查代码，指导初级和学徒前端开发人员。
    qualifications:
      - 计算机或相关学科的学位，或同等经验。
      - 构建和支持无障碍的生产环境网络服务的经验。
  - title: 高级前端开发人员
    responsibilities:
      - 领导预约、结果或临床工作流程界面等重要功能的前端设计和交付。
      - 为团队制定并维护前端标准，包括无障碍、性能、安全和测试。
      - 为组织的设计系统贡献组件和模式，并确保其安全且无障碍。
      - 与临床安全官合作，确保界面危害得到识别、控制和测试。
      - 确保服务在慢速连接、旧设备和辅助技术上运行良好。
      - 辅导和培养团队中的前端开发人员。
    qualifications:
      - 在设计、构建和支持无障碍的生产环境网络服务方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席前端开发人员
    responsibilities:
      - 领导一组团队或一项重要的面向患者服务的前端工程。
      - 负责组织设计系统和前端库的技术方向。
      - 确保各项服务的界面符合无障碍标准，并在临床安全方面得到保证。
      - 与架构师、设计师和临床负责人合作制定产品路线图和前端技术选择。
      - 领导前端实践社群，直线管理或领导前端开发人员。
    qualifications:
      - 在领导复杂、无障碍服务的前端工程方面拥有广泛经验。
  - title: 前端开发主管
    responsibilities:
      - 为组织所有数字服务制定前端战略、标准和实践。
      - 对组织面向患者和员工的界面的无障碍和可用性负责。
      - 就前端技术、设计系统投资以及糟糕界面对照护的风险向高级负责人提供建议。
      - 在跨组织的设计系统和无障碍社群中代表组织。
      - 领导和培养全组织的前端开发人员，包括招聘和职业路径。
    qualifications:
      - 在领导多个团队或组织的前端开发方面拥有广泛经验。
