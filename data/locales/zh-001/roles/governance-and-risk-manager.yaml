summary: >
  治理与风险工作人员确保组织运行良好并控制其风险。他们支持董事会及其委员会，运行风险管理框架和风险登记册，保持政策和治理登记册有序，并协调保证和审计工作，使负责人能够作出合理的决策，并证明其履行了法律和监管义务。
health_context:
  - 医疗卫生组织承担临床、信息、网络、财务和声誉风险，因此风险框架必须为董事会将这些风险整合起来。
  - 董事会必须证明其在患者安全和质量方面获得了保证，因此治理人员将临床安全和质量报告纳入委员会。
  - 监管机构和审计人员期望看到关于决策、风险、利益申报和政策的清晰记录。
  - 严重事件和服务失败需要通过治理结构快速上报，并有完善的记录。
levels:
  - title: 治理专员
    summary: 支持委员会的治理周期，并保持风险、政策和治理登记册为最新。
    responsibilities:
      - 协调委员会会议、工作计划、会议文件和会议记录。
      - 维护风险登记册，提醒风险负责人审查其风险。
      - 保持利益申报、礼品和招待等治理登记册为最新。
      - 维护政策登记册并跟踪政策审查。
      - 为审计协调证据，并跟踪审计建议。
      - 回答员工提出的常规治理问题。
    qualifications:
      - 学位或治理资格，或同等经验。
  - title: 高级治理与风险专员
    summary: 运行治理与风险框架的部分内容，就风险向各总监部提供建议，并支持高级委员会。
    responsibilities:
      - 为各总监部运行风险管理流程，质询风险评分和控制措施。
      - 为高级委员会编写风险和保证报告。
      - 以会议文件和正式会议记录支持包括审计与风险委员会在内的高级委员会。
      - 审查政策是否符合政策框架、法律和平等义务。
      - 培训经理掌握风险管理和治理流程。
      - 协调组织对监管机构和审计请求的答复。
    qualifications:
      - 治理或风险管理方面的学位或专业资格，或同等经验。
  - title: 治理与风险经理
    summary: 管理治理与风险服务，包括董事会和委员会周期、风险框架和保证映射。
    responsibilities:
      - 管理董事会和委员会周期以及治理团队。
      - 运行组织的风险管理框架和董事会保证框架。
      - 就风险、风险偏好和上报向总监提供建议。
      - 针对组织的主要风险进行保证映射，并与内部和外部审计人员合作。
      - 保持议事规则、授权方案和政策框架为最新。
      - 协调对严重事件和监管机构询问的治理应对。
    qualifications:
      - 治理或风险管理专业资格，或同等经验。
      - 在公司治理或风险管理方面拥有丰富经验。
  - title: 公司治理主管
    summary: 领导组织的公司治理与风险工作，往往担任董事会秘书，并就治理向董事长和董事会提供建议。
    responsibilities:
      - 设计并领导组织的治理框架，包括董事会及其委员会。
      - 担任董事会秘书，就治理、行为和合规向董事长和董事会提供建议。
      - 负责风险管理框架和风险偏好，并就战略风险向董事会提供建议。
      - 领导年度治理声明和治理报告。
      - 领导治理、风险和保证团队。
      - 在治理事项上代表组织与监管机构和审计人员沟通。
    qualifications:
      - 公司治理专业资格，或同等经验。
      - 在董事会层面领导治理与风险方面拥有广泛经验。
