summary: >
  法务助理和律师助理为组织的律师提供支持，使法律工作有条理、准确并按时完成。他们管理事项和文件，准备合同和案卷，研究法律问题，并处理常规法律任务。在数字医疗卫生组织中，这项工作很大一部分涉及技术合同、数据共享和数据处理协议、信息请求，以及可能涉及敏感患者信息的索赔。
health_context:
  - 法律文件常常包含保密的健康信息，例如索赔中的临床记录，因此适用严格的信息治理。
  - 许多协议涉及软件、云服务和数据共享，因此工作人员需要识别对患者数据和服务连续性重要的条款。
  - 索赔、死因调查和采购质疑中的期限短而固定，错过期限可能代价高昂。
  - 组织在外部律师上花费公共资金，因此必须跟踪和控制法律费用支出。
levels:
  - title: 法务行政专员
    summary: 法务行政专员按照既定流程运行法务团队的行政流程，例如事项登记、文档管理、登记册和账单。
    responsibilities:
      - 在事项管理系统中创建、更新和关闭事项。
      - 归档、排版和调取法律文件，并保持其安全和保密。
      - 维护合同、契据和签署登记册。
      - 管理日程和关键日期，并提醒律师注意期限。
      - 核对并处理外部律师的账单。
      - 回答常规询问，并转交法律意见请求。
    qualifications:
      - 通过教育或工作经验获得的良好行政和键盘技能。
      - 法务行政资格有帮助，但不是必需的。
  - title: 法务助理
    summary: 法务助理在一系列事项上支持律师，根据模板准备文件，开展界定清晰的研究，并管理合同和案件的实务步骤。
    responsibilities:
      - 根据经批准的模板准备保密协议和数据共享协议等标准协议。
      - 为合同和案件准备案卷、时间表和签署文件包。
      - 开展界定清晰的法律研究，并为律师总结结果。
      - 为索赔和信息请求收集文件和证据。
      - 对照预算跟踪外部法律费用支出并报告。
      - 培训法务行政专员完成日常任务。
    qualifications:
      - 中级法务助理或律师助理资格，或同等经验。
  - title: 律师助理
    summary: 律师助理在律师的督导下处理自己负责的一批常规法律事项，例如标准合同审查、信息请求和索赔支持。
    responsibilities:
      - 对照组织的标准审查软件许可、服务和数据处理协议等常规协议。
      - 管理一批常规索赔或争议，准备文件并与外部律师和赔偿计划联络。
      - 研究法律问题，并起草法律意见供律师审核。
      - 支持对复杂信息请求和数据主体权利请求的答复。
      - 保持模板、先例和法律指引为最新。
      - 协调法务助理和法务行政专员的工作。
    qualifications:
      - 法学学位或高级律师助理资格，或同等经验。
    job_evaluation_notes: 情绪消耗为第 2 级，因为该岗位经常阅读索赔中的临床记录和伤害描述。
