summary: >
  质量保证测试分析师检查组织的数字健康服务是否安全可靠地满足患者、临床医生和照护人员的需要。他们分析需求和设计以及早发现风险，设计并执行功能和非功能测试，并清楚地报告缺陷。在医疗卫生领域，这包括测试临床工作流程、数据准确性以及保护患者免受伤害的控制措施。
health_context:
  - 临床系统中的缺陷可能伤害患者，例如药物剂量错误、遗漏检查结果或显示了错误患者的记录，因此测试按临床风险确定优先次序。
  - 测试为临床安全案例和危害日志提供证据，因此测试计划可追溯到已识别的危害及其控制措施。
  - 测试数据绝不能暴露真实患者，因此分析师使用合成测试数据或经过适当去标识化的数据。
  - 许多服务与其他医疗卫生和照护系统交换数据，因此测试要依据 HL7 FHIR 等标准检查消息以及临床代码的含义。
  - 用户包括承受时间压力的临床医生、需求各异的患者以及辅助技术用户，因此可用性和无障碍测试很重要。
levels:
  - title: 助理质量保证测试分析师
    responsibilities:
      - 在督导下执行临床和行政工作流程的测试脚本，准确记录结果。
      - 提交清晰的缺陷报告，包括所涉及的步骤、数据和界面。
      - 使用合成测试数据，绝不在测试环境中使用真实患者数据。
      - 学习团队的测试方法、工具和临床安全流程。
      - 参加站会、计划会和回顾会等团队例会。
    qualifications:
      - 良好的分析和写作能力，以及一定的测试或数字系统工作经验，或同等条件。
  - title: 质量保证测试分析师
    responsibilities:
      - 分析用户故事、设计和临床工作流程，根据对患者和服务的风险决定测试内容。
      - 设计并执行功能、无障碍和可用性测试，包括端到端的临床场景。
      - 将测试追溯到危害和安全控制措施，并为临床安全案例提供测试证据。
      - 对照源系统和商定的临床代码检查向用户显示的数据。
      - 创建和维护逼真的合成测试数据。
      - 跟踪缺陷直至解决，并对修复进行复测。
    qualifications:
      - 具有为数字服务设计和执行测试的经验，或同等经验。
    job_evaluation_notes: UK GDaD PCF 建议此级别和高级级别均为 HEO 或 SEO，二者都对应第 6 职级。本参考资料将此级别定为第 5 职级、高级级别定为第 6 职级，使两个级别处于不同职级。
  - title: 高级质量保证测试分析师
    responsibilities:
      - 协调一个产品或领域的质量保证，商定测试方法、环境、数据和工具。
      - 通过与临床医生和产品团队一起审查需求、设计和变更，及早识别临床和运营风险。
      - 与临床医生和照护人员一起规划并领导用户验收测试。
      - 向产品负责人和临床安全官报告测试结果和剩余风险，使其能够作出发布决策。
      - 指导其他测试分析师，帮助其遵循测试和临床安全标准。
    qualifications:
      - 在测试分析（包括在复杂或受监管环境中）方面拥有丰富经验，或同等经验。
  - title: 首席质量保证测试分析师
    responsibilities:
      - 为全组织制定测试分析标准和良好实践，包括基于风险的临床系统测试。
      - 为重大项目群（例如电子病历变更或新的面向患者服务）制定测试策略。
      - 确保测试产生临床安全案例以及（如适用）医疗器械技术文件所需的证据。
      - 与高级产品、临床和供应商负责人协商并上报重大风险、问题和缺陷。
      - 指导和辅导测试分析师，领导测试分析社群。
    qualifications:
      - 在领导复杂服务的测试分析方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 建议此级别为 G7 或 G6，对应第 8b 职级。本参考资料将其定为第 8a 职级，与首席测试工程师同级，因为它领导的是一门测试学科而不是全部测试；测试主管为第 8c 职级。
