summary: >
  数据科学家使用统计学、机器学习和其他高级方法，在医疗卫生和照护数据中发现规律，并构建帮助服务进行规划、预测和改善照护的模型。典型工作包括预测需求、识别可能受益于早期支持的患者，以及评估服务变更的效果。他们与临床医生和分析师密切合作，并确保模型有效、公平且被安全地使用。
health_context:
  - 支持患者相关决策的模型如果出错或存在偏差就可能造成伤害，因此模型要在其将要使用的人群中进行验证，并评估临床安全。
  - 健康数据反映了照护可及性的不平等，因此除非针对每个患者群体衡量并处理偏差，否则模型可能重复或加剧健康不平等。
  - 一些模型（例如为诊断或治疗提供信息的模型）可能作为医疗器械受到监管，人工智能法规也可能适用。
  - 数据科学通常需要关联的、详细的患者数据，因此工作在安全环境中、使用假名化数据并在商定的信息治理依据下进行。
  - 临床医生和患者需要理解和信任模型的输出，因此解释以及用通俗语言传达不确定性很重要。
levels:
  - title: 见习数据科学家
    responsibilities:
      - 通过系统化培训学习团队的统计和机器学习方法、工具以及安全的工作方式。
      - 在督导下准备和探索假名化的健康数据集。
      - 开展并解读简单的统计分析，并与更有经验的数据科学家核对结果。
      - 遵循信息治理、披露控制和伦理流程。
      - 攻读数据科学学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读数据科学学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 助理数据科学家
    responsibilities:
      - 在指导下构建和测试需求预测等基础统计和机器学习模型。
      - 在安全环境中为建模准备和关联健康数据集。
      - 衡量模型在不同患者群体中的表现并报告差异。
      - 向分析师和服务团队展示结果及其不确定性。
      - 记录数据来源、方法和假设，使工作可以复现。
    qualifications:
      - 数理类学科的学位、数据科学学徒资格，或同等经验。
  - title: 数据科学家
    responsibilities:
      - 独立开发风险分层或住院时长预测等复杂模型，选择合适的方法。
      - 与临床医生一起验证模型，检查其在本地患者数据上是否准确、公平且有用。
      - 记录每个模型的预期用途、数据、表现和局限，并为临床安全案例提供证据。
      - 使用合适的统计方法评估服务变更的效果。
      - 向临床和非技术受众解释模型及其不确定性。
      - 支持助理和见习数据科学家。
    qualifications:
      - 数理类学科的学位，或同等经验。
      - 具有构建和验证统计或机器学习模型的经验。
  - title: 主任数据科学家
    responsibilities:
      - 界定、设计和领导支持服务规划和患者照护的数据科学项目。
      - 决定哪些方法、工具和数据适用，并质疑不可行或不安全的计划。
      - 与临床安全和信息治理同事一起规划模型的验证、偏差评估和监测。
      - 与产品团队商定如何大规模部署和支持模型。
      - 管理和培养一个小型数据科学家团队。
    qualifications:
      - 在交付数据科学工作方面拥有丰富经验，相当于硕士学位或定量学科的博士学位水平。
  - title: 首席数据科学家
    responsibilities:
      - 领导数据科学团队，确定其方向、优先事项和标准。
      - 发现数据科学能够改善照护的机会，并与临床和服务负责人一起论证。
      - 确保模型的设计、验证和监测使其在使用中保持安全和公平。
      - 解决同意、偏差和使用敏感数据等复杂的伦理和数据挑战。
      - 通过辅导、招聘和培训建设数据科学能力。
    qualifications:
      - 在领导数据科学团队方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 建议首席数据科学家和数据科学主管都定为 G7 或 G6。本参考资料将首席定为第 8a 职级，将主管定为第 8b 职级，使两个级别处于不同职级。
  - title: 数据科学主管
    responsibilities:
      - 按照组织的战略和优先事项，确定全组织数据科学和人工智能的方向。
      - 领导组织模型和人工智能的伦理、安全和保证工作，并就此向董事会提供建议。
      - 监督资源、预算以及数据科学产品的质量。
      - 在数据科学和人工智能方面代表组织与医疗卫生和照护合作伙伴、研究人员和监管机构沟通。
      - 跨专业建设数据科学能力和职业路径。
    qualifications:
      - 在全组织领导数据科学方面拥有广泛经验。
