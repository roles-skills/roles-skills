summary: >
  合同经理确保组织在签订合同后得到其所付费的服务。他们管理供应商绩效、付款、变更、争议、续约和退出，并与关键供应商建立关系。在数字医疗卫生组织中，许多最重要的合同涉及患者和员工每天依赖的临床系统、云托管和技术服务。
health_context:
  - 临床系统的中断或故障可能影响患者照护，因此合同经理密切监控可用性、事件响应和支持水平，并在需要时运用合同救济措施。
  - 供应商经常处理患者数据，因此合同要与信息治理和安全同事一起管理，包括数据保护条款、审计和泄露处理。
  - 必须从一开始就规划退出和数据返还，使患者档案能以可用格式迁移到新系统，旧副本被安全删除。
  - 合同变更必须遵守公共采购规则，因此合同经理检查某项变更是否需要重新采购。
  - 供应商的版本发布可能改变临床系统的行为，因此合同经理确保供应商履行临床安全义务。
levels:
  - title: 合同经理
    summary: 在合同管理框架内管理一批合同（包括技术和临床系统合同），从启动到续约。也称为合同专员。
    responsibilities:
      - 管理一批合同，保持合同登记册、文件和关键日期为最新。
      - 使用服务水平和关键绩效指标，与供应商定期开展绩效审查。
      - 对照合同条款核对发票，并解决计费争议。
      - 在采购规则范围内谈判和处理合同变更和修订。
      - 跟踪许可使用、续约和通知期，并规划整批合同的续约和重新采购。
      - 保持每份合同的退出计划和数据登记册为最新。
      - 与信息治理和安全同事一起开展供应商数据保护和安全核查。
    qualifications:
      - 公认的高级采购或合同管理资格，或同等经验。
      - 具有管理服务合同的经验，最好是技术合同。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 7 职级。分析为第 5 级，对应对复杂合同条款和争议的判断；规划为第 4 级，对应整批合同的续约；财务资源为第 4 级，因为该岗位管理一批服务合同的支出。
  - title: 高级合同经理
    summary: 管理组织的战略性和高风险合同，例如电子病历和云托管合同，并领导与关键供应商的关系。
    responsibilities:
      - 管理临床系统和技术服务的战略合同，包括新合同的启动。
      - 与关键供应商主持战略审查，涵盖绩效、路线图、风险和改进计划。
      - 在绩效不达标时运用服务抵扣和整改计划等合同救济措施。
      - 谈判合同修订、续约和争议和解。
      - 编写并测试退出和过渡计划，包括以标准格式返还数据和安全删除。
      - 评估财务状况、网络安全和供应链等供应商风险，并为供应商失败做好规划。
      - 辅导和督导合同经理。
    qualifications:
      - 公认的高级采购或合同管理资格，或相关学科的硕士学位，或同等经验。
      - 在管理战略性技术合同或外包服务合同方面拥有丰富经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8a 职级。知识、分析和行动自由度按第 8a 职级概况评分，因为该岗位在很少督导下管理组织的战略合同。财务资源为第 4 级，因为该岗位管理高价值服务合同的支出和资产。
  - title: 首席合同经理
    summary: 领导全组织的合同和供应商管理，制定合同管理框架并管理合同团队。
    responsibilities:
      - 制定组织的合同管理框架、标准和工具。
      - 领导合同管理团队及其负责的合同。
      - 领导最关键供应商关系的管理，并解决重大争议。
      - 制定退出规划和数据返还的标准，并领导从战略合同中的退出。
      - 向执行委员会报告合同绩效、供应商风险和节约。
      - 就终止、重新采购和供应商失败提供建议。
    qualifications:
      - 公认的高级采购或合同管理资格，或相关学科的硕士学位，或同等经验。
      - 在领导复杂服务的合同管理方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8b 职级。规划为第 5 级，对应全组织的合同管理框架；财务资源为第 5 级，因为该岗位监督众多服务的合同；人员为第 4 级，因为它直线管理合同团队。
