summary: >
  信息治理工作人员帮助组织依法、安全且合乎伦理地处理个人信息和健康信息。他们就数据保护和保密向团队提供建议，处理信息权利请求，支持数据保护影响评估，管理数据泄露事件，并收集证明组织符合信息治理标准的证据。
health_context:
  - 数据保护法对健康信息给予额外保护，因此对合法使用、安全和透明度的要求很高。
  - 数字健康服务经常在众多照护组织之间共享数据，因此需要仔细审查信息共享协议和数据流。
  - 患者和公众享有查阅其档案和组织信息的法定权利，且时限严格。
  - 涉及健康信息的数据泄露可能造成真实的伤害和困扰，因此需要快速、审慎地处理事件。
  - 分析、研究和人工智能等新的数据用途引发了关于同意、保密和公众信任的问题。
levels:
  - title: 信息治理专员
    summary: 按照既定流程，在信息权利请求、事件登记、培训记录和证据收集方面支持信息治理团队。
    responsibilities:
      - 登记、确认和跟踪信息权利请求，并为答复收集信息。
      - 登记数据泄露和未遂事件，并收集事实以供审查。
      - 及时更新信息治理登记册，例如信息资产登记册和数据流图。
      - 为年度信息治理自评收集证据。
      - 跟踪员工完成信息治理培训的情况。
      - 回答员工提出的常规信息治理问题。
    qualifications:
      - 具有行政或档案工作经验，或数据保护基础资格或同等经验。
    job_evaluation_notes: 情绪消耗反映经常间接接触请求、档案和泄露报告中令人痛苦的内容。
  - title: 高级信息治理专员
    summary: 处理一批信息权利请求和事件，并在数据保护影响评估和信息共享方面支持各团队。
    responsibilities:
      - 在法定时限内处理信息权利请求，包括涂黑处理和适用豁免条款。
      - 评估和调查数据泄露和未遂事件，并跟踪整改措施直至关闭。
      - 帮助项目团队完成数据保护影响评估并描述数据流。
      - 起草信息共享协议和隐私声明供审查。
      - 为员工开展信息治理培训和情况通报。
      - 开展访问审核和档案记录审核。
    qualifications:
      - 公认的数据保护或信息治理资格，或同等经验。
  - title: 信息治理负责人
    summary: 为一个总监部或项目群提供专家级信息治理建议，领导数据保护影响评估和复杂个案。
    responsibilities:
      - 就合法依据、同意、保密和保存向产品团队和服务部门提供建议。
      - 审查复杂系统的数据保护影响评估，并建议控制措施。
      - 处理复杂或有争议的信息权利请求和内部复核。
      - 调查严重的数据泄露事件，并建议是否通知监管机构。
      - 审查与合作组织签订的信息共享协议。
      - 督导和辅导信息治理专员。
    qualifications:
      - 公认的数据保护或信息治理专业资格，或同等经验。
      - 具有在医疗卫生或照护环境中就数据保护提供建议的经验。
  - title: 信息治理经理
    summary: 日常管理信息治理服务，包括其团队、个案工作、保证计划和培训。
    responsibilities:
      - 管理信息治理团队及其个案工作，确保符合法定时限。
      - 规划和运行信息治理保证计划和年度自评。
      - 编写和审查信息治理政策和流程。
      - 就信息风险向高级管理者提供建议，并维护信息风险登记册。
      - 与安全、临床安全和传播同事合作，领导对严重事件的响应。
      - 为全体员工设计和监督信息治理培训。
    qualifications:
      - 公认的数据保护或信息治理专业资格，或同等经验。
      - 在医疗卫生或照护领域的信息治理方面拥有丰富经验。
  - title: 信息治理主管
    summary: 领导组织的信息治理工作，制定其政策和战略，并就信息风险和合规向高级负责人提供建议。
    responsibilities:
      - 为组织制定信息治理战略、政策和框架。
      - 领导信息治理和档案服务，并培养其员工。
      - 就信息风险和合规向信息风险执行负责人、董事会及其委员会提供建议。
      - 就复杂的披露、共享和泄露通知问题作出最终决定。
      - 在监管机构、审计人员和合作组织面前代表组织。
      - 确保新的数字服务、数据用途和人工智能从一开始就以隐私和透明为原则进行设计。
    qualifications:
      - 公认的数据保护或信息治理专业资格，或同等经验。
      - 在医疗卫生或照护领域领导信息治理方面拥有广泛经验。
