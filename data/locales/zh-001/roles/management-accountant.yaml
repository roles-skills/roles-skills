summary: >
  管理会计师为管理者提供规划、控制支出和作出良好决策所需的财务信息和建议。他们制定和监控预算，预测支出，核算服务成本，并为投资构建财务论证。在数字医疗卫生组织中，他们与数字项目群和产品团队密切合作，在这些领域，正确处理资本性和收益性支出、全生命周期成本以及物有所值是作出良好决策的核心。
health_context:
  - 数字项目群往往由资本性和收益性资金、专款或有期限的资金混合资助，每种资金都有其各自的用途规则。
  - 从自有系统转向云服务和订阅会使成本从资本性转为收益性，这会影响预算、商业论证和资金申请。
  - 投资决策必须证明公共资金物有所值，并为患者、临床医生和照护人员带来效益，而不仅仅是财务节约。
  - 软件、托管和支持合同往往持续数年，因此预测必须包括上线后很长时间内的运行成本。
  - 数字和临床团队中的预算持有人可能不是财务专家，因此清晰、实用的建议是这项工作的重要部分。
levels:
  - title: 见习管理会计师
    summary: 见习管理会计师（有时称为财务分析师）为一组预算持有人编制预算报告和分析，同时攻读公认的会计资格。
    responsibilities:
      - 为一组预算持有人编制月度预算报告，并解释主要差异。
      - 过账月末日记账分录、应计项目和更正分录，确保报告准确。
      - 检查支出是否在成本中心、项目以及资本性和收益性之间正确编码。
      - 收集预测信息，并与预算持有人一起更新预测。
      - 在指导下为商业论证编制成本信息。
      - 攻读公认的会计资格。
    qualifications:
      - 学位或中级会计资格，并正在攻读公认的会计资格，或同等经验。
    job_evaluation_notes: 知识按培训进展到足以开展工作时岗位所需的水平评分。财务资源为第 3 级，对应监控授权预算。
  - title: 管理会计师
    summary: 管理会计师是合格会计师，为一个总监部或一组服务运行预算编制、监控和预测，并就财务向预算持有人提供建议。
    responsibilities:
      - 领导一个总监部或一组服务的月度报告和预测周期。
      - 就支出、风险以及保持在预算内的措施向预算持有人提供建议。
      - 编制年度预算，包括人员成本、合同和许可费用。
      - 对软件开发、许可和硬件等数字支出适用资本性和收益性规则。
      - 为商业论证和方案评估建立财务模型。
      - 督导和培养见习会计师。
    qualifications:
      - 公认的会计资格，或同等经验。
  - title: 高级管理会计师
    summary: 高级管理会计师领导一个大型总监部或重大数字项目群的财务管理，包括复杂的预测、成本核算和商业论证。
    responsibilities:
      - 领导一个大型总监部或重大数字项目群的预算编制和预测。
      - 对资金变化、交付延误以及从资本性支出转向云订阅成本等情景进行建模。
      - 领导重大投资的财务论证，包括全生命周期成本、效益和物有所值。
      - 建立服务和产品成本核算，例如运行一项数字服务的全部成本。
      - 向高级管理者和项目群委员会汇报财务绩效和风险。
      - 管理一个由会计师和见习人员组成的小团队。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有丰富经验，或同等条件。
    job_evaluation_notes: 财务资源为第 4 级，因为该岗位与预算持有人一起为一个总监部或项目群制定预算。
  - title: 财务业务伙伴
    summary: 财务业务伙伴作为总监部（通常是数字、数据和技术总监部）领导层的一员开展工作，将财务信息转化为决策，并确保投资物有所值。
    responsibilities:
      - 担任数字、数据和技术等总监部领导团队的高级财务顾问。
      - 领导总监部的财务计划，将支出与优先事项、人力和投资联系起来。
      - 在物有所值方面质询并支持负责人，包括供应商支出、许可使用和云成本。
      - 领导重大数字投资的商业论证，并在投资委员会中代表财务部门。
      - 确保数字支出符合资金规则、支出控制以及资本性和收益性限额。
      - 直线管理支持该总监部的管理会计师。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有广泛经验，包括业务伙伴经验。
    job_evaluation_notes: 财务资源为第 5 级，因为该岗位为一个总监部内的多项服务制定预算。
  - title: 管理会计主管
    summary: 管理会计主管领导组织的预算编制、预测和管理报告，以及负责实施这些工作的业务伙伴和会计师团队。
    responsibilities:
      - 领导组织的年度预算编制和年内预测。
      - 为董事会和执行层设计管理报告、成本核算和绩效信息。
      - 制定商业论证和投资评估标准，包括数字投资。
      - 就财务风险、节约计划以及保持在资金范围内所需的选择向总监提供建议。
      - 领导和培养业务伙伴和管理会计团队。
      - 改进预算和报告工具，包括面向预算持有人的自助报告。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有广泛经验，包括领导财务团队。
