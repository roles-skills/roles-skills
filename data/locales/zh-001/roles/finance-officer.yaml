summary: >
  财务专员保持组织日常财务的准确和受控。他们处理和记录发票、付款、收入和日记账分录，核对分类账和银行账户，并帮助预算持有人和供应商解答问题。在数字医疗卫生组织中，这项工作很大一部分涉及技术供应商、软件许可和云服务，这些支出往往来自公共资金，并受到严格的使用规则约束。
health_context:
  - 组织使用的是公共资金，因此每笔付款都必须经过适当审批、记录，并经得起审计。
  - 许多发票涉及软件许可、云托管和支持合同，需要对照合同条款、使用量以及正确的资本性或收益性代码进行核对。
  - 及时准确的付款很重要，因为小型供应商和照护提供方可能依赖于此。
  - 财务人员会看到员工报销以及向患者或照护提供方付款等个人信息，必须按照信息治理规则处理。
  - 诸如虚假要求更改供应商银行信息之类的欺诈风险以公共机构为目标，因此专员遵循严格的核查程序。
levels:
  - title: 财务助理
    summary: 财务助理在督导就在身边的情况下，按照既定流程处理供应商发票、收据和报销申请等常规财务交易。
    responsibilities:
      - 将供应商发票、贷项通知单和收据准确录入财务系统。
      - 将发票与采购订单和收货单进行匹配，并催办缺失的审批。
      - 对照政策和证明收据检查员工报销申请。
      - 通过电话和电子邮件回答供应商和员工的常规询问。
      - 归档和扫描财务文件，以便审计时查找。
      - 遵守财务流程和信息治理规则，并报告任何异常情况。
    qualifications:
      - 通过教育或工作经验获得的良好计算和键盘技能。
      - 愿意攻读入门级会计资格，或同等经验。
    job_evaluation_notes: 身体技能为第 3 级，对应大量数据录入的速度和准确性。财务资源为第 2 级，因为该岗位处理付款信息并核查小额申请。
  - title: 财务专员
    summary: 财务专员运行交易周期的一部分，例如应付账款、应收账款或现金，解决非常规问题并核对其分类账。
    responsibilities:
      - 处理一系列交易，包括付款批次、退款、销售发票和日记账分录。
      - 核对供应商对账单、银行账户和控制账户，并清理差异。
      - 检查技术类发票是否符合合同条款，例如许可数量和计费期间。
      - 开展供应商银行信息变更核查和其他反欺诈控制。
      - 催收逾期欠款，并与供应商和预算持有人解决有争议的发票。
      - 向新的财务助理演示如何完成日常任务。
    qualifications:
      - 入门级会计资格，或财务处理方面的同等经验。
    job_evaluation_notes: 财务资源为第 3 级，因为该岗位准备并发出付款批次，并在规定限额内批准付款。
  - title: 高级财务专员
    summary: 高级财务专员处理较复杂的财务业务和对账，支持月末和年末结账，并帮助预算持有人了解其支出。
    responsibilities:
      - 编制月末分录，例如年度软件和支持合同的应计项目和预付款项。
      - 调查并清理复杂的对账差异项和长期挂账余额。
      - 在督导下编制销售税申报表和对账。
      - 编制标准预算报告，并向预算持有人解释。
      - 检查支出是否在资本性和收益性之间正确编码，并向会计师提出问题。
      - 日常督导并检查财务专员和财务助理的工作。
      - 提出改进财务流程和系统工作流程的建议。
    qualifications:
      - 中级会计资格，或同等经验。
      - 具有财务处理和对账的经验。
  - title: 财务组长
    summary: 财务组长管理一个交易处理财务团队或担任财务分析师，确保流程准确、受控、高效，报告按时完成。
    responsibilities:
      - 领导一个交易处理财务团队，规划其工作以满足付款、欠款和月末结账的期限。
      - 管理一个分类账或财务流程，并报告其绩效，例如付款时间和账龄欠款。
      - 测试和改进财务控制，并向内部和外部审计人员提供证据。
      - 为年度账目编制资产负债表对账和工作底稿。
      - 改进流程，例如将发票匹配自动化或为预算持有人引入自助服务。
      - 培训、支持并审查团队成员的工作。
    qualifications:
      - 中级或高级会计资格，或同等经验。
      - 具有领导或协调财务流程的经验。
    job_evaluation_notes: 人员为第 3 级，因为该岗位日常管理一个小型财务团队。此职级的财务分析师在人员方面评为第 2 级，在分析方面评为第 4 级。
