summary: >
  数字项目组合经理帮助组织选择、跟踪和治理其数字项目、项目群和产品组合，使其投资于对患者、临床医生和照护人员最有益的工作。他们运行项目组合治理和报告，帮助负责人依据充分证据确定优先次序，并确保项目组合实现其承诺的效益。
health_context:
  - 数字工作与一线照护争夺资金，因此项目组合经理帮助负责人展示数字投资对患者和员工的效益。
  - 项目组合治理必须包括临床安全、信息治理和网络安全保证，因此项目组合经理在跟踪时间、成本和范围的同时跟踪这些内容。
  - 许多数字项目依赖临床和运营团队的能力，例如需要临床医生参与测试或员工参加培训，因此项目组合经理留意各项服务需求之间的冲突。
  - 资金往往来自多个渠道，各有其报告规则和截止日期，因此项目组合经理确保报告准确及时。
levels:
  - title: 数字项目组合分析师
    responsibilities:
      - 收集并核对项目组合中各项目的状态、风险、财务和效益数据。
      - 维护项目组合登记册和仪表板，发现报告中的缺口或不一致之处。
      - 为项目组合治理委员会准备文件和报告。
      - 跟踪各项目的保证里程碑，例如临床安全签核和数据保护影响评估。
      - 在优先排序和规划分析方面支持项目组合经理。
    qualifications:
      - 学位或相关资格，或分析或报告方面的同等经验。
    job_evaluation_notes: UK GDaD PCF 将分析师和经理两个级别都定为 HEO 或 SEO。本参考资料将分析师定为第 5 职级，因为这是向项目组合经理汇报的学习级别，将经理定为第 6 职级，使两个级别不在同一职级。
  - title: 数字项目组合经理
    responsibilities:
      - 协调一个数字项目和项目群组合，例如某一总监部的全部数字工作。
      - 帮助团队遵循治理、保证和交付流程，并使其适度。
      - 支持负责人依据需求、效益、风险和能力方面的证据确定工作优先次序。
      - 向委员会和利益相关方清楚地报告项目组合的绩效、风险和效益。
      - 发现各项目对临床和运营团队需求的冲突并帮助解决。
    qualifications:
      - 具有项目组合、项目群或项目管理的经验，或同等经验。
  - title: 高级数字项目组合经理
    responsibilities:
      - 管理组织的数字项目组合或其中很大一部分，以及其治理和保证流程。
      - 跟踪和分析整个项目组合的成果和效益，针对问题采取行动帮助团队交付。
      - 确保项目组合符合标准，包括临床安全、信息治理和网络安全保证。
      - 依据清晰的证据，就优先排序、投资和取舍向高级负责人提供建议。
      - 管理面向资助方和外部机构的项目组合报告。
      - 直线管理项目组合分析师和经理。
    qualifications:
      - 在项目组合或项目群管理方面拥有广泛经验，相当于硕士学位水平。
    job_evaluation_notes: 没有第 7 职级的级别，因为 UK GDaD PCF 从数字项目组合经理（HEO/SEO）直接跨到高级数字项目组合经理（G7）。
  - title: 数字项目组合主管
    responsibilities:
      - 领导数字项目组合职能和项目组合经理团队。
      - 制定项目组合战略、控制措施和治理，并确保其得到执行。
      - 为执行负责人提供关于项目组合未来的洞察，使其能够作出投资决策。
      - 确保项目组合对患者、员工和组织的效益得到实现和报告。
      - 处理项目组合层面的风险，并向执行团队上报问题。
      - 管理该职能的预算和能力。
    qualifications:
      - 在复杂组织中领导项目组合管理方面拥有广泛经验。
    job_evaluation_notes: 财务资源按第 5 级评分，因为数字项目组合主管监督覆盖多项服务的整个数字项目组合的投资；信息资源为第 6 级，因为项目组合登记册和报告覆盖整个组织。
