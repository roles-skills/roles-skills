summary: >
  品类经理在多年时间内规划和管理组织的某一支出品类，例如软件和云、技术服务、设备或临床系统。他们整合需求，了解供应市场，与数字和临床负责人一起塑造需求，并规划采购和续约，使组织获得物有所值，避免被供应商锁定，并保持其服务安全运行。
health_context:
  - 技术是组织最大、增长最快的支出领域之一，其中很大一部分是每年续订的订阅。
  - 临床系统难以替换，因此品类计划要及早启动、测试市场，并为互操作性和数据可移植性做好规划，以保持未来竞争的可能。
  - 云和软件合同必须满足健康数据的安全、数据保护和数据驻留要求。
  - 公共采购规则适用，且许多品类通过公共部门框架协议采购，因此品类经理为每项需求选择正确的途径。
  - 品类战略包括社会价值和减碳，例如设备再利用和更环保的数据中心。
levels:
  - title: 品类经理（数字与技术）
    summary: 按照与数字负责人商定的品类战略，管理软件、云、设备或技术服务等数字和技术支出品类。
    responsibilities:
      - 与预算持有人和技术负责人一起编写并实施数字和技术支出的品类战略。
      - 分析整个品类的支出、合同、许可和续约，并规划采购计划。
      - 领导该品类中最复杂的采购，例如云平台和临床系统。
      - 分析供应市场并领导早期市场沟通。
      - 谈判企业许可和按用量计价等商业模式，并跟踪节约和价值。
      - 确保合同包括避免供应商锁定的互操作性、数据所有权、退出和数据返还条款。
      - 向采购主管和数字负责人报告该品类的绩效、风险和节约。
      - 辅导和督导在该品类中工作的采购专员和采购员。
    qualifications:
      - 公认的高级采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在采购数字和技术服务方面拥有丰富经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8a 职级。知识、分析和行动自由度按第 8a 职级概况评分，因为该岗位领导该品类中最复杂的技术采购。财务资源为第 4 级，因为该岗位决定组织一大类支出的采购方式；研究为第 2 级，对应定期开展市场分析。
  - title: 高级品类经理
    summary: 管理多个品类，或组织最大、风险最高的品类，并与其他组织一起领导联合采购。
    responsibilities:
      - 领导多个品类或战略性技术和临床系统的品类战略。
      - 领导高价值、高风险的采购和谈判，包括战略平台和企业协议。
      - 与其他医疗卫生和照护组织一起领导联合采购。
      - 就技术选择的商业风险和成本向数字和临床负责人提供建议。
      - 为您所领导的品类设定社会价值和可持续性目标。
      - 直线管理和培养品类经理和采购专员。
    qualifications:
      - 公认的高级采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在品类管理和复杂技术采购方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8b 职级。规划为第 5 级，对应多年期品类战略；财务资源为第 5 级，因为该岗位决定多个品类和服务的支出采购方式；人员为第 4 级，因为它直线管理品类经理。
  - title: 品类主管
    summary: 领导组织全部支出的品类管理，确定品类方法并管理品类团队。
    responsibilities:
      - 确定全组织的品类管理方法和采购计划。
      - 领导和管理品类经理及其团队。
      - 确保品类战略支持组织的数字、临床和财务计划。
      - 向执行委员会报告节约、物有所值、社会价值和商业风险。
      - 领导与公共部门采购组织和框架协议提供方的关系。
      - 持有品类团队的预算。
      - 就品类优先事项和重大投资的商业风险向执行总监提供建议。
    qualifications:
      - 公认的高级采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在领导品类团队方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8c 职级。沟通为第 6 级，对应高度争议的谈判和向执行层报告；政策为第 5 级、行动自由度为第 6 级，因为该岗位为整个组织确定品类管理方法。财务资源为第 5 级，因为该岗位决定多项服务的支出采购方式。
