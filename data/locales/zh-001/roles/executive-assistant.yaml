summary: >
  高管助理为高级负责人提供高层次的行政和业务支持。他们管理日程、函件、会议和文件，担任负责人办公室的联系人，并运用判断力代表负责人处理事务。他们经常处理高度保密和敏感的信息。
health_context:
  - 医疗卫生领域的高级负责人要处理患者安全事件、投诉和员工个案，因此高管助理经常处理敏感和保密的材料。
  - 高管办公室与董事会和委员会密切合作，因此准确的文件、会议记录和治理记录很重要。
  - 日程必须能够在短时间内为严重事件和服务中断等紧急事项腾出时间。
levels:
  - title: 高管助理
    summary: 为一名总监或高级负责人提供高管支持，管理其日程、函件和会议。
    responsibilities:
      - 管理一名高级负责人的日程，确定优先次序并解决时间冲突。
      - 处理函件，起草回复，并代表负责人处理日常事务。
      - 为会议准备文件、演示文稿和简报。
      - 为负责人的会议作记录并跟踪行动事项。
      - 担任负责人办公室的第一联系人，处事圆融、谨慎。
      - 安排差旅、活动和访问。
    qualifications:
      - 在为高级人员提供行政支持方面拥有丰富经验，相当于基础学位水平。
    job_evaluation_notes: 沟通按第 4 级评分，因为该岗位经常处理需要与内外部高级联系人讲究方式和进行说服的敏感事项。
  - title: 高级高管助理
    summary: 为首席执行官、董事长或执行总监提供高管支持，并协调其办公室的事务。
    responsibilities:
      - 管理首席执行官或执行总监的日程和优先事项。
      - 处理敏感函件，包括来自合作伙伴和监管机构的投诉和询问。
      - 协调执行团队的会议、文件和行动日志。
      - 为执行层会议和委员会会议作正式会议记录。
      - 跟踪整个高管办公室的承诺和截止日期，并催办进展。
      - 督导其他助理，并在高管办公室内相互补位。
    qualifications:
      - 在高管支持方面拥有广泛经验，相当于学位水平。
  - title: 高管办公室经理
    summary: 管理高管办公室、其员工和业务周期，确保执行团队和董事会得到良好的支持。
    responsibilities:
      - 管理高管办公室团队，确定优先事项并支持其发展。
      - 为执行团队规划业务周期，包括工作计划和会议文件。
      - 确保简报、文件和函件准确、及时且判断得当。
      - 协调执行层对严重事件和询问等紧急事项的应对。
      - 管理高管办公室的预算和系统。
      - 改进高管办公室的流程和工具。
    qualifications:
      - 在高管支持和办公室管理方面拥有广泛经验，相当于学位水平。
