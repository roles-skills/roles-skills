summary: >
  采购主管和商务领导团队领导组织如何购买货物和服务以及如何管理其供应商。他们制定采购政策和商务战略，确保支出合法且物有所值，并就商务风险向董事会提供建议。在数字医疗卫生组织中，他们特别关注技术和临床系统合同、供应商韧性以及退出。
health_context:
  - 大型技术和临床系统合同可能在十年内影响服务，因此商务负责人从一开始就为互操作性、可移植性和未来竞争做好规划。
  - 关键供应商支持 24/7 运行的服务，因此供应商失败和供应链中的网络安全事件是董事会层面的风险。
  - 公共采购规则适用，组织必须能够在受到质疑时为其采购决定辩护。
  - 组织被期望通过其支出实现社会价值和减碳。
  - 商务负责人经常与其他医疗卫生和照护组织合作开展联合采购和共享合同。
levels:
  - title: 采购主管
    summary: 领导采购职能，制定采购程序和标准，并管理采购和购买团队。
    responsibilities:
      - 领导和管理采购和购买团队。
      - 按照公共采购规则和财务规则，制定组织的采购程序、模板和门槛。
      - 为最复杂和最高价值的采购及其授予决定提供保证。
      - 管理采购计划，确保采购按时启动。
      - 向审计委员会报告采购合规、节约和社会价值情况。
      - 持有采购团队预算，并发展团队技能。
    qualifications:
      - 公认的最高级别采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在按照公共采购规则领导采购方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8c 职级。政策为第 5 级，因为该岗位为整个组织制定采购程序；行动自由度为第 6 级，因为它解读采购规则和战略以确定组织的标准。财务资源为第 5 级，因为它控制众多服务的支出采购方式；沟通为第 6 级，对应有争议的授予决定和质疑。
  - title: 商务主管
    summary: 将采购、品类管理和合同管理作为一个统一的商务职能来领导，并制定商务战略。
    responsibilities:
      - 领导商务职能，包括采购、品类管理和合同管理。
      - 制定商务战略，包括应对技术和云合同以及供应商锁定的方法。
      - 领导与临床系统和云服务提供商等战略供应商的谈判。
      - 领导对供应商失败和严重合同争议的应对。
      - 就商务风险、物有所值以及重大投资的商务论证向执行总监提供建议。
      - 与其他医疗卫生和照护组织一起领导联合商务工作。
    qualifications:
      - 公认的最高级别采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在领导商务职能方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 8d 职级。知识为第 8 级，对应跨采购、品类管理、合同管理和商法的知识；行动自由度为第 6 级，因为该岗位制定商务战略。沟通为第 6 级，对应与战略供应商就高度争议的商务事项进行谈判。
  - title: 采购与商务总监
    summary: 组织的高级商务负责人，对采购和商务政策负责，并就商务战略和风险向董事会提供建议。
    responsibilities:
      - 制定经董事会批准的组织采购和商务政策及战略。
      - 就商务战略、风险以及最大的合同和投资向董事会和执行团队提供建议。
      - 为组织遵守公共采购规则以及应对质疑的准备情况提供保证。
      - 领导与战略供应商和公共部门采购组织的高层关系。
      - 设定社会价值和可持续采购目标，并向董事会报告成果。
      - 领导和培养商务领导团队以及组织的商务技能。
      - 对组织在所有服务中的商务承诺和合同组合负责。
    qualifications:
      - 公认的最高级别采购专业资格，或相关学科的硕士学位，或同等经验。
      - 在执行层面领导商务职能方面拥有广泛经验。
    job_evaluation_notes: 医疗卫生行业的招聘广告将此角色定为第 9 职级。政策为第 6 级，对应对采购和商务政策负有全组织责任；财务资源为第 6 级，对应对组织的商务承诺负有全组织责任；行动自由度为第 6 级，因为该岗位确定商务目标和标准。情绪消耗为第 2 级，对应偶尔接触令人紧张的争议、供应商失败和质疑。
