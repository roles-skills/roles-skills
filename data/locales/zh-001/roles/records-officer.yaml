summary: >
  健康档案工作人员确保患者档案和机构档案（无论是纸质还是数字形式）得到正确的创建、存放、跟踪、调取和处置。他们使档案可用于照护，保护档案免于丢失和未经授权的访问，并支持从纸质档案向数字档案的转变。
health_context:
  - 患者档案必须在临床医生需要时可用，因此延误或丢失档案可能直接影响照护。
  - 档案包含高度保密的信息，因此工作人员遵守严格的保密和访问规则，并可能经常阅读令人痛苦的内容。
  - 大多数组织同时持有纸质和数字档案，因此该岗位包括扫描、编制索引和管理混合档案。
  - 档案必须按照保存期限表保存规定的期限，然后归档或安全销毁，并留有审计线索。
  - 档案团队经常处理查阅健康档案的请求，这些请求有法定时限。
levels:
  - title: 档案助理
    summary: 在督导就在身边的情况下，按照既定流程归档、调取、跟踪、扫描和准备档案。
    responsibilities:
      - 归档、调取和跟踪纸质档案，并为门诊和各类请求做好准备。
      - 将档案扫描并编制索引录入电子档案系统，同时检查质量。
      - 在跟踪系统中准确录入和更新档案详情。
      - 妥善保管档案，并立即报告任何档案丢失或泄露事件。
      - 安全地搬运和存放档案，包括成箱和成车的病历。
    qualifications:
      - 良好的读写、计算和键盘技能。
    job_evaluation_notes: 身体技能按第 3 级评分，对应快速、准确的扫描和数据录入。体力消耗反映经常搬运档案。
  - title: 档案专员
    summary: 处理一系列档案流程，其中一些非常规，例如追查丢失的档案、为查阅请求准备档案以及执行保存期限表。
    responsibilities:
      - 追查丢失的档案并解决跟踪问题。
      - 为查阅请求准备档案，在审查前检查其是否完整。
      - 执行保存期限表，并准备待归档或安全销毁的档案。
      - 检查已扫描档案的质量，并纠正索引错误。
      - 回答临床医生、照护人员和患者关于档案的询问。
      - 向新的档案助理演示如何遵循流程。
    qualifications:
      - 具有档案或行政工作经验，或商务行政三级资格或同等经验。
    job_evaluation_notes: 情绪消耗反映经常间接接触健康档案中令人痛苦的内容。
  - title: 高级档案专员
    summary: 日常督导一个档案团队，并运行查阅请求、审核和保存审查等档案流程。
    responsibilities:
      - 日常督导档案人员，分配工作并检查质量。
      - 在信息治理同事的指导下，在法定时限内处理查阅健康档案的请求。
      - 开展档案记录和跟踪审核并报告结果。
      - 保持档案跟踪系统和电子档案系统准确且为最新。
      - 培训员工掌握档案流程和保密要求。
      - 调查档案丢失和其他事件，并提出改进建议。
    qualifications:
      - 丰富的健康档案工作经验，或基础学位水平的相关资格或同等经验。
  - title: 健康档案经理
    summary: 管理健康档案服务及其员工、系统和流程，并领导改进，包括从纸质档案向数字档案的转变。
    responsibilities:
      - 管理健康档案服务及其员工和绩效。
      - 按照档案管理政策和标准编写和维护档案流程。
      - 为多项服务管理档案跟踪系统和电子档案系统。
      - 领导扫描和数字化项目以及向数字档案的转变。
      - 运行保存与处置计划和档案审核。
      - 就档案管理向临床医生、管理者和信息治理同事提供建议。
    qualifications:
      - 档案或信息管理方面的学位或专业资格，或同等经验。
      - 具有督导档案团队的经验。
    job_evaluation_notes: 信息资源按第 5 级评分，因为为多项服务运行档案系统是主要职责。
