summary: >
  网络架构师设计连接组织各场所、员工、临床系统和医疗器械的局域网、广域网、无线网络和云网络。他们确保网络足够快速、有韧性且安全，能够支撑永不停歇的照护，并规划网络如何随着服务迁移上云和与合作组织互联而变化。
health_context:
  - 临床系统、电话和医疗器械都依赖网络，因此一次中断就可能使照护停止；设计需要具备韧性并经过故障转移测试。
  - 网络上通常连接着难以打补丁的医疗器械，因此架构师设计网络分段和监控来保护它们。
  - 员工在医院、诊所、社区和患者家中工作，因此设计必须支持安全的移动和远程访问。
  - 网络与共享的医疗卫生和照护网络以及合作组织相连，这些网络和组织有其各自的连接和安全要求。
  - 对临床区域的变更需要围绕患者照护审慎规划，例如将工作安排在非繁忙时段。
levels:
  - title: 助理网络架构师
    responsibilities:
      - 在网络架构师的指导下起草网络设计、图表和规格说明。
      - 勘察场所并收集临床区域的需求，包括无线覆盖和设备连接。
      - 保持网络拓扑、地址分配和联网设备的记录为最新。
      - 在审查前检查设计是否符合服务水平和安全标准。
    qualifications:
      - 计算机或网络专业的学位、公认的网络资格，或同等经验。
      - 具备网络设计方面的专门知识，达到研究生文凭水平或同等经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 5 职级）：医疗卫生行业的招聘广告将此角色定为第 6 职级。知识按研究生文凭水平评分，信息资源为第 5 级，因为该岗位设计主要信息系统所依赖的部分网络。
  - title: 网络架构师
    responsibilities:
      - 为场所和服务设计局域网、广域网、无线网络和云网络解决方案。
      - 为医疗器械、临床系统和访客访问设计网络分段。
      - 与服务负责人一起规划临床区域的网络变更，使照护不受干扰。
      - 与供应商商定服务水平，与合作网络商定连接要求。
      - 评估新的网络技术及其是否符合组织的安全标准。
    qualifications:
      - 具备网络架构方面的专门知识，达到硕士水平或同等经验。
      - 具有设计和支持企业网络的经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 6 职级）：医疗卫生行业的招聘广告将此角色定为第 7 职级。知识按硕士水平或同等评分，因为需要涵盖局域网、广域网、无线网络和云网络的专门知识。
  - title: 首席网络架构师
    responsibilities:
      - 负责组织的网络架构，包括各场所、数据中心和云连接。
      - 制定网络设计标准，并在设计委员会中为设计提供保证。
      - 为关键临床服务设计网络韧性和恢复，并确保经过测试。
      - 就网络投资、供应商合同以及新服务的网络风险提供建议。
      - 担任专家级的问题上报对象，指导其他网络架构师和工程师。
    qualifications:
      - 在复杂组织的网络架构方面拥有丰富经验，相当于硕士学位水平。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 7 职级）：医疗卫生行业的招聘广告将此角色定为第 8a 职级。信息资源为第 6 级，因为该岗位负责组织所有信息系统所依赖的网络架构。
