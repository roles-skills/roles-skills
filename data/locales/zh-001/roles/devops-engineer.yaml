summary: >
  DevOps 工程师构建并运行让组织各团队能够安全、频繁地交付数字健康服务的工具、流水线、环境和平台。他们将构建、测试、发布和基础设施自动化，使服务可观测且具有韧性，并帮助团队在患者和临床医生需要时保持临床系统可用。
health_context:
  - 许多服务全天候支持照护，因此部署、监控和恢复必须将停机时间降到最低，包括在非工作时间。
  - 发布流水线为临床安全案例提供证据，例如测试结果、变更记录和所部署的确切版本。
  - 环境中可能存有保密的健康信息，因此工程师控制访问、保护密钥，并确保测试环境中不含上线数据。
  - 医疗服务是网络攻击的常见目标，因此流水线和平台内置安全扫描、补丁更新和经过测试的备份。
  - 一些服务必须达到与临床和运营负责人商定的严格可用性和灾难恢复标准。
levels:
  - title: 学徒 DevOps 工程师
    responsibilities:
      - 通过系统化培训和跟岗学习团队的流水线、云平台和工具。
      - 在密切督导下对脚本、流水线和配置进行规模小、界定清晰的修改。
      - 在每个环境中遵循变更、安全和信息治理流程。
      - 协助监控服务，并向有经验的同事报告警报。
      - 攻读学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读 DevOps、软件或基础设施学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 初级 DevOps 工程师
    responsibilities:
      - 在指导下构建和维护构建、测试和部署流水线的部分内容。
      - 编写基础设施即代码和自动化脚本，并在使用前进行测试。
      - 确保测试环境中没有上线的患者数据，并安全地管理密钥。
      - 在指导下响应监控警报并支持事件响应。
      - 记录部署和变更，以支持临床安全和审计证据。
    qualifications:
      - 计算机或相关学科的学位、已完成的学徒培训，或同等经验。
    job_evaluation_notes: UK GDaD PCF 建议学徒级和初级都定为第 4 职级；本参考资料将初级定为第 5 职级，以避免两个级别处于同一职级，因为该岗位在较少督导下构建流水线组件。
  - title: DevOps 工程师
    responsibilities:
      - 独立设计和构建流水线、环境和平台组件。
      - 将依赖项扫描和容器扫描等安全检查自动化，并根据结果采取行动。
      - 构建监控、日志和警报，使团队能在问题影响患者和员工之前发现问题。
      - 为支持照护的服务规划并测试备份、故障转移和恢复。
      - 调查并修复上线服务中的问题，包括在服务需要时提供非工作时间支持。
      - 指导初级和学徒 DevOps 工程师。
    qualifications:
      - 计算机或相关学科的学位，或同等经验。
      - 构建和运行自动化交付流水线和云基础设施的经验。
  - title: 高级 DevOps 工程师
    responsibilities:
      - 领导一个产品或一组服务的交付工具链和平台的设计。
      - 制定发布标准，使临床服务的部署可重复、可回退且证据充分。
      - 与服务负责人和临床负责人商定可用性、恢复时间和恢复点目标，并按目标进行设计。
      - 领导团队所运行平台的技术事件响应和事后复盘。
      - 确保平台符合安全和信息治理要求，包括访问控制和审计日志。
      - 辅导和培养团队中的 DevOps 工程师。
    qualifications:
      - 在设计和运行交付工具链及平台方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席 DevOps 工程师
    responsibilities:
      - 领导一组团队的 DevOps 和平台工程，担任共享平台的技术负责人。
      - 为组织的交付工具、托管和可观测性制定中期路线图。
      - 确保共享平台具有韧性、安全，并能满足临床服务的可用性需求。
      - 与财务部门和服务负责人一起管理平台成本和容量。
      - 领导 DevOps 实践社群，直线管理或领导 DevOps 工程师。
    qualifications:
      - 在领导复杂服务的 DevOps 或平台工程方面拥有广泛经验。
  - title: 主任 DevOps 工程师
    responsibilities:
      - 为组织如何构建、发布、托管和运行其数字健康服务制定战略。
      - 就托管、韧性、网络安全和平台投资向高级负责人提供建议。
      - 确保关键临床服务的业务连续性和灾难恢复计划切实可行并经过测试。
      - 评估并倡导新技术和新实践，在创新与安全稳定之间取得平衡。
      - 提升组织的 DevOps 能力，包括招聘、职业路径和技能计划。
    qualifications:
      - 在领导多个团队或组织的 DevOps 和平台工程方面拥有广泛经验。
