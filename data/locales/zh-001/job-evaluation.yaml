# Job evaluation factors in Simplified Chinese. Keys are the English factor ids.
communication:
  name: 沟通与人际关系技能
  description: 与同事、患者、公众和合作伙伴沟通并建立关系所需的技能。考虑信息的复杂程度、敏感程度或争议程度，以及理解或接受方面的任何障碍。
  levels:
    "1": 主要与同事口头传递和接收常规信息。
    "2": 与同事及他人以口头、书面或电子方式传递和接收常规信息。
    "3": 传递需要讲究方式或说服力的常规信息，或复杂、敏感的信息，或向群体提供简单培训。
    "4": 传递需要说服、谈判或培训技能的复杂、敏感或有争议的信息，或高度复杂的信息。
    "5": 传递需要成熟说服和谈判技能的高度复杂或有争议的信息，向大型群体演讲，或在接受方面存在重大障碍时进行沟通。
    "6": 在接受方面存在重大障碍时，运用最高水平的沟通技能传递高度复杂、高度争议的信息。
knowledge:
  name: 知识、培训和经验
  description: 完成工作所需的知识和经验，来源不限，包括正式培训、资格和经验。
  levels:
    "1": 少数常规流程，在简短入职培训中于工作中学会。
    "2": 一系列常规流程，通过在岗培训和入职培训学会。
    "3": 一系列流程，其中一些非常规，需要基础理论（例如三级资格或同等经验）。
    "4": 一系列流程，大多非常规，需要中级理论（例如基础学位或同等经验）。
    "5": 在某一专业领域具备专长，以理论或实践经验为基础（学位水平或同等）。
    "6": 覆盖整个专业领域的专门知识（研究生文凭水平或同等）。
    "7": 覆盖整个专业领域的高度发达的专门知识（硕士水平或同等）。
    "8": 高级知识（博士学位加进一步培训或同等），或长期积累的跨多个学科的专门知识。
analytical:
  name: 分析与判断技能
  description: 处理信息、解决问题和作出决策所需的分析与判断能力。
  levels:
    "1": 对简单事实或情况作出判断。
    "2": 对事实或情况作出判断，其中一些需要分析。
    "3": 对一系列需要分析或比较方案的事实或情况作出判断。
    "4": 对需要分析、解读和比较方案的复杂事实或情况作出判断。
    "5": 对需要分析、解读和比较方案的高度复杂事实或情况作出判断。
planning:
  name: 规划与组织技能
  description: 开展活动、项目、服务或战略所需的规划和组织能力。
  levels:
    "1": 组织自己的日常工作。
    "2": 规划简单的任务或活动，其中一些是持续性的。
    "3": 规划多项复杂活动，并根据需要调整计划。
    "4": 规划范围广泛的复杂活动或战略，并根据需要进行调整。
    "5": 制定长期战略规划，存在不确定性并影响整个组织。
physical-skills:
  name: 身体技能
  description: 所需的身体技能，例如灵巧性、协调性、键盘技能和驾驶。
  levels:
    "1": 几乎不需要身体技能。
    "2": 通过练习获得的技能，例如标准键盘操作或驾驶。
    "3": 需要速度或准确性的熟练技能，例如高级键盘操作。
    "4": 需要精确或速度以及高度手眼协调的高度熟练技能。
    "5": 最高水平的精确度、速度和协调性。
patient-care:
  name: 对患者和服务对象照护的责任
  description: 对评估、治疗、照护患者和服务对象或向其提供建议的责任。对大多数数字和综合职能角色而言，这仅限于偶然接触。
  levels:
    "1": 在偶然接触中帮助患者、服务对象或亲属。
    "2": 直接向患者或公众提供一般性非临床建议、信息或服务。
    "3": 提供个人照护、基础临床技术服务或基础临床建议。
    "4": 开展临床照护，提供临床技术服务，或就患者照护提供建议。
    "5": 制定照护方案，提供专科临床技术服务，或就患者照护提供专门建议。
    "6": 制定专科照护，提供高度专门的建议，或对临床服务的一部分负责。
    "7": 对提供一项临床或照护服务负责。
    "8": 对临床或照护服务负有全组织责任。
policy:
  name: 政策与服务发展的责任
  description: 制定和实施政策与服务的责任，以及其影响所及的范围。
  levels:
    "1": 遵循他人制定的政策；可对变更提出意见。
    "2": 在本领域实施政策，并对其做法提出变更建议。
    "3": 在本领域实施政策，并提出影响其他领域的变更建议。
    "4": 实施政策，并为一项服务或多个领域制定政策或服务。
    "5": 为一个总监部实施和制定一系列政策或服务。
    "6": 对整个组织内外的重大政策或服务发展负有全组织责任。
financial-resources:
  name: 对财务和实物资源的责任
  description: 对资金、预算、设备、库存、建筑物和其他资产的责任。
  levels:
    "1": 妥善保管本人工作中使用的设备和资源。
    "2": 经手现金或贵重物品，保管他人使用的设备，管理库存，或批准小额付款。
    "3": 批准付款，采购部分资产或物资，监控或持有授权预算，或维护资产。
    "4": 持有或制定一个部门或服务的预算，或采购或维护其资产。
    "5": 为多项服务持有或制定预算，或管理资产。
    "6": 对组织的财务或资产负有全组织责任。
people:
  name: 对人员的责任
  description: 对管理、督导、培训或培养员工，或提供人力资源服务的责任。
  levels:
    "1": 向新同事或经验较少的同事演示本人的工作流程。
    "2": 日常督导或协调员工，定期培训他人，或提供基础人力资源建议。
    "3": 日常管理一组员工，讲授核心或专门培训，或提供核心人力资源建议。
    "4": 直线管理一项职能或一个部门，以设计培训项目为主要职责，或提供全方位的人力资源服务。
    "5": 直线管理多个部门，或管理全组织的培训或人力资源的很大一部分。
    "6": 对组织的人员或人力资源职能负有全组织责任。
information-resources:
  name: 对信息资源的责任
  description: 对纸质或数字信息及信息系统的责任，包括记录、数据以及存放它们的系统。
  levels:
    "1": 记录本岗位产生的信息。
    "2": 录入或存储他人汇编的数据，或偶尔编写报告或查询。
    "3": 作正式会议记录，定期编写报告或查询，或将维护信息系统作为一项重要职责。
    "4": 按他人的规格调整或设计信息系统，或以运行一个部门的信息系统为主要职责。
    "5": 设计和开发主要信息系统，或以运行多项服务的信息系统为主要职责。
    "6": 以管理和开发全组织的信息系统为主要职责。
    "7": 对组织的信息系统负有全组织责任。
research:
  name: 对研究与开发的责任
  description: 对正式研究、开发、评估、审核、测试和试验的责任。
  levels:
    "1": 为本人工作开展调查或审核；偶尔参与研究或测试。
    "2": 作为工作的一部分，定期开展研究、开发、试验或设备与系统测试。
    "3": 以在正式项目中开展研究或开发为主要职责。
    "4": 协调并开展研究与开发项目。
    "5": 发起并制定支持组织目标的研究与开发项目。
    "6": 发起并制定影响超出本组织的研究与开发项目。
freedom-to-act:
  name: 行动自由度
  description: 任职者在多大程度上自行决定做什么和怎么做，以及其工作受到督导的密切程度。
  levels:
    "1": 在既定流程范围内工作，督导就在身边。
    "2": 遵循标准流程和先例；通常有人可以请教；工作可能受到检查。
    "3": 遵循明确的政策和流程；工作受到管理而非督导。
    "4": 结果已经确定，但任职者在总体政策范围内决定如何实现。
    "5": 在一般政策范围内工作，并在大多数情况下自行决定如何解读。
    "6": 解读总体政策和战略，以设定目标和标准。
physical-effort:
  name: 体力消耗
  description: 所需的体力消耗，考虑其频率、持续时间和强度。
  levels:
    "1": 坐、站和行走，体力消耗很少。
    "2": 经常以受限姿势坐或站，或偶尔进行轻度至中度用力。
    "3": 长时间经常轻度用力，或短时间经常中度用力。
    "4": 持续轻度用力，长时间经常中度用力，或偶尔高强度用力。
    "5": 持续中度用力，或经常高强度用力。
mental-effort:
  name: 脑力消耗
  description: 所需的专注程度，考虑其频率、持续时间以及工作的可预测程度。
  levels:
    "1": 一般注意力；偶尔专注于可预测的工作。
    "2": 经常专注于可预测的工作，或偶尔专注于不可预测的工作。
    "3": 经常专注于不可预测的工作，或偶尔长时间专注。
    "4": 经常长时间专注，或偶尔高度专注。
    "5": 经常高度专注。
emotional-effort:
  name: 情绪消耗
  description: 工作的情绪要求，来自直接或间接接触令人痛苦的情况，例如阅读令人痛苦的个案记录或处理严重事件。
  levels:
    "1": 很少接触，或偶尔间接接触令人痛苦的情况。
    "2": 偶尔接触，或经常间接接触令人痛苦的情况。
    "3": 经常接触令人痛苦的情况，或偶尔接触高度令人痛苦的情况。
    "4": 偶尔接触创伤性情况，或经常接触高度令人痛苦的情况。
working-conditions:
  name: 工作条件
  description: 接触不良条件或危险。大多数日子几乎持续使用屏幕计为第 2 级。
  levels:
    "1": 很少接触不良条件。
    "2": 偶尔接触不良条件，经常出差或户外工作，或大多数日子几乎持续使用屏幕。
    "3": 经常接触不良条件，或偶尔接触非常恶劣的条件。
    "4": 一定程度接触危险，或经常接触非常恶劣的条件。
    "5": 大量接触危险。
