# Simplified Chinese translations of data/skills/corporate-services.yaml. Keys are the English skill ids.
corp-administration:
  name: 办公室行政
  description: 运行让团队或服务正常运转的行政流程，例如归档、订购、数据录入、记录和遵守办公室流程。
  levels:
    awareness: |
      您可以：
      - 遵循归档、订购和数据录入的办公室流程
      - 准确记录您本人的工作
    working: |
      您可以：
      - 在很少督导的情况下为团队运行一系列行政流程
      - 发现并纠正记录和数据中的错误
      - 提出更简便的工作方法
    practitioner: |
      您可以：
      - 为一项服务或一个总监部组织行政支持
      - 编写和改进行政流程
      - 培训其他行政人员并检查其工作
    expert: |
      您可以：
      - 设计全组织的行政服务
      - 领导向更简便的数字化行政流程转变
corp-office-software:
  name: 数字办公工具
  description: 快速准确地使用文字处理、电子表格、演示文稿、电子邮件、共享文档和协作工具。
  levels:
    awareness: |
      您可以：
      - 创建和编辑文档、电子邮件和简单的电子表格
      - 将文件存放和共享到正确的位置
    working: |
      您可以：
      - 快速准确地制作格式规范的文档和演示文稿
      - 使用电子表格对数据进行排序、筛选和汇总
      - 使用协作工具管理共享文档和版本
    practitioner: |
      您可以：
      - 制作模板、跟踪表和简单的自动化工作流程
      - 让每个人都能无障碍地使用文档
      - 帮助同事充分利用办公工具
    expert: |
      您可以：
      - 为模板、文档管理和协作工具制定标准
      - 领导全组织采用新的办公工具
corp-diary-and-meeting-management:
  name: 日程与会议管理
  description: 管理日程、会议和差旅，使人们的时间得到充分利用，会议有合适的人员、文件和会议室。
  levels:
    awareness: |
      您可以：
      - 使用组织的工具预订会议和会议室
      - 按时发送邀请和会议文件
    working: |
      您可以：
      - 为团队管理日程，解决时间冲突
      - 安排差旅、活动以及与外部合作伙伴的会议
      - 确保会前准备好文件和行动事项
    practitioner: |
      您可以：
      - 管理一位高级负责人的日程，与其共同确定优先事项
      - 判断哪些事情需要其亲自处理，哪些可由他人处理
      - 为董事会或领导团队规划年度会议周期
    expert: |
      您可以：
      - 为执行团队运行业务周期
      - 确保高级负责人的时间集中于组织的优先事项
corp-minute-taking:
  name: 会议记录与会议档案
  description: 准确、简洁地记录讨论、决定和行动，并保存正式的会议档案。
  levels:
    awareness: |
      您可以：
      - 记录团队会议中的行动和决定
    working: |
      您可以：
      - 为例行会议撰写准确、简洁的会议记录和行动日志
      - 与负责人跟进行动事项
    practitioner: |
      您可以：
      - 为董事会和委员会会议作正式记录，包括复杂或有争议的讨论
      - 保存经得起审计和调查的正式会议档案
      - 就会议记录应反映的内容向会议主席提供建议
    expert: |
      您可以：
      - 为全组织的正式会议档案制定标准
      - 培训会议记录人员并检查其质量
corp-correspondence-management:
  name: 函件与咨询处理
  description: 及时、礼貌地处理信函、电子邮件、电话和咨询，并将其转给合适的人。
  levels:
    awareness: |
      您可以：
      - 礼貌地接听电话、回复电子邮件并准确记录留言
      - 将咨询转给合适的人
    working: |
      您可以：
      - 自行处理常规函件和咨询
      - 起草信函和回复供他人签发
      - 保存函件登记并催促回复
    practitioner: |
      您可以：
      - 为一位高级负责人管理函件，包括敏感信函和投诉信
      - 起草需要讲究方式、准确和判断力的回复
      - 确保回复符合截止时间
    expert: |
      您可以：
      - 为高管函件制定流程和标准
      - 处理最敏感的函件，包括与监管机构、合作伙伴和媒体的往来
corp-pmo-reporting:
  name: 项目与项目组合办公室支持
  description: 运行项目和项目组合办公室的流程，例如计划、登记册、报告、文档控制和保证检查。
  levels:
    awareness: |
      您可以：
      - 将项目文档存放在正确位置并进行版本控制
      - 在被要求时更新行动、风险和问题日志
    working: |
      您可以：
      - 为多个项目维护计划、登记册和跟踪表
      - 收集进展并定期编制状态报告
      - 检查项目是否遵循商定的方法
    practitioner: |
      您可以：
      - 设计项目组合报告，分析各项目的进展、风险和效益
      - 开展保证检查和关口评审
      - 就方法和控制措施向项目经理提供建议
    expert: |
      您可以：
      - 为组织设立并领导项目组合办公室
      - 为高级负责人提供清晰可靠的项目组合洞察
      - 制定项目和项目组合管理的标准与工具
corp-assurance-and-audit:
  name: 保证与审计联络
  description: 收集控制措施有效的保证证据，支持内部和外部审计，并跟踪审计建议直至完成。
  levels:
    awareness: |
      您可以：
      - 解释组织中审计和保证如何运作
      - 在被要求时提供证据
    working: |
      您可以：
      - 为审计和检查协调证据
      - 跟踪审计建议并催办逾期事项
    practitioner: |
      您可以：
      - 针对组织的主要风险规划保证映射
      - 与内部和外部审计人员合作，商定范围和发现
      - 向委员会报告保证方面的差距
    expert: |
      您可以：
      - 设计组织的保证框架
      - 就保证的充分性向审计委员会和董事会提供建议
corp-policy-management:
  name: 政策管理
  description: 编写、审查、批准和发布组织的政策和流程，并检查人们是否遵守。
  levels:
    awareness: |
      您可以：
      - 查找并遵守适用于您工作的政策
    working: |
      您可以：
      - 及时更新政策登记册并提醒负责人进行审查
      - 检查政策是否使用了正确的模板和审批途径
    practitioner: |
      您可以：
      - 与相关领域专家一起起草和审查政策
      - 对照法律、标准和平等义务检查政策
      - 监督遵守情况并报告差距
    expert: |
      您可以：
      - 为组织制定政策框架
      - 就政策重点和风险向董事会提供建议
corp-internal-communications:
  name: 内部传播
  description: 通过内网、简讯、情况通报和活动等渠道让员工了解情况并保持参与，特别是在变革期间。
  levels:
    awareness: |
      您可以：
      - 在内网等内部渠道发布内容
      - 遵循组织的风格和语气
    working: |
      您可以：
      - 为员工撰写和编辑新闻、情况通报和简讯
      - 规划内部渠道的内容并衡量参与度
    practitioner: |
      您可以：
      - 为新临床系统等重大变革规划内部传播
      - 就如何调动员工参与和传达艰难信息向负责人提供建议
      - 利用反馈和数据改进渠道
    expert: |
      您可以：
      - 制定内部传播和员工参与战略
      - 就文化和参与向执行团队提供建议
corp-media-relations:
  name: 媒体关系
  description: 与记者建立关系，处理媒体询问，撰写新闻稿，为发言人做准备，包括在事件期间。
  levels:
    awareness: |
      您可以：
      - 解释组织如何处理媒体询问
      - 立即将媒体询问转交传播团队
    working: |
      您可以：
      - 登记并回应常规媒体询问
      - 起草新闻稿和声明供审批
      - 监测媒体报道
    practitioner: |
      您可以：
      - 处理敏感和被动应对的媒体询问，包括关于事件或数据泄露的询问
      - 为发言人提供情况介绍并做好准备
      - 与健康和科技领域的记者建立关系
    expert: |
      您可以：
      - 在重大事件和危机期间领导媒体应对
      - 在高级利益相关方中维护并提升组织声誉
      - 就声誉风险向董事会提供建议
corp-communications-strategy:
  name: 传播战略与规划
  description: 利用对受众的洞察，规划符合组织目标的传播活动和宣传活动，并评估其效果。
  levels:
    awareness: |
      您可以：
      - 解释您正在参与的传播计划的目标
    working: |
      您可以：
      - 为项目编写包含受众、信息和渠道的传播计划
      - 衡量传播活动的结果
    practitioner: |
      您可以：
      - 规划改变行为的宣传活动，例如鼓励患者使用某项数字服务
      - 利用受众洞察和评估改进宣传活动
      - 为事件和服务中断规划传播
    expert: |
      您可以：
      - 为组织制定传播战略
      - 领导危机传播
      - 就声誉和利益相关方参与向董事会提供建议
corp-digital-and-social-media:
  name: 数字媒体与社交媒体
  description: 规划、发布和管理网站和社交媒体上的内容，与受众互动，并衡量结果。
  levels:
    awareness: |
      您可以：
      - 在组织的渠道上发布已获批准的内容
      - 遵守社交媒体政策
    working: |
      您可以：
      - 为网站和社交媒体规划并发布内容
      - 回复评论并发现需要上报的问题
      - 报告渠道表现
    practitioner: |
      您可以：
      - 管理组织的数字渠道及其内容计划
      - 处理负面或误导性的帖子，包括在事件期间
      - 利用分析提高覆盖面和参与度
    expert: |
      您可以：
      - 为组织的数字渠道制定战略和治理
      - 领导对网络声誉风险的应对
