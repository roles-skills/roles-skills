# Simplified Chinese translations of data/skills/data-testing.yaml. Keys are the English skill ids.
data-ai-assurance:
  name: 医疗卫生中安全公平的人工智能
  description: 确保医疗卫生和照护中使用的统计、机器学习和人工智能模型安全、公平、可解释并受到监测，包括检查不同患者群体间的偏差，并满足医疗器械和人工智能法规的要求。
  levels:
    awareness: |
      您可以：
      - 解释模型可能如何伤害患者，例如通过偏差、漂移或过度依赖其输出
      - 解释为什么需要在模型将要使用的人群中对其进行验证
    working: |
      您可以：
      - 衡量模型在不同患者群体中的表现，并报告任何差异
      - 记录模型的预期用途、训练数据和已知局限，例如写入模型卡
      - 为临床安全案例提供关于模型的证据
    practitioner: |
      您可以：
      - 与临床同事一起规划模型的验证、偏差评估和上线后监测
      - 判断模型何时需要重新训练、限制使用或撤回
      - 就模型何时可能作为医疗器械受到监管以及需要哪些证据向团队提供建议
    expert: |
      您可以：
      - 制定组织在照护中保证和监测人工智能的标准
      - 领导高风险模型在部署前后的保证工作
      - 在安全公平的人工智能方面代表组织与监管机构和合作伙伴沟通
data-deidentification:
  name: 假名化与披露控制
  description: 在关联、分析、共享或发布数据时，使用假名化、匿名化、小数抑制和其他统计披露控制方法保护患者隐私。
  levels:
    awareness: |
      您可以：
      - 解释可识别数据、假名化数据和匿名化数据之间的区别
      - 遵循组织关于在输出中抑制小数的规则
    working: |
      您可以：
      - 使用假名化数据，并在发布输出前进行披露检查
      - 识别关联数据或详细数据何时可能识别出某位患者
    practitioner: |
      您可以：
      - 设计将标识符与分析数据分开保存的假名化和关联方法
      - 评估数据集或出版物的再识别风险，并选择合适的控制措施
      - 就可信研究环境等安全环境向团队提供建议
    expert: |
      您可以：
      - 制定组织的去标识化和披露控制标准
      - 为高风险的数据发布和关联项目提供保证
      - 领导与合作伙伴开展的工作，为研究和规划提供安全的数据访问
