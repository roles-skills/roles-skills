# Simplified Chinese translations of data/skills/finance.yaml. Keys are the English skill ids.
fin-financial-transactions:
  name: 财务交易与分类账
  description: 遵循财务控制要求，在分类账中准确处理和记录发票、付款、收款、日记账分录和对账。
  levels:
    awareness: |
      您可以：
      - 解释采购到付款和订单到收款流程以及您在其中的角色
      - 按既定流程准确录入发票、收据和付款
      - 检查交易是否经过正确审批并附有证明文件
    working: |
      您可以：
      - 处理一系列交易，包括贷项通知单、退款和日记账分录
      - 核对供应商对账单、银行账户和控制账户
      - 解决供应商、客户和预算持有人的常规询问
      - 发现重复、异常或未经授权的交易并提出
    practitioner: |
      您可以：
      - 管理一个分类账或交易流程，并保持其准确和及时
      - 调查并清理复杂的对账差异项和长期挂账余额
      - 改进交易流程，例如将匹配或审批自动化
      - 培训其他员工并检查其工作
    expert: |
      您可以：
      - 设计组织的交易流程及其中的控制措施
      - 制定付款时限和欠款回收目标等绩效标准
      - 领导向自动化和自助服务等新处理方式的转变
      - 向高级负责人和审计人员保证分类账完整准确
fin-financial-reporting:
  name: 财务报告与法定账目
  description: 按照适用的会计准则和公共部门报告规则，编制准确的财务报表和法定报表。
  levels:
    awareness: |
      您可以：
      - 解释主要财务报表的用途
      - 编制支持月末和年末结账的工作底稿和对账
    working: |
      您可以：
      - 编制月末和年末分录，例如应计项目、预付款项和准备金
      - 编制年度账目的部分章节及附注
      - 将会计准则应用于常规交易，例如将软件和硬件资本化
    practitioner: |
      您可以：
      - 按时间表编制年度账目和法定报表
      - 将会计准则应用于租赁、云计算安排和无形资产等复杂领域
      - 撰写解释判断和估计的会计说明文件
      - 管理账目的外部审计并回应审计发现
    expert: |
      您可以：
      - 负责组织的年度报告和账目及其背后的会计政策
      - 就重大判断和新准则向董事会和审计委员会提供建议
      - 领导对保留审计意见或重大错报的应对
      - 保证报告符合公共问责规则
fin-management-accounting:
  name: 管理会计
  description: 编制帮助管理者规划、控制和决策的预算和成本信息，包括差异分析、成本核算和绩效报告。
  levels:
    awareness: |
      您可以：
      - 解释预算、实际数、承诺和差异
      - 从财务系统中生成标准预算报告
    working: |
      您可以：
      - 编制月度预算报告并解释主要差异
      - 在成本中心、项目以及资本性和收益性支出之间正确归集成本
      - 支持预算持有人理解和管理其预算
    practitioner: |
      您可以：
      - 管理一个总监部或项目群的月度报告周期
      - 建立成本模型，例如一项数字服务的全部成本或一笔交易的单位成本
      - 分析支出趋势，并就保持在预算内的措施向管理者提供建议
      - 建设性地质询预算持有人的预测
    expert: |
      您可以：
      - 设计组织的管理报告和成本核算方法
      - 向董事会和高级负责人汇报财务绩效
      - 领导利用成本和绩效信息提高物有所值
      - 为全组织的管理会计制定标准
fin-financial-planning-and-forecasting:
  name: 财务规划与预测
  description: 编制将资金与组织的优先事项和项目联系起来的预算、预测和中期财务计划。
  levels:
    awareness: |
      您可以：
      - 解释年度预算编制周期以及预算与预测之间的区别
      - 从预算持有人处收集预测信息
    working: |
      您可以：
      - 为成本中心或项目编制预算和预测，包括人员成本
      - 每月根据已知变化和风险更新预测
      - 对预算进行分期，使支出进度与交付计划相匹配
    practitioner: |
      您可以：
      - 领导一个总监部或大型项目群的预算编制和预测
      - 对通货膨胀、延误或资金变化等情景和敏感性进行建模
      - 为数字项目编制多年期预测，包括投资之后的运行成本
      - 向高级管理者汇报预测和风险
    expert: |
      您可以：
      - 领导组织的中期财务计划
      - 使财务计划与战略、人力和投资计划保持一致
      - 就财务可持续性以及保持在资金范围内所需的选择向董事会提供建议
      - 制定全组织使用的规划假设和方法
fin-payroll:
  name: 薪资
  description: 准确按时向员工支付薪酬，包括入职、离职、变动、扣款、养老金、法定付款和薪资报告。
  levels:
    awareness: |
      您可以：
      - 解释从变动和截止到付款和报告的薪资周期
      - 根据经授权的表格准确录入入职、离职和变动信息
      - 回答常规薪资询问，并对薪资信息保密
    working: |
      您可以：
      - 计算工资、津贴、加班费、病假工资和家庭假期工资
      - 正确扣除税款、养老金和其他扣款
      - 检查薪资输出并在付款前纠正错误
      - 按照政策、体贴地追回多付款项
    practitioner: |
      您可以：
      - 为一组员工运行完整的薪资并签核薪资检查
      - 管理法定薪资报告和养老金申报
      - 解决多份合同、补发工资或薪资牺牲等复杂情况
      - 测试薪资系统的变更，例如年度加薪和规则变更
    expert: |
      您可以：
      - 管理组织的薪资服务，无论是内部运行还是由供应商提供
      - 制定薪资控制措施，向高级负责人保证付款准确合法
      - 为薪资规则、加薪和薪资系统的变化做好规划
      - 领导对重大薪资故障的应对
fin-treasury-and-cash:
  name: 资金与现金管理
  description: 在公共部门现金规则范围内管理银行账户、现金流和流动性，使组织能够履行其承诺。
  levels:
    awareness: |
      您可以：
      - 解释为什么除了预算之外现金也很重要
      - 记录并核对银行交易
    working: |
      您可以：
      - 编制每日现金头寸和短期现金预测
      - 准备付款批次并检查其是否经过适当授权
      - 核对银行账户并清理未匹配项
    practitioner: |
      您可以：
      - 管理组织的现金流预测和资金提取
      - 管理银行账户、付款方式和银行业务控制
      - 为大额或不定期付款规划现金，例如多年期软件许可费
    expert: |
      您可以：
      - 制定组织的资金管理政策和银行安排
      - 就流动性和现金风险向董事会提供建议
      - 在资助方和公共部门规则设定的限额内管理现金
fin-audit-and-controls:
  name: 财务控制与审计
  description: 设计、运行和测试财务控制，预防和发现欺诈，并与内部和外部审计人员合作。
  levels:
    awareness: |
      您可以：
      - 遵守组织的财务流程和授权方案
      - 识别可能存在欺诈或差错的迹象并报告
    working: |
      您可以：
      - 运行关键控制措施，例如职责分离和供应商银行信息核查
      - 向审计人员提供证据并回答其问题
      - 检查支出是否在适当级别获得批准
    practitioner: |
      您可以：
      - 测试并改进一个财务流程的控制措施
      - 管理某一领域的审计请求，并就审计发现商定整改措施
      - 编写和更新财务流程
      - 与反欺诈专家合作降低欺诈风险
    expert: |
      您可以：
      - 负责组织的财务规则和授权方案
      - 就财务控制和审计整改向审计委员会报告
      - 领导对重大控制失效或欺诈的应对
      - 营造员工理解其妥善使用公共资金义务的文化
fin-business-cases:
  name: 商业论证与投资评估
  description: 构建投资的财务论证，包括方案评估、全生命周期成本、资本性和收益性处理、效益以及物有所值。
  levels:
    awareness: |
      您可以：
      - 解释商业论证及其财务部分的用途
      - 为商业论证收集成本信息
    working: |
      您可以：
      - 为简单的商业论证建立财务模型
      - 区分资本性和收益性成本，以及一次性和经常性成本
      - 纳入全生命周期成本，例如上线后的许可、支持和托管费用
    practitioner: |
      您可以：
      - 领导复杂数字投资的财务论证，例如新临床系统或迁移上云
      - 使用净现值、敏感性分析和风险调整评估方案
      - 检查效益是否现实、可衡量且有人负责
      - 在批准后跟踪支出和效益
    expert: |
      您可以：
      - 制定组织的商业论证和投资评估标准
      - 就可负担性、物有所值和风险向投资委员会提供建议
      - 向资助方论证重大投资项目
      - 审查投资组合，并建议在哪里停止、调整或继续
fin-tax:
  name: 税务
  description: 对组织的交易正确适用销售税、雇佣税和其他税收规则，并在允许时退税。
  levels:
    awareness: |
      您可以：
      - 识别发票上的销售税并正确编码
      - 解释何时应向税务专家寻求建议
    working: |
      您可以：
      - 在督导下编制纳税申报表和对账
      - 对常见的采购和收入适用正确的税务处理
      - 在指导下核查承包人的雇佣身份
    practitioner: |
      您可以：
      - 管理组织的纳税申报和税务对账
      - 就软件许可、云服务和共享服务等合同的税务处理提供建议
      - 在规则范围内最大限度地退税
    expert: |
      您可以：
      - 负责组织的税务战略和税务风险
      - 就复杂问题领导与税务机关的讨论
      - 评估新的合作关系或经营活动等重大变化的税务影响
fin-financial-systems:
  name: 财务系统
  description: 使用、管理和改进财务、采购、薪资和报告系统，使财务数据准确、流程高效。
  levels:
    awareness: |
      您可以：
      - 按流程使用财务系统完成本人的任务
      - 运行标准报告并将数据导出到电子表格
    working: |
      您可以：
      - 熟练使用电子表格，包括公式、查找和数据透视表
      - 维护财务系统数据，例如成本中心、供应商和审批人
      - 报告并协助解决系统问题
    practitioner: |
      您可以：
      - 管理财务或薪资系统，包括访问权限、工作流程和报告
      - 为预算持有人设计报告和仪表板
      - 测试系统变更和升级
      - 将重复性的财务任务自动化
    expert: |
      您可以：
      - 负责财务系统的战略和路线图
      - 领导财务或薪资系统的采购和实施
      - 确保财务数据与人力、采购和绩效数据集成
fin-public-sector-finance:
  name: 公共部门财务
  description: 了解公共资金如何运作，包括资金分配、资本性和收益性限额、支出控制、公共资金问责和物有所值。
  levels:
    awareness: |
      您可以：
      - 解释组织使用的是公共资金，必须对其负责
      - 解释资本性支出与收益性支出之间的区别
    working: |
      您可以：
      - 对日常支出适用组织的资本性和收益性规则
      - 解释资金分配和支出限额如何影响您的领域
      - 识别需要资助方或支出控制审批的支出
    practitioner: |
      您可以：
      - 就资金规则向管理者提供建议，包括专款专用和有期限的资金
      - 管理一个项目群或总监部的资本性和收益性限额
      - 为资助方和支出控制编制报表和证据
    expert: |
      您可以：
      - 代表组织与资助方和监督机构沟通
      - 就合规性、正当性和物有所值向董事会提供建议
      - 为组织的服务塑造资金协议和财务制度
