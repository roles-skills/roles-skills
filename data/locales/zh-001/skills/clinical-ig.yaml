# Simplified Chinese translations of data/skills/clinical-ig.yaml. Keys are the English skill ids.
clin-clinical-systems-optimisation:
  name: 临床系统设计与优化
  description: 设计、配置和改进电子健康记录、医嘱通信和电子处方等临床系统，使其符合临床工作流程，支持安全、高效的照护。
  levels:
    awareness: |
      您可以：
      - 解释电子健康记录等临床系统如何支持照护
      - 描述系统所支持的临床工作流程
    working: |
      您可以：
      - 与临床医生和照护人员一起梳理当前和未来的临床工作流程
      - 依据临床场景测试系统配置
      - 为产品团队编写清晰的临床需求
    practitioner: |
      您可以：
      - 领导系统配置、表单、医嘱套餐和决策支持的临床设计
      - 利用数据和用户反馈发现并解决工作流程问题
      - 平衡临床需求、安全、可用性和系统限制
    expert: |
      您可以：
      - 为全组织的临床系统制定设计原则和标准
      - 领导可衡量地改善照护和员工体验的优化项目
      - 就临床系统选择及其对照护的影响向高级负责人提供建议
clin-human-factors:
  name: 临床系统中的人因与可用性
  description: 将人因和可用性方法应用于临床系统，使临床医生、照护人员和患者能够安全使用，并尽可能减少差错。
  levels:
    awareness: |
      您可以：
      - 解释糟糕的设计可能如何导致照护差错
      - 报告可能影响患者安全的可用性问题
    working: |
      您可以：
      - 参与临床任务的可用性测试和模拟
      - 发现常见的设计危害，例如外观相似的选项或隐藏的警报
    practitioner: |
      您可以：
      - 规划并开展临床系统的人因评估
      - 将发现转化为设计变更和临床安全控制措施
      - 评估警报负担和变通操作的风险
    expert: |
      您可以：
      - 制定组织在数字服务中运用人因的方法
      - 审查高风险系统和变更的人因证据
      - 在临床和数字团队中培养人因技能
clin-digital-health-evaluation:
  name: 数字健康评估与效益
  description: 规划和开展数字健康技术评估，并以可靠的方法和证据衡量其临床、安全和服务效益。
  levels:
    awareness: |
      您可以：
      - 解释为什么数字健康技术需要效益和安全方面的证据
      - 查找关于某项技术的已发表证据
    working: |
      您可以：
      - 为评估收集基线和随访数据
      - 开展系统使用情况的临床审核
      - 为同事总结评估结果
    practitioner: |
      您可以：
      - 为数字健康产品设计评估和效益计划
      - 为临床结局、安全和体验选择合适的衡量指标
      - 判断证据的强度并解释其局限
    expert: |
      您可以：
      - 制定组织的数字健康评估方法
      - 与学术和照护合作伙伴一起领导研究和评估项目
      - 利用证据就数字投资向董事会提供建议
clin-professional-practice:
  name: 数字领域中的注册临床执业
  description: 将最新的注册临床知识和判断带入数字工作，同时履行临床专业的标准、伦理和再认证义务。
  levels:
    awareness: |
      您可以：
      - 解释适用于注册临床医生的专业标准
      - 识别何时某个问题需要临床意见
    working: |
      您可以：
      - 在执业范围内将临床知识应用于数字工作
      - 保持注册有效并持续进行专业发展
      - 就工作流程、内容和安全提供临床意见
    practitioner: |
      您可以：
      - 就数字服务对照护的影响作出可靠的临床判断
      - 在数字或临床环境中自信地质疑不安全的做法
      - 支持其他临床医生将其专业标准应用于数字工作
    expert: |
      您可以：
      - 领导组织数字工作的临床专业标准
      - 在有关患者安全和照护的决策中担任高级临床代表
      - 支持数字岗位临床医生的再认证和专业发展
ig-information-rights-requests:
  name: 信息权利请求
  description: 在法定时限内处理个人和公众的信息访问请求，例如查阅个人健康记录的请求，以及要求获取组织所持信息的请求。
  levels:
    awareness: |
      您可以：
      - 识别信息权利请求并及时转交
      - 解释请求有法定时限
    working: |
      您可以：
      - 登记、确认和跟踪请求，以满足时限要求
      - 收集信息并进行涂黑处理，起草答复供审核
      - 核实请求人的身份和授权
    practitioner: |
      您可以：
      - 处理复杂或敏感的请求，包括涉及第三方的请求
      - 适用豁免条款并决定哪些内容不予提供，给出清晰的理由
      - 管理对答复的内部复核和投诉
    expert: |
      您可以：
      - 制定全组织的信息权利政策和流程
      - 领导对监管机构询问和申诉的回应
      - 向高级负责人报告绩效和趋势
ig-records-retention:
  name: 记录保存与处置
  description: 对纸质和数字记录执行保存期限表，并在适当时间将其归档或安全销毁，同时保留审计线索。
  levels:
    awareness: |
      您可以：
      - 解释为什么记录要保存规定的期限，然后销毁或归档
      - 遵循存放和移动记录的流程
    working: |
      您可以：
      - 对记录执行保存期限表，并标记到期待审核的记录
      - 准备待归档或安全销毁的记录，并保留审计线索
    practitioner: |
      您可以：
      - 运行记录服务的保存与处置计划
      - 就包括数字记录在内的新型记录的保存向团队提供建议
      - 审核保存期限表的遵守情况
    expert: |
      您可以：
      - 制定组织的保存政策和保存期限表
      - 规划数字记录的长期保存
      - 解决复杂的保存问题，例如法律保全和调查
ig-data-protection-impact-assessment:
  name: 数据保护影响评估
  description: 评估新增或变更的个人数据和健康数据处理活动的隐私风险，并在处理开始前商定控制措施。
  levels:
    awareness: |
      您可以：
      - 解释何时需要进行数据保护影响评估
      - 为您的工作填写筛查问卷
    working: |
      您可以：
      - 帮助项目团队完成数据保护影响评估
      - 描述数据流并确定处理的合法依据
      - 记录隐私风险和拟议的控制措施
    practitioner: |
      您可以：
      - 审查复杂系统的数据保护影响评估并提供建议
      - 判断风险是否可以接受并建议控制措施
      - 决定何时将高风险上报给高级人员或监管机构审查
    expert: |
      您可以：
      - 制定组织的数据保护影响评估流程和标准
      - 对大规模数据共享或人工智能等风险最高的处理活动提出最终建议
      - 在法律要求时咨询监管机构
ig-incident-management:
  name: 信息治理事件管理
  description: 记录、调查数据泄露和未遂事件并从中吸取教训，决定何时通知监管机构和受影响的人。
  levels:
    awareness: |
      您可以：
      - 识别数据泄露或未遂事件并立即报告
    working: |
      您可以：
      - 登记事件并收集事实
      - 依据组织的严重程度标准评估事件
      - 跟踪整改措施直至关闭
    practitioner: |
      您可以：
      - 调查严重事件并找出其根本原因
      - 与高级同事一起决定是否通知监管机构和受影响的人
      - 分享经验教训并跟踪改进
    expert: |
      您可以：
      - 制定信息治理的事件管理流程
      - 领导对重大泄露事件的应对，包括与监管机构和媒体沟通
      - 向董事会报告事件趋势和风险
ig-confidentiality-and-sharing:
  name: 保密与信息共享
  description: 保护患者的保密信息，同时确保在照护、安全或法律需要时依法共享，包括通过信息共享协议共享。
  levels:
    awareness: |
      您可以：
      - 妥善保管保密信息，只在获准时共享
      - 在不确定时寻求建议
    working: |
      您可以：
      - 检查共享信息的请求是否符合政策
      - 记录共享了什么、与谁共享以及共享的原因
      - 起草简单的信息共享协议
    practitioner: |
      您可以：
      - 就复杂的保密问题提供建议，例如出于公共利益在未经同意的情况下共享
      - 审查与合作组织签订的信息共享协议
      - 对数据流适用同意和患者反对规则
    expert: |
      您可以：
      - 担任组织在保密方面的高级顾问
      - 解决最困难的披露决定
      - 制定与合作伙伴共享信息的框架
ig-compliance-assurance:
  name: 信息治理保证与审核
  description: 通过年度自评、审核、证据和改进计划，检查并证明组织符合信息治理标准。
  levels:
    awareness: |
      您可以：
      - 解释为什么组织必须证明自己妥善处理信息
      - 在被要求时为审核提供证据
    working: |
      您可以：
      - 为年度自评收集和整理证据
      - 开展访问审核或记录保存审核等简单审核
      - 跟踪改进措施
    practitioner: |
      您可以：
      - 规划并运行信息治理保证计划
      - 判断证据是否符合标准并找出差距
      - 与内部和外部审计人员合作
    expert: |
      您可以：
      - 负责组织的信息治理保证框架
      - 向董事会及其委员会报告保证和合规情况
      - 根据风险确定改进重点
