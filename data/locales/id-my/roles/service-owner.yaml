summary: >
  Pemilik layanan adalah pemimpin yang bertanggung jawab atas perkhidmatan kesihatan digital dari ujung ke ujung, di seluruh bagian digital, operasional, dan kliniknya. Mereka menyatukan tim multidisiplin dan mitra layanan, menetapkan strategi dan prioritas layanan, memiliki anggaran dan kinerjanya, dan memastikan layanan menghasilkan hasil dan manfaat yang aman dan bermutu bagi pesakit, tenaga klinis, dan tenaga perawatan.
health_context:
  - Perkhidmatan kesihatan digital adalah bagian dari layanan perawatan yang lebih luas, sehingga pemilik layanan bekerja setara dengan pimpinan klinis dan operasional dan berbagi tanggung jawab atas seluruh pengalaman pesakit.
  - Pemilik layanan bertanggung jawab agar risiko klinis layanan dikelola, bekerja dengan petugas keselamatan klinis dan menerima risiko sisa pada kadar yang tepat.
  - Layanan menangani informasi kesihatan yang rahasia, sehingga pemilik layanan memastikan tata kelola informasi, pelindungan data, dan keamanan siber tersedia dan ditinjau.
  - Layanan langsung yang mendukung perawatan harus tangguh, sehingga pemilik layanan memastikan kesinambungan bisnis, respons insiden, dan dukungan pemasok memenuhi kebutuhan klinis.
  - Manfaat dalam perawatan harus diukur dan dilaporkan, sehingga pemilik layanan memegang indikator kinerja yang mencakup keselamatan, mutu, akses, kesetaraan, dan biaya.
levels:
  - title: Pemilik layanan
    responsibilities:
      - Bertanggung jawab atas perkhidmatan kesihatan digital ujung ke ujung, seperti akses daring ke rekam atau rujukan digital, sepanjang seluruh siklus hidupnya.
      - Menetapkan strategi dan prioritas layanan bersama pimpinan klinis dan operasional, menyeimbangkan kebutuhan pengguna, keselamatan, kebijakan, dan biaya.
      - Memiliki anggaran layanan dan menyampaikan alasan investasi berdasarkan manfaat bagi pesakit dan staf.
      - Memastikan risiko klinis, tata kelola informasi, aksesibilitas, dan keamanan siber dikelola dan dijamin.
      - Memantau kinerja dan manfaat layanan, dan memimpin perbaikan ketika layanan kurang memenuhi harapan.
      - Mewakili layanan di dewan tata kelola dan di hadapan mitra di seluruh sistem kesihatan dan perawatan.
    qualifications:
      - Pengalaman luas dalam memimpin layanan digital, operasional, atau klinis.
  - title: Pemilik layanan senior
    responsibilities:
      - Bertanggung jawab atas sekelompok perkhidmatan kesihatan digital terkait, atau layanan kritis yang dipakai di seluruh sistem perawatan, seperti rekam pesakit elektronik.
      - Menetapkan strategi multitahun untuk layanan bersama pimpinan eksekutif, klinis, dan operasional.
      - Memiliki anggaran dan hubungan pemasok utama di seluruh layanan.
      - Menerima dan mengeskalasikan risiko klinis, informasi, dan operasional pada kadar senior, bekerja dengan petugas keselamatan klinis dan pemilik eksekutif risiko informasi.
      - Memimpin pemilik layanan dan tim multidisiplin, dan membangun budaya keterbukaan dan perbaikan berkelanjutan.
      - Memimpin tanggapan atas insiden layanan besar yang memengaruhi perawatan pesakit, dan pembelajaran yang menyusul.
    qualifications:
      - Pengalaman luas dalam memimpin layanan besar atau kritis, termasuk anggaran dan pemasoknya.
    job_evaluation_notes: UK GDaD PCF memiliki satu kadar pemilik layanan, pada G7 atau G6. Acuan ini menambahkan kadar senior di Pita 8c untuk layanan yang kritis bagi perawatan di seluruh organisasi, dengan anggaran lintas beberapa layanan (sumber daya keuangan kadar 5) dan keterlibatan rutin dalam insiden serius yang memengaruhi pesakit (upaya emosional kadar 2).
