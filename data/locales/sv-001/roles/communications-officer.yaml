summary: >
  Kommunikationspersonal hjälper organisationen att förklara vad den gör för personal, patienter, allmänheten, partner och media. De skriver och publicerar innehåll, driver intern kommunikation och kampanjer, förvaltar digitala kanaler och sociala medier, hanterar mediefrågor och skyddar organisationens anseende, särskilt under incidenter och avbrott.
health_context:
  - Kommunikation om hälso- och sjukvårdstjänster måste vara korrekt, tydlig och tillgänglig, eftersom patienter kan agera utifrån den.
  - Kampanjer syftar ofta till att förändra beteende, såsom att uppmuntra patienter och vårdpersonal att använda en ny digital tjänst.
  - Tjänsteavbrott, cyberincidenter och dataintrång kräver snabb, noggrann kommunikation med patienter, personal, partner och media.
  - Berättelser om patienter kräver samtycke och måste skydda sekretessen.
levels:
  - title: Kommunikatör
    summary: Skriver och publicerar innehåll för interna och externa kanaler och stödjer kommunikationsteamet med rutinmässigt mediearbete och kampanjarbete.
    responsibilities:
      - Skriva och redigera nyheter, intranätsinnehåll, nyhetsbrev och inlägg i sociala medier.
      - Publicera godkänt innehåll på webbplatsen, intranätet och i sociala medier.
      - Logga mediefrågor och bevaka mediebevakning.
      - Stödja kampanjer och evenemang med innehåll och logistik.
      - Kontrollera innehåll för korrekthet, tillgänglighet och klarspråk.
    qualifications:
      - Erfarenhet av att skriva för olika målgrupper, eller en kvalifikation inom kommunikation eller ett närliggande ämne, eller motsvarande erfarenhet.
  - title: Senior kommunikatör
    summary: Planerar och genomför kommunikation för projekt och tjänster, hanterar rutinmässiga mediefrågor och förvaltar kanaler.
    responsibilities:
      - Planera och genomföra kommunikation för projekt och tjänständringar.
      - Svara på rutinmässiga mediefrågor och utkasta pressmeddelanden och uttalanden.
      - Förvalta innehållsplaner för digitala kanaler och sociala medier och rapportera om resultat.
      - Skriva fallstudier, inklusive patientberättelser, med samtycke.
      - Ge kollegor råd om att skriva tydligt för patienter och allmänheten.
      - Coacha kommunikatörer.
    qualifications:
      - En examen eller kvalifikation inom kommunikation eller ett närliggande ämne, eller motsvarande erfarenhet.
  - title: Ledande kommunikatör
    summary: Leder kommunikationen för ett större program eller område, såsom intern kommunikation eller digitala kanaler, och hanterar känsligt mediearbete.
    responsibilities:
      - Leda kommunikation och dialog för ett större program, såsom ett nytt kliniskt system.
      - Planera och utvärdera kampanjer som uppmuntrar patienter och personal att ta i bruk digitala tjänster.
      - Hantera känsliga mediefrågor och förbereda talespersoner.
      - Planera kommunikation vid incidenter och tjänsteavbrott tillsammans med operativa team.
      - Ge ledare råd om hur man kommunicerar förändring och svåra budskap.
      - Leda kommunikatörer.
    qualifications:
      - En examen eller yrkeskvalifikation inom kommunikation, eller motsvarande erfarenhet.
      - Erfarenhet av att planera och utvärdera kampanjer.
  - title: Kommunikationschef
    summary: Leder kommunikationsteamets arbete och kanaler samt mediehantering och kommunikation vid incidenter.
    responsibilities:
      - Leda kommunikationsteamet, dess arbetsplan och dess budget.
      - Leda reaktivt och proaktivt mediearbete, även under incidenter och dataintrång.
      - Förvalta organisationens kanaler, varumärke och innehållsstandarder.
      - Ge direktörer råd om kommunikations- och anseenderisker.
      - Utvärdera kommunikation och rapportera om dess effekt.
      - Arbeta med partnerorganisationer om gemensam kommunikation.
    qualifications:
      - En yrkeskvalifikation inom kommunikation, eller motsvarande erfarenhet.
      - Betydande erfarenhet av mediekontakter och att leda kommunikation.
    job_evaluation_notes: Känslomässig ansträngning speglar att ibland hantera plågsamt material under incidenter och i patientberättelser.
  - title: Chef för kommunikation
    summary: Leder organisationens kommunikation och dialog, fastställer dess strategi och ger styrelsen råd om anseende.
    responsibilities:
      - Fastställa organisationens strategi för kommunikation och dialog.
      - Leda och utveckla kommunikationsfunktionen och förvalta dess budget.
      - Ge den verkställande direktören och styrelsen råd om anseende, dialog med intressenter och kommunikationsrisk.
      - Leda krisinformation under större incidenter.
      - Bygga relationer med seniora partner, journalister och patientgrupper.
      - Forma hur organisationen förklarar sina digitala tjänster och sin användning av data för allmänheten.
    qualifications:
      - En yrkeskvalifikation inom kommunikation, eller motsvarande erfarenhet.
      - Omfattande erfarenhet av att leda kommunikation för en komplex organisation.
