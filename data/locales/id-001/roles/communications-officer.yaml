summary: >
  Staf komunikasi membantu organisasi menjelaskan apa yang dilakukannya kepada staf, pasien, masyarakat, mitra, dan media. Mereka menulis dan menerbitkan konten, menjalankan komunikasi internal dan kampanye, mengelola saluran digital dan media sosial, menangani pertanyaan media, dan melindungi reputasi organisasi, terutama selama insiden dan gangguan.
health_context:
  - Komunikasi tentang layanan kesehatan harus akurat, jelas, dan dapat diakses, karena pasien dapat bertindak berdasarkan komunikasi itu.
  - Kampanye sering bertujuan mengubah perilaku, seperti mendorong pasien dan tenaga perawatan memakai layanan digital baru.
  - Gangguan layanan, insiden siber, dan pelanggaran data memerlukan komunikasi yang cepat dan cermat dengan pasien, staf, mitra, dan media.
  - Kisah tentang pasien memerlukan persetujuan dan harus melindungi kerahasiaan.
levels:
  - title: Petugas komunikasi
    summary: Menulis dan menerbitkan konten untuk saluran internal dan eksternal serta mendukung tim komunikasi dengan pekerjaan media dan kampanye yang rutin.
    responsibilities:
      - Menulis dan menyunting berita, konten intranet, buletin, dan unggahan media sosial.
      - Menerbitkan konten yang disetujui di situs web, intranet, dan media sosial.
      - Mencatat pertanyaan media dan memantau pemberitaan.
      - Mendukung kampanye dan acara dengan konten dan logistik.
      - Memeriksa konten untuk akurasi, aksesibilitas, dan bahasa yang sederhana.
    qualifications:
      - Pengalaman menulis untuk berbagai khalayak, atau kualifikasi di bidang komunikasi atau bidang terkait, atau pengalaman yang setara.
  - title: Petugas komunikasi senior
    summary: Merencanakan dan menyampaikan komunikasi untuk proyek dan layanan, menangani pertanyaan media rutin, dan mengelola saluran.
    responsibilities:
      - Merencanakan dan menyampaikan komunikasi untuk proyek dan perubahan layanan.
      - Menanggapi pertanyaan media rutin serta menyusun siaran pers dan pernyataan.
      - Mengelola rencana konten untuk saluran digital dan media sosial, dan melaporkan kinerjanya.
      - Menulis studi kasus, termasuk kisah pasien, dengan persetujuan.
      - Menasihati rekan tentang menulis dengan jelas untuk pasien dan masyarakat.
      - Membimbing petugas komunikasi.
    qualifications:
      - Gelar atau kualifikasi di bidang komunikasi atau bidang terkait, atau pengalaman yang setara.
  - title: Pimpinan komunikasi
    summary: Memimpin komunikasi untuk program atau bidang besar, seperti komunikasi internal atau saluran digital, dan menangani pekerjaan media yang sensitif.
    responsibilities:
      - Memimpin komunikasi dan keterlibatan untuk program besar, seperti sistem klinis baru.
      - Merencanakan dan mengevaluasi kampanye yang mendorong pasien dan staf mengadopsi layanan digital.
      - Menangani pertanyaan media yang sensitif dan menyiapkan juru bicara.
      - Merencanakan komunikasi untuk insiden dan gangguan layanan bersama tim operasional.
      - Menasihati pimpinan tentang cara mengomunikasikan perubahan dan pesan yang sulit.
      - Menyelia petugas komunikasi.
    qualifications:
      - Gelar atau kualifikasi profesional di bidang komunikasi, atau pengalaman yang setara.
      - Pengalaman merencanakan dan mengevaluasi kampanye.
  - title: Manajer komunikasi
    summary: Mengelola pekerjaan dan saluran tim komunikasi, dan memimpin penanganan media dan komunikasi untuk insiden.
    responsibilities:
      - Mengelola tim komunikasi, rencana kerja, dan anggarannya.
      - Memimpin pekerjaan media reaktif dan proaktif, termasuk selama insiden dan pelanggaran data.
      - Mengelola saluran, merek, dan standar konten organisasi.
      - Menasihati direktur tentang komunikasi dan risiko reputasi.
      - Mengevaluasi komunikasi dan melaporkan dampaknya.
      - Bekerja dengan organisasi mitra pada komunikasi bersama.
    qualifications:
      - Kualifikasi profesional di bidang komunikasi, atau pengalaman yang setara.
      - Pengalaman yang substansial dalam hubungan media dan mengelola komunikasi.
    job_evaluation_notes: Upaya emosional mencerminkan penanganan sesekali materi yang menyedihkan selama insiden dan dalam kisah pasien.
  - title: Kepala komunikasi
    summary: Memimpin komunikasi dan keterlibatan untuk organisasi, menetapkan strateginya, dan menasihati dewan tentang reputasi.
    responsibilities:
      - Menetapkan strategi komunikasi dan keterlibatan organisasi.
      - Memimpin dan mengembangkan fungsi komunikasi dan mengelola anggarannya.
      - Menasihati kepala eksekutif dan dewan tentang reputasi, keterlibatan pemangku kepentingan, dan risiko komunikasi.
      - Memimpin komunikasi krisis selama insiden besar.
      - Membangun hubungan dengan mitra senior, jurnalis, dan kelompok pasien.
      - Membentuk cara organisasi menjelaskan layanan digital dan penggunaan datanya kepada masyarakat.
    qualifications:
      - Kualifikasi profesional di bidang komunikasi, atau pengalaman yang setara.
      - Pengalaman luas dalam memimpin komunikasi untuk organisasi yang kompleks.
