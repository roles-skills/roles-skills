strings:
  disclaimer: "এটি একটি সাধারণ ডিজিটাল স্বাস্থ্যসেবা প্রতিষ্ঠানের জন্য একটি দৃষ্টান্তমূলক রেফারেন্স প্রোফাইল। এটি কোনো নিয়োগকর্তার আনুষ্ঠানিক পদের বিবরণ নয়, এবং এর পদ মূল্যায়নের পয়েন্ট কোনো আনুষ্ঠানিক মূল্যায়ন নয়।"
  translation_note: "এই লেখাটি একটি কৃত্রিম বুদ্ধিমত্তা সহকারী ইংরেজি থেকে অনুবাদ করেছে, এবং কোনো মাতৃভাষী এখনও এটি পর্যালোচনা করেননি। যুক্তরাজ্য (UK) সরকারের ডিজিটাল ও ডেটা পেশা সক্ষমতা কাঠামো (UK GDaD PCF) এবং ESCO থেকে নেওয়া উদ্ধৃতিগুলো ইংরেজিতেই রাখা হয়েছে।"
  home_title: ভূমিকার সূচি
  home_lede: "প্রথমে আপনার কাজের সবচেয়ে কাছের পরিবারটি খুঁজুন, তারপর ভূমিকা, তারপর ব্যান্ড।"
  roles_title: সব ভূমিকা
