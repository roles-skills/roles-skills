  skills_title: দক্ষতা
  skills_lede: "প্রতিটি দক্ষতার চারটি স্তর রয়েছে: সচেতনতা (1), কার্যকর (2), অনুশীলনকারী (3), এবং বিশেষজ্ঞ (4)। UK GDaD PCF-এর দক্ষতাগুলো মূল ইংরেজি থেকে উদ্ধৃত। অন্য দক্ষতাগুলো এই রেফারেন্সের নিজস্ব।"
