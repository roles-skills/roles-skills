# Job evaluation factors in Bengali. Keys are the English factor ids.
communication:
  name: যোগাযোগ ও সম্পর্ক স্থাপনের দক্ষতা
  description: সহকর্মী, রোগী, জনসাধারণ ও অংশীদারদের সাথে যোগাযোগ এবং সম্পর্ক গড়ে তোলার জন্য প্রয়োজনীয় দক্ষতা। তথ্য কতটা জটিল, সংবেদনশীল বা বিতর্কিত, এবং তা বোঝা বা মেনে নেওয়ার পথে কোনো বাধা আছে কি না, তা বিবেচনা করে।
  levels:
    "1": প্রধানত সহকর্মীদের সাথে মৌখিকভাবে নিয়মিত তথ্য দেন ও নেন।
    "2": সহকর্মী ও অন্যদের সাথে মৌখিক, লিখিত বা ইলেকট্রনিকভাবে নিয়মিত তথ্য দেন ও নেন।
    "3": এমন নিয়মিত তথ্য দেন যার জন্য কৌশল বা প্ররোচনা প্রয়োজন, অথবা জটিল বা সংবেদনশীল তথ্য, অথবা দলকে সরল প্রশিক্ষণ দেন।
    "4": এমন জটিল, সংবেদনশীল বা বিতর্কিত তথ্য দেন যার জন্য প্ররোচনা, আলোচনা বা প্রশিক্ষণের দক্ষতা প্রয়োজন, অথবা অত্যন্ত জটিল তথ্য দেন।
    "5": এমন অত্যন্ত জটিল বা বিতর্কিত তথ্য দেন যার জন্য উন্নত প্ররোচনা ও আলোচনার দক্ষতা প্রয়োজন, বড় দলের সামনে উপস্থাপনা করেন, অথবা গ্রহণযোগ্যতার পথে উল্লেখযোগ্য বাধা থাকলে যোগাযোগ করেন।
    "6": গ্রহণযোগ্যতার পথে উল্লেখযোগ্য বাধা থাকা অবস্থায় অত্যন্ত জটিল ও অত্যন্ত বিতর্কিত তথ্য দেন, সর্বোচ্চ স্তরের যোগাযোগ দক্ষতা ব্যবহার করে।
knowledge:
  name: জ্ঞান, প্রশিক্ষণ ও অভিজ্ঞতা
  description: কাজটি করার জন্য প্রয়োজনীয় জ্ঞান ও অভিজ্ঞতা, যেকোনো উৎস থেকে, যার মধ্যে আনুষ্ঠানিক প্রশিক্ষণ, যোগ্যতা ও অভিজ্ঞতা রয়েছে।
  levels:
    "1": অল্প কিছু নিয়মিত পদ্ধতি, একটি সংক্ষিপ্ত পরিচিতিমূলক সময়ে কাজের মধ্যে শেখা।
    "2": বিভিন্ন নিয়মিত পদ্ধতি, কাজের মধ্যে প্রশিক্ষণ ও পরিচিতির মাধ্যমে শেখা।
    "3": বিভিন্ন পদ্ধতি, যার কিছু অনিয়মিত, যার জন্য প্রাথমিক তাত্ত্বিক জ্ঞান প্রয়োজন (যেমন লেভেল 3 যোগ্যতা বা সমমানের অভিজ্ঞতা)।
    "4": বিভিন্ন পদ্ধতি, যার বেশিরভাগ অনিয়মিত, যার জন্য মধ্যম স্তরের তাত্ত্বিক জ্ঞান প্রয়োজন (যেমন ফাউন্ডেশন ডিগ্রি বা সমমানের অভিজ্ঞতা)।
    "5": একটি বিশেষায়িত ক্ষেত্রে দক্ষতা, যার ভিত্তি তত্ত্ব বা ব্যবহারিক অভিজ্ঞতা (স্নাতক স্তর বা সমমান)।
    "6": বিশেষায়িত ক্ষেত্রের পুরো পরিসরজুড়ে বিশেষায়িত জ্ঞান (স্নাতকোত্তর ডিপ্লোমা স্তর বা সমমান)।
    "7": বিশেষায়িত ক্ষেত্রের পুরো পরিসরজুড়ে অত্যন্ত উন্নত বিশেষায়িত জ্ঞান (স্নাতকোত্তর স্তর বা সমমান)।
    "8": উন্নত জ্ঞান (ডক্টরেট ও অতিরিক্ত প্রশিক্ষণ বা সমমান), অথবা দীর্ঘ সময় ধরে গড়ে ওঠা একাধিক শাখায় বিশেষায়িত জ্ঞান।
analytical:
  name: বিশ্লেষণ ও বিচার-বিবেচনার দক্ষতা
  description: তথ্য প্রক্রিয়াকরণ, সমস্যা সমাধান ও সিদ্ধান্ত নেওয়ার জন্য প্রয়োজনীয় বিশ্লেষণ ও বিচার-বিবেচনা।
  levels:
    "1": সরল তথ্য বা পরিস্থিতি সম্পর্কে বিচার।
    "2": তথ্য বা পরিস্থিতি সম্পর্কে বিচার, যার কিছুতে বিশ্লেষণ প্রয়োজন।
    "3": বিভিন্ন তথ্য বা পরিস্থিতি সম্পর্কে বিচার, যার জন্য বিশ্লেষণ বা বিকল্পগুলোর তুলনা প্রয়োজন।
    "4": জটিল তথ্য বা পরিস্থিতি সম্পর্কে বিচার, যার জন্য বিশ্লেষণ, ব্যাখ্যা ও বিকল্পগুলোর তুলনা প্রয়োজন।
    "5": অত্যন্ত জটিল তথ্য বা পরিস্থিতি সম্পর্কে বিচার, যার জন্য বিশ্লেষণ, ব্যাখ্যা ও বিকল্পগুলোর তুলনা প্রয়োজন।
planning:
  name: পরিকল্পনা ও সংগঠনের দক্ষতা
  description: কার্যক্রম, কর্মসূচি, সেবা বা কৌশল পরিচালনার জন্য প্রয়োজনীয় পরিকল্পনা ও সংগঠন।
  levels:
    "1": নিজের দৈনন্দিন কাজ সংগঠিত করেন।
    "2": সরল কাজ বা কার্যক্রমের পরিকল্পনা করেন, যার কিছু চলমান।
    "3": একাধিক জটিল কার্যক্রমের পরিকল্পনা করেন, প্রয়োজনে পরিকল্পনা সমন্বয় করেন।
    "4": বিস্তৃত পরিসরের জটিল কার্যক্রম বা কৌশলের পরিকল্পনা করেন, প্রয়োজনে সেগুলো সমন্বয় করেন।
    "5": অনিশ্চয়তার মধ্যে এবং পুরো প্রতিষ্ঠানে প্রভাবসহ দীর্ঘমেয়াদি কৌশলগত পরিকল্পনা তৈরি করেন।
physical-skills:
  name: শারীরিক দক্ষতা
  description: প্রয়োজনীয় শারীরিক দক্ষতা, যেমন হাতের নৈপুণ্য, সমন্বয়, কিবোর্ড দক্ষতা ও গাড়ি চালানো।
  levels:
    "1": শারীরিক দক্ষতার সামান্য প্রয়োজন।
    "2": অনুশীলনের মাধ্যমে অর্জিত দক্ষতা, যেমন সাধারণ কিবোর্ড ব্যবহার বা গাড়ি চালানো।
    "3": দ্রুততা বা নির্ভুলতা প্রয়োজন এমন উন্নত দক্ষতা, যেমন উন্নত কিবোর্ড ব্যবহার।
    "4": নিখুঁততা বা দ্রুততা এবং উচ্চ হাত-চোখ সমন্বয় প্রয়োজন এমন অত্যন্ত উন্নত দক্ষতা।
    "5": সর্বোচ্চ স্তরের নিখুঁততা, দ্রুততা ও সমন্বয়।
patient-care:
  name: রোগী ও সেবাগ্রহীতার পরিচর্যার দায়িত্ব
  description: রোগী ও সেবাগ্রহীতাদের মূল্যায়ন, চিকিৎসা, পরিচর্যা বা পরামর্শ দেওয়ার দায়িত্ব। বেশিরভাগ ডিজিটাল ও কর্পোরেট ভূমিকার জন্য এটি কেবল আকস্মিক যোগাযোগ।
  levels:
    "1": আকস্মিক যোগাযোগের সময় রোগী, সেবাগ্রহীতা বা আত্মীয়দের সাহায্য করেন।
    "2": রোগী বা জনসাধারণকে সরাসরি সাধারণ অ-ক্লিনিক্যাল পরামর্শ, তথ্য বা সেবা দেন।
    "3": ব্যক্তিগত পরিচর্যা, প্রাথমিক ক্লিনিক্যাল কারিগরি সেবা বা প্রাথমিক ক্লিনিক্যাল পরামর্শ দেন।
    "4": ক্লিনিক্যাল পরিচর্যা করেন, ক্লিনিক্যাল কারিগরি সেবা দেন বা রোগীদের পরিচর্যা বিষয়ে পরামর্শ দেন।
    "5": পরিচর্যা কর্মসূচি তৈরি করেন, বিশেষায়িত ক্লিনিক্যাল কারিগরি সেবা দেন বা রোগী পরিচর্যা বিষয়ে বিশেষায়িত পরামর্শ দেন।
    "6": বিশেষায়িত পরিচর্যা তৈরি করেন, অত্যন্ত বিশেষায়িত পরামর্শ দেন, বা একটি ক্লিনিক্যাল সেবার অংশের জন্য জবাবদিহি করেন।
    "7": একটি ক্লিনিক্যাল বা পরিচর্যা সেবা প্রদানের জন্য জবাবদিহি করেন।
    "8": ক্লিনিক্যাল বা পরিচর্যা সেবার প্রাতিষ্ঠানিক দায়িত্ব।
policy:
  name: নীতি ও সেবা উন্নয়নের দায়িত্ব
  description: নীতি ও সেবা তৈরি ও বাস্তবায়নের দায়িত্ব, এবং এর প্রভাব কতদূর পৌঁছায়।
  levels:
    "1": অন্যদের তৈরি নীতি অনুসরণ করেন; পরিবর্তন সম্পর্কে মতামত দিতে পারেন।
    "2": নিজের ক্ষেত্রের নীতি বাস্তবায়ন করেন এবং এর চর্চায় পরিবর্তনের প্রস্তাব দেন।
    "3": নিজের ক্ষেত্রের নীতি বাস্তবায়ন করেন এবং অন্য ক্ষেত্রকে প্রভাবিত করে এমন পরিবর্তনের প্রস্তাব দেন।
    "4": নীতি বাস্তবায়ন করেন এবং একটি সেবা বা একাধিক ক্ষেত্রের জন্য নীতি বা সেবা তৈরি করেন।
    "5": একটি পরিদপ্তরের জন্য বিভিন্ন নীতি বা সেবা বাস্তবায়ন ও তৈরি করেন।
    "6": প্রতিষ্ঠানজুড়ে বা তার বাইরে প্রধান নীতি বা সেবা উন্নয়নের প্রাতিষ্ঠানিক দায়িত্ব।
financial-resources:
  name: আর্থিক ও ভৌত সম্পদের দায়িত্ব
  description: অর্থ, বাজেট, সরঞ্জাম, মজুত, ভবন ও অন্যান্য সম্পদের দায়িত্ব।
  levels:
    "1": নিজের কাজে ব্যবহৃত সরঞ্জাম ও সম্পদের ব্যক্তিগত যত্ন নেন।
    "2": নগদ বা মূল্যবান জিনিস সামলান, অন্যদের ব্যবহৃত সরঞ্জামের দেখাশোনা করেন, মজুত নিয়ন্ত্রণ করেন বা ছোট পরিশোধ অনুমোদন করেন।
    "3": পরিশোধ অনুমোদন করেন, কিছু সম্পদ বা সরবরাহ কেনেন, একটি অর্পিত বাজেট পর্যবেক্ষণ বা ধারণ করেন, বা সম্পদ রক্ষণাবেক্ষণ করেন।
    "4": একটি বিভাগ বা সেবার বাজেট ধারণ বা নির্ধারণ করেন, বা তার সম্পদ কেনেন বা রক্ষণাবেক্ষণ করেন।
    "5": একাধিক সেবার বাজেট ধারণ বা নির্ধারণ করেন, বা সম্পদ পরিচালনা করেন।
    "6": প্রতিষ্ঠানের অর্থ বা সম্পদের প্রাতিষ্ঠানিক দায়িত্ব।
people:
  name: জনবলের দায়িত্ব
  description: কর্মীদের পরিচালনা, তত্ত্বাবধান, প্রশিক্ষণ বা উন্নয়নের দায়িত্ব, অথবা মানবসম্পদ সেবা দেওয়ার দায়িত্ব।
  levels:
    "1": নতুন বা কম অভিজ্ঞ সহকর্মীদের নিজের কাজের নিয়ম দেখিয়ে দেন।
    "2": দৈনন্দিন কর্মীদের তত্ত্বাবধান বা সমন্বয় করেন, নিয়মিত অন্যদের প্রশিক্ষণ দেন, বা প্রাথমিক মানবসম্পদ পরামর্শ দেন।
    "3": দৈনন্দিন একদল কর্মী পরিচালনা করেন, মৌলিক বা বিশেষায়িত প্রশিক্ষণ দেন, বা মৌলিক মানবসম্পদ পরামর্শ দেন।
    "4": একটি কার্যক্রম বা বিভাগের সরাসরি ব্যবস্থাপনা করেন, প্রধান দায়িত্ব হিসেবে প্রশিক্ষণ কর্মসূচি ডিজাইন করেন, বা পূর্ণাঙ্গ মানবসম্পদ সেবা দেন।
    "5": একাধিক বিভাগের সরাসরি ব্যবস্থাপনা করেন, বা প্রতিষ্ঠানজুড়ে প্রশিক্ষণ বা মানবসম্পদের বড় অংশ পরিচালনা করেন।
    "6": প্রতিষ্ঠানের জনবল বা মানবসম্পদ কার্যক্রমের প্রাতিষ্ঠানিক দায়িত্ব।
information-resources:
  name: তথ্য সম্পদের দায়িত্ব
  description: কাগজে বা ডিজিটাল, তথ্য ও তথ্য ব্যবস্থার দায়িত্ব, যার মধ্যে রেকর্ড, ডেটা এবং সেগুলো ধারণকারী ব্যবস্থা রয়েছে।
  levels:
    "1": পদধারী নিজে যে তথ্য তৈরি করেন তা রেকর্ড করেন।
    "2": অন্যদের সংকলিত ডেটা এন্ট্রি বা সংরক্ষণ করেন, বা মাঝে মাঝে প্রতিবেদন বা কোয়েরি লেখেন।
    "3": আনুষ্ঠানিক কার্যবিবরণী লেখেন, নিয়মিত প্রতিবেদন বা কোয়েরি লেখেন, বা উল্লেখযোগ্য দায়িত্ব হিসেবে তথ্য ব্যবস্থা রক্ষণাবেক্ষণ করেন।
    "4": অন্যদের নির্দিষ্টকরণ অনুযায়ী তথ্য ব্যবস্থা মানিয়ে নেন বা ডিজাইন করেন, বা প্রধান দায়িত্ব হিসেবে একটি বিভাগের তথ্য ব্যবস্থা পরিচালনা করেন।
    "5": প্রধান তথ্য ব্যবস্থা ডিজাইন ও তৈরি করেন, বা প্রধান দায়িত্ব হিসেবে একাধিক সেবার তথ্য ব্যবস্থা পরিচালনা করেন।
    "6": প্রধান দায়িত্ব হিসেবে প্রতিষ্ঠানজুড়ে তথ্য ব্যবস্থা পরিচালনা ও উন্নয়ন করেন।
    "7": প্রতিষ্ঠানের তথ্য ব্যবস্থার প্রাতিষ্ঠানিক দায়িত্ব।
research:
  name: গবেষণা ও উন্নয়নের দায়িত্ব
  description: আনুষ্ঠানিক গবেষণা, উন্নয়ন, মূল্যায়ন, নিরীক্ষা, পরীক্ষা ও ট্রায়ালের দায়িত্ব।
  levels:
    "1": নিজের কাজের জন্য জরিপ বা নিরীক্ষা করেন; মাঝে মাঝে গবেষণা বা পরীক্ষায় অংশ নেন।
    "2": কাজের অংশ হিসেবে নিয়মিত গবেষণা, উন্নয়ন, ট্রায়াল, বা সরঞ্জাম ও ব্যবস্থার পরীক্ষা করেন।
    "3": প্রধান দায়িত্ব হিসেবে আনুষ্ঠানিক কর্মসূচির মধ্যে গবেষণা বা উন্নয়ন করেন।
    "4": গবেষণা ও উন্নয়ন কর্মসূচি সমন্বয় ও পরিচালনা করেন।
    "5": প্রতিষ্ঠানের লক্ষ্য সমর্থন করে এমন গবেষণা ও উন্নয়ন কর্মসূচি শুরু ও তৈরি করেন।
    "6": প্রতিষ্ঠানের বাইরে প্রভাবসহ গবেষণা ও উন্নয়ন কর্মসূচি শুরু ও তৈরি করেন।
freedom-to-act:
  name: কাজের স্বাধীনতা
  description: পদধারী কী করবেন ও কীভাবে করবেন তা কতটা নিজে ঠিক করেন, এবং তাঁর কাজ কতটা নিবিড়ভাবে তত্ত্বাবধান করা হয়।
  levels:
    "1": নির্ধারিত পদ্ধতির মধ্যে কাজ করেন, কাছাকাছি তত্ত্বাবধানসহ।
    "2": প্রচলিত পদ্ধতি ও নজির অনুসরণ করেন; সাধারণত জিজ্ঞাসা করার মতো কেউ থাকেন; কাজ যাচাই হতে পারে।
    "3": নির্ধারিত নীতি ও পদ্ধতি অনুসরণ করেন; কাজ তত্ত্বাবধানের বদলে পরিচালিত হয়।
    "4": ফলাফল নির্ধারিত, কিন্তু বিস্তৃত নীতির মধ্যে তা কীভাবে অর্জন করবেন পদধারী নিজে ঠিক করেন।
    "5": সাধারণ নীতির মধ্যে কাজ করেন, এবং বেশিরভাগ ক্ষেত্রে সেগুলোর ব্যাখ্যা নিজে ঠিক করেন।
    "6": লক্ষ্য ও মানদণ্ড নির্ধারণের জন্য সামগ্রিক নীতি ও কৌশলের ব্যাখ্যা করেন।
physical-effort:
  name: শারীরিক পরিশ্রম
  description: প্রয়োজনীয় শারীরিক পরিশ্রম, এর পুনরাবৃত্তি, সময়কাল ও তীব্রতা বিবেচনা করে।
  levels:
    "1": বসা, দাঁড়ানো ও হাঁটা, সামান্য শারীরিক পরিশ্রমসহ।
    "2": সীমিত ভঙ্গিতে প্রায়ই বসা বা দাঁড়ানো, বা মাঝে মাঝে হালকা থেকে মাঝারি পরিশ্রম।
    "3": দীর্ঘ সময় ধরে প্রায়ই হালকা পরিশ্রম, বা স্বল্প সময়ের জন্য প্রায়ই মাঝারি পরিশ্রম।
    "4": চলমান হালকা পরিশ্রম, দীর্ঘ সময় ধরে প্রায়ই মাঝারি পরিশ্রম, বা মাঝে মাঝে তীব্র পরিশ্রম।
    "5": চলমান মাঝারি পরিশ্রম, বা প্রায়ই তীব্র পরিশ্রম।
mental-effort:
  name: মানসিক পরিশ্রম
  description: প্রয়োজনীয় মনোযোগ, এর পুনরাবৃত্তি, সময়কাল এবং কাজ কতটা অনুমেয় তা বিবেচনা করে।
  levels:
    "1": সাধারণ মনোযোগ; অনুমেয় কাজে মাঝে মাঝে একাগ্রতা।
    "2": অনুমেয় কাজে প্রায়ই একাগ্রতা, বা অননুমেয় কাজে মাঝে মাঝে একাগ্রতা।
    "3": অননুমেয় কাজে প্রায়ই একাগ্রতা, বা মাঝে মাঝে দীর্ঘ একাগ্রতা।
    "4": প্রায়ই দীর্ঘ একাগ্রতা, বা মাঝে মাঝে তীব্র একাগ্রতা।
    "5": প্রায়ই তীব্র একাগ্রতা।
emotional-effort:
  name: মানসিক চাপ
  description: কাজের আবেগজনিত চাহিদা, কষ্টদায়ক পরিস্থিতির প্রত্যক্ষ বা পরোক্ষ সংস্পর্শ থেকে, যেমন কষ্টদায়ক কেস রেকর্ড পড়া বা গুরুতর ঘটনা সামলানো।
  levels:
    "1": কষ্টদায়ক পরিস্থিতির বিরল সংস্পর্শ, বা মাঝে মাঝে পরোক্ষ সংস্পর্শ।
    "2": কষ্টদায়ক পরিস্থিতির মাঝে মাঝে সংস্পর্শ, বা প্রায়ই পরোক্ষ সংস্পর্শ।
    "3": কষ্টদায়ক পরিস্থিতির প্রায়ই সংস্পর্শ, বা মাঝে মাঝে অত্যন্ত কষ্টদায়ক পরিস্থিতির সংস্পর্শ।
    "4": মাঝে মাঝে মর্মান্তিক পরিস্থিতির সংস্পর্শ, বা প্রায়ই অত্যন্ত কষ্টদায়ক পরিস্থিতির সংস্পর্শ।
working-conditions:
  name: কাজের পরিবেশ
  description: অপ্রীতিকর পরিস্থিতি বা বিপদের সংস্পর্শ। বেশিরভাগ দিন প্রায় অবিরাম স্ক্রিন ব্যবহার লেভেল 2 হিসেবে গণ্য হয়।
  levels:
    "1": অপ্রীতিকর পরিস্থিতির বিরল সংস্পর্শ।
    "2": মাঝে মাঝে অপ্রীতিকর পরিস্থিতি, প্রায়ই ভ্রমণ বা বাইরে কাজ, বা বেশিরভাগ দিন প্রায় অবিরাম স্ক্রিন ব্যবহার।
    "3": প্রায়ই অপ্রীতিকর পরিস্থিতি, বা মাঝে মাঝে অত্যন্ত অপ্রীতিকর পরিস্থিতি।
    "4": কিছু বিপদের সংস্পর্শ, বা প্রায়ই অত্যন্ত অপ্রীতিকর পরিস্থিতি।
    "5": উল্লেখযোগ্য বিপদের সংস্পর্শ।
