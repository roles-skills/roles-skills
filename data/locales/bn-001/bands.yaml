# Band outlines in Bengali. Keys are the English band ids.
"1":
  title: ব্যান্ড 1
  stage: প্রবেশ
  knowledge: প্রাথমিক পড়া, লেখা ও গণনার দক্ষতা; কাজের মধ্যে সহজ নিয়মিত কাজ শেখেন।
  autonomy: স্পষ্ট নির্দেশনা অনুসরণ করেন; কাজ প্রায়ই যাচাই করা হয়।
  scope: নিজের নিয়মিত কাজ।
  leadership: নেই।
  accountability: নিয়মিত কাজ নির্ভুলভাবে সম্পন্ন করা।
"2":
  title: ব্যান্ড 2
  stage: সহায়তা
  knowledge: কাজের ক্ষেত্রের নিয়মিত কাজ ও পদ্ধতি জানেন; একটি প্রারম্ভিক যোগ্যতা থাকতে পারে।
  autonomy: নির্ধারিত পদ্ধতি অনুযায়ী কাজ করেন, তত্ত্বাবধান পাওয়া যায়।
  scope: একটি দলের মধ্যে নিজের কাজ।
  leadership: নতুন কর্মীদের নিয়মিত কাজ দেখিয়ে দিতে পারেন।
  accountability: নিজের নিয়মিত কাজের মান ও সময়মতো সম্পন্ন করা।
"3":
  title: ব্যান্ড 3
  stage: সহায়তা
  knowledge: বিভিন্ন পদ্ধতির জ্ঞান, যার কিছু অনিয়মিত; সাধারণত লেভেল 3 যোগ্যতা বা সমমানের অভিজ্ঞতা।
  autonomy: পদ্ধতির মধ্যে কাজ করেন; নিজের কাজ কীভাবে সাজাবেন তা ঠিক করেন; সমস্যা ঊর্ধ্বতনকে জানান।
  scope: নিজের কাজ এবং বৃহত্তর দলের জন্য কিছু কাজ।
  leadership: নিয়মিত কাজ বণ্টন করতে বা অন্যদের পদ্ধতি শেখাতে পারেন।
  accountability: নিজের কাজের এবং রাখা রেকর্ডের নির্ভুলতা।
"4":
  title: ব্যান্ড 4
  stage: সহায়তা ও প্রারম্ভিক অনুশীলনকারী
  knowledge: কাজের ক্ষেত্রের বিস্তারিত জ্ঞান, সাধারণত ফাউন্ডেশন ডিগ্রি, শিক্ষানবিশি বা সমমানের অভিজ্ঞতা থেকে।
  autonomy: নির্দেশিকার মধ্যে কাজ করেন; বেশিরভাগ দৈনন্দিন সমস্যা সমাধান করেন; পরামর্শের জন্য ব্যবস্থাপক থাকেন।
  scope: নিজের কাজ এবং একটি নির্দিষ্ট সেবা বা প্রক্রিয়া।
  leadership: একটি ছোট দল তত্ত্বাবধান করতে বা অন্যদের কাজ সমন্বয় করতে পারেন।
  accountability: একটি নির্দিষ্ট সেবা বা প্রক্রিয়া প্রদান।
"5":
  title: ব্যান্ড 5
  stage: অনুশীলনকারী
  knowledge: পেশাগত বা কারিগরি জ্ঞান, সাধারণত স্নাতক ডিগ্রি বা সমমানের অভিজ্ঞতা থেকে।
  autonomy: পেশাগত মানদণ্ডের মধ্যে বিস্তৃত লক্ষ্য অনুযায়ী কাজ করেন; নিজের কাজের পরিকল্পনা করেন।
  scope: একটি দল বা প্রোডাক্টের মধ্যে নিজের পেশাগত কাজ।
  leadership: সহায়তাকারী কর্মী ও শিক্ষানবিশদের কাজ নির্দেশনা ও যাচাই করতে পারেন।
  accountability: নিজের পেশাগত কাজের মান।
"6":
  title: ব্যান্ড 6
  stage: অভিজ্ঞ অনুশীলনকারী
  knowledge: বিভিন্ন পদ্ধতিতে বিশেষায়িত জ্ঞান, যা অতিরিক্ত প্রশিক্ষণ বা অভিজ্ঞতার মাধ্যমে গড়ে উঠেছে।
  autonomy: স্বাধীনভাবে কাজ করেন; নিজের ক্ষেত্রের জন্য নীতির ব্যাখ্যা করেন; জটিল বিষয়ে পরামর্শ নেন।
  scope: একটি প্রোডাক্ট, সেবা বা কাজের ধারা।
  leadership: একটি ছোট দলের নেতৃত্ব দিতে বা সহকর্মীদের পরামর্শদাতা হতে পারেন।
  accountability: নিজের কাজের ধারার ফলাফল এবং প্রদত্ত পরামর্শের মান।
"7":
  title: ব্যান্ড 7
  stage: সিনিয়র বা বিশেষজ্ঞ
  knowledge: অত্যন্ত উন্নত বিশেষায়িত জ্ঞান, সাধারণত স্নাতকোত্তর স্তরের বা সমমানের অভিজ্ঞতা।
  autonomy: প্রতিষ্ঠানের নীতি অনুযায়ী কাজ করেন; ফলাফল কীভাবে অর্জিত হবে তা ঠিক করেন; অন্যরা যাঁর পরামর্শ নেন সেই বিশেষজ্ঞ।
  scope: একাধিক প্রোডাক্ট বা সেবা, অথবা একটি বিশেষায়িত কার্যক্রম।
  leadership: একটি দল বা একটি পেশাগত অনুশীলন ক্ষেত্রের নেতৃত্ব দেন।
  accountability: একটি সেবা বা বিশেষায়িত কার্যক্রম প্রদান, এবং বাজেট থাকলে তার দায়িত্ব।
8a:
  title: ব্যান্ড 8a
  stage: লিড
  knowledge: একটি শাখা ও তার ব্যবস্থাপনায় বিশেষজ্ঞ জ্ঞান।
  autonomy: একটি সেবার জন্য প্রতিষ্ঠানের নীতির ব্যাখ্যা করেন; দলের দিকনির্দেশনা ঠিক করেন।
  scope: একটি সেবা ক্ষেত্র বা পুরো প্রতিষ্ঠানে একটি শাখা।
  leadership: একটি দল পরিচালনা করেন, অথবা সরাসরি ব্যবস্থাপনা ছাড়াই একটি শাখার নেতৃত্ব দেন।
  accountability: একটি সেবা ক্ষেত্র, তার কর্মী ও বাজেট।
8b:
  title: ব্যান্ড 8b
  stage: লিড
  knowledge: একাধিক শাখা বা একটি বড় সেবায় বিশেষজ্ঞ জ্ঞান।
  autonomy: একটি বড় ক্ষেত্রের নীতি ও কৌশল গঠন করেন।
  scope: একাধিক সেবা বা দল, অথবা প্রিন্সিপাল স্তরের একটি শাখা।
  leadership: ব্যবস্থাপকদের পরিচালনা করেন, অথবা একটি শাখার প্রধান কর্তৃপক্ষ।
  accountability: একাধিক সেবা, তাদের কর্মী ও বাজেট।
8c:
  title: ব্যান্ড 8c
  stage: সিনিয়র লিড
  knowledge: বিশেষজ্ঞ জ্ঞান, এবং প্রতিষ্ঠান ও খাত সম্পর্কে বিস্তৃত ধারণা।
  autonomy: একটি কার্যক্রমের কৌশল ঠিক করেন; একজন পরিচালকের কাছে জবাবদিহি করেন।
  scope: একটি কার্যক্রম বা বিভাগ।
  leadership: একাধিক ব্যবস্থাপনা স্তরের মাধ্যমে একটি কার্যক্রমের নেতৃত্ব দেন।
  accountability: একটি কার্যক্রমের কর্মদক্ষতা, জনবল ও বাজেট।
8d:
  title: ব্যান্ড 8d
  stage: সিনিয়র লিড
  knowledge: বিভিন্ন কার্যক্রম এবং বৃহত্তর স্বাস্থ্য ও পরিচর্যা ব্যবস্থাজুড়ে কৌশলগত জ্ঞান।
  autonomy: প্রতিষ্ঠানব্যাপী কৌশল গঠন করেন; একজন পরিচালকের প্রতিনিধি হিসেবে কাজ করেন।
  scope: একটি প্রধান কার্যক্রম বা একাধিক কার্যক্রম।
  leadership: একাধিক কার্যক্রম বা একটি বড় বিভাগের নেতৃত্ব দেন।
  accountability: প্রধান কার্যক্রম, বড় বাজেট এবং প্রতিষ্ঠানব্যাপী ঝুঁকি।
"9":
  title: ব্যান্ড 9
  stage: পেশার প্রধান বা পরিচালক
  knowledge: কৌশলগত দক্ষতা এবং ব্যবস্থাব্যাপী নেতৃত্ব।
  autonomy: নির্বাহী দলের সাথে প্রতিষ্ঠানের কৌশল ঠিক করেন।
  scope: প্রতিষ্ঠান, এবং ব্যবস্থাজুড়ে তার অংশীদাররা।
  leadership: একটি পেশা বা পরিদপ্তরের নেতৃত্ব দেন।
  accountability: প্রতিষ্ঠানব্যাপী ফলাফল, বাজেট ও ঝুঁকি।
