summary: >
  অ্যানালিটিক্স ইঞ্জিনিয়াররা কাঁচা স্বাস্থ্য ও পরিচর্যা ডেটাকে পরিষ্কার, পরীক্ষিত ও নথিভুক্ত ডেটা মডেলে রূপান্তর করেন যার ওপর অ্যানালিস্ট, ডেটা সায়েন্টিস্ট ও প্রতিবেদন টুল নির্ভর করতে পারে। তাঁরা ডেটা প্রকৌশল ও বিশ্লেষণের মাঝখানে থাকেন, এবং প্রতিষ্ঠানের প্রতিবেদন ও ড্যাশবোর্ডের পেছনের রূপান্তরে সংস্করণ নিয়ন্ত্রণ, পরীক্ষা ও কোড পর্যালোচনার মতো সফটওয়্যার প্রকৌশলের চর্চা প্রয়োগ করেন।
health_context:
  - ডেটা মডেল ক্লিনিক্যাল ও পরিচালন সংজ্ঞা ধারণ করে, যেমন কী ভর্তি, পুনর্ভর্তি বা অপেক্ষার সময়ের মানদণ্ড লঙ্ঘন হিসেবে গণ্য, তাই সংজ্ঞাগুলো ক্লিনিক্যাল ও পরিচালন নেতাদের সাথে একমত হয়ে ঠিক করা হয়।
  - SNOMED CT ও ICD-এর মতো পরিভাষা ও শ্রেণিবিন্যাসের ক্লিনিক্যাল কোড বিশ্লেষণের জন্য রেফারেন্স সেটে গোষ্ঠীবদ্ধ করা হয়, যার সাবধানী সংস্করণ নিয়ন্ত্রণ দরকার।
  - কর্মদক্ষতা ও অর্থায়ন প্রতিবেদনে ব্যবহৃত মডেল সামঞ্জস্যপূর্ণ ও নিরীক্ষাযোগ্য হতে হবে, কারণ ভুল রোগী সেবা নিয়ে সিদ্ধান্তকে প্রভাবিত করতে পারে।
  - মডেলে প্রায়ই ছদ্মনামকৃত রোগী-স্তরের ডেটা থাকে, তাই প্রবেশাধিকার, নথিভুক্তি ও ডেটা ন্যূনতমকরণ শুরু থেকেই যুক্ত থাকে।
levels:
  - title: ট্রেইনি অ্যানালিটিক্স ইঞ্জিনিয়ার
    responsibilities:
      - প্রশিক্ষণ ও জোড়ায় কাজের মাধ্যমে দলের ডেটা মডেলিং টুল ও চর্চা শেখা।
      - তত্ত্বাবধানে ডেটা মডেলে ছোট, সুনির্দিষ্ট পরিবর্তন করা।
      - ডেটা ক্যাটালগে ডেটা আইটেম ও এর সংজ্ঞা নথিভুক্ত করা।
      - ডেটা ব্যবহারকারীদের সরল প্রশ্নের উত্তর দেওয়া এবং তাঁদের প্রয়োজনীয়তা রেকর্ড করা।
      - রোগী ডেটা নিয়ে কাজের সময় তথ্য সুশাসনের নিয়ম অনুসরণ করা।
    qualifications:
      - ডেটা শিক্ষানবিশি বা সমমানের কর্মসূচিতে ভর্তি, অথবা তার দিকে কাজ করছেন।
    job_evaluation_notes: কাজটি করার মতো প্রশিক্ষণ যথেষ্ট সম্পন্ন হলে পদের প্রয়োজনীয় স্তরে জ্ঞান স্কোর করা হয়।
  - title: অ্যানালিটিক্স ইঞ্জিনিয়ার
    responsibilities:
      - সম্মত ডিজাইন থেকে ভর্তি রোগীর কার্যক্রম বা কমিউনিটি পরিচর্যার মতো একটি সেবা ক্ষেত্রের ডেটা মডেল তৈরি ও পরীক্ষা করা।
      - সম্মত ক্লিনিক্যাল ও পরিচালন সংজ্ঞার বিপরীতে ডেটা মডেল যাচাই করে এমন স্বয়ংক্রিয় পরীক্ষা লেখা।
      - বিশ্লেষণে ব্যবহৃত ক্লিনিক্যাল কোডের রেফারেন্স সেট স্পষ্ট সংস্করণসহ রক্ষণাবেক্ষণ করা।
      - মডেল নথিভুক্ত করা যাতে অ্যানালিস্টরা এর অর্থ, উৎস ও সীমাবদ্ধতা বোঝেন।
      - দলের ডেটা সেটের ব্যবহারকারীদের প্রশিক্ষণ ও সহায়তা দেওয়া।
    qualifications:
      - গাণিতিক বা কম্পিউটিং বিষয়ে ডিগ্রি, বা সমমানের অভিজ্ঞতা।
      - ডেটা মডেল বা বিশ্লেষণী কোড তৈরির অভিজ্ঞতা।
  - title: সিনিয়র অ্যানালিটিক্স ইঞ্জিনিয়ার
    responsibilities:
      - একাধিক সেবা ক্ষেত্রজুড়ে ডেটা মডেলের ডিজাইন ও পরীক্ষা তত্ত্বাবধান করা।
      - ক্লিনিক্যাল, পরিচালন ও অর্থ নেতাদের সাথে মূল পরিমাপের সংজ্ঞায় একমত হওয়া, এবং মডেলগুলো তা সামঞ্জস্যপূর্ণভাবে প্রয়োগ করে তা নিশ্চিত করা।
      - কর্মদক্ষতা ও অর্থায়ন প্রতিবেদনে যুক্ত মডেলগুলো নিরীক্ষাযোগ্য ও সুপরীক্ষিত তা নিশ্চিত করা।
      - ডেটা ইঞ্জিনিয়ার ও ডেটা মালিকদের সাথে ডেটার সমস্যা ও ঝুঁকির সমাধান করা।
      - অন্য অ্যানালিটিক্স ইঞ্জিনিয়ারদের কাজ কোচিং ও নির্দেশনা দেওয়া।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে ডেটা মডেলিং ও অ্যানালিটিক্স প্রকৌশলের উল্লেখযোগ্য অভিজ্ঞতা।
  - title: লিড অ্যানালিটিক্স ইঞ্জিনিয়ার
    responsibilities:
      - প্রতিষ্ঠানের বিশ্লেষণী ডেটা মডেল ডিজাইন, তৈরি ও রক্ষণাবেক্ষণকারী দলের নেতৃত্ব দেওয়া।
      - ডেটা মডেল, পরীক্ষা, নথিভুক্তি ও পরিমাপের সংজ্ঞার মানদণ্ড নির্ধারণ করা।
      - ক্লিনিক্যাল ও পরিচালন প্রক্রিয়া কীভাবে ডেটা তৈরি করে তা বুঝতে প্রতিষ্ঠানের দলগুলোর সাথে কাজ করা।
      - অন্য অ্যানালিটিক্স ইঞ্জিনিয়ারদের কাজ পর্যালোচনা করা এবং দলের কাজের ধরন উন্নত করা।
      - অ্যানালিটিক্স ইঞ্জিনিয়ারদের সরাসরি ব্যবস্থাপনা করা।
    qualifications:
      - অ্যানালিটিক্স প্রকৌশল বা ডেটা মডেলিংয়ের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
  - title: অ্যানালিটিক্স ইঞ্জিনিয়ারিং প্রধান
    responsibilities:
      - প্রতিষ্ঠানের বিশ্লেষণী ডেটা মডেলের দিকনির্দেশনা ঠিক করা, যাতে প্রতিষ্ঠানজুড়ে বিশ্লেষণ একটি বিশ্বস্ত সংজ্ঞার সেট ব্যবহার করে।
      - অ্যানালিটিক্স প্রকৌশলের অগ্রাধিকার প্রতিষ্ঠানের কৌশল ও প্রতিবেদনের দায়িত্বে সহায়তা করে তা নিশ্চিত করা।
      - বড় প্রতিবেদন ও সিদ্ধান্তের পেছনের ডেটার বিশ্বাসযোগ্যতা নিয়ে জ্যেষ্ঠ নেতাদের পরামর্শ দেওয়া।
      - সম্প্রদায়ের প্রয়োজনীয় টুল ও প্ল্যাটফর্ম আছে তা নিশ্চিত করা, এবং সংশ্লিষ্ট বাজেট পরিচালনা করা।
      - কারিগরি নেতৃত্ব ও কর্মজীবন উন্নয়নের মাধ্যমে অ্যানালিটিক্স প্রকৌশল সক্ষমতা গড়ে তোলা।
    qualifications:
      - প্রতিষ্ঠানজুড়ে অ্যানালিটিক্স প্রকৌশলের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
