summary: >
  ডিজিটাল পোর্টফোলিও ম্যানেজাররা প্রতিষ্ঠানকে তার ডিজিটাল প্রজেক্ট, কর্মসূচি ও প্রোডাক্টের পোর্টফোলিও বেছে নিতে, অনুসরণ করতে ও সুশাসন করতে সাহায্য করেন, যাতে এটি রোগী, চিকিৎসক ও পরিচর্যাকর্মীদের জন্য সবচেয়ে বেশি উপকারী কাজে বিনিয়োগ করে। তাঁরা পোর্টফোলিও সুশাসন ও প্রতিবেদন পরিচালনা করেন, ভালো প্রমাণসহ অগ্রাধিকার ঠিক করতে নেতাদের সাহায্য করেন, এবং পোর্টফোলিও প্রতিশ্রুত সুফল দেয় তা নিশ্চিত করেন।
health_context:
  - ডিজিটাল কাজ অর্থায়নের জন্য সম্মুখসারির পরিচর্যার সাথে প্রতিযোগিতা করে, তাই পোর্টফোলিও ম্যানেজাররা রোগী ও কর্মীদের জন্য ডিজিটাল বিনিয়োগের সুফল দেখাতে নেতাদের সাহায্য করেন।
  - পোর্টফোলিও সুশাসনে ক্লিনিক্যাল নিরাপত্তা, তথ্য সুশাসন ও সাইবার নিরাপত্তার নিশ্চয়তা থাকতে হবে, তাই পোর্টফোলিও ম্যানেজাররা সময়, ব্যয় ও পরিসরের পাশাপাশি এগুলো অনুসরণ করেন।
  - অনেক ডিজিটাল প্রজেক্ট ক্লিনিক্যাল ও পরিচালন দলের সক্ষমতার ওপর নির্ভর করে, যেমন পরীক্ষার জন্য চিকিৎসক বা প্রশিক্ষণের জন্য কর্মী, তাই পোর্টফোলিও ম্যানেজাররা সেবার ওপর চাহিদার সংঘাতে নজর রাখেন।
  - অর্থায়ন প্রায়ই একাধিক উৎস থেকে আসে যাদের নিজস্ব প্রতিবেদনের নিয়ম ও সময়সীমা আছে, তাই পোর্টফোলিও ম্যানেজাররা প্রতিবেদন নির্ভুল ও সময়মতো রাখেন।
levels:
  - title: ডিজিটাল পোর্টফোলিও অ্যানালিস্ট
    responsibilities:
      - পোর্টফোলিওজুড়ে প্রজেক্টগুলো থেকে অবস্থা, ঝুঁকি, অর্থ ও সুফলের ডেটা সংগ্রহ ও যাচাই করা।
      - পোর্টফোলিও রেজিস্টার ও ড্যাশবোর্ড রক্ষণাবেক্ষণ করা, এবং প্রতিবেদনে ঘাটতি বা অসামঞ্জস্য শনাক্ত করা।
      - পোর্টফোলিও সুশাসন বোর্ডের জন্য কাগজপত্র ও প্রতিবেদন প্রস্তুত করা।
      - প্রজেক্টগুলোজুড়ে ক্লিনিক্যাল নিরাপত্তা অনুমোদন ও ডেটা সুরক্ষা প্রভাব মূল্যায়নের মতো নিশ্চয়তার মাইলফলক অনুসরণ করা।
      - অগ্রাধিকার নির্ধারণ ও পরিকল্পনা বিশ্লেষণে পোর্টফোলিও ম্যানেজারদের সহায়তা করা।
    qualifications:
      - ডিগ্রি বা প্রাসঙ্গিক যোগ্যতা, বা বিশ্লেষণ বা প্রতিবেদনে সমমানের অভিজ্ঞতা।
    job_evaluation_notes: UK GDaD PCF অ্যানালিস্ট ও ম্যানেজার দুই স্তরকেই HEO বা SEO-তে রাখে। এই রেফারেন্স অ্যানালিস্টকে ব্যান্ড 5-এ রাখে, কারণ এটি একজন পোর্টফোলিও ম্যানেজারের অধীনে শেখার স্তর, এবং ম্যানেজারকে ব্যান্ড 6-এ, যাতে দুটি স্তর একই ব্যান্ডে না থাকে।
  - title: ডিজিটাল পোর্টফোলিও ম্যানেজার
    responsibilities:
      - একটি পরিদপ্তরের সব ডিজিটাল কাজের মতো ডিজিটাল প্রজেক্ট ও কর্মসূচির একটি পোর্টফোলিও সমন্বয় করা।
      - সুশাসন, নিশ্চয়তা ও বাস্তবায়ন প্রক্রিয়া অনুসরণে দলগুলোকে সাহায্য করা, এবং সেগুলোকে আনুপাতিক রাখা।
      - প্রয়োজন, সুফল, ঝুঁকি ও সক্ষমতার প্রমাণ ব্যবহার করে কাজের অগ্রাধিকার ঠিক করতে নেতাদের সহায়তা করা।
      - পোর্টফোলিওর কর্মদক্ষতা, ঝুঁকি ও সুফল বোর্ড ও অংশীজনদের কাছে স্পষ্টভাবে প্রতিবেদন করা।
      - প্রজেক্টগুলোজুড়ে ক্লিনিক্যাল ও পরিচালন দলের ওপর চাহিদার সংঘাত শনাক্ত করা এবং সমাধানে সাহায্য করা।
    qualifications:
      - পোর্টফোলিও, কর্মসূচি বা প্রজেক্ট ব্যবস্থাপনার অভিজ্ঞতা, বা সমমানের অভিজ্ঞতা।
  - title: সিনিয়র ডিজিটাল পোর্টফোলিও ম্যানেজার
    responsibilities:
      - প্রতিষ্ঠানের ডিজিটাল পোর্টফোলিও, বা এর একটি বড় অংশ, এবং এর সুশাসন ও নিশ্চয়তা প্রক্রিয়া পরিচালনা করা।
      - পোর্টফোলিওজুড়ে ফলাফল ও সুফল অনুসরণ ও বিশ্লেষণ করা, এবং দলগুলোকে বাস্তবায়নে সাহায্য করতে সমস্যার ওপর পদক্ষেপ নেওয়া।
      - ক্লিনিক্যাল নিরাপত্তা, তথ্য সুশাসন ও সাইবার নিরাপত্তার নিশ্চয়তাসহ পোর্টফোলিও মানদণ্ড পূরণ করে তা নিশ্চিত করা।
      - স্পষ্ট প্রমাণ ব্যবহার করে অগ্রাধিকার, বিনিয়োগ ও বিনিময় নিয়ে জ্যেষ্ঠ নেতাদের পরামর্শ দেওয়া।
      - অর্থদাতা ও বাহ্যিক সংস্থার কাছে পোর্টফোলিও প্রতিবেদন পরিচালনা করা।
      - পোর্টফোলিও অ্যানালিস্ট ও ম্যানেজারদের সরাসরি ব্যবস্থাপনা করা।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে পোর্টফোলিও বা কর্মসূচি ব্যবস্থাপনার ব্যাপক অভিজ্ঞতা।
    job_evaluation_notes: কোনো ব্যান্ড 7 স্তর নেই, কারণ UK GDaD PCF ডিজিটাল পোর্টফোলিও ম্যানেজার (HEO/SEO) থেকে সরাসরি সিনিয়র ডিজিটাল পোর্টফোলিও ম্যানেজারে (G7) যায়।
  - title: ডিজিটাল পোর্টফোলিও প্রধান
    responsibilities:
      - ডিজিটাল পোর্টফোলিও কার্যক্রম ও পোর্টফোলিও ম্যানেজারদের দলের নেতৃত্ব দেওয়া।
      - পোর্টফোলিওর কৌশল, নিয়ন্ত্রণ ও সুশাসন নির্ধারণ করা, এবং সেগুলো ব্যবহৃত হয় তা নিশ্চিত করা।
      - নির্বাহী নেতাদের পোর্টফোলিওর ভবিষ্যৎ সম্পর্কে অন্তর্দৃষ্টি দেওয়া, যাতে তাঁরা বিনিয়োগের সিদ্ধান্ত নিতে পারেন।
      - রোগী, কর্মী ও প্রতিষ্ঠানের জন্য পোর্টফোলিওর সুফল অর্জিত ও প্রতিবেদিত তা নিশ্চিত করা।
      - পোর্টফোলিও-স্তরের ঝুঁকি মোকাবিলা করা এবং সমস্যা নির্বাহী দলের কাছে পাঠানো।
      - কার্যক্রমের বাজেট ও সক্ষমতা পরিচালনা করা।
    qualifications:
      - একটি জটিল প্রতিষ্ঠানে পোর্টফোলিও ব্যবস্থাপনার নেতৃত্বে ব্যাপক অভিজ্ঞতা।
    job_evaluation_notes: আর্থিক সম্পদ লেভেল 5-এ স্কোর করা হয়, কারণ ডিজিটাল পোর্টফোলিও প্রধান একাধিক সেবা জুড়ে থাকা পুরো ডিজিটাল পোর্টফোলিওর বিনিয়োগ তত্ত্বাবধান করেন; তথ্য সম্পদ লেভেল 6, কারণ পোর্টফোলিও রেজিস্টার ও প্রতিবেদন পুরো প্রতিষ্ঠানকে অন্তর্ভুক্ত করে।
