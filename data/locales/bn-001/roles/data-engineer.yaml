summary: >
  ডেটা ইঞ্জিনিয়াররা সেই পাইপলাইন ও প্ল্যাটফর্ম তৈরি ও পরিচালনা করেন যা স্বাস্থ্য ও পরিচর্যার ডেটা ক্লিনিক্যাল ও পরিচালন ব্যবস্থা থেকে এমন জায়গায় নিয়ে যায় যেখানে তা নিরাপদে বিশ্লেষণ ও ব্যবহার করা যায়। তাঁরা ডেটা প্রবাহ ডিজাইন করেন, ভিন্ন মানদণ্ড ব্যবহারকারী উৎস সমন্বিত করেন, এবং ডেটা নির্ভুল, সময়োপযোগী, নিরাপদ এবং কেবল যাঁদের দেখার কথা তাঁদের কাছে প্রাপ্য তা নিশ্চিত করেন।
health_context:
  - উৎস ব্যবস্থার মধ্যে আছে ইলেকট্রনিক রোগী রেকর্ড, ল্যাবরেটরি, ইমেজিং ও ফার্মেসি ব্যবস্থা, যা HL7 সংস্করণ 2, HL7 FHIR, SNOMED CT ও ICD-এর মতো মানদণ্ড ব্যবহার করে।
  - পাইপলাইন প্রায়ই শনাক্তযোগ্য রোগী ডেটা বহন করে, তাই ইঞ্জিনিয়াররা শুরু থেকেই ছদ্মনামকরণ, প্রবেশাধিকার নিয়ন্ত্রণ ও নিরীক্ষা যুক্ত করেন।
  - সতর্কবার্তা বা রোগীর তালিকার মতো কিছু ডেটা ফিড সরাসরি পরিচর্যায় সহায়তা করে, তাই ব্যর্থ বা বিলম্বিত পাইপলাইন রোগীদের প্রভাবিত করতে পারে এবং এর ক্লিনিক্যাল নিরাপত্তা মূল্যায়ন দরকার।
  - ডেটা প্রায়ই পরিচর্যা পরিবেশজুড়ে সংযুক্ত করতে হয়, যা নির্ভরযোগ্য রোগী মেলানো ও সামঞ্জস্যপূর্ণ শনাক্তকারীর ওপর নির্ভর করে।
levels:
  - title: ডেটা ইঞ্জিনিয়ার
    responsibilities:
      - সম্মত ডিজাইন অনুসরণ করে ক্লিনিক্যাল ও পরিচালন ব্যবস্থা থেকে ডেটা প্ল্যাটফর্মে ডেটা পাইপলাইন তৈরি ও রক্ষণাবেক্ষণ করা।
      - কোডকৃত ক্লিনিক্যাল ডেটাসহ উৎস ডেটাকে লক্ষ্য মডেলে ম্যাপ করা এবং ম্যাপিং নথিভুক্ত করা।
      - পাইপলাইনে ছদ্মনামকরণ, যাচাই ও ডেটার মান যাচাই যুক্ত করা।
      - পাইপলাইন পর্যবেক্ষণ করা এবং ব্যর্থতা সমাধান করা, সরাসরি পরিচর্যায় সহায়ক ফিডকে অগ্রাধিকার দিয়ে।
      - তথ্য সুশাসনের নিয়ম পূরণ করে এমন প্রবেশাধিকার নিয়ন্ত্রণ ও অডিট লগিং প্রয়োগ করা।
    qualifications:
      - কম্পিউটিং বা সংশ্লিষ্ট বিষয়ে ডিগ্রি, বা সমমানের অভিজ্ঞতা।
      - ডেটা পাইপলাইন তৈরির অভিজ্ঞতা।
  - title: সিনিয়র ডেটা ইঞ্জিনিয়ার
    responsibilities:
      - বহু স্বাস্থ্য ও পরিচর্যা ব্যবস্থার ডেটা একত্র করে এমন ডেটা প্রবাহ ও স্ট্রিমিং সেবা ডিজাইন করা।
      - রোগী মেলানো ও সংযোগ প্রক্রিয়া ডিজাইন করা, এবং সেগুলো কতটা ভালো কাজ করে তা পরিমাপ করা।
      - ডেটাবেস ও প্ল্যাটফর্মের কর্মদক্ষতার কাজে নেতৃত্ব দেওয়া যাতে সেবার প্রয়োজনে ডেটা প্রাপ্য থাকে।
      - সংশ্লিষ্ট বিশেষজ্ঞদের সাথে ডেটা প্রবাহের ক্লিনিক্যাল নিরাপত্তা ও তথ্য সুশাসন ঝুঁকি মূল্যায়ন করা।
      - অন্য ইঞ্জিনিয়ারদের কাজ পর্যালোচনা ও কোচিং করা।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে ডেটা ব্যবস্থা ডিজাইন ও তৈরির উল্লেখযোগ্য অভিজ্ঞতা।
  - title: লিড ডেটা ইঞ্জিনিয়ার
    responsibilities:
      - প্রতিষ্ঠানের ডেটা প্ল্যাটফর্ম ও এর বহু ডেটা প্রবাহের ডিজাইন ও পরিচালনার নেতৃত্ব দেওয়া।
      - পাইপলাইন, পরীক্ষা, নিরাপত্তা ও নথিভুক্তির প্রকৌশল মানদণ্ড নির্ধারণ করা।
      - যৌথ পরিচর্যা রেকর্ড ও আঞ্চলিক ডেটা সেবাসহ স্বাস্থ্য ও পরিচর্যা অংশীদারদের সাথে ডেটা সমন্বয়ের পরিকল্পনা করা।
      - সরাসরি পরিচর্যায় সহায়ক ডেটা প্রবাহ স্থিতিস্থাপক এবং এর ক্লিনিক্যাল নিরাপত্তা কেস আছে তা নিশ্চিত করা।
      - ডেটা ইঞ্জিনিয়ারিং দলগুলো সমন্বয় করা এবং ইঞ্জিনিয়ারদের সরাসরি ব্যবস্থাপনা করা।
    qualifications:
      - জটিল ব্যবস্থার ডেটা প্রকৌশলের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
  - title: ডেটা ইঞ্জিনিয়ারিং প্রধান
    responsibilities:
      - প্রতিষ্ঠানের ডেটা প্ল্যাটফর্ম ও ডেটা প্রকৌশল সেবার কৌশল নির্ধারণ করা।
      - অভ্যন্তরীণ দল এবং স্বাস্থ্য ও পরিচর্যা অংশীদারদের জন্য ডেটা সেবা দেওয়া বহুবিষয়ক দলের নেতৃত্ব দেওয়া।
      - ডেটা প্ল্যাটফর্মের ঝুঁকি, ব্যয় ও বিনিয়োগ নিয়ে জ্যেষ্ঠ নেতাদের পরামর্শ দেওয়া।
      - ডেটা সেবা তথ্য সুশাসন, নিরাপত্তা ও ক্লিনিক্যাল নিরাপত্তার প্রয়োজনীয়তা পূরণ করে তা নিশ্চিত করা।
      - নিয়োগ, উন্নয়ন ও কর্মজীবনের পথের মাধ্যমে ডেটা প্রকৌশল সক্ষমতা গড়ে তোলা।
    qualifications:
      - একাধিক দলজুড়ে ডেটা প্রকৌশলের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
