summary: >
  নেটওয়ার্ক আর্কিটেক্টরা সেই লোকাল, ওয়াইড এরিয়া, ওয়্যারলেস ও ক্লাউড নেটওয়ার্ক ডিজাইন করেন যা প্রতিষ্ঠানের স্থান, কর্মী, ক্লিনিক্যাল ব্যবস্থা ও মেডিক্যাল ডিভাইস যুক্ত করে। তাঁরা নিশ্চিত করেন যে নেটওয়ার্কগুলো কখনো না থামা পরিচর্যার জন্য যথেষ্ট দ্রুত, স্থিতিস্থাপক ও নিরাপদ, এবং সেবাগুলো ক্লাউডে যাওয়া ও অংশীদার প্রতিষ্ঠানের সাথে যুক্ত হওয়ার সাথে নেটওয়ার্ক কীভাবে বদলাবে তার পরিকল্পনা করেন।
health_context:
  - ক্লিনিক্যাল ব্যবস্থা, টেলিফোনি ও মেডিক্যাল ডিভাইস নেটওয়ার্কের ওপর নির্ভর করে, তাই বিভ্রাট পরিচর্যা থামিয়ে দিতে পারে; ডিজাইনে স্থিতিস্থাপকতা ও পরীক্ষিত ফেইলওভার দরকার।
  - নেটওয়ার্কে প্রায়ই এমন সংযুক্ত মেডিক্যাল ডিভাইস থাকে যা প্যাচ করা কঠিন, তাই আর্কিটেক্টরা সেগুলো রক্ষায় সেগমেন্টেশন ও পর্যবেক্ষণ ডিজাইন করেন।
  - কর্মীরা হাসপাতাল, ক্লিনিক, কমিউনিটি ও রোগীর বাড়িতে কাজ করেন, তাই ডিজাইনকে নিরাপদ মোবাইল ও দূরবর্তী প্রবেশে সহায়তা করতে হবে।
  - নেটওয়ার্কগুলো যৌথ স্বাস্থ্য ও পরিচর্যা নেটওয়ার্ক এবং অংশীদার প্রতিষ্ঠানের সাথে যুক্ত হয়, যারা নিজস্ব সংযোগ ও নিরাপত্তার প্রয়োজনীয়তা নির্ধারণ করে।
  - ক্লিনিক্যাল এলাকায় পরিবর্তনের জন্য রোগী পরিচর্যার কথা ভেবে সাবধানী পরিকল্পনা দরকার, যেমন ব্যস্ত সময়ের বাইরে কাজের সময় ঠিক করা।
levels:
  - title: অ্যাসোসিয়েট নেটওয়ার্ক আর্কিটেক্ট
    responsibilities:
      - নেটওয়ার্ক আর্কিটেক্টদের নির্দেশনায় নেটওয়ার্ক ডিজাইন, ডায়াগ্রাম ও নির্দিষ্টকরণের খসড়া করা।
      - ওয়্যারলেস কভারেজ ও ডিভাইস সংযোগসহ ক্লিনিক্যাল এলাকার জন্য স্থান জরিপ ও প্রয়োজনীয়তা সংগ্রহ করা।
      - নেটওয়ার্ক টপোলজি, ঠিকানা ও সংযুক্ত ডিভাইসের রেকর্ড হালনাগাদ রাখা।
      - পর্যালোচনার আগে ডিজাইন সেবার মান ও নিরাপত্তা মানদণ্ড পূরণ করে কি না যাচাই করা।
    qualifications:
      - কম্পিউটিং বা নেটওয়ার্কিংয়ে ডিগ্রি, স্বীকৃত নেটওয়ার্কিং যোগ্যতা, বা সমমানের অভিজ্ঞতা।
      - স্নাতকোত্তর ডিপ্লোমা স্তরে বা সমমানের অভিজ্ঞতায় নেটওয়ার্ক ডিজাইনের বিশেষায়িত জ্ঞান।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 5) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 6-এ থাকে। জ্ঞান স্নাতকোত্তর ডিপ্লোমা স্তরে স্কোর করা হয়, এবং তথ্য সম্পদ লেভেল 5-এ, কারণ পদটি প্রধান তথ্য ব্যবস্থা যার ওপর নির্ভর করে নেটওয়ার্কের এমন অংশ ডিজাইন করে।"
  - title: নেটওয়ার্ক আর্কিটেক্ট
    responsibilities:
      - স্থান ও সেবার জন্য লোকাল, ওয়াইড এরিয়া, ওয়্যারলেস ও ক্লাউড নেটওয়ার্ক সমাধান ডিজাইন করা।
      - মেডিক্যাল ডিভাইস, ক্লিনিক্যাল ব্যবস্থা ও অতিথি প্রবেশের জন্য নেটওয়ার্ক সেগমেন্টেশন ডিজাইন করা।
      - পরিচর্যা যেন ব্যাহত না হয় সেজন্য সেবা নেতাদের সাথে ক্লিনিক্যাল এলাকায় নেটওয়ার্ক পরিবর্তনের পরিকল্পনা করা।
      - সরবরাহকারীদের সাথে সেবার মান এবং অংশীদার নেটওয়ার্কের সাথে সংযোগের প্রয়োজনীয়তায় একমত হওয়া।
      - নতুন নেটওয়ার্ক প্রযুক্তি এবং প্রতিষ্ঠানের নিরাপত্তা মানদণ্ডের সাথে সেগুলোর সামঞ্জস্য মূল্যায়ন করা।
    qualifications:
      - স্নাতকোত্তর স্তরে বা সমমানের অভিজ্ঞতায় নেটওয়ার্ক আর্কিটেকচারের বিশেষায়িত জ্ঞান।
      - এন্টারপ্রাইজ নেটওয়ার্ক ডিজাইন ও সহায়তার অভিজ্ঞতা।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 6) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 7-এ থাকে। লোকাল, ওয়াইড এরিয়া, ওয়্যারলেস ও ক্লাউড নেটওয়ার্কজুড়ে বিশেষায়িত জ্ঞানের জন্য জ্ঞান স্নাতকোত্তর স্তরে বা সমমানে স্কোর করা হয়।"
  - title: লিড নেটওয়ার্ক আর্কিটেক্ট
    responsibilities:
      - স্থান, ডেটা সেন্টার ও ক্লাউড সংযোগসহ প্রতিষ্ঠানের নেটওয়ার্ক আর্কিটেকচারের দায়িত্ব নেওয়া।
      - নেটওয়ার্ক ডিজাইনের মানদণ্ড নির্ধারণ করা এবং ডিজাইন কর্তৃপক্ষে ডিজাইনের নিশ্চয়তা দেওয়া।
      - গুরুত্বপূর্ণ ক্লিনিক্যাল সেবার জন্য নেটওয়ার্কের স্থিতিস্থাপকতা ও পুনরুদ্ধার ডিজাইন করা, এবং তা পরীক্ষিত হয় তা নিশ্চিত করা।
      - নেটওয়ার্কে বিনিয়োগ, সরবরাহকারী চুক্তি এবং নতুন সেবার নেটওয়ার্ক ঝুঁকি নিয়ে পরামর্শ দেওয়া।
      - বিশেষজ্ঞ হিসেবে ঊর্ধ্বতনে জানানোর বিন্দু হিসেবে কাজ করা এবং অন্য নেটওয়ার্ক আর্কিটেক্ট ও ইঞ্জিনিয়ারদের দিকনির্দেশনা দেওয়া।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে জটিল প্রতিষ্ঠানের নেটওয়ার্ক আর্কিটেকচারের উল্লেখযোগ্য অভিজ্ঞতা।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 7) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 8a-তে থাকে। তথ্য সম্পদ লেভেল 6, কারণ পদটি সেই নেটওয়ার্ক আর্কিটেকচারের দায়িত্বে যার ওপর প্রতিষ্ঠানের সব তথ্য ব্যবস্থা নির্ভর করে।"
