summary: >
  পারফরম্যান্স অ্যানালিস্টরা পরিমাপ করেন প্রতিষ্ঠানের ডিজিটাল স্বাস্থ্যসেবা রোগী, সেবাগ্রহীতা, চিকিৎসক ও পরিচর্যাকর্মীদের জন্য কতটা ভালো কাজ করে। তাঁরা পরিমাপ কাঠামো তৈরি করেন, ব্যবহার ও ফলাফলের ডেটা সংগ্রহ ও বিশ্লেষণ করেন, এবং পরিবর্তনগুলো প্রবেশাধিকার, অভিজ্ঞতা, নিরাপত্তা ও দক্ষতা উন্নত করে কি না তা বুঝতে প্রোডাক্ট দল ও সেবা নেতাদের সাহায্য করেন।
health_context:
  - সাফল্যের পরিমাপ ডিজিটাল গ্রহণের বাইরে যায়, পরিচর্যার ওপর প্রভাবসহ, যেমন বাদ পড়া অ্যাপয়েন্টমেন্ট, অপেক্ষার সময়, নিরাপদ বাছাই ও কর্মীদের সাশ্রয় হওয়া সময়।
  - স্বাস্থ্যসেবায় বিশ্লেষণ ও ট্র্যাকিং সংবেদনশীল তথ্য প্রকাশ করতে পারে, যেমন একজন কোন রোগ খুঁজেছেন, তাই পরিমাপকে সম্মতি, কুকির নিয়ম ও গোপনীয়তা মানতে হবে।
  - ডিজিটাল সেবা যেন স্বাস্থ্য বৈষম্য না বাড়ায়, তাই অ্যানালিস্টরা ডিজিটাল সেবা কম ব্যবহারকারী গোষ্ঠীর গ্রহণ ও ফলাফল দেখেন।
  - কর্মদক্ষতার ডেটা পর্ষদ, কমিশনার ও নিয়ন্ত্রকের কাছে প্রতিবেদন হতে পারে, তাই সংজ্ঞাগুলো সামঞ্জস্যপূর্ণ ও সুনথিভুক্ত হতে হবে।
levels:
  - title: অ্যাসোসিয়েট পারফরম্যান্স অ্যানালিস্ট
    responsibilities:
      - রোগী ও কর্মীরা কীভাবে ডিজিটাল সেবা ব্যবহার করেন তার নিয়মিত প্রতিবেদন তৈরি করা, যেমন নিবন্ধন, সম্পন্ন করা ও ছেড়ে যাওয়ার বিন্দু।
      - বিশ্লেষণ ও ট্র্যাকিং ডেটায় ঘাটতি ও ত্রুটি যাচাই করা এবং দলকে জানানো।
      - ব্যবহারের ডেটা সংগ্রহ ও ভাগ করার সময় সম্মতি ও গোপনীয়তা সংক্রান্ত প্রতিষ্ঠানের নিয়ম অনুসরণ করা।
      - সেবা ব্যবহার নিয়ে সরল প্রশ্নের উত্তর দিতে প্রোডাক্ট দলকে সাহায্য করা।
    qualifications:
      - ভালো গাণিতিক দক্ষতা এবং ডেটা সামলানো বা বিশ্লেষণের কিছু অভিজ্ঞতা, বা সমমান।
  - title: পারফরম্যান্স অ্যানালিস্ট
    responsibilities:
      - পরিচর্যা ও কর্মীদের ওপর প্রভাবসহ একটি সেবার সাফল্য কেমন দেখায় তা নিয়ে প্রোডাক্ট দল ও ক্লিনিক্যাল নেতাদের সাথে একমত হওয়া।
      - বিশ্লেষণ স্থাপন ও যাচাই করা, যাতে ট্র্যাকিং নির্ভুল, আনুপাতিক ও সম্মতির প্রতি শ্রদ্ধাশীল হয়।
      - পরিবর্তনের প্রভাব দেখাতে ডিজিটাল বিশ্লেষণকে অ্যাপয়েন্টমেন্ট ও রেফারেলের মতো পরিচালন ডেটার সাথে মেলানো।
      - বিভিন্ন রোগী গোষ্ঠীর গ্রহণ ও ফলাফল বিশ্লেষণ করা এবং ডিজিটাল বর্জনের ঝুঁকি তুলে ধরা।
      - প্রোডাক্ট দল ও সেবা নেতাদের কাছে ফলাফল উপস্থাপন করা এবং উন্নতির সুপারিশ করা।
    qualifications:
      - গাণিতিক বিষয়ে ডিগ্রি, বা সমমানের অভিজ্ঞতা।
      - ডিজিটাল সেবার কর্মদক্ষতা পরিমাপের অভিজ্ঞতা।
  - title: সিনিয়র পারফরম্যান্স অ্যানালিস্ট
    responsibilities:
      - ডিজিটাল বহির্বিভাগ বা অনলাইন বাছাইয়ের মতো একগুচ্ছ সেবা বা একটি বড় কর্মসূচির কর্মদক্ষতা পরিমাপের নেতৃত্ব দেওয়া।
      - ক্লিনিক্যাল, অর্থ ও পরিচালন নেতাদের সাথে সুফলের পরিমাপ ডিজাইন করা এবং বাস্তবায়নের পুরো সময় তা অনুসরণ করা।
      - তথ্য সুশাসন ও নিরাপত্তার প্রয়োজনীয়তা পূরণ করে এমন বিশ্লেষণ টুল বেছে নেওয়া ও কনফিগার করা।
      - কর্মসূচি বোর্ড ও জ্যেষ্ঠ নেতাদের কাছে কর্মদক্ষতার প্রমাণ উপস্থাপন করা।
      - অ্যানালিস্টদের কোচিং দেওয়া, এবং এক বা একাধিক পারফরম্যান্স অ্যানালিস্টের সরাসরি ব্যবস্থাপনা করতে পারেন।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে ডিজিটাল সেবার কর্মদক্ষতা বিশ্লেষণের উল্লেখযোগ্য অভিজ্ঞতা।
  - title: লিড পারফরম্যান্স অ্যানালিস্ট
    responsibilities:
      - ডিজিটাল স্বাস্থ্যসেবার একটি পোর্টফোলিওজুড়ে পারফরম্যান্স অ্যানালিস্টদের একটি দলের নেতৃত্ব দেওয়া।
      - মূল কর্মদক্ষতা পরিমাপের সামঞ্জস্যপূর্ণ সংজ্ঞায় একমত হওয়া, যাতে পর্ষদ ও অংশীদারদের কাছে প্রতিবেদন সময়ের সাথে তুলনা করা যায়।
      - বিশ্লেষণ ডেটা নির্ভুল, যথাযথভাবে ব্যবহৃত এবং তথ্য সুশাসনের নিয়ম মেনে সামলানো হয় তা নিশ্চিত করা।
      - পোর্টফোলিওর অগ্রাধিকার ও বিনিয়োগে প্রভাব ফেলতে কর্মদক্ষতার প্রমাণ ব্যবহার করা।
      - সব স্তরের অ্যানালিস্টদের কোচিং ও পরামর্শ দেওয়া।
    qualifications:
      - কর্মদক্ষতা বিশ্লেষণ এবং অ্যানালিস্টদের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
  - title: পারফরম্যান্স অ্যানালাইসিস প্রধান
    responsibilities:
      - প্রতিষ্ঠানের ডিজিটাল সেবার কর্মদক্ষতা ও সুফল পরিমাপের কৌশল নির্ধারণ করা।
      - কর্মদক্ষতা বিশ্লেষণ ও কর্মদক্ষতা প্রতিবেদনের মান নিশ্চিতকরণ কাঠামো সংজ্ঞায়িত করা।
      - ডিজিটাল সেবা ও রোগীর ফলাফল সম্পর্কে কর্মদক্ষতার প্রমাণ কী দেখায় তা নিয়ে নির্বাহী নেতাদের পরামর্শ দেওয়া।
      - পদ্ধতি ও ডেটা ভাগাভাগি করতে ডেটা বিশ্লেষণ ও ডেটা সায়েন্সের মতো অন্য বিশ্লেষণী পেশার সাথে কাজ করা।
      - নিয়োগ ও উন্নয়নসহ কর্মদক্ষতা বিশ্লেষণ সম্প্রদায়ের সক্ষমতার পরিকল্পনা করা।
    qualifications:
      - প্রতিষ্ঠানজুড়ে কর্মদক্ষতা বিশ্লেষণের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
