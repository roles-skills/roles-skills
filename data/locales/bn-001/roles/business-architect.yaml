summary: >
  বিজনেস আর্কিটেক্টরা প্রতিষ্ঠান কীভাবে স্বাস্থ্য ও পরিচর্যা দেয় তার একটি স্পষ্ট, সমন্বিত চিত্র গড়েন: এর সক্ষমতা, সেবা, পরিচর্যা পথ, প্রক্রিয়া ও তথ্য। তাঁরা সেই চিত্র ব্যবহার করে দেখান কোথায় পরিবর্তন দরকার, কৌশলকে কর্মসূচির সাথে যুক্ত করেন, এবং নিশ্চিত করেন যে ডিজিটাল পরিবর্তন রোগীদের পরিচর্যা এবং চিকিৎসক ও পরিচর্যাকর্মীদের কর্মজীবন উন্নত করে।
health_context:
  - পরিচর্যা পথ দল, পরিবেশ ও প্রতিষ্ঠানজুড়ে বিস্তৃত, তাই বিজনেস আর্কিটেক্টরা কেবল বিভাগ অনুযায়ী নয়, রোগীর দৃষ্টিকোণ থেকে সেবা মডেল করেন।
  - ক্লিনিক্যাল প্রক্রিয়ায় পরিবর্তন রোগীর নিরাপত্তা ও কর্মীদের কাজের চাপকে প্রভাবিত করতে পারে, তাই মডেলগুলো চিকিৎসক ও পরিচর্যাকর্মীদের সাথে তৈরি এবং বাস্তব চর্চার সাথে যাচাই করা হয়।
  - স্বাস্থ্য ও পরিচর্যা কৌশল নীতি, নিয়ন্ত্রণ ও অর্থায়নের নিয়ম দ্বারা গঠিত, যা আর্কিটেক্টদের ব্যবহারিক সক্ষমতা পরিবর্তনে রূপান্তর করতে হয়।
  - অনেক সক্ষমতা অংশীদার প্রতিষ্ঠানের সাথে যৌথ, তাই আর্কিটেক্টরা কে কী করবে এবং তথ্য কোথায় যাবে তাতে একমত হতে সাহায্য করেন।
levels:
  - title: ট্রেইনি বিজনেস আর্কিটেক্ট
    responsibilities:
      - প্রশিক্ষণ ও চর্চার মাধ্যমে সক্ষমতা, মূল্যপ্রবাহ ও প্রক্রিয়া মডেলিংয়ের মতো বিজনেস আর্কিটেকচার পদ্ধতি শেখা।
      - সাক্ষাৎকার, নথি ও পর্যবেক্ষণের মাধ্যমে সেবা ও পরিচর্যা পথ সম্পর্কে তথ্য সংগ্রহ করা।
      - বিজনেস আর্কিটেক্টদের নির্দেশনায় সক্ষমতা মানচিত্র ও প্রক্রিয়া মডেলের খসড়া করা।
      - চিকিৎসক, পরিচর্যাকর্মী ও ব্যবস্থাপকদের সাথে কর্মশালা পরিচালনায় সাহায্য করা এবং ফলাফল লিখে রাখা।
    qualifications:
      - ব্যবসা, বিশ্লেষণ বা সংশ্লিষ্ট বিষয়ে ডিগ্রি বা সমমানের অভিজ্ঞতা।
      - স্নাতকোত্তর ডিপ্লোমা স্তরে বা সমমানের অভিজ্ঞতায় বিজনেস আর্কিটেকচার পদ্ধতিতে বিশেষায়িত প্রশিক্ষণ।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 5) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 6-এ থাকে। কাজটি করার মতো প্রশিক্ষণ যথেষ্ট সম্পন্ন হলে পদের প্রয়োজনীয় স্তরে জ্ঞান স্কোর করা হয়।"
  - title: অ্যাসোসিয়েট বিজনেস আর্কিটেক্ট
    responsibilities:
      - প্রতিষ্ঠানের একটি অংশের সক্ষমতা, সেবা ও পরিচর্যা পথ মডেল করা।
      - রোগী ও কর্মীদের জন্য ঘাটতি, পুনরাবৃত্তি ও সমস্যার জায়গা খুঁজে বের করতে মডেল বিশ্লেষণ করা।
      - পরিবর্তনের সিদ্ধান্তে কাজে লাগাতে বিভিন্ন দল ও প্রতিষ্ঠানের তথ্য একত্র করা।
      - স্পষ্ট মডেল ও সহজ ভাষা ব্যবহার করে অংশীজনদের কাছে জটিল সেবা সমস্যা ব্যাখ্যা করা।
      - বিজনেস আর্কিটেকচার রিপোজিটরি নির্ভুল রাখা এবং অ্যাপ্লিকেশন ও ডেটা মডেলের সাথে যুক্ত রাখা।
    qualifications:
      - স্নাতকোত্তর স্তরে বা সমমানের অভিজ্ঞতায় বিজনেস আর্কিটেকচার বা বিজনেস অ্যানালাইসিসের বিশেষায়িত জ্ঞান।
      - বিজনেস অ্যানালাইসিস বা সার্ভিস ডিজাইনের অভিজ্ঞতা।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 6) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 7-এ থাকে। জ্ঞান স্নাতকোত্তর স্তরে বা সমমানে স্কোর করা হয়, কারণ পদটি দল ও প্রতিষ্ঠানজুড়ে সেবা ও পরিচর্যা পথ মডেল ও বিশ্লেষণ করে।"
  - title: বিজনেস আর্কিটেক্ট
    responsibilities:
      - জরুরি পরিচর্যা বা কমিউনিটি সেবার মতো একটি প্রধান সেবা ক্ষেত্রের বর্তমান ও লক্ষ্য বিজনেস আর্কিটেকচার তৈরি করা।
      - কৌশল ও নীতিকে সক্ষমতা পরিবর্তন ও পরিবর্তনের রোডম্যাপে রূপান্তর করা।
      - কর্মসূচি ও প্রজেক্টের পরিসর লক্ষ্য বিজনেস আর্কিটেকচারের সাথে খাপ খায় কি না যাচাই করা।
      - প্রস্তাবিত পরিবর্তন পরিচর্যা পথ, নিরাপত্তা ও কর্মীদের কাজের চাপকে কীভাবে প্রভাবিত করে তা মূল্যায়নে ক্লিনিক্যাল নেতাদের সাথে কাজ করা।
      - পদ্ধতি ও টুল নিয়ে অন্য বিজনেস আর্কিটেক্টদের দিকনির্দেশনা দেওয়া।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে বিজনেস আর্কিটেকচার, বিজনেস অ্যানালাইসিস বা সার্ভিস ডিজাইনের উল্লেখযোগ্য অভিজ্ঞতা।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 7) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 8a-তে থাকে। পরিকল্পনা, নীতি ও কাজের স্বাধীনতা ব্যান্ড 7 প্রোফাইলের ওপরে স্কোর করা হয়, কারণ পদটি একটি প্রধান সেবা ক্ষেত্রের জন্য কৌশলকে পরিবর্তনের রোডম্যাপে রূপান্তর করে।"
  - title: লিড বিজনেস আর্কিটেক্ট
    responsibilities:
      - বিজনেস আর্কিটেকচার চর্চার নেতৃত্ব দেওয়া এবং এর ফলাফলের জন্য জবাবদিহি করা।
      - সক্ষমতা, সেবা ও পরিচর্যা পথের প্রতিষ্ঠানব্যাপী চিত্র হালনাগাদ ও সহজবোধ্য রাখা।
      - পরিবর্তনের অগ্রাধিকার এবং বিনিয়োগ পোর্টফোলিও কৌশলের সাথে কীভাবে খাপ খায় তা নিয়ে পরিচালকদের পরামর্শ দেওয়া।
      - পরিচর্যা পথজুড়ে যৌথ সক্ষমতা ও দায়িত্বে একমত হতে অংশীদার প্রতিষ্ঠানের সাথে কাজ করা।
      - বিজনেস আর্কিটেক্টদের নেতৃত্ব ও উন্নয়ন করা।
    qualifications:
      - একটি জটিল প্রতিষ্ঠানে বিজনেস আর্কিটেকচারের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
