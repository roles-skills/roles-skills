summary: >
  কনটেন্ট ডিজাইনাররা স্বাস্থ্য ও পরিচর্যার তথ্য ও সেবা স্পষ্ট করেন, যাতে রোগী, পরিচর্যাদাতা, চিকিৎসক ও পরিচর্যাকর্মীরা কী জানতে ও করতে হবে তা বুঝতে পারেন। তাঁরা ব্যবহারকারীর প্রয়োজনের প্রমাণ থেকে বিষয়বস্তু ডিজাইন করেন, সহজ ভাষায় লেখেন, নির্ভুলতা বজায় রাখতে ক্লিনিক্যাল বিশেষজ্ঞদের সাথে কাজ করেন, এবং তৈরি থেকে পর্যালোচনা ও অবসর পর্যন্ত বিষয়বস্তুর পুরো জীবনের যত্ন নেন।
health_context:
  - মানুষ প্রায়ই উদ্বিগ্ন, অসুস্থ বা তাড়াহুড়োয় স্বাস্থ্য বিষয়বস্তু পড়েন, তাই কম স্বাস্থ্য সাক্ষরতার মানুষের জন্যও বিষয়বস্তু সহজে বোঝা ও সে অনুযায়ী কাজ করার মতো হতে হবে।
  - ভুল বা পুরোনো স্বাস্থ্য তথ্য ক্ষতি করতে পারে, তাই কনটেন্ট ডিজাইনাররা পর্যালোচনার তারিখ ও নির্দিষ্ট ক্লিনিক্যাল পর্যালোচকসহ একটি ক্লিনিক্যাল নিশ্চয়তা প্রক্রিয়া অনুসরণ করেন।
  - জরুরি উপসর্গ, মানসিক স্বাস্থ্য, ওষুধ ও জীবনের শেষ পর্যায়ের পরিচর্যার মতো কিছু বিষয় সংবেদনশীল বা উচ্চ ঝুঁকির, তাই কনটেন্ট ডিজাইনাররা সুর ও নির্ভুলতা নিয়ে চিকিৎসক ও ইউজার রিসার্চারদের সাথে নিবিড়ভাবে কাজ করেন।
  - ক্লিনিক্যাল ব্যবস্থারও লেবেল, নির্দেশনা ও সতর্কবার্তার মতো স্পষ্ট বিষয়বস্তু দরকার, তাই কনটেন্ট ডিজাইনাররা ক্লিনিক্যাল কর্মপ্রবাহে ভুল কমাতে সাহায্য করেন।
  - স্বাস্থ্য বিষয়বস্তু প্রবেশযোগ্য ও অন্তর্ভুক্তিমূলক হতে হবে, সহায়ক প্রযুক্তি ব্যবহারকারী, অন্য ভাষায় পড়া মানুষ এবং সহজপাঠ্য ফরম্যাট দরকার এমন মানুষের জন্যও।
levels:
  - title: অ্যাসোসিয়েট কনটেন্ট ডিজাইনার
    responsibilities:
      - প্রশিক্ষণ ও তত্ত্বাবধানে কাজের মাধ্যমে কনটেন্ট ডিজাইন পদ্ধতি, রচনাশৈলী নির্দেশিকা ও ক্লিনিক্যাল পর্যালোচনা প্রক্রিয়া শেখা।
      - বিদ্যমান বিষয়বস্তুতে প্রমিত যাচাই, ভাষা সম্পাদনা ও হালনাগাদ করা।
      - নিশ্চয়তার ধাপ অনুসরণ করে কনটেন্ট ম্যানেজমেন্ট সিস্টেম ব্যবহার করে বিষয়বস্তু প্রকাশ করা।
      - শিরোনাম, লিংকের লেখা ও বিকল্প লেখার মতো বিষয়বস্তুর প্রবেশযোগ্যতা যাচাই করা।
    qualifications:
      - প্রাসঙ্গিক ক্ষেত্রে যোগ্যতা বা শিক্ষানবিশির দিকে কাজ করছেন, বা সমমানের অভিজ্ঞতা।
  - title: জুনিয়র কনটেন্ট ডিজাইনার
    responsibilities:
      - জ্যেষ্ঠ কনটেন্ট ডিজাইনারদের নির্দেশনায় স্বাস্থ্য বিষয়বস্তু ও সেবার বিষয়বস্তু লেখা ও হালনাগাদ করা।
      - ব্যবহারকারীদের কী জানা দরকার এবং তাঁরা কোন শব্দ ব্যবহার করেন তা চিহ্নিত করতে গবেষণা ও ডেটা ব্যবহার করা।
      - নির্ভুলতা যাচাইয়ে ক্লিনিক্যাল পর্যালোচকদের সাথে কাজ করা, এবং সহজ ভাষায় চিকিৎসা পরিভাষা ব্যাখ্যা করা।
      - বিষয়বস্তু প্রকাশ, পর্যালোচনার তারিখ এবং কনটেন্ট দলের প্রশাসনিক কাজে সহায়তা করা।
    qualifications:
      - ডিগ্রি বা প্রাসঙ্গিক যোগ্যতা, বা ওয়েবের জন্য লেখায় সমমানের অভিজ্ঞতা।
  - title: কনটেন্ট ডিজাইনার
    responsibilities:
      - একটি সেবা খোঁজা, অ্যাপয়েন্টমেন্টের প্রস্তুতি ও পরবর্তী পরিচর্যার মতো পুরো ব্যবহারকারী যাত্রাজুড়ে বিষয়বস্তু ডিজাইন করা।
      - ভুলের সম্ভাবনা কমাতে লেবেল, নির্দেশনা ও সতর্কবার্তার মতো ক্লিনিক্যাল ব্যবস্থার বিষয়বস্তু ডিজাইন করা।
      - বিষয়বস্তু স্পষ্ট ও ব্যবহারযোগ্য রেখে ক্লিনিক্যাল বিশেষজ্ঞদের সাথে নির্ভুলতায় একমত হওয়া।
      - কম স্বাস্থ্য সাক্ষরতার মানুষ ও সহায়ক প্রযুক্তি ব্যবহারকারীসহ ব্যবহারকারীদের সাথে বিষয়বস্তু পরীক্ষা করা।
      - রচনাশৈলী নির্দেশিকা ও বিষয়বস্তুর প্যাটার্নে অবদান রাখা।
    qualifications:
      - ডিগ্রি বা প্রাসঙ্গিক যোগ্যতা, বা সমমানের অভিজ্ঞতা।
      - ডিজিটাল সেবার বিষয়বস্তু ডিজাইনের অভিজ্ঞতা।
  - title: সিনিয়র কনটেন্ট ডিজাইনার
    responsibilities:
      - একটি প্রধান রোগ ক্ষেত্র বা জনস্বাস্থ্য প্রচারাভিযানের মতো বড় বা গুরুত্বপূর্ণ ক্ষেত্রের বিষয়বস্তু কৌশল তৈরি করা।
      - জরুরি উপসর্গ, মানসিক স্বাস্থ্য ও জীবনের শেষ পর্যায়ের পরিচর্যার মতো সংবেদনশীল ও উচ্চ ঝুঁকির বিষয়ের বিষয়বস্তু ডিজাইন করা।
      - একগুচ্ছ স্বাস্থ্য বিষয়বস্তুর জন্য ক্লিনিক্যাল নিশ্চয়তা, প্রমাণের উৎস ও পর্যালোচনা চক্র স্থাপন করা।
      - মান নিশ্চিত করতে অন্যদের কাজ পর্যালোচনা করা, এবং কনটেন্ট ডিজাইনারদের পরিচালনা বা পরামর্শ দেওয়া।
      - দলের সাথে ইউজার স্টোরি লেখা ও ম্যাপ করা।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে কনটেন্ট ডিজাইনের উল্লেখযোগ্য অভিজ্ঞতা।
    job_evaluation_notes: মানসিক চাপ লেভেল 2, কারণ সিনিয়র কনটেন্ট ডিজাইনাররা নিয়মিত গুরুতর অসুস্থতা, আত্মক্ষতি ও শোকের মতো কষ্টদায়ক বিষয়ে কাজ করেন।
  - title: লিড কনটেন্ট ডিজাইনার
    responsibilities:
      - কনটেন্ট ডিজাইনারদের একটি দল পরিচালনা করা এবং একাধিক দলজুড়ে বিষয়বস্তুর মান নিশ্চিত করা।
      - স্বাস্থ্য বিষয়বস্তু ক্লিনিক্যাল নিশ্চয়তা, প্রবেশযোগ্যতা ও রচনাশৈলীর মানদণ্ড পূরণ করে তা নিশ্চিত করা।
      - দলগুলোকে সম্পদ দিতে এবং বিষয়বস্তুর সমস্যা সমাধানে জ্যেষ্ঠ ক্লিনিক্যাল, যোগাযোগ ও প্রোডাক্ট নেতাদের সাথে কাজ করা।
      - প্রতিষ্ঠানের সবচেয়ে সংবেদনশীল বা উচ্চ ঝুঁকির তথ্যের বিষয়বস্তুর নেতৃত্ব দেওয়া।
      - কনটেন্ট ডিজাইনারদের সরাসরি ব্যবস্থাপনা ও উন্নয়ন করা।
    qualifications:
      - দলগুলোজুড়ে কনটেন্ট ডিজাইনের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
    job_evaluation_notes: কোনো ব্যান্ড 8a স্তর নেই, কারণ UK GDaD PCF লিড কনটেন্ট ডিজাইনারকে G7 বা G6-এ রাখে এবং এই রেফারেন্স প্রস্তাবিত ব্যান্ড 8b অনুসরণ করে। নীতি লেভেল 5, কারণ লিড বিভিন্ন সেবার বিষয়বস্তুর মানদণ্ড নির্ধারণ করেন; সিনিয়র কনটেন্ট ডিজাইনারদের মতো মানসিক চাপ লেভেল 2।
  - title: কনটেন্ট ডিজাইন প্রধান
    responsibilities:
      - প্রতিষ্ঠানের লক্ষ্য এবং রোগী ও কর্মীদের প্রয়োজন পূরণ করে এমন একটি বিষয়বস্তু কৌশল তৈরি করা।
      - স্বাস্থ্য তথ্যের বিষয়বস্তু ও এর ক্লিনিক্যাল নিশ্চয়তার জন্য প্রতিষ্ঠানের মানদণ্ড নির্ধারণ করা।
      - নিয়োগ ও উন্নয়নসহ কৌশল বাস্তবায়নে সক্ষম একটি কনটেন্ট ডিজাইন দলের নেতৃত্ব দেওয়া।
      - স্বাস্থ্য তথ্যের ঝুঁকি পরিচালনায় জ্যেষ্ঠ ক্লিনিক্যাল ও যোগাযোগ নেতাদের সাথে কাজ করা।
      - প্রতিষ্ঠানজুড়ে বিষয়বস্তুর কাজের অগ্রাধিকার ঠিক করা।
    qualifications:
      - কনটেন্ট ডিজাইন ও একটি কনটেন্ট চর্চার নেতৃত্বে ব্যাপক অভিজ্ঞতা।
    job_evaluation_notes: UK GDaD PCF লিড কনটেন্ট ডিজাইনার ও কনটেন্ট ডিজাইন প্রধান দুটিকেই G7 বা G6-এ রাখে, প্রস্তাবিত ব্যান্ড 8b-সহ। এই রেফারেন্স অন্য ব্যবহারকারী-কেন্দ্রিক ডিজাইন পেশার প্রধানদের সাথে সামঞ্জস্য রেখে প্রধানকে ব্যান্ড 8c-তে রাখে, কারণ প্রধান পুরো প্রতিষ্ঠানের বিষয়বস্তু কৌশল ও মানদণ্ড নির্ধারণ করেন।
