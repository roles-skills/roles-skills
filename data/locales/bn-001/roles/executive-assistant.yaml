summary: >
  এক্সিকিউটিভ অ্যাসিস্ট্যান্টরা জ্যেষ্ঠ নেতাদের উচ্চস্তরের প্রশাসনিক ও ব্যবসায়িক সহায়তা দেন। তাঁরা ডায়েরি, চিঠিপত্র, সভা ও কাগজপত্র পরিচালনা করেন, নেতার দপ্তরের যোগাযোগের বিন্দু হিসেবে কাজ করেন, এবং বিচারবুদ্ধি প্রয়োগ করে নেতার পক্ষে বিষয় সামলান। তাঁরা প্রায়ই অত্যন্ত গোপন ও সংবেদনশীল তথ্য সামলান।
health_context:
  - স্বাস্থ্যসেবার জ্যেষ্ঠ নেতারা রোগীর নিরাপত্তার ঘটনা, অভিযোগ ও কর্মীদের কেস সামলান, তাই এক্সিকিউটিভ অ্যাসিস্ট্যান্টরা নিয়মিত সংবেদনশীল ও গোপন বিষয়বস্তু সামলান।
  - নির্বাহী দপ্তর পরিচালনা পর্ষদ ও কমিটির সাথে নিবিড়ভাবে কাজ করে, তাই নির্ভুল কাগজপত্র, কার্যবিবরণী ও সুশাসনের রেকর্ড গুরুত্বপূর্ণ।
  - গুরুতর ঘটনা ও সেবা বিভ্রাটের মতো জরুরি বিষয়ের জন্য স্বল্প নোটিশে ডায়েরিতে জায়গা করতে হয়।
levels:
  - title: এক্সিকিউটিভ অ্যাসিস্ট্যান্ট
    summary: একজন পরিচালক বা জ্যেষ্ঠ নেতাকে নির্বাহী সহায়তা দেন, তাঁর ডায়েরি, চিঠিপত্র ও সভা পরিচালনা করে।
    responsibilities:
      - অগ্রাধিকার নির্ধারণ ও সংঘাত নিরসন করে একজন জ্যেষ্ঠ নেতার ডায়েরি পরিচালনা করা।
      - চিঠিপত্র সামলানো, উত্তরের খসড়া করা এবং নেতার পক্ষে নিয়মিত বিষয় নিষ্পত্তি করা।
      - সভার জন্য কাগজপত্র, উপস্থাপনা ও ব্রিফিং প্রস্তুত করা।
      - নেতার সভার কার্যবিবরণী নেওয়া এবং করণীয় অনুসরণ করা।
      - কৌশল ও বিচক্ষণতার সাথে নেতার দপ্তরের প্রথম যোগাযোগের বিন্দু হিসেবে কাজ করা।
      - ভ্রমণ, অনুষ্ঠান ও পরিদর্শনের ব্যবস্থা করা।
    qualifications:
      - ফাউন্ডেশন ডিগ্রির সমমানের স্তরে জ্যেষ্ঠ কর্মীদের প্রশাসনিক সহায়তা দেওয়ার উল্লেখযোগ্য অভিজ্ঞতা।
    job_evaluation_notes: যোগাযোগ লেভেল 4-এ স্কোর করা হয়, কারণ পদটি নিয়মিত এমন সংবেদনশীল বিষয় সামলায় যার জন্য জ্যেষ্ঠ অভ্যন্তরীণ ও বাহ্যিক যোগাযোগের সাথে কৌশল ও প্ররোচনা দরকার।
  - title: সিনিয়র এক্সিকিউটিভ অ্যাসিস্ট্যান্ট
    summary: প্রধান নির্বাহী, সভাপতি বা একজন নির্বাহী পরিচালককে নির্বাহী সহায়তা দেন, এবং তাঁদের দপ্তরের কাজ সমন্বয় করেন।
    responsibilities:
      - প্রধান নির্বাহী বা একজন নির্বাহী পরিচালকের ডায়েরি ও অগ্রাধিকার পরিচালনা করা।
      - অংশীদার ও নিয়ন্ত্রকের অভিযোগ ও জিজ্ঞাসাসহ সংবেদনশীল চিঠিপত্র সামলানো।
      - নির্বাহী দলের সভা, কাগজপত্র ও করণীয় লগ সমন্বয় করা।
      - নির্বাহী ও কমিটির সভার আনুষ্ঠানিক কার্যবিবরণী নেওয়া।
      - নির্বাহী দপ্তরজুড়ে প্রতিশ্রুতি ও সময়সীমা অনুসরণ করা এবং অগ্রগতির তাগাদা দেওয়া।
      - অন্য সহকারীদের তত্ত্বাবধান করা এবং নির্বাহী দপ্তরজুড়ে বিকল্প হিসেবে কাজ করা।
    qualifications:
      - ডিগ্রির সমমানের স্তরে নির্বাহী সহায়তার ব্যাপক অভিজ্ঞতা।
  - title: নির্বাহী দপ্তর ব্যবস্থাপক
    summary: নির্বাহী দপ্তর, এর কর্মী ও কর্মচক্র পরিচালনা করেন, এবং নির্বাহী দল ও পরিচালনা পর্ষদ ভালোভাবে সহায়তা পায় তা নিশ্চিত করেন।
    responsibilities:
      - নির্বাহী দপ্তরের দল পরিচালনা করা, অগ্রাধিকার নির্ধারণ ও তাঁদের উন্নয়নে সহায়তা করে।
      - অগ্রিম পরিকল্পনা ও কাগজপত্রসহ নির্বাহী দলের কর্মচক্রের পরিকল্পনা করা।
      - ব্রিফিং, কাগজপত্র ও চিঠিপত্র নির্ভুল, সময়োপযোগী ও সুবিবেচিত তা নিশ্চিত করা।
      - গুরুতর ঘটনা ও জিজ্ঞাসার মতো জরুরি বিষয়ে নির্বাহী প্রতিক্রিয়া সমন্বয় করা।
      - নির্বাহী দপ্তরের বাজেট ও এর ব্যবস্থা পরিচালনা করা।
      - নির্বাহী দপ্তরের প্রক্রিয়া ও টুল উন্নত করা।
    qualifications:
      - ডিগ্রির সমমানের স্তরে নির্বাহী সহায়তা ও দপ্তর ব্যবস্থাপনার ব্যাপক অভিজ্ঞতা।
