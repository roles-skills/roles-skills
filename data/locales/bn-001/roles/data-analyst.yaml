summary: >
  ডেটা অ্যানালিস্টরা স্বাস্থ্য ও পরিচর্যার ডেটাকে এমন তথ্যে রূপান্তর করেন যা চিকিৎসক, ব্যবস্থাপক ও পরিকল্পনাকারীদের সিদ্ধান্ত নিতে সাহায্য করে। তাঁরা ক্লিনিক্যাল, পরিচালন ও রোগীদের দেওয়া উৎস থেকে ডেটা প্রস্তুত, সংযুক্ত ও বিশ্লেষণ করেন, এবং প্রতিবেদন, ড্যাশবোর্ড ও ব্রিফিংয়ে উপস্থাপন করেন। তাঁরা নিশ্চিত করেন যে তাঁদের বিশ্লেষণ নির্ভুল, পুনরুৎপাদনযোগ্য এবং রোগীর গোপন ডেটা নিরাপদে সামলায়।
health_context:
  - অনেক ডেটা নির্দিষ্ট রোগীদের বর্ণনা করে, তাই অ্যানালিস্টরা যেখানে সম্ভব ছদ্মনামকৃত ডেটা নিয়ে কাজ করেন এবং প্রকাশের আগে ফলাফলে প্রকাশ-ঝুঁকি যাচাই করেন।
  - স্বাস্থ্য ডেটা SNOMED CT ও ICD-এর মতো ক্লিনিক্যাল পরিভাষা ও শ্রেণিবিন্যাসে রেকর্ড হয়, তাই কোড কীভাবে ব্যবহৃত হয় এবং কোথায় বিভ্রান্ত করতে পারে তা অ্যানালিস্টদের জানা দরকার।
  - পরিচর্যা পরিবেশ ও ব্যবস্থাভেদে ডেটার মান ভিন্ন, এবং ঘাটতি প্রায়ই কিছু রোগী গোষ্ঠীকে বেশি প্রভাবিত করে, তাই সিদ্ধান্তে পৌঁছানোর আগে অ্যানালিস্টরা পক্ষপাত যাচাই করেন।
  - বিশ্লেষণ সেবার পরিকল্পনা, অর্থায়ন ও প্রদানের ধরন বদলে দিতে পারে, তাই ফলাফলের সাথে স্পষ্ট সতর্কতা থাকতে হবে এবং নিশ্চয়তাকে বাড়িয়ে বলা যাবে না।
levels:
  - title: অ্যাসোসিয়েট ডেটা অ্যানালিস্ট
    responsibilities:
      - সম্মত পদ্ধতি অনুসরণ করে কার্যক্রম, অপেক্ষার সময় ও সেবা ব্যবহারের নিয়মিত প্রতিবেদন ও ড্যাশবোর্ড তৈরি করা।
      - তত্ত্বাবধানে রোগী প্রশাসন, ক্লিনিক্যাল ও পরিচালন ব্যবস্থার নির্যাস পরিষ্কার ও প্রস্তুত করা।
      - ডেটার মানের নিয়মের বিপরীতে ফলাফল যাচাই করা এবং সঠিক ডেটা মালিককে সমস্যা জানানো।
      - ফলাফল ভাগ করার আগে ছোট সংখ্যা গোপন রাখা ও অন্যান্য প্রকাশ-নিয়ম প্রয়োগ করা।
      - ক্লিনিক্যাল ও পরিচালন দলের সরল ডেটা অনুরোধের উত্তর দেওয়া।
    qualifications:
      - গাণিতিক বিষয়ে ডিগ্রি, বিশ্লেষণে শিক্ষানবিশি, বা সমমানের অভিজ্ঞতা।
  - title: ডেটা অ্যানালিস্ট
    responsibilities:
      - ক্লিনিক্যাল, পরিচালন ও পরিকল্পনা দলের প্রশ্নের উত্তর দেয় এমন বিশ্লেষণ ডিজাইন ও পরিচালনা করা।
      - ছদ্মনামকৃত শনাক্তকারী ও সম্মত সংযোগ পদ্ধতি ব্যবহার করে বিভিন্ন উৎসের রোগী-স্তরের ডেটা নিরাপদে সংযুক্ত করা।
      - পুনরুৎপাদনযোগ্য বিশ্লেষণ কোড লেখা এবং পদ্ধতি, অনুমান ও ডেটার উৎস নথিভুক্ত করা।
      - সহজ ভাষায় চিকিৎসক ও ব্যবস্থাপকদের কাছে ফলাফল ও এর সীমাবদ্ধতা ব্যাখ্যা করা।
      - বয়স, লিঙ্গ, জাতিসত্তা ও বঞ্চনার মতো রোগী গোষ্ঠীগুলোর মধ্যে বিশ্লেষণে পক্ষপাত যাচাই করা।
      - অ্যাসোসিয়েট অ্যানালিস্টদের সহায়তা করা এবং তাঁদের কাজ পর্যালোচনা করা।
    qualifications:
      - গাণিতিক বিষয়ে ডিগ্রি, বা সমমানের অভিজ্ঞতা।
      - জটিল ডেটা বিশ্লেষণ ও উপস্থাপনার অভিজ্ঞতা।
  - title: সিনিয়র ডেটা অ্যানালিস্ট
    responsibilities:
      - জরুরি পরিচর্যা, ক্যান্সার বা মানসিক স্বাস্থ্যের মতো একটি সেবা ক্ষেত্রের বিশ্লেষণের নেতৃত্ব দেওয়া, এর নেতাদের সাথে অগ্রাধিকারে একমত হয়ে।
      - কোড ও ফলাফলের সহকর্মী-পর্যালোচনাসহ দলের বিশ্লেষণের পদ্ধতি ও মান নিশ্চিতকরণ নির্ধারণ করা।
      - পরিচর্যা পরিবেশজুড়ে জটিল সংযোগ প্রজেক্টের নেতৃত্ব দেওয়া এবং এর তথ্য সুশাসন ভিত্তিতে একমত হওয়া।
      - জ্যেষ্ঠ ক্লিনিক্যাল ও ব্যবস্থাপনা গোষ্ঠীর কাছে ফলাফল উপস্থাপন করা এবং সেবার জন্য এর অর্থ নিয়ে পরামর্শ দেওয়া।
      - দুর্বল ডেটার মানের মূল কারণ সমাধানে ডেটা ইঞ্জিনিয়ার ও ডেটা মালিকদের সাথে কাজ করা।
      - দলের অ্যানালিস্টদের কোচিং ও উন্নয়ন করা।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে ডেটা বিশ্লেষণের নেতৃত্বে উল্লেখযোগ্য অভিজ্ঞতা।
  - title: প্রিন্সিপাল ডেটা অ্যানালিস্ট
    responsibilities:
      - ডেটা বিশ্লেষণ, মান নিশ্চিতকরণ ও পুনরুৎপাদনযোগ্য বিশ্লেষণ চর্চার জন্য প্রতিষ্ঠানের মানদণ্ড নির্ধারণ করা।
      - সেবা ও বিনিয়োগ নিয়ে বড় সিদ্ধান্তের পেছনের প্রমাণ নিয়ে নির্বাহী ও ক্লিনিক্যাল নেতাদের পরামর্শ দেওয়া।
      - প্রশিক্ষণ, টুল ও কর্মজীবন উন্নয়নসহ বিশ্লেষক সম্প্রদায়ের নেতৃত্ব দেওয়া।
      - স্বাস্থ্য ও পরিচর্যা অংশীদারদের সাথে ডেটা বিনিময় ও সংযোগ ব্যবস্থা গড়া।
      - সিনিয়র অ্যানালিস্টদের সরাসরি ব্যবস্থাপনা করা এবং দলের প্রয়োজনীয় সক্ষমতা ও দক্ষতা আছে তা নিশ্চিত করা।
    qualifications:
      - প্রতিষ্ঠানজুড়ে ডেটা বিশ্লেষণের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
