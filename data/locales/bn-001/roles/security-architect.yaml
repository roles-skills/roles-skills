summary: >
  সিকিউরিটি আর্কিটেক্টরা প্রতিষ্ঠানের ডিজিটাল স্বাস্থ্যসেবার নিরাপত্তা ডিজাইন করেন, যাতে রোগীর তথ্য গোপন, নির্ভুল এবং পরিচর্যার প্রয়োজনে প্রাপ্য থাকে। তাঁরা নিরাপত্তার প্যাটার্ন ও নিয়ন্ত্রণ নির্ধারণ করেন, নতুন ডিজাইন ও সরবরাহকারীর নিরাপত্তা ঝুঁকি মূল্যায়ন করেন, এবং ঝুঁকিভিত্তিক সিদ্ধান্ত নিতে দলগুলোকে সাহায্য করেন যাতে সেবা নিরাপদ থাকে এবং চিকিৎসক ও রোগীদের জন্য ব্যবহারযোগ্যও থাকে।
health_context:
  - স্বাস্থ্য প্রতিষ্ঠান প্রায়ই র‍্যানসমওয়্যার ও ডেটা চুরির লক্ষ্য, এবং একটি হামলা ক্লিনিক্যাল সেবা থামিয়ে দিতে পারে, তাই প্রাপ্যতা গোপনীয়তার মতোই গুরুত্বপূর্ণ।
  - নিরাপত্তা নিয়ন্ত্রণ যেন জরুরি পরিচর্যায় বাধা না দেয়, তাই ডিজাইনে ক্লিনিক্যাল পরিবেশে শক্তিশালী প্রমাণীকরণ ও দ্রুত প্রবেশের মধ্যে ভারসাম্য রাখা হয়।
  - সংযুক্ত মেডিক্যাল ডিভাইস ও পুরোনো ক্লিনিক্যাল ব্যবস্থা প্রায়ই দ্রুত প্যাচ করা যায় না, তাই আর্কিটেক্টরা সেগমেন্টেশনের মতো ক্ষতিপূরণমূলক নিয়ন্ত্রণ ডিজাইন করেন।
  - বহু কর্মী, অংশীদার প্রতিষ্ঠান ও সরবরাহকারীর রোগীর রেকর্ডে প্রবেশ দরকার, তাই পরিচয়, ভূমিকাভিত্তিক প্রবেশাধিকার ও নিরীক্ষা কেন্দ্রীয় বিষয়।
  - নিরাপত্তা ডিজাইনকে তথ্য সুশাসনের দায়িত্ব এবং ISO/IEC 27001-এর মতো প্রকাশিত নিরাপত্তা মানদণ্ডে সহায়তা করতে হবে।
levels:
  - title: সিকিউরিটি আর্কিটেক্ট
    responsibilities:
      - পরিচয়, এনক্রিপশন, লগিং ও নেটওয়ার্ক সুরক্ষাসহ সেবা ও ব্যবস্থার নিরাপত্তা নিয়ন্ত্রণ ডিজাইন করা।
      - নতুন ডিজাইন ও সরবরাহকারীর প্রোডাক্টের নিরাপত্তা মূল্যায়ন করা, এবং ঝুঁকি ও সুপারিশকৃত নিয়ন্ত্রণ রেকর্ড করা।
      - রোগীর লগইন ও কর্মীদের একক সাইন-অনের মতো ক্ষেত্রে ডেলিভারি দল পুনর্ব্যবহার করতে পারে এমন নিরাপত্তা প্যাটার্ন তৈরি করা।
      - সহজে হালনাগাদ করা যায় না এমন মেডিক্যাল ডিভাইস ও পুরোনো ক্লিনিক্যাল ব্যবস্থার ক্ষতিপূরণমূলক নিয়ন্ত্রণ নিয়ে পরামর্শ দেওয়া।
      - তথ্য সুশাসন ও ক্লিনিক্যাল নিরাপত্তা সহকর্মীদের সাথে কাজ করা যাতে নিরাপত্তা, গোপনীয়তা ও সুরক্ষার ঝুঁকি একসাথে মূল্যায়ন হয়।
      - নিরাপদ ডিজাইনে সিকিউরিটি ইঞ্জিনিয়ার ও অন্য আর্কিটেক্টদের কোচিং দেওয়া।
    qualifications:
      - স্নাতকোত্তর ডিগ্রির সমমান স্তরে সিকিউরিটি আর্কিটেকচার বা নিরাপত্তা প্রকৌশলের উল্লেখযোগ্য অভিজ্ঞতা।
      - একটি স্বীকৃত নিরাপত্তা যোগ্যতা বা সমমানের অভিজ্ঞতা।
    job_evaluation_notes: "UK GDaD PCF গ্রেডের প্রস্তাবিত ব্যান্ডের (ব্যান্ড 6) চেয়ে উঁচুতে রাখা হয়েছে: স্বাস্থ্য খাতের বিজ্ঞাপনে এই ভূমিকা ব্যান্ড 8a-তে থাকে। বিশ্লেষণ ও কাজের স্বাধীনতা ব্যান্ড 7 প্রোফাইলের ওপরে স্কোর করা হয়, কারণ পদটি সামান্য তত্ত্বাবধানে গুরুত্বপূর্ণ ক্লিনিক্যাল ব্যবস্থার নিরাপত্তা ডিজাইন করে।"
  - title: লিড সিকিউরিটি আর্কিটেক্ট
    responsibilities:
      - একাধিক উচ্চ ঝুঁকির প্রজেক্ট বা ক্লিনিক্যাল ব্যবস্থা বা ক্লাউড হোস্টিংয়ের মতো একটি প্রধান ক্ষেত্রের সিকিউরিটি আর্কিটেকচারের নেতৃত্ব দেওয়া।
      - আপনার ক্ষেত্রের ডিজাইনের নিরাপত্তা নীতি ও মানদণ্ড নির্ধারণ করা এবং ডিজাইন কর্তৃপক্ষে সেগুলোর নিশ্চয়তা দেওয়া।
      - নিরাপত্তা ঝুঁকি ও তা পরিচালনার বিকল্প নিয়ে জ্যেষ্ঠ ঝুঁকি মালিকদের পরামর্শ দেওয়া।
      - অংশীদার প্রতিষ্ঠান ও সরবরাহকারীর সাথে বিনিময় হওয়া ডেটার নিরাপত্তা ডিজাইন করা।
      - সিকিউরিটি আর্কিটেক্টদের নেতৃত্ব ও উন্নয়ন করা।
    qualifications:
      - জটিল সেবার সিকিউরিটি আর্কিটেকচারে ব্যাপক অভিজ্ঞতা।
  - title: প্রিন্সিপাল সিকিউরিটি আর্কিটেক্ট
    responsibilities:
      - প্রতিষ্ঠানের সিকিউরিটি আর্কিটেকচারের দৃষ্টিভঙ্গি, নীতি ও কৌশল নির্ধারণ করা।
      - রোগী পরিচর্যা ও সেবার সাইবার নিরাপত্তা ঝুঁকি নিয়ে নির্বাহী দল ও পরিচালনা পর্ষদকে পরামর্শ দেওয়া।
      - বড় হামলা থেকে পুনরুদ্ধারসহ সাইবার স্থিতিস্থাপকতা গুরুত্বপূর্ণ ক্লিনিক্যাল সেবার ডিজাইনে যুক্ত তা নিশ্চিত করা।
      - আন্তঃপ্রাতিষ্ঠানিক সাইবার নিরাপত্তা ও মানদণ্ড সম্প্রদায়ে প্রতিষ্ঠানের প্রতিনিধিত্ব করা।
      - সিকিউরিটি আর্কিটেকচার চর্চার নেতৃত্ব দেওয়া এবং এর মানুষদের উন্নয়ন করা।
    qualifications:
      - বিভিন্ন প্রতিষ্ঠানজুড়ে সিকিউরিটি আর্কিটেকচারের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
