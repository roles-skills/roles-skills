summary: >
  ডেটা সায়েন্টিস্টরা পরিসংখ্যান, মেশিন লার্নিং ও অন্যান্য উন্নত পদ্ধতি ব্যবহার করে স্বাস্থ্য ও পরিচর্যার ডেটায় প্যাটার্ন খুঁজে বের করেন এবং এমন মডেল তৈরি করেন যা সেবাকে পরিকল্পনা, পূর্বাভাস ও পরিচর্যা উন্নত করতে সাহায্য করে। সাধারণ কাজের মধ্যে আছে চাহিদার পূর্বাভাস, আগাম সহায়তায় উপকৃত হতে পারেন এমন রোগী চিহ্নিত করা, এবং সেবার পরিবর্তনের প্রভাব মূল্যায়ন। তাঁরা চিকিৎসক ও অ্যানালিস্টদের সাথে নিবিড়ভাবে কাজ করেন, এবং মডেলগুলো বৈধ, ন্যায্য ও নিরাপদে ব্যবহৃত হয় তা নিশ্চিত করেন।
health_context:
  - রোগী সংক্রান্ত সিদ্ধান্তে সহায়ক একটি মডেল ভুল বা পক্ষপাতদুষ্ট হলে ক্ষতি করতে পারে, তাই যে জনগোষ্ঠীতে মডেল ব্যবহৃত হবে তাতে তা যাচাই করা হয় এবং ক্লিনিক্যাল নিরাপত্তার জন্য মূল্যায়ন করা হয়।
  - স্বাস্থ্য ডেটা পরিচর্যায় অসম প্রবেশাধিকার প্রতিফলিত করে, তাই প্রতিটি রোগী গোষ্ঠীর জন্য পক্ষপাত পরিমাপ ও সমাধান না করলে মডেল স্বাস্থ্য বৈষম্যের পুনরাবৃত্তি বা অবনতি ঘটাতে পারে।
  - রোগনির্ণয় বা চিকিৎসায় সহায়ক মডেলের মতো কিছু মডেল মেডিক্যাল ডিভাইস হিসেবে নিয়ন্ত্রিত হতে পারে, এবং কৃত্রিম বুদ্ধিমত্তা নিয়ন্ত্রণও প্রযোজ্য হতে পারে।
  - ডেটা সায়েন্সের প্রায়ই সংযুক্ত, বিস্তারিত রোগী ডেটা দরকার, তাই কাজ হয় নিরাপদ পরিবেশে, ছদ্মনামকৃত ডেটা দিয়ে, একটি সম্মত তথ্য সুশাসন ভিত্তিতে।
  - চিকিৎসক ও রোগীদের একটি মডেলের ফলাফল বুঝতে ও বিশ্বাস করতে হয়, তাই ব্যাখ্যা এবং অনিশ্চয়তার সহজ ভাষায় প্রকাশ গুরুত্বপূর্ণ।
levels:
  - title: ট্রেইনি ডেটা সায়েন্টিস্ট
    responsibilities:
      - কাঠামোবদ্ধ প্রশিক্ষণের মাধ্যমে দলের পরিসংখ্যান ও মেশিন লার্নিং পদ্ধতি, টুল এবং নিরাপদ কাজের ধরন শেখা।
      - তত্ত্বাবধানে ছদ্মনামকৃত স্বাস্থ্য ডেটা সেট প্রস্তুত ও অন্বেষণ করা।
      - সরল পরিসংখ্যান বিশ্লেষণ চালানো ও ব্যাখ্যা করা, একজন অভিজ্ঞ ডেটা সায়েন্টিস্টের সাথে ফলাফল যাচাই করে।
      - তথ্য সুশাসন, প্রকাশ নিয়ন্ত্রণ ও নৈতিকতার পদ্ধতি অনুসরণ করা।
      - ডেটা সায়েন্স শিক্ষানবিশি বা সমমানের যোগ্যতার দিকে কাজ করা।
    qualifications:
      - ডেটা সায়েন্স শিক্ষানবিশি বা সমমানের কর্মসূচিতে ভর্তি, অথবা তার দিকে কাজ করছেন।
    job_evaluation_notes: কাজটি করার মতো প্রশিক্ষণ যথেষ্ট সম্পন্ন হলে পদের প্রয়োজনীয় স্তরে জ্ঞান স্কোর করা হয়।
  - title: অ্যাসোসিয়েট ডেটা সায়েন্টিস্ট
    responsibilities:
      - নির্দেশনায় চাহিদার পূর্বাভাসের মতো মৌলিক পরিসংখ্যান ও মেশিন লার্নিং মডেল তৈরি ও পরীক্ষা করা।
      - নিরাপদ পরিবেশে মডেলিংয়ের জন্য স্বাস্থ্য ডেটা সেট প্রস্তুত ও সংযুক্ত করা।
      - বিভিন্ন রোগী গোষ্ঠীর জন্য মডেল কতটা ভালো কাজ করে তা পরিমাপ করা এবং পার্থক্য জানানো।
      - অ্যানালিস্ট ও সেবা দলের কাছে ফলাফল ও এর অনিশ্চয়তা উপস্থাপন করা।
      - ডেটার উৎস, পদ্ধতি ও অনুমান নথিভুক্ত করা যাতে কাজ পুনরুৎপাদন করা যায়।
    qualifications:
      - গাণিতিক বিষয়ে ডিগ্রি, ডেটা সায়েন্স শিক্ষানবিশি, বা সমমানের অভিজ্ঞতা।
  - title: ডেটা সায়েন্টিস্ট
    responsibilities:
      - উপযুক্ত পদ্ধতি বেছে নিয়ে স্বাধীনভাবে ঝুঁকি স্তরবিন্যাস বা হাসপাতালে থাকার মেয়াদের পূর্বাভাসের মতো জটিল মডেল তৈরি করা।
      - চিকিৎসকদের সাথে মডেল যাচাই করা, স্থানীয় রোগী ডেটায় সেগুলো নির্ভুল, ন্যায্য ও উপযোগী কি না পরীক্ষা করে।
      - প্রতিটি মডেলের উদ্দিষ্ট ব্যবহার, ডেটা, কর্মদক্ষতা ও সীমাবদ্ধতা নথিভুক্ত করা, এবং ক্লিনিক্যাল নিরাপত্তা কেসে প্রমাণ যোগ করা।
      - উপযুক্ত পরিসংখ্যান পদ্ধতি ব্যবহার করে সেবার পরিবর্তনের প্রভাব মূল্যায়ন করা।
      - ক্লিনিক্যাল ও অ-কারিগরি শ্রোতাদের কাছে মডেল ও এর অনিশ্চয়তা ব্যাখ্যা করা।
      - অ্যাসোসিয়েট ও ট্রেইনি ডেটা সায়েন্টিস্টদের সহায়তা করা।
    qualifications:
      - গাণিতিক বিষয়ে ডিগ্রি, বা সমমানের অভিজ্ঞতা।
      - পরিসংখ্যান বা মেশিন লার্নিং মডেল তৈরি ও যাচাইয়ের অভিজ্ঞতা।
  - title: প্রিন্সিপাল ডেটা সায়েন্টিস্ট
    responsibilities:
      - সেবা পরিকল্পনা ও রোগী পরিচর্যায় সহায়ক ডেটা সায়েন্স প্রজেক্টের পরিসর নির্ধারণ, ডিজাইন ও নেতৃত্ব দেওয়া।
      - কোন পদ্ধতি, টুল ও ডেটা উপযুক্ত তা ঠিক করা, এবং বাস্তবসম্মত বা নিরাপদ নয় এমন পরিকল্পনা নিয়ে প্রশ্ন তোলা।
      - ক্লিনিক্যাল নিরাপত্তা ও তথ্য সুশাসন সহকর্মীদের সাথে মডেলের যাচাই, পক্ষপাত মূল্যায়ন ও পর্যবেক্ষণের পরিকল্পনা করা।
      - বড় পরিসরে মডেল কীভাবে ডেপ্লয় ও সহায়তা করা হবে তা নিয়ে প্রোডাক্ট দলের সাথে একমত হওয়া।
      - ডেটা সায়েন্টিস্টদের একটি ছোট দল পরিচালনা ও উন্নয়ন করা।
    qualifications:
      - স্নাতকোত্তর ডিগ্রি বা পরিমাণগত বিষয়ে ডক্টরেটের সমমান স্তরে ডেটা সায়েন্স বাস্তবায়নের উল্লেখযোগ্য অভিজ্ঞতা।
  - title: লিড ডেটা সায়েন্টিস্ট
    responsibilities:
      - ডেটা সায়েন্স দলের নেতৃত্ব দেওয়া এবং তাদের দিকনির্দেশনা, অগ্রাধিকার ও মানদণ্ড নির্ধারণ করা।
      - ডেটা সায়েন্স কোথায় পরিচর্যা উন্নত করতে পারে তার সুযোগ খুঁজে বের করা, এবং ক্লিনিক্যাল ও সেবা নেতাদের কাছে যুক্তি তুলে ধরা।
      - মডেলগুলো এমনভাবে ডিজাইন, যাচাই ও পর্যবেক্ষণ করা হয় তা নিশ্চিত করা যাতে ব্যবহারে নিরাপদ ও ন্যায্য থাকে।
      - সম্মতি, পক্ষপাত ও সংবেদনশীল ডেটার ব্যবহারের মতো জটিল নৈতিক ও ডেটা চ্যালেঞ্জের সমাধান করা।
      - কোচিং, নিয়োগ ও প্রশিক্ষণের মাধ্যমে ডেটা সায়েন্স সক্ষমতা গড়ে তোলা।
    qualifications:
      - ডেটা সায়েন্স দলের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
    job_evaluation_notes: UK GDaD PCF লিড ডেটা সায়েন্টিস্ট ও ডেটা সায়েন্স প্রধান দুটিকেই G7 বা G6-এ প্রস্তাব করে। এই রেফারেন্স লিডকে ব্যান্ড 8a-তে এবং প্রধানকে ব্যান্ড 8b-তে রাখে, যাতে দুটি স্তর ভিন্ন ব্যান্ডে থাকে।
  - title: ডেটা সায়েন্স প্রধান
    responsibilities:
      - প্রতিষ্ঠানের কৌশল ও অগ্রাধিকারের সাথে সামঞ্জস্য রেখে প্রতিষ্ঠানজুড়ে ডেটা সায়েন্স ও কৃত্রিম বুদ্ধিমত্তার দিকনির্দেশনা নির্ধারণ করা।
      - প্রতিষ্ঠানের মডেল ও কৃত্রিম বুদ্ধিমত্তার নৈতিকতা, নিরাপত্তা ও নিশ্চয়তার নেতৃত্ব দেওয়া, এবং এ বিষয়ে পরিচালনা পর্ষদকে পরামর্শ দেওয়া।
      - সম্পদ, বাজেট এবং ডেটা সায়েন্স প্রোডাক্টের মান তত্ত্বাবধান করা।
      - স্বাস্থ্য ও পরিচর্যা অংশীদার, গবেষক ও নিয়ন্ত্রকের কাছে ডেটা সায়েন্স ও কৃত্রিম বুদ্ধিমত্তা বিষয়ে প্রতিষ্ঠানের প্রতিনিধিত্ব করা।
      - বিভিন্ন পেশাজুড়ে ডেটা সায়েন্স সক্ষমতা ও কর্মজীবন গড়ে তোলা।
    qualifications:
      - প্রতিষ্ঠানজুড়ে ডেটা সায়েন্সের নেতৃত্বে ব্যাপক অভিজ্ঞতা।
