# Bengali translations of data/skills/shared.yaml. Keys are the English skill ids.
health-care-context:
  name: স্বাস্থ্য ও পরিচর্যা সেবা বোঝা
  description: স্বাস্থ্য ও পরিচর্যা সেবা কীভাবে সংগঠিত ও প্রদান করা হয়, চিকিৎসক ও পরিচর্যাকর্মীরা কীভাবে কাজ করেন, এবং ডিজিটাল সেবা কীভাবে রোগী পরিচর্যায় সহায়তা করে তা বোঝা।
  levels:
    awareness: |
      আপনি পারেন:
      - স্বাস্থ্য ও পরিচর্যা ব্যবস্থার প্রধান অংশগুলো এবং প্রতিষ্ঠান যেসব সেবায় সহায়তা করে তা বর্ণনা করতে
      - আপনার কাজে রোগীর নিরাপত্তা ও গোপনীয়তা কেন গুরুত্বপূর্ণ তা ব্যাখ্যা করতে
    working: |
      আপনি পারেন:
      - আপনার কাজ যেসব ক্লিনিক্যাল ও পরিচর্যা কর্মপ্রবাহে সহায়তা করে তা ব্যাখ্যা করতে
      - ক্লিনিক্যাল ও পরিচর্যা সহকর্মীদের সাথে প্রচলিত স্বাস্থ্যসেবা পরিভাষা সঠিকভাবে ব্যবহার করতে
      - কোনো পরিবর্তন রোগী পরিচর্যাকে প্রভাবিত করতে পারে কি না তা চিনতে এবং তা জানাতে
    practitioner: |
      আপনি পারেন:
      - বিভিন্ন প্রতিষ্ঠানজুড়ে পরিচর্যা পথে একটি সেবা কীভাবে খাপ খায় তা বিশ্লেষণ করতে
      - ডিজিটাল সেবা গড়তে চিকিৎসক, পরিচর্যাকর্মী ও রোগীদের সাথে কাজ করতে
      - ডিজিটাল সিদ্ধান্তের প্রভাব পরিচর্যা, নিরাপত্তা ও কর্মীদের কাজের চাপের ওপর ব্যাখ্যা করতে
    expert: |
      আপনি পারেন:
      - স্বাস্থ্য ও পরিচর্যা ব্যবস্থার গভীর জ্ঞান ব্যবহার করে প্রতিষ্ঠানের কৌশল গড়তে
      - স্বাস্থ্য ও পরিচর্যা অংশীদার ও নেতাদের কাছে প্রতিষ্ঠানের প্রতিনিধিত্ব করতে
      - নীতি ও সেবার পরিবর্তন ডিজিটাল সেবা ও পরিচর্যাকে কীভাবে প্রভাবিত করবে তা আগে থেকে অনুমান করতে
clinical-safety:
  name: ক্লিনিক্যাল ঝুঁকি ব্যবস্থাপনা
  description: একটি ক্লিনিক্যাল ঝুঁকি ব্যবস্থাপনা প্রক্রিয়া, বিপদ লগ এবং নিরাপত্তা কেসের মাধ্যমে স্বাস্থ্য আইটি ব্যবস্থা রোগীদের জন্য যে ঝুঁকি তৈরি করতে পারে তা চিহ্নিত, মূল্যায়ন ও নিয়ন্ত্রণ করা (যেমন ISO 14971 ও IEC 80001-1 অনুযায়ী)।
  levels:
    awareness: |
      আপনি পারেন:
      - স্বাস্থ্য আইটি ব্যবস্থা কীভাবে রোগীদের ক্ষতি করতে পারে তা ব্যাখ্যা করতে, যেমন ভুল, অনুপস্থিত বা বিলম্বিত তথ্যের মাধ্যমে
      - সম্ভাব্য ক্লিনিক্যাল নিরাপত্তা সমস্যা সঠিক পথে জানাতে
    working: |
      আপনি পারেন:
      - বিপদ চিহ্নিতকরণ কর্মশালায় অংশ নিতে এবং বিপদ লগে অবদান রাখতে
      - আপনার কাজের জন্য ক্লিনিক্যাল ঝুঁকি ব্যবস্থাপনা প্রক্রিয়া অনুসরণ করতে
      - ক্লিনিক্যাল নিরাপত্তা কেসের জন্য প্রমাণ দিতে, যেমন পরীক্ষার ফলাফল
    practitioner: |
      আপনি পারেন:
      - একটি প্রোডাক্ট বা পরিবর্তনের জন্য বিপদ চিহ্নিতকরণ ও ঝুঁকি মূল্যায়নের নেতৃত্ব দিতে
      - বিপদ লগ ও ক্লিনিক্যাল নিরাপত্তা কেস প্রতিবেদন লিখতে ও হালনাগাদ রাখতে
      - প্রোডাক্ট দলের সাথে ঝুঁকি নিয়ন্ত্রণে একমত হতে এবং সেগুলো কাজ করে কি না যাচাই করতে
      - ক্লিনিক্যাল ঝুঁকি ব্যবস্থাপনার মানদণ্ড প্রয়োগে দলগুলোকে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের ক্লিনিক্যাল ঝুঁকি ব্যবস্থাপনা ব্যবস্থার দায়িত্ব নিতে
      - ক্লিনিক্যাল নিরাপত্তা নীতি নির্ধারণ করতে এবং প্রধান ব্যবস্থার নিরাপত্তা কেস নিশ্চিত করতে
      - স্বাস্থ্য আইটি-সংশ্লিষ্ট গুরুতর নিরাপত্তা ঘটনার প্রতিক্রিয়ার নেতৃত্ব দিতে
      - ডিজিটাল দলগুলোজুড়ে ক্লিনিক্যাল নিরাপত্তার সংস্কৃতি গড়ে তুলতে
health-data-interoperability:
  name: স্বাস্থ্য ডেটার আন্তঃকার্যক্ষমতা
  description: HL7 FHIR, HL7 সংস্করণ 2, IHE প্রোফাইল ও প্রমিত API-এর মতো উন্মুক্ত মানদণ্ড ব্যবহার করে বিভিন্ন ব্যবস্থার মধ্যে স্বাস্থ্য ও পরিচর্যা ডেটা নিরাপদে ও সামঞ্জস্যপূর্ণভাবে আদান-প্রদান করা।
  levels:
    awareness: |
      আপনি পারেন:
      - সমন্বিত পরিচর্যার জন্য আন্তঃকার্যক্ষমতা কেন গুরুত্বপূর্ণ তা ব্যাখ্যা করতে
      - স্বাস্থ্য ডেটা আদান-প্রদানের প্রধান মানদণ্ডগুলোর নাম বলতে, যেমন HL7 FHIR
    working: |
      আপনি পারেন:
      - FHIR রিসোর্স, প্রোফাইল ও API পড়তে ও ব্যবহার করতে
      - নির্দেশনায় সরল ইন্টিগ্রেশন তৈরি বা পরীক্ষা করতে
      - একটি নির্দিষ্টকরণের সাথে বার্তা মিলিয়ে দেখতে
    practitioner: |
      আপনি পারেন:
      - FHIR, HL7 সংস্করণ 2 ও বার্তা বিনিময়ের ধরন ব্যবহার করে ইন্টিগ্রেশন ডিজাইন ও তৈরি করতে
      - FHIR রিসোর্স ও বাস্তবায়ন নির্দেশিকা লিখতে ও প্রোফাইল করতে
      - ব্যবস্থাগুলোর মধ্যে জটিল ম্যাপিং ও ডেটার মানের সমস্যা সমাধান করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের জন্য আন্তঃকার্যক্ষমতার মানদণ্ড ও কৌশল নির্ধারণ করতে
      - জাতীয় বা আন্তঃপ্রাতিষ্ঠানিক মানদণ্ড কাজের নেতৃত্ব দিতে
      - বহু ব্যবস্থাজুড়ে গুরুত্বপূর্ণ ইন্টিগ্রেশনের ডিজাইন নিশ্চিত করতে
clinical-terminology:
  name: ক্লিনিক্যাল পরিভাষা ও শ্রেণিবিন্যাস
  description: ক্লিনিক্যাল অর্থ সামঞ্জস্যপূর্ণভাবে রেকর্ড ও আদান-প্রদানের জন্য SNOMED CT, ICD ও LOINC-এর মতো ক্লিনিক্যাল পরিভাষা ও শ্রেণিবিন্যাস ব্যবহার করা।
  levels:
    awareness: |
      আপনি পারেন:
      - ক্লিনিক্যাল পরিভাষা ও শ্রেণিবিন্যাসের পার্থক্য ব্যাখ্যা করতে
      - SNOMED CT ও ICD-এর মতো প্রচলিত পরিভাষা চিনতে
    working: |
      আপনি পারেন:
      - একটি ডেটা আইটেম বা ফর্মের জন্য সঠিক কোড খুঁজে ব্যবহার করতে
      - পরিভাষা ব্রাউজার ও রেফারেন্স সেট ব্যবহার করতে
    practitioner: |
      আপনি পারেন:
      - ক্লিনিক্যাল পরিভাষা ব্যবহার করে ডেটা মডেল ও রেফারেন্স সেট ডিজাইন করতে
      - পরিভাষা ও শ্রেণিবিন্যাসের মধ্যে ম্যাপিং করতে এবং ম্যাপিংয়ের সীমাবদ্ধতা ব্যাখ্যা করতে
      - প্রোডাক্ট ও বিশ্লেষণে পরিভাষার ব্যবহার নিয়ে দলগুলোকে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের পরিভাষা নীতি নির্ধারণ করতে
      - পরিভাষার রিলিজ, সুশাসন ও মান নিশ্চিতকরণের নেতৃত্ব দিতে
      - পরিভাষা মানদণ্ড সংস্থায় প্রতিষ্ঠানের প্রতিনিধিত্ব করতে
information-governance:
  name: তথ্য সুশাসন ও ডেটা সুরক্ষা
  description: ব্যক্তিগত ও স্বাস্থ্য তথ্য আইনসম্মত, নিরাপদ ও নৈতিকভাবে সামলানো, যার মধ্যে ডেটা সুরক্ষা আইন, গোপনীয়তা, সম্মতি, ডেটা সুরক্ষা প্রভাব মূল্যায়ন ও তথ্য বিনিময় রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - ব্যক্তিগত ও স্বাস্থ্য তথ্য সামলানোর জন্য প্রতিষ্ঠানের নিয়ম অনুসরণ করতে
      - ডেটা লঙ্ঘন বা প্রায়-দুর্ঘটনা চিনতে ও জানাতে
    working: |
      আপনি পারেন:
      - আপনার কাজে ডেটা সুরক্ষার নীতিগুলো প্রয়োগ করতে
      - ডেটা সুরক্ষা প্রভাব মূল্যায়নে অবদান রাখতে
      - তথ্যের অনুরোধ ও রেকর্ড সঠিকভাবে সামলাতে
    practitioner: |
      আপনি পারেন:
      - ডেটা সুরক্ষা প্রভাব মূল্যায়ন ও তথ্য বিনিময় চুক্তির নেতৃত্ব দিতে
      - আইনি ভিত্তি, সম্মতি, গোপনীয়তা ও সংরক্ষণ নিয়ে দলগুলোকে পরামর্শ দিতে
      - ঘটনা তদন্ত করতে এবং উন্নতির সুপারিশ করতে
    expert: |
      আপনি পারেন:
      - তথ্য সুশাসনের নীতি ও কৌশল নির্ধারণ করতে
      - তথ্য ঝুঁকি ও সম্মতি নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
      - নিয়ন্ত্রক ও অংশীদারদের কাছে প্রতিষ্ঠানের প্রতিনিধিত্ব করতে
medical-device-regulation:
  name: মেডিক্যাল ডিভাইস সফটওয়্যার নিয়ন্ত্রণ
  description: কখন সফটওয়্যার একটি মেডিক্যাল ডিভাইস, এবং এর ওপর প্রযোজ্য মানদণ্ড ও প্রক্রিয়া, যেমন IEC 62304 ও ISO 13485, বোঝা।
  levels:
    awareness: |
      আপনি পারেন:
      - কিছু স্বাস্থ্য সফটওয়্যার মেডিক্যাল ডিভাইস হিসেবে নিয়ন্ত্রিত তা ব্যাখ্যা করতে
      - কোনো প্রোডাক্ট মেডিক্যাল ডিভাইস হতে পারে মনে হলে কাকে জিজ্ঞাসা করতে হবে তা জানতে
    working: |
      আপনি পারেন:
      - মেডিক্যাল ডিভাইস মানদণ্ড পূরণ করে এমন একটি সফটওয়্যার জীবনচক্র প্রক্রিয়া অনুসরণ করতে
      - সেই প্রক্রিয়ার প্রয়োজনীয় রেকর্ড তৈরি করতে
    practitioner: |
      আপনি পারেন:
      - কোনো প্রোডাক্ট মেডিক্যাল ডিভাইস কি না এবং তার সম্ভাব্য শ্রেণি মূল্যায়ন করতে
      - মান ও ক্লিনিক্যাল সহকর্মীদের সাথে একটি প্রোডাক্টের নিয়ন্ত্রক কাজের পরিকল্পনা করতে
    expert: |
      আপনি পারেন:
      - নিয়ন্ত্রিত সফটওয়্যারের প্রতি প্রতিষ্ঠানের দৃষ্টিভঙ্গি নির্ধারণ করতে
      - নিয়ন্ত্রক ও নোটিফায়েড বডির সাথে যোগাযোগের নেতৃত্ব দিতে
people-management:
  name: জনবল ব্যবস্থাপনা
  description: কর্মীদের নেতৃত্ব, উন্নয়ন ও সহায়তা দেওয়া, যার মধ্যে নিয়োগ, লক্ষ্য, মূল্যায়ন, সুস্থতা, উপস্থিতি এবং কর্মদক্ষতা ও আচরণ ন্যায্যভাবে পরিচালনা রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - আপনাকে প্রভাবিত করে এমন প্রতিষ্ঠানের জনবল নীতিগুলো ব্যাখ্যা করতে
      - নতুন সহকর্মীদের সহায়তা করতে এবং জ্ঞান ভাগ করতে
    working: |
      আপনি পারেন:
      - দৈনন্দিন কাজ তত্ত্বাবধান করতে এবং মতামত দিতে
      - নিয়োগ ও পরিচিতিমূলক কাজে অংশ নিতে
      - নিয়মিত একান্ত আলোচনা করতে
    practitioner: |
      আপনি পারেন:
      - একটি দলের সরাসরি ব্যবস্থাপনা করতে, লক্ষ্য নির্ধারণ ও মূল্যায়ন পরিচালনা করতে
      - সুস্থতায় সহায়তা করতে এবং উপস্থিতি, কর্মদক্ষতা ও আচরণ পরিচালনা করতে
      - দলের উন্নয়ন ও উত্তরসূরি পরিকল্পনা করতে
    expert: |
      আপনি পারেন:
      - ব্যবস্থাপকদের নেতৃত্ব দিতে এবং একটি বড় ক্ষেত্রের সংস্কৃতি গড়তে
      - জনবল পরিকল্পনা ও প্রাতিষ্ঠানিক পরিবর্তন ডিজাইন করতে
      - নেতাদের কোচিং দিতে এবং জটিল জনবল সমস্যা সমাধান করতে
equality-diversity-inclusion:
  name: সমতা, বৈচিত্র্য ও অন্তর্ভুক্তি
  description: মানুষের সাথে ন্যায্য আচরণ করা, পার্থক্যকে মূল্য দেওয়া, এবং সবাইকে অন্তর্ভুক্ত করে এমন সেবা ও কর্মক্ষেত্র ডিজাইন করা।
  levels:
    awareness: |
      আপনি পারেন:
      - সহকর্মী, রোগী ও জনসাধারণের সাথে মর্যাদা ও সম্মানের সাথে আচরণ করতে
      - সমতা ও অন্তর্ভুক্তি নীতি অনুসরণ করতে
    working: |
      আপনি পারেন:
      - অন্যদের বাদ দেয় এমন আচরণ চিনতে ও তার প্রতিবাদ করতে
      - কাজের পরিকল্পনায় ভিন্ন ভিন্ন প্রয়োজন বিবেচনা করতে
    practitioner: |
      আপনি পারেন:
      - সমতা প্রভাব মূল্যায়ন করতে
      - অন্তর্ভুক্তিমূলক দল ও চর্চা গড়ে তুলতে
    expert: |
      আপনি পারেন:
      - অন্তর্ভুক্তির কৌশল নির্ধারণ করতে এবং এর জন্য প্রতিষ্ঠানকে জবাবদিহির আওতায় রাখতে
      - সমতা, বৈচিত্র্য ও অন্তর্ভুক্তিতে সংস্কৃতি পরিবর্তনের নেতৃত্ব দিতে
health-safety-wellbeing:
  name: স্বাস্থ্য, নিরাপত্তা ও সুস্থতা
  description: কর্মক্ষেত্রে নিজেকে ও অন্যদের নিরাপদ ও সুস্থ রাখা, যার মধ্যে ঝুঁকি মূল্যায়ন, নিরাপদ কাজের চর্চা এবং ঘটনা জানানো রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - স্বাস্থ্য ও নিরাপত্তার নিয়ম অনুসরণ করতে এবং বিপদ ও ঘটনা জানাতে
    working: |
      আপনি পারেন:
      - সরল ঝুঁকি মূল্যায়ন করতে, যেমন ওয়ার্কস্টেশন মূল্যায়ন
      - সহকর্মীদের নিরাপদে কাজ করতে সাহায্য করতে
    practitioner: |
      আপনি পারেন:
      - একটি দল বা স্থানের স্বাস্থ্য ও নিরাপত্তা পরিচালনা করতে
      - ঘটনা তদন্ত করতে এবং নিয়ন্ত্রণ ব্যবস্থা চালু করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের স্বাস্থ্য, নিরাপত্তা ও সুস্থতা নীতি নির্ধারণ করতে
      - পরিচালনা পর্ষদের কাছে নিরাপত্তা কর্মদক্ষতা প্রতিবেদন করতে
budget-management:
  name: বাজেট ব্যবস্থাপনা
  description: একটি বাজেটের পরিকল্পনা, পর্যবেক্ষণ ও নিয়ন্ত্রণ, যার মধ্যে পূর্বাভাস, বিচ্যুতি ব্যবস্থাপনা এবং আর্থিক নিয়ম অনুসরণ রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - ব্যয় ও অর্ডারের নিয়ম অনুসরণ করতে
      - আপনার কাজ কীভাবে অর্থায়িত হয় তা ব্যাখ্যা করতে
    working: |
      আপনি পারেন:
      - একটি ছোট বাজেটের বিপরীতে ব্যয় অনুসরণ করতে এবং বিচ্যুতি জানাতে
      - আপনার সীমার মধ্যে ব্যয় অনুমোদন করতে
    practitioner: |
      আপনি পারেন:
      - একটি বাজেট ধারণ ও পরিচালনা করতে, পূর্বাভাস দিতে ও বিচ্যুতি ব্যাখ্যা করতে
      - ব্যয় ও সুফলসহ একটি বিজনেস কেস তৈরি করতে
    expert: |
      আপনি পারেন:
      - বড় বা একাধিক বাজেট পরিচালনা করতে এবং আর্থিক পরিকল্পনা নির্ধারণ করতে
      - বিভিন্ন সেবার মধ্যে অর্থায়নের অগ্রাধিকার ঠিক করতে
project-management:
  name: প্রজেক্ট ব্যবস্থাপনা
  description: PRINCE2, PM² বা অ্যাজাইল পদ্ধতির মতো স্বীকৃত পদ্ধতি ব্যবহার করে সম্মত পরিসর, সময়, ব্যয় ও মান অনুযায়ী প্রজেক্টের পরিকল্পনা, বাস্তবায়ন ও সমাপ্তি।
  levels:
    awareness: |
      আপনি পারেন:
      - একটি প্রজেক্টের ধাপ ও এর প্রধান ভূমিকাগুলো ব্যাখ্যা করতে
      - অ্যাকশন লগের মতো প্রজেক্ট রেকর্ড রাখতে
    working: |
      আপনি পারেন:
      - পরিকল্পনা, ঝুঁকি ও সমস্যা লগ এবং প্রতিবেদন হালনাগাদ রাখতে
      - প্রজেক্ট সভা পরিচালনা করতে এবং করণীয় অনুসরণ করতে
      - সহায়তা নিয়ে একটি ছোট, সুনির্দিষ্ট প্রজেক্ট পরিচালনা করতে
    practitioner: |
      আপনি পারেন:
      - শুরু থেকে সমাপ্তি পর্যন্ত প্রজেক্ট পরিচালনা করতে, পরিসর, সময়, ব্যয় ও মান নিয়ন্ত্রণ করে
      - ঝুঁকি, সমস্যা, নির্ভরতা ও পরিবর্তন নিয়ন্ত্রণ পরিচালনা করতে
      - প্রজেক্ট বোর্ডে প্রতিবেদন দিতে এবং সরবরাহকারীদের পরিচালনা করতে
    expert: |
      আপনি পারেন:
      - বড়, জটিল বা উচ্চ ঝুঁকির প্রজেক্ট পরিচালনা করতে
      - প্রজেক্ট ব্যবস্থাপনার মানদণ্ড নির্ধারণ করতে এবং প্রজেক্ট ম্যানেজারদের কোচিং দিতে
      - ব্যর্থ হতে বসা প্রজেক্ট উদ্ধার করতে
risk-management:
  name: প্রাতিষ্ঠানিক ঝুঁকি ব্যবস্থাপনা
  description: একটি ঝুঁকি রেজিস্টার ও নির্ধারিত ঝুঁকি-সহনশীলতা ব্যবহার করে প্রতিষ্ঠানের লক্ষ্যের প্রতি ঝুঁকি চিহ্নিত, মূল্যায়ন, রেকর্ড ও পরিচালনা করা।
  levels:
    awareness: |
      আপনি পারেন:
      - ঝুঁকি কী এবং কীভাবে তা উত্থাপন করতে হয় তা ব্যাখ্যা করতে
    working: |
      আপনি পারেন:
      - আপনার ক্ষেত্রের ঝুঁকি রেকর্ড ও হালনাগাদ করতে
      - নিয়ন্ত্রণ ব্যবস্থার প্রস্তাব দিতে এবং করণীয় অনুসরণ করতে
    practitioner: |
      আপনি পারেন:
      - একটি পরিদপ্তর বা কর্মসূচির ঝুঁকি প্রক্রিয়া পরিচালনা করতে
      - ঝুঁকি-সহনশীলতার বিপরীতে ঝুঁকি মূল্যায়ন করতে এবং সেগুলো ঊর্ধ্বতনকে জানাতে
      - কমিটির কাছে ঝুঁকি নিয়ে প্রতিবেদন দিতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের ঝুঁকি ব্যবস্থাপনা কাঠামো ও ঝুঁকি-সহনশীলতা ডিজাইন করতে
      - কৌশলগত ঝুঁকি নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
security-operations:
  name: নিরাপত্তা অপারেশনস
  description: SIEM ও এন্ডপয়েন্ট শনাক্তকরণের মতো টুল ব্যবহার করে নিরাপত্তা হুমকির জন্য ব্যবস্থা পর্যবেক্ষণ, সতর্কবার্তা বাছাই, ঘটনা তদন্ত এবং সাইবার ঘটনায় সাড়া দেওয়া।
  levels:
    awareness: |
      আপনি পারেন:
      - ফিশিং ও র‍্যানসমওয়্যারের মতো প্রচলিত সাইবার হুমকি ব্যাখ্যা করতে
      - সন্দেহজনক নিরাপত্তা ঘটনা জানাতে
    working: |
      আপনি পারেন:
      - রানবুক ব্যবহার করে সতর্কবার্তা পর্যবেক্ষণ ও বাছাই করতে
      - প্রমাণ সংগ্রহ করতে এবং ঘটনা ঊর্ধ্বতনকে জানাতে
      - নির্দেশনায় সরল শনাক্তকরণ নিয়ম সমন্বয় করতে
    practitioner: |
      আপনি পারেন:
      - নিরাপত্তা ঘটনা তদন্ত ও নিয়ন্ত্রণ করতে
      - শনাক্তকরণ নিয়ম ও হুমকি অনুসন্ধান লিখতে
      - ঘটনার পরে রানবুক ও টুল উন্নত করতে
    expert: |
      আপনি পারেন:
      - নিরাপত্তা অপারেশনস সেবা ও এর কৌশলের নেতৃত্ব দিতে
      - বড় সাইবার ঘটনার প্রতিক্রিয়ার নেতৃত্ব দিতে
      - জাতীয় নিরাপত্তা সংস্থা ও অংশীদারদের সাথে কাজ করতে
vulnerability-management:
  name: দুর্বলতা ব্যবস্থাপনা
  description: কারিগরি দুর্বলতা খুঁজে বের করা, মূল্যায়ন, অগ্রাধিকার নির্ধারণ ও সংশোধন, যার মধ্যে স্ক্যানিং, পেনিট্রেশন টেস্টিং ও প্যাচিং রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - দ্রুত প্যাচিং ও নিরাপদ কনফিগারেশন কেন গুরুত্বপূর্ণ তা ব্যাখ্যা করতে
    working: |
      আপনি পারেন:
      - দুর্বলতা স্ক্যান চালাতে এবং ফলাফল জানাতে
      - ব্যবস্থার মালিকদের সাথে সংশোধন অনুসরণ করতে
    practitioner: |
      আপনি পারেন:
      - ঝুঁকি অনুযায়ী দুর্বলতার অগ্রাধিকার ঠিক করতে, রোগী সেবার ঝুঁকিসহ
      - পেনিট্রেশন টেস্ট ও সংশোধনের পরিসর নির্ধারণ ও পরিচালনা করতে
    expert: |
      আপনি পারেন:
      - দুর্বলতা ব্যবস্থাপনা নীতি ও এর লক্ষ্যমাত্রা নির্ধারণ করতে
      - জ্যেষ্ঠ নেতাদের কাছে কারিগরি নিরাপত্তা ঝুঁকি প্রতিবেদন করতে
identity-and-access-management:
  name: পরিচয় ও প্রবেশাধিকার ব্যবস্থাপনা
  description: কর্মী, রোগী ও ব্যবস্থার জন্য ডিজিটাল পরিচয়, প্রমাণীকরণ ও প্রবেশাধিকার পরিচালনা, যার মধ্যে ভূমিকাভিত্তিক প্রবেশাধিকার এবং স্মার্টকার্ড বা বহু-স্তরের প্রমাণীকরণ রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - প্রবেশাধিকারের নিয়ম অনুসরণ করতে এবং আপনার লগইন তথ্য সুরক্ষিত রাখতে
    working: |
      আপনি পারেন:
      - ব্যবহারকারী অ্যাকাউন্ট ও প্রবেশাধিকার তৈরি, পরিবর্তন ও অপসারণ করতে
      - ভূমিকাভিত্তিক প্রবেশাধিকারের নিয়মের সাথে প্রবেশাধিকার মিলিয়ে দেখতে
    practitioner: |
      আপনি পারেন:
      - পরিচয় ও প্রবেশাধিকার সেবা ডিজাইন ও পরিচালনা করতে
      - নিয়মিত প্রবেশাধিকার পর্যালোচনা করতে এবং সমস্যা সমাধান করতে
    expert: |
      আপনি পারেন:
      - কর্মী, রোগী ও ব্যবস্থার জন্য পরিচয় ও প্রবেশাধিকার কৌশল নির্ধারণ করতে
      - নতুন পরিচয় মানদণ্ড গ্রহণের নেতৃত্ব দিতে
data-quality:
  name: ডেটার মান ব্যবস্থাপনা
  description: ডেটার মান সংজ্ঞায়িত, পরিমাপ ও উন্নত করা, যার মধ্যে সম্পূর্ণতা, নির্ভুলতা, সময়োপযোগিতা ও বৈধতা রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - পরিচর্যা ও পরিকল্পনার জন্য নির্ভুল স্বাস্থ্য ডেটা কেন গুরুত্বপূর্ণ তা ব্যাখ্যা করতে
      - ডেটা নির্ভুলভাবে রেকর্ড করতে এবং ভুল জানাতে
    working: |
      আপনি পারেন:
      - ডেটার মান যাচাই চালাতে এবং ভুল সংশোধন করতে
      - সহকর্মীদের কাছে ডেটার মানের প্রতিবেদন ব্যাখ্যা করতে
    practitioner: |
      আপনি পারেন:
      - ডেটার মানের নিয়ম ও পরিমাপ সংজ্ঞায়িত করতে
      - দুর্বল মানের মূল কারণ সমাধানে ডেটা সরবরাহকারীদের সাথে কাজ করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠান ও এর অংশীদারদের জন্য ডেটার মানের মানদণ্ড নির্ধারণ করতে
      - ডেটার মান উন্নয়ন কর্মসূচির নেতৃত্ব দিতে
health-records-management:
  name: স্বাস্থ্য রেকর্ড ব্যবস্থাপনা
  description: স্বাস্থ্য ও পরিচর্যা রেকর্ড তাদের পুরো জীবনচক্রে পরিচালনা, যার মধ্যে তৈরি, ফাইলিং, অনুসরণ, প্রবেশাধিকার, সংরক্ষণ ও নিষ্পত্তি রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - রেকর্ড সঠিকভাবে ফাইল, খুঁজে বের ও অনুসরণ করতে
      - রেকর্ডকে হারানো বা অননুমোদিত প্রবেশ থেকে সুরক্ষিত রাখতে
    working: |
      আপনি পারেন:
      - রেকর্ডে প্রবেশের অনুরোধ প্রক্রিয়া করতে
      - সংরক্ষণ সূচি ও রেকর্ড রাখার মানদণ্ড প্রয়োগ করতে
    practitioner: |
      আপনি পারেন:
      - একটি রেকর্ড সেবা ও এর পদ্ধতি পরিচালনা করতে
      - রেকর্ড রাখা নিরীক্ষা করতে এবং কর্মীদের প্রশিক্ষণ দিতে
    expert: |
      আপনি পারেন:
      - রেকর্ড ব্যবস্থাপনা নীতি ও কৌশল নির্ধারণ করতে
      - কাগজ থেকে ডিজিটাল রেকর্ডে রূপান্তরের নেতৃত্ব দিতে
clinical-coding:
  name: ক্লিনিক্যাল কোডিং
  description: পরিচর্যা, পরিশোধ ও পরিসংখ্যানের জন্য জাতীয় ও আন্তর্জাতিক কোডিং নিয়ম অনুসরণ করে স্বাস্থ্য রেকর্ডের ক্লিনিক্যাল তথ্যকে প্রমিত শ্রেণিবিন্যাস কোডে রূপান্তর করা।
  levels:
    awareness: |
      আপনি পারেন:
      - ক্লিনিক্যাল কোডিং কী এবং কেন গুরুত্বপূর্ণ তা ব্যাখ্যা করতে
      - প্রাথমিক চিকিৎসা পরিভাষা ও শারীরস্থান ব্যবহার করতে
    working: |
      আপনি পারেন:
      - শ্রেণিবিন্যাসের নিয়ম ব্যবহার করে সরল পর্ব নির্ভুলভাবে কোড করতে
      - অস্পষ্ট রেকর্ড নিয়ে চিকিৎসকদের কাছে জানতে চাইতে
    practitioner: |
      আপনি পারেন:
      - বিভিন্ন বিশেষায়িত বিভাগজুড়ে জটিল পর্ব কোড করতে
      - কোডিংয়ের মান নিরীক্ষা করতে এবং কোডারদের প্রশিক্ষণ দিতে
    expert: |
      আপনি পারেন:
      - একটি কোডিং সেবা ও এর মান কর্মসূচির নেতৃত্ব দিতে
      - কোডিং মানদণ্ড এবং ডেটা ও অর্থায়নে এর প্রভাব নিয়ে পরামর্শ দিতে
clinical-leadership-in-digital:
  name: ডিজিটালে ক্লিনিক্যাল নেতৃত্ব
  description: ডিজিটাল সেবার ডিজাইন, গ্রহণ ও নিরাপদ ব্যবহারে ক্লিনিক্যাল জ্ঞান ও বিশ্বাসযোগ্যতা যুক্ত করা, এবং ডিজিটাল পরিবর্তনের মধ্য দিয়ে চিকিৎসকদের নেতৃত্ব দেওয়া।
  levels:
    awareness: |
      আপনি পারেন:
      - ডিজিটাল সেবা কীভাবে ক্লিনিক্যাল চর্চা বদলায় তা ব্যাখ্যা করতে
    working: |
      আপনি পারেন:
      - কর্মপ্রবাহ ও নিরাপত্তা নিয়ে প্রোডাক্ট দলকে ক্লিনিক্যাল মতামত দিতে
      - ক্লিনিক্যাল সহকর্মীদের নতুন ব্যবস্থা গ্রহণে সাহায্য করতে
    practitioner: |
      আপনি পারেন:
      - একটি প্রোডাক্ট বা কর্মসূচির জন্য ক্লিনিক্যাল সম্পৃক্ততার নেতৃত্ব দিতে
      - ক্লিনিক্যাল প্রয়োজন ও প্রমাণকে প্রয়োজনীয়তায় রূপান্তর করতে
      - ক্লিনিক্যাল সহকর্মীদের মধ্যে নিরাপদ গ্রহণের পক্ষে কাজ করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের ডিজিটাল সেবার ক্লিনিক্যাল দিকনির্দেশনা ঠিক করতে
      - ডিজিটাল পরিবর্তনের মধ্য দিয়ে বিভিন্ন প্রতিষ্ঠানের ক্লিনিক্যাল নেতাদের নেতৃত্ব দিতে
      - ডিজিটাল বিনিয়োগের ক্লিনিক্যাল ঝুঁকি ও সুফল নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
governance-and-compliance:
  name: প্রাতিষ্ঠানিক সুশাসন ও সম্মতি
  description: প্রতিষ্ঠানের সুশাসনে সহায়তা করা — পর্ষদ, কমিটি, স্থায়ী আদেশ, নীতি, স্বার্থের ঘোষণা, এবং আইনি ও নিয়ন্ত্রক দায়িত্বের সম্মতি।
  levels:
    awareness: |
      আপনি পারেন:
      - প্রতিষ্ঠানের নীতি ও সিদ্ধান্ত গ্রহণের নিয়ম অনুসরণ করতে
    working: |
      আপনি পারেন:
      - কমিটির সভা, কাগজপত্র ও কার্যবিবরণীতে সহায়তা করতে
      - সুশাসন রেজিস্টার হালনাগাদ রাখতে
    practitioner: |
      আপনি পারেন:
      - পর্ষদ ও কমিটির জন্য সুশাসন চক্র পরিচালনা করতে
      - নীতি পর্যালোচনা করতে এবং সম্মতি নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - সুশাসন কাঠামো ডিজাইন করতে এবং পরিচালনা পর্ষদকে পরামর্শ দিতে
      - বার্ষিক সুশাসন প্রতিবেদন ও নিশ্চয়তার নেতৃত্ব দিতে
