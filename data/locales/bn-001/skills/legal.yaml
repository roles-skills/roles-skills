# Bengali translations of data/skills/legal.yaml. Keys are the English skill ids.
legal-legal-research:
  name: আইনি গবেষণা
  description: একটি আইনি প্রশ্নের উত্তর দিতে আইন, মামলার নজির, নির্দেশিকা ও দৃষ্টান্ত খুঁজে বের করা, পড়া ও সংক্ষেপ করা।
  levels:
    awareness: |
      আপনি পারেন:
      - আইনি ডেটাবেস ও প্রতিষ্ঠানের সঞ্চিত জ্ঞান ব্যবহার করে আইন, নির্দেশিকা ও দৃষ্টান্ত নথি খুঁজে বের করতে
      - আইনি পরিভাষা সঠিকভাবে ব্যবহার করতে
    working: |
      আপনি পারেন:
      - একটি নির্দিষ্ট আইনি প্রশ্ন গবেষণা করতে এবং উৎসগুলো স্পষ্টভাবে সংক্ষেপ করতে
      - উৎসগুলো হালনাগাদ ও প্রামাণিক কি না যাচাই করতে
      - দৃষ্টান্ত ও সঞ্চিত জ্ঞানের সংগ্রহ হালনাগাদ রাখতে
    practitioner: |
      আপনি পারেন:
      - বিদ্যমান আইন নতুন প্রযুক্তিতে কীভাবে প্রযোজ্য তার মতো জটিল বা নতুন প্রশ্ন গবেষণা করতে
      - পরস্পরবিরোধী উৎস বিশ্লেষণ করতে এবং যুক্তিসংগত মতে পৌঁছাতে
      - আইন ও নির্দেশিকার পরিবর্তন অনুসরণ করতে এবং প্রতিষ্ঠানে এর প্রভাব ব্যাখ্যা করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের জন্য সবচেয়ে জটিল ও উচ্চ ঝুঁকির প্রশ্নে গবেষণার নেতৃত্ব দিতে
      - আইনি পরিবর্তন আগে থেকে অনুমান করতে এবং প্রতিষ্ঠানকে প্রস্তুত করতে
      - ডিজিটাল স্বাস্থ্য ও পরিচর্যাকে প্রভাবিত করে এমন আইন ও নির্দেশিকার পরামর্শ প্রক্রিয়ায় অবদান রাখতে
legal-contract-drafting-and-review:
  name: চুক্তির খসড়া ও পর্যালোচনা
  description: প্রযুক্তি, সফটওয়্যার লাইসেন্স, ক্লাউড, সেবা ও ডেটা প্রক্রিয়াকরণ চুক্তির মতো চুক্তি ও সমঝোতার খসড়া, পর্যালোচনা ও আলোচনা করা।
  levels:
    awareness: |
      আপনি পারেন:
      - একটি চুক্তির প্রধান অংশ ব্যাখ্যা করতে, যেমন পক্ষ, মেয়াদ, পরিশোধ, দায় ও সমাপ্তি
      - অনুমোদিত টেমপ্লেট থেকে প্রমিত নথি প্রস্তুত করতে
    working: |
      আপনি পারেন:
      - অ-প্রকাশ ও সরল সেবা চুক্তির মতো নিয়মিত চুক্তি প্রতিষ্ঠানের মানদণ্ডের বিপরীতে পর্যালোচনা করতে
      - চুক্তিতে সংশোধন চিহ্নিত করতে এবং পরিবর্তন ব্যাখ্যা করতে
      - আইনজীবীর পর্যালোচনা লাগে এমন ধারা শনাক্ত করতে, যেমন সীমাহীন দায় বা স্বয়ংক্রিয় নবায়ন
    practitioner: |
      আপনি পারেন:
      - সফটওয়্যার লাইসেন্স, ক্লাউড হোস্টিং, ব্যবস্থা সমন্বয় ও ডেটা প্রক্রিয়াকরণ চুক্তির মতো জটিল চুক্তির খসড়া ও আলোচনা করতে
      - দায়ের সীমা, সেবার মান, প্রস্থান ও এসক্রোসহ ঝুঁকি বণ্টন নিয়ে পরামর্শ দিতে
      - চুক্তি রোগীর ডেটা, সেবার ধারাবাহিকতা এবং প্রতিষ্ঠানের সফটওয়্যার ও ডেটার অধিকার রক্ষা করে তা নিশ্চিত করতে
      - চুক্তির টেমপ্লেট ও আলোচনা নির্দেশিকা লিখতে ও হালনাগাদ রাখতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের চুক্তির মানদণ্ড ও ঝুঁকির অবস্থান নির্ধারণ করতে
      - সবচেয়ে মূল্যবান বা উচ্চ ঝুঁকির চুক্তির আলোচনার নেতৃত্ব দিতে
      - অংশীদারত্ব ও যৌথ উদ্যোগের মতো কৌশলগত বাণিজ্যিক ব্যবস্থা নিয়ে জ্যেষ্ঠ নেতাদের পরামর্শ দিতে
legal-legal-advice:
  name: আইনি পরামর্শ
  description: স্পষ্ট, ব্যবহারিক ও নির্ভুল আইনি পরামর্শ দেওয়া যা সহকর্মীদের আইনসম্মত সিদ্ধান্ত নিতে এবং আইনি ঝুঁকি পরিচালনা করতে সাহায্য করে।
  levels:
    awareness: |
      আপনি পারেন:
      - সহকর্মীদের কখন আইনি পরামর্শ দরকার এবং তা কীভাবে পাবেন তা ব্যাখ্যা করতে
      - স্পষ্ট নির্দেশনা নিতে এবং একটি বিষয়ের তথ্য রেকর্ড করতে
    working: |
      আপনি পারেন:
      - নিয়মিত বিষয়ে আইনজীবীর পর্যালোচনার জন্য পরামর্শের খসড়া প্রস্তুত করতে
      - অনুমোদিত নির্দেশিকা ব্যবহার করে সরল প্রশ্নের উত্তর দিতে
      - একগুচ্ছ তথ্যের মধ্যে আইনি বিষয়গুলো চিহ্নিত করতে
    practitioner: |
      আপনি পারেন:
      - আপনার চর্চার ক্ষেত্রে স্বাধীন আইনি পরামর্শ দিতে
      - সহজ ভাষায় আইনি ঝুঁকি ব্যাখ্যা করতে এবং ব্যবহারিক বিকল্পের সুপারিশ করতে
      - চুক্তি প্রদান, ডেটা বিনিময় ও সেবার পরিবর্তনের মতো আইনি প্রভাবযুক্ত সিদ্ধান্তে পরামর্শ দিতে
      - কখন বাহ্যিক আইনজীবী বা কৌঁসুলি নিয়োগ করতে হবে তা ঠিক করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের সবচেয়ে গুরুত্বপূর্ণ আইনি ঝুঁকি নিয়ে পরিচালনা পর্ষদ ও নির্বাহীদের পরামর্শ দিতে
      - নতুন, বিতর্কিত বা উচ্চমূল্যের বিষয়ে চূড়ান্ত পরামর্শ দিতে
      - প্রতিষ্ঠানের আইনি ঝুঁকি-সহনশীলতা নির্ধারণ করতে
      - বাহ্যিক পরামর্শসহ প্রতিষ্ঠানজুড়ে আইনি পরামর্শের মান নিশ্চিত করতে
legal-litigation-and-disputes:
  name: মামলা ও বিরোধ নিষ্পত্তি
  description: চুক্তি বিরোধ, কর্মসংস্থান দাবি এবং ক্লিনিক্যাল অবহেলার দাবিতে সমন্বয়সহ বিরোধ ও দাবি প্রতিরোধ, পরিচালনা ও নিষ্পত্তি করা।
  levels:
    awareness: |
      আপনি পারেন:
      - একটি দাবি বা বিরোধের প্রধান ধাপগুলো ব্যাখ্যা করতে
      - দাবি লগ করতে এবং সময়সীমা নির্ভুলভাবে অনুসরণ করতে
    working: |
      আপনি পারেন:
      - একটি মামলার জন্য নথি ও প্রমাণ সংগ্রহ ও সংগঠিত করতে
      - কালানুক্রম, মামলার নথিগুচ্ছ ও সাক্ষীর বিবৃতির খসড়া প্রস্তুত করতে
      - নিয়মিত বিষয়ে বাহ্যিক আইনজীবী, বিমাকারী বা ক্ষতিপূরণ প্রকল্পের সাথে সমন্বয় করতে
    practitioner: |
      আপনি পারেন:
      - প্রথম নোটিশ থেকে নিষ্পত্তি বা শুনানি পর্যন্ত একগুচ্ছ বিরোধ ও দাবি পরিচালনা করতে
      - দাবির যৌক্তিকতা ও মূল্য মূল্যায়ন করতে এবং কৌশলের সুপারিশ করতে
      - নিষ্পত্তির আলোচনা করতে এবং বিকল্প বিরোধ নিষ্পত্তি ব্যবহার করতে
      - দাবি থেকে পাওয়া শিক্ষা নিরাপত্তা, চুক্তি ও সেবার উন্নতিতে কাজে লাগে তা নিশ্চিত করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের সবচেয়ে গুরুত্বপূর্ণ বা আলোচিত বিরোধের নেতৃত্ব দিতে
      - মামলা, নিষ্পত্তি ও দাবি প্রতিবেদনে প্রতিষ্ঠানের দৃষ্টিভঙ্গি নির্ধারণ করতে
      - সম্ভাব্য দায় ও সুনামের ঝুঁকি নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
legal-information-and-data-law:
  name: তথ্য ও ডেটা আইন
  description: স্বাস্থ্য ও পরিচর্যা ডেটা এবং ডিজিটাল সেবায় ডেটা সুরক্ষা, গোপনীয়তা, তথ্য অধিকার ও সাইবার নিরাপত্তা আইন প্রয়োগ করা।
  levels:
    awareness: |
      আপনি পারেন:
      - ডেটা সুরক্ষা ও গোপনীয়তার মৌলিক নীতি ব্যাখ্যা করতে
      - তথ্যের অনুরোধ ও ডেটা লঙ্ঘন চিনতে এবং সঠিক পথে পাঠাতে
    working: |
      আপনি পারেন:
      - টেমপ্লেটের বিপরীতে ডেটা বিনিময় ও ডেটা প্রক্রিয়াকরণ চুক্তি পর্যালোচনা করতে
      - তথ্যের অনুরোধ ও ডেটা বিষয়ের অধিকারের অনুরোধের উত্তরে সহায়তা করতে
      - প্রচলিত পরিস্থিতিতে স্বাস্থ্য ডেটা ব্যবহারের আইনি ভিত্তি ব্যাখ্যা করতে
    practitioner: |
      আপনি পারেন:
      - ডিজিটাল সেবার জন্য ডেটা সুরক্ষা, গোপনীয়তার দায়িত্ব ও তথ্য প্রবেশাধিকার আইন নিয়ে পরামর্শ দিতে
      - আন্তর্জাতিক স্থানান্তরসহ ডেটা বিনিময় চুক্তি ও ডেটা প্রক্রিয়াকরণের শর্তের খসড়া ও আলোচনা করতে
      - কৃত্রিম বুদ্ধিমত্তা ও বিশ্লেষণ প্ল্যাটফর্মের মতো নতুন প্রযুক্তির ডেটা সুরক্ষা প্রভাব মূল্যায়নে পরামর্শ দিতে
      - ডেটা লঙ্ঘন, নিয়ন্ত্রকের জিজ্ঞাসা ও অভিযোগ নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - স্বাস্থ্য ও পরিচর্যা ডেটা ব্যবহারে প্রতিষ্ঠানের আইনি অবস্থান নির্ধারণ করতে
      - গবেষণা, ডেটা প্ল্যাটফর্ম ও কৃত্রিম বুদ্ধিমত্তার মতো উচ্চ ঝুঁকির বা নতুন ডেটা ব্যবহারের নেতৃত্ব দিতে
      - তথ্য আইন নিয়ে নিয়ন্ত্রকের কাছে প্রতিষ্ঠানের প্রতিনিধিত্ব করতে
legal-legal-administration:
  name: আইনি প্রশাসন
  description: একটি আইনি দলের প্রশাসনিক প্রক্রিয়া পরিচালনা করা, যার মধ্যে বিষয় ব্যবস্থাপনা, নথি নিয়ন্ত্রণ, রেকর্ড, সময়সীমা ও বিল প্রদান রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - বিষয় ব্যবস্থাপনা ব্যবস্থায় বিষয় খোলা, হালনাগাদ ও বন্ধ করতে
      - আইনি নথি নিরাপদে ফাইল করতে ও খুঁজে বের করতে
      - আইনি ও ব্যক্তিগত তথ্য গোপন রাখতে
    working: |
      আপনি পারেন:
      - একটি দলের ডায়েরি, সময়সীমা ও গুরুত্বপূর্ণ তারিখ পরিচালনা করতে
      - আইনি নথি, মামলার নথিগুচ্ছ ও স্বাক্ষর প্যাক প্রস্তুত ও বিন্যাস করতে
      - বাহ্যিক আইনজীবীদের বিল যাচাই ও প্রক্রিয়া করতে
      - চুক্তি ও দলিলের রেজিস্টার পরিচালনা করতে
    practitioner: |
      আপনি পারেন:
      - আইনি দলের প্রশাসন পরিচালনা করতে এবং এর প্রক্রিয়া উন্নত করতে
      - কাজের চাপ, বাহ্যিক আইনজীবীদের পেছনে ব্যয় এবং কাজ সম্পন্নের সময় নিয়ে প্রতিবেদন দিতে
      - বিষয় ব্যবস্থাপনা ও ই-স্বাক্ষর টুলের মতো আইনি প্রযুক্তি পরিচালনা করতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের আইনি অপারেশনস মডেল ডিজাইন করতে
      - আইনি প্রযুক্তি বাছাই ও ব্যবহারের নেতৃত্ব দিতে
      - আইনি সেবার মানদণ্ড ও কর্মদক্ষতার পরিমাপ নির্ধারণ করতে
legal-employment-law:
  name: শ্রম ও কর্মসংস্থান আইন
  description: প্রতিষ্ঠানের জনবল নীতি, চুক্তি, পরিবর্তন কর্মসূচি ও কর্মসংস্থান বিরোধে কর্মসংস্থান আইন প্রয়োগ করা।
  levels:
    awareness: |
      আপনি পারেন:
      - কর্মীদের প্রধান কর্মসংস্থান অধিকার ব্যাখ্যা করতে
      - আইনি পরামর্শ লাগে এমন কর্মসংস্থান বিষয় চিনতে
    working: |
      আপনি পারেন:
      - কর্মসংস্থান দাবি ও শুনানির নথি প্রস্তুতে সাহায্য করতে
      - টেমপ্লেটের বিপরীতে কর্মসংস্থান চুক্তি ও নীতি পর্যালোচনা করতে
    practitioner: |
      আপনি পারেন:
      - বরখাস্ত, বৈষম্য, কর্মী স্থানান্তর ও পুনর্গঠনের মতো কর্মসংস্থান বিষয়ে পরামর্শ দিতে
      - কর্মসংস্থান দাবি পরিচালনা করতে এবং নিষ্পত্তি চুক্তির আলোচনা করতে
      - ঠিকাদার নিয়োগ এবং ডিজিটাল বিশেষজ্ঞদের কর্মসংস্থানের মর্যাদা নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - বড় জনবল পরিবর্তন ও এর আইনি ঝুঁকি নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
      - আলোচিত বা জটিল কর্মসংস্থান বিরোধের নেতৃত্ব দিতে
      - আইনি দায়িত্ব ও উত্তম চর্চা পূরণে জনবল নীতি গড়তে
legal-intellectual-property:
  name: মেধাস্বত্ব
  description: কপিরাইট, লাইসেন্স, ওপেন সোর্স ও ট্রেডমার্কসহ সফটওয়্যার, ডেটা, বিষয়বস্তু ও উদ্ভাবনের মেধাস্বত্ব রক্ষা ও ব্যবহার করা।
  levels:
    awareness: |
      আপনি পারেন:
      - সফটওয়্যার, ডেটা ও বিষয়বস্তু মেধাস্বত্ব অধিকার দ্বারা সুরক্ষিত তা ব্যাখ্যা করতে
      - কোনো চুক্তি বা প্রজেক্ট কখন মালিকানার প্রশ্ন তোলে তা চিনতে
    working: |
      আপনি পারেন:
      - নিয়মিত চুক্তিতে মেধাস্বত্বের ধারা যাচাই করতে
      - লাইসেন্স ও নিবন্ধিত অধিকারের রেকর্ড রাখতে
      - প্রধান ওপেন সোর্স লাইসেন্সের ধরন ও তাদের শর্ত ব্যাখ্যা করতে
    practitioner: |
      আপনি পারেন:
      - কর্মী, সরবরাহকারী ও অংশীদারদের তৈরি সফটওয়্যার, ডেটা ও বিষয়বস্তুর মালিকানা নিয়ে পরামর্শ দিতে
      - প্রতিষ্ঠানের কোড ওপেন সোর্স হিসেবে প্রকাশসহ লাইসেন্স ও মেধাস্বত্বের শর্তের খসড়া করতে
      - প্রতিষ্ঠানের ডেটা ও সফটওয়্যারের বাণিজ্যিক ব্যবহার এবং সুফল ভাগাভাগি নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের মেধাস্বত্ব ও ওপেন সোর্স নীতি নির্ধারণ করতে
      - প্রতিষ্ঠানের ডেটা ও সফটওয়্যার জড়িত বাণিজ্যিকীকরণ ও অংশীদারত্বের নেতৃত্ব দিতে
      - গুরুত্বপূর্ণ মেধাস্বত্ব বিরোধের সমাধান করতে
legal-procurement-law:
  name: সরকারি ক্রয় আইন
  description: বাজারে যাওয়ার পথ বেছে নেওয়া থেকে চুক্তি প্রদান ও চ্যালেঞ্জ পর্যন্ত পণ্য, সেবা ও প্রযুক্তি কেনায় সরকারি ক্রয়ের নিয়ম প্রয়োগ করা।
  levels:
    awareness: |
      আপনি পারেন:
      - সরকারি সংস্থাকে কেন ক্রয়ের নিয়ম মানতে হয় তা ব্যাখ্যা করতে
      - কোনো ক্রয় কার্যক্রমে কখন ক্রয় বা আইনি পরামর্শ লাগে তা চিনতে
    working: |
      আপনি পারেন:
      - দরপত্রের নথি সামঞ্জস্যপূর্ণ ও সম্পূর্ণ কি না যাচাই করতে
      - ন্যায্য ও স্বচ্ছ প্রক্রিয়া দেখাতে প্রয়োজনীয় রেকর্ড রাখায় সহায়তা করতে
    practitioner: |
      আপনি পারেন:
      - ফ্রেমওয়ার্ক, সরাসরি প্রদান ও প্রতিযোগিতামূলক পদ্ধতিসহ বাজারে যাওয়ার পথ নিয়ে পরামর্শ দিতে
      - মূল্যায়ন, প্রদানের সিদ্ধান্ত এবং প্রদানের পরে চুক্তির পরিবর্তন নিয়ে পরামর্শ দিতে
      - সরবরাহকারীদের চ্যালেঞ্জ ও অভিযোগের জবাব দিতে
      - অংশীদারত্বে ভর্তুকি নিয়ন্ত্রণ ও প্রতিযোগিতার ঝুঁকি নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - ক্রয়ের আইনি ঝুঁকিতে প্রতিষ্ঠানের দৃষ্টিভঙ্গি নির্ধারণ করতে
      - উদ্ভাবন অংশীদারত্বের মতো উচ্চমূল্যের বা নতুন ধরনের ক্রয়ের নেতৃত্ব দিতে
      - গুরুত্বপূর্ণ ক্রয় চ্যালেঞ্জে প্রতিষ্ঠানের পক্ষ সমর্থন করতে
legal-health-and-care-law:
  name: স্বাস্থ্য ও পরিচর্যা আইন
  description: স্বাস্থ্য ও পরিচর্যা সেবা পরিচালনাকারী আইন প্রয়োগ করা, যার মধ্যে সম্মতি, সক্ষমতা, ক্লিনিক্যাল অবহেলা, সেবা ও প্রোডাক্টের নিয়ন্ত্রণ এবং প্রতিষ্ঠানের বিধিবদ্ধ দায়িত্ব রয়েছে।
  levels:
    awareness: |
      আপনি পারেন:
      - প্রতিষ্ঠানের প্রধান বিধিবদ্ধ দায়িত্ব ও ক্ষমতা ব্যাখ্যা করতে
      - রোগীর নিরাপত্তা, সম্মতি বা ক্লিনিক্যাল অবহেলা জড়িত বিষয় চিনতে
    working: |
      আপনি পারেন:
      - ঘটনা, মৃত্যু তদন্ত বা ক্লিনিক্যাল দাবির আইনি কাজে সহায়তা করতে
      - প্রতিষ্ঠানের সেবায় প্রযোজ্য নিয়ন্ত্রক কাঠামো ব্যাখ্যা করতে
    practitioner: |
      আপনি পারেন:
      - কখন এটি একটি সেবা দিতে বা কমিশন করতে পারে তাসহ প্রতিষ্ঠানের ক্ষমতা ও দায়িত্ব নিয়ে পরামর্শ দিতে
      - মেডিক্যাল ডিভাইস হিসেবে সফটওয়্যারের মতো ডিজিটাল স্বাস্থ্য প্রোডাক্টের নিয়ন্ত্রণ নিয়ে পরামর্শ দিতে
      - ডিজিটাল সেবা জড়িত দাবিতে ক্লিনিক্যাল অবহেলা প্রকল্প ও বাহ্যিক আইনজীবীদের সাথে সমন্বয় করতে
      - ডিজিটাল সেবায় সম্মতি, সক্ষমতা ও রোগীর অধিকার নিয়ে পরামর্শ দিতে
    expert: |
      আপনি পারেন:
      - প্রতিষ্ঠানের বিধিবদ্ধ দায়িত্ব ও সুশাসন নিয়ে পরিচালনা পর্ষদকে পরামর্শ দিতে
      - সরকারি তদন্ত, বিচারিক পর্যালোচনা ও বড় ঘটনার আইনি কাজের নেতৃত্ব দিতে
      - নতুন স্বাস্থ্য ও পরিচর্যা আইনে প্রতিষ্ঠানের প্রতিক্রিয়া গড়তে
