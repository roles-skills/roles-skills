summary: Wabunifu wa maudhui hufanya taarifa na huduma za afya na matunzo ziwe wazi, ili wagonjwa, walezi, madaktari na wafanyakazi wa matunzo waelewe wanachohitaji kujua na kufanya. Hubuni maudhui kutokana na ushahidi wa mahitaji ya watumiaji, huandika kwa lugha rahisi, hufanya kazi na wataalamu wa kitabibu kuyaweka sahihi, na kutunza maudhui katika maisha yake yote, kuanzia kuundwa hadi kukaguliwa na kustaafishwa.
health_context:
- Watu mara nyingi husoma maudhui ya afya wanapokuwa na wasiwasi, wagonjwa, au wana haraka, hivyo maudhui lazima yawe rahisi kueleweka na kutekelezwa kwa watu wenye uelewa mdogo wa masuala ya afya.
- Taarifa za afya zisizo sahihi au zilizopitwa na wakati zinaweza kusababisha madhara, hivyo wabunifu wa maudhui hufuata mchakato wa uhakikisho wa kitabibu wenye tarehe za ukaguzi na wakaguzi wa kitabibu waliotajwa.
- Baadhi ya mada ni nyeti au zenye hatari kubwa, kama vile dalili za dharura, afya ya akili, dawa na huduma za mwisho wa maisha, hivyo wabunifu wa maudhui hufanya kazi kwa karibu na madaktari na watafiti wa watumiaji kuhusu sauti na usahihi.
- Mifumo ya kitabibu pia inahitaji maudhui wazi, kama vile lebo, maelekezo na tahadhari, hivyo wabunifu wa maudhui husaidia kupunguza makosa katika mtiririko wa kazi za kitabibu.
- Maudhui ya afya lazima yafikike na yajumuishe wote, ikiwemo watu wanaotumia teknolojia saidizi, wanaosoma kwa lugha nyingine, au wanaohitaji miundo rahisi kusoma.
levels:
- title: Mbunifu msaidizi wa maudhui
  responsibilities:
  - Kujifunza mbinu za usanifu wa maudhui, mwongozo wa mtindo na mchakato wa ukaguzi wa kitabibu kupitia mafunzo na kazi chini ya usimamizi.
  - Kufanya ukaguzi wa kawaida, uhariri wa maandishi na masasisho ya maudhui yaliyopo.
  - Kuchapisha maudhui kwa kutumia mfumo wa usimamizi wa maudhui, akifuata hatua za uhakikisho.
  - Kukagua maudhui kwa ufikivu, kama vile vichwa vya habari, maandishi ya viungo na maandishi mbadala.
  qualifications:
  - Anaelekea kupata sifa au uanagenzi katika fani husika, au uzoefu unaolingana.
- title: Mbunifu mdogo wa maudhui
  responsibilities:
  - Kuandika na kusasisha maudhui ya afya na maudhui ya huduma, kwa uelekezi wa wabunifu waandamizi zaidi wa maudhui.
  - Kutumia utafiti na data kubaini watumiaji wanachohitaji kujua na maneno wanayotumia.
  - Kufanya kazi na wakaguzi wa kitabibu kukagua usahihi, na kueleza maneno ya kitabibu kwa lugha rahisi.
  - Kusaidia uchapishaji wa maudhui, tarehe za ukaguzi na utawala wa timu ya maudhui.
  qualifications:
  - Shahada au sifa husika, au uzoefu unaolingana wa kuandika kwa ajili ya wavuti.
- title: Mbunifu wa maudhui
  responsibilities:
  - Kubuni maudhui katika safari nzima za watumiaji, kama vile kupata huduma, kujiandaa kwa miadi na matunzo ya baadaye.
  - Kubuni maudhui kwa mifumo ya kitabibu, kama vile lebo, maelekezo na tahadhari, ili kupunguza uwezekano wa makosa.
  - Kukubaliana usahihi na wataalamu wa kitabibu huku akiweka maudhui wazi na yanayoweza kutumika.
  - Kujaribu maudhui na watumiaji, ikiwemo watu wenye uelewa mdogo wa masuala ya afya na wanaotumia teknolojia saidizi.
  - Kuchangia mwongozo wa mtindo na mifumo ya maudhui.
  qualifications:
  - Shahada au sifa husika, au uzoefu unaolingana.
  - Uzoefu wa kubuni maudhui kwa huduma za kidijitali.
- title: Mbunifu mwandamizi wa maudhui
  responsibilities:
  - Kuendeleza mkakati wa maudhui kwa maeneo makubwa au yenye sifa kubwa, kama vile eneo kuu la ugonjwa au kampeni ya afya ya umma.
  - Kubuni maudhui kwa mada nyeti na zenye hatari kubwa, kama vile dalili za dharura, afya ya akili na huduma za mwisho wa maisha.
  - Kuweka uhakikisho wa kitabibu, vyanzo vya ushahidi na mizunguko ya ukaguzi kwa mkusanyiko wa maudhui ya afya.
  - Kukagua kazi za wengine ili kuhakikisha ubora, na kusimamia au kuwa mshauri wa wabunifu wa maudhui.
  - Kuandika na kuchora ramani za hadithi za watumiaji pamoja na timu.
  qualifications:
  - Uzoefu mkubwa wa usanifu wa maudhui, katika kiwango kinacholingana na shahada ya uzamili.
  job_evaluation_notes: Juhudi za kihisia ni kiwango cha 2 kwa sababu wabunifu waandamizi wa maudhui mara kwa mara hufanya kazi kwenye mada zenye kuhuzunisha, kama vile magonjwa makubwa, kujidhuru na kufiwa.
- title: Mbunifu kiongozi wa maudhui
  responsibilities:
  - Kuelekeza timu ya wabunifu wa maudhui na kuhakikisha ubora wa maudhui katika timu kadhaa.
  - Kuhakikisha maudhui ya afya yanatimiza viwango vya uhakikisho wa kitabibu, ufikivu na mtindo.
  - Kufanya kazi na viongozi waandamizi wa kitabibu, mawasiliano na bidhaa kutoa rasilimali kwa timu na kutatua matatizo ya maudhui.
  - Kuongoza maudhui ya taarifa nyeti zaidi au zenye hatari kubwa zaidi za taasisi.
  - Kusimamia moja kwa moja na kuendeleza wabunifu wa maudhui.
  qualifications:
  - Uzoefu mpana wa kuongoza usanifu wa maudhui katika timu mbalimbali.
  job_evaluation_notes: Hakuna ngazi ya Daraja la 8a, kwa sababu UK GDaD PCF inaweka mbunifu kiongozi wa maudhui katika G7 au G6 na marejeleo haya yanafuata Daraja la 8b linalopendekezwa. Sera ni kiwango cha 5 kwa sababu kiongozi huweka viwango vya maudhui kwa huduma mbalimbali; juhudi za kihisia ni kiwango cha 2, kama kwa wabunifu waandamizi wa maudhui.
- title: Mkuu wa usanifu wa maudhui
  responsibilities:
  - Kuendeleza mkakati wa maudhui unaotimiza malengo ya taasisi na mahitaji ya wagonjwa na wafanyakazi.
  - Kuweka viwango vya taasisi vya maudhui ya taarifa za afya na uhakikisho wake wa kitabibu.
  - Kuongoza timu ya usanifu wa maudhui inayoweza kutekeleza mkakati, ikiwemo uajiri na maendeleo.
  - Kufanya kazi na viongozi waandamizi wa kitabibu na wa mawasiliano kusimamia hatari za taarifa za afya.
  - Kuweka vipaumbele vya kazi ya maudhui katika taasisi nzima.
  qualifications:
  - Uzoefu mpana wa kuongoza usanifu wa maudhui na mazoezi ya maudhui.
  job_evaluation_notes: UK GDaD PCF inaweka mbunifu kiongozi wa maudhui na mkuu wa usanifu wa maudhui katika G7 au G6, na pendekezo la Daraja la 8b. Marejeleo haya yanaweka mkuu katika Daraja la 8c, sambamba na wakuu wa taaluma nyingine za usanifu unaomlenga mtumiaji, kwa sababu mkuu huweka mkakati na viwango vya maudhui kwa taasisi nzima.
