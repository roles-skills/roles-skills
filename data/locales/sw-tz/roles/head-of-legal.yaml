summary: Viongozi wakuu wa sheria huhakikisha taasisi inatenda kihalali na inasimamia hatari zake za kisheria vizuri. Huongoza timu ya sheria ya ndani, husimamia washauri wa nje wa sheria, na kuishauri bodi na watendaji kuhusu masuala muhimu zaidi ya kisheria ya taasisi. Katika taasisi ya huduma za afya ya kidijitali hii inajumuisha msingi wa kisheria wa kutumia data za afya, mikataba mikubwa ya teknolojia na data, mali ya kiakili katika programu, na wajibu wa kisheria wa taasisi.
health_context:
- Taasisi ni chombo cha umma au hufanya kazi na vyombo hivyo, hivyo maamuzi yake yanaweza kupingwa, na lazima itende ndani ya mamlaka yake.
- Matumizi ya data za afya na matunzo kwa kiwango kikubwa, ikiwemo kwa AI na utafiti, hubeba hatari kubwa za kisheria na za sifa.
- Mikataba mikubwa ya teknolojia ni mirefu, ya thamani kubwa na ni vigumu kutoka, hivyo masharti yake ya kisheria yanaunda taasisi kwa miaka mingi.
- Viongozi wa sheria hufanya kazi kwa karibu na bodi, afisa wa ulinzi wa data, na wenzake wa usalama wa kitabibu na usimamizi wa taarifa.
levels:
- title: Naibu mkuu wa huduma za sheria
  summary: Manaibu wakuu wa huduma za sheria huongoza eneo kubwa la kitengo cha sheria, kama vile sheria ya biashara, teknolojia na data, na humwakilisha mkuu wa huduma za sheria.
  responsibilities:
  - Kuongoza eneo kubwa la kazi ya kisheria, kama vile sheria ya biashara, teknolojia na data, au migogoro na ajira.
  - Kuwashauri wakurugenzi kuhusu mambo yenye hatari kubwa, ikiwemo ununuzi mkubwa na programu za data.
  - Kusimamia jopo la mawakili wa nje na bajeti ya ushauri wa nje wa kisheria.
  - Kuweka viwango vya kisheria, violezo na mafunzo kwa taasisi.
  - Kuongoza na kuendeleza timu kadhaa za kisheria au wataalamu.
  - Kumwakilisha mkuu wa huduma za sheria.
  qualifications:
  - Wakili aliyehitimu na kuruhusiwa kufanya mazoezi, mwenye uzoefu mpana baada ya kuhitimu, ikiwemo kuongoza timu ya kisheria.
  job_evaluation_notes: Maarifa ni kiwango cha 8 kwa maarifa ya kitaalamu katika maeneo kadhaa ya sheria. Rasilimali za taarifa ni kiwango cha 5 badala ya 6, kwa sababu kazi haisimamii mifumo ya taarifa ya taasisi nzima.
- title: Mkuu wa huduma za sheria
  summary: Wakuu wa huduma za sheria huongoza kitengo cha sheria cha taasisi, huweka mtazamo wake wa hatari za kisheria, na kuwashauri watendaji na bodi.
  responsibilities:
  - Kuongoza kitengo cha sheria cha ndani na matumizi ya mawakili wa nje.
  - Kuwashauri watendaji na bodi kuhusu hatari za kisheria, wajibu wa kisheria na maamuzi makubwa.
  - Kuweka kiwango cha taasisi cha kukubali hatari za kisheria na misimamo kuhusu masuala muhimu, kama vile matumizi ya data na kuingia mikataba.
  - Kuongoza kazi ya kisheria kuhusu mambo muhimu zaidi, kama vile migogoro mikubwa, uchunguzi wa umma na ushirikiano.
  - Kushikilia bajeti ya huduma za sheria na kuonyesha thamani ya fedha.
  - Kuongoza na kuendeleza timu ya sheria na uendeshaji wa sheria.
  qualifications:
  - Wakili aliyehitimu na kuruhusiwa kufanya mazoezi, mwenye uzoefu mpana wa uandamizi wa kuongoza huduma za sheria.
  job_evaluation_notes: Rasilimali za fedha ni kiwango cha 4 kwa sababu kazi inashikilia bajeti ya huduma za sheria, si bajeti za huduma kadhaa.
- title: Mshauri mkuu wa sheria
  summary: Washauri wakuu wa sheria ni wanasheria waandamizi zaidi wa taasisi, wenye wajibu wa kitaasisi kwa huduma za sheria na hatari za kisheria, na mara nyingi pia huongoza usimamizi wa kampuni kama katibu wa bodi.
  responsibilities:
  - Kushikilia wajibu wa kitaasisi kwa masuala ya kisheria na hatari za kisheria za taasisi.
  - Kumshauri mwenyekiti na bodi kuhusu mamlaka, wajibu na usimamizi wa taasisi.
  - Kuhakikisha mikakati mikubwa, ushirikiano na programu za data ni halali.
  - Kuongoza majibu kwa vitisho vikubwa zaidi vya kisheria, kama vile mapitio ya kimahakama na hatua za udhibiti.
  - Kuongoza huduma za sheria, na mara nyingi usimamizi wa kampuni na sekretarieti ya bodi.
  - Kuiwakilisha taasisi kwa wadhibiti, washirika na vyombo vya serikali.
  qualifications:
  - Wakili aliyehitimu na kuruhusiwa kufanya mazoezi, mwenye uzoefu mpana katika ngazi ya utendaji au ya bodi.
  job_evaluation_notes: Rasilimali za fedha ni kiwango cha 4 kwa sababu kazi inashikilia bajeti ya huduma za sheria na usimamizi, si fedha za taasisi.
