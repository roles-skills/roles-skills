summary: Wasanifu wa biashara hujenga mtazamo ulio wazi na ulioungana wa jinsi taasisi inavyotoa huduma za afya na matunzo, yaani uwezo wake, huduma, njia za matunzo, michakato na taarifa. Hutumia mtazamo huo kuonyesha mahali mabadiliko yanapohitajika, kuunganisha mkakati na programu, na kuhakikisha mabadiliko ya kidijitali yanaboresha matunzo kwa wagonjwa na maisha ya kazi ya madaktari na wafanyakazi wa matunzo.
health_context:
- Njia za matunzo huvuka timu, mazingira na taasisi, hivyo wasanifu wa biashara huunda miundo ya huduma kutoka mtazamo wa mgonjwa, si kwa idara tu.
- Mabadiliko katika michakato ya kitabibu yanaweza kuathiri usalama wa mgonjwa na mzigo wa kazi wa wafanyakazi, hivyo miundo hujengwa pamoja na madaktari na wafanyakazi wa matunzo na kukaguliwa dhidi ya mazoezi halisi.
- Mkakati wa afya na matunzo huundwa na sera, udhibiti na kanuni za ufadhili, ambazo wasanifu lazima wazigeuze kuwa mabadiliko ya vitendo ya uwezo.
- Uwezo mwingi hushirikiwa na taasisi washirika, hivyo wasanifu husaidia kukubaliana nani anafanya nini na mahali ambapo taarifa lazima zitiririke.
levels:
- title: Msanifu wa biashara mwanafunzi
  responsibilities:
  - Kujifunza mbinu za usanifu wa biashara, kama vile uundaji wa miundo ya uwezo, mnyororo wa thamani na michakato, kupitia mafunzo na mazoezi.
  - Kukusanya taarifa kuhusu huduma na njia za matunzo kupitia mahojiano, nyaraka na uchunguzi.
  - Kuandaa rasimu za ramani za uwezo na miundo ya michakato kwa mwongozo wa wasanifu wa biashara.
  - Kusaidia kuendesha warsha na madaktari, wafanyakazi wa matunzo na mameneja, na kuandika matokeo.
  qualifications:
  - Shahada au uzoefu unaolingana katika biashara, uchambuzi, au somo linalohusiana.
  - Mafunzo maalumu ya mbinu za usanifu wa biashara, katika kiwango cha stashahada ya uzamili au uzoefu unaolingana.
  job_evaluation_notes: "Imewekwa katika daraja la juu zaidi ya pendekezo la daraja la UK GDaD PCF (Daraja la 5): matangazo ya sekta ya afya yanaweka nafasi hii katika Daraja la 6. Maarifa yamepewa alama ya kiwango ambacho kazi inahitaji mara mafunzo yanapokuwa yamekamilika vya kutosha kufanya kazi."
- title: Msanifu msaidizi wa biashara
  responsibilities:
  - Kuunda miundo ya uwezo, huduma na njia za matunzo kwa sehemu ya taasisi.
  - Kuchambua miundo kupata mapengo, urudufu na kero kwa wagonjwa na wafanyakazi.
  - Kuleta pamoja taarifa kutoka timu na taasisi tofauti ili kuongoza maamuzi ya mabadiliko.
  - Kueleza matatizo tata ya huduma kwa wadau kwa kutumia miundo iliyo wazi na lugha rahisi.
  - Kuweka hazina ya usanifu wa biashara ikiwa sahihi na iliyounganishwa na miundo ya programu na data.
  qualifications:
  - Maarifa maalumu ya usanifu wa biashara au uchambuzi wa biashara, katika kiwango cha shahada ya uzamili au uzoefu unaolingana.
  - Uzoefu wa uchambuzi wa biashara au usanifu wa huduma.
  job_evaluation_notes: "Imewekwa katika daraja la juu zaidi ya pendekezo la daraja la UK GDaD PCF (Daraja la 6): matangazo ya sekta ya afya yanaweka nafasi hii katika Daraja la 7. Maarifa yamepewa alama ya kiwango cha shahada ya uzamili au kinacholingana, kwa sababu kazi inaunda miundo na kuchambua huduma na njia za matunzo katika timu na taasisi."
- title: Msanifu wa biashara
  responsibilities:
  - Kuendeleza usanifu wa sasa na lengwa wa biashara kwa eneo kubwa la huduma, kama vile huduma za dharura au huduma za jamii.
  - Kugeuza mkakati na sera kuwa mabadiliko ya uwezo na ramani ya mabadiliko.
  - Kukagua kama wigo wa programu na mradi unalingana na usanifu lengwa wa biashara.
  - Kufanya kazi na viongozi wa kitabibu kutathmini jinsi mabadiliko yanayopendekezwa yanavyoathiri njia za matunzo, usalama na mzigo wa kazi wa wafanyakazi.
  - Kuwaongoza wasanifu wengine wa biashara katika mbinu na zana.
  qualifications:
  - Uzoefu mkubwa wa usanifu wa biashara, uchambuzi wa biashara, au usanifu wa huduma, katika kiwango kinacholingana na shahada ya uzamili.
  job_evaluation_notes: "Imewekwa katika daraja la juu zaidi ya pendekezo la daraja la UK GDaD PCF (Daraja la 7): matangazo ya sekta ya afya yanaweka nafasi hii katika Daraja la 8a. Mipango, sera na uhuru wa kutenda vimepewa alama za juu zaidi ya wasifu wa Daraja la 7 kwa sababu kazi inageuza mkakati kuwa ramani ya mabadiliko kwa eneo kubwa la huduma."
- title: Msanifu kiongozi wa biashara
  responsibilities:
  - Kuongoza mazoezi ya usanifu wa biashara na kuwajibika kwa matokeo yake.
  - Kutunza mtazamo wa taasisi nzima wa uwezo, huduma na njia za matunzo, na kuufanya uwe rahisi kueleweka.
  - Kuwashauri wakurugenzi kuhusu vipaumbele vya mabadiliko na jinsi majalada ya uwekezaji yanavyolingana na mkakati.
  - Kufanya kazi na taasisi washirika kukubaliana uwezo na majukumu ya pamoja katika njia za matunzo.
  - Kuongoza na kuendeleza wasanifu wa biashara.
  qualifications:
  - Uzoefu mpana wa kuongoza usanifu wa biashara katika taasisi tata.
