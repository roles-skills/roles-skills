summary: Бухгалтеры по финансовой отчётности обеспечивают полноту и точность отчётности организации и её соответствие стандартам бухгалтерского учёта и правилам отчётности государственного сектора. Они ведут баланс, готовят годовую отчётность и обязательные отчёты, управляют денежными средствами и казначейством, учитывают активы и работают с аудиторами. В организации цифрового здравоохранения значительная сложность связана с учётом программного обеспечения, информационных активов, облачных решений и многолетних технологических договоров.
health_context:
- Учёт цифровых расходов требует профессионального суждения, например можно ли считать капитальными активами разработку программного обеспечения, настройку облачных услуг или лицензии.
- Организация должна отчитываться перед источниками финансирования и надзорными органами за государственные средства, часто в рамках строгих лимитов капитальных расходов и денежных средств.
- Многолетние договоры на лицензии и поддержку создают расходы будущих периодов, обязательства, а иногда и аренду, которые нужно правильно учитывать.
- Нематериальные активы, такие как программное обеспечение, создаваемое организацией, требуют оценки, амортизации и проверки на обесценение по мере изменения продуктов.
- Внешний аудит государственных организаций тщателен и публичен, поэтому доказательства и рабочие документы должны быть высокого качества.
levels:
- title: Стажёр бухгалтера по финансовой отчётности
  summary: Стажёры бухгалтера по финансовой отчётности готовят сверки балансовых счетов, проводки и рабочие документы для отчётности, одновременно получая признанную бухгалтерскую квалификацию.
  responsibilities:
  - Готовить сверки балансовых счетов и закрывать расхождения.
  - Делать проводки на конец месяца и года, такие как начисления, расходы будущих периодов и амортизация.
  - Вести реестр основных средств, включая программные и аппаратные активы.
  - Готовить рабочие документы и доказательства для годовой отчётности и аудита.
  - Готовить информацию о движении денежных средств и банковские сверки.
  - Получать признанную бухгалтерскую квалификацию.
  qualifications:
  - Высшее образование или бухгалтерская квалификация среднего уровня и получение признанной бухгалтерской квалификации либо равноценный опыт.
  job_evaluation_notes: Знания оцениваются на уровне, который требуется должности, когда обучение продвинулось достаточно для выполнения работы.
- title: Бухгалтер по финансовой отчётности
  summary: Бухгалтеры по финансовой отчётности — квалифицированные бухгалтеры, которые ведут баланс и готовят разделы годовой отчётности, обязательных отчётов и налоговых деклараций.
  responsibilities:
  - Вести закрытие баланса на конец месяца и года.
  - Готовить разделы годовой отчётности и пояснения к ней.
  - Учитывать капитальные расходы, включая решение о том, какие цифровые затраты можно капитализировать.
  - Готовить декларации по налогу с продаж и консультировать по налогообложению договоров.
  - Отвечать на вопросы аудиторов и согласовывать действия по их выводам.
  - Курировать и развивать стажёров-бухгалтеров.
  qualifications:
  - Признанная бухгалтерская квалификация или равноценный опыт.
- title: Старший бухгалтер по финансовой отчётности
  summary: Старшие бухгалтеры по финансовой отчётности руководят процессом подготовки годовой отчётности и учётом сложных областей, таких как нематериальные активы, аренда и облачные решения.
  responsibilities:
  - Планировать график подготовки годовой отчётности и внешнего аудита и руководить им.
  - Писать учётные записки по сложным суждениям, таким как капитализация затрат на разработку программного обеспечения или настройку облака.
  - Вести учёт капитальных вложений, включая сроки полезного использования, амортизацию и обесценение программных активов.
  - Вести прогнозирование денежных средств и выборку финансирования в пределах лимитов.
  - Готовить обязательные отчёты и отчёты для источников финансирования, такие как консолидационные отчёты и отчёты о капитальных вложениях.
  - Руководить небольшой командой бухгалтеров по финансовой отчётности и развивать её.
  qualifications:
  - Признанная бухгалтерская квалификация со значительным опытом после её получения или равноценное.
  job_evaluation_notes: Финансовые ресурсы на уровне 4, поскольку должность управляет денежной позицией организации и учётом капитальных вложений.
- title: Менеджер по финансовому учёту
  summary: Менеджеры по финансовому учёту ведут финансовый учёт, казначейство и налоги организации и обеспечивают наличие мер контроля и выполнение действий по итогам аудита.
  responsibilities:
  - Руководить функциями финансового учёта, казначейства и налогов.
  - Отвечать за учётную политику организации и её применение к новым видам расходов, таким как облачные услуги и услуги данных.
  - Управлять банковскими счетами, банковскими договорённостями и прогнозом движения денежных средств.
  - Управлять соблюдением налогового законодательства и налоговыми рисками, в том числе по технологическим договорам и общим сервисам.
  - Руководить реагированием на выводы внутреннего и внешнего аудита по финансовому учёту и контролю.
  - Линейно руководить бухгалтерами по финансовой отчётности и сотрудниками казначейства.
  qualifications:
  - Признанная бухгалтерская квалификация с обширным опытом после её получения.
  job_evaluation_notes: Финансовые ресурсы на уровне 5, поскольку должность управляет банковскими операциями, денежными средствами и активами организации по всем службам.
- title: Руководитель финансовой отчётности
  summary: Руководители финансовой отчётности руководят обязательной отчётностью, финансовым контролем, казначейством и налогами организации и являются основным контактным лицом для внешних аудиторов.
  responsibilities:
  - Руководить подготовкой годового отчёта и отчётности и представлять их комитету по аудиту.
  - Консультировать директоров и комитет по аудиту по существенным учётным суждениям и новым стандартам.
  - Отвечать за финансовые правила, финансовые процедуры и порядок делегирования полномочий.
  - Руководить отношениями с внешними аудиторами и надзорными органами по вопросам финансовой отчётности.
  - Устанавливать казначейскую и налоговую политику и управлять финансовыми рисками.
  - Руководить командами финансового учёта, казначейства и обработки операций и развивать их.
  qualifications:
  - Признанная бухгалтерская квалификация с обширным опытом после её получения, включая руководство обязательной отчётностью.
