summary: 'Технические архитекторы проектируют техническую структуру цифровых услуг здравоохранения организации: компоненты, платформы, хостинг, шаблоны интеграции и нефункциональные качества, такие как безопасность, производительность и отказоустойчивость. Они тесно работают с разработчиками и DevOps-инженерами, обеспечивают техническое руководство командам реализации и следят за тем, чтобы сервисы создавались надолго и были безопасны в эксплуатации.'
health_context:
- Клиническим сервисам часто нужны высокая доступность и быстрое восстановление, поэтому технические проекты должны предусматривать отказы и работу в деградированном режиме.
- Проекты должны по умолчанию защищать конфиденциальную информацию о здоровье с помощью шифрования, контроля доступа и аудита.
- Сервисы подключаются ко многим клиническим системам и общим платформам, часто через API HL7 FHIR и обмен сообщениями, поэтому шаблоны интеграции занимают центральное место в проекте.
- Технические проектные решения, такие как кеширование, повторные попытки и работа со временем, могут порождать клинические опасности, поэтому архитекторы участвуют в обоснованиях безопасности.
- Устаревшие клинические системы и медицинские изделия могут ограничивать выбор технологий, сетей и хостинга.
levels:
- title: Младший технический архитектор
  responsibilities:
  - Рисовать технические схемы и документировать компоненты, хостинг и интеграции существующих сервисов.
  - Под руководством изучать технологические варианты и обобщать их достоинства и недостатки.
  - Работать с разработчиками, чтобы проверять, что сборки соответствуют согласованным проектам и шаблонам.
  - Фиксировать технические решения и поддерживать проектные документы в актуальном состоянии.
  qualifications:
  - Высшее образование в области информатики или смежной области либо равноценный опыт в разработке программного обеспечения или инфраструктуры.
  - Специальные знания в области технического проектирования на уровне послевузовского диплома или равноценный опыт.
  job_evaluation_notes: 'Отнесён выше диапазона, предлагаемого по грейду UK GDaD PCF (диапазон 5): объявления о вакансиях в секторе здравоохранения относят эту роль к диапазону 6. Знания оцениваются на уровне послевузовского диплома, а информационные ресурсы на уровне 5, поскольку должность проектирует части крупных информационных систем.'
- title: Технический архитектор
  responsibilities:
  - Проектировать техническую архитектуру сервиса, включая компоненты, хостинг, интеграцию и безопасность.
  - Предоставлять командам реализации проектные шаблоны и проверять их технические проекты и структуру кода.
  - Определять вместе с владельцами сервисов нефункциональные требования, такие как целевые показатели доступности, производительности и восстановления.
  - Выявлять технический долг и неподдерживаемые технологии и планировать их устранение.
  - Выявлять технические опасности и меры контроля для обоснования клинической безопасности.
  qualifications:
  - Специальные знания в области технической архитектуры на уровне магистратуры или равноценный опыт.
  - Опыт проектирования или создания программного обеспечения или инфраструктуры в промышленной эксплуатации.
  job_evaluation_notes: Отнесён к диапазону 7, предлагаемому по грейду UK GDaD PCF, что соответствует объявлениям о вакансиях в секторе здравоохранения для этой роли. Знания оцениваются на уровне магистратуры или равноценном за специальные знания по всему спектру технической архитектуры.
- title: Старший технический архитектор
  responsibilities:
  - Руководить техническим проектированием крупных, сложных сервисов или сервисов высокого риска, таких как клинические системы и общие интеграционные платформы.
  - Задавать техническое направление для одной или нескольких команд реализации и оспаривать проекты, добавляющие риск.
  - Проектировать с учётом отказоустойчивости, аварийного восстановления и безопасной эксплуатации и проверять, что команды это тестируют.
  - Объяснять технические риски и компромиссы владельцам сервисов, клиническим руководителям и старшим заинтересованным лицам простым языком.
  - Наставлять технических архитекторов и старших разработчиков и проводить для них коучинг.
  qualifications:
  - Значительный опыт технического проектирования сложных сервисов на уровне, равноценном магистратуре.
  job_evaluation_notes: 'Отнесён выше диапазона, предлагаемого по грейду UK GDaD PCF (диапазон 7): объявления о вакансиях в секторе здравоохранения относят эту роль к диапазону 8a. Планирование, политика и свобода действий оцениваются выше профиля диапазона 7, поскольку должность задаёт техническое направление нескольким командам при минимальном надзоре.'
- title: Ведущий технический архитектор
  responsibilities:
  - Руководить технической архитектурой нескольких сервисов или команд, устанавливая общие шаблоны и стандарты.
  - Обеспечивать техническое качество проектов на архитектурных советах, включая безопасность, отказоустойчивость и совместимость.
  - Формировать технологическую дорожную карту организации вместе с корпоративными архитекторами и инженерными руководителями.
  - Консультировать старших руководителей по выбору технологий, инвестициям в платформы и техническим рискам.
  - Руководить техническими архитекторами и развивать их.
  qualifications:
  - Обширный опыт руководства технической архитектурой сложных сервисов.
- title: Главный технический архитектор
  responsibilities:
  - Устанавливать стратегию, принципы и стандарты технической архитектуры организации.
  - Управлять техническим проектированием во всей организации, включая технический архитектурный совет.
  - Консультировать исполнительную команду по крупным технологическим решениям, таким как стратегия хостинга и консолидация платформ.
  - Представлять организацию в межорганизационных технических сообществах и сообществах по стандартам.
  - Вдохновлять и развивать архитекторов во всей организации.
  qualifications:
  - Обширный опыт руководства технической архитектурой в нескольких командах или организациях.
