summary: Сотрудники по коммуникациям помогают организации объяснять, что она делает, сотрудникам, пациентам, общественности, партнёрам и СМИ. Они пишут и публикуют материалы, ведут внутренние коммуникации и кампании, управляют цифровыми каналами и социальными сетями, обрабатывают запросы СМИ и защищают репутацию организации, особенно во время инцидентов и перебоев в работе.
health_context:
- Коммуникации об услугах здравоохранения должны быть точными, понятными и доступными, поскольку пациенты могут действовать по ним.
- Кампании часто направлены на изменение поведения, например на то, чтобы побудить пациентов и работников сферы ухода пользоваться новой цифровой услугой.
- Перебои в работе услуг, киберинциденты и утечки данных требуют быстрых и взвешенных коммуникаций с пациентами, сотрудниками, партнёрами и СМИ.
- Истории о пациентах требуют согласия и защиты конфиденциальности.
levels:
- title: Специалист по коммуникациям
  summary: Пишет и публикует материалы для внутренних и внешних каналов и поддерживает команду по коммуникациям в рутинной работе со СМИ и кампаниями.
  responsibilities:
  - Писать и редактировать новости, материалы интранета, рассылки и публикации в социальных сетях.
  - Публиковать утверждённые материалы на сайте, в интранете и в социальных сетях.
  - Регистрировать запросы СМИ и отслеживать освещение.
  - Поддерживать кампании и мероприятия материалами и организацией.
  - Проверять материалы на точность, доступность и простоту языка.
  qualifications:
  - Опыт написания текстов для разных аудиторий, или квалификация в области коммуникаций или смежной области, или равноценный опыт.
- title: Старший специалист по коммуникациям
  summary: Планирует и проводит коммуникации для проектов и служб, обрабатывает рутинные запросы СМИ и управляет каналами.
  responsibilities:
  - Планировать и проводить коммуникации для проектов и изменений в службах.
  - Отвечать на рутинные запросы СМИ и готовить проекты пресс-релизов и заявлений.
  - Управлять контент-планами цифровых каналов и социальных сетей и отчитываться о результатах.
  - Писать кейсы, включая истории пациентов, с их согласия.
  - Консультировать коллег по ясному изложению для пациентов и общественности.
  - Проводить коучинг для специалистов по коммуникациям.
  qualifications:
  - Высшее образование или квалификация в области коммуникаций или смежной области либо равноценный опыт.
- title: Ведущий специалист по коммуникациям
  summary: Руководит коммуникациями крупной программы или области, такой как внутренние коммуникации или цифровые каналы, и ведёт деликатную работу со СМИ.
  responsibilities:
  - Руководить коммуникациями и вовлечением для крупной программы, такой как новая клиническая система.
  - Планировать и оценивать кампании, побуждающие пациентов и сотрудников осваивать цифровые услуги.
  - Обрабатывать деликатные запросы СМИ и готовить спикеров.
  - Планировать коммуникации на случай инцидентов и перебоев в работе услуг вместе с операционными командами.
  - Консультировать руководителей о том, как сообщать об изменениях и доносить трудные сообщения.
  - Курировать специалистов по коммуникациям.
  qualifications:
  - Высшее образование или профессиональная квалификация в области коммуникаций либо равноценный опыт.
  - Опыт планирования и оценки кампаний.
- title: Менеджер по коммуникациям
  summary: Руководит работой и каналами команды по коммуникациям и ведёт работу со СМИ и коммуникации во время инцидентов.
  responsibilities:
  - Руководить командой по коммуникациям, её планом работы и бюджетом.
  - Руководить реактивной и проактивной работой со СМИ, в том числе во время инцидентов и утечек данных.
  - Управлять каналами, брендом и стандартами материалов организации.
  - Консультировать директоров по коммуникационным и репутационным рискам.
  - Оценивать коммуникации и отчитываться об их эффекте.
  - Работать с организациями-партнёрами над совместными коммуникациями.
  qualifications:
  - Профессиональная квалификация в области коммуникаций или равноценный опыт.
  - Значительный опыт работы со СМИ и управления коммуникациями.
  job_evaluation_notes: Эмоциональная нагрузка отражает эпизодическую работу с тяжёлыми материалами во время инцидентов и в историях пациентов.
- title: Руководитель коммуникаций
  summary: Руководит коммуникациями и вовлечением организации, устанавливает их стратегию и консультирует совет директоров по вопросам репутации.
  responsibilities:
  - Устанавливать стратегию коммуникаций и вовлечения организации.
  - Руководить коммуникационной функцией, развивать её и управлять её бюджетом.
  - Консультировать главного исполнительного директора и совет директоров по вопросам репутации, взаимодействия с заинтересованными сторонами и коммуникационных рисков.
  - Руководить кризисными коммуникациями во время крупных инцидентов.
  - Выстраивать отношения со старшими партнёрами, журналистами и группами пациентов.
  - Формировать то, как организация объясняет общественности свои цифровые услуги и использование данных.
  qualifications:
  - Профессиональная квалификация в области коммуникаций или равноценный опыт.
  - Обширный опыт руководства коммуникациями сложной организации.
