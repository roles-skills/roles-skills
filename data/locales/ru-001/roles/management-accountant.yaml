summary: Управленческие бухгалтеры дают руководителям финансовую информацию и советы, необходимые для планирования, контроля расходов и принятия правильных решений. Они устанавливают бюджеты и контролируют их, прогнозируют расходы, рассчитывают стоимость услуг и готовят финансовое обоснование инвестиций. В организации цифрового здравоохранения они тесно работают с цифровыми программами и продуктовыми командами, где правильный учёт капитальных и текущих расходов, затрат за весь жизненный цикл и эффективности расходования средств является основой хороших решений.
health_context:
- Цифровые программы часто финансируются из сочетания капитальных и текущих средств, целевого или ограниченного по времени финансирования, у каждого из которых свои правила расходования.
- Переход от собственных систем к облачным услугам и подпискам переносит затраты из капитальных в текущие, что влияет на бюджеты, бизнес-обоснования и заявки на финансирование.
- Инвестиционные решения должны показывать эффективность расходования государственных средств и выгоды для пациентов, клиницистов и работников сферы ухода, а не только финансовую экономию.
- Договоры на программное обеспечение, хостинг и поддержку часто действуют несколько лет, поэтому прогнозы должны включать эксплуатационные расходы ещё долго после запуска.
- Распорядители бюджета в цифровых и клинических командах могут не быть специалистами по финансам, поэтому понятные практические советы составляют значительную часть работы.
levels:
- title: Стажёр управленческого бухгалтера
  summary: Стажёры управленческого бухгалтера, которых иногда называют финансовыми аналитиками, готовят бюджетные отчёты и аналитику для группы распорядителей бюджета, одновременно получая признанную бухгалтерскую квалификацию.
  responsibilities:
  - Готовить ежемесячные бюджетные отчёты для группы распорядителей бюджета и объяснять основные отклонения.
  - Делать проводки, начисления и исправления на конец месяца, чтобы отчёты были точными.
  - Проверять правильность отнесения расходов на центры затрат, проекты, капитальные и текущие расходы.
  - Собирать прогнозную информацию и обновлять прогнозы вместе с распорядителями бюджета.
  - Под руководством готовить информацию о затратах для бизнес-обоснований.
  - Получать признанную бухгалтерскую квалификацию.
  qualifications:
  - Высшее образование или бухгалтерская квалификация среднего уровня и получение признанной бухгалтерской квалификации либо равноценный опыт.
  job_evaluation_notes: Знания оцениваются на уровне, который требуется должности, когда обучение продвинулось достаточно для выполнения работы. Финансовые ресурсы на уровне 3 за контроль делегированных бюджетов.
- title: Управленческий бухгалтер
  summary: Управленческие бухгалтеры — квалифицированные бухгалтеры, которые ведут формирование, контроль и прогнозирование бюджета дирекции или группы служб и консультируют распорядителей бюджета по их финансам.
  responsibilities:
  - Руководить ежемесячным циклом отчётности и прогнозирования дирекции или группы служб.
  - Консультировать распорядителей бюджета по расходам, рискам и действиям, чтобы остаться в пределах бюджета.
  - Готовить годовые бюджеты, включая расходы на персонал, договоры и лицензии.
  - Применять правила капитальных и текущих расходов к цифровым расходам, таким как разработка программного обеспечения, лицензии и оборудование.
  - Строить финансовые модели для бизнес-обоснований и оценки вариантов.
  - Курировать и развивать стажёров-бухгалтеров.
  qualifications:
  - Признанная бухгалтерская квалификация или равноценный опыт.
- title: Старший управленческий бухгалтер
  summary: Старшие управленческие бухгалтеры руководят финансовым управлением крупной дирекции или крупной цифровой программы, включая сложное прогнозирование, калькуляцию затрат и бизнес-обоснования.
  responsibilities:
  - Руководить формированием бюджета и прогнозированием крупной дирекции или крупной цифровой программы.
  - Моделировать сценарии, такие как изменения финансирования, задержки реализации и переход от капитальных затрат к расходам на облачные подписки.
  - Руководить финансовым обоснованием значимых инвестиций, включая затраты за весь жизненный цикл, выгоды и эффективность расходования средств.
  - Строить калькуляцию затрат на услуги и продукты, например полную стоимость эксплуатации цифровой услуги.
  - Представлять финансовые результаты и риски старшим руководителям и советам программ.
  - Руководить небольшой командой бухгалтеров и стажёров.
  qualifications:
  - Признанная бухгалтерская квалификация со значительным опытом после её получения или равноценное.
  job_evaluation_notes: Финансовые ресурсы на уровне 4, поскольку должность устанавливает бюджет дирекции или программы вместе с её распорядителями бюджета.
- title: Финансовый бизнес-партнёр
  summary: Финансовые бизнес-партнёры работают в составе руководства дирекции, часто цифровых технологий, данных и технологий, превращая финансовую информацию в решения и обеспечивая эффективность инвестиций.
  responsibilities:
  - Выступать старшим финансовым консультантом руководящей команды дирекции, например цифровых технологий, данных и технологий.
  - Руководить финансовым планом дирекции, связывая расходы с приоритетами, персоналом и инвестициями.
  - Оспаривать и поддерживать руководителей в вопросах эффективности расходования средств, включая расходы на поставщиков, использование лицензий и затраты на облако.
  - Руководить бизнес-обоснованиями крупных цифровых инвестиций и представлять финансовую службу на инвестиционных советах.
  - Обеспечивать соответствие цифровых расходов правилам финансирования, контролю расходов и лимитам капитальных и текущих расходов.
  - Линейно руководить управленческими бухгалтерами, обслуживающими дирекцию.
  qualifications:
  - Признанная бухгалтерская квалификация с обширным опытом после её получения, включая бизнес-партнёрство.
  job_evaluation_notes: Финансовые ресурсы на уровне 5, поскольку должность устанавливает бюджеты нескольких служб дирекции.
- title: Руководитель управленческого учёта
  summary: Руководители управленческого учёта руководят формированием бюджета, прогнозированием и управленческой отчётностью организации, а также командой бизнес-партнёров и бухгалтеров, которая их обеспечивает.
  responsibilities:
  - Руководить ежегодным формированием бюджета организации и прогнозированием в течение года.
  - Проектировать управленческую отчётность, калькуляцию затрат и информацию о результатах для совета директоров и исполнительного руководства.
  - Устанавливать стандарты бизнес-обоснований и оценки инвестиций, в том числе цифровых.
  - Консультировать директоров по финансовым рискам, планам экономии и выбору, необходимому, чтобы остаться в рамках финансирования.
  - Руководить командами бизнес-партнёрства и управленческого учёта и развивать их.
  - Улучшать инструменты бюджетирования и отчётности, включая отчётность самообслуживания для распорядителей бюджета.
  qualifications:
  - Признанная бухгалтерская квалификация с обширным опытом после её получения, включая руководство финансовой командой.
