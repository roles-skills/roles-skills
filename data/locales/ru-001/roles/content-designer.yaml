summary: Контент-дизайнеры делают информацию и услуги здравоохранения и ухода понятными, чтобы пациенты, лица, осуществляющие уход, клиницисты и работники сферы ухода могли понять, что им нужно знать и делать. Они проектируют контент на основе доказательств потребностей пользователей, пишут простым языком, работают с клиническими экспертами над точностью и ведут контент на протяжении всей его жизни, от создания до пересмотра и снятия с публикации.
health_context:
- Люди часто читают контент о здоровье, когда они встревожены, нездоровы или торопятся, поэтому контент должен быть лёгким для понимания и действий для людей с низкой грамотностью в вопросах здоровья.
- Неверная или устаревшая информация о здоровье может причинить вред, поэтому контент-дизайнеры следуют процессу клинической проверки со сроками пересмотра и назначенными клиническими рецензентами.
- Некоторые темы деликатны или связаны с высоким риском, такие как неотложные симптомы, психическое здоровье, лекарства и помощь в конце жизни, поэтому контент-дизайнеры тесно работают с клиницистами и исследователями пользователей над тоном и точностью.
- Клиническим системам тоже нужен понятный контент, такой как подписи, инструкции и оповещения, поэтому контент-дизайнеры помогают снижать число ошибок в клинических процессах.
- Контент о здоровье должен быть доступным и инклюзивным, в том числе для людей, использующих вспомогательные технологии, читающих на другом языке или нуждающихся в форматах лёгкого чтения.
levels:
- title: Младший контент-дизайнер
  responsibilities:
  - Осваивать методы контент-дизайна, руководство по стилю и процесс клинической проверки через обучение и работу под надзором.
  - Выполнять стандартные проверки, литературную правку и обновление существующего контента.
  - Публиковать контент в системе управления контентом, соблюдая шаги проверки.
  - Проверять контент на доступность, например заголовки, тексты ссылок и альтернативный текст.
  qualifications:
  - Получение квалификации или прохождение программы ученичества в соответствующей области либо равноценный опыт.
- title: Контент-дизайнер начального уровня
  responsibilities:
  - Под руководством более старших контент-дизайнеров писать и обновлять контент о здоровье и контент услуг.
  - Использовать исследования и данные, чтобы определять, что пользователям нужно знать и какие слова они используют.
  - Работать с клиническими рецензентами над проверкой точности и объяснять медицинские термины простым языком.
  - Поддерживать публикацию контента, сроки пересмотра и администрирование контент-команды.
  qualifications:
  - Высшее образование или соответствующая квалификация либо равноценный опыт написания текстов для интернета.
- title: Контент-дизайнер
  responsibilities:
  - Проектировать контент для всего пути пользователя, например поиска услуги, подготовки к приёму и последующего ухода.
  - Проектировать контент для клинических систем, такой как подписи, инструкции и оповещения, чтобы снижать вероятность ошибки.
  - Согласовывать точность с клиническими экспертами, сохраняя ясность и удобство контента.
  - Тестировать контент с пользователями, включая людей с низкой грамотностью в вопросах здоровья и людей, использующих вспомогательные технологии.
  - Вносить вклад в руководство по стилю и шаблоны контента.
  qualifications:
  - Высшее образование или соответствующая квалификация либо равноценный опыт.
  - Опыт проектирования контента для цифровых услуг.
- title: Старший контент-дизайнер
  responsibilities:
  - Разрабатывать контент-стратегию для крупных или заметных областей, таких как крупная группа заболеваний или кампания общественного здравоохранения.
  - Проектировать контент на деликатные темы и темы высокого риска, такие как неотложные симптомы, психическое здоровье и помощь в конце жизни.
  - Выстраивать клиническую проверку, источники доказательств и циклы пересмотра для массива контента о здоровье.
  - Проверять работу других для обеспечения качества и руководить контент-дизайнерами или наставлять их.
  - Писать и описывать пользовательские истории вместе с командой.
  qualifications:
  - Значительный опыт контент-дизайна на уровне, равноценном магистратуре.
  job_evaluation_notes: Эмоциональная нагрузка на уровне 2, поскольку старшие контент-дизайнеры регулярно работают с тяжёлыми темами, такими как серьёзные заболевания, самоповреждения и утрата близких.
- title: Ведущий контент-дизайнер
  responsibilities:
  - Руководить командой контент-дизайнеров и обеспечивать качество контента в нескольких командах.
  - Обеспечивать соответствие контента о здоровье стандартам клинической проверки, доступности и стиля.
  - Работать со старшими клиническими, коммуникационными и продуктовыми руководителями над обеспечением команд ресурсами и решением проблем контента.
  - Руководить контентом для самой деликатной информации организации или информации высокого риска.
  - Линейно руководить контент-дизайнерами и развивать их.
  qualifications:
  - Обширный опыт руководства контент-дизайном в нескольких командах.
  job_evaluation_notes: Уровня в диапазоне 8a нет, поскольку UK GDaD PCF относит ведущего контент-дизайнера к G7 или G6, а этот справочник следует предлагаемому диапазону 8b. Политика на уровне 5, поскольку ведущий устанавливает стандарты контента для ряда услуг; эмоциональная нагрузка на уровне 2, как и у старших контент-дизайнеров.
- title: Руководитель направления контент-дизайна
  responsibilities:
  - Разрабатывать контент-стратегию, отвечающую целям организации и потребностям пациентов и сотрудников.
  - Устанавливать стандарты организации для информационного контента о здоровье и его клинической проверки.
  - Руководить командой контент-дизайна, способной реализовать стратегию, включая подбор и развитие.
  - Работать со старшими клиническими и коммуникационными руководителями над управлением рисками информации о здоровье.
  - Расставлять приоритеты контентной работы во всей организации.
  qualifications:
  - Обширный опыт руководства контент-дизайном и контентной практикой.
  job_evaluation_notes: UK GDaD PCF относит и ведущего контент-дизайнера, и руководителя направления контент-дизайна к G7 или G6 с предлагаемым диапазоном 8b. Этот справочник относит руководителя направления к диапазону 8c, как и руководителей других профессий дизайна, ориентированного на пользователя, поскольку он устанавливает контент-стратегию и стандарты для всей организации.
