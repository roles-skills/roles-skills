summary: 'Администраторы поддерживают работу команд и служб, ведя повседневное администрирование организации: корреспонденцию, календари, встречи, записи, ввод данных, заказы и обращения. В организации цифрового здравоохранения они поддерживают цифровые, клинические и корпоративные команды и часто работают с конфиденциальной информацией о пациентах и сотрудниках.'
health_context:
- Администраторы часто видят конфиденциальную информацию о пациентах и сотрудниках, поэтому строго соблюдают правила управления информацией.
- Обращения могут поступать от пациентов, работников сферы ухода и общественности, и некоторые звонящие могут быть встревожены или расстроены.
- Точность записей и ввода данных важна, поскольку ошибки могут попадать в клинические системы, отчёты и платежи.
- Многие административные процессы переходят на цифровые инструменты, поэтому администраторы помогают тестировать и осваивать новые способы работы.
levels:
- title: Помощник администратора
  summary: Выполняет рутинные административные задачи для команды, следуя установленным процедурам при близком надзоре.
  responsibilities:
  - Отвечать на звонки и письма, точно записывать сообщения и передавать обращения нужному человеку.
  - Точно вводить и обновлять данные в системах команды.
  - Подшивать и сканировать документы и поддерживать порядок в общих папках.
  - Бронировать встречи и помещения и рассылать документы.
  - Заказывать канцелярские товары и материалы в рамках установленных процедур.
  qualifications:
  - Хорошие навыки грамотного письма, счёта и работы с клавиатурой.
  job_evaluation_notes: Физические навыки оцениваются на уровне 3 за продвинутые навыки работы с клавиатурой, со скоростью и точностью набора и ввода данных.
- title: Администратор
  summary: Оказывает полное административное обслуживание команде или службе, выполняя различные задачи, в том числе нерутинные, и самостоятельно организуя свою нагрузку.
  responsibilities:
  - Вести календари и организовывать встречи, мероприятия и поездки для команды.
  - Вести протоколы и записи действий на встречах команды и контролировать выполнение действий.
  - Обрабатывать рутинную корреспонденцию и обращения, при необходимости готовя проекты ответов.
  - Вести записи, трекеры и базы данных и готовить простые отчёты.
  - Обрабатывать заказы, счета и расходы в установленных пределах.
  - Показывать новым сотрудникам административные процедуры команды.
  qualifications:
  - Квалификация уровня 3 в области делового администрирования или равноценный опыт.
- title: Старший администратор
  summary: Руководит администрированием службы или дирекции, курируя других администраторов и улучшая административные процессы.
  responsibilities:
  - Координировать административное обслуживание дирекции, распределяя работу между администраторами.
  - Вести официальные протоколы управленческих и программных совещаний.
  - Писать и улучшать административные процедуры и шаблоны.
  - Готовить для руководителей отчёты из трекеров и систем.
  - Отслеживать расходы административных бюджетов и сообщать об отклонениях.
  - Обучать и курировать администраторов и учеников.
  qualifications:
  - Значительный административный опыт на уровне, равноценном прикладному высшему образованию.
