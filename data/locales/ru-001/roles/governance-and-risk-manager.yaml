summary: Сотрудники по корпоративному управлению и рискам обеспечивают хорошее управление организацией и контроль над её рисками. Они поддерживают совет директоров и его комитеты, ведут систему управления рисками и реестры, поддерживают порядок в политиках и реестрах корпоративного управления и координируют гарантии и аудит, чтобы руководители могли принимать обоснованные решения и показывать, что выполняют свои правовые и регуляторные обязанности.
health_context:
- Организации здравоохранения несут клинические, информационные, кибер-, финансовые и репутационные риски, поэтому система управления рисками должна сводить их вместе для совета директоров.
- Советы директоров должны показывать, что они уверены в безопасности пациентов и качестве, поэтому сотрудники по корпоративному управлению встраивают отчётность о клинической безопасности и качестве в работу комитетов.
- Регуляторы и аудиторы ожидают понятных записей о решениях, рисках, декларациях интересов и политиках.
- Серьёзные инциденты и сбои услуг требуют быстрой и хорошо задокументированной эскалации через структуру корпоративного управления.
levels:
- title: Специалист по корпоративному управлению
  summary: Поддерживает цикл корпоративного управления для комитетов и поддерживает в актуальном состоянии реестры рисков, политик и корпоративного управления.
  responsibilities:
  - Координировать заседания комитетов, перспективные планы, документы и протоколы.
  - Вести реестр рисков, напоминая владельцам рисков о пересмотре их рисков.
  - Поддерживать в актуальном состоянии реестры корпоративного управления, такие как декларации интересов, подарки и представительские расходы.
  - Вести реестр политик и отслеживать их пересмотр.
  - Координировать сбор доказательств для аудитов и отслеживать рекомендации аудита.
  - Отвечать на рутинные вопросы сотрудников о корпоративном управлении.
  qualifications:
  - Высшее образование или квалификация в области корпоративного управления либо равноценный опыт.
- title: Старший специалист по корпоративному управлению и рискам
  summary: Ведёт части системы корпоративного управления и рисков, консультируя дирекции по рискам и поддерживая старшие комитеты.
  responsibilities:
  - Вести процесс управления рисками для дирекций, оспаривая оценки рисков и меры контроля.
  - Готовить отчёты о рисках и гарантиях для старших комитетов.
  - Поддерживать старшие комитеты, включая комитет по аудиту и рискам, документами и официальными протоколами.
  - Проверять политики на соответствие системе политик, законодательству и обязанностям в области равенства.
  - Обучать руководителей процессам управления рисками и корпоративного управления.
  - Координировать ответ организации на запросы регуляторов и аудиторов.
  qualifications:
  - Высшее образование или профессиональная квалификация в области корпоративного управления или управления рисками либо равноценный опыт.
- title: Менеджер по корпоративному управлению и рискам
  summary: Руководит службой корпоративного управления и рисков, включая цикл заседаний совета директоров и комитетов, систему управления рисками и карту гарантий.
  responsibilities:
  - Вести цикл заседаний совета директоров и комитетов и руководить командой корпоративного управления.
  - Вести систему управления рисками организации и систему гарантий совета директоров.
  - Консультировать директоров по рискам, риск-аппетиту и эскалации.
  - Составлять карту гарантий по основным рискам организации и работать с внутренними и внешними аудиторами.
  - Поддерживать в актуальном состоянии регламенты, порядок делегирования полномочий и систему политик.
  - Координировать ответ корпоративного управления на серьёзные инциденты и запросы регуляторов.
  qualifications:
  - Профессиональная квалификация в области корпоративного управления или управления рисками либо равноценный опыт.
  - Значительный опыт в области корпоративного управления или управления рисками.
- title: Руководитель корпоративного управления
  summary: Руководит корпоративным управлением и рисками организации, часто выступая секретарём совета директоров, и консультирует председателя и совет директоров по вопросам корпоративного управления.
  responsibilities:
  - Проектировать систему корпоративного управления организации, включая совет директоров и его комитеты, и руководить ею.
  - Выступать секретарём совета директоров, консультируя председателя и совет директоров по корпоративному управлению, поведению и соблюдению требований.
  - Отвечать за систему управления рисками и риск-аппетит и консультировать совет директоров по стратегическим рискам.
  - Руководить подготовкой ежегодного заявления о корпоративном управлении и отчётностью о корпоративном управлении.
  - Руководить командой корпоративного управления, рисков и гарантий.
  - Представлять организацию перед регуляторами и аудиторами по вопросам корпоративного управления.
  qualifications:
  - Профессиональная квалификация в области корпоративного управления или равноценный опыт.
  - Обширный опыт руководства корпоративным управлением и рисками на уровне совета директоров.
