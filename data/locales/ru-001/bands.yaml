# Band outlines in Russian. Keys are the English band ids.
"1":
  title: Диапазон 1
  stage: Начальный
  knowledge: Базовые навыки чтения, письма и счёта; осваивает простые рутинные задачи на рабочем месте.
  autonomy: Выполняет чёткие инструкции; работа часто проверяется.
  scope: Собственные рутинные задачи.
  leadership: Нет.
  accountability: Точное выполнение рутинных задач.
"2":
  title: Диапазон 2
  stage: Поддержка
  knowledge: Знает распорядок и процедуры своего участка работы; может иметь начальную квалификацию.
  autonomy: Работает по установленным процедурам, при доступном надзоре.
  scope: Собственные задачи в составе команды.
  leadership: Может показывать новым сотрудникам рутинные задачи.
  accountability: Качество и своевременность собственной рутинной работы.
"3":
  title: Диапазон 3
  stage: Поддержка
  knowledge: Знание ряда процедур, в том числе нерутинных; как правило, квалификация уровня 3 или равноценный опыт.
  autonomy: Работает в рамках процедур; сам решает, как организовать свою работу; передаёт проблемы наверх.
  scope: Собственная работа и некоторые задачи для всей команды.
  leadership: Может распределять рутинную работу или обучать других процедурам.
  accountability: Точность собственной работы и ведущихся записей.
"4":
  title: Диапазон 4
  stage: Поддержка и начинающий специалист
  knowledge: Подробное знание своего участка работы, как правило, на основе прикладного высшего образования, программы ученичества или равноценного опыта.
  autonomy: Работает в рамках руководящих указаний; решает большинство повседневных проблем; может обратиться за советом к руководителю.
  scope: Собственная работа и определённая услуга или процесс.
  leadership: Может руководить небольшой командой или координировать работу других.
  accountability: Предоставление определённой услуги или процесса.
"5":
  title: Диапазон 5
  stage: Специалист
  knowledge: Профессиональные или технические знания, как правило, на основе высшего образования или равноценного опыта.
  autonomy: Работает на общие цели в рамках профессиональных стандартов; планирует свою работу.
  scope: Собственная профессиональная работа в команде или продукте.
  leadership: Может направлять и проверять работу вспомогательного персонала и учеников.
  accountability: Качество собственной профессиональной работы.
"6":
  title: Диапазон 6
  stage: Опытный специалист
  knowledge: Специальные знания по ряду процедур, полученные благодаря дополнительному обучению или опыту.
  autonomy: Работает самостоятельно; толкует политику для своей области; обращается за советом по сложным вопросам.
  scope: Продукт, услуга или направление работы.
  leadership: Может руководить небольшой командой или наставлять коллег.
  accountability: Результаты своего направления работы и качество даваемых советов.
"7":
  title: Диапазон 7
  stage: Старший специалист или эксперт
  knowledge: Глубокие специальные знания, как правило, на уровне магистратуры или равноценного опыта.
  autonomy: Работает в рамках политики организации; решает, как достигаются результаты; является экспертом, с которым консультируются другие.
  scope: Несколько продуктов или услуг либо специализированная функция.
  leadership: Руководит командой или областью профессиональной практики.
  accountability: Предоставление услуги или специализированной функции и её бюджет, если он есть.
8a:
  title: Диапазон 8a
  stage: Ведущий
  knowledge: Экспертные знания дисциплины и управления ею.
  autonomy: Толкует политику организации для услуги; задаёт направление команды.
  scope: Область услуг или дисциплина в масштабе организации.
  leadership: Руководит командой или ведёт дисциплину без линейного управления.
  accountability: Область услуг, её персонал и её бюджет.
8b:
  title: Диапазон 8b
  stage: Ведущий
  knowledge: Экспертные знания в нескольких дисциплинах или в крупной услуге.
  autonomy: Формирует политику и стратегию для большой области.
  scope: Несколько услуг или команд либо дисциплина на уровне главного специалиста.
  leadership: Руководит руководителями или является главным авторитетом в дисциплине.
  accountability: Несколько услуг, их персонал и их бюджеты.
8c:
  title: Диапазон 8c
  stage: Старший руководитель
  knowledge: Экспертные знания и широкое понимание организации и отрасли.
  autonomy: Задаёт стратегию функции; подотчётен директору.
  scope: Функция или департамент.
  leadership: Руководит функцией через несколько уровней управления.
  accountability: Результаты, персонал и бюджет функции.
8d:
  title: Диапазон 8d
  stage: Старший руководитель
  knowledge: Стратегические знания по нескольким функциям и по всей системе здравоохранения и социальной помощи.
  autonomy: Формирует стратегию всей организации; замещает директора.
  scope: Крупная функция или несколько функций.
  leadership: Руководит несколькими функциями или крупным департаментом.
  accountability: Крупные функции, большие бюджеты и риски всей организации.
"9":
  title: Диапазон 9
  stage: Руководитель профессии или директор
  knowledge: Стратегическая экспертиза и руководство в масштабе всей системы.
  autonomy: Задаёт стратегию организации вместе с исполнительной командой.
  scope: Организация и её партнёры по всей системе.
  leadership: Руководит профессией или дирекцией.
  accountability: Результаты, бюджеты и риски всей организации.
