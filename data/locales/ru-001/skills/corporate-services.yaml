# Russian translations of data/skills/corporate-services.yaml. Keys are the English skill ids.
corp-administration:
  name: Офисное администрирование
  description: Ведение административных процессов, обеспечивающих работу команды или службы, таких как делопроизводство, заказы, ввод данных, ведение записей и соблюдение офисных процедур.
  levels:
    awareness: |
      Вы можете:
      - соблюдать офисные процедуры делопроизводства, заказов и ввода данных
      - вести точные записи о своей работе
    working: |
      Вы можете:
      - вести ряд административных процессов для команды при минимальном надзоре
      - замечать и исправлять ошибки в записях и данных
      - предлагать более простые способы работы
    practitioner: |
      Вы можете:
      - организовывать административную поддержку службы или дирекции
      - писать и улучшать административные процедуры
      - обучать других администраторов и проверять их работу
    expert: |
      Вы можете:
      - проектировать административные службы во всей организации
      - руководить переходом к более простым цифровым административным процессам
corp-office-software:
  name: Цифровые офисные инструменты
  description: Быстрое и точное использование текстовых редакторов, электронных таблиц, презентаций, электронной почты, совместных документов и инструментов для совместной работы.
  levels:
    awareness: |
      Вы можете:
      - создавать и редактировать документы, письма и простые электронные таблицы
      - хранить файлы и делиться ими в правильном месте
    working: |
      Вы можете:
      - быстро и точно готовить хорошо оформленные документы и презентации
      - использовать электронные таблицы для сортировки, фильтрации и обобщения данных
      - использовать инструменты совместной работы для управления общими документами и версиями
    practitioner: |
      Вы можете:
      - создавать шаблоны, трекеры и простые автоматизированные процессы
      - делать документы доступными для всех
      - помогать коллегам использовать офисные инструменты максимально эффективно
    expert: |
      Вы можете:
      - устанавливать стандарты для шаблонов, документооборота и инструментов совместной работы
      - руководить внедрением новых офисных инструментов во всей организации
corp-diary-and-meeting-management:
  name: Управление календарём и встречами
  description: Управление календарями, встречами и поездками, чтобы время людей использовалось с пользой, а на встречах были нужные люди, документы и помещения.
  levels:
    awareness: |
      Вы можете:
      - бронировать встречи и помещения с помощью инструментов организации
      - вовремя рассылать приглашения и документы
    working: |
      Вы можете:
      - вести календари команды, разрешая накладки
      - организовывать поездки, мероприятия и встречи с внешними партнёрами
      - обеспечивать готовность документов и действий до встреч
    practitioner: |
      Вы можете:
      - вести календарь старшего руководителя, согласовывая с ним приоритеты
      - решать, что требует его времени, а с чем могут справиться другие
      - планировать годовой цикл заседаний совета директоров или руководящей команды
    expert: |
      Вы можете:
      - вести рабочий цикл исполнительной команды
      - обеспечивать, чтобы время старших руководителей было сосредоточено на приоритетах организации
corp-minute-taking:
  name: Ведение протоколов и записей встреч
  description: Точная и краткая фиксация обсуждений, решений и действий и ведение официальных записей встреч.
  levels:
    awareness: |
      Вы можете:
      - записывать действия и решения на встречах команды
    working: |
      Вы можете:
      - писать точные и краткие протоколы и журналы действий для регулярных встреч
      - контролировать выполнение действий ответственными
    practitioner: |
      Вы можете:
      - вести официальные протоколы заседаний совета директоров и комитетов, включая сложные или спорные обсуждения
      - вести официальные записи встреч, выдерживающие аудит и расследование
      - консультировать председателей о том, что должна отражать запись
    expert: |
      Вы можете:
      - устанавливать стандарты официальных записей встреч во всей организации
      - обучать протоколистов и проверять качество их работы
corp-correspondence-management:
  name: Работа с корреспонденцией и обращениями
  description: Быстрая и вежливая обработка писем, электронных сообщений, звонков и обращений и их направление нужному человеку.
  levels:
    awareness: |
      Вы можете:
      - вежливо отвечать на звонки и письма и точно записывать сообщения
      - передавать обращения нужному человеку
    working: |
      Вы можете:
      - самостоятельно обрабатывать рутинную корреспонденцию и обращения
      - готовить проекты писем и ответов на подпись другим
      - вести журналы корреспонденции и добиваться ответов
    practitioner: |
      Вы можете:
      - вести корреспонденцию старшего руководителя, включая деликатные письма и жалобы
      - готовить проекты ответов, требующих такта, точности и суждения
      - обеспечивать соблюдение сроков ответов
    expert: |
      Вы можете:
      - устанавливать процесс и стандарты корреспонденции высшего руководства
      - вести самую деликатную корреспонденцию, в том числе с регуляторами, партнёрами и СМИ
corp-pmo-reporting:
  name: Поддержка проектного и портфельного офиса
  description: Ведение процессов проектного и портфельного офиса, таких как планы, реестры, отчётность, контроль документов и проверки гарантий.
  levels:
    awareness: |
      Вы можете:
      - хранить проектные документы в правильном месте с контролем версий
      - обновлять журналы действий, рисков и проблем по запросу
    working: |
      Вы можете:
      - вести планы, реестры и трекеры нескольких проектов
      - собирать сведения и готовить регулярные отчёты о статусе
      - проверять, что проекты следуют согласованному методу
    practitioner: |
      Вы можете:
      - проектировать портфельную отчётность и анализировать ход работ, риски и выгоды по проектам
      - проводить проверки гарантий и контрольные точки
      - консультировать руководителей проектов по методу и мерам контроля
    expert: |
      Вы можете:
      - создавать портфельный офис организации и руководить им
      - давать старшим руководителям ясное и надёжное представление о портфеле
      - устанавливать стандарты и инструменты управления проектами и портфелем
corp-assurance-and-audit:
  name: Гарантии и взаимодействие с аудитом
  description: Сбор подтверждений того, что меры контроля работают, поддержка внутренних и внешних аудитов и контроль выполнения рекомендаций аудита.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как в организации устроены аудиты и гарантии
      - предоставлять доказательства по запросу
    working: |
      Вы можете:
      - координировать сбор доказательств для аудитов и проверок
      - отслеживать рекомендации аудита и добиваться выполнения просроченных действий
    practitioner: |
      Вы можете:
      - планировать карту гарантий по основным рискам организации
      - работать с внутренними и внешними аудиторами над согласованием объёма и выводов
      - докладывать комитетам о пробелах в гарантиях
    expert: |
      Вы можете:
      - проектировать систему гарантий организации
      - консультировать комитет по аудиту и совет директоров о надёжности гарантий
corp-policy-management:
  name: Управление политиками
  description: Написание, пересмотр, утверждение и публикация политик и процедур организации и проверка того, что люди их соблюдают.
  levels:
    awareness: |
      Вы можете:
      - находить и соблюдать политики, применимые к вашей работе
    working: |
      Вы можете:
      - поддерживать реестр политик в актуальном состоянии и напоминать ответственным о пересмотре
      - проверять, что политики используют правильный шаблон и порядок утверждения
    practitioner: |
      Вы можете:
      - готовить и пересматривать политики вместе с профильными экспертами
      - проверять политики на соответствие законодательству, стандартам и обязанностям в области равенства
      - отслеживать соблюдение и сообщать о пробелах
    expert: |
      Вы можете:
      - устанавливать рамки политик организации
      - консультировать совет директоров по приоритетам и рискам в области политик
corp-internal-communications:
  name: Внутренние коммуникации
  description: Информирование и вовлечение сотрудников через такие каналы, как интранет, рассылки, брифинги и мероприятия, особенно в период изменений.
  levels:
    awareness: |
      Вы можете:
      - публиковать материалы во внутренних каналах, таких как интранет
      - соблюдать стиль и тон организации
    working: |
      Вы можете:
      - писать и редактировать новости, брифинги и рассылки для сотрудников
      - планировать контент для внутренних каналов и измерять вовлечённость
    practitioner: |
      Вы можете:
      - планировать внутренние коммуникации для крупных изменений, таких как новая клиническая система
      - консультировать руководителей о том, как вовлекать сотрудников и доносить трудные сообщения
      - использовать отзывы и данные для улучшения каналов
    expert: |
      Вы можете:
      - устанавливать стратегию внутренних коммуникаций и вовлечения сотрудников
      - консультировать исполнительную команду по вопросам культуры и вовлечённости
corp-media-relations:
  name: Работа со СМИ
  description: Выстраивание отношений с журналистами, обработка запросов СМИ, написание пресс-релизов и подготовка спикеров, в том числе во время инцидентов.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как организация обрабатывает запросы СМИ
      - сразу передавать запросы СМИ команде по коммуникациям
    working: |
      Вы можете:
      - регистрировать рутинные запросы СМИ и отвечать на них
      - готовить проекты пресс-релизов и заявлений на утверждение
      - отслеживать освещение в СМИ
    practitioner: |
      Вы можете:
      - обрабатывать деликатные и срочные запросы СМИ, в том числе об инцидентах или утечках данных
      - инструктировать и готовить спикеров
      - выстраивать отношения с журналистами, пишущими о здравоохранении и технологиях
    expert: |
      Вы можете:
      - руководить работой со СМИ во время крупных инцидентов и кризисов
      - защищать и укреплять репутацию организации среди ключевых заинтересованных сторон
      - консультировать совет директоров по репутационным рискам
corp-communications-strategy:
  name: Коммуникационная стратегия и планирование
  description: Планирование коммуникаций и кампаний, отвечающих целям организации, с использованием знаний об аудиториях и оценкой их эффекта.
  levels:
    awareness: |
      Вы можете:
      - объяснить цели коммуникационного плана, над которым вы работаете
    working: |
      Вы можете:
      - писать коммуникационные планы проектов с аудиториями, сообщениями и каналами
      - измерять результаты коммуникационной деятельности
    practitioner: |
      Вы можете:
      - планировать кампании, меняющие поведение, например побуждающие пациентов пользоваться цифровой услугой
      - использовать знания об аудитории и оценку для улучшения кампаний
      - планировать коммуникации на случай инцидентов и перебоев в работе услуг
    expert: |
      Вы можете:
      - устанавливать коммуникационную стратегию организации
      - руководить кризисными коммуникациями
      - консультировать совет директоров по репутации и взаимодействию с заинтересованными сторонами
corp-digital-and-social-media:
  name: Цифровые каналы и социальные сети
  description: Планирование, публикация и управление контентом на сайтах и в социальных сетях, взаимодействие с аудиториями и измерение результатов.
  levels:
    awareness: |
      Вы можете:
      - публиковать утверждённый контент в каналах организации
      - соблюдать политику в отношении социальных сетей
    working: |
      Вы можете:
      - планировать и публиковать контент для сайтов и социальных сетей
      - отвечать на комментарии и замечать проблемы, требующие эскалации
      - отчитываться о результатах каналов
    practitioner: |
      Вы можете:
      - управлять цифровыми каналами организации и их контент-планами
      - работать с негативными или вводящими в заблуждение публикациями, в том числе во время инцидентов
      - использовать аналитику для расширения охвата и вовлечённости
    expert: |
      Вы можете:
      - устанавливать стратегию и правила управления цифровыми каналами организации
      - руководить реагированием на репутационные риски в интернете
