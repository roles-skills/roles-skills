# Russian translations of data/skills/clinical-ig.yaml. Keys are the English skill ids.
clin-clinical-systems-optimisation:
  name: Проектирование и оптимизация клинических систем
  description: Проектирование, настройка и улучшение клинических систем, таких как электронные медицинские карты, системы электронных назначений и обмена заказами, чтобы они соответствовали клиническим процессам и поддерживали безопасную и эффективную помощь.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как клинические системы, такие как электронные медицинские карты, поддерживают оказание помощи
      - описать клинические процессы, которые поддерживает система
    working: |
      Вы можете:
      - составлять карты текущих и будущих клинических процессов вместе с клиницистами и работниками сферы ухода
      - тестировать настройку системы на клинических сценариях
      - писать понятные клинические требования для продуктовых команд
    practitioner: |
      Вы можете:
      - руководить клиническим проектированием настройки системы, форм, наборов назначений и поддержки принятия решений
      - использовать данные и отзывы пользователей, чтобы находить и устранять проблемы в процессах
      - находить баланс между клинической потребностью, безопасностью, удобством использования и ограничениями системы
    expert: |
      Вы можете:
      - устанавливать принципы и стандарты проектирования клинических систем для всей организации
      - руководить программами оптимизации, которые измеримо улучшают помощь и опыт сотрудников
      - консультировать старших руководителей о выборе клинических систем и их влиянии на помощь
clin-human-factors:
  name: Человеческий фактор и удобство использования клинических систем
  description: Применение методов человеческого фактора и удобства использования к клиническим системам, чтобы клиницисты, работники сферы ухода и пациенты могли пользоваться ими безопасно и с наименьшим числом ошибок.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как плохой дизайн может приводить к ошибкам в оказании помощи
      - сообщать о проблемах удобства использования, которые могут повлиять на безопасность пациентов
    working: |
      Вы можете:
      - участвовать в тестах удобства использования и симуляциях клинических задач
      - замечать типичные опасности дизайна, такие как похожие варианты выбора или скрытые оповещения
    practitioner: |
      Вы можете:
      - планировать и проводить оценки человеческого фактора для клинических систем
      - превращать выводы в изменения дизайна и меры клинической безопасности
      - оценивать нагрузку от оповещений и риск обходных путей
    expert: |
      Вы можете:
      - определять подход организации к человеческому фактору в цифровых услугах
      - проверять доказательства по человеческому фактору для систем и изменений высокого риска
      - развивать навыки в области человеческого фактора в клинических и цифровых командах
clin-digital-health-evaluation:
  name: Оценка цифровых технологий здравоохранения и их выгод
  description: Планирование и проведение оценки цифровых технологий здравоохранения и измерение их клинических выгод, выгод для безопасности и для услуг с помощью надёжных методов и доказательств.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему цифровым технологиям здравоохранения нужны доказательства пользы и безопасности
      - находить опубликованные доказательства о технологии
    working: |
      Вы можете:
      - собирать исходные и последующие данные для оценки
      - проводить клинические аудиты использования системы
      - обобщать результаты оценки для коллег
    practitioner: |
      Вы можете:
      - разрабатывать оценки и планы выгод для цифровых продуктов здравоохранения
      - выбирать подходящие показатели клинических исходов, безопасности и опыта
      - оценивать силу доказательств и объяснять их ограничения
    expert: |
      Вы можете:
      - определять подход организации к оценке цифровых технологий здравоохранения
      - руководить программами исследований и оценки вместе с академическими партнёрами и партнёрами в сфере помощи
      - использовать доказательства, чтобы консультировать совет директоров по цифровым инвестициям
clin-professional-practice:
  name: Зарегистрированная клиническая практика в цифровой сфере
  description: Привнесение актуальных клинических знаний и суждений зарегистрированного специалиста в цифровую работу с соблюдением стандартов, этики и обязанностей по переаттестации клинической профессии.
  levels:
    awareness: |
      Вы можете:
      - объяснить профессиональные стандарты, применимые к зарегистрированному клиницисту
      - распознавать, когда вопросу нужно клиническое мнение
    working: |
      Вы можете:
      - применять свои клинические знания в цифровой работе в пределах своей сферы практики
      - поддерживать регистрацию и непрерывное профессиональное развитие в актуальном состоянии
      - давать клинические заключения о процессах, контенте и безопасности
    practitioner: |
      Вы можете:
      - выносить обоснованные клинические суждения о влиянии цифровых услуг на помощь
      - уверенно оспаривать небезопасную практику в цифровой или клинической среде
      - помогать другим клиницистам применять свои профессиональные стандарты в цифровой работе
    expert: |
      Вы можете:
      - руководить клиническими профессиональными стандартами цифровой работы организации
      - выступать старшим клиническим голосом в решениях о безопасности пациентов и помощи
      - поддерживать переаттестацию и профессиональное развитие клиницистов на цифровых должностях
ig-information-rights-requests:
  name: Запросы на реализацию информационных прав
  description: Обработка запросов граждан и общественности на доступ к информации, таких как запросы на доступ к личным медицинским записям и запросы информации, которой располагает организация, в установленные законом сроки.
  levels:
    awareness: |
      Вы можете:
      - распознавать запрос на реализацию информационных прав и быстро передавать его дальше
      - объяснить, что у запросов есть установленные законом сроки
    working: |
      Вы можете:
      - регистрировать запросы, подтверждать их получение и отслеживать их, чтобы соблюдать сроки
      - собирать и редактировать информацию и готовить проекты ответов для проверки
      - проверять личность и полномочия заявителя
    practitioner: |
      Вы можете:
      - обрабатывать сложные или деликатные запросы, в том числе затрагивающие третьих лиц
      - применять исключения и решать, что не раскрывать, с понятным обоснованием
      - вести внутренние пересмотры и жалобы на ответы
    expert: |
      Вы можете:
      - устанавливать политику и процесс в области информационных прав для всей организации
      - руководить ответом на запросы и апелляции регулятора
      - докладывать старшим руководителям о результатах и тенденциях
ig-records-retention:
  name: Хранение и уничтожение записей
  description: Применение графиков хранения к бумажным и цифровым записям и их архивирование или безопасное уничтожение в нужное время с сохранением журнала аудита.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему записи хранятся установленный срок, а затем уничтожаются или архивируются
      - соблюдать процедуры хранения и перемещения записей
    working: |
      Вы можете:
      - применять график хранения к записям и отмечать записи, подлежащие пересмотру
      - готовить записи к архивированию или безопасному уничтожению и вести журнал аудита
    practitioner: |
      Вы можете:
      - вести программу хранения и уничтожения для службы документации
      - консультировать команды по срокам хранения новых видов записей, в том числе цифровых
      - проверять соблюдение графиков хранения
    expert: |
      Вы можете:
      - устанавливать политику и график хранения для организации
      - планировать долгосрочное сохранение цифровых записей
      - решать сложные вопросы хранения, такие как юридические запреты на уничтожение и расследования
ig-data-protection-impact-assessment:
  name: Оценка воздействия на защиту данных
  description: Оценка рисков для частной жизни при новой или изменённой обработке персональных данных и данных о здоровье и согласование мер контроля до начала обработки.
  levels:
    awareness: |
      Вы можете:
      - объяснить, когда нужна оценка воздействия на защиту данных
      - заполнить предварительную анкету для своей работы
    working: |
      Вы можете:
      - помогать проектным командам проводить оценки воздействия на защиту данных
      - описывать потоки данных и определять законное основание обработки
      - фиксировать риски для частной жизни и предлагаемые меры контроля
    practitioner: |
      Вы можете:
      - проверять оценки воздействия на защиту данных для сложных систем и консультировать по ним
      - решать, приемлемы ли риски, и рекомендовать меры контроля
      - решать, когда передавать высокие риски на рассмотрение старшим руководителям или регулятору
    expert: |
      Вы можете:
      - устанавливать процесс и стандарты организации для оценки воздействия на защиту данных
      - давать окончательную консультацию по обработке наивысшего риска, такой как масштабный обмен данными или ИИ
      - консультироваться с регуляторами, когда этого требует закон
ig-incident-management:
  name: Управление инцидентами в сфере управления информацией
  description: Регистрация и расследование утечек данных и потенциальных инцидентов, извлечение из них уроков и принятие решения о том, когда сообщать регуляторам и пострадавшим людям.
  levels:
    awareness: |
      Вы можете:
      - распознавать утечку данных или потенциальный инцидент и сразу сообщать о нём
    working: |
      Вы можете:
      - регистрировать инциденты и собирать факты
      - оценивать инциденты по критериям серьёзности организации
      - отслеживать действия до их завершения
    practitioner: |
      Вы можете:
      - расследовать серьёзные инциденты и находить их коренные причины
      - решать вместе со старшими коллегами, нужно ли уведомлять регуляторов и пострадавших
      - делиться уроками и отслеживать улучшения
    expert: |
      Вы можете:
      - устанавливать процесс управления инцидентами в сфере управления информацией
      - руководить реагированием на крупные утечки, в том числе во взаимодействии с регуляторами и СМИ
      - докладывать совету директоров о тенденциях и рисках инцидентов
ig-confidentiality-and-sharing:
  name: Конфиденциальность и обмен информацией
  description: Защита конфиденциальной информации о пациентах с одновременным обеспечением её законной передачи, когда этого требуют помощь, безопасность или закон, в том числе через соглашения об обмене информацией.
  levels:
    awareness: |
      Вы можете:
      - хранить конфиденциальную информацию в безопасности и передавать её только тогда, когда это разрешено
      - обращаться за советом, если вы не уверены
    working: |
      Вы можете:
      - проверять, соответствует ли запрос на передачу информации политике
      - вести записи о том, что, кому и почему было передано
      - готовить проекты простых соглашений об обмене информацией
    practitioner: |
      Вы можете:
      - консультировать по сложным вопросам конфиденциальности, таким как передача без согласия в общественных интересах
      - проверять соглашения об обмене информацией с организациями-партнёрами
      - применять правила согласия и возражений пациентов к потокам данных
    expert: |
      Вы можете:
      - выступать старшим консультантом организации по вопросам конфиденциальности
      - принимать самые трудные решения о раскрытии
      - устанавливать рамки обмена информацией с партнёрами
ig-compliance-assurance:
  name: Гарантии и аудит в сфере управления информацией
  description: Проверка и подтверждение того, что организация соответствует стандартам управления информацией, через ежегодные самооценки, аудиты, доказательства и планы улучшений.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему организация должна показывать, что она правильно обращается с информацией
      - предоставлять доказательства для аудита по запросу
    working: |
      Вы можете:
      - собирать и систематизировать доказательства для ежегодной самооценки
      - проводить простые аудиты, такие как аудиты доступа или ведения записей
      - отслеживать действия по улучшению
    practitioner: |
      Вы можете:
      - планировать и вести программу гарантий в сфере управления информацией
      - оценивать, соответствуют ли доказательства стандарту, и выявлять пробелы
      - работать с внутренними и внешними аудиторами
    expert: |
      Вы можете:
      - отвечать за рамки гарантий организации в сфере управления информацией
      - докладывать совету директоров и его комитетам о гарантиях и соответствии требованиям
      - устанавливать приоритеты улучшений на основе риска
