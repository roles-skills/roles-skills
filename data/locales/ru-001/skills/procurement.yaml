# Russian translations of data/skills/procurement.yaml. Keys are the English skill ids.
proc-purchase-to-pay:
  name: От закупки до оплаты
  description: Оформление, согласование и приёмка заказов и решение вопросов по счетам и платежам через систему закупок организации и финансовый контроль.
  levels:
    awareness: |
      Вы можете:
      - объяснить правило «нет заказа на закупку — нет оплаты» и почему оно важно
      - оформлять заявку в системе закупок
    working: |
      Вы можете:
      - создавать и изменять заказы на закупку и сверять их с договорами
      - решать вопросы по счетам, приёмке и платежам с поставщиками и финансовой службой
      - вести каталоги и данные поставщиков в системе закупок
    practitioner: |
      Вы можете:
      - вести процесс «от закупки до оплаты» для службы, отслеживая соблюдение правил и накопившиеся задолженности
      - анализировать данные о расходах, чтобы находить расходы вне договоров и возможности экономии
      - улучшать процесс и меры контроля вместе с коллегами из финансовой службы
    expert: |
      Вы можете:
      - устанавливать политику, меры контроля и системы организации для процесса «от закупки до оплаты»
      - руководить переходом к полностью электронным закупкам и выставлению счетов
proc-procurement-process:
  name: Процесс закупки
  description: Проведение закупок в соответствии с правилами, от планирования и спецификации через выбор способа закупки, конкурс, присуждение и подписание договора, включая закупки по рамочным соглашениям и через динамические системы закупок.
  levels:
    awareness: |
      Вы можете:
      - объяснить этапы закупки и применимые пороговые значения
      - запрашивать коммерческие предложения для недорогих закупок по правилам организации
    working: |
      Вы можете:
      - проводить запросы предложений и закупки по рамочным соглашениям с использованием стандартных шаблонов
      - готовить конкурсную документацию и вести вопросы-разъяснения в системе электронных торгов
      - вести понятный журнал аудита по каждой закупке
    practitioner: |
      Вы можете:
      - планировать сложные конкурсы и руководить ими, выбирая правильный способ закупки и процедуру
      - помогать пользователям писать спецификации, ориентированные на результат, для цифровых и клинических систем
      - управлять графиками, рисками и заинтересованными сторонами до присуждения договора
    expert: |
      Вы можете:
      - устанавливать закупочные процедуры и шаблоны организации
      - руководить самыми сложными, крупными или новыми закупками
      - заверять совет директоров в обоснованности закупочных решений
proc-tender-evaluation:
  name: Оценка конкурсных предложений
  description: Разработка критериев и весов оценки и проведение справедливой и хорошо задокументированной оценки качества, цены и социальной ценности.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему оценка должна следовать опубликованным критериям
      - заявлять о конфликте интересов перед участием в оценке
    working: |
      Вы можете:
      - проверять предложения на соответствие требованиям и полноту
      - поддерживать оценщиков и фиксировать баллы и записи о согласовании оценок
      - готовить модели ценовой оценки под руководством
    practitioner: |
      Вы можете:
      - разрабатывать критерии оценки, веса и руководство по выставлению баллов
      - руководить согласованием оценок и писать отчёты о присуждении и обратную связь участникам
      - планировать демонстрации и тестирование по клиническим или пользовательским сценариям в конкурсах на системы
    expert: |
      Вы можете:
      - устанавливать стандарты оценки организации и подход к соотношению цены и качества
      - защищать решения по оценке при их оспаривании
      - проверять оценки в закупках высокого риска
proc-procurement-law-and-policy:
  name: Правила и политика государственных закупок
  description: Применение правил государственных закупок, финансовых правил организации и закупочной политики, чтобы закупки были законными, прозрачными и справедливыми.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что государственные средства должны расходоваться справедливо, открыто и законно
      - соблюдать пороговые значения и правила согласования организации
    working: |
      Вы можете:
      - применять закупочные правила, подходящие для несложной закупки
      - публиковать извещения и вести записи, отвечающие правилам прозрачности
      - замечать, когда запрос грозит нарушением правил, и сообщать об этом
    practitioner: |
      Вы можете:
      - консультировать по законному способу проведения сложных закупок и изменения договоров
      - управлять риском оспаривания и правильно проводить период ожидания и разбор итогов с участниками
      - писать закупочную политику и руководства для организации
    expert: |
      Вы можете:
      - толковать новые правила закупок и руководить ответом организации
      - консультировать совет директоров по соблюдению закупочных правил и рискам
      - вести официальные оспаривания вместе с юридическими консультантами
proc-market-analysis:
  name: Анализ рынка и взаимодействие с ним
  description: Понимание рынков поставок, взаимодействие с поставщиками до закупки и использование рыночных данных для формирования требований, способов закупки и коммерческих моделей.
  levels:
    awareness: |
      Вы можете:
      - находить поставщиков в рамочных соглашениях и базах данных поставщиков
      - объяснить, почему предварительное взаимодействие с рынком должно быть справедливым для всех поставщиков
    working: |
      Вы можете:
      - собирать рыночную информацию, цены и сведения о поставщиках для потребности
      - проводить запрос информации и обобщать ответы
    practitioner: |
      Вы можете:
      - анализировать рынок поставок, его конкуренцию, риски и тенденции
      - руководить предварительным взаимодействием с рынком, например днями поставщиков, не искажая конкуренцию
      - использовать рыночные данные для формирования требований и коммерческих моделей
    expert: |
      Вы можете:
      - формировать рынки, например поощряя новых или небольших поставщиков
      - руководить рыночной стратегией вместе с другими закупающими организациями
proc-negotiation:
  name: Коммерческие переговоры
  description: Планирование и ведение переговоров с поставщиками, чтобы согласовать цену, условия и показатели работы, обеспечивающие эффективность расходования средств и управление рисками.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что можно и что нельзя обсуждать на переговорах в государственной закупке
    working: |
      Вы можете:
      - вести переговоры о ценах и условиях недорогих или типовых закупок
      - готовить данные и варианты для переговоров, которые ведут другие
    practitioner: |
      Вы можете:
      - планировать переговоры и руководить ими, устанавливая цели, пределы и запасные позиции
      - вести переговоры об изменениях договоров, продлениях и урегулировании споров
      - обеспечивать законность переговоров и их хорошее документирование
    expert: |
      Вы можете:
      - руководить крупными переговорами высокого риска со стратегическими поставщиками
      - обучать других ведению переговоров и устанавливать подход организации к переговорам
proc-category-management:
  name: Категорийный менеджмент
  description: Управление категорией расходов, такой как программное обеспечение, облачные и технологические услуги, через категорийную стратегию, которая объединяет спрос, формирует требования и планирует закупки на несколько лет.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что такое категория и почему важны категорийные планы
    working: |
      Вы можете:
      - анализировать расходы и договоры по категории и поддерживать реестр договоров в актуальном состоянии
      - поддерживать категорийный план, например отслеживая продления и экономию
    practitioner: |
      Вы можете:
      - писать и реализовывать категорийную стратегию вместе с распорядителями бюджета и техническими руководителями
      - планировать очередь закупок и продлений договоров по категории
      - отслеживать экономию, ценность и риски по категории
    expert: |
      Вы можете:
      - устанавливать подход организации к категорийному менеджменту
      - руководить категориями с наибольшими расходами и рисками и согласовывать их со стратегией организации
      - работать с другими организациями над совместными закупками
proc-technology-procurement:
  name: Закупка технологий и облачных услуг
  description: Закупка программного обеспечения, облачных услуг, лицензий, оборудования и цифровых услуг, включая программное обеспечение как услугу, коммерческие модели, лицензирование и условия безопасности, защиты данных и совместимости, необходимые для технологий здравоохранения.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные способы приобретения технологий, такие как лицензии, подписки и услуги
      - понимать, что клиническим системам нужны проверки безопасности, клинической безопасности и защиты данных
    working: |
      Вы можете:
      - закупать стандартное программное обеспечение, оборудование и лицензии по рамочным соглашениям
      - отслеживать количество лицензий, продления и даты сверки использования
      - включать в документы стандартные требования безопасности и защиты данных
    practitioner: |
      Вы можете:
      - закупать облачные услуги, программное обеспечение как услугу и клинические системы, выбирая правильную коммерческую модель
      - формировать требования вместе с техническими руководителями, руководителями по клинической безопасности и управлению информацией
      - включать в договоры условия о совместимости, открытых стандартах, праве собственности на данные и выходе из договора
      - избегать привязки к поставщику, планируя переносимость и конкуренцию при продлении
    expert: |
      Вы можете:
      - устанавливать коммерческую стратегию организации для технологий и облачных услуг
      - руководить переговорами по корпоративным соглашениям и стратегическим платформам
      - консультировать руководителей цифрового направления по коммерческим рискам технологического выбора
proc-contract-management:
  name: Управление договорами
  description: Управление договорами после присуждения, включая запуск, исполнение, платежи, изменения, споры, продление и выход, чтобы организация получала то, за что заплатила.
  levels:
    awareness: |
      Вы можете:
      - находить договор и объяснять его ключевые даты, стоимость и ответственного
      - фиксировать изменения договора и документы в реестре договоров
    working: |
      Вы можете:
      - отслеживать работу поставщика по уровням обслуживания и ключевым показателям эффективности
      - готовить встречи по обзору договора и отслеживать действия
      - оформлять изменения договоров и сверять счета с договором
    practitioner: |
      Вы можете:
      - вести портфель договоров, включая клинические и технологические договоры
      - применять договорные средства защиты, такие как сервисные кредиты, если исполнение не соответствует требованиям
      - управлять изменениями, спорами и продлениями в рамках закупочных правил
      - заранее планировать выход и проверять планы выхода до окончания договоров
    expert: |
      Вы можете:
      - устанавливать рамки и стандарты управления договорами в организации
      - руководить управлением стратегическими договорами высокого риска
      - урегулировать крупные споры и принимать решения о расторжении или повторной закупке
proc-supplier-relationship-management:
  name: Управление отношениями с поставщиками
  description: Выстраивание стратегических отношений с ключевыми поставщиками, чтобы управлять рисками, улучшать исполнение и со временем развивать продукты и услуги.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему хорошие отношения с поставщиками важны для услуг, на которые полагаются пациенты
      - профессионально взаимодействовать с поставщиками и фиксировать контакты
    working: |
      Вы можете:
      - поддерживать в актуальном состоянии контакты поставщиков, пути эскалации и записи
      - проверять финансовое состояние и страхование поставщиков на соответствие требованиям
    practitioner: |
      Вы можете:
      - сегментировать поставщиков по риску и ценности и планировать, как работать с каждой группой
      - проводить стратегические обзоры с ключевыми поставщиками, включая дорожную карту и планы улучшений
      - управлять рисками поставщиков, такими как финансовая несостоятельность, киберинциденты и проблемы в цепочке поставок
    expert: |
      Вы можете:
      - устанавливать стратегию организации по отношениям с поставщиками
      - руководить отношениями со стратегическими поставщиками на уровне высшего руководства
      - руководить реагированием при отказе критически важного поставщика
proc-exit-planning:
  name: Планирование выхода и возврат данных
  description: Планирование и управление окончанием договора, включая переход к новому поставщику, возврат и удаление данных и непрерывность услуг для пациентов и сотрудников.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему каждому договору нужен план выхода
      - находить условия договора о выходе и возврате данных
    working: |
      Вы можете:
      - поддерживать в актуальном состоянии планы выхода и реестры активов и данных
      - отслеживать сроки уведомления и этапы выхода
    practitioner: |
      Вы можете:
      - писать планы выхода и перехода вместе с техническими руководителями, руководителями по данным и клиническими руководителями
      - обеспечивать возврат данных в пригодных для использования стандартных форматах и их последующее безопасное удаление
      - управлять рисками перехода, чтобы не нарушить оказание помощи
    expert: |
      Вы можете:
      - устанавливать стандарты организации по выходу, переходу и возврату данных
      - руководить выходом из стратегических клинических и технологических договоров
proc-social-value:
  name: Социальная ценность и устойчивые закупки
  description: Использование закупок и договоров для создания социальной ценности, экологической устойчивости и справедливых цепочек поставок и измерение того, что поставщики фактически обеспечивают.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что означают социальная ценность и устойчивые закупки для организации
    working: |
      Вы можете:
      - включать в конкурсы стандартные вопросы о социальной ценности и устойчивости
      - собирать отчёты поставщиков о социальной ценности
    practitioner: |
      Вы можете:
      - устанавливать критерии социальной ценности и устойчивости, подходящие для договора
      - управлять обязательствами поставщиков, такими как местные рабочие места, навыки и сокращение выбросов углерода
      - проверять цепочки поставок на риски, такие как принудительный труд и другие нарушения прав человека
    expert: |
      Вы можете:
      - устанавливать политику организации в области социальной ценности и устойчивых закупок
      - докладывать совету директоров о результатах в области социальной ценности и выбросов углерода
