# Russian translations of data/skills/human-resources.yaml. Keys are the English skill ids.
hr-hr-administration:
  name: Кадровое администрирование
  description: Точное и конфиденциальное ведение административных процессов жизненного цикла занятости, от трудовых договоров и приёма на работу до изменений, учёта отсутствий и увольнений.
  levels:
    awareness: |
      Вы можете:
      - соблюдать процедуры организации по приёму, изменениям и увольнению сотрудников
      - сохранять конфиденциальность личных дел и поддерживать их в актуальном состоянии
    working: |
      Вы можете:
      - точно готовить трудовые договоры, письма об изменении условий и проверки при трудоустройстве
      - вносить изменения в кадровую систему и систему расчёта заработной платы в установленные сроки
      - отвечать на рутинные вопросы руководителей и сотрудников о кадровых процессах
    practitioner: |
      Вы можете:
      - вести службу кадрового администрирования, проверяя качество и соблюдая стандарты обслуживания
      - улучшать процессы и шаблоны и, где возможно, автоматизировать рутинные шаги
      - решать сложные или необычные случаи, такие как переплаты или ошибки в договорах
    expert: |
      Вы можете:
      - проектировать операционную модель кадровой службы и стандарты обслуживания для организации
      - руководить переходом к цифровым кадровым процессам с самообслуживанием
      - устанавливать меры контроля, обеспечивающие точность и законность кадровых данных и данных о заработной плате
hr-employment-policy:
  name: Трудовое право и кадровая политика
  description: Применение трудового законодательства и разработка, толкование и пересмотр кадровой политики организации, чтобы с сотрудниками обращались законно, справедливо и последовательно.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные кадровые политики и где их найти
      - распознавать, когда вопросу нужна консультация специалиста по персоналу
    working: |
      Вы можете:
      - применять кадровые политики к типовым случаям и объяснять их руководителям
      - определять принципы трудового права, лежащие в основе политики
      - вести учёт политик и отслеживать сроки их пересмотра
    practitioner: |
      Вы можете:
      - толковать трудовое законодательство и политику для сложных случаев и консультировать по рискам
      - разрабатывать и пересматривать кадровые политики с оценкой их влияния на равенство
      - проводить консультации по изменениям политики с представителями работников
    expert: |
      Вы можете:
      - устанавливать рамки кадровой политики организации и подход к правовым рискам
      - предвидеть изменения трудового законодательства и планировать ответ организации
      - консультировать совет директоров по трудовым рискам и ответственности
hr-employee-relations:
  name: Работа с трудовыми отношениями
  description: Справедливое ведение формальных и неформальных дел в сфере трудовых отношений, таких как поведение, профессиональная пригодность, жалобы, посещаемость и достоинство на рабочем месте, в соответствии с политикой и трудовым законодательством.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные этапы процедур по поведению, профессиональной пригодности, жалобам и посещаемости
      - вести точные записи на официальных встречах и сохранять конфиденциальность материалов дел
    working: |
      Вы можете:
      - консультировать руководителей по простым делам и следующему шагу процедуры
      - поддерживать расследования, готовить материалы дел и организовывать слушания
      - конструктивно работать с представителями работников по индивидуальным делам
    practitioner: |
      Вы можете:
      - вести портфель сложных дел, консультируя комиссии по слушаниям о справедливых решениях
      - проводить расследования или руководить ими, в том числе связанными с инцидентами или защитой
      - использовать досудебное урегулирование и медиацию, чтобы разрешать споры до их эскалации
      - замечать тенденции в делах и устранять их причины
    expert: |
      Вы можете:
      - руководить подходом организации к трудовым отношениям и социальному партнёрству
      - вести самые деликатные дела или дела высокого риска, включая трудовые иски
      - вести переговоры о коллективных договорах и урегулировать коллективные споры
hr-recruitment-and-selection:
  name: Подбор и отбор персонала
  description: Справедливое и эффективное привлечение, оценка и назначение людей, от проектирования должности и размещения вакансии до составления короткого списка, оценки, предложения о работе и проверок при трудоустройстве.
  levels:
    awareness: |
      Вы можете:
      - объяснить этапы процесса подбора персонала в организации
      - соблюдать правила справедливого и безопасного подбора, включая проверки при трудоустройстве
    working: |
      Вы можете:
      - проводить кампании по подбору через систему отслеживания кандидатов
      - помогать руководителям с объявлениями, коротким списком и организацией собеседований
      - проводить проверки при трудоустройстве и делать условные предложения о работе
    practitioner: |
      Вы можете:
      - консультировать руководителей по проектированию должностей, методам отбора и справедливой оценке
      - разрабатывать оценки для специализированных ролей, например технические задания для цифровых ролей
      - анализировать данные подбора, чтобы сокращать сроки найма, повышать качество и разнообразие
      - управлять опытом кандидатов и брендом работодателя
    expert: |
      Вы можете:
      - устанавливать стратегию подбора персонала и стандарты обслуживания для организации
      - руководить выбором и использованием технологий и кадровых агентств
      - обеспечивать инклюзивность и законность подбора во всей организации
hr-talent-attraction:
  name: Привлечение и поиск талантов
  description: Поиск и вовлечение людей с дефицитными навыками, таких как специалисты по цифровым технологиям, данным и технологиям, через бренд работодателя, прямой поиск, сети и программы для начинающих специалистов.
  levels:
    awareness: |
      Вы можете:
      - объяснить, какие навыки трудно найти и почему
      - распространять объявления о вакансиях через каналы и сети организации
    working: |
      Вы можете:
      - писать объявления, привлекательные для специалистов, простым языком
      - искать кандидатов на сайтах вакансий, в профессиональных сетях и кадровых резервах
      - поддерживать мероприятия, такие как ярмарки вакансий и дни открытых дверей
    practitioner: |
      Вы можете:
      - выстраивать кадровые воронки и сообщества для дефицитных цифровых ролей и ролей в области данных
      - формировать ценностное предложение работодателя вместе с командами найма
      - использовать рыночные данные об оплате и предложении, чтобы консультировать по трудно заполняемым ролям
      - развивать программы для начинающих специалистов, такие как ученичество и программы для выпускников
    expert: |
      Вы можете:
      - устанавливать стратегию привлечения талантов и бренд работодателя для организации
      - работать с партнёрами, такими как университеты и другие работодатели, чтобы расширять предложение талантов
      - руководить решениями о повышенной оплате, использовании агентств и альтернативных моделях поиска
hr-workforce-planning:
  name: Кадровое планирование
  description: Прогнозирование потребности организации в персонале, сравнение её с имеющимся персоналом и планирование того, как закрыть разрыв через подбор, развитие, перепроектирование и удержание.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему кадровое планирование важно для безопасных и устойчивых услуг
      - предоставлять точные сведения о штатном расписании и вакансиях
    working: |
      Вы можете:
      - собирать и проверять данные кадровых планов от руководителей
      - моделировать простые сценарии, такие как тенденции текучести и вакансий
    practitioner: |
      Вы можете:
      - руководить кадровым планированием для дирекции, связывая его с планами услуг и финансовыми планами
      - выявлять дефицит навыков и рекомендовать способы его устранения
      - планировать новые роли, карьерные пути и сочетание навыков
    expert: |
      Вы можете:
      - устанавливать кадровую стратегию и долгосрочный план организации
      - находить компромиссы по персоналу между службами вместе с руководителями финансов и служб
      - формировать кадровые планы вместе с партнёрами по всей системе здравоохранения и ухода
hr-workforce-information:
  name: Кадровая информация и кадровые системы
  description: Управление кадровыми системами и данными о персонале и превращение кадровых данных в отчёты и аналитику, такие как анализ текучести, отсутствий, вакансий, разнообразия и разрыва в оплате.
  levels:
    awareness: |
      Вы можете:
      - точно вводить кадровые данные в кадровую систему
      - объяснить, почему кадровые данные должны быть точными и конфиденциальными
    working: |
      Вы можете:
      - формировать стандартные кадровые отчёты и проверять их на ошибки
      - отвечать на рутинные запросы информации о персонале
    practitioner: |
      Вы можете:
      - анализировать кадровые данные, чтобы находить тенденции и объяснять их руководителям
      - проектировать панели мониторинга и отчёты по кадровым показателям
      - готовить обязательную отчётность и отчётность по равенству, такую как анализ разрыва в оплате
    expert: |
      Вы можете:
      - устанавливать стратегию кадровой информации и стандарты данных для организации
      - руководить выбором и развитием кадровых систем
      - использовать кадровую аналитику при принятии решений советом директоров
hr-reward-and-job-evaluation:
  name: Вознаграждение и оценка должностей
  description: Применение правил оплаты и вознаграждения и последовательная оценка должностей по системе оценки должностей, чтобы относить их к правильному диапазону.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как работают диапазоны оплаты, ступени и надбавки
      - объяснить, что должности относятся к диапазонам по результатам оценки должности, а не по человеку на должности
    working: |
      Вы можете:
      - применять правила оплаты, такие как начальный оклад, сохранение оплаты и надбавки
      - проверять полноту должностных инструкций перед оценкой
      - участвовать в комиссиях по оценке должностей в качестве обученного члена
    practitioner: |
      Вы можете:
      - руководить комиссиями по оценке должностей и проверками согласованности
      - консультировать по отнесению новых и изменённых ролей к диапазонам, включая цифровые роли и роли в области данных
      - консультировать по надбавкам за привлечение и удержание на основе рыночных данных
    expert: |
      Вы можете:
      - устанавливать стратегию вознаграждения организации в рамках согласованной системы оплаты
      - обеспечивать целостность оценки должностей во всей организации
      - руководить проверками равной оплаты и действовать по их выводам
hr-learning-design-and-delivery:
  name: Проектирование и проведение обучения
  description: Анализ потребностей в обучении, а затем проектирование, проведение и оценка обучения очно, онлайн и в процессе работы.
  levels:
    awareness: |
      Вы можете:
      - объяснить разницу между подготовкой, обучением и развитием
      - помогать в проведении курсов и вести учёт обучения
    working: |
      Вы можете:
      - проводить чётко определённые учебные занятия очно и онлайн
      - создавать простые электронные курсы в системе управления обучением
      - собирать и обобщать отзывы слушателей
    practitioner: |
      Вы можете:
      - анализировать потребности в обучении и проектировать смешанные программы для их удовлетворения
      - устанавливать результаты обучения и оценивать влияние, а не только удовлетворённость
      - делать обучение доступным и инклюзивным для всех сотрудников
    expert: |
      Вы можете:
      - устанавливать стратегию и стандарты обучения в организации
      - руководить предложением обучения, его технологиями и финансированием
      - показывать отдачу от инвестиций организации в обучение
hr-skills-frameworks-and-career-pathways:
  name: Рамки навыков и карьерные пути
  description: Использование рамок навыков и ролей, таких как этот справочник, UK GDaD PCF и ESCO, для описания ролей, оценки дефицита навыков и построения карьерных путей.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что такое рамка навыков и как она описывает роли и уровни
      - находить профиль роли и навыки для должности в рамке
    working: |
      Вы можете:
      - соотносить должностные инструкции с ролями, уровнями и навыками рамки
      - помогать сотрудникам и руководителям с самооценкой навыков
      - поддерживать информацию о карьерных путях в актуальном состоянии
    practitioner: |
      Вы можете:
      - проводить анализ дефицита навыков для команды или профессии и докладывать о результатах
      - проектировать карьерные пути и маршруты развития на основе уровней рамки
      - использовать навыки рамки для написания согласованных должностных инструкций и оценок
    expert: |
      Вы можете:
      - определять, как организация использует рамки навыков во всех профессиях
      - использовать данные о навыках в кадровой стратегии, стратегии обучения и вознаграждения
      - участвовать в разработке общих рамок вместе с другими организациями
hr-organisational-development:
  name: Организационное развитие
  description: Улучшение работы организации через основанные на доказательствах меры в области культуры, лидерства, вовлечённости, эффективности команд и благополучия.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как культура, лидерство и вовлечённость влияют на сотрудников и помощь пациентам
      - помогать проводить опросы сотрудников и встречи для обратной связи
    working: |
      Вы можете:
      - проводить командные сессии и семинары с помощью стандартных инструментов
      - анализировать результаты опроса сотрудников для команды и предлагать действия
    practitioner: |
      Вы можете:
      - диагностировать организационные проблемы и проектировать меры для их решения
      - руководить программами развития команд, лидерства и вовлечённости
      - оценивать влияние мер на основе доказательств
    expert: |
      Вы можете:
      - устанавливать стратегию организационного развития и программу культуры
      - проводить коучинг для руководителей высшего звена и руководить масштабными культурными изменениями
      - связывать показатели культуры и вовлечённости с качеством помощи и результатами
hr-organisational-change:
  name: Организационные изменения и консультации
  description: Планирование и проведение изменений структур, ролей и режимов работы, включая официальные консультации, перевод на другую работу и сокращение, в соответствии с политикой и трудовым законодательством.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные этапы процесса организационных изменений
      - помогать в администрировании изменений, например с письмами и встречами в рамках консультаций
    working: |
      Вы можете:
      - помогать руководителям готовить консультационные документы и брифинги для сотрудников
      - отслеживать отклики и действия в ходе консультаций
      - поддерживать сотрудников в процессах перевода и отбора
    practitioner: |
      Вы можете:
      - руководить организационными изменениями в дирекции, от бизнес-обоснования до внедрения
      - проводить консультации с сотрудниками и их представителями и реагировать на их отзывы
      - управлять правовыми рисками изменений и рисками для равенства
    expert: |
      Вы можете:
      - руководить реструктуризациями и передачей услуг в масштабе всей организации
      - проектировать подход организации к изменениям, включая социальное партнёрство
      - консультировать совет директоров о влиянии крупных изменений на персонал и связанных рисках
hr-people-strategy:
  name: Кадровая стратегия и руководство кадровой службой
  description: Определение кадровой стратегии организации, руководство кадровой функцией и консультирование совета директоров по вопросам культуры, персонала и трудовых рисков.
  levels:
    awareness: |
      Вы можете:
      - объяснить кадровую стратегию организации и то, как ваша работа её поддерживает
    working: |
      Вы можете:
      - участвовать в разработке кадровых планов службы с чёткими действиями и показателями
      - отчитываться о ходе выполнения кадрового плана
    practitioner: |
      Вы можете:
      - разрабатывать кадровые планы дирекции и руководить ими в соответствии с кадровой стратегией
      - консультировать старших руководителей по кадровым рискам и приоритетам
      - руководить частью кадровой функции, устанавливая её стандарты и приоритеты
