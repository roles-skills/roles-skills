# Russian translations of data/skills/finance.yaml. Keys are the English skill ids.
fin-financial-transactions:
  name: Финансовые операции и регистры учёта
  description: Точная обработка и отражение в регистрах учёта счетов, платежей, поступлений, проводок и сверок с соблюдением финансового контроля.
  levels:
    awareness: |
      Вы можете:
      - объяснить процессы «от закупки до оплаты» и «от заказа до получения денег» и свою роль в них
      - точно вводить счета, поступления и платежи по установленным процедурам
      - проверять, что операция имеет надлежащее одобрение и подтверждающие документы
    working: |
      Вы можете:
      - обрабатывать различные операции, включая кредит-ноты, возвраты и проводки
      - сверять выписки поставщиков, банковские счета и контрольные счета
      - решать рутинные вопросы поставщиков, клиентов и распорядителей бюджета
      - замечать дублирующиеся, необычные или несанкционированные операции и сообщать о них
    practitioner: |
      Вы можете:
      - вести регистр учёта или процесс обработки операций и поддерживать его точность и актуальность
      - расследовать и закрывать сложные расхождения и старые остатки
      - улучшать процессы обработки операций, например автоматизируя сопоставление или согласования
      - обучать других сотрудников и проверять их работу
    expert: |
      Вы можете:
      - проектировать процессы обработки операций в организации и встроенные в них меры контроля
      - устанавливать стандарты результативности, такие как сроки оплаты и целевые показатели взыскания задолженности
      - руководить переходом к новым способам обработки, таким как автоматизация и самообслуживание
      - заверять старших руководителей и аудиторов в полноте и точности регистров учёта
fin-financial-reporting:
  name: Финансовая отчётность и годовая бухгалтерская отчётность
  description: Подготовка точной финансовой отчётности и обязательных отчётов в соответствии с применимыми стандартами бухгалтерского учёта и правилами отчётности государственного сектора.
  levels:
    awareness: |
      Вы можете:
      - объяснить назначение основных форм финансовой отчётности
      - готовить рабочие документы и сверки для закрытия месяца и года
    working: |
      Вы можете:
      - готовить проводки на конец месяца и года, такие как начисления, расходы будущих периодов и резервы
      - готовить разделы годовой отчётности и пояснения к ней
      - применять стандарты бухгалтерского учёта к типовым операциям, например к капитализации программного обеспечения и оборудования
    practitioner: |
      Вы можете:
      - готовить годовую отчётность и обязательные отчёты по графику
      - применять стандарты бухгалтерского учёта к сложным областям, таким как аренда, облачные решения и нематериальные активы
      - писать учётные записки, объясняющие суждения и оценки
      - вести внешний аудит отчётности и реагировать на его выводы
    expert: |
      Вы можете:
      - отвечать за годовой отчёт и отчётность организации и лежащую в их основе учётную политику
      - консультировать совет директоров и комитет по аудиту по существенным суждениям и новым стандартам
      - руководить реагированием на модифицированные аудиторские заключения или существенные искажения
      - обеспечивать соответствие отчётности правилам публичной подотчётности
fin-management-accounting:
  name: Управленческий учёт
  description: Подготовка информации о бюджетах и затратах, помогающей руководителям планировать, контролировать и принимать решения, включая анализ отклонений, калькуляцию затрат и отчётность о результатах.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что такое бюджет, фактические расходы, обязательства и отклонения
      - формировать стандартные бюджетные отчёты из финансовой системы
    working: |
      Вы можете:
      - готовить ежемесячные бюджетные отчёты и объяснять основные отклонения
      - правильно относить затраты на центры затрат, проекты, капитальные и текущие расходы
      - помогать распорядителям бюджета понимать свои бюджеты и управлять ими
    practitioner: |
      Вы можете:
      - вести ежемесячный цикл отчётности для дирекции или программы
      - строить модели затрат, такие как полная стоимость цифровой услуги или удельная стоимость операции
      - анализировать тенденции расходов и советовать руководителям, как остаться в пределах бюджета
      - конструктивно оспаривать прогнозы распорядителей бюджета
    expert: |
      Вы можете:
      - проектировать подход организации к управленческой отчётности и калькуляции затрат
      - представлять финансовые результаты совету директоров и старшим руководителям
      - руководить использованием информации о затратах и результатах для повышения эффективности расходования средств
      - устанавливать стандарты управленческого учёта для всей организации
fin-financial-planning-and-forecasting:
  name: Финансовое планирование и прогнозирование
  description: Составление бюджетов, прогнозов и среднесрочных финансовых планов, связывающих деньги с приоритетами и программами организации.
  levels:
    awareness: |
      Вы можете:
      - объяснить годовой цикл формирования бюджета и разницу между бюджетом и прогнозом
      - собирать прогнозную информацию от распорядителей бюджета
    working: |
      Вы можете:
      - составлять бюджеты и прогнозы для центра затрат или проекта, включая расходы на персонал
      - ежемесячно обновлять прогнозы с учётом известных изменений и рисков
      - распределять бюджеты по периодам так, чтобы профиль расходов соответствовал планам реализации
    practitioner: |
      Вы можете:
      - руководить формированием бюджета и прогнозированием для дирекции или крупной программы
      - моделировать сценарии и чувствительность, например к инфляции, задержкам или изменениям финансирования
      - строить многолетние прогнозы для цифровых программ, включая эксплуатационные расходы после инвестиций
      - представлять прогнозы и риски старшим руководителям
    expert: |
      Вы можете:
      - руководить среднесрочным финансовым планом организации
      - согласовывать финансовые планы со стратегией, кадровыми и инвестиционными планами
      - консультировать совет директоров по финансовой устойчивости и выбору, необходимому, чтобы остаться в рамках финансирования
      - устанавливать допущения и методы планирования для всей организации
fin-payroll:
  name: Расчёт заработной платы
  description: Точная и своевременная выплата заработной платы сотрудникам, включая приём, увольнение, изменения, удержания, пенсии, установленные законом выплаты и отчётность по заработной плате.
  levels:
    awareness: |
      Вы можете:
      - объяснить цикл расчёта заработной платы, от изменений и даты отсечения до выплаты и отчётности
      - точно вводить данные о приёме, увольнении и изменениях по утверждённым формам
      - отвечать на рутинные вопросы об оплате, сохраняя конфиденциальность сведений о заработной плате
    working: |
      Вы можете:
      - рассчитывать заработную плату, надбавки, сверхурочные, оплату больничных и отпусков по семейным обстоятельствам
      - правильно применять налоговые, пенсионные и другие удержания
      - проверять результаты расчёта и исправлять ошибки до выплаты
      - деликатно и в соответствии с политикой взыскивать переплаты
    practitioner: |
      Вы можете:
      - проводить полный расчёт заработной платы для группы сотрудников и подписывать проверки расчёта
      - вести обязательную отчётность по заработной плате и пенсионные отчёты
      - решать сложные случаи, такие как несколько трудовых договоров, доплаты за прошлые периоды или замена части зарплаты льготами
      - тестировать изменения в системе расчёта заработной платы, такие как ежегодная индексация и изменения правил
    expert: |
      Вы можете:
      - управлять службой расчёта заработной платы организации, собственной или у поставщика
      - устанавливать меры контроля расчёта и заверять старших руководителей в точности и законности выплат
      - планировать изменения правил оплаты, индексации и систем расчёта
      - руководить реагированием на крупные сбои в расчёте заработной платы
fin-treasury-and-cash:
  name: Казначейство и управление денежными средствами
  description: Управление банковскими счетами, денежными потоками и ликвидностью, чтобы организация могла выполнять свои обязательства, в рамках правил государственного сектора в отношении денежных средств.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему важны не только бюджеты, но и денежные средства
      - отражать и сверять банковские операции
    working: |
      Вы можете:
      - готовить ежедневные позиции по денежным средствам и краткосрочные прогнозы движения денежных средств
      - готовить платёжные пакеты и проверять их надлежащее одобрение
      - сверять банковские счета и закрывать несопоставленные позиции
    practitioner: |
      Вы можете:
      - вести прогноз движения денежных средств организации и выборку финансирования
      - управлять банковскими счетами, способами оплаты и банковским контролем
      - планировать денежные средства для крупных или нерегулярных платежей, таких как многолетние лицензии на программное обеспечение
    expert: |
      Вы можете:
      - устанавливать казначейскую политику и банковские договорённости организации
      - консультировать совет директоров по рискам ликвидности и денежных средств
      - управлять денежными средствами в пределах лимитов, установленных источниками финансирования и правилами государственного сектора
fin-audit-and-controls:
  name: Финансовый контроль и аудит
  description: Проектирование, применение и проверка финансового контроля, предотвращение и выявление мошенничества и работа с внутренними и внешними аудиторами.
  levels:
    awareness: |
      Вы можете:
      - соблюдать финансовые процедуры организации и порядок делегирования полномочий
      - распознавать признаки возможного мошенничества или ошибки и сообщать о них
    working: |
      Вы можете:
      - применять ключевые меры контроля, такие как разделение обязанностей и проверка банковских реквизитов поставщиков
      - предоставлять доказательства аудиторам и отвечать на их вопросы
      - проверять, что расходы одобрены на надлежащем уровне
    practitioner: |
      Вы можете:
      - проверять и улучшать меры контроля финансового процесса
      - вести запросы аудиторов по своей области и согласовывать действия по выводам
      - писать и обновлять финансовые процедуры
      - работать со специалистами по противодействию мошенничеству, чтобы снижать риск мошенничества
    expert: |
      Вы можете:
      - отвечать за финансовые правила организации и порядок делегирования полномочий
      - докладывать комитету по аудиту о финансовом контроле и действиях по итогам аудита
      - руководить реагированием на существенные сбои контроля или мошенничество
      - формировать культуру, в которой сотрудники понимают свою обязанность правильно использовать государственные средства
fin-business-cases:
  name: Бизнес-обоснования и оценка инвестиций
  description: Подготовка финансового обоснования инвестиций, включая оценку вариантов, затраты за весь жизненный цикл, учёт капитальных и текущих расходов, выгоды и эффективность расходования средств.
  levels:
    awareness: |
      Вы можете:
      - объяснить назначение бизнес-обоснования и его финансового раздела
      - собирать информацию о затратах для бизнес-обоснования
    working: |
      Вы можете:
      - строить финансовую модель для несложного бизнес-обоснования
      - разделять капитальные и текущие, разовые и повторяющиеся затраты
      - учитывать затраты за весь жизненный цикл, такие как лицензии, поддержка и хостинг после запуска
    practitioner: |
      Вы можете:
      - руководить финансовым обоснованием сложных цифровых инвестиций, таких как новая клиническая система или переход в облако
      - оценивать варианты с помощью чистой приведённой стоимости, анализа чувствительности и поправки на риск
      - проверять, что выгоды реалистичны, измеримы и имеют ответственных
      - отслеживать расходы и выгоды после одобрения
    expert: |
      Вы можете:
      - устанавливать стандарты организации для бизнес-обоснований и оценки инвестиций
      - консультировать инвестиционные советы по доступности, эффективности расходования средств и рискам
      - обосновывать перед источниками финансирования крупные инвестиционные программы
      - пересматривать портфель инвестиций и рекомендовать, что прекратить, изменить или продолжить
fin-tax:
  name: Налоги
  description: Правильное применение налога с продаж, налогов на занятость и других налоговых правил к операциям организации и возмещение налогов там, где это разрешено.
  levels:
    awareness: |
      Вы можете:
      - распознавать налог с продаж в счетах и правильно его кодировать
      - объяснить, когда нужно обратиться за советом к специалисту по налогам
    working: |
      Вы можете:
      - готовить налоговые декларации и сверки под руководством
      - применять правильный налоговый режим к типовым закупкам и доходам
      - проверять статус занятости подрядчиков по указаниям
    practitioner: |
      Вы можете:
      - вести налоговые декларации и налоговые сверки организации
      - консультировать по налогообложению договоров, таких как лицензии на программное обеспечение, облачные услуги и общие услуги
      - максимально возмещать налоги в рамках правил
    expert: |
      Вы можете:
      - отвечать за налоговую стратегию и налоговые риски организации
      - вести обсуждение сложных вопросов с налоговым органом
      - оценивать налоговые последствия крупных изменений, таких как новые партнёрства или коммерческая деятельность
fin-financial-systems:
  name: Финансовые системы
  description: Использование, администрирование и улучшение систем финансов, закупок, расчёта заработной платы и отчётности, чтобы финансовые данные были точными, а процессы эффективными.
  levels:
    awareness: |
      Вы можете:
      - использовать финансовую систему для своих задач в соответствии с процедурами
      - формировать стандартные отчёты и выгружать данные в электронную таблицу
    working: |
      Вы можете:
      - уверенно работать с электронными таблицами, включая формулы, поиск значений и сводные таблицы
      - вести справочные данные финансовой системы, такие как центры затрат, поставщики и согласующие лица
      - сообщать о проблемах системы и помогать их устранять
    practitioner: |
      Вы можете:
      - администрировать финансовую систему или систему расчёта заработной платы, включая доступ, рабочие процессы и отчётность
      - проектировать отчёты и панели мониторинга для распорядителей бюджета
      - тестировать изменения и обновления системы
      - автоматизировать повторяющиеся финансовые задачи
    expert: |
      Вы можете:
      - отвечать за стратегию и дорожную карту финансовых систем
      - руководить закупкой и внедрением финансовых систем или систем расчёта заработной платы
      - обеспечивать интеграцию финансовых данных с данными о персонале, закупках и результатах
fin-public-sector-finance:
  name: Финансы государственного сектора
  description: Понимание того, как устроено государственное финансирование, включая распределение средств, лимиты капитальных и текущих расходов, контроль расходов, подотчётность за государственные средства и эффективность их расходования.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что организация тратит государственные средства и должна за них отчитываться
      - объяснить разницу между капитальными и текущими расходами
    working: |
      Вы можете:
      - применять правила организации о капитальных и текущих расходах к повседневным расходам
      - объяснить, как распределение средств и лимиты расходов влияют на вашу область
      - распознавать расходы, требующие одобрения источника финансирования или органа контроля расходов
    practitioner: |
      Вы можете:
      - консультировать руководителей по правилам финансирования, включая целевое и ограниченное по времени финансирование
      - управлять лимитами капитальных и текущих расходов программы или дирекции
      - готовить отчёты и доказательства для источников финансирования и органов контроля расходов
    expert: |
      Вы можете:
      - представлять организацию перед источниками финансирования и надзорными органами
      - консультировать совет директоров по вопросам правомерности, надлежащего использования и эффективности расходования средств
      - формировать соглашения о финансировании и финансовые режимы для услуг организации
