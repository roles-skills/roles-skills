# Russian translations of data/skills/shared.yaml. Keys are the English skill ids.
health-care-context:
  name: Понимание услуг здравоохранения и ухода
  description: Понимание того, как организованы и оказываются услуги здравоохранения и ухода, как работают клиницисты и работники сферы ухода и как цифровые услуги поддерживают помощь пациентам.
  levels:
    awareness: |
      Вы можете:
      - описать основные части системы здравоохранения и ухода и услуги, которые поддерживает организация
      - объяснить, почему безопасность пациентов и конфиденциальность важны в вашей работе
    working: |
      Вы можете:
      - объяснить клинические процессы и процессы ухода, которые поддерживает ваша работа
      - правильно использовать распространённые медицинские термины в общении с клиническими коллегами и коллегами из сферы ухода
      - распознавать, когда изменение может повлиять на помощь пациентам, и сообщать об этом
    practitioner: |
      Вы можете:
      - анализировать, как услуга вписывается в маршруты оказания помощи между организациями
      - работать с клиницистами, работниками сферы ухода и пациентами над формированием цифровых услуг
      - объяснять влияние цифровых решений на помощь, безопасность и нагрузку сотрудников
    expert: |
      Вы можете:
      - формировать стратегию организации на основе глубокого понимания системы здравоохранения и ухода
      - представлять организацию перед партнёрами и руководителями в сфере здравоохранения и ухода
      - предвидеть, как изменения политики и услуг повлияют на цифровые услуги и помощь
clinical-safety:
  name: Управление клиническими рисками
  description: Выявление, оценка и контроль рисков, которые медицинские ИТ-системы могут создавать для пациентов, с помощью процесса управления клиническими рисками, журналов опасностей и обоснований безопасности (например, в соответствии с ISO 14971 и IEC 80001-1).
  levels:
    awareness: |
      Вы можете:
      - объяснить, как медицинские ИТ-системы могут навредить пациентам, например из-за неверной, отсутствующей или запоздалой информации
      - сообщать о возможной проблеме клинической безопасности по правильному каналу
    working: |
      Вы можете:
      - участвовать в семинарах по выявлению опасностей и вносить вклад в журнал опасностей
      - следовать процессу управления клиническими рисками в своей работе
      - предоставлять доказательства для обоснования клинической безопасности, такие как результаты тестов
    practitioner: |
      Вы можете:
      - руководить выявлением опасностей и оценкой рисков для продукта или изменения
      - писать и вести журналы опасностей и отчёты об обосновании клинической безопасности
      - согласовывать меры контроля рисков с продуктовыми командами и проверять их работу
      - консультировать команды по применению стандартов управления клиническими рисками
    expert: |
      Вы можете:
      - отвечать за систему управления клиническими рисками организации
      - устанавливать политику клинической безопасности и утверждать обоснования безопасности для крупных систем
      - руководить реагированием на серьёзные инциденты безопасности, связанные с медицинскими ИТ
      - формировать культуру клинической безопасности в цифровых командах
health-data-interoperability:
  name: Совместимость медицинских данных
  description: Безопасный и согласованный обмен данными здравоохранения и ухода между системами с использованием открытых стандартов, таких как HL7 FHIR, HL7 версии 2, профили IHE и стандартные API.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему совместимость важна для согласованной помощи
      - назвать основные стандарты обмена медицинскими данными, такие как HL7 FHIR
    working: |
      Вы можете:
      - читать и использовать ресурсы, профили и API FHIR
      - создавать или тестировать простые интеграции под руководством
      - проверять сообщения на соответствие спецификации
    practitioner: |
      Вы можете:
      - проектировать и создавать интеграции с использованием FHIR, HL7 версии 2 и шаблонов обмена сообщениями
      - писать и профилировать ресурсы FHIR и руководства по внедрению
      - решать сложные проблемы сопоставления и качества данных между системами
    expert: |
      Вы можете:
      - устанавливать стандарты и стратегию совместимости для организации
      - руководить работой над стандартами на национальном уровне или между организациями
      - обеспечивать качество проектирования критически важных интеграций между многими системами
clinical-terminology:
  name: Клиническая терминология и классификация
  description: Использование клинических терминологий и классификаций, таких как SNOMED CT, ICD и LOINC, для согласованной записи и передачи клинического смысла.
  levels:
    awareness: |
      Вы можете:
      - объяснить разницу между клинической терминологией и классификацией
      - узнавать распространённые терминологии, такие как SNOMED CT и ICD
    working: |
      Вы можете:
      - находить и использовать правильные коды для элемента данных или формы
      - использовать браузеры терминологий и наборы ссылок
    practitioner: |
      Вы можете:
      - проектировать модели данных и наборы ссылок с использованием клинических терминологий
      - сопоставлять терминологии и классификации и объяснять ограничения сопоставления
      - консультировать команды по использованию терминологий в продуктах и аналитике
    expert: |
      Вы можете:
      - устанавливать терминологическую политику организации
      - руководить выпусками терминологий, их управлением и обеспечением качества
      - представлять организацию в органах по стандартам терминологий
information-governance:
  name: Управление информацией и защита данных
  description: Законное, безопасное и этичное обращение с персональной информацией и информацией о здоровье, включая законодательство о защите данных, конфиденциальность, согласие, оценку воздействия на защиту данных и обмен информацией.
  levels:
    awareness: |
      Вы можете:
      - соблюдать правила организации по обращению с персональной информацией и информацией о здоровье
      - распознавать утечку данных или потенциальный инцидент и сообщать о них
    working: |
      Вы можете:
      - применять принципы защиты данных в своей работе
      - участвовать в оценке воздействия на защиту данных
      - правильно обрабатывать запросы информации и записи
    practitioner: |
      Вы можете:
      - руководить оценками воздействия на защиту данных и соглашениями об обмене информацией
      - консультировать команды по законным основаниям, согласию, конфиденциальности и срокам хранения
      - расследовать инциденты и рекомендовать улучшения
    expert: |
      Вы можете:
      - устанавливать политику и стратегию управления информацией
      - консультировать совет директоров по информационным рискам и соблюдению требований
      - представлять организацию перед регуляторами и партнёрами
medical-device-regulation:
  name: Регулирование программного обеспечения как медицинского изделия
  description: Понимание того, когда программное обеспечение является медицинским изделием, и применимых к нему стандартов и процессов, таких как IEC 62304 и ISO 13485.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что некоторое медицинское программное обеспечение регулируется как медицинское изделие
      - знать, к кому обратиться, если продукт может быть медицинским изделием
    working: |
      Вы можете:
      - следовать процессу жизненного цикла программного обеспечения, соответствующему стандартам для медицинских изделий
      - вести записи, которых требует такой процесс
    practitioner: |
      Вы можете:
      - оценивать, является ли продукт медицинским изделием и к какому классу он вероятно относится
      - планировать регуляторную работу по продукту вместе с коллегами по качеству и клиническими коллегами
    expert: |
      Вы можете:
      - определять подход организации к регулируемому программному обеспечению
      - руководить взаимодействием с регуляторами и уполномоченными органами
people-management:
  name: Управление людьми
  description: Руководство сотрудниками, их развитие и поддержка, включая подбор, постановку целей, аттестацию, благополучие, посещаемость и справедливое управление результативностью и поведением.
  levels:
    awareness: |
      Вы можете:
      - объяснить кадровые политики организации, которые касаются вас
      - поддерживать новых коллег и делиться знаниями
    working: |
      Вы можете:
      - контролировать повседневную работу и давать обратную связь
      - участвовать в подборе и адаптации
      - проводить регулярные индивидуальные беседы
    practitioner: |
      Вы можете:
      - линейно руководить командой, ставя цели и проводя аттестации
      - поддерживать благополучие и управлять посещаемостью, результативностью и поведением
      - планировать развитие команды и преемственность
    expert: |
      Вы можете:
      - руководить руководителями и формировать культуру большого направления
      - проектировать кадровые планы и организационные изменения
      - проводить коучинг для руководителей и решать сложные кадровые вопросы
equality-diversity-inclusion:
  name: Равенство, разнообразие и инклюзивность
  description: Справедливое отношение к людям, уважение различий и проектирование услуг и рабочих мест, в которых есть место для всех.
  levels:
    awareness: |
      Вы можете:
      - относиться к коллегам, пациентам и общественности с достоинством и уважением
      - соблюдать политики в области равенства и инклюзивности
    working: |
      Вы можете:
      - распознавать поведение, исключающее других, и противостоять ему
      - учитывать разные потребности при планировании своей работы
    practitioner: |
      Вы можете:
      - проводить оценку влияния на равенство
      - формировать инклюзивные команды и практики
    expert: |
      Вы можете:
      - устанавливать стратегию инклюзивности и требовать от организации отчёта о её выполнении
      - руководить изменением культуры в области равенства, разнообразия и инклюзивности
health-safety-wellbeing:
  name: Охрана труда, безопасность и благополучие
  description: Обеспечение безопасности и благополучия себя и других на работе, включая оценку рисков, безопасные методы работы и сообщение об инцидентах.
  levels:
    awareness: |
      Вы можете:
      - соблюдать правила охраны труда и сообщать об опасностях и инцидентах
    working: |
      Вы можете:
      - проводить простые оценки рисков, например оценку рабочего места
      - помогать коллегам работать безопасно
    practitioner: |
      Вы можете:
      - управлять охраной труда в команде или на объекте
      - расследовать инциденты и внедрять меры контроля
    expert: |
      Вы можете:
      - устанавливать политику организации в области охраны труда, безопасности и благополучия
      - докладывать совету директоров о показателях безопасности
budget-management:
  name: Управление бюджетом
  description: Планирование, контроль и управление бюджетом, включая прогнозирование, управление отклонениями и соблюдение финансовых правил.
  levels:
    awareness: |
      Вы можете:
      - соблюдать правила расходования средств и оформления заказов
      - объяснить, как финансируется ваша работа
    working: |
      Вы можете:
      - отслеживать расходы по небольшому бюджету и сообщать об отклонениях
      - санкционировать расходы в пределах своего лимита
    practitioner: |
      Вы можете:
      - держать бюджет и управлять им, прогнозируя и объясняя отклонения
      - составлять бизнес-обоснование с затратами и выгодами
    expert: |
      Вы можете:
      - управлять крупными или несколькими бюджетами и устанавливать финансовые планы
      - находить компромиссы в финансировании между службами
project-management:
  name: Управление проектами
  description: Планирование, реализация и завершение проектов в согласованных рамках содержания, сроков, стоимости и качества с использованием признанного метода, такого как PRINCE2, PM² или гибкие подходы.
  levels:
    awareness: |
      Вы можете:
      - объяснить этапы проекта и основные роли в нём
      - вести проектные записи, такие как журналы действий
    working: |
      Вы можете:
      - вести планы, журналы рисков и проблем и отчёты
      - проводить проектные совещания и отслеживать действия
      - с поддержкой управлять небольшим чётко определённым проектом
    practitioner: |
      Вы можете:
      - управлять проектами от начала до завершения, контролируя содержание, сроки, стоимость и качество
      - управлять рисками, проблемами, зависимостями и контролем изменений
      - отчитываться перед советами проектов и управлять поставщиками
    expert: |
      Вы можете:
      - управлять крупными, сложными проектами или проектами высокого риска
      - устанавливать стандарты управления проектами и проводить коучинг для руководителей проектов
      - выводить проблемные проекты из кризиса
risk-management:
  name: Управление рисками организации
  description: Выявление, оценка, учёт и управление рисками для целей организации с помощью реестра рисков и определённого риск-аппетита.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что такое риск и как о нём сообщить
    working: |
      Вы можете:
      - регистрировать и обновлять риски своей области
      - предлагать меры контроля и отслеживать действия
    practitioner: |
      Вы можете:
      - вести процесс управления рисками для дирекции или программы
      - оценивать риски относительно риск-аппетита и передавать их на более высокий уровень
      - докладывать комитетам о рисках
    expert: |
      Вы можете:
      - проектировать систему управления рисками и риск-аппетит организации
      - консультировать совет директоров по стратегическим рискам
security-operations:
  name: Операции по обеспечению безопасности
  description: Мониторинг систем на предмет угроз безопасности, сортировка оповещений, расследование событий и реагирование на киберинциденты с помощью таких инструментов, как SIEM и средства обнаружения на конечных точках.
  levels:
    awareness: |
      Вы можете:
      - объяснить распространённые киберугрозы, такие как фишинг и программы-вымогатели
      - сообщать о подозрительном событии безопасности
    working: |
      Вы можете:
      - отслеживать оповещения и сортировать их по сценариям реагирования
      - собирать доказательства и передавать события на более высокий уровень
      - под руководством настраивать простые правила обнаружения
    practitioner: |
      Вы можете:
      - расследовать и сдерживать инциденты безопасности
      - писать правила обнаружения и проводить поиск угроз
      - улучшать сценарии реагирования и инструменты после инцидентов
    expert: |
      Вы можете:
      - руководить службой операций по обеспечению безопасности и её стратегией
      - руководить реагированием на крупные киберинциденты
      - работать с национальными агентствами безопасности и партнёрами
vulnerability-management:
  name: Управление уязвимостями
  description: Поиск, оценка, приоритизация и устранение технических уязвимостей, включая сканирование, тестирование на проникновение и установку исправлений.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему важны своевременная установка исправлений и безопасная конфигурация
    working: |
      Вы можете:
      - проводить сканирование уязвимостей и сообщать о результатах
      - отслеживать исправления вместе с владельцами систем
    practitioner: |
      Вы можете:
      - приоритизировать уязвимости по риску, в том числе для услуг пациентам
      - определять объём тестов на проникновение и управлять ими и устранением замечаний
    expert: |
      Вы можете:
      - устанавливать политику управления уязвимостями и её целевые показатели
      - докладывать старшим руководителям о технических рисках безопасности
identity-and-access-management:
  name: Управление идентификацией и доступом
  description: Управление цифровыми идентификаторами, аутентификацией и правами доступа сотрудников, пациентов и систем, включая ролевой доступ и аутентификацию по смарт-карте или многофакторную аутентификацию.
  levels:
    awareness: |
      Вы можете:
      - соблюдать правила доступа и защищать свои учётные данные
    working: |
      Вы можете:
      - создавать, изменять и удалять учётные записи и права доступа
      - проверять доступ на соответствие правилам ролевого доступа
    practitioner: |
      Вы можете:
      - проектировать и вести службы идентификации и доступа
      - регулярно пересматривать доступ и устранять проблемы
    expert: |
      Вы можете:
      - устанавливать стратегию идентификации и доступа для сотрудников, пациентов и систем
      - руководить внедрением новых стандартов идентификации
data-quality:
  name: Управление качеством данных
  description: Определение, измерение и улучшение качества данных, включая полноту, точность, своевременность и достоверность.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему точные медицинские данные важны для помощи и планирования
      - точно записывать данные и сообщать об ошибках
    working: |
      Вы можете:
      - проводить проверки качества данных и исправлять ошибки
