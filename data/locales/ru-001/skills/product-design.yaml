# Russian translations of data/skills/product-design.yaml. Keys are the English skill ids.
pd-health-research-ethics:
  name: Этичные исследования с пациентами и работниками сферы ухода
  description: Безопасное и этичное планирование и проведение исследований с пациентами, лицами, осуществляющими уход, клиницистами и работниками сферы ухода, включая информированное согласие, защиту, исследования с людьми в уязвимом положении и понимание того, когда требуется официальное этическое одобрение.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему исследования с пациентами и работниками сферы ухода требуют информированного согласия, защиты и бережного обращения с персональными данными
      - соблюдать процедуры команды по согласию, защите и обращению с данными на исследовательских сессиях
    working: |
      Вы можете:
      - планировать исследовательские сессии, на которых получается информированное согласие и защищаются благополучие и частная жизнь участников
      - адаптировать сессии для людей, которые нездоровы, расстроены или находятся в уязвимом положении, и понимать, когда нужно остановиться
      - распознавать проблемы защиты, возникающие в ходе исследования, и сообщать о них
    practitioner: |
      Вы можете:
      - определять, когда исследованию требуется официальное одобрение этического комитета или органа управления исследованиями, и готовить необходимое
      - планировать безопасные исследования с людьми в уязвимом положении, такими как дети, люди с деменцией и люди в кризисе
      - планировать исследования в клинических условиях, не нарушая оказание помощи, вместе с клиническими руководителями и работниками сферы ухода
      - помогать исследователям заботиться о своём благополучии после тяжёлых сессий
    expert: |
      Вы можете:
      - устанавливать стандарты организации по этичным исследованиям с пациентами, лицами, осуществляющими уход, и работниками сферы ухода
      - обеспечивать качество исследовательской практики во всех командах и консультировать по исследованиям высокого риска
      - представлять исследовательскую практику перед органами по этике, защите и управлению
pd-safety-critical-design:
  name: Проектирование с учётом клинической безопасности и человеческого фактора
  description: Проектирование услуг, интерфейсов и рабочих процессов, которые помогают клиницистам, работникам сферы ухода и пациентам действовать безопасно, с применением принципов человеческого фактора и в рамках процесса управления клиническими рисками.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как проектные решения могут вызывать или предотвращать ошибки в оказании помощи, например ошибки с пациентом или дозой
      - использовать шаблоны организации для критически важной для безопасности информации, такие как баннеры идентификации пациента и предупреждения об аллергии
    working: |
      Вы можете:
      - проектировать интерфейсы, в которых безопасное действие является самым простым, например сокращая неоднозначные подписи и лишние оповещения
      - тестировать проекты в реалистичных клинических сценариях, включая прерывания и нехватку времени
      - сообщать специалисту по клинической безопасности об опасностях, связанных с дизайном, и фиксировать, как проект их контролирует
    practitioner: |
      Вы можете:
      - применять методы человеческого фактора, такие как анализ задач и анализ ошибок использования, к сложным клиническим процессам
      - проектировать так, чтобы снизить усталость от оповещений и когнитивную нагрузку во всей услуге
      - предоставлять проектные доказательства для обоснований клинической безопасности и доказательства удобства использования для регулируемого программного обеспечения
    expert: |
      Вы можете:
      - устанавливать стандарты и шаблоны организации для проектирования, критически важного для безопасности
      - руководить работой по человеческому фактору в клинических услугах наивысшего риска
      - консультировать руководителей по клинической безопасности и продуктам о рисках, связанных с дизайном, во всём портфеле
pd-health-content:
  name: Информационный контент о здоровье
  description: Создание контента о здоровье и уходе, который точен, клинически проверен и легко понятен людям с разным уровнем грамотности в вопросах здоровья, чтобы они могли по нему действовать.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему информация о здоровье должна быть точной, актуальной и понятной
      - соблюдать руководство по стилю команды и процесс клинической проверки контента о здоровье
    working: |
      Вы можете:
      - писать контент о здоровье, который люди с низкой грамотностью в вопросах здоровья могут понять и по которому могут действовать, например о симптомах и о том, когда обращаться за помощью
      - работать с клиническими рецензентами, чтобы проверять точность контента, не теряя ясности
      - объяснять медицинские термины простым языком и последовательно называть заболевания, анализы и методы лечения
    practitioner: |
      Вы можете:
      - проектировать контент на деликатные темы и темы высокого риска, такие как неотложные симптомы, лекарства и помощь в конце жизни
      - выстраивать клиническую проверку, сроки пересмотра и источники доказательств для массива контента о здоровье
      - находить баланс между клинической точностью, правовыми требованиями и пониманием пользователей в спорном контенте
    expert: |
      Вы можете:
      - устанавливать стандарты организации для информационного контента о здоровье и его клинической проверки
      - руководить контент-стратегией для информации о здоровье во всех услугах и каналах
      - консультировать старших клинических руководителей и руководителей по коммуникациям о рисках, связанных с информацией о здоровье
