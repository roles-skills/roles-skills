# Russian translations of data/skills/data-testing.yaml. Keys are the English skill ids.
data-ai-assurance:
  name: Безопасный и справедливый ИИ в здравоохранении
  description: Обеспечение того, чтобы статистические модели, модели машинного обучения и ИИ, используемые в здравоохранении и социальной помощи, были безопасными, справедливыми, объяснимыми и находились под мониторингом, включая проверку на предвзятость между группами пациентов и соблюдение регулирования медицинских изделий и ИИ.
  levels:
    awareness: |
      Вы можете:
      - объяснить, как модель может навредить пациентам, например из-за предвзятости, дрейфа или чрезмерного доверия к её результатам
      - объяснить, почему модели нужно проверять на той популяции, с которой они будут использоваться
    working: |
      Вы можете:
      - измерять качество модели для разных групп пациентов и сообщать о любых различиях
      - документировать предполагаемое использование модели, обучающие данные и известные ограничения, например в карточке модели
      - вносить доказательства о модели в обоснование клинической безопасности
    practitioner: |
      Вы можете:
      - планировать вместе с клиническими коллегами валидацию модели, оценку предвзятости и мониторинг в эксплуатации
      - решать, когда модель нужно переобучить, ограничить или вывести из использования
      - консультировать команды о том, когда модель может регулироваться как медицинское изделие и какие доказательства для этого нужны
    expert: |
      Вы можете:
      - устанавливать стандарты организации по обеспечению качества и мониторингу ИИ в здравоохранении
      - руководить обеспечением качества моделей высокого риска до и после внедрения
      - представлять организацию перед регуляторами и партнёрами по вопросам безопасного и справедливого ИИ
data-deidentification:
  name: Псевдонимизация и контроль раскрытия
  description: Защита конфиденциальности пациентов при связывании, анализе, передаче или публикации данных с помощью псевдонимизации, анонимизации, подавления малых чисел и других методов статистического контроля раскрытия.
  levels:
    awareness: |
      Вы можете:
      - объяснить разницу между идентифицируемыми, псевдонимизированными и анонимизированными данными
      - соблюдать правила организации по подавлению малых чисел в результатах
    working: |
      Вы можете:
      - работать с псевдонимизированными данными и проводить проверки на раскрытие перед выпуском результатов
      - распознавать, когда связанные или подробные данные могут идентифицировать пациента
    practitioner: |
      Вы можете:
      - разрабатывать методы псевдонимизации и связывания, при которых идентификаторы хранятся отдельно от аналитических данных
      - оценивать риск повторной идентификации по набору данных или публикации и выбирать подходящие меры контроля
      - консультировать команды по безопасным средам, таким как доверенные исследовательские среды
    expert: |
      Вы можете:
      - устанавливать стандарты организации по деидентификации и контролю раскрытия
      - обеспечивать надёжность выпусков данных и проектов связывания с высоким риском
      - руководить работой с партнёрами по безопасному доступу к данным для исследований и планирования
