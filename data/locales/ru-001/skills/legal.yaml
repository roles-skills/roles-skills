# Russian translations of data/skills/legal.yaml. Keys are the English skill ids.
legal-legal-research:
  name: Правовые исследования
  description: Поиск, изучение и обобщение законодательства, судебной практики, руководств и прецедентов, чтобы ответить на правовой вопрос.
  levels:
    awareness: |
      Вы можете:
      - находить законодательство, руководства и образцы документов с помощью правовых баз данных и накопленных знаний организации
      - правильно использовать юридические термины
    working: |
      Вы можете:
      - исследовать определённый правовой вопрос и ясно обобщать источники
      - проверять, что источники актуальны и авторитетны
      - поддерживать в актуальном состоянии библиотеки образцов и накопленных знаний
    practitioner: |
      Вы можете:
      - исследовать сложные или новые вопросы, например как действующее право применяется к новым технологиям
      - анализировать противоречащие друг другу источники и приходить к обоснованному мнению
      - отслеживать изменения законодательства и руководств и объяснять их влияние на организацию
    expert: |
      Вы можете:
      - руководить исследованием самых сложных вопросов высокого риска для организации
      - предвидеть развитие права и готовить к нему организацию
      - участвовать в консультациях по законодательству и руководствам, затрагивающим цифровое здравоохранение и уход
legal-contract-drafting-and-review:
  name: Составление и проверка договоров
  description: Составление, проверка и согласование договоров и соглашений, таких как договоры на технологии, лицензии на программное обеспечение, облачные услуги, услуги и обработку данных.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные части договора, такие как стороны, срок, оплата, ответственность и расторжение
      - готовить стандартные документы по утверждённым шаблонам
    working: |
      Вы можете:
      - проверять типовые соглашения, такие как соглашения о неразглашении и простые договоры оказания услуг, на соответствие стандартам организации
      - вносить правки в договоры и объяснять изменения
      - замечать условия, требующие проверки юристом, такие как неограниченная ответственность или автоматическое продление
    practitioner: |
      Вы можете:
      - составлять и согласовывать сложные соглашения, такие как лицензии на программное обеспечение, облачный хостинг, системная интеграция и соглашения об обработке данных
      - консультировать по распределению рисков, включая ограничения ответственности, уровни обслуживания, выход из договора и депонирование исходного кода
      - обеспечивать, чтобы договоры защищали данные пациентов, непрерывность услуг и права организации на её программное обеспечение и данные
      - составлять и поддерживать шаблоны договоров и регламенты переговоров
    expert: |
      Вы можете:
      - устанавливать стандарты заключения договоров и позиции по рискам для организации
      - руководить переговорами по самым ценным соглашениям или соглашениям высокого риска
      - консультировать старших руководителей по стратегическим коммерческим договорённостям, таким как партнёрства и совместные предприятия
legal-legal-advice:
  name: Юридические консультации
  description: Предоставление ясных, практичных и точных юридических консультаций, которые помогают коллегам принимать законные решения и управлять правовыми рисками.
  levels:
    awareness: |
      Вы можете:
      - объяснить, когда коллегам нужна юридическая консультация и как её получить
      - принимать чёткие поручения и фиксировать факты по делу
    working: |
      Вы можете:
      - готовить проекты консультаций по типовым вопросам для проверки юристом
      - отвечать на простые вопросы с помощью утверждённых руководств
      - выявлять правовые вопросы в наборе фактов
    practitioner: |
      Вы можете:
      - давать самостоятельные юридические консультации в своих областях практики
      - объяснять правовой риск простым языком и рекомендовать практические варианты
      - консультировать по решениям, имеющим правовые последствия, таким как присуждение договоров, обмен данными и изменение услуг
      - решать, когда привлекать внешних юристов или адвокатов
    expert: |
      Вы можете:
      - консультировать совет директоров и исполнительное руководство по наиболее значимым правовым рискам организации
      - давать окончательные консультации по новым, спорным или крупным вопросам
      - устанавливать допустимый уровень правового риска для организации
      - обеспечивать качество юридических консультаций во всей организации, включая внешние консультации
legal-litigation-and-disputes:
  name: Судебные разбирательства и урегулирование споров
  description: Предотвращение, ведение и урегулирование споров и претензий, включая договорные споры, трудовые иски и взаимодействие по искам о врачебной халатности.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные этапы претензии или спора
      - регистрировать претензии и точно отслеживать сроки
    working: |
      Вы можете:
      - собирать и систематизировать документы и доказательства по делу
      - готовить хронологии, подборки документов и проекты свидетельских показаний
      - взаимодействовать с внешними юристами, страховщиками или схемами возмещения по типовым вопросам
    practitioner: |
      Вы можете:
      - вести портфель споров и претензий от первого уведомления до урегулирования или слушания
      - оценивать обоснованность и размер претензий и рекомендовать стратегию
      - вести переговоры об урегулировании и использовать альтернативные способы разрешения споров
      - обеспечивать, чтобы уроки претензий учитывались при улучшении безопасности, договоров и услуг
    expert: |
      Вы можете:
      - руководить наиболее значимыми или резонансными спорами организации
      - определять подход организации к судебным разбирательствам, урегулированию и отчётности по претензиям
      - консультировать совет директоров по условным обязательствам и репутационному риску
legal-information-and-data-law:
  name: Информационное право и право данных
  description: Применение законодательства о защите данных, конфиденциальности, свободе информации и кибербезопасности к данным здравоохранения и ухода и к цифровым услугам.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные принципы защиты данных и конфиденциальности
      - распознавать запросы информации и утечки данных и правильно их направлять
    working: |
      Вы можете:
      - проверять соглашения об обмене данными и обработке данных по шаблонам
      - помогать готовить ответы на запросы информации и запросы субъектов данных о реализации прав
      - объяснять законные основания использования данных о здоровье в типичных ситуациях
    practitioner: |
      Вы можете:
      - консультировать по защите данных, обязанности конфиденциальности и законодательству о доступе к информации для цифровых услуг
      - составлять и согласовывать соглашения об обмене данными и условия обработки данных, включая международную передачу
      - консультировать по оценке воздействия на защиту данных для новых технологий, таких как ИИ и аналитические платформы
      - консультировать по утечкам данных, запросам регулятора и жалобам
    expert: |
      Вы можете:
      - определять правовую позицию организации в отношении использования данных здравоохранения и ухода
      - руководить работой по высокорисковым или новым видам использования данных, таким как исследования, платформы данных и ИИ
      - представлять организацию перед регуляторами по вопросам информационного права
legal-legal-administration:
  name: Юридическое администрирование
  description: Ведение административных процессов юридической команды, включая управление делами, контроль документов, записи, сроки и выставление счетов.
  levels:
    awareness: |
      Вы можете:
      - открывать, обновлять и закрывать дела в системе управления делами
      - безопасно хранить и находить юридические документы
      - сохранять конфиденциальность юридической и персональной информации
    working: |
      Вы можете:
      - вести календари, сроки и ключевые даты команды
      - готовить и оформлять юридические документы, подборки документов и пакеты на подпись
      - проверять и обрабатывать счета внешних юристов
      - вести реестры договоров и актов
    practitioner: |
      Вы можете:
      - вести администрирование юридической команды и улучшать его процессы
      - отчитываться о нагрузке, расходах на внешних юристов и сроках выполнения
      - администрировать юридические технологии, такие как системы управления делами и электронной подписи
    expert: |
      Вы можете:
      - проектировать модель юридических операций для организации
      - руководить выбором и использованием юридических технологий
      - устанавливать стандарты обслуживания и показатели результативности юридических услуг
legal-employment-law:
  name: Трудовое право
  description: Применение трудового законодательства к кадровой политике организации, трудовым договорам, программам изменений и трудовым спорам.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные трудовые права сотрудников
      - распознавать трудовые вопросы, требующие юридической консультации
    working: |
      Вы можете:
      - помогать готовить документы для трудовых исков и слушаний
      - проверять трудовые договоры и политики по шаблонам
    practitioner: |
      Вы можете:
      - консультировать по трудовым вопросам, таким как увольнение, дискриминация, перевод персонала и реструктуризация
      - вести трудовые иски и согласовывать соглашения об урегулировании
      - консультировать по использованию подрядчиков и статусу занятости цифровых специалистов
    expert: |
      Вы можете:
      - консультировать совет директоров по крупным кадровым изменениям и связанным с ними правовым рискам
      - руководить резонансными или сложными трудовыми спорами
      - формировать кадровую политику так, чтобы она отвечала правовым обязанностям и надлежащей практике
legal-intellectual-property:
  name: Интеллектуальная собственность
  description: Защита и использование интеллектуальной собственности на программное обеспечение, данные, контент и изобретения, включая авторское право, лицензии, открытый исходный код и товарные знаки.
  levels:
    awareness: |
      Вы можете:
      - объяснить, что программное обеспечение, данные и контент защищены правами интеллектуальной собственности
      - распознавать, когда договор или проект порождает вопросы о правах собственности
    working: |
      Вы можете:
      - проверять условия об интеллектуальной собственности в типовых соглашениях
      - вести учёт лицензий и зарегистрированных прав
      - объяснять основные виды лицензий открытого исходного кода и их условия
    practitioner: |
      Вы можете:
      - консультировать о том, кому принадлежат программное обеспечение, данные и контент, созданные сотрудниками, поставщиками и партнёрами
      - составлять лицензии и условия об интеллектуальной собственности, включая публикацию кода организации под открытой лицензией
      - консультировать по коммерческому использованию данных и программного обеспечения организации и по распределению выгод
    expert: |
      Вы можете:
      - устанавливать политику организации в области интеллектуальной собственности и открытого исходного кода
      - руководить коммерциализацией и партнёрствами, связанными с данными и программным обеспечением организации
      - урегулировать значимые споры об интеллектуальной собственности
legal-procurement-law:
  name: Право государственных закупок
  description: Применение правил государственных закупок при приобретении товаров, услуг и технологий, от выбора способа закупки до присуждения договора и его оспаривания.
  levels:
    awareness: |
      Вы можете:
      - объяснить, почему государственные органы обязаны соблюдать правила закупок
      - распознавать, когда закупочная деятельность требует консультации специалиста по закупкам или юриста
    working: |
      Вы можете:
      - проверять конкурсную документацию на согласованность и полноту
      - поддерживать ведение записей, необходимых для подтверждения честного и прозрачного процесса
    practitioner: |
      Вы можете:
      - консультировать по способам закупки, включая рамочные соглашения, прямое присуждение и конкурентные процедуры
      - консультировать по оценке, решениям о присуждении и изменениям договоров после присуждения
      - отвечать на оспаривания и жалобы поставщиков
      - консультировать по рискам субсидиарного контроля и конкуренции в партнёрствах
    expert: |
      Вы можете:
      - определять подход организации к правовым рискам закупок
      - руководить крупными или новыми закупками, такими как инновационные партнёрства
      - защищать организацию при значимых оспариваниях закупок
legal-health-and-care-law:
  name: Законодательство о здравоохранении и уходе
  description: Применение законодательства, регулирующего услуги здравоохранения и ухода, включая согласие, дееспособность, врачебную халатность, регулирование услуг и продуктов и установленные законом обязанности организации.
  levels:
    awareness: |
      Вы можете:
      - объяснить основные установленные законом обязанности и полномочия организации
      - распознавать вопросы, связанные с безопасностью пациентов, согласием или врачебной халатностью
    working: |
      Вы можете:
      - поддерживать юридическую работу по инцидентам, расследованиям причин смерти или клиническим искам
      - объяснять нормативную базу, применимую к услугам организации
    practitioner: |
      Вы можете:
      - консультировать по полномочиям и обязанностям организации, в том числе когда она может оказывать или заказывать услугу
      - консультировать по регулированию цифровых продуктов здравоохранения, таких как программное обеспечение как медицинское изделие
      - взаимодействовать со схемами возмещения по врачебной халатности и внешними юристами по искам, связанным с цифровыми услугами
      - консультировать по согласию, дееспособности и правам пациентов в цифровых услугах
    expert: |
      Вы можете:
      - консультировать совет директоров по установленным законом обязанностям организации и корпоративному управлению
      - руководить юридической работой по публичным расследованиям, судебному контролю и крупным инцидентам
      - формировать ответ организации на новое законодательство о здравоохранении и уходе
