# Job evaluation factors in Russian. Keys are the English factor ids.
communication:
  name: Навыки общения и взаимодействия
  description: Навыки, необходимые для общения и выстраивания отношений с коллегами, пациентами, общественностью и партнёрами. Учитывается, насколько информация сложна, деликатна или спорна, а также препятствия для её понимания или принятия.
  levels:
    "1": Передаёт и получает рутинную информацию устно, в основном с коллегами.
    "2": Передаёт и получает рутинную информацию устно, письменно или в электронном виде, с коллегами и другими людьми.
    "3": Передаёт рутинную информацию, требующую такта или убеждения, либо сложную или деликатную информацию, либо проводит несложное обучение для групп.
    "4": Передаёт сложную, деликатную или спорную информацию, требующую навыков убеждения, переговоров или обучения, либо очень сложную информацию.
    "5": Передаёт очень сложную или спорную информацию, требующую развитых навыков убеждения и переговоров, выступает перед большими группами или общается при значительных препятствиях к принятию.
    "6": Передаёт очень сложную и крайне спорную информацию при значительных препятствиях к принятию, используя навыки общения высшего уровня.
knowledge:
  name: Знания, подготовка и опыт
  description: Знания и опыт, необходимые для выполнения работы, полученные из любого источника, включая формальное обучение, квалификации и опыт.
  levels:
    "1": Несколько рутинных процедур, освоенных на рабочем месте за короткий вводный инструктаж.
    "2": Ряд рутинных процедур, освоенных через обучение на рабочем месте и вводный инструктаж.
    "3": Ряд процедур, в том числе нерутинных, требующих базовой теории (например, квалификация уровня 3 или равноценный опыт).
    "4": Ряд процедур, в основном нерутинных, требующих теории среднего уровня (например, прикладное высшее образование или равноценный опыт).
    "5": Экспертиза в специализации, основанная на теории или практическом опыте (уровень высшего образования или равноценный).
    "6": Специальные знания по всему спектру специализации (уровень послевузовского диплома или равноценный).
    "7": Глубоко развитые специальные знания по всему спектру специализации (уровень магистратуры или равноценный).
    "8": Углублённые знания (учёная степень и дополнительная подготовка или равноценное), либо специальные знания в нескольких дисциплинах, накопленные за длительное время.
analytical:
  name: Аналитические навыки и навыки суждения
  description: Анализ и суждение, необходимые для обработки информации, решения проблем и принятия решений.
  levels:
    "1": Суждения о простых фактах или ситуациях.
    "2": Суждения о фактах или ситуациях, некоторые из которых требуют анализа.
    "3": Суждения о различных фактах или ситуациях, требующих анализа или сравнения вариантов.
    "4": Суждения о сложных фактах или ситуациях, требующих анализа, интерпретации и сравнения вариантов.
    "5": Суждения об очень сложных фактах или ситуациях, требующих анализа, интерпретации и сравнения вариантов.
planning:
  name: Навыки планирования и организации
  description: Планирование и организация, необходимые для ведения деятельности, программ, услуг или стратегий.
  levels:
    "1": Организует свою повседневную работу.
    "2": Планирует несложные задачи или мероприятия, некоторые из них текущие.
    "3": Планирует несколько сложных мероприятий, корректируя планы по мере необходимости.
    "4": Планирует широкий круг сложных мероприятий или стратегий, корректируя их по мере необходимости.
    "5": Формирует долгосрочные стратегические планы в условиях неопределённости и с влиянием на всю организацию.
physical-skills:
  name: Физические навыки
  description: Необходимые физические навыки, такие как ловкость, координация, навыки работы с клавиатурой и вождение.
  levels:
    "1": Физические навыки почти не требуются.
    "2": Навыки, приобретённые практикой, такие как обычная работа с клавиатурой или вождение.
    "3": Развитые навыки, требующие скорости или точности, такие как продвинутая работа с клавиатурой.
    "4": Глубоко развитые навыки, требующие точности или скорости и высокой зрительно-моторной координации.
    "5": Высший уровень точности, скорости и координации.
patient-care:
  name: Ответственность за помощь пациентам и клиентам
  description: Ответственность за оценку состояния, лечение, уход или консультирование пациентов и клиентов. Для большинства цифровых и корпоративных ролей это лишь эпизодический контакт.
  levels:
    "1": Помогает пациентам, клиентам или родственникам при эпизодическом контакте.
    "2": Даёт общие неклинические советы, информацию или услуги непосредственно пациентам или общественности.
    "3": Оказывает личный уход, базовые клинико-технические услуги или базовые клинические консультации.
    "4": Оказывает клиническую помощь, предоставляет клинико-технические услуги или консультирует по уходу за пациентами.
    "5": Разрабатывает программы помощи, предоставляет специализированные клинико-технические услуги или даёт специализированные консультации по уходу за пациентами.
    "6": Разрабатывает специализированную помощь, даёт узкоспециализированные консультации или отвечает за часть клинической службы.
    "7": Отвечает за предоставление клинической службы или службы ухода.
    "8": Корпоративная ответственность за клинические службы или службы ухода.
policy:
  name: Ответственность за развитие политики и услуг
  description: Ответственность за разработку и внедрение политики и услуг, а также масштаб их влияния.
  levels:
    "1": Следует политике, установленной другими; может комментировать изменения.
    "2": Внедряет политику в своей области и предлагает изменения её практики.
    "3": Внедряет политику в своей области и предлагает изменения, затрагивающие другие области.
    "4": Внедряет политику и разрабатывает политику или услуги для службы или нескольких областей.
    "5": Внедряет и разрабатывает ряд политик или услуг для дирекции.
    "6": Корпоративная ответственность за развитие основной политики или услуг в масштабе организации или за её пределами.
financial-resources:
  name: Ответственность за финансовые и материальные ресурсы
  description: Ответственность за денежные средства, бюджеты, оборудование, запасы, здания и другие активы.
  levels:
    "1": Бережно относится к оборудованию и ресурсам, используемым в своей работе.
    "2": Работает с наличными или ценностями, следит за оборудованием, которым пользуются другие, контролирует запасы или санкционирует небольшие платежи.
    "3": Санкционирует платежи, закупает некоторые активы или материалы, контролирует или держит делегированный бюджет либо обслуживает активы.
    "4": Держит или устанавливает бюджет отдела или службы либо закупает или обслуживает её активы.
    "5": Держит или устанавливает бюджеты либо управляет активами нескольких служб.
    "6": Корпоративная ответственность за финансы или активы организации.
people:
  name: Ответственность за людей
  description: Ответственность за управление персоналом, надзор, обучение или развитие сотрудников либо за предоставление кадровых (HR) услуг.
  levels:
    "1": Показывает свои рабочие процедуры новым или менее опытным коллегам.
    "2": Ежедневно контролирует или координирует работу сотрудников, регулярно обучает других или даёт базовые кадровые консультации.
    "3": Ежедневно руководит группой сотрудников, проводит базовое или специальное обучение или даёт основные кадровые консультации.
    "4": Линейно руководит функцией или отделом, разрабатывает учебные программы в качестве основной обязанности или предоставляет полный спектр кадровых услуг.
    "5": Линейно руководит несколькими отделами либо управляет обучением или значительной частью кадровой работы в масштабе организации.
    "6": Корпоративная ответственность за персонал организации или кадровую функцию.
information-resources:
  name: Ответственность за информационные ресурсы
  description: Ответственность за информацию и информационные системы, бумажные или цифровые, включая записи, данные и системы, в которых они хранятся.
  levels:
    "1": Регистрирует информацию, которую создаёт сам.
    "2": Вводит или хранит данные, собранные другими, либо время от времени составляет отчёты или запросы.
    "3": Ведёт официальные протоколы, регулярно составляет отчёты или запросы либо обслуживает информационные системы в качестве значительной обязанности.
    "4": Адаптирует или проектирует информационные системы по спецификациям других либо ведёт информационные системы отдела в качестве основной обязанности.
    "5": Проектирует и развивает крупные информационные системы либо ведёт информационные системы нескольких служб в качестве основной обязанности.
    "6": Управляет информационными системами и развивает их в масштабе организации в качестве основной обязанности.
    "7": Корпоративная ответственность за информационные системы организации.
research:
  name: Ответственность за исследования и разработки
  description: Ответственность за формальные исследования, разработки, оценки, аудиты, тестирование и испытания.
  levels:
    "1": Проводит опросы или аудиты в рамках своей работы; время от времени участвует в исследованиях или тестировании.
    "2": Регулярно проводит исследования, разработки, испытания либо тестирование оборудования и систем в рамках работы.
    "3": Проводит исследования или разработки в рамках формальных программ в качестве основной обязанности.
    "4": Координирует и проводит программы исследований и разработок.
    "5": Инициирует и развивает программы исследований и разработок, поддерживающие цели организации.
    "6": Инициирует и развивает программы исследований и разработок, влияние которых выходит за пределы организации.
freedom-to-act:
  name: Свобода действий
  description: В какой мере работник сам решает, что и как делать, и насколько тщательно контролируется его работа.
  levels:
    "1": Работает по установленным процедурам при близком надзоре.
    "2": Следует стандартным процедурам и прецедентам; обычно есть к кому обратиться; работа может проверяться.
    "3": Следует определённой политике и процедурам; работой управляют, а не надзирают за ней.
    "4": Результаты определены, но работник сам решает, как их достичь, в рамках общей политики.
    "5": Работает в рамках общей политики и в большинстве случаев сам решает, как её толковать.
    "6": Толкует общую политику и стратегию, чтобы устанавливать цели и стандарты.
physical-effort:
  name: Физическая нагрузка
  description: Необходимая физическая нагрузка с учётом её частоты, продолжительности и интенсивности.
  levels:
    "1": Сидит, стоит и ходит, с небольшой физической нагрузкой.
    "2": Часто сидит или стоит в стеснённом положении либо время от времени испытывает лёгкую или умеренную нагрузку.
    "3": Частая лёгкая нагрузка в течение длительного времени либо частая умеренная нагрузка в течение короткого времени.
    "4": Постоянная лёгкая нагрузка, частая умеренная нагрузка в течение длительного времени либо эпизодическая интенсивная нагрузка.
    "5": Постоянная умеренная нагрузка либо частая интенсивная нагрузка.
mental-effort:
  name: Умственная нагрузка
  description: Необходимая концентрация с учётом её частоты, продолжительности и предсказуемости работы.
  levels:
    "1": Общее внимание; эпизодическая концентрация на предсказуемой работе.
    "2": Частая концентрация на предсказуемой работе либо эпизодическая концентрация на непредсказуемой работе.
    "3": Частая концентрация на непредсказуемой работе либо эпизодическая длительная концентрация.
    "4": Частая длительная концентрация либо эпизодическая интенсивная концентрация.
    "5": Частая интенсивная концентрация.
emotional-effort:
  name: Эмоциональная нагрузка
  description: Эмоциональные требования работы, связанные с прямым или косвенным воздействием тяжёлых обстоятельств, например чтением тяжёлых материалов дел или работой с серьёзными инцидентами.
  levels:
    "1": Редкое воздействие или эпизодическое косвенное воздействие тяжёлых обстоятельств.
    "2": Эпизодическое воздействие или частое косвенное воздействие тяжёлых обстоятельств.
    "3": Частое воздействие тяжёлых обстоятельств либо эпизодическое воздействие очень тяжёлых обстоятельств.
    "4": Эпизодическое воздействие травмирующих обстоятельств либо частое воздействие очень тяжёлых обстоятельств.
working-conditions:
  name: Условия труда
  description: Воздействие неприятных условий или опасностей. Почти непрерывная работа с экраном в большинство дней засчитывается на уровне 2.
  levels:
    "1": Редкое воздействие неприятных условий.
    "2": Эпизодические неприятные условия, частые поездки или работа на открытом воздухе либо почти непрерывная работа с экраном в большинство дней.
    "3": Частые неприятные условия либо эпизодические очень неприятные условия.
    "4": Некоторое воздействие опасностей либо частые очень неприятные условия.
    "5": Значительное воздействие опасностей.
