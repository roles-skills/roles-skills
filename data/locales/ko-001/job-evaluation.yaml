# 직무평가 요소(한국어). 키는 영어 요소 id입니다.
communication:
  name: 의사소통 및 관계 형성 기술
  description: 동료, 환자, 시민, 파트너와 의사소통하고 관계를 맺는 데 필요한 기술. 정보가 얼마나 복잡하고, 민감하며, 논란의 여지가 있는지, 그리고 이해나 수용을 가로막는 장벽을 고려한다.
  levels:
    "1": 주로 동료와 정형적인 정보를 구두로 주고받는다.
    "2": 동료와 그 밖의 사람들과 정형적인 정보를 구두, 서면, 또는 전자적 방식으로 주고받는다.
    "3": 배려나 설득이 필요한 정형적인 정보, 복잡하거나 민감한 정보를 전달하거나, 집단에 대한 간단한 교육을 한다.
    "4": 설득, 협상, 교육 기술이 필요한 복잡하고 민감하거나 논란이 있는 정보, 또는 매우 복잡한 정보를 전달한다.
    "5": 고도의 설득과 협상이 필요한 매우 복잡하거나 논란이 있는 정보를 전달하거나, 대규모 청중에게 발표하거나, 수용에 큰 장벽이 있는 상황에서 소통한다.
    "6": 수용에 큰 장벽이 있는 매우 복잡하고 매우 논란이 큰 정보를 최고 수준의 의사소통 기술로 전달한다.
knowledge:
  name: 지식, 교육, 경험
  description: 학력과 교육, 자격, 경력 등 어떤 경로로 얻었든 직무를 수행하는 데 필요한 지식과 경험.
  levels:
    "1": 짧은 입문 교육과 현장에서 배우는 소수의 정형 절차.
    "2": 현장 교육과 입문 교육을 통해 배우는 다양한 정형 절차.
    "3": "일부 비정형이며 기초 수준의 이론이 필요한 다양한 절차(예: 레벨 3 자격 또는 그에 준하는 경력)."
    "4": "대부분 비정형이며 중급 수준의 이론이 필요한 다양한 절차(예: 전문대학 학위 또는 그에 준하는 경력)."
    "5": 이론이나 실무 경험에 뒷받침된 전문 분야의 숙련(학위 수준 또는 그에 준하는 수준).
    "6": 전문 분야 전체에 걸친 전문 지식(대학원 디플로마 수준 또는 그에 준하는 수준).
    "7": 전문 분야 전체에 걸친 고도로 발달한 전문 지식(석사 수준 또는 그에 준하는 수준).
    "8": 고급 지식(박사 학위에 추가 교육을 더한 것 또는 그에 준하는 것), 또는 오랜 기간에 걸쳐 쌓은 둘 이상의 분야에 걸친 전문 지식.
analytical:
  name: 분석 및 판단 기술
  description: 정보를 처리하고, 문제를 해결하고, 의사결정을 하는 데 필요한 분석과 판단.
  levels:
    "1": 단순한 사실이나 상황에 대한 판단.
    "2": 일부 분석이 필요한 사실이나 상황에 대한 판단.
    "3": 분석이나 선택지 비교가 필요한 다양한 사실이나 상황에 대한 판단.
    "4": 분석, 해석, 선택지 비교가 필요한 복잡한 사실이나 상황에 대한 판단.
    "5": 분석, 해석, 선택지 비교가 필요한 매우 복잡한 사실이나 상황에 대한 판단.
planning:
  name: 계획 및 조직화 기술
  description: 활동, 프로그램, 서비스, 전략을 운영하는 데 필요한 계획과 조직화.
  levels:
    "1": 자신의 일상 업무를 정리한다.
    "2": 단순한 과제나 활동을 계획한다. 일부는 지속적이다.
    "3": 여러 복잡한 활동을 계획하고 필요에 따라 계획을 조정한다.
    "4": 폭넓은 복잡한 활동이나 전략을 계획하고 필요에 따라 조정한다.
    "5": 불확실성이 있고 조직 전체에 영향이 미치는 장기 전략 계획을 세운다.
physical-skills:
  name: 신체 기술
  description: 손재주, 협응, 키보드 조작, 운전 등 필요한 신체 기술.
  levels:
    "1": 신체 기술이 거의 필요하지 않다.
    "2": 표준적인 키보드 조작이나 운전 등 연습으로 익히는 기술.
    "3": 고급 키보드 조작처럼 속도나 정확성이 필요한 숙련된 기술.
    "4": 정밀함이나 속도와 높은 손과 눈의 협응이 필요한 고도로 숙련된 기술.
    "5": 최고 수준의 정밀함, 속도, 협응.
patient-care:
  name: 환자·이용자 돌봄에 대한 책임
  description: 환자나 이용자를 평가하고, 치료하고, 돌보고, 조언하는 일에 대한 책임. 대부분의 디지털 직무와 관리 직무에서는 우발적인 접촉에 그친다.
  levels:
    "1": 우발적인 접촉 중에 환자, 이용자, 또는 가족을 돕는다.
    "2": 환자나 시민에게 일반적인 비임상 조언, 정보, 서비스를 직접 제공한다.
    "3": 개인 돌봄, 기초적인 임상 기술 서비스, 또는 기초적인 임상 조언을 제공한다.
    "4": 임상 돌봄을 수행하거나, 임상 기술 서비스를 제공하거나, 환자 돌봄에 대해 조언한다.
    "5": 돌봄 프로그램을 개발하거나, 전문 임상 기술 서비스를 제공하거나, 환자 돌봄에 대해 전문적인 조언을 한다.
    "6": 전문 돌봄을 개발하거나, 고도로 전문적인 조언을 하거나, 임상 서비스의 일부에 책임을 진다.
    "7": 임상 또는 돌봄 서비스의 제공에 책임을 진다.
    "8": 임상 또는 돌봄 서비스에 대한 조직 전체의 책임.
policy:
  name: 정책 및 서비스 개발에 대한 책임
  description: 정책과 서비스를 개발하고 시행하는 일에 대한 책임, 그리고 그 영향이 미치는 범위.
  levels:
    "1": 다른 사람이 정한 정책을 따른다. 변경에 대해 의견을 낼 수 있다.
    "2": 자기 영역의 정책을 시행하고 그 관행의 변경을 제안한다.
    "3": 자기 영역의 정책을 시행하고 다른 영역에 영향을 주는 변경을 제안한다.
    "4": 정책을 시행하고 하나의 서비스 또는 여러 영역의 정책이나 서비스를 개발한다.
    "5": 디렉터레이트의 다양한 정책이나 서비스를 시행하고 개발한다.
    "6": 조직 안팎에 걸친 주요 정책이나 서비스 개발에 대한 조직 전체의 책임.
financial-resources:
  name: 재무 및 물적 자원에 대한 책임
  description: 자금, 예산, 장비, 재고, 건물, 그 밖의 자산에 대한 책임.
  levels:
    "1": 자신의 업무에 쓰는 장비와 자원을 직접 관리한다.
    "2": 현금이나 귀중품을 다루거나, 다른 사람이 쓰는 장비를 관리하거나, 재고를 통제하거나, 소액 지급을 승인한다.
    "3": 지급을 승인하거나, 일부 자산이나 물품을 구매하거나, 위임된 예산을 모니터링하거나 보유하거나, 자산을 유지한다.
    "4": 부서나 서비스의 예산을 보유하거나 수립하거나, 그 자산을 구매하거나 유지한다.
    "5": 여러 서비스의 예산을 보유하거나 수립하거나, 자산을 관리한다.
    "6": 조직의 재무나 자산에 대한 조직 전체의 책임.
people:
  name: 사람에 대한 책임
  description: 직원을 관리하고, 감독하고, 교육하고, 육성하는 일, 또는 인사(HR) 서비스를 제공하는 일에 대한 책임.
  levels:
    "1": 새로 들어왔거나 경험이 적은 동료에게 자신의 업무 방식을 보여 준다.
    "2": 직원을 일상적으로 감독하거나 조정하거나, 다른 사람을 정기적으로 교육하거나, 기초적인 인사 조언을 한다.
    "3": 직원 집단을 일상적으로 관리하거나, 핵심 또는 전문 교육을 하거나, 핵심적인 인사 조언을 한다.
    "4": 기능이나 부서를 직접 관리하거나, 교육 프로그램 설계를 주된 업무로 하거나, 인사 서비스 전반을 제공한다.
    "5": 여러 부서를 직접 관리하거나, 조직 전체의 교육 또는 인사의 큰 부분을 관리한다.
    "6": 조직의 사람 또는 인사 기능에 대한 조직 전체의 책임.
information-resources:
  name: 정보 자원에 대한 책임
  description: 기록, 데이터, 그리고 이를 담은 시스템을 포함하여, 종이든 디지털이든 정보와 정보 시스템에 대한 책임.
  levels:
    "1": 직무 담당자가 만들어 내는 정보를 기록한다.
    "2": 다른 사람이 정리한 데이터를 입력하거나 저장하거나, 가끔 보고서나 쿼리를 작성한다.
    "3": 공식 회의록을 작성하거나, 보고서나 쿼리를 정기적으로 작성하거나, 정보 시스템을 유지하는 것이 중요한 업무이다.
    "4": 다른 사람의 사양에 맞춰 정보 시스템을 조정하거나 설계하거나, 주된 업무로 한 부서의 정보 시스템을 운영한다.
    "5": 주요 정보 시스템을 설계하고 개발하거나, 주된 업무로 여러 서비스의 정보 시스템을 운영한다.
    "6": 주된 업무로 조직 전체의 정보 시스템을 관리하고 개발한다.
    "7": 조직의 정보 시스템에 대한 조직 전체의 책임.
research:
  name: 연구 및 개발에 대한 책임
  description: 정식 연구, 개발, 평가, 감사, 테스트, 시범에 대한 책임.
  levels:
    "1": 자신의 업무를 위해 조사나 감사를 수행하고, 가끔 연구나 테스트에 참여한다.
    "2": 업무의 일부로 연구, 개발, 시범, 장비 및 시스템 테스트를 정기적으로 한다.
    "3": 정식 프로그램 안에서 연구나 개발을 주된 업무로 수행한다.
    "4": 연구 개발 프로그램을 조정하고 수행한다.
    "5": 조직의 목표를 뒷받침하는 연구 개발 프로그램을 시작하고 발전시킨다.
    "6": 조직 밖에까지 영향이 미치는 연구 개발 프로그램을 시작하고 발전시킨다.
freedom-to-act:
  name: 행동의 자유
  description: 직무 담당자가 무엇을 어떻게 할지 스스로 정하는 정도, 그리고 업무가 얼마나 면밀히 감독되는지.
  levels:
    "1": 정해진 절차 안에서 일하며, 가까이에서 감독을 받는다.
    "2": 표준 절차와 선례를 따른다. 대개 물어볼 사람이 있고, 업무를 점검받을 수 있다.
    "3": 정해진 정책과 절차를 따른다. 업무는 감독되기보다 관리된다.
    "4": 결과는 정해져 있지만, 이를 달성하는 방법은 폭넓은 정책 안에서 직무 담당자가 정한다.
    "5": 일반 정책 안에서 일하며, 대부분의 경우 이를 어떻게 해석할지 스스로 정한다.
    "6": 전반적인 정책과 전략을 해석하여 목표와 기준을 정한다.
physical-effort:
  name: 신체적 부담
  description: 빈도, 지속 시간, 강도를 고려한 신체적 노력.
  levels:
    "1": 앉기, 서기, 걷기. 신체적 노력은 거의 없다.
    "2": 제한된 자세로 자주 앉거나 서 있거나, 가끔 가벼운 정도에서 중간 정도의 노력이 든다.
    "3": 오랜 시간 가벼운 노력이 자주 들거나, 짧은 시간 중간 정도의 노력이 자주 든다.
    "4": 가벼운 노력이 계속되거나, 오랜 시간 중간 정도의 노력이 자주 들거나, 가끔 강한 노력이 든다.
    "5": 중간 정도의 노력이 계속되거나, 강한 노력이 자주 든다.
mental-effort:
  name: 정신적 부담
  description: 빈도, 지속 시간, 업무의 예측 가능성을 고려한 집중의 필요.
  levels:
    "1": 일반적인 주의. 예측 가능한 업무에 가끔 집중한다.
    "2": 예측 가능한 업무에 자주 집중하거나, 예측하기 어려운 업무에 가끔 집중한다.
    "3": 예측하기 어려운 업무에 자주 집중하거나, 가끔 장시간 집중한다.
    "4": 장시간 집중이 잦거나, 가끔 매우 강하게 집중한다.
    "5": 매우 강한 집중이 잦다.
emotional-effort:
  name: 감정적 부담
  description: 힘든 사례 기록을 읽거나 중대한 사건을 다루는 것처럼, 고통스러운 상황에 직접 또는 간접적으로 노출되어 생기는 감정적 요구.
  levels:
    "1": 고통스러운 상황에 드물게 노출되거나, 가끔 간접적으로 노출된다.
    "2": 고통스러운 상황에 가끔 노출되거나, 자주 간접적으로 노출된다.
    "3": 고통스러운 상황에 자주 노출되거나, 매우 고통스러운 상황에 가끔 노출된다.
    "4": 충격적인 상황에 가끔 노출되거나, 매우 고통스러운 상황에 자주 노출된다.
working-conditions:
  name: 근무 환경
  description: 불쾌한 환경이나 위험 요소에 노출되는 정도. 대부분의 날에 거의 계속 화면을 사용하는 것은 레벨 2로 본다.
  levels:
    "1": 불쾌한 환경에 드물게 노출된다.
    "2": 불쾌한 환경에 가끔 노출되거나, 잦은 이동이나 야외 근무가 있거나, 대부분의 날에 거의 계속 화면을 사용한다.
    "3": 불쾌한 환경에 자주 노출되거나, 매우 불쾌한 환경에 가끔 노출된다.
    "4": 위험 요소에 어느 정도 노출되거나, 매우 불쾌한 환경에 자주 노출된다.
    "5": 위험 요소에 상당히 노출된다.
