summary: >
  정보 거버넌스 직원은 조직이 개인 정보와 건강 정보를 적법하고, 안전하며, 윤리적으로 다루도록 돕는다. 개인정보 보호와 비밀 유지에 대해 팀에 조언하고, 정보 권리 요청을 처리하며, 개인정보 영향평가를 지원하고, 데이터 침해를 관리하며, 조직이 정보 거버넌스 기준을 충족함을 보이는 근거를 모은다.
health_context:
  - 개인정보 보호법은 건강 정보에 추가적인 보호를 부여하므로, 적법한 사용, 보안, 투명성의 기준이 높다.
  - 디지털 헬스 서비스는 많은 돌봄 조직 사이에서 데이터를 공유하는 경우가 많으므로, 정보 공유 협약과 데이터 흐름을 신중하게 검토해야 한다.
  - 환자와 일반 대중은 자신의 기록과 조직의 정보에 접근할 법적 권리를 가지며, 여기에는 엄격한 기한이 있다.
  - 건강 정보와 관련된 데이터 침해는 실제적인 해와 고통을 일으킬 수 있으므로, 인시던트는 신속하고 신중하게 처리해야 한다.
  - 분석, 연구, AI 등 데이터의 새로운 사용은 동의, 비밀 유지, 시민의 신뢰에 관한 문제를 낳는다.
levels:
  - title: 정보 거버넌스 담당자
    summary: 정해진 절차에 따라 정보 권리 요청, 인시던트 기록, 교육 기록, 근거 수집에서 정보 거버넌스 팀을 지원한다.
    responsibilities:
      - 정보 권리 요청을 기록하고, 접수를 알리고, 추적하며, 답변을 위한 정보를 모은다.
      - 데이터 침해와 아차 사고를 기록하고 검토를 위해 사실을 모은다.
      - 정보 자산 등록부와 데이터 흐름 맵 같은 정보 거버넌스 등록부를 최신으로 유지한다.
      - 연례 정보 거버넌스 자체 평가를 위한 근거를 수집한다.
      - 직원의 정보 거버넌스 교육 이수 현황을 추적한다.
      - 직원의 정형적인 정보 거버넌스 질문에 답한다.
    qualifications:
      - 사무 또는 기록 업무 경력, 또는 개인정보 보호 기초 수준 자격, 또는 그에 준하는 경력.
    job_evaluation_notes: 감정적 부담은 요청, 기록, 침해 보고서에 담긴 힘든 내용을 간접적으로 접하는 경우가 잦음을 반영한다.
  - title: 시니어 정보 거버넌스 담당자
    summary: 정보 권리 요청과 인시던트의 담당 건수를 맡고, 개인정보 영향평가와 정보 공유에 대해 팀을 지원한다.
    responsibilities:
      - 법적 기한 안에 가림 처리와 예외 적용을 포함하여 정보 권리 요청을 처리한다.
      - 데이터 침해와 아차 사고를 평가하고 조사하며 종결될 때까지 조치를 추적한다.
      - 프로젝트 팀이 개인정보 영향평가를 완성하고 데이터 흐름을 기술하는 것을 돕는다.
      - 검토용 정보 공유 협약서와 개인정보 처리 안내문의 초안을 쓴다.
      - 직원 대상 정보 거버넌스 교육과 브리핑을 진행한다.
      - 접근과 기록 관리 감사를 수행한다.
    qualifications:
      - 개인정보 보호 또는 정보 거버넌스의 공인된 자격, 또는 그에 준하는 경력.
  - title: 정보 거버넌스 리드
    summary: 디렉터레이트 또는 프로그램에 전문적인 정보 거버넌스 조언을 하며 개인정보 영향평가와 복잡한 사례를 이끈다.
    responsibilities:
      - 적법한 근거, 동의, 비밀 유지, 보존에 대해 프로덕트 팀과 서비스에 조언한다.
      - 복잡한 시스템의 개인정보 영향평가를 검토하고 통제를 권고한다.
      - 복잡하거나 논쟁적인 정보 권리 요청과 내부 재검토를 처리한다.
      - 중대한 데이터 침해를 조사하고 규제 기관에 통지해야 하는지 권고한다.
      - 파트너 조직과의 정보 공유 협약서를 검토한다.
      - 정보 거버넌스 담당자를 감독하고 코칭한다.
    qualifications:
      - 개인정보 보호 또는 정보 거버넌스의 공인된 전문 자격, 또는 그에 준하는 경력.
      - 보건 또는 돌봄 환경에서 개인정보 보호에 대해 조언한 경험.
  - title: 정보 거버넌스 매니저
    summary: 팀, 사례 업무, 보증 프로그램, 교육을 포함하여 정보 거버넌스 서비스를 일상적으로 관리한다.
    responsibilities:
      - 정보 거버넌스 팀과 그 사례 업무를 관리하며 법적 기한이 지켜지도록 한다.
      - 정보 거버넌스 보증 프로그램과 연례 자체 평가를 계획하고 운영한다.
      - 정보 거버넌스 정책과 절차를 작성하고 검토한다.
      - 정보 리스크에 대해 시니어 매니저에게 조언하고 정보 리스크 등록부를 유지한다.
      - 보안, 임상 안전, 커뮤니케이션 동료와 협력하여 중대한 인시던트에 대한 대응을 이끈다.
      - 전 직원을 위한 정보 거버넌스 교육을 설계하고 감독한다.
    qualifications:
      - 개인정보 보호 또는 정보 거버넌스의 공인된 전문 자격, 또는 그에 준하는 경력.
      - 보건 또는 돌봄 분야 정보 거버넌스에 관한 상당한 경력.
  - title: 정보 거버넌스 책임자
    summary: 조직의 정보 거버넌스를 이끌고 그 정책과 전략을 정하며 정보 리스크와 컴플라이언스에 대해 시니어 리더에게 조언한다.
    responsibilities:
      - 조직의 정보 거버넌스 전략, 정책, 체계를 정한다.
      - 정보 거버넌스 및 기록 서비스를 이끌고 그 직원을 육성한다.
      - 정보 리스크 경영 책임자, 이사회, 그 위원회에 정보 리스크와 컴플라이언스에 대해 조언한다.
      - 복잡한 공개, 공유, 침해 통지 문제에 대해 최종 결정을 내린다.
      - 규제 기관, 감사인, 파트너 조직에 대해 조직을 대표한다.
      - 새로운 디지털 서비스, 데이터 사용, AI가 처음부터 프라이버시와 투명성을 고려해 설계되도록 한다.
    qualifications:
      - 개인정보 보호 또는 정보 거버넌스의 공인된 전문 자격, 또는 그에 준하는 경력.
      - 보건 또는 돌봄 분야에서 정보 거버넌스를 이끈 풍부한 경력.
