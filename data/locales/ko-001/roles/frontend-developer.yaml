summary: >
  프런트엔드 개발자는 환자용 웹사이트와 앱, 온라인 양식, 임상의와 돌봄 직원이 돌봄 중에 쓰는 화면 등 조직의 디지털 헬스 서비스의 사용자 인터페이스를 구현한다. 몸이 안 좋은 사람, 불안한 사람, 오래된 기기를 쓰는 사람을 포함해 모든 사람에게 작동하는, 접근하기 쉽고, 빠르고, 안전한 코드를 작성하며, 디자이너, 리서처, 임상의와 함께 다기능 프로덕트 팀에서 일한다.
health_context:
  - 사용자의 상당수는 몸이 안 좋거나, 통증이 있거나, 고령이거나, 장애가 있으므로, 접근성과 쉽고 차분한 인터페이스는 선택이 아니라 필수이다.
  - 약물 용량, 검사 결과, 예약 시각 같은 임상 정보의 표시가 혼란스럽거나 틀리면 환자에게 해를 끼칠 수 있으므로, 프런트엔드 작업은 임상 리스크 관리 프로세스를 따른다.
  - 인터페이스는 민감한 건강 정보를 표시하는 경우가 많으므로, 개발자는 공용 기기와 바쁜 임상 공간 등에서의 프라이버시를 고려해 설계한다.
  - 임상의는 시간 압박과 잦은 중단 속에서 인터페이스를 쓰므로, 화면은 빠르고, 예측 가능하며, 잘못 읽기 어려워야 한다.
  - 환자는 다양한 기기와 회선으로 서비스에 접속하므로, 서비스는 점진적 향상 방식을 채택하고 느린 회선에서도 작동해야 한다.
levels:
  - title: 어프렌티스 프런트엔드 개발자
    responsibilities:
      - 체계적인 교육과 페어 작업을 통해 팀의 디자인 시스템, 언어, 도구를 배운다.
      - 면밀한 감독을 받으며 조직의 디자인 시스템에 따라 작은 인터페이스 컴포넌트를 구현한다.
      - 동료의 도움을 받아 스크린 리더 같은 보조 기술로 컴포넌트를 테스트한다.
      - 테스트 데이터와 운영 데이터를 다룰 때 정보 거버넌스와 임상 안전 절차를 따른다.
      - 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - 소프트웨어 개발 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 주니어 프런트엔드 개발자
    responsibilities:
      - 지도를 받으며 사용자 스토리를 바탕으로 환자용 및 직원용 서비스의 인터페이스 기능을 구현하고 테스트한다.
      - 서비스의 모양과 동작이 일관되도록 조직의 디자인 시스템과 패턴을 사용한다.
      - 접근성 결함을 수정하고 WCAG 같은 접근성 표준에 비추어 페이지를 점검한다.
      - 날짜, 용량, 결과 같은 임상 정보가 지정된 대로 정확하게 표시되도록 한다.
      - 테스트 결과와 변경 화면 캡처 같은 임상 안전 케이스의 근거를 제공한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 수료한 어프렌티스십, 또는 그에 준하는 경력.
  - title: 프런트엔드 개발자
    responsibilities:
      - 적절한 방법을 고르고 보건 서비스의 접근하기 쉬운 반응형 인터페이스를 자율적으로 설계하고 구현한다.
      - 디자이너, 사용자 리서처와 협력하여 환자, 임상의, 돌봄 직원과 프로토타입을 테스트한다.
      - HL7 FHIR 서비스 같은 건강 데이터 API를 호출하는 인터페이스를 구현하고 오류와 데이터 누락을 안전하게 처리한다.
      - 위험 요소 워크숍에 참여하고 확인 단계나 명확한 경고 같은 안전 통제를 인터페이스에 반영한다.
      - 공용 기기의 세션 관리와 캐시를 신중하게 다루는 등 브라우저 안의 민감한 정보를 보호한다.
      - 코드를 리뷰하고 주니어 및 어프렌티스 프런트엔드 개발자를 멘토링한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 접근하기 쉬운 운영 웹 서비스를 구축하고 지원한 경험.
  - title: 시니어 프런트엔드 개발자
    responsibilities:
      - 예약, 결과, 임상 워크플로 화면 등 핵심 기능의 프런트엔드 설계와 제공을 이끈다.
      - 접근성, 성능, 보안, 테스트를 포함하여 팀의 프런트엔드 기준을 정하고 유지한다.
      - 조직의 디자인 시스템에 컴포넌트와 패턴을 기여하고 그것이 안전하고 접근하기 쉬운지 확인한다.
      - 임상 안전 책임자와 협력하여 인터페이스의 위험 요소가 식별, 통제, 테스트되도록 한다.
      - 서비스가 느린 회선, 오래된 기기, 보조 기술에서도 잘 작동하도록 한다.
      - 팀의 프런트엔드 개발자를 코칭하고 육성한다.
    qualifications:
      - 접근하기 쉬운 운영 웹 서비스의 설계, 구축, 지원에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 프런트엔드 개발자
    responsibilities:
      - 여러 팀 또는 환자 대상 핵심 서비스에 걸쳐 프런트엔드 엔지니어링을 이끈다.
      - 조직의 디자인 시스템과 프런트엔드 라이브러리의 기술적 방향을 맡는다.
      - 서비스 전반의 인터페이스가 접근성 표준을 충족하고 임상 안전 보증을 받도록 한다.
      - 아키텍트, 디자이너, 임상 리드와 협력하여 프로덕트 로드맵과 프런트엔드 기술 선택을 형성한다.
      - 프런트엔드 실천 공동체를 이끌고 프런트엔드 개발자를 직접 관리하거나 이끈다.
    qualifications:
      - 복잡하고 접근하기 쉬운 서비스의 프런트엔드 엔지니어링을 이끈 풍부한 경력.
  - title: 프런트엔드 개발 책임자
    responsibilities:
      - 조직의 모든 디지털 서비스에 대한 프런트엔드 전략, 기준, 관행을 정한다.
      - 환자와 직원을 위한 조직 인터페이스의 접근성과 사용성에 책임을 진다.
      - 프런트엔드 기술, 디자인 시스템 투자, 부실한 인터페이스가 돌봄에 미치는 리스크에 대해 시니어 리더에게 조언한다.
      - 조직 간 디자인 시스템 및 접근성 커뮤니티에서 조직을 대표한다.
      - 채용과 경력 경로를 포함하여 조직 전체의 프런트엔드 개발자를 이끌고 육성한다.
    qualifications:
      - 여러 팀과 조직에 걸쳐 프런트엔드 개발을 이끈 풍부한 경력.
