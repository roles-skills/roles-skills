summary: >
  관리 회계 담당자는 관리자가 계획을 세우고, 지출을 통제하고, 좋은 결정을 내리는 데 필요한 재무 정보와 조언을 제공한다. 예산을 수립하고 모니터링하며, 지출을 예측하고, 서비스의 원가를 계산하며, 투자의 재무적 근거를 만든다. 디지털 의료 조직에서는 디지털 프로그램 및 프로덕트 팀과 긴밀히 협력하며, 자본과 경상, 전 생애 비용, 비용 대비 가치를 올바르게 파악하는 것이 좋은 결정의 중심이 된다.
health_context:
  - 디지털 프로그램은 자본과 경상, 용도가 정해진 자금, 기한이 있는 자금이 섞여 재원이 조달되는 경우가 많으며, 각각 지출 용도에 관한 고유한 규칙이 있다.
  - 자사 보유 시스템에서 클라우드 서비스와 구독으로의 이동은 비용을 자본에서 경상으로 옮겨 예산, 비즈니스 케이스, 자금 신청에 영향을 준다.
  - 투자 결정은 재무적 절감뿐 아니라 공적 자금에 대한 비용 대비 가치와 환자, 임상의, 돌봄 직원에 대한 편익을 보여야 한다.
  - 소프트웨어, 호스팅, 지원 계약은 여러 해 이어지는 경우가 많으므로, 예측에는 가동 후에도 오래 이어지는 운영 비용이 포함되어야 한다.
  - 디지털 및 임상 팀의 예산 보유자는 재무 전문가가 아닐 수 있으므로, 명확하고 실용적인 조언이 직무의 큰 부분을 차지한다.
levels:
  - title: 트레이니 관리 회계 담당자
    summary: 재무 분석가라고도 불리는 트레이니 관리 회계 담당자는 공인된 회계 자격 취득을 위해 노력하면서 한 무리의 예산 보유자를 위한 예산 보고서와 분석을 작성한다.
    responsibilities:
      - 한 무리의 예산 보유자를 위한 월별 예산 보고서를 작성하고 주요 차이를 설명한다.
      - 보고서가 정확하도록 월말 분개, 미지급 비용, 정정을 기장한다.
      - 지출이 코스트 센터, 프로젝트, 자본과 경상 사이에서 올바르게 분류되었는지 확인한다.
      - 예측 정보를 수집하고 예산 보유자와 함께 예측을 갱신한다.
      - 지도를 받아 비즈니스 케이스를 위한 비용 정보를 작성한다.
      - 공인된 회계 자격 취득을 위해 노력한다.
    qualifications:
      - 학위 또는 중급 회계 자격과 공인된 회계 자격 취득을 위한 노력, 또는 그에 준하는 경력.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 진행된 시점에 직무가 요구하는 수준으로 평가했다. 위임된 예산의 모니터링이므로 재무 자원은 레벨 3이다.
  - title: 관리 회계 담당자
    summary: 관리 회계 담당자는 디렉터레이트 또는 서비스군의 예산 수립, 모니터링, 예측을 운영하고 예산 보유자에게 그 재무에 대해 조언하는 자격을 갖춘 회계 담당자이다.
    responsibilities:
      - 디렉터레이트 또는 서비스군의 월별 보고 및 예측 주기를 이끈다.
      - 예산 안에 머물기 위한 지출, 리스크, 조치에 대해 예산 보유자에게 조언한다.
      - 직원 비용, 계약, 라이선스를 포함한 연간 예산을 작성한다.
      - 소프트웨어 개발, 라이선스, 하드웨어 등 디지털 지출에 자본 및 경상 규칙을 적용한다.
      - 비즈니스 케이스와 대안 평가를 위해 재무 모델을 구축한다.
      - 트레이니 회계 담당자를 감독하고 육성한다.
    qualifications:
      - 공인된 회계 자격, 또는 그에 준하는 경력.
  - title: 시니어 관리 회계 담당자
    summary: 시니어 관리 회계 담당자는 복잡한 예측, 원가 계산, 비즈니스 케이스를 포함하여 대규모 디렉터레이트 또는 주요 디지털 프로그램의 재무 관리를 이끈다.
    responsibilities:
      - 대규모 디렉터레이트 또는 주요 디지털 프로그램의 예산 수립과 예측을 이끈다.
      - 자금 변경, 딜리버리 지연, 자본에서 클라우드 구독 비용으로의 이동 같은 시나리오를 모델링한다.
      - 전 생애 비용, 편익, 비용 대비 가치를 포함하여 중요한 투자의 재무적 근거를 이끈다.
      - 디지털 서비스 운영의 총비용 같은 서비스와 프로덕트의 원가 계산을 구축한다.
      - 재무 실적과 리스크를 시니어 관리자와 프로그램 위원회에 발표한다.
      - 회계 담당자와 트레이니의 작은 팀을 관리한다.
    qualifications:
      - 공인된 회계 자격과 자격 취득 후의 상당한 경력, 또는 그에 준하는 것.
    job_evaluation_notes: 예산 보유자와 함께 디렉터레이트 또는 프로그램의 예산을 수립하므로 재무 자원은 레벨 4이다.
  - title: 파이낸스 비즈니스 파트너
    summary: 파이낸스 비즈니스 파트너는 흔히 디지털·데이터·기술 디렉터레이트의 리더십의 일원으로 일하며, 재무 정보를 의사결정으로 바꾸고 투자가 비용 대비 가치를 내도록 한다.
    responsibilities:
      - 디지털·데이터·기술 등 디렉터레이트 리더십 팀의 상급 재무 어드바이저를 맡는다.
      - 지출을 우선순위, 인력, 투자에 연결하며 디렉터레이트의 재무 계획을 이끈다.
      - 공급자에 대한 지출, 라이선스 사용, 클라우드 비용을 포함한 비용 대비 가치에 대해 리더에게 이의를 제기하고 지원한다.
      - 주요 디지털 투자의 비즈니스 케이스를 이끌고 투자 위원회에서 재무를 대표한다.
      - 디지털 지출이 자금 규칙, 지출 통제, 자본 및 경상 한도를 충족하도록 한다.
      - 디렉터레이트를 지원하는 관리 회계 담당자를 직접 관리한다.
    qualifications:
      - 공인된 회계 자격과 비즈니스 파트너링을 포함한 자격 취득 후의 풍부한 경력.
    job_evaluation_notes: 디렉터레이트의 여러 서비스에 걸쳐 예산을 수립하므로 재무 자원은 레벨 5이다.
  - title: 관리 회계 책임자
    summary: 관리 회계 책임자는 조직의 예산 편성, 예측, 관리 보고와 이를 수행하는 비즈니스 파트너 및 회계 담당자 팀을 이끈다.
    responsibilities:
      - 조직의 연간 예산 수립과 기중 예측을 이끈다.
      - 이사회와 경영진을 위한 관리 보고, 원가 계산, 실적 정보를 설계한다.
      - 디지털 투자를 포함하여 비즈니스 케이스와 투자 평가 기준을 정한다.
      - 재무 리스크, 절감 계획, 자금 범위 안에 머물기 위해 필요한 선택에 대해 디렉터에게 조언한다.
      - 비즈니스 파트너링 및 관리 회계 팀을 이끌고 육성한다.
      - 예산 보유자를 위한 셀프서비스 보고를 포함하여 예산 편성과 보고 도구를 개선한다.
    qualifications:
      - 공인된 회계 자격과 재무 팀을 이끈 경험을 포함한 자격 취득 후의 풍부한 경력.
