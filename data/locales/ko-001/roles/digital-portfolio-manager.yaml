summary: >
  디지털 포트폴리오 매니저는 조직이 디지털 프로젝트, 프로그램, 프로덕트 포트폴리오를 선정하고, 추적하고, 통제하여 환자, 임상의, 돌봄 직원에게 가장 도움이 되는 일에 투자하도록 돕는다. 포트폴리오 거버넌스와 보고를 운영하고, 리더가 충분한 근거로 우선순위를 정하도록 지원하며, 포트폴리오가 약속한 편익을 내도록 한다.
health_context:
  - 디지털 업무는 일선 돌봄과 자금을 두고 경쟁하므로, 포트폴리오 매니저는 리더가 환자와 직원에 대한 디지털 투자의 편익을 보이도록 돕는다.
  - 포트폴리오 거버넌스에는 임상 안전, 정보 거버넌스, 사이버 보안 보증이 포함되어야 하므로, 포트폴리오 매니저는 이를 기간, 비용, 범위와 함께 추적한다.
  - 많은 디지털 프로젝트가 테스트를 맡는 임상의나 교육을 받는 직원 등 임상·운영 팀의 용량에 의존하므로, 포트폴리오 매니저는 서비스에 대한 수요 충돌을 주시한다.
  - 자금은 고유한 보고 규칙과 기한을 가진 여러 재원에서 오는 경우가 많으므로, 포트폴리오 매니저는 보고를 정확하게 기한 내에 유지한다.
levels:
  - title: 디지털 포트폴리오 분석가
    responsibilities:
      - 포트폴리오 전반의 프로젝트에서 상태, 리스크, 재무, 편익 데이터를 수집하고 확인한다.
      - 포트폴리오 등록부와 대시보드를 유지하고 보고의 공백이나 불일치를 찾는다.
      - 포트폴리오 거버넌스 위원회용 자료와 보고서를 작성한다.
      - 임상 안전 승인과 개인정보 영향평가 같은 프로젝트 전반의 보증 마일스톤을 추적한다.
      - 우선순위 설정과 계획 분석에서 포트폴리오 매니저를 지원한다.
    qualifications:
      - 학위 또는 관련 자격, 또는 분석이나 보고에 관한 그에 준하는 경력.
    job_evaluation_notes: UK GDaD PCF는 분석가와 매니저 두 수준을 모두 HEO 또는 SEO에 둔다. 이 레퍼런스는 분석가를 포트폴리오 매니저에게 보고하는 학습 단계의 수준이므로 밴드 5에, 매니저를 밴드 6에 두어 두 수준이 같은 밴드에 들지 않도록 한다.
  - title: 디지털 포트폴리오 매니저
    responsibilities:
      - 한 디렉터레이트의 모든 디지털 업무 등 디지털 프로젝트와 프로그램의 포트폴리오를 조율한다.
      - 팀이 거버넌스, 보증, 딜리버리 프로세스를 따르고 이것이 적정 수준이 되도록 돕는다.
      - 필요, 편익, 리스크, 용량의 근거를 활용해 리더가 업무에 우선순위를 매기도록 지원한다.
      - 포트폴리오 실적, 리스크, 편익을 위원회와 이해관계자에게 명확하게 보고한다.
      - 프로젝트 전반에서 임상·운영 팀에 대한 수요 충돌을 찾아 해결을 돕는다.
    qualifications:
      - 포트폴리오, 프로그램, 또는 프로젝트 관리 경력, 또는 그에 준하는 경력.
  - title: 시니어 디지털 포트폴리오 매니저
    responsibilities:
      - 조직의 디지털 포트폴리오 또는 그 큰 부분과 그 거버넌스 및 보증 프로세스를 관리한다.
      - 포트폴리오 전반의 성과와 편익을 추적·분석하고 팀이 제공할 수 있도록 과제에 대응한다.
      - 포트폴리오가 임상 안전, 정보 거버넌스, 사이버 보안 보증을 포함한 기준을 충족하도록 한다.
      - 우선순위 설정, 투자, 득실에 대해 명확한 근거로 시니어 리더에게 조언한다.
      - 자금 제공자와 외부 기관에 대한 포트폴리오 보고를 관리한다.
      - 포트폴리오 분석가와 매니저를 직접 관리한다.
    qualifications:
      - 포트폴리오 또는 프로그램 관리에 관한 풍부한 경력(석사에 준하는 수준).
    job_evaluation_notes: UK GDaD PCF가 디지털 포트폴리오 매니저(HEO/SEO)에서 시니어 디지털 포트폴리오 매니저(G7)로 넘어가므로 밴드 7 수준은 없다.
  - title: 디지털 포트폴리오 책임자
    responsibilities:
      - 디지털 포트폴리오 기능과 포트폴리오 매니저 팀을 이끈다.
      - 포트폴리오의 전략, 통제, 거버넌스를 정하고 이것이 쓰이도록 한다.
      - 경영진이 투자 결정을 내릴 수 있도록 포트폴리오의 미래에 대한 통찰을 제공한다.
      - 포트폴리오가 환자, 직원, 조직에 가져오는 편익이 실현되고 보고되도록 한다.
      - 포트폴리오 수준의 리스크에 대응하고 이슈를 경영 팀에 상위 보고한다.
      - 기능의 예산과 역량을 관리한다.
    qualifications:
      - 복잡한 조직에서 포트폴리오 관리를 이끈 풍부한 경력.
    job_evaluation_notes: 디지털 포트폴리오 책임자가 여러 서비스에 걸친 디지털 포트폴리오 전체의 투자를 감독하므로 재무 자원은 레벨 5로 평가했다. 포트폴리오 등록부와 보고가 조직 전체에 미치므로 정보 자원은 레벨 6이다.
