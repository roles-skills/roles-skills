summary: >
  인터랙션 디자이너는 환자용 앱과 양식부터 임상의가 병상에서 쓰는 화면까지, 환자, 돌봄 제공자, 임상의, 돌봄 직원이 조직의 디지털 헬스 서비스를 어떻게 쓰는지 설계한다. 단순하고, 접근하기 쉽고, 안전한 인터랙션을 설계하고, 실제 이용자와 테스트하며, 서비스가 일관되고 익숙하게 느껴지도록 공유 디자인 시스템을 사용한다.
health_context:
  - 임상의는 시간 압박, 중단, 공용 기기 속에서 시스템을 쓰는 경우가 많으므로, 설계는 빠르고 정확한 작업을 뒷받침하고 안전한 행동이 쉬운 행동이 되게 해야 한다.
  - 부실한 디자인은 환자를 잘못 선택하거나 용량을 잘못 읽는 등 임상적 해를 일으킬 수 있으므로, 디자이너는 휴먼 팩터 원칙을 적용하고 임상 안전 책임자와 협력한다.
  - 많은 이용자는 몸이 안 좋거나, 불안하거나, 고령이거나, 장애가 있으므로, 설계는 접근성 표준을 충족하고 디지털 기술이나 건강 문해력이 낮은 사람에게도 작동해야 한다.
  - 알림과 경고는 사람들이 알아차리고 신뢰할 때에만 유용하므로, 디자이너는 알림 피로를 줄이고 안전이 중요한 정보를 눈에 띄게 유지하도록 돕는다.
levels:
  - title: 어소시에이트 인터랙션 디자이너
    responsibilities:
      - 교육과 페어 작업을 통해 인터랙션 디자인 기법과 팀의 디자인 시스템을 배운다.
      - 감독을 받으며 스케치, 와이어프레임, 간단한 프로토타입을 만든다.
      - 이용자와의 디자인 테스트를 돕고 무엇이 되고 무엇이 안 되는지 기록한다.
      - 환자 신원과 안전 경고의 패턴을 포함하여 접근성 표준과 디자인 시스템의 패턴을 따른다.
    qualifications:
      - 디자인 또는 관련 분야의 자격이나 어프렌티스십 취득을 목표로 하고 있거나, 그에 준하는 경력.
  - title: 주니어 인터랙션 디자이너
    responsibilities:
      - 더 상위의 디자이너의 지시를 받으며 양식, 흐름, 화면 등 서비스의 일부를 설계하고 프로토타입으로 만든다.
      - 환자, 돌봄 제공자, 직원과 디자인을 테스트하고 배운 것을 바탕으로 변경한다.
      - 보조 기술과 함께 작동하는 접근하기 쉬운 인터랙션을 설계한다.
      - 오류 가능성을 어떻게 줄이는지를 포함하여 디자인 결정을 팀에 설명한다.
    qualifications:
      - 디자인 또는 관련 분야 학위, 또는 그에 준하는 경력.
  - title: 인터랙션 디자이너
    responsibilities:
      - 초기 콘셉트부터 상세하고 테스트된 디자인까지 디지털 헬스 프로덕트의 인터랙션을 설계한다.
      - 임상 워크플로에 맞춰 설계하고, 중단을 포함한 현실적인 시나리오에서 임상의 및 돌봄 직원과 테스트한다.
      - 디자인과 관련된 위험 요소를 임상 안전 책임자에게 제기하고 디자인이 이를 어떻게 통제하는지 기록한다.
      - 안전이 중요한 정보의 패턴을 포함하여 디자인 시스템을 사용하고 기여한다.
      - 개발자와 긴밀히 협력하여 디자인이 의도대로 구현되고 접근하기 쉬운 상태로 유지되도록 한다.
    qualifications:
      - 디자인 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 이용자와 함께 디지털 서비스를 설계한 경험.
    job_evaluation_notes: UK GDaD PCF는 인터랙션 디자이너를 시니어 인터랙션 디자이너와 같은 제안 밴드 7의 SEO 또는 G7에 둔다. 이 레퍼런스는 두 인터랙션 디자이너 수준이 같은 밴드에 들지 않도록, PCF 스킬 수준이 동일한 서비스 디자이너 수준과 같은 밴드 6에 둔다.
  - title: 시니어 인터랙션 디자이너
    responsibilities:
      - 많은 돌봄 현장에서 쓰이는 임상 시스템 등 복잡한 서비스의 인터랙션 디자인을 이끈다.
      - 과업 분석 같은 휴먼 팩터 기법을 안전이 중요한 임상 워크플로에 적용한다.
      - 임상 안전 케이스와, 소프트웨어가 규제 대상인 경우 사용성 파일에 디자인 근거를 제공한다.
      - 팀의 디자인 방향과 우수 사례를 정하는 데 기여하고 다른 디자이너를 멘토링한다.
      - 리서치와 데이터로부터 디자인 결정을 내리고 임상 및 프로덕트 리더에게 설명한다.
    qualifications:
      - 인터랙션 디자인에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 인터랙션 디자이너
    responsibilities:
      - 여러 팀이나 서비스에 걸쳐 인터랙션 디자인의 방향을 정하고 품질을 보증한다.
      - 조직 전체의 팀이 재사용하는 접근하기 쉽고 안전이 중요한 패턴을 포함하여 디자인 시스템을 이끈다.
      - 임상 안전 책임자와 함께 가장 위험이 높은 임상 서비스의 휴먼 팩터 작업을 이끈다.
      - 프로덕트 및 임상 시니어 리더와 협력하여 주요 서비스의 디자인 콘셉트를 개발한다.
      - 인터랙션 디자이너를 직접 관리하고 육성한다.
    qualifications:
      - 팀을 가로질러 인터랙션 디자인을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF가 리드 인터랙션 디자이너를 G7 또는 G6에 두고 이 레퍼런스가 제안된 밴드 8b를 따르므로 밴드 8a 수준은 없다. 리드 디자이너가 여러 서비스의 디자인 기준을 정하므로 정책은 레벨 5이다.
  - title: 인터랙션 디자인 책임자
    responsibilities:
      - 인터랙션 디자인 직군을 이끌고 그 전략, 기준, 업무 방식을 정한다.
      - 서비스가 쓰기 쉽고, 접근하기 쉽고, 안전하도록 디자인과 조직의 전략에 영향을 준다.
      - 조직의 디자인 시스템을 맡고 그것이 접근성과 임상 안전 요구를 충족하도록 한다.
      - 채용, 경력 경로, 교육을 포함하여 디자인 역량을 키운다.
      - 보건·돌봄 시스템 전반의 동료와 공유 디자인 패턴에 협력한다.
    qualifications:
      - 디자인과 디자인 실천을 이끈 풍부한 경력.
