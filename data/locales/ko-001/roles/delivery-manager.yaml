summary: >
  딜리버리 매니저는 다기능 팀이 환자, 임상의, 돌봄 직원에게 효과가 있는 디지털 헬스 서비스를 제공하도록 돕는다. 애자일과 린 업무 방식을 활용해 팀이 잘 일할 수 있는 조건을 만들고, 장애물을 제거하며, 리스크와 의존성을 관리하고, 지속 가능한 속도로 딜리버리를 진전시킨다.
health_context:
  - 환자 돌봄을 뒷받침하는 서비스의 릴리스는 임상 안전과 정보 거버넌스 점검을 통과해야 하므로, 딜리버리 매니저는 이를 팀의 계획과 완료의 정의에 반영한다.
  - 딜리버리는 환자 곁을 떠날 수 있는 시간이 제한된 임상의와 돌봄 직원에 의존하는 경우가 많아, 딜리버리 매니저는 임상 근무표에 맞춰 리서치, 테스트, 교육을 계획한다.
  - 운영 중인 임상 서비스의 변경에는 신중한 시점 선택이 필요하므로, 딜리버리 매니저는 운영 팀과 가동 시작을 계획하여 임상의 혼잡 시기를 피하고 지원 체계를 갖춘다.
  - 팀은 임상 시스템 공급자와 다른 보건·돌봄 조직에 의존하는 경우가 많아, 딜리버리 매니저는 외부 의존성과 계약을 관리한다.
levels:
  - title: 어소시에이트 딜리버리 매니저
    responsibilities:
      - 스탠드업, 계획, 쇼앤텔, 회고 같은 팀 행사를 진행한다.
      - 팀의 보드, 리스크·이슈 로그, 의존성 기록을 최신으로 유지한다.
      - 각 릴리스 전에 필요한 임상 안전, 정보 거버넌스, 접근성 과제를 추적한다.
      - 임상 근무표에 맞춰 리서치와 테스트를 위한 임상의, 돌봄 직원, 환자와의 세션을 마련한다.
      - 더 큰 팀의 딜리버리 매니저를 따라다니며 지원하고 지도를 받아 업무의 일부를 제공한다.
    qualifications:
      - 딜리버리 팀에서 또는 딜리버리 팀과 함께 일한 일정한 경력, 또는 그에 준하는 경력.
  - title: 딜리버리 매니저
    responsibilities:
      - 디스커버리, 알파, 베타, 가동을 거쳐 디지털 헬스 프로덕트나 서비스의 딜리버리를 이끈다.
      - 가동 시 지원, 교육, 롤백 계획을 포함하여 운영 및 임상 팀과 릴리스를 계획한다.
      - 임상 안전, 정보 거버넌스, 접근성 보증이 마지막이 아니라 딜리버리와 보조를 맞춰 이루어지도록 한다.
      - 팀의 예산, 공급자 계약, 인력 배치를 관리한다.
      - 진행 상황, 리스크, 편익을 거버넌스 위원회에 쉬운 말로 보고한다.
      - 건전한 팀 문화를 만들고 팀원에게 애자일 업무 방식을 코칭한다.
    qualifications:
      - 애자일 방법으로 디지털 프로덕트나 서비스를 제공한 상당한 경력.
    job_evaluation_notes: UK GDaD PCF에는 어소시에이트(EO/HEO)와 딜리버리 매니저(SEO/G7) 사이에 딜리버리 매니저 수준이 없으므로 밴드 6 수준은 없다.
  - title: 시니어 딜리버리 매니저
    responsibilities:
      - 응급 진료에서 쓰이거나 핵심 임상 시스템을 교체하는 서비스처럼 복잡하거나 위험이 높은 서비스의 딜리버리를 이끈다.
      - 여러 팀에 걸친 딜리버리 리스크, 이슈, 의존성의 주된 상위 보고 창구가 된다.
      - 임상 안전 책임자, 운영 리드와 함께 사업장과 조직에 걸친 대규모 롤아웃을 계획한다.
      - 서비스의 예산, 상업적 약정, 공급자 실적을 관리한다.
      - 딜리버리 매니저를 직접 관리하고 육성한다.
    qualifications:
      - 복잡한 디지털 서비스를 그 생애 주기 전체에 걸쳐 제공한 풍부한 경력.
  - title: 딜리버리 관리 책임자
    responsibilities:
      - 딜리버리 관리 직군을 이끌고 애자일 딜리버리에 관한 조직의 기준을 정한다.
      - 포트폴리오 전반에서 딜리버리 매니저를 채용하고, 육성하고, 배치한다.
      - 딜리버리 방식이 팀을 불필요하게 늦추지 않으면서 임상 안전, 정보 거버넌스, 보증 요구사항을 충족하도록 한다.
      - 딜리버리 리스크, 용량, 우선순위에 대해 경영진과 임상 리더에게 조언한다.
      - 직군의 예산과 인력 계획을 관리한다.
    qualifications:
      - 여러 팀에 걸쳐 딜리버리를 이끌고 딜리버리 실천을 이끈 풍부한 경력.
