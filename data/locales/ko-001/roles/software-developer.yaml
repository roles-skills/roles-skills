summary: >
  소프트웨어 개발자는 환자용 앱, 임상 시스템, 연동 서비스, 데이터 플랫폼 등 조직의 디지털 헬스 서비스를 뒷받침하는 소프트웨어를 만들고, 테스트하고, 유지한다. 다기능 프로덕트 팀에서 일하며 안전하고, 견고하고, 접근하기 쉽고, 유지하기 쉬운 코드를 작성하고 운영 중인 서비스를 지원한다.
health_context:
  - 소프트웨어는 환자 돌봄에 영향을 줄 수 있으므로, 개발자는 임상 리스크 관리 프로세스를 따르고 안전 케이스에 근거를 제공한다.
  - 코드는 민감한 건강 정보를 다루는 경우가 많으므로, 개발자는 정보 거버넌스와 안전한 코딩 관행을 기본으로 적용한다.
  - 많은 서비스가 HL7 FHIR 같은 개방형 상호운용성 표준으로 다른 보건·돌봄 시스템과 데이터를 교환한다.
  - 일부 소프트웨어는 의료기기로 규제될 수 있으므로, 개발자는 언제 규제 관련 조언을 구해야 하는지 알아야 한다.
levels:
  - title: 어프렌티스 소프트웨어 개발자
    responsibilities:
      - 체계적인 교육과 페어 작업을 통해 팀의 언어, 도구, 업무 방식을 배운다.
      - 면밀한 감독을 받으며 작고 명확하게 정의된 코드를 작성하고 테스트한다.
      - 안전한 코딩, 정보 거버넌스, 임상 안전 절차를 따른다.
      - 스탠드업, 계획, 회고 같은 팀 행사에 참여한다.
      - 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - 소프트웨어 개발 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다. 정보 자원은 다른 사람이 설계한 시스템에서 작업한다는 점을 반영한다.
  - title: 주니어 소프트웨어 개발자
    responsibilities:
      - 지도를 받으며 사용자 스토리를 바탕으로 팀 프로덕트의 기능을 구현하고 테스트한다.
      - 환자 돌봄을 뒷받침하는 서비스를 포함하여 자동화 테스트를 작성하고 결함을 수정한다.
      - 테스트 결과와 변경 기록 같은 임상 안전 케이스의 근거를 제공한다.
      - 정보 거버넌스 규칙에 따라 건강 데이터를 안전하게 다룬다.
      - 팀의 지원 체계의 일환으로 지도를 받으며 운영 중인 서비스를 지원한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 수료한 어프렌티스십, 또는 그에 준하는 경력.
  - title: 소프트웨어 개발자
    responsibilities:
      - 적절한 방법을 고르고 기능과 서비스를 자율적으로 설계, 구현, 테스트한다.
      - 코드를 리뷰하고 팀의 엔지니어링 기준을 유지하는 데 기여한다.
      - HL7 FHIR 같은 개방형 표준으로 다른 보건·돌봄 시스템과의 연동을 구현한다.
      - 위험 요소 식별에 참여하고 임상 안전 통제를 코드와 테스트에 반영하도록 돕는다.
      - 서비스가 요구하면 시간 외 대응을 포함하여 운영 서비스의 문제를 조사하고 수정한다.
      - 주니어 및 어프렌티스 개발자를 멘토링한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 운영 소프트웨어를 구축하고 지원한 경험.
  - title: 시니어 소프트웨어 개발자
    responsibilities:
      - 핵심 기능과 서비스의 기술 설계와 제공을 이끈다.
      - 테스트, 보안, 접근성을 포함하여 팀의 엔지니어링 기준을 정하고 유지한다.
      - 사용자 요구, 임상 안전, 보안, 비용의 균형을 맞춘 기술적 결정을 내린다.
      - 팀 서비스의 인시던트 조사를 이끌고 수정을 추진한다.
      - 임상 안전 책임자와 협력하여 안전 통제가 설계에 반영되고 테스트되도록 한다.
      - 팀의 개발자를 코칭하고 육성한다.
    qualifications:
      - 운영 소프트웨어의 설계, 구축, 지원에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 소프트웨어 개발자
    responsibilities:
      - 프로덕트 또는 여러 팀의 엔지니어링을 이끌고 기술적 방향을 정한다.
      - 소프트웨어가 안전성, 보안, 복원력, 상호운용성을 고려해 설계되도록 한다.
      - 아키텍트, 프로덕트 매니저, 임상 리드와 협력하여 프로덕트 로드맵을 형성한다.
      - 개발자 실천 공동체를 이끌고 팀 전반의 기준을 정한다.
      - 개발자를 직접 관리하거나 이끌며 성장과 성과를 지원한다.
    qualifications:
      - 복잡한 서비스의 소프트웨어 엔지니어링을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 리드 개발자와 프린시펄 개발자 모두 G7 또는 G6에 가깝다고 본다. 이 레퍼런스는 리드를 밴드 8a, 프린시펄을 밴드 8b에 둔다.
  - title: 프린시펄 소프트웨어 개발자
    responsibilities:
      - 조직의 소프트웨어 개발에 대한 엔지니어링 전략, 기준, 관행을 정한다.
      - 기술 선택, 리스크, 투자에 대해 시니어 리더에게 조언한다.
      - 서비스 전반에 걸친 가장 복잡한 기술 과제의 해결을 이끈다.
      - 조직 간 커뮤니티와 오픈소스 엔지니어링 커뮤니티에서 조직을 대표한다.
      - 리드 개발자를 이끌고 육성하며 조직의 엔지니어링 역량을 높인다.
    qualifications:
      - 여러 팀과 조직에 걸쳐 엔지니어링을 이끈 풍부한 경력.
