summary: >
  재무 회계 담당자는 조직의 결산이 완전하고 정확하며 회계 기준과 공공 부문 보고 규칙을 따르도록 한다. 대차대조표를 관리하고, 연간 결산과 법정 신고서를 작성하며, 현금과 자금 운용을 관리하고, 자산을 회계 처리하며, 감사인과 협력한다. 디지털 의료 조직에서는 복잡성의 많은 부분이 소프트웨어, 데이터 자산, 클라우드 약정, 다년도 기술 계약의 회계 처리에서 나온다.
health_context:
  - 디지털 지출의 회계 처리에는 소프트웨어 개발, 클라우드 서비스 설정, 라이선스를 자본 자산으로 처리할 수 있는지 등의 판단이 필요하다.
  - 조직은 엄격한 자본 및 현금 한도에 비추어, 자금 제공자와 감독 기관에 공적 자금의 사용처를 설명해야 한다.
  - 다년도 라이선스 및 지원 계약은 선급 비용, 약정, 때로는 리스를 만들어 내며 올바르게 회계 처리해야 한다.
  - 조직이 구축하는 소프트웨어 같은 무형 자산은 프로덕트가 바뀜에 따라 평가, 감가상각, 손상 검토가 필요하다.
  - 공공 기관에 대한 외부 감사는 철저하고 공개되므로, 근거와 작업 서류는 높은 수준이어야 한다.
levels:
  - title: 트레이니 재무 회계 담당자
    summary: 트레이니 재무 회계 담당자는 공인된 회계 자격 취득을 위해 노력하면서 결산을 위한 대차대조표 대사표, 분개, 작업 서류를 작성한다.
    responsibilities:
      - 대차대조표 대사표를 작성하고 대사 항목을 해소한다.
      - 미지급 비용, 선급 비용, 감가상각 같은 월말 및 연말 분개를 기장한다.
      - 소프트웨어와 하드웨어 자산을 포함하여 고정 자산 대장을 유지한다.
      - 연간 결산과 감사를 위한 작업 서류와 근거를 준비한다.
      - 현금 흐름 정보와 은행 계정 조정표를 작성한다.
      - 공인된 회계 자격 취득을 위해 노력한다.
    qualifications:
      - 학위 또는 중급 회계 자격과 공인된 회계 자격 취득을 위한 노력, 또는 그에 준하는 경력.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 진행된 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 재무 회계 담당자
    summary: 재무 회계 담당자는 대차대조표를 관리하고 연간 결산, 법정 신고서, 세무 신고서의 각 부분을 작성하는 자격을 갖춘 회계 담당자이다.
    responsibilities:
      - 대차대조표의 월말 및 연말 결산을 관리한다.
      - 연간 결산서와 그 주석의 각 부분을 작성한다.
      - 어떤 디지털 비용을 자산화할 수 있는지의 판단을 포함하여 자본적 지출을 회계 처리한다.
      - 부가세 신고서를 작성하고 계약의 세무 처리에 대해 조언한다.
      - 감사인의 질문에 답하고 그 지적 사항에 대한 조치에 합의한다.
      - 트레이니 회계 담당자를 감독하고 육성한다.
    qualifications:
      - 공인된 회계 자격, 또는 그에 준하는 경력.
  - title: 시니어 재무 회계 담당자
    summary: 시니어 재무 회계 담당자는 연간 결산 프로세스와 무형 자산, 리스, 클라우드 약정 같은 복잡한 영역의 회계 처리를 이끈다.
    responsibilities:
      - 연간 결산 일정과 외부 감사를 계획하고 이끈다.
      - 소프트웨어 개발이나 클라우드 설정 비용의 자산화 같은 복잡한 판단에 관한 회계 문서를 쓴다.
      - 소프트웨어 자산의 내용연수, 감가상각, 손상을 포함하여 자본 회계를 관리한다.
      - 현금 예측과 현금 한도 안에서의 자금 인출을 관리한다.
      - 연결과 자본에 관한 신고서 같은 법정 및 자금 제공자 신고서를 작성한다.
      - 재무 회계 담당자의 작은 팀을 관리하고 육성한다.
    qualifications:
      - 공인된 회계 자격과 자격 취득 후의 상당한 경력, 또는 그에 준하는 것.
    job_evaluation_notes: 조직의 현금 상황과 자본 회계를 관리하므로 재무 자원은 레벨 4이다.
  - title: 재무 회계 매니저
    summary: 재무 회계 매니저는 조직의 재무 회계, 자금 운용, 세무를 운영하고 통제와 감사 조치가 갖춰지도록 한다.
    responsibilities:
      - 재무 회계, 자금 운용, 세무 기능을 관리한다.
      - 클라우드와 데이터 서비스 같은 새로운 종류의 지출에 대한 조직의 회계 정책과 그 적용을 맡는다.
      - 은행 계좌, 은행 거래 약정, 현금 흐름 예측을 관리한다.
      - 기술 계약과 공유 서비스를 포함하여 세무 컴플라이언스와 세무 리스크를 관리한다.
      - 재무 회계와 통제에 관한 내부·외부 감사 지적에 대한 대응을 이끈다.
      - 재무 회계 담당자와 자금 운용 직원을 직접 관리한다.
    qualifications:
      - 공인된 회계 자격과 자격 취득 후의 풍부한 경력.
    job_evaluation_notes: 모든 서비스에 걸쳐 조직의 은행 거래, 현금, 자산을 관리하므로 재무 자원은 레벨 5이다.
  - title: 재무 회계 책임자
    summary: 재무 회계 책임자는 조직의 법정 보고, 재무 통제, 자금 운용, 세무를 이끌며 외부 감사인의 주된 연락 창구를 맡는다.
    responsibilities:
      - 연차 보고서와 결산서의 작성을 이끌고 감사 위원회에 제시한다.
      - 중요한 회계상의 판단과 새로운 기준에 대해 디렉터와 감사 위원회에 조언한다.
      - 재무 규칙, 재무 절차, 권한 위임 체계를 맡는다.
      - 재무 보고에 관한 외부 감사인 및 감독 기관과의 관계를 이끈다.
      - 자금 운용 및 세무 정책을 정하고 재무 리스크를 관리한다.
      - 재무 회계, 자금 운용, 거래 처리 팀을 이끌고 육성한다.
    qualifications:
      - 공인된 회계 자격과 법정 보고를 이끈 경험을 포함한 자격 취득 후의 풍부한 경력.
