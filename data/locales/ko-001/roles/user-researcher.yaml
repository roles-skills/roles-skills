summary: >
  사용자 리서처는 팀이 환자, 돌봄 제공자, 임상의, 돌봄 직원을 포함하여 보건·돌봄 서비스를 이용하고 제공하는 사람들을 이해하도록 돕는다. 리서치를 안전하고 윤리적으로 계획하고 수행하며, 배운 것을 명확한 통찰로 바꾸고, 서비스를 가장 이용하기 어려운 사람들의 요구를 포함하여 실제 요구에 관한 근거를 바탕으로 디지털 헬스 서비스의 의사결정이 이루어지도록 한다.
health_context:
  - 조사 참여자는 몸이 안 좋거나, 불안하거나, 취약한 상황에 있는 경우가 많으므로, 리서처는 사전 동의, 안전 보호, 참여자의 웰빙을 신중하게 계획한다.
  - 리서치에서는 질병, 상실, 부실한 돌봄 같은 힘든 경험을 듣게 될 수 있으므로, 리서처에게는 자신과 팀이 받는 정서적 영향을 다루는 지원이 필요하다.
  - 임상의와 돌봄 직원은 환자 곁을 떠날 시간이 거의 없으므로, 리서처는 주로 관찰과 짧은 세션을 통해 돌봄을 방해하지 않고 임상 현장에서 리서치를 계획한다.
  - 일부 리서치는 공식 보건 연구에 해당하거나 환자 데이터를 쓰므로, 리서처는 윤리 또는 연구 거버넌스 승인과 개인정보 점검이 언제 적용되는지 알아야 한다.
  - 건강 격차는 현실이므로, 리서처는 디지털 기술이 낮은 사람, 장애가 있는 사람, 언어가 제한된 사람, 서비스를 거의 쓰지 않는 사람을 포함하도록 의식적으로 노력한다.
levels:
  - title: 어소시에이트 사용자 리서처
    responsibilities:
      - 교육과 경험 있는 리서처와의 협업을 통해 사용자 리서치 기법을 배운다.
      - 동의와 안전 보호 절차를 따르며 메모하고, 세션 운영과 참여자 모집을 돕는다.
      - 리서치 데이터를 안전하게, 정보 거버넌스 규칙에 맞춰 보관한다.
      - 리서치 데이터 분석을 돕고 발견한 내용을 팀과 공유한다.
    qualifications:
      - 관련 분야의 자격이나 어프렌티스십 취득을 목표로 하고 있거나, 그에 준하는 경력.
    job_evaluation_notes: 환자와 돌봄 제공자 대상 리서치에서는 질병, 상실, 부실한 돌봄에 관한 이야기를 듣는 경우가 많으므로, 감정적 부담은 사용자 리서처의 모든 수준에서 레벨 2이다. 리서치는 여기서는 레벨 2부터 평가하며 리서치가 주된 업무가 되면 레벨 3으로 올라간다.
  - title: 주니어 사용자 리서처
    responsibilities:
      - 더 상위의 리서처의 지도를 받으며 환자, 돌봄 제공자, 직원과의 리서치 세션을 계획하고 수행한다.
      - 돌봄 현장에서 인터뷰, 사용성 테스트, 맥락 관찰 같은 기법을 사용한다.
      - 사전 동의를 얻고, 참여자의 필요에 맞춰 세션을 조정하며, 안전 보호 문제를 제기한다.
      - 발견한 내용을 분석하여 명확하고 실행 가능한 통찰로 팀에 제시한다.
      - 서비스를 이용하기 어려운 사람을 포함하여 다양한 참여자를 모집한다.
    qualifications:
      - 사회과학이나 심리학 등 관련 분야의 학위, 또는 그에 준하는 경력.
  - title: 사용자 리서처
    responsibilities:
      - 다기능 팀을 위해 사용자 리서치를 계획하고 수행하며, 질문과 참여자에 맞는 기법을 고른다.
      - 임상 워크플로와 안전이 중요한 과업을 이해하기 위해 임상의와 돌봄 직원의 근무 현장에서 리서치를 한다.
      - 취약한 상황에 있는 사람들과의 리서치를 안전하게 계획하고 윤리 또는 연구 거버넌스 승인이 필요한지 판단한다.
      - 안전성과 접근성에 관한 근거를 포함하여 팀이 우선순위를 정하는 데 도움이 되는 통찰을 공유한다.
      - 팀을 리서치에 참여시켜 사용자를 직접 이해하게 한다.
    qualifications:
      - 관련 분야의 학위, 또는 그에 준하는 경력.
      - 사용자 리서치를 계획하고 수행한 경험.
  - title: 시니어 사용자 리서처
    responsibilities:
      - 여러 돌봄 현장에 걸치거나 위기에 처한 사람들을 돕는 복잡한 서비스의 리서치를 계획하고 이끈다.
      - 리서치를 서비스의 더 넓은 계획 및 다른 팀의 리서치와 일치시킨다.
      - 취약한 상황에 있는 사람들과의 안전한 리서치를 계획하고 윤리 및 연구 거버넌스 신청서를 준비한다.
      - 사용자 리서처를 감독하고 육성하며 그 업무의 질과 윤리를 보증한다.
      - 새로운 팀과 임상 이해관계자와 함께 사용자 중심 실천을 키운다.
    qualifications:
      - 사용자 리서치에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 사용자 리서처
    responsibilities:
      - 여러 팀 또는 프로그램 전체에 걸쳐 사용자 리서치를 이끌고 일치시킨다.
      - 팀이 사용자 중심이고 근거에 기반한 접근을 취하고, 리서치가 건강 격차의 영향을 가장 많이 받는 사람들에게 닿도록 한다.
      - 동의, 안전 보호, 데이터 취급, 참여자 웰빙을 포함하여 리서치 실천을 정하고 보증한다.
      - 리서치 저장소와 참여자 패널처럼 팀이 안전하게 재사용할 수 있는 공유 리서치 자산을 구축한다.
      - 사용자 리서처를 직접 관리하고 육성한다.
    qualifications:
      - 팀을 가로질러 사용자 리서치를 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF가 리드 사용자 리서처를 G7 또는 G6에 두고 이 레퍼런스가 제안된 밴드 8b를 따르므로 밴드 8a 수준은 없다. 참여자 모집과 사례비 등 리서치 예산 때문에 재무 자원은 레벨 3이다.
  - title: 사용자 리서치 책임자
    responsibilities:
      - 사용자 리서치 직군을 이끌고 그 전략, 기준, 윤리를 정한다.
      - 환자, 돌봄 제공자, 돌봄 직원에 관한 근거로 조직의 전략과 우선순위에 영향을 준다.
      - 경력 경로와 채용을 포함하여 리서치 인재를 유치하고, 키우고, 육성한다.
      - 조직 전반의 리서치 실천을 보증하고 고위험 리서치의 상위 보고 창구가 된다.
      - 윤리, 안전 보호, 연구 거버넌스 기구에 대해 리서치 실천을 대표한다.
    qualifications:
      - 사용자 리서치와 리서치 실천을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 리드 사용자 리서처와 사용자 리서치 책임자를 모두 제안 밴드 8b의 G7 또는 G6에 둔다. 이 레퍼런스는 책임자가 조직 전체에서 직군을 이끌고 리서치 프로그램을 시작하므로, 다른 사용자 중심 디자인 직군의 책임자에 맞춰 책임자를 밴드 8c에 둔다.
