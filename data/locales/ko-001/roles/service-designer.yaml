summary: >
  서비스 디자이너는 누군가 처음 도움이 필요한 순간부터 돌봄이 끝날 때까지 디지털, 전화, 종이, 대면 채널에 걸쳐 보건·돌봄 서비스를 엔드투엔드로 설계한다. 환자, 돌봄 제공자, 임상의, 돌봄 직원과 협력하여 서비스가 실제로 어떻게 작동하는지 매핑하고, 사람들을 실망시키는 지점을 찾아내며, 안전하고, 단순하고, 공정하고, 조직 경계를 넘어 작동하는 서비스를 설계한다.
health_context:
  - 돌봄 경로는 많은 조직과 직군에 걸쳐 있으므로, 서비스 디자이너는 인수인계, 대기, 환자와 돌봄 제공자가 돌봄을 이어 붙이기 위해 하는 일을 포함하여 여정 전체를 매핑한다.
  - 서비스가 작동하는 방식을 바꾸면 새로운 임상 리스크가 생길 수 있으므로, 서비스 디자이너는 임상 안전 책임자와 협력하여 새로운 서비스 모델의 위험 요소를 가동 전에 식별한다.
  - 디지털 서비스는 쓸 수 없거나 쓰고 싶지 않은 사람을 배제해서는 안 되므로, 서비스 디자이너는 디지털 경로와 함께 지원형 경로와 비디지털 경로를 설계한다.
  - 임상·운영 직원은 서비스의 일부이므로, 설계는 환자의 여정뿐 아니라 직원의 워크플로, 업무량, 직업적 책임에도 맞아야 한다.
levels:
  - title: 어소시에이트 서비스 디자이너
    responsibilities:
      - 교육과 경험 있는 디자이너와의 협업을 통해 서비스 디자인 기법을 배운다.
      - 환자와 직원 대상 리서치로부터 사용자 여정과 서비스 블루프린트의 매핑을 돕는다.
      - 동의와 정보 거버넌스 절차를 따르며 공동 디자인 워크숍의 준비와 운영을 돕는다.
      - 디자인 결정을 문서화하고 디자인 산출물을 최신으로 유지한다.
    qualifications:
      - 디자인 또는 관련 분야의 자격이나 어프렌티스십 취득을 목표로 하고 있거나, 그에 준하는 경력.
  - title: 주니어 서비스 디자이너
    responsibilities:
      - 예약이나 후속 관리 등 돌봄 경로 일부의 현재 여정과 서비스 블루프린트를 매핑한다.
      - 더 상위의 디자이너의 지시를 받으며 서비스 일부의 개선안을 설계하고 테스트한다.
      - 누구나 참여할 수 있도록 조정하여 환자, 돌봄 제공자, 직원과의 공동 디자인 세션을 운영한다.
      - 서비스가 환자나 직원에게 불필요한 일이나 리스크를 만드는 지점을 찾아 팀에 제기한다.
    qualifications:
      - 디자인 또는 관련 분야 학위, 또는 그에 준하는 경력.
  - title: 서비스 디자이너
    responsibilities:
      - 필요한 사람을 위한 지원형 경로와 비디지털 경로를 포함하여 채널을 가로지르는 엔드투엔드 서비스를 설계한다.
      - 조직 전반에 걸쳐 돌봄 경로를 매핑하고 팀과 서비스 간 더 나은 인수인계를 설계한다.
      - 운영 리드와 함께 역할, 업무량, 워크플로를 포함하여 서비스가 직원에게 어떻게 작동하는지 설계한다.
      - 임상 안전 책임자와 협력하여 새로운 서비스 모델의 위험 요소를 식별하고 통제를 설계한다.
      - 서비스 변경을 환자, 돌봄 제공자, 직원과 함께 프로토타입으로 만들어 테스트한다.
    qualifications:
      - 디자인 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 이용자와 함께 서비스를 설계한 경험.
  - title: 시니어 서비스 디자이너
    responsibilities:
      - 여러 돌봄 현장이나 조직에 걸친 복잡한 서비스의 디자인을 이끈다.
      - 임상, 운영, 디지털 리더와 함께 서비스 비전을 형성한다.
      - 안전, 접근, 형평성을 개선하는 새로운 서비스 모델을 설계하고 실제 이용자와 테스트한다.
      - 서비스 변경이 임상 리스크, 평등, 정보 거버넌스에 미치는 영향에 대해 평가되도록 한다.
      - 디자이너를 멘토링하고 팀에 서비스 디자인 실천을 뿌리내리게 한다.
    qualifications:
      - 서비스 디자인에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 서비스 디자이너
    responsibilities:
      - 여러 서비스 또는 돌봄 경로 전체의 디자인 방향을 정하고 팀 전반의 디자인 품질을 보증한다.
      - 임상·운영 시니어 리더와 협력하여 돌봄이 조직되고 제공되는 방식을 재설계한다.
      - 설계가 건강 격차의 영향을 가장 많이 받는 사람들과 압박 속의 직원에게 작동하도록 한다.
      - 팀이 임상 안전과 지원형 경로를 어떻게 설계하는지에 대한 기준을 정한다.
      - 서비스 디자이너를 직접 관리하고 육성한다.
    qualifications:
      - 팀을 가로질러 서비스 디자인을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF가 리드 서비스 디자이너를 G7 또는 G6에 두고 이 레퍼런스가 제안된 밴드 8b를 따르므로 밴드 8a 수준은 없다. 리드 디자이너가 디렉터레이트 전반의 여러 서비스가 작동하는 방식을 형성하므로 정책은 레벨 5이다.
  - title: 서비스 디자인 책임자
    responsibilities:
      - 서비스 디자인 직군을 이끌고 그 전략, 기준, 업무 방식을 정한다.
      - 서비스가 환자, 돌봄 제공자, 직원의 요구를 중심으로 설계되도록 조직의 전략에 영향을 준다.
      - 채용, 경력 경로, 교육을 포함하여 서비스 디자인 역량을 키운다.
      - 이용자에 대한 접근, 리서치 시간, 거버넌스 속 디자인 등 좋은 디자인을 위한 조건을 마련한다.
      - 보건·돌봄 시스템 전반의 동료와 협력하여 연결된 서비스를 설계한다.
    qualifications:
      - 디자인과 디자인 실천을 이끈 풍부한 경력.
