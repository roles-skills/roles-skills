summary: >
  콘텐츠 디자이너는 환자, 돌봄 제공자, 임상의, 돌봄 직원이 알아야 할 것과 해야 할 것을 이해할 수 있도록 보건·돌봄 정보와 서비스를 알기 쉽게 만든다. 이용자 요구의 근거로 콘텐츠를 설계하고, 쉬운 말로 쓰며, 임상 전문가와 협력해 정확성을 유지하고, 작성부터 검토와 폐기까지 콘텐츠의 일생을 돌본다.
health_context:
  - 사람들은 걱정되거나, 몸이 안 좋거나, 급할 때 건강 콘텐츠를 읽는 경우가 많으므로, 콘텐츠는 건강 문해력이 낮은 사람도 이해하고 행동에 옮기기 쉬워야 한다.
  - 잘못되었거나 오래된 건강 정보는 해를 끼칠 수 있으므로, 콘텐츠 디자이너는 검토일과 지정된 임상 검토자가 있는 임상 보증 프로세스를 따른다.
  - 긴급한 증상, 정신 건강, 의약품, 임종 돌봄 등 일부 주제는 민감하거나 위험이 높으므로, 콘텐츠 디자이너는 어조와 정확성에 대해 임상의 및 사용자 리서처와 긴밀히 협력한다.
  - 임상 시스템에도 레이블, 안내, 알림 같은 명확한 콘텐츠가 필요하므로, 콘텐츠 디자이너는 임상 워크플로의 오류를 줄이도록 돕는다.
  - 건강 콘텐츠는 보조 기술을 쓰는 사람, 다른 언어로 읽는 사람, 쉬운 읽기 형식이 필요한 사람을 포함하여 접근하기 쉽고 포용적이어야 한다.
levels:
  - title: 어소시에이트 콘텐츠 디자이너
    responsibilities:
      - 교육과 감독 아래의 업무를 통해 콘텐츠 디자인 기법, 스타일 가이드, 임상 검토 프로세스를 배운다.
      - 기존 콘텐츠에 대해 표준 점검, 문장 교정, 갱신을 한다.
      - 보증 절차를 따르며 콘텐츠 관리 시스템으로 콘텐츠를 게시한다.
      - 제목, 링크 문구, 대체 텍스트 등 콘텐츠의 접근성을 점검한다.
    qualifications:
      - 관련 분야의 자격이나 어프렌티스십 취득을 목표로 하고 있거나, 그에 준하는 경력.
  - title: 주니어 콘텐츠 디자이너
    responsibilities:
      - 더 상위의 콘텐츠 디자이너의 지시를 받으며 건강 콘텐츠와 서비스 콘텐츠를 쓰고 갱신한다.
      - 리서치와 데이터를 활용해 이용자가 알아야 할 것과 쓰는 말을 파악한다.
      - 임상 검토자와 협력하여 정확성을 확인하고 의학 용어를 쉬운 말로 설명한다.
      - 콘텐츠 게시, 검토일, 콘텐츠 팀의 사무를 지원한다.
    qualifications:
      - 학위 또는 관련 자격, 또는 웹용 글쓰기에 관한 그에 준하는 경력.
  - title: 콘텐츠 디자이너
    responsibilities:
      - 서비스 찾기, 진료 예약 준비, 사후 관리 등 이용자 여정 전체에 걸쳐 콘텐츠를 설계한다.
      - 오류 가능성을 줄이기 위해 레이블, 안내, 알림 등 임상 시스템의 콘텐츠를 설계한다.
      - 콘텐츠를 알기 쉽고 쓰기 쉽게 유지하면서 임상 전문가와 정확성에 합의한다.
      - 건강 문해력이 낮은 사람과 보조 기술을 쓰는 사람을 포함한 이용자와 콘텐츠를 테스트한다.
      - 스타일 가이드와 콘텐츠 패턴에 기여한다.
    qualifications:
      - 학위 또는 관련 자격, 또는 그에 준하는 경력.
      - 디지털 서비스의 콘텐츠를 설계한 경험.
  - title: 시니어 콘텐츠 디자이너
    responsibilities:
      - 주요 질환 영역이나 공중보건 캠페인 등 대규모이거나 주목도가 높은 영역의 콘텐츠 전략을 수립한다.
      - 긴급한 증상, 정신 건강, 임종 돌봄 등 민감하고 위험이 높은 주제의 콘텐츠를 설계한다.
      - 일련의 건강 콘텐츠에 대해 임상 보증, 근거 출처, 검토 주기를 마련한다.
      - 다른 사람의 업무를 검토해 품질을 보증하고 콘텐츠 디자이너를 관리하거나 멘토링한다.
      - 팀과 함께 사용자 스토리를 작성하고 매핑한다.
    qualifications:
      - 콘텐츠 디자인에 관한 상당한 경력(석사에 준하는 수준).
    job_evaluation_notes: 시니어 콘텐츠 디자이너는 중한 질병, 자해, 사별 같은 힘든 주제에 정기적으로 일하므로 감정적 부담은 레벨 2이다.
  - title: 리드 콘텐츠 디자이너
    responsibilities:
      - 콘텐츠 디자이너 팀을 지휘하고 여러 팀에 걸쳐 콘텐츠 품질을 보증한다.
      - 건강 콘텐츠가 임상 보증, 접근성, 스타일 기준을 충족하도록 한다.
      - 임상, 커뮤니케이션, 프로덕트 시니어 리더와 협력하여 팀에 인력을 배치하고 콘텐츠 문제를 해결한다.
      - 조직에서 가장 민감하거나 위험이 높은 정보의 콘텐츠를 이끈다.
      - 콘텐츠 디자이너를 직접 관리하고 육성한다.
    qualifications:
      - 팀을 가로질러 콘텐츠 디자인을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF가 리드 콘텐츠 디자이너를 G7 또는 G6에 두고 이 레퍼런스가 제안된 밴드 8b를 따르므로 밴드 8a 수준은 없다. 리드가 여러 서비스의 콘텐츠 기준을 정하므로 정책은 레벨 5, 감정적 부담은 시니어 콘텐츠 디자이너와 같은 레벨 2이다.
  - title: 콘텐츠 디자인 책임자
    responsibilities:
      - 조직의 목적과 환자 및 직원의 요구를 충족하는 콘텐츠 전략을 수립한다.
      - 건강 정보 콘텐츠와 그 임상 보증에 관한 조직의 기준을 정한다.
      - 채용과 육성을 포함하여 전략을 수행할 수 있는 콘텐츠 디자인 팀을 이끈다.
      - 임상 및 커뮤니케이션 시니어 리더와 협력하여 건강 정보 리스크를 관리한다.
      - 조직 전체에서 콘텐츠 업무에 우선순위를 매긴다.
    qualifications:
      - 콘텐츠 디자인과 콘텐츠 실천을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 리드 콘텐츠 디자이너와 콘텐츠 디자인 책임자를 모두 제안 밴드 8b의 G7 또는 G6에 둔다. 이 레퍼런스는 책임자가 조직 전체의 콘텐츠 전략과 기준을 정하므로, 다른 사용자 중심 디자인 직군의 책임자에 맞춰 책임자를 밴드 8c에 둔다.
