summary: >
  비즈니스 아키텍트는 조직이 보건·돌봄을 어떻게 제공하는지에 대해, 역량, 서비스, 돌봄 경로, 프로세스, 정보를 명확하고 일관된 형태로 그려 낸다. 이 전체상을 바탕으로 변화가 필요한 곳을 드러내고, 전략과 프로그램을 연결하며, 디지털 변화가 환자 돌봄과 임상의·돌봄 직원의 일하는 방식을 개선하도록 한다.
health_context:
  - 돌봄 경로는 팀, 현장, 조직에 걸쳐 있으므로, 비즈니스 아키텍트는 부서별이 아니라 환자의 관점에서 서비스를 모델링한다.
  - 임상 프로세스의 변경은 환자 안전과 직원 업무량에 영향을 줄 수 있으므로, 모델은 임상의 및 돌봄 직원과 함께 만들고 실제 현장에 비추어 확인한다.
  - 보건·돌봄 전략은 정책, 규제, 자금 규칙에 의해 형성되므로, 아키텍트는 이를 실용적인 역량 변경으로 옮겨야 한다.
  - 많은 역량이 파트너 조직과 공유되므로, 아키텍트는 누가 무엇을 하는지, 정보가 어디로 흘러야 하는지에 대한 합의를 돕는다.
levels:
  - title: 트레이니 비즈니스 아키텍트
    responsibilities:
      - 교육과 실습을 통해 역량, 가치 흐름, 프로세스 모델링 등 비즈니스 아키텍처 기법을 배운다.
      - 인터뷰, 문서, 관찰을 통해 서비스와 돌봄 경로에 관한 정보를 수집한다.
      - 비즈니스 아키텍트의 지도를 받으며 역량 맵과 프로세스 모델의 초안을 작성한다.
      - 임상의, 돌봄 직원, 관리자와의 워크숍 운영을 돕고 결과를 정리한다.
    qualifications:
      - 비즈니스, 분석, 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 비즈니스 아키텍처 기법에 관한 전문 교육(대학원 디플로마 수준 또는 그에 준하는 경력).
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 5)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 6에 둔다. 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 어소시에이트 비즈니스 아키텍트
    responsibilities:
      - 조직의 일부에 대해 역량, 서비스, 돌봄 경로를 모델링한다.
      - 모델을 분석하여 환자와 직원에게 나타나는 공백, 중복, 문제를 찾는다.
      - 여러 팀과 조직의 정보를 종합하여 변화 의사결정에 활용한다.
      - 명확한 모델과 쉬운 말로 복잡한 서비스 문제를 이해관계자에게 설명한다.
      - 비즈니스 아키텍처 저장소를 정확하게 유지하고 애플리케이션 및 데이터 모델과 연결한다.
    qualifications:
      - 비즈니스 아키텍처 또는 비즈니스 분석 전문 지식(석사 수준 또는 그에 준하는 경력).
      - 비즈니스 분석 또는 서비스 디자인 경력.
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 6)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 7에 둔다. 이 직무는 팀과 조직에 걸친 서비스와 돌봄 경로를 모델링하고 분석하므로, 지식은 석사 수준 또는 그에 준하는 수준으로 평가했다.
  - title: 비즈니스 아키텍트
    responsibilities:
      - 응급 진료나 지역 서비스 등 주요 서비스 영역의 현재와 목표 비즈니스 아키텍처를 수립한다.
      - 전략과 정책을 역량 변경과 변화 로드맵으로 옮긴다.
      - 프로그램과 프로젝트의 범위가 목표 비즈니스 아키텍처에 맞는지 확인한다.
      - 임상 리드와 협력하여 제안된 변경이 돌봄 경로, 안전, 직원 업무량에 어떤 영향을 주는지 평가한다.
      - 방법과 도구에 대해 다른 비즈니스 아키텍트를 이끈다.
    qualifications:
      - 비즈니스 아키텍처, 비즈니스 분석, 또는 서비스 디자인에 관한 상당한 경력(석사에 준하는 수준).
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 7)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 8a에 둔다. 이 직무는 전략을 주요 서비스 영역의 변화 로드맵으로 바꾸므로, 계획, 정책, 행동의 자유는 밴드 7 수준을 웃돌게 평가했다.
  - title: 리드 비즈니스 아키텍트
    responsibilities:
      - 비즈니스 아키텍처 실천을 이끌고 그 성과에 책임을 진다.
      - 역량, 서비스, 돌봄 경로에 관한 조직 전체의 전체상을 유지하고 알기 쉽게 보존한다.
      - 변화의 우선순위와 투자 포트폴리오가 전략에 어떻게 맞는지에 대해 디렉터에게 조언한다.
      - 파트너 조직과 협력하여 돌봄 경로 전반의 공유 역량과 책임에 합의한다.
      - 비즈니스 아키텍트를 이끌고 육성한다.
    qualifications:
      - 복잡한 조직에서 비즈니스 아키텍처를 이끈 풍부한 경력.
