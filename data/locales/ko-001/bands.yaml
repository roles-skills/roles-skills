# 밴드 개요(한국어). 키는 영어 밴드 id입니다.
"1":
  title: 밴드 1
  stage: 입문
  knowledge: 기본적인 읽기, 쓰기, 계산 능력. 단순한 정형 업무를 현장에서 배운다.
  autonomy: 명확한 지시에 따라 일하며, 업무를 자주 점검받는다.
  scope: 자신의 정형 업무.
  leadership: 없음.
  accountability: 정형 업무를 정확하게 해내는 것.
"2":
  title: 밴드 2
  stage: 지원
  knowledge: 담당 분야의 정형 업무와 절차를 안다. 입문 수준의 자격이 있을 수 있다.
  autonomy: 정해진 절차에 따라 일하며, 필요하면 감독을 받을 수 있다.
  scope: 팀 안의 자신의 업무.
  leadership: 새로 들어온 사람에게 정형 업무를 가르칠 수 있다.
  accountability: 자신의 정형 업무의 품질과 기한.
"3":
  title: 밴드 3
  stage: 지원
  knowledge: 비정형을 포함한 다양한 절차에 대한 지식. 보통 레벨 3 자격 또는 그에 준하는 경력.
  autonomy: 절차의 범위 안에서 일하고, 자신의 업무 방식을 정하며, 문제는 상위에 보고한다.
  scope: 자신의 업무와 팀 전체를 위한 일부 업무.
  leadership: 정형 업무를 배분하거나 절차를 다른 사람에게 가르칠 수 있다.
  accountability: 자신의 업무와 보관하는 기록의 정확성.
"4":
  title: 밴드 4
  stage: 지원 및 입문 실무자
  knowledge: 담당 분야에 대한 상세한 지식. 보통 전문대학 학위, 도제 과정, 또는 그에 준하는 경력으로 얻는다.
  autonomy: 가이드라인 안에서 일하고, 일상적인 문제 대부분을 해결하며, 조언을 구할 상급자가 있다.
  scope: 자신의 업무와 정해진 서비스 또는 프로세스.
  leadership: 작은 팀을 감독하거나 다른 사람의 업무를 조정할 수 있다.
  accountability: 정해진 서비스 또는 프로세스의 제공.
"5":
  title: 밴드 5
  stage: 실무자
  knowledge: 전문적이거나 기술적인 지식. 보통 학위 또는 그에 준하는 경력으로 얻는다.
  autonomy: 전문직 기준 안에서 폭넓은 목표를 향해 일하며, 자신의 업무를 계획한다.
  scope: 팀 또는 프로덕트 안의 자신의 전문 업무.
  leadership: 지원 직원이나 어프렌티스를 지도하고 그 업무를 점검할 수 있다.
  accountability: 자신의 전문 업무의 품질.
"6":
  title: 밴드 6
  stage: 숙련된 실무자
  knowledge: 여러 절차에 걸친 전문 지식. 추가 교육과 경험으로 쌓는다.
  autonomy: 자율적으로 일하고, 자기 분야의 방침을 해석하며, 복잡한 문제에서는 조언을 구한다.
  scope: 프로덕트, 서비스, 또는 워크스트림.
  leadership: 작은 팀을 이끌거나 동료를 멘토링할 수 있다.
  accountability: 자신의 워크스트림의 성과와 제공한 조언의 질.
"7":
  title: 밴드 7
  stage: 시니어 또는 전문직
  knowledge: 고도로 발달한 전문 지식. 보통 석사에 준하거나 그에 준하는 경력으로 얻는다.
  autonomy: 조직의 방침에 맞춰 일하고, 성과를 내는 방법을 정하며, 다른 사람이 상담하는 전문가이다.
  scope: 여러 프로덕트나 서비스, 또는 전문 기능.
  leadership: 팀 또는 전문 실무 영역을 이끈다.
  accountability: 서비스 또는 전문 기능의 제공, 그리고 예산이 있다면 그 예산.
8a:
  title: 밴드 8a
  stage: 리드
  knowledge: 한 분야와 그 관리에 대한 전문 지식.
  autonomy: 서비스를 위해 조직의 방침을 해석하고 팀의 방향을 정한다.
  scope: 서비스 영역, 또는 조직 전체에 걸친 분야.
  leadership: 팀을 관리하거나, 직접 보고 관계 없이 한 분야를 이끈다.
  accountability: 서비스 영역, 그 직원, 그리고 예산.
8b:
  title: 밴드 8b
  stage: 리드
  knowledge: 여러 분야 또는 대규모 서비스에 걸친 전문 지식.
  autonomy: 큰 영역의 방침과 전략을 만든다.
  scope: 여러 서비스와 팀, 또는 프린시펄 수준의 분야.
  leadership: 매니저를 관리하거나, 한 분야의 최고 전문가이다.
  accountability: 여러 서비스, 그 직원, 그리고 예산.
8c:
  title: 밴드 8c
  stage: 시니어 리드
  knowledge: 전문 지식에 더해 더 넓은 조직과 분야에 대한 이해.
  autonomy: 기능의 전략을 정하고 디렉터에게 책임을 진다.
  scope: 기능 또는 부문.
  leadership: 여러 관리 계층을 통해 기능을 이끈다.
  accountability: 기능의 성과, 인력, 예산.
8d:
  title: 밴드 8d
  stage: 시니어 리드
  knowledge: 여러 기능과 더 넓은 보건·돌봄 시스템에 걸친 전략적 지식.
  autonomy: 조직 전체의 전략을 만들고 디렉터를 대리한다.
  scope: 주요 기능 또는 여러 기능.
  leadership: 여러 기능 또는 큰 부문을 이끈다.
  accountability: 주요 기능, 큰 예산, 조직 전체의 리스크.
"9":
  title: 밴드 9
  stage: 전문직 총괄 또는 디렉터
  knowledge: 전략적 전문성과 시스템 전반에 걸친 리더십.
  autonomy: 경영진과 함께 조직의 전략을 정한다.
  scope: 조직과 시스템 전반에 걸친 파트너.
  leadership: 전문직 또는 디렉터레이트를 이끈다.
  accountability: 조직 전체의 성과, 예산, 리스크.
