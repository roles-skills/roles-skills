legal-legal-research:
  name: 법률 조사
  description: 법적 질문에 답하기 위해 법령, 판례, 지침, 선례를 찾아 읽고 요약한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 법률 데이터베이스와 조직의 노하우를 활용해 법령, 지침, 선례 문서를 찾는다
      - 법률 용어를 올바르게 사용한다
    working: |
      할 수 있는 일:
      - 정해진 법적 질문을 조사하고 출처를 명확하게 요약한다
      - 출처가 최신이고 권위 있는지 확인한다
      - 선례와 노하우 라이브러리를 최신으로 유지한다
    practitioner: |
      할 수 있는 일:
      - 기존 법이 새로운 기술에 어떻게 적용되는지 등 복잡하거나 새로운 질문을 조사한다
      - 상충하는 출처를 분석하고 논거 있는 견해에 이른다
      - 법과 지침의 변화를 추적하고 그것이 조직에 미치는 영향을 설명한다
    expert: |
      할 수 있는 일:
      - 조직에 가장 복잡하고 위험이 높은 질문의 조사를 이끈다
      - 법적 동향을 예측하고 조직이 대비하도록 한다
      - 디지털 헬스와 돌봄에 영향을 주는 법과 지침의 의견 수렴에 기여한다
legal-contract-drafting-and-review:
  name: 계약 작성과 검토
  description: 기술, 소프트웨어 라이선스, 클라우드, 서비스, 데이터 처리 계약 등 계약과 협약을 작성, 검토, 협상한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 당사자, 기간, 대금, 책임, 해지 같은 계약의 주요 부분을 설명한다
      - 승인된 템플릿으로 표준 문서를 준비한다
    working: |
      할 수 있는 일:
      - 비밀 유지 계약과 단순한 서비스 계약 등 정형적인 계약을 조직의 기준에 비추어 검토한다
      - 계약서를 수정 표시하고 변경 사항을 설명한다
      - 무제한 책임이나 자동 갱신처럼 법률가의 검토가 필요한 조항을 알아본다
    practitioner: |
      할 수 있는 일:
      - 소프트웨어 라이선스, 클라우드 호스팅, 시스템 통합, 데이터 처리 계약 같은 복잡한 계약을 작성하고 협상한다
      - 책임 한도, 서비스 수준, 종료, 에스크로를 포함한 리스크 배분에 대해 조언한다
      - 계약이 환자 데이터, 서비스 연속성, 소프트웨어와 데이터에 대한 조직의 권리를 보호하도록 한다
      - 계약 템플릿과 플레이북을 작성하고 유지한다
    expert: |
      할 수 있는 일:
      - 조직의 계약 기준과 리스크에 대한 입장을 정한다
      - 가장 가치가 크거나 위험이 높은 계약의 협상을 이끈다
      - 파트너십과 합작 투자 같은 전략적 상업 약정에 대해 시니어 리더에게 조언한다
legal-legal-advice:
  name: 법률 자문
  description: 동료가 적법한 결정을 내리고 법적 리스크를 관리하도록 돕는 명확하고, 실용적이며, 정확한 법률 자문을 제공한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 동료에게 법률 자문이 필요한 때와 그것을 받는 방법을 설명한다
      - 명확한 지시를 받고 사안의 사실 관계를 기록한다
    working: |
      할 수 있는 일:
      - 법률가가 검토할 정형적인 사안의 자문 초안을 작성한다
      - 승인된 지침으로 단순한 질문에 답한다
      - 일련의 사실에서 법적 쟁점을 파악한다
    practitioner: |
      할 수 있는 일:
      - 자신의 전문 분야에서 독립적인 법률 자문을 제공한다
      - 법적 리스크를 쉬운 말로 설명하고 실용적인 선택지를 권고한다
      - 계약 체결, 데이터 공유, 서비스 변경처럼 법적 효과가 있는 결정에 대해 조언한다
      - 외부 변호사나 법정 변호사에게 언제 의뢰할지 판단한다
    expert: |
      할 수 있는 일:
      - 조직의 가장 중요한 법적 리스크에 대해 이사회와 경영진에 조언한다
      - 새롭거나, 논란이 있거나, 가치가 큰 사안에 대해 확정적인 자문을 제공한다
      - 조직의 법적 리스크 선호도를 정한다
      - 외부 자문을 포함하여 조직 전반의 법률 자문의 질을 보증한다
legal-litigation-and-disputes:
  name: 소송과 분쟁 해결
  description: 계약 분쟁, 고용 소송, 의료 과실 청구와의 연락을 포함하여 분쟁과 청구를 예방하고, 관리하고, 해결한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 청구나 분쟁의 주요 단계를 설명한다
      - 청구를 기록하고 기한을 정확하게 추적한다
    working: |
      할 수 있는 일:
      - 사건의 문서와 증거를 수집하고 정리한다
      - 연표, 서류철, 진술서 초안을 준비한다
      - 정형적인 사안에서 외부 변호사, 보험사, 배상 제도와 연락한다
    practitioner: |
      할 수 있는 일:
      - 최초 통지부터 합의 또는 심리까지 분쟁과 청구를 다수 담당하여 관리한다
      - 청구의 타당성과 가치를 평가하고 전략을 권고한다
      - 합의를 협상하고 대체적 분쟁 해결을 활용한다
      - 청구에서 얻은 교훈이 안전, 계약, 서비스 개선에 반영되도록 한다
    expert: |
      할 수 있는 일:
      - 조직에서 가장 중요하거나 주목받는 분쟁을 이끈다
      - 소송, 합의, 청구 보고에 대한 조직의 접근 방식을 정한다
      - 우발 채무와 평판 리스크에 대해 이사회에 조언한다
legal-information-and-data-law:
  name: 정보 및 데이터 법
  description: 개인정보 보호, 비밀 유지, 정보 공개, 사이버 보안에 관한 법을 보건·돌봄 데이터와 디지털 서비스에 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 개인정보 보호와 비밀 유지의 기본 원칙을 설명한다
      - 정보 요청과 데이터 침해를 알아보고 올바르게 전달한다
    working: |
      할 수 있는 일:
      - 데이터 공유 및 데이터 처리 계약을 템플릿에 비추어 검토한다
      - 정보 요청과 정보 주체 권리 요청에 대한 대응을 지원한다
      - 일반적인 상황에서 건강 데이터를 사용할 수 있는 적법한 근거를 설명한다
    practitioner: |
      할 수 있는 일:
      - 디지털 서비스의 개인정보 보호, 비밀 유지 의무, 정보 접근법에 대해 조언한다
      - 국제 이전을 포함하여 데이터 공유 협약과 데이터 처리 조건을 작성하고 협상한다
      - AI와 분석 플랫폼 같은 새로운 기술의 개인정보 영향평가에 대해 조언한다
      - 데이터 침해, 규제 기관의 문의, 불만에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 보건·돌봄 데이터 사용에 관한 조직의 법적 입장을 정한다
      - 연구, 데이터 플랫폼, AI 같은 위험이 높거나 새로운 데이터 사용을 이끈다
      - 정보법에 관해 규제 기관에 조직을 대표한다
legal-legal-administration:
  name: 법무 행정
  description: 사건 관리, 문서 관리, 기록, 기한, 청구서 처리를 포함하여 법무 팀의 행정 프로세스를 운영한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 사건 관리 시스템에서 사건을 개시, 갱신, 종결한다
      - 법률 문서를 안전하게 정리하고 찾는다
      - 법률 정보와 개인 정보를 기밀로 유지한다
    working: |
      할 수 있는 일:
      - 팀의 일정, 기한, 주요 날짜를 관리한다
      - 법률 문서, 서류철, 서명 패키지를 준비하고 서식을 맞춘다
      - 외부 변호사의 청구서를 확인하고 처리한다
      - 계약과 증서의 등록부를 관리한다
    practitioner: |
      할 수 있는 일:
      - 법무 팀의 행정을 운영하고 프로세스를 개선한다
      - 업무량, 외부 변호사에 대한 지출, 처리 소요 시간을 보고한다
      - 사건 관리와 전자 서명 도구 같은 법무 기술을 관리한다
    expert: |
      할 수 있는 일:
      - 조직의 법무 운영 모델을 설계한다
      - 법무 기술의 선택과 활용을 이끈다
      - 법무 서비스의 서비스 기준과 성과 지표를 정한다
legal-employment-law:
  name: 노동법
  description: 조직의 인사 정책, 계약, 변화 프로그램, 고용 분쟁에 노동법을 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 직원의 주요 고용 권리를 설명한다
      - 법률 자문이 필요한 고용 문제를 알아본다
    working: |
      할 수 있는 일:
      - 고용 소송과 심리를 위한 문서 준비를 돕는다
      - 고용 계약과 정책을 템플릿에 비추어 검토한다
    practitioner: |
      할 수 있는 일:
      - 해고, 차별, 직원 이전, 구조 조정 같은 고용 사안에 대해 조언한다
      - 고용 소송을 관리하고 합의 계약을 협상한다
      - 계약자의 활용과 디지털 전문가의 고용 신분에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 대규모 인력 변화와 그 법적 리스크에 대해 이사회에 조언한다
      - 주목받거나 복잡한 고용 분쟁을 이끈다
      - 법적 의무와 우수 사례에 부합하도록 인사 정책을 형성한다
legal-intellectual-property:
  name: 지식재산권
  description: 저작권, 라이선스, 오픈소스, 상표를 포함하여 소프트웨어, 데이터, 콘텐츠, 발명의 지식재산권을 보호하고 활용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 소프트웨어, 데이터, 콘텐츠가 지식재산권으로 보호됨을 설명한다
      - 계약이나 프로젝트에서 소유권 문제가 생기는 경우를 알아본다
    working: |
      할 수 있는 일:
      - 정형적인 계약의 지식재산권 조항을 확인한다
      - 라이선스와 등록된 권리의 기록을 보관한다
      - 주요 오픈소스 라이선스 유형과 그 조건을 설명한다
    practitioner: |
      할 수 있는 일:
      - 직원, 공급자, 파트너가 만든 소프트웨어, 데이터, 콘텐츠의 소유자에 대해 조언한다
      - 조직 코드의 오픈소스 공개를 포함하여 라이선스와 지식재산권 조건을 작성한다
      - 조직의 데이터와 소프트웨어의 상업적 활용 및 이익 공유에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 조직의 지식재산권 및 오픈소스 정책을 정한다
      - 조직의 데이터와 소프트웨어가 관련된 사업화와 파트너십을 이끈다
      - 중대한 지식재산권 분쟁을 해결한다
legal-procurement-law:
  name: 공공 조달법
  description: 조달 경로 선택부터 계약 체결과 이의 신청까지, 물품, 서비스, 기술의 구매에 공공 조달 규칙을 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 공공 기관이 조달 규칙을 따라야 하는 이유를 설명한다
      - 구매 활동에 조달 또는 법률 자문이 필요한 때를 알아본다
    working: |
      할 수 있는 일:
      - 입찰 서류의 일관성과 완전성을 확인한다
      - 공정하고 투명한 절차를 보여 주는 데 필요한 기록 관리를 지원한다
    practitioner: |
      할 수 있는 일:
      - 프레임워크, 수의 계약, 경쟁 절차를 포함한 시장 진입 경로에 대해 조언한다
      - 평가, 낙찰 결정, 낙찰 후 계약 변경에 대해 조언한다
      - 공급자의 이의 제기와 불만에 대응한다
      - 파트너십에서의 보조금 통제와 경쟁 리스크에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 조달 관련 법적 리스크에 대한 조직의 접근 방식을 정한다
      - 혁신 파트너십처럼 가치가 크거나 새로운 조달을 이끈다
      - 중대한 조달 이의 제기에 대응한다
legal-health-and-care-law:
  name: 보건·돌봄법
  description: 동의, 판단 능력, 의료 과실, 서비스와 제품의 규제, 조직의 법정 의무를 포함하여 보건·돌봄 서비스를 규율하는 법을 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 주요 법정 의무와 권한을 설명한다
      - 환자 안전, 동의, 의료 과실이 관련된 사안을 알아본다
    working: |
      할 수 있는 일:
      - 인시던트, 검시 심문, 임상 청구에 관한 법률 업무를 지원한다
      - 조직의 서비스에 적용되는 규제 체계를 설명한다
    practitioner: |
      할 수 있는 일:
      - 서비스를 제공하거나 위탁할 수 있는 시점을 포함하여 조직의 권한과 의무에 대해 조언한다
      - 의료기기 소프트웨어 같은 디지털 헬스 제품의 규제에 대해 조언한다
      - 디지털 서비스가 관련된 청구에 대해 의료 과실 제도 및 외부 변호사와 연락한다
      - 디지털 서비스에서의 동의, 판단 능력, 환자 권리에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 조직의 법정 의무와 거버넌스에 대해 이사회에 조언한다
      - 공적 조사, 사법 심사, 대규모 인시던트에 대한 법률 업무를 이끈다
      - 새로운 보건·돌봄법에 대한 조직의 대응을 형성한다
