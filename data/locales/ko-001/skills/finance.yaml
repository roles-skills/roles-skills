fin-financial-transactions:
  name: 재무 거래와 원장
  description: 재무 통제에 따라 청구서, 지급, 수령, 분개, 대사를 원장에 정확하게 처리하고 기록한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 구매-지급 프로세스와 주문-수금 프로세스, 그리고 그 안에서 자신의 역할을 설명한다
      - 정해진 절차에 따라 청구서, 수령, 지급을 정확하게 입력한다
      - 거래에 올바른 승인과 증빙 서류가 있는지 확인한다
    working: |
      할 수 있는 일:
      - 대변 전표, 환불, 분개를 포함한 다양한 거래를 처리한다
      - 공급자 명세서, 은행 계좌, 통제 계정을 대사한다
      - 공급자, 고객, 예산 보유자의 정형적인 문의를 해결한다
      - 중복되거나, 이례적이거나, 승인되지 않은 거래를 찾아 제기한다
    practitioner: |
      할 수 있는 일:
      - 원장이나 거래 프로세스를 관리하고 정확하고 최신으로 유지한다
      - 복잡한 대사 항목과 오래된 잔액을 조사하여 해소한다
      - 대조나 승인을 자동화하는 등 거래 프로세스를 개선한다
      - 다른 직원을 교육하고 업무를 점검한다
    expert: |
      할 수 있는 일:
      - 조직의 거래 프로세스와 그 안의 통제를 설계한다
      - 지급 기간과 채권 회수 목표 같은 성과 기준을 정한다
      - 자동화와 셀프서비스 같은 새로운 처리 방식으로의 전환을 이끈다
      - 원장이 완전하고 정확하다는 것을 시니어 리더와 감사인에게 보증한다
fin-financial-reporting:
  name: 재무 보고와 법정 결산
  description: 적용되는 회계 기준과 공공 부문 보고 규칙을 따르는 정확한 재무제표와 법정 신고서를 작성한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 주요 재무제표의 목적을 설명한다
      - 월말·연말 결산을 뒷받침하는 작업 서류와 대사표를 작성한다
    working: |
      할 수 있는 일:
      - 미지급 비용, 선급 비용, 충당금 같은 월말·연말 분개를 작성한다
      - 연간 결산서의 일부와 뒷받침하는 주석을 작성한다
      - 소프트웨어와 하드웨어의 자산화 같은 정형 거래에 회계 기준을 적용한다
    practitioner: |
      할 수 있는 일:
      - 일정에 맞춰 연간 결산서와 법정 신고서를 작성한다
      - 리스, 클라우드 컴퓨팅 약정, 무형 자산 같은 복잡한 영역에 회계 기준을 적용한다
      - 판단과 추정을 설명하는 회계 문서를 쓴다
      - 결산서의 외부 감사를 관리하고 지적 사항에 대응한다
    expert: |
      할 수 있는 일:
      - 조직의 연차 보고서와 결산서, 그 바탕이 되는 회계 정책을 맡는다
      - 중요한 판단과 새로운 기준에 대해 이사회와 감사 위원회에 조언한다
      - 한정 의견이나 중요한 왜곡 표시에 대한 대응을 이끈다
      - 보고가 공적 책임 규칙을 충족하도록 보증한다
fin-management-accounting:
  name: 관리 회계
  description: 차이 분석, 원가 계산, 성과 보고를 포함하여 관리자가 계획하고, 통제하고, 의사결정을 하는 데 도움이 되는 예산과 원가 정보를 작성한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 예산, 실적, 약정, 차이를 설명한다
      - 재무 시스템에서 표준 예산 보고서를 작성한다
    working: |
      할 수 있는 일:
      - 월별 예산 보고서를 작성하고 주요 차이를 설명한다
      - 비용을 코스트 센터, 프로젝트, 자본과 경상 사이에서 올바르게 분류한다
      - 예산 보유자가 자신의 예산을 이해하고 관리하도록 지원한다
    practitioner: |
      할 수 있는 일:
      - 디렉터레이트나 프로그램의 월별 보고 주기를 관리한다
      - 디지털 서비스의 총비용이나 거래의 단위 원가 같은 원가 모델을 만든다
      - 지출 추세를 분석하고 예산 범위를 지키기 위한 조치에 대해 관리자에게 조언한다
      - 예산 보유자의 전망에 건설적으로 이의를 제기한다
    expert: |
      할 수 있는 일:
      - 조직의 관리 보고와 원가 계산 방식을 설계한다
      - 재무 실적을 이사회와 시니어 리더에게 발표한다
      - 원가와 성과 정보를 활용해 비용 대비 가치를 높이는 일을 이끈다
      - 조직 전반의 관리 회계 기준을 정한다
fin-financial-planning-and-forecasting:
  name: 재무 계획과 예측
  description: 자금을 조직의 우선순위와 프로그램에 연결하는 예산, 예측, 중기 재무 계획을 수립한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 연간 예산 수립 주기와 예산과 예측의 차이를 설명한다
      - 예산 보유자로부터 예측 정보를 수집한다
    working: |
      할 수 있는 일:
      - 인건비를 포함하여 코스트 센터나 프로젝트의 예산과 예측을 만든다
      - 알려진 변경과 리스크를 반영해 매달 예측을 갱신한다
      - 지출 양상이 제공 계획과 맞도록 예산을 기간별로 배분한다
    practitioner: |
      할 수 있는 일:
      - 디렉터레이트나 대규모 프로그램의 예산 수립과 예측을 이끈다
      - 물가 상승, 지연, 자금 변동 같은 시나리오와 민감도를 모델링한다
      - 투자 이후에 따르는 운영 비용을 포함하여 디지털 프로그램의 다년도 예측을 만든다
      - 예측과 리스크를 시니어 관리자에게 발표한다
    expert: |
      할 수 있는 일:
      - 조직의 중기 재무 계획을 이끈다
      - 재무 계획을 전략, 인력, 투자 계획과 일치시킨다
      - 재무적 지속 가능성과 자금 범위를 지키기 위한 선택에 대해 이사회에 조언한다
      - 조직 전반에서 쓰는 계획 가정과 방법을 정한다
fin-payroll:
  name: 급여
  description: 입사, 퇴사, 변경, 공제, 연금, 법정 지급, 급여 보고를 포함하여 직원에게 정확하고 제때 급여를 지급한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 변경과 마감부터 지급과 보고까지 급여 주기를 설명한다
      - 승인된 서식에서 입사자, 퇴사자, 변경 사항을 정확하게 입력한다
      - 급여 정보를 비밀로 유지하면서 정형적인 급여 문의에 답한다
    working: |
      할 수 있는 일:
      - 급여, 가산 수당, 초과 근무, 병가, 가족 휴가 지급액을 계산한다
      - 세금, 연금, 그 밖의 공제를 올바르게 적용한다
      - 급여 출력물을 확인하고 지급 전에 오류를 바로잡는다
      - 정책에 따라 배려를 갖고 과지급액을 회수한다
    practitioner: |
      할 수 있는 일:
      - 직원 집단의 전체 급여를 운영하고 급여 점검을 승인한다
      - 법정 급여 보고와 연금 신고를 관리한다
      - 복수 계약, 소급 지급, 급여 희생 같은 복잡한 사례를 해결한다
      - 연간 임금 인상과 규칙 변경 같은 급여 시스템의 변경을 테스트한다
    expert: |
      할 수 있는 일:
      - 사내 운영이든 제공자 운영이든, 조직의 급여 서비스를 관리한다
      - 급여 통제를 정하고 지급이 정확하고 적법하다는 것을 시니어 리더에게 보증한다
      - 급여 규칙, 임금 인상, 급여 시스템의 변화에 대비한다
      - 대규모 급여 장애에 대한 대응을 이끈다
fin-treasury-and-cash:
  name: 자금 운용과 현금 관리
  description: 공공 부문의 현금 규칙 안에서 조직이 약정을 이행할 수 있도록 은행 계좌, 현금 흐름, 유동성을 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 예산뿐 아니라 현금도 중요한 이유를 설명한다
      - 은행 거래를 기록하고 대사한다
    working: |
      할 수 있는 일:
      - 일일 현금 포지션과 단기 현금 예측을 작성한다
      - 지급 처리를 준비하고 제대로 승인되었는지 확인한다
      - 은행 계좌를 대사하고 매칭되지 않은 항목을 해소한다
    practitioner: |
      할 수 있는 일:
      - 조직의 현금 흐름 예측과 자금 인출을 관리한다
      - 은행 계좌, 지급 방법, 은행 거래 통제를 관리한다
      - 다년도 소프트웨어 라이선스처럼 크거나 불규칙한 지급에 대비해 현금을 계획한다
    expert: |
      할 수 있는 일:
      - 조직의 자금 운용 정책과 은행 거래 약정을 정한다
      - 유동성과 현금 리스크에 대해 이사회에 조언한다
      - 자금 제공자와 공공 부문 규칙이 정한 한도 안에서 현금을 관리한다
fin-audit-and-controls:
  name: 재무 통제와 감사
  description: 재무 통제를 설계, 운영, 테스트하고, 부정을 예방하고 적발하며, 내부 및 외부 감사인과 협력한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 재무 절차와 위임 전결 체계를 따른다
      - 부정이나 오류 가능성의 징후를 알아보고 보고한다
    working: |
      할 수 있는 일:
      - 직무 분리와 공급자 은행 계좌 정보 확인 같은 핵심 통제를 운영한다
      - 감사인에게 근거를 제공하고 질문에 답한다
      - 지출이 올바른 수준에서 승인되었는지 확인한다
    practitioner: |
      할 수 있는 일:
      - 재무 프로세스의 통제를 테스트하고 개선한다
      - 담당 영역의 감사 요청을 관리하고 지적 사항에 대한 조치에 합의한다
      - 재무 절차를 작성하고 갱신한다
      - 부정 방지 전문가와 협력해 부정 리스크를 줄인다
    expert: |
      할 수 있는 일:
      - 조직의 재무 규칙과 위임 전결 체계를 맡는다
      - 재무 통제와 감사 조치에 대해 감사 위원회에 보고한다
      - 중대한 통제 실패나 부정에 대한 대응을 이끈다
      - 직원이 공적 자금을 제대로 쓸 의무를 이해하는 문화를 만든다
fin-business-cases:
  name: 비즈니스 케이스와 투자 평가
  description: 대안 평가, 전 생애 비용, 자본과 경상의 처리, 편익, 비용 대비 가치를 포함하여 투자의 재무적 근거를 만든다.
  levels:
    awareness: |
      할 수 있는 일:
      - 비즈니스 케이스와 그 재무 부분의 목적을 설명한다
      - 비즈니스 케이스를 위한 비용 정보를 수집한다
    working: |
      할 수 있는 일:
      - 단순한 비즈니스 케이스의 재무 모델을 만든다
      - 자본 비용과 경상 비용, 일회성 비용과 반복 비용을 구분한다
      - 가동 후의 라이선스, 지원, 호스팅 같은 전 생애 비용을 포함한다
    practitioner: |
      할 수 있는 일:
      - 새 임상 시스템이나 클라우드 이전 같은 복잡한 디지털 투자의 재무적 근거를 이끈다
      - 순현재가치, 민감도 분석, 리스크 조정을 사용해 대안을 평가한다
      - 편익이 현실적이고, 측정 가능하며, 담당자가 있는지 확인한다
      - 승인 후 지출과 편익을 추적한다
    expert: |
      할 수 있는 일:
      - 조직의 비즈니스 케이스와 투자 평가 기준을 정한다
      - 감당 가능성, 비용 대비 가치, 리스크에 대해 투자 위원회에 조언한다
      - 대규모 투자 프로그램에 대해 자금 제공자를 설득한다
      - 투자 포트폴리오를 검토하고 중단, 변경, 지속할 대상을 권고한다
fin-tax:
  name: 세무
  description: 조직의 거래에 부가가치세, 고용세, 그 밖의 세금 규칙을 올바르게 적용하고 허용되는 경우 세금을 환급받는다.
  levels:
    awareness: |
      할 수 있는 일:
      - 청구서의 부가가치세를 알아보고 올바르게 분류한다
      - 세무 전문가에게 언제 조언을 구해야 하는지 설명한다
    working: |
      할 수 있는 일:
      - 감독을 받으며 세금 신고서와 대사표를 작성한다
      - 흔한 구매와 수입에 올바른 세무 처리를 적용한다
      - 지도를 받아 계약자의 고용 신분을 확인한다
    practitioner: |
      할 수 있는 일:
      - 조직의 세금 신고와 세금 대사를 관리한다
      - 소프트웨어 라이선스, 클라우드 서비스, 공유 서비스 같은 계약의 세무 처리에 대해 조언한다
      - 규칙 안에서 세금 환급을 극대화한다
    expert: |
      할 수 있는 일:
      - 조직의 세무 전략과 세무 리스크를 맡는다
      - 복잡한 쟁점에 대해 세무 당국과의 협의를 이끈다
      - 새로운 파트너십이나 영리 활동 같은 중대한 변화가 세금에 미치는 영향을 평가한다
fin-financial-systems:
  name: 재무 시스템
  description: 재무 데이터가 정확하고 프로세스가 효율적이도록 재무, 조달, 급여, 보고 시스템을 사용하고, 관리하고, 개선한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 절차에 따라 자신의 업무에 재무 시스템을 사용한다
      - 표준 보고서를 실행하고 데이터를 스프레드시트로 내보낸다
    working: |
      할 수 있는 일:
      - 수식, 조회, 피벗 테이블을 포함하여 스프레드시트를 능숙하게 쓴다
      - 코스트 센터, 공급자, 승인자 같은 재무 시스템 데이터를 유지한다
      - 시스템 문제를 보고하고 해결을 돕는다
    practitioner: |
      할 수 있는 일:
      - 접근 권한, 워크플로, 보고를 포함하여 재무 또는 급여 시스템을 관리한다
      - 예산 보유자를 위한 보고서와 대시보드를 설계한다
      - 시스템 변경과 업그레이드를 테스트한다
      - 반복적인 재무 업무를 자동화한다
    expert: |
      할 수 있는 일:
      - 재무 시스템 전략과 로드맵을 맡는다
      - 재무 또는 급여 시스템의 조달과 구현을 이끈다
      - 재무 데이터가 인력, 조달, 성과 데이터와 통합되도록 한다
fin-public-sector-finance:
  name: 공공 부문 재정
  description: 자금 배분, 자본 및 경상 한도, 지출 통제, 공적 자금에 대한 책임, 비용 대비 가치를 포함하여 공적 자금이 어떻게 운용되는지 이해한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직이 공적 자금을 쓰며 그에 대해 설명할 책임이 있음을 설명한다
      - 자본 지출과 경상 지출의 차이를 설명한다
    working: |
      할 수 있는 일:
      - 조직의 자본 및 경상 규칙을 일상적인 지출에 적용한다
      - 자금 배분과 지출 한도가 자기 영역에 미치는 영향을 설명한다
      - 자금 제공자나 지출 통제의 승인이 필요한 지출을 알아본다
    practitioner: |
      할 수 있는 일:
      - 용도가 정해진 자금과 기한이 있는 자금을 포함하여 자금 규칙에 대해 관리자에게 조언한다
      - 프로그램이나 디렉터레이트의 자본 및 경상 한도를 관리한다
      - 자금 제공자와 지출 통제를 위한 신고서와 근거를 준비한다
    expert: |
      할 수 있는 일:
      - 자금 제공자와 감독 기관에 대해 조직을 대표한다
      - 적법성, 타당성, 비용 대비 가치에 대해 이사회에 조언한다
      - 조직의 서비스를 위한 자금 협약과 재정 체계를 형성한다
