hr-hr-administration:
  name: 인사 행정
  description: 계약과 입사부터 변경, 결근 기록, 퇴사까지 고용 생애 주기의 행정 프로세스를 정확하고 비밀을 지키며 운영한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 입사자, 변경, 퇴사자에 관한 조직의 절차를 따른다
      - 개인 기록을 기밀로 유지하고 최신 상태로 관리한다
    working: |
      할 수 있는 일:
      - 계약서, 변경 통지서, 고용 확인 서류를 정확하게 작성한다
      - 인사·급여 시스템의 변경을 마감 기한에 맞춰 처리한다
      - 인사 프로세스에 관한 관리자와 직원의 정형적인 질문에 답한다
    practitioner: |
      할 수 있는 일:
      - 품질을 점검하고 서비스 기준을 지키며 인사 행정 서비스를 운영한다
      - 프로세스와 템플릿을 개선하고 가능한 곳에서 정형 단계를 자동화한다
      - 과지급이나 계약 오류 같은 복잡하거나 이례적인 사례를 해결한다
    expert: |
      할 수 있는 일:
      - 조직의 인사 운영 모델과 서비스 기준을 설계한다
      - 디지털 셀프서비스 인사 프로세스로의 전환을 이끈다
      - 인사·급여 데이터를 정확하고 적법하게 유지하는 통제를 정한다
hr-employment-policy:
  name: 노동법과 인사 정책
  description: 직원이 적법하고, 공정하며, 일관되게 대우받도록 노동법을 적용하고 조직의 인사 정책을 작성, 해석, 검토한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 주요 인사 정책과 그 위치를 설명한다
      - 질문에 인사 자문의 조언이 필요한 때를 알아본다
    working: |
      할 수 있는 일:
      - 인사 정책을 정형적인 사례에 적용하고 관리자에게 설명한다
      - 정책의 바탕이 되는 노동법 원칙을 파악한다
      - 정책 기록을 보관하고 정책 검토 시점을 추적한다
    practitioner: |
      할 수 있는 일:
      - 복잡한 사례에 노동법과 정책을 해석하고 리스크에 대해 조언한다
      - 평등 영향 평가와 함께 인사 정책을 작성하고 검토한다
      - 정책 변경에 대해 직원 대표와 협의한다
    expert: |
      할 수 있는 일:
      - 조직의 인사 정책 체계와 법적 리스크에 대한 접근 방식을 정한다
      - 노동법의 변화를 예측하고 조직의 대응을 계획한다
      - 고용 리스크와 책임에 대해 이사회에 조언한다
hr-employee-relations:
  name: 노사 관계 사례 관리
  description: 행위, 역량, 고충, 근태, 직장 내 존엄성 등 공식·비공식 노사 관계 사례를 정책과 노동법에 맞춰 공정하게 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 행위, 역량, 고충, 근태 절차의 주요 단계를 설명한다
      - 공식 회의에서 정확하게 기록하고 사례 기록을 기밀로 유지한다
    working: |
      할 수 있는 일:
      - 단순한 사례와 절차의 다음 단계에 대해 관리자에게 조언한다
      - 조사를 지원하고, 사례 서류를 준비하고, 심의를 준비한다
      - 개별 사례에서 직원 대표와 건설적으로 협력한다
    practitioner: |
      할 수 있는 일:
      - 복잡한 사례를 다수 담당하며 심의 위원회에 공정한 결과에 대해 조언한다
      - 인시던트나 안전 보호와 관련된 조사를 포함하여 조사를 수행하거나 이끈다
      - 조기 해결과 조정으로 분쟁이 커지기 전에 해결한다
      - 사례의 경향을 파악하고 그 원인에 대응한다
    expert: |
      할 수 있는 일:
      - 조직의 노사 관계와 협력적 관계에 대한 접근 방식을 이끈다
      - 고용 관련 소송을 포함하여 가장 민감하거나 위험이 높은 사례를 처리한다
      - 단체 협약을 교섭하고 집단적 분쟁을 해결한다
hr-recruitment-and-selection:
  name: 채용과 선발
  description: 직무 설계와 공고부터 서류 심사, 평가, 제안, 입사 전 확인까지 사람들을 공정하고 효율적으로 유치하고, 평가하고, 채용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 채용 프로세스 단계를 설명한다
      - 입사 전 확인을 포함하여 공정하고 안전한 채용 규칙을 따른다
    working: |
      할 수 있는 일:
      - 지원자 추적 시스템으로 채용 캠페인을 운영한다
      - 공고, 서류 심사, 면접 준비에서 관리자를 지원한다
      - 입사 전 확인을 마치고 조건부 제안을 한다
    practitioner: |
      할 수 있는 일:
      - 직무 설계, 선발 방법, 공정한 평가에 대해 관리자에게 조언한다
      - 디지털 직무의 기술 과제처럼 전문 직무에 맞는 평가를 설계한다
      - 채용 데이터를 분석하여 채용 소요 기간, 품질, 다양성을 개선한다
      - 지원자 경험과 고용 브랜드를 관리한다
    expert: |
      할 수 있는 일:
      - 조직의 채용 전략과 서비스 기준을 정한다
      - 채용 기술과 에이전시의 선택과 활용을 이끈다
      - 조직 전반의 채용이 포용적이고 적법하도록 한다
hr-talent-attraction:
  name: 인재 유치와 소싱
  description: 고용 브랜딩, 직접 소싱, 네트워크, 신입 경력 경로를 통해 디지털, 데이터, 기술 전문가처럼 희소한 기술을 가진 사람을 찾고 접근한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 어떤 기술을 채용하기 어렵고 그 이유가 무엇인지 설명한다
      - 조직의 채널과 네트워크를 통해 채용 공고를 공유한다
    working: |
      할 수 있는 일:
      - 전문 지원자의 마음을 끌고 쉬운 말을 쓰는 공고를 작성한다
      - 구인 게시판, 전문가 네트워크, 인재 풀에서 후보자를 찾는다
      - 채용 박람회와 오픈 데이 같은 행사를 지원한다
    practitioner: |
      할 수 있는 일:
      - 희소한 디지털·데이터 직무를 위한 인재 파이프라인과 커뮤니티를 만든다
      - 채용 팀과 함께 고용 가치 제안을 형성한다
      - 급여와 공급에 관한 시장 데이터를 활용해 채용이 어려운 직무에 대해 조언한다
      - 도제 과정과 신입 사원 제도 같은 신입 경력 경로를 개발한다
    expert: |
      할 수 있는 일:
      - 조직의 인재 유치 전략과 고용 브랜드를 정한다
      - 대학과 다른 고용주 같은 파트너와 협력하여 인재 공급을 늘린다
      - 프리미엄 급여, 에이전시 활용, 대안적 소싱 모델에 대한 결정을 이끈다
hr-workforce-planning:
  name: 인력 계획
  description: 조직에 필요한 인력을 예측하고, 보유한 인력과 비교하며, 채용, 육성, 재설계, 유지를 통해 그 격차를 메우는 방법을 계획한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 안전하고 지속 가능한 서비스에 인력 계획이 중요한 이유를 설명한다
      - 정원과 결원에 관한 정확한 정보를 제공한다
    working: |
      할 수 있는 일:
      - 관리자로부터 인력 계획 데이터를 수집하고 확인한다
      - 이직과 결원 추세 같은 단순한 시나리오를 모델링한다
    practitioner: |
      할 수 있는 일:
      - 서비스 계획 및 재무 계획과 연결하여 디렉터레이트의 인력 계획을 이끈다
      - 기술의 격차를 파악하고 이를 메울 방법을 권고한다
      - 새로운 직무, 경력 경로, 기술 구성을 계획한다
    expert: |
      할 수 있는 일:
      - 조직의 인력 전략과 장기 계획을 정한다
      - 재무 및 서비스 리더와 함께 서비스 간 인력의 득실을 조정한다
      - 보건·돌봄 시스템 전반의 파트너와 인력 계획을 형성한다
hr-workforce-information:
  name: 인력 정보와 인사 시스템
  description: 인사 및 인력 시스템과 데이터를 관리하고, 이직, 결근, 결원, 다양성, 임금 격차 분석 같은 인력 데이터를 보고서와 통찰로 바꾼다.
  levels:
    awareness: |
      할 수 있는 일:
      - 인사 시스템에 인력 데이터를 정확하게 입력한다
      - 인력 데이터를 정확하게 유지하고 기밀로 다뤄야 하는 이유를 설명한다
    working: |
      할 수 있는 일:
      - 표준 인력 보고서를 실행하고 오류가 없는지 확인한다
      - 인력에 관한 정형적인 정보 요청에 답한다
    practitioner: |
      할 수 있는 일:
      - 인력 데이터를 분석하여 경향을 찾고 관리자에게 설명한다
      - 인력 지표를 위한 대시보드와 보고서를 설계한다
      - 임금 격차 분석 같은 법정 보고와 평등 보고를 작성한다
    expert: |
      할 수 있는 일:
      - 조직의 인력 정보 전략과 데이터 기준을 정한다
      - 인사 시스템의 선택과 개발을 이끈다
      - 인력에 관한 통찰로 이사회의 결정에 정보를 제공한다
hr-reward-and-job-evaluation:
  name: 보상과 직무평가
  description: 급여와 보상 규칙을 적용하고, 직무평가 제도에 따라 직무를 일관되게 평가하여 올바른 밴드에 배치한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 급여 밴드, 호봉, 수당이 어떻게 작동하는지 설명한다
      - 직무가 그 일을 하는 사람이 아니라 직무평가에 따라 밴드가 정해진다는 점을 설명한다
    working: |
      할 수 있는 일:
      - 초임, 보호 조치, 수당 같은 급여 규칙을 적용한다
      - 직무기술서가 평가에 올라가기 전에 완전한지 확인한다
      - 교육을 받은 위원으로서 직무평가 위원회에 참여한다
    practitioner: |
      할 수 있는 일:
      - 직무평가 위원회와 일관성 점검을 이끈다
      - 디지털 및 데이터 직무를 포함하여 새로 생기거나 바뀐 직무의 밴드에 대해 조언한다
      - 시장 근거를 활용해 채용 및 유지 프리미엄에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 합의된 급여 체계 안에서 조직의 보상 전략을 정한다
      - 조직 전반에서 직무평가의 신뢰성을 보증한다
      - 동일 임금 검토를 이끌고 그 결과에 따라 조치한다
hr-learning-design-and-delivery:
  name: 학습 설계와 제공
  description: 학습 필요를 분석한 뒤, 대면, 온라인, 업무 흐름 속에서 학습을 설계하고, 제공하고, 평가한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 교육, 학습, 개발의 차이를 설명한다
      - 과정 운영을 지원하고 교육 기록을 보관한다
    working: |
      할 수 있는 일:
      - 잘 정의된 교육 세션을 대면과 온라인으로 진행한다
      - 학습 관리 시스템에서 간단한 이러닝을 만든다
      - 학습자의 피드백을 수집하고 요약한다
    practitioner: |
      할 수 있는 일:
      - 학습 필요를 분석하고 이를 충족하는 혼합형 프로그램을 설계한다
      - 학습 성과를 설정하고 만족도뿐 아니라 영향을 평가한다
      - 모든 직원이 학습에 접근하기 쉽고 포용적이도록 한다
    expert: |
      할 수 있는 일:
      - 조직의 학습 전략과 기준을 정한다
      - 학습 제공 내용과 그 기술, 재원을 이끈다
      - 조직의 학습 투자에 대한 수익을 보여 준다
hr-skills-frameworks-and-career-pathways:
  name: 스킬 프레임워크와 경력 경로
  description: 이 레퍼런스, UK GDaD PCF, ESCO 같은 스킬 및 역할 프레임워크를 활용해 직무를 기술하고, 스킬 격차를 평가하며, 경력 경로를 만든다.
  levels:
    awareness: |
      할 수 있는 일:
      - 스킬 프레임워크가 무엇이고 역할과 수준을 어떻게 기술하는지 설명한다
      - 프레임워크에서 직무의 역할 프로필과 스킬을 찾는다
    working: |
      할 수 있는 일:
      - 직무기술서를 프레임워크의 역할, 수준, 스킬에 대응시킨다
      - 직원과 관리자의 스킬 자기 평가를 지원한다
      - 경력 경로 정보를 최신으로 유지한다
    practitioner: |
      할 수 있는 일:
      - 팀이나 직군의 스킬 격차 분석을 실시하고 결과를 보고한다
      - 프레임워크의 수준을 활용해 경력 경로와 육성 경로를 설계한다
      - 프레임워크의 스킬을 활용해 일관된 직무기술서와 평가를 작성한다
    expert: |
      할 수 있는 일:
      - 조직이 직군 전반에서 스킬 프레임워크를 어떻게 활용할지 정한다
      - 스킬 데이터를 활용해 인력, 학습, 보상 전략에 정보를 제공한다
      - 다른 조직과 공유하는 프레임워크의 개발에 기여한다
hr-organisational-development:
  name: 조직 개발
  description: 근거에 기반한 문화, 리더십, 참여, 팀 효과성, 웰빙 개입을 통해 조직이 일하는 방식을 개선한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 문화, 리더십, 참여가 직원과 환자 돌봄에 어떤 영향을 미치는지 설명한다
      - 직원 설문과 경청 행사의 운영을 돕는다
    working: |
      할 수 있는 일:
      - 표준 도구를 활용해 팀 세션과 워크숍을 진행한다
      - 팀의 직원 설문 결과를 분석하고 조치를 제안한다
    practitioner: |
      할 수 있는 일:
      - 조직의 문제를 진단하고 이를 해결하는 개입을 설계한다
      - 팀 개발, 리더십 개발, 참여 프로그램을 이끈다
      - 근거를 활용해 개입의 효과를 평가한다
    expert: |
      할 수 있는 일:
      - 조직 개발 전략과 문화 프로그램을 정한다
      - 임원을 코칭하고 대규모 문화 변화를 이끈다
      - 문화와 참여 지표를 돌봄의 질 및 성과와 연결한다
hr-organisational-change:
  name: 조직 변화와 협의
  description: 정책과 노동법에 맞춰 공식 협의, 재배치, 정리 해고를 포함하여 조직 구조, 직무, 근무 방식의 변경을 계획하고 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직 변경 프로세스의 주요 단계를 설명한다
      - 협의 통지서와 회의 같은 변경의 행정을 지원한다
    working: |
      할 수 있는 일:
      - 관리자가 협의 문서와 직원 브리핑을 준비하도록 지원한다
      - 협의 중 의견과 조치를 추적한다
      - 재배치와 선발 과정에서 직원을 지원한다
    practitioner: |
      할 수 있는 일:
      - 비즈니스 케이스부터 실행까지 디렉터레이트의 조직 변경을 이끈다
      - 직원과 그 대표와 협의하고 의견에 응답한다
      - 변경의 법적 리스크와 평등 관련 리스크를 관리한다
    expert: |
      할 수 있는 일:
      - 조직 전체의 구조 개편과 서비스 이전을 이끈다
      - 협력적 관계를 포함하여 조직의 변화 접근 방식을 설계한다
      - 대규모 변화가 사람에게 미치는 영향과 리스크에 대해 이사회에 조언한다
hr-people-strategy:
  name: 인사 전략과 인사 리더십
  description: 조직의 인사 전략을 정하고, 인사 기능을 이끌며, 문화, 인력, 고용 리스크에 대해 이사회에 조언한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 인사 전략과 자신의 업무가 이를 어떻게 뒷받침하는지 설명한다
    working: |
      할 수 있는 일:
      - 명확한 조치와 지표와 함께 서비스의 인사 계획에 기여한다
      - 인사 계획에 대한 진행 상황을 보고한다
    practitioner: |
      할 수 있는 일:
      - 인사 전략에 맞춰 디렉터레이트의 인사 계획을 작성하고 이끈다
      - 사람에 관한 리스크와 우선순위에 대해 시니어 리더에게 조언한다
      - 인사 기능의 일부를 이끌며 그 기준과 우선순위를 정한다
    expert: |
      할 수 있는 일:
      - 조직의 인사 전략을 정하고 인사 기능을 이끈다
      - 문화, 인력, 고용 리스크에 대해 이사회에 조언한다
      - 사람에 관한 사안에서 파트너와 규제 기관에 조직을 대표한다
