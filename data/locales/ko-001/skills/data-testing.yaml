data-ai-assurance:
  name: 보건·돌봄 분야의 안전하고 공정한 AI
  description: 보건·돌봄에 쓰이는 통계, 머신러닝, AI 모델이 안전하고, 공정하며, 설명할 수 있고, 모니터링되도록 한다. 환자 집단 간 편향 점검과 의료기기 및 AI 규제 준수를 포함한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 편향, 드리프트, 모델 출력에 대한 과도한 의존 등을 통해 모델이 환자에게 어떻게 해를 끼칠 수 있는지 설명한다
      - 모델을 사용할 집단에서 검증해야 하는 이유를 설명한다
    working: |
      할 수 있는 일:
      - 환자 집단별로 모델 성능을 측정하고 차이를 보고한다
      - 모델 카드 등을 통해 모델의 의도된 용도, 학습 데이터, 알려진 한계를 문서화한다
      - 임상 안전 케이스에 모델에 관한 근거를 제공한다
    practitioner: |
      할 수 있는 일:
      - 임상 동료와 함께 모델의 검증, 편향 평가, 실제 운영 중 모니터링을 계획한다
      - 모델을 재학습하거나, 제한하거나, 철회해야 하는 시점을 판단한다
      - 모델이 의료기기로 규제될 수 있는 시점과 필요한 근거에 대해 팀에 조언한다
    expert: |
      할 수 있는 일:
      - 돌봄 분야 AI의 보증과 모니터링에 관한 조직의 기준을 정한다
      - 고위험 모델의 배포 전후 보증을 이끈다
      - 안전하고 공정한 AI에 관해 규제 기관과 파트너에게 조직을 대표한다
data-deidentification:
  name: 가명처리와 공개 통제
  description: 가명처리, 익명처리, 소수 값 비공개, 그 밖의 통계적 공개 통제 방법을 사용하여, 데이터를 연결, 분석, 공유, 공표할 때 환자의 비밀을 보호한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 식별 가능한 데이터, 가명처리된 데이터, 익명처리된 데이터의 차이를 설명한다
      - 결과물에서 소수 값을 가리는 조직의 규칙을 따른다
    working: |
      할 수 있는 일:
      - 가명처리된 데이터로 작업하고, 결과물을 공개하기 전에 공개 점검을 적용한다
      - 연결되었거나 상세한 데이터로 환자를 식별할 수 있는 경우를 알아본다
    practitioner: |
      할 수 있는 일:
      - 식별자를 분석 데이터와 분리해 두는 가명처리와 연결 방법을 설계한다
      - 데이터 세트나 공표물의 재식별 위험을 평가하고 적절한 통제를 선택한다
      - 신뢰할 수 있는 연구 환경 같은 안전한 환경에 대해 팀에 조언한다
    expert: |
      할 수 있는 일:
      - 비식별화와 공개 통제에 관한 조직의 기준을 정한다
      - 고위험 데이터 공개와 연결 프로젝트를 보증한다
      - 연구와 계획을 위한 안전한 데이터 접근에 관해 파트너와의 협업을 이끈다
