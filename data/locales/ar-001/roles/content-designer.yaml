summary: >
  يجعل مصممو المحتوى معلومات الصحة والرعاية وخدماتها واضحة، حتى يتمكن المرضى ومقدمو الرعاية والممارسون السريريون وموظفو الرعاية من فهم ما يحتاجون إلى معرفته وفعله. وهم يصممون المحتوى من أدلة احتياجات المستخدمين، ويكتبون بلغة واضحة وبسيطة، ويعملون مع الخبراء السريريين للحفاظ على دقته، ويرعون المحتوى طوال حياته، من إنشائه إلى مراجعته وسحبه.
health_context:
  - كثيرًا ما يقرأ الناس المحتوى الصحي وهم قلقون أو مرضى أو مستعجلون، لذلك يجب أن يكون المحتوى سهل الفهم والعمل به لذوي الثقافة الصحية المحدودة.
  - قد تسبب المعلومات الصحية الخاطئة أو القديمة ضررًا، لذلك يتبع مصممو المحتوى عملية ضمان سريري بمواعيد مراجعة ومراجعين سريريين مسمّين.
  - بعض الموضوعات حساسة أو عالية المخاطر، مثل الأعراض العاجلة والصحة النفسية والأدوية ورعاية نهاية الحياة، لذلك يعمل مصممو المحتوى عن قرب مع الممارسين السريريين وباحثي المستخدمين على النبرة والدقة.
  - تحتاج الأنظمة السريرية أيضًا إلى محتوى واضح، مثل التسميات والتعليمات والتنبيهات، لذلك يساعد مصممو المحتوى في تقليل الأخطاء في مسارات العمل السريرية.
  - يجب أن يكون المحتوى الصحي متاحًا للجميع وشاملًا، بما في ذلك لمستخدمي التقنيات المساعدة ومن يقرؤون بلغة أخرى ومن يحتاجون إلى صيغ سهلة القراءة.
levels:
  - title: مصمم محتوى مشارك
    responsibilities:
      - تعلّم أساليب تصميم المحتوى ودليل الأسلوب وعملية المراجعة السريرية من خلال التدريب والعمل تحت الإشراف.
      - إجراء الفحوص القياسية والتدقيق اللغوي والتحديثات على المحتوى القائم.
      - نشر المحتوى باستخدام نظام إدارة المحتوى، وفق خطوات الضمان.
      - التحقق من إمكانية الوصول إلى المحتوى، مثل العناوين ونصوص الروابط والنصوص البديلة.
    qualifications:
      - العمل للحصول على مؤهل أو تدريب مهني في مجال ذي صلة، أو خبرة معادلة.
  - title: مصمم محتوى مبتدئ
    responsibilities:
      - كتابة المحتوى الصحي ومحتوى الخدمات وتحديثه، بتوجيه من مصممي محتوى أعلى.
      - استخدام البحث والبيانات لتحديد ما يحتاج المستخدمون إلى معرفته والكلمات التي يستخدمونها.
      - العمل مع المراجعين السريريين للتحقق من الدقة، وشرح المصطلحات الطبية بلغة واضحة وبسيطة.
      - دعم نشر المحتوى ومواعيد مراجعته والأعمال الإدارية لفريق المحتوى.
    qualifications:
      - درجة جامعية أو مؤهل ذو صلة، أو خبرة معادلة في الكتابة للويب.
  - title: مصمم محتوى
    responsibilities:
      - تصميم المحتوى عبر رحلات المستخدمين كاملة، مثل إيجاد خدمة والاستعداد لموعد والرعاية اللاحقة.
      - تصميم المحتوى للأنظمة السريرية، مثل التسميات والتعليمات والتنبيهات، لتقليل احتمال الخطأ.
      - الاتفاق على الدقة مع الخبراء السريريين مع الحفاظ على وضوح المحتوى وسهولة استخدامه.
      - اختبار المحتوى مع المستخدمين، بمن فيهم ذوو الثقافة الصحية المحدودة ومستخدمو التقنيات المساعدة.
      - الإسهام في دليل الأسلوب وأنماط المحتوى.
    qualifications:
      - درجة جامعية أو مؤهل ذو صلة، أو خبرة معادلة.
      - خبرة في تصميم المحتوى للخدمات الرقمية.
  - title: مصمم محتوى أول
    responsibilities:
      - تطوير استراتيجية المحتوى للمجالات الكبيرة أو البارزة، مثل مجال حالة مرضية رئيسية أو حملة صحة عامة.
      - تصميم المحتوى للموضوعات الحساسة وعالية المخاطر، مثل الأعراض العاجلة والصحة النفسية ورعاية نهاية الحياة.
      - إعداد الضمان السريري ومصادر الأدلة ودورات المراجعة لمجموعة من المحتوى الصحي.
      - مراجعة عمل الآخرين لضمان الجودة، وإدارة مصممي المحتوى أو إرشادهم.
      - كتابة قصص المستخدمين ورسمها مع الفريق.
    qualifications:
      - خبرة واسعة في تصميم المحتوى، بمستوى يعادل درجة الماجستير.
    job_evaluation_notes: الجهد العاطفي في المستوى 2 لأن مصممي المحتوى الأوائل يعملون بانتظام على موضوعات مؤلمة، مثل الأمراض الخطيرة وإيذاء النفس والفقد.
  - title: مصمم محتوى قائد
    responsibilities:
      - توجيه فريق من مصممي المحتوى وضمان جودة المحتوى عبر عدة فرق.
      - ضمان استيفاء المحتوى الصحي لمعايير الضمان السريري وإمكانية الوصول والأسلوب.
      - العمل مع كبار القادة السريريين وقادة الاتصال والمنتجات لتوفير الموارد للفرق وحل مشكلات المحتوى.
      - قيادة المحتوى لأكثر معلومات المؤسسة حساسية أو خطورة.
      - الإدارة المباشرة لمصممي المحتوى وتطويرهم.
    qualifications:
      - خبرة واسعة في قيادة تصميم المحتوى عبر الفرق.
    job_evaluation_notes: لا يوجد مستوى في الفئة 8a، لأن UK GDaD PCF يضع مصمم المحتوى القائد عند G7 أو G6 ويتبع هذا المرجع الفئة المقترحة 8b. والسياسات في المستوى 5 لأن القائد يضع معايير المحتوى لمجموعة من الخدمات؛ والجهد العاطفي في المستوى 2، كما لمصممي المحتوى الأوائل.
  - title: رئيس تصميم المحتوى
    responsibilities:
      - تطوير استراتيجية للمحتوى تحقق أهداف المؤسسة واحتياجات المرضى والموظفين.
      - وضع معايير المؤسسة لمحتوى المعلومات الصحية وضمانه السريري.
      - قيادة فريق لتصميم المحتوى قادر على تنفيذ الاستراتيجية، بما في ذلك التوظيف والتطوير.
      - العمل مع كبار القادة السريريين وقادة الاتصال لإدارة مخاطر المعلومات الصحية.
      - ترتيب أولويات أعمال المحتوى على مستوى المؤسسة.
    qualifications:
      - خبرة واسعة في قيادة تصميم المحتوى وممارسة للمحتوى.
    job_evaluation_notes: يضع UK GDaD PCF كلًا من مصمم المحتوى القائد ورئيس تصميم المحتوى عند G7 أو G6، مع الفئة المقترحة 8b. ويضع هذا المرجع الرئيس في الفئة 8c، بما يتوافق مع رؤساء مهن التصميم المتمحور حول المستخدم الأخرى، لأن الرئيس يضع استراتيجية المحتوى ومعاييره للمؤسسة كلها.
