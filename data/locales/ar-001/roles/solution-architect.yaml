summary: >
  يصمم المهندسون المعماريون للحلول كيفية عمل خدمة جديدة أو معدّلة من طرف إلى طرف، من احتياجات المستخدمين ومسارات العمل السريرية إلى التطبيقات والبيانات وعمليات التكامل والاستضافة والأمن. وهم يضمنون أن يتلاءم كل حل مع الهندسة المعمارية للمؤسسة، وأن يلبي احتياجاتها في السلامة والخصوصية والتشغيل البيني، وأن يمكن بناؤه وتشغيله ودعمه بتكلفة معقولة.
health_context:
  - كثيرًا ما تجمع الحلول بين أنظمة سريرية مشتراة وخدمات داخلية ومنصات مشتركة، لذلك يجب على المهندسين المعماريين التصميم عبر حدود الموردين.
  - قد تُدخل خيارات التصميم مخاطر سريرية، مثل فقدان النتائج أو مطابقة المريض الخطأ، لذلك تُغذّي تصاميم الحلول ملف السلامة السريرية.
  - يحتاج كل تدفق جديد لمعلومات المرضى إلى أساس قانوني وتقييم لأثر حماية البيانات، لذلك يعمل المهندسون المعماريون عن قرب مع حوكمة المعلومات.
  - التشغيل البيني مع مؤسسات الصحة والرعاية الأخرى، باستخدام معايير مثل HL7 FHIR، متطلب أساسي في العادة.
  - تتضمن بعض الحلول برمجيات تُعدّ أجهزة طبية، مما يغيّر متطلبات التصميم والضمان والموردين.
levels:
  - title: مهندس معماري مشارك للحلول
    responsibilities:
      - جمع المتطلبات من فرق المنتجات والممارسين السريريين والموردين لدعم تصاميم الحلول.
      - رسم مخططات الوضع الحالي والمستهدف، مثل مخططات السياق وتدفق البيانات والتكامل.
      - صياغة أقسام من تصاميم الحلول وسجلات القرارات تحت الإشراف.
      - التحقق من التصاميم مقابل معايير الهندسة المعمارية ومتطلبات الأمن وحوكمة المعلومات.
      - المساعدة في إعداد التصاميم للمراجعة في هيئات اعتماد التصميم.
    qualifications:
      - معرفة متخصصة بتصميم الحلول، بمستوى الماجستير أو خبرة معادلة.
      - خبرة في التحليل أو التطوير أو التصميم التقني.
    job_evaluation_notes: "مصنّف فوق الفئة المقترحة من درجة UK GDaD PCF (الفئة 6): تضع إعلانات القطاع الصحي هذا الدور في الفئة 7. وتُقدَّر المعرفة بمستوى الماجستير أو ما يعادله، لأن الوظيفة تصمم عبر التطبيقات والبيانات والتكامل والأمن."
  - title: مهندس معماري للحلول
    responsibilities:
      - تصميم حلول متكاملة للخدمات الأقل خطورة، مثل أدوات الموظفين أو الخدمات البسيطة الموجهة للمرضى.
      - مقارنة الخيارات، بما في ذلك الشراء والبناء وإعادة استخدام المنصات المشتركة، والتوصية بأحدها بأسباب واضحة.
      - تصميم عمليات التكامل وتدفقات البيانات والهوية والوصول للحل، باستخدام المعايير المفتوحة حيثما وُجدت.
      - الإسهام في تحديد المخاطر وتقييمات أثر حماية البيانات للحل.
      - عرض التصاميم على هيئات اعتماد التصميم ودعم فرق التنفيذ خلال البناء والتشغيل.
      - توجيه المهندسين المعماريين المشاركين للحلول ومراجعة عملهم.
    qualifications:
      - خبرة واسعة في تصميم الحلول أو هندسة البرمجيات، بمستوى يعادل درجة الماجستير.
    job_evaluation_notes: "مصنّف فوق الفئة المقترحة من درجة UK GDaD PCF (الفئة 7): تضع إعلانات القطاع الصحي هذا الدور في الفئة 8a. ويُقدَّر التخطيط والسياسات وحرية التصرف فوق ملف الفئة 7 لأن الوظيفة تتولى التصاميم المتكاملة وتوصي بالخيارات لهيئات اعتماد التصميم."
  - title: مهندس معماري أول للحلول
    responsibilities:
      - تصميم حلول معقدة متوسطة الخطورة، مثل الأنظمة السريرية أو الخدمات المستخدمة عبر عدة مؤسسات.
      - قيادة التقييم التقني لمنتجات الموردين في المشتريات، بما في ذلك التشغيل البيني والأمن والسلامة.
      - التصميم من أجل المرونة واستمرارية الأعمال حيث يدعم الحل الرعاية على مدار الساعة.
      - العمل مع مسؤولي السلامة السريرية حتى تُسجَّل قرارات التصميم وضوابط المخاطر في ملف السلامة.
      - توجيه المهندسين المعماريين الآخرين للحلول ومراجعة عملهم.
    qualifications:
      - خبرة واسعة في تصميم الحلول المعقدة عبر عدة تخصصات، بمستوى يتجاوز درجة الماجستير.
    job_evaluation_notes: "مصنّف فوق الفئة المقترحة من درجة UK GDaD PCF (الفئة 8a): تضع إعلانات القطاع الصحي هذا الدور في الفئة 8b. وتُقدَّر المعرفة في المستوى 8 للمعرفة المتخصصة عبر عدة تخصصات، مثل التطبيقات والبيانات والتكامل والأمن والسلامة السريرية."
  - title: مهندس معماري قائد للحلول
    responsibilities:
      - قيادة هندسة الحلول لبرنامج أو مجال معقد، مثل استبدال السجل الإلكتروني للمرضى.
      - ضمان أن تكون الحلول عبر البرنامج متسقة وقابلة للتشغيل البيني ومتوافقة مع الهندسة المعمارية المستهدفة.
      - تقديم المشورة لمجالس البرامج بشأن مخاطر التصميم والاعتماديات وخيارات الموردين والتكاليف.
      - ضمان تصاميم المهندسين المعماريين الآخرين للحلول في هيئات اعتماد التصميم.
      - قيادة فريق من المهندسين المعماريين للحلول وتطويره.
    qualifications:
      - خبرة واسعة في قيادة هندسة الحلول للبرامج المعقدة.
    job_evaluation_notes: "مصنّف فوق الفئة المقترحة من درجة UK GDaD PCF (الفئة 8b): تضع إعلانات القطاع الصحي هذا الدور في الفئة 8c. ويُقدَّر التخطيط والسياسات والأفراد فوق ملف الفئة 8b لأن الوظيفة تخطط للهندسة المعمارية لبرنامج كامل وتقود فريقًا من المهندسين المعماريين للحلول."
  - title: مهندس معماري رئيسي للحلول
    responsibilities:
      - قيادة هندسة الحلول لأكبر برامج المؤسسة أو أكثرها أهمية.
      - وضع معايير هندسة الحلول وأنماطها وأساليبها للمؤسسة.
      - تقديم المشورة للمديرين والمؤسسات الشريكة بشأن تصميم خدمات الصحة والرعاية الحرجة والمشتركة.
      - حل أصعب تعارضات التصميم بين البرامج والموردين والمؤسسات الشريكة.
      - قيادة ممارسة هندسة الحلول وتطوير أفرادها.
    qualifications:
      - خبرة واسعة في قيادة هندسة الحلول عبر برامج أو مؤسسات متعددة.
    job_evaluation_notes: "مصنّف فوق الفئة المقترحة من درجة UK GDaD PCF (الفئة 8c): تضع إعلانات القطاع الصحي هذا الدور في الفئة 8d. وحرية التصرف في المستوى 6 لأن الوظيفة تضع معايير هندسة الحلول في المؤسسة؛ والموارد المالية والأفراد في المستوى 4 لأنها تقود الممارسة وميزانيتها."
