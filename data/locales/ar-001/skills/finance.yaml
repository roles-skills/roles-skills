# Arabic translations of data/skills/finance.yaml. Keys are the English skill ids.
fin-financial-transactions:
  name: المعاملات المالية والدفاتر
  description: معالجة الفواتير والمدفوعات والمقبوضات والقيود والتسويات وتسجيلها بدقة في الدفاتر، وفق الضوابط المالية.
  levels:
    awareness: |
      يمكنك:
      - شرح عمليتي "من الشراء إلى الدفع" و"من الطلب إلى التحصيل" ودورك فيهما
      - إدخال الفواتير والمقبوضات والمدفوعات بدقة، وفق إجراءات محددة
      - التحقق من أن المعاملة حاصلة على الاعتماد الصحيح والمستندات الداعمة
    working: |
      يمكنك:
      - معالجة طيف من المعاملات، بما في ذلك الإشعارات الدائنة والمبالغ المستردة والقيود
      - تسوية كشوف حسابات الموردين والحسابات المصرفية وحسابات المراقبة
      - حل الاستفسارات الروتينية من الموردين والعملاء وأصحاب الميزانيات
      - رصد المعاملات المكررة أو غير المعتادة أو غير المعتمدة والتنبيه إليها
    practitioner: |
      يمكنك:
      - إدارة دفتر أو عملية معاملات والحفاظ على دقتها وحداثتها
      - التحقيق في بنود التسوية المعقدة والأرصدة المتقادمة وتصفيتها
      - تحسين عمليات المعاملات، مثلًا بأتمتة المطابقة أو الاعتمادات
      - تدريب الموظفين الآخرين ومراجعة عملهم
    expert: |
      يمكنك:
      - تصميم عمليات المعاملات في المؤسسة والضوابط المدمجة فيها
      - وضع معايير الأداء، مثل مواعيد الدفع وأهداف تحصيل الديون
      - قيادة الانتقال إلى طرق معالجة جديدة، مثل الأتمتة والخدمة الذاتية
      - طمأنة كبار القادة والمدققين إلى اكتمال الدفاتر ودقتها
fin-financial-reporting:
  name: التقارير المالية والحسابات النظامية
  description: إعداد قوائم مالية وإقرارات نظامية دقيقة تتبع المعايير المحاسبية المعمول بها وقواعد إعداد التقارير في القطاع العام.
  levels:
    awareness: |
      يمكنك:
      - شرح الغرض من القوائم المالية الرئيسية
      - إعداد أوراق العمل والتسويات الداعمة لإقفال الشهر ونهاية السنة
    working: |
      يمكنك:
      - إعداد قيود نهاية الشهر ونهاية السنة، مثل المستحقات والمدفوعات المقدمة والمخصصات
      - إعداد أقسام من الحسابات السنوية والإيضاحات الداعمة
      - تطبيق المعايير المحاسبية على المعاملات الروتينية، مثل رسملة البرمجيات والأجهزة
    practitioner: |
      يمكنك:
      - إعداد الحسابات السنوية والإقرارات النظامية وفق جدول زمني
      - تطبيق المعايير المحاسبية على المجالات المعقدة، مثل عقود الإيجار وترتيبات الحوسبة السحابية والأصول غير الملموسة
      - كتابة أوراق محاسبية تشرح التقديرات والاجتهادات
      - إدارة التدقيق الخارجي للحسابات والاستجابة لنتائجه
    expert: |
      يمكنك:
      - تولّي التقرير السنوي للمؤسسة وحساباتها والسياسات المحاسبية التي تقوم عليها
      - تقديم المشورة لمجلس الإدارة ولجنة التدقيق بشأن الاجتهادات المهمة والمعايير الجديدة
      - قيادة الاستجابة لآراء التدقيق المتحفظة أو الأخطاء الجوهرية
      - ضمان استيفاء التقارير لقواعد المساءلة العامة
fin-management-accounting:
  name: المحاسبة الإدارية
  description: إعداد معلومات الميزانية والتكاليف التي تساعد المديرين على التخطيط والضبط واتخاذ القرارات، بما في ذلك تحليل الانحرافات وحساب التكاليف وتقارير الأداء.
  levels:
    awareness: |
      يمكنك:
      - شرح الميزانيات والفعليات والالتزامات والانحرافات
      - إعداد تقارير الميزانية القياسية من النظام المالي
    working: |
      يمكنك:
      - إعداد تقارير الميزانية الشهرية وشرح الانحرافات الرئيسية
      - ترميز التكاليف بشكل صحيح بين مراكز التكلفة والمشاريع، وبين الرأسمالي والتشغيلي
      - دعم أصحاب الميزانيات في فهم ميزانياتهم وإدارتها
    practitioner: |
      يمكنك:
      - إدارة دورة التقارير الشهرية لمديرية أو برنامج
      - بناء نماذج التكاليف، مثل التكلفة الكاملة لخدمة رقمية أو تكلفة الوحدة لمعاملة ما
      - تحليل اتجاهات الإنفاق وتقديم المشورة للمديرين بشأن الإجراءات اللازمة للبقاء ضمن الميزانية
      - مناقشة أصحاب الميزانيات في توقعاتهم مناقشة بنّاءة
    expert: |
      يمكنك:
      - تصميم نهج المؤسسة في التقارير الإدارية وحساب التكاليف
      - عرض الأداء المالي على مجلس الإدارة وكبار القادة
      - قيادة استخدام معلومات التكلفة والأداء لتحسين القيمة مقابل المال
      - وضع معايير المحاسبة الإدارية على مستوى المؤسسة
fin-financial-planning-and-forecasting:
  name: التخطيط المالي والتنبؤ
  description: إعداد الميزانيات والتوقعات والخطط المالية متوسطة الأجل التي تربط الأموال بأولويات المؤسسة وبرامجها.
  levels:
    awareness: |
      يمكنك:
      - شرح دورة إعداد الميزانية السنوية والفرق بين الميزانية والتوقع
      - جمع معلومات التوقعات من أصحاب الميزانيات
    working: |
      يمكنك:
      - إعداد الميزانيات والتوقعات لمركز تكلفة أو مشروع، بما في ذلك تكاليف الموظفين
      - تحديث التوقعات كل شهر بالتغييرات والمخاطر المعروفة
      - توزيع الميزانيات زمنيًا بحيث تتوافق أنماط الإنفاق مع خطط التنفيذ
    practitioner: |
      يمكنك:
      - قيادة إعداد الميزانية والتوقعات لمديرية أو برنامج كبير
      - نمذجة السيناريوهات وتحليلات الحساسية، مثل التضخم أو التأخير أو تغيرات التمويل
      - إعداد توقعات متعددة السنوات للبرامج الرقمية، بما في ذلك تكاليف التشغيل التي تلي الاستثمار
      - عرض التوقعات والمخاطر على كبار المديرين
    expert: |
      يمكنك:
      - قيادة الخطة المالية متوسطة الأجل للمؤسسة
      - مواءمة الخطط المالية مع خطط الاستراتيجية والقوى العاملة والاستثمار
      - تقديم المشورة لمجلس الإدارة بشأن الاستدامة المالية والخيارات اللازمة للبقاء ضمن التمويل
      - وضع افتراضات التخطيط وأساليبه المستخدمة على مستوى المؤسسة
fin-payroll:
  name: الرواتب
  description: دفع رواتب الموظفين بدقة وفي موعدها، بما في ذلك الموظفون الجدد والمغادرون والتغييرات والاستقطاعات والمعاشات والمدفوعات النظامية وتقارير الرواتب.
  levels:
    awareness: |
      يمكنك:
      - شرح دورة الرواتب، من التغييرات والموعد النهائي إلى الدفع والتقارير
      - إدخال الموظفين الجدد والمغادرين والتغييرات بدقة من النماذج المعتمدة
      - الإجابة عن استفسارات الرواتب الروتينية، مع الحفاظ على سرية معلومات الرواتب
    working: |
      يمكنك:
      - حساب الرواتب والبدلات والعمل الإضافي ومدفوعات الإجازات المرضية والعائلية
      - تطبيق الاستقطاعات الضريبية واستقطاعات المعاشات وغيرها بشكل صحيح
      - مراجعة مخرجات الرواتب وتصحيح الأخطاء قبل الدفع
      - استرداد المبالغ المدفوعة بالزيادة بلباقة ووفق السياسة
    practitioner: |
      يمكنك:
      - إدارة كشف الرواتب الكامل لمجموعة من الموظفين واعتماد فحوص الرواتب
      - إدارة التقارير النظامية للرواتب وإقرارات المعاشات
      - حل الحالات المعقدة، مثل العقود المتعددة أو الرواتب المتأخرة أو التنازل عن جزء من الراتب مقابل مزايا
      - اختبار التغييرات في نظام الرواتب، مثل الزيادات السنوية وتغييرات القواعد
    expert: |
      يمكنك:
      - إدارة خدمة الرواتب في المؤسسة، سواء أُديرت داخليًا أو من خلال مزوّد
      - وضع ضوابط الرواتب وطمأنة كبار القادة إلى أن المدفوعات دقيقة وقانونية
      - التخطيط لتغييرات قواعد الأجور والزيادات وأنظمة الرواتب
      - قيادة الاستجابة للإخفاقات الكبرى في الرواتب
fin-treasury-and-cash:
  name: الخزينة وإدارة النقد
  description: إدارة الحسابات المصرفية والتدفق النقدي والسيولة حتى تتمكن المؤسسة من الوفاء بالتزاماتها، ضمن قواعد النقد في القطاع العام.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يهم النقد إلى جانب الميزانيات
      - تسجيل المعاملات المصرفية وتسويتها
    working: |
      يمكنك:
      - إعداد المراكز النقدية اليومية وتوقعات النقد قصيرة الأجل
      - إعداد دفعات السداد والتحقق من اعتمادها بشكل صحيح
      - تسوية الحسابات المصرفية وتصفية البنود غير المطابقة
    practitioner: |
      يمكنك:
      - إدارة توقعات التدفق النقدي للمؤسسة وسحب التمويل
      - إدارة الحسابات المصرفية ووسائل الدفع والضوابط المصرفية
      - تخطيط النقد للمدفوعات الكبيرة أو غير المنتظمة، مثل تراخيص البرمجيات متعددة السنوات
    expert: |
      يمكنك:
      - وضع سياسة الخزينة في المؤسسة وترتيباتها المصرفية
      - تقديم المشورة لمجلس الإدارة بشأن مخاطر السيولة والنقد
      - إدارة النقد ضمن الحدود التي تضعها جهات التمويل وقواعد القطاع العام
fin-audit-and-controls:
  name: الضوابط المالية والتدقيق
  description: تصميم الضوابط المالية وتشغيلها واختبارها، ومنع الاحتيال وكشفه، والعمل مع المدققين الداخليين والخارجيين.
  levels:
    awareness: |
      يمكنك:
      - اتباع الإجراءات المالية في المؤسسة ومصفوفات تفويض الصلاحيات
      - التعرف على علامات الاحتيال أو الخطأ المحتمل والإبلاغ عنها
    working: |
      يمكنك:
      - تشغيل الضوابط الرئيسية، مثل الفصل بين المهام والتحقق من البيانات المصرفية للموردين
      - تقديم الأدلة للمدققين والإجابة عن أسئلتهم
      - التحقق من اعتماد الإنفاق على المستوى الصحيح
    practitioner: |
      يمكنك:
      - اختبار ضوابط عملية مالية وتحسينها
      - إدارة طلبات التدقيق لمجال ما والاتفاق على الإجراءات بشأن النتائج
      - كتابة الإجراءات المالية وتحديثها
      - العمل مع أخصائيي مكافحة الاحتيال لتقليل مخاطره
    expert: |
      يمكنك:
      - تولّي القواعد المالية للمؤسسة ومصفوفة تفويض الصلاحيات
      - رفع التقارير إلى لجنة التدقيق بشأن الضبط المالي وإجراءات التدقيق
      - قيادة الاستجابة للإخفاقات الكبيرة في الضوابط أو الاحتيال
      - بناء ثقافة يدرك فيها الموظفون واجبهم في استخدام المال العام استخدامًا سليمًا
fin-business-cases:
  name: دراسات الجدوى وتقييم الاستثمار
  description: إعداد الحجة المالية للاستثمار، بما في ذلك تقييم الخيارات وتكاليف دورة الحياة الكاملة والمعالجة الرأسمالية والتشغيلية والفوائد والقيمة مقابل المال.
  levels:
    awareness: |
      يمكنك:
      - شرح الغرض من دراسة الجدوى وقسمها المالي
      - جمع معلومات التكاليف لدراسة جدوى
    working: |
      يمكنك:
      - بناء النموذج المالي لدراسة جدوى بسيطة
      - الفصل بين التكاليف الرأسمالية والتشغيلية، وبين التكاليف لمرة واحدة والمتكررة
      - تضمين تكاليف دورة الحياة الكاملة، مثل التراخيص والدعم والاستضافة بعد التشغيل
    practitioner: |
      يمكنك:
      - قيادة الحجة المالية للاستثمارات الرقمية المعقدة، مثل نظام سريري جديد أو الانتقال إلى السحابة
      - تقييم الخيارات باستخدام صافي القيمة الحالية وتحليل الحساسية وتعديل المخاطر
      - التحقق من أن الفوائد واقعية وقابلة للقياس ولها مالك
      - تتبع الإنفاق والفوائد بعد الاعتماد
    expert: |
      يمكنك:
      - وضع معايير المؤسسة لدراسات الجدوى وتقييم الاستثمار
      - تقديم المشورة لمجالس الاستثمار بشأن القدرة على تحمل التكاليف والقيمة مقابل المال والمخاطر
      - عرض الحجة على جهات التمويل لبرامج الاستثمار الكبرى
      - مراجعة محفظة الاستثمارات والتوصية بما يُوقف أو يُعدّل أو يستمر
fin-tax:
  name: الضرائب
  description: تطبيق قواعد ضريبة المبيعات وضرائب التوظيف وغيرها من الضرائب تطبيقًا صحيحًا على معاملات المؤسسة، واسترداد الضريبة حيث يُسمح بذلك.
  levels:
    awareness: |
      يمكنك:
      - التعرف على ضريبة المبيعات في الفواتير وترميزها بشكل صحيح
      - شرح متى تطلب المشورة من أخصائي ضرائب
    working: |
      يمكنك:
      - إعداد الإقرارات والتسويات الضريبية تحت الإشراف
      - تطبيق المعالجة الضريبية الصحيحة على المشتريات والإيرادات الشائعة
      - التحقق من الوضع الوظيفي للمتعاقدين بتوجيه
    practitioner: |
      يمكنك:
      - إدارة الإقرارات والتسويات الضريبية للمؤسسة
      - تقديم المشورة بشأن المعالجة الضريبية للعقود، مثل تراخيص البرمجيات والخدمات السحابية والخدمات المشتركة
      - تعظيم الاسترداد الضريبي ضمن القواعد
    expert: |
      يمكنك:
      - تولّي الاستراتيجية الضريبية للمؤسسة ومخاطرها الضريبية
      - قيادة المناقشات مع السلطة الضريبية في المسائل المعقدة
      - تقييم الأثر الضريبي للتغييرات الكبرى، مثل الشراكات الجديدة أو الأنشطة التجارية
fin-financial-systems:
  name: الأنظمة المالية
  description: استخدام أنظمة المالية والمشتريات والرواتب والتقارير وإدارتها وتحسينها حتى تكون البيانات المالية دقيقة والعمليات فعالة.
  levels:
    awareness: |
      يمكنك:
      - استخدام النظام المالي في مهامك الخاصة، وفق الإجراءات
      - تشغيل التقارير القياسية وتصدير البيانات إلى جدول بيانات
    working: |
      يمكنك:
      - استخدام جداول البيانات بإتقان، بما في ذلك الصيغ ودوال البحث والجداول المحورية
      - صيانة بيانات النظام المالي، مثل مراكز التكلفة والموردين والمعتمِدين
      - الإبلاغ عن مشكلات النظام والمساعدة في إصلاحها
    practitioner: |
      يمكنك:
      - إدارة النظام المالي أو نظام الرواتب، بما في ذلك الوصول ومسارات العمل والتقارير
      - تصميم التقارير ولوحات المعلومات لأصحاب الميزانيات
      - اختبار تغييرات النظام وترقياته
      - أتمتة المهام المالية المتكررة
    expert: |
      يمكنك:
      - تولّي استراتيجية الأنظمة المالية وخارطة طريقها
      - قيادة شراء الأنظمة المالية أو أنظمة الرواتب وتنفيذها
      - ضمان تكامل البيانات المالية مع بيانات القوى العاملة والمشتريات والأداء
fin-public-sector-finance:
  name: مالية القطاع العام
  description: فهم كيفية عمل التمويل العام، بما في ذلك مخصصات التمويل وحدود الإنفاق الرأسمالي والتشغيلي وضوابط الإنفاق والمساءلة عن المال العام والقيمة مقابل المال.
  levels:
    awareness: |
      يمكنك:
      - شرح أن المؤسسة تنفق مالًا عامًا ويجب أن تحاسَب عنه
      - شرح الفرق بين الإنفاق الرأسمالي والإنفاق التشغيلي
    working: |
      يمكنك:
      - تطبيق قواعد المؤسسة للإنفاق الرأسمالي والتشغيلي على الإنفاق اليومي
      - شرح كيف تؤثر مخصصات التمويل وحدود الإنفاق في مجالك
      - التعرف على الإنفاق الذي يحتاج إلى موافقة جهة تمويل أو جهة ضبط الإنفاق
    practitioner: |
      يمكنك:
      - تقديم المشورة للمديرين بشأن قواعد التمويل، بما في ذلك التمويل المخصص والمحدد زمنيًا
      - إدارة حدود الإنفاق الرأسمالي والتشغيلي لبرنامج أو مديرية
      - إعداد الإقرارات والأدلة لجهات التمويل وضوابط الإنفاق
    expert: |
      يمكنك:
      - تمثيل المؤسسة لدى جهات التمويل والرقابة
      - تقديم المشورة لمجلس الإدارة بشأن النظامية والنزاهة والقيمة مقابل المال
