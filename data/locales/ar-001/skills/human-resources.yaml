# Arabic translations of data/skills/human-resources.yaml. Keys are the English skill ids.
hr-hr-administration:
  name: إدارة شؤون الموارد البشرية
  description: تشغيل العمليات الإدارية لدورة حياة التوظيف بدقة وسرية، من العقود والموظفين الجدد إلى التغييرات وسجلات الغياب والمغادرين.
  levels:
    awareness: |
      يمكنك:
      - اتباع إجراءات المؤسسة للموظفين الجدد والتغييرات والمغادرين
      - الحفاظ على سرية السجلات الشخصية وحداثتها
    working: |
      يمكنك:
      - إعداد العقود وخطابات التعديل وفحوص التوظيف بدقة
      - معالجة التغييرات في نظام الموارد البشرية والرواتب ضمن المواعيد النهائية
      - الإجابة عن الأسئلة الروتينية للمديرين والموظفين حول عمليات الموارد البشرية
    practitioner: |
      يمكنك:
      - إدارة خدمة لشؤون الموارد البشرية، مع مراجعة الجودة واستيفاء معايير الخدمة
      - تحسين العمليات والنماذج، وأتمتة الخطوات الروتينية حيثما أمكن
      - حل الحالات المعقدة أو غير المعتادة، مثل المبالغ المدفوعة بالزيادة أو أخطاء العقود
    expert: |
      يمكنك:
      - تصميم نموذج تشغيل الموارد البشرية ومعايير خدمتها للمؤسسة
      - قيادة الانتقال إلى عمليات موارد بشرية رقمية قائمة على الخدمة الذاتية
      - وضع ضوابط تحافظ على دقة بيانات الموارد البشرية والرواتب وقانونيتها
hr-employment-policy:
  name: قانون العمل وسياسات الموارد البشرية
  description: تطبيق قانون العمل وكتابة سياسات الموارد البشرية في المؤسسة وتفسيرها ومراجعتها، حتى يُعامَل الموظفون معاملة قانونية ومنصفة ومتسقة.
  levels:
    awareness: |
      يمكنك:
      - شرح سياسات الموارد البشرية الرئيسية وأين تجدها
      - إدراك متى يحتاج سؤال ما إلى مشورة مستشار موارد بشرية
    working: |
      يمكنك:
      - تطبيق سياسات الموارد البشرية على الحالات الروتينية وشرحها للمديرين
      - تحديد مبادئ قانون العمل التي تقوم عليها السياسة
      - الاحتفاظ بسجلات السياسات وتتبع مواعيد مراجعتها
    practitioner: |
      يمكنك:
      - تفسير قانون العمل والسياسات في الحالات المعقدة وتقديم المشورة بشأن المخاطر
      - صياغة سياسات الموارد البشرية ومراجعتها، مع تقييمات أثر المساواة
      - التشاور مع ممثلي الموظفين بشأن تغييرات السياسات
    expert: |
      يمكنك:
      - وضع إطار سياسات الموارد البشرية في المؤسسة ونهجها تجاه المخاطر القانونية
      - توقّع التغييرات في قانون العمل والتخطيط لاستجابة المؤسسة
      - تقديم المشورة لمجلس الإدارة بشأن مخاطر التوظيف والمسؤولية
hr-employee-relations:
  name: قضايا علاقات الموظفين
  description: إدارة قضايا علاقات الموظفين الرسمية وغير الرسمية، مثل السلوك والكفاءة والتظلمات والحضور والكرامة في العمل، بإنصاف ووفق السياسات وقانون العمل.
  levels:
    awareness: |
      يمكنك:
      - شرح المراحل الرئيسية لإجراءات السلوك والكفاءة والتظلمات والحضور
      - تدوين ملاحظات دقيقة في الاجتماعات الرسمية والحفاظ على سرية سجلات القضايا
    working: |
      يمكنك:
      - تقديم المشورة للمديرين في الحالات البسيطة وبشأن الخطوة التالية في الإجراء
      - دعم التحقيقات وإعداد أوراق القضايا وترتيب الجلسات
      - العمل بروح بنّاءة مع ممثلي الموظفين في الحالات الفردية
    practitioner: |
      يمكنك:
      - إدارة مجموعة من القضايا المعقدة، وتقديم المشورة للجان الجلسات بشأن النتائج المنصفة
      - إجراء التحقيقات أو قيادتها، بما فيها تلك المرتبطة بالحوادث أو الحماية
      - استخدام الحل المبكر والوساطة لتسوية النزاعات قبل تصاعدها
      - رصد الاتجاهات في القضايا ومعالجة أسبابها
    expert: |
      يمكنك:
      - قيادة نهج المؤسسة تجاه علاقات الموظفين والعمل التشاركي
      - التعامل مع أكثر القضايا حساسية أو خطورة، بما فيها مطالبات العمل
      - التفاوض على الاتفاقيات الجماعية وحل النزاعات الجماعية
hr-recruitment-and-selection:
  name: التوظيف والاختيار
  description: استقطاب الأشخاص وتقييمهم وتعيينهم بإنصاف وكفاءة، من تصميم الوظيفة والإعلان عنها مرورًا بالفرز والتقييم والعرض الوظيفي وفحوص ما قبل التوظيف.
  levels:
    awareness: |
      يمكنك:
      - شرح مراحل عملية التوظيف في المؤسسة
      - اتباع قواعد التوظيف المنصف والآمن، بما في ذلك فحوص ما قبل التوظيف
    working: |
      يمكنك:
      - إدارة حملات التوظيف عبر نظام تتبع المتقدمين
      - دعم المديرين في الإعلانات والفرز وترتيبات المقابلات
      - إكمال فحوص ما قبل التوظيف وتقديم العروض المشروطة
    practitioner: |
      يمكنك:
      - تقديم المشورة للمديرين بشأن تصميم الوظائف وأساليب الاختيار والتقييم المنصف
      - تصميم التقييمات للأدوار المتخصصة، مثل التمارين التقنية للأدوار الرقمية
      - تحليل بيانات التوظيف لتحسين مدة التوظيف وجودته وتنوعه
      - إدارة تجربة المرشحين والعلامة التجارية لجهة العمل
    expert: |
      يمكنك:
      - وضع استراتيجية التوظيف في المؤسسة ومعايير خدمته
      - قيادة اختيار تقنيات التوظيف ووكالاته واستخدامها
      - ضمان أن يكون التوظيف شاملًا وقانونيًا على مستوى المؤسسة
hr-talent-attraction:
  name: استقطاب المواهب والبحث عنها
  description: إيجاد أصحاب المهارات النادرة، مثل متخصصي الرقمنة والبيانات والتقنية، واستمالتهم من خلال العلامة التجارية لجهة العمل والبحث المباشر والشبكات ومسارات بداية المسيرة المهنية.
  levels:
    awareness: |
      يمكنك:
      - شرح أي المهارات يصعب توظيفها ولماذا
      - نشر إعلانات الوظائف عبر قنوات المؤسسة وشبكاتها
    working: |
      يمكنك:
      - كتابة إعلانات تجذب المرشحين المتخصصين وتستخدم لغة واضحة
      - البحث عن مرشحين في مواقع الوظائف والشبكات المهنية ومجموعات المواهب
      - دعم الفعاليات، مثل معارض التوظيف والأيام المفتوحة
    practitioner: |
      يمكنك:
      - بناء مسارات ومجتمعات للمواهب للأدوار الرقمية وأدوار البيانات النادرة
      - تشكيل عرض القيمة لجهة العمل مع فرق التوظيف
      - استخدام بيانات السوق عن الأجور والمعروض لتقديم المشورة بشأن الأدوار صعبة الشغل
      - تطوير مسارات بداية المسيرة المهنية، مثل التدريب المهني وبرامج الخريجين
    expert: |
      يمكنك:
      - وضع استراتيجية المؤسسة لاستقطاب المواهب وعلامتها التجارية بوصفها جهة عمل
      - العمل مع الشركاء، مثل الجامعات وجهات العمل الأخرى، لزيادة المعروض من المواهب
      - قيادة القرارات بشأن الأجور الإضافية واستخدام الوكالات ونماذج الاستقطاب البديلة
hr-workforce-planning:
  name: تخطيط القوى العاملة
  description: التنبؤ بالقوى العاملة التي تحتاجها المؤسسة، ومقارنتها بالقوى العاملة المتاحة لديها، والتخطيط لسد الفجوة من خلال التوظيف والتطوير وإعادة التصميم والاحتفاظ بالموظفين.
  levels:
    awareness: |
      يمكنك:
      - شرح أهمية تخطيط القوى العاملة لخدمات آمنة ومستدامة
      - تقديم معلومات دقيقة عن الملاك الوظيفي والشواغر
    working: |
      يمكنك:
      - جمع بيانات خطة القوى العاملة من المديرين والتحقق منها
      - نمذجة سيناريوهات بسيطة، مثل اتجاهات دوران الموظفين والشواغر
    practitioner: |
      يمكنك:
      - قيادة تخطيط القوى العاملة لمديرية، وربطه بخطط الخدمة والخطط المالية
      - تحديد فجوات المهارات والتوصية بسبل سدها
      - التخطيط لأدوار جديدة ومسارات مهنية ومزيج المهارات
    expert: |
      يمكنك:
      - وضع استراتيجية القوى العاملة للمؤسسة وخطتها طويلة الأجل
      - الموازنة بين أولويات القوى العاملة عبر الخدمات مع قادة المالية والخدمات
      - تشكيل خطط القوى العاملة مع الشركاء عبر منظومة الصحة والرعاية
hr-workforce-information:
  name: معلومات القوى العاملة وأنظمة الموارد البشرية
  description: إدارة أنظمة الموارد البشرية والقوى العاملة وبياناتها، وتحويل بيانات القوى العاملة إلى تقارير ورؤى، مثل تحليل دوران الموظفين والغياب والشواغر والتنوع وفجوة الأجور.
  levels:
    awareness: |
      يمكنك:
      - إدخال بيانات القوى العاملة بدقة في نظام الموارد البشرية
      - شرح لماذا يجب أن تكون بيانات القوى العاملة دقيقة وسرية
    working: |
      يمكنك:
      - تشغيل تقارير القوى العاملة القياسية والتحقق من خلوها من الأخطاء
      - الإجابة عن طلبات المعلومات الروتينية عن القوى العاملة
    practitioner: |
      يمكنك:
      - تحليل بيانات القوى العاملة لاكتشاف الاتجاهات وشرحها للمديرين
      - تصميم لوحات المعلومات والتقارير لمؤشرات القوى العاملة
      - إعداد التقارير النظامية وتقارير المساواة، مثل تحليل فجوة الأجور
    expert: |
      يمكنك:
      - وضع استراتيجية معلومات القوى العاملة في المؤسسة ومعايير بياناتها
      - قيادة اختيار أنظمة الموارد البشرية وتطويرها
      - استخدام رؤى القوى العاملة لدعم قرارات مجلس الإدارة
hr-reward-and-job-evaluation:
  name: المكافآت وتقييم الوظائف
  description: تطبيق قواعد الأجور والمكافآت، وتقييم الوظائف باتساق وفق نظام لتقييم الوظائف لوضعها في الفئة الصحيحة.
  levels:
    awareness: |
      يمكنك:
      - شرح كيفية عمل فئات الأجور والعلاوات والبدلات
      - شرح أن الوظائف تُصنَّف في فئات بتقييم الوظيفة، لا بحسب الشخص الذي يشغلها
    working: |
      يمكنك:
      - تطبيق قواعد الأجور، مثل الراتب الابتدائي وحماية الأجر والبدلات
      - التحقق من اكتمال الأوصاف الوظيفية قبل إحالتها إلى التقييم
      - المشاركة في لجان تقييم الوظائف بصفتك عضوًا مدرّبًا
    practitioner: |
      يمكنك:
      - قيادة لجان تقييم الوظائف وفحوص الاتساق
      - تقديم المشورة بشأن تصنيف الأدوار الجديدة والمعدّلة في الفئات، بما فيها أدوار الرقمنة والبيانات
      - تقديم المشورة بشأن علاوات التوظيف والاحتفاظ، باستخدام أدلة السوق
    expert: |
      يمكنك:
      - وضع استراتيجية المكافآت في المؤسسة ضمن إطار الأجور المتفق عليه
      - ضمان نزاهة تقييم الوظائف على مستوى المؤسسة
      - قيادة مراجعات المساواة في الأجور والعمل على نتائجها
hr-learning-design-and-delivery:
  name: تصميم التعلم وتقديمه
  description: تحليل احتياجات التعلم، ثم تصميم التعلم وتقديمه وتقييمه حضوريًا وعبر الإنترنت وأثناء العمل.
  levels:
    awareness: |
      يمكنك:
      - شرح الفرق بين التدريب والتعلم والتطوير
      - دعم تنظيم الدورات والاحتفاظ بسجلات التدريب
    working: |
      يمكنك:
      - تقديم جلسات تدريبية محددة المعالم حضوريًا وعبر الإنترنت
      - بناء تعلم إلكتروني بسيط في نظام إدارة التعلم
      - جمع ملاحظات المتعلمين وتلخيصها
    practitioner: |
      يمكنك:
      - تحليل احتياجات التعلم وتصميم برامج مدمجة لتلبيتها
      - تحديد نواتج التعلم وتقييم الأثر، لا الرضا فحسب
      - جعل التعلم متاحًا وشاملًا لجميع الموظفين
    expert: |
      يمكنك:
      - وضع استراتيجية التعلم في المؤسسة ومعاييره
      - قيادة العرض التعليمي وتقنياته وتمويله
      - إظهار العائد على استثمار المؤسسة في التعلم
hr-skills-frameworks-and-career-pathways:
  name: أطر المهارات والمسارات المهنية
  description: استخدام أطر المهارات والأدوار، مثل هذا المرجع وUK GDaD PCF وESCO، لوصف الأدوار وتقييم فجوات المهارات وبناء المسارات المهنية.
  levels:
    awareness: |
      يمكنك:
      - شرح ما هو إطار المهارات وكيف يصف الأدوار والمستويات
      - إيجاد ملف الدور ومهاراته لوظيفة ما في الإطار
    working: |
      يمكنك:
      - ربط الأوصاف الوظيفية بأدوار الإطار ومستوياته ومهاراته
      - دعم الموظفين والمديرين في التقييم الذاتي للمهارات
      - تحديث معلومات المسارات المهنية
    practitioner: |
      يمكنك:
      - إجراء تحليل فجوات المهارات لفريق أو مهنة والإبلاغ عن النتائج
      - تصميم المسارات المهنية ومسارات التطوير باستخدام مستويات الإطار
      - استخدام مهارات الإطار لكتابة أوصاف وظيفية وتقييمات متسقة
    expert: |
      يمكنك:
      - تحديد كيفية استخدام المؤسسة لأطر المهارات عبر المهن
      - استخدام بيانات المهارات لدعم استراتيجيات القوى العاملة والتعلم والمكافآت
      - الإسهام في تطوير أطر مشتركة مع مؤسسات أخرى
hr-organisational-development:
  name: التطوير المؤسسي
  description: تحسين طريقة عمل المؤسسة من خلال تدخلات قائمة على الأدلة في الثقافة والقيادة والمشاركة وفاعلية الفرق والرفاه.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف تؤثر الثقافة والقيادة والمشاركة في الموظفين ورعاية المرضى
      - المساعدة في إجراء استطلاعات الموظفين وفعاليات الاستماع
    working: |
      يمكنك:
      - تيسير جلسات الفرق وورش العمل باستخدام أدوات قياسية
      - تحليل نتائج استطلاع الموظفين لفريق ما واقتراح الإجراءات
    practitioner: |
      يمكنك:
      - تشخيص القضايا المؤسسية وتصميم تدخلات لمعالجتها
      - قيادة برامج تطوير الفرق وتطوير القيادات والمشاركة
      - تقييم أثر التدخلات باستخدام الأدلة
    expert: |
      يمكنك:
      - وضع استراتيجية التطوير المؤسسي وبرنامج الثقافة
      - توجيه التنفيذيين وقيادة التغيير الثقافي واسع النطاق
      - ربط مقاييس الثقافة والمشاركة بجودة الرعاية والأداء
hr-organisational-change:
  name: التغيير المؤسسي والتشاور
  description: التخطيط للتغييرات في الهياكل والأدوار وأنماط العمل وإدارتها، بما في ذلك التشاور الرسمي وإعادة التوزيع والاستغناء عن الوظائف، وفق السياسات وقانون العمل.
  levels:
    awareness: |
      يمكنك:
      - شرح المراحل الرئيسية لعملية التغيير المؤسسي
      - دعم الجوانب الإدارية للتغيير، مثل خطابات التشاور واجتماعاته
    working: |
      يمكنك:
      - دعم المديرين في إعداد وثائق التشاور وإحاطات الموظفين
      - تتبع الردود والإجراءات أثناء التشاور
      - دعم الموظفين خلال عمليات إعادة التوزيع والاختيار
    practitioner: |
      يمكنك:
      - قيادة التغيير المؤسسي لمديرية، من دراسة الجدوى إلى التنفيذ
      - التشاور مع الموظفين وممثليهم والاستجابة لملاحظاتهم
      - إدارة المخاطر القانونية ومخاطر المساواة في التغيير
    expert: |
      يمكنك:
      - قيادة عمليات إعادة الهيكلة ونقل الخدمات على مستوى المؤسسة
      - تصميم نهج المؤسسة تجاه التغيير، بما في ذلك العمل التشاركي
      - تقديم المشورة لمجلس الإدارة بشأن أثر التغييرات الكبرى ومخاطرها على الأفراد
hr-people-strategy:
  name: استراتيجية الموارد البشرية وقيادتها
  description: وضع استراتيجية المؤسسة للأفراد، وقيادة وظيفة الموارد البشرية، وتقديم المشورة لمجلس الإدارة بشأن الثقافة والقوى العاملة ومخاطر التوظيف.
  levels:
    awareness: |
      يمكنك:
      - شرح استراتيجية المؤسسة للأفراد وكيف يدعمها عملك
    working: |
      يمكنك:
