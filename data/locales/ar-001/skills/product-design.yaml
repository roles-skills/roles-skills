# Arabic translations of data/skills/product-design.yaml. Keys are the English skill ids.
pd-health-research-ethics:
  name: البحث الأخلاقي مع المرضى وموظفي الرعاية
  description: التخطيط للبحث مع المرضى ومقدمي الرعاية والممارسين السريريين وموظفي الرعاية وإجراؤه بأمان وبطريقة أخلاقية، بما في ذلك الموافقة المستنيرة والحماية والبحث مع أشخاص في ظروف هشة، ومعرفة متى تلزم موافقة أخلاقية رسمية.
  levels:
    awareness: |
      يمكنك:
      - شرح سبب حاجة البحث مع المرضى وموظفي الرعاية إلى الموافقة المستنيرة والحماية والعناية بالبيانات الشخصية
      - اتباع إجراءات الفريق للموافقة والحماية والتعامل مع البيانات في جلسات البحث
    working: |
      يمكنك:
      - التخطيط لجلسات بحث تحصل على الموافقة المستنيرة وتحمي عافية المشاركين وخصوصيتهم
      - تكييف الجلسات مع المرضى أو المتضايقين أو من هم في ظروف هشة، ومعرفة متى تتوقف
      - التعرف على مخاوف الحماية التي تظهر أثناء البحث والإبلاغ عنها
    practitioner: |
      يمكنك:
      - الحكم على متى يحتاج البحث إلى موافقة أخلاقية رسمية أو موافقة حوكمة البحث وإعداد ما يلزم لها
      - التخطيط لبحث آمن مع أشخاص في ظروف هشة، مثل الأطفال والمصابين بالخرف ومن يمرون بأزمة
      - التخطيط للبحث في البيئات السريرية دون تعطيل الرعاية، بالعمل مع القادة السريريين وموظفي الرعاية
      - دعم الباحثين في الحفاظ على عافيتهم بعد الجلسات المؤلمة
    expert: |
      يمكنك:
      - وضع معايير المؤسسة للبحث الأخلاقي مع المرضى ومقدمي الرعاية وموظفي الرعاية
      - ضمان ممارسات البحث في الفرق وتقديم المشورة بشأن البحث عالي المخاطر
      - تمثيل ممارسات البحث لدى هيئات الأخلاقيات والحماية والحوكمة
pd-safety-critical-design:
  name: التصميم من أجل السلامة السريرية والعوامل البشرية
  description: تصميم خدمات وواجهات ومسارات عمل تساعد الممارسين السريريين وموظفي الرعاية والمرضى على التصرف بأمان، من خلال تطبيق مبادئ العوامل البشرية والعمل ضمن عملية إدارة المخاطر السريرية.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف يمكن لخيارات التصميم أن تسبب أخطاء في الرعاية أو تمنعها، مثل أخطاء المريض الخطأ أو الجرعة الخطأ
      - استخدام أنماط المؤسسة للمعلومات الحرجة للسلامة، مثل شرائط هوية المريض وتحذيرات الحساسية
    working: |
      يمكنك:
      - تصميم واجهات تجعل التصرف الآمن هو التصرف الأسهل، مثلًا بتقليل التسميات الملتبسة والتنبيهات غير الضرورية
      - اختبار التصاميم في سيناريوهات سريرية واقعية، بما في ذلك المقاطعات وضغط الوقت
      - إبلاغ مسؤول السلامة السريرية بالمخاطر المرتبطة بالتصميم وتسجيل كيف تضبطها التصاميم
    practitioner: |
      يمكنك:
      - تطبيق أساليب العوامل البشرية، مثل تحليل المهام وتحليل أخطاء الاستخدام، على مسارات العمل السريرية المعقدة
      - التصميم لتقليل إرهاق التنبيهات والعبء الذهني في خدمة كاملة
      - تقديم أدلة التصميم لملفات السلامة السريرية وأدلة سهولة الاستخدام للبرمجيات الخاضعة للتنظيم
    expert: |
      يمكنك:
      - وضع معايير المؤسسة وأنماطها للتصميم الحرج للسلامة
      - قيادة أعمال العوامل البشرية في الخدمات السريرية الأعلى خطورة
      - تقديم المشورة لقادة السلامة السريرية والمنتجات بشأن المخاطر المرتبطة بالتصميم في المحفظة كلها
pd-health-content:
  name: محتوى المعلومات الصحية
  description: إنشاء محتوى للصحة والرعاية يكون دقيقًا ومضمونًا سريريًا وسهل الفهم والتطبيق على أشخاص بمستويات مختلفة من الثقافة الصحية.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يجب أن تكون المعلومات الصحية دقيقة وحديثة وسهلة الفهم
      - اتباع دليل الأسلوب لدى الفريق وعملية المراجعة السريرية للمحتوى الصحي
    working: |
      يمكنك:
      - كتابة محتوى صحي يستطيع ذوو الثقافة الصحية المحدودة فهمه والعمل به، مثل الأعراض ومتى يطلبون المساعدة
      - العمل مع المراجعين السريريين للتحقق من دقة المحتوى دون الإخلال بوضوحه
      - شرح المصطلحات الطبية بلغة واضحة وبسيطة واستخدام أسماء متسقة للحالات والفحوص والعلاجات
    practitioner: |
      يمكنك:
      - تصميم محتوى للموضوعات الحساسة وعالية المخاطر، مثل الأعراض العاجلة والأدوية ورعاية نهاية الحياة
      - إعداد الضمان السريري ومواعيد المراجعة ومصادر الأدلة لمجموعة من المحتوى الصحي
      - الموازنة بين الدقة السريرية والمتطلبات القانونية وفهم المستخدم في المحتوى الخلافي
    expert: |
      يمكنك:
      - وضع معايير المؤسسة لمحتوى المعلومات الصحية وضمانه السريري
      - قيادة استراتيجية المحتوى للمعلومات الصحية عبر الخدمات والقنوات
      - تقديم المشورة لكبار القادة السريريين وقادة الاتصال بشأن مخاطر المعلومات الصحية
