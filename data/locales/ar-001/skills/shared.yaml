# Arabic translations of data/skills/shared.yaml. Keys are the English skill ids.
health-care-context:
  name: فهم خدمات الصحة والرعاية
  description: فهم كيفية تنظيم خدمات الصحة والرعاية وتقديمها، وكيف يعمل الأطباء والممارسون السريريون وموظفو الرعاية، وكيف تدعم الخدمات الرقمية رعاية المرضى.
  levels:
    awareness: |
      يمكنك:
      - وصف الأجزاء الرئيسية لمنظومة الصحة والرعاية والخدمات التي تدعمها المؤسسة
      - شرح أهمية سلامة المرضى والسرية في عملك
    working: |
      يمكنك:
      - شرح مسارات العمل السريرية ومسارات الرعاية التي يدعمها عملك
      - استخدام المصطلحات الصحية الشائعة استخدامًا صحيحًا مع الزملاء السريريين وزملاء الرعاية
      - إدراك متى قد يؤثر تغيير ما في رعاية المرضى والتنبيه إليه
    practitioner: |
      يمكنك:
      - تحليل موقع خدمة ما ضمن مسارات الرعاية بين المؤسسات
      - العمل مع الممارسين السريريين وموظفي الرعاية والمرضى لتشكيل الخدمات الرقمية
      - شرح أثر القرارات الرقمية في الرعاية والسلامة وعبء العمل على الموظفين
    expert: |
      يمكنك:
      - تشكيل استراتيجية المؤسسة بالاستناد إلى فهم عميق لمنظومة الصحة والرعاية
      - تمثيل المؤسسة لدى شركاء الصحة والرعاية وقادتها
      - توقّع أثر تغييرات السياسات والخدمات في الخدمات الرقمية والرعاية
clinical-safety:
  name: إدارة المخاطر السريرية
  description: تحديد المخاطر التي قد تشكلها أنظمة تقنية المعلومات الصحية على المرضى وتقييمها والسيطرة عليها، من خلال عملية لإدارة المخاطر السريرية وسجلات المخاطر وملفات السلامة (مثلًا وفق ISO 14971 وIEC 80001-1).
  levels:
    awareness: |
      يمكنك:
      - شرح كيف قد تضر أنظمة تقنية المعلومات الصحية بالمرضى، مثلًا من خلال معلومات خاطئة أو ناقصة أو متأخرة
      - الإبلاغ عن مشكلة محتملة في السلامة السريرية عبر القناة الصحيحة
    working: |
      يمكنك:
      - المشاركة في ورش تحديد المخاطر والإسهام في سجل المخاطر
      - اتباع عملية إدارة المخاطر السريرية في عملك
      - تقديم أدلة لملف السلامة السريرية، مثل نتائج الاختبارات
    practitioner: |
      يمكنك:
      - قيادة تحديد المخاطر وتقييمها لمنتج أو تغيير
      - كتابة سجلات المخاطر وتقارير ملفات السلامة السريرية وتحديثها
      - الاتفاق مع فرق المنتجات على ضوابط المخاطر والتحقق من فعاليتها
      - تقديم المشورة للفرق بشأن تطبيق معايير إدارة المخاطر السريرية
    expert: |
      يمكنك:
      - تولّي نظام إدارة المخاطر السريرية في المؤسسة
      - وضع سياسة السلامة السريرية وضمان ملفات السلامة للأنظمة الرئيسية
      - قيادة الاستجابة لحوادث السلامة الخطيرة المتعلقة بتقنية المعلومات الصحية
      - بناء ثقافة للسلامة السريرية في الفرق الرقمية
health-data-interoperability:
  name: التشغيل البيني للبيانات الصحية
  description: تبادل بيانات الصحة والرعاية بين الأنظمة بأمان واتساق باستخدام معايير مفتوحة مثل HL7 FHIR وHL7 الإصدار 2 وملفات IHE وواجهات برمجة التطبيقات القياسية.
  levels:
    awareness: |
      يمكنك:
      - شرح أهمية التشغيل البيني للرعاية المتكاملة
      - تسمية المعايير الرئيسية لتبادل البيانات الصحية، مثل HL7 FHIR
    working: |
      يمكنك:
      - قراءة موارد FHIR وملفاتها التعريفية وواجهاتها البرمجية واستخدامها
      - بناء عمليات تكامل بسيطة أو اختبارها بتوجيه
      - التحقق من الرسائل مقابل مواصفة
    practitioner: |
      يمكنك:
      - تصميم عمليات تكامل وبناؤها باستخدام FHIR وHL7 الإصدار 2 وأنماط المراسلة
      - كتابة موارد FHIR وتعريف ملفاتها وأدلة تطبيقها
      - حل مشكلات الربط وجودة البيانات المعقدة بين الأنظمة
    expert: |
      يمكنك:
      - وضع معايير التشغيل البيني واستراتيجيته للمؤسسة
      - قيادة أعمال المعايير على المستوى الوطني أو بين المؤسسات
      - ضمان تصميم عمليات التكامل الحرجة عبر أنظمة كثيرة
clinical-terminology:
  name: المصطلحات والتصنيفات السريرية
  description: استخدام المصطلحات والتصنيفات السريرية، مثل SNOMED CT وICD وLOINC، لتسجيل المعنى السريري وتبادله باتساق.
  levels:
    awareness: |
      يمكنك:
      - شرح الفرق بين المصطلحات السريرية والتصنيف
      - التعرف على المصطلحات الشائعة مثل SNOMED CT وICD
    working: |
      يمكنك:
      - إيجاد الرموز الصحيحة لعنصر بيانات أو نموذج واستخدامها
      - استخدام متصفحات المصطلحات والمجموعات المرجعية
    practitioner: |
      يمكنك:
      - تصميم نماذج البيانات والمجموعات المرجعية باستخدام المصطلحات السريرية
      - الربط بين المصطلحات والتصنيفات، وشرح حدود الربط
      - تقديم المشورة للفرق بشأن استخدام المصطلحات في المنتجات والتحليلات
    expert: |
      يمكنك:
      - وضع سياسة المصطلحات للمؤسسة
      - قيادة إصدارات المصطلحات وحوكمتها وضمان جودتها
      - تمثيل المؤسسة في هيئات معايير المصطلحات
information-governance:
  name: حوكمة المعلومات وحماية البيانات
  description: التعامل مع المعلومات الشخصية والصحية بطريقة قانونية وآمنة وأخلاقية، بما في ذلك قوانين حماية البيانات والسرية والموافقة وتقييمات أثر حماية البيانات وتبادل المعلومات.
  levels:
    awareness: |
      يمكنك:
      - اتباع قواعد المؤسسة في التعامل مع المعلومات الشخصية والصحية
      - التعرف على خرق للبيانات أو حادث كاد أن يقع والإبلاغ عنه
    working: |
      يمكنك:
      - تطبيق مبادئ حماية البيانات في عملك
      - الإسهام في تقييمات أثر حماية البيانات
      - التعامل مع طلبات المعلومات والسجلات بشكل صحيح
    practitioner: |
      يمكنك:
      - قيادة تقييمات أثر حماية البيانات واتفاقيات تبادل المعلومات
      - تقديم المشورة للفرق بشأن الأساس القانوني والموافقة والسرية ومدد الاحتفاظ
      - التحقيق في الحوادث والتوصية بالتحسينات
    expert: |
      يمكنك:
      - وضع سياسة حوكمة المعلومات واستراتيجيتها
      - تقديم المشورة لمجلس الإدارة بشأن مخاطر المعلومات والامتثال
      - تمثيل المؤسسة لدى الجهات التنظيمية والشركاء
medical-device-regulation:
  name: تنظيم البرمجيات بوصفها أجهزة طبية
  description: فهم متى تُعدّ البرمجيات جهازًا طبيًا، والمعايير والعمليات التي تنطبق عليها، مثل IEC 62304 وISO 13485.
  levels:
    awareness: |
      يمكنك:
      - شرح أن بعض البرمجيات الصحية تُنظَّم بوصفها أجهزة طبية
      - معرفة من تسأل عندما قد يكون منتج ما جهازًا طبيًا
    working: |
      يمكنك:
      - اتباع عملية لدورة حياة البرمجيات تستوفي معايير الأجهزة الطبية
      - إعداد السجلات التي تتطلبها تلك العملية
    practitioner: |
      يمكنك:
      - تقييم ما إذا كان منتج ما جهازًا طبيًا، وفئته المرجّحة
      - التخطيط للعمل التنظيمي لمنتج ما مع زملاء الجودة والزملاء السريريين
    expert: |
      يمكنك:
      - وضع نهج المؤسسة تجاه البرمجيات الخاضعة للتنظيم
      - قيادة التواصل مع الجهات التنظيمية والهيئات المُخطَرة
people-management:
  name: إدارة الأفراد
  description: قيادة الموظفين وتطويرهم ودعمهم، بما في ذلك التوظيف والأهداف وتقييم الأداء والرفاه والحضور، وإدارة الأداء والسلوك بإنصاف.
  levels:
    awareness: |
      يمكنك:
      - شرح سياسات الموارد البشرية في المؤسسة التي تخصك
      - دعم الزملاء الجدد ومشاركة المعرفة
    working: |
      يمكنك:
      - الإشراف على العمل اليومي وتقديم الملاحظات
      - المشاركة في التوظيف والتعريف بالعمل
      - إجراء محادثات فردية منتظمة
    practitioner: |
      يمكنك:
      - الإدارة المباشرة لفريق، ووضع الأهداف وإجراء تقييمات الأداء
      - دعم الرفاه وإدارة الحضور والأداء والسلوك
      - التخطيط لتطوير الفريق وتعاقب أفراده
    expert: |
      يمكنك:
      - قيادة المديرين وتشكيل ثقافة مجال كبير
      - تصميم خطط القوى العاملة والتغيير المؤسسي
      - توجيه القادة وحل قضايا الأفراد المعقدة
equality-diversity-inclusion:
  name: المساواة والتنوع والشمول
  description: معاملة الناس بإنصاف، وتقدير الاختلاف، وتصميم خدمات وبيئات عمل تشمل الجميع.
  levels:
    awareness: |
      يمكنك:
      - معاملة الزملاء والمرضى والجمهور بكرامة واحترام
      - اتباع سياسات المساواة والشمول
    working: |
      يمكنك:
      - التعرف على السلوك الذي يُقصي الآخرين والتصدي له
      - مراعاة الاحتياجات المختلفة عند التخطيط لعملك
    practitioner: |
      يمكنك:
      - إجراء تقييمات أثر المساواة
      - بناء فرق وممارسات شاملة
    expert: |
      يمكنك:
      - وضع استراتيجية الشمول ومساءلة المؤسسة عنها
      - قيادة تغيير الثقافة في مجال المساواة والتنوع والشمول
health-safety-wellbeing:
  name: الصحة والسلامة والرفاه
  description: الحفاظ على سلامتك وسلامة الآخرين وعافيتهم في العمل، بما في ذلك تقييم المخاطر وممارسات العمل الآمنة والإبلاغ عن الحوادث.
  levels:
    awareness: |
      يمكنك:
      - اتباع قواعد الصحة والسلامة والإبلاغ عن المخاطر والحوادث
    working: |
      يمكنك:
      - إجراء تقييمات بسيطة للمخاطر، مثل تقييم محطات العمل
      - مساعدة الزملاء على العمل بأمان
    practitioner: |
      يمكنك:
      - إدارة الصحة والسلامة لفريق أو موقع
      - التحقيق في الحوادث ووضع الضوابط
    expert: |
      يمكنك:
      - وضع سياسة الصحة والسلامة والرفاه للمؤسسة
      - رفع التقارير عن أداء السلامة إلى مجلس الإدارة
budget-management:
  name: إدارة الميزانية
  description: تخطيط الميزانية ومراقبتها وضبطها، بما في ذلك التنبؤ وإدارة الانحرافات واتباع القواعد المالية.
  levels:
    awareness: |
      يمكنك:
      - اتباع قواعد الإنفاق والطلب
      - شرح كيفية تمويل عملك
    working: |
      يمكنك:
      - تتبع الإنفاق مقابل ميزانية صغيرة والتنبيه إلى الانحرافات
      - اعتماد الإنفاق ضمن حدود صلاحيتك
    practitioner: |
      يمكنك:
      - تولّي ميزانية وإدارتها، مع التنبؤ وشرح الانحرافات
      - إعداد دراسة جدوى تتضمن التكاليف والفوائد
    expert: |
      يمكنك:
      - إدارة ميزانيات كبيرة أو متعددة ووضع الخطط المالية
      - الموازنة بين أولويات التمويل عبر الخدمات
project-management:
  name: إدارة المشاريع
  description: تخطيط المشاريع وتنفيذها وإغلاقها وفق النطاق والوقت والتكلفة والجودة المتفق عليها، باستخدام منهجية معترف بها مثل PRINCE2 أو PM² أو المناهج الرشيقة.
  levels:
    awareness: |
      يمكنك:
      - شرح مراحل المشروع والأدوار الرئيسية فيه
      - الاحتفاظ بسجلات المشروع مثل سجلات الإجراءات
    working: |
      يمكنك:
      - تحديث الخطط وسجلات المخاطر والمشكلات والتقارير
      - إدارة اجتماعات المشروع وتتبع الإجراءات
      - إدارة مشروع صغير محدد المعالم بدعم
    practitioner: |
      يمكنك:
      - إدارة المشاريع من بدايتها إلى إغلاقها، مع ضبط النطاق والوقت والتكلفة والجودة
      - إدارة المخاطر والمشكلات والاعتماديات وضبط التغيير
      - رفع التقارير إلى مجالس المشاريع وإدارة الموردين
    expert: |
      يمكنك:
      - إدارة مشاريع كبيرة أو معقدة أو عالية المخاطر
      - وضع معايير إدارة المشاريع وتوجيه مديري المشاريع
      - إنقاذ المشاريع المتعثرة
risk-management:
  name: إدارة المخاطر المؤسسية
  description: تحديد المخاطر التي تهدد أهداف المؤسسة وتقييمها وتسجيلها وإدارتها، باستخدام سجل للمخاطر ومستوى محدد لتقبّل المخاطر.
  levels:
    awareness: |
      يمكنك:
      - شرح ما هو الخطر وكيفية الإبلاغ عنه
    working: |
      يمكنك:
      - تسجيل المخاطر في مجالك وتحديثها
      - اقتراح الضوابط وتتبع الإجراءات
    practitioner: |
      يمكنك:
      - إدارة عملية المخاطر لمديرية أو برنامج
      - تقييم المخاطر مقابل مستوى تقبّل المخاطر وتصعيدها
      - رفع التقارير عن المخاطر إلى اللجان
    expert: |
      يمكنك:
      - تصميم إطار إدارة المخاطر في المؤسسة ومستوى تقبّلها للمخاطر
      - تقديم المشورة لمجلس الإدارة بشأن المخاطر الاستراتيجية
security-operations:
  name: عمليات الأمن
  description: مراقبة الأنظمة بحثًا عن التهديدات الأمنية، وفرز التنبيهات، والتحقيق في الأحداث، والاستجابة للحوادث السيبرانية، باستخدام أدوات مثل SIEM وكشف التهديدات على الأجهزة الطرفية.
  levels:
    awareness: |
      يمكنك:
      - شرح التهديدات السيبرانية الشائعة مثل التصيّد الاحتيالي وبرمجيات الفدية
      - الإبلاغ عن حدث أمني مشتبه به
    working: |
      يمكنك:
      - مراقبة التنبيهات وفرزها باستخدام أدلة التشغيل
      - جمع الأدلة وتصعيد الأحداث
      - ضبط قواعد كشف بسيطة بتوجيه
    practitioner: |
      يمكنك:
      - التحقيق في الحوادث الأمنية واحتواؤها
      - كتابة قواعد الكشف وعمليات البحث عن التهديدات
      - تحسين أدلة التشغيل والأدوات بعد الحوادث
    expert: |
      يمكنك:
      - قيادة خدمة عمليات الأمن واستراتيجيتها
      - قيادة الاستجابة للحوادث السيبرانية الكبرى
      - العمل مع وكالات الأمن الوطنية والشركاء
vulnerability-management:
  name: إدارة الثغرات
  description: اكتشاف الثغرات التقنية وتقييمها وترتيب أولوياتها وإصلاحها، بما في ذلك الفحص واختبار الاختراق وتطبيق التحديثات الأمنية.
  levels:
    awareness: |
      يمكنك:
      - شرح أهمية تطبيق التحديثات الأمنية سريعًا والإعدادات الآمنة
    working: |
      يمكنك:
      - إجراء فحوص الثغرات والإبلاغ عن النتائج
      - تتبع الإصلاحات مع مالكي الأنظمة
    practitioner: |
      يمكنك:
      - ترتيب أولويات الثغرات حسب المخاطر، بما في ذلك المخاطر على خدمات المرضى
      - تحديد نطاق اختبارات الاختراق والمعالجة وإدارتها
    expert: |
      يمكنك:
      - وضع سياسة إدارة الثغرات وأهدافها
      - رفع التقارير عن المخاطر الأمنية التقنية إلى كبار القادة
identity-and-access-management:
  name: إدارة الهوية والوصول
  description: إدارة الهويات الرقمية والمصادقة وصلاحيات الوصول للموظفين والمرضى والأنظمة، بما في ذلك الوصول القائم على الأدوار والمصادقة بالبطاقة الذكية أو المصادقة متعددة العوامل.
  levels:
    awareness: |
      يمكنك:
      - اتباع قواعد الوصول وحماية بيانات اعتمادك
    working: |
      يمكنك:
      - إنشاء حسابات المستخدمين وصلاحيات الوصول وتعديلها وإزالتها
      - التحقق من الوصول مقابل قواعد الوصول القائمة على الأدوار
    practitioner: |
      يمكنك:
      - تصميم خدمات الهوية والوصول وتشغيلها
      - مراجعة الوصول بانتظام وإصلاح المشكلات
    expert: |
      يمكنك:
      - وضع استراتيجية الهوية والوصول للموظفين والمرضى والأنظمة
      - قيادة اعتماد معايير الهوية الجديدة
data-quality:
  name: إدارة جودة البيانات
  description: تحديد جودة البيانات وقياسها وتحسينها، بما في ذلك اكتمالها ودقتها وحداثتها وصلاحيتها.
  levels:
    awareness: |
      يمكنك:
      - شرح أهمية دقة البيانات الصحية للرعاية والتخطيط
      - تسجيل البيانات بدقة والإبلاغ عن الأخطاء
    working: |
      يمكنك:
      - إجراء فحوص جودة البيانات وتصحيح الأخطاء
      - شرح تقارير جودة البيانات للزملاء
    practitioner: |
      يمكنك:
      - تحديد قواعد جودة البيانات ومقاييسها
      - العمل مع مزوّدي البيانات لمعالجة الأسباب الجذرية لضعف الجودة
    expert: |
      يمكنك:
      - وضع معايير جودة البيانات للمؤسسة وشركائها
      - قيادة برامج تحسين جودة البيانات
health-records-management:
  name: إدارة السجلات الصحية
  description: إدارة سجلات الصحة والرعاية طوال دورة حياتها، بما في ذلك إنشاؤها وحفظها وتتبعها والوصول إليها والاحتفاظ بها والتخلص منها.
  levels:
    awareness: |
      يمكنك:
      - حفظ السجلات وإيجادها وتتبعها بشكل صحيح
      - حماية السجلات من الفقدان أو الوصول غير المصرح به
    working: |
      يمكنك:
      - معالجة طلبات الوصول إلى السجلات
      - تطبيق جداول الاحتفاظ ومعايير حفظ السجلات
    practitioner: |
      يمكنك:
      - إدارة خدمة سجلات وإجراءاتها
      - تدقيق حفظ السجلات وتدريب الموظفين
    expert: |
      يمكنك:
      - وضع سياسة إدارة السجلات واستراتيجيتها
      - قيادة الانتقال من السجلات الورقية إلى السجلات الرقمية
clinical-coding:
  name: الترميز السريري
  description: تحويل المعلومات السريرية من السجلات الصحية إلى رموز تصنيف قياسية، وفق قواعد الترميز الوطنية والدولية، لأغراض الرعاية والدفع والإحصاءات.
  levels:
    awareness: |
      يمكنك:
      - شرح ما هو الترميز السريري وسبب أهميته
      - استخدام المصطلحات الطبية الأساسية وعلم التشريح
    working: |
      يمكنك:
      - ترميز الحالات البسيطة بدقة، باستخدام قواعد التصنيف
      - الاستفسار من الممارسين السريريين عن السجلات غير الواضحة
    practitioner: |
      يمكنك:
      - ترميز الحالات المعقدة عبر التخصصات
      - تدقيق جودة الترميز وتدريب المرمّزين
    expert: |
      يمكنك:
      - قيادة خدمة ترميز وبرنامج الجودة فيها
      - تقديم المشورة بشأن معايير الترميز وأثرها في البيانات والتمويل
clinical-leadership-in-digital:
  name: القيادة السريرية في المجال الرقمي
  description: إضفاء المعرفة والمصداقية السريرية على تصميم الخدمات الرقمية واعتمادها واستخدامها الآمن، وقيادة الممارسين السريريين خلال التغيير الرقمي.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف تغيّر الخدمات الرقمية الممارسة السريرية
    working: |
      يمكنك:
      - تقديم المدخلات السريرية لفرق المنتجات بشأن مسارات العمل والسلامة
      - مساعدة الزملاء السريريين على اعتماد الأنظمة الجديدة
    practitioner: |
      يمكنك:
      - قيادة المشاركة السريرية لمنتج أو برنامج
      - تحويل الاحتياجات والأدلة السريرية إلى متطلبات
      - مناصرة الاعتماد الآمن بين الأقران السريريين
    expert: |
      يمكنك:
      - تحديد التوجه السريري للخدمات الرقمية في المؤسسة
      - قيادة القادة السريريين عبر المؤسسات خلال التغيير الرقمي
      - تقديم المشورة لمجلس الإدارة بشأن المخاطر والفوائد السريرية للاستثمار الرقمي
governance-and-compliance:
  name: الحوكمة المؤسسية والامتثال
  description: دعم حوكمة المؤسسة — المجالس واللجان والأنظمة الداخلية والسياسات وإقرارات تضارب المصالح والامتثال للواجبات القانونية والتنظيمية.
  levels:
    awareness: |
      يمكنك:
      - اتباع سياسات المؤسسة وقواعد اتخاذ القرار فيها
    working: |
      يمكنك:
      - دعم اجتماعات اللجان وأوراقها ومحاضرها
      - تحديث سجلات الحوكمة باستمرار
    practitioner: |
      يمكنك:
      - إدارة دورة الحوكمة للمجالس واللجان
      - مراجعة السياسات وتقديم المشورة بشأن الامتثال
    expert: |
      يمكنك:
      - تصميم إطار الحوكمة وتقديم المشورة لمجلس الإدارة
      - قيادة إعداد تقارير الحوكمة السنوية والضمان
