# Arabic translations of data/skills/clinical-ig.yaml. Keys are the English skill ids.
clin-clinical-systems-optimisation:
  name: تصميم الأنظمة السريرية وتحسينها
  description: تصميم الأنظمة السريرية وإعدادها وتحسينها، مثل السجلات الصحية الإلكترونية وأنظمة الطلبات والوصف الإلكتروني للأدوية، بحيث تلائم مسارات العمل السريرية وتدعم رعاية آمنة وفعالة.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف تدعم الأنظمة السريرية، مثل السجلات الصحية الإلكترونية، الرعاية
      - وصف مسارات العمل السريرية التي يدعمها النظام
    working: |
      يمكنك:
      - رسم مسارات العمل السريرية الحالية والمستقبلية مع الممارسين السريريين وموظفي الرعاية
      - اختبار إعدادات النظام مقابل سيناريوهات سريرية
      - كتابة متطلبات سريرية واضحة لفرق المنتجات
    practitioner: |
      يمكنك:
      - قيادة التصميم السريري لإعدادات النظام والنماذج ومجموعات الطلبات ودعم القرار
      - استخدام البيانات وملاحظات المستخدمين لاكتشاف مشكلات مسارات العمل وإصلاحها
      - الموازنة بين الحاجة السريرية والسلامة وسهولة الاستخدام وقيود النظام
    expert: |
      يمكنك:
      - وضع مبادئ التصميم ومعاييره للأنظمة السريرية على مستوى المؤسسة
      - قيادة برامج تحسين تُحسّن الرعاية وتجربة الموظفين تحسينًا قابلًا للقياس
      - تقديم المشورة لكبار القادة بشأن خيارات الأنظمة السريرية وأثرها في الرعاية
clin-human-factors:
  name: العوامل البشرية وسهولة الاستخدام في الأنظمة السريرية
  description: تطبيق أساليب العوامل البشرية وسهولة الاستخدام على الأنظمة السريرية، حتى يتمكن الممارسون السريريون وموظفو الرعاية والمرضى من استخدامها بأمان وبأقل قدر ممكن من الأخطاء.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف يمكن أن يؤدي التصميم الضعيف إلى أخطاء في الرعاية
      - الإبلاغ عن مشكلات سهولة الاستخدام التي قد تؤثر في سلامة المرضى
    working: |
      يمكنك:
      - المشاركة في اختبارات سهولة الاستخدام ومحاكاة المهام السريرية
      - رصد مخاطر التصميم الشائعة، مثل الخيارات المتشابهة في الشكل أو التنبيهات المخفية
    practitioner: |
      يمكنك:
      - التخطيط لتقييمات العوامل البشرية للأنظمة السريرية وإجراؤها
      - تحويل النتائج إلى تغييرات في التصميم وضوابط للسلامة السريرية
      - تقييم عبء التنبيهات وخطر الحلول الالتفافية
    expert: |
      يمكنك:
      - وضع نهج المؤسسة تجاه العوامل البشرية في الخدمات الرقمية
      - مراجعة أدلة العوامل البشرية للأنظمة والتغييرات عالية المخاطر
      - بناء مهارات العوامل البشرية في الفرق السريرية والرقمية
clin-digital-health-evaluation:
  name: تقييم الصحة الرقمية وفوائدها
  description: التخطيط لتقييمات تقنيات الصحة الرقمية وإجراؤها، وقياس فوائدها السريرية وفوائدها للسلامة والخدمة باستخدام أساليب وأدلة سليمة.
  levels:
    awareness: |
      يمكنك:
      - شرح سبب حاجة تقنيات الصحة الرقمية إلى أدلة على فائدتها وسلامتها
      - إيجاد الأدلة المنشورة عن تقنية ما
    working: |
      يمكنك:
      - جمع البيانات الأساسية وبيانات المتابعة لتقييم ما
      - إجراء عمليات تدقيق سريري لاستخدام الأنظمة
      - تلخيص نتائج التقييم للزملاء
    practitioner: |
      يمكنك:
      - تصميم التقييمات وخطط الفوائد لمنتجات الصحة الرقمية
      - اختيار مقاييس مناسبة للنتائج السريرية والسلامة والتجربة
      - الحكم على قوة الأدلة وشرح حدودها
    expert: |
      يمكنك:
      - وضع نهج المؤسسة تجاه تقييم الصحة الرقمية
      - قيادة برامج البحث والتقييم مع الشركاء الأكاديميين وشركاء الرعاية
      - استخدام الأدلة لتقديم المشورة لمجلس الإدارة بشأن الاستثمار الرقمي
clin-professional-practice:
  name: الممارسة السريرية المرخّصة في المجال الرقمي
  description: إضفاء معرفة سريرية حديثة ومرخّصة وتقدير سريري على العمل الرقمي، مع الوفاء بمعايير المهنة السريرية وأخلاقياتها وواجبات تجديد الترخيص.
  levels:
    awareness: |
      يمكنك:
      - شرح المعايير المهنية التي تنطبق على الممارس السريري المرخّص
      - إدراك متى يحتاج سؤال ما إلى رأي سريري
    working: |
      يمكنك:
      - تطبيق معرفتك السريرية على العمل الرقمي ضمن نطاق ممارستك
      - الحفاظ على تسجيلك المهني وتطويرك المهني المستمر
      - تقديم آراء سريرية بشأن مسارات العمل والمحتوى والسلامة
    practitioner: |
      يمكنك:
      - إصدار أحكام سريرية سليمة بشأن أثر الخدمات الرقمية في الرعاية
      - التصدي بثقة للممارسات غير الآمنة، في البيئات الرقمية أو السريرية
      - دعم الممارسين السريريين الآخرين في تطبيق معاييرهم المهنية على العمل الرقمي
    expert: |
      يمكنك:
      - قيادة المعايير المهنية السريرية للعمل الرقمي في المؤسسة
      - أن تكون صوتًا سريريًا رفيعًا في القرارات المتعلقة بسلامة المرضى ورعايتهم
      - دعم تجديد ترخيص الممارسين السريريين في الأدوار الرقمية وتطويرهم المهني
ig-information-rights-requests:
  name: طلبات الحق في المعلومات
  description: التعامل مع طلبات الأفراد والجمهور للوصول إلى المعلومات، مثل طلبات الاطلاع على السجلات الصحية الشخصية وطلبات المعلومات التي تحتفظ بها المؤسسة، ضمن المهل القانونية.
  levels:
    awareness: |
      يمكنك:
      - التعرف على طلب للحق في المعلومات وإحالته سريعًا
      - شرح أن للطلبات مهلًا قانونية
    working: |
      يمكنك:
      - تسجيل الطلبات والإقرار باستلامها وتتبعها للالتزام بالمهل
      - جمع المعلومات وحجب ما يلزم منها، وإعداد مسودات الردود للمراجعة
      - التحقق من هوية مقدم الطلب وصفته
    practitioner: |
      يمكنك:
      - التعامل مع الطلبات المعقدة أو الحساسة، بما فيها تلك التي تشمل أطرافًا ثالثة
      - تطبيق الاستثناءات وتقرير ما يُحجب، مع أسباب واضحة
      - إدارة المراجعات الداخلية والشكاوى المتعلقة بالردود
    expert: |
      يمكنك:
      - وضع سياسة الحق في المعلومات وعمليتها على مستوى المؤسسة
      - قيادة الاستجابة لاستفسارات الجهات التنظيمية والطعون
      - رفع التقارير عن الأداء والاتجاهات إلى كبار القادة
ig-records-retention:
  name: الاحتفاظ بالسجلات والتخلص منها
  description: تطبيق جداول الاحتفاظ على السجلات الورقية والرقمية، وأرشفتها أو إتلافها بأمان في الوقت المناسب، مع سجل تدقيق.
  levels:
    awareness: |
      يمكنك:
      - شرح سبب الاحتفاظ بالسجلات لمدد محددة ثم إتلافها أو أرشفتها
      - اتباع إجراءات حفظ السجلات ونقلها
    working: |
      يمكنك:
      - تطبيق جدول الاحتفاظ على السجلات وتحديد تلك المستحقة للمراجعة
      - تجهيز السجلات للأرشفة أو الإتلاف الآمن، والاحتفاظ بسجل التدقيق
    practitioner: |
      يمكنك:
      - إدارة برنامج الاحتفاظ والتخلص لخدمة سجلات
      - تقديم المشورة للفرق بشأن الاحتفاظ بأنواع جديدة من السجلات، بما فيها السجلات الرقمية
      - تدقيق الامتثال لجداول الاحتفاظ
    expert: |
      يمكنك:
      - وضع سياسة الاحتفاظ وجدوله للمؤسسة
      - التخطيط للحفظ طويل الأمد للسجلات الرقمية
      - حل مسائل الاحتفاظ المعقدة، مثل التجميد القانوني والتحقيقات
ig-data-protection-impact-assessment:
  name: تقييم أثر حماية البيانات
  description: تقييم مخاطر الخصوصية في المعالجة الجديدة أو المعدّلة للبيانات الشخصية والصحية، والاتفاق على الضوابط قبل بدء المعالجة.
  levels:
    awareness: |
      يمكنك:
      - شرح متى يلزم تقييم أثر حماية البيانات
      - إكمال استبيان فرز أولي لعملك
    working: |
      يمكنك:
      - مساعدة فرق المشاريع على إكمال تقييمات أثر حماية البيانات
      - وصف تدفقات البيانات وتحديد الأساس القانوني للمعالجة
      - تسجيل مخاطر الخصوصية والضوابط المقترحة
    practitioner: |
      يمكنك:
      - مراجعة تقييمات أثر حماية البيانات للأنظمة المعقدة وتقديم المشورة بشأنها
      - الحكم على مدى قبول المخاطر والتوصية بالضوابط
      - تقرير متى تُصعَّد المخاطر العالية لمراجعة كبار المسؤولين أو الجهة التنظيمية
    expert: |
      يمكنك:
      - وضع عملية تقييم أثر حماية البيانات ومعاييره في المؤسسة
      - تقديم المشورة النهائية بشأن المعالجة الأعلى خطورة، مثل تبادل البيانات واسع النطاق أو الذكاء الاصطناعي
      - استشارة الجهات التنظيمية حيث يقتضي القانون ذلك
ig-incident-management:
  name: إدارة حوادث حوكمة المعلومات
  description: تسجيل خروقات البيانات والحوادث التي كادت أن تقع والتحقيق فيها والتعلم منها، وتقرير متى يُبلَّغ المنظمون والأشخاص المتأثرون.
  levels:
    awareness: |
      يمكنك:
      - التعرف على خرق للبيانات أو حادث كاد أن يقع والإبلاغ عنه فورًا
    working: |
      يمكنك:
      - تسجيل الحوادث وجمع الوقائع
      - تقييم الحوادث وفق معايير الخطورة في المؤسسة
      - تتبع الإجراءات حتى إغلاقها
    practitioner: |
      يمكنك:
      - التحقيق في الحوادث الخطيرة وتحديد أسبابها الجذرية
      - تقرير ما إذا كان يجب إبلاغ الجهات التنظيمية والأشخاص المتأثرين، بالتعاون مع كبار الزملاء
      - مشاركة الدروس المستفادة وتتبع التحسينات
    expert: |
      يمكنك:
      - وضع عملية إدارة الحوادث لحوكمة المعلومات
      - قيادة الاستجابة للخروقات الكبرى، بما في ذلك مع الجهات التنظيمية ووسائل الإعلام
      - رفع التقارير عن اتجاهات الحوادث ومخاطرها إلى مجلس الإدارة
ig-confidentiality-and-sharing:
  name: السرية وتبادل المعلومات
  description: حماية معلومات المرضى السرية مع ضمان مشاركتها بشكل قانوني حين تقتضي ذلك الرعاية أو السلامة أو القانون، بما في ذلك من خلال اتفاقيات تبادل المعلومات.
  levels:
    awareness: |
      يمكنك:
      - الحفاظ على المعلومات السرية ومشاركتها فقط حين يُسمح لك بذلك
      - طلب المشورة حين لا تكون متأكدًا
    working: |
      يمكنك:
      - التحقق من أن طلب مشاركة المعلومات يتوافق مع السياسة
      - الاحتفاظ بسجلات لما شورك ومع من ولماذا
      - إعداد مسودات اتفاقيات بسيطة لتبادل المعلومات
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن مسائل السرية المعقدة، مثل المشاركة دون موافقة للمصلحة العامة
      - مراجعة اتفاقيات تبادل المعلومات مع المؤسسات الشريكة
      - تطبيق قواعد الموافقة واعتراض المرضى على تدفقات البيانات
    expert: |
      يمكنك:
      - العمل بصفة المستشار الأول للمؤسسة في شؤون السرية
      - حسم أصعب قرارات الإفصاح
      - وضع إطار مشاركة المعلومات مع الشركاء
ig-compliance-assurance:
  name: ضمان حوكمة المعلومات وتدقيقها
  description: التحقق من أن المؤسسة تستوفي معايير حوكمة المعلومات وإثبات ذلك، من خلال التقييمات الذاتية السنوية وعمليات التدقيق والأدلة وخطط التحسين.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يجب على المؤسسة أن تُثبت حسن تعاملها مع المعلومات
      - تقديم الأدلة لعملية تدقيق عند الطلب
    working: |
      يمكنك:
      - جمع الأدلة للتقييم الذاتي السنوي وتنظيمها
      - إجراء عمليات تدقيق بسيطة، مثل تدقيق الوصول أو حفظ السجلات
      - تتبع إجراءات التحسين
    practitioner: |
      يمكنك:
      - التخطيط لبرنامج ضمان حوكمة المعلومات وإدارته
      - الحكم على مدى استيفاء الأدلة للمعيار وتحديد الثغرات
      - العمل مع المدققين الداخليين والخارجيين
    expert: |
      يمكنك:
      - تولّي إطار ضمان حوكمة المعلومات في المؤسسة
      - رفع التقارير عن الضمان والامتثال إلى مجلس الإدارة ولجانه
      - تحديد أولويات التحسين بناءً على المخاطر
