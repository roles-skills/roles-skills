# Arabic translations of data/skills/corporate-services.yaml. Keys are the English skill ids.
corp-administration:
  name: الإدارة المكتبية
  description: تشغيل العمليات الإدارية التي تُبقي فريقًا أو خدمة في حالة عمل، مثل الحفظ والطلبات وإدخال البيانات والسجلات واتباع الإجراءات المكتبية.
  levels:
    awareness: |
      يمكنك:
      - اتباع الإجراءات المكتبية للحفظ والطلبات وإدخال البيانات
      - الاحتفاظ بسجلات دقيقة لعملك
    working: |
      يمكنك:
      - تشغيل طيف من العمليات الإدارية لفريق بقليل من الإشراف
      - رصد الأخطاء في السجلات والبيانات وتصحيحها
      - اقتراح طرق عمل أبسط
    practitioner: |
      يمكنك:
      - تنظيم الدعم الإداري لخدمة أو مديرية
      - كتابة الإجراءات الإدارية وتحسينها
      - تدريب الموظفين الإداريين الآخرين ومراجعة عملهم
    expert: |
      يمكنك:
      - تصميم الخدمات الإدارية على مستوى المؤسسة
      - قيادة الانتقال إلى عمليات إدارية أبسط ورقمية
corp-office-software:
  name: الأدوات المكتبية الرقمية
  description: استخدام معالجة النصوص وجداول البيانات والعروض التقديمية والبريد الإلكتروني والمستندات المشتركة وأدوات التعاون بسرعة ودقة.
  levels:
    awareness: |
      يمكنك:
      - إنشاء المستندات والرسائل الإلكترونية وجداول البيانات البسيطة وتحريرها
      - حفظ الملفات ومشاركتها في المكان الصحيح
    working: |
      يمكنك:
      - إعداد مستندات وعروض تقديمية جيدة التنسيق بسرعة ودقة
      - استخدام جداول البيانات لفرز البيانات وتصفيتها وتلخيصها
      - استخدام أدوات التعاون لإدارة المستندات المشتركة وإصداراتها
    practitioner: |
      يمكنك:
      - بناء النماذج وجداول المتابعة ومسارات العمل المؤتمتة البسيطة
      - جعل المستندات في متناول الجميع
      - مساعدة الزملاء على الاستفادة القصوى من الأدوات المكتبية
    expert: |
      يمكنك:
      - وضع معايير النماذج وإدارة المستندات وأدوات التعاون
      - قيادة اعتماد الأدوات المكتبية الجديدة على مستوى المؤسسة
corp-diary-and-meeting-management:
  name: إدارة المواعيد والاجتماعات
  description: إدارة المواعيد والاجتماعات والسفر بحيث يُستثمر وقت الناس جيدًا وتضم الاجتماعات الأشخاص والأوراق والقاعات المناسبة.
  levels:
    awareness: |
      يمكنك:
      - حجز الاجتماعات والقاعات باستخدام أدوات المؤسسة
      - إرسال الدعوات والأوراق في موعدها
    working: |
      يمكنك:
      - إدارة مواعيد فريق وحل التعارضات
      - ترتيب السفر والفعاليات والاجتماعات مع الشركاء الخارجيين
      - التأكد من جاهزية الأوراق والإجراءات قبل الاجتماعات
    practitioner: |
      يمكنك:
      - إدارة مواعيد أحد كبار القادة وتحديد الأولويات معه
      - تقرير ما يحتاج إلى وقته وما يمكن أن يتولاه الآخرون
      - التخطيط للدورة السنوية لاجتماعات مجلس أو فريق قيادي
    expert: |
      يمكنك:
      - إدارة دورة الأعمال لفريق تنفيذي
      - ضمان تركيز وقت كبار القادة على أولويات المؤسسة
corp-minute-taking:
  name: تدوين المحاضر وسجلات الاجتماعات
  description: تسجيل المناقشات والقرارات والإجراءات بدقة وإيجاز، والاحتفاظ بسجلات الاجتماعات الرسمية.
  levels:
    awareness: |
      يمكنك:
      - تدوين ملاحظات الإجراءات والقرارات في اجتماعات الفريق
    working: |
      يمكنك:
      - كتابة محاضر وسجلات إجراءات دقيقة وموجزة للاجتماعات الروتينية
      - متابعة الإجراءات مع المسؤولين عنها
    practitioner: |
      يمكنك:
      - تدوين المحاضر الرسمية لاجتماعات مجلس الإدارة واللجان، بما فيها المناقشات المعقدة أو الخلافية
      - الاحتفاظ بسجلات اجتماعات رسمية تصمد أمام التدقيق والتحقيق
      - تقديم المشورة لرؤساء الاجتماعات بشأن ما يجب أن يتضمنه السجل
    expert: |
      يمكنك:
      - وضع معايير سجلات الاجتماعات الرسمية على مستوى المؤسسة
      - تدريب مدوّني المحاضر ومراجعة جودة عملهم
corp-correspondence-management:
  name: التعامل مع المراسلات والاستفسارات
  description: التعامل مع الرسائل والبريد الإلكتروني والمكالمات والاستفسارات بسرعة ولباقة، وتوجيهها إلى الشخص المناسب.
  levels:
    awareness: |
      يمكنك:
      - الرد على المكالمات والرسائل الإلكترونية بلباقة وتدوين الرسائل بدقة
      - إحالة الاستفسارات إلى الشخص المناسب
    working: |
      يمكنك:
      - التعامل بنفسك مع المراسلات والاستفسارات الروتينية
      - صياغة الرسائل والردود ليوقّعها آخرون
      - الاحتفاظ بسجلات المراسلات ومتابعة الردود
    practitioner: |
      يمكنك:
      - إدارة مراسلات أحد كبار القادة، بما فيها الرسائل الحساسة ورسائل الشكاوى
      - صياغة ردود تحتاج إلى لباقة ودقة وحسن تقدير
      - ضمان التزام الردود بالمواعيد النهائية
    expert: |
      يمكنك:
      - وضع عملية المراسلات التنفيذية ومعاييرها
      - التعامل مع أكثر المراسلات حساسية، بما فيها المراسلات مع الجهات التنظيمية والشركاء ووسائل الإعلام
corp-pmo-reporting:
  name: دعم مكتب المشاريع والمحافظ
  description: تشغيل عمليات مكتب المشاريع والمحافظ، مثل الخطط والسجلات والتقارير وضبط المستندات وفحوص الضمان.
  levels:
    awareness: |
      يمكنك:
      - حفظ مستندات المشروع في المكان الصحيح مع ضبط الإصدارات
      - تحديث سجلات الإجراءات والمخاطر والمشكلات عند الطلب
    working: |
      يمكنك:
      - تحديث الخطط والسجلات وجداول المتابعة لعدة مشاريع
      - جمع المستجدات وإعداد تقارير الحالة الدورية
      - التحقق من التزام المشاريع بالمنهجية المتفق عليها
    practitioner: |
      يمكنك:
      - تصميم تقارير المحفظة وتحليل التقدم والمخاطر والفوائد عبر المشاريع
      - إجراء فحوص الضمان ومراجعات البوابات
      - تقديم المشورة لمديري المشاريع بشأن المنهجية والضوابط
    expert: |
      يمكنك:
      - إنشاء مكتب محفظة للمؤسسة وقيادته
      - تزويد كبار القادة برؤية واضحة وموثوقة عن المحفظة
      - وضع معايير إدارة المشاريع والمحافظ وأدواتها
corp-assurance-and-audit:
  name: الضمان والتنسيق مع التدقيق
  description: جمع الأدلة على أن الضوابط تعمل، ودعم عمليات التدقيق الداخلي والخارجي، وتتبع توصيات التدقيق حتى إنجازها.
  levels:
    awareness: |
      يمكنك:
      - شرح كيفية عمل التدقيق والضمان في المؤسسة
      - تقديم الأدلة عند الطلب
    working: |
      يمكنك:
      - تنسيق الأدلة لعمليات التدقيق والتفتيش
      - تتبع توصيات التدقيق ومتابعة الإجراءات المتأخرة
    practitioner: |
      يمكنك:
      - التخطيط لخرائط الضمان عبر المخاطر الرئيسية للمؤسسة
      - العمل مع المدققين الداخليين والخارجيين للاتفاق على النطاق والنتائج
      - رفع التقارير عن فجوات الضمان إلى اللجان
    expert: |
      يمكنك:
      - تصميم إطار الضمان في المؤسسة
      - تقديم المشورة للجنة التدقيق ومجلس الإدارة بشأن قوة الضمان
corp-policy-management:
  name: إدارة السياسات
  description: كتابة سياسات المؤسسة وإجراءاتها ومراجعتها واعتمادها ونشرها، والتحقق من التزام الناس بها.
  levels:
    awareness: |
      يمكنك:
      - إيجاد السياسات التي تنطبق على عملك واتباعها
    working: |
      يمكنك:
      - تحديث سجل السياسات وتذكير أصحابها بمواعيد المراجعة
      - التحقق من أن السياسات تستخدم النموذج ومسار الاعتماد الصحيحين
    practitioner: |
      يمكنك:
      - صياغة السياسات ومراجعتها مع خبراء الموضوع
      - التحقق من توافق السياسات مع القانون والمعايير وواجبات المساواة
      - مراقبة الامتثال والإبلاغ عن الثغرات
    expert: |
      يمكنك:
      - وضع إطار السياسات للمؤسسة
      - تقديم المشورة لمجلس الإدارة بشأن أولويات السياسات ومخاطرها
corp-internal-communications:
  name: الاتصال الداخلي
  description: إبقاء الموظفين على اطلاع ومشاركة من خلال قنوات مثل الشبكة الداخلية والنشرات والإحاطات والفعاليات، ولا سيما أثناء التغيير.
  levels:
    awareness: |
      يمكنك:
      - نشر المحتوى على القنوات الداخلية مثل الشبكة الداخلية
      - اتباع أسلوب المؤسسة ونبرتها
    working: |
      يمكنك:
      - كتابة الأخبار والإحاطات والنشرات للموظفين وتحريرها
      - التخطيط لمحتوى القنوات الداخلية وقياس التفاعل
    practitioner: |
      يمكنك:
      - التخطيط للاتصال الداخلي في التغييرات الكبرى، مثل نظام سريري جديد
      - تقديم المشورة للقادة بشأن إشراك الموظفين والتعامل مع الرسائل الصعبة
      - استخدام الملاحظات والبيانات لتحسين القنوات
    expert: |
      يمكنك:
      - وضع استراتيجية الاتصال الداخلي وإشراك الموظفين
      - تقديم المشورة للفريق التنفيذي بشأن الثقافة والمشاركة
corp-media-relations:
  name: العلاقات الإعلامية
  description: بناء العلاقات مع الصحفيين، والتعامل مع الاستفسارات الإعلامية، وكتابة البيانات الصحفية، وإعداد المتحدثين الرسميين، بما في ذلك أثناء الحوادث.
  levels:
    awareness: |
      يمكنك:
      - شرح كيفية تعامل المؤسسة مع الاستفسارات الإعلامية
      - إحالة الاستفسارات الإعلامية إلى فريق الاتصال فورًا
    working: |
      يمكنك:
      - تسجيل الاستفسارات الإعلامية الروتينية والرد عليها
      - صياغة البيانات الصحفية والتصريحات لاعتمادها
      - رصد التغطية الإعلامية
    practitioner: |
      يمكنك:
      - التعامل مع الاستفسارات الإعلامية الحساسة والطارئة، بما فيها تلك المتعلقة بالحوادث أو خروقات البيانات
      - إحاطة المتحدثين الرسميين وإعدادهم
      - بناء العلاقات مع صحفيي الصحة والتقنية
    expert: |
      يمكنك:
      - قيادة التعامل الإعلامي أثناء الحوادث والأزمات الكبرى
      - حماية سمعة المؤسسة وبناؤها لدى كبار أصحاب المصلحة
      - تقديم المشورة لمجلس الإدارة بشأن مخاطر السمعة
corp-communications-strategy:
  name: استراتيجية الاتصال والتخطيط له
  description: التخطيط للاتصال والحملات التي تحقق أهداف المؤسسة، باستخدام فهم الجمهور، وتقييم أثرها.
  levels:
    awareness: |
      يمكنك:
      - شرح أهداف خطة الاتصال التي تعمل عليها
    working: |
      يمكنك:
      - كتابة خطط الاتصال للمشاريع، مع الجماهير والرسائل والقنوات
      - قياس نتائج أنشطة الاتصال
    practitioner: |
      يمكنك:
      - التخطيط لحملات تغيّر السلوك، مثل تشجيع المرضى على استخدام خدمة رقمية
      - استخدام فهم الجمهور والتقييم لتحسين الحملات
      - التخطيط للاتصال أثناء الحوادث وانقطاع الخدمات
    expert: |
      يمكنك:
      - وضع استراتيجية الاتصال للمؤسسة
      - قيادة الاتصال في الأزمات
      - تقديم المشورة لمجلس الإدارة بشأن السمعة والتواصل مع أصحاب المصلحة
corp-digital-and-social-media:
  name: الوسائط الرقمية ووسائل التواصل الاجتماعي
  description: التخطيط للمحتوى على المواقع الإلكترونية ووسائل التواصل الاجتماعي ونشره وإدارته، والتفاعل مع الجماهير، وقياس النتائج.
  levels:
    awareness: |
      يمكنك:
      - نشر المحتوى المعتمد على قنوات المؤسسة
      - اتباع سياسة وسائل التواصل الاجتماعي
    working: |
      يمكنك:
      - التخطيط للمحتوى ونشره على المواقع الإلكترونية ووسائل التواصل الاجتماعي
      - الرد على التعليقات ورصد المسائل التي تحتاج إلى تصعيد
      - رفع التقارير عن أداء القنوات
    practitioner: |
      يمكنك:
      - إدارة القنوات الرقمية للمؤسسة وخطط محتواها
      - التعامل مع المنشورات السلبية أو المضللة، بما في ذلك أثناء الحوادث
      - استخدام التحليلات لتحسين الوصول والتفاعل
    expert: |
      يمكنك:
      - وضع استراتيجية القنوات الرقمية للمؤسسة وحوكمتها
      - قيادة الاستجابة لمخاطر السمعة على الإنترنت
