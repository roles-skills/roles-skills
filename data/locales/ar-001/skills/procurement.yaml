# Arabic translations of data/skills/procurement.yaml. Keys are the English skill ids.
proc-purchase-to-pay:
  name: من الشراء إلى الدفع
  description: إنشاء الطلبات واعتمادها وتأكيد استلامها، وحل استفسارات الفواتير والمدفوعات، عبر نظام الشراء في المؤسسة وضوابطها المالية.
  levels:
    awareness: |
      يمكنك:
      - شرح قاعدة "لا دفع دون أمر شراء" وسبب أهميتها
      - إنشاء طلب شراء في نظام الشراء
    working: |
      يمكنك:
      - إنشاء أوامر الشراء وتعديلها ومطابقتها مع العقود
      - حل استفسارات الفواتير وتأكيد الاستلام والمدفوعات مع الموردين والمالية
      - صيانة الكتالوجات وسجلات الموردين في نظام الشراء
    practitioner: |
      يمكنك:
      - إدارة عملية "من الشراء إلى الدفع" لخدمة ما، ومراقبة الامتثال والأعمال المتأخرة
      - تحليل بيانات الإنفاق لاكتشاف الإنفاق خارج العقود وفرص التوفير
      - تحسين العملية والضوابط مع زملاء المالية
    expert: |
      يمكنك:
      - وضع سياسة "من الشراء إلى الدفع" في المؤسسة وضوابطها وأنظمتها
      - قيادة الانتقال إلى الشراء والفوترة الإلكترونيين بالكامل
proc-procurement-process:
  name: عملية المشتريات
  description: إدارة عمليات شراء ممتثلة، من التخطيط والمواصفات مرورًا بمسارات الشراء والمناقصة والترسية حتى توقيع العقد، بما في ذلك الشراء عبر الاتفاقيات الإطارية وأنظمة الشراء الديناميكية.
  levels:
    awareness: |
      يمكنك:
      - شرح مراحل عملية الشراء والحدود المالية التي تنطبق عليها
      - الحصول على عروض أسعار للمشتريات منخفضة القيمة وفق قواعد المؤسسة
    working: |
      يمكنك:
      - إجراء طلبات عروض الأسعار والطلبات المباشرة من الاتفاقيات الإطارية باستخدام النماذج القياسية
      - إعداد وثائق المناقصة وإدارة أسئلة الاستيضاح في نظام المناقصات الإلكتروني
      - الاحتفاظ بسجل تدقيق واضح لكل عملية شراء
    practitioner: |
      يمكنك:
      - التخطيط للمناقصات المعقدة وقيادتها، واختيار مسار الشراء والإجراء المناسبين
      - مساعدة المستخدمين على كتابة مواصفات قائمة على النتائج للأنظمة الرقمية والسريرية
      - إدارة الجداول الزمنية والمخاطر وأصحاب المصلحة حتى ترسية العقد
    expert: |
      يمكنك:
      - وضع إجراءات المشتريات في المؤسسة ونماذجها
      - قيادة أكثر عمليات الشراء تعقيدًا أو قيمة أو جِدّة
      - ضمان قرارات المشتريات أمام مجلس الإدارة
proc-tender-evaluation:
  name: تقييم العطاءات
  description: تصميم معايير التقييم وأوزانها، وإجراء تقييم منصف وموثّق جيدًا للجودة والسعر والقيمة الاجتماعية.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يجب أن يتبع التقييم المعايير المعلنة
      - الإفصاح عن تضارب المصالح قبل المشاركة في التقييم
    working: |
      يمكنك:
      - التحقق من امتثال العطاءات واكتمالها
      - دعم المقيّمين وتسجيل الدرجات وملاحظات المواءمة
      - إعداد نماذج تقييم الأسعار بتوجيه
    practitioner: |
      يمكنك:
      - تصميم معايير التقييم وأوزانها وإرشادات التقدير
      - قيادة جلسات المواءمة وكتابة تقارير الترسية والملاحظات لمقدمي العطاءات
      - التخطيط للعروض التوضيحية واختبارات السيناريوهات السريرية أو سيناريوهات المستخدمين لمناقصات الأنظمة
    expert: |
      يمكنك:
      - وضع معايير التقييم في المؤسسة ونهجها تجاه السعر والجودة
      - الدفاع عن قرارات التقييم عند الطعن فيها
      - مراجعة التقييمات في المشتريات عالية المخاطر
proc-procurement-law-and-policy:
  name: قواعد المشتريات العامة وسياساتها
  description: تطبيق قواعد المشتريات العامة والقواعد المالية للمؤسسة وسياسة المشتريات حتى يكون الشراء قانونيًا وشفافًا ومنصفًا.
  levels:
    awareness: |
      يمكنك:
      - شرح أن المال العام يجب أن يُنفَق بإنصاف وشفافية وقانونية
      - اتباع الحدود المالية وقواعد الاعتماد في المؤسسة
    working: |
      يمكنك:
      - تطبيق قواعد المشتريات المناسبة لعملية شراء بسيطة
      - نشر الإشعارات والاحتفاظ بسجلات تستوفي قواعد الشفافية
      - رصد الطلبات التي قد تخالف القواعد والتنبيه إليها
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن المسار القانوني للمشتريات المعقدة وتعديلات العقود
      - إدارة خطر الطعن والتعامل مع فترة التوقف والإحاطة بالنتائج بشكل صحيح
      - كتابة سياسة المشتريات وإرشاداتها للمؤسسة
    expert: |
      يمكنك:
      - تفسير قواعد المشتريات الجديدة وقيادة استجابة المؤسسة لها
      - تقديم المشورة لمجلس الإدارة بشأن امتثال المشتريات ومخاطرها
      - إدارة الطعون الرسمية مع المستشارين القانونيين
proc-market-analysis:
  name: تحليل السوق والتواصل معه
  description: فهم أسواق التوريد، والتواصل مع الموردين قبل الشراء، واستخدام أدلة السوق لتشكيل المتطلبات ومسارات الشراء والنماذج التجارية.
  levels:
    awareness: |
      يمكنك:
      - إيجاد الموردين في الاتفاقيات الإطارية وقواعد بيانات الموردين
      - شرح لماذا يجب أن يكون التواصل المبكر مع السوق منصفًا لجميع الموردين
    working: |
      يمكنك:
      - جمع معلومات السوق والأسعار وبيانات الموردين لمتطلب ما
      - إجراء طلب للمعلومات وتلخيص الردود
    practitioner: |
      يمكنك:
      - تحليل سوق توريد ومنافسته ومخاطره واتجاهاته
      - قيادة التواصل المبكر مع السوق، مثل أيام الموردين، دون الإخلال بالمنافسة
      - استخدام أدلة السوق لتشكيل المتطلبات والنماذج التجارية
    expert: |
      يمكنك:
      - تشكيل الأسواق، مثلًا بتشجيع الموردين الجدد أو الأصغر
      - قيادة استراتيجية السوق مع جهات شراء أخرى
proc-negotiation:
  name: التفاوض التجاري
  description: التخطيط للمفاوضات مع الموردين وإجراؤها للاتفاق على سعر وشروط وأداء تحقق القيمة مقابل المال وتدير المخاطر.
  levels:
    awareness: |
      يمكنك:
      - شرح ما يمكن التفاوض عليه وما لا يمكن في عمليات الشراء العام
    working: |
      يمكنك:
      - التفاوض على الأسعار والشروط للمشتريات منخفضة القيمة أو الروتينية
      - إعداد البيانات والخيارات لمفاوضات يقودها آخرون
    practitioner: |
      يمكنك:
      - التخطيط للمفاوضات وقيادتها، وتحديد الأهداف والحدود والمواقف البديلة
      - التفاوض على تعديلات العقود وتجديدها وتسوية النزاعات
      - الحفاظ على قانونية المفاوضات وتوثيقها جيدًا
    expert: |
      يمكنك:
      - قيادة المفاوضات عالية القيمة والمخاطر مع الموردين الاستراتيجيين
      - توجيه الآخرين في التفاوض ووضع نهج المؤسسة فيه
proc-category-management:
  name: إدارة الفئات
  description: إدارة فئة من الإنفاق، مثل البرمجيات والسحابة والخدمات التقنية، من خلال استراتيجية للفئة تجمع الطلب وتشكّل المتطلبات وتخطط للمشتريات على مدى عدة سنوات.
  levels:
    awareness: |
      يمكنك:
      - شرح ما هي الفئة ولماذا تهم خطط الفئات
    working: |
      يمكنك:
      - تحليل الإنفاق والعقود لفئة ما وتحديث سجل العقود
      - دعم خطة الفئة، مثل تتبع التجديدات والوفورات
    practitioner: |
      يمكنك:
      - كتابة استراتيجية للفئة وتنفيذها مع أصحاب الميزانيات والقادة التقنيين
      - التخطيط لسلسلة المشتريات وتجديدات العقود للفئة
      - تتبع الوفورات والقيمة والمخاطر للفئة
    expert: |
      يمكنك:
      - وضع نهج إدارة الفئات للمؤسسة
      - قيادة الفئات الأعلى إنفاقًا ومخاطر، ومواءمتها مع استراتيجية المؤسسة
      - العمل مع مؤسسات أخرى على الشراء التعاوني
proc-technology-procurement:
  name: شراء التقنية والخدمات السحابية
  description: شراء البرمجيات والخدمات السحابية والتراخيص والأجهزة والخدمات الرقمية، بما في ذلك البرمجيات بوصفها خدمة والنماذج التجارية والترخيص وشروط الأمن وحماية البيانات والتشغيل البيني التي تحتاجها التقنيات الصحية.
  levels:
    awareness: |
      يمكنك:
      - شرح الطرق الرئيسية لشراء التقنية، مثل التراخيص والاشتراكات والخدمات
      - إدراك أن الأنظمة السريرية تحتاج إلى فحوص للأمن والسلامة السريرية وحماية البيانات
    working: |
      يمكنك:
      - شراء البرمجيات والأجهزة والتراخيص القياسية عبر الاتفاقيات الإطارية
      - تتبع أعداد التراخيص وتجديداتها ومواعيد تسويتها
      - تضمين متطلبات الأمن وحماية البيانات القياسية في الوثائق
    practitioner: |
      يمكنك:
      - شراء الخدمات السحابية والبرمجيات بوصفها خدمة والأنظمة السريرية، واختيار النموذج التجاري المناسب
      - بناء المتطلبات مع القادة التقنيين وقادة السلامة السريرية وحوكمة المعلومات
      - تضمين شروط التشغيل البيني والمعايير المفتوحة وملكية البيانات والخروج في العقود
      - تجنب الارتهان لمورد واحد بالتخطيط لقابلية النقل والمنافسة عند التجديد
    expert: |
      يمكنك:
      - وضع الاستراتيجية التجارية للمؤسسة في التقنية والسحابة
      - قيادة المفاوضات على اتفاقيات المؤسسة والمنصات الاستراتيجية
      - تقديم المشورة للقادة الرقميين بشأن المخاطر التجارية لخيارات التقنية
proc-contract-management:
  name: إدارة العقود
  description: إدارة العقود بعد ترسيتها، بما في ذلك التهيئة والأداء والمدفوعات والتعديلات والنزاعات والتجديد والخروج، حتى تحصل المؤسسة على ما دفعت مقابله.
  levels:
    awareness: |
      يمكنك:
      - إيجاد عقد ما وشرح تواريخه المهمة وقيمته ومالكه
      - تسجيل تعديلات العقود ومستنداتها في سجل العقود
    working: |
      يمكنك:
      - مراقبة أداء الموردين مقابل مستويات الخدمة ومؤشرات الأداء الرئيسية
      - إعداد اجتماعات مراجعة العقود وتتبع الإجراءات
      - معالجة تعديلات العقود ومطابقة الفواتير مع العقد
    practitioner: |
      يمكنك:
      - إدارة محفظة من العقود، بما فيها العقود السريرية والتقنية
      - استخدام الجزاءات التعاقدية، مثل أرصدة الخدمة، حين يقصر الأداء
      - إدارة التعديلات والنزاعات والتجديدات ضمن قواعد المشتريات
      - التخطيط للخروج مبكرًا واختبار خطط الخروج قبل انتهاء العقود
    expert: |
      يمكنك:
      - وضع إطار إدارة العقود في المؤسسة ومعاييره
      - قيادة إدارة العقود الاستراتيجية عالية المخاطر
      - حل النزاعات الكبرى وتقرير الإنهاء أو إعادة الشراء
proc-supplier-relationship-management:
  name: إدارة العلاقات مع الموردين
  description: بناء علاقات استراتيجية مع الموردين الرئيسيين لإدارة المخاطر وتحسين الأداء وتطوير المنتجات والخدمات بمرور الوقت.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا تهم العلاقات الجيدة مع الموردين للخدمات التي يعتمد عليها المرضى
      - التعامل مع الموردين بمهنية وتسجيل الاتصالات
    working: |
      يمكنك:
      - تحديث جهات اتصال الموردين ومسارات التصعيد والسجلات
      - التحقق من الوضع المالي للموردين وتأمينهم مقابل المتطلبات
    practitioner: |
      يمكنك:
      - تصنيف الموردين حسب المخاطر والقيمة والتخطيط لإدارة كل مجموعة
      - إجراء مراجعات استراتيجية مع الموردين الرئيسيين، بما في ذلك خرائط الطريق وخطط التحسين
      - إدارة مخاطر الموردين، مثل الإخفاق المالي والحوادث السيبرانية ومشكلات سلسلة التوريد
    expert: |
      يمكنك:
      - وضع استراتيجية المؤسسة للعلاقات مع الموردين
      - قيادة العلاقات التنفيذية مع الموردين الاستراتيجيين
      - قيادة الاستجابة عند إخفاق مورد حرج
proc-exit-planning:
  name: التخطيط للخروج وإعادة البيانات
  description: التخطيط لنهاية العقد وإدارتها، بما في ذلك الانتقال إلى مورد جديد وإعادة البيانات وحذفها واستمرارية الخدمات للمرضى والموظفين.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يحتاج كل عقد إلى خطة خروج
      - إيجاد شروط الخروج وإعادة البيانات في عقد ما
    working: |
      يمكنك:
      - تحديث خطط الخروج وسجلات الأصول والبيانات
      - تتبع فترات الإخطار ومعالم الخروج
    practitioner: |
      يمكنك:
      - كتابة خطط الخروج والانتقال مع القادة التقنيين وقادة البيانات والقادة السريريين
      - ضمان إعادة البيانات بصيغ قياسية قابلة للاستخدام ثم حذفها بأمان
      - إدارة مخاطر الانتقال حتى لا تتعطل الرعاية
    expert: |
      يمكنك:
      - وضع معايير المؤسسة للخروج والانتقال وإعادة البيانات
      - قيادة الخروج من العقود السريرية والتقنية الاستراتيجية
proc-social-value:
  name: القيمة الاجتماعية والمشتريات المستدامة
  description: استخدام المشتريات والعقود لتحقيق القيمة الاجتماعية والاستدامة البيئية وسلاسل التوريد العادلة، وقياس ما يقدمه الموردون.
  levels:
    awareness: |
      يمكنك:
      - شرح ما تعنيه القيمة الاجتماعية والمشتريات المستدامة للمؤسسة
    working: |
      يمكنك:
      - تضمين أسئلة القيمة الاجتماعية والاستدامة القياسية في المناقصات
      - جمع تقارير القيمة الاجتماعية من الموردين
    practitioner: |
      يمكنك:
      - وضع معايير للقيمة الاجتماعية والاستدامة تلائم العقد
      - إدارة التزامات الموردين، مثل الوظائف المحلية والمهارات وخفض الكربون
      - فحص سلاسل التوريد بحثًا عن مخاطر مثل العمل القسري وغيره من انتهاكات حقوق الإنسان
    expert: |
      يمكنك:
      - وضع سياسة المؤسسة للقيمة الاجتماعية والمشتريات المستدامة
      - رفع التقارير عن نتائج القيمة الاجتماعية والكربون إلى مجلس الإدارة
