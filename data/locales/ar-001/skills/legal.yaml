# Arabic translations of data/skills/legal.yaml. Keys are the English skill ids.
legal-legal-research:
  name: البحث القانوني
  description: إيجاد التشريعات والسوابق القضائية والإرشادات والنماذج المرجعية وقراءتها وتلخيصها للإجابة عن مسألة قانونية.
  levels:
    awareness: |
      يمكنك:
      - إيجاد التشريعات والإرشادات والنماذج المرجعية باستخدام قواعد البيانات القانونية والمعرفة المتراكمة في المؤسسة
      - استخدام المصطلحات القانونية استخدامًا صحيحًا
    working: |
      يمكنك:
      - البحث في مسألة قانونية محددة وتلخيص المصادر بوضوح
      - التحقق من أن المصادر حديثة وموثوقة
      - تحديث مكتبات النماذج المرجعية والمعرفة المتراكمة
    practitioner: |
      يمكنك:
      - البحث في المسائل المعقدة أو المستجدة، مثل كيفية تطبيق القانون القائم على التقنيات الجديدة
      - تحليل المصادر المتعارضة والوصول إلى رأي معلّل
      - تتبع التغييرات في القانون والإرشادات وشرح أثرها في المؤسسة
    expert: |
      يمكنك:
      - قيادة البحث في أكثر المسائل تعقيدًا وخطورة بالنسبة إلى المؤسسة
      - توقّع التطورات القانونية وإعداد المؤسسة لها
      - الإسهام في المشاورات بشأن القوانين والإرشادات التي تؤثر في الصحة والرعاية الرقمية
legal-contract-drafting-and-review:
  name: صياغة العقود ومراجعتها
  description: صياغة العقود والاتفاقيات ومراجعتها والتفاوض عليها، مثل اتفاقيات التقنية وتراخيص البرمجيات والسحابة والخدمات ومعالجة البيانات.
  levels:
    awareness: |
      يمكنك:
      - شرح الأجزاء الرئيسية للعقد، مثل الأطراف والمدة والدفع والمسؤولية والإنهاء
      - إعداد المستندات القياسية من النماذج المعتمدة
    working: |
      يمكنك:
      - مراجعة الاتفاقيات الروتينية، مثل اتفاقيات عدم الإفصاح واتفاقيات الخدمات البسيطة، مقابل معايير المؤسسة
      - التأشير على العقود وشرح التعديلات
      - رصد البنود التي تحتاج إلى مراجعة محامٍ، مثل المسؤولية غير المحدودة أو التجديد التلقائي
    practitioner: |
      يمكنك:
      - صياغة الاتفاقيات المعقدة والتفاوض عليها، مثل تراخيص البرمجيات والاستضافة السحابية وتكامل الأنظمة ومعالجة البيانات
      - تقديم المشورة بشأن توزيع المخاطر، بما في ذلك سقوف المسؤولية ومستويات الخدمة والخروج والإيداع لدى طرف ثالث
      - ضمان أن تحمي العقود بيانات المرضى واستمرارية الخدمة وحقوق المؤسسة في برمجياتها وبياناتها
      - كتابة نماذج العقود وأدلة التفاوض وتحديثها
    expert: |
      يمكنك:
      - وضع معايير التعاقد في المؤسسة ومواقفها من المخاطر
      - قيادة المفاوضات في الاتفاقيات الأعلى قيمة أو خطورة
      - تقديم المشورة لكبار القادة بشأن الترتيبات التجارية الاستراتيجية، مثل الشراكات والمشاريع المشتركة
legal-legal-advice:
  name: المشورة القانونية
  description: تقديم مشورة قانونية واضحة وعملية ودقيقة تساعد الزملاء على اتخاذ قرارات قانونية وإدارة المخاطر القانونية.
  levels:
    awareness: |
      يمكنك:
      - شرح متى يحتاج الزملاء إلى مشورة قانونية وكيف يحصلون عليها
      - تلقي تعليمات واضحة وتسجيل وقائع المسألة
    working: |
      يمكنك:
      - إعداد مسودات المشورة في المسائل الروتينية ليراجعها محامٍ
      - الإجابة عن الأسئلة البسيطة باستخدام الإرشادات المعتمدة
      - تحديد المسائل القانونية في مجموعة من الوقائع
    practitioner: |
      يمكنك:
      - تقديم مشورة قانونية مستقلة في مجالات ممارستك
      - شرح المخاطر القانونية بلغة واضحة وبسيطة والتوصية بخيارات عملية
      - تقديم المشورة بشأن القرارات ذات الأثر القانوني، مثل ترسية العقود وتبادل البيانات وتغيير الخدمات
      - تقرير متى يُستعان بمحامين أو مستشارين خارجيين
    expert: |
      يمكنك:
      - تقديم المشورة لمجلس الإدارة والإدارة التنفيذية بشأن أهم المخاطر القانونية للمؤسسة
      - تقديم مشورة حاسمة في المسائل المستجدة أو الخلافية أو عالية القيمة
      - تحديد مستوى تقبّل المؤسسة للمخاطر القانونية
      - ضمان جودة المشورة القانونية على مستوى المؤسسة، بما فيها المشورة الخارجية
legal-litigation-and-disputes:
  name: التقاضي وتسوية النزاعات
  description: منع النزاعات والمطالبات وإدارتها وحلها، بما في ذلك نزاعات العقود ومطالبات العمل والتنسيق في مطالبات الإهمال السريري.
  levels:
    awareness: |
      يمكنك:
      - شرح المراحل الرئيسية للمطالبة أو النزاع
      - تسجيل المطالبات وتتبع المواعيد النهائية بدقة
    working: |
      يمكنك:
      - جمع المستندات والأدلة الخاصة بقضية ما وتنظيمها
      - إعداد التسلسلات الزمنية وملفات القضايا ومسودات إفادات الشهود
      - التنسيق مع المحامين الخارجيين أو شركات التأمين أو خطط التعويض في المسائل الروتينية
    practitioner: |
      يمكنك:
      - إدارة مجموعة من النزاعات والمطالبات من الإخطار الأول حتى التسوية أو الجلسة
      - تقييم وجاهة المطالبات وقيمتها والتوصية بالاستراتيجية
      - التفاوض على التسويات واستخدام الوسائل البديلة لتسوية النزاعات
      - ضمان أن تُغذّي الدروس المستفادة من المطالبات تحسينات السلامة والعقود والخدمات
    expert: |
      يمكنك:
      - قيادة أهم نزاعات المؤسسة أو أكثرها بروزًا
      - وضع نهج المؤسسة في التقاضي والتسوية والإبلاغ عن المطالبات
      - تقديم المشورة لمجلس الإدارة بشأن الالتزامات المحتملة ومخاطر السمعة
legal-information-and-data-law:
  name: قانون المعلومات والبيانات
  description: تطبيق قوانين حماية البيانات والسرية وحرية المعلومات والأمن السيبراني على بيانات الصحة والرعاية والخدمات الرقمية.
  levels:
    awareness: |
      يمكنك:
      - شرح المبادئ الأساسية لحماية البيانات والسرية
      - التعرف على طلبات المعلومات وخروقات البيانات وتوجيهها بشكل صحيح
    working: |
      يمكنك:
      - مراجعة اتفاقيات تبادل البيانات ومعالجتها مقابل النماذج
      - دعم الردود على طلبات المعلومات وطلبات حقوق أصحاب البيانات
      - شرح الأسس القانونية لاستخدام البيانات الصحية في المواقف الشائعة
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن حماية البيانات وواجب السرية وقانون الوصول إلى المعلومات في الخدمات الرقمية
      - صياغة اتفاقيات تبادل البيانات وشروط معالجتها والتفاوض عليها، بما في ذلك النقل الدولي
      - تقديم المشورة بشأن تقييمات أثر حماية البيانات للتقنيات الجديدة، مثل الذكاء الاصطناعي ومنصات التحليلات
      - تقديم المشورة بشأن خروقات البيانات واستفسارات الجهات التنظيمية والشكاوى
    expert: |
      يمكنك:
      - تحديد الموقف القانوني للمؤسسة من استخدام بيانات الصحة والرعاية
      - قيادة الاستخدامات عالية المخاطر أو المستجدة للبيانات، مثل البحث ومنصات البيانات والذكاء الاصطناعي
      - تمثيل المؤسسة لدى الجهات التنظيمية في شؤون قانون المعلومات
legal-legal-administration:
  name: الإدارة القانونية
  description: تشغيل العمليات الإدارية للفريق القانوني، بما في ذلك إدارة القضايا وضبط المستندات والسجلات والمواعيد النهائية والفوترة.
  levels:
    awareness: |
      يمكنك:
      - فتح القضايا وتحديثها وإغلاقها في نظام إدارة القضايا
      - حفظ المستندات القانونية واسترجاعها بأمان
      - الحفاظ على سرية المعلومات القانونية والشخصية
    working: |
      يمكنك:
      - إدارة الجداول والمواعيد النهائية والتواريخ المهمة لفريق
      - إعداد المستندات القانونية وملفات القضايا وحزم التوقيع وتنسيقها
      - مراجعة فواتير المحامين الخارجيين ومعالجتها
      - إدارة سجلات العقود والصكوك
    practitioner: |
      يمكنك:
      - إدارة الشؤون الإدارية للفريق القانوني وتحسين عملياته
      - رفع التقارير عن عبء العمل والإنفاق على المحامين الخارجيين وأوقات الإنجاز
      - إدارة التقنيات القانونية، مثل أدوات إدارة القضايا والتوقيع الإلكتروني
    expert: |
      يمكنك:
      - تصميم نموذج العمليات القانونية للمؤسسة
      - قيادة اختيار التقنيات القانونية واستخدامها
      - وضع معايير الخدمة ومقاييس الأداء للخدمات القانونية
legal-employment-law:
  name: قانون العمل
  description: تطبيق قانون العمل على سياسات الموارد البشرية في المؤسسة وعقودها وبرامج التغيير ونزاعات العمل.
  levels:
    awareness: |
      يمكنك:
      - شرح الحقوق الرئيسية للموظفين في العمل
      - التعرف على مسائل العمل التي تحتاج إلى مشورة قانونية
    working: |
      يمكنك:
      - المساعدة في إعداد المستندات لمطالبات العمل وجلساتها
      - مراجعة عقود العمل والسياسات مقابل النماذج
    practitioner: |
      يمكنك:
      - تقديم المشورة في مسائل العمل، مثل الفصل والتمييز ونقل الموظفين وإعادة الهيكلة
      - إدارة مطالبات العمل والتفاوض على اتفاقيات التسوية
      - تقديم المشورة بشأن الاستعانة بالمتعاقدين والوضع الوظيفي للمتخصصين الرقميين
    expert: |
      يمكنك:
      - تقديم المشورة لمجلس الإدارة بشأن التغييرات الكبرى في القوى العاملة ومخاطرها القانونية
      - قيادة نزاعات العمل البارزة أو المعقدة
      - تشكيل سياسات الموارد البشرية للوفاء بالواجبات القانونية والممارسات الجيدة
legal-intellectual-property:
  name: الملكية الفكرية
  description: حماية الملكية الفكرية في البرمجيات والبيانات والمحتوى والاختراعات واستخدامها، بما في ذلك حقوق المؤلف والتراخيص والمصادر المفتوحة والعلامات التجارية.
  levels:
    awareness: |
      يمكنك:
      - شرح أن البرمجيات والبيانات والمحتوى محمية بحقوق الملكية الفكرية
      - إدراك متى يثير عقد أو مشروع ما أسئلة عن الملكية
    working: |
      يمكنك:
      - مراجعة بنود الملكية الفكرية في الاتفاقيات الروتينية
      - الاحتفاظ بسجلات التراخيص والحقوق المسجلة
      - شرح الأنواع الرئيسية لتراخيص المصادر المفتوحة وشروطها
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن ملكية البرمجيات والبيانات والمحتوى التي يصنعها الموظفون والموردون والشركاء
      - صياغة التراخيص وشروط الملكية الفكرية، بما في ذلك نشر شيفرة المؤسسة مصدرًا مفتوحًا
      - تقديم المشورة بشأن الاستخدام التجاري لبيانات المؤسسة وبرمجياتها، وبشأن تقاسم المنافع
    expert: |
      يمكنك:
      - وضع سياسة المؤسسة للملكية الفكرية والمصادر المفتوحة
      - قيادة التسويق التجاري والشراكات التي تشمل بيانات المؤسسة وبرمجياتها
      - حل نزاعات الملكية الفكرية الكبيرة
legal-procurement-law:
  name: قانون المشتريات العامة
  description: تطبيق قواعد المشتريات العامة على شراء السلع والخدمات والتقنيات، من اختيار مسار الشراء إلى ترسية العقد والطعن فيه.
  levels:
    awareness: |
      يمكنك:
      - شرح لماذا يجب على الجهات العامة اتباع قواعد المشتريات
      - إدراك متى يحتاج نشاط الشراء إلى مشورة المشتريات أو المشورة القانونية
    working: |
      يمكنك:
      - مراجعة وثائق المناقصات للتحقق من اتساقها واكتمالها
      - دعم حفظ السجلات اللازمة لإثبات عملية عادلة وشفافة
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن مسارات الشراء، بما في ذلك الاتفاقيات الإطارية والترسية المباشرة والإجراءات التنافسية
      - تقديم المشورة بشأن التقييم وقرارات الترسية وتعديل العقود بعد الترسية
      - الرد على طعون الموردين وشكاواهم
      - تقديم المشورة بشأن مخاطر ضبط الإعانات والمنافسة في الشراكات
    expert: |
      يمكنك:
      - وضع نهج المؤسسة تجاه المخاطر القانونية للمشتريات
      - قيادة المشتريات عالية القيمة أو المستجدة، مثل شراكات الابتكار
      - الدفاع في الطعون الكبيرة على المشتريات
legal-health-and-care-law:
  name: قانون الصحة والرعاية
  description: تطبيق القانون الذي يحكم خدمات الصحة والرعاية، بما في ذلك الموافقة والأهلية والإهمال السريري وتنظيم الخدمات والمنتجات والواجبات النظامية للمؤسسة.
  levels:
    awareness: |
      يمكنك:
      - شرح الواجبات والصلاحيات النظامية الرئيسية للمؤسسة
      - التعرف على المسائل التي تتعلق بسلامة المرضى أو الموافقة أو الإهمال السريري
    working: |
      يمكنك:
      - دعم العمل القانوني المتعلق بالحوادث أو التحقيقات في الوفيات أو المطالبات السريرية
      - شرح الإطار التنظيمي الذي ينطبق على خدمات المؤسسة
    practitioner: |
      يمكنك:
      - تقديم المشورة بشأن صلاحيات المؤسسة وواجباتها، بما في ذلك متى يمكنها تقديم خدمة أو التعاقد عليها
      - تقديم المشورة بشأن تنظيم منتجات الصحة الرقمية، مثل البرمجيات بوصفها جهازًا طبيًا
      - التنسيق مع خطط الإهمال السريري والمحامين الخارجيين في المطالبات المتعلقة بالخدمات الرقمية
      - تقديم المشورة بشأن الموافقة والأهلية وحقوق المرضى في الخدمات الرقمية
    expert: |
      يمكنك:
      - تقديم المشورة لمجلس الإدارة بشأن الواجبات النظامية للمؤسسة وحوكمتها
      - قيادة العمل القانوني في التحقيقات العامة والمراجعات القضائية والحوادث الكبرى
      - تشكيل استجابة المؤسسة لقوانين الصحة والرعاية الجديدة
