# Arabic translations of data/skills/data-testing.yaml. Keys are the English skill ids.
data-ai-assurance:
  name: الذكاء الاصطناعي الآمن والعادل في الرعاية الصحية
  description: ضمان أن تكون النماذج الإحصائية ونماذج التعلم الآلي والذكاء الاصطناعي المستخدمة في الصحة والرعاية آمنة وعادلة وقابلة للتفسير ومراقَبة، بما في ذلك التحقق من التحيز بين فئات المرضى واستيفاء لوائح الأجهزة الطبية والذكاء الاصطناعي.
  levels:
    awareness: |
      يمكنك:
      - شرح كيف يمكن لنموذج ما أن يضر بالمرضى، مثلًا من خلال التحيز أو الانجراف أو الاعتماد المفرط على مخرجاته
      - شرح سبب ضرورة التحقق من صحة النماذج على الفئة السكانية التي ستُستخدم معها
    working: |
      يمكنك:
      - قياس أداء النموذج لدى فئات المرضى المختلفة والإبلاغ عن أي فروق
      - توثيق الاستخدام المقصود للنموذج وبيانات تدريبه وحدوده المعروفة، مثلًا في بطاقة النموذج
      - الإسهام بأدلة عن النموذج في ملف السلامة السريرية
    practitioner: |
      يمكنك:
      - التخطيط للتحقق من صحة النموذج وتقييم تحيزه ومراقبته أثناء التشغيل مع الزملاء السريريين
      - تقرير متى يحتاج النموذج إلى إعادة تدريب أو تقييد أو سحب
      - تقديم المشورة للفرق بشأن متى قد يخضع النموذج للتنظيم بوصفه جهازًا طبيًا والأدلة التي يحتاجها
    expert: |
      يمكنك:
      - وضع معايير المؤسسة لضمان الذكاء الاصطناعي في الرعاية ومراقبته
      - قيادة ضمان النماذج عالية المخاطر قبل نشرها وبعده
      - تمثيل المؤسسة لدى الجهات التنظيمية والشركاء في شأن الذكاء الاصطناعي الآمن والعادل
data-deidentification:
  name: الترميز المستعار وضبط الإفصاح
  description: حماية سرية المرضى عند ربط البيانات أو تحليلها أو مشاركتها أو نشرها، باستخدام الترميز المستعار وإخفاء الهوية وحجب الأعداد الصغيرة وغيرها من أساليب ضبط الإفصاح الإحصائي.
  levels:
    awareness: |
      يمكنك:
      - شرح الفرق بين البيانات المحددة للهوية والبيانات ذات الترميز المستعار والبيانات مجهولة الهوية
      - اتباع قواعد المؤسسة لحجب الأعداد الصغيرة في المخرجات
    working: |
      يمكنك:
      - العمل ببيانات ذات ترميز مستعار وإجراء فحوص الإفصاح قبل إصدار المخرجات
      - إدراك متى قد تكشف البيانات المربوطة أو التفصيلية هوية مريض
    practitioner: |
      يمكنك:
      - تصميم أساليب للترميز المستعار والربط تُبقي المعرّفات منفصلة عن بيانات التحليل
      - تقييم خطر إعادة تحديد الهوية في مجموعة بيانات أو منشور واختيار الضوابط المناسبة
      - تقديم المشورة للفرق بشأن البيئات الآمنة، مثل بيئات البحث الموثوقة
    expert: |
      يمكنك:
      - وضع معايير المؤسسة لإزالة الهوية وضبط الإفصاح
      - ضمان إصدارات البيانات ومشاريع الربط عالية المخاطر
      - قيادة العمل مع الشركاء على الوصول الآمن إلى البيانات لأغراض البحث والتخطيط
