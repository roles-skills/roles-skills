# Band outlines in Arabic. Keys are the English band ids. Band names keep
# their Latin ids, such as 8a, to match the URLs and the other locales.
"1":
  title: الفئة 1
  stage: مبتدئ
  knowledge: مهارات أساسية في القراءة والكتابة والحساب؛ يتعلم مهامّ روتينية بسيطة أثناء العمل.
  autonomy: يتبع تعليمات واضحة؛ ويُراجَع عمله كثيرًا.
  scope: مهامه الروتينية الخاصة.
  leadership: لا شيء.
  accountability: إنجاز المهام الروتينية بدقة.
"2":
  title: الفئة 2
  stage: دعم
  knowledge: يعرف الأعمال الروتينية والإجراءات في مجال عمله؛ وقد يحمل مؤهلًا مبتدئًا.
  autonomy: يعمل وفق إجراءات محددة، مع توافر الإشراف.
  scope: مهامه الخاصة ضمن فريق.
  leadership: قد يُعرّف الموظفين الجدد بالمهام الروتينية.
  accountability: جودة عمله الروتيني الخاص وإنجازه في الوقت المحدد.
"3":
  title: الفئة 3
  stage: دعم
  knowledge: معرفة بمجموعة من الإجراءات، بعضها غير روتيني؛ وعادةً مؤهل من المستوى 3 أو خبرة معادلة.
  autonomy: يعمل ضمن الإجراءات؛ ويقرر كيف ينظم عمله الخاص؛ ويرفع المشكلات إلى من هو أعلى.
  scope: عمله الخاص وبعض المهام للفريق الأوسع.
  leadership: قد يوزع العمل الروتيني أو يدرّب الآخرين على الإجراءات.
  accountability: دقة عمله الخاص ودقة السجلات التي يحتفظ بها.
"4":
  title: الفئة 4
  stage: دعم وممارس مبتدئ
  knowledge: معرفة تفصيلية بمجال العمل، عادةً من درجة تأسيسية أو تدريب مهني أو خبرة معادلة.
  autonomy: يعمل ضمن إرشادات؛ ويحل معظم المشكلات اليومية؛ ويكون المدير متاحًا للمشورة.
  scope: عمله الخاص وخدمة أو عملية محددة.
  leadership: قد يشرف على فريق صغير أو ينسق عمل الآخرين.
  accountability: تقديم خدمة أو عملية محددة.
"5":
  title: الفئة 5
  stage: ممارس
  knowledge: معرفة مهنية أو تقنية، عادةً من درجة جامعية أو خبرة معادلة.
  autonomy: يعمل وفق أهداف عامة ضمن المعايير المهنية؛ ويخطط لعمله الخاص.
  scope: عمله المهني الخاص ضمن فريق أو منتج.
  leadership: قد يوجّه عمل موظفي الدعم والمتدربين المهنيين ويراجعه.
  accountability: جودة عمله المهني الخاص.
"6":
  title: الفئة 6
  stage: ممارس متمرس
  knowledge: معرفة متخصصة بمجموعة من الإجراءات، اكتُسبت من تدريب إضافي أو من الخبرة.
  autonomy: يعمل باستقلالية؛ ويفسّر السياسات في مجاله؛ ويطلب المشورة في المسائل المعقدة.
  scope: منتج أو خدمة أو مسار عمل.
  leadership: قد يقود فريقًا صغيرًا أو يرشد زملاءه.
  accountability: نتائج مسار عمله وجودة المشورة التي يقدمها.
"7":
  title: الفئة 7
  stage: أول أو متخصص
  knowledge: معرفة متخصصة متقدمة جدًا، عادةً بمستوى الماجستير أو خبرة معادلة.
  autonomy: يعمل وفق سياسات المؤسسة؛ ويقرر كيف تتحقق النتائج؛ وهو الخبير الذي يستشيره الآخرون.
  scope: عدة منتجات أو خدمات، أو وظيفة متخصصة.
  leadership: يقود فريقًا أو مجال ممارسة مهنية.
  accountability: تقديم خدمة أو وظيفة متخصصة، وميزانيتها إن وُجدت.
8a:
  title: الفئة 8a
  stage: قائد
  knowledge: معرفة خبيرة بتخصص ما وبإدارته.
  autonomy: يفسّر سياسات المؤسسة لخدمة ما؛ ويحدد توجه الفريق.
  scope: مجال خدمة أو تخصص على مستوى المؤسسة.
  leadership: يدير فريقًا، أو يقود تخصصًا دون إدارة مباشرة للموظفين.
  accountability: مجال خدمة وموظفوه وميزانيته.
8b:
  title: الفئة 8b
  stage: قائد
  knowledge: معرفة خبيرة بعدة تخصصات أو بخدمة كبيرة.
  autonomy: يشكّل السياسات والاستراتيجية لمجال كبير.
  scope: عدة خدمات أو فرق، أو تخصص على المستوى الرئيسي.
  leadership: يدير مديرين، أو هو المرجع الرئيسي في تخصص ما.
  accountability: عدة خدمات وموظفوها وميزانياتها.
8c:
  title: الفئة 8c
  stage: قائد أول
  knowledge: معرفة خبيرة، وفهم واسع للمؤسسة والقطاع.
  autonomy: يضع استراتيجية وظيفة ما؛ ويُساءَل أمام مدير.
  scope: وظيفة أو إدارة.
  leadership: يقود وظيفة عبر عدة مستويات إدارية.
  accountability: أداء وظيفة ما وقوتها العاملة وميزانيتها.
8d:
  title: الفئة 8d
  stage: قائد أول
  knowledge: معرفة استراتيجية عبر الوظائف وعبر منظومة الصحة والرعاية الأوسع.
  autonomy: يشكّل الاستراتيجية على مستوى المؤسسة؛ وينوب عن مدير.
  scope: وظيفة رئيسية أو عدة وظائف.
  leadership: يقود عدة وظائف أو إدارة كبيرة.
  accountability: وظائف رئيسية وميزانيات كبيرة ومخاطر على مستوى المؤسسة.
"9":
  title: الفئة 9
  stage: رئيس مهنة أو مدير
  knowledge: خبرة استراتيجية وقيادة على مستوى المنظومة.
  autonomy: يضع استراتيجية المؤسسة مع الفريق التنفيذي.
  scope: المؤسسة وشركاؤها عبر المنظومة.
  leadership: يقود مهنة أو مديرية.
  accountability: النتائج والميزانيات والمخاطر على مستوى المؤسسة.
