# Job evaluation factors in Arabic. Keys are the English factor ids.
communication:
  name: مهارات التواصل وبناء العلاقات
  description: المهارات اللازمة للتواصل مع الزملاء والمرضى والجمهور والشركاء وبناء العلاقات معهم. ويراعي مدى تعقيد المعلومات أو حساسيتها أو إثارتها للخلاف، وأي عوائق أمام فهمها أو تقبّلها.
  levels:
    "1": يقدّم المعلومات الروتينية ويتلقاها شفهيًا، ومعظم ذلك مع الزملاء.
    "2": يقدّم المعلومات الروتينية ويتلقاها شفهيًا أو كتابيًا أو إلكترونيًا، مع الزملاء وغيرهم.
    "3": يقدّم معلومات روتينية تحتاج إلى لباقة أو إقناع، أو معلومات معقدة أو حساسة، أو تدريبًا بسيطًا لمجموعات.
    "4": يقدّم معلومات معقدة أو حساسة أو مثيرة للخلاف تحتاج إلى مهارات الإقناع أو التفاوض أو التدريب، أو معلومات شديدة التعقيد.
    "5": يقدّم معلومات شديدة التعقيد أو مثيرة للخلاف تحتاج إلى مهارات متقدمة في الإقناع والتفاوض، أو يقدّم عروضًا لمجموعات كبيرة، أو يتواصل حيث توجد عوائق كبيرة أمام التقبّل.
    "6": يقدّم معلومات شديدة التعقيد وشديدة الإثارة للخلاف حيث توجد عوائق كبيرة أمام التقبّل، مستخدمًا أعلى مستويات مهارات التواصل.
knowledge:
  name: المعرفة والتدريب والخبرة
  description: المعرفة والخبرة اللازمتان لأداء الوظيفة، من أي مصدر، بما في ذلك التدريب الرسمي والمؤهلات والخبرة.
  levels:
    "1": بضعة إجراءات روتينية، تُتعلَّم أثناء العمل في فترة تعريف قصيرة.
    "2": مجموعة من الإجراءات الروتينية، تُتعلَّم من خلال التدريب أثناء العمل وفترة التعريف.
    "3": مجموعة من الإجراءات، بعضها غير روتيني، تحتاج إلى أساس نظري (مثل مؤهل من المستوى 3 أو خبرة معادلة).
    "4": مجموعة من الإجراءات، معظمها غير روتيني، تحتاج إلى معرفة نظرية متوسطة (مثل درجة تأسيسية أو خبرة معادلة).
    "5": خبرة في تخصص ما، تستند إلى معرفة نظرية أو خبرة عملية (بمستوى الدرجة الجامعية أو ما يعادلها).
    "6": معرفة متخصصة تشمل نطاق التخصص كله (بمستوى الدبلوم العالي أو ما يعادله).
    "7": معرفة متخصصة متقدمة جدًا تشمل نطاق التخصص كله (بمستوى الماجستير أو ما يعادله).
    "8": معرفة متقدمة (دكتوراه مع تدريب إضافي أو ما يعادلها)، أو معرفة متخصصة في أكثر من تخصص اكتُسبت على مدى فترة طويلة.
analytical:
  name: مهارات التحليل والتقدير
  description: التحليل والتقدير اللازمان لمعالجة المعلومات وحل المشكلات واتخاذ القرارات.
  levels:
    "1": أحكام على حقائق أو مواقف بسيطة.
    "2": أحكام على حقائق أو مواقف، بعضها يحتاج إلى تحليل.
    "3": أحكام على مجموعة من الحقائق أو المواقف تحتاج إلى تحليل أو مقارنة بين الخيارات.
    "4": أحكام على حقائق أو مواقف معقدة تحتاج إلى تحليل وتفسير ومقارنة بين الخيارات.
    "5": أحكام على حقائق أو مواقف شديدة التعقيد تحتاج إلى تحليل وتفسير ومقارنة بين الخيارات.
planning:
  name: مهارات التخطيط والتنظيم
  description: التخطيط والتنظيم اللازمان لإدارة الأنشطة أو البرامج أو الخدمات أو الاستراتيجيات.
  levels:
    "1": ينظم عمله اليومي.
    "2": يخطط لمهام أو أنشطة بسيطة، بعضها مستمر.
    "3": يخطط لعدة أنشطة معقدة، ويعدّل الخطط حسب الحاجة.
    "4": يخطط لطيف واسع من الأنشطة أو الاستراتيجيات المعقدة، ويعدّلها حسب الحاجة.
    "5": يضع خططًا استراتيجية طويلة الأجل، في ظل عدم اليقين ومع آثار تشمل المؤسسة كلها.
physical-skills:
  name: المهارات البدنية
  description: المهارات البدنية اللازمة، مثل البراعة اليدوية والتنسيق ومهارات لوحة المفاتيح والقيادة.
  levels:
    "1": حاجة قليلة إلى المهارات البدنية.
    "2": مهارات مكتسبة بالممارسة، مثل الاستخدام المعتاد للوحة المفاتيح أو القيادة.
    "3": مهارات متطورة تحتاج إلى السرعة أو الدقة، مثل الاستخدام المتقدم للوحة المفاتيح.
    "4": مهارات متطورة جدًا تحتاج إلى الإتقان أو السرعة وتنسيق عالٍ بين اليد والعين.
    "5": أعلى مستوى من الإتقان والسرعة والتنسيق.
patient-care:
  name: المسؤولية عن رعاية المرضى والعملاء
  description: المسؤولية عن تقييم المرضى والعملاء أو علاجهم أو رعايتهم أو تقديم المشورة لهم. وفي معظم الأدوار الرقمية والمؤسسية يقتصر ذلك على الاتصال العَرَضي.
  levels:
    "1": يساعد المرضى أو العملاء أو الأقارب أثناء الاتصال العَرَضي.
    "2": يقدّم مشورة أو معلومات أو خدمات عامة غير سريرية مباشرة إلى المرضى أو الجمهور.
    "3": يقدّم رعاية شخصية، أو خدمات تقنية سريرية أساسية، أو مشورة سريرية أساسية.
    "4": يقدّم رعاية سريرية، أو خدمات تقنية سريرية، أو مشورة بشأن رعاية المرضى.
    "5": يطوّر برامج رعاية، أو يقدّم خدمات تقنية سريرية متخصصة، أو مشورة متخصصة بشأن رعاية المرضى.
    "6": يطوّر رعاية متخصصة، أو يقدّم مشورة عالية التخصص، أو يُساءَل عن جزء من خدمة سريرية.
    "7": يُساءَل عن تقديم خدمة سريرية أو خدمة رعاية.
    "8": مسؤولية مؤسسية عن الخدمات السريرية أو خدمات الرعاية.
policy:
  name: المسؤولية عن تطوير السياسات والخدمات
  description: المسؤولية عن تطوير السياسات والخدمات وتنفيذها، ومدى امتداد آثارها.
  levels:
    "1": يتبع سياسات يضعها آخرون؛ وقد يعلّق على التغييرات.
    "2": ينفّذ السياسات في مجاله ويقترح تغييرات على ممارساته.
    "3": ينفّذ السياسات في مجاله ويقترح تغييرات تؤثر في مجالات أخرى.
    "4": ينفّذ السياسات ويطوّر سياسات أو خدمات لخدمة واحدة أو لعدة مجالات.
    "5": ينفّذ ويطوّر مجموعة من السياسات أو الخدمات لمديرية.
    "6": مسؤولية مؤسسية عن تطوير سياسات أو خدمات رئيسية على مستوى المؤسسة أو خارجها.
financial-resources:
  name: المسؤولية عن الموارد المالية والمادية
  description: المسؤولية عن الأموال والميزانيات والمعدات والمخزون والمباني والأصول الأخرى.
  levels:
    "1": يعتني شخصيًا بالمعدات والموارد المستخدمة في عمله.
    "2": يتعامل مع النقد أو الأشياء الثمينة، أو يعتني بمعدات يستخدمها آخرون، أو يراقب المخزون، أو يعتمد مدفوعات صغيرة.
    "3": يعتمد المدفوعات، أو يشتري بعض الأصول أو المستلزمات، أو يراقب ميزانية مفوَّضة أو يتولاها، أو يصون الأصول.
    "4": يتولى ميزانية إدارة أو خدمة أو يضعها، أو يشتري أصولها أو يصونها.
    "5": يتولى ميزانيات عدة خدمات أو يضعها، أو يدير أصولها.
    "6": مسؤولية مؤسسية عن الشؤون المالية للمؤسسة أو أصولها.
people:
  name: المسؤولية عن الأفراد
  description: المسؤولية عن إدارة الموظفين أو الإشراف عليهم أو تدريبهم أو تطويرهم، أو عن تقديم خدمات الموارد البشرية.
  levels:
    "1": يعرّف الزملاء الجدد أو الأقل خبرة بإجراءات عمله.
    "2": يشرف على الموظفين أو ينسق عملهم يوميًا، أو يدرّب الآخرين بانتظام، أو يقدّم مشورة أساسية في الموارد البشرية.
    "3": يدير مجموعة من الموظفين يوميًا، أو يقدّم تدريبًا أساسيًا أو متخصصًا، أو يقدّم مشورة جوهرية في الموارد البشرية.
    "4": يتولى الإدارة المباشرة لوظيفة أو إدارة، أو يصمم برامج تدريبية بوصفها مهمة رئيسية، أو يقدّم طيفًا كاملًا من خدمات الموارد البشرية.
    "5": يتولى الإدارة المباشرة لعدة إدارات، أو يدير التدريب أو جزءًا كبيرًا من الموارد البشرية على مستوى المؤسسة.
    "6": مسؤولية مؤسسية عن الأفراد في المؤسسة أو عن وظيفة الموارد البشرية فيها.
information-resources:
  name: المسؤولية عن موارد المعلومات
  description: المسؤولية عن المعلومات وأنظمة المعلومات، الورقية أو الرقمية، بما في ذلك السجلات والبيانات والأنظمة التي تحفظها.
  levels:
    "1": يسجّل المعلومات التي ينتجها شاغل الوظيفة.
    "2": يُدخل أو يحفظ بيانات جمعها آخرون، أو يكتب أحيانًا تقارير أو استعلامات.
    "3": يدوّن محاضر رسمية، أو يكتب بانتظام تقارير أو استعلامات، أو يصون أنظمة المعلومات بوصف ذلك مهمة مهمة.
    "4": يكيّف أنظمة المعلومات أو يصممها وفق مواصفات يضعها آخرون، أو يشغّل أنظمة المعلومات لإدارة ما بوصف ذلك مهمته الرئيسية.
    "5": يصمم أنظمة معلومات رئيسية ويطوّرها، أو يشغّل أنظمة المعلومات لعدة خدمات بوصف ذلك مهمته الرئيسية.
    "6": يدير أنظمة المعلومات ويطوّرها على مستوى المؤسسة بوصف ذلك مهمته الرئيسية.
    "7": مسؤولية مؤسسية عن أنظمة المعلومات في المؤسسة.
research:
  name: المسؤولية عن البحث والتطوير
  description: المسؤولية عن البحث الرسمي والتطوير والتقييم والتدقيق والاختبار والتجارب.
  levels:
    "1": يجري مسوحات أو عمليات تدقيق لعمله الخاص؛ ويشارك أحيانًا في بحث أو اختبار.
    "2": يجري بانتظام بحثًا أو تطويرًا أو تجارب أو اختبارًا للمعدات والأنظمة ضمن عمله.
    "3": يجري بحثًا أو تطويرًا ضمن برامج رسمية بوصف ذلك مهمة رئيسية.
    "4": ينسق برامج البحث والتطوير وينفّذها.
    "5": يطلق برامج بحث وتطوير ويطوّرها دعمًا لأهداف المؤسسة.
    "6": يطلق برامج بحث وتطوير ويطوّرها بآثار تتجاوز المؤسسة.
freedom-to-act:
  name: حرية التصرف
  description: مدى قدرة شاغل الوظيفة على تقرير ما يفعله وكيف يفعله، ومدى قرب الإشراف على عمله.
  levels:
    "1": يعمل ضمن إجراءات محددة، مع إشراف قريب.
    "2": يتبع الإجراءات المعتادة والسوابق؛ وعادةً يتوافر من يُسأل؛ وقد يُراجَع العمل.
    "3": يتبع سياسات وإجراءات محددة؛ ويُدار العمل ولا يُشرَف عليه إشرافًا مباشرًا.
    "4": النتائج محددة، لكن شاغل الوظيفة يقرر كيف يحققها، ضمن سياسات عامة.
    "5": يعمل ضمن سياسات عامة، ويقرر في معظم الحالات كيف يفسرها.
    "6": يفسّر السياسة والاستراتيجية العامة لوضع الأهداف والمعايير.
physical-effort:
  name: الجهد البدني
  description: الجهد البدني اللازم، مع مراعاة تكراره ومدته وشدته.
  levels:
    "1": الجلوس والوقوف والمشي، مع جهد بدني قليل.
    "2": الجلوس أو الوقوف كثيرًا في وضعية مقيّدة، أو جهد خفيف إلى متوسط أحيانًا.
    "3": جهد خفيف متكرر لفترات طويلة، أو جهد متوسط متكرر لفترات قصيرة.
    "4": جهد خفيف مستمر، أو جهد متوسط متكرر لفترات طويلة، أو جهد شديد أحيانًا.
    "5": جهد متوسط مستمر، أو جهد شديد متكرر.
mental-effort:
  name: الجهد الذهني
  description: التركيز اللازم، مع مراعاة تكراره ومدته ومدى قابلية العمل للتوقع.
  levels:
    "1": انتباه عام؛ وتركيز أحيانًا على عمل يمكن توقعه.
    "2": تركيز متكرر على عمل يمكن توقعه، أو تركيز أحيانًا على عمل لا يمكن توقعه.
    "3": تركيز متكرر على عمل لا يمكن توقعه، أو تركيز مطوّل أحيانًا.
    "4": تركيز مطوّل متكرر، أو تركيز شديد أحيانًا.
    "5": تركيز شديد متكرر.
emotional-effort:
  name: الجهد العاطفي
  description: المتطلبات العاطفية للوظيفة، من التعرض المباشر أو غير المباشر لظروف مؤلمة، مثل قراءة سجلات حالات مؤلمة أو التعامل مع حوادث خطيرة.
  levels:
    "1": تعرض نادر، أو تعرض غير مباشر أحيانًا، لظروف مؤلمة.
    "2": تعرض أحيانًا، أو تعرض غير مباشر متكرر، لظروف مؤلمة.
    "3": تعرض متكرر لظروف مؤلمة، أو تعرض أحيانًا لظروف مؤلمة جدًا.
    "4": تعرض أحيانًا لظروف صادمة، أو تعرض متكرر لظروف مؤلمة جدًا.
working-conditions:
  name: ظروف العمل
  description: التعرض لظروف مزعجة أو لمخاطر. ويُحتسب استخدام الشاشة شبه المتواصل في معظم الأيام عند المستوى 2.
  levels:
    "1": تعرض نادر لظروف مزعجة.
    "2": ظروف مزعجة أحيانًا، أو سفر متكرر أو عمل في الهواء الطلق، أو استخدام شبه متواصل للشاشة في معظم الأيام.
    "3": ظروف مزعجة متكررة، أو ظروف مزعجة جدًا أحيانًا.
    "4": بعض التعرض للمخاطر، أو ظروف مزعجة جدًا متكررة.
    "5": تعرض كبير للمخاطر.
