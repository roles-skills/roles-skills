# Band outlines in Hindi. Keys are the English band ids.
"1":
  title: बैंड 1
  stage: प्रवेश
  knowledge: बुनियादी साक्षरता और अंक ज्ञान; काम करते हुए सरल नियमित कार्य सीखता है।
  autonomy: स्पष्ट निर्देशों का पालन करता है; काम की अक्सर जाँच होती है।
  scope: अपने नियमित कार्य।
  leadership: कोई नहीं।
  accountability: नियमित कार्यों को सटीकता से पूरा करना।
"2":
  title: बैंड 2
  stage: सहायता
  knowledge: कार्य क्षेत्र की दिनचर्या और प्रक्रियाओं को जानता है; प्रवेश स्तर की योग्यता हो सकती है।
  autonomy: निर्धारित प्रक्रियाओं के अनुसार काम करता है, पर्यवेक्षण उपलब्ध रहता है।
  scope: टीम के भीतर अपने कार्य।
  leadership: नए कर्मचारियों को नियमित कार्य दिखा सकता है।
  accountability: अपने नियमित काम की गुणवत्ता और समयबद्धता।
"3":
  title: बैंड 3
  stage: सहायता
  knowledge: कई प्रक्रियाओं का ज्ञान, जिनमें कुछ गैर-नियमित हैं; आमतौर पर स्तर 3 की योग्यता या समकक्ष अनुभव।
  autonomy: प्रक्रियाओं के भीतर काम करता है; अपना काम व्यवस्थित करने का निर्णय स्वयं लेता है; समस्याएँ ऊपर भेजता है।
  scope: अपना काम और व्यापक टीम के कुछ कार्य।
  leadership: नियमित काम बाँट सकता है या दूसरों को प्रक्रियाओं का प्रशिक्षण दे सकता है।
  accountability: अपने काम और रखे गए अभिलेखों की सटीकता।
"4":
  title: बैंड 4
  stage: सहायता और प्रवेश स्तर का अभ्यासकर्ता
  knowledge: कार्य क्षेत्र का विस्तृत ज्ञान, आमतौर पर फ़ाउंडेशन डिग्री, अप्रेंटिसशिप या समकक्ष अनुभव से।
  autonomy: दिशानिर्देशों के भीतर काम करता है; अधिकांश दैनिक समस्याएँ सुलझाता है; सलाह के लिए प्रबंधक उपलब्ध रहता है।
  scope: अपना काम और एक परिभाषित सेवा या प्रक्रिया।
  leadership: एक छोटी टीम का पर्यवेक्षण या दूसरों के काम का समन्वय कर सकता है।
  accountability: एक परिभाषित सेवा या प्रक्रिया की डिलीवरी।
"5":
  title: बैंड 5
  stage: अभ्यासकर्ता
  knowledge: पेशेवर या तकनीकी ज्ञान, आमतौर पर डिग्री या समकक्ष अनुभव से।
  autonomy: पेशेवर मानकों के भीतर व्यापक उद्देश्यों के अनुसार काम करता है; अपने काम की योजना बनाता है।
  scope: टीम या उत्पाद के भीतर अपना पेशेवर काम।
  leadership: सहायक कर्मचारियों और अप्रेंटिस के काम का मार्गदर्शन और जाँच कर सकता है।
  accountability: अपने पेशेवर काम की गुणवत्ता।
"6":
  title: बैंड 6
  stage: अनुभवी अभ्यासकर्ता
  knowledge: अतिरिक्त प्रशिक्षण या अनुभव से विकसित, कई प्रक्रियाओं में विशेषज्ञ ज्ञान।
  autonomy: स्वतंत्र रूप से काम करता है; अपने क्षेत्र के लिए नीति की व्याख्या करता है; जटिल मुद्दों पर सलाह लेता है।
  scope: एक उत्पाद, सेवा या कार्यधारा।
  leadership: एक छोटी टीम का नेतृत्व या सहकर्मियों का मार्गदर्शन कर सकता है।
  accountability: अपनी कार्यधारा के परिणाम और दी गई सलाह की गुणवत्ता।
"7":
  title: बैंड 7
  stage: वरिष्ठ या विशेषज्ञ
  knowledge: अत्यधिक विकसित विशेषज्ञ ज्ञान, आमतौर पर स्नातकोत्तर (मास्टर) स्तर या समकक्ष अनुभव।
  autonomy: संगठन की नीति के अनुसार काम करता है; परिणाम कैसे प्राप्त हों, यह तय करता है; दूसरे इससे विशेषज्ञ सलाह लेते हैं।
  scope: कई उत्पाद या सेवाएँ, या एक विशेषज्ञ कार्य।
  leadership: एक टीम या पेशेवर अभ्यास क्षेत्र का नेतृत्व करता है।
  accountability: एक सेवा या विशेषज्ञ कार्य की डिलीवरी, और यदि हो तो उसका बजट।
"8a":
  title: बैंड 8a
  stage: प्रमुख
  knowledge: किसी विधा और उसके प्रबंधन का विशेषज्ञ ज्ञान।
  autonomy: किसी सेवा के लिए संगठन की नीति की व्याख्या करता है; टीम की दिशा तय करता है।
  scope: एक सेवा क्षेत्र, या पूरे संगठन में एक विधा।
  leadership: एक टीम का प्रबंधन करता है, या लाइन प्रबंधन के बिना किसी विधा का नेतृत्व करता है।
  accountability: एक सेवा क्षेत्र, उसके कर्मचारी और उसका बजट।
"8b":
  title: बैंड 8b
  stage: प्रमुख
  knowledge: कई विधाओं या एक बड़ी सेवा का विशेषज्ञ ज्ञान।
  autonomy: एक बड़े क्षेत्र के लिए नीति और रणनीति को आकार देता है।
  scope: कई सेवाएँ या टीमें, या प्रधान स्तर की एक विधा।
  leadership: प्रबंधकों का प्रबंधन करता है, या किसी विधा में प्रधान प्राधिकारी होता है।
  accountability: कई सेवाएँ, उनके कर्मचारी और उनके बजट।
"8c":
  title: बैंड 8c
  stage: वरिष्ठ प्रमुख
  knowledge: विशेषज्ञ ज्ञान, और संगठन तथा क्षेत्र की व्यापक समझ।
  autonomy: किसी कार्य के लिए रणनीति तय करता है; किसी निदेशक के प्रति जवाबदेह होता है।
  scope: एक कार्य या विभाग।
  leadership: कई प्रबंधन स्तरों के माध्यम से किसी कार्य का नेतृत्व करता है।
  accountability: किसी कार्य का प्रदर्शन, कार्यबल और बजट।
"8d":
  title: बैंड 8d
  stage: वरिष्ठ प्रमुख
  knowledge: विभिन्न कार्यों और व्यापक स्वास्थ्य एवं देखभाल प्रणाली का रणनीतिक ज्ञान।
  autonomy: पूरे संगठन की रणनीति को आकार देता है; किसी निदेशक का प्रतिनिधित्व करता है।
  scope: एक प्रमुख कार्य या कई कार्य।
  leadership: कई कार्यों या एक बड़े विभाग का नेतृत्व करता है।
  accountability: प्रमुख कार्य, बड़े बजट और पूरे संगठन के जोखिम।
"9":
  title: बैंड 9
  stage: पेशे का प्रमुख या निदेशक
  knowledge: रणनीतिक विशेषज्ञता और पूरी प्रणाली का नेतृत्व।
  autonomy: कार्यकारी टीम के साथ संगठन की रणनीति तय करता है।
  scope: संगठन, और पूरी प्रणाली में उसके साझेदार।
  leadership: किसी पेशे या निदेशालय का नेतृत्व करता है।
  accountability: पूरे संगठन के परिणाम, बजट और जोखिम।
