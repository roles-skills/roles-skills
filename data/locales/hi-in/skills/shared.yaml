# Hindi translations of data/skills/shared.yaml. Keys are the English skill ids.
health-care-context:
  name: स्वास्थ्य और देखभाल सेवाओं की समझ
  description: यह समझना कि स्वास्थ्य और देखभाल सेवाएँ कैसे संगठित और प्रदान की जाती हैं, चिकित्सक और देखभाल कर्मचारी कैसे काम करते हैं, और डिजिटल सेवाएँ रोगी देखभाल में कैसे सहायक होती हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - स्वास्थ्य और देखभाल प्रणाली के मुख्य भागों और संगठन द्वारा समर्थित सेवाओं का वर्णन करना
      - समझाना कि आपके काम में रोगी सुरक्षा और गोपनीयता क्यों महत्वपूर्ण हैं
    working: |
      आप ये कर सकते हैं:
      - उन क्लिनिकल और देखभाल कार्यप्रवाहों को समझाना जिनमें आपका काम सहायक है
      - क्लिनिकल और देखभाल सहकर्मियों के साथ सामान्य स्वास्थ्य सेवा शब्दों का सही प्रयोग करना
      - पहचानना कि कब कोई परिवर्तन रोगी देखभाल को प्रभावित कर सकता है, और उसे उठाना
    practitioner: |
      आप ये कर सकते हैं:
      - विश्लेषण करना कि कोई सेवा विभिन्न संगठनों के देखभाल मार्गों में कैसे बैठती है
      - डिजिटल सेवाओं को आकार देने के लिए चिकित्सकों, देखभाल कर्मचारियों और रोगियों के साथ काम करना
      - देखभाल, सुरक्षा और कर्मचारियों के कार्यभार पर डिजिटल निर्णयों का प्रभाव समझाना
    expert: |
      आप ये कर सकते हैं:
      - स्वास्थ्य और देखभाल प्रणाली की गहरी समझ के आधार पर संगठन की रणनीति को आकार देना
      - स्वास्थ्य और देखभाल साझेदारों और प्रमुखों के समक्ष संगठन का प्रतिनिधित्व करना
      - अनुमान लगाना कि नीति और सेवा में परिवर्तन डिजिटल सेवाओं और देखभाल को कैसे प्रभावित करेंगे
clinical-safety:
  name: क्लिनिकल जोखिम प्रबंधन
  description: क्लिनिकल जोखिम प्रबंधन प्रक्रिया, ख़तरा लॉग और सुरक्षा केस के माध्यम से (उदाहरण के लिए ISO 14971 और IEC 80001-1 के अनुसार) उन जोखिमों की पहचान, आकलन और नियंत्रण करना जो स्वास्थ्य आईटी प्रणालियाँ रोगियों के लिए पैदा कर सकती हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि स्वास्थ्य आईटी प्रणालियाँ रोगियों को कैसे नुकसान पहुँचा सकती हैं, उदाहरण के लिए ग़लत, गायब या विलंबित जानकारी से
      - संभावित क्लिनिकल सुरक्षा मुद्दे की रिपोर्ट सही माध्यम से करना
    working: |
      आप ये कर सकते हैं:
      - ख़तरा कार्यशालाओं में भाग लेना और ख़तरा लॉग में योगदान देना
      - अपने काम के लिए क्लिनिकल जोखिम प्रबंधन प्रक्रिया का पालन करना
      - क्लिनिकल सुरक्षा केस के लिए परीक्षण परिणाम जैसे साक्ष्य देना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी उत्पाद या परिवर्तन के लिए ख़तरा पहचान और जोखिम आकलन का नेतृत्व करना
      - ख़तरा लॉग और क्लिनिकल सुरक्षा केस रिपोर्ट लिखना और बनाए रखना
      - उत्पाद टीमों के साथ जोखिम नियंत्रणों पर सहमति बनाना और जाँचना कि वे काम करते हैं
      - क्लिनिकल जोखिम प्रबंधन मानकों को लागू करने पर टीमों को सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की क्लिनिकल जोखिम प्रबंधन प्रणाली का स्वामित्व रखना
      - क्लिनिकल सुरक्षा नीति तय करना और प्रमुख प्रणालियों के सुरक्षा केस का आश्वासन देना
      - स्वास्थ्य आईटी से जुड़ी गंभीर सुरक्षा घटनाओं के जवाब का नेतृत्व करना
      - डिजिटल टीमों में क्लिनिकल सुरक्षा की संस्कृति बनाना
health-data-interoperability:
  name: स्वास्थ्य डेटा अंतर-संचालनीयता
  description: HL7 FHIR, HL7 संस्करण 2, IHE प्रोफ़ाइल और मानक API जैसे खुले मानकों का उपयोग करके प्रणालियों के बीच स्वास्थ्य और देखभाल डेटा का सुरक्षित और एकरूप आदान-प्रदान करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि समन्वित देखभाल के लिए अंतर-संचालनीयता क्यों महत्वपूर्ण है
      - HL7 FHIR जैसे मुख्य स्वास्थ्य डेटा विनिमय मानकों के नाम बताना
    working: |
      आप ये कर सकते हैं:
      - FHIR संसाधन, प्रोफ़ाइल और API पढ़ना और उनका उपयोग करना
      - मार्गदर्शन में सरल इंटीग्रेशन बनाना या उनका परीक्षण करना
      - किसी विनिर्देश के आधार पर संदेशों की जाँच करना
    practitioner: |
      आप ये कर सकते हैं:
      - FHIR, HL7 संस्करण 2 और संदेश पैटर्न का उपयोग करके इंटीग्रेशन डिज़ाइन करना और बनाना
      - FHIR संसाधन और कार्यान्वयन गाइड लिखना और उनकी प्रोफ़ाइल बनाना
      - प्रणालियों के बीच जटिल मैपिंग और डेटा गुणवत्ता समस्याओं को सुलझाना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए अंतर-संचालनीयता मानक और रणनीति तय करना
      - राष्ट्रीय या अंतर-संगठनात्मक मानक कार्य का नेतृत्व करना
      - कई प्रणालियों में महत्वपूर्ण इंटीग्रेशन के डिज़ाइन का आश्वासन देना
clinical-terminology:
  name: क्लिनिकल शब्दावली और वर्गीकरण
  description: क्लिनिकल अर्थ को एकरूपता से दर्ज और साझा करने के लिए SNOMED CT, ICD और LOINC जैसी क्लिनिकल शब्दावलियों और वर्गीकरणों का उपयोग करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - क्लिनिकल शब्दावली और वर्गीकरण के बीच अंतर समझाना
      - SNOMED CT और ICD जैसी सामान्य शब्दावलियों को पहचानना
    working: |
      आप ये कर सकते हैं:
      - किसी डेटा आइटम या फ़ॉर्म के लिए सही कोड खोजना और उपयोग करना
      - शब्दावली ब्राउज़र और संदर्भ सेट का उपयोग करना
    practitioner: |
      आप ये कर सकते हैं:
      - क्लिनिकल शब्दावलियों का उपयोग करके डेटा मॉडल और संदर्भ सेट डिज़ाइन करना
      - शब्दावलियों और वर्गीकरणों के बीच मैपिंग करना, और मैपिंग की सीमाएँ समझाना
      - उत्पादों और एनालिटिक्स में शब्दावली के उपयोग पर टीमों को सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए शब्दावली नीति तय करना
      - शब्दावली रिलीज़, शासन और गुणवत्ता आश्वासन का नेतृत्व करना
      - शब्दावली मानक निकायों में संगठन का प्रतिनिधित्व करना
information-governance:
  name: सूचना शासन और डेटा संरक्षण
  description: व्यक्तिगत और स्वास्थ्य जानकारी को विधिपूर्वक, सुरक्षित और नैतिक रूप से संभालना, जिसमें डेटा संरक्षण कानून, गोपनीयता, सहमति, डेटा संरक्षण प्रभाव आकलन और सूचना साझाकरण शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - व्यक्तिगत और स्वास्थ्य जानकारी संभालने के संगठन के नियमों का पालन करना
      - डेटा उल्लंघन या बाल-बाल बची घटना को पहचानना और रिपोर्ट करना
    working: |
      आप ये कर सकते हैं:
      - अपने काम में डेटा संरक्षण सिद्धांत लागू करना
      - डेटा संरक्षण प्रभाव आकलनों में योगदान देना
      - सूचना अनुरोधों और अभिलेखों को सही ढंग से संभालना
    practitioner: |
      आप ये कर सकते हैं:
      - डेटा संरक्षण प्रभाव आकलनों और सूचना साझाकरण समझौतों का नेतृत्व करना
      - विधिक आधार, सहमति, गोपनीयता और प्रतिधारण पर टीमों को सलाह देना
      - घटनाओं की जाँच करना और सुधारों की सिफ़ारिश करना
    expert: |
      आप ये कर सकते हैं:
      - सूचना शासन नीति और रणनीति तय करना
      - सूचना जोखिम और अनुपालन पर बोर्ड को सलाह देना
      - नियामकों और साझेदारों के समक्ष संगठन का प्रतिनिधित्व करना
medical-device-regulation:
  name: चिकित्सा उपकरण सॉफ़्टवेयर विनियमन
  description: यह समझना कि सॉफ़्टवेयर कब चिकित्सा उपकरण होता है, और उस पर लागू होने वाले मानक और प्रक्रियाएँ, जैसे IEC 62304 और ISO 13485।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि कुछ स्वास्थ्य सॉफ़्टवेयर चिकित्सा उपकरण के रूप में विनियमित होते हैं
      - जानना कि जब कोई उत्पाद चिकित्सा उपकरण हो सकता है तो किससे पूछना है
    working: |
      आप ये कर सकते हैं:
      - चिकित्सा उपकरण मानकों को पूरा करने वाली सॉफ़्टवेयर जीवनचक्र प्रक्रिया का पालन करना
      - ऐसी प्रक्रिया के लिए आवश्यक अभिलेख तैयार करना
    practitioner: |
      आप ये कर सकते हैं:
      - आकलन करना कि कोई उत्पाद चिकित्सा उपकरण है या नहीं, और उसकी संभावित श्रेणी क्या है
      - गुणवत्ता और क्लिनिकल सहकर्मियों के साथ किसी उत्पाद के नियामक कार्य की योजना बनाना
    expert: |
      आप ये कर सकते हैं:
      - विनियमित सॉफ़्टवेयर के प्रति संगठन का दृष्टिकोण तय करना
      - नियामकों और अधिसूचित निकायों के साथ संवाद का नेतृत्व करना
people-management:
  name: लोगों का प्रबंधन
  description: कर्मचारियों का नेतृत्व, विकास और समर्थन करना, जिसमें भर्ती, उद्देश्य, मूल्यांकन, कल्याण, उपस्थिति, और प्रदर्शन तथा आचरण का निष्पक्ष प्रबंधन शामिल है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - आप पर लागू होने वाली संगठन की कार्मिक नीतियाँ समझाना
      - नए सहकर्मियों की सहायता करना और ज्ञान साझा करना
    working: |
      आप ये कर सकते हैं:
      - दैनिक काम का पर्यवेक्षण करना और प्रतिक्रिया देना
      - भर्ती और प्रारंभिक प्रशिक्षण में भाग लेना
      - नियमित रूप से आमने-सामने बातचीत करना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी टीम का लाइन प्रबंधन करना, उद्देश्य तय करना और मूल्यांकन करना
      - कल्याण का समर्थन करना और उपस्थिति, प्रदर्शन तथा आचरण का प्रबंधन करना
      - टीम के विकास और उत्तराधिकार की योजना बनाना
    expert: |
      आप ये कर सकते हैं:
      - प्रबंधकों का नेतृत्व करना और किसी बड़े क्षेत्र की संस्कृति को आकार देना
      - कार्यबल योजनाएँ और संगठनात्मक परिवर्तन डिज़ाइन करना
      - प्रमुखों को कोचिंग देना और जटिल कार्मिक मुद्दों को सुलझाना
equality-diversity-inclusion:
  name: समानता, विविधता और समावेशन
  description: लोगों के साथ निष्पक्ष व्यवहार करना, विविधता को महत्व देना, और ऐसी सेवाएँ और कार्यस्थल डिज़ाइन करना जिनमें सभी शामिल हों।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - सहकर्मियों, रोगियों और जनता के साथ गरिमा और सम्मान से व्यवहार करना
      - समानता और समावेशन नीतियों का पालन करना
    working: |
      आप ये कर सकते हैं:
      - दूसरों को अलग-थलग करने वाले व्यवहार को पहचानना और चुनौती देना
      - अपने काम की योजना बनाते समय अलग-अलग आवश्यकताओं पर विचार करना
    practitioner: |
      आप ये कर सकते हैं:
      - समानता प्रभाव आकलन करना
      - समावेशी टीमें और कार्यप्रणालियाँ बनाना
    expert: |
      आप ये कर सकते हैं:
      - समावेशन रणनीति तय करना और संगठन को उसके प्रति जवाबदेह बनाना
      - समानता, विविधता और समावेशन पर सांस्कृतिक परिवर्तन का नेतृत्व करना
health-safety-wellbeing:
  name: स्वास्थ्य, सुरक्षा और कल्याण
  description: काम पर स्वयं और दूसरों को सुरक्षित और स्वस्थ रखना, जिसमें जोखिम आकलन, सुरक्षित कार्य पद्धतियाँ और घटना रिपोर्टिंग शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - स्वास्थ्य और सुरक्षा नियमों का पालन करना और ख़तरों तथा घटनाओं की रिपोर्ट करना
    working: |
      आप ये कर सकते हैं:
      - कार्यस्थल आकलन जैसे सरल जोखिम आकलन करना
      - सहकर्मियों को सुरक्षित रूप से काम करने में मदद करना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी टीम या स्थल के स्वास्थ्य और सुरक्षा का प्रबंधन करना
      - घटनाओं की जाँच करना और नियंत्रण लागू करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए स्वास्थ्य, सुरक्षा और कल्याण नीति तय करना
      - बोर्ड को सुरक्षा प्रदर्शन की रिपोर्ट देना
budget-management:
  name: बजट प्रबंधन
  description: बजट की योजना बनाना, उसकी निगरानी और नियंत्रण करना, जिसमें पूर्वानुमान, अंतरों का प्रबंधन और वित्तीय नियमों का पालन शामिल है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - ख़र्च और ऑर्डर करने के नियमों का पालन करना
      - समझाना कि आपके काम को धन कैसे मिलता है
    working: |
      आप ये कर सकते हैं:
      - किसी छोटे बजट के मुक़ाबले ख़र्च को ट्रैक करना और अंतर बताना
      - अपनी सीमा के भीतर ख़र्च स्वीकृत करना
    practitioner: |
      आप ये कर सकते हैं:
      - बजट रखना और उसका प्रबंधन करना, पूर्वानुमान लगाना और अंतरों की व्याख्या करना
      - लागत और लाभ सहित बिज़नेस केस तैयार करना
    expert: |
      आप ये कर सकते हैं:
      - बड़े या कई बजटों का प्रबंधन करना और वित्तीय योजनाएँ तय करना
      - विभिन्न सेवाओं के बीच धन संबंधी समझौते करना
project-management:
  name: परियोजना प्रबंधन
  description: PRINCE2, PM² या एजाइल दृष्टिकोण जैसी मान्यता प्राप्त पद्धति का उपयोग करके सहमत दायरे, समय, लागत और गुणवत्ता के अनुसार परियोजनाओं की योजना बनाना, उन्हें पूरा करना और बंद करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - किसी परियोजना के चरणों और उसकी मुख्य भूमिकाओं को समझाना
      - कार्रवाई लॉग जैसे परियोजना अभिलेख रखना
    working: |
      आप ये कर सकते हैं:
      - योजनाएँ, जोखिम और मुद्दा लॉग, और रिपोर्ट बनाए रखना
      - परियोजना बैठकें चलाना और कार्रवाइयों को ट्रैक करना
      - सहायता के साथ एक छोटी, स्पष्ट रूप से परिभाषित परियोजना का प्रबंधन करना
    practitioner: |
      आप ये कर सकते हैं:
      - दायरे, समय, लागत और गुणवत्ता को नियंत्रित करते हुए परियोजनाओं का शुरू से अंत तक प्रबंधन करना
      - जोखिमों, मुद्दों, निर्भरताओं और परिवर्तन नियंत्रण का प्रबंधन करना
      - परियोजना बोर्डों को रिपोर्ट देना और आपूर्तिकर्ताओं का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - बड़ी, जटिल या उच्च-जोखिम परियोजनाओं का प्रबंधन करना
      - परियोजना प्रबंधन मानक तय करना और परियोजना प्रबंधकों को कोचिंग देना
      - विफल हो रही परियोजनाओं को उबारना
risk-management:
  name: संगठनात्मक जोखिम प्रबंधन
  description: जोखिम रजिस्टर और परिभाषित जोखिम सहनशीलता का उपयोग करके संगठन के उद्देश्यों के जोखिमों की पहचान, आकलन, अभिलेखन और प्रबंधन करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि जोखिम क्या है और उसे कैसे उठाना है
    working: |
      आप ये कर सकते हैं:
      - अपने क्षेत्र के जोखिम दर्ज करना और अद्यतन करना
      - नियंत्रण सुझाना और कार्रवाइयों को ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी निदेशालय या कार्यक्रम के लिए जोखिम प्रक्रिया चलाना
      - जोखिम सहनशीलता के आधार पर जोखिमों का आकलन करना और उन्हें आगे बढ़ाना
      - समितियों को जोखिमों की रिपोर्ट देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन का जोखिम प्रबंधन ढाँचा और जोखिम सहनशीलता डिज़ाइन करना
      - रणनीतिक जोखिमों पर बोर्ड को सलाह देना
security-operations:
  name: सुरक्षा संचालन
  description: SIEM और एंडपॉइंट डिटेक्शन जैसे उपकरणों का उपयोग करके सुरक्षा ख़तरों के लिए प्रणालियों की निगरानी करना, अलर्ट की ट्राइएज करना, घटनाओं की जाँच करना और साइबर घटनाओं का जवाब देना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - फ़िशिंग और रैनसमवेयर जैसे सामान्य साइबर ख़तरों को समझाना
      - संदिग्ध सुरक्षा घटना की रिपोर्ट करना
    working: |
      आप ये कर सकते हैं:
      - अलर्ट की निगरानी करना और रनबुक का उपयोग करके उनकी ट्राइएज करना
      - साक्ष्य एकत्र करना और घटनाओं को आगे बढ़ाना
      - मार्गदर्शन में सरल डिटेक्शन नियमों को समायोजित करना
    practitioner: |
      आप ये कर सकते हैं:
      - सुरक्षा घटनाओं की जाँच करना और उन्हें नियंत्रित करना
      - डिटेक्शन नियम लिखना और ख़तरों की खोज (थ्रेट हंटिंग) करना
      - घटनाओं के बाद रनबुक और उपकरणों में सुधार करना
    expert: |
      आप ये कर सकते हैं:
      - सुरक्षा संचालन सेवा और उसकी रणनीति का नेतृत्व करना
      - प्रमुख साइबर घटनाओं के जवाब का नेतृत्व करना
      - राष्ट्रीय सुरक्षा एजेंसियों और साझेदारों के साथ काम करना
vulnerability-management:
  name: भेद्यता प्रबंधन
  description: तकनीकी भेद्यताओं को खोजना, उनका आकलन करना, उन्हें प्राथमिकता देना और ठीक करना, जिसमें स्कैनिंग, पेनिट्रेशन टेस्टिंग और पैचिंग शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि समय पर पैचिंग और सुरक्षित कॉन्फ़िगरेशन क्यों महत्वपूर्ण हैं
    working: |
      आप ये कर सकते हैं:
      - भेद्यता स्कैन चलाना और परिणामों की रिपोर्ट करना
      - प्रणाली स्वामियों के साथ सुधारों को ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - रोगी सेवाओं के जोखिम सहित, जोखिम के आधार पर भेद्यताओं को प्राथमिकता देना
      - पेनिट्रेशन टेस्ट और सुधार कार्य का दायरा तय करना और उनका प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - भेद्यता प्रबंधन नीति और उसके लक्ष्य तय करना
      - वरिष्ठ प्रमुखों को तकनीकी सुरक्षा जोखिम की रिपोर्ट देना
identity-and-access-management:
  name: पहचान और पहुँच प्रबंधन
  description: कर्मचारियों, रोगियों और प्रणालियों के लिए डिजिटल पहचान, प्रमाणीकरण और पहुँच अधिकारों का प्रबंधन करना, जिसमें भूमिका-आधारित पहुँच और स्मार्टकार्ड या बहु-कारक प्रमाणीकरण शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - पहुँच नियमों का पालन करना और अपने क्रेडेंशियल सुरक्षित रखना
    working: |
      आप ये कर सकते हैं:
      - उपयोगकर्ता खाते और पहुँच अधिकार बनाना, बदलना और हटाना
      - भूमिका-आधारित पहुँच नियमों के आधार पर पहुँच की जाँच करना
    practitioner: |
      आप ये कर सकते हैं:
      - पहचान और पहुँच सेवाएँ डिज़ाइन करना और चलाना
      - नियमित रूप से पहुँच की समीक्षा करना और समस्याएँ ठीक करना
    expert: |
      आप ये कर सकते हैं:
      - कर्मचारियों, रोगियों और प्रणालियों के लिए पहचान और पहुँच रणनीति तय करना
      - नए पहचान मानकों को अपनाने का नेतृत्व करना
data-quality:
  name: डेटा गुणवत्ता प्रबंधन
  description: डेटा की गुणवत्ता को परिभाषित करना, मापना और सुधारना, जिसमें पूर्णता, सटीकता, समयबद्धता और वैधता शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि देखभाल और योजना के लिए सटीक स्वास्थ्य डेटा क्यों महत्वपूर्ण है
      - डेटा सटीकता से दर्ज करना और त्रुटियों की रिपोर्ट करना
    working: |
      आप ये कर सकते हैं:
      - डेटा गुणवत्ता जाँच चलाना और त्रुटियाँ सुधारना
      - सहकर्मियों को डेटा गुणवत्ता रिपोर्ट समझाना
    practitioner: |
      आप ये कर सकते हैं:
      - डेटा गुणवत्ता नियम और माप परिभाषित करना
      - ख़राब गुणवत्ता के मूल कारणों को ठीक करने के लिए डेटा प्रदाताओं के साथ काम करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन और उसके साझेदारों के लिए डेटा गुणवत्ता मानक तय करना
      - डेटा गुणवत्ता सुधार कार्यक्रमों का नेतृत्व करना
health-records-management:
  name: स्वास्थ्य अभिलेख प्रबंधन
  description: स्वास्थ्य और देखभाल अभिलेखों का उनके जीवनचक्र में प्रबंधन करना, जिसमें निर्माण, फ़ाइलिंग, ट्रैकिंग, पहुँच, प्रतिधारण और निपटान शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - अभिलेखों को सही ढंग से फ़ाइल करना, खोजना और ट्रैक करना
      - अभिलेखों को खोने या अनधिकृत पहुँच से बचाना
    working: |
      आप ये कर सकते हैं:
      - अभिलेखों तक पहुँच के अनुरोधों को संसाधित करना
      - प्रतिधारण अनुसूचियाँ और अभिलेख-रखरखाव मानक लागू करना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी अभिलेख सेवा और उसकी प्रक्रियाओं का प्रबंधन करना
      - अभिलेख-रखरखाव का ऑडिट करना और कर्मचारियों को प्रशिक्षण देना
    expert: |
      आप ये कर सकते हैं:
      - अभिलेख प्रबंधन नीति और रणनीति तय करना
      - काग़ज़ी से डिजिटल अभिलेखों की ओर बदलाव का नेतृत्व करना
clinical-coding:
  name: क्लिनिकल कोडिंग
  description: देखभाल, भुगतान और सांख्यिकी के लिए, राष्ट्रीय और अंतरराष्ट्रीय कोडिंग नियमों का पालन करते हुए, स्वास्थ्य अभिलेखों की क्लिनिकल जानकारी को मानक वर्गीकरण कोडों में बदलना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि क्लिनिकल कोडिंग क्या है और क्यों महत्वपूर्ण है
      - बुनियादी चिकित्सा शब्दों और शरीर रचना का उपयोग करना
    working: |
      आप ये कर सकते हैं:
      - वर्गीकरण नियमों का उपयोग करके सीधे उपचार प्रसंगों को सटीकता से कोड करना
      - अस्पष्ट अभिलेखों के बारे में चिकित्सकों से पूछना
    practitioner: |
      आप ये कर सकते हैं:
      - विभिन्न विशेषज्ञताओं के जटिल उपचार प्रसंगों को कोड करना
      - कोडिंग गुणवत्ता का ऑडिट करना और कोडरों को प्रशिक्षण देना
    expert: |
      आप ये कर सकते हैं:
      - कोडिंग सेवा और उसके गुणवत्ता कार्यक्रम का नेतृत्व करना
      - कोडिंग मानकों और डेटा तथा वित्तपोषण पर उनके प्रभाव के बारे में सलाह देना
clinical-leadership-in-digital:
  name: डिजिटल में क्लिनिकल नेतृत्व
  description: डिजिटल सेवाओं के डिज़ाइन, अपनाने और सुरक्षित उपयोग में क्लिनिकल ज्ञान और विश्वसनीयता लाना, और डिजिटल परिवर्तन में चिकित्सकों का नेतृत्व करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि डिजिटल सेवाएँ क्लिनिकल अभ्यास को कैसे बदलती हैं
    working: |
      आप ये कर सकते हैं:
      - कार्यप्रवाहों और सुरक्षा पर उत्पाद टीमों को क्लिनिकल राय देना
      - क्लिनिकल सहकर्मियों को नई प्रणालियाँ अपनाने में मदद करना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी उत्पाद या कार्यक्रम के लिए क्लिनिकल सहभागिता का नेतृत्व करना
      - क्लिनिकल आवश्यकताओं और साक्ष्य को आवश्यकताओं में बदलना
      - क्लिनिकल सहकर्मियों के बीच सुरक्षित अपनाने का समर्थन करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की डिजिटल सेवाओं के लिए क्लिनिकल दिशा तय करना
      - डिजिटल परिवर्तन में विभिन्न संगठनों के क्लिनिकल प्रमुखों का नेतृत्व करना
      - डिजिटल निवेश के क्लिनिकल जोखिम और लाभ पर बोर्ड को सलाह देना
governance-and-compliance:
  name: कॉर्पोरेट शासन और अनुपालन
  description: संगठन के शासन का समर्थन करना, जिसमें बोर्ड, समितियाँ, स्थायी आदेश, नीतियाँ, हित घोषणाएँ और कानूनी तथा नियामक दायित्वों का अनुपालन शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संगठन की नीतियों और निर्णय-नियमों का पालन करना
    working: |
      आप ये कर सकते हैं:
      - समिति की बैठकों, पत्रों और कार्यवृत्त में सहायता करना
      - शासन रजिस्टरों को अद्यतन रखना
    practitioner: |
      आप ये कर सकते हैं:
      - बोर्डों और समितियों के लिए शासन चक्र चलाना
      - नीतियों की समीक्षा करना और अनुपालन पर सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - शासन ढाँचा डिज़ाइन करना और बोर्ड को सलाह देना
      - वार्षिक शासन रिपोर्टिंग और आश्वासन का नेतृत्व करना
