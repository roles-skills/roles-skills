# Hindi translations of data/skills/clinical-ig.yaml. Keys are the English skill ids.
clin-clinical-systems-optimisation:
  name: क्लिनिकल प्रणाली डिज़ाइन और अनुकूलन
  description: इलेक्ट्रॉनिक स्वास्थ्य अभिलेख, ऑर्डर संचार और इलेक्ट्रॉनिक प्रिस्क्राइबिंग जैसी क्लिनिकल प्रणालियों को डिज़ाइन, कॉन्फ़िगर और बेहतर बनाना, ताकि वे क्लिनिकल कार्यप्रवाहों के अनुरूप हों और सुरक्षित, कुशल देखभाल में सहायक हों।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि इलेक्ट्रॉनिक स्वास्थ्य अभिलेख जैसी क्लिनिकल प्रणालियाँ देखभाल में कैसे मदद करती हैं
      - उन क्लिनिकल कार्यप्रवाहों का वर्णन करना जिनमें कोई प्रणाली सहायक है
    working: |
      आप ये कर सकते हैं:
      - चिकित्सकों और देखभाल कर्मचारियों के साथ वर्तमान और भावी क्लिनिकल कार्यप्रवाहों का मानचित्र बनाना
      - क्लिनिकल परिदृश्यों के आधार पर प्रणाली कॉन्फ़िगरेशन का परीक्षण करना
      - उत्पाद टीमों के लिए स्पष्ट क्लिनिकल आवश्यकताएँ लिखना
    practitioner: |
      आप ये कर सकते हैं:
      - प्रणाली कॉन्फ़िगरेशन, फ़ॉर्म, ऑर्डर सेट और निर्णय सहायता के क्लिनिकल डिज़ाइन का नेतृत्व करना
      - कार्यप्रवाह की समस्याएँ खोजने और सुधारने के लिए डेटा और उपयोगकर्ता प्रतिक्रिया का उपयोग करना
      - क्लिनिकल आवश्यकता, सुरक्षा, उपयोगिता और प्रणाली की सीमाओं के बीच संतुलन बनाना
    expert: |
      आप ये कर सकते हैं:
      - पूरे संगठन की क्लिनिकल प्रणालियों के लिए डिज़ाइन सिद्धांत और मानक तय करना
      - ऐसे अनुकूलन कार्यक्रमों का नेतृत्व करना जो देखभाल और कर्मचारियों के अनुभव में मापने योग्य सुधार लाएँ
      - क्लिनिकल प्रणालियों के चुनाव और देखभाल पर उनके प्रभाव के बारे में वरिष्ठ प्रमुखों को सलाह देना
clin-human-factors:
  name: क्लिनिकल प्रणालियों में मानवीय कारक और उपयोगिता
  description: क्लिनिकल प्रणालियों पर मानवीय कारक और उपयोगिता विधियाँ लागू करना, ताकि चिकित्सक, देखभाल कर्मचारी और रोगी उन्हें सुरक्षित रूप से और न्यूनतम त्रुटि के साथ उपयोग कर सकें।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि ख़राब डिज़ाइन देखभाल में त्रुटियों का कारण कैसे बन सकता है
      - ऐसी उपयोगिता समस्याओं की रिपोर्ट करना जो रोगी सुरक्षा को प्रभावित कर सकती हैं
    working: |
      आप ये कर सकते हैं:
      - क्लिनिकल कार्यों के उपयोगिता परीक्षणों और सिमुलेशन में भाग लेना
      - सामान्य डिज़ाइन ख़तरों को पहचानना, जैसे एक जैसे दिखने वाले विकल्प या छिपे हुए अलर्ट
    practitioner: |
      आप ये कर सकते हैं:
      - क्लिनिकल प्रणालियों के मानवीय कारक आकलन की योजना बनाना और उन्हें संचालित करना
      - निष्कर्षों को डिज़ाइन परिवर्तनों और क्लिनिकल सुरक्षा नियंत्रणों में बदलना
      - अलर्ट के बोझ और वैकल्पिक तरीक़ों (वर्कअराउंड) के जोखिम का आकलन करना
    expert: |
      आप ये कर सकते हैं:
      - डिजिटल सेवाओं में मानवीय कारकों के प्रति संगठन का दृष्टिकोण तय करना
      - उच्च-जोखिम प्रणालियों और परिवर्तनों के मानवीय कारक साक्ष्य की समीक्षा करना
      - क्लिनिकल और डिजिटल टीमों में मानवीय कारक कौशल विकसित करना
clin-digital-health-evaluation:
  name: डिजिटल स्वास्थ्य मूल्यांकन और लाभ
  description: डिजिटल स्वास्थ्य तकनीकों के मूल्यांकन की योजना बनाना और उन्हें करना, और ठोस विधियों और साक्ष्य से उनके क्लिनिकल, सुरक्षा और सेवा लाभ मापना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि डिजिटल स्वास्थ्य तकनीकों के लिए लाभ और सुरक्षा के साक्ष्य क्यों चाहिए
      - किसी तकनीक के बारे में प्रकाशित साक्ष्य खोजना
    working: |
      आप ये कर सकते हैं:
      - मूल्यांकन के लिए आधार-रेखा और अनुवर्ती डेटा एकत्र करना
      - प्रणाली के उपयोग के क्लिनिकल ऑडिट करना
      - सहकर्मियों के लिए मूल्यांकन के निष्कर्षों का सारांश बनाना
    practitioner: |
      आप ये कर सकते हैं:
      - डिजिटल स्वास्थ्य उत्पादों के लिए मूल्यांकन और लाभ योजनाएँ डिज़ाइन करना
      - क्लिनिकल परिणामों, सुरक्षा और अनुभव के लिए उपयुक्त माप चुनना
      - साक्ष्य की मज़बूती का आकलन करना और उसकी सीमाएँ समझाना
    expert: |
      आप ये कर सकते हैं:
      - डिजिटल स्वास्थ्य मूल्यांकन के प्रति संगठन का दृष्टिकोण तय करना
      - शैक्षणिक और देखभाल साझेदारों के साथ अनुसंधान और मूल्यांकन कार्यक्रमों का नेतृत्व करना
      - डिजिटल निवेश पर बोर्ड को सलाह देने के लिए साक्ष्य का उपयोग करना
clin-professional-practice:
  name: डिजिटल में पंजीकृत क्लिनिकल अभ्यास
  description: किसी क्लिनिकल पेशे के मानकों, नैतिकता और पुनर्मान्यकरण दायित्वों को पूरा करते हुए डिजिटल काम में वर्तमान, पंजीकृत क्लिनिकल ज्ञान और विवेक लाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - पंजीकृत चिकित्सक पर लागू होने वाले पेशेवर मानकों को समझाना
      - पहचानना कि कब किसी प्रश्न पर क्लिनिकल राय चाहिए
    working: |
      आप ये कर सकते हैं:
      - अपने अभ्यास-क्षेत्र के भीतर डिजिटल काम में अपना क्लिनिकल ज्ञान लागू करना
      - अपना पंजीकरण और सतत पेशेवर विकास अद्यतन रखना
      - कार्यप्रवाहों, सामग्री और सुरक्षा पर क्लिनिकल राय देना
    practitioner: |
      आप ये कर सकते हैं:
      - देखभाल पर डिजिटल सेवाओं के प्रभाव के बारे में ठोस क्लिनिकल निर्णय लेना
      - डिजिटल या क्लिनिकल परिवेश में असुरक्षित अभ्यास को आत्मविश्वास से चुनौती देना
      - अन्य चिकित्सकों को डिजिटल काम में अपने पेशेवर मानक लागू करने में सहायता देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के डिजिटल काम के लिए क्लिनिकल पेशेवर मानकों का नेतृत्व करना
      - रोगी सुरक्षा और देखभाल के निर्णयों में वरिष्ठ क्लिनिकल आवाज़ के रूप में काम करना
      - डिजिटल भूमिकाओं में चिकित्सकों के पुनर्मान्यकरण और पेशेवर विकास में सहायता देना
ig-information-rights-requests:
  name: सूचना अधिकार अनुरोध
  description: व्यक्तियों और जनता के सूचना तक पहुँच के अनुरोधों, जैसे व्यक्तिगत स्वास्थ्य अभिलेख देखने के अनुरोध और संगठन के पास मौजूद जानकारी के अनुरोधों, को कानूनी समय-सीमा के भीतर निपटाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - सूचना अधिकार अनुरोध को पहचानना और उसे तुरंत आगे भेजना
      - समझाना कि अनुरोधों की कानूनी समय-सीमाएँ होती हैं
    working: |
      आप ये कर सकते हैं:
      - समय-सीमा पूरी करने के लिए अनुरोधों को दर्ज करना, उनकी पावती देना और उन्हें ट्रैक करना
      - जानकारी एकत्र करना और संपादित (रिडैक्ट) करना, और समीक्षा के लिए उत्तरों का मसौदा बनाना
      - अनुरोध करने वाले व्यक्ति की पहचान और अधिकार की जाँच करना
    practitioner: |
      आप ये कर सकते हैं:
      - तीसरे पक्ष से जुड़े अनुरोधों सहित जटिल या संवेदनशील अनुरोधों को निपटाना
      - छूटें लागू करना और स्पष्ट कारणों के साथ तय करना कि क्या रोकना है
      - उत्तरों के बारे में आंतरिक समीक्षाओं और शिकायतों का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - पूरे संगठन में सूचना अधिकारों की नीति और प्रक्रिया तय करना
      - नियामक की पूछताछ और अपीलों के उत्तर का नेतृत्व करना
      - वरिष्ठ प्रमुखों को प्रदर्शन और रुझानों की रिपोर्ट देना
ig-records-retention:
  name: अभिलेख प्रतिधारण और निपटान
  description: काग़ज़ी और डिजिटल अभिलेखों पर प्रतिधारण अनुसूचियाँ लागू करना, और ऑडिट ट्रेल के साथ उन्हें सही समय पर संग्रहीत करना या सुरक्षित रूप से नष्ट करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि अभिलेख निर्धारित अवधि तक क्यों रखे जाते हैं और फिर नष्ट या संग्रहीत क्यों किए जाते हैं
      - अभिलेखों को रखने और स्थानांतरित करने की प्रक्रियाओं का पालन करना
    working: |
      आप ये कर सकते हैं:
      - अभिलेखों पर प्रतिधारण अनुसूची लागू करना और समीक्षा के लिए देय अभिलेखों को चिह्नित करना
      - अभिलेखों को संग्रहण या सुरक्षित विनाश के लिए तैयार करना और ऑडिट ट्रेल रखना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी अभिलेख सेवा के लिए प्रतिधारण और निपटान कार्यक्रम चलाना
      - डिजिटल सहित नए प्रकार के अभिलेखों के प्रतिधारण पर टीमों को सलाह देना
      - प्रतिधारण अनुसूचियों के अनुपालन का ऑडिट करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए प्रतिधारण नीति और अनुसूची तय करना
      - डिजिटल अभिलेखों के दीर्घकालिक संरक्षण की योजना बनाना
      - कानूनी रोक और जाँच जैसे जटिल प्रतिधारण प्रश्नों को सुलझाना
ig-data-protection-impact-assessment:
  name: डेटा संरक्षण प्रभाव आकलन
  description: व्यक्तिगत और स्वास्थ्य डेटा के नए या परिवर्तित प्रसंस्करण के निजता जोखिमों का आकलन करना, और प्रसंस्करण शुरू होने से पहले नियंत्रणों पर सहमति बनाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि डेटा संरक्षण प्रभाव आकलन कब आवश्यक है
      - अपने काम के लिए स्क्रीनिंग प्रश्नावली भरना
    working: |
      आप ये कर सकते हैं:
      - परियोजना टीमों को डेटा संरक्षण प्रभाव आकलन पूरे करने में मदद करना
      - डेटा प्रवाहों का वर्णन करना और प्रसंस्करण का विधिक आधार पहचानना
      - निजता जोखिमों और प्रस्तावित नियंत्रणों को दर्ज करना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल प्रणालियों के डेटा संरक्षण प्रभाव आकलनों की समीक्षा करना और उन पर सलाह देना
      - तय करना कि जोखिम स्वीकार्य हैं या नहीं, और नियंत्रणों की सिफ़ारिश करना
      - तय करना कि कब उच्च जोखिमों को वरिष्ठ स्तर या नियामक की समीक्षा के लिए आगे बढ़ाना है
    expert: |
      आप ये कर सकते हैं:
      - संगठन की डेटा संरक्षण प्रभाव आकलन प्रक्रिया और मानक तय करना
      - बड़े पैमाने पर डेटा साझाकरण या AI जैसे उच्चतम जोखिम वाले प्रसंस्करण पर अंतिम सलाह देना
      - जहाँ कानून की आवश्यकता हो, वहाँ नियामकों से परामर्श करना
ig-incident-management:
  name: सूचना शासन घटना प्रबंधन
  description: डेटा उल्लंघनों और बाल-बाल बची घटनाओं को दर्ज करना, उनकी जाँच करना और उनसे सीखना, और तय करना कि कब नियामकों और प्रभावित लोगों को सूचित करना है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - डेटा उल्लंघन या बाल-बाल बची घटना को पहचानना और तुरंत उसकी रिपोर्ट करना
    working: |
      आप ये कर सकते हैं:
      - घटनाओं को दर्ज करना और तथ्य एकत्र करना
      - संगठन के गंभीरता मानदंडों के आधार पर घटनाओं का आकलन करना
      - कार्रवाइयों को पूरा होने तक ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - गंभीर घटनाओं की जाँच करना और उनके मूल कारण खोजना
      - वरिष्ठ सहकर्मियों के साथ तय करना कि नियामकों और प्रभावित लोगों को सूचित करना है या नहीं
      - सीख साझा करना और सुधारों को ट्रैक करना
    expert: |
      आप ये कर सकते हैं:
      - सूचना शासन के लिए घटना प्रबंधन प्रक्रिया तय करना
      - नियामकों और मीडिया सहित प्रमुख उल्लंघनों के जवाब का नेतृत्व करना
      - बोर्ड को घटनाओं के रुझानों और जोखिमों की रिपोर्ट देना
ig-confidentiality-and-sharing:
  name: गोपनीयता और सूचना साझाकरण
  description: रोगी की गोपनीय जानकारी की रक्षा करना और साथ ही यह सुनिश्चित करना कि जब देखभाल, सुरक्षा या कानून को आवश्यकता हो तो उसे विधिपूर्वक साझा किया जाए, जिसमें सूचना साझाकरण समझौते शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - गोपनीय जानकारी सुरक्षित रखना और उसे केवल अनुमति होने पर साझा करना
      - संदेह होने पर सलाह माँगना
    working: |
      आप ये कर सकते हैं:
      - जाँचना कि जानकारी साझा करने का अनुरोध नीति के अनुरूप है
      - दर्ज करना कि क्या साझा किया गया, किसके साथ और क्यों
      - सरल सूचना साझाकरण समझौतों का मसौदा बनाना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल गोपनीयता प्रश्नों पर सलाह देना, जैसे जनहित में बिना सहमति के साझा करना
      - साझेदार संगठनों के साथ सूचना साझाकरण समझौतों की समीक्षा करना
      - डेटा प्रवाहों पर सहमति और रोगी आपत्ति के नियम लागू करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए गोपनीयता पर वरिष्ठ सलाहकार के रूप में काम करना
      - सबसे कठिन प्रकटीकरण निर्णयों को सुलझाना
      - साझेदारों के साथ जानकारी साझा करने का ढाँचा तय करना
ig-compliance-assurance:
  name: सूचना शासन आश्वासन और ऑडिट
  description: वार्षिक स्व-मूल्यांकन, ऑडिट, साक्ष्य और सुधार योजनाओं के माध्यम से जाँचना और दिखाना कि संगठन सूचना शासन मानकों को पूरा करता है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि संगठन को यह क्यों दिखाना चाहिए कि वह जानकारी को अच्छी तरह संभालता है
      - माँगे जाने पर ऑडिट के लिए साक्ष्य देना
    working: |
      आप ये कर सकते हैं:
      - वार्षिक स्व-मूल्यांकन के लिए साक्ष्य एकत्र और व्यवस्थित करना
      - पहुँच या अभिलेख-रखरखाव ऑडिट जैसे सरल ऑडिट करना
      - सुधार कार्रवाइयों को ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - सूचना शासन आश्वासन कार्यक्रम की योजना बनाना और उसे चलाना
      - तय करना कि साक्ष्य मानक को पूरा करता है या नहीं, और कमियाँ पहचानना
      - आंतरिक और बाहरी लेखा-परीक्षकों के साथ काम करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के सूचना शासन आश्वासन ढाँचे का स्वामित्व रखना
      - बोर्ड और उसकी समितियों को आश्वासन और अनुपालन की रिपोर्ट देना
      - जोखिम के आधार पर सुधार की प्राथमिकताएँ तय करना
