# Hindi translations of data/skills/human-resources.yaml. Keys are the English skill ids.
hr-hr-administration:
  name: मानव संसाधन प्रशासन
  description: अनुबंधों और नए कर्मचारियों से लेकर परिवर्तनों, अनुपस्थिति अभिलेखों और जाने वाले कर्मचारियों तक, रोज़गार जीवनचक्र की प्रशासनिक प्रक्रियाओं को सटीक और गोपनीय रूप से चलाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - नए कर्मचारियों, परिवर्तनों और जाने वाले कर्मचारियों के लिए संगठन की प्रक्रियाओं का पालन करना
      - व्यक्तिगत अभिलेखों को गोपनीय और अद्यतन रखना
    working: |
      आप ये कर सकते हैं:
      - अनुबंध, संशोधन पत्र और रोज़गार जाँच सटीकता से तैयार करना
      - समय-सीमा के भीतर मानव संसाधन और वेतन प्रणाली में परिवर्तन संसाधित करना
      - मानव संसाधन प्रक्रियाओं पर प्रबंधकों और कर्मचारियों के नियमित प्रश्नों का उत्तर देना
    practitioner: |
      आप ये कर सकते हैं:
      - गुणवत्ता जाँचते हुए और सेवा मानकों को पूरा करते हुए मानव संसाधन प्रशासन सेवा चलाना
      - प्रक्रियाओं और टेम्पलेट में सुधार करना, और जहाँ संभव हो नियमित चरणों को स्वचालित करना
      - अधिक भुगतान या अनुबंध त्रुटियों जैसे जटिल या असामान्य मामले सुलझाना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए मानव संसाधन संचालन मॉडल और सेवा मानक डिज़ाइन करना
      - डिजिटल, स्व-सेवा मानव संसाधन प्रक्रियाओं की ओर बदलाव का नेतृत्व करना
      - मानव संसाधन और वेतन डेटा को सटीक और विधिसम्मत रखने वाले नियंत्रण तय करना
hr-employment-policy:
  name: रोज़गार क़ानून और कार्मिक नीति
  description: रोज़गार क़ानून लागू करना, और संगठन की कार्मिक नीतियाँ लिखना, उनकी व्याख्या और समीक्षा करना, ताकि कर्मचारियों के साथ विधिसम्मत, निष्पक्ष और एकरूप व्यवहार हो।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - मुख्य कार्मिक नीतियाँ और उन्हें कहाँ खोजें, यह समझाना
      - पहचानना कि कब किसी प्रश्न पर मानव संसाधन सलाहकार की सलाह चाहिए
    working: |
      आप ये कर सकते हैं:
      - नियमित मामलों पर कार्मिक नीतियाँ लागू करना और प्रबंधकों को उन्हें समझाना
      - किसी नीति के पीछे के रोज़गार क़ानून सिद्धांतों को पहचानना
      - नीति अभिलेख रखना और नीति समीक्षा तिथियों को ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल मामलों के लिए रोज़गार क़ानून और नीति की व्याख्या करना और जोखिम पर सलाह देना
      - समानता प्रभाव आकलनों के साथ कार्मिक नीतियों का मसौदा बनाना और समीक्षा करना
      - कर्मचारी प्रतिनिधियों के साथ नीति परिवर्तनों पर परामर्श करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन का कार्मिक नीति ढाँचा और विधिक जोखिम के प्रति दृष्टिकोण तय करना
      - रोज़गार क़ानून में परिवर्तनों का अनुमान लगाना और संगठन के जवाब की योजना बनाना
      - रोज़गार जोखिम और दायित्व पर बोर्ड को सलाह देना
hr-employee-relations:
  name: कर्मचारी संबंध मामले
  description: आचरण, क्षमता, शिकायत, उपस्थिति और कार्यस्थल पर गरिमा जैसे औपचारिक और अनौपचारिक कर्मचारी संबंध मामलों का नीति और रोज़गार क़ानून के अनुसार निष्पक्ष प्रबंधन करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - आचरण, क्षमता, शिकायत और उपस्थिति प्रक्रियाओं के मुख्य चरण समझाना
      - औपचारिक बैठकों में सटीक नोट्स लेना और मामलों के अभिलेख गोपनीय रखना
    working: |
      आप ये कर सकते हैं:
      - सीधे-सादे मामलों और प्रक्रिया के अगले चरण पर प्रबंधकों को सलाह देना
      - जाँचों में सहायता करना, मामले के काग़ज़ात तैयार करना और सुनवाई की व्यवस्था करना
      - व्यक्तिगत मामलों पर कर्मचारी प्रतिनिधियों के साथ रचनात्मक रूप से काम करना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल मामलों का प्रबंधन करना और सुनवाई पैनलों को निष्पक्ष परिणामों पर सलाह देना
      - घटनाओं या सुरक्षा (सेफ़गार्डिंग) से जुड़ी जाँचों सहित जाँचें करना या उनका नेतृत्व करना
      - विवादों को बढ़ने से पहले सुलझाने के लिए प्रारंभिक समाधान और मध्यस्थता का उपयोग करना
      - मामलों में रुझान पहचानना और उनके कारणों पर कार्रवाई करना
    expert: |
      आप ये कर सकते हैं:
      - कर्मचारी संबंधों और साझेदारी में काम करने के प्रति संगठन के दृष्टिकोण का नेतृत्व करना
      - रोज़गार दावों सहित सबसे संवेदनशील या उच्च-जोखिम मामलों को संभालना
      - सामूहिक समझौतों पर बातचीत करना और सामूहिक विवादों को सुलझाना
hr-recruitment-and-selection:
  name: भर्ती और चयन
  description: पद डिज़ाइन और विज्ञापन से लेकर शॉर्टलिस्टिंग, आकलन, प्रस्ताव और रोज़गार-पूर्व जाँच तक, लोगों को निष्पक्ष और कुशलता से आकर्षित करना, आकलित करना और नियुक्त करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संगठन की भर्ती प्रक्रिया के चरण समझाना
      - रोज़गार-पूर्व जाँच सहित निष्पक्ष और सुरक्षित भर्ती नियमों का पालन करना
    working: |
      आप ये कर सकते हैं:
      - आवेदक ट्रैकिंग प्रणाली के माध्यम से भर्ती अभियान चलाना
      - विज्ञापन, शॉर्टलिस्टिंग और साक्षात्कार व्यवस्था में प्रबंधकों की सहायता करना
      - रोज़गार-पूर्व जाँच पूरी करना और सशर्त प्रस्ताव देना
    practitioner: |
      आप ये कर सकते हैं:
      - पद डिज़ाइन, चयन विधियों और निष्पक्ष आकलन पर प्रबंधकों को सलाह देना
      - विशेषज्ञ भूमिकाओं के लिए आकलन डिज़ाइन करना, जैसे डिजिटल भूमिकाओं के लिए तकनीकी अभ्यास
      - नियुक्ति के समय, गुणवत्ता और विविधता में सुधार के लिए भर्ती डेटा का विश्लेषण करना
      - उम्मीदवार अनुभव और नियोक्ता ब्रांड का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की भर्ती रणनीति और सेवा मानक तय करना
      - भर्ती तकनीक और एजेंसियों के चुनाव और उपयोग का नेतृत्व करना
      - सुनिश्चित करना कि पूरे संगठन में भर्ती समावेशी और विधिसम्मत हो
hr-talent-attraction:
  name: प्रतिभा आकर्षण और सोर्सिंग
  description: नियोक्ता ब्रांडिंग, प्रत्यक्ष सोर्सिंग, नेटवर्क और प्रारंभिक करियर मार्गों के माध्यम से डिजिटल, डेटा और तकनीकी विशेषज्ञों जैसे दुर्लभ कौशल वाले लोगों को खोजना और जोड़ना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि कौन-से कौशल भर्ती में कठिन हैं और क्यों
      - संगठन के चैनलों और नेटवर्क पर नौकरी विज्ञापन साझा करना
    working: |
      आप ये कर सकते हैं:
      - विशेषज्ञ उम्मीदवारों को आकर्षित करने वाले और सरल भाषा वाले विज्ञापन लिखना
      - जॉब बोर्ड, पेशेवर नेटवर्क और प्रतिभा पूल में उम्मीदवार खोजना
      - करियर मेले और खुले दिवस जैसे कार्यक्रमों में सहायता करना
    practitioner: |
      आप ये कर सकते हैं:
      - दुर्लभ डिजिटल और डेटा भूमिकाओं के लिए प्रतिभा पाइपलाइन और समुदाय बनाना
      - नियुक्ति टीमों के साथ नियोक्ता मूल्य प्रस्ताव को आकार देना
      - कठिन भूमिकाओं पर सलाह देने के लिए वेतन और आपूर्ति के बाज़ार डेटा का उपयोग करना
      - अप्रेंटिसशिप और स्नातक योजनाओं जैसे प्रारंभिक करियर मार्ग विकसित करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की प्रतिभा आकर्षण रणनीति और नियोक्ता ब्रांड तय करना
      - प्रतिभा आपूर्ति बढ़ाने के लिए विश्वविद्यालयों और अन्य नियोक्ताओं जैसे साझेदारों के साथ काम करना
      - अतिरिक्त वेतन, एजेंसी उपयोग और वैकल्पिक सोर्सिंग मॉडल पर निर्णयों का नेतृत्व करना
hr-workforce-planning:
  name: कार्यबल योजना
  description: संगठन को आवश्यक कार्यबल का पूर्वानुमान लगाना, उसकी तुलना मौजूदा कार्यबल से करना, और भर्ती, विकास, पुनर्रचना और प्रतिधारण के माध्यम से अंतर को पाटने की योजना बनाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि सुरक्षित और टिकाऊ सेवाओं के लिए कार्यबल योजना क्यों महत्वपूर्ण है
      - सटीक स्थापना और रिक्ति जानकारी देना
    working: |
      आप ये कर सकते हैं:
      - प्रबंधकों से कार्यबल योजना डेटा एकत्र करना और उसकी जाँच करना
      - कर्मचारी छोड़ने की दर और रिक्ति रुझानों जैसे सरल परिदृश्यों का मॉडल बनाना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी निदेशालय की कार्यबल योजना का नेतृत्व करना, उसे सेवा और वित्तीय योजनाओं से जोड़ते हुए
      - कौशल अंतर पहचानना और उन्हें पाटने के तरीक़े सुझाना
      - नई भूमिकाओं, करियर मार्गों और कौशल मिश्रण की योजना बनाना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की कार्यबल रणनीति और दीर्घकालिक योजना तय करना
      - वित्त और सेवा प्रमुखों के साथ सेवाओं के बीच कार्यबल संबंधी समझौते करना
      - पूरी स्वास्थ्य और देखभाल प्रणाली के साझेदारों के साथ कार्यबल योजनाओं को आकार देना
hr-workforce-information:
  name: कार्यबल सूचना और मानव संसाधन प्रणालियाँ
  description: मानव संसाधन और कार्यबल प्रणालियों तथा डेटा का प्रबंधन करना, और कार्यबल डेटा को रिपोर्ट और अंतर्दृष्टि में बदलना, जैसे कर्मचारी छोड़ने की दर, अनुपस्थिति, रिक्ति, विविधता और वेतन अंतर विश्लेषण।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - मानव संसाधन प्रणाली में कार्यबल डेटा सटीकता से दर्ज करना
      - समझाना कि कार्यबल डेटा सटीक और गोपनीय क्यों होना चाहिए
    working: |
      आप ये कर सकते हैं:
      - मानक कार्यबल रिपोर्ट चलाना और उनमें त्रुटियाँ जाँचना
      - कार्यबल के बारे में नियमित सूचना अनुरोधों का उत्तर देना
    practitioner: |
      आप ये कर सकते हैं:
      - रुझान खोजने के लिए कार्यबल डेटा का विश्लेषण करना और प्रबंधकों को उन्हें समझाना
      - कार्यबल संकेतकों के लिए डैशबोर्ड और रिपोर्ट डिज़ाइन करना
      - वेतन अंतर विश्लेषण जैसी वैधानिक और समानता रिपोर्टिंग तैयार करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की कार्यबल सूचना रणनीति और डेटा मानक तय करना
      - मानव संसाधन प्रणालियों के चुनाव और विकास का नेतृत्व करना
      - बोर्ड के निर्णयों के लिए कार्यबल अंतर्दृष्टि का उपयोग करना
hr-reward-and-job-evaluation:
  name: पारिश्रमिक और कार्य-मूल्यांकन
  description: वेतन और पारिश्रमिक नियम लागू करना, और पदों को सही बैंड में रखने के लिए कार्य-मूल्यांकन योजना के आधार पर उनका एकरूप मूल्यांकन करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि वेतन बैंड, वार्षिक वृद्धि और भत्ते कैसे काम करते हैं
      - समझाना कि पदों का बैंड कार्य-मूल्यांकन से तय होता है, पद पर बैठे व्यक्ति से नहीं
    working: |
      आप ये कर सकते हैं:
      - प्रारंभिक वेतन, संरक्षण और भत्तों जैसे वेतन नियम लागू करना
      - मूल्यांकन के लिए भेजने से पहले जाँचना कि कार्य-विवरण पूर्ण हैं
      - प्रशिक्षित सदस्य के रूप में कार्य-मूल्यांकन पैनलों में भाग लेना
    practitioner: |
      आप ये कर सकते हैं:
      - कार्य-मूल्यांकन पैनलों और एकरूपता जाँचों का नेतृत्व करना
      - डिजिटल और डेटा भूमिकाओं सहित नई और बदली हुई भूमिकाओं के बैंड पर सलाह देना
      - बाज़ार साक्ष्य का उपयोग करके भर्ती और प्रतिधारण प्रीमियम पर सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - सहमत वेतन ढाँचे के भीतर संगठन की पारिश्रमिक रणनीति तय करना
      - पूरे संगठन में कार्य-मूल्यांकन की निष्पक्षता का आश्वासन देना
      - समान वेतन समीक्षाओं का नेतृत्व करना और उनके निष्कर्षों पर कार्रवाई करना
hr-learning-design-and-delivery:
  name: अधिगम डिज़ाइन और संचालन
  description: अधिगम आवश्यकताओं का विश्लेषण करना, फिर आमने-सामने, ऑनलाइन और काम के दौरान अधिगम डिज़ाइन करना, देना और उसका मूल्यांकन करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - प्रशिक्षण, अधिगम और विकास के बीच अंतर समझाना
      - पाठ्यक्रमों के संचालन में सहायता करना और प्रशिक्षण अभिलेख रखना
    working: |
      आप ये कर सकते हैं:
      - आमने-सामने और ऑनलाइन स्पष्ट रूप से परिभाषित प्रशिक्षण सत्र देना
      - अधिगम प्रबंधन प्रणाली में सरल ई-लर्निंग बनाना
      - प्रशिक्षुओं की प्रतिक्रिया एकत्र करना और उसका सारांश बनाना
    practitioner: |
      आप ये कर सकते हैं:
      - अधिगम आवश्यकताओं का विश्लेषण करना और उन्हें पूरा करने वाले मिश्रित कार्यक्रम डिज़ाइन करना
      - अधिगम परिणाम तय करना और केवल संतुष्टि नहीं, प्रभाव का भी मूल्यांकन करना
      - अधिगम को सभी कर्मचारियों के लिए सुगम और समावेशी बनाना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की अधिगम रणनीति और मानक तय करना
      - अधिगम प्रस्ताव, उसकी तकनीक और उसके वित्तपोषण का नेतृत्व करना
      - अधिगम में संगठन के निवेश का प्रतिफल दिखाना
hr-skills-frameworks-and-career-pathways:
  name: कौशल ढाँचे और करियर मार्ग
  description: भूमिकाओं का वर्णन करने, कौशल अंतर आकलित करने और करियर मार्ग बनाने के लिए इस संदर्भ, UK GDaD PCF और ESCO जैसे कौशल और भूमिका ढाँचों का उपयोग करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि कौशल ढाँचा क्या है और वह भूमिकाओं और स्तरों का वर्णन कैसे करता है
      - ढाँचे में किसी पद की भूमिका प्रोफ़ाइल और कौशल खोजना
    working: |
      आप ये कर सकते हैं:
      - कार्य-विवरणों को ढाँचे की भूमिकाओं, स्तरों और कौशलों से जोड़ना
      - कौशल स्व-मूल्यांकन में कर्मचारियों और प्रबंधकों की सहायता करना
      - करियर मार्ग की जानकारी अद्यतन रखना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी टीम या पेशे के लिए कौशल अंतर विश्लेषण करना और परिणामों की रिपोर्ट देना
      - ढाँचे के स्तरों का उपयोग करके करियर मार्ग और विकास पथ डिज़ाइन करना
      - एकरूप कार्य-विवरण और आकलन लिखने के लिए ढाँचे के कौशलों का उपयोग करना
    expert: |
      आप ये कर सकते हैं:
      - तय करना कि संगठन विभिन्न पेशों में कौशल ढाँचों का उपयोग कैसे करता है
      - कार्यबल, अधिगम और पारिश्रमिक रणनीति के लिए कौशल डेटा का उपयोग करना
      - अन्य संगठनों के साथ साझा ढाँचों के विकास में योगदान देना
hr-organisational-development:
  name: संगठनात्मक विकास
  description: साक्ष्य पर आधारित संस्कृति, नेतृत्व, सहभागिता, टीम प्रभावशीलता और कल्याण संबंधी हस्तक्षेपों के माध्यम से संगठन के काम करने के तरीक़े में सुधार करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि संस्कृति, नेतृत्व और सहभागिता कर्मचारियों और रोगी देखभाल को कैसे प्रभावित करते हैं
      - कर्मचारी सर्वेक्षण और सुनवाई कार्यक्रम चलाने में मदद करना
    working: |
      आप ये कर सकते हैं:
      - मानक उपकरणों का उपयोग करके टीम सत्रों और कार्यशालाओं का संचालन करना
      - किसी टीम के कर्मचारी सर्वेक्षण परिणामों का विश्लेषण करना और कार्रवाइयाँ सुझाना
    practitioner: |
      आप ये कर सकते हैं:
      - संगठनात्मक मुद्दों का निदान करना और उनके समाधान के लिए हस्तक्षेप डिज़ाइन करना
      - टीम विकास, नेतृत्व विकास और सहभागिता कार्यक्रमों का नेतृत्व करना
      - साक्ष्य का उपयोग करके हस्तक्षेपों के प्रभाव का मूल्यांकन करना
    expert: |
      आप ये कर सकते हैं:
      - संगठनात्मक विकास रणनीति और संस्कृति कार्यक्रम तय करना
      - कार्यकारियों को कोचिंग देना और बड़े पैमाने पर सांस्कृतिक परिवर्तन का नेतृत्व करना
      - संस्कृति और सहभागिता के मापों को देखभाल की गुणवत्ता और प्रदर्शन से जोड़ना
hr-organisational-change:
  name: संगठनात्मक परिवर्तन और परामर्श
  description: नीति और रोज़गार क़ानून के अनुसार संरचनाओं, भूमिकाओं और कार्य पैटर्न में परिवर्तनों की योजना बनाना और उनका प्रबंधन करना, जिसमें औपचारिक परामर्श, पुनर्नियोजन और छँटनी शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संगठनात्मक परिवर्तन प्रक्रिया के मुख्य चरण समझाना
      - परामर्श पत्रों और बैठकों जैसे परिवर्तन के प्रशासन में सहायता करना
    working: |
      आप ये कर सकते हैं:
      - परामर्श दस्तावेज़ और कर्मचारी ब्रीफ़िंग तैयार करने में प्रबंधकों की सहायता करना
      - परामर्श के दौरान प्रतिक्रियाओं और कार्रवाइयों को ट्रैक करना
      - पुनर्नियोजन और चयन प्रक्रियाओं में कर्मचारियों की सहायता करना
    practitioner: |
      आप ये कर सकते हैं:
      - बिज़नेस केस से कार्यान्वयन तक किसी निदेशालय के संगठनात्मक परिवर्तन का नेतृत्व करना
      - कर्मचारियों और उनके प्रतिनिधियों से परामर्श करना और उनकी प्रतिक्रिया का उत्तर देना
      - किसी परिवर्तन के विधिक और समानता जोखिमों का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - पूरे संगठन के पुनर्गठन और सेवा हस्तांतरणों का नेतृत्व करना
      - साझेदारी में काम करने सहित परिवर्तन के प्रति संगठन का दृष्टिकोण डिज़ाइन करना
      - बड़े परिवर्तन के लोगों पर प्रभाव और जोखिम पर बोर्ड को सलाह देना
hr-people-strategy:
  name: कार्मिक रणनीति और मानव संसाधन नेतृत्व
  description: संगठन की कार्मिक रणनीति तय करना, मानव संसाधन कार्य का नेतृत्व करना, और संस्कृति, कार्यबल तथा रोज़गार जोखिम पर बोर्ड को सलाह देना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संगठन की कार्मिक रणनीति और आपका काम उसमें कैसे सहायक है, यह समझाना
    working: |
      आप ये कर सकते हैं:
      - स्पष्ट कार्रवाइयों और मापों के साथ किसी सेवा की कार्मिक योजनाओं में योगदान देना
      - कार्मिक योजना की प्रगति की रिपोर्ट देना
    practitioner: |
      आप ये कर सकते हैं:
      - कार्मिक रणनीति के अनुरूप किसी निदेशालय की कार्मिक योजनाएँ लिखना और उनका नेतृत्व करना
      - कार्मिक जोखिमों और प्राथमिकताओं पर वरिष्ठ प्रमुखों को सलाह देना
      - मानव संसाधन कार्य के एक भाग का नेतृत्व करना, उसके मानक और प्राथमिकताएँ तय करते हुए
    expert: |
      आप ये कर सकते हैं:
      - संगठन की कार्मिक रणनीति तय करना और मानव संसाधन कार्य का नेतृत्व करना
      - संस्कृति, कार्यबल और रोज़गार जोखिम पर बोर्ड को सलाह देना
      - कार्मिक मामलों पर साझेदारों और नियामकों के समक्ष संगठन का प्रतिनिधित्व करना
