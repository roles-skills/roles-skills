# Hindi translations of data/skills/corporate-services.yaml. Keys are the English skill ids.
corp-administration:
  name: कार्यालय प्रशासन
  description: किसी टीम या सेवा को चलाए रखने वाली प्रशासनिक प्रक्रियाएँ चलाना, जैसे फ़ाइलिंग, ऑर्डर देना, डेटा प्रविष्टि, अभिलेख, और कार्यालय प्रक्रियाओं का पालन।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - फ़ाइलिंग, ऑर्डर और डेटा प्रविष्टि की कार्यालय प्रक्रियाओं का पालन करना
      - अपने काम के सटीक अभिलेख रखना
    working: |
      आप ये कर सकते हैं:
      - कम पर्यवेक्षण में किसी टीम के लिए कई प्रशासनिक प्रक्रियाएँ चलाना
      - अभिलेखों और डेटा में त्रुटियाँ पहचानना और ठीक करना
      - काम करने के सरल तरीक़े सुझाना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी सेवा या निदेशालय के लिए प्रशासनिक सहायता व्यवस्थित करना
      - प्रशासनिक प्रक्रियाएँ लिखना और उनमें सुधार करना
      - अन्य प्रशासकों को प्रशिक्षण देना और उनके काम की जाँच करना
    expert: |
      आप ये कर सकते हैं:
      - पूरे संगठन की प्रशासनिक सेवाएँ डिज़ाइन करना
      - सरल, डिजिटल प्रशासनिक प्रक्रियाओं की ओर बदलाव का नेतृत्व करना
corp-office-software:
  name: डिजिटल कार्यालय उपकरण
  description: वर्ड प्रोसेसिंग, स्प्रेडशीट, प्रस्तुतियों, ईमेल, साझा दस्तावेज़ों और सहयोग उपकरणों का तेज़ी और सटीकता से उपयोग करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - दस्तावेज़, ईमेल और सरल स्प्रेडशीट बनाना और संपादित करना
      - फ़ाइलें सही जगह पर रखना और साझा करना
    working: |
      आप ये कर सकते हैं:
      - अच्छी तरह स्वरूपित दस्तावेज़ और प्रस्तुतियाँ तेज़ी और सटीकता से तैयार करना
      - डेटा को छाँटने, फ़िल्टर करने और सारांशित करने के लिए स्प्रेडशीट का उपयोग करना
      - साझा दस्तावेज़ों और संस्करणों के प्रबंधन के लिए सहयोग उपकरणों का उपयोग करना
    practitioner: |
      आप ये कर सकते हैं:
      - टेम्पलेट, ट्रैकर और सरल स्वचालित कार्यप्रवाह बनाना
      - दस्तावेज़ों को सभी के लिए सुगम बनाना
      - सहकर्मियों को कार्यालय उपकरणों का पूरा लाभ उठाने में मदद करना
    expert: |
      आप ये कर सकते हैं:
      - टेम्पलेट, दस्तावेज़ प्रबंधन और सहयोग उपकरणों के लिए मानक तय करना
      - पूरे संगठन में नए कार्यालय उपकरण अपनाने का नेतृत्व करना
corp-diary-and-meeting-management:
  name: डायरी और बैठक प्रबंधन
  description: डायरी, बैठकों और यात्रा का प्रबंधन करना, ताकि लोगों के समय का सदुपयोग हो और बैठकों में सही लोग, पत्र और कमरे हों।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संगठन के उपकरणों से बैठकें और कमरे बुक करना
      - निमंत्रण और पत्र समय पर भेजना
    working: |
      आप ये कर सकते हैं:
      - किसी टीम की डायरी का प्रबंधन करना और समय के टकराव सुलझाना
      - यात्रा, कार्यक्रम और बाहरी साझेदारों के साथ बैठकें आयोजित करना
      - सुनिश्चित करना कि बैठकों से पहले पत्र और कार्रवाइयाँ तैयार हों
    practitioner: |
      आप ये कर सकते हैं:
      - किसी वरिष्ठ प्रमुख की डायरी का प्रबंधन करना और उनके साथ प्राथमिकताएँ तय करना
      - तय करना कि किस पर उनका समय चाहिए और क्या दूसरे संभाल सकते हैं
      - किसी बोर्ड या नेतृत्व टीम के लिए बैठकों के वार्षिक चक्र की योजना बनाना
    expert: |
      आप ये कर सकते हैं:
      - कार्यकारी टीम के लिए कार्य चक्र चलाना
      - सुनिश्चित करना कि वरिष्ठ प्रमुखों का समय संगठन की प्राथमिकताओं पर केंद्रित रहे
corp-minute-taking:
  name: कार्यवृत्त लेखन और बैठक अभिलेख
  description: चर्चाओं, निर्णयों और कार्रवाइयों को सटीक और संक्षिप्त रूप से दर्ज करना, और औपचारिक बैठक अभिलेख रखना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - टीम बैठकों में कार्रवाइयों और निर्णयों के नोट्स लेना
    working: |
      आप ये कर सकते हैं:
      - नियमित बैठकों के सटीक, संक्षिप्त कार्यवृत्त और कार्रवाई लॉग लिखना
      - कार्रवाइयों पर उनके ज़िम्मेदार व्यक्तियों से अनुवर्ती कार्य करना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल या विवादास्पद चर्चाओं सहित बोर्ड और समिति बैठकों के औपचारिक कार्यवृत्त लिखना
      - ऐसे औपचारिक बैठक अभिलेख रखना जो ऑडिट और जाँच में टिक सकें
      - अध्यक्षों को सलाह देना कि अभिलेख में क्या दिखना चाहिए
    expert: |
      आप ये कर सकते हैं:
      - पूरे संगठन में औपचारिक बैठक अभिलेखों के मानक तय करना
      - कार्यवृत्त लेखकों को प्रशिक्षण देना और उनके काम की गुणवत्ता जाँचना
corp-correspondence-management:
  name: पत्राचार और पूछताछ प्रबंधन
  description: पत्रों, ईमेल, कॉल और पूछताछ को तुरंत और विनम्रता से संभालना, और उन्हें सही व्यक्ति तक पहुँचाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - कॉल और ईमेल का विनम्रता से उत्तर देना और सटीक संदेश लेना
      - पूछताछ को सही व्यक्ति तक भेजना
    working: |
      आप ये कर सकते हैं:
      - नियमित पत्राचार और पूछताछ स्वयं संभालना
      - दूसरों के हस्ताक्षर के लिए पत्रों और उत्तरों का मसौदा बनाना
      - पत्राचार लॉग रखना और उत्तरों के लिए अनुवर्ती कार्य करना
    practitioner: |
      आप ये कर सकते हैं:
      - संवेदनशील और शिकायत पत्रों सहित किसी वरिष्ठ प्रमुख के पत्राचार का प्रबंधन करना
      - ऐसे उत्तरों का मसौदा बनाना जिनमें व्यवहार-कुशलता, सटीकता और विवेक चाहिए
      - सुनिश्चित करना कि उत्तर समय-सीमा में दिए जाएँ
    expert: |
      आप ये कर सकते हैं:
      - कार्यकारी पत्राचार के लिए प्रक्रिया और मानक तय करना
      - नियामकों, साझेदारों और मीडिया सहित सबसे संवेदनशील पत्राचार संभालना
corp-pmo-reporting:
  name: परियोजना और पोर्टफ़ोलियो कार्यालय सहायता
  description: परियोजना और पोर्टफ़ोलियो कार्यालय की प्रक्रियाएँ चलाना, जैसे योजनाएँ, रजिस्टर, रिपोर्टिंग, दस्तावेज़ नियंत्रण और आश्वासन जाँच।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - संस्करण नियंत्रण के साथ परियोजना दस्तावेज़ों को सही जगह रखना
      - कहे जाने पर कार्रवाई, जोखिम और मुद्दा लॉग अद्यतन करना
    working: |
      आप ये कर सकते हैं:
      - कई परियोजनाओं के लिए योजनाएँ, रजिस्टर और ट्रैकर बनाए रखना
      - अद्यतन जानकारी एकत्र करना और नियमित स्थिति रिपोर्ट तैयार करना
      - जाँचना कि परियोजनाएँ सहमत पद्धति का पालन करती हैं
    practitioner: |
      आप ये कर सकते हैं:
      - पोर्टफ़ोलियो रिपोर्टिंग डिज़ाइन करना और परियोजनाओं की प्रगति, जोखिमों और लाभों का विश्लेषण करना
      - आश्वासन जाँच और गेटवे समीक्षाएँ चलाना
      - पद्धति और नियंत्रणों पर परियोजना प्रबंधकों को सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए एक पोर्टफ़ोलियो कार्यालय स्थापित करना और उसका नेतृत्व करना
      - वरिष्ठ प्रमुखों को पोर्टफ़ोलियो की स्पष्ट, विश्वसनीय जानकारी देना
      - परियोजना और पोर्टफ़ोलियो प्रबंधन के मानक और उपकरण तय करना
corp-assurance-and-audit:
  name: आश्वासन और ऑडिट संपर्क
  description: यह आश्वासन जुटाना कि नियंत्रण काम करते हैं, आंतरिक और बाहरी ऑडिट में सहायता करना, और ऑडिट सिफ़ारिशों को पूरा होने तक ट्रैक करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि संगठन में ऑडिट और आश्वासन कैसे काम करते हैं
      - माँगे जाने पर साक्ष्य देना
    working: |
      आप ये कर सकते हैं:
      - ऑडिट और निरीक्षणों के लिए साक्ष्य का समन्वय करना
      - ऑडिट सिफ़ारिशों को ट्रैक करना और लंबित कार्रवाइयों के लिए अनुवर्ती कार्य करना
    practitioner: |
      आप ये कर सकते हैं:
      - संगठन के मुख्य जोखिमों पर आश्वासन मैपिंग की योजना बनाना
      - दायरे और निष्कर्षों पर सहमति के लिए आंतरिक और बाहरी लेखा-परीक्षकों के साथ काम करना
      - समितियों को आश्वासन की कमियों की रिपोर्ट देना
    expert: |
      आप ये कर सकते हैं:
      - संगठन का आश्वासन ढाँचा डिज़ाइन करना
      - आश्वासन की मज़बूती पर ऑडिट समिति और बोर्ड को सलाह देना
corp-policy-management:
  name: नीति प्रबंधन
  description: संगठन की नीतियों और प्रक्रियाओं को लिखना, समीक्षा करना, स्वीकृत करना और प्रकाशित करना, और जाँचना कि लोग उनका पालन करते हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - अपने काम पर लागू नीतियों को खोजना और उनका पालन करना
    working: |
      आप ये कर सकते हैं:
      - नीति रजिस्टर अद्यतन रखना और स्वामियों को समीक्षाओं की याद दिलाना
      - जाँचना कि नीतियाँ सही टेम्पलेट और स्वीकृति मार्ग का उपयोग करती हैं
    practitioner: |
      आप ये कर सकते हैं:
      - विषय विशेषज्ञों के साथ नीतियों का मसौदा बनाना और समीक्षा करना
      - कानून, मानकों और समानता दायित्वों के आधार पर नीतियों की जाँच करना
      - अनुपालन की निगरानी करना और कमियों की रिपोर्ट करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए नीति ढाँचा तय करना
      - नीति प्राथमिकताओं और जोखिमों पर बोर्ड को सलाह देना
corp-internal-communications:
  name: आंतरिक संचार
  description: इंट्रानेट, न्यूज़लेटर, ब्रीफ़िंग और कार्यक्रमों जैसे चैनलों के माध्यम से कर्मचारियों को सूचित और जुड़ा हुआ रखना, विशेषकर परिवर्तन के समय।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - इंट्रानेट जैसे आंतरिक चैनलों पर सामग्री प्रकाशित करना
      - संगठन की शैली और लहजे का पालन करना
    working: |
      आप ये कर सकते हैं:
      - कर्मचारियों के लिए समाचार, ब्रीफ़िंग और न्यूज़लेटर लिखना और संपादित करना
      - आंतरिक चैनलों के लिए सामग्री की योजना बनाना और सहभागिता मापना
    practitioner: |
      आप ये कर सकते हैं:
      - नई क्लिनिकल प्रणाली जैसे बड़े परिवर्तन के लिए आंतरिक संचार की योजना बनाना
      - कर्मचारियों को जोड़ने और कठिन संदेश संभालने के बारे में प्रमुखों को सलाह देना
      - चैनलों में सुधार के लिए प्रतिक्रिया और डेटा का उपयोग करना
    expert: |
      आप ये कर सकते हैं:
      - आंतरिक संचार और कर्मचारी सहभागिता रणनीति तय करना
      - संस्कृति और सहभागिता पर कार्यकारी टीम को सलाह देना
corp-media-relations:
  name: मीडिया संबंध
  description: पत्रकारों के साथ संबंध बनाना, मीडिया पूछताछ संभालना, प्रेस विज्ञप्तियाँ लिखना और प्रवक्ताओं को तैयार करना, घटनाओं के दौरान भी।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि संगठन मीडिया पूछताछ कैसे संभालता है
      - मीडिया पूछताछ को तुरंत संचार टीम को भेजना
    working: |
      आप ये कर सकते हैं:
      - नियमित मीडिया पूछताछ दर्ज करना और उनका उत्तर देना
      - स्वीकृति के लिए प्रेस विज्ञप्तियों और बयानों का मसौदा बनाना
