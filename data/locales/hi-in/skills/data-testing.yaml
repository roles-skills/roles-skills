# Hindi translations of data/skills/data-testing.yaml. Keys are the English skill ids.
data-ai-assurance:
  name: स्वास्थ्य सेवा में सुरक्षित और निष्पक्ष AI
  description: यह सुनिश्चित करना कि स्वास्थ्य और देखभाल में उपयोग किए जाने वाले सांख्यिकीय, मशीन लर्निंग और AI मॉडल सुरक्षित, निष्पक्ष, व्याख्या-योग्य और निगरानी में हों, जिसमें रोगी समूहों के बीच पूर्वाग्रह की जाँच और चिकित्सा उपकरण तथा AI विनियमन का पालन शामिल है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि कोई मॉडल रोगियों को कैसे नुकसान पहुँचा सकता है, उदाहरण के लिए पूर्वाग्रह, ड्रिफ़्ट, या उसके आउटपुट पर अति-निर्भरता से
      - समझाना कि मॉडलों को उसी आबादी पर क्यों मान्य करना चाहिए जिस पर उनका उपयोग होगा
    working: |
      आप ये कर सकते हैं:
      - विभिन्न रोगी समूहों के लिए मॉडल का प्रदर्शन मापना और किसी भी अंतर की रिपोर्ट करना
      - मॉडल का अभीष्ट उपयोग, प्रशिक्षण डेटा और ज्ञात सीमाएँ दर्ज करना, उदाहरण के लिए मॉडल कार्ड में
      - क्लिनिकल सुरक्षा केस में मॉडल के बारे में साक्ष्य देना
    practitioner: |
      आप ये कर सकते हैं:
      - क्लिनिकल सहकर्मियों के साथ मॉडल के सत्यापन, पूर्वाग्रह आकलन और लाइव निगरानी की योजना बनाना
      - तय करना कि कब किसी मॉडल को दोबारा प्रशिक्षित करना, सीमित करना या वापस लेना है
      - टीमों को सलाह देना कि कब कोई मॉडल चिकित्सा उपकरण के रूप में विनियमित हो सकता है और उसके लिए कौन-से साक्ष्य चाहिए
    expert: |
      आप ये कर सकते हैं:
      - देखभाल में AI के आश्वासन और निगरानी के लिए संगठन के मानक तय करना
      - उच्च-जोखिम मॉडलों के परिनियोजन से पहले और बाद में उनके आश्वासन का नेतृत्व करना
      - सुरक्षित और निष्पक्ष AI पर नियामकों और साझेदारों के समक्ष संगठन का प्रतिनिधित्व करना
data-deidentification:
  name: छद्मनामकरण और प्रकटीकरण नियंत्रण
  description: जब डेटा को जोड़ा, विश्लेषित, साझा या प्रकाशित किया जाता है, तब छद्मनामकरण, अनामीकरण, छोटी संख्याओं के दमन और अन्य सांख्यिकीय प्रकटीकरण नियंत्रण विधियों से रोगी की गोपनीयता की रक्षा करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - पहचान-योग्य, छद्मनामित और अनामित डेटा के बीच अंतर समझाना
      - आउटपुट में छोटी संख्याओं को छिपाने के संगठन के नियमों का पालन करना
    working: |
      आप ये कर सकते हैं:
      - छद्मनामित डेटा के साथ काम करना और आउटपुट जारी करने से पहले प्रकटीकरण जाँच करना
      - पहचानना कि कब जुड़ा हुआ या विस्तृत डेटा किसी रोगी की पहचान उजागर कर सकता है
    practitioner: |
      आप ये कर सकते हैं:
      - ऐसी छद्मनामकरण और लिंकेज विधियाँ डिज़ाइन करना जो पहचानकर्ताओं को विश्लेषण डेटा से अलग रखें
      - किसी डेटासेट या प्रकाशन के पुनः-पहचान जोखिम का आकलन करना और उपयुक्त नियंत्रण चुनना
      - विश्वसनीय अनुसंधान परिवेश जैसी सुरक्षित व्यवस्थाओं पर टीमों को सलाह देना
    expert: |
      आप ये कर सकते हैं:
      - डी-आइडेंटिफ़िकेशन और प्रकटीकरण नियंत्रण के लिए संगठन के मानक तय करना
      - उच्च-जोखिम डेटा रिलीज़ और लिंकेज परियोजनाओं का आश्वासन देना
      - अनुसंधान और योजना के लिए सुरक्षित डेटा पहुँच पर साझेदारों के साथ काम का नेतृत्व करना
