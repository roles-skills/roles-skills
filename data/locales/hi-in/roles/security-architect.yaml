summary: >
  सुरक्षा आर्किटेक्ट संगठन की डिजिटल स्वास्थ्य सेवाओं की सुरक्षा डिज़ाइन करते हैं, ताकि रोगी जानकारी गोपनीय, सटीक और देखभाल की आवश्यकता होने पर उपलब्ध रहे। वे सुरक्षा पैटर्न और नियंत्रण तय करते हैं, नए डिज़ाइनों और आपूर्तिकर्ताओं के सुरक्षा जोखिम का आकलन करते हैं, और टीमों को जोखिम-आधारित निर्णय लेने में मदद करते हैं जो सेवाओं को चिकित्सकों और रोगियों के लिए सुरक्षित और उपयोगी दोनों रखें।
health_context:
  - स्वास्थ्य संगठन अक्सर रैनसमवेयर और डेटा चोरी के लक्ष्य होते हैं, और एक हमला क्लिनिकल सेवाओं को रोक सकता है, इसलिए उपलब्धता उतनी ही महत्वपूर्ण है जितनी गोपनीयता।
  - सुरक्षा नियंत्रणों को आपातकालीन देखभाल में बाधा नहीं डालनी चाहिए, इसलिए डिज़ाइन मज़बूत प्रमाणीकरण और क्लिनिकल परिवेश में तेज़ पहुँच के बीच संतुलन बनाते हैं।
  - जुड़े हुए चिकित्सा उपकरणों और पुरानी क्लिनिकल प्रणालियों को अक्सर जल्दी पैच नहीं किया जा सकता, इसलिए आर्किटेक्ट सेगमेंटेशन जैसे क्षतिपूरक नियंत्रण डिज़ाइन करते हैं।
  - कई कर्मचारियों, साझेदार संगठनों और आपूर्तिकर्ताओं को रोगी अभिलेखों तक पहुँच चाहिए, इसलिए पहचान, भूमिका-आधारित पहुँच और ऑडिट केंद्रीय हैं।
  - सुरक्षा डिज़ाइनों को सूचना शासन दायित्वों और ISO/IEC 27001 जैसे प्रकाशित सुरक्षा मानकों में सहायक होना चाहिए।
levels:
  - title: सुरक्षा आर्किटेक्ट
    responsibilities:
      - सेवाओं और प्रणालियों के लिए सुरक्षा नियंत्रण डिज़ाइन करना, जिनमें पहचान, एन्क्रिप्शन, लॉगिंग और नेटवर्क सुरक्षा शामिल हैं।
      - नए डिज़ाइनों और आपूर्तिकर्ता उत्पादों की सुरक्षा का आकलन करना, और जोखिम तथा सुझाए गए नियंत्रण दर्ज करना।
      - रोगी लॉगिन और कर्मचारी सिंगल साइन-ऑन जैसे सुरक्षा पैटर्न विकसित करना जिन्हें डिलीवरी टीमें फिर से उपयोग कर सकें।
      - आसानी से अद्यतन न हो सकने वाले चिकित्सा उपकरणों और पुरानी क्लिनिकल प्रणालियों के लिए क्षतिपूरक नियंत्रणों पर सलाह देना।
      - सूचना शासन और क्लिनिकल सुरक्षा सहकर्मियों के साथ काम करना ताकि सुरक्षा, निजता और क्लिनिकल सुरक्षा जोखिमों का एक साथ आकलन हो।
      - सुरक्षा इंजीनियरों और अन्य आर्किटेक्टों को सुरक्षित डिज़ाइन में कोचिंग देना।
    qualifications:
      - सुरक्षा आर्किटेक्चर या सुरक्षा इंजीनियरिंग का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
      - मान्यता प्राप्त सुरक्षा योग्यता या समकक्ष अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 6) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8a पर रखते हैं। विश्लेषण और कार्य करने की स्वतंत्रता का अंक बैंड 7 प्रोफ़ाइल से ऊपर है क्योंकि यह पद कम पर्यवेक्षण में महत्वपूर्ण क्लिनिकल प्रणालियों की सुरक्षा डिज़ाइन करता है।"
  - title: लीड सुरक्षा आर्किटेक्ट
    responsibilities:
      - कई उच्च-जोखिम परियोजनाओं या क्लिनिकल प्रणालियों या क्लाउड होस्टिंग जैसे किसी प्रमुख क्षेत्र के सुरक्षा आर्किटेक्चर का नेतृत्व करना।
      - अपने क्षेत्र के डिज़ाइनों के लिए सुरक्षा सिद्धांत और मानक तय करना और डिज़ाइन प्राधिकरणों में उनका आश्वासन देना।
      - सुरक्षा जोखिमों और उनके प्रबंधन के विकल्पों पर वरिष्ठ जोखिम स्वामियों को सलाह देना।
      - साझेदार संगठनों और आपूर्तिकर्ताओं के साथ साझा किए जाने वाले डेटा के लिए सुरक्षा डिज़ाइन करना।
      - सुरक्षा आर्किटेक्टों का नेतृत्व और विकास करना।
    qualifications:
      - जटिल सेवाओं के लिए सुरक्षा आर्किटेक्चर का व्यापक अनुभव।
  - title: प्रधान सुरक्षा आर्किटेक्ट
    responsibilities:
      - संगठन का सुरक्षा आर्किटेक्चर दृष्टिकोण, सिद्धांत और रणनीति तय करना।
      - रोगी देखभाल और सेवाओं के लिए साइबर सुरक्षा जोखिम पर कार्यकारी टीम और बोर्ड को सलाह देना।
      - सुनिश्चित करना कि बड़े हमले से उबरने सहित साइबर लचीलापन महत्वपूर्ण क्लिनिकल सेवाओं के डिज़ाइन में शामिल हो।
      - अंतर-संगठनात्मक साइबर सुरक्षा और मानक समुदायों में संगठन का प्रतिनिधित्व करना।
      - सुरक्षा आर्किटेक्चर अभ्यास का नेतृत्व करना और उसके लोगों का विकास करना।
    qualifications:
      - विभिन्न संगठनों में सुरक्षा आर्किटेक्चर का नेतृत्व करने का व्यापक अनुभव।
