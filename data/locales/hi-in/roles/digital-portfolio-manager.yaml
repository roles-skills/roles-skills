summary: >
  डिजिटल पोर्टफ़ोलियो प्रबंधक संगठन को उसकी डिजिटल परियोजनाओं, कार्यक्रमों और उत्पादों के पोर्टफ़ोलियो को चुनने, ट्रैक करने और शासित करने में मदद करते हैं, ताकि वह उस काम में निवेश करे जो रोगियों, चिकित्सकों और देखभाल कर्मचारियों के लिए सबसे अधिक उपयोगी हो। वे पोर्टफ़ोलियो शासन और रिपोर्टिंग चलाते हैं, प्रमुखों को अच्छे साक्ष्य के साथ प्राथमिकताएँ तय करने में मदद करते हैं, और सुनिश्चित करते हैं कि पोर्टफ़ोलियो वादा किए गए लाभ दे।
health_context:
  - डिजिटल काम अग्रिम पंक्ति की देखभाल के साथ वित्तपोषण के लिए प्रतिस्पर्धा करता है, इसलिए पोर्टफ़ोलियो प्रबंधक प्रमुखों को रोगियों और कर्मचारियों के लिए डिजिटल निवेश के लाभ दिखाने में मदद करते हैं।
  - पोर्टफ़ोलियो शासन में क्लिनिकल सुरक्षा, सूचना शासन और साइबर सुरक्षा आश्वासन शामिल होना चाहिए, इसलिए पोर्टफ़ोलियो प्रबंधक इन्हें समय, लागत और दायरे के साथ ट्रैक करते हैं।
  - कई डिजिटल परियोजनाएँ क्लिनिकल और परिचालन टीमों की क्षमता पर निर्भर होती हैं, जैसे परीक्षण के लिए चिकित्सक या प्रशिक्षण के लिए कर्मचारी, इसलिए पोर्टफ़ोलियो प्रबंधक सेवाओं पर माँग के टकराव पर नज़र रखते हैं।
  - वित्तपोषण अक्सर कई स्रोतों से आता है जिनके अपने रिपोर्टिंग नियम और समय-सीमाएँ होती हैं, इसलिए पोर्टफ़ोलियो प्रबंधक रिपोर्टिंग को सटीक और समय पर रखते हैं।
levels:
  - title: डिजिटल पोर्टफ़ोलियो विश्लेषक
    responsibilities:
      - पोर्टफ़ोलियो की परियोजनाओं से स्थिति, जोखिम, वित्त और लाभ डेटा एकत्र करना और जाँचना।
      - पोर्टफ़ोलियो रजिस्टर और डैशबोर्ड बनाए रखना, और रिपोर्टिंग में अंतराल या असंगतियाँ पहचानना।
      - पोर्टफ़ोलियो शासन बोर्डों के लिए पत्र और रिपोर्ट तैयार करना।
      - परियोजनाओं में क्लिनिकल सुरक्षा अनुमोदन और डेटा संरक्षण प्रभाव आकलन जैसे आश्वासन पड़ावों को ट्रैक करना।
      - प्राथमिकता निर्धारण और योजना विश्लेषण में पोर्टफ़ोलियो प्रबंधकों की सहायता करना।
    qualifications:
      - डिग्री या संबंधित योग्यता, या विश्लेषण या रिपोर्टिंग का समकक्ष अनुभव।
    job_evaluation_notes: UK GDaD PCF विश्लेषक और प्रबंधक दोनों स्तरों को HEO या SEO पर रखता है। यह संदर्भ विश्लेषक को बैंड 5 पर रखता है, क्योंकि यह पोर्टफ़ोलियो प्रबंधक को रिपोर्ट करने वाला सीखने का स्तर है, और प्रबंधक को बैंड 6 पर, ताकि दोनों स्तर एक ही बैंड में न हों।
  - title: डिजिटल पोर्टफ़ोलियो प्रबंधक
    responsibilities:
      - डिजिटल परियोजनाओं और कार्यक्रमों के किसी पोर्टफ़ोलियो का समन्वय करना, जैसे किसी एक निदेशालय का पूरा डिजिटल काम।
      - टीमों को शासन, आश्वासन और डिलीवरी प्रक्रियाओं का पालन करने में मदद करना और उन्हें आनुपातिक बनाना।
      - आवश्यकता, लाभ, जोखिम और क्षमता के साक्ष्य से काम को प्राथमिकता देने में प्रमुखों की सहायता करना।
      - बोर्डों और हितधारकों को पोर्टफ़ोलियो के प्रदर्शन, जोखिमों और लाभों की स्पष्ट रिपोर्ट देना।
      - परियोजनाओं के पार क्लिनिकल और परिचालन टीमों पर माँग के टकराव पहचानना और उन्हें सुलझाने में मदद करना।
    qualifications:
      - पोर्टफ़ोलियो, कार्यक्रम या परियोजना प्रबंधन का अनुभव, या समकक्ष अनुभव।
  - title: वरिष्ठ डिजिटल पोर्टफ़ोलियो प्रबंधक
    responsibilities:
      - संगठन के डिजिटल पोर्टफ़ोलियो, या उसके बड़े हिस्से, और उसकी शासन तथा आश्वासन प्रक्रियाओं का प्रबंधन करना।
      - पूरे पोर्टफ़ोलियो में परिणामों और लाभों को ट्रैक और विश्लेषित करना, और टीमों को डिलीवरी में मदद के लिए मुद्दों पर कार्रवाई करना।
      - सुनिश्चित करना कि पोर्टफ़ोलियो क्लिनिकल सुरक्षा, सूचना शासन और साइबर सुरक्षा आश्वासन सहित मानकों को पूरा करे।
      - स्पष्ट साक्ष्य का उपयोग करके प्राथमिकता, निवेश और समझौतों पर वरिष्ठ प्रमुखों को सलाह देना।
      - वित्तपोषकों और बाहरी निकायों को पोर्टफ़ोलियो रिपोर्टिंग का प्रबंधन करना।
      - पोर्टफ़ोलियो विश्लेषकों और प्रबंधकों का लाइन प्रबंधन करना।
    qualifications:
      - पोर्टफ़ोलियो या कार्यक्रम प्रबंधन का व्यापक अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
    job_evaluation_notes: बैंड 7 का कोई स्तर नहीं है क्योंकि UK GDaD PCF डिजिटल पोर्टफ़ोलियो प्रबंधक (HEO/SEO) से सीधे वरिष्ठ डिजिटल पोर्टफ़ोलियो प्रबंधक (G7) पर जाता है।
  - title: डिजिटल पोर्टफ़ोलियो प्रमुख
    responsibilities:
      - डिजिटल पोर्टफ़ोलियो कार्य और पोर्टफ़ोलियो प्रबंधकों की टीम का नेतृत्व करना।
      - पोर्टफ़ोलियो रणनीति, नियंत्रण और शासन तय करना, और सुनिश्चित करना कि उनका उपयोग हो।
      - कार्यकारी प्रमुखों को पोर्टफ़ोलियो के भविष्य की अंतर्दृष्टि देना, ताकि वे निवेश निर्णय ले सकें।
      - सुनिश्चित करना कि रोगियों, कर्मचारियों और संगठन के लिए पोर्टफ़ोलियो के लाभ प्राप्त हों और उनकी रिपोर्ट हो।
      - पोर्टफ़ोलियो-स्तरीय जोखिमों से निपटना और मुद्दों को कार्यकारी टीम तक आगे बढ़ाना।
      - कार्य के बजट और क्षमता का प्रबंधन करना।
    qualifications:
      - किसी जटिल संगठन में पोर्टफ़ोलियो प्रबंधन का नेतृत्व करने का व्यापक अनुभव।
    job_evaluation_notes: वित्तीय संसाधन का अंक स्तर 5 पर है क्योंकि डिजिटल पोर्टफ़ोलियो प्रमुख कई सेवाओं को कवर करने वाले पूरे डिजिटल पोर्टफ़ोलियो के निवेश की देखरेख करता है; सूचना संसाधन स्तर 6 पर है क्योंकि पोर्टफ़ोलियो रजिस्टर और रिपोर्टिंग पूरे संगठन को कवर करते हैं।
