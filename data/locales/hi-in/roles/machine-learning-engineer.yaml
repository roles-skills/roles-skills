summary: >
  मशीन लर्निंग इंजीनियर डेटा वैज्ञानिकों द्वारा बनाए गए या आपूर्तिकर्ताओं से ख़रीदे गए मॉडलों को लाइव स्वास्थ्य और देखभाल सेवाओं में विश्वसनीय रूप से काम करने योग्य बनाते हैं। वे मॉडलों को प्रशिक्षित करने, परखने, परिनियोजित करने और उनकी निगरानी करने वाली पाइपलाइन बनाते हैं, और उन्हें क्लिनिकल तथा परिचालन प्रणालियों के साथ एकीकृत करते हैं। वे सुनिश्चित करते हैं कि जब वास्तविक रोगी और कर्मचारी उन पर निर्भर हों, तब मॉडल सुरक्षित, संरक्षित, निष्पक्ष और प्रभावी बने रहें।
health_context:
  - रोगी आबादी, क्लिनिकल अभ्यास या अभिलेखन की आदतें बदलने पर लाइव मॉडल ड्रिफ़्ट कर सकते हैं, इसलिए हर रोगी समूह के लिए प्रदर्शन की निगरानी होती है और आवश्यकता होने पर मॉडल दोबारा प्रशिक्षित या वापस लिए जाते हैं।
  - निदान, ट्राइएज या उपचार में सहायक मॉडल चिकित्सा उपकरण के रूप में विनियमित हो सकता है, जिससे उसके सॉफ़्टवेयर जीवनचक्र, परिवर्तन नियंत्रण और बाज़ार-पश्चात निगरानी की औपचारिक आवश्यकताएँ आती हैं।
  - क्लिनिकल सुरक्षा केस के लिए साक्ष्य चाहिए कि मॉडल कैसे विफल होता है, उसके आउटपुट चिकित्सकों को कैसे दिखते हैं, और उसके अनुपलब्ध होने पर क्या होता है।
  - रोगी डेटा पर प्रशिक्षित मॉडल व्यक्तियों के बारे में जानकारी लीक कर सकते हैं, इसलिए प्रशिक्षण डेटा, मॉडल आर्टिफ़ैक्ट और लॉग को डेटा की तरह ही सुरक्षित रखा जाता है।
  - जेनरेटिव AI और बड़े भाषा मॉडल क्लिनिकल नोट्स में गढ़ी हुई सामग्री जैसे अतिरिक्त जोखिम लाते हैं, जिनके लिए विशेष परीक्षण और मानवीय निगरानी चाहिए।
levels:
  - title: वरिष्ठ मशीन लर्निंग इंजीनियर
    responsibilities:
      - स्वचालित परीक्षण, संस्करण और रोलबैक के साथ मॉडलों को उत्पादन क्लिनिकल और परिचालन सेवाओं में परिनियोजित करना।
      - अलर्ट और स्पष्ट स्वामियों के साथ रोगी समूहों में मॉडल प्रदर्शन, ड्रिफ़्ट और निष्पक्षता की निगरानी बनाना।
      - जहाँ संभव हो HL7 FHIR जैसे खुले मानकों का उपयोग करके मॉडलों को क्लिनिकल प्रणालियों के साथ एकीकृत करना।
      - क्लिनिकल सुरक्षा केस और चिकित्सा उपकरण तकनीकी फ़ाइलों के लिए आवश्यक परीक्षण, परिवर्तन और निगरानी साक्ष्य तैयार करना।
      - जेनरेटिव AI मॉडलों सहित आपूर्तिकर्ता और ओपन सोर्स मॉडलों का स्थानीय उपयोग के लिए आकलन और अनुकूलन करना।
      - डेटा वैज्ञानिकों और इंजीनियरों को मशीन लर्निंग इंजीनियरिंग अभ्यास में कोचिंग देना।
    qualifications:
      - उत्पादन में मशीन लर्निंग प्रणालियाँ बनाने और चलाने का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
  - title: लीड मशीन लर्निंग इंजीनियर
    responsibilities:
      - मॉडलों को अनुसंधान से पूरे संगठन में सुरक्षित लाइव उपयोग तक लाने के सबसे जटिल काम का नेतृत्व करना।
      - विनियमित और सुरक्षा-महत्वपूर्ण मॉडलों के लिए आवश्यक नियंत्रणों सहित मशीन लर्निंग जीवनचक्र परिभाषित करना।
      - मॉडल परीक्षण, निगरानी, सुरक्षा और नैतिकता के मानक तय करना, और लाइव उपयोग में मॉडलों का आश्वासन देना।
      - मॉडलों के आकलन और अनुमोदन के तरीक़े पर सहमति के लिए क्लिनिकल सुरक्षा अधिकारियों, सूचना शासन और नियामक विशेषज्ञों के साथ काम करना।
      - प्रशिक्षण आवश्यकताएँ पहचानना और मशीन लर्निंग इंजीनियरों तथा संबंधित भूमिकाओं का विकास करना।
    qualifications:
      - जटिल या विनियमित सेवाओं के लिए मशीन लर्निंग इंजीनियरिंग का नेतृत्व करने का व्यापक अनुभव।
