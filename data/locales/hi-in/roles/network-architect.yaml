summary: >
  नेटवर्क आर्किटेक्ट वे लोकल, वाइड एरिया, वायरलेस और क्लाउड नेटवर्क डिज़ाइन करते हैं जो संगठन के स्थलों, कर्मचारियों, क्लिनिकल प्रणालियों और चिकित्सा उपकरणों को जोड़ते हैं। वे सुनिश्चित करते हैं कि नेटवर्क कभी न रुकने वाली देखभाल के लिए पर्याप्त तेज़, लचीले और सुरक्षित हों, और योजना बनाते हैं कि सेवाओं के क्लाउड पर जाने और साझेदार संगठनों से जुड़ने के साथ नेटवर्क कैसे बदलें।
health_context:
  - क्लिनिकल प्रणालियाँ, टेलीफ़ोनी और चिकित्सा उपकरण नेटवर्क पर निर्भर हैं, इसलिए एक व्यवधान देखभाल रोक सकता है; डिज़ाइनों में लचीलापन और परखा हुआ फ़ेलओवर चाहिए।
  - नेटवर्क पर अक्सर ऐसे जुड़े चिकित्सा उपकरण होते हैं जिन्हें पैच करना कठिन है, इसलिए आर्किटेक्ट उनकी रक्षा के लिए सेगमेंटेशन और निगरानी डिज़ाइन करते हैं।
  - कर्मचारी अस्पतालों, क्लीनिकों, सामुदायिक परिवेशों और रोगियों के घरों में काम करते हैं, इसलिए डिज़ाइनों को सुरक्षित मोबाइल और दूरस्थ पहुँच में सहायक होना चाहिए।
  - नेटवर्क साझा स्वास्थ्य और देखभाल नेटवर्क और साझेदार संगठनों से जुड़ते हैं, जिनकी अपनी कनेक्शन और सुरक्षा आवश्यकताएँ होती हैं।
  - क्लिनिकल क्षेत्रों में परिवर्तनों की रोगी देखभाल को ध्यान में रखकर सावधानीपूर्वक योजना चाहिए, उदाहरण के लिए काम को व्यस्त समय से बाहर निर्धारित करना।
levels:
  - title: एसोसिएट नेटवर्क आर्किटेक्ट
    responsibilities:
      - नेटवर्क आर्किटेक्टों के मार्गदर्शन में नेटवर्क डिज़ाइन, आरेख और विनिर्देशों का मसौदा बनाना।
      - स्थलों का सर्वेक्षण करना और वायरलेस कवरेज और उपकरण कनेक्शन सहित क्लिनिकल क्षेत्रों की आवश्यकताएँ एकत्र करना।
      - नेटवर्क टोपोलॉजी, एड्रेसिंग और जुड़े उपकरणों के अभिलेख अद्यतन रखना।
      - समीक्षा से पहले जाँचना कि डिज़ाइन सेवा स्तरों और सुरक्षा मानकों को पूरा करते हैं।
    qualifications:
      - कंप्यूटिंग या नेटवर्किंग में डिग्री, मान्यता प्राप्त नेटवर्किंग योग्यता, या समकक्ष अनुभव।
      - नेटवर्क डिज़ाइन का विशेषज्ञ ज्ञान, स्नातकोत्तर डिप्लोमा स्तर या समकक्ष अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 5) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 6 पर रखते हैं। ज्ञान का अंक स्नातकोत्तर डिप्लोमा स्तर पर है, और सूचना संसाधन स्तर 5 पर है क्योंकि यह पद नेटवर्क के उन हिस्सों को डिज़ाइन करता है जिन पर प्रमुख सूचना प्रणालियाँ निर्भर हैं।"
  - title: नेटवर्क आर्किटेक्ट
    responsibilities:
      - स्थलों और सेवाओं के लिए लोकल, वाइड एरिया, वायरलेस और क्लाउड नेटवर्क समाधान डिज़ाइन करना।
      - चिकित्सा उपकरणों, क्लिनिकल प्रणालियों और अतिथि पहुँच के लिए नेटवर्क सेगमेंटेशन डिज़ाइन करना।
      - सेवा प्रमुखों के साथ क्लिनिकल क्षेत्रों में नेटवर्क परिवर्तनों की योजना बनाना ताकि देखभाल बाधित न हो।
      - आपूर्तिकर्ताओं के साथ सेवा स्तर और साझेदार नेटवर्क के साथ कनेक्शन आवश्यकताओं पर सहमति बनाना।
      - नई नेटवर्क तकनीकों और संगठन के सुरक्षा मानकों के साथ उनकी अनुकूलता का आकलन करना।
    qualifications:
      - नेटवर्क आर्किटेक्चर का विशेषज्ञ ज्ञान, मास्टर स्तर या समकक्ष अनुभव।
      - एंटरप्राइज़ नेटवर्क डिज़ाइन करने और उनका समर्थन करने का अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 6) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 7 पर रखते हैं। ज्ञान का अंक मास्टर स्तर या समकक्ष पर है, लोकल, वाइड एरिया, वायरलेस और क्लाउड नेटवर्क के विशेषज्ञ ज्ञान के लिए।"
  - title: लीड नेटवर्क आर्किटेक्ट
    responsibilities:
      - संगठन के स्थलों, डेटा केंद्रों और क्लाउड कनेक्शनों सहित उसके नेटवर्क आर्किटेक्चर का स्वामित्व रखना।
      - नेटवर्क डिज़ाइन मानक तय करना और डिज़ाइन प्राधिकरण में डिज़ाइनों का आश्वासन देना।
      - महत्वपूर्ण क्लिनिकल सेवाओं के लिए नेटवर्क लचीलापन और पुनर्प्राप्ति डिज़ाइन करना और सुनिश्चित करना कि उसका परीक्षण हो।
      - नेटवर्क निवेश, आपूर्तिकर्ता अनुबंधों और नई सेवाओं के नेटवर्क जोखिमों पर सलाह देना।
      - विशेषज्ञ एस्केलेशन बिंदु के रूप में काम करना और अन्य नेटवर्क आर्किटेक्टों तथा इंजीनियरों का मार्गदर्शन करना।
    qualifications:
      - जटिल संगठनों के लिए नेटवर्क आर्किटेक्चर का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 7) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8a पर रखते हैं। सूचना संसाधन स्तर 6 पर है क्योंकि यह पद उस नेटवर्क आर्किटेक्चर का स्वामित्व रखता है जिस पर संगठन की सभी सूचना प्रणालियाँ निर्भर हैं।"
