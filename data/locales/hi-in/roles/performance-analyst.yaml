summary: >
  प्रदर्शन विश्लेषक मापते हैं कि संगठन की डिजिटल स्वास्थ्य सेवाएँ रोगियों, सेवा उपयोगकर्ताओं, चिकित्सकों और देखभाल कर्मचारियों के लिए कितनी अच्छी तरह काम करती हैं। वे माप ढाँचे बनाते हैं, उपयोग और परिणाम डेटा एकत्र और विश्लेषित करते हैं, और उत्पाद टीमों तथा सेवा प्रमुखों को यह समझने में मदद करते हैं कि परिवर्तन पहुँच, अनुभव, सुरक्षा और दक्षता में सुधार करते हैं या नहीं।
health_context:
  - सफलता के माप डिजिटल अपनाने से आगे जाते हैं, और उनमें देखभाल पर प्रभाव शामिल होते हैं, जैसे छूटी अपॉइंटमेंट, प्रतीक्षा समय, सुरक्षित ट्राइएज और बचाया गया कर्मचारी समय।
  - स्वास्थ्य सेवाओं पर एनालिटिक्स और ट्रैकिंग संवेदनशील जानकारी उजागर कर सकते हैं, जैसे किसी व्यक्ति ने कौन-सी बीमारी खोजी, इसलिए माप में सहमति, कुकी नियमों और गोपनीयता का सम्मान होना चाहिए।
  - डिजिटल सेवाओं को स्वास्थ्य असमानताएँ नहीं बढ़ानी चाहिए, इसलिए विश्लेषक उन समूहों के अपनाने और परिणामों को देखते हैं जिनके डिजिटल सेवाओं का उपयोग करने की संभावना कम है।
  - प्रदर्शन डेटा बोर्डों, कमीशनरों और नियामकों को रिपोर्ट किया जा सकता है, इसलिए परिभाषाएँ एकरूप और अच्छी तरह दर्ज होनी चाहिए।
levels:
  - title: एसोसिएट प्रदर्शन विश्लेषक
    responsibilities:
      - रोगी और कर्मचारी डिजिटल सेवाओं का उपयोग कैसे करते हैं, इस पर नियमित रिपोर्ट तैयार करना, जैसे पंजीकरण, पूर्णता और छोड़ने के बिंदु।
      - एनालिटिक्स और ट्रैकिंग डेटा में अंतराल और त्रुटियाँ जाँचना और टीम को उनकी रिपोर्ट देना।
      - उपयोग डेटा एकत्र और साझा करते समय सहमति और गोपनीयता पर संगठन के नियमों का पालन करना।
      - उत्पाद टीमों को सेवा उपयोग के सरल प्रश्नों के उत्तर देने में मदद करना।
    qualifications:
      - अच्छा अंक ज्ञान और डेटा संभालने या विश्लेषण का कुछ अनुभव, या समकक्ष।
  - title: प्रदर्शन विश्लेषक
    responsibilities:
      - उत्पाद टीमों और क्लिनिकल प्रमुखों के साथ किसी सेवा की सफलता की परिभाषा पर सहमति बनाना, जिसमें देखभाल और कर्मचारियों पर प्रभाव शामिल हैं।
      - एनालिटिक्स स्थापित और सत्यापित करना, ताकि ट्रैकिंग सटीक, आनुपातिक हो और सहमति का सम्मान करे।
      - परिवर्तनों का प्रभाव दिखाने के लिए डिजिटल एनालिटिक्स को अपॉइंटमेंट और रेफ़रल जैसे परिचालन डेटा के साथ जोड़ना।
      - विभिन्न रोगी समूहों के अपनाने और परिणामों का विश्लेषण करना और डिजिटल बहिष्करण के जोखिमों को उजागर करना।
      - उत्पाद टीमों और सेवा प्रमुखों के सामने निष्कर्ष प्रस्तुत करना और सुधार सुझाना।
    qualifications:
      - किसी गणितीय विषय में डिग्री, या समकक्ष अनुभव।
      - डिजिटल सेवाओं का प्रदर्शन मापने का अनुभव।
  - title: वरिष्ठ प्रदर्शन विश्लेषक
    responsibilities:
      - सेवाओं के किसी समूह या डिजिटल बाह्य रोगी सेवा या ऑनलाइन ट्राइएज जैसे किसी बड़े कार्यक्रम के प्रदर्शन माप का नेतृत्व करना।
      - क्लिनिकल, वित्त और परिचालन प्रमुखों के साथ लाभ माप डिज़ाइन करना और डिलीवरी के दौरान उन्हें ट्रैक करना।
      - सूचना शासन और सुरक्षा आवश्यकताओं को पूरा करने वाले एनालिटिक्स उपकरण चुनना और कॉन्फ़िगर करना।
      - कार्यक्रम बोर्डों और वरिष्ठ प्रमुखों के सामने प्रदर्शन साक्ष्य प्रस्तुत करना।
      - विश्लेषकों को कोचिंग देना और एक या अधिक प्रदर्शन विश्लेषकों का लाइन प्रबंधन कर सकना।
    qualifications:
      - डिजिटल सेवाओं के प्रदर्शन विश्लेषण का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
  - title: लीड प्रदर्शन विश्लेषक
    responsibilities:
      - डिजिटल स्वास्थ्य सेवाओं के एक पोर्टफ़ोलियो में प्रदर्शन विश्लेषकों की एक टीम का नेतृत्व करना।
      - प्रमुख प्रदर्शन मापों की एकरूप परिभाषाओं पर सहमति बनाना, ताकि बोर्डों और साझेदारों को दी जाने वाली रिपोर्टों की समय के साथ तुलना हो सके।
      - सुनिश्चित करना कि एनालिटिक्स डेटा सटीक हो, उचित रूप से उपयोग हो और सूचना शासन नियमों के अनुसार संभाला जाए।
      - पोर्टफ़ोलियो प्राथमिकताओं और निवेश को प्रभावित करने के लिए प्रदर्शन साक्ष्य का उपयोग करना।
      - सभी स्तरों के विश्लेषकों को कोचिंग और मार्गदर्शन देना।
    qualifications:
      - प्रदर्शन विश्लेषण और विश्लेषकों का नेतृत्व करने का व्यापक अनुभव।
  - title: प्रदर्शन विश्लेषण प्रमुख
    responsibilities:
      - संगठन की डिजिटल सेवाओं के प्रदर्शन और लाभों को मापने की रणनीति तय करना।
      - प्रदर्शन विश्लेषण और प्रदर्शन रिपोर्टिंग के लिए गुणवत्ता आश्वासन ढाँचा परिभाषित करना।
      - प्रदर्शन साक्ष्य डिजिटल सेवाओं और रोगी परिणामों के बारे में क्या दिखाता है, इस पर कार्यकारी प्रमुखों को सलाह देना।
      - विधियाँ और डेटा साझा करने के लिए डेटा विश्लेषण और डेटा विज्ञान जैसे अन्य विश्लेषणात्मक पेशों के साथ काम करना।
      - भर्ती और विकास सहित प्रदर्शन विश्लेषण समुदाय की क्षमता की योजना बनाना।
    qualifications:
      - पूरे संगठन में प्रदर्शन विश्लेषण का नेतृत्व करने का व्यापक अनुभव।
