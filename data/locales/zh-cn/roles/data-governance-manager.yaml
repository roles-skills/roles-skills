summary: >
  数据治理经理确保组织的医疗卫生和照护数据得到良好管理、值得信赖，并被安全合法地使用。他们建立并运行关于数据所有权、质量、元数据和数据共享的框架、政策和标准，并与数据负责人、信息治理同事和临床负责人合作，使数据能够放心地用于照护、规划和研究。
health_context:
  - 健康数据是高度敏感的个人数据，因此数据治理与信息治理、数据保护和保密义务密切配合。
  - 数据与许多医疗卫生和照护合作伙伴共享，用于直接照护、规划和研究，每种用途都需要明确的合法依据、协议和控制措施。
  - SNOMED CT、ICD 和 HL7 FHIR 等临床数据标准以及商定的数据定义，是使数据在各系统和组织之间保持一致的核心。
  - 数据质量差可能直接导致患者受到伤害，例如遗漏过敏信息或患者匹配错误，也可能导致有关服务的错误决策。
  - 患者和公众期望了解其数据如何被使用，因此治理包括透明度以及尊重患者对二次使用的选择。
levels:
  - title: 数据治理经理
    responsibilities:
      - 运行组织的数据治理框架，包括数据所有权、数据管理职责和决策小组。
      - 维护数据目录、业务术语表和数据标准，包括商定的临床和运营定义。
      - 监控关键数据集的数据质量，并与数据负责人一起从根本上解决问题。
      - 与信息治理同事一起处理新数据用途的数据共享协议和数据保护影响评估。
      - 记录和管理数据风险与问题，并上报给相应的负责人。
      - 提高创建和使用健康数据的员工的数据素养。
    qualifications:
      - 数据、信息管理或相关学科的学位或专业资格，或同等经验。
      - 在复杂组织中具有数据治理或数据管理的经验。
    job_evaluation_notes: UK GDaD PCF 建议此级别为 HEO 至 G7，对应第 6 职级。本参考资料将其定为第 7 职级，因为在医疗卫生组织中，该岗位通常治理全组织的保密患者数据，并制定影响多项服务的数据政策。
  - title: 首席数据治理经理
    responsibilities:
      - 领导全组织数据治理框架、政策和标准的设计和运行。
      - 协调数据负责人和数据管理员管理数据风险，接受或化解风险，并向高级委员会报告。
      - 领导更广泛的数据管理工作，例如患者、员工和场所的主数据以及参考数据。
      - 为与医疗卫生和照护合作伙伴及研究人员共享的数据商定数据治理安排。
      - 就新系统和新数据用途如何符合数据标准和治理规则向项目群提供建议。
      - 直线管理数据治理人员。
    qualifications:
      - 在领导数据治理或数据管理方面拥有广泛经验。
  - title: 数据治理主管
    responsibilities:
      - 与首席数据官和信息风险执行负责人一起制定数据治理和使用战略。
      - 制定数据治理政策和标准，并监控组织的遵守情况。
      - 对管理组织的数据风险负责，并向董事会报告。
      - 在数据治理方面代表组织与医疗卫生和照护合作伙伴、监管机构和患者团体沟通。
      - 推动就数据如何被使用向患者和公众保持公开透明。
      - 领导和培养数据治理职能。
    qualifications:
      - 在全组织领导数据治理方面拥有广泛经验。
