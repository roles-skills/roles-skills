summary: >
  安全架构师设计组织数字健康服务的安全，使患者信息保持保密、准确，并在照护需要时可用。他们制定安全模式和控制措施，评估新设计和供应商的安全风险，并帮助团队作出基于风险的决策，使服务既安全又便于临床医生和患者使用。
health_context:
  - 医疗卫生组织经常成为勒索软件和数据窃取的目标，一次攻击就可能使临床服务停摆，因此可用性与保密性同样重要。
  - 安全控制措施不得妨碍紧急照护，因此设计要在强身份验证与临床环境中的快速访问之间取得平衡。
  - 联网医疗器械和遗留临床系统往往无法快速打补丁，因此架构师设计网络分段等补偿性控制措施。
  - 许多员工、合作组织和供应商需要访问患者记录，因此身份、基于角色的访问和审计是核心。
  - 安全设计必须支持信息治理义务和 ISO/IEC 27001 等已发布的安全标准。
levels:
  - title: 安全架构师
    responsibilities:
      - 为服务和系统设计安全控制措施，包括身份、加密、日志和网络防护。
      - 评估新设计和供应商产品的安全性，记录风险和建议的控制措施。
      - 开发交付团队可复用的安全模式，例如用于患者登录和员工单点登录。
      - 就难以更新的医疗器械和遗留临床系统的补偿性控制措施提供建议。
      - 与信息治理和临床安全同事合作，使安全、隐私和临床安全风险得到一并评估。
      - 在安全设计方面辅导安全工程师和其他架构师。
    qualifications:
      - 在安全架构或安全工程方面拥有丰富经验，相当于硕士学位水平。
      - 公认的安全资格或同等经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 6 职级）：医疗卫生行业的招聘广告将此角色定为第 8a 职级。分析和行动自由度的评分高于第 7 职级概况，因为该岗位在很少督导下为关键临床系统设计安全。
  - title: 首席安全架构师
    responsibilities:
      - 领导多个高风险项目或某一重要领域（例如临床系统或云托管）的安全架构。
      - 为本领域的设计制定安全原则和标准，并在设计委员会中为其提供保证。
      - 就安全风险及其管理方案向高级风险负责人提供建议。
      - 为与合作组织和供应商共享的数据设计安全。
      - 领导和培养安全架构师。
    qualifications:
      - 在复杂服务的安全架构方面拥有广泛经验。
  - title: 主任安全架构师
    responsibilities:
      - 制定组织的安全架构愿景、原则和战略。
      - 就网络安全对患者照护和服务的风险向执行团队和董事会提供建议。
      - 确保网络韧性（包括从重大攻击中恢复）被设计到关键临床服务中。
      - 在跨组织的网络安全和标准社群中代表组织。
      - 领导安全架构实践并培养其人员。
    qualifications:
      - 在跨组织领导安全架构方面拥有广泛经验。
