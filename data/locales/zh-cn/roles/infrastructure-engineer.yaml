summary: >
  基础设施工程师设计、构建、运行和支持组织数字服务所依赖的网络、服务器、存储、云平台和托管环境。他们保持这些基础设施可用、安全且可恢复，并与供应商和架构师合作安全地对其进行变更。在医疗卫生领域，一次基础设施故障就可能使医院和社区服务的临床系统同时停止运行。
health_context:
  - 临床系统需要极高的可用性，因此基础设施按韧性设计，变更围绕临床活动进行规划。
  - 工程师参加值班轮换，因为夜间或周末的基础设施故障可能使患者照护停止。
  - 网络连接输液泵、患者监护仪和影像设备等医疗器械，这些设备需要网络分段，并遵循 IEC 80001-1 审慎变更。
  - 医疗卫生经常成为勒索软件的目标，因此备份必须受到保护、经过测试，并能在商定的恢复时间内恢复。
  - 基础设施往往新旧技术混杂，包括难以打补丁的遗留临床系统，因此工程师采取补偿性控制措施。
levels:
  - title: 助理基础设施工程师
    responsibilities:
      - 协助基础设施工程师完成服务器构建、备份检查和网络变更等日常任务。
      - 监控基础设施，并向相应团队报告警报和故障。
      - 在所有工作中遵循变更、安全和信息治理流程。
      - 准确记录配置和资产详情。
      - 攻读基础设施学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读基础设施或网络学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 基础设施工程师
    responsibilities:
      - 构建、配置和维护托管临床和综合系统的服务器、存储、网络和云服务。
      - 及时为基础设施打补丁，在安全风险与保持临床系统可用的需要之间取得平衡。
      - 运行和测试备份与恢复，包括关键临床系统的备份与恢复。
      - 与临床工程团队合作，支持医疗器械和其他临床设备的分段网络。
      - 调查并修复基础设施故障，包括作为值班轮换的一部分。
      - 使用脚本和基础设施即代码将日常任务自动化。
    qualifications:
      - 计算机或相关学科的学位、相关技术认证，或同等经验。
      - 具有支持生产环境基础设施的经验。
    job_evaluation_notes: 脑力消耗反映经常长时间专注于不可预测的故障，包括非工作时间的值班工作。
  - title: 高级基础设施工程师
    responsibilities:
      - 根据架构师的设计，设计和构建具备临床服务所需韧性的基础设施解决方案。
      - 围绕临床活动规划并领导重大基础设施变更，例如数据中心迁移、网络更新和上云迁移。
      - 为关键临床系统设计并测试灾难恢复和勒索软件恢复。
      - 领导对基础设施事件的技术响应，并推动修复其根源。
      - 管理针对无法打补丁的遗留系统和医疗器械的补偿性控制措施。
      - 领导和辅导基础设施工程师。
    qualifications:
      - 在设计和运行生产环境基础设施方面拥有丰富经验，相当于研究生文凭水平。
    job_evaluation_notes: 脑力消耗反映在事件和复杂变更期间（包括非工作时间）经常长时间专注。
  - title: 首席基础设施工程师
    responsibilities:
      - 领导一个重要平台或一组服务的基础设施，并确定其技术方向。
      - 管理第三方基础设施供应商，并要求其在可用性和恢复方面达到服务水平。
      - 监督网络更新或迁移到云托管等基础设施项目。
      - 确保基础设施符合安全、信息治理和医疗器械网络标准。
      - 领导基础设施团队并培养其技能。
    qualifications:
      - 在领导复杂、高可用服务的基础设施工程方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 建议首席和主任基础设施工程师都定为第 8b 职级。本参考资料将首席定为第 8a 职级，使两个级别处于不同职级，与其他技术职族中的首席和主任级角色一致。
  - title: 主任基础设施工程师
    responsibilities:
      - 制定基础设施战略和路线图，使投资为临床服务带来有韧性、安全且可持续的托管。
      - 负责与战略性基础设施和网络供应商的运营关系。
      - 就基础设施风险（包括已到寿命终点的技术、单点故障和网络韧性）向高级负责人提供建议。
      - 与服务负责人一起为临床系统设定恢复时间和恢复点目标，并确保基础设施能够达到。
      - 领导全组织的基础设施工程专业并发展其能力。
    qualifications:
      - 在领导多个团队或组织的基础设施工程方面拥有广泛经验。
