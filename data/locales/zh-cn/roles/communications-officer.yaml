summary: >
  传播工作人员帮助组织向员工、患者、公众、合作伙伴和媒体说明其工作。他们撰写和发布内容，开展内部传播和宣传活动，管理数字媒体和社交媒体渠道，处理媒体询问，并维护组织的声誉，尤其是在事件和服务中断期间。
health_context:
  - 关于健康服务的传播必须准确、清晰且无障碍，因为患者可能据此采取行动。
  - 宣传活动往往旨在改变行为，例如鼓励患者和照护人员使用新的数字服务。
  - 服务中断、网络安全事件和数据泄露需要与患者、员工、合作伙伴和媒体进行快速、审慎的沟通。
  - 关于患者的故事需要征得同意，并且必须保护隐私。
levels:
  - title: 传播专员
    summary: 为内部和外部渠道撰写和发布内容，并在日常媒体和宣传工作中支持传播团队。
    responsibilities:
      - 撰写和编辑新闻、内网内容、简讯和社交媒体帖子。
      - 在网站、内网和社交媒体上发布已获批准的内容。
      - 登记媒体询问并监测媒体报道。
      - 以内容和后勤支持宣传活动和各类活动。
      - 检查内容的准确性、无障碍性和语言是否通俗易懂。
    qualifications:
      - 具有为不同受众写作的经验，或传播或相关学科的资格，或同等经验。
  - title: 高级传播专员
    summary: 为项目和服务规划和开展传播，处理日常媒体询问，并管理传播渠道。
    responsibilities:
      - 为项目和服务变更规划并开展传播。
      - 回应日常媒体询问，起草新闻稿和声明。
      - 管理数字媒体和社交媒体渠道的内容计划，并报告其表现。
      - 在征得同意的情况下撰写案例故事，包括患者故事。
      - 就如何为患者和公众清晰地写作向同事提供建议。
      - 辅导传播专员。
    qualifications:
      - 传播或相关学科的学位或资格，或同等经验。
  - title: 传播负责人
    summary: 领导一个重大项目群或领域（例如内部传播或数字渠道）的传播工作，并处理敏感的媒体工作。
    responsibilities:
      - 为新的临床系统等重大项目群领导传播和参与工作。
      - 规划并评估鼓励患者和员工采用数字服务的宣传活动。
      - 处理敏感的媒体询问，并为发言人做好准备。
      - 与运营团队一起为事件和服务中断规划传播。
      - 就如何传达变革和艰难信息向负责人提供建议。
      - 督导传播专员。
    qualifications:
      - 传播方面的学位或专业资格，或同等经验。
      - 具有规划和评估宣传活动的经验。
  - title: 传播经理
    summary: 管理传播团队的工作和渠道，并领导媒体应对以及事件期间的传播。
    responsibilities:
      - 管理传播团队、其工作计划和预算。
      - 领导被动应对和主动开展的媒体工作，包括在事件和数据泄露期间。
      - 管理组织的渠道、品牌和内容标准。
      - 就传播和声誉风险向总监提供建议。
      - 评估传播效果并报告其影响。
      - 与合作组织一起开展联合传播。
    qualifications:
      - 传播方面的专业资格，或同等经验。
      - 在媒体关系和管理传播方面拥有丰富经验。
    job_evaluation_notes: 情绪消耗反映在事件期间以及在患者故事中偶尔接触令人痛苦的材料。
  - title: 传播主管
    summary: 领导组织的传播和参与工作，制定其战略，并就声誉向董事会提供建议。
    responsibilities:
      - 为组织制定传播和参与战略。
      - 领导和培养传播职能，并管理其预算。
      - 就声誉、利益相关方参与和传播风险向首席执行官和董事会提供建议。
      - 在重大事件期间领导危机传播。
      - 与高级合作伙伴、记者和患者团体建立关系。
      - 塑造组织如何向公众说明其数字服务及其数据使用。
    qualifications:
      - 传播方面的专业资格，或同等经验。
      - 在领导复杂组织的传播方面拥有广泛经验。
