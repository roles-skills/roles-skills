summary: >
  IT 服务经理确保组织的数字服务按商定水平提供并持续改进。他们定义服务水平，管理服务目录，报告绩效，并协调运行每项服务的团队和供应商。在医疗卫生领域，他们将临床服务的需求（例如全天候可用）转化为服务目标和支持安排。
health_context:
  - 临床系统的服务水平反映临床风险，因此电子病历或处方系统的目标与综合系统的目标不同。
  - 服务通常由内部团队、供应商以及与合作组织共享的服务共同提供，因此服务经理跨组织边界进行协调。
  - 临床业务连续性依赖 IT，因此服务经理与临床和应急规划负责人合作制定停机和连续性计划。
  - 临床人员几乎没有时间报告问题，因此服务经理利用监控、服务台数据和临床反馈及早发现问题。
levels:
  - title: IT 服务分析员
    responsibilities:
      - 在商定的服务水平内响应、记录和解决事件与请求。
      - 定期编制服务报告，例如工单数量、响应时间和临床系统的可用性。
      - 检查服务目录条目和知识文章是否准确且为最新。
      - 寻找事件中的规律并提出改进建议。
      - 处理工单和服务数据时遵守信息治理规则。
    qualifications:
      - IT 服务管理基础资格、IT 三级资格，或同等经验。
  - title: IT 服务经理
    responsibilities:
      - 根据临床风险和业务需要，为临床和综合服务定义并商定服务水平。
      - 管理一组服务的支持安排，包括供应商和共享服务。
      - 向服务负责人和临床负责人报告服务绩效，并商定改进措施。
      - 确保每项服务都有经过测试的业务连续性和停机安排。
      - 保持服务目录为最新，并确保员工知晓其服务的变更。
      - 为您负责的服务运行持续服务改进计划。
    qualifications:
      - 具有按商定服务水平管理 IT 服务的经验。
      - IT 服务管理中级资格，或同等经验。
  - title: 高级 IT 服务经理
    responsibilities:
      - 领导跨多个平台和渠道的服务管理，提高服务管理流程的成熟度。
      - 与临床系统的主要供应商商定服务水平和合同条款，并追究其责任。
      - 向高级临床和运营负责人汇报服务绩效和风险。
      - 在重大事件后主持服务审查，并跟踪改进措施直至完成。
      - 与应急规划和临床负责人合作，使 IT 连续性计划与临床业务连续性计划保持一致。
      - 领导和培养 IT 服务经理。
    qualifications:
      - 在跨多项服务的 IT 服务管理方面拥有丰富经验。
      - IT 服务管理高级资格，或同等经验。
  - title: IT 服务管理主管
    responsibilities:
      - 制定全组织 IT 服务管理的愿景、战略和运营模式。
      - 确保每个服务管理流程都有负责人并持续成熟。
      - 在高层代表 IT 服务管理，包括在临床和运营治理会议上。
      - 担任临床和综合服务负责人的高级上报对象。
      - 确保服务管理职能拥有所需的人员、工具和预算。
    qualifications:
      - 在大型或复杂组织中领导 IT 服务管理方面拥有广泛经验。
