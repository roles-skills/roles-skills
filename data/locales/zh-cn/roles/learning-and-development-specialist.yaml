summary: >
  学习与发展专员帮助员工获得提供安全、现代化、数字赋能的照护所需的技能。他们分析学习需求，以面授和在线方式设计和开展学习，运行学习管理系统，并建立职业路径。在数字医疗卫生组织中，他们的很大一部分工作是为专家和全体员工发展数字、数据和技术技能。
health_context:
  - 临床和照护人员在新临床系统上线前需要培训，培训往往跨班次和场所进行，因此学习要围绕 24/7 运行的服务进行规划。
  - 一些培训是强制性的，例如信息治理、网络安全意识和保护，其完成情况要向董事会报告。
  - 通过学徒计划、再培训和职业路径从内部培养稀缺的数字技能，往往比招聘更快、更便宜。
  - 本参考资料、UK GDaD PCF 和 ESCO 等技能框架为技能差距分析和发展计划提供了共同语言。
  - 学习必须对需求、工作模式和数字信心水平各不相同的员工无障碍。
levels:
  - title: 学习与发展协调员
    summary: 协调组织的学习项目，负责课程预订、学习管理系统和培训记录，并支持课程实施。
    responsibilities:
      - 安排课程，预订场地和培训师，管理报名和候补名单。
      - 在学习管理系统中维护课程、报名和完成记录。
      - 为经理编制强制性培训完成情况报告。
      - 回答员工和经理关于学习项目的问题。
      - 在课程中支持培训师，包括设置在线教室和收集反馈。
      - 与培训机构一起管理学徒的注册和考评。
    qualifications:
      - 三级资格、学习与发展学徒资格，或同等经验。
      - 具有行政工作以及使用学习管理系统或类似系统的经验。
  - title: 学习与发展专员
    summary: 为一系列员工群体设计和开展学习，包括数字技能和系统培训，并评估其效果。
    responsibilities:
      - 以面授和在线方式开展入职引导、数字技能和管理基础等培训。
      - 在学习管理系统中制作在线学习课程和简短指南，并使其无障碍。
      - 与数字团队合作，在新的临床和业务系统上线前规划并开展培训。
      - 支持经理识别团队的学习需求并规划发展。
      - 评估课程，并利用反馈和结果加以改进。
      - 与培训机构、学员和经理合作协调学徒计划。
    qualifications:
      - 公认的学习与发展或培训资格，或同等经验。
      - 具有以面授和在线方式为成人设计和开展培训的经验。
    job_evaluation_notes: 人员为第 3 级，因为该岗位将讲授核心培训作为主要职责；研究为第 2 级，因为它定期评估学习效果。
  - title: 学习与发展专家
    summary: 在学习战略范围内享有广泛自主权，领导某一重要领域（例如领导力、数字技能或系统培训）学习项目的分析、设计和评估。
    responsibilities:
      - 利用对照本参考资料的技能差距分析，分析某一员工群体或专业的学习需求。
      - 设计目标清晰的混合式学习项目，从在线学习到辅导和工作场所实践。
      - 为大型临床系统变更设计培训策略，包括超级用户网络。
      - 评估学习对技能、绩效和服务的影响，并加以报告。
      - 委托外部培训机构并为其质量提供保证。
      - 辅导和培养学习与发展专员。
    qualifications:
      - 公认的中级或高级学习与发展资格，或同等经验。
      - 在设计和评估学习项目方面拥有丰富经验。
    job_evaluation_notes: 人员为第 4 级，因为设计培训项目是主要职责。
  - title: 数字技能负责人
    summary: 领导组织为专业人员和全体员工发展数字、数据和技术技能的项目，利用技能框架规划职业发展并弥补差距。
    responsibilities:
      - 领导数字技能项目，包括全体员工的数字素养以及数字、数据和技术专业人员的发展。
      - 使用本参考资料中的角色档案和技能，在各数字团队中开展技能差距分析并报告结果。
      - 设计从学徒到高级岗位的职业路径，并将其与职级和岗位评估相衔接。
      - 与大学、学院和培训机构建立合作关系，充分利用学徒资金。
      - 管理数字技能预算并评估投资回报。
      - 领导一个小型学习与发展团队。
    qualifications:
      - 公认的高级学习与发展资格，或同等经验。
      - 在建设技能项目方面拥有丰富经验，最好是在数字、数据或技术领域。
  - title: 学习主管
    summary: 领导全组织的学习与发展，制定学习战略，并管理学习团队、预算和系统。
    responsibilities:
      - 制定与人才战略和人力规划相衔接的组织学习战略。
      - 领导和管理学习与发展团队及其服务，包括强制性培训和学习管理系统。
      - 持有学习预算，包括学徒资金和外部培训支出。
      - 向执行委员会报告学习活动、完成情况和影响。
      - 与组织发展同事一起领导领导力和管理能力发展项目。
      - 确保学习无障碍、具包容性，并对每个班次的员工都可获得。
    qualifications:
      - 公认的高级学习与发展或人力资源专业资格，或相关学科的硕士学位，或同等经验。
      - 在领导学习服务方面拥有广泛经验。
    job_evaluation_notes: 人员为第 5 级，因为该岗位管理全组织的培训。
