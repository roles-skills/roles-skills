summary: >
  业务分析师帮助组织了解医疗卫生和照护服务中的问题，并找到解决问题的正确变革。他们分析临床、行政和面向患者的流程当前如何运作，定义用户和业务需求，并帮助团队确保新的数字服务契合真实的照护路径并带来可衡量的效益。
health_context:
  - 流程跨越组织和专业边界，因此分析师梳理完整的照护路径，包括临床医生、照护人员、患者和其他组织之间的交接。
  - 需求往往带有临床风险，因此分析师与临床安全官合作，确保与安全相关的需求得到记录、追溯和测试。
  - 许多需求涉及在系统之间共享健康数据，因此分析师需要实际了解 HL7 FHIR 等互操作性标准和 SNOMED CT 等临床术语。
  - 照护中的效益往往关乎安全、质量、员工时间和患者体验，而不仅仅是成本，因此分析师帮助定义临床医生认可的衡量指标。
levels:
  - title: 见习业务分析师
    responsibilities:
      - 通过系统化培训、跟岗和督导下的工作学习业务分析技术。
      - 在与临床和行政人员举办的研讨会上作记录并起草流程图。
      - 在指导下维护需求日志、用户故事和追溯记录。
      - 协助为用户验收测试准备测试场景。
      - 处理包含患者信息的文件时遵守信息治理规则。
    qualifications:
      - 正在攻读业务分析学徒资格或资格证书，或同等经验。
  - title: 初级业务分析师
    responsibilities:
      - 梳理转诊、预约或结果处理等临床和行政工作流程的当前和未来流程。
      - 为界定清晰的工作获取并编写需求和用户故事。
      - 收集等候时间或人工变通做法等流程绩效数据，以支持分析。
      - 与临床和运营用户一起准备并开展用户验收测试场景。
      - 向团队和临床安全官指出可能影响患者安全的需求。
    qualifications:
      - 学位、业务分析资格或学徒资格，或同等经验。
  - title: 业务分析师
    responsibilities:
      - 领导中小型项目的分析工作，从问题定义到效益衡量。
      - 与临床医生、照护人员和管理者举办研讨会，了解痛点并商定方案。
      - 为照护路径和信息流建模，包括与其他医疗卫生和照护系统交换的数据。
      - 定义与安全相关的需求和数据需求，并在设计、构建和测试中加以追溯。
      - 以节省的员工时间、避免的差错或患者体验等指标构建效益论证。
      - 指导初级和见习业务分析师。
    qualifications:
      - 学位或公认的业务分析资格，或同等经验。
      - 具有在数字化变革项目中开展业务分析的经验。
  - title: 高级业务分析师
    responsibilities:
      - 在大型或复杂项目群（例如替换临床系统或重新设计照护路径）中领导业务分析。
      - 分析各方案及其对照护、安全、员工工作量和成本的影响，并向委员会提出建议。
      - 确保在需求中分析并处理临床风险、信息治理和平等影响。
      - 定义并跟踪变革的效益，并确定上线后如何衡量。
      - 直线管理或领导业务分析师，开展实践社群活动。
    qualifications:
      - 在复杂变革的业务分析方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席业务分析师
    responsibilities:
      - 领导对跨越照护体系中多个产品、服务或组织的高度复杂问题的分析。
      - 塑造重大投资的商业论证和效益实现计划。
      - 制定业务分析标准，例如与安全相关和受监管软件的需求追溯。
      - 与临床负责人、架构师和产品经理合作，使分析与组织战略保持一致。
      - 直线管理业务分析师并领导其专业发展。
    qualifications:
      - 在领导复杂、多团队变革的业务分析方面拥有广泛经验。
  - title: 业务分析主管
    responsibilities:
      - 领导业务分析职能，制定其战略、标准和工作方式。
      - 建设业务分析能力，包括招聘、职业路径和培训。
      - 就重大医疗卫生和照护转型所需的分析向执行和临床负责人提供建议。
      - 确保在整个项目组合中规划、衡量和报告效益实现。
      - 管理该职能的预算和人力计划。
    qualifications:
      - 在领导业务分析职能或实践方面拥有广泛经验。
    job_evaluation_notes: 信息资源按第 6 级评分，因为业务分析主管负责制定全组织关于在所有变革工作中如何保存需求、流程模型和效益记录的标准。
