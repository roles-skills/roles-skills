summary: >
  业务架构师清晰、整体地描绘组织如何提供医疗卫生和照护服务：其能力、服务、照护路径、流程和信息。他们利用这一视图指出哪里需要变革，将战略与项目群联系起来，并确保数字化变革改善患者照护以及临床医生和照护人员的工作。
health_context:
  - 照护路径跨越团队、场所和组织，因此业务架构师从患者的角度而不仅按部门为服务建模。
  - 临床流程的变化可能影响患者安全和员工工作量，因此模型与临床医生和照护人员共同构建，并对照实际做法进行检验。
  - 医疗卫生和照护战略受到政策、监管和资金规则的影响，架构师必须将其转化为切实可行的能力变化。
  - 许多能力与合作组织共享，因此架构师帮助商定谁做什么以及信息必须流向哪里。
levels:
  - title: 见习业务架构师
    responsibilities:
      - 通过培训和实践学习能力建模、价值流建模和流程建模等业务架构方法。
      - 通过访谈、文件和观察收集有关服务和照护路径的信息。
      - 在业务架构师的指导下起草能力地图和流程模型。
      - 协助与临床医生、照护人员和管理者举办研讨会，并整理成果。
    qualifications:
      - 商科、分析或相关学科的学位或同等经验。
      - 接受过业务架构方法的专门培训，达到研究生文凭水平或同等经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 5 职级）：医疗卫生行业的招聘广告将此角色定为第 6 职级。知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 助理业务架构师
    responsibilities:
      - 为组织的某一部分建立能力、服务和照护路径的模型。
      - 分析模型，找出患者和员工面临的差距、重复和痛点。
      - 汇集来自不同团队和组织的信息，为变革决策提供依据。
      - 使用清晰的模型和通俗的语言向利益相关方解释复杂的服务问题。
      - 保持业务架构资料库准确，并与应用和数据模型相关联。
    qualifications:
      - 具备业务架构或业务分析方面的专门知识，达到硕士水平或同等经验。
      - 具有业务分析或服务设计方面的经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 6 职级）：医疗卫生行业的招聘广告将此角色定为第 7 职级。知识按硕士水平或同等评分，因为该岗位跨团队和组织对服务和照护路径进行建模和分析。
  - title: 业务架构师
    responsibilities:
      - 为急诊照护或社区服务等重要服务领域制定当前和目标业务架构。
      - 将战略和政策转化为能力变化和变革路线图。
      - 检查项目群和项目的范围是否契合目标业务架构。
      - 与临床负责人合作，评估拟议变更如何影响照护路径、安全和员工工作量。
      - 在方法和工具方面指导其他业务架构师。
    qualifications:
      - 在业务架构、业务分析或服务设计方面拥有丰富经验，相当于硕士学位水平。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 7 职级）：医疗卫生行业的招聘广告将此角色定为第 8a 职级。规划、政策和行动自由度的评分高于第 7 职级概况，因为该岗位将战略转化为重要服务领域的变革路线图。
  - title: 首席业务架构师
    responsibilities:
      - 领导业务架构实践并对其成果负责。
      - 维护全组织范围的能力、服务和照护路径视图，并使其易于理解。
      - 就变革重点以及投资组合如何契合战略向总监提供建议。
      - 与合作组织一起商定跨照护路径的共享能力和职责。
      - 领导和培养业务架构师。
    qualifications:
      - 在复杂组织中领导业务架构方面拥有广泛经验。
