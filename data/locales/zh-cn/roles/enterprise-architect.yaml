summary: >
  企业架构师为组织提供关于其服务、信息、应用和技术的整体视图，并利用它将医疗卫生和照护战略转化为连贯的变革计划。他们制定架构原则、标准和路线图，指导投资决策，并确保数字化变革支持跨组织为患者提供安全、协同的照护。
health_context:
  - 照护路径跨越许多组织和系统，因此架构必须支持跨边界共享病历、检查结果和转诊。
  - 现有资产通常包括难以更改的长期使用的临床系统、医疗器械和供应商合同，因此路线图必须审慎规划过渡。
  - 架构决策影响患者安全、隐私以及全天候运行服务的韧性。
  - HL7 FHIR、SNOMED CT 和 IHE 规范等开放标准是避免供应商锁定和实现互操作性的关键。
  - 资金有限且受到严格审查，因此架构师必须证明物有所值，并在有共享平台时加以复用。
levels:
  - title: 企业架构师
    responsibilities:
      - 为诊断或社区照护等某一领域建立组织当前和目标的服务、信息、应用和技术模型。
      - 保持架构资料库为最新，包括应用目录和数据流目录。
      - 对照架构原则和标准审查提案，并向设计委员会提出建议。
      - 识别系统在哪些方面功能重复或依赖不受支持的技术，并提出风险。
      - 与解决方案架构师和临床负责人合作，了解照护路径如何使用系统。
      - 指导解决方案架构师使其设计与领域架构相契合。
    qualifications:
      - 在复杂组织中拥有架构、分析或技术设计方面的丰富经验，相当于硕士学位水平。
      - 了解 TOGAF 等企业架构框架，或具备同等经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 6 职级）：医疗卫生行业的招聘广告将此角色定为第 8a 职级。知识、分析、规划、政策和行动自由度按第 8a 职级概况评分，因为该岗位为整个领域塑造目标架构并向设计委员会提供建议。
  - title: 高级企业架构师
    responsibilities:
      - 为组织的一个或多个领域制定目标架构和过渡路线图。
      - 塑造商业论证，使投资契合目标架构并复用共享平台。
      - 在设计委员会中主持架构审查，并就重大提案提出建议。
      - 规划遗留临床和综合系统的替换或退役，包括数据迁移和安全风险。
      - 确保互操作性、安全和信息治理需求纳入路线图。
      - 辅导和指导企业架构师及解决方案架构师。
    qualifications:
      - 在多个领域的企业架构或解决方案架构方面拥有广泛经验。
      - 了解 TOGAF 等企业架构框架，或具备同等经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 7 职级）：医疗卫生行业的招聘广告将此角色定为第 8b 职级。规划为第 5 级，因为长期路线图影响整个组织；知识为第 8 级，因为需要涵盖业务、信息、应用和技术架构的知识。
  - title: 首席企业架构师
    responsibilities:
      - 负责组织某一重要部分的企业架构，例如临床系统或共享基础设施。
      - 主持或领导架构设计委员会，并制定项目必须达到的标准。
      - 就投资重点、供应商战略和技术风险向总监提供建议。
      - 与合作组织一起使跨照护路径和共享病历的架构保持一致。
      - 领导和培养企业架构师，发展架构实践社群。
    qualifications:
      - 在复杂组织中拥有企业架构方面的广泛经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 8b 职级）：医疗卫生行业的招聘广告将此角色定为第 8c 职级。信息资源为第 6 级，因为该岗位管理组织某一重要部分信息系统的架构；政策和人员高于第 8b 职级概况，因为它为所有项目制定标准并领导企业架构师。
  - title: 主任企业架构师
    responsibilities:
      - 制定与组织医疗卫生和照护战略相一致的企业架构愿景、原则和战略。
      - 就重大数字投资的架构、风险和价值向执行团队和董事会提供建议。
      - 领导组织的架构实践、治理和标准。
      - 在跨组织的架构和互操作性论坛中代表组织。
      - 在全组织建设架构能力，包括招聘和职业路径。
    qualifications:
      - 在跨组织领导企业架构方面拥有广泛经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 8c 职级）：医疗卫生行业的招聘广告将此角色定为第 8d 职级。政策和行动自由度为第 6 级，因为该岗位对组织的架构愿景、原则和战略负有全组织责任。
