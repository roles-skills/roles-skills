summary: >
  分析工程师将原始的医疗卫生和照护数据转化为分析师、数据科学家和报表工具可以依赖的整洁、经过测试且有文档记录的数据模型。他们处于数据工程与分析之间，将版本控制、测试和代码审查等软件工程实践应用于组织报告和仪表板背后的数据转换。
health_context:
  - 数据模型中编码了临床和运营定义，例如什么算作一次入院、再入院或违反等候时间标准，因此这些定义要与临床和运营负责人商定。
  - 来自 SNOMED CT 和 ICD 等术语和分类的临床代码被归入用于分析的参考集，这些参考集需要严格的版本控制。
  - 用于绩效和资金报告的模型必须一致且可审计，因为错误可能影响有关患者服务的决策。
  - 模型经常包含假名化的患者级数据，因此要内置访问控制、文档记录和数据最小化。
levels:
  - title: 见习分析工程师
    responsibilities:
      - 通过培训和结对学习团队的数据建模工具和实践。
      - 在督导下对数据模型进行规模小、界定清晰的修改。
      - 在数据目录中记录数据项及其定义。
      - 回答数据使用者的简单问题并记录其需求。
      - 在处理患者数据时遵守信息治理规则。
    qualifications:
      - 已注册或正在攻读数据学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 分析工程师
    responsibilities:
      - 根据商定的设计，为住院诊疗活动或社区照护等服务领域构建和测试数据模型。
      - 编写自动化测试，对照商定的临床和运营定义检查数据模型。
      - 维护分析中使用的临床代码参考集，并保持清晰的版本。
      - 为模型编写文档，使分析师理解其含义、来源和局限。
      - 培训和支持团队数据集的使用者。
    qualifications:
      - 数理类或计算机学科的学位，或同等经验。
      - 具有构建数据模型或分析代码的经验。
  - title: 高级分析工程师
    responsibilities:
      - 监督多个服务领域数据模型的设计和测试。
      - 与临床、运营和财务负责人商定关键指标的定义，并确保模型一致地应用这些定义。
      - 确保为绩效和资金报告提供数据的模型可审计并经过充分测试。
      - 与数据工程师和数据负责人一起解决数据问题和风险。
      - 辅导并指导其他分析工程师的工作。
    qualifications:
      - 在数据建模和分析工程方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席分析工程师
    responsibilities:
      - 领导负责设计、构建和维护组织分析数据模型的团队。
      - 为数据模型、测试、文档和指标定义制定标准。
      - 与全组织的团队合作，了解临床和运营流程如何产生数据。
      - 审查其他分析工程师的工作，改进团队的工作方式。
      - 直线管理分析工程师。
    qualifications:
      - 在领导分析工程或数据建模方面拥有广泛经验。
  - title: 分析工程主管
    responsibilities:
      - 为组织的分析数据模型确定方向，使全组织的分析使用一套可信的定义。
      - 确保分析工程的优先事项支持组织的战略和报告义务。
      - 就重大报告和决策背后数据的可信度向高级负责人提供建议。
      - 确保社群拥有所需的工具和平台，并管理相关预算。
      - 通过技术领导和职业发展建设分析工程能力。
    qualifications:
      - 在全组织领导分析工程方面拥有广泛经验。
