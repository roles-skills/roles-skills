summary: >
  高级法务负责人确保组织依法行事并妥善管理其法律风险。他们领导内部法务团队，管理外部法律顾问，并就组织最重大的法律事项向董事会和执行层提供建议。在数字医疗卫生组织中，这包括使用健康数据的法律依据、重大技术和数据合同、软件中的知识产权以及组织的法定职责。
health_context:
  - 组织是公共机构或与公共机构合作，因此其决定可能受到质疑，并且必须在其权限范围内行事。
  - 大规模使用医疗卫生和照护数据（包括用于人工智能和研究）带有较高的法律和声誉风险。
  - 重大技术合同期限长、价值高且难以退出，因此其法律条款会在多年内影响组织。
  - 法务负责人与董事会、数据保护官以及临床安全和信息治理同事密切合作。
levels:
  - title: 法务服务副主管
    summary: 法务服务副主管领导法务职能的一个重要领域，例如商法、技术和数据法，并代理法务服务主管的职责。
    responsibilities:
      - 领导一个重要的法律工作领域，例如商法、技术和数据法，或争议和劳动事务。
      - 就重大采购和数据项目群等高风险事项向总监提供建议。
      - 管理外部律师库以及外部法律意见的预算。
      - 为组织制定法律标准、模板和培训。
      - 领导和培养多个法律团队或专家。
      - 代理法务服务主管的职责。
    qualifications:
      - 获准执业的合格律师，并拥有广泛的执业后经验，包括领导法律团队。
    job_evaluation_notes: 知识为第 8 级，对应跨多个法律领域的专家级知识。信息资源为第 5 级而不是第 6 级，因为该岗位不管理全组织的信息系统。
  - title: 法务服务主管
    summary: 法务服务主管领导组织的法务职能，确定其应对法律风险的方法，并向执行层和董事会提供建议。
    responsibilities:
      - 领导内部法务职能以及外部律师的使用。
      - 就法律风险、法定职责和重大决策向执行层和董事会提供建议。
      - 确定组织的法律风险偏好以及在数据使用和合同订立等关键问题上的立场。
      - 主导最重大事项的法律工作，例如重大争议、公共调查和合作关系。
      - 持有法务服务预算并证明物有所值。
      - 领导和培养法务团队和法务运营。
    qualifications:
      - 获准执业的合格律师，并在领导法务服务方面拥有广泛的高级职位经验。
    job_evaluation_notes: 财务资源为第 4 级，因为该岗位持有法务服务预算，而不是多项服务的预算。
  - title: 总法律顾问
    summary: 总法律顾问是组织最资深的律师，对法务服务和法律风险负有全组织责任，并往往还以董事会秘书身份领导公司治理。
    responsibilities:
      - 对组织的法律事务和法律风险负有全组织责任。
      - 就组织的权力、职责和治理向董事会和董事长提供建议。
      - 确保重大战略、合作关系和数据项目群合法。
      - 领导对司法审查和监管行动等最严重法律威胁的应对。
      - 领导法务服务，并往往领导公司治理和董事会秘书处。
      - 在监管机构、合作伙伴和政府机构面前代表组织。
    qualifications:
      - 获准执业的合格律师，并在执行层或董事会层面拥有广泛经验。
    job_evaluation_notes: 财务资源为第 4 级，因为该岗位持有法务和治理服务的预算，而不是组织的财务。
