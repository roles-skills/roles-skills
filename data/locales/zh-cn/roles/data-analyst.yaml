summary: >
  数据分析师将医疗卫生和照护数据转化为帮助临床医生、管理者和规划人员作出决策的信息。他们准备、关联和分析来自临床、运营和患者报告来源的数据，并以报告、仪表板和简报的形式呈现。他们确保分析准确、可复现，并安全地处理保密的患者数据。
health_context:
  - 许多数据描述的是单个患者，因此分析师尽可能使用假名化数据，并在发布前检查输出的披露风险。
  - 健康数据使用 SNOMED CT 和 ICD 等临床术语和分类进行记录，因此分析师需要了解代码的使用方式以及可能产生误导之处。
  - 不同照护场所和系统的数据质量参差不齐，数据缺口对某些患者群体的影响往往更大，因此分析师在得出结论前检查偏差。
  - 分析可能改变服务的规划、资助和提供方式，因此结论需要清晰的限定说明，不得夸大确定性。
levels:
  - title: 助理数据分析师
    responsibilities:
      - 按照商定的方法编制关于诊疗活动、等候时间和服务使用情况的常规报告和仪表板。
      - 在督导下清理和准备来自患者管理、临床和运营系统的数据提取。
      - 对照数据质量规则检查输出，并向相应的数据负责人报告问题。
      - 在分享结果前应用小数抑制和其他披露规则。
      - 回答临床和运营团队的简单数据请求。
    qualifications:
      - 数理类学科的学位、分析学徒资格，或同等经验。
  - title: 数据分析师
    responsibilities:
      - 设计并开展分析，回答临床、运营和规划团队提出的问题。
      - 使用假名化标识符和商定的关联方法，安全地关联来自不同来源的患者级数据。
      - 编写可复现的分析代码，并记录方法、假设和数据来源。
      - 用通俗易懂的语言向临床医生和管理者解释分析结果及其局限。
      - 检查分析在不同患者群体（例如按年龄、性别、民族和贫困程度）之间的偏差。
      - 支持助理分析师并审查其工作。
    qualifications:
      - 数理类学科的学位，或同等经验。
      - 具有分析和呈现复杂数据的经验。
  - title: 高级数据分析师
    responsibilities:
      - 领导某一服务领域（例如急诊照护、癌症或精神卫生）的分析，与其负责人商定优先事项。
      - 为团队的分析制定方法和质量保证，包括对代码和输出进行同行评审。
      - 领导跨照护场所的复杂数据关联项目，并商定其信息治理依据。
      - 向高级临床和管理团队汇报分析结果，并就其对服务的意义提供建议。
      - 与数据工程师和数据负责人合作，从根本上解决数据质量问题。
      - 辅导和培养团队中的分析师。
    qualifications:
      - 在领导数据分析方面拥有丰富经验，相当于硕士学位水平。
  - title: 主任数据分析师
    responsibilities:
      - 为组织的数据分析、质量保证和可复现分析实践制定标准。
      - 就服务和投资重大决策背后的证据向执行和临床负责人提供建议。
      - 领导分析社群，包括其培训、工具和职业发展。
      - 与医疗卫生和照护合作伙伴一起塑造数据共享和关联安排。
      - 直线管理高级分析师，确保团队具备所需的能力和技能。
    qualifications:
      - 在全组织领导数据分析方面拥有广泛经验。
