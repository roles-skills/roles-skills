summary: >
  内容设计师让医疗卫生和照护信息与服务清晰明了，使患者、照护者、临床医生和照护人员能够理解他们需要知道和需要做的事情。他们依据用户需求的证据设计内容，使用通俗易懂的语言写作，与临床专家合作保持内容准确，并在内容的整个生命周期内（从创建到审核和下线）对其进行维护。
health_context:
  - 人们常常在担忧、身体不适或匆忙时阅读健康内容，因此内容必须便于健康素养较低的人理解并据此行动。
  - 错误或过时的健康信息可能造成伤害，因此内容设计师遵循有审核日期和指定临床审核人员的临床把关流程。
  - 紧急症状、精神卫生、药物和临终关怀等一些主题敏感或风险高，因此内容设计师在语气和准确性方面与临床医生和用户研究员密切合作。
  - 临床系统也需要清晰的内容，例如标签、说明和警报，因此内容设计师帮助减少临床工作流程中的差错。
  - 健康内容必须无障碍且具包容性，包括适合使用辅助技术、用其他语言阅读或需要易读格式的人。
levels:
  - title: 助理内容设计师
    responsibilities:
      - 通过培训和督导下的工作学习内容设计方法、风格指南和临床审核流程。
      - 对现有内容进行标准检查、文字编辑和更新。
      - 按照把关步骤，使用内容管理系统发布内容。
      - 检查内容的无障碍情况，例如标题、链接文字和替代文本。
    qualifications:
      - 正在攻读相关领域的资格或学徒资格，或同等经验。
  - title: 初级内容设计师
    responsibilities:
      - 在更资深内容设计师的指导下编写和更新健康内容和服务内容。
      - 利用研究和数据确定用户需要了解什么以及他们使用的词语。
      - 与临床审核人员合作检查准确性，并用通俗易懂的语言解释医学术语。
      - 支持内容发布、审核日期管理和内容团队的行政工作。
    qualifications:
      - 学位或相关资格，或网络写作方面的同等经验。
  - title: 内容设计师
    responsibilities:
      - 在完整的用户旅程中设计内容，例如查找服务、为预约做准备和后续照护。
      - 为临床系统设计标签、说明和警报等内容，以降低出错的可能。
      - 与临床专家商定准确性，同时保持内容清晰、好用。
      - 与用户（包括健康素养较低的人和使用辅助技术的人）一起测试内容。
      - 为风格指南和内容模式作出贡献。
    qualifications:
      - 学位或相关资格，或同等经验。
      - 具有为数字服务设计内容的经验。
  - title: 高级内容设计师
    responsibilities:
      - 为大型或备受关注的领域（例如重要疾病领域或公共卫生宣传活动）制定内容战略。
      - 为紧急症状、精神卫生和临终关怀等敏感和高风险主题设计内容。
      - 为一整套健康内容建立临床把关、证据来源和审核周期。
      - 审查他人的工作以保证质量，并管理或指导内容设计师。
      - 与团队一起编写和梳理用户故事。
    qualifications:
      - 在内容设计方面拥有丰富经验，相当于硕士学位水平。
    job_evaluation_notes: 情绪消耗为第 2 级，因为高级内容设计师经常处理严重疾病、自残和丧亲等令人痛苦的主题。
  - title: 首席内容设计师
    responsibilities:
      - 指导一支内容设计师团队，并为多个团队的内容质量提供保证。
      - 确保健康内容符合临床把关、无障碍和风格标准。
      - 与高级临床、传播和产品负责人合作，为团队配置资源并解决内容问题。
      - 领导组织最敏感或风险最高的信息的内容工作。
      - 直线管理和培养内容设计师。
    qualifications:
      - 在领导跨团队内容设计方面拥有广泛经验。
    job_evaluation_notes: 没有第 8a 职级的级别，因为 UK GDaD PCF 将首席内容设计师定为 G7 或 G6，本参考资料采用建议的第 8b 职级。政策为第 5 级，因为首席设计师为一系列服务制定内容标准；情绪消耗为第 2 级，与高级内容设计师相同。
  - title: 内容设计主管
    responsibilities:
      - 制定满足组织目标以及患者和员工需求的内容战略。
      - 制定组织关于健康信息内容及其临床把关的标准。
      - 领导一支能够执行该战略的内容设计团队，包括招聘和培养。
      - 与高级临床和传播负责人合作管理健康信息风险。
      - 确定全组织内容工作的优先次序。
    qualifications:
      - 在领导内容设计和内容实践方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 将首席内容设计师和内容设计主管都定为 G7 或 G6，建议第 8b 职级。本参考资料将主管定为第 8c 职级，与其他以用户为中心的设计专业的主管保持一致，因为主管为整个组织制定内容战略和标准。
