summary: >
  服务设计师端到端地设计医疗卫生和照护服务，从一个人首次需要帮助的那一刻直到照护结束，覆盖数字、电话、纸质和面对面等渠道。他们与患者、照护者、临床医生和照护人员合作，梳理服务的实际运作方式，找出服务辜负人们的地方，并设计安全、简单、公平且能跨组织边界运作的服务。
health_context:
  - 照护路径跨越许多组织和专业，因此服务设计师梳理完整的旅程，包括交接、等待以及患者和照护者为维系照护所做的工作。
  - 改变服务的运作方式可能带来新的临床风险，因此服务设计师与临床安全官合作，在新服务模式上线前识别其中的危害。
  - 数字服务不得将无法或不愿使用它们的人拒之门外，因此服务设计师在设计数字途径的同时设计协助途径和非数字途径。
  - 临床和运营人员是服务的一部分，因此设计必须契合他们的工作流程、工作量和职业职责，而不仅仅是患者的旅程。
levels:
  - title: 助理服务设计师
    responsibilities:
      - 通过培训以及与有经验的设计师共事学习服务设计方法。
      - 根据与患者和员工开展的研究，协助绘制用户旅程图和服务蓝图。
      - 按照同意和信息治理流程，协助准备和举办共同设计研讨会。
      - 记录设计决策，保持设计成果为最新。
    qualifications:
      - 正在攻读设计或相关领域的资格或学徒资格，或同等经验。
  - title: 初级服务设计师
    responsibilities:
      - 为照护路径的部分环节（例如预约或随访）绘制当前旅程图和服务蓝图。
      - 在更资深设计师的指导下，设计并测试对服务部分环节的改进。
      - 与患者、照护者和员工举办共同设计会，并加以调整使每个人都能参与。
      - 识别服务在哪些地方给患者或员工带来额外工作或风险，并向团队提出。
    qualifications:
      - 设计或相关学科的学位，或同等经验。
  - title: 服务设计师
    responsibilities:
      - 设计跨渠道的端到端服务，包括为有需要的人提供协助途径和非数字途径。
      - 梳理跨组织的照护路径，设计团队和服务之间更好的交接。
      - 与运营负责人一起设计服务对员工的运作方式，包括角色、工作量和工作流程。
      - 与临床安全官合作，识别新服务模式中的危害并设计控制措施。
      - 与患者、照护者和员工一起为服务变更制作原型并进行测试。
    qualifications:
      - 设计或相关学科的学位，或同等经验。
      - 具有与用户共同设计服务的经验。
  - title: 高级服务设计师
    responsibilities:
      - 领导跨越多个照护场所或组织的复杂服务的设计。
      - 与临床、运营和数字负责人一起塑造服务愿景。
      - 设计改善安全、可及性和公平性的新服务模式，并与真实用户一起测试。
      - 确保对服务变更进行临床风险、平等和信息治理影响评估。
      - 指导设计师，并将服务设计实践融入团队。
    qualifications:
      - 在服务设计方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席服务设计师
    responsibilities:
      - 为多项服务或整条照护路径确定设计方向，并为各团队的设计质量提供保证。
      - 与高级临床和运营负责人合作，重新设计照护的组织和提供方式。
      - 确保设计适合受健康不平等影响最大的人群和承受压力的员工。
      - 为团队如何针对临床安全和协助途径进行设计制定标准。
      - 直线管理和培养服务设计师。
    qualifications:
      - 在领导跨团队服务设计方面拥有广泛经验。
    job_evaluation_notes: 没有第 8a 职级的级别，因为 UK GDaD PCF 将首席服务设计师定为 G7 或 G6，本参考资料采用建议的第 8b 职级。政策为第 5 级，因为首席设计师塑造一个总监部内一系列服务的运作方式。
  - title: 服务设计主管
    responsibilities:
      - 领导服务设计专业，制定其战略、标准和工作方式。
      - 影响组织战略，使服务围绕患者、照护者和员工的需求进行设计。
      - 建设服务设计能力，包括招聘、职业路径和培训。
      - 为良好的设计创造条件，例如接触用户的机会、开展研究的时间以及在治理中纳入设计。
      - 与医疗卫生和照护体系中的同行合作设计协同的服务。
    qualifications:
      - 在领导设计和设计实践方面拥有广泛经验。
