summary: >
  财务会计师确保组织的账目完整、准确，并遵循会计准则和公共部门报告规则。他们管理资产负债表，编制年度账目和法定报表，管理现金和资金，核算资产，并与审计人员合作。在数字医疗卫生组织中，许多复杂性来自对软件、数据资产、云安排和多年期技术合同的会计处理。
health_context:
  - 对数字支出的会计处理需要判断，例如软件开发、云服务配置或许可费用能否作为资本性资产处理。
  - 组织必须向资助方和监督机构说明公共资金的使用情况，并往往受到严格的资本和现金限额约束。
  - 多年期许可和支持合同会产生预付款项、承诺事项，有时还有租赁，必须正确核算。
  - 组织自建的软件等无形资产需要在产品变化时进行估值、摊销和减值复核。
  - 对公共机构的外部审计严格且公开，因此证据和工作底稿必须达到高标准。
levels:
  - title: 见习财务会计师
    summary: 见习财务会计师为账目编制资产负债表对账、日记账分录和工作底稿，同时攻读公认的会计资格。
    responsibilities:
      - 编制资产负债表对账并清理对账差异项。
      - 过账月末和年末日记账分录，例如应计项目、预付款项和折旧。
      - 维护固定资产登记册，包括软件和硬件资产。
      - 为年度账目和审计准备工作底稿和证据。
      - 编制现金流信息和银行对账。
      - 攻读公认的会计资格。
    qualifications:
      - 学位或中级会计资格，并正在攻读公认的会计资格，或同等经验。
    job_evaluation_notes: 知识按培训进展到足以开展工作时岗位所需的水平评分。
  - title: 财务会计师
    summary: 财务会计师是合格会计师，管理资产负债表，并编制年度账目、法定报表和纳税申报表的部分内容。
    responsibilities:
      - 管理资产负债表的月末和年末结账。
      - 编制年度账目的部分章节及附注。
      - 核算资本性支出，包括决定哪些数字成本可以资本化。
      - 编制销售税申报表，并就合同的税务处理提供建议。
      - 回答审计人员的问题，并就其发现商定整改措施。
      - 督导和培养见习会计师。
    qualifications:
      - 公认的会计资格，或同等经验。
  - title: 高级财务会计师
    summary: 高级财务会计师领导年度账目编制流程，以及无形资产、租赁和云安排等复杂领域的会计处理。
    responsibilities:
      - 规划并领导年度账目时间表和外部审计。
      - 就软件开发或云配置成本资本化等复杂判断撰写会计说明文件。
      - 管理资本性会计处理，包括资产使用年限、折旧和软件资产减值。
      - 管理现金预测，并在现金限额内提取资金。
      - 编制法定报表和资助方报表，例如合并报表和资本报表。
      - 管理和培养一个小型财务会计师团队。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有丰富经验，或同等条件。
    job_evaluation_notes: 财务资源为第 4 级，因为该岗位管理组织的现金头寸和资本性会计处理。
  - title: 财务会计经理
    summary: 财务会计经理负责组织的财务会计、资金和税务工作，并确保控制措施和审计整改措施到位。
    responsibilities:
      - 管理财务会计、资金和税务职能。
      - 负责组织的会计政策及其在云和数据服务等新型支出上的应用。
      - 管理银行账户、银行安排和现金流预测。
      - 管理税务合规和税务风险，包括技术合同和共享服务方面的税务问题。
      - 领导对内部和外部审计关于财务会计和控制的发现的应对。
      - 直线管理财务会计师和资金管理人员。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有广泛经验。
    job_evaluation_notes: 财务资源为第 5 级，因为该岗位管理组织在所有服务中的银行业务、现金和资产。
  - title: 财务会计主管
    summary: 财务会计主管领导组织的法定报告、财务控制、资金和税务，是外部审计人员的主要联系人。
    responsibilities:
      - 领导年度报告和账目的编制，并提交审计委员会。
      - 就重大会计判断和新准则向总监和审计委员会提供建议。
      - 负责财务规则、财务流程和授权方案。
      - 在财务报告方面领导与外部审计人员和监督机构的关系。
      - 制定资金和税务政策，并管理财务风险。
      - 领导和培养财务会计、资金和交易处理团队。
    qualifications:
      - 公认的会计资格，并在取得资格后拥有广泛经验，包括领导法定报告工作。
