summary: >
  软件开发人员构建、测试和维护组织数字健康服务背后的软件，例如面向患者的应用、临床系统、集成服务和数据平台。他们在多学科产品团队中工作，编写安全、可靠、无障碍且易于维护的代码，并为上线运行的服务提供支持。
health_context:
  - 软件可能影响患者照护，因此开发人员遵循临床风险管理流程，并为安全案例提供证据。
  - 代码经常处理保密的健康信息，因此开发人员默认采用信息治理和安全编码做法。
  - 许多服务使用 HL7 FHIR 等开放互操作性标准，与其他医疗卫生和照护系统交换数据。
  - 一些软件可能作为医疗器械受到监管，因此开发人员需要知道何时寻求监管方面的建议。
levels:
  - title: 学徒软件开发人员
    responsibilities:
      - 通过系统化培训和结对编程学习团队的编程语言、工具和工作方式。
      - 在密切督导下编写和测试规模小、界定清晰的代码。
      - 遵循安全编码、信息治理和临床安全流程。
      - 参加站会、计划会和回顾会等团队例会。
      - 攻读学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读软件开发学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分；信息资源反映在他人设计的系统上开展的工作。
  - title: 初级软件开发人员
    responsibilities:
      - 在指导下根据用户故事为团队的产品构建和测试功能。
      - 编写自动化测试并修复缺陷，包括支持患者照护的服务中的缺陷。
      - 为临床安全案例提供证据，例如测试结果和变更记录。
      - 遵循信息治理规则，安全地处理健康数据。
      - 作为团队支持安排的一部分，在指导下为上线服务提供支持。
    qualifications:
      - 计算机或相关学科的学位、已完成的学徒培训，或同等经验。
  - title: 软件开发人员
    responsibilities:
      - 独立设计、构建和测试功能与服务，选择合适的方法。
      - 审查代码，帮助维护团队的工程标准。
      - 使用 HL7 FHIR 等开放标准构建与其他医疗卫生和照护系统的集成。
      - 参与危害识别，帮助将临床安全控制措施落实到代码和测试中。
      - 调查并修复上线服务中的问题，包括在服务需要时提供非工作时间支持。
      - 指导初级和学徒开发人员。
    qualifications:
      - 计算机或相关学科的学位，或同等经验。
      - 构建和支持生产环境软件的经验。
  - title: 高级软件开发人员
    responsibilities:
      - 领导重要功能和服务的技术设计与交付。
      - 为团队制定并维护工程标准，包括测试、安全和无障碍。
      - 作出平衡用户需求、临床安全、安全性和成本的技术决策。
      - 领导团队服务的事件调查并推动修复。
      - 与临床安全官合作，确保安全控制措施在设计中落实并经过测试。
      - 辅导和培养团队中的开发人员。
    qualifications:
      - 在设计、构建和支持生产环境软件方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席软件开发人员
    responsibilities:
      - 领导一个产品或一组团队的工程工作，确定技术方向。
      - 确保软件在设计上满足安全、可靠、韧性和互操作性要求。
      - 与架构师、产品经理和临床负责人合作制定产品路线图。
      - 领导开发实践社群并制定跨团队的标准。
      - 直线管理或领导开发人员，支持其发展和绩效。
    qualifications:
      - 在领导复杂服务的软件工程方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 将首席开发人员和主任开发人员最常列为 G7 或 G6；本参考资料将首席开发人员定为第 8a 职级，将主任开发人员定为第 8b 职级。
  - title: 主任软件开发人员
    responsibilities:
      - 为组织的软件开发制定工程战略、标准和实践。
      - 就技术选择、风险和投资向高级负责人提供建议。
      - 领导解决跨服务的最复杂技术问题。
      - 在跨组织和开源工程社群中代表组织。
      - 领导和培养首席开发人员，提升组织的工程能力。
    qualifications:
      - 在领导多个团队或组织的工程工作方面拥有广泛经验。
