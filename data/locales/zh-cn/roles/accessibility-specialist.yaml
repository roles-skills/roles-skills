summary: >
  无障碍专员帮助组织让其数字健康服务尽可能被更多人使用，包括残障人士和长期病患者。他们对照无障碍标准并使用辅助技术测试服务，为团队提供建议和培训，并帮助将无障碍融入服务、临床系统和健康信息的设计、采购和构建方式之中。
health_context:
  - 许多最需要医疗卫生和照护服务的人有残障、年长或患有长期疾病，因此不无障碍的服务可能使人们无法获得照护。
  - 临床医生和照护人员也有无障碍需求，因此内部临床系统（包括从供应商处购买的系统）也必须无障碍。
  - 健康信息往往很复杂，并以文件、信函和视频等多种格式发布，因此专员帮助团队使其全部无障碍，包括易读版本和替代格式。
  - 临床工作流程中的无障碍问题可能变成安全问题，例如屏幕阅读器没有播报某条警示，因此专员与临床安全官一起处理这些风险。
levels:
  - title: 初级无障碍专员
    responsibilities:
      - 在督导下对照无障碍标准测试网页、应用和文件。
      - 清楚地记录和解释无障碍问题，使团队能够修复。
      - 协助使用屏幕阅读器和放大器等辅助技术进行测试。
      - 协助保持无障碍声明和问题日志为最新。
    qualifications:
      - 具有一定的数字测试、设计或开发经验，或同等经验。
  - title: 无障碍专员
    responsibilities:
      - 对面向患者的服务、临床系统和健康信息开展无障碍审核。
      - 使用多种辅助技术进行测试，并支持与残障用户开展的研究。
      - 就修复方法以及表单、警报和安全关键信息的无障碍模式向团队提供建议。
      - 在采购和验收过程中审查供应商产品的无障碍情况。
      - 编写培训材料和指南，并辅导较资浅的同事。
    qualifications:
      - 具有无障碍测试经验并了解现行无障碍标准，或同等经验。
  - title: 高级无障碍专员
    responsibilities:
      - 将无障碍融入团队从探索期到上线服务的工作方式中。
      - 为无障碍战略作出贡献，包括如何在采购和服务评估中保证无障碍。
      - 在无障碍问题可能影响患者安全时与临床安全官合作。
      - 为设计师、开发人员、内容设计师和供应商编写和开展无障碍培训。
      - 领导或管理其他无障碍专员。
    qualifications:
      - 在无障碍方面拥有丰富经验，相当于硕士学位水平。
  - title: 无障碍主管
    responsibilities:
      - 为面向患者的服务和内部服务制定组织的无障碍愿景、战略和标准。
      - 为各项服务遵守无障碍法律和标准提供保证，并向高级负责人报告。
      - 确保无障碍要求纳入临床系统的采购和供应商合同。
      - 影响组织的优先事项，使残障患者和员工不被排斥在外。
      - 领导和培养无障碍团队和实践社群。
    qualifications:
      - 在复杂组织中领导无障碍工作方面拥有广泛经验。
    job_evaluation_notes: 没有第 8a 职级的级别，因为 UK GDaD PCF 将无障碍主管定为 G7 或 G6，本参考资料采用建议的第 8b 职级。
