summary: >
  用户研究员帮助团队了解使用和提供医疗卫生和照护服务的人，包括患者、照护者、临床医生和照护人员。他们安全且合乎伦理地规划和开展研究，将所学转化为清晰的洞察，并确保关于数字健康服务的决策基于真实需求的证据，包括那些最难使用服务的人的需求。
health_context:
  - 研究参与者常常身体不适、焦虑或处境脆弱，因此研究员要为知情同意、保护和参与者的身心健康做周密的计划。
  - 研究中可能听到关于疾病、失去亲人或照护不佳的痛苦经历，因此研究员需要支持来应对对自己和团队的情绪影响。
  - 临床医生和照护人员离开患者的时间很少，因此研究员在不干扰照护的情况下在临床环境中规划研究，通常通过观察和简短的访谈。
  - 一些研究属于正式的健康研究或使用患者数据，因此研究员需要知道何时适用伦理或研究治理审批以及数据保护检查。
  - 健康不平等确实存在，因此研究员有意识地努力纳入数字技能较弱、有残障或英语能力有限的人，以及最少使用服务的人。
levels:
  - title: 助理用户研究员
    responsibilities:
      - 通过培训以及与有经验的研究员共事学习用户研究方法。
      - 按照同意和保护流程作记录、协助开展研究活动并协助招募参与者。
      - 按照信息治理规则安全地存储研究数据。
      - 协助分析研究数据，并与团队分享发现。
    qualifications:
      - 正在攻读相关领域的资格或学徒资格，或同等经验。
    job_evaluation_notes: 所有用户研究员级别的情绪消耗均为第 2 级，因为与患者和照护者开展的研究常常涉及听到疾病、失去亲人或照护不佳的经历。研究在此从第 2 级起评，在研究成为主要职责后升至第 3 级。
  - title: 初级用户研究员
    responsibilities:
      - 在更资深研究员的指导下，规划并开展与患者、照护者和员工的研究活动。
      - 在照护环境中使用访谈、可用性测试和情境观察等方法。
      - 获得知情同意，根据参与者的需求调整研究活动，并提出任何保护方面的问题。
      - 分析研究发现，并以清晰、可操作的洞察向团队展示。
      - 招募多元的参与者，包括难以使用服务的人。
    qualifications:
      - 社会科学或心理学等相关学科的学位，或同等经验。
  - title: 用户研究员
    responsibilities:
      - 为多学科团队规划和开展用户研究，选择适合研究问题和参与者的方法。
      - 在临床医生和照护人员的工作环境中与其开展研究，了解临床工作流程和安全关键任务。
      - 安全地规划与处境脆弱者开展的研究，并判断何时需要伦理或研究治理审批。
      - 分享帮助团队确定优先次序的洞察，包括有关安全和无障碍的证据。
      - 让团队参与研究，使其亲身了解用户。
    qualifications:
      - 相关学科的学位，或同等经验。
      - 具有规划和开展用户研究的经验。
  - title: 高级用户研究员
    responsibilities:
      - 为复杂服务（例如跨越多个照护场所或服务于处于危机中的人的服务）规划和领导研究。
      - 使研究与服务的总体计划以及其他团队的研究保持一致。
      - 规划与处境脆弱者开展的安全研究，并准备伦理和研究治理申请材料。
      - 督导和培养用户研究员，为其工作的质量和伦理提供保证。
      - 在新团队中以及与临床利益相关方一起建立以用户为中心的实践。
    qualifications:
      - 在用户研究方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席用户研究员
    responsibilities:
      - 领导并协调多个团队或整个项目群的用户研究。
      - 确保团队采用以用户为中心、以证据为基础的方法，并确保研究覆盖受健康不平等影响最大的人群。
      - 制定研究实践并为其提供保证，包括同意、保护、数据处理和参与者身心健康。
      - 建设团队可以安全复用的共享研究资产，例如研究资料库和参与者小组。
      - 直线管理和培养用户研究员。
    qualifications:
      - 在领导跨团队用户研究方面拥有广泛经验。
    job_evaluation_notes: 没有第 8a 职级的级别，因为 UK GDaD PCF 将首席用户研究员定为 G7 或 G6，本参考资料采用建议的第 8b 职级。财务资源为第 3 级，对应参与者招募和激励等研究预算。
  - title: 用户研究主管
    responsibilities:
      - 领导用户研究专业，制定其战略、标准和伦理规范。
      - 以关于患者、照护者和照护人员的证据影响组织的战略和优先事项。
      - 吸引、建设和培养研究人才，包括职业路径和招聘。
      - 为全组织的研究实践提供保证，并担任高风险研究的上报对象。
      - 在伦理、保护和研究治理机构面前代表研究实践。
    qualifications:
      - 在领导用户研究和研究实践方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 将首席用户研究员和用户研究主管都定为 G7 或 G6，建议第 8b 职级。本参考资料将主管定为第 8c 职级，与其他以用户为中心的设计专业的主管保持一致，因为主管领导全组织的该专业并发起其研究项目。
