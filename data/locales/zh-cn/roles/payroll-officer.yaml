summary: >
  薪资专员确保每位员工都能准确、按时获得薪酬。他们处理入职、离职和变动，计算工资和扣款，执行薪资检查，并回答薪资方面的询问。在数字医疗卫生组织中，薪资可能涵盖不同合同和薪酬规则下的临床、数字和综合人员，并往往在共享或外包的薪资系统上运行，团队必须对其进行核查和保证。
health_context:
  - 临床人员的薪酬可能很复杂，例如非社交时间工作、值班和多份合同，薪资必须正确计算。
  - 薪酬规则和年度加薪往往由国家或资助方确定，必须及时准确地执行。
  - 薪资通常是组织最大的单项成本，因此错误和欺诈会对公共资金和员工信任产生很大影响。
  - 薪资数据是高度敏感的个人信息，包括健康、家庭和银行信息，因此信息治理是这项工作的核心。
  - 薪资依赖人力和排班系统提供的准确数据，因此专员与人力资源和系统团队密切合作。
levels:
  - title: 薪资专员
    summary: 薪资专员处理薪资变动并为一组员工计算工资，遵循流程并在每期薪资截止前检查其工作。
    responsibilities:
      - 根据经授权的表格，将入职、离职和合同变动录入薪资系统。
      - 计算工资，包括加班费、津贴、病假工资和家庭假期工资。
      - 正确扣除税款、养老金和其他扣款。
      - 圆融且保密地回答员工和经理的薪资询问。
      - 检查薪资输出中的错误，并在薪资截止前予以纠正。
      - 遵守薪资控制措施和信息治理规则。
    qualifications:
      - 入门级薪资资格，或薪资处理方面的同等经验。
    job_evaluation_notes: 财务资源为第 3 级，因为该岗位处理组织向员工发放的薪酬。身体技能为第 3 级，对应快速准确的数据录入。
  - title: 高级薪资专员
    summary: 高级薪资专员处理复杂的薪资个案，检查薪资专员的工作，并协助开展薪资对账和申报。
    responsibilities:
      - 解决补发工资、多份合同和薪资牺牲等复杂的薪酬个案。
      - 体贴地按照政策追回多付款项。
      - 将薪资与分类账核对，并编制税款和养老金对账。
      - 检查薪资专员的工作，并签核薪资的部分内容。
      - 在加薪和规则变更上线前，在薪资系统中进行测试。
      - 培训薪资专员，并向经理提供基本的薪酬建议。
    qualifications:
      - 中级薪资资格，或同等经验。
  - title: 薪资组长
    summary: 薪资组长日常管理薪资团队，运行完整的薪资周期，并确保法定报告和养老金申报准确及时。
    responsibilities:
      - 规划并运行薪资周期，确保满足截止时间、检查和付款期限。
      - 签核薪资检查，并调查重大差异。
      - 管理法定薪资报告和养老金申报。
      - 日常管理薪资团队，包括工作量、培训和质量检查。
      - 与人力资源和排班团队合作，提高薪酬数据的质量和及时性。
      - 回答已上报的薪资询问和投诉。
    qualifications:
      - 高级薪资资格，或同等经验。
      - 具有运行完整薪资的经验。
  - title: 薪资经理
    summary: 薪资经理负责组织的薪资服务（无论是内部运行还是由供应商提供），并向负责人保证薪酬准确、合法且控制良好。
    responsibilities:
      - 管理薪资服务及其团队，并报告绩效和准确性。
      - 管理与任何薪资服务供应商或共享服务的合同和关系。
      - 制定薪资控制措施，例如审批限额、例外报告和职责分离。
      - 为薪酬规则、加薪、养老金和税收的变化做好规划，并确保正确执行。
      - 与系统和人力资源团队合作，领导薪资系统的变更和升级。
      - 为预算、预测和年度账目提供薪资信息。
      - 领导对薪资故障和严重错误的应对。
    qualifications:
      - 高级薪资资格或公认的会计资格，或同等经验。
      - 具有管理薪资服务的经验。
    job_evaluation_notes: 财务资源为第 4 级，因为该岗位负责组织的全部薪资，这是其最大的成本。人员为第 3 级，因为薪资团队规模较小。
