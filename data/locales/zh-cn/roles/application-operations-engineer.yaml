summary: >
  应用运维工程师保持组织的应用在上线使用中正常运行，包括电子病历以及处方、实验室和影像系统等临床系统。他们监控应用，运行计划任务，管理用户和访问权限，部署版本和修复，并与供应商合作解决故障。他们的工作使临床和综合人员在一天中的任何时候都能依赖这些系统。
health_context:
  - 临床应用每天 24 小时运行，因此工程师参加值班轮换，并将维护安排在临床最清闲的时段。
  - 计划任务和接口失败可能延误检查结果、转诊或出院小结，因此工程师密切关注并迅速上报。
  - 计划内和计划外停机都需要业务连续性安排，例如只读副本和停机报告，使临床医生能够继续治疗患者。
  - 许多临床应用由第三方提供和托管，因此工程师审慎地管理供应商及其变更。
  - 对临床应用的变更遵循临床风险管理流程，一些应用可能作为医疗器械受到监管。
levels:
  - title: 助理应用运维工程师
    responsibilities:
      - 监控应用、接口和计划任务，并向有经验的工程师报告故障。
      - 按照基于角色的访问规则，在应用中创建和更改用户账户及访问权限。
      - 使用操作手册开展日常检查和维护任务。
      - 在服务管理工具中准确记录事件和变更。
      - 攻读 IT 学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读 IT 学徒资格或同等资格。
    job_evaluation_notes: 知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 应用运维工程师
    responsibilities:
      - 监控临床和综合应用及其接口，在警报和失败任务影响患者照护前采取行动。
      - 运行和检查夜间数据加载和接口队列等计划任务，并解决或上报故障。
      - 管理应用用户、角色和访问权限，包括撤销离职人员的访问权限并支持访问审查。
      - 为临床应用编制并测试停机报告和其他业务连续性输出。
      - 向供应商登记故障并跟踪直至解决。
      - 在指导下参加值班轮换，处理非工作时间的应用故障。
    qualifications:
      - IT 资格、已完成的学徒培训，或同等经验。
      - 具有支持业务或临床应用的经验。
  - title: 高级应用运维工程师
    responsibilities:
      - 按照变更和临床安全流程，向上线应用部署版本、补丁和配置变更。
      - 协调新应用和重大升级上线的技术工作，包括切换和回滚计划。
      - 与供应商、基础设施团队和临床系统专家一起调查复杂的应用故障。
      - 与临床服务一起规划维护窗口，确保停机流程准备就绪。
      - 为临床安全案例提供证据，例如测试和部署记录。
      - 在值班轮换中担任非工作时间故障的上报对象。
    qualifications:
      - 在支持上线应用方面拥有丰富经验，相当于学位水平。
    job_evaluation_notes: 脑力消耗反映在上线、部署和非工作时间事件期间经常长时间专注。
  - title: 首席应用运维工程师
    responsibilities:
      - 为一组应用确定运维方法，包括监控、韧性和支持安排。
      - 与安全团队合作，为各临床应用的用户和安全管理制定标准。
      - 向 IT 运维负责人报告应用的性能和可用性，并商定所需的变更。
      - 领导对影响临床应用的重大事件的技术响应。
      - 确保临床应用的业务连续性和灾难恢复安排经过测试。
      - 领导和培养应用运维工程师。
    qualifications:
      - 在运行上线应用（包括临床系统或其他关键系统）方面拥有广泛经验。
  - title: 主任应用运维工程师
    responsibilities:
      - 负责组织临床和综合应用的应用运维战略。
      - 管理临床应用的战略供应商，包括服务水平、合同履约和供应商变更。
      - 就不受支持的软件、单点故障和抵御勒索软件的能力等应用风险向高级负责人提供建议。
      - 确保组织在应用长时间停机期间能够继续安全地照护患者。
      - 领导应用运维团队的资源配置、学习和发展。
    qualifications:
      - 在领导大型组织的应用运维方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 建议此级别为第 8c 职级（G6）。本参考资料将其定为第 8b 职级，与其他技术职族中的主任级角色一致，因为其范围是一个技术领域而不是一个总监部。
