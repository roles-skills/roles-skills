summary: >
  终端用户计算工程师提供、支持和维护员工每天使用的设备和软件，例如笔记本电脑、台式机、平板电脑、手机、打印机以及病房和诊所中的共享工作站。他们在现场和远程修复故障，部署和更新设备，并保持其安全合规。他们的工作使临床医生和照护人员能够在照护现场查看和记录患者信息。
health_context:
  - 许多设备由病房、诊所和急诊科的临床人员共享，通常采用快速切换用户以及智能卡或刷卡登录。
  - 临床区域中的设备损坏可能延误照护，因此工程师优先处理这些故障，并准备好备用设备以便更换。
  - 工程师在临床区域工作，因此要遵守感染预防与控制规定，尊重患者的隐私和尊严，并围绕临床活动安排工作。
  - 设备存有或显示保密的患者信息，因此必须加密、打补丁、受到管理，并在寿命结束时安全擦除或销毁。
  - 一些外设支持临床流程或与临床设备相连，例如腕带和标签打印机、条码扫描器和口述录音设备，因此对其进行更改需要谨慎并经过测试。
levels:
  - title: 助理终端用户计算工程师
    responsibilities:
      - 在有经验的工程师指导下安装、更换和维修设备及外设。
      - 修复临床区域和办公区域的常见故障，例如打印机、扫描仪和登录问题。
      - 在病房和诊所工作时遵守感染预防与控制规定，尊重患者隐私。
      - 在服务管理工具中准确记录工作、资产和零部件。
      - 攻读 IT 支持学徒资格或同等资格。
    qualifications:
      - 已注册或正在攻读 IT 支持学徒资格或同等资格。
    job_evaluation_notes: 体力消耗反映经常性的轻度用力，例如搬运设备以及在桌下和狭窄空间中工作。知识按培训完成到足以开展工作时岗位所需的水平评分。
  - title: 终端用户计算工程师
    responsibilities:
      - 在现场和远程诊断并修复硬件和软件故障，力争一次上门即解决。
      - 快速响应临床区域的故障，在维修会延误照护时提供替换设备。
      - 使用组织的标准镜像和设备管理工具构建、部署和更新设备。
      - 保持设备已打补丁、已加密且合规，并在寿命结束时安全擦除或处置。
      - 配置和测试腕带打印机、标签打印机和条码扫描器等临床外设。
      - 辅导助理工程师，并通过知识文章分享修复方法。
    qualifications:
      - IT 三级或以上资格、已完成的学徒培训，或同等经验。
      - 具有支持终端用户设备的经验。
    job_evaluation_notes: 体力消耗反映在各场所搬运和安装设备时经常性的轻度用力。
  - title: 高级终端用户计算工程师
    responsibilities:
      - 日常领导一支工程师团队，按对患者照护和员工的影响确定工作优先次序。
      - 为病房、诊所和社区团队规划并实施设备推广和更新，尽量减少对照护的干扰。
      - 在推广前用临床应用和外设测试设备镜像和更新。
      - 确保设备符合安全标准，包括补丁级别、加密和终端防护。
      - 通过现场巡查和快速设备修复支持临床系统上线。
      - 与基础设施、应用和安全团队合作修复复杂和重复出现的故障。
    qualifications:
      - 在支持和管理终端用户设备方面拥有丰富经验，相当于学位水平。
    job_evaluation_notes: 人员职责反映对一支工程师团队的日常管理；体力消耗反映仍有一定的现场工作。
  - title: 首席终端用户计算工程师
    responsibilities:
      - 为组织的设备、镜像和终端用户软件制定标准，包括共享的临床工作站。
      - 管理设备、维修和终端用户服务的供应商，并要求其达到商定的服务水平。
      - 与技术架构师合作选择和测试新型设备，例如供病房和社区员工使用的移动设备。
      - 领导对终端用户计算事件的技术响应，例如影响临床工作站的更新失败。
      - 规划设备生命周期和容量，并就更新成本提供建议。
      - 领导和培养高级工程师。
    qualifications:
      - 在终端用户计算方面拥有广泛经验，包括管理供应商。
  - title: 主任终端用户计算工程师
    responsibilities:
      - 负责终端用户计算战略和路线图，包括员工如何在医院、诊所、患者家中和社区访问临床系统。
      - 确保设备资产支持在照护现场安全、快速地访问患者信息。
      - 就设备投资、风险以及更新和新技术的成本向高级负责人提供建议。
      - 领导应对全资产范围的设备风险，例如操作系统停止支持以及抵御勒索软件的能力。
      - 领导终端用户计算团队的资源配置、学习和发展。
      - 与医疗卫生和照护合作伙伴一起制定共享的设备和访问标准。
    qualifications:
      - 在领导大型多场所组织的终端用户计算方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 建议此级别为第 8c 职级（G6）。本参考资料将其定为第 8b 职级，与其他技术职族中的主任级角色一致，因为其范围是一个技术领域而不是一个总监部。
