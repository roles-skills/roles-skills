summary: >
  项目支持专员通过维护计划、登记册和文件，组织会议和编制报告，帮助项目和项目群顺利运行。在较高级别上，他们运行项目管理办公室（PMO），让负责人清楚地了解组织数字化变革组合的进展、风险和效益。
health_context:
  - 数字健康项目在特定节点需要临床安全、信息治理和安全方面的审批，因此项目支持将这些作为关键里程碑加以跟踪。
  - 项目经常依赖时间有限的临床医生和照护人员，因此围绕临床排班和服务压力进行规划很重要。
  - 项目组合报告帮助负责人在临床服务承受压力时决定哪些变革继续推进。
levels:
  - title: 项目支持专员
    summary: 在项目经理的指导下为一个或多个项目提供行政支持，维护记录并组织会议。
    responsibilities:
      - 在项目资料库中维护项目文件，并进行版本控制。
      - 更新行动、风险、问题和决策日志。
      - 组织项目会议，分发文件，并作行动纪要。
      - 收集团队的最新进展，用于编制状态报告。
      - 处理日常的项目函件和咨询。
    qualifications:
      - 商务行政或项目支持三级资格，或同等经验。
  - title: 项目协调员
    summary: 为多个项目或一个项目群协调项目控制，维护计划和登记册，并定期编制报告。
    responsibilities:
      - 为多个项目维护项目计划、登记册和跟踪表。
      - 定期编制状态报告和要点报告。
      - 跟踪项目预算和支出，并提出差异。
      - 检查项目是否遵循商定的方法，包括临床安全和信息治理步骤。
      - 协调项目委员会、文件和行动事项。
      - 在与利益相关方沟通方面支持项目经理。
    qualifications:
      - 基础项目管理资格，或同等经验。
  - title: PMO 分析师
    summary: 分析整个项目群或项目组合的进展、风险和效益，并运行项目管理办公室的流程。
    responsibilities:
      - 分析各项目的进展、风险、问题、依赖关系和效益。
      - 为项目群和项目组合委员会编制项目组合仪表板和报告。
      - 运行规划、变更控制和保证流程。
      - 帮助项目经理以正确的控制措施和文件启动项目。
      - 维护 PMO 的工具、模板和指南。
      - 辅导项目支持专员。
    qualifications:
      - 项目、项目群或项目组合管理资格，或同等经验。
  - title: PMO 经理
    summary: 管理一个项目群或项目组合的项目管理办公室，制定标准，并为负责人提供关于交付的可靠洞察。
    responsibilities:
      - 领导项目管理办公室及其员工。
      - 制定项目和项目组合的标准、方法和工具。
      - 为高级负责人提供关于项目组合进展、风险和效益的清晰洞察。
      - 运行项目组合治理，包括优先排序、关口评审和变更控制。
      - 监控项目群的预算和资源，并加以报告。
      - 在方法和控制措施方面辅导项目经理。
    qualifications:
      - 公认的项目、项目群或项目组合管理资格，或同等经验。
      - 具有运行项目管理办公室的经验。
