summary: >
  法律顾问是合格律师，为组织提供实用、准确的法律意见，并帮助其管理法律风险。他们起草和谈判合同，就数据、采购、劳动以及医疗卫生和照护法律提供建议，并管理争议和索赔。在数字医疗卫生组织中，他们的许多工作与技术有关：软件许可、云和数据处理协议、数据共享、软件和数据中的知识产权，以及数字健康产品的监管。
health_context:
  - 技术合同必须保护患者数据、保持临床服务运行，并确保组织能够安全地更换供应商。
  - 将健康数据用于直接照护、规划、研究和人工智能，会引发数据保护法和保密义务方面的问题，需要审慎的法律意见。
  - 用公共资金购买技术必须遵守公共采购规则，供应商可以质疑授予决定。
  - 组织可能构建软件或数据产品，这会引发知识产权、开源和商业使用方面的问题。
  - 索赔可能涉及对患者的伤害，包括数字服务在其中发挥作用的情况，因此顾问与临床安全、风险和赔偿同事合作。
levels:
  - title: 法律顾问
    summary: 法律顾问是合格律师，在技术合同、信息法、采购或劳动等一个或多个领域提供独立意见并处理自己负责的一批案件。
    responsibilities:
      - 起草、审查和谈判软件许可、云服务和数据处理协议等协议。
      - 在您的执业领域向管理者和团队提供清晰、实用的法律意见。
      - 就数据共享协议、数据保护影响评估和信息请求提供建议。
      - 就技术和服务的采购流程及合同变更提供建议。
      - 管理一批争议或索赔，必要时委托外部律师。
      - 督导和培养律师助理和法务助理。
    qualifications:
      - 获准执业的合格律师，或同等资格和经验。
      - 具有商法、技术法、信息法或公法方面的经验。
    job_evaluation_notes: 知识为第 7 级，因为该岗位需要专业法律资格和执业经验。财务资源为第 2 级，因为法律顾问很少持有预算。情绪消耗为第 2 级，因为索赔和劳动案件常常涉及令人痛苦的材料。
  - title: 高级法律顾问
    summary: 高级法律顾问是经验丰富的律师，在技术与数据、信息法、采购、劳动或索赔等专业领域主导复杂、高价值或高风险的事项。
    responsibilities:
      - 主导复杂协议，例如大型系统实施、数据平台和合作关系。
      - 就人工智能、将数据用于研究以及作为医疗器械的软件等新问题向高级管理者提供建议。
      - 就人力变革、承包人和劳动争议方面的劳动法提供建议。
      - 主导重大争议、采购质疑以及与临床过失赔偿计划的联络。
      - 为组织编写模板、谈判手册和指引。
      - 管理和培养法律顾问和律师助理。
    qualifications:
      - 获准执业的合格律师，并在相关专业领域拥有丰富的执业后经验。
    job_evaluation_notes: 财务资源为第 2 级，因为该岗位不持有预算，尽管它控制其所办事项的外部律师费用支出。
  - title: 主任法律顾问
    summary: 主任法律顾问是组织在技术与数据或信息法等一个或多个法律领域的首席专家，主导组织在最重大事项上的法律工作。
    responsibilities:
      - 主导组织最重大的项目群、合同和争议的法律工作。
      - 就大规模数据共享、人工智能以及组织软件和数据的商业使用等新颖和高风险事项提供权威意见。
      - 确定组织在您专业领域的法律立场和标准。
      - 就法律风险向总监和董事会委员会提供建议。
      - 在法律事项上代表组织与监管机构、合作伙伴和供应商沟通。
      - 领导一个专业法律团队并发展其能力。
    qualifications:
      - 获准执业的合格律师，并拥有广泛的执业后经验和公认的专业领域专长。
    job_evaluation_notes: 知识为第 8 级，因为该岗位需要长期积累的跨法律和技术领域的专家级法律知识。
