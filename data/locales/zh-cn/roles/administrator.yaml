summary: >
  行政专员通过处理组织的日常行政事务使团队和服务正常运转，包括函件、日程、会议、档案、数据录入、订购和咨询。在数字医疗卫生组织中，他们为数字、临床和综合团队提供支持，并经常处理关于患者和员工的保密信息。
health_context:
  - 行政专员经常看到关于患者和员工的保密信息，因此严格遵守信息治理规则。
  - 咨询可能来自患者、照护人员和公众，一些来电者可能焦虑或痛苦。
  - 准确的记录和数据录入很重要，因为错误可能流入临床系统、报告和付款中。
  - 许多行政流程正在转向数字工具，因此行政专员帮助测试和采用新的工作方式。
levels:
  - title: 行政助理
    summary: 在督导就在身边的情况下，按照既定流程为团队完成日常行政任务。
    responsibilities:
      - 接听电话和回复电子邮件，准确记录留言，并将咨询转给合适的人。
      - 在团队的系统中准确录入和更新数据。
      - 归档和扫描文件，并保持共享文件夹有序。
      - 预订会议和会议室，并分发会议文件。
      - 按照既定流程订购文具和用品。
    qualifications:
      - 良好的读写、计算和键盘技能。
    job_evaluation_notes: 身体技能按第 3 级评分，对应高级键盘技能，以及打字和数据录入的速度和准确性。
  - title: 行政专员
    summary: 为团队或服务提供全面的行政服务，处理一系列任务（其中一些非常规），并自行安排工作量。
    responsibilities:
      - 为团队管理日程，安排会议、活动和差旅。
      - 为团队会议作记录和行动纪要，并跟进行动事项。
      - 处理常规函件和咨询，必要时起草回复。
      - 维护档案、跟踪表和数据库，并编制简单报告。
      - 在规定限额内处理订单、发票和报销。
      - 向新员工介绍团队的行政流程。
    qualifications:
      - 商务行政三级资格，或同等经验。
  - title: 高级行政专员
    summary: 领导一项服务或一个总监部的行政工作，督导其他行政人员并改进行政流程。
    responsibilities:
      - 协调一个总监部的行政服务，向行政专员分配工作。
      - 为管理会议和项目群会议作正式会议记录。
      - 编写和改进行政流程和模板。
      - 根据跟踪表和系统为经理编制报告。
      - 监控行政预算的支出并提出差异。
      - 培训和督导行政专员和学徒。
    qualifications:
      - 丰富的行政经验，相当于基础学位水平。
