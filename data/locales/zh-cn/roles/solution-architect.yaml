summary: >
  解决方案架构师设计新的或变更的服务如何端到端运作，从用户需求和临床工作流程到应用、数据、集成、托管和安全。他们确保每个解决方案契合组织的架构，满足其安全、隐私和互操作性需求，并能以可负担的成本构建、运行和支持。
health_context:
  - 解决方案通常结合了外购的临床系统、自建服务和共享平台，因此架构师必须跨越供应商边界进行设计。
  - 设计选择可能引入临床危害，例如结果丢失或患者匹配错误，因此解决方案设计会纳入临床安全案例。
  - 每个新的患者信息数据流都需要合法依据和数据保护影响评估，因此架构师与信息治理部门密切合作。
  - 使用 HL7 FHIR 等标准与其他医疗卫生和照护组织实现互操作，通常是一项核心需求。
  - 一些解决方案包含属于医疗器械的软件，这会改变设计、保证和供应商方面的要求。
levels:
  - title: 助理解决方案架构师
    responsibilities:
      - 从产品团队、临床医生和供应商处收集需求，为解决方案设计提供依据。
      - 绘制当前和目标状态图，例如上下文视图、数据流视图和集成视图。
      - 在督导下起草解决方案设计和决策记录的部分内容。
      - 对照架构标准、安全和信息治理要求检查设计。
      - 协助准备提交设计委员会审查的设计。
    qualifications:
      - 具备解决方案设计方面的专门知识，达到硕士水平或同等经验。
      - 具有分析、开发或技术设计方面的经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 6 职级）：医疗卫生行业的招聘广告将此角色定为第 7 职级。知识按硕士水平或同等评分，因为该岗位的设计涵盖应用、数据、集成和安全。
  - title: 解决方案架构师
    responsibilities:
      - 为员工工具或简单的面向患者服务等较低风险的服务设计端到端解决方案。
      - 比较各种方案，包括购买、自建和复用共享平台，并给出有明确理由的推荐。
      - 为解决方案设计集成、数据流以及身份与访问，在有开放标准时使用开放标准。
      - 为解决方案的危害识别和数据保护影响评估作出贡献。
      - 向设计委员会介绍设计，并在构建和上线过程中支持交付团队。
      - 辅导助理解决方案架构师并审查其工作。
    qualifications:
      - 在解决方案设计或软件工程方面拥有丰富经验，相当于硕士学位水平。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 7 职级）：医疗卫生行业的招聘广告将此角色定为第 8a 职级。规划、政策和行动自由度的评分高于第 7 职级概况，因为该岗位负责端到端设计并向设计委员会推荐方案。
  - title: 高级解决方案架构师
    responsibilities:
      - 为临床系统或跨多个组织使用的服务等中等风险的复杂解决方案进行设计。
      - 在采购中领导对供应商产品的技术评估，包括互操作性、安全和临床安全。
      - 在解决方案全天候支持照护时，针对韧性和业务连续性进行设计。
      - 与临床安全官合作，使设计决策和风险控制措施记入安全案例。
      - 辅导其他解决方案架构师并审查其工作。
    qualifications:
      - 在设计涉及多个学科的复杂解决方案方面拥有广泛经验，超过硕士学位水平。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 8a 职级）：医疗卫生行业的招聘广告将此角色定为第 8b 职级。知识按第 8 级评分，因为需要涵盖应用、数据、集成、安全和临床安全等多个学科的专门知识。
  - title: 首席解决方案架构师
    responsibilities:
      - 领导一个项目群或复杂领域的解决方案架构，例如电子病历系统的替换。
      - 确保整个项目群的解决方案一致、可互操作并与目标架构保持一致。
      - 就设计风险、依赖关系、供应商选择和成本向项目群委员会提供建议。
      - 在设计委员会中为其他解决方案架构师的设计提供保证。
      - 领导和培养一支解决方案架构师团队。
    qualifications:
      - 在领导复杂项目群的解决方案架构方面拥有广泛经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 8b 职级）：医疗卫生行业的招聘广告将此角色定为第 8c 职级。规划、政策和人员的评分高于第 8b 职级概况，因为该岗位规划整个项目群的架构并领导一支解决方案架构师团队。
  - title: 主任解决方案架构师
    responsibilities:
      - 领导组织规模最大或最关键项目群的解决方案架构。
      - 为组织制定解决方案架构的标准、模式和方法。
      - 就关键的共享医疗卫生和照护服务的设计向总监和合作组织提供建议。
      - 解决项目群、供应商和合作组织之间最棘手的设计冲突。
      - 领导解决方案架构实践并培养其人员。
    qualifications:
      - 在领导多个项目群或组织的解决方案架构方面拥有广泛经验。
    job_evaluation_notes: 职级高于 UK GDaD PCF 职等建议（第 8c 职级）：医疗卫生行业的招聘广告将此角色定为第 8d 职级。行动自由度为第 6 级，因为该岗位制定组织的解决方案架构标准；财务资源和人员为第 4 级，因为它领导该实践及其预算。
