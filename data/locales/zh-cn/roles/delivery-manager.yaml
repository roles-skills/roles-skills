summary: >
  交付经理帮助多学科团队交付适合患者、临床医生和照护人员使用的数字健康服务。他们采用敏捷和精益的工作方式，为团队创造良好的工作条件，消除障碍，管理风险和依赖关系，并以可持续的节奏推动交付。
health_context:
  - 支持患者照护的服务在发布前必须通过临床安全和信息治理检查，因此交付经理将这些检查纳入团队的计划和完成定义。
  - 交付常常依赖于离开患者时间有限的临床医生和照护人员，因此交付经理围绕临床排班安排研究、测试和培训。
  - 对上线的临床服务进行变更需要审慎把握时机，因此交付经理与运营团队一起规划上线，避开临床高峰期并安排好支持。
  - 团队往往依赖临床系统供应商和其他医疗卫生和照护组织，因此交付经理管理外部依赖关系和合同。
levels:
  - title: 助理交付经理
    responsibilities:
      - 主持站会、计划会、成果展示和回顾会等团队例会。
      - 保持团队看板、风险和问题日志以及依赖关系记录为最新。
      - 跟踪每次发布前所需的临床安全、信息治理和无障碍任务。
      - 围绕临床排班，安排与临床医生、照护人员和患者进行研究和测试的活动。
      - 跟随并协助大型团队的交付经理，在指导下交付部分工作。
    qualifications:
      - 具有在交付团队中工作或与交付团队合作的一定经验，或同等经验。
  - title: 交付经理
    responsibilities:
      - 领导一项数字健康产品或服务经过探索期、Alpha、Beta 和上线阶段的交付。
      - 与运营和临床团队一起规划发布，包括上线支持、培训和回滚计划。
      - 确保临床安全、信息治理和无障碍保证与交付同步进行，而不是放在最后。
      - 管理团队的预算、供应商合同和人员配置。
      - 用通俗的语言向治理委员会报告进展、风险和效益。
      - 营造健康的团队文化，并辅导团队成员采用敏捷工作方式。
    qualifications:
      - 在使用敏捷方法交付数字产品或服务方面拥有丰富经验。
    job_evaluation_notes: 没有第 6 职级的级别，因为 UK GDaD PCF 在助理交付经理（EO/HEO）和交付经理（SEO/G7）之间没有交付经理级别。
  - title: 高级交付经理
    responsibilities:
      - 领导复杂或高风险服务的交付，例如用于急诊照护或替换核心临床系统的服务。
      - 担任跨多个团队的交付风险、问题和依赖关系的主要上报对象。
      - 与临床安全官和运营负责人一起规划跨场所和组织的大规模推广。
      - 管理服务的预算、商务安排和供应商绩效。
      - 直线管理和培养交付经理。
    qualifications:
      - 在交付复杂数字服务的全生命周期方面拥有广泛经验。
  - title: 交付管理主管
    responsibilities:
      - 领导交付管理专业，并制定组织的敏捷交付标准。
      - 在整个项目组合中招聘、培养和调配交付经理。
      - 确保交付方法符合临床安全、信息治理和保证要求，同时不会不必要地拖慢团队。
      - 就交付风险、能力和优先事项向执行和临床负责人提供建议。
      - 管理该专业的预算和人力计划。
    qualifications:
      - 在领导多个团队的交付以及领导交付实践方面拥有广泛经验。
