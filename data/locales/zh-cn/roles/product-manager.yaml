summary: >
  产品经理确保组织的数字健康产品满足患者、临床医生和照护人员的需求，并为医疗卫生和照护体系创造价值。他们制定产品愿景和路线图，依据证据确定多学科团队工作的优先次序，并对其产品取得的成果负责，包括对照护的影响。
health_context:
  - 产品决策可能影响患者安全，因此产品经理与临床安全官一起对其产品的临床风险负责，并确保在发布前管理好危害。
  - 产品服务于需求各异的众多用户群体，例如患者、照护者、临床医生和行政人员，产品经理必须公平地加以平衡。
  - 一些产品可能作为医疗器械受到监管，因此产品经理需要知道何时适用监管并为此做好规划。
  - 照护中的成果包括安全、质量、可及性、公平性和员工时间，因此产品经理定义临床和运营负责人认可的成功指标。
  - 产品往往依赖国家和区域的健康数据标准以及共享平台，因此产品经理跨组织边界开展工作。
levels:
  - title: 助理产品经理
    responsibilities:
      - 与产品经理合作，负责某项功能或产品某一部分的待办事项列表。
      - 将来自患者、临床医生和照护人员的用户研究证据转化为排好优先级的用户故事。
      - 与临床安全官合作，记录和审查您负责的功能的危害。
      - 跟踪使用率、完成率和支持来电等产品指标，并报告其所反映的情况。
      - 在成果展示会上以及与运营利益相关方沟通时代表产品。
    qualifications:
      - 具有数字、临床或运营岗位的经验，或同等经验。
  - title: 产品经理
    responsibilities:
      - 为一项数字健康产品制定愿景、路线图和成功指标。
      - 在用户需求、临床安全、政策、技术限制和成本之间取得平衡，确定团队工作的优先次序。
      - 与临床安全官一起为产品变更承担临床风险，并叫停不安全的发布。
      - 与临床和运营负责人合作，确保产品契合照护路径并被采用。
      - 确保产品符合无障碍、信息治理和服务标准。
      - 衡量产品的成果，包括其对患者和员工的效益。
    qualifications:
      - 在产品管理或相关数字岗位方面拥有丰富经验。
  - title: 高级产品经理
    responsibilities:
      - 领导一组相关产品，或一个复杂、高风险或敏感的单一产品，例如用于急诊照护的产品。
      - 依据关于患者需求、临床实践以及医疗卫生和照护政策的证据制定产品战略。
      - 在适用时确保产品符合医疗器械法规。
      - 管理产品预算，并以对照护的效益论证投资。
      - 辅导和直线管理产品经理。
    qualifications:
      - 在管理数字产品全生命周期方面拥有广泛经验。
  - title: 首席产品经理
    responsibilities:
      - 领导一个产品组合或端到端服务，例如支持某一照护路径的所有产品。
      - 为多个团队确定产品方向，确保各产品为患者和员工协同运作。
      - 与临床负责人和临床安全官一起管理整个产品组合的临床风险。
      - 持有产品组合预算，并向高级治理委员会报告效益。
      - 领导和培养本产品领域的产品经理。
    qualifications:
      - 在领导跨多个团队的产品方面拥有广泛经验。
  - title: 产品主管
    responsibilities:
      - 与执行、临床和运营负责人合作，制定组织的产品战略。
      - 制定并提高产品管理标准，包括产品如何管理临床风险和衡量成果。
      - 领导产品专业，包括招聘、职业路径和能力建设。
      - 依据需求、价值和公平性方面的证据，确定各产品的投资优先次序。
      - 在医疗卫生和照护体系的合作伙伴面前代表组织的产品。
    qualifications:
      - 在全组织领导产品管理方面拥有广泛经验。
