summary: >
  服务负责人是对一项数字健康服务端到端负责的领导者，涵盖其数字、运营和临床部分。他们汇集多学科团队和服务合作伙伴，制定服务的战略和优先事项，负责其预算和绩效，并确保服务为患者、临床医生和照护人员带来安全、高质量的成果和效益。
health_context:
  - 数字健康服务是更广泛照护服务的一部分，因此服务负责人与临床和运营负责人平等合作，共同对患者的完整体验负责。
  - 服务负责人对服务的临床风险得到管理负责，与临床安全官合作，并在适当层级接受剩余风险。
  - 服务处理保密的健康信息，因此服务负责人确保信息治理、数据保护和网络安全措施到位并得到审查。
  - 支持照护的上线服务必须具有韧性，因此服务负责人确保业务连续性、事件响应和供应商支持满足临床需求。
  - 照护效益必须得到衡量和报告，因此服务负责人维护涵盖安全、质量、可及性、公平性和成本的绩效指标。
levels:
  - title: 服务负责人
    responsibilities:
      - 在整个生命周期内对一项端到端数字健康服务负责，例如在线访问病历或数字转诊。
      - 与临床和运营负责人一起制定服务战略和优先事项，在用户需求、安全、政策和成本之间取得平衡。
      - 负责服务预算，并基于对患者和员工的效益论证投资。
      - 确保临床风险、信息治理、无障碍和网络安全得到管理和保证。
      - 监控服务绩效和效益，并在服务未达标时领导改进。
      - 在治理委员会中以及与医疗卫生和照护体系的合作伙伴沟通时代表该服务。
    qualifications:
      - 在领导数字、运营或临床服务方面拥有广泛经验。
  - title: 高级服务负责人
    responsibilities:
      - 对一组相关的数字健康服务，或对在整个照护体系中使用的关键服务（例如电子病历系统）负责。
      - 与执行、临床和运营负责人一起为这些服务制定多年战略。
      - 负责各项服务的预算和主要供应商关系。
      - 与临床安全官和信息风险执行负责人合作，在高层接受并上报临床、信息和运营风险。
      - 领导服务负责人和多学科团队，营造开放和持续改进的文化。
      - 领导对影响患者照护的重大服务事件的应对以及随后的学习。
    qualifications:
      - 在领导大型或关键服务（包括其预算和供应商）方面拥有广泛经验。
    job_evaluation_notes: UK GDaD PCF 只有一个服务负责人级别，为 G7 或 G6。本参考资料增加了第 8c 职级的高级级别，用于对全组织照护至关重要的服务，其预算覆盖多项服务（财务资源第 5 级），并经常参与影响患者的严重事件（情绪消耗第 2 级）。
