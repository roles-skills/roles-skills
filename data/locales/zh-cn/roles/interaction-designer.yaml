summary: >
  交互设计师设计患者、照护者、临床医生和照护人员如何使用组织的数字健康服务，从面向患者的应用和表单到临床医生在床旁使用的界面。他们设计简单、无障碍且安全的交互，与真实用户一起测试，并使用共享的设计系统，使各项服务感觉一致、熟悉。
health_context:
  - 临床医生经常在时间压力下、在被打断的情况下以及在共享设备上使用系统，因此设计必须支持快速、准确的工作，让安全的操作成为便捷的操作。
  - 糟糕的设计可能造成临床伤害，例如选错患者或看错剂量，因此设计师运用人因原则并与临床安全官合作。
  - 许多用户身体不适、焦虑、年长或有残障，因此设计必须符合无障碍标准，并适合数字技能或健康素养较低的人使用。
  - 警报和警示只有在人们注意到并信任它们时才有用，因此设计师帮助减少警报疲劳，并使安全关键信息保持醒目。
levels:
  - title: 助理交互设计师
    responsibilities:
      - 通过培训和结对学习交互设计方法和团队的设计系统。
      - 在督导下制作草图、线框图和简单原型。
      - 协助与用户一起测试设计，记录哪些有效、哪些无效。
      - 遵循无障碍标准和设计系统的模式，包括患者身份和安全警示的模式。
    qualifications:
      - 正在攻读设计或相关领域的资格或学徒资格，或同等经验。
  - title: 初级交互设计师
    responsibilities:
      - 在更资深设计师的指导下，设计服务的部分内容（例如表单、流程和界面）并制作原型。
      - 与患者、照护者和员工一起测试设计，并根据所学进行修改。
      - 设计能与辅助技术配合使用的无障碍交互。
      - 向团队解释设计决策，包括它们如何降低出错的可能。
    qualifications:
      - 设计或相关学科的学位，或同等经验。
  - title: 交互设计师
    responsibilities:
      - 为一项数字健康产品设计交互，从早期概念到详细、经过测试的设计。
      - 针对临床工作流程进行设计，与临床医生和照护人员在包括被打断在内的真实场景中测试。
      - 向临床安全官提出与设计相关的危害，并记录设计如何控制这些危害。
      - 使用设计系统并为其作出贡献，包括安全关键信息的模式。
      - 与开发人员密切合作，确保设计按预期构建并保持无障碍。
    qualifications:
      - 设计或相关学科的学位，或同等经验。
      - 具有与用户一起设计数字服务的经验。
    job_evaluation_notes: UK GDaD PCF 将交互设计师定为 SEO 或 G7，建议第 7 职级，与高级交互设计师相同。本参考资料将其定为第 6 职级，与 PCF 技能等级相同的服务设计师级别一致，使两个交互设计师级别不在同一职级。
  - title: 高级交互设计师
    responsibilities:
      - 领导复杂服务（例如在众多照护场所使用的临床系统）的交互设计。
      - 将任务分析等人因方法应用于安全关键的临床工作流程。
      - 为临床安全案例提供设计证据，在软件受监管时为可用性文件提供证据。
      - 帮助确定团队的设计方向和良好实践，并指导其他设计师。
      - 依据研究和数据作出设计决策，并向临床和产品负责人解释。
    qualifications:
      - 在交互设计方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席交互设计师
    responsibilities:
      - 为多个团队或服务确定设计方向，并为交互设计质量提供保证。
      - 领导设计系统，包括全组织各团队复用的无障碍和安全关键模式。
      - 与临床安全官一起领导风险最高的临床服务的人因工作。
      - 与高级产品和临床负责人合作，为重要服务开发设计概念。
      - 直线管理和培养交互设计师。
    qualifications:
      - 在领导跨团队交互设计方面拥有广泛经验。
    job_evaluation_notes: 没有第 8a 职级的级别，因为 UK GDaD PCF 将首席交互设计师定为 G7 或 G6，本参考资料采用建议的第 8b 职级。政策为第 5 级，因为首席设计师为一系列服务制定设计标准。
  - title: 交互设计主管
    responsibilities:
      - 领导交互设计专业，制定其战略、标准和工作方式。
      - 影响设计和组织战略，使服务好用、无障碍且安全。
      - 负责组织的设计系统，确保其满足无障碍和临床安全需求。
      - 建设设计能力，包括招聘、职业路径和培训。
      - 与医疗卫生和照护体系中的同行合作开发共享设计模式。
    qualifications:
      - 在领导设计和设计实践方面拥有广泛经验。
