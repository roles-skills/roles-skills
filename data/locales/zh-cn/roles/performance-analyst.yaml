summary: >
  绩效分析师衡量组织的数字健康服务对患者、服务使用者、临床医生和照护人员的效果。他们建立衡量框架，收集和分析使用情况与成果数据，帮助产品团队和服务负责人了解变更是否改善了服务可及性、体验、安全和效率。
health_context:
  - 成功的衡量标准不止于数字服务的使用率，还包括对照护的影响，例如爽约、等候时间、安全分诊和节省的员工时间。
  - 健康服务上的分析和跟踪可能泄露敏感信息，例如某人搜索了哪种疾病，因此衡量必须尊重同意、Cookie 规则和保密要求。
  - 数字服务不得扩大健康不平等，因此分析师关注不太可能使用数字服务的群体的使用率和成果。
  - 绩效数据可能报告给董事会、服务委托方和监管机构，因此定义必须一致并有完善的记录。
levels:
  - title: 助理绩效分析师
    responsibilities:
      - 定期编制关于患者和员工如何使用数字服务的报告，例如注册数、完成数和流失点。
      - 检查分析和跟踪数据中的缺口和错误，并向团队报告。
      - 在收集和分享使用数据时遵守组织关于同意和保密的规则。
      - 帮助产品团队回答有关服务使用的简单问题。
    qualifications:
      - 良好的计算能力，以及一定的数据处理或分析经验，或同等经验。
  - title: 绩效分析师
    responsibilities:
      - 与产品团队和临床负责人商定一项服务的成功标准，包括对照护和员工的影响。
      - 建立并验证分析机制，使跟踪准确、适度并尊重同意。
      - 将数字分析与预约和转诊等运营数据相结合，展示变更的效果。
      - 分析不同患者群体的使用率和成果，突出数字排斥的风险。
      - 向产品团队和服务负责人汇报分析结果并提出改进建议。
    qualifications:
      - 数理类学科的学位，或同等经验。
      - 具有衡量数字服务绩效的经验。
  - title: 高级绩效分析师
    responsibilities:
      - 领导一组服务或一个重要项目群（例如数字门诊或在线分诊）的绩效衡量。
      - 与临床、财务和运营负责人一起设计效益衡量指标，并在交付过程中加以跟踪。
      - 选择并配置符合信息治理和安全要求的分析工具。
      - 向项目群委员会和高级负责人提交绩效证据。
      - 辅导分析师，并可能直线管理一名或多名绩效分析师。
    qualifications:
      - 在数字服务绩效分析方面拥有丰富经验，相当于硕士学位水平。
  - title: 首席绩效分析师
    responsibilities:
      - 领导覆盖一组数字健康服务的绩效分析师团队。
      - 商定关键绩效指标的一致定义，使提交给董事会和合作伙伴的报告可以跨时期比较。
      - 确保分析数据准确、使用得当，并按信息治理规则处理。
      - 利用绩效证据影响项目组合的优先事项和投资。
      - 辅导和指导各级分析师。
    qualifications:
      - 在绩效分析和领导分析师方面拥有广泛经验。
  - title: 绩效分析主管
    responsibilities:
      - 制定衡量组织数字服务绩效和效益的战略。
      - 为绩效分析和绩效报告制定质量保证框架。
      - 就绩效证据所揭示的数字服务和患者结局情况向执行负责人提供建议。
      - 与数据分析和数据科学等其他分析专业合作，共享方法和数据。
      - 规划绩效分析社群的能力，包括招聘和培养。
    qualifications:
      - 在全组织领导绩效分析方面拥有广泛经验。
