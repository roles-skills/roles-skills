# Simplified Chinese translations of data/skills/human-resources.yaml. Keys are the English skill ids.
hr-hr-administration:
  name: 人力资源行政
  description: 准确、保密地运行雇佣生命周期的行政流程，从合同和入职到变动、缺勤记录和离职。
  levels:
    awareness: |
      您可以：
      - 遵循组织关于入职、变动和离职的流程
      - 对个人档案保密并保持其最新
    working: |
      您可以：
      - 准确准备合同、变更函和雇佣核查
      - 在截止日期前于人力资源和薪资系统中处理变动
      - 回答经理和员工关于人力资源流程的常规问题
    practitioner: |
      您可以：
      - 运行人力资源行政服务，检查质量并达到服务标准
      - 改进流程和模板，并尽可能将常规步骤自动化
      - 解决复杂或特殊的情况，例如多付工资或合同错误
    expert: |
      您可以：
      - 为组织设计人力资源运营模式和服务标准
      - 领导向数字化、自助式人力资源流程的转变
      - 制定保持人力资源和薪资数据准确合法的控制措施
hr-employment-policy:
  name: 劳动法与人事政策
  description: 应用劳动法，编写、解释和审查组织的人事政策，使员工受到合法、公平、一致的对待。
  levels:
    awareness: |
      您可以：
      - 解释主要的人事政策以及在哪里找到它们
      - 识别何时某个问题需要人力资源顾问的意见
    working: |
      您可以：
      - 将人事政策应用于常规情况并向经理解释
      - 识别政策背后的劳动法原则
      - 保存政策记录并跟踪政策审查日期
    practitioner: |
      您可以：
      - 针对复杂情况解释劳动法和政策并就风险提供建议
      - 起草和审查人事政策，并进行平等影响评估
      - 就政策变更与员工代表进行协商
    expert: |
      您可以：
      - 制定组织的人事政策框架和法律风险应对方法
      - 预判劳动法的变化并规划组织的应对
      - 就雇佣风险和责任向董事会提供建议
hr-employee-relations:
  name: 员工关系个案处理
  description: 依据政策和劳动法，公平地管理正式和非正式的员工关系个案，例如行为、能力、申诉、出勤和工作中的尊严。
  levels:
    awareness: |
      您可以：
      - 解释行为、能力、申诉和出勤程序的主要阶段
      - 在正式会议上准确记录，并对个案记录保密
    working: |
      您可以：
      - 就简单个案以及程序中的下一步向经理提供建议
      - 支持调查，准备个案文件，安排听证
      - 就个人个案与员工代表建设性地合作
    practitioner: |
      您可以：
      - 管理一批复杂个案，就公平结果向听证小组提供建议
      - 开展或领导调查，包括与事件或保护问题相关的调查
      - 运用早期解决和调解，在争议升级前化解
      - 发现个案趋势并针对其原因采取行动
    expert: |
      您可以：
      - 领导组织在员工关系和伙伴合作方面的方法
      - 处理最敏感或风险最高的个案，包括劳动索赔
      - 谈判集体协议并解决集体争议
hr-recruitment-and-selection:
  name: 招聘与甄选
  description: 公平高效地吸引、评估和任用人员，从岗位设计和招聘广告，到筛选、评估、录用和入职前核查。
  levels:
    awareness: |
      您可以：
      - 解释组织招聘流程的各个阶段
      - 遵守公平和安全的招聘规则，包括入职前核查
    working: |
      您可以：
      - 通过申请人跟踪系统开展招聘活动
      - 在招聘广告、筛选和面试安排方面支持经理
      - 完成入职前核查并发出有条件录用通知
    practitioner: |
      您可以：
      - 就岗位设计、甄选方法和公平评估向经理提供建议
      - 为专业岗位设计评估，例如数字岗位的技术练习
      - 分析招聘数据，以改善招聘周期、质量和多元化
      - 管理候选人体验和雇主品牌
    expert: |
      您可以：
      - 制定组织的招聘战略和服务标准
      - 领导招聘技术和招聘机构的选择与使用
      - 确保全组织的招聘具有包容性且合法
hr-talent-attraction:
  name: 人才吸引与寻访
  description: 通过雇主品牌、直接寻访、人脉网络和早期职业路径，寻找并吸引具备稀缺技能的人员，例如数字、数据和技术专家。
  levels:
    awareness: |
      您可以：
      - 解释哪些技能难以招聘以及原因
      - 通过组织的渠道和人脉网络分享招聘广告
    working: |
      您可以：
      - 撰写吸引专业候选人并使用通俗语言的招聘广告
      - 在招聘网站、专业网络和人才库中搜寻候选人
      - 支持招聘会和开放日等活动
    practitioner: |
      您可以：
      - 为稀缺的数字和数据岗位建立人才储备和人才社群
      - 与用人团队共同塑造雇主价值主张
      - 利用薪酬和供给方面的市场数据就难以填补的岗位提供建议
      - 开发学徒计划和毕业生项目等早期职业路径
    expert: |
      您可以：
      - 制定组织的人才吸引战略和雇主品牌
      - 与大学和其他雇主等合作伙伴合作扩大人才供给
      - 领导关于溢价薪酬、使用中介机构和其他寻访模式的决策
hr-workforce-planning:
  name: 人力规划
  description: 预测组织所需的人力，将其与现有人力进行比较，并规划如何通过招聘、培养、重新设计和留用来弥补差距。
  levels:
    awareness: |
      您可以：
      - 解释为什么人力规划对安全、可持续的服务很重要
      - 提供准确的编制和空缺信息
    working: |
      您可以：
      - 从经理处收集并核对人力规划数据
      - 对人员流失和空缺趋势等简单情景进行建模
    practitioner: |
      您可以：
      - 领导一个总监部的人力规划，并将其与服务和财务计划相衔接
      - 识别技能差距并建议弥补方法
      - 规划新岗位、职业路径和技能组合
    expert: |
      您可以：
      - 制定组织的人力战略和长期规划
      - 与财务和服务负责人一起在各项服务之间作出人力取舍
      - 与医疗卫生和照护体系的合作伙伴共同制定人力规划
hr-workforce-information:
  name: 人力信息与人力资源系统
  description: 管理人力资源和人力系统及数据，并将人力数据转化为报告和洞察，例如流失率、缺勤、空缺、多元化和薪酬差距分析。
  levels:
    awareness: |
      您可以：
      - 在人力资源系统中准确录入人力数据
      - 解释为什么人力数据必须准确并予以保密
    working: |
      您可以：
      - 运行标准人力报告并检查其中的错误
      - 回答关于人力的常规信息请求
    practitioner: |
      您可以：
      - 分析人力数据以发现趋势并向经理解释
      - 为人力指标设计仪表板和报告
      - 编制法定报告和平等报告，例如薪酬差距分析
    expert: |
      您可以：
      - 制定组织的人力信息战略和数据标准
      - 领导人力资源系统的选择和开发
      - 利用人力洞察为董事会决策提供依据
hr-reward-and-job-evaluation:
  name: 薪酬与岗位评估
  description: 应用薪酬和奖励规则，并按照岗位评估方案一致地评估岗位，将其归入正确的职级。
  levels:
    awareness: |
      您可以：
      - 解释薪酬职级、薪级递增和津贴如何运作
      - 解释岗位是通过岗位评估而不是按任职者来确定职级的
    working: |
      您可以：
      - 应用起薪、薪酬保护和津贴等薪酬规则
      - 在提交评估前检查职位说明是否完整
      - 作为受过培训的成员参加岗位评估小组
    practitioner: |
      您可以：
      - 主持岗位评估小组和一致性检查
      - 就新岗位和变动岗位的职级提供建议，包括数字和数据岗位
      - 利用市场证据就招聘和留用溢价提供建议
    expert: |
      您可以：
      - 在商定的薪酬框架内制定组织的薪酬战略
      - 为全组织岗位评估的公正性提供保证
      - 领导同工同酬审查并根据其发现采取行动
hr-learning-design-and-delivery:
  name: 学习设计与实施
  description: 分析学习需求，然后以面授、在线和在工作中学习的方式设计、实施和评估学习。
  levels:
    awareness: |
      您可以：
      - 解释培训、学习和发展之间的区别
      - 支持课程的举办并保存培训记录
    working: |
      您可以：
      - 以面授和在线方式开展界定清晰的培训课程
      - 在学习管理系统中制作简单的在线学习课程
      - 收集并总结学员反馈
    practitioner: |
      您可以：
      - 分析学习需求并设计满足需求的混合式项目
      - 设定学习成果并评估影响，而不仅仅是满意度
      - 让所有员工都能无障碍、包容地学习
    expert: |
      您可以：
      - 制定组织的学习战略和标准
      - 领导学习项目、学习技术及其资金
      - 展示组织在学习方面投资的回报
hr-skills-frameworks-and-career-pathways:
  name: 技能框架与职业路径
  description: 使用本参考资料、UK GDaD PCF 和 ESCO 等技能和角色框架来描述岗位、评估技能差距并建立职业路径。
  levels:
    awareness: |
      您可以：
      - 解释什么是技能框架以及它如何描述角色和级别
      - 在框架中找到某个岗位的角色档案和技能
    working: |
      您可以：
      - 将职位说明与框架中的角色、级别和技能相对应
      - 支持员工和经理进行技能自评
      - 保持职业路径信息为最新
    practitioner: |
      您可以：
      - 为团队或专业开展技能差距分析并报告结果
      - 利用框架级别设计职业路径和发展路线
      - 利用框架技能编写一致的职位说明和评估
    expert: |
      您可以：
      - 确定组织如何在各专业中使用技能框架
      - 利用技能数据为人力、学习和薪酬战略提供依据
      - 与其他组织一起参与共享框架的开发
hr-organisational-development:
  name: 组织发展
  description: 通过基于证据的文化、领导力、敬业度、团队效能和身心健康干预措施，改进组织的运作方式。
  levels:
    awareness: |
      您可以：
      - 解释文化、领导力和敬业度如何影响员工和患者照护
      - 协助开展员工调查和倾听活动
    working: |
      您可以：
      - 使用标准工具主持团队会议和研讨会
      - 分析团队的员工调查结果并提出行动建议
    practitioner: |
      您可以：
      - 诊断组织问题并设计应对的干预措施
      - 领导团队发展、领导力发展和敬业度项目
      - 利用证据评估干预措施的效果
    expert: |
      您可以：
      - 制定组织发展战略和文化项目
      - 辅导高管并领导大规模的文化变革
      - 将文化和敬业度指标与照护质量和绩效联系起来
hr-organisational-change:
  name: 组织变革与协商
  description: 依据政策和劳动法，规划和管理对结构、岗位和工作模式的变更，包括正式协商、调岗安置和裁员。
  levels:
    awareness: |
      您可以：
      - 解释组织变革流程的主要阶段
      - 支持变革的行政工作，例如协商信函和会议
    working: |
      您可以：
      - 支持经理准备协商文件和员工情况通报
      - 在协商期间跟踪反馈和行动
      - 在调岗安置和甄选过程中支持员工
    practitioner: |
      您可以：
      - 领导一个总监部的组织变革，从商业论证到实施
      - 与员工及其代表协商并回应其反馈
      - 管理变革的法律风险和平等风险
    expert: |
      您可以：
      - 领导全组织范围的重组和服务转移
      - 设计组织的变革方法，包括伙伴合作
      - 就重大变革对人员的影响和风险向董事会提供建议
hr-people-strategy:
  name: 人才战略与人力资源领导
  description: 制定组织的人才战略，领导人力资源职能，并就文化、人力和雇佣风险向董事会提供建议。
  levels:
    awareness: |
      您可以：
      - 解释组织的人才战略以及您的工作如何支持它
    working: |
      您可以：
      - 为一项服务的人员计划作出贡献，并提出明确的行动和指标
      - 报告人员计划的进展
    practitioner: |
      您可以：
      - 按照人才战略为一个总监部编写并领导人员计划
      - 就人员风险和优先事项向高级负责人提供建议
      - 领导人力资源职能的一部分，制定其标准和优先事项
    expert: |
      您可以：
      - 制定组织的人才战略并领导人力资源职能
      - 就文化、人力和雇佣风险向董事会提供建议
      - 在人员事务上代表组织与合作伙伴和监管机构沟通
