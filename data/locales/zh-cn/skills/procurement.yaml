# Simplified Chinese translations of data/skills/procurement.yaml. Keys are the English skill ids.
proc-purchase-to-pay:
  name: 采购到付款
  description: 通过组织的采购系统和财务控制，提交、审批和确认收货订单，并解决发票和付款问题。
  levels:
    awareness: |
      您可以：
      - 解释"无采购订单不付款"规则及其重要性
      - 在采购系统中提交请购单
    working: |
      您可以：
      - 创建和修改采购订单，并对照合同进行检查
      - 与供应商和财务部门解决发票、收货确认和付款问题
      - 在采购系统中维护目录和供应商记录
    practitioner: |
      您可以：
      - 为一项服务运行采购到付款流程，监控合规情况和积压事项
      - 分析支出数据，发现合同外支出和节约机会
      - 与财务同事一起改进流程和控制措施
    expert: |
      您可以：
      - 制定组织的采购到付款政策、控制措施和系统
      - 领导向全面电子化采购和开票的转变
proc-procurement-process:
  name: 采购流程
  description: 开展合规的采购，从规划和需求说明，到采购途径、招标、授予和签订合同，包括通过框架协议和动态采购系统购买。
  levels:
    awareness: |
      您可以：
      - 解释采购的各个阶段以及适用的门槛
      - 按组织规则为低价值采购获取报价
    working: |
      您可以：
      - 使用标准模板开展询价和框架协议下的订购
      - 准备招标文件并在电子招标系统中管理澄清问题
      - 为每项采购保留清晰的审计线索
    practitioner: |
      您可以：
      - 规划并领导复杂的招标，选择正确的采购途径和程序
      - 帮助用户为数字和临床系统编写基于成果的需求说明
      - 在合同授予前管理时间表、风险和利益相关方
    expert: |
      您可以：
      - 制定组织的采购程序和模板
      - 领导最复杂、价值最高或最新颖的采购
      - 为董事会的采购决策提供保证
proc-tender-evaluation:
  name: 投标评审
  description: 设计评审标准和权重，对质量、价格和社会价值开展公平且记录完善的评审。
  levels:
    awareness: |
      您可以：
      - 解释为什么评审必须遵循已公布的标准
      - 在参与评审前申报利益冲突
    working: |
      您可以：
      - 检查投标文件的合规性和完整性
      - 支持评审人员，记录评分和统一意见的过程
      - 在指导下准备价格评审模型
    practitioner: |
      您可以：
      - 设计评审标准、权重和评分指引
      - 主持统一评分，撰写授予报告并向投标人反馈
      - 为系统招标规划演示以及临床或用户场景测试
    expert: |
      您可以：
      - 制定组织的评审标准以及价格与质量的权衡方法
      - 在评审决定受到质疑时为其辩护
      - 审查高风险采购的评审
proc-procurement-law-and-policy:
  name: 公共采购规则与政策
  description: 应用公共采购规则、组织的财务规则和采购政策，使采购合法、透明、公平。
  levels:
    awareness: |
      您可以：
      - 解释公共资金必须公平、公开、合法地使用
      - 遵守组织的门槛和审批规则
    working: |
      您可以：
      - 为简单的采购适用合适的采购规则
      - 发布公告并保存符合透明度规则的记录
      - 发现请求何时可能违反规则并提出
    practitioner: |
      您可以：
      - 就复杂采购和合同变更的合法途径提供建议
      - 管理被质疑的风险，正确处理停顿期和未中标反馈
      - 为组织编写采购政策和指引
    expert: |
      您可以：
      - 解读新的采购规则并领导组织的应对
      - 就采购合规和风险向董事会提供建议
      - 与法律顾问一起处理正式质疑
proc-market-analysis:
  name: 市场分析与沟通
  description: 了解供应市场，在采购前与供应商沟通，并利用市场证据塑造需求、采购途径和商业模式。
  levels:
    awareness: |
      您可以：
      - 在框架协议和供应商数据库中查找供应商
      - 解释为什么早期市场沟通必须对所有供应商公平
    working: |
      您可以：
      - 为某项需求收集市场信息、价格和供应商详情
      - 开展信息征询并总结回复
    practitioner: |
      您可以：
      - 分析供应市场及其竞争、风险和趋势
      - 在不扭曲竞争的前提下领导供应商日等早期市场沟通
      - 利用市场证据塑造需求和商业模式
    expert: |
      您可以：
      - 塑造市场，例如鼓励新供应商或小型供应商参与
      - 与其他采购组织一起领导市场战略
proc-negotiation:
  name: 商务谈判
  description: 规划并开展与供应商的谈判，商定能实现物有所值并管控风险的价格、条款和绩效。
  levels:
    awareness: |
      您可以：
      - 解释在公共采购中哪些内容可以谈判、哪些不可以
    working: |
      您可以：
      - 就低价值或常规采购谈判价格和条款
      - 为他人主导的谈判准备数据和方案
    practitioner: |
      您可以：
      - 规划并主导谈判，设定目标、底线和备选立场
      - 谈判合同变更、续约和争议和解
      - 确保谈判合法并记录完善
    expert: |
      您可以：
      - 主导与战略供应商之间高价值、高风险的谈判
      - 辅导他人谈判，并制定组织的谈判方法
proc-category-management:
  name: 品类管理
  description: 通过整合需求、塑造需求并规划多年采购的品类战略，管理软件、云和技术服务等支出品类。
  levels:
    awareness: |
      您可以：
      - 解释什么是品类以及品类计划为什么重要
    working: |
      您可以：
      - 分析某一品类的支出和合同，并及时更新合同登记册
      - 支持品类计划，例如跟踪续约和节约
    practitioner: |
      您可以：
      - 与预算持有人和技术负责人一起编写并实施品类战略
      - 规划该品类的采购和合同续约安排
      - 跟踪该品类的节约、价值和风险
    expert: |
      您可以：
      - 制定组织的品类管理方法
      - 领导支出和风险最高的品类，并使其与组织战略保持一致
      - 与其他组织合作开展联合采购
proc-technology-procurement:
  name: 技术与云采购
  description: 采购软件、云服务、许可、硬件和数字服务，包括软件即服务、商业模式、许可方式，以及健康技术所需的安全、数据保护和互操作性条款。
  levels:
    awareness: |
      您可以：
      - 解释技术采购的主要方式，例如许可、订阅和服务
      - 认识到临床系统需要进行安全、临床安全和数据保护核查
    working: |
      您可以：
      - 通过框架协议采购标准软件、硬件和许可
      - 跟踪许可数量、续约和许可核对日期
      - 在文件中纳入标准的安全和数据保护要求
    practitioner: |
      您可以：
      - 采购云服务、软件即服务和临床系统，选择合适的商业模式
      - 与技术、临床安全和信息治理负责人一起制定需求
      - 在合同中纳入互操作性、开放标准、数据所有权和退出条款
      - 通过为可迁移性和续约时的竞争做好规划来避免供应商锁定
    expert: |
      您可以：
      - 制定组织的技术和云商业战略
      - 主导企业协议和战略平台的谈判
      - 就技术选择的商业风险向数字负责人提供建议
proc-contract-management:
  name: 合同管理
  description: 在授予后管理合同，包括启动、绩效、付款、变更、争议、续约和退出，使组织得到其所付费的服务。
  levels:
    awareness: |
      您可以：
      - 找到一份合同并解释其关键日期、金额和负责人
      - 在合同登记册中记录合同变更和文件
    working: |
      您可以：
      - 对照服务水平和关键绩效指标监控供应商绩效
      - 准备合同审查会议并跟踪行动
      - 处理合同变更，并对照合同检查发票
    practitioner: |
      您可以：
      - 管理一批合同，包括临床和技术合同
      - 在绩效不达标时运用服务抵扣等合同救济措施
      - 在采购规则范围内管理变更、争议和续约
      - 及早规划退出，并在合同结束前测试退出计划
    expert: |
      您可以：
      - 制定组织的合同管理框架和标准
      - 领导战略性、高风险合同的管理
      - 解决重大争议，并决定终止或重新采购
proc-supplier-relationship-management:
  name: 供应商关系管理
  description: 与关键供应商建立战略关系，以管理风险、改善绩效，并持续发展产品和服务。
  levels:
    awareness: |
      您可以：
      - 解释为什么良好的供应商关系对患者所依赖的服务很重要
      - 以专业方式与供应商打交道并记录联系情况
    working: |
      您可以：
      - 保持供应商联系人、上报途径和记录为最新
      - 对照要求检查供应商的财务状况和保险
    practitioner: |
      您可以：
      - 按风险和价值对供应商分类，并规划如何管理各类供应商
      - 与关键供应商开展战略审查，包括路线图和改进计划
      - 管理供应商风险，例如财务失败、网络安全事件和供应链问题
    expert: |
      您可以：
      - 制定组织的供应商关系战略
      - 领导与战略供应商的高层关系
      - 在关键供应商出现故障时领导应对
proc-exit-planning:
  name: 退出规划与数据返还
  description: 规划和管理合同的结束，包括向新供应商过渡、返还和删除数据，以及保障患者和员工服务的连续性。
  levels:
    awareness: |
      您可以：
      - 解释为什么每份合同都需要退出计划
      - 找到合同中的退出和数据返还条款
    working: |
      您可以：
      - 保持退出计划以及资产和数据登记册为最新
      - 跟踪通知期和退出里程碑
    practitioner: |
      您可以：
      - 与技术、数据和临床负责人一起编写退出和过渡计划
      - 确保数据以可用的标准格式返还，然后被安全删除
      - 管理过渡风险，使照护不受干扰
    expert: |
      您可以：
      - 制定组织关于退出、过渡和数据返还的标准
      - 领导从战略性临床和技术合同中的退出
proc-social-value:
  name: 社会价值与可持续采购
  description: 利用采购和合同实现社会价值、环境可持续性和公平的供应链，并衡量供应商的交付成果。
  levels:
    awareness: |
      您可以：
      - 解释社会价值和可持续采购对组织的意义
    working: |
      您可以：
      - 在招标中纳入标准的社会价值和可持续性问题
      - 收集供应商的社会价值报告
    practitioner: |
      您可以：
      - 制定适合合同的社会价值和可持续性标准
      - 管理供应商的承诺，例如本地就业、技能和减碳
      - 检查供应链中强迫劳动和其他侵犯人权行为等风险
    expert: |
      您可以：
      - 制定组织的社会价值和可持续采购政策
      - 向董事会报告社会价值和碳排放成果
