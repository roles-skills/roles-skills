# Simplified Chinese translations of data/skills/shared.yaml. Keys are the English skill ids.
health-care-context:
  name: 了解医疗卫生和照护服务
  description: 了解医疗卫生和照护服务的组织与提供方式、临床医生和照护人员的工作方式，以及数字服务如何支持患者照护。
  levels:
    awareness: |
      您可以：
      - 描述医疗卫生和照护体系的主要组成部分以及组织所支持的服务
      - 解释为什么患者安全和保密在您的工作中很重要
    working: |
      您可以：
      - 解释您的工作所支持的临床和照护工作流程
      - 与临床和照护同事正确使用常见的医疗卫生术语
      - 识别某项变更何时可能影响患者照护并提出来
    practitioner: |
      您可以：
      - 分析一项服务如何融入跨组织的照护路径
      - 与临床医生、照护人员和患者合作塑造数字服务
      - 解释数字决策对照护、安全和员工工作量的影响
    expert: |
      您可以：
      - 凭借对医疗卫生和照护体系的深刻理解塑造组织战略
      - 代表组织与医疗卫生和照护领域的合作伙伴及负责人沟通
      - 预判政策和服务变化将如何影响数字服务和照护
clinical-safety:
  name: 临床风险管理
  description: 通过临床风险管理流程、危害日志和安全案例（例如遵循 ISO 14971 和 IEC 80001-1），识别、评估和控制医疗信息系统可能给患者带来的风险。
  levels:
    awareness: |
      您可以：
      - 解释医疗信息系统可能如何伤害患者，例如通过错误、缺失或延迟的信息
      - 通过正确途径报告可能的临床安全问题
    working: |
      您可以：
      - 参加危害研讨会并为危害日志作出贡献
      - 在您的工作中遵循临床风险管理流程
      - 为临床安全案例提供证据，例如测试结果
    practitioner: |
      您可以：
      - 领导产品或变更的危害识别和风险评估
      - 编写和维护危害日志及临床安全案例报告
      - 与产品团队商定风险控制措施并检查其有效性
      - 就如何应用临床风险管理标准向团队提供建议
    expert: |
      您可以：
      - 负责组织的临床风险管理体系
      - 制定临床安全政策并为重大系统的安全案例提供保证
      - 领导对涉及医疗信息系统的严重安全事件的应对
      - 在数字团队中建立临床安全文化
health-data-interoperability:
  name: 健康数据互操作性
  description: 使用 HL7 FHIR、HL7 第 2 版、IHE 规范和标准 API 等开放标准，在系统之间安全、一致地交换医疗卫生和照护数据。
  levels:
    awareness: |
      您可以：
      - 解释为什么互操作性对协同照护很重要
      - 说出主要的健康数据交换标准，例如 HL7 FHIR
    working: |
      您可以：
      - 阅读和使用 FHIR 资源、规范和 API
      - 在指导下构建或测试简单的集成
      - 依据规范检查消息
    practitioner: |
      您可以：
      - 使用 FHIR、HL7 第 2 版和消息模式设计和构建集成
      - 编写 FHIR 资源和实施指南并为其制定规范
      - 解决系统之间复杂的映射和数据质量问题
    expert: |
      您可以：
      - 为组织制定互操作性标准和战略
      - 领导国家级或跨组织的标准工作
      - 为跨多个系统的关键集成设计提供保证
clinical-terminology:
  name: 临床术语与分类
  description: 使用 SNOMED CT、ICD 和 LOINC 等临床术语和分类，一致地记录和交换临床含义。
  levels:
    awareness: |
      您可以：
      - 解释临床术语与分类之间的区别
      - 识别 SNOMED CT 和 ICD 等常见术语
    working: |
      您可以：
      - 为数据项或表单查找并使用正确的代码
      - 使用术语浏览器和参考集
    practitioner: |
      您可以：
      - 使用临床术语设计数据模型和参考集
      - 在术语和分类之间进行映射，并解释映射的局限
      - 就产品和分析中的术语使用向团队提供建议
    expert: |
      您可以：
      - 为组织制定术语政策
      - 领导术语的发布、治理和质量保证
      - 在术语标准机构中代表组织
information-governance:
  name: 信息治理与数据保护
  description: 依法、安全且符合伦理地处理个人信息和健康信息，包括数据保护法、保密、同意、数据保护影响评估和信息共享。
  levels:
    awareness: |
      您可以：
      - 遵循组织处理个人信息和健康信息的规则
      - 识别并报告数据泄露或未遂事件
    working: |
      您可以：
      - 在工作中应用数据保护原则
      - 为数据保护影响评估作出贡献
      - 正确处理信息请求和记录
    practitioner: |
      您可以：
      - 领导数据保护影响评估和信息共享协议
      - 就合法依据、同意、保密和保存向团队提供建议
      - 调查事件并提出改进建议
    expert: |
      您可以：
      - 制定信息治理政策和战略
      - 就信息风险和合规向董事会提供建议
      - 代表组织与监管机构和合作伙伴沟通
medical-device-regulation:
  name: 医疗器械软件监管
  description: 了解软件何时属于医疗器械，以及适用于它的标准和流程，例如 IEC 62304 和 ISO 13485。
  levels:
    awareness: |
      您可以：
      - 解释一些健康软件作为医疗器械受到监管
      - 知道当某个产品可能属于医疗器械时应向谁咨询
    working: |
      您可以：
      - 遵循符合医疗器械标准的软件生命周期流程
      - 编制此类流程所要求的记录
    practitioner: |
      您可以：
      - 评估某个产品是否属于医疗器械及其可能的类别
      - 与质量和临床同事一起规划产品的监管工作
    expert: |
      您可以：
      - 制定组织对受监管软件的方法
      - 领导与监管机构和公告机构的沟通
people-management:
  name: 人员管理
  description: 领导、培养和支持员工，包括招聘、目标、考评、身心健康、出勤，以及公平地管理绩效和行为。
  levels:
    awareness: |
      您可以：
      - 解释影响您的组织人事政策
      - 支持新同事并分享知识
    working: |
      您可以：
      - 督导日常工作并给予反馈
      - 参与招聘和入职引导
      - 定期进行一对一谈话
    practitioner: |
      您可以：
      - 直线管理一个团队，设定目标并开展考评
      - 关注身心健康，管理出勤、绩效和行为
      - 规划团队的发展和继任
    expert: |
      您可以：
      - 领导经理并塑造大领域的文化
      - 设计人力规划和组织变革
      - 辅导负责人并解决复杂的人员问题
equality-diversity-inclusion:
  name: 平等、多元与包容
  description: 公平对待他人，尊重差异，设计包容所有人的服务和工作场所。
  levels:
    awareness: |
      您可以：
      - 有尊严、有礼貌地对待同事、患者和公众
      - 遵循平等与包容政策
    working: |
      您可以：
      - 识别并制止排斥他人的行为
      - 在规划工作时考虑不同的需求
    practitioner: |
      您可以：
      - 开展平等影响评估
      - 建设包容的团队和做法
    expert: |
      您可以：
      - 制定包容战略并督促组织对其负责
      - 领导平等、多元与包容方面的文化变革
health-safety-wellbeing:
  name: 健康、安全与身心健康
  description: 保障自己和他人在工作中的安全与健康，包括风险评估、安全工作做法和事件报告。
  levels:
    awareness: |
      您可以：
      - 遵守健康与安全规定，报告危险和事件
    working: |
      您可以：
      - 开展简单的风险评估，例如工位评估
      - 帮助同事安全工作
    practitioner: |
      您可以：
      - 管理一个团队或场所的健康与安全
      - 调查事件并落实控制措施
    expert: |
      您可以：
      - 为组织制定健康、安全与身心健康政策
      - 向董事会报告安全绩效
budget-management:
  name: 预算管理
  description: 规划、监控和控制预算，包括预测、管理差异和遵守财务规则。
  levels:
    awareness: |
      您可以：
      - 遵守支出和订购规则
      - 解释您的工作如何获得资金
    working: |
      您可以：
      - 对照小额预算跟踪支出并提出差异
      - 在您的权限内批准支出
    practitioner: |
      您可以：
      - 持有并管理预算，进行预测并解释差异
      - 编制包含成本和效益的商业论证
    expert: |
      您可以：
      - 管理大额或多项预算并制定财务计划
      - 在各项服务之间作出资金取舍
project-management:
  name: 项目管理
  description: 使用 PRINCE2、PM² 或敏捷方法等公认方法，按商定的范围、时间、成本和质量规划、交付和收尾项目。
  levels:
    awareness: |
      您可以：
      - 解释项目的各个阶段及其中的主要角色
      - 保存行动日志等项目记录
    working: |
      您可以：
      - 维护计划、风险和问题日志以及报告
      - 主持项目会议并跟踪行动
      - 在支持下管理一个规模小、界定清晰的项目
    practitioner: |
      您可以：
      - 从启动到收尾管理项目，控制范围、时间、成本和质量
      - 管理风险、问题、依赖关系和变更控制
      - 向项目委员会汇报并管理供应商
    expert: |
      您可以：
      - 管理大型、复杂或高风险的项目
      - 制定项目管理标准并辅导项目经理
      - 挽救陷入困境的项目
risk-management:
  name: 组织风险管理
  description: 使用风险登记册和明确的风险偏好，识别、评估、记录和管理影响组织目标的风险。
  levels:
    awareness: |
      您可以：
      - 解释什么是风险以及如何提出风险
    working: |
      您可以：
      - 记录并更新本领域的风险
      - 建议控制措施并跟踪行动
    practitioner: |
      您可以：
      - 为一个总监部或项目群运行风险流程
      - 依据风险偏好评估风险并逐级上报
      - 向委员会报告风险
    expert: |
      您可以：
      - 设计组织的风险管理框架和风险偏好
      - 就战略风险向董事会提供建议
security-operations:
  name: 安全运营
  description: 使用 SIEM 和终端检测等工具监控系统的安全威胁，对警报进行分诊，调查事件，并应对网络安全事件。
  levels:
    awareness: |
      您可以：
      - 解释网络钓鱼和勒索软件等常见网络威胁
      - 报告疑似安全事件
    working: |
      您可以：
      - 监控警报并使用操作手册进行分诊
      - 收集证据并逐级上报事件
      - 在指导下调整简单的检测规则
    practitioner: |
      您可以：
      - 调查并遏制安全事件
      - 编写检测规则并开展威胁狩猎
      - 在事件后改进操作手册和工具
    expert: |
      您可以：
      - 领导安全运营服务及其战略
      - 领导对重大网络安全事件的应对
      - 与国家安全机构和合作伙伴合作
vulnerability-management:
  name: 漏洞管理
  description: 发现、评估、排序和修复技术漏洞，包括扫描、渗透测试和打补丁。
  levels:
    awareness: |
      您可以：
      - 解释为什么及时打补丁和安全配置很重要
    working: |
      您可以：
      - 运行漏洞扫描并报告结果
      - 与系统负责人一起跟踪修复情况
    practitioner: |
      您可以：
      - 按风险对漏洞排序，包括对患者服务的风险
      - 界定并管理渗透测试和整改
    expert: |
      您可以：
      - 制定漏洞管理政策及其目标
      - 向高级负责人报告技术安全风险
identity-and-access-management:
  name: 身份与访问管理
  description: 管理员工、患者和系统的数字身份、身份验证和访问权限，包括基于角色的访问以及智能卡或多因素身份验证。
  levels:
    awareness: |
      您可以：
      - 遵守访问规则并保护您的凭据
    working: |
      您可以：
      - 创建、更改和删除用户账户及访问权限
      - 依据基于角色的访问规则检查访问权限
    practitioner: |
      您可以：
      - 设计并运行身份与访问服务
      - 定期审查访问权限并解决问题
    expert: |
      您可以：
      - 制定面向员工、患者和系统的身份与访问战略
      - 领导新身份标准的采用
data-quality:
  name: 数据质量管理
  description: 定义、衡量和改进数据质量，包括完整性、准确性、及时性和有效性。
  levels:
    awareness: |
      您可以：
      - 解释为什么准确的健康数据对照护和规划很重要
      - 准确记录数据并报告错误
    working: |
      您可以：
      - 运行数据质量检查并纠正错误
      - 向同事解释数据质量报告
    practitioner: |
      您可以：
      - 定义数据质量规则和衡量指标
      - 与数据提供方合作，从根本上解决质量问题
    expert: |
      您可以：
      - 为组织及其合作伙伴制定数据质量标准
      - 领导数据质量改进项目
health-records-management:
  name: 健康档案管理
  description: 在整个生命周期内管理医疗卫生和照护档案，包括创建、归档、跟踪、访问、保存和处置。
  levels:
    awareness: |
      您可以：
      - 正确归档、查找和跟踪档案
      - 保护档案免于丢失或未经授权的访问
    working: |
      您可以：
      - 处理档案访问请求
      - 执行保存期限表和档案记录标准
    practitioner: |
      您可以：
      - 管理档案服务及其流程
      - 审核档案记录工作并培训员工
    expert: |
      您可以：
      - 制定档案管理政策和战略
      - 领导从纸质档案向数字档案的转变
clinical-coding:
  name: 临床编码
  description: 遵循国家和国际编码规则，将健康档案中的临床信息转换为标准分类代码，用于照护、支付和统计。
  levels:
    awareness: |
      您可以：
      - 解释什么是临床编码以及它为什么重要
      - 使用基本的医学术语和解剖学知识
    working: |
      您可以：
      - 运用分类规则准确编码简单的诊疗事件
      - 就不清楚的档案向临床医生提出疑问
    practitioner: |
      您可以：
      - 编码跨专科的复杂诊疗事件
      - 审核编码质量并培训编码员
    expert: |
      您可以：
      - 领导编码服务及其质量项目
      - 就编码标准及其对数据和资金的影响提供建议
clinical-leadership-in-digital:
  name: 数字领域的临床领导力
  description: 将临床知识和公信力带入数字服务的设计、采用和安全使用，并带领临床医生完成数字化变革。
  levels:
    awareness: |
      您可以：
      - 解释数字服务如何改变临床实践
    working: |
      您可以：
      - 就工作流程和安全向产品团队提供临床意见
      - 帮助临床同事采用新系统
    practitioner: |
      您可以：
      - 领导产品或项目群的临床参与
      - 将临床需求和证据转化为需求
      - 在临床同行中倡导安全采用
    expert: |
      您可以：
      - 为组织的数字服务确定临床方向
      - 带领跨组织的临床负责人完成数字化变革
      - 就数字投资的临床风险和效益向董事会提供建议
governance-and-compliance:
  name: 公司治理与合规
  description: 支持组织的治理，包括董事会、委员会、议事规则、政策、利益申报，以及遵守法律和监管义务。
  levels:
    awareness: |
      您可以：
      - 遵循组织的政策和决策规则
    working: |
      您可以：
      - 为委员会会议、文件和会议记录提供支持
      - 及时更新治理登记册
    practitioner: |
      您可以：
      - 为董事会和委员会运行治理周期
      - 审查政策并就合规提供建议
    expert: |
      您可以：
      - 设计治理框架并向董事会提供建议
      - 领导年度治理报告和保证工作
