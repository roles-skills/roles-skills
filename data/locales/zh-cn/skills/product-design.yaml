# Simplified Chinese translations of data/skills/product-design.yaml. Keys are the English skill ids.
pd-health-research-ethics:
  name: 与患者和照护人员开展符合伦理的研究
  description: 安全且符合伦理地规划和开展与患者、照护者、临床医生和照护人员的研究，包括知情同意、保护、与处境脆弱者开展研究，以及了解何时需要正式的伦理审批。
  levels:
    awareness: |
      您可以：
      - 解释为什么与患者和照护人员开展研究需要知情同意、保护措施并谨慎处理个人数据
      - 在研究活动中遵循团队的同意、保护和数据处理流程
    working: |
      您可以：
      - 规划能够获得知情同意并保护参与者身心健康和隐私的研究活动
      - 为身体不适、情绪困扰或处境脆弱的人调整研究活动，并知道何时停止
      - 识别并报告研究中出现的保护问题
    practitioner: |
      您可以：
      - 判断研究何时需要正式的伦理或研究治理审批，并准备所需材料
      - 规划与儿童、痴呆症患者和处于危机中的人等处境脆弱者开展的安全研究
      - 与临床负责人和照护人员合作，在不干扰照护的情况下在临床环境中规划研究
      - 支持研究人员在经历令人痛苦的研究活动后照顾好自己的身心健康
    expert: |
      您可以：
      - 制定组织与患者、照护者和照护人员开展符合伦理研究的标准
      - 为各团队的研究实践提供保证，并就高风险研究提供建议
      - 向伦理、保护和治理机构代表研究实践
pd-safety-critical-design:
  name: 面向临床安全和人因的设计
  description: 通过应用人因原则并配合临床风险管理流程，设计帮助临床医生、照护人员和患者安全行事的服务、界面和工作流程。
  levels:
    awareness: |
      您可以：
      - 解释设计选择可能如何导致或防止照护中的差错，例如患者识别错误或剂量错误
      - 使用组织针对安全关键信息的模式，例如患者身份横幅和过敏警示
    working: |
      您可以：
      - 设计让安全操作成为便捷操作的界面，例如减少含义不清的标签和不必要的警报
      - 在包括打断和时间压力在内的真实临床场景中测试设计
      - 向临床安全官提出与设计相关的危害，并记录设计如何控制这些危害
    practitioner: |
      您可以：
      - 将任务分析和使用差错分析等人因方法应用于复杂的临床工作流程
      - 在整个服务范围内进行设计，以减少警报疲劳和认知负荷
      - 为临床安全案例提供设计证据，为受监管软件提供可用性证据
    expert: |
      您可以：
      - 制定组织的安全关键设计标准和模式
      - 领导风险最高的临床服务的人因工作
      - 就整个项目组合中与设计相关的风险向临床安全和产品负责人提供建议
pd-health-content:
  name: 健康信息内容
  description: 创建准确、经过临床把关、且便于不同健康素养水平的人理解和采取行动的健康和照护内容。
  levels:
    awareness: |
      您可以：
      - 解释为什么健康信息必须准确、及时且易于理解
      - 遵循团队的健康内容风格指南和临床审核流程
    working: |
      您可以：
      - 编写健康素养较低的人也能理解并据此行动的健康内容，例如症状以及何时寻求帮助
      - 与临床审核人员合作，在不损失清晰度的前提下检查内容是否准确
      - 用通俗易懂的语言解释医学术语，并对疾病、检查和治疗使用一致的名称
    practitioner: |
      您可以：
      - 为紧急症状、药物和临终关怀等敏感和高风险主题设计内容
      - 为一整套健康内容建立临床把关、审核日期和证据来源
      - 在有争议的内容中平衡临床精确性、法律要求和用户理解
    expert: |
      您可以：
      - 制定组织的健康信息内容及其临床把关标准
      - 领导跨服务和渠道的健康信息内容战略
      - 就健康信息风险向高级临床和传播负责人提供建议
