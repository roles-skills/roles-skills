# Simplified Chinese translations of data/skills/legal.yaml. Keys are the English skill ids.
legal-legal-research:
  name: 法律研究
  description: 查找、阅读和总结法律法规、判例法、指引和先例，以回答法律问题。
  levels:
    awareness: |
      您可以：
      - 使用法律数据库和组织的知识库查找法律法规、指引和先例文件
      - 正确使用法律术语
    working: |
      您可以：
      - 研究一个界定清晰的法律问题，并清楚地总结来源
      - 检查来源是否现行有效且具有权威性
      - 及时更新先例和知识库
    practitioner: |
      您可以：
      - 研究复杂或新颖的问题，例如现行法律如何适用于新技术
      - 分析相互矛盾的来源并得出有理有据的观点
      - 跟踪法律和指引的变化并解释其对组织的影响
    expert: |
      您可以：
      - 领导对组织最复杂、风险最高问题的研究
      - 预判法律发展并为组织做好准备
      - 参与影响数字健康和照护的法律和指引的征求意见
legal-contract-drafting-and-review:
  name: 合同起草与审查
  description: 起草、审查和谈判合同与协议，例如技术、软件许可、云服务、服务和数据处理协议。
  levels:
    awareness: |
      您可以：
      - 解释合同的主要组成部分，例如当事方、期限、付款、责任和终止
      - 根据经批准的模板准备标准文件
    working: |
      您可以：
      - 对照组织的标准审查保密协议和简单服务协议等常规协议
      - 对合同进行修订标注并解释所作修改
      - 发现需要律师审查的条款，例如无限责任或自动续约
    practitioner: |
      您可以：
      - 起草和谈判复杂的协议，例如软件许可、云托管、系统集成和数据处理协议
      - 就风险分配提供建议，包括责任上限、服务水平、退出和源代码托管
      - 确保合同保护患者数据、服务连续性以及组织对其软件和数据的权利
      - 编写和维护合同模板及谈判手册
    expert: |
      您可以：
      - 制定组织的合同标准和风险立场
      - 领导对价值最高或风险最高协议的谈判
      - 就合作关系和合资企业等战略性商业安排向高级负责人提供建议
legal-legal-advice:
  name: 法律意见
  description: 提供清晰、实用、准确的法律意见，帮助同事作出合法决策并管理法律风险。
  levels:
    awareness: |
      您可以：
      - 解释同事何时需要法律意见以及如何获得
      - 接收清晰的委托并记录事项事实
    working: |
      您可以：
      - 就常规事项起草法律意见供律师审核
      - 使用经批准的指引回答简单问题
      - 从一组事实中识别法律问题
    practitioner: |
      您可以：
      - 在您的执业领域提供独立的法律意见
      - 用通俗易懂的语言解释法律风险并推荐切实可行的方案
      - 就具有法律效力的决定提供建议，例如合同授予、数据共享和服务变更
      - 决定何时委托外部律师或大律师
    expert: |
      您可以：
      - 就组织最重大的法律风险向董事会和执行层提供建议
      - 对新颖、有争议或高价值的事项提供权威意见
      - 确定组织对法律风险的容忍度
      - 为全组织的法律意见（包括外部意见）的质量提供保证
legal-litigation-and-disputes:
  name: 诉讼与争议解决
  description: 预防、管理和解决争议和索赔，包括合同争议、雇佣索赔，以及就临床过失索赔进行联络。
  levels:
    awareness: |
      您可以：
      - 解释索赔或争议的主要阶段
      - 准确登记索赔并跟踪期限
    working: |
      您可以：
      - 为案件收集和整理文件及证据
      - 准备时间表、案卷和证人陈述草稿
      - 就常规事项与外部律师、保险人或赔偿计划联络
    practitioner: |
      您可以：
      - 管理一批争议和索赔案件，从首次通知到和解或开庭
      - 评估索赔的是非曲直和金额并建议策略
      - 谈判和解并运用替代性争议解决方式
      - 确保从索赔中吸取的教训用于改进安全、合同和服务
    expert: |
      您可以：
      - 领导组织最重大或最受关注的争议
      - 制定组织在诉讼、和解和索赔报告方面的方法
      - 就或有负债和声誉风险向董事会提供建议
legal-information-and-data-law:
  name: 信息与数据法
  description: 将数据保护、保密、信息公开和网络安全方面的法律适用于医疗卫生和照护数据及数字服务。
  levels:
    awareness: |
      您可以：
      - 解释数据保护和保密的基本原则
      - 识别信息请求和数据泄露并正确转交
    working: |
      您可以：
      - 对照模板审查数据共享和数据处理协议
      - 支持对信息请求和数据主体权利请求的答复
      - 解释在常见情况下使用健康数据的合法依据
    practitioner: |
      您可以：
      - 就数字服务的数据保护、保密义务和信息获取法律提供建议
      - 起草和谈判数据共享协议和数据处理条款，包括国际传输
      - 就人工智能和分析平台等新技术的数据保护影响评估提供建议
      - 就数据泄露、监管机构询问和投诉提供建议
    expert: |
      您可以：
      - 确定组织在使用医疗卫生和照护数据方面的法律立场
      - 领导研究、数据平台和人工智能等高风险或新颖的数据用途
      - 在信息法方面代表组织与监管机构沟通
legal-legal-administration:
  name: 法务行政
  description: 运行法务团队的行政流程，包括事项管理、文档控制、档案、期限和账单。
  levels:
    awareness: |
      您可以：
      - 在事项管理系统中创建、更新和关闭事项
      - 安全地归档和调取法律文件
      - 对法律信息和个人信息保密
    working: |
      您可以：
      - 为团队管理日程、期限和关键日期
      - 准备并编排法律文件、案卷和签署文件包
      - 检查并处理外部律师的账单
      - 管理合同和契据登记册
    practitioner: |
      您可以：
      - 运行法务团队的行政工作并改进其流程
      - 报告工作量、外部律师费用支出和处理时间
      - 管理事项管理和电子签名工具等法律科技
    expert: |
      您可以：
      - 为组织设计法务运营模式
      - 领导法律科技的选择和使用
      - 为法务服务制定服务标准和绩效指标
legal-employment-law:
  name: 劳动法
  description: 将劳动法应用于组织的人事政策、合同、变革项目和劳动争议。
  levels:
    awareness: |
      您可以：
      - 解释员工的主要劳动权利
      - 识别需要法律意见的劳动问题
    working: |
      您可以：
      - 协助准备劳动索赔和听证的文件
      - 对照模板审查劳动合同和政策
    practitioner: |
      您可以：
      - 就解雇、歧视、员工转移和重组等劳动事项提供建议
      - 管理劳动索赔并谈判和解协议
      - 就承包人的使用以及数字专家的雇佣身份提供建议
    expert: |
      您可以：
      - 就重大人力变革及其法律风险向董事会提供建议
      - 领导受关注或复杂的劳动争议
      - 塑造人事政策，使其符合法律义务和良好实践
legal-intellectual-property:
  name: 知识产权
  description: 保护和利用软件、数据、内容和发明中的知识产权，包括版权、许可、开源和商标。
  levels:
    awareness: |
      您可以：
      - 解释软件、数据和内容受知识产权保护
      - 识别合同或项目何时引发所有权问题
    working: |
      您可以：
      - 检查常规协议中的知识产权条款
      - 保存许可和注册权利的记录
      - 解释主要的开源许可类型及其条件
    practitioner: |
      您可以：
      - 就员工、供应商和合作伙伴制作的软件、数据和内容归谁所有提供建议
      - 起草许可和知识产权条款，包括以开源方式发布组织的代码
      - 就组织数据和软件的商业使用以及利益分享提供建议
    expert: |
      您可以：
      - 制定组织的知识产权和开源政策
      - 领导涉及组织数据和软件的商业化与合作
      - 解决重大知识产权争议
legal-procurement-law:
  name: 政府采购法
  description: 将公共采购规则应用于购买货物、服务和技术，从选择采购途径到合同授予和质疑。
  levels:
    awareness: |
      您可以：
      - 解释为什么公共机构必须遵守采购规则
      - 识别采购活动何时需要采购或法律意见
    working: |
      您可以：
      - 检查招标文件的一致性和完整性
      - 支持证明流程公平透明所需的记录保存工作
    practitioner: |
      您可以：
      - 就采购途径提供建议，包括框架协议、直接授予和竞争性程序
      - 就评审、授予决定以及授予后的合同变更提供建议
      - 回应供应商的质疑和投诉
      - 就合作关系中的补贴管制和竞争风险提供建议
    expert: |
      您可以：
      - 制定组织应对采购法律风险的方法
      - 领导高价值或新颖的采购，例如创新伙伴关系
      - 应对重大采购质疑
legal-health-and-care-law:
  name: 医疗卫生与照护法
  description: 适用规范医疗卫生和照护服务的法律，包括同意、行为能力、临床过失、服务和产品监管以及组织的法定职责。
  levels:
    awareness: |
      您可以：
      - 解释组织的主要法定职责和权力
      - 识别涉及患者安全、同意或临床过失的事项
    working: |
      您可以：
      - 支持有关事件、死因调查或临床索赔的法律工作
      - 解释适用于组织服务的监管框架
    practitioner: |
      您可以：
      - 就组织的权力和职责提供建议，包括其何时可以提供或委托一项服务
      - 就作为医疗器械的软件等数字健康产品的监管提供建议
      - 就涉及数字服务的索赔与临床过失赔偿计划和外部律师联络
      - 就数字服务中的同意、行为能力和患者权利提供建议
    expert: |
      您可以：
      - 就组织的法定职责和治理向董事会提供建议
      - 领导有关公共调查、司法审查和重大事件的法律工作
      - 塑造组织对新的医疗卫生和照护法律的应对
