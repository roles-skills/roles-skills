summary: Communicatiemedewerkers helpen de organisatie uit te leggen wat zij doet aan personeel, patiënten, het publiek, partners en de media. Zij schrijven en publiceren content, voeren interne communicatie en campagnes uit, beheren digitale kanalen en sociale media, handelen vragen van de media af en beschermen de reputatie van de organisatie, vooral tijdens incidenten en storingen.
health_context:
- Communicatie over diensten voor gezondheid moet nauwkeurig, duidelijk en toegankelijk zijn, want patiënten kunnen erop handelen.
- Campagnes mikken vaak op gedragsverandering, zoals patiënten en zorgpersoneel aanmoedigen een nieuwe digitale dienst te gebruiken.
- Uitval van diensten, cyberincidenten en datalekken vragen snelle, zorgvuldige communicatie met patiënten, personeel, partners en de media.
- Verhalen over patiënten vragen toestemming en moeten vertrouwelijkheid beschermen.
levels:
- title: Communicatiemedewerker
  summary: Schrijft en publiceert content voor interne en externe kanalen en ondersteunt het communicatieteam bij routinewerk voor media en campagnes.
  responsibilities:
  - Nieuws, content voor het intranet, nieuwsbrieven en berichten op sociale media schrijven en redigeren.
  - Goedgekeurde content publiceren op de website, het intranet en sociale media.
  - Vragen van de media vastleggen en berichtgeving volgen.
  - Campagnes en evenementen ondersteunen met content en logistiek.
  - Content controleren op nauwkeurigheid, toegankelijkheid en begrijpelijk taalgebruik.
  qualifications:
  - Ervaring met schrijven voor verschillende doelgroepen, of een kwalificatie in communicatie of een verwant vak, of gelijkwaardige ervaring.
- title: Senior communicatiemedewerker
  summary: Plant en levert communicatie voor projecten en diensten, handelt routinevragen van de media af en beheert kanalen.
  responsibilities:
  - Communicatie voor projecten en wijzigingen van diensten plannen en leveren.
  - Routinevragen van de media beantwoorden en persberichten en verklaringen opstellen.
  - Contentplannen voor digitale kanalen en sociale media beheren en over de prestaties rapporteren.
  - Casestudy’s schrijven, inclusief verhalen van patiënten, met toestemming.
  - Collega’s adviseren over duidelijk schrijven voor patiënten en het publiek.
  - Communicatiemedewerkers coachen.
  qualifications:
  - Een bachelor of kwalificatie in communicatie of een verwant vak, of gelijkwaardige ervaring.
- title: Communicatieleider
  summary: Leidt communicatie voor een groot programma of gebied, zoals interne communicatie of digitale kanalen, en verzorgt gevoelig werk voor de media.
  responsibilities:
  - Communicatie en betrokkenheid leiden voor een groot programma, zoals een nieuw klinisch systeem.
  - Campagnes plannen en evalueren die patiënten en personeel aanmoedigen digitale diensten te gaan gebruiken.
  - Gevoelige vragen van de media afhandelen en woordvoerders voorbereiden.
  - Communicatie plannen voor incidenten en uitval van diensten samen met operationele teams.
  - Leiders adviseren over hoe verandering en moeilijke boodschappen te communiceren.
  - Toezicht houden op communicatiemedewerkers.
  qualifications:
  - Een bachelor of professionele kwalificatie in communicatie, of gelijkwaardige ervaring.
  - Ervaring met het plannen en evalueren van campagnes.
- title: Communicatiemanager
  summary: Beheert het werk en de kanalen van het communicatieteam en leidt de omgang met media en communicatie bij incidenten.
  responsibilities:
  - Het communicatieteam, zijn werkplan en zijn budget beheren.
  - Reactief en proactief werk voor de media leiden, ook tijdens incidenten en datalekken.
  - De kanalen, het merk en de normen voor content van de organisatie beheren.
  - Directeuren adviseren over communicatie en reputatierisico’s.
  - Communicatie evalueren en over het effect rapporteren.
  - Met partnerorganisaties samenwerken aan gezamenlijke communicatie.
  qualifications:
  - Een professionele kwalificatie in communicatie, of gelijkwaardige ervaring.
  - Aanzienlijke ervaring met relaties met de media en het beheren van communicatie.
  job_evaluation_notes: Emotionele inspanning weerspiegelt het af en toe omgaan met schokkend materiaal tijdens incidenten en in verhalen van patiënten.
- title: Hoofd communicatie
  summary: Leidt communicatie en betrokkenheid voor de organisatie, stelt haar strategie vast en adviseert het bestuur over reputatie.
  responsibilities:
  - De strategie voor communicatie en betrokkenheid van de organisatie vaststellen.
  - De functie communicatie leiden en ontwikkelen en haar budget beheren.
  - De bestuursvoorzitter en het bestuur adviseren over reputatie, betrokkenheid van belanghebbenden en communicatierisico’s.
  - Crisiscommunicatie tijdens grote incidenten leiden.
  - Relaties opbouwen met senior partners, journalisten en patiëntengroepen.
  - Vormgeven aan hoe de organisatie haar digitale diensten en haar gebruik van data aan het publiek uitlegt.
  qualifications:
  - Een professionele kwalificatie in communicatie, of gelijkwaardige ervaring.
  - Uitgebreide ervaring met het leiden van communicatie voor een complexe organisatie.
