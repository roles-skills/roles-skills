summary: Contentontwerpers maken informatie en diensten voor gezondheid en zorg duidelijk, zodat patiënten, mantelzorgers, clinici en zorgpersoneel kunnen begrijpen wat zij moeten weten en doen. Zij ontwerpen content op basis van bewijs van behoeften van gebruikers, schrijven in begrijpelijk Nederlands, werken met klinische deskundigen om haar nauwkeurig te houden en beheren content gedurende haar hele leven, van creatie tot toetsing en buitengebruikstelling.
health_context:
- Mensen lezen content over gezondheid vaak wanneer zij zich zorgen maken, ziek zijn of haast hebben, dus content moet gemakkelijk te begrijpen zijn en waarop kan worden gehandeld voor mensen met weinig gezondheidsvaardigheden.
- Onjuiste of verouderde gezondheidsinformatie kan schade veroorzaken, dus contentontwerpers volgen een proces van klinische borging met data van toetsing en benoemde klinische beoordelaars.
- Sommige onderwerpen zijn gevoelig of riskant, zoals dringende symptomen, geestelijke gezondheid, medicijnen en zorg aan het levenseinde, dus contentontwerpers werken nauw samen met clinici en gebruikersonderzoekers aan toon en nauwkeurigheid.
- Ook klinische systemen hebben duidelijke content nodig, zoals labels, instructies en waarschuwingen, dus contentontwerpers helpen fouten in klinische werkstromen te verminderen.
- Content over gezondheid moet toegankelijk en inclusief zijn, ook voor mensen die hulptechnologie gebruiken, in een andere taal lezen of eenvoudige taal nodig hebben.
levels:
- title: Associate contentontwerper
  responsibilities:
  - Methoden van contentontwerp, de stijlgids en het proces van klinische toetsing leren via training en werk onder toezicht.
  - Standaardcontroles, tekstredactie en bijwerkingen van bestaande content uitvoeren.
  - Content publiceren met het contentmanagementsysteem, volgens de stappen van borging.
  - Content controleren op toegankelijkheid, zoals koppen, linkteksten en alternatieve teksten.
  qualifications:
  - Werkend aan een kwalificatie of leerwerktraject in een relevant vakgebied, of gelijkwaardige ervaring.
- title: Junior contentontwerper
  responsibilities:
  - Gezondheidscontent en dienstcontent schrijven en bijwerken, onder leiding van meer senior contentontwerpers.
  - Onderzoek en data gebruiken om vast te stellen wat gebruikers moeten weten en welke woorden zij gebruiken.
  - Met klinische beoordelaars de nauwkeurigheid controleren en medische termen in begrijpelijke taal uitleggen.
  - Publicatie van content, data van toetsing en administratie van het contentteam ondersteunen.
  qualifications:
  - Een bachelor of relevante kwalificatie, of gelijkwaardige ervaring met schrijven voor het web.
- title: Contentontwerper
  responsibilities:
  - Content ontwerpen over hele gebruikersreizen heen, zoals een dienst vinden, een afspraak voorbereiden en nazorg.
  - Content voor klinische systemen ontwerpen, zoals labels, instructies en waarschuwingen, om de kans op fouten te verkleinen.
  - Nauwkeurigheid afspreken met klinische deskundigen terwijl de content duidelijk en bruikbaar blijft.
  - Content testen met gebruikers, ook mensen met weinig gezondheidsvaardigheden en mensen die hulptechnologie gebruiken.
  - Bijdragen aan de stijlgids en aan patronen voor content.
  qualifications:
  - Een bachelor of relevante kwalificatie, of gelijkwaardige ervaring.
  - Ervaring met het ontwerpen van content voor digitale diensten.
- title: Senior contentontwerper
  responsibilities:
  - Contentstrategie ontwikkelen voor grote of prominente gebieden, zoals een groot ziektegebied of een campagne voor de volksgezondheid.
  - Content ontwerpen voor gevoelige onderwerpen en onderwerpen met hoog risico, zoals dringende symptomen, geestelijke gezondheid en zorg aan het levenseinde.
  - Klinische borging, bronnen van bewijs en toetsingscycli opzetten voor een geheel van gezondheidscontent.
  - Het werk van anderen beoordelen om de kwaliteit te borgen en contentontwerpers aansturen of begeleiden.
  - Samen met het team user stories schrijven en in kaart brengen.
  qualifications:
  - Aanzienlijke ervaring met contentontwerp, op een niveau gelijkwaardig aan een master.
  job_evaluation_notes: Emotionele inspanning is niveau 2 omdat senior contentontwerpers regelmatig werken aan schokkende onderwerpen, zoals ernstige ziekte, zelfbeschadiging en rouw.
- title: Lead contentontwerper
  responsibilities:
  - Een team van contentontwerpers aansturen en de kwaliteit van content over meerdere teams borgen.
  - Zorgen dat gezondheidscontent voldoet aan normen voor klinische borging, toegankelijkheid en stijl.
  - Met senior klinische leiders, leiders van communicatie en leiders van producten teams van middelen voorzien en problemen met content oplossen.
  - Content leiden voor de meest gevoelige of riskante informatie van de organisatie.
  - Hiërarchisch leiding geven aan en ontwikkelen van contentontwerpers.
  qualifications:
  - Uitgebreide ervaring met het leiden van contentontwerp over teams heen.
  job_evaluation_notes: Er is geen niveau in Band 8a, omdat het UK GDaD PCF de lead contentontwerper op G7 of G6 plaatst en deze referentie het voorgestelde Band 8b volgt. Beleid is niveau 5 omdat de lead normen voor content vaststelt voor een reeks diensten; emotionele inspanning is niveau 2, net als bij senior contentontwerpers.
- title: Hoofd contentontwerp
  responsibilities:
  - Een contentstrategie ontwikkelen die past bij de doelstellingen van de organisatie en de behoeften van patiënten en personeel.
  - De normen van de organisatie voor content met gezondheidsinformatie en haar klinische borging vaststellen.
  - Een team voor contentontwerp leiden dat de strategie kan uitvoeren, inclusief werving en ontwikkeling.
  - Met senior klinische leiders en leiders van communicatie risico’s van gezondheidsinformatie beheren.
  - Werk aan content in de hele organisatie prioriteren.
  qualifications:
  - Uitgebreide ervaring met het leiden van contentontwerp en een contentpraktijk.
  job_evaluation_notes: Het UK GDaD PCF plaatst zowel de lead contentontwerper als het hoofd contentontwerp op G7 of G6, met een voorgesteld Band 8b. Deze referentie plaatst het hoofd op Band 8c, in lijn met de hoofden van andere beroepen in gebruikersgericht ontwerp, omdat het hoofd de contentstrategie en normen voor de hele organisatie vaststelt.
