summary: >
  コンテンツデザイナーは、患者、介護者、臨床医、ケア職員が、知るべきことやすべきことを理解できるよう、保健・ケアの情報とサービスをわかりやすくする。利用者のニーズに関する根拠からコンテンツを設計し、平易な言葉で書き、臨床の専門家と協力して正確さを保ち、作成からレビュー、廃止まで、コンテンツの一生を通じて面倒を見る。
health_context:
  - 人は、不安なとき、体調がすぐれないとき、急いでいるときに健康に関するコンテンツを読むことが多いため、コンテンツはヘルスリテラシーの低い人にも理解しやすく、行動に移しやすくなければならない。
  - 誤った、または古い健康情報は害を及ぼしうるため、コンテンツデザイナーは、レビュー日と氏名のわかる臨床レビュー担当者を伴う、臨床保証のプロセスに従う。
  - 緊急の症状、精神保健、薬、終末期ケアなど、一部の話題は機微またはリスクが高いため、コンテンツデザイナーはトーンと正確さについて、臨床医やユーザーリサーチャーと密接に協力する。
  - 臨床システムにも、ラベル、指示、アラートなどの明確なコンテンツが必要なため、コンテンツデザイナーは臨床ワークフローの誤りを減らす手助けをする。
  - 健康コンテンツは、支援技術を使う人、他の言語で読む人、やさしい日本語などの読みやすい形式が必要な人を含め、アクセスしやすく包摂的でなければならない。
levels:
  - title: アソシエイト コンテンツデザイナー
    responsibilities:
      - 研修と監督付きの仕事を通じて、コンテンツデザインの手法、スタイルガイド、臨床レビューのプロセスを学ぶ。
      - 既存のコンテンツに対して、標準的なチェック、文章の校正、更新を行う。
      - 保証の手順に従い、コンテンツ管理システムを使ってコンテンツを公開する。
      - 見出し、リンクテキスト、代替テキストなど、コンテンツのアクセシビリティを確認する。
    qualifications:
      - 関連分野の資格やアプレンティスシップの取得を目指している、または同等の経験。
  - title: ジュニア コンテンツデザイナー
    responsibilities:
      - より上位のコンテンツデザイナーの指示を受けながら、健康コンテンツとサービスコンテンツを書き、更新する。
      - リサーチとデータを使って、利用者が知る必要があることと、使う言葉を特定する。
      - 臨床レビュー担当者と協力して正確さを確認し、医学用語を平易な言葉で説明する。
      - コンテンツの公開、レビュー日、コンテンツチームの事務作業を支援する。
    qualifications:
      - 学位または関連資格、またはウェブ向けの執筆に関する同等の経験。
  - title: コンテンツデザイナー
    responsibilities:
      - サービスを見つける、予約の準備をする、アフターケアなど、利用者のジャーニー全体にわたってコンテンツを設計する。
      - 誤りの可能性を減らすため、ラベル、指示、アラートなど、臨床システムのコンテンツを設計する。
      - コンテンツをわかりやすく使いやすく保ちながら、臨床の専門家と正確さに合意する。
      - ヘルスリテラシーの低い人や支援技術を使う人を含む利用者と、コンテンツをテストする。
      - スタイルガイドとコンテンツパターンに貢献する。
    qualifications:
      - 学位または関連資格、または同等の経験。
      - デジタルサービスのコンテンツを設計した経験。
  - title: シニア コンテンツデザイナー
    responsibilities:
      - 主要な疾患領域や公衆衛生キャンペーンなど、大規模または注目度の高い領域のコンテンツ戦略を策定する。
      - 緊急の症状、精神保健、終末期ケアなど、機微でリスクの高い話題のコンテンツを設計する。
      - 一連の健康コンテンツについて、臨床保証、根拠となる情報源、レビューサイクルを整える。
      - 他の人の仕事をレビューして質を保証し、コンテンツデザイナーを管理またはメンターする。
      - チームとともに、ユーザーストーリーを書き、マッピングする。
    qualifications:
      - コンテンツデザインの相当の経験(修士相当のレベル)。
    job_evaluation_notes: シニアコンテンツデザイナーは、重い病気、自傷、死別などのつらい話題に定期的に取り組むため、感情的負荷はレベル 2 とする。
  - title: リード コンテンツデザイナー
    responsibilities:
      - コンテンツデザイナーのチームを指揮し、複数のチームにわたってコンテンツの質を保証する。
      - 健康コンテンツが、臨床保証、アクセシビリティ、スタイルの基準を満たすようにする。
      - 臨床、広報、プロダクトのシニアリーダーと協力して、チームに人員を配置し、コンテンツの問題を解決する。
      - 組織で最も機微な、またはリスクの高い情報のコンテンツを主導する。
      - コンテンツデザイナーをライン管理し、育成する。
    qualifications:
      - チームを横断してコンテンツデザインを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF がリードコンテンツデザイナーを G7 または G6 に置き、このリファレンスが示唆されたバンド 8b に従うため、バンド 8a のレベルはない。リードが一連のサービスのコンテンツ標準を定めるため、方針はレベル 5、感情的負荷はシニアコンテンツデザイナーと同じレベル 2 とする。
  - title: コンテンツデザイン責任者
    responsibilities:
      - 組織の目的と、患者および職員のニーズを満たすコンテンツ戦略を策定する。
      - 健康情報コンテンツとその臨床保証について、組織の基準を定める。
      - 採用と育成を含め、戦略を実行できるコンテンツデザインチームを率いる。
      - 臨床および広報のシニアリーダーと協力して、健康情報のリスクを管理する。
      - 組織全体でコンテンツの仕事に優先順位をつける。
    qualifications:
      - コンテンツデザインとコンテンツの実践を率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF は、リードコンテンツデザイナーとコンテンツデザイン責任者の両方を、示唆されるバンド 8b の G7 または G6 に置いている。このリファレンスは、責任者が組織全体のコンテンツ戦略と標準を定めるため、他のユーザー中心デザイン専門職の責任者に合わせて、責任者をバンド 8c に置いている。
