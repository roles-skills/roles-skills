summary: >
  ビジネスアーキテクトは、組織が保健・ケアをどう提供しているかについて、ケイパビリティ、サービス、ケアパス、プロセス、情報を、明確で一貫した形で描き出す。その全体像を使って、変革が必要な箇所を示し、戦略とプログラムを結びつけ、デジタルの変化が患者のケアと、臨床医やケア職員の働き方を改善するようにする。
health_context:
  - ケアパスはチーム、現場、組織にまたがるため、ビジネスアーキテクトは部門別だけでなく、患者の視点でサービスをモデル化する。
  - 臨床プロセスの変更は、患者の安全と職員の業務量に影響しうるため、モデルは臨床医やケア職員とともに作り、実際の現場に照らして確認する。
  - 保健・ケアの戦略は、政策、規制、資金の規則によって形づくられており、アーキテクトはそれを実践的なケイパビリティの変更に翻訳しなければならない。
  - 多くのケイパビリティはパートナー組織と共有されるため、アーキテクトは誰が何をするか、情報がどこへ流れるべきかの合意を手助けする。
levels:
  - title: トレーニー ビジネスアーキテクト
    responsibilities:
      - 研修と実践を通じて、ケイパビリティ、バリューストリーム、プロセスのモデリングなど、ビジネスアーキテクチャの手法を学ぶ。
      - インタビュー、文書、観察を通じて、サービスとケアパスに関する情報を集める。
      - ビジネスアーキテクトの指導のもとで、ケイパビリティマップとプロセスモデルの案を作成する。
      - 臨床医、ケア職員、管理者とのワークショップの運営を手伝い、成果をまとめる。
    qualifications:
      - ビジネス、分析、または関連分野の学位、または同等の経験。
      - ビジネスアーキテクチャの手法に関する専門的な研修(大学院ディプロマレベルまたは同等の経験)。
    job_evaluation_notes: UK GDaD PCF の等級の示唆(バンド 5)より高いバンドに置いている。保健分野の求人はこのロールをバンド 6 に置いている。知識は、仕事ができるだけの研修が終わった時点で職務が必要とするレベルで評価している。
  - title: アソシエイト ビジネスアーキテクト
    responsibilities:
      - 組織の一部について、ケイパビリティ、サービス、ケアパスをモデル化する。
      - モデルを分析して、患者と職員にとってのギャップ、重複、課題を見つける。
      - さまざまなチームや組織の情報をまとめて、変革の意思決定に役立てる。
      - 明確なモデルと平易な言葉で、複雑なサービスの問題をステークホルダーに説明する。
      - ビジネスアーキテクチャのリポジトリを正確に保ち、アプリケーションとデータのモデルに結びつける。
    qualifications:
      - ビジネスアーキテクチャまたはビジネス分析の専門知識(修士レベルまたは同等の経験)。
      - ビジネス分析またはサービスデザインの経験。
    job_evaluation_notes: UK GDaD PCF の等級の示唆(バンド 6)より高いバンドに置いている。保健分野の求人はこのロールをバンド 7 に置いている。この職務はチームや組織にまたがるサービスとケアパスをモデル化し、分析するため、知識は修士レベルまたは同等で評価している。
  - title: ビジネスアーキテクト
    responsibilities:
      - 救急医療や地域サービスなど、主要なサービス領域の現在と目標のビジネスアーキテクチャを策定する。
      - 戦略と方針をケイパビリティの変更と変革のロードマップに翻訳する。
      - プログラムとプロジェクトの範囲が、目標のビジネスアーキテクチャに適合しているかを確認する。
      - 臨床リードと協力して、提案された変更がケアパス、安全、職員の業務量にどう影響するかを評価する。
      - 手法とツールについて、他のビジネスアーキテクトを導く。
    qualifications:
      - ビジネスアーキテクチャ、ビジネス分析、またはサービスデザインの相当の経験(修士相当のレベル)。
    job_evaluation_notes: UK GDaD PCF の等級の示唆(バンド 7)より高いバンドに置いている。保健分野の求人はこのロールをバンド 8a に置いている。この職務は戦略を主要なサービス領域の変革ロードマップに変えるため、計画、方針、行動の自由度はバンド 7 の水準を上回って評価している。
  - title: リード ビジネスアーキテクト
    responsibilities:
      - ビジネスアーキテクチャの実践を率い、その成果に責任を負う。
      - ケイパビリティ、サービス、ケアパスに関する組織全体の見取り図を維持し、わかりやすく保つ。
      - 変革の優先順位と、投資ポートフォリオが戦略にどう適合するかについて、ディレクターに助言する。
      - パートナー組織と協力して、ケアパスにわたる共有のケイパビリティと責任に合意する。
      - ビジネスアーキテクトを率い、育成する。
    qualifications:
      - 複雑な組織でビジネスアーキテクチャを率いた豊富な経験。
