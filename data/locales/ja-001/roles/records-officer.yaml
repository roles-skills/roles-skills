summary: >
  診療記録担当職員は、患者の記録と共通部門の記録が、紙であれデジタルシステムの中であれ、正しく作成され、保管され、追跡され、取り出され、廃棄されるようにする。ケアのために記録が利用できる状態を保ち、紛失や無権限のアクセスから守り、紙の記録からデジタルの記録への移行を支援する。
health_context:
  - 患者の記録は臨床医が必要とするときに利用できなければならないため、遅れや紛失はケアに直接影響しうる。
  - 記録には非常に機密性の高い情報が含まれるため、職員は厳格な秘密保持とアクセスの規則に従い、つらい内容を定期的に読むことがある。
  - ほとんどの組織は紙とデジタルの両方の記録を持っているため、このロールにはスキャン、索引付け、ハイブリッドな記録の管理が含まれる。
  - 記録は保存期間表にもとづいて定められた期間保管され、その後、監査証跡とともに、アーカイブまたは安全に廃棄されなければならない。
  - 記録チームは、法的な期限のある診療記録へのアクセス請求を処理することが多い。
levels:
  - title: 記録アシスタント
    summary: 近くでの監督のもと、定められた手順に従って、記録をファイリングし、取り出し、追跡し、スキャンし、準備する。
    responsibilities:
      - 紙の記録をファイリングし、取り出し、追跡し、診療所や依頼のために準備する。
      - 記録をスキャンして電子記録システムに索引付けし、品質を確認する。
      - 追跡システムに記録の詳細を正確に入力し、更新する。
      - 記録を安全に保ち、記録の紛失や侵害があればすぐに報告する。
      - 箱やカルテのトロリーを含め、記録を安全に運んで保管する。
    qualifications:
      - 優れた読み書き、計算、キーボードの技能。
    job_evaluation_notes: 迅速で正確なスキャンとデータ入力のため、身体的技能はレベル 3 で評価している。身体的負荷は、記録を頻繁に運ぶことを反映している。
  - title: 記録担当職員
    summary: 所在不明の記録の追跡、アクセス請求のための記録の準備、保存期間表の適用など、定型ではないものを含む、さまざまな記録のプロセスを扱う。
    responsibilities:
      - 所在不明の記録を追跡し、追跡上の問題を解決する。
      - アクセス請求のために記録を準備し、レビューの前に漏れがないかを確認する。
      - 保存期間表を適用し、アーカイブまたは安全な廃棄のために記録を準備する。
      - スキャンされた記録の品質を確認し、索引付けの誤りを直す。
      - 記録について、臨床医、ケア職員、患者からの問い合わせに答える。
      - 新しい記録アシスタントに、手順の従い方を教える。
    qualifications:
      - 記録または事務の仕事の経験、またはビジネス事務のレベル 3 の資格、または同等の経験。
    job_evaluation_notes: 感情的負荷は、診療記録のつらい内容に間接的に触れることが頻繁にあることを反映している。
  - title: シニア 記録担当職員
    summary: 記録チームを日々監督し、アクセス請求、監査、保存のレビューなどの記録のプロセスを運営する。
    responsibilities:
      - 記録担当職員を日々監督し、仕事を割り当て、品質を確認する。
      - 情報ガバナンスの同僚の指導のもと、法的な期限内に診療記録へのアクセス請求を処理する。
      - 記録管理と追跡の監査を実施し、結果を報告する。
      - 記録の追跡と電子記録システムを、正確で最新の状態に保つ。
      - 記録の手順と秘密保持について、職員を研修する。
      - 記録の紛失やその他のインシデントを調査し、改善を勧告する。
    qualifications:
      - 診療記録の仕事の相当の経験、または準学士レベルの関連資格、または同等の経験。
  - title: 診療記録マネージャー
    summary: 診療記録サービスと、その職員、システム、手順を管理し、紙の記録からデジタルの記録への移行を含め、改善を主導する。
    responsibilities:
      - 診療記録サービスと、その職員および実績を管理する。
      - 記録管理の方針と標準に沿って、記録の手順を書いて維持する。
      - 複数のサービスの記録の追跡システムと電子記録システムを管理する。
      - スキャンとデジタル化のプロジェクト、およびデジタルの記録への移行を主導する。
      - 保存と廃棄のプログラムおよび記録の監査を運営する。
      - 記録管理について、臨床医、マネージャー、情報ガバナンスの同僚に助言する。
    qualifications:
      - 記録管理または情報管理の学位または専門資格、または同等の経験。
      - 記録チームを監督した経験。
    job_evaluation_notes: 複数のサービスの記録システムを運営することが主な職務であるため、情報資源はレベル 5 で評価している。
