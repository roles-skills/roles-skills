summary: >
  サービスデザイナーは、誰かが最初に助けを必要とした瞬間からケアの終わりまで、デジタル、電話、紙、対面のチャネルにわたって、保健・ケアのサービスをエンドツーエンドで設計する。患者、介護者、臨床医、ケア職員と協力して、サービスが実際にどう機能しているかをマッピングし、人々を失望させる箇所を見つけ、安全で、シンプルで、公平で、組織の境界を越えて機能するサービスを設計する。
health_context:
  - ケアパスは多くの組織や専門職にまたがるため、サービスデザイナーは、引き継ぎ、待ち時間、ケアをつなぎとめるために患者や介護者が担う作業を含め、旅全体をマッピングする。
  - サービスの機能の仕方を変えると新たな臨床リスクが生じうるため、サービスデザイナーは臨床安全責任者と協力して、新しいサービスモデルのハザードを稼働前に特定する。
  - デジタルサービスは、使えない人や使いたくない人を締め出してはならないため、サービスデザイナーは、デジタルの経路とともに、支援付きの経路やデジタルを使わない経路を設計する。
  - 臨床・運用の職員はサービスの一部であるため、設計は患者の旅だけでなく、職員のワークフロー、業務量、専門職としての責任にも合わせなければならない。
levels:
  - title: アソシエイト サービスデザイナー
    responsibilities:
      - 研修と経験のあるデザイナーとの協働を通じて、サービスデザインの手法を学ぶ。
      - 患者と職員へのリサーチから、ユーザージャーニーとサービスブループリントのマッピングを手伝う。
      - 同意と情報ガバナンスの手順に従い、コ・デザインのワークショップの準備と運営を手伝う。
      - デザイン上の決定を文書化し、デザインの成果物を最新に保つ。
    qualifications:
      - デザインまたは関連分野の資格やアプレンティスシップの取得を目指している、または同等の経験。
  - title: ジュニア サービスデザイナー
    responsibilities:
      - 予約やフォローアップなど、ケアパスの一部について、現在のジャーニーとサービスブループリントをマッピングする。
      - より上位のデザイナーの指示を受けながら、サービスの一部の改善を設計し、テストする。
      - 誰もが参加できるよう調整して、患者、介護者、職員とのコ・デザインセッションを運営する。
      - サービスが患者や職員に余計な作業やリスクを生んでいる箇所を特定し、チームに提起する。
    qualifications:
      - デザインまたは関連する科目の学位、または同等の経験。
  - title: サービスデザイナー
    responsibilities:
      - 必要な人のための支援付きの経路やデジタルを使わない経路を含め、チャネルをまたぐエンドツーエンドのサービスを設計する。
      - 組織をまたいでケアパスをマッピングし、チームやサービス間のより良い引き継ぎを設計する。
      - 運用リードとともに、ロール、業務量、ワークフローを含め、サービスが職員にとってどう機能するかを設計する。
      - 臨床安全責任者と協力して、新しいサービスモデルのハザードを特定し、管理策を設計する。
      - サービスの変更を、患者、介護者、職員とともにプロトタイプ化し、テストする。
    qualifications:
      - デザインまたは関連する科目の学位、または同等の経験。
      - 利用者とともにサービスを設計した経験。
  - title: シニア サービスデザイナー
    responsibilities:
      - 複数のケア現場や組織にまたがる複雑なサービスのデザインを主導する。
      - 臨床、運用、デジタルのリーダーとともに、サービスのビジョンを形づくる。
      - 安全、アクセス、公平性を改善する新しいサービスモデルを設計し、実際の利用者とテストする。
      - サービスの変更が、臨床リスク、平等、情報ガバナンスへの影響について評価されるようにする。
      - デザイナーをメンターし、チームにサービスデザインの実践を根づかせる。
    qualifications:
      - サービスデザインの相当の経験(修士相当のレベル)。
  - title: リード サービスデザイナー
    responsibilities:
      - 複数のサービスまたはケアパス全体のデザインの方向性を定め、チームを横断してデザインの質を保証する。
      - 臨床・運用のシニアリーダーと協力して、ケアの組織と提供の仕方を再設計する。
      - 設計が、健康格差の影響を最も受ける人々と、プレッシャーの下にある職員にとって機能するようにする。
      - チームが臨床安全と支援付きの経路をどう設計するかの基準を定める。
      - サービスデザイナーをライン管理し、育成する。
    qualifications:
      - チームを横断してサービスデザインを率いた豊富な経験。
    job_evaluation_notes: UK GDaD PCF がリードサービスデザイナーを G7 または G6 に置き、このリファレンスが示唆されたバンド 8b に従うため、バンド 8a のレベルはない。リードデザイナーがディレクトレート全体の一連のサービスの機能の仕方を形づくるため、方針はレベル 5 とする。
  - title: サービスデザイン責任者
    responsibilities:
      - サービスデザイン専門職を率い、その戦略、基準、仕事の進め方を定める。
      - サービスが患者、介護者、職員のニーズを中心に設計されるよう、組織の戦略に影響を与える。
      - 採用、キャリアパス、研修を含め、サービスデザインの能力を築く。
      - 利用者へのアクセス、リサーチの時間、ガバナンスにおけるデザインなど、良いデザインのための条件を整える。
      - 保健・ケアのシステム全体の同僚と協力して、つながったサービスを設計する。
    qualifications:
      - デザインとデザインの実践を率いた豊富な経験。
