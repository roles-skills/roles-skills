summary: >
  広報職員は、組織が自らの活動を、職員、患者、一般の人々、パートナー、メディアに説明するのを助ける。コンテンツを書いて公開し、社内広報とキャンペーンを運営し、デジタルおよびソーシャルメディアのチャネルを管理し、メディアからの問い合わせに対応し、特にインシデントや停止の間、組織の評判を守る。
health_context:
  - 患者はそれにもとづいて行動しうるため、保健サービスに関する広報は、正確で、明確で、アクセスしやすくなければならない。
  - キャンペーンは、患者やケア職員に新しいデジタルサービスの利用を促すなど、行動の変容を目指すことが多い。
  - サービスの停止、サイバーインシデント、データ侵害には、患者、職員、パートナー、メディアに対する、迅速で慎重な広報が必要である。
  - 患者に関する話には同意が必要であり、秘密を守らなければならない。
levels:
  - title: 広報担当職員
    summary: 社内外のチャネル向けにコンテンツを書いて公開し、定型のメディア対応とキャンペーンの仕事で広報チームを支える。
    responsibilities:
      - ニュース、イントラネットのコンテンツ、ニュースレター、ソーシャルメディアの投稿を書き、編集する。
      - 承認されたコンテンツを、ウェブサイト、イントラネット、ソーシャルメディアに公開する。
      - メディアからの問い合わせを記録し、報道を監視する。
      - コンテンツとロジスティクスで、キャンペーンとイベントを支援する。
      - コンテンツの正確さ、アクセシビリティ、平易な言葉を確認する。
    qualifications:
      - さまざまな読み手に向けて書いた経験、または広報もしくは関連する科目の資格、または同等の経験。
  - title: シニア 広報担当職員
    summary: プロジェクトとサービスの広報を計画して実行し、定型のメディアからの問い合わせに対応し、チャネルを管理する。
    responsibilities:
      - プロジェクトとサービスの変更の広報を計画して実行する。
      - 定型のメディアからの問い合わせに対応し、プレスリリースと声明を起草する。
      - デジタルおよびソーシャルメディアのチャネルのコンテンツ計画を管理し、実績を報告する。
      - 同意を得て、患者の体験談を含む事例紹介を書く。
      - 患者と一般の人々に向けて明確に書くことについて、同僚に助言する。
      - 広報担当職員をコーチする。
    qualifications:
      - 広報もしくは関連する科目の学位または資格、または同等の経験。
  - title: 広報リード
    summary: 社内広報やデジタルチャネルなど、主要なプログラムまたは領域の広報を率い、機微なメディア対応を扱う。
    responsibilities:
      - 新しい臨床システムなど、主要なプログラムの広報とエンゲージメントを主導する。
      - 患者と職員にデジタルサービスの利用を促すキャンペーンを計画し、評価する。
      - 機微なメディアからの問い合わせに対応し、スポークスパーソンを準備する。
      - 運用チームとともに、インシデントやサービス停止の広報を計画する。
      - 変更や難しいメッセージの伝え方について、リーダーに助言する。
      - 広報担当職員を監督する。
    qualifications:
      - 広報の学位または専門資格、または同等の経験。
      - キャンペーンを計画して評価した経験。
  - title: 広報マネージャー
    summary: 広報チームの仕事とチャネルを管理し、インシデント時のメディア対応と広報を主導する。
    responsibilities:
      - 広報チーム、その作業計画、予算を管理する。
      - インシデントやデータ侵害の間を含め、事後対応と先手のメディア対応を主導する。
      - 組織のチャネル、ブランド、コンテンツ基準を管理する。
      - 広報上のリスクと評判上のリスクについて、ディレクターに助言する。
      - 広報を評価し、その効果を報告する。
      - 共同の広報について、パートナー組織と協力する。
    qualifications:
      - 広報の専門資格、または同等の経験。
      - メディアリレーションズと広報の管理の相当の経験。
    job_evaluation_notes: 感情的負荷は、インシデントや患者の体験談の中で、つらい内容を時折扱うことを反映している。
  - title: 広報責任者
    summary: 組織の広報とエンゲージメントを率い、その戦略を定め、評判について取締役会に助言する。
    responsibilities:
      - 組織の広報とエンゲージメントの戦略を定める。
      - 広報機能を率い、育成し、その予算を管理する。
      - 評判、ステークホルダーとのエンゲージメント、広報上のリスクについて、最高経営責任者と取締役会に助言する。
      - 重大インシデントの間の危機広報を主導する。
      - 上級のパートナー、ジャーナリスト、患者団体との関係を築く。
      - 組織がデジタルサービスとデータの利用を一般の人々にどう説明するかを形づくる。
    qualifications:
      - 広報の専門資格、または同等の経験。
      - 複雑な組織の広報を率いた豊富な経験。
