summary: >
  プロダクトマネージャーは、組織のデジタルヘルスのプロダクトが、患者、臨床医、ケア職員のニーズを満たし、保健・ケアのシステムに価値をもたらすようにする。プロダクトのビジョンとロードマップを定め、根拠を用いて多職種チームの仕事に優先順位をつけ、ケアへの影響を含め、プロダクトが達成する成果に責任を負う。
health_context:
  - プロダクトの決定は患者の安全に影響しうるため、プロダクトマネージャーは臨床安全責任者とともにプロダクトの臨床リスクを担い、リリース前にハザードが管理されるようにする。
  - プロダクトは、患者、介護者、臨床医、事務職員など、ニーズの異なる多くの利用者集団に役立つため、プロダクトマネージャーはそれらを公平に調整しなければならない。
  - 一部のプロダクトは医療機器として規制されうるため、プロダクトマネージャーは規制がいつ適用されるかを知り、それに備える必要がある。
  - ケアにおける成果には、安全、質、アクセス、公平性、職員の時間が含まれるため、プロダクトマネージャーは臨床・運用のリーダーが認める成功指標を定義する。
  - プロダクトは、国や地域の健康データ標準や共有プラットフォームに依存することが多いため、プロダクトマネージャーは組織の境界を越えて働く。
levels:
  - title: アソシエイト プロダクトマネージャー
    responsibilities:
      - プロダクトマネージャーとともに、機能またはプロダクトの一部のバックログを担う。
      - 患者、臨床医、ケア職員へのユーザーリサーチから得た根拠を、優先順位のついたユーザーストーリーに変える。
      - 臨床安全責任者と協力して、自分が担う機能のハザードを記録し、レビューする。
      - 利用の広がり、完了率、サポートへの問い合わせなど、プロダクトの指標を追跡し、それが示すことを報告する。
      - ショーアンドテルや運用のステークホルダーに対して、プロダクトを代表する。
    qualifications:
      - デジタル、臨床、または運用のロールでの経験、または同等の経験。
  - title: プロダクトマネージャー
    responsibilities:
      - デジタルヘルスのプロダクトについて、ビジョン、ロードマップ、成功指標を定める。
      - 利用者のニーズ、臨床安全、政策、技術的制約、コストのバランスをとりながら、チームの仕事に優先順位をつける。
      - 臨床安全責任者とともに、プロダクトの変更に伴う臨床リスクを受け入れ、安全でないリリースを止める。
      - 臨床・運用のリーダーと協力して、プロダクトがケアパスに適合し、導入されるようにする。
      - プロダクトがアクセシビリティ、情報ガバナンス、サービス標準を満たすようにする。
      - 患者と職員にとっての便益を含め、プロダクトの成果を測定する。
    qualifications:
      - プロダクトマネジメントまたは関連するデジタルのロールにおける相当の経験。
  - title: シニア プロダクトマネージャー
    responsibilities:
      - 救急医療で使われるものなど、関連する一群のプロダクト、または複雑、高リスク、機微な単一のプロダクトを率いる。
      - 患者のニーズ、臨床実践、保健・ケアの政策に関する根拠から、プロダクト戦略を築く。
      - 規制が適用される場合は、プロダクトが医療機器規制を満たすようにする。
      - プロダクトの予算を管理し、ケアへの便益を示して投資のケースを作る。
      - プロダクトマネージャーをコーチし、ライン管理する。
    qualifications:
      - デジタルプロダクトをそのライフサイクル全体にわたって管理した豊富な経験。
  - title: リード プロダクトマネージャー
    responsibilities:
      - 1 つのケアパスを支えるすべてのプロダクトなど、プロダクトポートフォリオまたはエンドツーエンドのサービスを率いる。
      - 複数のチームにわたってプロダクトの方向性を定め、プロダクトが患者と職員のために連携して機能するようにする。
      - 臨床リードや臨床安全責任者と協力して、ポートフォリオ全体の臨床リスクを管理する。
      - ポートフォリオの予算を保有し、上級ガバナンス委員会に便益を報告する。
      - プロダクト領域のプロダクトマネージャーを率い、育成する。
    qualifications:
      - 複数のチームにわたってプロダクトを率いた豊富な経験。
  - title: プロダクト責任者
    responsibilities:
      - 経営、臨床、運用のリーダーと協力して、組織のプロダクト戦略を定める。
      - プロダクトが臨床リスクをどう管理し、成果をどう測定するかを含め、プロダクトマネジメントの基準を定め、高める。
      - 採用、キャリアパス、能力開発を含め、プロダクト専門職を率いる。
      - ニーズ、価値、公平性の根拠を用いて、プロダクト全体の投資の優先順位を決める。
      - 保健・ケアのシステム全体のパートナーに対して、組織のプロダクトを代表する。
    qualifications:
      - 組織全体でプロダクトマネジメントを率いた豊富な経験。
