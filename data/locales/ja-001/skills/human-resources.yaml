# data/skills/human-resources.yaml の日本語訳。キーは英語のスキル id。
hr-hr-administration:
  name: 人事管理
  description: 契約や新規入社から変更、勤怠記録、退職まで、雇用のライフサイクルの事務プロセスを、正確かつ秘密を守りながら運営する。
  levels:
    awareness: |
      できること:
      - 新規入社、変更、退職に関する組織の手順に従う
      - 個人記録を秘密に保ち、最新にしておく
    working: |
      できること:
      - 契約書、変更通知、雇用確認を正確に作成する
      - 期限までに、人事・給与システムの変更を処理する
      - 人事プロセスについて、管理者や職員からの定型的な質問に答える
    practitioner: |
      できること:
      - 人事管理サービスを運営し、品質を確認し、サービス基準を満たす
      - プロセスとテンプレートを改善し、可能な定型作業を自動化する
      - 過払いや契約の誤りなど、複雑または珍しいケースを解決する
    expert: |
      できること:
      - 組織の人事運営モデルとサービス基準を設計する
      - デジタルでセルフサービスの人事プロセスへの移行を主導する
      - 人事・給与データを正確かつ適法に保つ統制を定める
hr-employment-policy:
  name: 雇用法と人事方針
  description: 職員が適法、公正、一貫して扱われるよう、雇用法を適用し、組織の人事方針を作成し、解釈し、レビューする。
  levels:
    awareness: |
      できること:
      - 主な人事方針と、その見つけ方を説明する
      - 質問がいつ人事アドバイザーの助言を必要とするかを見分ける
    working: |
      できること:
      - 人事方針を定型的なケースに適用し、管理者に説明する
      - 方針の背景にある雇用法の原則を特定する
      - 方針の記録を保管し、方針のレビュー日を追跡する
    practitioner: |
      できること:
      - 複雑なケースについて雇用法と方針を解釈し、リスクについて助言する
      - 平等への影響評価とともに、人事方針を起草し、レビューする
      - 方針の変更について、職員の代表と協議する
    expert: |
      できること:
      - 組織の人事方針の枠組みと、法的リスクへの取り組み方を定める
      - 雇用法の変更を予測し、組織の対応を計画する
      - 雇用リスクと責任について、取締役会に助言する
hr-employee-relations:
  name: 労使関係のケース対応
  description: 行為、能力、苦情、勤怠、職場での尊厳といった、正式および非公式の労使関係のケースを、方針と雇用法に沿って公正に管理する。
  levels:
    awareness: |
      できること:
      - 行為、能力、苦情、勤怠の手続きの主な段階を説明する
      - 正式な会議で正確にメモを取り、ケースの記録の秘密を守る
    working: |
      できること:
      - 単純なケースと手続きの次の段階について、管理者に助言する
      - 調査を支援し、ケース資料を準備し、審問を手配する
      - 個々のケースで、職員の代表と建設的に協力する
    practitioner: |
      できること:
      - 複雑なケースを担当し、審問のパネルに公正な結果について助言する
      - インシデントや保護に関連するものを含め、調査を実施または主導する
      - 早期の解決や調停を使って、紛争が拡大する前に収める
      - ケースの傾向を見つけ、その原因に対処する
    expert: |
      できること:
      - 組織の労使関係とパートナーシップの取り組み方を主導する
      - 雇用に関する請求を含め、最も機微またはリスクの高いケースに対応する
      - 労働協約を交渉し、集団的な紛争を解決する
hr-recruitment-and-selection:
  name: 採用と選考
  description: 職務の設計と求人から、書類選考、評価、内定、入社前確認まで、人を公正かつ効率的に惹きつけ、評価し、採用する。
  levels:
    awareness: |
      できること:
      - 組織の採用プロセスの段階を説明する
      - 入社前確認を含め、公正で安全な採用の規則に従う
    working: |
      できること:
      - 応募者追跡システムを通じて採用キャンペーンを運営する
      - 管理者の求人広告、書類選考、面接の手配を支援する
      - 入社前確認を完了し、条件付きの内定を出す
    practitioner: |
      できること:
      - 職務の設計、選考方法、公正な評価について、管理者に助言する
      - デジタル職向けの技術課題など、専門職のための評価を設計する
      - 採用データを分析し、採用までの期間、質、多様性を改善する
      - 応募者の体験と雇用主ブランドを管理する
    expert: |
      できること:
      - 組織の採用戦略とサービス基準を定める
      - 採用技術とエージェンシーの選定と活用を主導する
      - 組織全体で採用が包摂的かつ適法であることを確かにする
hr-talent-attraction:
  name: 人材の誘致とソーシング
  description: デジタル、データ、技術の専門家のような希少なスキルを持つ人を、雇用主ブランディング、直接のソーシング、ネットワーク、早期キャリアの道筋を通じて見つけ、関わる。
  levels:
    awareness: |
      できること:
      - どのスキルが採用しにくく、それがなぜかを説明する
      - 組織のチャネルとネットワークを通じて求人広告を共有する
    working: |
      できること:
      - 専門職の候補者に響く、わかりやすい言葉で求人広告を書く
      - 求人サイト、専門家のネットワーク、タレントプールで候補者を探す
      - キャリアフェアやオープンデーなどのイベントを支援する
    practitioner: |
      できること:
      - 希少なデジタル・データ職のために、人材パイプラインとコミュニティを築く
      - 採用チームとともに、従業員価値提案を形づくる
      - 給与と供給の市場データを使って、採用が難しい職について助言する
      - アプレンティスシップや新卒制度など、早期キャリアの道筋を発展させる
    expert: |
      できること:
      - 組織の人材誘致戦略と雇用主ブランドを定める
      - 大学や他の雇用主などのパートナーと協力して、人材の供給を増やす
      - 割増賃金、エージェンシーの利用、代替のソーシングモデルについての決定を主導する
hr-workforce-planning:
  name: 人員計画
  description: 組織に必要な人員を予測し、現在の人員と比較し、採用、育成、再設計、定着によってそのギャップをどう埋めるかを計画する。
  levels:
    awareness: |
      できること:
      - 安全で持続可能なサービスのために、人員計画が重要な理由を説明する
      - 定員と欠員に関する正確な情報を提供する
    working: |
      できること:
      - 管理者から人員計画のデータを集めて確認する
      - 離職や欠員の傾向など、簡単なシナリオをモデル化する
    practitioner: |
      できること:
      - サービス計画や財務計画と結びつけて、ディレクトレートの人員計画を主導する
      - スキルのギャップを特定し、それを埋める方法を勧告する
      - 新しいロール、キャリアパス、スキルミックスを計画する
    expert: |
      できること:
      - 組織の人員戦略と長期計画を定める
      - 財務およびサービスのリーダーとともに、サービス間の人員のトレードオフを決める
      - 保健・ケアのシステム全体のパートナーとともに、人員計画を形づくる
hr-workforce-information:
  name: 人員情報と人事システム
  description: 人事・人員のシステムとデータを管理し、離職、欠勤、欠員、多様性、賃金格差の分析など、人員データを報告と洞察に変える。
  levels:
    awareness: |
      できること:
      - 人事システムに人員データを正確に入力する
      - 人員データが正確で、秘密を守る必要がある理由を説明する
    working: |
      できること:
      - 標準の人員報告を実行し、誤りを確認する
      - 人員に関する定型的な情報請求に答える
    practitioner: |
      できること:
      - 人員データを分析して傾向を見つけ、管理者に説明する
      - 人員の指標のためのダッシュボードと報告書を設計する
      - 賃金格差分析など、法定および平等に関する報告を作成する
    expert: |
      できること:
      - 組織の人員情報の戦略とデータ基準を定める
      - 人事システムの選定と開発を主導する
      - 人員に関する洞察を使って、取締役会の意思決定に情報を提供する
hr-reward-and-job-evaluation:
  name: 報酬と職務評価
  description: 給与と報酬の規則を適用し、職務評価の仕組みに照らして職務を一貫して評価し、適切なバンドに位置づける。
  levels:
    awareness: |
      できること:
      - 給与バンド、昇給、手当の仕組みを説明する
      - 職務は、その職に就く人ではなく、職務評価でバンドが決まることを説明する
    working: |
      できること:
      - 初任給、保護、手当などの給与規則を適用する
      - 評価に出す前に、職務記述書が完全かを確認する
      - 研修を受けたメンバーとして、職務評価パネルに参加する
    practitioner: |
      できること:
      - 職務評価パネルと一貫性の確認を主導する
      - デジタル・データ職を含め、新設および変更されたロールのバンドについて助言する
      - 市場の根拠を使って、採用・定着のための割増について助言する
    expert: |
      できること:
      - 合意された給与の枠組みの中で、組織の報酬戦略を定める
      - 組織全体で職務評価の完全性を保証する
      - 同一賃金のレビューを主導し、その結果に対応する
hr-learning-design-and-delivery:
  name: 学習の設計と提供
  description: 学習ニーズを分析し、対面、オンライン、業務の流れの中で、学習を設計し、提供し、評価する。
  levels:
    awareness: |
      できること:
      - 研修、学習、能力開発の違いを説明する
      - 講座の運営を支援し、研修の記録を保管する
    working: |
      できること:
      - 明確に定義された研修セッションを、対面とオンラインで提供する
      - 学習管理システムで簡単な e ラーニングを作る
      - 受講者のフィードバックを集めて要約する
    practitioner: |
      できること:
      - 学習ニーズを分析し、それに応えるブレンド型のプログラムを設計する
      - 学習の成果目標を設定し、満足度だけでなく効果を評価する
      - すべての職員にとってアクセスしやすく包摂的な学習にする
    expert: |
      できること:
      - 組織の学習戦略と基準を定める
      - 学習の提供内容、その技術、その資金を主導する
      - 組織の学習への投資の効果を示す
hr-skills-frameworks-and-career-pathways:
  name: スキルフレームワークとキャリアパス
  description: このリファレンス、UK GDaD PCF、ESCO などのスキル・ロールのフレームワークを使って、ロールを記述し、スキルのギャップを評価し、キャリアパスを築く。
  levels:
    awareness: |
      できること:
      - スキルフレームワークとは何か、それがロールとレベルをどう記述するかを説明する
      - フレームワークの中で、ある職務のロールのプロファイルとスキルを見つける
    working: |
      できること:
      - 職務記述書を、フレームワークのロール、レベル、スキルに対応づける
      - 職員と管理者のスキル自己評価を支援する
      - キャリアパスの情報を最新に保つ
    practitioner: |
      できること:
      - チームや専門職のスキルギャップ分析を実施し、結果を報告する
      - フレームワークのレベルを使って、キャリアパスと育成の道筋を設計する
      - フレームワークのスキルを使って、一貫した職務記述書と評価を書く
    expert: |
      できること:
      - 組織が専門職を横断してスキルフレームワークをどう使うかを定める
      - スキルデータを使って、人員、学習、報酬の戦略に情報を提供する
      - 他の組織との共有フレームワークの開発に貢献する
hr-organisational-development:
  name: 組織開発
  description: 文化、リーダーシップ、エンゲージメント、チームの有効性、心身の健康の施策を、根拠に基づいて行うことで、組織の働き方を改善する。
  levels:
    awareness: |
      できること:
      - 文化、リーダーシップ、エンゲージメントが職員と患者のケアにどう影響するかを説明する
      - 職員調査と傾聴イベントの運営を手伝う
    working: |
      できること:
      - 標準的なツールを使って、チームのセッションとワークショップを進行する
      - チームの職員調査の結果を分析し、対応を提案する
    practitioner: |
      できること:
      - 組織の課題を診断し、それに対処する施策を設計する
      - チーム開発、リーダーシップ開発、エンゲージメントのプログラムを主導する
      - 根拠を使って施策の効果を評価する
    expert: |
      できること:
      - 組織開発の戦略と文化プログラムを定める
      - 経営幹部をコーチし、大規模な文化変革を主導する
      - 文化とエンゲージメントの指標を、ケアの質と業績に結びつける
hr-organisational-change:
  name: 組織変更と協議
  description: 構造、ロール、勤務パターンの変更を、正式な協議、配置転換、解雇を含めて、方針と雇用法に沿って計画し、管理する。
  levels:
    awareness: |
      できること:
      - 組織変更プロセスの主な段階を説明する
      - 協議の通知や会議など、変更の事務を支援する
    working: |
      できること:
      - 管理者が協議資料と職員向けの説明を準備するのを支援する
      - 協議中の回答と対応を追跡する
      - 配置転換と選考のプロセスで職員を支援する
    practitioner: |
      できること:
      - ビジネスケースから実施まで、ディレクトレートの組織変更を主導する
      - 職員とその代表と協議し、そのフィードバックに応える
      - 変更の法的リスクと平等に関するリスクを管理する
    expert: |
      できること:
      - 組織全体の再編やサービス移管を主導する
      - パートナーシップの取り組みを含め、組織の変更への取り組み方を設計する
      - 大規模な変更が人に与える影響とリスクについて、取締役会に助言する
hr-people-strategy:
  name: 人事戦略と人事のリーダーシップ
  description: 組織の人事戦略を定め、人事機能を率い、文化、人員、雇用リスクについて取締役会に助言する。
  levels:
    awareness: |
      できること:
      - 組織の人事戦略と、自分の仕事がそれをどう支えるかを説明する
    working: |
      できること:
      - 明確な対応と指標を示して、サービスの人事計画に貢献する
      - 人事計画に対する進捗を報告する
    practitioner: |
      できること:
      - 人事戦略に沿って、ディレクトレートの人事計画を書き、主導する
      - 人に関するリスクと優先事項について、シニアリーダーに助言する
      - 人事機能の一部を率い、その基準と優先事項を定める
    expert: |
      できること:
      - 組織の人事戦略を定め、人事機能を率いる
      - 文化、人員、雇用リスクについて、取締役会に助言する
      - 人に関する事柄で、パートナーや規制当局に対して組織を代表する
