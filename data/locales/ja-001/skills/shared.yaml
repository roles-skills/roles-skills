# data/skills/shared.yaml の日本語訳。キーは英語のスキル id。
health-care-context:
  name: 保健・ケアサービスの理解
  description: 保健・ケアサービスがどのように組織され提供されているか、臨床医とケア職員がどう働くか、デジタルサービスが患者のケアをどう支えるかを理解する。
  levels:
    awareness: |
      できること:
      - 保健・ケアのシステムの主な部分と、組織が支えるサービスを説明する
      - 自分の仕事で、患者の安全と秘密保持が重要な理由を説明する
    working: |
      できること:
      - 自分の仕事が支える臨床・ケアのワークフローを説明する
      - 臨床・ケアの同僚と、一般的な医療用語を正しく使う
      - 変更が患者のケアにいつ影響しうるかを見分けて伝える
    practitioner: |
      できること:
      - サービスが組織間のケアパスにどう収まるかを分析する
      - 臨床医、ケア職員、患者と協力して、デジタルサービスを形づくる
      - デジタルに関する決定が、ケア、安全、職員の業務量に与える影響を説明する
    expert: |
      できること:
      - 保健・ケアのシステムへの深い理解にもとづいて、組織の戦略を形づくる
      - 保健・ケアのパートナーやリーダーに対して組織を代表する
      - 政策やサービスの変更が、デジタルサービスとケアにどう影響するかを予測する
clinical-safety:
  name: 臨床リスク管理
  description: 臨床リスク管理プロセス、ハザードログ、安全ケース(たとえば ISO 14971 や IEC 80001-1 に従う)を通じて、医療 IT システムが患者にもたらしうるリスクを特定し、評価し、管理する。
  levels:
    awareness: |
      できること:
      - 誤った、欠けた、または遅れた情報などを通じて、医療 IT システムがどう患者に害を及ぼしうるかを説明する
      - 臨床安全上の問題の可能性を、適切な経路で報告する
    working: |
      できること:
      - ハザードのワークショップに参加し、ハザードログに寄与する
      - 自分の仕事のために、臨床リスク管理プロセスに従う
      - テスト結果など、臨床安全ケースのための根拠を提供する
    practitioner: |
      できること:
      - プロダクトや変更のハザード特定とリスク評価を主導する
      - ハザードログと臨床安全ケース報告書を書き、維持する
      - プロダクトチームとリスクの管理策に合意し、それが機能しているかを確認する
      - 臨床リスク管理の基準の適用について、チームに助言する
    expert: |
      できること:
      - 組織の臨床リスク管理システムを所有する
      - 臨床安全の方針を定め、主要なシステムの安全ケースを保証する
      - 医療 IT に関わる重大な安全インシデントへの対応を主導する
      - デジタルチーム全体に臨床安全の文化を築く
health-data-interoperability:
  name: 医療データの相互運用性
  description: HL7 FHIR、HL7 バージョン 2、IHE プロファイル、標準 API などのオープンな標準を用いて、システム間で保健・ケアのデータを安全かつ一貫してやりとりする。
  levels:
    awareness: |
      できること:
      - 相互運用性が連携したケアにとって重要な理由を説明する
      - HL7 FHIR など、主な医療データ交換標準の名前を挙げる
    working: |
      できること:
      - FHIR のリソース、プロファイル、API を読み、使う
      - 指導を受けながら、簡単な連携を構築またはテストする
      - メッセージを仕様に照らして確認する
    practitioner: |
      できること:
      - FHIR、HL7 バージョン 2、メッセージングパターンを使って連携を設計し、構築する
      - FHIR リソースと実装ガイドを書き、プロファイル化する
      - システム間の複雑なマッピングやデータ品質の問題を解決する
    expert: |
      できること:
      - 組織の相互運用性の標準と戦略を定める
      - 国や組織を横断する標準化の取り組みを主導する
      - 多数のシステムにまたがる重要な連携の設計を保証する
clinical-terminology:
  name: 臨床用語と分類
  description: SNOMED CT、ICD、LOINC などの臨床用語集と分類を用いて、臨床上の意味を一貫して記録し、交換する。
  levels:
    awareness: |
      できること:
      - 臨床用語集と分類の違いを説明する
      - SNOMED CT や ICD など、一般的な用語集を見分ける
    working: |
      できること:
      - データ項目やフォームに適切なコードを見つけて使う
      - 用語ブラウザとリファレンスセットを使う
    practitioner: |
      できること:
      - 臨床用語集を使って、データモデルとリファレンスセットを設計する
      - 用語集や分類の間をマッピングし、マッピングの限界を説明する
      - プロダクトや分析での用語集の使い方について、チームに助言する
    expert: |
      できること:
      - 組織の用語集に関する方針を定める
      - 用語集のリリース、ガバナンス、品質保証を主導する
      - 用語標準化団体で組織を代表する
information-governance:
  name: 情報ガバナンスとデータ保護
  description: データ保護法、秘密保持、同意、データ保護影響評価、情報共有を含め、個人情報と健康情報を適法、安全、倫理的に扱う。
  levels:
    awareness: |
      できること:
      - 個人情報と健康情報の取り扱いに関する組織の規則に従う
      - データ侵害やヒヤリハットを見分けて報告する
    working: |
      できること:
      - データ保護の原則を自分の仕事に適用する
      - データ保護影響評価に寄与する
      - 情報の請求と記録を正しく扱う
    practitioner: |
      できること:
      - データ保護影響評価と情報共有契約を主導する
      - 適法な根拠、同意、秘密保持、保存について、チームに助言する
      - インシデントを調査し、改善を勧告する
    expert: |
      できること:
      - 情報ガバナンスの方針と戦略を定める
      - 情報リスクとコンプライアンスについて、取締役会に助言する
      - 規制当局やパートナーに対して組織を代表する
medical-device-regulation:
  name: 医療機器ソフトウェアの規制
  description: ソフトウェアがいつ医療機器にあたるか、またそれに適用される IEC 62304 や ISO 13485 などの標準とプロセスを理解する。
  levels:
    awareness: |
      できること:
      - 一部の医療ソフトウェアが医療機器として規制されることを説明する
      - 製品が医療機器にあたるかもしれないとき、誰に尋ねればよいかを知っている
    working: |
      できること:
      - 医療機器の標準を満たすソフトウェアライフサイクルのプロセスに従う
      - そのプロセスが必要とする記録を作成する
    practitioner: |
      できること:
      - 製品が医療機器かどうか、またその可能性の高いクラスを評価する
      - 品質および臨床の同僚とともに、製品の規制対応の作業を計画する
    expert: |
      できること:
      - 規制対象ソフトウェアに対する組織の取り組み方を定める
      - 規制当局や認証機関との対応を主導する
people-management:
  name: ピープルマネジメント
  description: 採用、目標、評価、心身の健康、勤怠を含め、職員を率い、育成し、支援し、実績と行為を公正に管理する。
  levels:
    awareness: |
      できること:
      - 自分に影響する組織の人事方針を説明する
      - 新しい同僚を支え、知識を共有する
    working: |
      できること:
      - 日々の業務を監督し、フィードバックを与える
      - 採用と導入研修に参加する
      - 定期的に 1 対 1 の対話を行う
    practitioner: |
      できること:
      - 目標を設定し、評価を行いながら、チームをライン管理する
      - 心身の健康を支え、勤怠、実績、行為を管理する
      - チームの育成と後継者計画を立てる
    expert: |
      できること:
      - マネージャーを率い、大きな領域の文化を形づくる
      - 人員計画と組織変更を設計する
      - リーダーをコーチし、複雑な人の問題を解決する
equality-diversity-inclusion:
  name: 平等、多様性、包摂
  description: 人を公正に扱い、違いを尊重し、すべての人を包摂するサービスと職場を設計する。
  levels:
    awareness: |
      できること:
      - 同僚、患者、市民を、尊厳と敬意をもって扱う
      - 平等と包摂の方針に従う
    working: |
      できること:
      - 他の人を排除する行動を見分けて、異議を唱える
      - 仕事を計画するときに、異なるニーズを考慮する
    practitioner: |
      できること:
      - 平等への影響評価を実施する
      - 包摂的なチームと実践を築く
    expert: |
      できること:
      - 包摂の戦略を定め、組織にその責任を果たさせる
      - 平等、多様性、包摂に関する文化の変革を主導する
health-safety-wellbeing:
  name: 健康、安全、ウェルビーイング
  description: リスク評価、安全な作業方法、インシデント報告を含め、職場で自分と他の人の安全と健康を守る。
  levels:
    awareness: |
      できること:
      - 健康と安全の規則に従い、ハザードとインシデントを報告する
    working: |
      できること:
      - ワークステーション評価など、簡単なリスク評価を行う
      - 同僚が安全に働けるよう手助けする
    practitioner: |
      できること:
      - チームまたは拠点の健康と安全を管理する
      - インシデントを調査し、管理策を導入する
    expert: |
      できること:
      - 組織の健康、安全、ウェルビーイングの方針を定める
      - 安全面の実績を取締役会に報告する
budget-management:
  name: 予算管理
  description: 予測、差異の管理、財務規則の順守を含め、予算を計画し、監視し、統制する。
  levels:
    awareness: |
      できること:
      - 支出と発注の規則に従う
      - 自分の仕事の資金がどこから来るかを説明する
    working: |
      できること:
      - 小さな予算に対する支出を追跡し、差異を伝える
      - 自分の限度内で支出を承認する
    practitioner: |
      できること:
      - 予算を保有して管理し、差異を予測して説明する
      - コストと便益を示したビジネスケースを作成する
    expert: |
      できること:
      - 大きな、または複数の予算を管理し、財務計画を定める
      - サービス間で資金のトレードオフを行う
project-management:
  name: プロジェクトマネジメント
  description: PRINCE2、PM²、アジャイルの手法など、認められた手法を使って、合意された範囲、期間、コスト、品質でプロジェクトを計画し、提供し、完了する。
  levels:
    awareness: |
      できること:
      - プロジェクトの段階と、その中の主なロールを説明する
      - アクションログなどのプロジェクトの記録を保管する
    working: |
      できること:
      - 計画、リスク・課題ログ、報告書を維持する
      - プロジェクト会議を運営し、アクションを追跡する
      - 支援を受けて、小さく明確に定義されたプロジェクトを管理する
    practitioner: |
      できること:
      - 範囲、期間、コスト、品質を管理しながら、開始から完了までプロジェクトを管理する
      - リスク、課題、依存関係、変更管理を行う
      - プロジェクト委員会に報告し、供給者を管理する
    expert: |
      できること:
      - 大規模、複雑、またはリスクの高いプロジェクトを管理する
      - プロジェクトマネジメントの基準を定め、プロジェクトマネージャーをコーチする
      - 行き詰まったプロジェクトを立て直す
risk-management:
  name: 組織のリスクマネジメント
  description: リスク登録簿と定められたリスク選好を使って、組織の目標に対するリスクを特定し、評価し、記録し、管理する。
  levels:
    awareness: |
      できること:
      - リスクとは何か、どう提起するかを説明する
    working: |
      できること:
      - 自分の領域のリスクを記録し、更新する
      - 管理策を提案し、対応を追跡する
    practitioner: |
      できること:
      - ディレクトレートまたはプログラムのリスクプロセスを運営する
      - リスクをリスク選好に照らして評価し、エスカレーションする
      - リスクを委員会に報告する
    expert: |
      できること:
      - 組織のリスクマネジメントの枠組みとリスク選好を設計する
      - 戦略的リスクについて、取締役会に助言する
security-operations:
  name: セキュリティ運用
  description: SIEM やエンドポイント検知などのツールを使って、セキュリティの脅威がないかシステムを監視し、アラートをトリアージし、イベントを調査し、サイバーインシデントに対応する。
  levels:
    awareness: |
      できること:
      - フィッシングやランサムウェアなど、一般的なサイバー脅威を説明する
      - セキュリティイベントの疑いを報告する
    working: |
      できること:
      - アラートを監視し、ランブックを使ってトリアージする
      - 証拠を集め、イベントをエスカレーションする
      - 指導を受けながら、簡単な検知ルールを調整する
    practitioner: |
      できること:
      - セキュリティインシデントを調査し、封じ込める
      - 検知ルールを書き、脅威ハンティングを行う
      - インシデントの後に、ランブックとツールを改善する
    expert: |
      できること:
      - セキュリティ運用サービスとその戦略を率いる
      - 大規模なサイバーインシデントへの対応を主導する
      - 国のセキュリティ機関やパートナーと協力する
vulnerability-management:
  name: 脆弱性管理
  description: スキャン、ペネトレーションテスト、パッチ適用を含め、技術的な脆弱性を見つけ、評価し、優先順位をつけ、修正する。
  levels:
    awareness: |
      できること:
      - 迅速なパッチ適用と安全な設定が重要な理由を説明する
    working: |
      できること:
      - 脆弱性スキャンを実行し、結果を報告する
      - システムのオーナーとともに修正を追跡する
    practitioner: |
      できること:
      - 患者サービスへのリスクを含め、リスクで脆弱性に優先順位をつける
      - ペネトレーションテストと是正の範囲を定め、管理する
    expert: |
      できること:
      - 脆弱性管理の方針とその目標を定める
      - 技術的なセキュリティリスクを、シニアリーダーに報告する
identity-and-access-management:
  name: アイデンティティとアクセスの管理
  description: ロールベースのアクセス制御や、スマートカード、多要素認証を含め、職員、患者、システムのデジタルアイデンティティ、認証、アクセス権を管理する。
  levels:
    awareness: |
      できること:
      - アクセスの規則に従い、自分の認証情報を守る
    working: |
      できること:
      - ユーザーアカウントとアクセス権を作成、変更、削除する
      - アクセスをロールベースのアクセス規則に照らして確認する
    practitioner: |
      できること:
      - アイデンティティとアクセスのサービスを設計し、運営する
      - アクセスを定期的にレビューし、問題を修正する
    expert: |
      できること:
      - 職員、患者、システムのアイデンティティとアクセスの戦略を定める
      - 新しいアイデンティティ標準の導入を主導する
data-quality:
  name: データ品質管理
  description: 完全性、正確性、適時性、妥当性を含め、データの品質を定義し、測定し、改善する。
  levels:
    awareness: |
      できること:
      - 正確な医療データが、ケアと計画にとって重要な理由を説明する
      - データを正確に記録し、誤りを報告する
    working: |
      できること:
      - データ品質のチェックを実行し、誤りを訂正する
      - データ品質の報告を同僚に説明する
    practitioner: |
      できること:
      - データ品質の規則と指標を定義する
      - データ提供元と協力して、品質低下の根本原因を修正する
    expert: |
      できること:
      - 組織とそのパートナーのデータ品質の基準を定める
      - データ品質の改善プログラムを主導する
health-records-management:
  name: 診療記録の管理
  description: 作成、ファイリング、追跡、アクセス、保存、廃棄を含め、保健・ケアの記録をライフサイクル全体にわたって管理する。
  levels:
    awareness: |
      できること:
      - 記録を正しくファイリングし、探し、追跡する
      - 記録を紛失や無権限のアクセスから守る
    working: |
      できること:
      - 記録へのアクセス請求を処理する
      - 保存期間表と記録管理の基準を適用する
    practitioner: |
      できること:
      - 記録サービスとその手順を管理する
      - 記録の管理を監査し、職員を研修する
    expert: |
      できること:
      - 記録管理の方針と戦略を定める
      - 紙の記録からデジタルの記録への移行を主導する
clinical-coding:
  name: 臨床コーディング
  description: ケア、支払い、統計のために、国内および国際的なコーディング規則に従って、診療記録の臨床情報を標準の分類コードに変換する。
  levels:
    awareness: |
      できること:
      - 臨床コーディングとは何か、それが重要な理由を説明する
      - 基本的な医学用語と解剖学を使う
    working: |
      できること:
      - 分類規則を使って、単純なエピソードを正確にコード化する
      - 不明確な記録について臨床医に問い合わせる
    practitioner: |
      できること:
      - 診療科にまたがる複雑なエピソードをコード化する
      - コーディングの品質を監査し、コーダーを研修する
    expert: |
      できること:
      - コーディングサービスとその品質プログラムを率いる
      - コーディング標準と、それがデータと資金に与える影響について助言する
clinical-leadership-in-digital:
  name: デジタルにおける臨床リーダーシップ
  description: 安全なデジタルサービスの設計、導入、利用に、臨床の知識と信頼性をもたらし、デジタルの変化を通じて臨床医を導く。
  levels:
    awareness: |
      できること:
      - デジタルサービスが臨床実践をどう変えるかを説明する
    working: |
      できること:
      - ワークフローと安全性について、プロダクトチームに臨床上の意見を述べる
      - 臨床の同僚が新しいシステムを導入するのを手助けする
    practitioner: |
      できること:
      - プロダクトまたはプログラムの臨床エンゲージメントを主導する
      - 臨床上のニーズと根拠を要件に変える
      - 臨床の仲間のあいだで、安全な導入を後押しする
    expert: |
      できること:
      - 組織のデジタルサービスの臨床上の方向性を定める
      - デジタルの変化を通じて、組織を横断して臨床リーダーを率いる
      - デジタル投資の臨床リスクと便益について、取締役会に助言する
governance-and-compliance:
  name: コーポレートガバナンスとコンプライアンス
  description: 取締役会、委員会、議事規則、方針、利益相反の申告、法的・規制上の義務の遵守など、組織のガバナンスを支援する。
  levels:
    awareness: |
      できること:
      - 組織の方針と意思決定の規則に従う
    working: |
      できること:
      - 委員会の会議、資料、議事録を支援する
      - ガバナンスの台帳を最新に保つ
    practitioner: |
      できること:
      - 取締役会と委員会のガバナンスサイクルを運営する
      - 方針をレビューし、コンプライアンスについて助言する
    expert: |
      できること:
      - ガバナンスの枠組みを設計し、取締役会に助言する
      - 年次のガバナンス報告と保証を主導する
