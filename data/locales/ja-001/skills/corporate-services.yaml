# data/skills/corporate-services.yaml の日本語訳。キーは英語のスキル id。
corp-administration:
  name: 事務管理
  description: ファイリング、発注、データ入力、記録、事務手順の順守など、チームやサービスを動かし続ける事務プロセスを運営する。
  levels:
    awareness: |
      できること:
      - ファイリング、発注、データ入力のための事務手順に従う
      - 自分の仕事の正確な記録を残す
    working: |
      できること:
      - 少ない監督で、チームのためにさまざまな事務プロセスを運営する
      - 記録やデータの誤りを見つけて直す
      - より簡単な仕事の進め方を提案する
    practitioner: |
      できること:
      - サービスまたはディレクトレートの事務支援を組織する
      - 事務手順を書き、改善する
      - 他の事務担当者を研修し、その仕事を確認する
    expert: |
      できること:
      - 組織全体の事務サービスを設計する
      - より簡単でデジタルな事務プロセスへの移行を主導する
corp-office-software:
  name: デジタルオフィスツール
  description: ワープロ、表計算、プレゼンテーション、メール、共有ドキュメント、コラボレーションツールを、速く正確に使う。
  levels:
    awareness: |
      できること:
      - 文書、メール、簡単な表計算を作成して編集する
      - ファイルを適切な場所に保存して共有する
    working: |
      できること:
      - 整った書式の文書やプレゼンテーションを、速く正確に作成する
      - 表計算でデータの並べ替え、絞り込み、集計を行う
      - コラボレーションツールで、共有ドキュメントとそのバージョンを管理する
    practitioner: |
      できること:
      - テンプレート、トラッカー、簡単な自動化ワークフローを作る
      - 文書を誰にとってもアクセスしやすいものにする
      - 同僚がオフィスツールを最大限に活用できるよう手助けする
    expert: |
      できること:
      - テンプレート、文書管理、コラボレーションツールの基準を定める
      - 新しいオフィスツールの組織全体での導入を主導する
corp-diary-and-meeting-management:
  name: スケジュールと会議の管理
  description: 人の時間が有効に使われ、会議に適切な人、資料、会議室がそろうように、スケジュール、会議、出張を管理する。
  levels:
    awareness: |
      できること:
      - 組織のツールで会議と会議室を予約する
      - 招待状と資料を期限までに送る
    working: |
      できること:
      - チームのスケジュールを管理し、重複を解消する
      - 外部のパートナーとの出張、イベント、会議を手配する
      - 会議の前に資料とアクションの準備を整える
    practitioner: |
      できること:
      - シニアリーダーのスケジュールを、本人と優先順位を決めながら管理する
      - 本人の時間が必要なものと、他の人が対応できるものを判断する
      - 取締役会やリーダーシップチームの年間の会議サイクルを計画する
    expert: |
      できること:
      - 経営陣の業務サイクルを運営する
      - シニアリーダーの時間が組織の優先事項に集中するようにする
corp-minute-taking:
  name: 議事録と会議記録
  description: 議論、決定、アクションを正確かつ簡潔に記録し、正式な会議記録を保管する。
  levels:
    awareness: |
      できること:
      - チーム会議のアクションと決定をメモする
    working: |
      できること:
      - 定例会議の正確で簡潔な議事録とアクションログを書く
      - アクションの担当者に対応状況を確認する
    practitioner: |
      できること:
      - 複雑または議論を呼ぶ議論を含め、取締役会や委員会の正式な議事録を取る
      - 監査や調査に耐える正式な会議記録を保管する
      - 記録に何を示すべきかを議長に助言する
    expert: |
      できること:
      - 組織全体の正式な会議記録の基準を定める
      - 議事録担当者を研修し、品質を確認する
corp-correspondence-management:
  name: 書簡と問い合わせの対応
  description: 手紙、メール、電話、問い合わせに迅速かつ丁寧に対応し、適切な担当者に回す。
  levels:
    awareness: |
      できること:
      - 電話とメールに丁寧に応対し、伝言を正確に取る
      - 問い合わせを適切な担当者に回す
    working: |
      できること:
      - 定型的な書簡と問い合わせに自分で対応する
      - 他の人が署名するための手紙と返信を作成する
      - 書簡のログをつけ、返信を催促する
    practitioner: |
      できること:
      - 機微なものや苦情の手紙を含め、シニアリーダーの書簡を管理する
      - 配慮、正確さ、判断を要する返信を作成する
      - 返信が期限を守るようにする
    expert: |
      できること:
      - 経営陣宛ての書簡のプロセスと基準を定める
      - 規制当局、パートナー、メディアとのものを含め、最も機微な書簡に対応する
corp-pmo-reporting:
  name: プロジェクト・ポートフォリオ事務局の支援
  description: 計画、台帳、報告、文書管理、保証の確認など、プロジェクトおよびポートフォリオ事務局のプロセスを運営する。
  levels:
    awareness: |
      できること:
      - プロジェクトの文書を、バージョン管理のもと適切な場所に保管する
      - 依頼に応じて、アクション、リスク、課題のログを更新する
    working: |
      できること:
      - 複数のプロジェクトの計画、台帳、トラッカーを維持する
      - 更新を集め、定期的な状況報告を作成する
      - プロジェクトが合意された手法に従っているかを確認する
    practitioner: |
      できること:
      - ポートフォリオの報告を設計し、プロジェクト全体の進捗、リスク、便益を分析する
      - 保証の確認とゲートウェイレビューを実施する
      - 手法と管理策について、プロジェクトマネージャーに助言する
    expert: |
      できること:
      - 組織のポートフォリオ事務局を立ち上げ、率いる
      - ポートフォリオについて、明確で信頼できる洞察をシニアリーダーに提供する
      - プロジェクトおよびポートフォリオ管理の基準とツールを定める
corp-assurance-and-audit:
  name: 保証と監査の窓口
  description: 管理策が機能している保証を集め、内部・外部監査を支援し、監査の勧告を完了まで追跡する。
  levels:
    awareness: |
      できること:
      - 組織で監査と保証がどう行われるかを説明する
      - 求められたときに根拠を提供する
    working: |
      できること:
      - 監査や検査のための根拠を調整する
      - 監査の勧告を追跡し、期限を過ぎたアクションを催促する
    practitioner: |
      できること:
      - 組織の主なリスクにわたる保証マップを計画する
      - 内部および外部の監査人と協力して、範囲と所見に合意する
      - 保証のギャップを委員会に報告する
    expert: |
      できること:
      - 組織の保証の枠組みを設計する
      - 保証の強さについて、監査委員会と取締役会に助言する
corp-policy-management:
  name: 方針の管理
  description: 組織の方針と手順を作成し、レビューし、承認し、公開し、人々がそれに従っているかを確認する。
  levels:
    awareness: |
      できること:
      - 自分の仕事に適用される方針を見つけて従う
    working: |
      できること:
      - 方針台帳を最新に保ち、オーナーにレビューを促す
      - 方針が正しいテンプレートと承認経路を使っているかを確認する
    practitioner: |
      できること:
      - 分野の専門家とともに方針を起草し、レビューする
      - 方針を法律、標準、平等義務に照らして確認する
      - 遵守状況を監視し、ギャップを報告する
    expert: |
      できること:
      - 組織の方針の枠組みを定める
      - 方針の優先事項とリスクについて、取締役会に助言する
corp-internal-communications:
  name: 社内コミュニケーション
  description: イントラネット、ニュースレター、ブリーフィング、イベントなどのチャネルを通じて、特に変化の時期に、職員に情報を伝え、関与を保つ。
  levels:
    awareness: |
      できること:
      - イントラネットなどの社内チャネルにコンテンツを公開する
      - 組織のスタイルとトーンオブボイスに従う
    working: |
      できること:
      - 職員向けのニュース、ブリーフィング、ニュースレターを書いて編集する
      - 社内チャネルのコンテンツを計画し、エンゲージメントを測定する
    practitioner: |
      できること:
      - 新しい臨床システムなど、大きな変化のための社内コミュニケーションを計画する
      - 職員との関わり方と、難しいメッセージの伝え方について、リーダーに助言する
      - フィードバックとデータを使ってチャネルを改善する
    expert: |
      できること:
      - 社内コミュニケーションと職員エンゲージメントの戦略を定める
      - 文化とエンゲージメントについて、経営陣に助言する
corp-media-relations:
  name: メディアリレーションズ
  description: 記者との関係を築き、メディアからの問い合わせに対応し、プレスリリースを書き、インシデント時を含めて広報担当者を準備する。
  levels:
    awareness: |
      できること:
      - 組織がメディアからの問い合わせをどう扱うかを説明する
      - メディアからの問い合わせをすぐにコミュニケーションチームに回す
    working: |
      できること:
      - 定型的なメディアからの問い合わせを記録し、対応する
      - 承認のためにプレスリリースと声明を作成する
      - メディアの報道を監視する
    practitioner: |
      できること:
      - インシデントやデータ侵害に関するものを含め、機微で受け身のメディアからの問い合わせに対応する
      - 広報担当者に説明し、準備させる
      - 健康・テクノロジー分野の記者との関係を築く
    expert: |
      できること:
      - 大規模なインシデントや危機の際のメディア対応を主導する
      - シニアなステークホルダーに対して、組織の評判を守り、高める
      - 評判リスクについて取締役会に助言する
corp-communications-strategy:
  name: コミュニケーションの戦略と計画
  description: 組織の目標に合ったコミュニケーションとキャンペーンを、受け手についての洞察を使って計画し、その効果を評価する。
  levels:
    awareness: |
      できること:
      - 自分が関わっているコミュニケーション計画の目的を説明する
    working: |
      できること:
      - 受け手、メッセージ、チャネルを示した、プロジェクトのコミュニケーション計画を書く
      - コミュニケーション活動の結果を測定する
    practitioner: |
      できること:
      - 患者にデジタルサービスの利用を促すなど、行動を変えるキャンペーンを計画する
      - 受け手の洞察と評価を使って、キャンペーンを改善する
      - インシデントやサービス停止のためのコミュニケーションを計画する
    expert: |
      できること:
      - 組織のコミュニケーション戦略を定める
      - 危機時のコミュニケーションを主導する
      - 評判とステークホルダーとの関わりについて、取締役会に助言する
corp-digital-and-social-media:
  name: デジタルおよびソーシャルメディア
  description: ウェブサイトとソーシャルメディアのコンテンツを計画し、公開し、管理し、受け手と関わり、その結果を測定する。
  levels:
    awareness: |
      できること:
      - 承認されたコンテンツを組織のチャネルに公開する
      - ソーシャルメディア方針に従う
    working: |
      できること:
      - ウェブサイトとソーシャルメディアのコンテンツを計画し、公開する
      - コメントに返信し、エスカレーションが必要な問題を見つける
      - チャネルの成果を報告する
    practitioner: |
      できること:
      - 組織のデジタルチャネルとそのコンテンツ計画を管理する
      - インシデント時を含め、否定的または誤解を招く投稿に対応する
      - アナリティクスを使って、到達とエンゲージメントを改善する
    expert: |
      できること:
      - 組織のデジタルチャネルの戦略とガバナンスを定める
      - オンライン上の評判リスクへの対応を主導する
