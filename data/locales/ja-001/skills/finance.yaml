# data/skills/finance.yaml の日本語訳。キーは英語のスキル id。
fin-financial-transactions:
  name: 財務取引と元帳
  description: 財務統制に従って、請求書、支払い、入金、仕訳、照合を元帳に正確に処理し、記録する。
  levels:
    awareness: |
      できること:
      - 購買から支払い、受注から入金のプロセスと、そこでの自分の役割を説明する
      - 定められた手順に従って、請求書、入金、支払いを正確に入力する
      - 取引に適切な承認と裏づけの書類があるかを確認する
    working: |
      できること:
      - クレジットノート、返金、仕訳を含むさまざまな取引を処理する
      - 仕入先の残高明細、銀行口座、統制勘定を照合する
      - 仕入先、顧客、予算責任者からの定型的な問い合わせを解決する
      - 重複、異常、無承認の取引を見つけて報告する
    practitioner: |
      できること:
      - 元帳または取引プロセスを管理し、正確で最新の状態に保つ
      - 複雑な照合差異と滞留残高を調査して解消する
      - 照合や承認の自動化などで取引プロセスを改善する
      - 他の職員を研修し、その仕事を確認する
    expert: |
      できること:
      - 組織の取引プロセスとその中の統制を設計する
      - 支払い期間や債権回収の目標など、業績基準を定める
      - 自動化やセルフサービスなど、新しい処理方法への移行を主導する
      - 元帳が完全で正確であることを、シニアリーダーと監査人に保証する
fin-financial-reporting:
  name: 財務報告と法定決算
  description: 適用される会計基準と公的部門の報告規則に従って、正確な財務諸表と法定の報告書を作成する。
  levels:
    awareness: |
      できること:
      - 主な財務諸表の目的を説明する
      - 月次・年次の決算を支える作業ペーパーと照合を作成する
    working: |
      できること:
      - 未払費用、前払費用、引当金など、月次・年次の決算仕訳を作成する
      - 年次決算書の一部と裏づけとなる注記を作成する
      - ソフトウェアやハードウェアの資産計上など、定型的な取引に会計基準を適用する
    practitioner: |
      できること:
      - スケジュールに沿って年次決算書と法定の報告書を作成する
      - リース、クラウドコンピューティングの契約、無形資産など、複雑な領域に会計基準を適用する
      - 判断と見積りを説明する会計ペーパーを書く
      - 決算書の外部監査を管理し、指摘に対応する
    expert: |
      できること:
      - 組織の年次報告書と決算書、およびその基礎となる会計方針を所有する
      - 重要な判断と新しい基準について、取締役会と監査委員会に助言する
      - 限定付き監査意見や重要な虚偽表示への対応を主導する
      - 報告が公的な説明責任の規則を満たしていることを保証する
fin-management-accounting:
  name: 管理会計
  description: 差異分析、原価計算、業績報告を含め、管理者が計画し、統制し、意思決定をするのに役立つ予算と原価の情報を作成する。
  levels:
    awareness: |
      できること:
      - 予算、実績、コミットメント、差異を説明する
      - 財務システムから標準の予算報告を作成する
    working: |
      できること:
      - 月次の予算報告を作成し、主な差異を説明する
      - 原価を、コストセンター、プロジェクト、資本的支出と収益的支出の間で正しくコーディングする
      - 予算責任者が自分の予算を理解し管理するのを支援する
    practitioner: |
      できること:
      - ディレクトレートまたはプログラムの月次報告サイクルを管理する
      - デジタルサービスの総コストや取引の単位コストなど、コストモデルを構築する
      - 支出の傾向を分析し、予算内に収めるための対応を管理者に助言する
      - 予算責任者の見通しに建設的に異議を唱える
    expert: |
      できること:
      - 組織の管理報告と原価計算の取り組み方を設計する
      - 財務実績を取締役会とシニアリーダーに発表する
      - コストと業績の情報を使って、費用対効果の向上を主導する
      - 組織全体の管理会計の基準を定める
fin-financial-planning-and-forecasting:
  name: 財務計画と予測
  description: 資金を組織の優先事項やプログラムに結びつける、予算、予測、中期財務計画を作成する。
  levels:
    awareness: |
      できること:
      - 年次の予算編成サイクルと、予算と予測の違いを説明する
      - 予算責任者から予測情報を集める
    working: |
      できること:
      - 人件費を含め、コストセンターやプロジェクトの予算と予測を作成する
      - 既知の変化とリスクを反映して、毎月予測を更新する
      - 支出の推移が提供計画に合うよう、予算を期間配分する
    practitioner: |
      できること:
      - ディレクトレートまたは大規模プログラムの予算編成と予測を主導する
      - インフレ、遅延、資金の変更などのシナリオと感度をモデル化する
      - 投資後のランニングコストを含め、デジタルプログラムの複数年の予測を作成する
      - 予測とリスクをシニアマネージャーに発表する
    expert: |
      できること:
      - 組織の中期財務計画を主導する
      - 財務計画を、戦略、人員計画、投資計画と整合させる
      - 財務の持続可能性と、資金内に収めるために必要な選択について、取締役会に助言する
      - 組織全体で使う計画の前提と手法を定める
fin-payroll:
  name: 給与
  description: 新規入社、退職、変更、控除、年金、法定の支払い、給与報告を含め、職員に正確かつ期限どおりに給与を支払う。
  levels:
    awareness: |
      できること:
      - 変更と締め切りから支払いと報告までの給与サイクルを説明する
      - 承認された書式から、新規入社、退職、変更を正確に入力する
      - 給与情報を秘密に保ちながら、定型的な給与の問い合わせに答える
    working: |
      できること:
      - 給与、手当、時間外、病気休暇、家族休暇の支払いを計算する
      - 税、年金、その他の控除を正しく適用する
      - 給与の出力を確認し、支払い前に誤りを訂正する
      - 過払いを、配慮しつつ方針に沿って回収する
    practitioner: |
      できること:
      - 職員グループの給与全体を処理し、給与チェックを承認する
      - 法定の給与報告と年金の報告を管理する
      - 複数の契約、遡及払い、給与の一部を犠牲にする仕組みなど、複雑なケースを解決する
      - 年次の賃上げやルール変更など、給与システムの変更をテストする
    expert: |
      できること:
      - 自社運営か委託かを問わず、組織の給与サービスを管理する
      - 給与の統制を定め、支払いが正確で適法であることをシニアリーダーに保証する
      - 給与ルール、賃上げ、給与システムの変更に備える
      - 給与の重大な不具合への対応を主導する
fin-treasury-and-cash:
  name: 財務管理と資金管理
  description: 公的部門の資金規則の範囲で、組織が義務を果たせるよう、銀行口座、キャッシュフロー、流動性を管理する。
  levels:
    awareness: |
      できること:
      - 予算に加えて現金が重要な理由を説明する
      - 銀行取引を記録し、照合する
    working: |
      できること:
      - 日次の資金ポジションと短期の資金予測を作成する
      - 支払い実行を準備し、適切に承認されているかを確認する
      - 銀行口座を照合し、不一致の項目を解消する
    practitioner: |
      できること:
      - 組織のキャッシュフロー予測と資金の引出しを管理する
      - 銀行口座、支払い方法、銀行取引の統制を管理する
      - 複数年のソフトウェアライセンスなど、大きなまたは不定期の支払いのための資金を計画する
    expert: |
      できること:
      - 組織の財務管理方針と銀行取引の取り決めを定める
      - 流動性と資金のリスクについて、取締役会に助言する
      - 資金提供者と公的部門の規則が定める限度の範囲で資金を管理する
fin-audit-and-controls:
  name: 財務統制と監査
  description: 財務統制を設計し、運用し、テストし、不正を防止・検知し、内部および外部の監査人と協力する。
  levels:
    awareness: |
      できること:
      - 組織の財務手順と権限委譲の体系に従う
      - 不正や誤りの可能性を示す兆候を見分けて報告する
    working: |
      できること:
      - 職務分掌や仕入先銀行情報の確認など、主要な統制を運用する
      - 監査人に根拠を提供し、質問に答える
      - 支出が適切なレベルで承認されているかを確認する
    practitioner: |
      できること:
      - 財務プロセスの統制をテストし、改善する
      - ある領域の監査依頼を管理し、指摘事項への対応に合意する
      - 財務手順を書き、更新する
      - 不正対策の専門家と協力して、不正のリスクを減らす
    expert: |
      できること:
      - 組織の財務規則と権限委譲の体系を所有する
      - 財務統制と監査対応について、監査委員会に報告する
      - 重大な統制の不備や不正への対応を主導する
      - 職員が公的資金を適切に使う責任を理解する文化を築く
fin-business-cases:
  name: ビジネスケースと投資評価
  description: 選択肢の評価、ライフサイクル全体のコスト、資本的支出と収益的支出の扱い、便益、費用対効果を含め、投資の財務的な根拠を組み立てる。
  levels:
    awareness: |
      できること:
      - ビジネスケースとその財務の節の目的を説明する
      - ビジネスケースのためにコスト情報を集める
    working: |
      できること:
      - 単純なビジネスケースの財務モデルを作成する
      - 資本的支出と収益的支出、一時的なコストと継続的なコストを分ける
      - 稼働後のライセンス、サポート、ホスティングなど、ライフサイクル全体のコストを含める
    practitioner: |
      できること:
      - 新しい臨床システムやクラウドへの移行など、複雑なデジタル投資の財務的な根拠を主導する
      - 正味現在価値、感度分析、リスク調整を使って選択肢を評価する
      - 便益が現実的で、測定可能で、オーナーがいるかを確認する
      - 承認後の支出と便益を追跡する
    expert: |
      できること:
      - 組織のビジネスケースと投資評価の基準を定める
      - 手頃さ、費用対効果、リスクについて、投資委員会に助言する
      - 大規模な投資プログラムについて、資金提供者に根拠を示す
      - 投資のポートフォリオをレビューし、中止、変更、継続を勧告する
fin-tax:
  name: 税務
  description: 売上税、雇用税、その他の税規則を組織の取引に正しく適用し、認められる場合は税を回収する。
  levels:
    awareness: |
      できること:
      - 請求書上の売上税を見分け、正しくコーディングする
      - 税務の専門家に助言を求めるタイミングを説明する
    working: |
      できること:
      - 監督のもとで、納税申告と照合を作成する
      - 一般的な購入と収入に適切な税務上の扱いを適用する
      - 指導を受けながら、請負人の雇用上の地位を確認する
    practitioner: |
      できること:
      - 組織の納税申告と税の照合を管理する
      - ソフトウェアライセンス、クラウドサービス、共有サービスなど、契約の税務上の扱いについて助言する
      - 規則の範囲で税の回収を最大化する
    expert: |
      できること:
      - 組織の税戦略と税務リスクを所有する
      - 複雑な問題について、税務当局との協議を主導する
      - 新たなパートナーシップや取引活動など、大きな変化の税務上の影響を評価する
fin-financial-systems:
  name: 財務システム
  description: 財務データが正確でプロセスが効率的になるよう、財務、調達、給与、報告のシステムを使い、管理し、改善する。
  levels:
    awareness: |
      できること:
      - 手順に従って、自分の業務に財務システムを使う
      - 標準の報告を実行し、データを表計算にエクスポートする
    working: |
      できること:
      - 数式、検索、ピボットテーブルを含め、表計算をうまく使う
      - コストセンター、仕入先、承認者など、財務システムのデータを維持する
      - システムの問題を報告し、修正を手助けする
    practitioner: |
      できること:
      - アクセス、ワークフロー、報告を含め、財務または給与システムを管理する
      - 予算責任者のための報告書とダッシュボードを設計する
      - システムの変更とアップグレードをテストする
      - 繰り返しの多い財務タスクを自動化する
    expert: |
      できること:
      - 財務システムの戦略とロードマップを所有する
      - 財務または給与システムの調達と導入を主導する
      - 財務データを、人員、調達、業績のデータと統合する
fin-public-sector-finance:
  name: 公的部門の財務
  description: 資金の配分、資本的支出と収益的支出の限度、支出の統制、公的資金に対する説明責任、費用対効果を含め、公的資金の仕組みを理解する。
  levels:
    awareness: |
      できること:
      - 組織が公的資金を使っており、それを説明しなければならないことを説明する
      - 資本的支出と収益的支出の違いを説明する
    working: |
      できること:
      - 組織の資本的支出・収益的支出の規則を日常の支出に適用する
      - 資金の配分と支出の限度が自分の領域にどう影響するかを説明する
      - 資金提供者や支出統制の承認が必要な支出を見分ける
    practitioner: |
      できること:
      - 使途が限定された資金や期限付きの資金を含め、資金の規則について管理者に助言する
      - プログラムまたはディレクトレートの資本的支出・収益的支出の限度を管理する
      - 資金提供者と支出統制のための報告書と根拠を作成する
    expert: |
      できること:
      - 資金提供者と監督機関に対して、組織を代表する
      - 規則性、適正性、費用対効果について、取締役会に助言する
      - 組織のサービスのための資金協定と財務制度を形づくる
