# data/skills/clinical-ig.yaml の日本語訳。キーは英語のスキル id。
clin-clinical-systems-optimisation:
  name: 臨床システムの設計と最適化
  description: 電子カルテ、オーダー通信、電子処方などの臨床システムを、臨床のワークフローに合い、安全で効率的なケアを支えるように、設計し、設定し、改善する。
  levels:
    awareness: |
      できること:
      - 電子カルテなどの臨床システムがケアをどう支えるかを説明する
      - システムが支える臨床ワークフローを説明する
    working: |
      できること:
      - 臨床医やケア職員とともに、現在と将来の臨床ワークフローをマッピングする
      - システム設定を臨床シナリオに照らしてテストする
      - プロダクトチームのために、明確な臨床要件を書く
    practitioner: |
      できること:
      - システム設定、フォーム、オーダーセット、意思決定支援の臨床設計を主導する
      - データと利用者のフィードバックを使って、ワークフローの問題を見つけて直す
      - 臨床上の必要、安全性、使いやすさ、システムの制約のバランスをとる
    expert: |
      できること:
      - 組織全体で臨床システムの設計原則と基準を定める
      - ケアと職員の体験を測定可能な形で改善する最適化プログラムを主導する
      - 臨床システムの選択とそのケアへの影響について、シニアリーダーに助言する
clin-human-factors:
  name: 臨床システムにおけるヒューマンファクターとユーザビリティ
  description: ヒューマンファクターとユーザビリティの手法を臨床システムに適用し、臨床医、ケア職員、患者が安全に、できるだけ誤りなく使えるようにする。
  levels:
    awareness: |
      できること:
      - 不十分な設計がケアの誤りにつながりうることを説明する
      - 患者の安全に影響しうるユーザビリティの問題を報告する
    working: |
      できること:
      - ユーザビリティテストや臨床タスクのシミュレーションに参加する
      - 似た見た目の選択肢や隠れたアラートなど、よくある設計上のハザードを見つける
    practitioner: |
      できること:
      - 臨床システムのヒューマンファクター評価を計画し、実施する
      - 調査結果を設計の変更や臨床安全の管理策に変える
      - アラートの負担と、迂回策が生じるリスクを評価する
    expert: |
      できること:
      - デジタルサービスにおけるヒューマンファクターへの組織の取り組み方を定める
      - 高リスクのシステムや変更のヒューマンファクターに関する根拠をレビューする
      - 臨床チームとデジタルチームのヒューマンファクターのスキルを育てる
clin-digital-health-evaluation:
  name: デジタルヘルスの評価と便益
  description: デジタルヘルス技術の評価を計画して実施し、適切な手法と根拠を用いて、その臨床上、安全上、サービス上の便益を測定する。
  levels:
    awareness: |
      できること:
      - デジタルヘルス技術に便益と安全性の根拠が必要な理由を説明する
      - ある技術について公表された根拠を見つける
    working: |
      できること:
      - 評価のために、ベースラインとフォローアップのデータを集める
      - システム利用の臨床監査を行う
      - 評価の結果を同僚のために要約する
    practitioner: |
      できること:
      - デジタルヘルス製品の評価と便益計画を設計する
      - 臨床アウトカム、安全性、体験について適切な指標を選ぶ
      - 根拠の強さを判断し、その限界を説明する
    expert: |
      できること:
      - デジタルヘルスの評価に関する組織の取り組み方を定める
      - 学術機関やケアのパートナーとともに、研究・評価プログラムを主導する
      - デジタル投資について、根拠に基づいて取締役会に助言する
clin-professional-practice:
  name: デジタル分野での登録臨床実践
  description: 臨床専門職の基準、倫理、再認証の義務を果たしながら、最新で登録された臨床の知識と判断を、デジタルの仕事に持ち込む。
  levels:
    awareness: |
      できること:
      - 登録臨床医に適用される専門職の基準を説明する
      - 質問がいつ臨床上の意見を必要とするかを見分ける
    working: |
      できること:
      - 自分の実践範囲の中で、臨床の知識をデジタルの仕事に生かす
      - 自分の登録と継続的な専門能力開発を最新に保つ
      - ワークフロー、コンテンツ、安全性について臨床上の意見を述べる
    practitioner: |
      できること:
      - デジタルサービスがケアに与える影響について、確かな臨床判断を下す
      - デジタルの場でも臨床の場でも、安全でない実践に自信を持って異議を唱える
      - 他の臨床医が、専門職の基準をデジタルの仕事に適用するのを支援する
    expert: |
      できること:
      - 組織のデジタルの仕事における臨床の専門職基準を主導する
      - 患者安全とケアに関する意思決定で、臨床のシニアな声となる
      - デジタル職に就く臨床医の再認証と専門能力開発を支援する
ig-information-rights-requests:
  name: 情報に関する権利の請求
  description: 個人や市民からの情報へのアクセス請求(個人の診療記録へのアクセス請求や、組織が保有する情報の請求など)に、法定の期限内に対応する。
  levels:
    awareness: |
      できること:
      - 情報に関する権利の請求を見分けて、速やかに引き継ぐ
      - 請求には法定の期限があることを説明する
    working: |
      できること:
      - 期限を守れるよう、請求を記録し、受領を通知し、追跡する
      - 情報を収集して黒塗りし、確認のための回答案を作成する
      - 請求者の本人確認と権限を確認する
    practitioner: |
      できること:
      - 第三者が関わるものを含め、複雑または機微な請求を処理する
      - 例外を適用し、何を開示しないかを明確な理由とともに判断する
      - 回答に対する内部審査と苦情を管理する
    expert: |
      できること:
      - 組織全体の、情報に関する権利の方針とプロセスを定める
      - 規制当局からの問い合わせや不服申立てへの対応を主導する
      - 業績と傾向を、シニアリーダーに報告する
ig-records-retention:
  name: 記録の保存と廃棄
  description: 紙とデジタルの記録に保存期間表を適用し、適切な時期に、監査証跡とともに、アーカイブまたは安全に廃棄する。
  levels:
    awareness: |
      できること:
      - 記録が一定期間保存された後、廃棄またはアーカイブされる理由を説明する
      - 記録の保管と移動の手順に従う
    working: |
      できること:
      - 記録に保存期間表を適用し、見直しの時期が来たものに印をつける
      - 記録をアーカイブまたは安全な廃棄のために準備し、監査証跡を保つ
    practitioner: |
      できること:
      - 記録サービスの保存・廃棄プログラムを運用する
      - デジタルのものを含む新しい種類の記録の保存について、チームに助言する
      - 保存期間表の遵守状況を監査する
    expert: |
      できること:
      - 組織の保存方針と保存期間表を定める
      - デジタル記録の長期保存を計画する
      - 法的保全や調査など、複雑な保存の問題を解決する
ig-data-protection-impact-assessment:
  name: データ保護影響評価
  description: 個人データや健康データの新規または変更された処理のプライバシーリスクを評価し、処理が始まる前に管理策に合意する。
  levels:
    awareness: |
      できること:
      - データ保護影響評価がいつ必要かを説明する
      - 自分の仕事のためのスクリーニング質問票に記入する
    working: |
      できること:
      - プロジェクトチームがデータ保護影響評価を完成させるのを手伝う
      - データフローを記述し、処理の適法な根拠を特定する
      - プライバシーリスクと提案された管理策を記録する
    practitioner: |
      できること:
      - 複雑なシステムのデータ保護影響評価をレビューし、助言する
      - リスクが許容できるかを判断し、管理策を勧告する
      - 高いリスクを、シニアリーダーや規制当局のレビューにいつエスカレーションするかを決める
    expert: |
      できること:
      - 組織のデータ保護影響評価のプロセスと基準を定める
      - 大規模なデータ共有や AI など、最もリスクの高い処理について最終的な助言を行う
      - 法律が求める場合に、規制当局に相談する
ig-incident-management:
  name: 情報ガバナンスのインシデント管理
  description: データ侵害とヒヤリハットを記録し、調査し、そこから学び、規制当局や影響を受ける人々にいつ知らせるかを判断する。
  levels:
    awareness: |
      できること:
      - データ侵害やヒヤリハットを見分けて、すぐに報告する
    working: |
      できること:
      - インシデントを記録し、事実を集める
      - 組織の深刻度の基準に照らしてインシデントを評価する
      - 完了までの対応を追跡する
    practitioner: |
      できること:
      - 重大なインシデントを調査し、根本原因を見つける
      - シニアの同僚とともに、規制当局や影響を受ける人々に通知するかどうかを決める
      - 教訓を共有し、改善を追跡する
    expert: |
      できること:
      - 情報ガバナンスのインシデント管理のプロセスを定める
      - 規制当局やメディアへの対応を含め、大規模な侵害への対応を主導する
      - インシデントの傾向とリスクを取締役会に報告する
ig-confidentiality-and-sharing:
  name: 秘密保持と情報共有
  description: ケア、安全、または法律が必要とするときに情報が適法に共有されるようにしつつ、患者の秘密情報を守る。情報共有契約を通じた共有を含む。
  levels:
    awareness: |
      できること:
      - 秘密情報を安全に保ち、許可されたときにのみ共有する
      - 確信が持てないときは助言を求める
    working: |
      できること:
      - 情報共有の依頼が方針に合っているかを確認する
      - 何を、誰と、なぜ共有したかの記録をつける
      - 簡単な情報共有契約の案を書く
    practitioner: |
      できること:
      - 公共の利益のための同意なしの共有など、複雑な秘密保持の問題について助言する
      - パートナー組織との情報共有契約をレビューする
      - 同意と患者の異議に関する規則を、データフローに適用する
    expert: |
      できること:
      - 組織の秘密保持に関するシニアアドバイザーを務める
      - 最も難しい開示の判断を解決する
      - パートナーと情報を共有するための枠組みを定める
ig-compliance-assurance:
  name: 情報ガバナンスの保証と監査
  description: 年次の自己評価、監査、根拠、改善計画を通じて、組織が情報ガバナンスの基準を満たしていることを確認し、示す。
  levels:
    awareness: |
      できること:
      - 組織が情報を適切に扱っていることを示さなければならない理由を説明する
      - 求められたときに、監査のための根拠を提供する
    working: |
      できること:
      - 年次の自己評価のための根拠を集めて整理する
      - アクセス監査や記録管理の監査など、簡単な監査を行う
      - 改善のための対応を追跡する
    practitioner: |
      できること:
      - 情報ガバナンスの保証プログラムを計画し、運営する
      - 根拠が基準を満たしているかを判断し、ギャップを特定する
      - 内部および外部の監査人と協力する
    expert: |
      できること:
      - 組織の情報ガバナンス保証の枠組みを所有する
      - 保証とコンプライアンスの状況を、取締役会とその委員会に報告する
      - リスクに基づいて改善の優先順位を定める
