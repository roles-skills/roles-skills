# data/skills/data-testing.yaml の日本語訳。キーは英語のスキル id。
data-ai-assurance:
  name: 医療における安全で公正な AI
  description: 保健・ケアで使われる統計モデル、機械学習モデル、AI モデルが、安全で、公正で、説明可能で、継続的に監視されていることを確かにする。患者集団間のバイアスの確認、医療機器および AI に関する規制への対応を含む。
  levels:
    awareness: |
      できること:
      - モデルがバイアス、ドリフト、出力への過度な依存などを通じて、どのように患者に害を及ぼしうるかを説明する
      - モデルを実際に使う集団で検証する必要がある理由を説明する
    working: |
      できること:
      - 患者集団ごとにモデルの性能を測定し、差があれば報告する
      - モデルカードなどで、モデルの想定用途、学習データ、既知の限界を文書化する
      - モデルに関する根拠を臨床安全ケースに提供する
    practitioner: |
      できること:
      - 臨床の同僚とともに、モデルの検証、バイアス評価、本番での監視を計画する
      - モデルをいつ再学習、制限、撤回する必要があるかを判断する
      - モデルがいつ医療機器として規制されうるか、どのような根拠が必要かをチームに助言する
    expert: |
      できること:
      - ケアにおける AI を保証し、監視するための組織の基準を定める
      - 導入の前後に、高リスクのモデルの保証を主導する
      - 安全で公正な AI について、規制当局やパートナーに対して組織を代表する
data-deidentification:
  name: 仮名化と開示管理
  description: 仮名化、匿名化、少数値の秘匿、その他の統計的開示管理の手法を用いて、データを連結、分析、共有、公表する際に患者の秘密を守る。
  levels:
    awareness: |
      できること:
      - 識別可能なデータ、仮名化されたデータ、匿名化されたデータの違いを説明する
      - 成果物で少数値を秘匿するための組織の規則に従う
    working: |
      できること:
      - 仮名化されたデータを扱い、成果物を公開する前に開示確認を行う
      - 連結された、または詳細なデータが、いつ患者を特定しうるかを見分ける
    practitioner: |
      できること:
      - 識別子を分析用データから切り離しておく、仮名化と連結の手法を設計する
      - データセットや公表物の再識別リスクを評価し、適切な管理策を選ぶ
      - 信頼できる研究環境など、安全な環境についてチームに助言する
    expert: |
      できること:
      - 匿名化と開示管理に関する組織の基準を定める
      - 高リスクのデータ公開や連結プロジェクトを保証する
      - 研究や計画のための安全なデータアクセスについて、パートナーとの取り組みを主導する
