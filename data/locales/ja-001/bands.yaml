# バンドの概要(日本語)。キーは英語のバンド id。
"1":
  title: バンド 1
  stage: 入門
  knowledge: 基本的な読み書きと計算の力。単純な定型業務を実務の中で学ぶ。
  autonomy: 明確な指示に従って働き、仕事は頻繁に確認される。
  scope: 自分の定型業務。
  leadership: なし。
  accountability: 定型業務を正確にやり遂げること。
"2":
  title: バンド 2
  stage: サポート
  knowledge: 担当領域の定型業務と手順を知っている。入門レベルの資格を持つ場合がある。
  autonomy: 定められた手順に従って働き、必要に応じて監督を受けられる。
  scope: チーム内の自分の業務。
  leadership: 新しく入った人に定型業務を教えることがある。
  accountability: 自分の定型業務の品質と期限。
"3":
  title: バンド 3
  stage: サポート
  knowledge: 非定型を含むさまざまな手順の知識。通常はレベル 3 の資格または同等の経験。
  autonomy: 手順の範囲で働き、自分の仕事の進め方を決め、問題は上位に報告する。
  scope: 自分の業務と、チーム全体のための一部の業務。
  leadership: 定型業務を割り振ったり、手順を他の人に教えたりすることがある。
  accountability: 自分の仕事と保管する記録の正確さ。
"4":
  title: バンド 4
  stage: サポートおよび入門実務者
  knowledge: 担当領域の詳細な知識。通常は短期大学相当の学位、アプレンティスシップ、または同等の経験による。
  autonomy: ガイドラインの範囲で働き、日々の問題の大半を解決し、助言を求められる上司がいる。
  scope: 自分の業務と、定められたサービスまたはプロセス。
  leadership: 小さなチームを監督したり、他の人の仕事を調整したりすることがある。
  accountability: 定められたサービスまたはプロセスの提供。
"5":
  title: バンド 5
  stage: 実務者
  knowledge: 専門的または技術的な知識。通常は学位または同等の経験による。
  autonomy: 専門職の基準の範囲で幅広い目標に向けて働き、自分の仕事を計画する。
  scope: チームまたはプロダクト内の自分の専門的な業務。
  leadership: サポート職員やアプレンティスを指導し、その仕事を確認することがある。
  accountability: 自分の専門的な仕事の品質。
"6":
  title: バンド 6
  stage: 経験豊富な実務者
  knowledge: さまざまな手順にわたる専門知識。追加の研修や経験によって培われる。
  autonomy: 自立して働き、自分の領域の方針を解釈し、複雑な問題では助言を求める。
  scope: プロダクト、サービス、またはワークストリーム。
  leadership: 小さなチームを率いたり、同僚をメンターしたりすることがある。
  accountability: 自分のワークストリームの成果と、提供した助言の質。
"7":
  title: バンド 7
  stage: シニアまたは専門職
  knowledge: 高度に発達した専門知識。通常は修士相当または同等の経験による。
  autonomy: 組織の方針に沿って働き、成果の出し方を決め、他の人が相談する専門家である。
  scope: 複数のプロダクトやサービス、または専門機能。
  leadership: チームまたは専門実務の領域を率いる。
  accountability: サービスまたは専門機能の提供と、予算を持つ場合はその予算。
8a:
  title: バンド 8a
  stage: リード
  knowledge: ある分野とそのマネジメントに関する専門的な知識。
  autonomy: サービスのために組織の方針を解釈し、チームの方向性を定める。
  scope: サービス領域、または組織全体にわたる分野。
  leadership: チームを管理する、またはライン管理なしで分野を率いる。
  accountability: サービス領域、その職員、その予算。
8b:
  title: バンド 8b
  stage: リード
  knowledge: 複数の分野または大規模なサービスにわたる専門的な知識。
  autonomy: 大きな領域の方針と戦略を形づくる。
  scope: 複数のサービスやチーム、またはプリンシパルレベルの分野。
  leadership: マネージャーを管理する、またはある分野の第一人者である。
  accountability: 複数のサービス、その職員、その予算。
8c:
  title: バンド 8c
  stage: シニアリード
  knowledge: 専門的な知識に加え、広い組織・セクターへの理解。
  autonomy: 機能の戦略を定め、ディレクターに対して責任を負う。
  scope: 機能または部門。
  leadership: 複数の管理階層を通じて機能を率いる。
  accountability: 機能の成果、人員、予算。
8d:
  title: バンド 8d
  stage: シニアリード
  knowledge: 複数の機能と、より広い保健・ケアのシステムにわたる戦略的な知識。
  autonomy: 組織全体の戦略を形づくり、ディレクターの代理を務める。
  scope: 主要な機能または複数の機能。
  leadership: 複数の機能または大きな部門を率いる。
  accountability: 主要な機能、大きな予算、組織全体のリスク。
"9":
  title: バンド 9
  stage: 専門職の長またはディレクター
  knowledge: 戦略的な専門性と、システム全体にわたるリーダーシップ。
  autonomy: 経営陣とともに組織の戦略を定める。
  scope: 組織と、システム全体にわたるそのパートナー。
  leadership: 専門職またはディレクトレートを率いる。
  accountability: 組織全体の成果、予算、リスク。
