summary: >
  커뮤니케이션 직원은 조직이 하는 일을 직원, 환자, 일반 대중, 파트너, 언론에 설명하도록 돕는다. 콘텐츠를 쓰고 게시하며, 사내 커뮤니케이션과 캠페인을 운영하고, 디지털 및 소셜 미디어 채널을 관리하며, 언론 문의에 대응하고, 특히 인시던트와 중단 중에 조직의 평판을 지킨다.
health_context:
  - 환자는 이를 바탕으로 행동할 수 있으므로, 보건 서비스에 관한 커뮤니케이션은 정확하고, 명확하며, 접근하기 쉬워야 한다.
  - 캠페인은 환자와 돌봄 직원이 새 디지털 서비스를 쓰도록 장려하는 것처럼 행동 변화를 목표로 하는 경우가 많다.
  - 서비스 중단, 사이버 인시던트, 데이터 침해에는 환자, 직원, 파트너, 언론에 대한 신속하고 신중한 커뮤니케이션이 필요하다.
  - 환자에 관한 이야기에는 동의가 필요하며 비밀이 지켜져야 한다.
levels:
  - title: 커뮤니케이션 담당자
    summary: 사내외 채널용 콘텐츠를 쓰고 게시하며 정형적인 언론 대응과 캠페인 업무에서 커뮤니케이션 팀을 지원한다.
    responsibilities:
      - 뉴스, 인트라넷 콘텐츠, 뉴스레터, 소셜 미디어 게시물을 쓰고 편집한다.
      - 승인된 콘텐츠를 웹사이트, 인트라넷, 소셜 미디어에 게시한다.
      - 언론 문의를 기록하고 보도를 모니터링한다.
      - 콘텐츠와 로지스틱스로 캠페인과 행사를 지원한다.
      - 콘텐츠의 정확성, 접근성, 쉬운 말을 확인한다.
    qualifications:
      - 다양한 독자를 위해 글을 쓴 경험, 또는 커뮤니케이션 또는 관련 분야 자격, 또는 그에 준하는 경력.
  - title: 시니어 커뮤니케이션 담당자
    summary: 프로젝트와 서비스의 커뮤니케이션을 계획하고 실행하며 정형적인 언론 문의에 대응하고 채널을 관리한다.
    responsibilities:
      - 프로젝트와 서비스 변경의 커뮤니케이션을 계획하고 실행한다.
      - 정형적인 언론 문의에 대응하고 보도 자료와 성명을 작성한다.
      - 디지털 및 소셜 미디어 채널의 콘텐츠 계획을 관리하고 성과를 보고한다.
      - 동의를 얻어 환자 이야기를 포함한 사례 소개를 쓴다.
      - 환자와 일반 대중을 위해 명확하게 쓰는 방법에 대해 동료에게 조언한다.
      - 커뮤니케이션 담당자를 코칭한다.
    qualifications:
      - 커뮤니케이션 또는 관련 분야의 학위나 자격, 또는 그에 준하는 경력.
  - title: 커뮤니케이션 리드
    summary: 사내 커뮤니케이션이나 디지털 채널 등 주요 프로그램 또는 영역의 커뮤니케이션을 이끌고 민감한 언론 대응을 처리한다.
    responsibilities:
      - 새 임상 시스템 같은 주요 프로그램의 커뮤니케이션과 참여를 이끈다.
      - 환자와 직원이 디지털 서비스를 이용하도록 장려하는 캠페인을 계획하고 평가한다.
      - 민감한 언론 문의에 대응하고 대변인을 준비시킨다.
      - 운영 팀과 함께 인시던트와 서비스 중단에 대한 커뮤니케이션을 계획한다.
      - 변화와 어려운 메시지를 전하는 방법에 대해 리더에게 조언한다.
      - 커뮤니케이션 담당자를 감독한다.
    qualifications:
      - 커뮤니케이션의 학위 또는 전문 자격, 또는 그에 준하는 경력.
      - 캠페인을 계획하고 평가한 경험.
  - title: 커뮤니케이션 매니저
    summary: 커뮤니케이션 팀의 업무와 채널을 관리하고 인시던트 시의 언론 대응과 커뮤니케이션을 이끈다.
    responsibilities:
      - 커뮤니케이션 팀과 그 업무 계획, 예산을 관리한다.
      - 인시던트와 데이터 침해 중을 포함하여 사후 대응과 선제적 언론 대응을 이끈다.
      - 조직의 채널, 브랜드, 콘텐츠 기준을 관리한다.
      - 커뮤니케이션 리스크와 평판 리스크에 대해 디렉터에게 조언한다.
      - 커뮤니케이션을 평가하고 그 효과를 보고한다.
      - 공동 커뮤니케이션에 대해 파트너 조직과 협력한다.
    qualifications:
      - 커뮤니케이션의 전문 자격, 또는 그에 준하는 경력.
      - 미디어 릴레이션과 커뮤니케이션 관리에 관한 상당한 경력.
    job_evaluation_notes: 감정적 부담은 인시던트와 환자 이야기 속에서 힘든 내용을 가끔 다루는 것을 반영한다.
  - title: 커뮤니케이션 책임자
    summary: 조직의 커뮤니케이션과 참여를 이끌고 그 전략을 정하며 평판에 대해 이사회에 조언한다.
    responsibilities:
      - 조직의 커뮤니케이션 및 참여 전략을 정한다.
      - 커뮤니케이션 기능을 이끌고 육성하며 그 예산을 관리한다.
      - 평판, 이해관계자 참여, 커뮤니케이션 리스크에 대해 최고 경영자와 이사회에 조언한다.
      - 대규모 인시던트 중의 위기 커뮤니케이션을 이끈다.
      - 상급 파트너, 기자, 환자 단체와의 관계를 구축한다.
      - 조직이 디지털 서비스와 데이터 사용을 일반 대중에게 어떻게 설명하는지 형성한다.
    qualifications:
      - 커뮤니케이션의 전문 자격, 또는 그에 준하는 경력.
      - 복잡한 조직의 커뮤니케이션을 이끈 풍부한 경력.
