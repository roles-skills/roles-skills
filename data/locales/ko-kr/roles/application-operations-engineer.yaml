summary: >
  애플리케이션 운영 엔지니어는 전자 환자 기록과 처방, 검사, 영상 시스템 등 임상 시스템을 포함하여 조직의 애플리케이션을 실제 이용 속에서 계속 돌아가게 한다. 애플리케이션을 모니터링하고, 정기 작업을 실행하고, 사용자와 접근을 관리하고, 릴리스와 수정을 배포하며, 공급자와 협력해 결함을 해결한다. 이 업무 덕분에 임상 및 공통 부문 직원은 하루 중 어느 시간에도 이 시스템에 의지할 수 있다.
health_context:
  - 임상 애플리케이션은 24시간 운영되므로, 엔지니어는 대기 당번에 참여하고 임상이 가장 한가한 시간대에 유지보수를 계획한다.
  - 실패한 정기 작업과 인터페이스는 검사 결과, 의뢰서, 퇴원 요약을 지연시킬 수 있으므로, 엔지니어는 이를 면밀히 주시하고 신속히 상위에 보고한다.
  - 계획된 및 계획되지 않은 가동 중단에는 임상의가 환자 치료를 계속할 수 있도록 읽기 전용 사본과 가동 중단 보고서 같은 업무 연속성 약정이 필요하다.
  - 많은 임상 애플리케이션은 제3자가 제공하고 호스팅하므로, 엔지니어는 공급자와 그 변경을 신중하게 관리한다.
  - 임상 애플리케이션의 변경은 임상 리스크 관리 프로세스를 따르며, 일부 애플리케이션은 의료기기로 규제될 수 있다.
levels:
  - title: 어소시에이트 애플리케이션 운영 엔지니어
    responsibilities:
      - 애플리케이션, 인터페이스, 정기 작업을 모니터링하고 실패를 경험 있는 엔지니어에게 보고한다.
      - 역할 기반 접근 규칙에 따라 애플리케이션의 사용자 계정과 접근 권한을 생성하고 변경한다.
      - 런북을 사용해 정형적인 점검과 유지보수 작업을 한다.
      - 인시던트와 변경을 서비스 관리 도구에 정확하게 기록한다.
      - IT 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - IT 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 애플리케이션 운영 엔지니어
    responsibilities:
      - 임상 및 공통 부문 애플리케이션과 그 인터페이스를 모니터링하고 환자 돌봄에 영향을 주기 전에 경보와 실패한 작업에 대응한다.
      - 야간 데이터 적재와 인터페이스 큐 같은 정기 작업을 실행하고 확인하며 실패를 해결하거나 상위에 보고한다.
      - 퇴직자의 접근 권한 삭제와 접근 검토 지원을 포함하여 애플리케이션 사용자, 역할, 접근을 관리한다.
      - 임상 애플리케이션의 가동 중단 보고서 등 업무 연속성 산출물을 작성하고 테스트한다.
      - 공급자에 결함을 등록하고 해결될 때까지 추적한다.
      - 지도를 받으며 시간 외 애플리케이션 결함에 대비해 대기 당번에 참여한다.
    qualifications:
      - IT 자격, 수료한 어프렌티스십, 또는 그에 준하는 경력.
      - 업무 또는 임상 애플리케이션을 지원한 경험.
  - title: 시니어 애플리케이션 운영 엔지니어
    responsibilities:
      - 변경 및 임상 안전 절차에 따라 운영 중인 애플리케이션에 릴리스, 패치, 설정 변경을 배포한다.
      - 전환과 롤백 계획을 포함하여 새 애플리케이션과 대규모 업그레이드를 가동시키는 기술 작업을 조율한다.
      - 공급자, 인프라 팀, 임상 시스템 전문가와 함께 복잡한 애플리케이션 결함을 조사한다.
      - 임상 서비스와 유지보수 시간대를 계획하고 가동 중단 절차가 준비되도록 한다.
      - 테스트 및 배포 기록 등 임상 안전 케이스의 근거를 제공한다.
      - 시간 외 결함에 대한 대기 당번에서 상위 보고 창구를 맡는다.
    qualifications:
      - 운영 중인 애플리케이션의 지원에 관한 상당한 경력(학위에 준하는 수준).
    job_evaluation_notes: 정신적 부담은 가동 시작, 배포, 시간 외 인시던트 중에 장시간 집중하는 경우가 잦음을 반영한다.
  - title: 리드 애플리케이션 운영 엔지니어
    responsibilities:
      - 모니터링, 복원력, 지원 약정을 포함하여 애플리케이션군의 운영 방식을 정한다.
      - 보안 팀과 협력하여 임상 애플리케이션 전반의 사용자·보안 관리 기준을 정한다.
      - 애플리케이션 성능과 가용성을 IT 운영 리드에게 보고하고 필요한 변경에 합의한다.
      - 임상 애플리케이션에 영향을 주는 대규모 인시던트에 대한 기술적 대응을 이끈다.
      - 임상 애플리케이션의 업무 연속성과 재해 복구 약정이 테스트되도록 한다.
      - 애플리케이션 운영 엔지니어를 이끌고 육성한다.
    qualifications:
      - 임상 시스템이나 그 밖의 핵심 시스템을 포함하여 운영 중인 애플리케이션을 운영한 풍부한 경력.
  - title: 프린시펄 애플리케이션 운영 엔지니어
    responsibilities:
      - 조직의 임상 및 공통 부문 애플리케이션 전반의 애플리케이션 운영 전략을 맡는다.
      - 서비스 수준, 계약 실적, 공급자 변경을 포함하여 임상 애플리케이션의 전략적 공급자를 관리한다.
      - 지원되지 않는 소프트웨어, 단일 장애 지점, 랜섬웨어에 대한 복원력 등 애플리케이션 리스크에 대해 시니어 리더에게 조언한다.
      - 애플리케이션이 장기간 중단되어도 조직이 환자를 안전하게 계속 돌볼 수 있도록 한다.
      - 애플리케이션 운영 팀의 인력 배치, 학습, 육성을 이끈다.
    qualifications:
      - 대규모 조직의 애플리케이션 운영을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 이 수준에 밴드 8c(G6)를 제안한다. 이 레퍼런스는 범위가 디렉터레이트가 아니라 하나의 기술 영역이므로, 다른 기술 직군의 프린시펄 역할에 맞춰 밴드 8b에 둔다.
