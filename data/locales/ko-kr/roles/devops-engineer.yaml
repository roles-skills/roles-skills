summary: >
  DevOps 엔지니어는 조직의 팀이 디지털 헬스 서비스를 안전하고 자주 제공할 수 있게 하는 도구, 파이프라인, 환경, 플랫폼을 구축하고 운영한다. 빌드, 테스트, 릴리스, 인프라를 자동화하고, 서비스를 관측 가능하고 탄력적으로 만들며, 환자와 임상의가 필요할 때 임상 시스템을 쓸 수 있도록 팀을 지원한다.
health_context:
  - 많은 서비스가 밤낮없이 돌봄을 뒷받침하므로, 배포, 모니터링, 복구는 시간 외를 포함해 중단 시간을 최소화해야 한다.
  - 릴리스 파이프라인은 테스트 결과, 변경 기록, 배포된 정확한 버전 등 임상 안전 케이스의 근거를 만들어 낸다.
  - 환경에는 민감한 건강 정보가 있을 수 있으므로, 엔지니어는 접근을 관리하고, 시크릿을 보호하며, 운영 데이터를 테스트 환경에서 멀리 둔다.
  - 의료 기관은 사이버 공격의 표적이 되기 쉬우므로, 파이프라인과 플랫폼에는 보안 스캔, 패치 적용, 검증된 백업이 포함된다.
  - 일부 서비스는 임상 및 운영 리드와 합의한 엄격한 가용성과 재해 복구 기준을 충족해야 한다.
levels:
  - title: 어프렌티스 DevOps 엔지니어
    responsibilities:
      - 체계적인 교육과 섀도잉을 통해 팀의 파이프라인, 클라우드 플랫폼, 도구를 배운다.
      - 면밀한 감독을 받으며 스크립트, 파이프라인, 설정에 작고 명확하게 정의된 변경을 가한다.
      - 모든 환경에서 변경, 보안, 정보 거버넌스 절차를 따른다.
      - 서비스 모니터링을 돕고 경보를 경험 있는 동료에게 보고한다.
      - 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - DevOps, 소프트웨어, 인프라 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 주니어 DevOps 엔지니어
    responsibilities:
      - 지도를 받으며 빌드, 테스트, 배포 파이프라인의 일부를 구축하고 유지한다.
      - 코드로서의 인프라와 자동화 스크립트를 작성하고 사용 전에 테스트한다.
      - 테스트 환경에 실제 환자 데이터가 들어가지 않도록 하고 시크릿을 안전하게 관리한다.
      - 지도를 받으며 모니터링 경보에 대응하고 인시던트 대응을 지원한다.
      - 임상 안전과 감사의 근거로 쓸 수 있도록 배포와 변경을 기록한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 수료한 어프렌티스십, 또는 그에 준하는 경력.
    job_evaluation_notes: UK GDaD PCF는 어프렌티스와 주니어 모두에 밴드 4를 제시한다. 이 레퍼런스는 감독이 적은 상태에서 파이프라인 컴포넌트를 구축하는 직무이므로, 한 밴드에 두 수준이 들어가지 않도록 주니어 수준을 밴드 5에 둔다.
  - title: DevOps 엔지니어
    responsibilities:
      - 파이프라인, 환경, 플랫폼 컴포넌트를 자율적으로 설계하고 구축한다.
      - 의존성과 컨테이너 스캔 같은 보안 점검을 자동화하고 결과에 대응한다.
      - 문제가 환자나 직원에게 영향을 주기 전에 팀이 알아차릴 수 있도록 모니터링, 로깅, 경보를 구축한다.
      - 돌봄을 뒷받침하는 서비스를 위해 백업, 장애 조치, 복구를 계획하고 테스트한다.
      - 서비스가 요구하면 시간 외 대응을 포함하여 운영 서비스의 문제를 조사하고 수정한다.
      - 주니어 및 어프렌티스 DevOps 엔지니어를 멘토링한다.
    qualifications:
      - 컴퓨팅 또는 관련 분야 학위, 또는 그에 준하는 경력.
      - 자동화된 전달 파이프라인과 클라우드 인프라를 구축하고 운영한 경험.
  - title: 시니어 DevOps 엔지니어
    responsibilities:
      - 프로덕트 또는 서비스군의 전달 도구 체인과 플랫폼 설계를 이끈다.
      - 임상 서비스로의 배포가 재현 가능하고, 되돌릴 수 있으며, 근거가 충분히 남도록 릴리스 기준을 정한다.
      - 서비스 오너, 임상 리드와 가용성, 복구 시간, 복구 시점 목표에 합의하고 이를 충족하도록 설계한다.
      - 팀이 운영하는 플랫폼의 기술적 인시던트 대응과 인시던트 이후 리뷰를 이끈다.
      - 접근 제어와 감사 로그를 포함하여 플랫폼이 보안 및 정보 거버넌스 요구사항을 충족하도록 한다.
      - 팀의 DevOps 엔지니어를 코칭하고 육성한다.
    qualifications:
      - 전달 도구 체인과 플랫폼의 설계 및 운영에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 DevOps 엔지니어
    responsibilities:
      - 공용 플랫폼의 기술 책임자로서 여러 팀의 DevOps와 플랫폼 엔지니어링을 이끈다.
      - 조직의 전달 도구, 호스팅, 관측성에 대한 중기 로드맵을 정한다.
      - 공용 플랫폼이 탄력적이고 안전하며 임상 서비스의 가용성 요구를 충족하도록 한다.
      - 재무 및 서비스 오너와 함께 플랫폼 비용과 용량을 관리한다.
      - DevOps 실천 공동체를 이끌고 DevOps 엔지니어를 직접 관리하거나 이끈다.
    qualifications:
      - 복잡한 서비스의 DevOps 또는 플랫폼 엔지니어링을 이끈 풍부한 경력.
  - title: 프린시펄 DevOps 엔지니어
    responsibilities:
      - 조직이 디지털 헬스 서비스를 어떻게 구축, 릴리스, 호스팅, 운영할지에 대한 전략을 정한다.
      - 호스팅, 복원력, 사이버 보안, 플랫폼 투자에 대해 시니어 리더에게 조언한다.
      - 핵심 임상 서비스의 업무 연속성 계획과 재해 복구 계획이 현실적이고 검증되도록 한다.
      - 새로운 기술과 관행을 평가하고 추진하며, 혁신과 안전·안정 사이의 균형을 맞춘다.
      - 채용, 경력 경로, 기술 계획을 포함하여 조직의 DevOps 역량을 키운다.
    qualifications:
      - 여러 팀과 조직에 걸쳐 DevOps와 플랫폼 엔지니어링을 이끈 풍부한 경력.
