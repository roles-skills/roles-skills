summary: >
  성과 분석가는 조직의 디지털 헬스 서비스가 환자, 서비스 이용자, 임상의, 돌봄 직원에게 얼마나 잘 작동하는지 측정한다. 측정 체계를 마련하고, 이용과 성과 데이터를 수집·분석하며, 변경이 접근성, 경험, 안전, 효율을 개선하는지 프로덕트 팀과 서비스 리더가 이해하도록 돕는다.
health_context:
  - 성공 지표는 디지털 이용률에 그치지 않고, 예약 불이행, 대기 시간, 안전한 트리아지, 확보된 직원 시간 등 돌봄에 미치는 영향을 포함한다.
  - 보건 서비스의 분석과 추적은 어떤 질환을 검색했는지 같은 민감한 정보를 드러낼 수 있으므로, 측정은 동의, 쿠키 규칙, 비밀 유지를 존중해야 한다.
  - 디지털 서비스가 건강 격차를 넓혀서는 안 되므로, 분석가는 디지털 서비스를 쓰기 어려운 집단의 이용과 성과를 살핀다.
  - 성과 데이터는 이사회, 위탁 기관, 규제 기관에 보고될 수 있으므로, 정의는 일관되고 충분히 문서화되어야 한다.
levels:
  - title: 어소시에이트 성과 분석가
    responsibilities:
      - 가입, 완료, 이탈 지점 등 환자와 직원이 디지털 서비스를 어떻게 쓰는지에 대한 정기 보고서를 작성한다.
      - 분석과 추적 데이터에 공백이나 오류가 없는지 점검하고 팀에 보고한다.
      - 이용 데이터를 수집하고 공유할 때 조직의 동의 및 비밀 유지 규칙을 따른다.
      - 서비스 이용에 관한 단순한 질문에 프로덕트 팀이 답할 수 있도록 돕는다.
    qualifications:
      - 뛰어난 수리 능력과 데이터를 다루거나 분석한 일정한 경력, 또는 그에 준하는 것.
  - title: 성과 분석가
    responsibilities:
      - 돌봄과 직원에 미치는 영향을 포함하여 서비스의 성공이 무엇인지 프로덕트 팀 및 임상 리드와 합의한다.
      - 추적이 정확하고, 적절한 범위이며, 동의를 존중하도록 분석을 설정하고 검증한다.
      - 변경의 효과를 보여 주기 위해 디지털 분석을 예약이나 의뢰 같은 운영 데이터와 결합한다.
      - 서로 다른 환자 집단의 이용과 성과를 분석하고 디지털 배제의 위험을 짚는다.
      - 프로덕트 팀과 서비스 리더에게 결과를 발표하고 개선을 권고한다.
    qualifications:
      - 정량적 분야 학위, 또는 그에 준하는 경력.
      - 디지털 서비스의 성과를 측정한 경험.
  - title: 시니어 성과 분석가
    responsibilities:
      - 디지털 외래나 온라인 트리아지 등 서비스군 또는 대규모 프로그램의 성과 측정을 이끈다.
      - 임상, 재무, 운영 리드와 함께 편익 지표를 설계하고 제공 기간 내내 추적한다.
      - 정보 거버넌스와 보안 요구사항을 충족하는 분석 도구를 선택하고 설정한다.
      - 프로그램 위원회와 시니어 리더에게 성과의 근거를 발표한다.
      - 분석가를 코칭하고 성과 분석가 한 명 이상을 직접 관리하기도 한다.
    qualifications:
      - 디지털 서비스의 성과 분석에 관한 상당한 경력(석사에 준하는 수준).
  - title: 리드 성과 분석가
    responsibilities:
      - 디지털 헬스 서비스 포트폴리오 전반에서 성과 분석가 팀을 이끈다.
      - 이사회와 파트너에 대한 보고를 시간에 걸쳐 비교할 수 있도록 핵심 성과 지표의 일관된 정의에 합의한다.
      - 분석 데이터가 정확하고, 적절히 쓰이며, 정보 거버넌스 규칙에 따라 다뤄지도록 한다.
      - 성과의 근거를 활용해 포트폴리오의 우선순위와 투자에 영향을 준다.
      - 모든 수준의 분석가를 코칭하고 멘토링한다.
    qualifications:
      - 성과 분석과 분석가를 이끈 풍부한 경력.
  - title: 성과 분석 책임자
    responsibilities:
      - 조직의 디지털 서비스의 성과와 편익을 측정하는 전략을 정한다.
      - 성과 분석과 성과 보고의 품질 보증 체계를 정한다.
      - 디지털 서비스와 환자 성과에 대해 성과의 근거가 말해 주는 바를 경영진에게 조언한다.
      - 데이터 분석과 데이터 사이언스 등 다른 분석 직군과 협력하여 방법과 데이터를 공유한다.
      - 채용과 육성을 포함하여 성과 분석 커뮤니티의 역량을 계획한다.
    qualifications:
      - 조직 전체에서 성과 분석을 이끈 풍부한 경력.
