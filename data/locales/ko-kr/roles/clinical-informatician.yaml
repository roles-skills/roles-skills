summary: >
  임상 정보학자는 의사, 간호사, 약사, 보건의료 전문직 등 면허를 가진 임상의로서, 임상 지식을 활용해 조직의 디지털 헬스 서비스를 형성한다. 임상 시스템, 데이터, 의사결정 지원이 돌봄이 제공되는 방식에 맞고, 안전하게 쓸 수 있으며, 환자의 성과와 임상의·돌봄 직원의 경험을 개선하도록 한다.
health_context:
  - 이 역할에는 최신 임상 지식이 필요하므로, 대부분의 직위는 임상 전문직 단체의 면허 등록과 일정한 계속적 임상 실무를 요구한다.
  - 임상 정보학자는 시스템이 환자 돌봄에 어떤 영향을 주는지에 대해 전문적인 조언을 하므로, 그 판단은 환자 안전에 직접 영향을 준다.
  - 임상 안전 책임자와 긴밀히 협력하며, 위험 요소 식별과 안전 케이스에 임상 전문성을 제공한다.
  - 질 높은 임상 데이터는 SNOMED CT 같은 임상 용어 체계의 일관된 사용에 달려 있으므로, 구조화된 기록과 의사결정 지원의 설계를 돕는다.
  - 임상의, 돌봄 직원, 디지털 팀을 잇는 다리 역할을 하며 시스템 변경의 임상 참여를 이끄는 경우가 많다.
levels:
  - title: 임상 정보학 전문가
    summary: 시니어 임상 정보학자의 지도 아래 프로덕트 또는 프로그램 팀 안에서, 임상 시스템의 설계, 설정, 테스트, 도입에 임상 전문성을 가져온다.
    responsibilities:
      - 임상의, 돌봄 직원과 임상 워크플로를 매핑하고 이를 명확한 요구사항으로 바꾼다.
      - 양식, 오더 세트, 돌봄 계획 같은 시스템 콘텐츠를 임상 시나리오에 비추어 설계하고 테스트한다.
      - 위험 요소 워크숍에 참여하고 리스크와 통제에 대해 임상적 의견을 낸다.
      - 교육과 가동 시 지원을 포함하여 임상의와 돌봄 직원이 새 시스템을 안전하게 도입하도록 지원한다.
      - 임상 데이터가 합의된 임상 용어 체계로 일관되게 기록되는지 확인한다.
      - 시스템 사용에 관한 피드백과 데이터를 모아 개선을 제안한다.
    qualifications:
      - 임상 전문직 단체의 현재 면허 등록과 임상 실무 경험.
      - 실무에서의 임상 시스템 사용 경험, 또는 디지털 변화에 관한 그에 준하는 경험.
    job_evaluation_notes: 임상 시스템의 설계를 통해 환자 돌봄에 대해 조언하는 직무이므로 환자 돌봄은 레벨 4로 평가했다. 감정적 부담은 임상 기록과 인시던트의 정기적 검토를 반영한다.
  - title: 시니어 임상 정보학자
    summary: 주요 임상 시스템, 프로덕트, 프로그램에 대한 임상 투입을 이끌며, 디지털 서비스가 환자 돌봄과 안전에 어떤 영향을 주는지에 대해 전문적 조언을 한다.
    responsibilities:
      - 주요 임상 시스템 또는 프로덕트의 임상 설계를 이끌고 콘텐츠와 설정 기준을 정한다.
      - 임상 워크플로, 의사결정 지원, 안전에 대해 프로덕트 팀에 전문적 조언을 한다.
      - 임상 안전 책임자와 협력하여 위험 요소를 식별하고, 통제에 합의하며, 안전 케이스의 임상적 근거를 제공한다.
      - 서비스 전반에서 임상 참여와 도입을 이끌고 임상 동료들 사이에서 안전한 사용을 이끈다.
      - 시스템 사용과 편익에 대한 평가와 임상 감사를 계획하고 수행한다.
      - 임상 정보학 전문가와, 디지털 업무에 낯선 임상의를 멘토링한다.
    qualifications:
      - 임상 전문직 단체의 현재 면허 등록과 상당한 임상 경력.
      - 임상 정보학 또는 보건 정보학 대학원 자격, 또는 그에 준하는 경력.
    job_evaluation_notes: 환자 돌봄에 관한 전문적 조언이므로 환자 돌봄은 레벨 5로 평가했다. 시스템의 평가와 임상 감사가 직무의 주요 부분이므로 연구는 레벨 3이다.
  - title: 리드 임상 정보학자
    summary: 임상 시스템 포트폴리오 또는 돌봄 현장의 임상 정보학을 이끌고, 임상 설계 기준을 정하며, 임상 정보학자 팀을 이끈다.
    responsibilities:
      - 포트폴리오 전반의 임상 시스템에 대해 임상 설계 기준과 원칙을 정한다.
      - 임상 정보학자 팀을 이끌며 우선순위를 정하고 그 전문성 개발을 지원한다.
      - 임상 시스템의 임상 리스크, 편익, 우선순위에 대해 프로그램 위원회와 시니어 리더에게 조언한다.
      - 서비스 전반에서 의사결정 지원, 알림, 구조화된 데이터에 대한 임상적 판단을 이끈다.
      - 임상 추진자의 네트워크를 구축하고 대규모 변화의 임상 참여를 이끈다.
      - 평가를 의뢰하고 이끌며 그 근거를 로드맵 형성에 활용한다.
    qualifications:
      - 임상 전문직 단체의 현재 면허 등록과 풍부한 임상 경력.
      - 임상 정보학 또는 보건 정보학 대학원 자격, 또는 임상 정보학 업무를 이끈 그에 준하는 경력.
  - title: 임상 정보학 책임자
    summary: 조직의 임상 정보학 기능과 임상 설계 기구를 이끌며, 모든 임상 시스템이 강력한 임상 리더십 아래 설계, 도입, 개선되도록 한다.
    responsibilities:
      - 임상 정보학 전략을 정하고 조직의 임상 설계 기구를 이끈다.
      - 인력 계획과 예산을 포함하여 임상 정보학 기능을 이끌고 육성한다.
      - 디지털 투자가 환자 돌봄에 미치는 영향에 대해 경영 팀에 고도로 전문적인 조언을 한다.
      - 임상 시스템이 임상 안전, 용어 체계, 데이터 표준을 충족하도록 한다.
      - 보건·돌봄 파트너, 전문직 단체, 학술 네트워크에 대해 조직을 대표한다.
      - 디지털 헬스의 근거를 쌓기 위해 연구·평가 파트너십을 이끈다.
    qualifications:
      - 임상 전문직 단체의 현재 면허 등록과 풍부한 임상 및 리더십 경력.
      - 임상 정보학 또는 보건 정보학 석사 학위, 또는 조직 수준에서 임상 정보학을 이끈 그에 준하는 경력.
    job_evaluation_notes: 조직의 임상 시스템 전반에 걸친 환자 돌봄에 관한 고도로 전문적인 조언이므로 환자 돌봄은 레벨 6으로 평가했다.
