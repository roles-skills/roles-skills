summary: >
  엔드유저 컴퓨팅 엔지니어는 노트북, 데스크톱, 태블릿, 휴대전화, 프린터, 병동과 진료소의 공용 워크스테이션 등 직원이 매일 쓰는 기기와 소프트웨어를 제공하고, 지원하고, 유지한다. 현장과 원격에서 결함을 고치고, 기기를 배포하고 업데이트하며, 안전하고 규정에 맞는 상태로 유지한다. 이 업무 덕분에 임상의와 돌봄 직원은 돌봄 현장에서 환자 정보를 보고 기록할 수 있다.
health_context:
  - 많은 기기는 병동, 진료소, 응급실에서 임상 직원이 공유하며, 빠른 사용자 전환과 스마트카드 또는 태그 로그인이 쓰이는 경우가 많다.
  - 임상 공간의 고장 난 기기는 돌봄을 지연시킬 수 있으므로, 엔지니어는 그런 결함을 우선하고 교체할 예비 기기를 준비해 둔다.
  - 엔지니어는 임상 공간에서 일하므로 감염 예방 및 관리 규칙을 따르고, 환자의 프라이버시와 존엄을 존중하며, 임상 활동에 맞춰 작업한다.
  - 기기는 기밀 환자 정보를 보관하거나 표시하므로, 암호화, 패치 적용, 관리되어야 하고 수명이 다하면 안전하게 삭제하거나 파기해야 한다.
  - 손목 밴드·라벨 프린터, 바코드 스캐너, 받아쓰기 장치 등 일부 주변기기는 임상 프로세스를 지원하거나 임상 장비에 연결되므로, 그 변경에는 주의와 테스트가 필요하다.
levels:
  - title: 어소시에이트 엔드유저 컴퓨팅 엔지니어
    responsibilities:
      - 경험 있는 엔지니어의 지시를 받아 기기와 주변기기를 설치하고, 교체하고, 수리한다.
      - 프린터, 스캐너, 로그인 문제 등 임상 및 사무 공간의 일반적인 결함을 고친다.
      - 병동과 진료소에서 작업할 때 감염 예방 및 관리 규칙을 따르고 환자의 프라이버시를 존중한다.
      - 작업, 자산, 부품을 서비스 관리 도구에 정확하게 기록한다.
      - IT 지원 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - IT 지원 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 신체적 부담은 기기를 나르고 책상 아래나 좁은 공간에서 작업하는 등 잦은 가벼운 노력을 반영한다. 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 엔드유저 컴퓨팅 엔지니어
    responsibilities:
      - 첫 방문에서의 해결을 목표로 하드웨어와 소프트웨어 결함을 현장과 원격에서 진단하고 고친다.
      - 임상 공간의 결함에 신속히 대응하고 수리가 돌봄을 지연시킬 때는 대체 기기를 제공한다.
      - 조직의 표준 이미지와 기기 관리 도구를 사용해 기기를 구축하고, 배포하고, 업데이트한다.
      - 기기에 패치를 적용하고, 암호화하고, 규정에 맞게 유지하며, 수명이 다하면 안전하게 삭제하거나 폐기한다.
      - 손목 밴드 프린터, 라벨 프린터, 바코드 스캐너 등 임상용 주변기기를 설정하고 테스트한다.
      - 어소시에이트 엔지니어를 코칭하고 지식 문서를 통해 수정 방법을 공유한다.
    qualifications:
      - IT 레벨 3 이상의 자격, 수료한 어프렌티스십, 또는 그에 준하는 경력.
      - 엔드유저 기기를 지원한 경험.
    job_evaluation_notes: 신체적 부담은 사업장 간에 기기를 옮기고 설치할 때의 잦은 가벼운 노력을 반영한다.
  - title: 시니어 엔드유저 컴퓨팅 엔지니어
    responsibilities:
      - 엔지니어 팀을 일상적으로 이끌며 환자 돌봄과 직원에 대한 영향으로 업무에 우선순위를 매긴다.
      - 돌봄에 대한 지장을 최소화하여 병동, 진료소, 지역사회 팀을 위한 기기 롤아웃과 교체를 계획하고 운영한다.
      - 기기 빌드와 업데이트를 배포 전에 임상 애플리케이션과 주변기기로 테스트한다.
      - 패치 수준, 암호화, 엔드포인트 보호를 포함하여 기기가 보안 기준을 충족하도록 한다.
      - 현장 순회 지원과 신속한 기기 수정으로 임상 시스템의 가동을 지원한다.
      - 인프라, 애플리케이션, 보안 팀과 협력하여 복잡하고 반복되는 결함을 고친다.
    qualifications:
      - 엔드유저 기기의 지원과 관리에 관한 상당한 경력(학위에 준하는 수준).
    job_evaluation_notes: 사람에 대한 책임은 엔지니어 팀의 일상적 관리를 반영한다. 신체적 부담은 일부 계속되는 현장 작업을 반영한다.
  - title: 리드 엔드유저 컴퓨팅 엔지니어
    responsibilities:
      - 공용 임상 워크스테이션을 포함하여 조직의 기기, 빌드, 엔드유저 소프트웨어의 기준을 정한다.
      - 기기, 수리, 엔드유저 서비스의 공급자를 관리하고 합의된 서비스 수준을 지키게 한다.
      - 기술 아키텍트와 협력하여 병동 및 지역사회 직원용 모바일 기기 등 새로운 유형의 기기를 선정하고 테스트한다.
      - 임상 워크스테이션에 영향을 준 업데이트 실패 같은 엔드유저 컴퓨팅 인시던트에 대한 기술적 대응을 이끈다.
      - 기기의 생애 주기와 용량을 계획하고 교체 비용에 대해 조언한다.
      - 시니어 엔지니어를 이끌고 육성한다.
    qualifications:
      - 공급자 관리를 포함한 엔드유저 컴퓨팅에 관한 풍부한 경력.
  - title: 프린시펄 엔드유저 컴퓨팅 엔지니어
    responsibilities:
      - 병원, 진료소, 환자의 집, 지역사회에서 직원이 임상 시스템에 어떻게 접근할지를 포함하여 엔드유저 컴퓨팅 전략과 로드맵을 맡는다.
      - 기기 자산이 돌봄 현장에서 환자 정보에 대한 안전하고 빠른 접근을 뒷받침하도록 한다.
      - 기기 투자, 리스크, 교체와 신기술의 비용에 대해 시니어 리더에게 조언한다.
      - 운영 체제의 지원 종료와 랜섬웨어에 대한 복원력 등 전체에 걸친 기기 리스크에 대한 대응을 이끈다.
      - 엔드유저 컴퓨팅 팀의 인력 배치, 학습, 육성을 이끈다.
      - 보건·돌봄 파트너와 공유 기기 및 접근 기준에 협력한다.
    qualifications:
      - 대규모 복수 사업장 조직의 엔드유저 컴퓨팅을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 이 수준에 밴드 8c(G6)를 제안한다. 이 레퍼런스는 범위가 디렉터레이트가 아니라 하나의 기술 영역이므로, 다른 기술 직군의 프린시펄 역할에 맞춰 밴드 8b에 둔다.
