summary: >
  데이터 사이언티스트는 통계, 머신러닝, 그 밖의 고급 기법을 사용하여 보건·돌봄 데이터의 패턴을 찾고, 서비스가 계획하고, 예측하고, 돌봄을 개선하는 데 도움이 되는 모델을 만든다. 대표적인 업무로는 수요 예측, 조기 지원이 도움이 될 환자의 식별, 서비스 변경의 효과 평가가 있다. 임상의, 분석가와 긴밀히 협력하여 모델이 타당하고, 공정하며, 안전하게 쓰이도록 한다.
health_context:
  - 환자에 관한 의사결정을 뒷받침하는 모델은 오류나 편향이 있으면 해를 끼칠 수 있으므로, 모델은 사용할 집단에서 검증되고 임상 안전이 평가된다.
  - 건강 데이터는 돌봄 접근의 불평등을 반영하므로, 환자 집단별 편향을 측정하고 해소하지 않으면 모델이 건강 격차를 되풀이하거나 악화시킬 수 있다.
  - 진단이나 치료에 정보를 제공하는 모델 등 일부 모델은 의료기기로 규제될 수 있고 AI 규제도 적용될 수 있다.
  - 데이터 사이언스는 연결된 상세한 환자 데이터를 필요로 하는 경우가 많으므로, 작업은 가명처리된 데이터를 사용하여 합의된 정보 거버넌스상의 근거 아래 안전한 환경에서 이루어진다.
  - 임상의와 환자는 모델의 출력을 이해하고 신뢰해야 하므로, 설명과 불확실성의 쉬운 소통이 중요하다.
levels:
  - title: 트레이니 데이터 사이언티스트
    responsibilities:
      - 체계적인 교육을 통해 팀의 통계·머신러닝 기법, 도구, 안전한 업무 방식을 배운다.
      - 감독을 받으며 가명처리된 건강 데이터셋을 준비하고 탐색한다.
      - 단순한 통계 분석을 수행하고 해석하며 더 경험 있는 데이터 사이언티스트와 결과를 확인한다.
      - 정보 거버넌스, 공개 통제, 윤리 절차를 따른다.
      - 데이터 사이언스 어프렌티스십 또는 그에 준하는 자격 취득을 위해 노력한다.
    qualifications:
      - 데이터 사이언스 어프렌티스십 또는 그에 준하는 과정에 등록했거나 취득을 목표로 하고 있다.
    job_evaluation_notes: 지식은 업무를 수행할 수 있을 만큼 교육이 끝난 시점에 직무가 요구하는 수준으로 평가했다.
  - title: 어소시에이트 데이터 사이언티스트
    responsibilities:
      - 지도를 받으며 수요 예측 같은 기본적인 통계·머신러닝 모델을 구축하고 테스트한다.
      - 안전한 환경에서 모델링을 위해 건강 데이터셋을 준비하고 연결한다.
      - 환자 집단별 모델 성능을 측정하고 차이를 보고한다.
      - 결과와 그 불확실성을 분석가와 서비스 팀에 발표한다.
      - 작업을 재현할 수 있도록 데이터 소스, 방법, 가정을 문서화한다.
    qualifications:
      - 정량적 분야 학위, 데이터 사이언스 어프렌티스십, 또는 그에 준하는 경력.
  - title: 데이터 사이언티스트
    responsibilities:
      - 적절한 기법을 고르고 리스크 층화나 재원 일수 예측 같은 복잡한 모델을 자율적으로 개발한다.
      - 임상의와 모델을 검증하여 지역 환자 데이터에서 정확하고, 공정하고, 유용한지 확인한다.
      - 각 모델의 의도된 용도, 데이터, 성능, 한계를 문서화하고 임상 안전 케이스에 근거를 제공한다.
      - 적절한 통계 기법으로 서비스 변경의 효과를 평가한다.
      - 모델과 그 불확실성을 임상 및 비기술 청중에게 설명한다.
      - 어소시에이트 및 트레이니 데이터 사이언티스트를 지원한다.
    qualifications:
      - 정량적 분야 학위, 또는 그에 준하는 경력.
      - 통계 또는 머신러닝 모델을 구축하고 검증한 경험.
  - title: 프린시펄 데이터 사이언티스트
    responsibilities:
      - 서비스 계획과 환자 돌봄을 뒷받침하는 데이터 사이언스 프로젝트의 범위를 정하고, 설계하고, 이끈다.
      - 어떤 기법, 도구, 데이터가 적합한지 판단하고 실현 불가능하거나 안전하지 않은 계획에 이의를 제기한다.
      - 임상 안전 및 정보 거버넌스 동료와 함께 모델의 검증, 편향 평가, 모니터링을 계획한다.
      - 모델을 어떻게 대규모로 배포하고 지원할지 프로덕트 팀과 합의한다.
      - 데이터 사이언티스트의 작은 팀을 관리하고 육성한다.
    qualifications:
      - 데이터 사이언스 제공에 관한 상당한 경력(정량적 분야의 석사 또는 박사에 준하는 수준).
  - title: 리드 데이터 사이언티스트
    responsibilities:
      - 데이터 사이언스 팀을 이끌고 방향, 우선순위, 기준을 정한다.
      - 데이터 사이언스가 돌봄을 개선할 수 있는 기회를 찾고 임상·서비스 리더와 함께 그 근거를 보인다.
      - 모델이 운영 중에도 안전하고 공정하게 유지되도록 설계, 검증, 모니터링되게 한다.
      - 동의, 편향, 민감한 데이터 사용 등 복잡한 윤리·데이터 문제를 해결한다.
      - 코칭, 채용, 교육을 통해 데이터 사이언스 역량을 키운다.
    qualifications:
      - 데이터 사이언스 팀을 이끈 풍부한 경력.
    job_evaluation_notes: UK GDaD PCF는 리드 데이터 사이언티스트와 데이터 사이언스 책임자 모두 G7 또는 G6로 본다. 이 레퍼런스는 리드를 밴드 8a, 책임자를 밴드 8b에 두어 두 수준이 다른 밴드가 되도록 한다.
  - title: 데이터 사이언스 책임자
    responsibilities:
      - 조직의 전략과 우선순위에 맞춰 조직 전체의 데이터 사이언스와 AI 방향을 정한다.
      - 조직의 모델과 AI 윤리, 안전, 보증을 이끌고 이에 대해 이사회에 조언한다.
      - 자원, 예산, 데이터 사이언스 결과물의 품질을 감독한다.
      - 데이터 사이언스와 AI에 관해 보건·돌봄 파트너, 연구자, 규제 기관에 대해 조직을 대표한다.
      - 직군을 가로질러 데이터 사이언스 역량과 경력을 키운다.
    qualifications:
      - 조직 전체에서 데이터 사이언스를 이끈 풍부한 경력.
