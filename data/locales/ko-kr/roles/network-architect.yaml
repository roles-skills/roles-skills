summary: >
  네트워크 아키텍트는 조직의 사업장, 직원, 임상 시스템, 의료기기를 연결하는 로컬, 광역, 무선, 클라우드 네트워크를 설계한다. 네트워크가 돌봄을 멈추지 않을 만큼 빠르고, 탄력적이며, 안전하도록 하고, 서비스가 클라우드로 옮겨 가고 파트너 조직과 연결되는 데 맞춰 네트워크가 어떻게 바뀔지 계획한다.
health_context:
  - 임상 시스템, 전화, 의료기기가 네트워크에 의존하므로 장애는 돌봄을 멈출 수 있다. 설계에는 복원력과 검증된 장애 조치가 필요하다.
  - 네트워크에는 패치를 적용하기 어려운 연결된 의료기기가 올라가는 경우가 많으므로, 아키텍트는 이를 보호하는 세그먼테이션과 모니터링을 설계한다.
  - 직원은 병원, 진료소, 지역사회, 환자의 집에서 일하므로, 설계는 안전한 모바일 및 원격 접근을 뒷받침해야 한다.
  - 네트워크는 고유한 연결 및 보안 요구사항을 가진 공유 보건·돌봄 네트워크와 파트너 조직에 연결된다.
  - 임상 공간의 변경에는 혼잡한 시간대를 피해 작업을 잡는 등 환자 돌봄을 고려한 신중한 계획이 필요하다.
levels:
  - title: 어소시에이트 네트워크 아키텍트
    responsibilities:
      - 네트워크 아키텍트의 지도를 받으며 네트워크 설계, 도해, 사양의 초안을 작성한다.
      - 사업장을 조사하고 무선 커버리지와 기기 연결을 포함한 임상 공간의 요구사항을 수집한다.
      - 네트워크 토폴로지, 주소 할당, 연결된 기기의 기록을 최신으로 유지한다.
      - 검토 전에 설계가 서비스 수준과 보안 기준을 충족하는지 확인한다.
    qualifications:
      - 컴퓨팅 또는 네트워크 학위, 공인된 네트워크 자격, 또는 그에 준하는 경력.
      - 네트워크 설계 전문 지식(대학원 디플로마 수준 또는 그에 준하는 경력).
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 5)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 6에 둔다. 이 직무는 주요 정보 시스템이 의존하는 네트워크의 일부를 설계하므로, 지식은 대학원 디플로마 수준, 정보 자원은 레벨 5로 평가했다.
  - title: 네트워크 아키텍트
    responsibilities:
      - 사업장과 서비스를 위한 로컬, 광역, 무선, 클라우드 네트워크 솔루션을 설계한다.
      - 의료기기, 임상 시스템, 게스트 접속을 위한 네트워크 세그먼테이션을 설계한다.
      - 돌봄이 방해받지 않도록 서비스 리드와 함께 임상 공간의 네트워크 변경을 계획한다.
      - 공급자와 서비스 수준을, 파트너의 네트워크와 연결 요구사항을 합의한다.
      - 새로운 네트워크 기술과 조직의 보안 기준에 대한 적합성을 평가한다.
    qualifications:
      - 네트워크 아키텍처 전문 지식(석사 수준 또는 그에 준하는 경력).
      - 기업 네트워크를 설계하고 지원한 경험.
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 6)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 7에 둔다. 이 직무는 로컬, 광역, 무선, 클라우드 네트워크에 걸친 전문 지식을 요구하므로, 지식은 석사 수준 또는 그에 준하는 수준으로 평가했다.
  - title: 리드 네트워크 아키텍트
    responsibilities:
      - 사업장, 데이터 센터, 클라우드 연결을 포함하여 조직의 네트워크 아키텍처를 맡는다.
      - 네트워크 설계의 기준을 정하고 설계 기구에서 설계를 보증한다.
      - 핵심 임상 서비스의 네트워크 복원력과 복구를 설계하고 이것이 테스트되도록 한다.
      - 네트워크 투자, 공급자 계약, 새 서비스의 네트워크 리스크에 대해 조언한다.
      - 전문가로서의 상위 보고 창구가 되어 다른 네트워크 아키텍트와 엔지니어를 이끈다.
    qualifications:
      - 복잡한 조직의 네트워크 아키텍처에 관한 상당한 경력(석사에 준하는 수준).
    job_evaluation_notes: UK GDaD PCF의 등급 제안(밴드 7)보다 높은 밴드에 둔다. 보건 분야 채용 공고는 이 역할을 밴드 8a에 둔다. 이 직무는 조직의 모든 정보 시스템이 의존하는 네트워크 아키텍처를 맡으므로, 정보 자원은 레벨 6으로 한다.
