pd-health-research-ethics:
  name: 환자 및 돌봄 직원 대상 윤리적 리서치
  description: 환자, 돌봄 제공자, 임상의, 돌봄 직원을 대상으로 한 리서치를 안전하고 윤리적으로 계획하고 수행한다. 사전 동의, 안전 보호, 취약한 상황에 있는 사람들과의 리서치, 공식 윤리 승인이 필요한 시점을 아는 것을 포함한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 환자와 돌봄 직원 대상 리서치에 사전 동의, 안전 보호, 개인 데이터에 대한 주의가 필요한 이유를 설명한다
      - 리서치 세션에서 팀의 동의, 안전 보호, 데이터 취급 절차를 따른다
    working: |
      할 수 있는 일:
      - 사전 동의를 얻고 참가자의 안녕과 프라이버시를 지키는 리서치 세션을 계획한다
      - 몸이 안 좋거나, 힘들어하거나, 취약한 상황에 있는 사람에 맞게 세션을 조정하고, 중단할 시점을 안다
      - 리서치 중에 나타나는 안전 보호 문제를 알아보고 보고한다
    practitioner: |
      할 수 있는 일:
      - 리서치에 공식 윤리 또는 리서치 거버넌스 승인이 필요한지 판단하고 필요한 서류를 준비한다
      - 아동, 치매 환자, 위기에 처한 사람 등 취약한 상황에 있는 사람들과의 안전한 리서치를 계획한다
      - 임상 리드와 돌봄 직원과 협력하여 돌봄에 지장을 주지 않고 임상 현장에서 리서치를 계획한다
      - 힘든 세션 이후 리서처가 자신의 안녕을 돌보도록 지원한다
    expert: |
      할 수 있는 일:
      - 환자, 돌봄 제공자, 돌봄 직원 대상 윤리적 리서치에 관한 조직의 기준을 정한다
      - 팀 전반의 리서치 실무를 보증하고 고위험 리서치에 대해 조언한다
      - 윤리, 안전 보호, 거버넌스 기구에 리서치 실무를 대표한다
pd-safety-critical-design:
  name: 임상 안전과 휴먼 팩터를 고려한 디자인
  description: 휴먼 팩터 원칙을 적용하고 임상 리스크 관리 프로세스와 협력하여, 임상의, 돌봄 직원, 환자가 안전하게 행동하도록 돕는 서비스, 인터페이스, 워크플로를 디자인한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 디자인상의 선택이 환자 취급 오류나 용량 오류 같은 돌봄상의 실수를 어떻게 일으키거나 막을 수 있는지 설명한다
      - 환자 신원 배너와 알레르기 경고 등 안전이 중요한 정보에 대한 조직의 패턴을 사용한다
    working: |
      할 수 있는 일:
      - 모호한 레이블과 불필요한 알림을 줄이는 등, 안전한 행동이 쉬운 행동이 되도록 인터페이스를 디자인한다
      - 중단과 시간 압박을 포함한 현실적인 임상 시나리오에서 디자인을 테스트한다
      - 디자인과 관련된 위험 요소를 임상 안전 책임자에게 제기하고 디자인이 이를 어떻게 통제하는지 기록한다
    practitioner: |
      할 수 있는 일:
      - 과업 분석과 사용 오류 분석 같은 휴먼 팩터 기법을 복잡한 임상 워크플로에 적용한다
      - 서비스 전체에서 알림 피로와 인지 부하를 줄이도록 디자인한다
      - 임상 안전 케이스에 쓸 디자인 근거와 규제 대상 소프트웨어의 사용성 근거를 제공한다
    expert: |
      할 수 있는 일:
      - 안전이 중요한 디자인에 관한 조직의 기준과 패턴을 정한다
      - 위험이 가장 높은 임상 서비스의 휴먼 팩터 작업을 이끈다
      - 포트폴리오 전반의 디자인 관련 리스크에 대해 임상 안전 및 프로덕트 리더에게 조언한다
pd-health-content:
  name: 건강 정보 콘텐츠
  description: 정확하고, 임상적으로 보증되며, 건강 문해력 수준이 다른 사람들이 이해하고 행동에 옮기기 쉬운 보건·돌봄 콘텐츠를 만든다.
  levels:
    awareness: |
      할 수 있는 일:
      - 건강 정보가 정확하고, 최신이며, 이해하기 쉬워야 하는 이유를 설명한다
      - 건강 콘텐츠에 대해 팀의 스타일 가이드와 임상 검토 프로세스를 따른다
    working: |
      할 수 있는 일:
      - 증상이나 도움을 받아야 할 시점처럼, 건강 문해력이 낮은 사람도 이해하고 행동에 옮길 수 있는 건강 콘텐츠를 쓴다
      - 임상 검토자와 협력하여 명확성을 잃지 않으면서 콘텐츠의 정확성을 확인한다
      - 의학 용어를 쉬운 말로 설명하고 질환, 검사, 치료의 이름을 일관되게 쓴다
    practitioner: |
      할 수 있는 일:
      - 긴급한 증상, 의약품, 임종 돌봄처럼 민감하고 위험이 높은 주제의 콘텐츠를 디자인한다
      - 건강 콘텐츠 전체에 대해 임상 보증, 검토일, 근거 출처를 마련한다
      - 논란이 있는 콘텐츠에서 임상적 정밀성, 법적 요건, 사용자의 이해 사이의 균형을 잡는다
    expert: |
      할 수 있는 일:
      - 건강 정보 콘텐츠와 그 임상 보증에 관한 조직의 기준을 정한다
      - 서비스와 채널 전반의 건강 정보 콘텐츠 전략을 이끈다
      - 건강 정보 리스크에 대해 임상 및 커뮤니케이션 시니어 리더에게 조언한다
