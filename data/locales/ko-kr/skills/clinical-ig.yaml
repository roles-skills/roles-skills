clin-clinical-systems-optimisation:
  name: 임상 시스템 설계와 최적화
  description: 전자 건강 기록, 오더 커뮤니케이션, 전자 처방 같은 임상 시스템이 임상 워크플로에 맞고 안전하고 효율적인 돌봄을 뒷받침하도록 설계하고, 구성하고, 개선한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 전자 건강 기록 같은 임상 시스템이 돌봄을 어떻게 뒷받침하는지 설명한다
      - 시스템이 뒷받침하는 임상 워크플로를 설명한다
    working: |
      할 수 있는 일:
      - 임상의, 돌봄 직원과 함께 현재와 미래의 임상 워크플로를 매핑한다
      - 시스템 구성을 임상 시나리오에 비추어 테스트한다
      - 프로덕트 팀을 위해 명확한 임상 요구사항을 쓴다
    practitioner: |
      할 수 있는 일:
      - 시스템 구성, 양식, 오더 세트, 의사결정 지원의 임상 설계를 이끈다
      - 데이터와 사용자 피드백으로 워크플로 문제를 찾아 고친다
      - 임상적 필요, 안전, 사용성, 시스템의 제약 사이에서 균형을 잡는다
    expert: |
      할 수 있는 일:
      - 조직 전반의 임상 시스템에 대한 설계 원칙과 기준을 정한다
      - 돌봄과 직원 경험을 측정 가능하게 개선하는 최적화 프로그램을 이끈다
      - 임상 시스템 선택과 그것이 돌봄에 미치는 영향에 대해 시니어 리더에게 조언한다
clin-human-factors:
  name: 임상 시스템의 휴먼 팩터와 사용성
  description: 임상의, 돌봄 직원, 환자가 임상 시스템을 안전하게, 가능한 한 오류 없이 사용할 수 있도록 휴먼 팩터와 사용성 기법을 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 부실한 디자인이 돌봄상의 오류로 이어질 수 있는 방식을 설명한다
      - 환자 안전에 영향을 줄 수 있는 사용성 문제를 보고한다
    working: |
      할 수 있는 일:
      - 임상 과업의 사용성 테스트와 시뮬레이션에 참여한다
      - 비슷하게 생긴 선택지나 숨겨진 알림 같은 흔한 디자인상의 위험 요소를 알아본다
    practitioner: |
      할 수 있는 일:
      - 임상 시스템의 휴먼 팩터 평가를 계획하고 수행한다
      - 조사 결과를 디자인 변경과 임상 안전 통제로 바꾼다
      - 알림 부담과 우회 행위의 위험을 평가한다
    expert: |
      할 수 있는 일:
      - 디지털 서비스의 휴먼 팩터에 대한 조직의 접근 방식을 정한다
      - 고위험 시스템과 변경의 휴먼 팩터 근거를 검토한다
      - 임상 및 디지털 팀 전반에 휴먼 팩터 역량을 키운다
clin-digital-health-evaluation:
  name: 디지털 헬스 평가와 편익
  description: 디지털 헬스 기술의 평가를 계획하고 수행하며, 건전한 방법과 근거를 사용하여 그 임상적, 안전상, 서비스상의 편익을 측정한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 디지털 헬스 기술에 편익과 안전에 대한 근거가 필요한 이유를 설명한다
      - 기술에 관해 공표된 근거를 찾는다
    working: |
      할 수 있는 일:
      - 평가를 위한 기준선과 후속 데이터를 수집한다
      - 시스템 사용에 대한 임상 감사를 수행한다
      - 평가 결과를 동료를 위해 요약한다
    practitioner: |
      할 수 있는 일:
      - 디지털 헬스 프로덕트의 평가와 편익 계획을 설계한다
      - 임상 성과, 안전, 경험에 적합한 지표를 고른다
      - 근거의 강도를 판단하고 그 한계를 설명한다
    expert: |
      할 수 있는 일:
      - 디지털 헬스 평가에 대한 조직의 접근 방식을 정한다
      - 학계 및 돌봄 파트너와 함께 연구와 평가 프로그램을 이끈다
      - 근거를 활용해 디지털 투자에 대해 이사회에 조언한다
clin-professional-practice:
  name: 디지털 분야의 면허 임상 실무
  description: 임상 직역의 기준, 윤리, 면허 갱신 의무를 지키면서, 최신의 면허 임상 지식과 판단을 디지털 업무에 가져온다.
  levels:
    awareness: |
      할 수 있는 일:
      - 면허를 가진 임상의에게 적용되는 직업 기준을 설명한다
      - 질문에 임상적 의견이 필요한 때를 알아본다
    working: |
      할 수 있는 일:
      - 자신의 실무 범위 안에서 임상 지식을 디지털 업무에 적용한다
      - 면허와 계속 전문성 개발을 최신 상태로 유지한다
      - 워크플로, 콘텐츠, 안전에 대해 임상적 의견을 낸다
    practitioner: |
      할 수 있는 일:
      - 디지털 서비스가 돌봄에 미치는 영향에 대해 건전한 임상 판단을 내린다
      - 디지털이든 임상 현장이든, 안전하지 않은 관행에 자신 있게 이의를 제기한다
      - 다른 임상의가 직업 기준을 디지털 업무에 적용하도록 지원한다
    expert: |
      할 수 있는 일:
      - 조직의 디지털 업무에 대한 임상 직업 기준을 이끈다
      - 환자 안전과 돌봄에 관한 결정에서 임상 분야의 상급 목소리 역할을 한다
      - 디지털 직무에 있는 임상의의 면허 갱신과 전문성 개발을 지원한다
ig-information-rights-requests:
  name: 정보 권리 요청
  description: 개인 건강 기록 열람 요청, 조직이 보유한 정보에 대한 요청 등 개인과 일반인의 정보 접근 요청을 법적 기한 안에 처리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 정보 권리 요청임을 알아보고 신속히 전달한다
      - 요청에는 법적 기한이 있음을 설명한다
    working: |
      할 수 있는 일:
      - 기한을 지키도록 요청을 기록하고, 접수를 알리고, 추적한다
      - 정보를 수집하고 가림 처리하며, 검토용 답변을 작성한다
      - 요청한 사람의 신원과 권한을 확인한다
    practitioner: |
      할 수 있는 일:
      - 제3자가 관련된 요청을 포함하여 복잡하거나 민감한 요청을 처리한다
      - 예외 사유를 적용하고 명확한 이유와 함께 무엇을 제외할지 결정한다
      - 답변에 대한 내부 재검토와 불만을 관리한다
    expert: |
      할 수 있는 일:
      - 조직 전반의 정보 권리에 대한 정책과 프로세스를 정한다
      - 규제 기관의 문의와 이의 신청에 대한 대응을 이끈다
      - 실적과 동향을 시니어 리더에게 보고한다
ig-records-retention:
  name: 기록 보존과 폐기
  description: 종이 기록과 디지털 기록에 보존 기간표를 적용하고, 적절한 시점에 감사 추적과 함께 보관하거나 안전하게 폐기한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 기록을 정해진 기간 동안 보존한 뒤 폐기하거나 보관하는 이유를 설명한다
      - 기록을 보관하고 옮기는 절차를 따른다
    working: |
      할 수 있는 일:
      - 기록에 보존 기간표를 적용하고 검토 시점이 된 기록을 표시한다
      - 보관 또는 안전한 폐기를 위해 기록을 준비하고 감사 추적을 유지한다
    practitioner: |
      할 수 있는 일:
      - 기록 서비스의 보존 및 폐기 프로그램을 운영한다
      - 디지털 기록을 포함한 새로운 유형의 기록의 보존에 대해 팀에 조언한다
      - 보존 기간표 준수 여부를 감사한다
    expert: |
      할 수 있는 일:
      - 조직의 보존 정책과 기간표를 정한다
      - 디지털 기록의 장기 보존을 계획한다
      - 법적 보존 명령과 조사 같은 복잡한 보존 문제를 해결한다
ig-data-protection-impact-assessment:
  name: 개인정보 영향평가
  description: 개인 데이터와 건강 데이터의 새로운 처리 또는 변경된 처리가 사생활에 미치는 위험을 평가하고, 처리가 시작되기 전에 통제 방안을 합의한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 개인정보 영향평가가 필요한 시점을 설명한다
      - 자신의 업무에 대한 사전 점검 설문을 작성한다
    working: |
      할 수 있는 일:
      - 프로젝트 팀이 개인정보 영향평가를 작성하도록 돕는다
      - 데이터 흐름을 설명하고 처리의 적법한 근거를 파악한다
      - 사생활 위험과 제안된 통제 방안을 기록한다
    practitioner: |
      할 수 있는 일:
      - 복잡한 시스템의 개인정보 영향평가를 검토하고 조언한다
      - 위험이 수용 가능한지 판단하고 통제 방안을 권고한다
      - 높은 위험을 상급자나 규제 기관의 검토에 올릴 시점을 결정한다
    expert: |
      할 수 있는 일:
      - 조직의 개인정보 영향평가 프로세스와 기준을 정한다
      - 대규모 데이터 공유나 AI 같은 위험이 가장 높은 처리에 대해 최종 조언을 한다
      - 법이 요구하는 경우 규제 기관과 협의한다
ig-incident-management:
  name: 정보 거버넌스 인시던트 관리
  description: 데이터 침해와 아차 사고를 기록하고, 조사하고, 그로부터 배우며, 규제 기관과 영향을 받은 사람에게 알릴 시점을 결정한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 데이터 침해나 아차 사고를 알아보고 즉시 보고한다
    working: |
      할 수 있는 일:
      - 인시던트를 기록하고 사실을 수집한다
      - 조직의 심각도 기준에 따라 인시던트를 평가한다
      - 종결될 때까지 조치를 추적한다
    practitioner: |
      할 수 있는 일:
      - 심각한 인시던트를 조사하고 근본 원인을 찾는다
      - 시니어 동료와 함께 규제 기관과 영향을 받은 사람에게 통지할지 결정한다
      - 교훈을 공유하고 개선 사항을 추적한다
    expert: |
      할 수 있는 일:
      - 정보 거버넌스의 인시던트 관리 프로세스를 정한다
      - 규제 기관이나 언론 대응을 포함하여 대규모 침해에 대한 대응을 이끈다
      - 인시던트 동향과 리스크를 이사회에 보고한다
ig-confidentiality-and-sharing:
  name: 비밀 유지와 정보 공유
  description: 돌봄, 안전, 법이 요구할 때 기밀 환자 정보가 적법하게 공유되도록 하면서, 정보 공유 협약 등을 통해 이를 보호한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 기밀 정보를 안전하게 지키고 허용되는 경우에만 공유한다
      - 확신이 서지 않을 때는 조언을 구한다
    working: |
      할 수 있는 일:
      - 정보 공유 요청이 정책에 맞는지 확인한다
      - 무엇을 누구와 왜 공유했는지 기록한다
      - 간단한 정보 공유 협약서를 작성한다
    practitioner: |
      할 수 있는 일:
      - 공익을 위한 동의 없는 공유 같은 복잡한 비밀 유지 문제에 조언한다
      - 파트너 조직과의 정보 공유 협약서를 검토한다
      - 동의 및 환자 이의 제기 규칙을 데이터 흐름에 적용한다
    expert: |
      할 수 있는 일:
      - 조직의 비밀 유지에 관한 상급 자문 역할을 한다
      - 가장 어려운 공개 결정을 해결한다
      - 파트너와의 정보 공유 체계를 정한다
ig-compliance-assurance:
  name: 정보 거버넌스 보증과 감사
  description: 연례 자체 평가, 감사, 근거, 개선 계획을 통해 조직이 정보 거버넌스 기준을 충족함을 확인하고 보여 준다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직이 정보를 잘 다루고 있음을 보여 주어야 하는 이유를 설명한다
      - 요청이 있을 때 감사에 쓸 근거를 제공한다
    working: |
      할 수 있는 일:
      - 연례 자체 평가를 위한 근거를 수집하고 정리한다
      - 접근 감사나 기록 관리 감사 같은 간단한 감사를 수행한다
      - 개선 조치를 추적한다
    practitioner: |
      할 수 있는 일:
      - 정보 거버넌스 보증 프로그램을 계획하고 운영한다
      - 근거가 기준을 충족하는지 판단하고 부족한 부분을 파악한다
      - 내부 및 외부 감사인과 협력한다
    expert: |
      할 수 있는 일:
      - 조직의 정보 거버넌스 보증 체계를 맡는다
      - 보증과 준수 현황을 이사회와 그 위원회에 보고한다
      - 리스크에 따라 개선 우선순위를 정한다
