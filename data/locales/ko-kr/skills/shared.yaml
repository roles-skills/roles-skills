health-care-context:
  name: 보건·돌봄 서비스 이해
  description: 보건·돌봄 서비스가 어떻게 조직되고 제공되는지, 임상의와 돌봄 직원이 어떻게 일하는지, 디지털 서비스가 환자 돌봄을 어떻게 뒷받침하는지 이해한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 보건·돌봄 시스템의 주요 부분과 조직이 지원하는 서비스를 설명한다
      - 자신의 업무에서 환자 안전과 비밀 유지가 중요한 이유를 설명한다
    working: |
      할 수 있는 일:
      - 자신의 업무가 뒷받침하는 임상 및 돌봄 워크플로를 설명한다
      - 임상 및 돌봄 동료와 일반적인 의료 용어를 올바르게 사용한다
      - 변경이 환자 돌봄에 영향을 줄 수 있는 때를 알아보고 제기한다
    practitioner: |
      할 수 있는 일:
      - 서비스가 조직 간 돌봄 경로에 어떻게 들어맞는지 분석한다
      - 임상의, 돌봄 직원, 환자와 협력하여 디지털 서비스를 형성한다
      - 디지털 결정이 돌봄, 안전, 직원 업무량에 미치는 영향을 설명한다
    expert: |
      할 수 있는 일:
      - 보건·돌봄 시스템에 대한 깊은 이해를 바탕으로 조직 전략을 형성한다
      - 보건·돌봄 파트너와 리더에게 조직을 대표한다
      - 정책과 서비스 변화가 디지털 서비스와 돌봄에 어떤 영향을 줄지 예측한다
clinical-safety:
  name: 임상 리스크 관리
  description: "임상 리스크 관리 프로세스, 위험 요소 로그, 안전 케이스(예: ISO 14971과 IEC 80001-1에 따른)를 통해 보건 IT 시스템이 환자에게 초래할 수 있는 리스크를 식별하고, 평가하고, 통제한다."
  levels:
    awareness: |
      할 수 있는 일:
      - 잘못되었거나, 빠졌거나, 지연된 정보 등을 통해 보건 IT 시스템이 환자에게 어떻게 해를 끼칠 수 있는지 설명한다
      - 임상 안전 문제 가능성을 올바른 경로로 보고한다
    working: |
      할 수 있는 일:
      - 위험 요소 워크숍에 참여하고 위험 요소 로그에 기여한다
      - 자신의 업무에 대해 임상 리스크 관리 프로세스를 따른다
      - 테스트 결과 같은 임상 안전 케이스의 근거를 제공한다
    practitioner: |
      할 수 있는 일:
      - 프로덕트나 변경의 위험 요소 식별과 리스크 평가를 이끈다
      - 위험 요소 로그와 임상 안전 케이스 보고서를 작성하고 유지한다
      - 프로덕트 팀과 리스크 통제에 합의하고 그것이 작동하는지 확인한다
      - 임상 리스크 관리 기준의 적용에 대해 팀에 조언한다
    expert: |
      할 수 있는 일:
      - 조직의 임상 리스크 관리 체계를 맡는다
      - 임상 안전 정책을 정하고 주요 시스템의 안전 케이스를 보증한다
      - 보건 IT와 관련된 중대한 안전 인시던트에 대한 대응을 이끈다
      - 디지털 팀 전반에 임상 안전 문화를 만든다
health-data-interoperability:
  name: 보건 데이터 상호운용성
  description: HL7 FHIR, HL7 버전 2, IHE 프로파일, 표준 API 같은 개방형 표준을 사용하여 시스템 간에 보건·돌봄 데이터를 안전하고 일관되게 교환한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 연계된 돌봄에 상호운용성이 중요한 이유를 설명한다
      - HL7 FHIR 등 주요 보건 데이터 교환 표준의 이름을 말한다
    working: |
      할 수 있는 일:
      - FHIR 리소스, 프로파일, API를 읽고 사용한다
      - 지도를 받아 간단한 연동을 구축하거나 테스트한다
      - 메시지를 사양에 비추어 확인한다
    practitioner: |
      할 수 있는 일:
      - FHIR, HL7 버전 2, 메시징 패턴을 사용해 연동을 설계하고 구축한다
      - FHIR 리소스와 구현 가이드를 작성하고 프로파일링한다
      - 시스템 간의 복잡한 매핑과 데이터 품질 문제를 해결한다
    expert: |
      할 수 있는 일:
      - 조직의 상호운용성 표준과 전략을 정한다
      - 국가 또는 조직 간 표준화 작업을 이끈다
      - 여러 시스템에 걸친 핵심 연동의 설계를 보증한다
clinical-terminology:
  name: 임상 용어와 분류
  description: SNOMED CT, ICD, LOINC 같은 임상 용어 체계와 분류를 사용하여 임상적 의미를 일관되게 기록하고 교환한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 임상 용어 체계와 분류의 차이를 설명한다
      - SNOMED CT와 ICD 같은 일반적인 용어 체계를 알아본다
    working: |
      할 수 있는 일:
      - 데이터 항목이나 양식에 맞는 코드를 찾아 사용한다
      - 용어 브라우저와 참조 세트를 사용한다
    practitioner: |
      할 수 있는 일:
      - 임상 용어 체계를 사용하여 데이터 모델과 참조 세트를 설계한다
      - 용어 체계와 분류 사이를 매핑하고 매핑의 한계를 설명한다
      - 프로덕트와 분석에서의 용어 사용에 대해 팀에 조언한다
    expert: |
      할 수 있는 일:
      - 조직의 용어 정책을 정한다
      - 용어 체계의 릴리스, 거버넌스, 품질 보증을 이끈다
      - 용어 표준화 기구에서 조직을 대표한다
information-governance:
  name: 정보 거버넌스와 개인정보 보호
  description: 개인정보 보호법, 비밀 유지, 동의, 개인정보 영향평가, 정보 공유를 포함하여 개인 정보와 건강 정보를 적법하고, 안전하며, 윤리적으로 다룬다.
  levels:
    awareness: |
      할 수 있는 일:
      - 개인 정보와 건강 정보를 다루는 조직의 규칙을 따른다
      - 데이터 침해나 아차 사고를 알아보고 보고한다
    working: |
      할 수 있는 일:
      - 개인정보 보호 원칙을 자신의 업무에 적용한다
      - 개인정보 영향평가에 기여한다
      - 정보 요청과 기록을 올바르게 처리한다
    practitioner: |
      할 수 있는 일:
      - 개인정보 영향평가와 정보 공유 협약을 이끈다
      - 적법한 근거, 동의, 비밀 유지, 보존에 대해 팀에 조언한다
      - 인시던트를 조사하고 개선을 권고한다
    expert: |
      할 수 있는 일:
      - 정보 거버넌스 정책과 전략을 정한다
      - 정보 리스크와 준수에 대해 이사회에 조언한다
      - 규제 기관과 파트너에게 조직을 대표한다
medical-device-regulation:
  name: 의료기기 소프트웨어 규제
  description: 소프트웨어가 의료기기에 해당하는 때와, 그에 적용되는 IEC 62304와 ISO 13485 같은 표준 및 프로세스를 이해한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 일부 보건 소프트웨어는 의료기기로 규제됨을 설명한다
      - 제품이 의료기기일 수 있을 때 누구에게 물어야 하는지 안다
    working: |
      할 수 있는 일:
      - 의료기기 표준을 충족하는 소프트웨어 생애 주기 프로세스를 따른다
      - 그 프로세스가 요구하는 기록을 작성한다
    practitioner: |
      할 수 있는 일:
      - 제품이 의료기기인지와 그 가능성이 높은 등급을 평가한다
      - 품질 및 임상 동료와 함께 제품의 규제 대응 작업을 계획한다
    expert: |
      할 수 있는 일:
      - 규제 대상 소프트웨어에 대한 조직의 접근 방식을 정한다
      - 규제 기관 및 인증 기관과의 협의를 이끈다
people-management:
  name: 피플 매니지먼트
  description: 채용, 목표, 평가, 웰빙, 근태를 포함하여 직원을 이끌고, 육성하고, 지원하며 실적과 행위를 공정하게 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 자신에게 영향을 주는 조직의 인사 정책을 설명한다
      - 새로 들어온 동료를 돕고 지식을 공유한다
    working: |
      할 수 있는 일:
      - 일상 업무를 감독하고 피드백을 준다
      - 채용과 입사 교육에 참여한다
      - 정기적으로 1대1 면담을 한다
    practitioner: |
      할 수 있는 일:
      - 목표를 설정하고 평가를 하며 팀을 직접 관리한다
      - 웰빙을 지원하고 근태, 실적, 행위를 관리한다
      - 팀의 육성과 승계를 계획한다
    expert: |
      할 수 있는 일:
      - 매니저를 이끌고 큰 영역의 문화를 형성한다
      - 인력 계획과 조직 변경을 설계한다
      - 리더를 코칭하고 복잡한 사람 문제를 해결한다
equality-diversity-inclusion:
  name: 평등, 다양성, 포용
  description: 사람을 공정하게 대하고, 차이를 존중하며, 모든 사람을 포용하는 서비스와 직장을 설계한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 동료, 환자, 시민을 존엄과 존중으로 대한다
      - 평등과 포용 정책을 따른다
    working: |
      할 수 있는 일:
      - 다른 사람을 배제하는 행동을 알아보고 이의를 제기한다
      - 업무를 계획할 때 다양한 필요를 고려한다
    practitioner: |
      할 수 있는 일:
      - 평등 영향 평가를 실시한다
      - 포용적인 팀과 실천을 만든다
    expert: |
      할 수 있는 일:
      - 포용 전략을 정하고 조직이 이를 책임지게 한다
      - 평등, 다양성, 포용에 관한 문화 변화를 이끈다
health-safety-wellbeing:
  name: 보건, 안전, 웰빙
  description: 리스크 평가, 안전한 작업 방식, 인시던트 보고를 포함하여 직장에서 자신과 다른 사람의 안전과 건강을 지킨다.
  levels:
    awareness: |
      할 수 있는 일:
      - 보건·안전 규칙을 따르고 위험 요소와 인시던트를 보고한다
    working: |
      할 수 있는 일:
      - 업무 환경 평가 같은 간단한 리스크 평가를 한다
      - 동료가 안전하게 일하도록 돕는다
    practitioner: |
      할 수 있는 일:
      - 팀이나 사업장의 보건과 안전을 관리한다
      - 인시던트를 조사하고 통제를 도입한다
    expert: |
      할 수 있는 일:
      - 조직의 보건, 안전, 웰빙 정책을 정한다
      - 안전 실적을 이사회에 보고한다
budget-management:
  name: 예산 관리
  description: 예측, 차이 관리, 재무 규칙 준수를 포함하여 예산을 계획하고, 모니터링하고, 통제한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 지출과 주문 규칙을 따른다
      - 자신의 업무 자금이 어디서 오는지 설명한다
    working: |
      할 수 있는 일:
      - 작은 예산에 대한 지출을 추적하고 차이를 알린다
      - 자신의 한도 안에서 지출을 승인한다
    practitioner: |
      할 수 있는 일:
      - 예산을 보유하고 관리하며, 차이를 예측하고 설명한다
      - 비용과 편익을 보여 주는 비즈니스 케이스를 작성한다
    expert: |
      할 수 있는 일:
      - 큰 예산이나 여러 예산을 관리하고 재무 계획을 정한다
      - 서비스 간의 자금 득실을 조정한다
project-management:
  name: 프로젝트 관리
  description: PRINCE2, PM², 애자일 방법론 등 공인된 방법론을 사용하여 합의된 범위, 기간, 비용, 품질로 프로젝트를 계획하고, 수행하고, 완료한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 프로젝트의 단계와 그 안의 주요 역할을 설명한다
      - 조치 로그 같은 프로젝트 기록을 보관한다
    working: |
      할 수 있는 일:
      - 계획, 리스크·이슈 로그, 보고서를 유지한다
      - 프로젝트 회의를 운영하고 조치 사항을 추적한다
      - 지원을 받아 작고 명확하게 정의된 프로젝트를 관리한다
    practitioner: |
      할 수 있는 일:
      - 범위, 기간, 비용, 품질을 관리하며 시작부터 종료까지 프로젝트를 관리한다
      - 리스크, 이슈, 의존성, 변경 관리를 수행한다
      - 프로젝트 위원회에 보고하고 공급자를 관리한다
    expert: |
      할 수 있는 일:
      - 대규모이거나, 복잡하거나, 위험이 높은 프로젝트를 관리한다
      - 프로젝트 관리 기준을 정하고 프로젝트 매니저를 코칭한다
      - 정체된 프로젝트를 되살린다
risk-management:
  name: 조직 리스크 관리
  description: 리스크 등록부와 정해진 리스크 선호도를 사용하여 조직의 목표에 대한 리스크를 식별하고, 평가하고, 기록하고, 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 리스크가 무엇이고 어떻게 제기하는지 설명한다
    working: |
      할 수 있는 일:
      - 자기 영역의 리스크를 기록하고 갱신한다
      - 통제 방안을 제안하고 대응을 추적한다
    practitioner: |
      할 수 있는 일:
      - 디렉터레이트나 프로그램의 리스크 프로세스를 운영한다
      - 리스크를 리스크 선호도에 비추어 평가하고 상위에 보고한다
      - 리스크를 위원회에 보고한다
    expert: |
      할 수 있는 일:
      - 조직의 리스크 관리 체계와 리스크 선호도를 설계한다
      - 전략적 리스크에 대해 이사회에 조언한다
security-operations:
  name: 보안 운영
  description: SIEM과 엔드포인트 탐지 같은 도구를 사용하여 보안 위협이 없는지 시스템을 모니터링하고, 알림을 분류하며, 이벤트를 조사하고, 사이버 인시던트에 대응한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 피싱과 랜섬웨어 같은 일반적인 사이버 위협을 설명한다
      - 의심스러운 보안 이벤트를 보고한다
    working: |
      할 수 있는 일:
      - 알림을 모니터링하고 런북을 사용해 분류한다
      - 증거를 수집하고 이벤트를 상위에 보고한다
      - 지도를 받아 간단한 탐지 규칙을 조정한다
    practitioner: |
      할 수 있는 일:
      - 보안 인시던트를 조사하고 봉쇄한다
      - 탐지 규칙을 작성하고 위협 헌팅을 수행한다
      - 인시던트 이후 런북과 도구를 개선한다
    expert: |
      할 수 있는 일:
      - 보안 운영 서비스와 그 전략을 이끈다
      - 대규모 사이버 인시던트에 대한 대응을 이끈다
      - 국가 보안 기관 및 파트너와 협력한다
vulnerability-management:
  name: 취약점 관리
  description: 스캔, 침투 테스트, 패치 적용을 포함하여 기술적 취약점을 찾고, 평가하고, 우선순위를 정하고, 수정한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 신속한 패치 적용과 안전한 구성이 중요한 이유를 설명한다
    working: |
      할 수 있는 일:
      - 취약점 스캔을 실행하고 결과를 보고한다
      - 시스템 담당자와 함께 수정 사항을 추적한다
    practitioner: |
      할 수 있는 일:
      - 환자 서비스에 대한 위험을 포함하여 리스크에 따라 취약점의 우선순위를 정한다
      - 침투 테스트와 시정 조치의 범위를 정하고 관리한다
    expert: |
      할 수 있는 일:
      - 취약점 관리 정책과 그 목표를 정한다
      - 기술적 보안 리스크를 시니어 리더에게 보고한다
identity-and-access-management:
  name: 아이덴티티 및 접근 관리
  description: 역할 기반 접근 제어와 스마트카드, 다중 인증을 포함하여 직원, 환자, 시스템의 디지털 아이덴티티, 인증, 접근 권한을 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 접근 규칙을 따르고 자신의 인증 정보를 보호한다
    working: |
      할 수 있는 일:
      - 사용자 계정과 접근 권한을 생성, 변경, 삭제한다
      - 접근 권한을 역할 기반 접근 규칙에 비추어 확인한다
    practitioner: |
      할 수 있는 일:
      - 아이덴티티 및 접근 서비스를 설계하고 운영한다
      - 접근 권한을 정기적으로 검토하고 문제를 수정한다
    expert: |
      할 수 있는 일:
      - 직원, 환자, 시스템의 아이덴티티 및 접근 전략을 정한다
      - 새로운 아이덴티티 표준의 도입을 이끈다
data-quality:
  name: 데이터 품질 관리
  description: 완전성, 정확성, 적시성, 유효성을 포함하여 데이터의 품질을 정의하고, 측정하고, 개선한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 정확한 보건 데이터가 돌봄과 계획에 중요한 이유를 설명한다
      - 데이터를 정확하게 기록하고 오류를 보고한다
    working: |
      할 수 있는 일:
      - 데이터 품질 점검을 실행하고 오류를 바로잡는다
      - 데이터 품질 보고서를 동료에게 설명한다
    practitioner: |
      할 수 있는 일:
      - 데이터 품질 규칙과 지표를 정의한다
      - 데이터 제공처와 협력해 품질 저하의 근본 원인을 수정한다
    expert: |
      할 수 있는 일:
      - 조직과 그 파트너의 데이터 품질 기준을 정한다
      - 데이터 품질 개선 프로그램을 이끈다
health-records-management:
  name: 진료 기록 관리
  description: 생성, 정리, 추적, 접근, 보존, 폐기를 포함하여 보건·돌봄 기록을 생애 주기 전반에 걸쳐 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 기록을 올바르게 정리하고, 찾고, 추적한다
      - 기록을 분실이나 무단 접근으로부터 보호한다
    working: |
      할 수 있는 일:
      - 기록 접근 요청을 처리한다
      - 보존 기간표와 기록 관리 기준을 적용한다
    practitioner: |
      할 수 있는 일:
      - 기록 서비스와 그 절차를 관리한다
      - 기록 관리를 감사하고 직원을 교육한다
    expert: |
      할 수 있는 일:
      - 기록 관리 정책과 전략을 정한다
      - 종이 기록에서 디지털 기록으로의 전환을 이끈다
clinical-coding:
  name: 임상 코딩
  description: 돌봄, 지급, 통계를 위해 국내 및 국제 코딩 규칙에 따라 진료 기록의 임상 정보를 표준 분류 코드로 변환한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 임상 코딩이 무엇이고 그것이 중요한 이유를 설명한다
      - 기본적인 의학 용어와 해부학을 사용한다
    working: |
      할 수 있는 일:
      - 분류 규칙을 사용하여 단순한 에피소드를 정확하게 코딩한다
      - 불명확한 기록에 대해 임상의에게 문의한다
    practitioner: |
      할 수 있는 일:
      - 진료과를 넘나드는 복잡한 에피소드를 코딩한다
      - 코딩 품질을 감사하고 코더를 교육한다
    expert: |
      할 수 있는 일:
      - 코딩 서비스와 그 품질 프로그램을 이끈다
      - 코딩 표준과 그것이 데이터와 재원에 미치는 영향에 대해 조언한다
clinical-leadership-in-digital:
  name: 디지털 분야의 임상 리더십
  description: 안전한 디지털 서비스의 설계, 도입, 사용에 임상 지식과 신뢰성을 가져오고, 디지털 변화 속에서 임상의를 이끈다.
  levels:
    awareness: |
      할 수 있는 일:
      - 디지털 서비스가 임상 실무를 어떻게 바꾸는지 설명한다
    working: |
      할 수 있는 일:
      - 워크플로와 안전에 대해 프로덕트 팀에 임상적 의견을 낸다
      - 임상 동료가 새로운 시스템을 도입하도록 돕는다
    practitioner: |
      할 수 있는 일:
      - 프로덕트나 프로그램의 임상 참여를 이끈다
      - 임상적 필요와 근거를 요구사항으로 바꾼다
      - 임상 동료들 사이에서 안전한 도입을 이끈다
    expert: |
      할 수 있는 일:
      - 조직의 디지털 서비스에 대한 임상적 방향을 정한다
      - 디지털 변화 속에서 조직 전반의 임상 리더를 이끈다
      - 디지털 투자의 임상적 리스크와 편익에 대해 이사회에 조언한다
governance-and-compliance:
  name: 기업 거버넌스와 컴플라이언스
  description: 이사회, 위원회, 의사 규칙, 정책, 이해관계 신고, 법적·규제적 의무 준수를 포함하여 조직의 거버넌스를 지원한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 정책과 의사결정 규칙을 따른다
    working: |
      할 수 있는 일:
      - 위원회 회의, 자료, 회의록을 지원한다
      - 거버넌스 등록부를 최신으로 유지한다
    practitioner: |
      할 수 있는 일:
      - 이사회와 위원회의 거버넌스 주기를 운영한다
      - 정책을 검토하고 컴플라이언스에 대해 조언한다
    expert: |
      할 수 있는 일:
      - 거버넌스 체계를 설계하고 이사회에 조언한다
      - 연간 거버넌스 보고와 보증을 이끈다
