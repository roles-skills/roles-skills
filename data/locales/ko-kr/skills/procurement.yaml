proc-purchase-to-pay:
  name: 구매에서 지급까지
  description: 조직의 구매 시스템과 재무 통제를 통해 주문을 올리고, 승인하고, 검수하며, 청구서와 지급 문의를 해결한다.
  levels:
    awareness: |
      할 수 있는 일:
      - '구매 주문서 없이는 지급 없음' 규칙과 그것이 중요한 이유를 설명한다
      - 구매 시스템에서 구매 요청을 올린다
    working: |
      할 수 있는 일:
      - 구매 주문서를 작성하고 수정하며 계약에 비추어 확인한다
      - 공급자 및 재무와 청구서, 검수, 지급 문의를 해결한다
      - 구매 시스템의 카탈로그와 공급자 기록을 유지한다
    practitioner: |
      할 수 있는 일:
      - 서비스의 구매에서 지급까지의 프로세스를 운영하며 준수 현황과 적체를 모니터링한다
      - 지출 데이터를 분석하여 계약 외 지출과 절감 기회를 찾는다
      - 재무 동료와 함께 프로세스와 통제를 개선한다
    expert: |
      할 수 있는 일:
      - 조직의 구매에서 지급까지의 정책, 통제, 시스템을 정한다
      - 완전한 전자 구매와 전자 청구로의 전환을 이끈다
proc-procurement-process:
  name: 조달 프로세스
  description: 계획과 사양 수립부터 시장 진입 경로, 입찰, 낙찰, 계약 체결까지, 프레임워크와 동적 구매 시스템을 통한 구매를 포함하여 규정을 지키는 조달을 수행한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조달의 단계와 적용되는 기준 금액을 설명한다
      - 조직의 규칙에 따라 소액 구매의 견적을 받는다
    working: |
      할 수 있는 일:
      - 표준 템플릿을 사용해 견적과 프레임워크 개별 계약을 수행한다
      - 전자 입찰 시스템에서 입찰 서류를 준비하고 질의를 관리한다
      - 각 조달의 명확한 감사 증적을 남긴다
    practitioner: |
      할 수 있는 일:
      - 적합한 시장 진입 경로와 절차를 선택하며 복잡한 입찰을 계획하고 이끈다
      - 사용자가 디지털 및 임상 시스템의 성과 기반 사양을 쓰도록 돕는다
      - 계약 체결까지 일정, 리스크, 이해관계자를 관리한다
    expert: |
      할 수 있는 일:
      - 조직의 조달 절차와 템플릿을 정한다
      - 가장 복잡하거나, 가치가 크거나, 새로운 조달을 이끈다
      - 이사회를 위해 조달 결정을 보증한다
proc-tender-evaluation:
  name: 입찰 평가
  description: 평가 기준과 가중치를 설계하고, 품질, 가격, 사회적 가치에 대한 공정하고 기록이 잘 남는 평가를 수행한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 평가가 공표된 기준을 따라야 하는 이유를 설명한다
      - 평가에 참여하기 전에 이해 상충을 신고한다
    working: |
      할 수 있는 일:
      - 입찰서의 적합성과 완전성을 확인한다
      - 평가자를 지원하고 점수와 조정 메모를 기록한다
      - 지도를 받아 가격 평가 모델을 준비한다
    practitioner: |
      할 수 있는 일:
      - 평가 기준, 가중치, 채점 지침을 설계한다
      - 조정을 이끌고 낙찰 보고서와 입찰자 대상 피드백을 작성한다
      - 시스템 입찰의 시연과 임상 또는 사용자 시나리오 테스트를 계획한다
    expert: |
      할 수 있는 일:
      - 조직의 평가 기준과 가격 및 품질에 대한 접근 방식을 정한다
      - 평가 결정에 이의가 제기되었을 때 이를 방어한다
      - 위험이 높은 조달의 평가를 검토한다
proc-procurement-law-and-policy:
  name: 공공 조달 규칙과 정책
  description: 구매가 적법하고, 투명하며, 공정하도록 공공 조달 규칙, 조직의 재무 규칙, 조달 정책을 적용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 공적 자금은 공정하고, 공개적이며, 적법하게 써야 함을 설명한다
      - 조직의 기준 금액과 승인 규칙을 따른다
    working: |
      할 수 있는 일:
      - 단순한 구매에 맞는 조달 규칙을 적용한다
      - 투명성 규칙에 맞는 공고를 게시하고 기록을 보관한다
      - 요청이 규칙을 어길 위험이 있을 때 알아보고 제기한다
    practitioner: |
      할 수 있는 일:
      - 복잡한 조달과 계약 변경의 적법한 경로에 대해 조언한다
      - 이의 제기 리스크를 관리하고 대기 기간과 결과 설명을 올바르게 처리한다
      - 조직의 조달 정책과 지침을 작성한다
    expert: |
      할 수 있는 일:
      - 새로운 조달 규칙을 해석하고 조직의 대응을 이끈다
      - 조달 준수와 리스크에 대해 이사회에 조언한다
      - 법률 자문과 함께 공식 이의 제기를 관리한다
proc-market-analysis:
  name: 시장 분석과 소통
  description: 공급 시장을 이해하고, 조달에 앞서 공급자와 소통하며, 시장의 근거를 활용해 요구사항, 시장 진입 경로, 상업 모델을 형성한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 프레임워크와 공급자 데이터베이스에서 공급자를 찾는다
      - 초기 시장 소통이 모든 공급자에게 공정해야 하는 이유를 설명한다
    working: |
      할 수 있는 일:
      - 요구사항에 대한 시장 정보, 가격, 공급자 세부 정보를 모은다
      - 정보 제공 요청을 실시하고 응답을 요약한다
    practitioner: |
      할 수 있는 일:
      - 공급 시장과 그 경쟁, 리스크, 동향을 분석한다
      - 경쟁을 왜곡하지 않으면서 공급자의 날 같은 초기 시장 소통을 이끈다
      - 시장의 근거를 활용해 요구사항과 상업 모델을 형성한다
    expert: |
      할 수 있는 일:
      - 신규 또는 소규모 공급자를 장려하는 등 시장을 형성한다
      - 다른 구매 조직과 함께 시장 전략을 이끈다
proc-negotiation:
  name: 상업적 협상
  description: 비용 대비 가치를 제공하고 리스크를 관리하는 가격, 조건, 성과에 합의하도록 공급자와의 협상을 계획하고 수행한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 공공 조달에서 무엇을 협상할 수 있고 없는지 설명한다
    working: |
      할 수 있는 일:
      - 소액이거나 정형적인 구매의 가격과 조건을 협상한다
      - 다른 사람이 이끄는 협상을 위해 데이터와 선택지를 준비한다
    practitioner: |
      할 수 있는 일:
      - 목표, 한도, 대안 입장을 정하고 협상을 계획하여 이끈다
      - 계약 변경, 갱신, 분쟁 합의를 협상한다
      - 협상이 적법하고 기록이 잘 남도록 한다
    expert: |
      할 수 있는 일:
      - 전략적 공급자와의 가치가 크고 위험이 높은 협상을 이끈다
      - 다른 사람에게 협상을 코칭하고 조직의 협상 접근 방식을 정한다
proc-category-management:
  name: 카테고리 관리
  description: 수요를 모으고, 요구사항을 형성하며, 수년에 걸친 조달을 계획하는 카테고리 전략을 통해 소프트웨어, 클라우드, 기술 서비스 같은 지출 카테고리를 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 카테고리가 무엇이고 카테고리 계획이 중요한 이유를 설명한다
    working: |
      할 수 있는 일:
      - 카테고리의 지출과 계약을 분석하고 계약 등록부를 최신으로 유지한다
      - 갱신과 절감 추적 같은 카테고리 계획을 지원한다
    practitioner: |
      할 수 있는 일:
      - 예산 보유자 및 기술 리드와 함께 카테고리 전략을 작성하고 실행한다
      - 카테고리의 조달과 계약 갱신 파이프라인을 계획한다
      - 카테고리의 절감, 가치, 리스크를 추적한다
    expert: |
      할 수 있는 일:
      - 조직의 카테고리 관리 접근 방식을 정한다
      - 지출과 리스크가 가장 큰 카테고리를 이끌고 조직 전략과 일치시킨다
      - 다른 조직과 공동 구매에 협력한다
proc-technology-procurement:
  name: 기술 및 클라우드 조달
  description: 서비스형 소프트웨어, 상업 모델, 라이선스, 그리고 헬스 기술에 필요한 보안, 개인정보 보호, 상호운용성 조건을 포함하여 소프트웨어, 클라우드 서비스, 라이선스, 하드웨어, 디지털 서비스를 구매한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 라이선스, 구독, 서비스 등 기술을 구매하는 주요 방식을 설명한다
      - 임상 시스템에 보안, 임상 안전, 개인정보 보호 점검이 필요함을 알아본다
    working: |
      할 수 있는 일:
      - 프레임워크를 통해 표준 소프트웨어, 하드웨어, 라이선스를 구매한다
      - 라이선스 수, 갱신, 정산 일자를 추적한다
      - 서류에 표준 보안 및 개인정보 보호 요구사항을 포함한다
    practitioner: |
      할 수 있는 일:
      - 적합한 상업 모델을 골라 클라우드, 서비스형 소프트웨어, 임상 시스템을 구매한다
      - 기술, 임상 안전, 정보 거버넌스 리드와 함께 요구사항을 만든다
      - 계약에 상호운용성, 개방형 표준, 데이터 소유권, 종료 조건을 포함한다
      - 갱신 시 이식성과 경쟁을 계획하여 종속을 피한다
    expert: |
      할 수 있는 일:
      - 기술과 클라우드에 대한 조직의 상업 전략을 정한다
      - 전사 계약과 전략적 플랫폼의 협상을 이끈다
      - 기술 선택의 상업적 리스크에 대해 디지털 리더에게 조언한다
proc-contract-management:
  name: 계약 관리
  description: 조직이 지불한 대가를 얻도록 도입, 성과, 지급, 변경, 분쟁, 갱신, 종료를 포함하여 낙찰 후의 계약을 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 계약을 찾아 그 주요 일자, 금액, 담당자를 설명한다
      - 계약 변경과 문서를 계약 등록부에 기록한다
    working: |
      할 수 있는 일:
      - 서비스 수준과 핵심 성과 지표에 비추어 공급자의 성과를 모니터링한다
      - 계약 검토 회의를 준비하고 조치 사항을 추적한다
      - 계약 변경을 처리하고 청구서를 계약에 비추어 확인한다
    practitioner: |
      할 수 있는 일:
      - 임상 및 기술 계약을 포함한 계약 포트폴리오를 관리한다
      - 성과가 미흡할 때 서비스 크레딧 같은 계약상의 구제 수단을 사용한다
      - 조달 규칙 안에서 변경, 분쟁, 갱신을 관리한다
      - 종료를 일찍 계획하고 계약이 끝나기 전에 종료 계획을 시험한다
    expert: |
      할 수 있는 일:
      - 조직의 계약 관리 체계와 기준을 정한다
      - 전략적이고 위험이 높은 계약의 관리를 이끈다
      - 대규모 분쟁을 해결하고 해지 또는 재조달을 결정한다
proc-supplier-relationship-management:
  name: 공급자 관계 관리
  description: 리스크를 관리하고, 성과를 높이고, 시간이 지나면서 제품과 서비스를 발전시키기 위해 핵심 공급자와 전략적 관계를 구축한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 환자가 의존하는 서비스에 좋은 공급자 관계가 중요한 이유를 설명한다
      - 공급자를 전문적으로 대하고 연락 내용을 기록한다
    working: |
      할 수 있는 일:
      - 공급자 연락처, 상위 보고 경로, 기록을 최신으로 유지한다
      - 공급자의 재무 건전성과 보험을 요건에 비추어 확인한다
    practitioner: |
      할 수 있는 일:
      - 공급자를 리스크와 가치에 따라 구분하고 각 집단을 어떻게 관리할지 계획한다
      - 로드맵과 개선 계획을 포함하여 핵심 공급자와 전략적 검토를 실시한다
      - 재무 파탄, 사이버 인시던트, 공급망 문제 같은 공급자 리스크를 관리한다
    expert: |
      할 수 있는 일:
      - 조직의 공급자 관계 전략을 정한다
      - 전략적 공급자와의 경영진 수준의 관계를 이끈다
      - 핵심 공급자가 무너졌을 때의 대응을 이끈다
proc-exit-planning:
  name: 종료 계획과 데이터 반환
  description: 새로운 공급자로의 이행, 데이터의 반환과 삭제, 환자와 직원을 위한 서비스 연속성을 포함하여 계약의 종료를 계획하고 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 모든 계약에 종료 계획이 필요한 이유를 설명한다
      - 계약의 종료 조건과 데이터 반환 조건을 찾는다
    working: |
      할 수 있는 일:
      - 종료 계획과 자산 및 데이터 등록부를 최신으로 유지한다
      - 통지 기간과 종료 마일스톤을 추적한다
    practitioner: |
      할 수 있는 일:
      - 기술, 데이터, 임상 리드와 함께 종료 및 이행 계획을 작성한다
      - 데이터가 사용 가능한 표준 형식으로 반환되고 그 후 안전하게 삭제되도록 한다
      - 돌봄이 중단되지 않도록 이행 리스크를 관리한다
    expert: |
      할 수 있는 일:
      - 종료, 이행, 데이터 반환에 관한 조직의 기준을 정한다
      - 전략적인 임상 및 기술 계약의 종료를 이끈다
proc-social-value:
  name: 사회적 가치와 지속 가능한 조달
  description: 조달과 계약을 활용해 사회적 가치, 환경적 지속 가능성, 공정한 공급망을 실현하고 공급자가 이행한 바를 측정한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 사회적 가치와 지속 가능한 조달이 조직에 무엇을 의미하는지 설명한다
    working: |
      할 수 있는 일:
      - 입찰에 표준 사회적 가치 및 지속 가능성 질문을 포함한다
      - 공급자로부터 사회적 가치 보고서를 수집한다
    practitioner: |
      할 수 있는 일:
      - 계약에 맞는 사회적 가치와 지속 가능성 기준을 정한다
      - 지역 일자리, 기술, 탄소 감축 같은 공급자의 약속을 관리한다
      - 강제 노동과 그 밖의 인권 침해 같은 위험이 없는지 공급망을 확인한다
    expert: |
      할 수 있는 일:
      - 조직의 사회적 가치 및 지속 가능한 조달 정책을 정한다
      - 사회적 가치와 탄소 성과를 이사회에 보고한다
