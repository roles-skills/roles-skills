corp-administration:
  name: 사무 행정
  description: 문서 정리, 주문, 데이터 입력, 기록, 사무 절차 준수 등, 팀이나 서비스가 돌아가게 하는 행정 프로세스를 운영한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 문서 정리, 주문, 데이터 입력에 관한 사무 절차를 따른다
      - 자신의 업무 기록을 정확하게 남긴다
    working: |
      할 수 있는 일:
      - 감독을 거의 받지 않고 팀을 위한 다양한 행정 프로세스를 운영한다
      - 기록과 데이터의 오류를 찾아 고친다
      - 더 단순한 업무 방식을 제안한다
    practitioner: |
      할 수 있는 일:
      - 서비스나 디렉터레이트의 행정 지원을 조직한다
      - 행정 절차를 작성하고 개선한다
      - 다른 사무 담당자를 교육하고 업무를 점검한다
    expert: |
      할 수 있는 일:
      - 조직 전반의 행정 서비스를 설계한다
      - 더 단순한 디지털 행정 프로세스로의 전환을 이끈다
corp-office-software:
  name: 디지털 오피스 도구
  description: 워드 프로세서, 스프레드시트, 프레젠테이션, 이메일, 공유 문서, 협업 도구를 빠르고 정확하게 사용한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 문서, 이메일, 간단한 스프레드시트를 만들고 편집한다
      - 파일을 올바른 위치에 저장하고 공유한다
    working: |
      할 수 있는 일:
      - 서식이 잘 갖춰진 문서와 발표 자료를 빠르고 정확하게 만든다
      - 스프레드시트로 데이터를 정렬, 필터링, 요약한다
      - 협업 도구로 공유 문서와 버전을 관리한다
    practitioner: |
      할 수 있는 일:
      - 템플릿, 트래커, 간단한 자동화 워크플로를 만든다
      - 모든 사람이 접근할 수 있는 문서를 만든다
      - 동료가 오피스 도구를 최대한 활용하도록 돕는다
    expert: |
      할 수 있는 일:
      - 템플릿, 문서 관리, 협업 도구의 기준을 정한다
      - 조직 전반에서 새로운 오피스 도구의 도입을 이끈다
corp-diary-and-meeting-management:
  name: 일정 및 회의 관리
  description: 사람들의 시간이 잘 쓰이고 회의에 적절한 사람, 자료, 회의실이 갖춰지도록 일정, 회의, 출장을 관리한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직의 도구로 회의와 회의실을 예약한다
      - 초대장과 자료를 제때 보낸다
    working: |
      할 수 있는 일:
      - 일정 충돌을 해결하며 팀의 일정을 관리한다
      - 외부 파트너와의 출장, 행사, 회의를 준비한다
      - 회의 전에 자료와 조치 사항이 준비되도록 한다
    practitioner: |
      할 수 있는 일:
      - 시니어 리더와 우선순위를 정하며 그 일정을 관리한다
      - 무엇이 리더의 시간을 필요로 하고 무엇을 다른 사람이 처리할 수 있는지 판단한다
      - 이사회나 리더십 팀의 연간 회의 주기를 계획한다
    expert: |
      할 수 있는 일:
      - 경영진의 업무 주기를 운영한다
      - 시니어 리더의 시간이 조직의 우선순위에 집중되도록 한다
corp-minute-taking:
  name: 회의록 작성과 회의 기록
  description: 논의, 결정, 조치 사항을 정확하고 간결하게 기록하고 공식 회의 기록을 보관한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 팀 회의에서 조치 사항과 결정을 메모한다
    working: |
      할 수 있는 일:
      - 정례 회의의 정확하고 간결한 회의록과 조치 사항 목록을 쓴다
      - 담당자와 함께 조치 사항을 후속 관리한다
    practitioner: |
      할 수 있는 일:
      - 복잡하거나 논란이 있는 논의를 포함하여 이사회와 위원회의 공식 회의록을 작성한다
      - 감사와 조사를 견딜 수 있는 공식 회의 기록을 보관한다
      - 기록에 무엇이 담겨야 하는지 의장에게 조언한다
    expert: |
      할 수 있는 일:
      - 조직 전반의 공식 회의 기록에 대한 기준을 정한다
      - 회의록 작성자를 교육하고 품질을 점검한다
corp-correspondence-management:
  name: 서신 및 문의 처리
  description: 편지, 이메일, 전화, 문의를 신속하고 정중하게 처리하고 적절한 사람에게 전달한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 전화와 이메일에 정중하게 응대하고 정확하게 메시지를 받는다
      - 문의를 적절한 사람에게 전달한다
    working: |
      할 수 있는 일:
      - 정형적인 서신과 문의를 직접 처리한다
      - 다른 사람이 서명할 편지와 답신을 작성한다
      - 서신 기록을 관리하고 답변을 독촉한다
    practitioner: |
      할 수 있는 일:
      - 민감한 서신과 불만 서신을 포함하여 시니어 리더의 서신을 관리한다
      - 재치, 정확성, 판단력이 필요한 답신을 작성한다
      - 답신이 기한을 지키도록 한다
    expert: |
      할 수 있는 일:
      - 경영진 서신의 프로세스와 기준을 정한다
      - 규제 기관, 파트너, 언론과의 서신을 포함하여 가장 민감한 서신을 처리한다
corp-pmo-reporting:
  name: 프로젝트·포트폴리오 오피스 지원
  description: 계획, 등록부, 보고, 문서 관리, 보증 점검 등 프로젝트 및 포트폴리오 오피스의 프로세스를 운영한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 프로젝트 문서를 버전 관리와 함께 올바른 위치에 보관한다
      - 요청이 있을 때 조치, 리스크, 이슈 로그를 갱신한다
    working: |
      할 수 있는 일:
      - 여러 프로젝트의 계획, 등록부, 트래커를 유지한다
      - 진행 상황을 수집하여 정기 현황 보고서를 작성한다
      - 프로젝트가 합의된 방법을 따르는지 확인한다
    practitioner: |
      할 수 있는 일:
      - 포트폴리오 보고를 설계하고 프로젝트 전반의 진행, 리스크, 편익을 분석한다
      - 보증 점검과 게이트웨이 리뷰를 운영한다
      - 방법과 통제에 대해 프로젝트 매니저에게 조언한다
    expert: |
      할 수 있는 일:
      - 조직의 포트폴리오 오피스를 설립하고 이끈다
      - 시니어 리더에게 포트폴리오에 관한 명확하고 신뢰할 수 있는 통찰을 제공한다
      - 프로젝트 및 포트폴리오 관리의 기준과 도구를 정한다
corp-assurance-and-audit:
  name: 보증 및 감사 연락
  description: 통제가 작동한다는 보증을 모으고, 내부 및 외부 감사를 지원하며, 감사 권고 사항을 완료될 때까지 추적한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직에서 감사와 보증이 어떻게 이루어지는지 설명한다
      - 요청이 있을 때 근거를 제공한다
    working: |
      할 수 있는 일:
      - 감사와 점검을 위한 근거를 조율한다
      - 감사 권고 사항을 추적하고 기한이 지난 조치를 독촉한다
    practitioner: |
      할 수 있는 일:
      - 조직의 주요 리스크 전반에 걸친 보증 맵핑을 계획한다
      - 내부 및 외부 감사인과 협력하여 범위와 결과에 합의한다
      - 보증의 공백을 위원회에 보고한다
    expert: |
      할 수 있는 일:
      - 조직의 보증 체계를 설계한다
      - 보증의 강도에 대해 감사 위원회와 이사회에 조언한다
corp-policy-management:
  name: 정책 관리
  description: 조직의 정책과 절차를 작성, 검토, 승인, 공표하고 사람들이 이를 따르는지 확인한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 자신의 업무에 적용되는 정책을 찾아서 따른다
    working: |
      할 수 있는 일:
      - 정책 등록부를 최신으로 유지하고 담당자에게 검토 시점을 알린다
      - 정책이 올바른 템플릿과 승인 경로를 사용하는지 확인한다
    practitioner: |
      할 수 있는 일:
      - 분야 전문가와 함께 정책을 작성하고 검토한다
      - 정책을 법률, 표준, 평등 의무에 비추어 확인한다
      - 준수 여부를 모니터링하고 공백을 보고한다
    expert: |
      할 수 있는 일:
      - 조직의 정책 체계를 정한다
      - 정책의 우선순위와 리스크에 대해 이사회에 조언한다
corp-internal-communications:
  name: 사내 커뮤니케이션
  description: 특히 변화의 시기에 인트라넷, 뉴스레터, 브리핑, 행사 등의 채널로 직원에게 정보를 알리고 참여를 이끈다.
  levels:
    awareness: |
      할 수 있는 일:
      - 인트라넷 등 사내 채널에 콘텐츠를 게시한다
      - 조직의 스타일과 어조를 따른다
    working: |
      할 수 있는 일:
      - 직원을 위한 소식, 브리핑, 뉴스레터를 쓰고 편집한다
      - 사내 채널의 콘텐츠를 계획하고 참여도를 측정한다
    practitioner: |
      할 수 있는 일:
      - 새 임상 시스템 같은 큰 변화를 위한 사내 커뮤니케이션을 계획한다
      - 직원의 참여를 이끌고 어려운 메시지를 전하는 방법에 대해 리더에게 조언한다
      - 피드백과 데이터를 활용해 채널을 개선한다
    expert: |
      할 수 있는 일:
      - 사내 커뮤니케이션과 직원 참여 전략을 정한다
      - 문화와 참여에 대해 경영진에게 조언한다
corp-media-relations:
  name: 언론 관계
  description: 기자와 관계를 쌓고, 언론 문의를 처리하고, 보도 자료를 쓰고, 인시던트 중을 포함하여 대변인을 준비시킨다.
  levels:
    awareness: |
      할 수 있는 일:
      - 조직이 언론 문의를 어떻게 처리하는지 설명한다
      - 언론 문의를 즉시 커뮤니케이션 팀에 전달한다
    working: |
      할 수 있는 일:
      - 정형적인 언론 문의를 기록하고 응대한다
      - 승인을 받을 보도 자료와 성명을 작성한다
      - 언론 보도를 모니터링한다
    practitioner: |
      할 수 있는 일:
      - 인시던트나 데이터 침해에 관한 문의를 포함하여 민감하고 대응적인 언론 문의를 처리한다
      - 대변인에게 상황을 설명하고 준비시킨다
      - 보건 및 기술 분야 기자와 관계를 쌓는다
    expert: |
      할 수 있는 일:
      - 대규모 인시던트와 위기 중의 언론 대응을 이끈다
      - 시니어 이해관계자들 사이에서 조직의 평판을 지키고 높인다
      - 평판 리스크에 대해 이사회에 조언한다
corp-communications-strategy:
  name: 커뮤니케이션 전략과 계획
  description: 청중에 대한 통찰을 활용하여 조직의 목표에 부합하는 커뮤니케이션과 캠페인을 계획하고 그 효과를 평가한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 자신이 참여하는 커뮤니케이션 계획의 목적을 설명한다
    working: |
      할 수 있는 일:
      - 청중, 메시지, 채널을 담은 프로젝트의 커뮤니케이션 계획을 쓴다
      - 커뮤니케이션 활동의 결과를 측정한다
    practitioner: |
      할 수 있는 일:
      - 환자가 디지털 서비스를 이용하도록 장려하는 것처럼 행동을 바꾸는 캠페인을 계획한다
      - 청중 통찰과 평가를 활용해 캠페인을 개선한다
      - 인시던트와 서비스 중단에 대한 커뮤니케이션을 계획한다
    expert: |
      할 수 있는 일:
      - 조직의 커뮤니케이션 전략을 정한다
      - 위기 커뮤니케이션을 이끈다
      - 평판과 이해관계자 참여에 대해 이사회에 조언한다
corp-digital-and-social-media:
  name: 디지털 및 소셜 미디어
  description: 웹사이트와 소셜 미디어의 콘텐츠를 계획, 게시, 관리하고 청중과 소통하며 그 결과를 측정한다.
  levels:
    awareness: |
      할 수 있는 일:
      - 승인된 콘텐츠를 조직의 채널에 게시한다
      - 소셜 미디어 정책을 따른다
    working: |
      할 수 있는 일:
      - 웹사이트와 소셜 미디어의 콘텐츠를 계획하고 게시한다
      - 댓글에 응답하고 상위 보고가 필요한 문제를 알아본다
      - 채널 성과를 보고한다
    practitioner: |
      할 수 있는 일:
      - 조직의 디지털 채널과 그 콘텐츠 계획을 관리한다
      - 인시던트 중을 포함하여 부정적이거나 오해를 부르는 게시물에 대응한다
      - 분석 데이터를 활용해 도달 범위와 참여를 개선한다
    expert: |
      할 수 있는 일:
      - 조직의 디지털 채널에 대한 전략과 거버넌스를 정한다
      - 온라인 평판 리스크에 대한 대응을 이끈다
