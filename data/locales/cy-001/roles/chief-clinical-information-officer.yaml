summary: >
  Y prif swyddog gwybodaeth glinigol (CCIO) yw'r uwch arweinydd clinigol ar gyfer digidol. Mae'n gosod y cyfeiriad
  clinigol ar gyfer gwasanaethau digidol y sefydliad, yn arwain gwybodeg glinigol a diogelwch clinigol, ac yn
  sicrhau bod buddsoddiad digidol yn gwella gofal cleifion, diogelwch, a bywydau gwaith clinigwyr a staff gofal.
  Fel arfer maen nhw'n glinigwyr sy'n ymarfer ac sy'n eistedd ar y tîm gweithredol, neu'n ei gynghori.
health_context:
  - Mae'r CCIO yn dod â hygrededd clinigol i benderfyniadau digidol, felly mae'r rhan fwyaf o swyddi'n gofyn am glinigydd cofrestredig sy'n dal i wneud rhywfaint o waith clinigol.
  - Nhw yw'r uwch lais dros ddiogelwch cleifion mewn gwasanaethau digidol, gan weithio gyda phennaeth diogelwch clinigol a'r arweinwyr meddygol a nyrsio.
  - Maen nhw'n arwain clinigwyr drwy newid ar raddfa fawr, fel disodli cofnod iechyd electronig, lle mae mabwysiadu a diogelwch yn dibynnu ar arweinyddiaeth glinigol.
  - Maen nhw'n helpu i gydbwyso uchelgais ddigidol â realiti llwyth gwaith clinigol, y gweithlu, a risg.
levels:
  - title: Dirprwy brif swyddog gwybodaeth glinigol
    slug: dirprwy-brif-swyddog-gwybodaeth-glinigol
    summary: Yn arwain rhannau mawr o'r agenda ddigidol glinigol ar ran y CCIO, fel lleoliad gofal, grŵp proffesiynol, neu raglen system glinigol fawr, ac yn dirprwyo ar ran y CCIO.
    responsibilities:
      - Arwain y cyfeiriad clinigol ar gyfer rhaglen fawr, lleoliad gofal, neu grŵp proffesiynol.
      - Arwain tîm o wybodegwyr clinigol ac arweinwyr clinigol, gan osod blaenoriaethau a safonau.
      - Cynghori byrddau rhaglen a swyddogion gweithredol ar risg glinigol a buddion buddsoddiad digidol.
      - Cadeirio grwpiau dylunio a diogelwch clinigol a gwneud penderfyniadau clinigol o fewn awdurdod dirprwyedig.
      - Meithrin rhwydweithiau o hyrwyddwyr clinigol ac arwain ymgysylltu clinigol ar gyfer newid ar raddfa fawr.
      - Dirprwyo ar ran y CCIO mewn cyfarfodydd gweithredol a gyda sefydliadau partner.
    qualifications:
      - Cofrestriad cyfredol â chorff proffesiynol clinigol, gyda phrofiad clinigol ac arweinyddiaeth glinigol helaeth.
      - Gradd meistr mewn gwybodeg glinigol neu iechyd neu arweinyddiaeth, neu brofiad cyfatebol o arwain newid digidol clinigol.
    job_evaluation_notes: Caiff gofal cleifion ei sgorio ar lefel 6 am gyngor arbenigol iawn ar ofal cleifion ar draws gwasanaethau digidol y sefydliad.
  - title: Prif swyddog gwybodaeth glinigol
    slug: prif-swyddog-gwybodaeth-glinigol
    summary: Uwch arweinydd clinigol y sefydliad ar gyfer digidol, yn atebol am gyfeiriad clinigol ei wasanaethau digidol ac am arwain gwybodeg glinigol, gyda dylanwad corfforaethol dros ddiogelwch clinigol.
    responsibilities:
      - Gosod y strategaeth ddigidol glinigol a sicrhau ei bod yn cefnogi strategaeth glinigol a gofal y sefydliad.
      - Cynghori'r bwrdd a'r tîm gweithredol ar risg glinigol, buddion, a blaenoriaeth buddsoddiad digidol.
      - Arwain y swyddogaeth gwybodeg glinigol a'r awdurdod dylunio clinigol, a goruchwylio diogelwch clinigol ar gyfer TG iechyd.
      - Arwain arweinwyr clinigol ar draws y sefydliad a'i bartneriaid drwy newid digidol ar raddfa fawr.
      - Sicrhau bod diogelwch cleifion, tystiolaeth glinigol, a phrofiad staff yn llunio pob penderfyniad digidol mawr.
      - Cynrychioli'r sefydliad mewn rhwydweithiau digidol clinigol proffesiynol, academaidd, a thraws-sefydliadol.
    qualifications:
      - Cofrestriad cyfredol â chorff proffesiynol clinigol, gyda phrofiad clinigol ac uwch arweinyddiaeth helaeth.
      - Profiad helaeth o arwain strategaeth a newid digidol clinigol ar lefel sefydliad.
    job_evaluation_notes: Caiff gofal cleifion ei sgorio ar lefel 6 yn hytrach na 7 gan fod y CCIO yn cynghori ar wasanaethau clinigol, ond nid yw fel arfer yn atebol am eu darparu. Mae cyfrifoldeb ariannol a chyfrifoldeb am bobl yn is na rolau gweithredol eraill gan fod cyllidebau a thimau digidol mawr fel arfer gyda'r prif swyddog digidol neu wybodaeth.
