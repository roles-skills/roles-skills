  disclaimer: "Proffil cyfeirio enghreifftiol yw hwn ar gyfer sefydliad gofal iechyd digidol cyffredinol. Nid yw'n swydd-ddisgrifiad swyddogol ar gyfer unrhyw gyflogwr, ac nid yw ei sgoriau gwerthuso swyddi yn werthusiad ffurfiol."
