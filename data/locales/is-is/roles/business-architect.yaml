summary: 'Viðskiptaarkitektar byggja skýra, samtengda sýn á hvernig stofnunin veitir heilbrigðis- og velferðarþjónustu: getu hennar, þjónustu, umönnunarleiðir, ferli og upplýsingar. Þeir nota þá sýn til að sýna hvar breytinga er þörf, til að tengja stefnu við áætlanir og til að tryggja að stafræn breyting bæti umönnun sjúklinga og vinnulíf klínísks starfsfólks og umönnunarstarfsfólks.'
health_context:
- Umönnunarleiðir ná yfir teymi, aðstæður og stofnanir, svo viðskiptaarkitektar líkana þjónustu frá sjónarhorni sjúklingsins, ekki aðeins eftir deildum.
- Breytingar á klínískum ferlum geta haft áhrif á öryggi sjúklinga og vinnuálag starfsfólks, svo líkön eru byggð með klínísku starfsfólki og umönnunarstarfsfólki og borin saman við raunverulega framkvæmd.
- Stefna í heilbrigðis- og velferðarmálum mótast af opinberri stefnu, regluverki og fjármögnunarreglum, sem arkitektar verða að þýða í hagnýtar breytingar á getu.
- Mörg geta er sameiginleg með samstarfsstofnunum, svo arkitektar hjálpa til við að semja um hver gerir hvað og hvert upplýsingar þurfa að streyma.
levels:
- title: Viðskiptaarkitekt í starfsnámi
  responsibilities:
  - Læra aðferðir viðskiptaarkitektúrs, svo sem líkanagerð getu, virðisstrauma og ferla, með þjálfun og æfingu.
  - Afla upplýsinga um þjónustu og umönnunarleiðir með viðtölum, skjölum og athugun.
  - Gera drög að getukortum og ferlalíkönum með leiðsögn viðskiptaarkitekta.
  - Aðstoða við að halda vinnustofur með klínísku starfsfólki, umönnunarstarfsfólki og stjórnendum, og skrifa upp niðurstöður.
  qualifications:
  - Háskólagráða eða sambærileg reynsla í viðskiptum, greiningu eða skyldri grein.
  - Sérhæfð þjálfun í aðferðum viðskiptaarkitektúrs, á stigi framhaldsdiplóma eða sambærileg reynsla.
  job_evaluation_notes: 'Flokkað ofar tillögu UK GDaD PCF um launaþrep (launaflokkur 5): auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 6. Þekking er metin á því stigi sem starfið krefst þegar þjálfun er orðin nægileg til að vinna verkið.'
- title: Aðstoðarviðskiptaarkitekt
  responsibilities:
  - Líkana getu, þjónustu og umönnunarleiðir fyrir hluta stofnunarinnar.
  - Greina líkön til að finna eyður, tvíverknað og sársaukapunkta fyrir sjúklinga og starfsfólk.
  - Safna saman upplýsingum frá ólíkum teymum og stofnunum til að upplýsa ákvarðanir um breytingar.
  - Útskýra flókin þjónustuvandamál fyrir hagsmunaaðilum með skýrum líkönum og látlausu máli.
  - Halda viðskiptaarkitektúrsgeymslunni nákvæmri og tengdri hugbúnaðar- og gagnalíkönum.
  qualifications:
  - Sérhæfð þekking á viðskiptaarkitektúr eða viðskiptagreiningu, á meistarastigi eða sambærileg reynsla.
  - Reynsla af viðskiptagreiningu eða þjónustuhönnun.
  job_evaluation_notes: 'Flokkað ofar tillögu UK GDaD PCF um launaþrep (launaflokkur 6): auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 7. Þekking er metin á meistarastigi eða sambærilegu, því starfið líkanar og greinir þjónustu og umönnunarleiðir þvert á teymi og stofnanir.'
- title: Viðskiptaarkitekt
  responsibilities:
  - Þróa núverandi og markmiðsviðskiptaarkitektúr fyrir stórt þjónustusvið, svo sem bráðaþjónustu eða samfélagsþjónustu.
  - Þýða stefnu og opinbera stefnumótun í breytingar á getu og vegvísi breytinga.
  - Athuga að umfang áætlana og verkefna falli að markmiðsviðskiptaarkitektúr.
  - Vinna með klínískum leiðtogum að mati á því hvernig fyrirhugaðar breytingar hafa áhrif á umönnunarleiðir, öryggi og vinnuálag starfsfólks.
  - Leiðbeina öðrum viðskiptaarkitektum í aðferðum og verkfærum.
  qualifications:
  - Mikil reynsla af viðskiptaarkitektúr, viðskiptagreiningu eða þjónustuhönnun, á stigi sem jafngildir meistaragráðu.
  job_evaluation_notes: 'Flokkað ofar tillögu UK GDaD PCF um launaþrep (launaflokkur 7): auglýsingar í heilbrigðisgeiranum setja þetta hlutverk í launaflokk 8a. Áætlanagerð, stefnumótun og svigrúm til athafna eru metin ofar sniði launaflokks 7 því starfið breytir stefnu í vegvísi breytinga fyrir stórt þjónustusvið.'
- title: Leiðandi viðskiptaarkitekt
  responsibilities:
  - Stýra viðskiptaarkitektúrstarfinu og bera ábyrgð á afurðum þess.
  - Halda heildarsýn yfir getu, þjónustu og umönnunarleiðir stofnunarinnar og halda henni auðskiljanlegri.
  - Ráðleggja sviðsstjórum um forgangsröðun breytinga og hvernig fjárfestingasöfn falla að stefnu.
  - Vinna með samstarfsstofnunum að því að semja um sameiginlega getu og ábyrgð þvert á umönnunarleiðir.
  - Stýra og þróa viðskiptaarkitekta.
  qualifications:
  - Umfangsmikil reynsla af forystu í viðskiptaarkitektúr í flókinni stofnun.
