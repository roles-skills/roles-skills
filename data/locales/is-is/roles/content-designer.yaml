summary: Efnishönnuðir gera heilbrigðis- og velferðarupplýsingar og -þjónustu skýra, svo að sjúklingar, aðstandendur, klínískt starfsfólk og umönnunarstarfsfólk skilji hvað þeir þurfa að vita og gera. Þeir hanna efni út frá gögnum um þarfir notenda, skrifa á látlausu máli, vinna með klínískum sérfræðingum að því að halda því nákvæmu og annast efni yfir allan líftíma þess, frá gerð til yfirferðar og afnáms.
health_context:
- Fólk les oft heilbrigðisefni þegar það er áhyggjufullt, veikt eða á hraðferð, svo efni verður að vera auðskiljanlegt og auðvelt að bregðast við fyrir fólk með litla heilsulæsi.
- Rangar eða úreltar heilbrigðisupplýsingar geta valdið skaða, svo efnishönnuðir fylgja ferli klínískrar fullvissu með yfirferðardagsetningum og nafngreindum klínískum yfirlesurum.
- Sum efni eru viðkvæm eða áhættusöm, svo sem bráð einkenni, geðheilsa, lyf og líknarmeðferð, svo efnishönnuðir vinna náið með klínísku starfsfólki og notendarannsakendum að tóni og nákvæmni.
- Klínísk kerfi þurfa einnig skýrt efni, svo sem merkingar, leiðbeiningar og viðvaranir, svo efnishönnuðir hjálpa til við að fækka villum í klínísku vinnuflæði.
- Heilbrigðisefni verður að vera aðgengilegt og án aðgreiningar, þar á meðal fyrir fólk sem notar hjálpartækni, les á öðru tungumáli eða þarf létt lesefni.
levels:
- title: Aðstoðarefnishönnuður
  responsibilities:
  - Læra aðferðir efnishönnunar, stílleiðbeiningar og ferli klínískrar yfirferðar með þjálfun og vinnu undir eftirliti.
  - Framkvæma hefðbundnar athuganir, textayfirlestur og uppfærslur á núverandi efni.
  - Birta efni með efnisstjórnunarkerfinu og fylgja fullvissuskrefum.
  - Athuga efni með tilliti til aðgengis, svo sem fyrirsagnir, tengiltexta og varatexta.
  qualifications:
  - Stefnir á menntun eða iðnnám í viðeigandi grein, eða sambærileg reynsla.
- title: Yngri efnishönnuður
  responsibilities:
  - Skrifa og uppfæra heilbrigðisefni og þjónustuefni, með leiðsögn eldri efnishönnuða.
  - Nota rannsóknir og gögn til að greina hvað notendur þurfa að vita og orðin sem þeir nota.
  - Vinna með klínískum yfirlesurum að því að athuga nákvæmni og útskýra læknisfræðihugtök á látlausu máli.
  - Styðja efnisbirtingu, yfirferðardagsetningar og umsýslu efnisteymis.
  qualifications:
  - Háskólagráða eða viðeigandi menntun, eða sambærileg reynsla af skrifum fyrir vefinn.
- title: Efnishönnuður
  responsibilities:
  - Hanna efni þvert á heilar notendaleiðir, svo sem að finna þjónustu, undirbúa tímabókun og eftirmeðferð.
  - Hanna efni fyrir klínísk kerfi, svo sem merkingar, leiðbeiningar og viðvaranir, til að draga úr líkum á villum.
  - Samþykkja nákvæmni með klínískum sérfræðingum og halda efni skýru og nothæfu.
  - Prófa efni með notendum, þar á meðal fólki með litla heilsulæsi og fólki sem notar hjálpartækni.
  - Leggja til stílleiðbeininga og efnismynstra.
  qualifications:
  - Háskólagráða eða viðeigandi menntun, eða sambærileg reynsla.
  - Reynsla af hönnun efnis fyrir stafræna þjónustu.
- title: Eldri efnishönnuður
  responsibilities:
  - Þróa efnisstefnu fyrir stór eða áberandi svið, svo sem stórt sjúkdómasvið eða lýðheilsuherferð.
  - Hanna efni um viðkvæm og áhættusöm efni, svo sem bráð einkenni, geðheilsu og líknarmeðferð.
  - Setja upp klíníska fullvissu, heimildir sannana og yfirferðarlotur fyrir safn heilbrigðisefnis.
  - Fara yfir vinnu annarra til að tryggja gæði og stýra efnishönnuðum eða leiðbeina þeim.
  - Skrifa og kortleggja notendasögur með teyminu.
  qualifications:
  - Mikil reynsla af efnishönnun, á stigi sem jafngildir meistaragráðu.
  job_evaluation_notes: Tilfinningalegt erfiði er á stigi 2 því eldri efnishönnuðir vinna reglulega að átakanlegum efnum, svo sem alvarlegum veikindum, sjálfsskaða og missi.
- title: Leiðandi efnishönnuður
  responsibilities:
  - Stýra teymi efnishönnuða og tryggja gæði efnis þvert á nokkur teymi.
  - Tryggja að heilbrigðisefni uppfylli staðla um klíníska fullvissu, aðgengi og stíl.
  - Vinna með æðstu klínískum leiðtogum, samskiptaleiðtogum og vöruleiðtogum að mönnun teyma og lausn efnisvandamála.
  - Stýra efni fyrir viðkvæmustu eða áhættusömustu upplýsingar stofnunarinnar.
  - Vera línustjóri efnishönnuða og þróa þá.
  qualifications:
  - Umfangsmikil reynsla af forystu í efnishönnun þvert á teymi.
  job_evaluation_notes: Ekkert stig er í launaflokki 8a, því UK GDaD PCF setur leiðandi efnishönnuð á G7 eða G6 og þessi viðmiðun fylgir tillögðum launaflokki 8b. Stefna er á stigi 5 því leiðtoginn setur efnisstaðla fyrir ýmsa þjónustu; tilfinningalegt erfiði er á stigi 2, eins og hjá eldri efnishönnuðum.
- title: Yfirmaður efnishönnunar
  responsibilities:
  - Þróa efnisstefnu sem uppfyllir markmið stofnunarinnar og þarfir sjúklinga og starfsfólks.
  - Setja staðla stofnunarinnar fyrir heilbrigðisupplýsingaefni og klíníska fullvissu þess.
  - Stýra efnishönnunarteymi sem getur framfylgt stefnunni, þar á meðal ráðningum og þróun.
  - Vinna með æðstu klínískum leiðtogum og samskiptaleiðtogum að því að stýra áhættu heilbrigðisupplýsinga.
  - Forgangsraða efnisvinnu þvert á stofnunina.
  qualifications:
  - Umfangsmikil reynsla af forystu í efnishönnun og efnisstarfi.
  job_evaluation_notes: UK GDaD PCF setur bæði leiðandi efnishönnuð og yfirmann efnishönnunar á G7 eða G6, með tillögðum launaflokki 8b. Þessi viðmiðun setur yfirmanninn í launaflokk 8c, í samræmi við yfirmenn annarra notendamiðaðra hönnunarstétta, því yfirmaðurinn mótar efnisstefnu og staðla fyrir alla stofnunina.
