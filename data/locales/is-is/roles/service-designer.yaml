summary: Þjónustuhönnuðir hanna heilbrigðis- og velferðarþjónustu frá upphafi til enda, frá því að einhver þarfnast aðstoðar fyrst til loka umönnunar, þvert á stafrænar rásir, síma, pappír og samskipti í eigin persónu. Þeir vinna með sjúklingum, aðstandendum, klínísku starfsfólki og umönnunarstarfsfólki að því að kortleggja hvernig þjónusta virkar í raun, finna hvar hún bregst fólki og hanna þjónustu sem er örugg, einföld og sanngjörn og virkar þvert á stofnanamörk.
health_context:
- Umönnunarleiðir ná yfir margar stofnanir og fagstéttir, svo þjónustuhönnuðir kortleggja heilar leiðir, þar á meðal yfirfærslur, bið og þá vinnu sem sjúklingar og aðstandendur leggja á sig til að halda umönnun saman.
- Breytingar á því hvernig þjónusta virkar geta skapað nýja klíníska áhættu, svo þjónustuhönnuðir vinna með klínískum öryggisfulltrúum að því að greina hættur í nýjum þjónustulíkönum áður en þau fara í rekstur.
- Stafræn þjónusta má ekki útiloka fólk sem getur ekki eða vill ekki nota hana, svo þjónustuhönnuðir hanna aðstoðarleiðir og leiðir sem eru ekki stafrænar samhliða þeim stafrænu.
- Klínískt starfsfólk og rekstrarstarfsfólk er hluti af þjónustunni, svo hönnun verður að falla að vinnuflæði þeirra, vinnuálagi og faglegri ábyrgð, ekki aðeins ferð sjúklingsins.
levels:
- title: Aðstoðarþjónustuhönnuður
  responsibilities:
  - Læra aðferðir þjónustuhönnunar með þjálfun og vinnu við hlið reyndra hönnuða.
  - Aðstoða við að kortleggja notendaferðir og þjónustuteikningar út frá rannsóknum með sjúklingum og starfsfólki.
  - Aðstoða við að undirbúa og halda samhönnunarvinnustofur og fylgja verklagi um samþykki og upplýsingastjórnun.
  - Skjalfesta hönnunarákvarðanir og halda hönnunargögnum uppfærðum.
  qualifications:
  - Stefnir á menntun eða iðnnám í hönnun eða skyldri grein, eða sambærileg reynsla.
- title: Yngri þjónustuhönnuður
  responsibilities:
  - Kortleggja núverandi ferðir og þjónustuteikningar fyrir hluta umönnunarleiðar, svo sem bókun eða eftirfylgni.
  - Hanna og prófa umbætur á hlutum þjónustu, með leiðsögn eldri hönnuðar.
  - Halda samhönnunarfundi með sjúklingum, aðstandendum og starfsfólki og aðlaga þá svo allir geti tekið þátt.
  - Greina hvar þjónusta skapar aukavinnu eða áhættu fyrir sjúklinga eða starfsfólk og vekja máls á því við teymið.
  qualifications:
  - Háskólagráða í hönnun eða skyldri grein, eða sambærileg reynsla.
- title: Þjónustuhönnuður
  responsibilities:
  - Hanna þjónustu frá upphafi til enda þvert á rásir, þar á meðal aðstoðarleiðir og leiðir sem eru ekki stafrænar fyrir fólk sem þarf á þeim að halda.
  - Kortleggja umönnunarleiðir þvert á stofnanir og hanna betri yfirfærslur milli teyma og þjónustu.
  - Hanna hvernig þjónustan virkar fyrir starfsfólk, þar á meðal hlutverk, vinnuálag og vinnuflæði, með rekstrarleiðtogum.
  - Vinna með klínískum öryggisfulltrúum að því að greina hættur í nýjum þjónustulíkönum og hanna stýringar.
  - Gera frumgerðir og prófa þjónustubreytingar með sjúklingum, aðstandendum og starfsfólki.
  qualifications:
  - Háskólagráða í hönnun eða skyldri grein, eða sambærileg reynsla.
  - Reynsla af hönnun þjónustu með notendum.
- title: Eldri þjónustuhönnuður
  responsibilities:
  - Stýra hönnun flókinnar þjónustu sem nær yfir nokkur umönnunarumhverfi eða stofnanir.
  - Móta þjónustusýn með klínískum leiðtogum, rekstrarleiðtogum og stafrænum leiðtogum.
  - Hanna ný þjónustulíkön sem bæta öryggi, aðgengi og jafnræði og prófa þau með raunverulegum notendum.
  - Tryggja að þjónustubreytingar séu metnar með tilliti til klínískrar áhættu, jafnræðis og áhrifa á upplýsingastjórnun.
  - Leiðbeina hönnuðum og festa þjónustuhönnunarvenjur í sessi í teymum.
  qualifications:
  - Mikil reynsla af þjónustuhönnun, á stigi sem jafngildir meistaragráðu.
- title: Leiðandi þjónustuhönnuður
  responsibilities:
  - Móta hönnunarstefnu fyrir fleiri þjónustur eða heila umönnunarleið og tryggja gæði hönnunar þvert á teymi.
  - Vinna með æðri klínískum leiðtogum og rekstrarleiðtogum að því að endurhanna hvernig umönnun er skipulögð og veitt.
  - Tryggja að hönnun virki fyrir það fólk sem heilsufarsójöfnuður bitnar mest á og fyrir starfsfólk undir álagi.
  - Setja staðla um hvernig teymi hanna fyrir klínískt öryggi og aðstoðarleiðir.
  - Vera línustjóri þjónustuhönnuða og þróa þá.
  qualifications:
  - Umfangsmikil reynsla af forystu í þjónustuhönnun þvert á teymi.
  job_evaluation_notes: Ekkert stig er í launaflokki 8a, því UK GDaD PCF setur leiðandi þjónustuhönnuð á G7 eða G6 og þessi viðmiðun fylgir tillögðum launaflokki 8b. Stefna er á stigi 5 því leiðandi hönnuðurinn mótar hvernig ýmis þjónusta þvert á svið virkar.
- title: Yfirmaður þjónustuhönnunar
  responsibilities:
  - Stýra þjónustuhönnun sem fagstétt og móta stefnu hennar, staðla og vinnulag.
  - Hafa áhrif á stefnu stofnunarinnar svo að þjónusta sé hönnuð í kringum þarfir sjúklinga, aðstandenda og starfsfólks.
  - Byggja upp getu í þjónustuhönnun, þar á meðal ráðningar, starfsferla og þjálfun.
  - Skapa skilyrði fyrir góða hönnun, svo sem aðgang að notendum, tíma til rannsókna og hönnun í stjórnarháttum.
  - Vinna með jafningjum þvert á heilbrigðis- og velferðarkerfið að því að hanna samtengda þjónustu.
  qualifications:
  - Umfangsmikil reynsla af forystu í hönnun og hönnunarstarfi.
