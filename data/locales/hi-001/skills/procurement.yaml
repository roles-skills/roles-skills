# Hindi translations of data/skills/procurement.yaml. Keys are the English skill ids.
proc-purchase-to-pay:
  name: ख़रीद से भुगतान तक
  description: संगठन की क्रय प्रणाली और वित्तीय नियंत्रणों के माध्यम से ऑर्डर बनाना, स्वीकृत करना और प्राप्ति दर्ज करना, और चालान तथा भुगतान संबंधी प्रश्न सुलझाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - "क्रय आदेश नहीं, तो भुगतान नहीं" नियम और उसका महत्व समझाना
      - क्रय प्रणाली में माँग-पत्र बनाना
    working: |
      आप ये कर सकते हैं:
      - क्रय आदेश बनाना और संशोधित करना और अनुबंधों से उनकी जाँच करना
      - आपूर्तिकर्ताओं और वित्त के साथ चालान, प्राप्ति और भुगतान संबंधी प्रश्न सुलझाना
      - क्रय प्रणाली में कैटलॉग और आपूर्तिकर्ता अभिलेख बनाए रखना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी सेवा के लिए ख़रीद-से-भुगतान प्रक्रिया चलाना, अनुपालन और लंबित कार्यों की निगरानी करते हुए
      - अनुबंध से बाहर के ख़र्च और बचत खोजने के लिए ख़र्च डेटा का विश्लेषण करना
      - वित्त सहकर्मियों के साथ प्रक्रिया और नियंत्रणों में सुधार करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की ख़रीद-से-भुगतान नीति, नियंत्रण और प्रणालियाँ तय करना
      - पूर्णतः इलेक्ट्रॉनिक क्रय और चालान प्रक्रिया की ओर बदलाव का नेतृत्व करना
proc-procurement-process:
  name: ख़रीद प्रक्रिया
  description: योजना और विनिर्देश से लेकर बाज़ार के मार्ग, निविदा, प्रदान और अनुबंध हस्ताक्षर तक अनुपालक ख़रीद चलाना, जिसमें फ़्रेमवर्क और गतिशील क्रय प्रणालियों के माध्यम से ख़रीद शामिल है।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - ख़रीद के चरण और लागू सीमाएँ समझाना
      - संगठन के नियमों के अनुसार कम मूल्य की ख़रीद के लिए कोटेशन लेना
    working: |
      आप ये कर सकते हैं:
      - मानक टेम्पलेट का उपयोग करके कोटेशन और फ़्रेमवर्क से कॉल-ऑफ़ चलाना
      - निविदा दस्तावेज़ तैयार करना और ई-निविदा प्रणाली पर स्पष्टीकरण प्रश्नों का प्रबंधन करना
      - हर ख़रीद का स्पष्ट ऑडिट ट्रेल रखना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल निविदाओं की योजना बनाना और उनका नेतृत्व करना, सही बाज़ार मार्ग और प्रक्रिया चुनते हुए
      - डिजिटल और क्लिनिकल प्रणालियों के लिए परिणाम-आधारित विनिर्देश लिखने में उपयोगकर्ताओं की मदद करना
      - अनुबंध प्रदान होने तक समय-सारणी, जोखिमों और हितधारकों का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की ख़रीद प्रक्रियाएँ और टेम्पलेट तय करना
      - सबसे जटिल, उच्च-मूल्य या नई ख़रीदों का नेतृत्व करना
      - बोर्ड के लिए ख़रीद निर्णयों का आश्वासन देना
proc-tender-evaluation:
  name: निविदा मूल्यांकन
  description: मूल्यांकन मानदंड और भारांक डिज़ाइन करना, और गुणवत्ता, मूल्य और सामाजिक मूल्य का निष्पक्ष और अच्छी तरह दर्ज मूल्यांकन चलाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि मूल्यांकन प्रकाशित मानदंडों के अनुसार ही क्यों होना चाहिए
      - मूल्यांकन में भाग लेने से पहले हितों के टकराव की घोषणा करना
    working: |
      आप ये कर सकते हैं:
      - बोलियों की अनुपालन और पूर्णता की जाँच करना
      - मूल्यांकनकर्ताओं की सहायता करना और अंक तथा संतुलन (मॉडरेशन) नोट्स दर्ज करना
      - मार्गदर्शन में मूल्य मूल्यांकन मॉडल तैयार करना
    practitioner: |
      आप ये कर सकते हैं:
      - मूल्यांकन मानदंड, भारांक और अंकन मार्गदर्शन डिज़ाइन करना
      - संतुलन (मॉडरेशन) का नेतृत्व करना और प्रदान रिपोर्ट तथा बोलीदाताओं को प्रतिक्रिया लिखना
      - प्रणाली निविदाओं के लिए प्रदर्शनों और क्लिनिकल या उपयोगकर्ता परिदृश्य परीक्षण की योजना बनाना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के मूल्यांकन मानक और मूल्य तथा गुणवत्ता के प्रति दृष्टिकोण तय करना
      - चुनौती दिए जाने पर मूल्यांकन निर्णयों का बचाव करना
      - उच्च-जोखिम ख़रीदों के मूल्यांकनों की समीक्षा करना
proc-procurement-law-and-policy:
  name: सार्वजनिक ख़रीद नियम और नीति
  description: सार्वजनिक ख़रीद नियम, संगठन के वित्तीय नियम और ख़रीद नीति लागू करना, ताकि ख़रीद विधिसम्मत, पारदर्शी और निष्पक्ष हो।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि सार्वजनिक धन निष्पक्ष, खुले और विधिसम्मत रूप से ख़र्च होना चाहिए
      - संगठन की सीमाओं और स्वीकृति नियमों का पालन करना
    working: |
      आप ये कर सकते हैं:
      - किसी सीधी-सादी ख़रीद पर उपयुक्त ख़रीद नियम लागू करना
      - सूचनाएँ प्रकाशित करना और पारदर्शिता नियमों को पूरा करने वाले अभिलेख रखना
      - पहचानना कि कब कोई अनुरोध नियम तोड़ने के जोखिम में है, और उसे उठाना
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल ख़रीदों और अनुबंध परिवर्तनों के विधिसम्मत मार्ग पर सलाह देना
      - चुनौती के जोखिम का प्रबंधन करना और स्टैंडस्टिल अवधि तथा डीब्रीफ़ को सही ढंग से संभालना
      - संगठन के लिए ख़रीद नीति और मार्गदर्शन लिखना
    expert: |
      आप ये कर सकते हैं:
      - नए ख़रीद नियमों की व्याख्या करना और संगठन के जवाब का नेतृत्व करना
      - ख़रीद अनुपालन और जोखिम पर बोर्ड को सलाह देना
      - विधि सलाहकारों के साथ औपचारिक चुनौतियों का प्रबंधन करना
proc-market-analysis:
  name: बाज़ार विश्लेषण और सहभागिता
  description: आपूर्ति बाज़ारों को समझना, ख़रीद से पहले आपूर्तिकर्ताओं से जुड़ना, और आवश्यकताओं, बाज़ार के मार्गों और वाणिज्यिक मॉडलों को आकार देने के लिए बाज़ार साक्ष्य का उपयोग करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - फ़्रेमवर्क और आपूर्तिकर्ता डेटाबेस में आपूर्तिकर्ता खोजना
      - समझाना कि प्रारंभिक बाज़ार सहभागिता सभी आपूर्तिकर्ताओं के लिए निष्पक्ष क्यों होनी चाहिए
    working: |
      आप ये कर सकते हैं:
      - किसी आवश्यकता के लिए बाज़ार जानकारी, मूल्य और आपूर्तिकर्ता विवरण एकत्र करना
      - सूचना के लिए अनुरोध (RFI) चलाना और उत्तरों का सारांश बनाना
    practitioner: |
      आप ये कर सकते हैं:
      - किसी आपूर्ति बाज़ार, उसकी प्रतिस्पर्धा, जोखिमों और रुझानों का विश्लेषण करना
      - प्रतिस्पर्धा को विकृत किए बिना आपूर्तिकर्ता दिवस जैसी प्रारंभिक बाज़ार सहभागिता का नेतृत्व करना
      - आवश्यकताओं और वाणिज्यिक मॉडलों को आकार देने के लिए बाज़ार साक्ष्य का उपयोग करना
    expert: |
      आप ये कर सकते हैं:
      - बाज़ारों को आकार देना, उदाहरण के लिए नए या छोटे आपूर्तिकर्ताओं को प्रोत्साहित करके
      - अन्य क्रय संगठनों के साथ बाज़ार रणनीति का नेतृत्व करना
proc-negotiation:
  name: वाणिज्यिक बातचीत
  description: धन का सर्वोत्तम मूल्य देने और जोखिम का प्रबंधन करने वाले मूल्य, शर्तों और प्रदर्शन पर सहमति के लिए आपूर्तिकर्ताओं के साथ बातचीत की योजना बनाना और उसे संचालित करना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि सार्वजनिक ख़रीद में किस पर बातचीत हो सकती है और किस पर नहीं
    working: |
      आप ये कर सकते हैं:
      - कम मूल्य या नियमित ख़रीद के लिए मूल्य और शर्तों पर बातचीत करना
      - दूसरों द्वारा नेतृत्व की जाने वाली बातचीत के लिए डेटा और विकल्प तैयार करना
    practitioner: |
      आप ये कर सकते हैं:
      - उद्देश्य, सीमाएँ और वैकल्पिक स्थितियाँ तय करते हुए बातचीत की योजना बनाना और उसका नेतृत्व करना
      - अनुबंध संशोधनों, नवीनीकरणों और विवादों के निपटारे पर बातचीत करना
      - बातचीत को विधिसम्मत और अच्छी तरह दर्ज रखना
    expert: |
      आप ये कर सकते हैं:
      - रणनीतिक आपूर्तिकर्ताओं के साथ उच्च-मूल्य, उच्च-जोखिम बातचीत का नेतृत्व करना
      - दूसरों को बातचीत में कोचिंग देना और संगठन का बातचीत दृष्टिकोण तय करना
proc-category-management:
  name: श्रेणी प्रबंधन
  description: सॉफ़्टवेयर, क्लाउड और तकनीकी सेवाओं जैसी ख़र्च की किसी श्रेणी का एक श्रेणी रणनीति के माध्यम से प्रबंधन करना, जो माँग को एकत्र करे, आवश्यकताओं को आकार दे और कई वर्षों की ख़रीद की योजना बनाए।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि श्रेणी क्या है और श्रेणी योजनाएँ क्यों महत्वपूर्ण हैं
    working: |
      आप ये कर सकते हैं:
      - किसी श्रेणी के ख़र्च और अनुबंधों का विश्लेषण करना और अनुबंध रजिस्टर अद्यतन रखना
      - नवीनीकरण और बचत को ट्रैक करने जैसे कार्यों से श्रेणी योजना में सहायता करना
    practitioner: |
      आप ये कर सकते हैं:
      - बजट धारकों और तकनीकी प्रमुखों के साथ श्रेणी रणनीति लिखना और लागू करना
      - श्रेणी के लिए ख़रीदों और अनुबंध नवीनीकरणों की पाइपलाइन की योजना बनाना
      - श्रेणी की बचत, मूल्य और जोखिमों को ट्रैक करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन के लिए श्रेणी प्रबंधन दृष्टिकोण तय करना
      - सबसे अधिक ख़र्च और जोखिम वाली श्रेणियों का नेतृत्व करना और उन्हें संगठन की रणनीति के साथ संरेखित करना
      - सहयोगी ख़रीद पर अन्य संगठनों के साथ काम करना
proc-technology-procurement:
  name: तकनीक और क्लाउड ख़रीद
  description: सॉफ़्टवेयर, क्लाउड सेवाएँ, लाइसेंस, हार्डवेयर और डिजिटल सेवाएँ ख़रीदना, जिसमें सॉफ़्टवेयर ऐज़ ए सर्विस, वाणिज्यिक मॉडल, लाइसेंसिंग, और स्वास्थ्य तकनीक के लिए आवश्यक सुरक्षा, डेटा संरक्षण और अंतर-संचालनीयता शर्तें शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - तकनीक ख़रीदने के मुख्य तरीक़े समझाना, जैसे लाइसेंस, सदस्यता और सेवाएँ
      - पहचानना कि क्लिनिकल प्रणालियों के लिए सुरक्षा, क्लिनिकल सुरक्षा और डेटा संरक्षण जाँच आवश्यक हैं
    working: |
      आप ये कर सकते हैं:
      - फ़्रेमवर्क के माध्यम से मानक सॉफ़्टवेयर, हार्डवेयर और लाइसेंस ख़रीदना
      - लाइसेंस संख्या, नवीनीकरण और ट्रू-अप तिथियों को ट्रैक करना
      - दस्तावेज़ों में मानक सुरक्षा और डेटा संरक्षण आवश्यकताएँ शामिल करना
    practitioner: |
      आप ये कर सकते हैं:
      - सही वाणिज्यिक मॉडल चुनते हुए क्लाउड, सॉफ़्टवेयर ऐज़ ए सर्विस और क्लिनिकल प्रणालियाँ ख़रीदना
      - तकनीकी, क्लिनिकल सुरक्षा और सूचना शासन प्रमुखों के साथ आवश्यकताएँ बनाना
      - अनुबंधों में अंतर-संचालनीयता, खुले मानक, डेटा स्वामित्व और निकास शर्तें शामिल करना
      - नवीनीकरण पर पोर्टेबिलिटी और प्रतिस्पर्धा की योजना बनाकर लॉक-इन से बचना
    expert: |
      आप ये कर सकते हैं:
      - तकनीक और क्लाउड के लिए संगठन की वाणिज्यिक रणनीति तय करना
      - एंटरप्राइज़ समझौतों और रणनीतिक प्लेटफ़ॉर्म पर बातचीत का नेतृत्व करना
      - तकनीकी विकल्पों के वाणिज्यिक जोखिमों पर डिजिटल प्रमुखों को सलाह देना
proc-contract-management:
  name: अनुबंध प्रबंधन
  description: प्रदान के बाद अनुबंधों का प्रबंधन करना, जिसमें आरंभ, प्रदर्शन, भुगतान, परिवर्तन, विवाद, नवीनीकरण और निकास शामिल हैं, ताकि संगठन को वही मिले जिसके लिए उसने भुगतान किया।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - कोई अनुबंध खोजना और उसकी मुख्य तिथियाँ, मूल्य और स्वामी समझाना
      - अनुबंध रजिस्टर में अनुबंध परिवर्तन और दस्तावेज़ दर्ज करना
    working: |
      आप ये कर सकते हैं:
      - सेवा स्तरों और प्रमुख प्रदर्शन संकेतकों के आधार पर आपूर्तिकर्ता प्रदर्शन की निगरानी करना
      - अनुबंध समीक्षा बैठकें तैयार करना और कार्रवाइयों को ट्रैक करना
      - अनुबंध संशोधन संसाधित करना और अनुबंध के आधार पर चालानों की जाँच करना
    practitioner: |
      आप ये कर सकते हैं:
      - क्लिनिकल और तकनीकी अनुबंधों सहित अनुबंधों के एक पोर्टफ़ोलियो का प्रबंधन करना
      - प्रदर्शन कम होने पर सेवा क्रेडिट जैसे अनुबंधात्मक उपायों का उपयोग करना
      - ख़रीद नियमों के भीतर परिवर्तनों, विवादों और नवीनीकरणों का प्रबंधन करना
      - निकास की योजना जल्दी बनाना और अनुबंध समाप्त होने से पहले निकास योजनाओं का परीक्षण करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन का अनुबंध प्रबंधन ढाँचा और मानक तय करना
      - रणनीतिक, उच्च-जोखिम अनुबंधों के प्रबंधन का नेतृत्व करना
      - बड़े विवाद सुलझाना और समाप्ति या पुनः-ख़रीद पर निर्णय लेना
proc-supplier-relationship-management:
  name: आपूर्तिकर्ता संबंध प्रबंधन
  description: जोखिम का प्रबंधन करने, प्रदर्शन सुधारने और समय के साथ उत्पादों और सेवाओं का विकास करने के लिए प्रमुख आपूर्तिकर्ताओं के साथ रणनीतिक संबंध बनाना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि रोगियों द्वारा निर्भर सेवाओं के लिए अच्छे आपूर्तिकर्ता संबंध क्यों महत्वपूर्ण हैं
      - आपूर्तिकर्ताओं से पेशेवर ढंग से व्यवहार करना और संपर्क दर्ज करना
    working: |
      आप ये कर सकते हैं:
      - आपूर्तिकर्ता संपर्क, एस्केलेशन मार्ग और अभिलेख अद्यतन रखना
      - आवश्यकताओं के आधार पर आपूर्तिकर्ता की वित्तीय स्थिति और बीमा की जाँच करना
    practitioner: |
      आप ये कर सकते हैं:
      - जोखिम और मूल्य के आधार पर आपूर्तिकर्ताओं का वर्गीकरण करना और हर समूह के प्रबंधन की योजना बनाना
      - रोडमैप और सुधार योजनाओं सहित प्रमुख आपूर्तिकर्ताओं के साथ रणनीतिक समीक्षाएँ चलाना
      - वित्तीय विफलता, साइबर घटनाओं और आपूर्ति श्रृंखला समस्याओं जैसे आपूर्तिकर्ता जोखिमों का प्रबंधन करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की आपूर्तिकर्ता संबंध रणनीति तय करना
      - रणनीतिक आपूर्तिकर्ताओं के साथ कार्यकारी स्तर के संबंधों का नेतृत्व करना
      - किसी महत्वपूर्ण आपूर्तिकर्ता के विफल होने पर जवाब का नेतृत्व करना
proc-exit-planning:
  name: निकास योजना और डेटा वापसी
  description: किसी अनुबंध के अंत की योजना बनाना और उसका प्रबंधन करना, जिसमें नए आपूर्तिकर्ता को संक्रमण, डेटा की वापसी और विलोपन, और रोगियों तथा कर्मचारियों के लिए सेवाओं की निरंतरता शामिल हैं।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि हर अनुबंध को निकास योजना की आवश्यकता क्यों है
      - किसी अनुबंध की निकास और डेटा वापसी शर्तें खोजना
    working: |
      आप ये कर सकते हैं:
      - निकास योजनाओं और परिसंपत्ति तथा डेटा रजिस्टरों को अद्यतन रखना
      - सूचना अवधियों और निकास पड़ावों को ट्रैक करना
    practitioner: |
      आप ये कर सकते हैं:
      - तकनीकी, डेटा और क्लिनिकल प्रमुखों के साथ निकास और संक्रमण योजनाएँ लिखना
      - सुनिश्चित करना कि डेटा उपयोग-योग्य, मानक प्रारूपों में लौटाया जाए और फिर सुरक्षित रूप से हटाया जाए
      - संक्रमण जोखिमों का प्रबंधन करना ताकि देखभाल बाधित न हो
    expert: |
      आप ये कर सकते हैं:
      - निकास, संक्रमण और डेटा वापसी के लिए संगठन के मानक तय करना
      - रणनीतिक क्लिनिकल और तकनीकी अनुबंधों से निकास का नेतृत्व करना
proc-social-value:
  name: सामाजिक मूल्य और सतत ख़रीद
  description: सामाजिक मूल्य, पर्यावरणीय स्थिरता और निष्पक्ष आपूर्ति श्रृंखलाएँ प्राप्त करने के लिए ख़रीद और अनुबंधों का उपयोग करना, और आपूर्तिकर्ता क्या देते हैं इसे मापना।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि संगठन के लिए सामाजिक मूल्य और सतत ख़रीद का क्या अर्थ है
    working: |
      आप ये कर सकते हैं:
      - निविदाओं में मानक सामाजिक मूल्य और स्थिरता प्रश्न शामिल करना
      - आपूर्तिकर्ताओं से सामाजिक मूल्य रिपोर्ट एकत्र करना
    practitioner: |
      आप ये कर सकते हैं:
      - अनुबंध के अनुरूप सामाजिक मूल्य और स्थिरता मानदंड तय करना
      - स्थानीय रोज़गार, कौशल और कार्बन कटौती जैसी आपूर्तिकर्ता प्रतिबद्धताओं का प्रबंधन करना
      - बंधुआ मज़दूरी और अन्य मानवाधिकार हनन जैसे जोखिमों के लिए आपूर्ति श्रृंखलाओं की जाँच करना
    expert: |
      आप ये कर सकते हैं:
      - संगठन की सामाजिक मूल्य और सतत ख़रीद नीति तय करना
      - बोर्ड को सामाजिक मूल्य और कार्बन परिणामों की रिपोर्ट देना
