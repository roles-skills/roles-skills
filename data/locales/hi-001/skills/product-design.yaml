# Hindi translations of data/skills/product-design.yaml. Keys are the English skill ids.
pd-health-research-ethics:
  name: रोगियों और देखभाल कर्मचारियों के साथ नैतिक अनुसंधान
  description: रोगियों, देखभालकर्ताओं, चिकित्सकों और देखभाल कर्मचारियों के साथ सुरक्षित और नैतिक रूप से अनुसंधान की योजना बनाना और उसे संचालित करना, जिसमें सूचित सहमति, सुरक्षा (सेफ़गार्डिंग), कमज़ोर परिस्थितियों वाले लोगों के साथ अनुसंधान, और यह जानना शामिल है कि औपचारिक नैतिकता अनुमोदन कब चाहिए।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि रोगियों और देखभाल कर्मचारियों के साथ अनुसंधान में सूचित सहमति, सुरक्षा और व्यक्तिगत डेटा के प्रति सावधानी क्यों आवश्यक है
      - अनुसंधान सत्रों में टीम की सहमति, सुरक्षा और डेटा प्रबंधन प्रक्रियाओं का पालन करना
    working: |
      आप ये कर सकते हैं:
      - ऐसे अनुसंधान सत्रों की योजना बनाना जिनमें सूचित सहमति ली जाए और प्रतिभागियों की भलाई और निजता की रक्षा हो
      - अस्वस्थ, व्यथित या कमज़ोर परिस्थितियों वाले लोगों के लिए सत्रों को ढालना, और जानना कि कब रुकना है
      - अनुसंधान के दौरान सामने आने वाली सुरक्षा संबंधी चिंताओं को पहचानना और रिपोर्ट करना
    practitioner: |
      आप ये कर सकते हैं:
      - तय करना कि कब अनुसंधान के लिए औपचारिक नैतिकता या अनुसंधान शासन अनुमोदन चाहिए, और उसकी आवश्यक सामग्री तैयार करना
      - बच्चों, डिमेंशिया से ग्रस्त लोगों और संकट में पड़े लोगों जैसे कमज़ोर परिस्थितियों वाले लोगों के साथ सुरक्षित अनुसंधान की योजना बनाना
      - क्लिनिकल प्रमुखों और देखभाल कर्मचारियों के साथ मिलकर, देखभाल में बाधा डाले बिना क्लिनिकल परिवेश में अनुसंधान की योजना बनाना
      - कष्टदायक सत्रों के बाद शोधकर्ताओं को अपनी भलाई का ध्यान रखने में सहायता देना
    expert: |
      आप ये कर सकते हैं:
      - रोगियों, देखभालकर्ताओं और देखभाल कर्मचारियों के साथ नैतिक अनुसंधान के लिए संगठन के मानक तय करना
      - सभी टीमों के अनुसंधान अभ्यास का आश्वासन देना और उच्च-जोखिम अनुसंधान पर सलाह देना
      - नैतिकता, सुरक्षा और शासन निकायों के समक्ष अनुसंधान अभ्यास का प्रतिनिधित्व करना
pd-safety-critical-design:
  name: क्लिनिकल सुरक्षा और मानवीय कारकों के लिए डिज़ाइन
  description: मानवीय कारकों के सिद्धांतों को लागू करके और क्लिनिकल जोखिम प्रबंधन प्रक्रिया के साथ काम करके ऐसी सेवाएँ, इंटरफ़ेस और कार्यप्रवाह डिज़ाइन करना जो चिकित्सकों, देखभाल कर्मचारियों और रोगियों को सुरक्षित रूप से कार्य करने में मदद करें।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि डिज़ाइन के निर्णय देखभाल में त्रुटियाँ कैसे पैदा कर सकते हैं या रोक सकते हैं, जैसे ग़लत रोगी या ग़लत खुराक की त्रुटियाँ
      - सुरक्षा-महत्वपूर्ण जानकारी के लिए संगठन के पैटर्न इस्तेमाल करना, जैसे रोगी पहचान बैनर और एलर्जी चेतावनियाँ
    working: |
      आप ये कर सकते हैं:
      - ऐसे इंटरफ़ेस डिज़ाइन करना जिनमें सुरक्षित कार्य ही आसान कार्य हो, उदाहरण के लिए अस्पष्ट लेबल और अनावश्यक अलर्ट घटाकर
      - व्यवधानों और समय के दबाव सहित वास्तविक क्लिनिकल परिदृश्यों में डिज़ाइनों का परीक्षण करना
      - डिज़ाइन से जुड़े ख़तरों को क्लिनिकल सुरक्षा अधिकारी के सामने रखना और दर्ज करना कि डिज़ाइन उन्हें कैसे नियंत्रित करता है
    practitioner: |
      आप ये कर सकते हैं:
      - जटिल क्लिनिकल कार्यप्रवाहों पर कार्य विश्लेषण और उपयोग-त्रुटि विश्लेषण जैसी मानवीय कारक विधियाँ लागू करना
      - पूरी सेवा में अलर्ट थकान और संज्ञानात्मक भार घटाने के लिए डिज़ाइन करना
      - क्लिनिकल सुरक्षा केस के लिए डिज़ाइन साक्ष्य और विनियमित सॉफ़्टवेयर के लिए उपयोगिता साक्ष्य देना
    expert: |
      आप ये कर सकते हैं:
      - सुरक्षा-महत्वपूर्ण डिज़ाइन के लिए संगठन के मानक और पैटर्न तय करना
      - सबसे अधिक जोखिम वाली क्लिनिकल सेवाओं पर मानवीय कारक कार्य का नेतृत्व करना
      - पूरे पोर्टफ़ोलियो में डिज़ाइन से जुड़े जोखिमों पर क्लिनिकल सुरक्षा और उत्पाद प्रमुखों को सलाह देना
pd-health-content:
  name: स्वास्थ्य सूचना सामग्री
  description: ऐसी स्वास्थ्य और देखभाल सामग्री बनाना जो सटीक हो, क्लिनिकल रूप से सुनिश्चित हो, और अलग-अलग स्वास्थ्य साक्षरता वाले लोगों के लिए समझने और उस पर अमल करने में आसान हो।
  levels:
    awareness: |
      आप ये कर सकते हैं:
      - समझाना कि स्वास्थ्य जानकारी सटीक, अद्यतन और समझने में आसान क्यों होनी चाहिए
      - स्वास्थ्य सामग्री के लिए टीम की शैली मार्गदर्शिका और क्लिनिकल समीक्षा प्रक्रिया का पालन करना
    working: |
      आप ये कर सकते हैं:
      - ऐसी स्वास्थ्य सामग्री लिखना जिसे कम स्वास्थ्य साक्षरता वाले लोग समझ सकें और उस पर अमल कर सकें, जैसे लक्षण और कब मदद लेनी है
      - स्पष्टता खोए बिना सामग्री की सटीकता जाँचने के लिए क्लिनिकल समीक्षकों के साथ काम करना
      - चिकित्सा शब्दों को सरल भाषा में समझाना और बीमारियों, जाँचों और उपचारों के लिए एकरूप नामों का प्रयोग करना
    practitioner: |
      आप ये कर सकते हैं:
      - आपातकालीन लक्षणों, दवाओं और जीवन के अंतिम चरण की देखभाल जैसे संवेदनशील और उच्च-जोखिम विषयों के लिए सामग्री डिज़ाइन करना
      - स्वास्थ्य सामग्री के एक संग्रह के लिए क्लिनिकल आश्वासन, समीक्षा तिथियाँ और साक्ष्य स्रोत तय करना
      - विवादित सामग्री में क्लिनिकल सटीकता, कानूनी आवश्यकताओं और उपयोगकर्ता की समझ के बीच संतुलन बनाना
    expert: |
      आप ये कर सकते हैं:
      - स्वास्थ्य सूचना सामग्री और उसके क्लिनिकल आश्वासन के लिए संगठन के मानक तय करना
      - सभी सेवाओं और चैनलों में स्वास्थ्य सूचना की सामग्री रणनीति का नेतृत्व करना
      - स्वास्थ्य सूचना के जोखिमों पर वरिष्ठ क्लिनिकल और संचार प्रमुखों को सलाह देना
