# Job evaluation factors in Hindi. Keys are the English factor ids.
communication:
  name: संचार और संबंध कौशल
  description: सहकर्मियों, रोगियों, जनता और साझेदारों के साथ संवाद करने और संबंध बनाने के लिए आवश्यक कौशल। इसमें यह देखा जाता है कि जानकारी कितनी जटिल, संवेदनशील या विवादास्पद है, और समझने या स्वीकार करने में क्या बाधाएँ हैं।
  levels:
    "1": मुख्य रूप से सहकर्मियों के साथ मौखिक रूप से नियमित जानकारी देता और लेता है।
    "2": सहकर्मियों और अन्य लोगों के साथ मौखिक, लिखित या इलेक्ट्रॉनिक रूप से नियमित जानकारी देता और लेता है।
    "3": ऐसी नियमित जानकारी देता है जिसमें व्यवहार-कुशलता या समझाने की आवश्यकता हो, या जटिल या संवेदनशील जानकारी, या समूहों को सरल प्रशिक्षण देता है।
    "4": ऐसी जटिल, संवेदनशील या विवादास्पद जानकारी देता है जिसमें समझाने, बातचीत या प्रशिक्षण के कौशल चाहिए, या अत्यधिक जटिल जानकारी देता है।
    "5": अत्यधिक जटिल या विवादास्पद जानकारी देता है जिसमें विकसित समझाने और बातचीत के कौशल चाहिए, बड़े समूहों के सामने प्रस्तुति देता है, या स्वीकार्यता में बड़ी बाधाओं के बीच संवाद करता है।
    "6": स्वीकार्यता में बड़ी बाधाओं के बीच, संचार कौशल के उच्चतम स्तर का उपयोग करते हुए, अत्यधिक जटिल और अत्यधिक विवादास्पद जानकारी देता है।
knowledge:
  name: ज्ञान, प्रशिक्षण और अनुभव
  description: काम करने के लिए आवश्यक ज्ञान और अनुभव, किसी भी स्रोत से, जिसमें औपचारिक प्रशिक्षण, योग्यताएँ और अनुभव शामिल हैं।
  levels:
    "1": कुछ नियमित प्रक्रियाएँ, जो छोटे प्रारंभिक प्रशिक्षण में काम करते हुए सीखी गईं।
    "2": कई नियमित प्रक्रियाएँ, जो कार्यस्थल पर प्रशिक्षण और प्रारंभिक प्रशिक्षण से सीखी गईं।
    "3": कई प्रक्रियाएँ, जिनमें कुछ गैर-नियमित हैं, जिनके लिए बुनियादी सिद्धांत चाहिए (उदाहरण के लिए स्तर 3 की योग्यता या समकक्ष अनुभव)।
    "4": कई प्रक्रियाएँ, अधिकांश गैर-नियमित, जिनके लिए मध्यवर्ती सिद्धांत चाहिए (उदाहरण के लिए फ़ाउंडेशन डिग्री या समकक्ष अनुभव)।
    "5": किसी विशेषज्ञता में दक्षता, जो सिद्धांत या व्यावहारिक अनुभव पर आधारित हो (डिग्री स्तर या समकक्ष)।
    "6": पूरी विशेषज्ञता में विशेषज्ञ ज्ञान (स्नातकोत्तर डिप्लोमा स्तर या समकक्ष)।
    "7": पूरी विशेषज्ञता में अत्यधिक विकसित विशेषज्ञ ज्ञान (मास्टर स्तर या समकक्ष)।
    "8": उन्नत ज्ञान (डॉक्टरेट के साथ अतिरिक्त प्रशिक्षण या समकक्ष), या लंबी अवधि में विकसित एक से अधिक विधाओं का विशेषज्ञ ज्ञान।
analytical:
  name: विश्लेषण और निर्णय कौशल
  description: जानकारी संसाधित करने, समस्याएँ सुलझाने और निर्णय लेने के लिए आवश्यक विश्लेषण और विवेक।
  levels:
    "1": सीधे-सादे तथ्यों या स्थितियों पर निर्णय।
    "2": तथ्यों या स्थितियों पर निर्णय, जिनमें से कुछ में विश्लेषण चाहिए।
    "3": ऐसे कई तथ्यों या स्थितियों पर निर्णय जिनमें विश्लेषण या विकल्पों की तुलना चाहिए।
    "4": ऐसे जटिल तथ्यों या स्थितियों पर निर्णय जिनमें विश्लेषण, व्याख्या और विकल्पों की तुलना चाहिए।
    "5": ऐसे अत्यधिक जटिल तथ्यों या स्थितियों पर निर्णय जिनमें विश्लेषण, व्याख्या और विकल्पों की तुलना चाहिए।
planning:
  name: योजना और संगठन कौशल
  description: गतिविधियों, कार्यक्रमों, सेवाओं या रणनीतियों को चलाने के लिए आवश्यक योजना और संगठन।
  levels:
    "1": अपने दैनिक काम को व्यवस्थित करता है।
    "2": सरल कार्यों या गतिविधियों की योजना बनाता है, जिनमें से कुछ निरंतर चलती हैं।
    "3": कई जटिल गतिविधियों की योजना बनाता है और आवश्यकतानुसार योजनाएँ बदलता है।
    "4": जटिल गतिविधियों या रणनीतियों की व्यापक श्रृंखला की योजना बनाता है और आवश्यकतानुसार उन्हें बदलता है।
    "5": अनिश्चितता और पूरे संगठन पर प्रभाव वाली दीर्घकालिक रणनीतिक योजनाएँ बनाता है।
physical-skills:
  name: शारीरिक कौशल
  description: आवश्यक शारीरिक कौशल, जैसे हस्त-कौशल, समन्वय, कीबोर्ड कौशल और वाहन चलाना।
  levels:
    "1": शारीरिक कौशल की बहुत कम आवश्यकता।
    "2": अभ्यास से प्राप्त कौशल, जैसे सामान्य कीबोर्ड उपयोग या वाहन चलाना।
    "3": गति या सटीकता वाले विकसित कौशल, जैसे उन्नत कीबोर्ड उपयोग।
    "4": सटीकता या गति और उच्च हाथ-आँख समन्वय वाले अत्यधिक विकसित कौशल।
    "5": सटीकता, गति और समन्वय का उच्चतम स्तर।
patient-care:
  name: रोगी और सेवार्थी देखभाल की ज़िम्मेदारी
  description: रोगियों और सेवार्थियों के आकलन, उपचार, देखभाल या उन्हें सलाह देने की ज़िम्मेदारी। अधिकांश डिजिटल और कॉर्पोरेट भूमिकाओं में यह केवल आकस्मिक संपर्क होता है।
  levels:
    "1": आकस्मिक संपर्क के दौरान रोगियों, सेवार्थियों या परिजनों की मदद करता है।
    "2": रोगियों या जनता को सीधे सामान्य गैर-क्लिनिकल सलाह, जानकारी या सेवाएँ देता है।
    "3": व्यक्तिगत देखभाल, बुनियादी क्लिनिकल तकनीकी सेवाएँ या बुनियादी क्लिनिकल सलाह देता है।
    "4": क्लिनिकल देखभाल करता है, क्लिनिकल तकनीकी सेवाएँ देता है, या रोगियों की देखभाल पर सलाह देता है।
    "5": देखभाल कार्यक्रम विकसित करता है, विशेषज्ञ क्लिनिकल तकनीकी सेवाएँ देता है, या रोगी देखभाल पर विशेषीकृत सलाह देता है।
    "6": विशेषीकृत देखभाल विकसित करता है, अत्यधिक विशेषीकृत सलाह देता है, या किसी क्लिनिकल सेवा के एक भाग के लिए जवाबदेह होता है।
    "7": किसी क्लिनिकल या देखभाल सेवा की डिलीवरी के लिए जवाबदेह।
    "8": क्लिनिकल या देखभाल सेवाओं की संगठन-स्तरीय ज़िम्मेदारी।
policy:
  name: नीति और सेवा विकास की ज़िम्मेदारी
  description: नीतियों और सेवाओं को विकसित और लागू करने की ज़िम्मेदारी, और उनके प्रभाव का विस्तार।
  levels:
    "1": दूसरों द्वारा तय नीतियों का पालन करता है; बदलावों पर टिप्पणी कर सकता है।
    "2": अपने क्षेत्र में नीतियाँ लागू करता है और उसकी कार्यप्रणाली में बदलाव प्रस्तावित करता है।
    "3": अपने क्षेत्र में नीतियाँ लागू करता है और ऐसे बदलाव प्रस्तावित करता है जो अन्य क्षेत्रों को प्रभावित करते हैं।
    "4": नीति लागू करता है और किसी सेवा या कई क्षेत्रों के लिए नीति या सेवाएँ विकसित करता है।
    "5": किसी निदेशालय के लिए कई नीतियाँ या सेवाएँ लागू और विकसित करता है।
    "6": संगठन के भीतर या उससे आगे प्रमुख नीति या सेवा विकास की संगठन-स्तरीय ज़िम्मेदारी।
financial-resources:
  name: वित्तीय और भौतिक संसाधनों की ज़िम्मेदारी
  description: धन, बजट, उपकरण, स्टॉक, भवनों और अन्य परिसंपत्तियों की ज़िम्मेदारी।
  levels:
    "1": अपने काम में प्रयुक्त उपकरणों और संसाधनों की व्यक्तिगत देखभाल करता है।
    "2": नकद या मूल्यवान वस्तुएँ संभालता है, दूसरों द्वारा प्रयुक्त उपकरणों की देखभाल करता है, स्टॉक नियंत्रित करता है, या छोटे भुगतान स्वीकृत करता है।
    "3": भुगतान स्वीकृत करता है, कुछ परिसंपत्तियाँ या सामग्री खरीदता है, प्रत्यायोजित बजट की निगरानी करता या उसे रखता है, या परिसंपत्तियों का रखरखाव करता है।
    "4": किसी विभाग या सेवा का बजट रखता या तय करता है, या उसकी परिसंपत्तियाँ खरीदता या उनका रखरखाव करता है।
    "5": कई सेवाओं के लिए बजट रखता या तय करता है, या परिसंपत्तियों का प्रबंधन करता है।
    "6": संगठन के वित्त या परिसंपत्तियों की संगठन-स्तरीय ज़िम्मेदारी।
people:
  name: लोगों की ज़िम्मेदारी
  description: कर्मचारियों के प्रबंधन, पर्यवेक्षण, प्रशिक्षण या विकास, या मानव संसाधन सेवाएँ देने की ज़िम्मेदारी।
  levels:
    "1": नए या कम अनुभवी सहकर्मियों को अपने काम की दिनचर्या दिखाता है।
    "2": कर्मचारियों का दैनिक पर्यवेक्षण या समन्वय करता है, नियमित रूप से दूसरों को प्रशिक्षण देता है, या बुनियादी मानव संसाधन सलाह देता है।
    "3": कर्मचारियों के एक समूह का दैनिक प्रबंधन करता है, मुख्य या विशेषज्ञ प्रशिक्षण देता है, या मुख्य मानव संसाधन सलाह देता है।
    "4": किसी कार्य या विभाग का लाइन प्रबंधन करता है, मुख्य कर्तव्य के रूप में प्रशिक्षण कार्यक्रम बनाता है, या मानव संसाधन सेवाओं की पूरी श्रृंखला देता है।
    "5": कई विभागों का लाइन प्रबंधन करता है, या पूरे संगठन में प्रशिक्षण या मानव संसाधन के बड़े हिस्से का प्रबंधन करता है।
    "6": संगठन के लोगों या मानव संसाधन कार्य की संगठन-स्तरीय ज़िम्मेदारी।
information-resources:
  name: सूचना संसाधनों की ज़िम्मेदारी
  description: काग़ज़ी या डिजिटल सूचना और सूचना प्रणालियों की ज़िम्मेदारी, जिनमें अभिलेख, डेटा और उन्हें रखने वाली प्रणालियाँ शामिल हैं।
  levels:
    "1": पदधारक द्वारा उत्पन्न जानकारी दर्ज करता है।
    "2": दूसरों द्वारा संकलित डेटा दर्ज या संग्रहीत करता है, या कभी-कभी रिपोर्ट या क्वेरी लिखता है।
    "3": औपचारिक कार्यवृत्त लिखता है, नियमित रूप से रिपोर्ट या क्वेरी लिखता है, या एक महत्वपूर्ण कर्तव्य के रूप में सूचना प्रणालियों का रखरखाव करता है।
    "4": दूसरों के विनिर्देशों के अनुसार सूचना प्रणालियों को अनुकूलित या डिज़ाइन करता है, या मुख्य कर्तव्य के रूप में किसी विभाग की सूचना प्रणालियाँ चलाता है।
    "5": प्रमुख सूचना प्रणालियाँ डिज़ाइन और विकसित करता है, या मुख्य कर्तव्य के रूप में कई सेवाओं की सूचना प्रणालियाँ चलाता है।
    "6": मुख्य कर्तव्य के रूप में पूरे संगठन की सूचना प्रणालियों का प्रबंधन और विकास करता है।
    "7": संगठन की सूचना प्रणालियों की संगठन-स्तरीय ज़िम्मेदारी।
research:
  name: अनुसंधान और विकास की ज़िम्मेदारी
  description: औपचारिक अनुसंधान, विकास, मूल्यांकन, ऑडिट, परीक्षण और ट्रायल की ज़िम्मेदारी।
  levels:
    "1": अपने काम के लिए सर्वेक्षण या ऑडिट करता है; कभी-कभी अनुसंधान या परीक्षण में भाग लेता है।
    "2": काम के हिस्से के रूप में नियमित रूप से अनुसंधान, विकास, ट्रायल, या उपकरण और प्रणाली परीक्षण करता है।
    "3": मुख्य कर्तव्य के रूप में औपचारिक कार्यक्रमों के भीतर अनुसंधान या विकास करता है।
    "4": अनुसंधान और विकास कार्यक्रमों का समन्वय और संचालन करता है।
    "5": संगठन के उद्देश्यों का समर्थन करने वाले अनुसंधान और विकास कार्यक्रम शुरू और विकसित करता है।
    "6": संगठन से आगे प्रभाव वाले अनुसंधान और विकास कार्यक्रम शुरू और विकसित करता है।
freedom-to-act:
  name: कार्य करने की स्वतंत्रता
  description: पदधारक किस हद तक तय करता है कि क्या और कैसे करना है, और उसके काम का पर्यवेक्षण कितनी बारीकी से होता है।
  levels:
    "1": निर्धारित प्रक्रियाओं के भीतर काम करता है, पर्यवेक्षण पास में रहता है।
    "2": मानक प्रक्रियाओं और पूर्व उदाहरणों का पालन करता है; पूछने के लिए आमतौर पर कोई उपलब्ध रहता है; काम की जाँच हो सकती है।
    "3": परिभाषित नीतियों और प्रक्रियाओं का पालन करता है; काम का पर्यवेक्षण नहीं, प्रबंधन होता है।
    "4": परिणाम परिभाषित हैं, पर व्यापक नीति के भीतर पदधारक तय करता है कि उन्हें कैसे प्राप्त करना है।
    "5": सामान्य नीतियों के भीतर काम करता है, और अधिकांश मामलों में तय करता है कि उनकी व्याख्या कैसे करनी है।
    "6": लक्ष्य और मानक तय करने के लिए समग्र नीति और रणनीति की व्याख्या करता है।
physical-effort:
  name: शारीरिक प्रयास
  description: आवश्यक शारीरिक प्रयास, उसकी आवृत्ति, अवधि और तीव्रता को ध्यान में रखते हुए।
  levels:
    "1": बैठना, खड़े होना और चलना, बहुत कम शारीरिक प्रयास के साथ।
    "2": अक्सर सीमित मुद्रा में बैठना या खड़े रहना, या कभी-कभी हल्का से मध्यम प्रयास।
    "3": लंबी अवधि तक अक्सर हल्का प्रयास, या कम अवधि के लिए अक्सर मध्यम प्रयास।
    "4": निरंतर हल्का प्रयास, लंबी अवधि तक अक्सर मध्यम प्रयास, या कभी-कभी तीव्र प्रयास।
    "5": निरंतर मध्यम प्रयास, या अक्सर तीव्र प्रयास।
mental-effort:
  name: मानसिक प्रयास
  description: आवश्यक एकाग्रता, उसकी आवृत्ति, अवधि और काम कितना पूर्वानुमेय है, इसे ध्यान में रखते हुए।
  levels:
    "1": सामान्य ध्यान; पूर्वानुमेय काम पर कभी-कभी एकाग्रता।
    "2": पूर्वानुमेय काम पर अक्सर एकाग्रता, या अप्रत्याशित काम पर कभी-कभी एकाग्रता।
    "3": अप्रत्याशित काम पर अक्सर एकाग्रता, या कभी-कभी लंबी एकाग्रता।
    "4": अक्सर लंबी एकाग्रता, या कभी-कभी गहन एकाग्रता।
    "5": अक्सर गहन एकाग्रता।
emotional-effort:
  name: भावनात्मक प्रयास
  description: काम की भावनात्मक माँगें, जो कष्टदायक परिस्थितियों के प्रत्यक्ष या अप्रत्यक्ष संपर्क से आती हैं, जैसे कष्टदायक केस अभिलेख पढ़ना या गंभीर घटनाएँ संभालना।
  levels:
    "1": कष्टदायक परिस्थितियों से दुर्लभ संपर्क, या कभी-कभी अप्रत्यक्ष संपर्क।
    "2": कष्टदायक परिस्थितियों से कभी-कभी संपर्क, या अक्सर अप्रत्यक्ष संपर्क।
    "3": कष्टदायक परिस्थितियों से अक्सर संपर्क, या अत्यधिक कष्टदायक परिस्थितियों से कभी-कभी संपर्क।
    "4": दर्दनाक (ट्रॉमैटिक) परिस्थितियों से कभी-कभी संपर्क, या अत्यधिक कष्टदायक परिस्थितियों से अक्सर संपर्क।
working-conditions:
  name: कार्य परिस्थितियाँ
  description: अप्रिय परिस्थितियों या ख़तरों से संपर्क। अधिकांश दिनों में लगभग लगातार स्क्रीन उपयोग स्तर 2 में गिना जाता है।
  levels:
    "1": अप्रिय परिस्थितियों से दुर्लभ संपर्क।
    "2": कभी-कभी अप्रिय परिस्थितियाँ, अक्सर यात्रा या बाहरी काम, या अधिकांश दिनों में लगभग लगातार स्क्रीन उपयोग।
    "3": अक्सर अप्रिय परिस्थितियाँ, या कभी-कभी अत्यधिक अप्रिय परिस्थितियाँ।
    "4": ख़तरों से कुछ संपर्क, या अक्सर अत्यधिक अप्रिय परिस्थितियाँ।
    "5": ख़तरों से काफ़ी संपर्क।
