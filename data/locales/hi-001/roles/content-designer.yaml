summary: >
  सामग्री डिज़ाइनर स्वास्थ्य और देखभाल की जानकारी और सेवाओं को स्पष्ट बनाते हैं, ताकि रोगी, देखभालकर्ता, चिकित्सक और देखभाल कर्मचारी समझ सकें कि उन्हें क्या जानना और करना है। वे उपयोगकर्ता आवश्यकताओं के साक्ष्य से सामग्री डिज़ाइन करते हैं, सरल भाषा में लिखते हैं, उसे सटीक रखने के लिए क्लिनिकल विशेषज्ञों के साथ काम करते हैं, और सामग्री के पूरे जीवनकाल में, निर्माण से समीक्षा और सेवानिवृत्ति तक, उसकी देखरेख करते हैं।
health_context:
  - लोग अक्सर चिंता, बीमारी या जल्दबाज़ी में स्वास्थ्य सामग्री पढ़ते हैं, इसलिए सामग्री कम स्वास्थ्य साक्षरता वाले लोगों के लिए भी समझने और उस पर अमल करने में आसान होनी चाहिए।
  - ग़लत या पुरानी स्वास्थ्य जानकारी नुकसान पहुँचा सकती है, इसलिए सामग्री डिज़ाइनर समीक्षा तिथियों और नामित क्लिनिकल समीक्षकों के साथ क्लिनिकल आश्वासन प्रक्रिया का पालन करते हैं।
  - आपातकालीन लक्षण, मानसिक स्वास्थ्य, दवाएँ और जीवन के अंतिम चरण की देखभाल जैसे कुछ विषय संवेदनशील या उच्च-जोखिम होते हैं, इसलिए सामग्री डिज़ाइनर लहजे और सटीकता पर चिकित्सकों और उपयोगकर्ता शोधकर्ताओं के साथ निकटता से काम करते हैं।
  - क्लिनिकल प्रणालियों को भी लेबल, निर्देश और अलर्ट जैसी स्पष्ट सामग्री चाहिए, इसलिए सामग्री डिज़ाइनर क्लिनिकल कार्यप्रवाहों में त्रुटियाँ घटाने में मदद करते हैं।
  - स्वास्थ्य सामग्री सुगम और समावेशी होनी चाहिए, जिसमें सहायक तकनीक का उपयोग करने वाले, दूसरी भाषा में पढ़ने वाले, या आसान-पठन प्रारूप चाहने वाले लोग शामिल हैं।
levels:
  - title: एसोसिएट सामग्री डिज़ाइनर
    responsibilities:
      - प्रशिक्षण और पर्यवेक्षित काम के माध्यम से सामग्री डिज़ाइन विधियाँ, शैली मार्गदर्शिका और क्लिनिकल समीक्षा प्रक्रिया सीखना।
      - मौजूदा सामग्री की मानक जाँच, संपादन और अद्यतन करना।
      - आश्वासन चरणों का पालन करते हुए सामग्री प्रबंधन प्रणाली से सामग्री प्रकाशित करना।
      - शीर्षकों, लिंक पाठ और वैकल्पिक पाठ जैसी सुगम्यता के लिए सामग्री की जाँच करना।
    qualifications:
      - किसी संबंधित क्षेत्र में योग्यता या अप्रेंटिसशिप की ओर काम कर रहे, या समकक्ष अनुभव।
  - title: कनिष्ठ सामग्री डिज़ाइनर
    responsibilities:
      - अधिक वरिष्ठ सामग्री डिज़ाइनरों के निर्देशन में स्वास्थ्य सामग्री और सेवा सामग्री लिखना और अद्यतन करना।
      - यह पहचानने के लिए शोध और डेटा का उपयोग करना कि उपयोगकर्ताओं को क्या जानना है और वे कौन-से शब्द इस्तेमाल करते हैं।
      - सटीकता जाँचने के लिए क्लिनिकल समीक्षकों के साथ काम करना, और चिकित्सा शब्दों को सरल भाषा में समझाना।
      - सामग्री प्रकाशन, समीक्षा तिथियों और सामग्री टीम के प्रशासन में सहायता करना।
    qualifications:
      - डिग्री या संबंधित योग्यता, या वेब के लिए लिखने का समकक्ष अनुभव।
  - title: सामग्री डिज़ाइनर
    responsibilities:
      - सेवा खोजने, अपॉइंटमेंट की तैयारी और बाद की देखभाल जैसी पूरी उपयोगकर्ता यात्राओं में सामग्री डिज़ाइन करना।
      - त्रुटि की संभावना घटाने के लिए क्लिनिकल प्रणालियों के लेबल, निर्देश और अलर्ट जैसी सामग्री डिज़ाइन करना।
      - सामग्री को स्पष्ट और उपयोगी रखते हुए क्लिनिकल विशेषज्ञों के साथ सटीकता पर सहमति बनाना।
      - कम स्वास्थ्य साक्षरता वाले लोगों और सहायक तकनीक का उपयोग करने वालों सहित उपयोगकर्ताओं के साथ सामग्री का परीक्षण करना।
      - शैली मार्गदर्शिका और सामग्री पैटर्न में योगदान देना।
    qualifications:
      - डिग्री या संबंधित योग्यता, या समकक्ष अनुभव।
      - डिजिटल सेवाओं के लिए सामग्री डिज़ाइन करने का अनुभव।
  - title: वरिष्ठ सामग्री डिज़ाइनर
    responsibilities:
      - किसी प्रमुख बीमारी क्षेत्र या सार्वजनिक स्वास्थ्य अभियान जैसे बड़े या चर्चित क्षेत्रों के लिए सामग्री रणनीति विकसित करना।
      - आपातकालीन लक्षण, मानसिक स्वास्थ्य और जीवन के अंतिम चरण की देखभाल जैसे संवेदनशील और उच्च-जोखिम विषयों के लिए सामग्री डिज़ाइन करना।
      - स्वास्थ्य सामग्री के एक संग्रह के लिए क्लिनिकल आश्वासन, साक्ष्य स्रोत और समीक्षा चक्र स्थापित करना।
      - गुणवत्ता का आश्वासन देने के लिए दूसरों के काम की समीक्षा करना, और सामग्री डिज़ाइनरों का प्रबंधन या मार्गदर्शन करना।
      - टीम के साथ उपयोगकर्ता कहानियाँ लिखना और उनका मानचित्र बनाना।
    qualifications:
      - सामग्री डिज़ाइन का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
    job_evaluation_notes: भावनात्मक प्रयास स्तर 2 पर है क्योंकि वरिष्ठ सामग्री डिज़ाइनर नियमित रूप से गंभीर बीमारी, आत्म-क्षति और शोक जैसे कष्टदायक विषयों पर काम करते हैं।
  - title: लीड सामग्री डिज़ाइनर
    responsibilities:
      - सामग्री डिज़ाइनरों की एक टीम का निर्देशन करना और कई टीमों में सामग्री की गुणवत्ता का आश्वासन देना।
      - सुनिश्चित करना कि स्वास्थ्य सामग्री क्लिनिकल आश्वासन, सुगम्यता और शैली मानकों को पूरा करे।
      - टीमों को संसाधन देने और सामग्री समस्याएँ सुलझाने के लिए वरिष्ठ क्लिनिकल, संचार और उत्पाद प्रमुखों के साथ काम करना।
      - संगठन की सबसे संवेदनशील या उच्च-जोखिम जानकारी की सामग्री का नेतृत्व करना।
      - सामग्री डिज़ाइनरों का लाइन प्रबंधन और विकास करना।
    qualifications:
      - विभिन्न टीमों में सामग्री डिज़ाइन का नेतृत्व करने का व्यापक अनुभव।
    job_evaluation_notes: बैंड 8a का कोई स्तर नहीं है, क्योंकि UK GDaD PCF लीड सामग्री डिज़ाइनर को G7 या G6 पर रखता है और यह संदर्भ सुझाए गए बैंड 8b का पालन करता है। नीति स्तर 5 पर है क्योंकि लीड कई सेवाओं के लिए सामग्री मानक तय करता है; भावनात्मक प्रयास स्तर 2 पर है, जैसा वरिष्ठ सामग्री डिज़ाइनरों के लिए।
  - title: सामग्री डिज़ाइन प्रमुख
    responsibilities:
      - ऐसी सामग्री रणनीति विकसित करना जो संगठन के उद्देश्यों और रोगियों तथा कर्मचारियों की आवश्यकताओं को पूरा करे।
      - स्वास्थ्य सूचना सामग्री और उसके क्लिनिकल आश्वासन के लिए संगठन के मानक तय करना।
      - रणनीति को लागू करने में सक्षम सामग्री डिज़ाइन टीम का नेतृत्व करना, जिसमें भर्ती और विकास शामिल हैं।
      - स्वास्थ्य सूचना जोखिमों के प्रबंधन के लिए वरिष्ठ क्लिनिकल और संचार प्रमुखों के साथ काम करना।
      - पूरे संगठन में सामग्री कार्य को प्राथमिकता देना।
    qualifications:
      - सामग्री डिज़ाइन और एक सामग्री अभ्यास का नेतृत्व करने का व्यापक अनुभव।
    job_evaluation_notes: UK GDaD PCF लीड सामग्री डिज़ाइनर और सामग्री डिज़ाइन प्रमुख दोनों को G7 या G6 पर, सुझाए गए बैंड 8b के साथ रखता है। यह संदर्भ प्रमुख को बैंड 8c पर रखता है, अन्य उपयोगकर्ता-केंद्रित डिज़ाइन पेशों के प्रमुखों के अनुरूप, क्योंकि प्रमुख पूरे संगठन के लिए सामग्री रणनीति और मानक तय करता है।
