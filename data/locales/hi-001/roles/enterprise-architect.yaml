summary: >
  एंटरप्राइज़ आर्किटेक्ट संगठन को उसकी सेवाओं, सूचना, एप्लिकेशन और तकनीक का एकीकृत दृश्य देते हैं, और उसका उपयोग स्वास्थ्य और देखभाल रणनीति को परिवर्तन की एक सुसंगत योजना में बदलने के लिए करते हैं। वे आर्किटेक्चर सिद्धांत, मानक और रोडमैप तय करते हैं, निवेश निर्णयों का मार्गदर्शन करते हैं, और सुनिश्चित करते हैं कि डिजिटल परिवर्तन संगठनों के पार रोगियों के लिए सुरक्षित, समन्वित देखभाल में सहायक हो।
health_context:
  - देखभाल मार्ग कई संगठनों और प्रणालियों से होकर गुज़रते हैं, इसलिए आर्किटेक्चर को सीमाओं के पार अभिलेख, परिणाम और रेफ़रल साझा करने में सहायक होना चाहिए।
  - परिसंपत्तियों में अक्सर लंबे समय से चल रही क्लिनिकल प्रणालियाँ, चिकित्सा उपकरण और आपूर्तिकर्ता अनुबंध होते हैं जिन्हें बदलना कठिन है, इसलिए रोडमैप में संक्रमण की सावधानीपूर्वक योजना बनानी चाहिए।
  - आर्किटेक्चर निर्णय रोगी सुरक्षा, निजता और चौबीसों घंटे चलने वाली सेवाओं के लचीलेपन को प्रभावित करते हैं।
  - HL7 FHIR, SNOMED CT और IHE प्रोफ़ाइल जैसे खुले मानक लॉक-इन से बचने और अंतर-संचालनीयता संभव बनाने के लिए महत्वपूर्ण हैं।
  - वित्तपोषण सीमित है और उसकी कड़ी जाँच होती है, इसलिए आर्किटेक्टों को धन का सर्वोत्तम मूल्य और जहाँ उपलब्ध हों वहाँ साझा प्लेटफ़ॉर्म का पुनः उपयोग दिखाना चाहिए।
levels:
  - title: एंटरप्राइज़ आर्किटेक्ट
    responsibilities:
      - निदान या सामुदायिक देखभाल जैसे किसी क्षेत्र के लिए संगठन की वर्तमान और लक्षित सेवाओं, सूचना, एप्लिकेशन और तकनीक का मॉडल बनाना।
      - एप्लिकेशन और डेटा प्रवाह कैटलॉग सहित आर्किटेक्चर रिपॉज़िटरी को अद्यतन रखना।
      - आर्किटेक्चर सिद्धांतों और मानकों के आधार पर प्रस्तावों की समीक्षा करना और डिज़ाइन प्राधिकरणों को सिफ़ारिशें देना।
      - पहचानना कि कहाँ प्रणालियाँ क्षमता दोहराती हैं या असमर्थित तकनीक पर निर्भर हैं, और जोखिम उठाना।
      - समझने के लिए सॉल्यूशन आर्किटेक्ट और क्लिनिकल प्रमुखों के साथ काम करना कि देखभाल मार्ग प्रणालियों का उपयोग कैसे करते हैं।
      - सॉल्यूशन आर्किटेक्टों का मार्गदर्शन करना कि डिज़ाइन क्षेत्र के आर्किटेक्चर में कैसे बैठते हैं।
    qualifications:
      - किसी जटिल संगठन में आर्किटेक्चर, विश्लेषण या तकनीकी डिज़ाइन का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
      - TOGAF जैसे एंटरप्राइज़ आर्किटेक्चर ढाँचे का ज्ञान, या समकक्ष अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 6) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8a पर रखते हैं। ज्ञान, विश्लेषण, योजना, नीति और कार्य करने की स्वतंत्रता का अंक बैंड 8a प्रोफ़ाइल पर है, क्योंकि यह पद पूरे क्षेत्र के लिए लक्षित आर्किटेक्चर को आकार देता है और डिज़ाइन प्राधिकरणों को सलाह देता है।"
  - title: वरिष्ठ एंटरप्राइज़ आर्किटेक्ट
    responsibilities:
      - संगठन के एक या अधिक क्षेत्रों के लिए लक्षित आर्किटेक्चर और संक्रमण रोडमैप विकसित करना।
      - बिज़नेस केस को आकार देना ताकि निवेश लक्षित आर्किटेक्चर में बैठें और साझा प्लेटफ़ॉर्म का पुनः उपयोग करें।
      - डिज़ाइन प्राधिकरणों में आर्किटेक्चर समीक्षाओं का नेतृत्व करना और महत्वपूर्ण प्रस्तावों पर सिफ़ारिशें देना।
      - डेटा माइग्रेशन और सुरक्षा जोखिमों सहित पुरानी क्लिनिकल और कॉर्पोरेट प्रणालियों के प्रतिस्थापन या सेवानिवृत्ति की योजना बनाना।
      - सुनिश्चित करना कि अंतर-संचालनीयता, सुरक्षा और सूचना शासन की आवश्यकताएँ रोडमैप में शामिल हों।
      - एंटरप्राइज़ और सॉल्यूशन आर्किटेक्टों को कोचिंग देना और उनका मार्गदर्शन करना।
    qualifications:
      - कई क्षेत्रों में एंटरप्राइज़ या सॉल्यूशन आर्किटेक्चर का व्यापक अनुभव।
      - TOGAF जैसे एंटरप्राइज़ आर्किटेक्चर ढाँचे का ज्ञान, या समकक्ष अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 7) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8b पर रखते हैं। योजना स्तर 5 पर है, पूरे संगठन पर प्रभाव वाले दीर्घकालिक रोडमैप के लिए; ज्ञान स्तर 8 पर है, व्यवसाय, सूचना, एप्लिकेशन और तकनीकी आर्किटेक्चर के ज्ञान के लिए।"
  - title: लीड एंटरप्राइज़ आर्किटेक्ट
    responsibilities:
      - संगठन के किसी प्रमुख भाग, जैसे क्लिनिकल प्रणालियों या साझा इन्फ़्रास्ट्रक्चर, के एंटरप्राइज़ आर्किटेक्चर का स्वामित्व रखना।
      - आर्किटेक्चर डिज़ाइन प्राधिकरण की अध्यक्षता या नेतृत्व करना और वे मानक तय करना जिन्हें परियोजनाओं को पूरा करना है।
      - निवेश प्राथमिकताओं, आपूर्तिकर्ता रणनीति और तकनीकी जोखिमों पर निदेशकों को सलाह देना।
      - देखभाल मार्गों और साझा अभिलेखों में आर्किटेक्चर को संरेखित करने के लिए साझेदार संगठनों के साथ काम करना।
      - एंटरप्राइज़ आर्किटेक्टों का नेतृत्व और विकास करना और आर्किटेक्चर अभ्यास समुदाय को बढ़ाना।
    qualifications:
      - किसी जटिल संगठन में एंटरप्राइज़ आर्किटेक्चर का व्यापक अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 8b) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8c पर रखते हैं। सूचना संसाधन स्तर 6 पर है क्योंकि यह पद संगठन के एक प्रमुख भाग की सूचना प्रणालियों के आर्किटेक्चर का प्रबंधन करता है; नीति और लोग बैंड 8b प्रोफ़ाइल से ऊपर हैं क्योंकि यह सभी परियोजनाओं के मानक तय करता है और एंटरप्राइज़ आर्किटेक्टों का नेतृत्व करता है।"
  - title: प्रधान एंटरप्राइज़ आर्किटेक्ट
    responsibilities:
      - संगठन की स्वास्थ्य और देखभाल रणनीति के अनुरूप उसका एंटरप्राइज़ आर्किटेक्चर दृष्टिकोण, सिद्धांत और रणनीति तय करना।
      - प्रमुख डिजिटल निवेशों के आर्किटेक्चर, जोखिमों और मूल्य पर कार्यकारी टीम और बोर्ड को सलाह देना।
      - संगठन के आर्किटेक्चर अभ्यास, शासन और मानकों का नेतृत्व करना।
      - अंतर-संगठनात्मक आर्किटेक्चर और अंतर-संचालनीयता मंचों में संगठन का प्रतिनिधित्व करना।
      - भर्ती और करियर मार्गों सहित पूरे संगठन में आर्किटेक्चर क्षमता बनाना।
    qualifications:
      - विभिन्न संगठनों में एंटरप्राइज़ आर्किटेक्चर का नेतृत्व करने का व्यापक अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 8c) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8d पर रखते हैं। नीति और कार्य करने की स्वतंत्रता स्तर 6 पर हैं क्योंकि यह पद संगठन के आर्किटेक्चर दृष्टिकोण, सिद्धांतों और रणनीति की संगठन-स्तरीय ज़िम्मेदारी रखता है।"
