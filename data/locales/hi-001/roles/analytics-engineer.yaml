summary: >
  एनालिटिक्स इंजीनियर कच्चे स्वास्थ्य और देखभाल डेटा को साफ़, परखे हुए और दस्तावेज़ीकृत डेटा मॉडलों में बदलते हैं जिन पर विश्लेषक, डेटा वैज्ञानिक और रिपोर्टिंग उपकरण भरोसा कर सकें। वे डेटा इंजीनियरिंग और विश्लेषण के बीच काम करते हैं, और संगठन की रिपोर्टों और डैशबोर्ड के पीछे के रूपांतरणों पर संस्करण नियंत्रण, परीक्षण और कोड समीक्षा जैसी सॉफ़्टवेयर इंजीनियरिंग पद्धतियाँ लागू करते हैं।
health_context:
  - डेटा मॉडलों में क्लिनिकल और परिचालन परिभाषाएँ समाहित होती हैं, जैसे भर्ती, पुनः भर्ती या प्रतीक्षा समय मानक का उल्लंघन किसे माना जाए, इसलिए परिभाषाओं पर क्लिनिकल और परिचालन प्रमुखों के साथ सहमति बनाई जाती है।
  - SNOMED CT और ICD जैसी शब्दावलियों और वर्गीकरणों के क्लिनिकल कोड विश्लेषण के लिए संदर्भ सेटों में समूहित किए जाते हैं, जिनके लिए सावधानीपूर्वक संस्करण नियंत्रण चाहिए।
  - प्रदर्शन और वित्तपोषण रिपोर्टों के लिए उपयोग होने वाले मॉडल एकरूप और ऑडिट-योग्य होने चाहिए, क्योंकि त्रुटियाँ रोगी सेवाओं के निर्णयों को प्रभावित कर सकती हैं।
  - मॉडलों में अक्सर छद्मनामित रोगी-स्तरीय डेटा होता है, इसलिए पहुँच, दस्तावेज़ीकरण और डेटा न्यूनीकरण शामिल किए जाते हैं।
levels:
  - title: प्रशिक्षु एनालिटिक्स इंजीनियर
    responsibilities:
      - प्रशिक्षण और पेयरिंग के माध्यम से टीम के डेटा मॉडलिंग उपकरण और पद्धतियाँ सीखना।
      - पर्यवेक्षण में डेटा मॉडलों में छोटे, स्पष्ट रूप से परिभाषित परिवर्तन करना।
      - डेटा कैटलॉग में डेटा आइटम और उनकी परिभाषाएँ दर्ज करना।
      - डेटा उपयोगकर्ताओं के सरल प्रश्नों का उत्तर देना और उनकी आवश्यकताएँ दर्ज करना।
      - रोगी डेटा के साथ काम करते समय सूचना शासन नियमों का पालन करना।
    qualifications:
      - डेटा अप्रेंटिसशिप या समकक्ष में नामांकित, या उसकी ओर काम कर रहे।
    job_evaluation_notes: ज्ञान का अंक उस स्तर पर दिया गया है जो काम करने के लिए पर्याप्त प्रशिक्षण पूरा होने पर आवश्यक है।
  - title: एनालिटिक्स इंजीनियर
    responsibilities:
      - सहमत डिज़ाइनों से अंतःरोगी गतिविधि या सामुदायिक देखभाल जैसे किसी सेवा क्षेत्र के लिए डेटा मॉडल बनाना और परखना।
      - सहमत क्लिनिकल और परिचालन परिभाषाओं के आधार पर डेटा मॉडलों की जाँच करने वाले स्वचालित परीक्षण लिखना।
      - विश्लेषण में उपयोग होने वाले क्लिनिकल कोड के संदर्भ सेटों को स्पष्ट संस्करणों के साथ बनाए रखना।
      - मॉडलों का दस्तावेज़ीकरण करना ताकि विश्लेषक उनका अर्थ, स्रोत और सीमाएँ समझें।
      - टीम के डेटासेट उपयोगकर्ताओं को प्रशिक्षण और सहायता देना।
    qualifications:
      - किसी गणितीय या कंप्यूटिंग विषय में डिग्री, या समकक्ष अनुभव।
      - डेटा मॉडल या विश्लेषणात्मक कोड बनाने का अनुभव।
  - title: वरिष्ठ एनालिटिक्स इंजीनियर
    responsibilities:
      - कई सेवा क्षेत्रों में डेटा मॉडलों के डिज़ाइन और परीक्षण की देखरेख करना।
      - क्लिनिकल, परिचालन और वित्त प्रमुखों के साथ प्रमुख मापों की परिभाषाओं पर सहमति बनाना और सुनिश्चित करना कि मॉडल उन्हें एकरूपता से लागू करें।
      - सुनिश्चित करना कि प्रदर्शन और वित्तपोषण रिपोर्टों को डेटा देने वाले मॉडल ऑडिट-योग्य और अच्छी तरह परखे हुए हों।
      - डेटा इंजीनियरों और डेटा स्वामियों के साथ डेटा समस्याएँ और जोखिम सुलझाना।
      - अन्य एनालिटिक्स इंजीनियरों को कोचिंग देना और उनके काम का निर्देशन करना।
    qualifications:
      - डेटा मॉडलिंग और एनालिटिक्स इंजीनियरिंग का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
  - title: लीड एनालिटिक्स इंजीनियर
    responsibilities:
      - संगठन के विश्लेषणात्मक डेटा मॉडलों को डिज़ाइन करने, बनाने और बनाए रखने वाली टीम का नेतृत्व करना।
      - डेटा मॉडलों, परीक्षणों, दस्तावेज़ीकरण और मापों की परिभाषाओं के मानक तय करना।
      - यह समझने के लिए पूरे संगठन की टीमों के साथ काम करना कि क्लिनिकल और परिचालन प्रक्रियाएँ डेटा कैसे बनाती हैं।
      - अन्य एनालिटिक्स इंजीनियरों के काम की समीक्षा करना और टीम के काम करने के तरीक़ों में सुधार करना।
      - एनालिटिक्स इंजीनियरों का लाइन प्रबंधन करना।
    qualifications:
      - एनालिटिक्स इंजीनियरिंग या डेटा मॉडलिंग का नेतृत्व करने का व्यापक अनुभव।
  - title: एनालिटिक्स इंजीनियरिंग प्रमुख
    responsibilities:
      - संगठन के विश्लेषणात्मक डेटा मॉडलों की दिशा तय करना, ताकि पूरे संगठन का विश्लेषण परिभाषाओं के एक विश्वसनीय समूह का उपयोग करे।
      - सुनिश्चित करना कि एनालिटिक्स इंजीनियरिंग की प्राथमिकताएँ संगठन की रणनीति और रिपोर्टिंग दायित्वों में सहायक हों।
      - बड़ी रिपोर्टों और निर्णयों के पीछे के डेटा की विश्वसनीयता पर वरिष्ठ प्रमुखों को सलाह देना।
      - सुनिश्चित करना कि समुदाय के पास आवश्यक उपकरण और प्लेटफ़ॉर्म हों, और संबंधित बजट का प्रबंधन करना।
      - तकनीकी नेतृत्व और करियर विकास के माध्यम से एनालिटिक्स इंजीनियरिंग क्षमता बनाना।
    qualifications:
      - पूरे संगठन में एनालिटिक्स इंजीनियरिंग का नेतृत्व करने का व्यापक अनुभव।
