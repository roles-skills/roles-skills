summary: >
  बिज़नेस आर्किटेक्ट इसका स्पष्ट, एकीकृत दृश्य बनाते हैं कि संगठन स्वास्थ्य और देखभाल कैसे प्रदान करता है: उसकी क्षमताएँ, सेवाएँ, देखभाल मार्ग, प्रक्रियाएँ और सूचना। वे इस दृश्य का उपयोग यह दिखाने के लिए करते हैं कि कहाँ परिवर्तन चाहिए, रणनीति को कार्यक्रमों से जोड़ने के लिए, और यह सुनिश्चित करने के लिए कि डिजिटल परिवर्तन रोगियों की देखभाल और चिकित्सकों तथा देखभाल कर्मचारियों के कामकाजी जीवन में सुधार करे।
health_context:
  - देखभाल मार्ग टीमों, परिवेशों और संगठनों से होकर गुज़रते हैं, इसलिए बिज़नेस आर्किटेक्ट केवल विभाग के अनुसार नहीं, रोगी के दृष्टिकोण से सेवाओं का मॉडल बनाते हैं।
  - क्लिनिकल प्रक्रियाओं में परिवर्तन रोगी सुरक्षा और कर्मचारियों के कार्यभार को प्रभावित कर सकता है, इसलिए मॉडल चिकित्सकों और देखभाल कर्मचारियों के साथ बनाए जाते हैं और वास्तविक अभ्यास से जाँचे जाते हैं।
  - स्वास्थ्य और देखभाल रणनीति नीति, विनियमन और वित्तपोषण नियमों से आकार लेती है, जिन्हें आर्किटेक्टों को व्यावहारिक क्षमता परिवर्तनों में बदलना होता है।
  - कई क्षमताएँ साझेदार संगठनों के साथ साझा होती हैं, इसलिए आर्किटेक्ट यह तय करने में मदद करते हैं कि कौन क्या करेगा और जानकारी कहाँ प्रवाहित होनी चाहिए।
levels:
  - title: प्रशिक्षु बिज़नेस आर्किटेक्ट
    responsibilities:
      - प्रशिक्षण और अभ्यास के माध्यम से क्षमता, वैल्यू स्ट्रीम और प्रक्रिया मॉडलिंग जैसी बिज़नेस आर्किटेक्चर विधियाँ सीखना।
      - साक्षात्कार, दस्तावेज़ों और अवलोकन के माध्यम से सेवाओं और देखभाल मार्गों के बारे में जानकारी एकत्र करना।
      - बिज़नेस आर्किटेक्टों के मार्गदर्शन में क्षमता मानचित्रों और प्रक्रिया मॉडलों का मसौदा बनाना।
      - चिकित्सकों, देखभाल कर्मचारियों और प्रबंधकों के साथ कार्यशालाएँ चलाने में मदद करना और उनके परिणाम लिखना।
    qualifications:
      - व्यवसाय, विश्लेषण या संबंधित विषय में डिग्री या समकक्ष अनुभव।
      - बिज़नेस आर्किटेक्चर विधियों का विशेषज्ञ प्रशिक्षण, स्नातकोत्तर डिप्लोमा स्तर या समकक्ष अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 5) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 6 पर रखते हैं। ज्ञान का अंक उस स्तर पर दिया गया है जो काम करने के लिए पर्याप्त प्रशिक्षण पूरा होने पर आवश्यक है।"
  - title: एसोसिएट बिज़नेस आर्किटेक्ट
    responsibilities:
      - संगठन के किसी भाग के लिए क्षमताओं, सेवाओं और देखभाल मार्गों का मॉडल बनाना।
      - रोगियों और कर्मचारियों के लिए अंतराल, दोहराव और कष्ट-बिंदु खोजने के लिए मॉडलों का विश्लेषण करना।
      - परिवर्तन के निर्णयों के लिए विभिन्न टीमों और संगठनों की जानकारी को एक साथ लाना।
      - स्पष्ट मॉडलों और सरल भाषा का उपयोग करके हितधारकों को जटिल सेवा समस्याएँ समझाना।
      - बिज़नेस आर्किटेक्चर रिपॉज़िटरी को सटीक और एप्लिकेशन तथा डेटा मॉडलों से जुड़ा रखना।
    qualifications:
      - बिज़नेस आर्किटेक्चर या बिज़नेस विश्लेषण का विशेषज्ञ ज्ञान, मास्टर स्तर या समकक्ष अनुभव।
      - बिज़नेस विश्लेषण या सेवा डिज़ाइन का अनुभव।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 6) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 7 पर रखते हैं। ज्ञान का अंक मास्टर स्तर या समकक्ष पर है, क्योंकि यह पद टीमों और संगठनों के पार सेवाओं और देखभाल मार्गों का मॉडल बनाता और विश्लेषण करता है।"
  - title: बिज़नेस आर्किटेक्ट
    responsibilities:
      - आपातकालीन देखभाल या सामुदायिक सेवाओं जैसे किसी प्रमुख सेवा क्षेत्र के लिए वर्तमान और लक्षित बिज़नेस आर्किटेक्चर विकसित करना।
      - रणनीति और नीति को क्षमता परिवर्तनों और परिवर्तन के रोडमैप में बदलना।
      - जाँचना कि कार्यक्रम और परियोजना का दायरा लक्षित बिज़नेस आर्किटेक्चर में बैठता है।
      - क्लिनिकल प्रमुखों के साथ आकलन करना कि प्रस्तावित परिवर्तन देखभाल मार्गों, सुरक्षा और कर्मचारियों के कार्यभार को कैसे प्रभावित करते हैं।
      - विधियों और उपकरणों में अन्य बिज़नेस आर्किटेक्टों का मार्गदर्शन करना।
    qualifications:
      - बिज़नेस आर्किटेक्चर, बिज़नेस विश्लेषण या सेवा डिज़ाइन का पर्याप्त अनुभव, मास्टर डिग्री के समकक्ष स्तर पर।
    job_evaluation_notes: "UK GDaD PCF ग्रेड सुझाव (बैंड 7) से ऊँचे बैंड पर: स्वास्थ्य क्षेत्र के विज्ञापन इस भूमिका को बैंड 8a पर रखते हैं। योजना, नीति और कार्य करने की स्वतंत्रता का अंक बैंड 7 प्रोफ़ाइल से ऊपर है क्योंकि यह पद किसी प्रमुख सेवा क्षेत्र के लिए रणनीति को परिवर्तन के रोडमैप में बदलता है।"
  - title: लीड बिज़नेस आर्किटेक्ट
    responsibilities:
      - बिज़नेस आर्किटेक्चर अभ्यास का नेतृत्व करना और उसके परिणामों के लिए जवाबदेह होना।
      - क्षमताओं, सेवाओं और देखभाल मार्गों का संगठन-व्यापी दृश्य बनाए रखना और उसे समझने में आसान रखना।
      - परिवर्तन की प्राथमिकताओं और निवेश पोर्टफ़ोलियो के रणनीति में बैठने के बारे में निदेशकों को सलाह देना।
      - देखभाल मार्गों में साझा क्षमताओं और ज़िम्मेदारियों पर सहमति के लिए साझेदार संगठनों के साथ काम करना।
      - बिज़नेस आर्किटेक्टों का नेतृत्व और विकास करना।
    qualifications:
      - किसी जटिल संगठन में बिज़नेस आर्किटेक्चर का नेतृत्व करने का व्यापक अनुभव।
