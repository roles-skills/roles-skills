summary: >
  घटना प्रबंधक कुछ ग़लत होने पर जल्द से जल्द सामान्य सेवा बहाल करते हैं, और उपयोगकर्ताओं पर प्रभाव को यथासंभव कम रखते हैं। वे तकनीकी टीमों और आपूर्तिकर्ताओं का समन्वय करते हैं, उपयोगकर्ताओं और प्रमुखों को सूचित रखते हैं, और सुनिश्चित करते हैं कि घटनाएँ दर्ज हों और समस्या प्रबंधन को सौंपी जाएँ। स्वास्थ्य सेवा में घटनाएँ सीधे रोगी देखभाल को प्रभावित कर सकती हैं, इसलिए घटना प्रबंधक क्लिनिकल और परिचालन प्रमुखों के साथ निकटता से काम करते हैं।
health_context:
  - किसी क्लिनिकल प्रणाली का बंद होना उपचार में देरी कर सकता है, इसलिए घटनाओं को क्लिनिकल प्रभाव के आधार पर प्राथमिकता दी जाती है, और क्लिनिकल प्रमुखों को डाउनटाइम प्रक्रियाएँ शुरू करनी पड़ सकती हैं।
  - बड़ी घटनाएँ किसी भी समय हो सकती हैं, इसलिए घटना प्रबंधक ऑन-कॉल रोटा में भाग लेते हैं और उन्हें रात या सप्ताहांत में बुलाया जा सकता है।
  - रैनसमवेयर जैसा साइबर हमला पूरे संगठन को प्रभावित करने वाली और दिनों या हफ़्तों तक चलने वाली बड़ी घटना बन सकता है।
  - बड़ी आईटी घटनाओं को संगठन की आपात तैयारी और व्यावसायिक निरंतरता व्यवस्थाओं से जोड़ना पड़ सकता है।
  - जिन घटनाओं से रोगियों को नुकसान हुआ हो सकता है, उनकी रिपोर्ट क्लिनिकल घटना प्रक्रिया से भी की जाती है और क्लिनिकल सुरक्षा के साथ उनकी समीक्षा होती है।
levels:
  - title: घटना प्रबंधक
    responsibilities:
      - पहली रिपोर्ट से सेवा बहाली तक, क्लिनिकल और कॉर्पोरेट सेवाओं को प्रभावित करने वाली घटनाओं की प्रतिक्रिया का समन्वय करना।
      - हर घटना के क्लिनिकल और परिचालन प्रभाव का आकलन करना और उसकी प्राथमिकता तय करना।
      - प्रभावित उपयोगकर्ताओं, सर्विस डेस्क और क्लिनिकल प्रमुखों को स्पष्ट, समय पर अद्यतन देकर सूचित रखना।
      - सहमत मानदंड पूरे होने पर घटनाओं को बड़ी घटना प्रबंधक तक आगे बढ़ाना।
      - सुनिश्चित करना कि घटनाएँ सटीकता से दर्ज हों और समस्या प्रबंधन को सौंपी जाएँ।
      - कार्य-घंटों के बाहर की घटनाओं के लिए ऑन-कॉल रोटा में भाग लेना।
    qualifications:
      - घटनाएँ संभालने सहित आईटी सहायता या संचालन का अनुभव।
      - आईटी सेवा प्रबंधन फ़ाउंडेशन योग्यता, या समकक्ष अनुभव।
    job_evaluation_notes: मानसिक प्रयास ऑन-कॉल सहित समय के दबाव में बार-बार लंबे समय तक ध्यान लगाने को दर्शाता है। भावनात्मक प्रयास रोगियों और कर्मचारियों पर सेवा बाधाओं के प्रभाव से बार-बार के अप्रत्यक्ष संपर्क को दर्शाता है।
  - title: बड़ी घटना प्रबंधक
    responsibilities:
      - इलेक्ट्रॉनिक रोगी अभिलेख बंद होने, नेटवर्क विफलताओं और साइबर हमलों जैसी बड़ी घटनाओं की प्रतिक्रिया का नेतृत्व करना।
      - तकनीकी टीमों, आपूर्तिकर्ताओं, क्लिनिकल प्रमुखों और संचार कर्मचारियों को साथ लाने वाली घटना कॉल चलाना।
      - डाउनटाइम और व्यावसायिक निरंतरता प्रक्रियाएँ कब शुरू और बंद करनी हैं, इस पर क्लिनिकल और परिचालन प्रमुखों को सलाह देना।
      - वरिष्ठ प्रमुखों को ब्रीफ़ करना और, आवश्यकता होने पर, संगठन की आपात प्रतिक्रिया व्यवस्थाओं से जोड़ना।
      - घटना-पश्चात समीक्षाओं का नेतृत्व करना और सुनिश्चित करना कि सीख ली जाए और उस पर कार्रवाई हो।
      - व्यावसायिक निरंतरता और आपात योजना प्रमुखों के साथ बड़ी घटना योजनाएँ विकसित करना और परखना।
    qualifications:
      - जटिल, उच्च-उपलब्धता सेवाओं में घटनाओं के प्रबंधन का पर्याप्त अनुभव।
      - आईटी सेवा प्रबंधन उन्नत योग्यता, या समकक्ष अनुभव।
    job_evaluation_notes: मानसिक प्रयास बड़ी घटनाओं के दौरान, अक्सर कार्य-घंटों के बाहर, बार-बार लंबे समय तक ध्यान लगाने को दर्शाता है। भावनात्मक प्रयास रोगी देखभाल पर बड़ी सेवा बाधाओं के प्रभाव से बार-बार के अप्रत्यक्ष संपर्क को दर्शाता है।
