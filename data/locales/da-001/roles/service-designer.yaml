summary: Servicedesignere designer sundheds- og plejeservices fra ende til anden, fra det øjeblik nogen første gang har brug for hjælp, til plejen slutter, på tværs af digitale kanaler, telefon, papir og personligt fremmøde. De arbejder sammen med patienter, pårørende, klinikere og plejepersonale om at kortlægge, hvordan services rent faktisk fungerer, finde ud af, hvor de svigter mennesker, og designe services, der er sikre, enkle og retfærdige, og som fungerer på tværs af organisatoriske grænser.
health_context:
- Patientforløb krydser mange organisationer og fag, så servicedesignere kortlægger hele forløb, herunder overdragelser, ventetider og det arbejde, patienter og pårørende gør for at holde plejen sammen.
- Ændringer i, hvordan en service fungerer, kan skabe nye kliniske risici, så servicedesignere arbejder sammen med kliniske sikkerhedsansvarlige om at identificere farer i nye servicemodeller, før de tages i brug.
- Digitale services må ikke udelukke mennesker, der ikke kan eller ikke vil bruge dem, så servicedesignere designer assisterede veje og ikkedigitale veje ved siden af de digitale.
- Klinisk personale og driftspersonale er en del af servicen, så design skal passe til deres arbejdsgange, arbejdsbyrde og faglige ansvar og ikke kun til patientens forløb.
levels:
- title: Associeret servicedesigner
  responsibilities:
  - Lære metoder til servicedesign gennem oplæring og ved at arbejde sammen med erfarne designere.
  - Hjælpe med at kortlægge brugerforløb og serviceplantegninger ud fra forskning med patienter og medarbejdere.
  - Hjælpe med at forberede og gennemføre co-design-workshops efter procedurerne for samtykke og informationsstyring.
  - Dokumentere designbeslutninger og holde designartefakter ajour.
  qualifications:
  - I gang med en uddannelse eller lærlingeuddannelse i design eller et beslægtet felt, eller tilsvarende erfaring.
- title: Junior servicedesigner
  responsibilities:
  - Kortlægge nuværende forløb og serviceplantegninger for dele af et patientforløb, såsom booking eller opfølgning.
  - Designe og teste forbedringer af dele af en service med vejledning fra en mere senior designer.
  - Gennemføre co-design-sessioner med patienter, pårørende og medarbejdere og tilpasse dem, så alle kan deltage.
  - Identificere, hvor en service skaber ekstra arbejde eller risiko for patienter eller medarbejdere, og gøre teamet opmærksom på det.
  qualifications:
  - En bacheloruddannelse i design eller et beslægtet fag eller tilsvarende erfaring.
- title: Servicedesigner
  responsibilities:
  - Designe services fra ende til anden på tværs af kanaler, herunder assisterede og ikkedigitale veje for mennesker, der har brug for dem.
  - Kortlægge patientforløb på tværs af organisationer og designe bedre overdragelser mellem teams og services.
  - Designe, hvordan servicen fungerer for medarbejderne, herunder roller, arbejdsbyrde og arbejdsgange, sammen med driftsledere.
  - Arbejde sammen med kliniske sikkerhedsansvarlige om at identificere farer i nye servicemodeller og designe kontroller.
  - Lave prototyper af og teste serviceændringer med patienter, pårørende og medarbejdere.
  qualifications:
  - En bacheloruddannelse i design eller et beslægtet fag eller tilsvarende erfaring.
  - Erfaring med at designe services sammen med brugere.
- title: Senior servicedesigner
  responsibilities:
  - Lede designet af komplekse services, der spænder over flere plejemiljøer eller organisationer.
  - Forme servicevisionen sammen med ledere inden for klinik, drift og digitalt.
  - Designe nye servicemodeller, der forbedrer sikkerhed, adgang og lighed, og teste dem med rigtige brugere.
  - Sikre, at serviceændringer vurderes for klinisk risiko, ligestilling og konsekvenser for informationsstyring.
  - Være mentor for designere og forankre servicedesignpraksis i teams.
  qualifications:
  - Betydelig erfaring med servicedesign på et niveau svarende til en kandidatgrad.
- title: Ledende servicedesigner
  responsibilities:
  - Fastsætte designretning for flere services eller et helt patientforløb og sikre kvaliteten af design på tværs af teams.
  - Arbejde sammen med seniorledere inden for klinik og drift om at redesigne, hvordan pleje organiseres og leveres.
  - Sikre, at design fungerer for dem, der er mest berørt af uligheder i sundhed, og for medarbejdere under pres.
  - Fastsætte standarder for, hvordan teams designer for klinisk sikkerhed og for assisterede veje.
  - Have personaleansvar for og udvikle servicedesignere.
  qualifications:
  - Omfattende erfaring med at lede servicedesign på tværs af teams.
  job_evaluation_notes: Der er intet niveau i lønramme 8a, fordi UK GDaD PCF placerer den ledende servicedesigner i G7 eller G6, og denne reference følger den foreslåede lønramme 8b. Politik er niveau 5, fordi den ledende designer former, hvordan en række services på tværs af en direktion fungerer.
- title: Chef for servicedesign
  responsibilities:
  - Lede faget servicedesign og fastlægge dets strategi, standarder og arbejdsmåder.
  - Påvirke organisationens strategi, så services designes omkring behovene hos patienter, pårørende og medarbejdere.
  - Opbygge kompetencer inden for servicedesign, herunder rekruttering, karriereveje og oplæring.
  - Skabe betingelserne for godt design, såsom adgang til brugere, tid til forskning og design i styringen.
  - Arbejde sammen med kolleger i hele sundheds- og plejesystemet om at designe sammenhængende services.
  qualifications:
  - Omfattende erfaring med at lede design og en designpraksis.
