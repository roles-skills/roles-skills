summary: Kommunikationsmedarbejdere hjælper organisationen med at forklare, hvad den gør, over for medarbejdere, patienter, offentligheden, partnere og medierne. De skriver og udgiver indhold, driver intern kommunikation og kampagner, styrer digitale kanaler og sociale medier, håndterer henvendelser fra medierne og beskytter organisationens omdømme, især under hændelser og udfald.
health_context:
- Kommunikation om sundhedsydelser skal være korrekt, klar og tilgængelig, fordi patienter kan handle på den.
- Kampagner sigter ofte mod at ændre adfærd, såsom at opmuntre patienter og plejepersonale til at bruge en ny digital service.
- Serviceudfald, cyberhændelser og brud på datasikkerheden kræver hurtig og omhyggelig kommunikation med patienter, medarbejdere, partnere og medierne.
- Historier om patienter kræver samtykke og skal beskytte fortroligheden.
levels:
- title: Kommunikationsmedarbejder
  summary: Skriver og udgiver indhold til interne og eksterne kanaler og støtter kommunikationsteamet i rutinemæssigt mediearbejde og kampagnearbejde.
  responsibilities:
  - Skrive og redigere nyheder, intranetindhold, nyhedsbreve og opslag på sociale medier.
  - Udgive godkendt indhold på webstedet, intranettet og sociale medier.
  - Registrere henvendelser fra medierne og overvåge dækningen.
  - Støtte kampagner og arrangementer med indhold og logistik.
  - Kontrollere indhold for korrekthed, tilgængelighed og almindeligt sprog.
  qualifications:
  - Erfaring med at skrive til forskellige målgrupper eller en uddannelse i kommunikation eller et beslægtet fag, eller tilsvarende erfaring.
- title: Senior kommunikationsmedarbejder
  summary: Planlægger og gennemfører kommunikation for projekter og services, håndterer rutinehenvendelser fra medierne og styrer kanaler.
  responsibilities:
  - Planlægge og gennemføre kommunikation for projekter og serviceændringer.
  - Besvare rutinehenvendelser fra medierne og udarbejde udkast til pressemeddelelser og udtalelser.
  - Styre indholdsplaner for digitale kanaler og sociale medier og rapportere om præstationen.
  - Skrive cases, herunder patienthistorier, med samtykke.
  - Rådgive kolleger om at skrive klart til patienter og offentligheden.
  - Coache kommunikationsmedarbejdere.
  qualifications:
  - En bacheloruddannelse eller uddannelse i kommunikation eller et beslægtet fag, eller tilsvarende erfaring.
- title: Kommunikationsleder
  summary: Leder kommunikationen for et større program eller område, såsom intern kommunikation eller digitale kanaler, og håndterer følsomt mediearbejde.
  responsibilities:
  - Lede kommunikation og inddragelse for et større program, såsom et nyt klinisk system.
  - Planlægge og evaluere kampagner, der opmuntrer patienter og medarbejdere til at tage digitale services i brug.
  - Håndtere følsomme henvendelser fra medierne og forberede talspersoner.
  - Planlægge kommunikation i forbindelse med hændelser og serviceudfald sammen med driftsteams.
  - Rådgive ledere om, hvordan forandring og vanskelige budskaber kommunikeres.
  - Føre tilsyn med kommunikationsmedarbejdere.
  qualifications:
  - En bacheloruddannelse eller en faglig uddannelse i kommunikation, eller tilsvarende erfaring.
  - Erfaring med at planlægge og evaluere kampagner.
- title: Kommunikationschef
  summary: Styrer kommunikationsteamets arbejde og kanaler og leder mediehåndtering og kommunikation i forbindelse med hændelser.
  responsibilities:
  - Styre kommunikationsteamet, dets arbejdsplan og dets budget.
  - Lede reaktivt og proaktivt mediearbejde, også under hændelser og brud på datasikkerheden.
  - Styre organisationens kanaler, brand og standarder for indhold.
  - Rådgive direktører om kommunikations- og omdømmerisici.
  - Evaluere kommunikation og rapportere om dens virkning.
  - Samarbejde med partnerorganisationer om fælles kommunikation.
  qualifications:
  - En faglig uddannelse i kommunikation eller tilsvarende erfaring.
  - Betydelig erfaring med mediekontakt og ledelse af kommunikation.
  job_evaluation_notes: Følelsesmæssig belastning afspejler lejlighedsvis håndtering af belastende materiale under hændelser og i patienthistorier.
- title: Kommunikationsdirektør
  summary: Leder organisationens kommunikation og inddragelse, fastlægger dens strategi og rådgiver bestyrelsen om omdømme.
  responsibilities:
  - Fastlægge organisationens strategi for kommunikation og inddragelse.
  - Lede og udvikle kommunikationsfunktionen og styre dens budget.
  - Rådgive administrerende direktør og bestyrelse om omdømme, inddragelse af interessenter og kommunikationsrisiko.
  - Lede krisekommunikation under større hændelser.
  - Opbygge relationer til seniorpartnere, journalister og patientgrupper.
  - Forme, hvordan organisationen forklarer sine digitale services og sin brug af data for offentligheden.
  qualifications:
  - En faglig uddannelse i kommunikation eller tilsvarende erfaring.
  - Omfattende erfaring med at lede kommunikation i en kompleks organisation.
