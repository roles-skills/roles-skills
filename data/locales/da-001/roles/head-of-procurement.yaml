summary: Indkøbschefen og det kommercielle ledelsesteam leder, hvordan organisationen køber varer og tjenesteydelser og styrer sine leverandører. De fastlægger indkøbspolitik og kommerciel strategi, sikrer at udgifter er lovlige og giver valuta for pengene og rådgiver bestyrelsen om kommerciel risiko. I en digital sundheds- og plejeorganisation har de særlig opmærksomhed på kontrakter om teknologi og kliniske systemer, leverandørers robusthed og exit.
health_context:
- Store kontrakter om teknologi og kliniske systemer kan forme services i et årti, så kommercielle ledere planlægger for interoperabilitet, portabilitet og fremtidig konkurrence fra starten.
- Kritiske leverandører understøtter services, der kører døgnet rundt, så leverandørsvigt og cyberhændelser i forsyningskæden er risici på bestyrelsesniveau.
- Udbudsreglerne gælder, og organisationen skal kunne forsvare sine udbudsbeslutninger, hvis de anfægtes.
- Organisationen forventes at skabe social værdi og CO2-reduktion gennem sine udgifter.
- Kommercielle ledere samarbejder ofte med andre sundheds- og plejeorganisationer om fælles indkøb og fælles kontrakter.
levels:
- title: Indkøbschef
  summary: Leder indkøbsfunktionen, fastsætter udbudsprocedurer og standarder og styrer indkøbs- og anskaffelsesteamene.
  responsibilities:
  - Lede og styre indkøbs- og anskaffelsesteamene.
  - Fastlægge organisationens udbudsprocedurer, skabeloner og tærskelværdier i overensstemmelse med udbudsreglerne og de økonomiske regler.
  - Kvalitetssikre de mest komplekse udbud af høj værdi og deres tildelingsbeslutninger.
  - Styre pipelinen af udbud og sikre, at udbud startes i god tid.
  - Rapportere overholdelse af udbudsreglerne, besparelser og social værdi til revisionsudvalget.
  - Have indkøbsteamets budget og udvikle teamets kompetencer.
  qualifications:
  - En anerkendt faglig indkøbsuddannelse på højeste niveau eller en kandidatgrad i et beslægtet fag eller tilsvarende erfaring.
  - Omfattende erfaring med at lede indkøb efter udbudsreglerne.
  job_evaluation_notes: Stillingsopslag i sundhedssektoren placerer denne rolle i lønramme 8c. Politik er niveau 5, fordi jobbet fastlægger udbudsprocedurer for hele organisationen, og handlefrihed er niveau 6, fordi det fortolker udbudsregler og strategi for at fastsætte organisationens standarder. Økonomiske ressourcer er niveau 5, fordi det kontrollerer, hvordan udgifter købes på tværs af mange services; kommunikation er niveau 6 for omstridte tildelingsbeslutninger og klager.
- title: Kommerciel chef
  summary: Leder indkøb, kategoristyring og kontraktstyring sammen som én kommerciel funktion og fastlægger den kommercielle strategi.
  responsibilities:
  - Lede den kommercielle funktion, herunder indkøb, kategoristyring og kontraktstyring.
  - Fastlægge den kommercielle strategi, herunder tilgangen til teknologi- og cloudkontrakter og indlåsning.
  - Lede forhandlinger med strategiske leverandører, såsom leverandører af kliniske systemer og cloud.
  - Lede indsatsen ved leverandørsvigt og alvorlige kontrakttvister.
  - Rådgive direktører om kommerciel risiko, valuta for pengene og det kommercielle grundlag for større investeringer.
  - Lede fælles kommercielt arbejde med andre sundheds- og plejeorganisationer.
  qualifications:
  - En anerkendt faglig indkøbsuddannelse på højeste niveau eller en kandidatgrad i et beslægtet fag eller tilsvarende erfaring.
  - Omfattende erfaring med at lede kommercielle funktioner.
  job_evaluation_notes: Stillingsopslag i sundhedssektoren placerer denne rolle i lønramme 8d. Viden er niveau 8 for viden på tværs af indkøb, kategoristyring, kontraktstyring og kommerciel ret, og handlefrihed er niveau 6, fordi jobbet fastlægger den kommercielle strategi. Kommunikation er niveau 6 for forhandling af meget omstridte kommercielle sager med strategiske leverandører.
- title: Direktør for indkøb og kommercielt
  summary: Er organisationens øverste kommercielle leder, ansvarlig for indkøbspolitik og kommerciel politik, og rådgiver bestyrelsen om kommerciel strategi og risiko.
  responsibilities:
  - Fastlægge organisationens indkøbspolitik og kommercielle politik og strategi, godkendt af bestyrelsen.
  - Rådgive bestyrelsen og direktionen om kommerciel strategi, risiko og de største kontrakter og investeringer.
  - Sikre organisationens overholdelse af udbudsreglerne og dens beredskab til at forsvare klager.
  - Lede direktionsrelationerne til strategiske leverandører og indkøbsorganisationer i den offentlige sektor.
  - Fastsætte mål for social værdi og bæredygtige indkøb og rapportere resultater til bestyrelsen.
  - Lede og udvikle det kommercielle ledelsesteam og organisationens kommercielle kompetencer.
  - Være ansvarlig for organisationens kommercielle forpligtelser og kontraktportefølje på tværs af alle services.
  qualifications:
  - En anerkendt faglig indkøbsuddannelse på højeste niveau eller en kandidatgrad i et beslægtet fag eller tilsvarende erfaring.
  - Omfattende erfaring med at lede kommercielle funktioner på direktionsniveau.
  job_evaluation_notes: Stillingsopslag i sundhedssektoren placerer denne rolle i lønramme 9. Politik er niveau 6 for overordnet ansvar for indkøbspolitik og kommerciel politik, økonomiske ressourcer er niveau 6 for overordnet ansvar for organisationens kommercielle forpligtelser, og handlefrihed er niveau 6, fordi jobbet fastsætter kommercielle mål og standarder. Følelsesmæssig belastning er niveau 2 for lejlighedsvis udsættelse for stressende tvister, leverandørsvigt og klager.
