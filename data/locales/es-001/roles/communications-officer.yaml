summary: >
  El personal de comunicación ayuda a la organización a explicar lo que hace al personal, a los pacientes, al público, a los socios y a los medios de comunicación. Redacta y publica contenidos, gestiona la comunicación interna y las campañas, gestiona los canales digitales y las redes sociales, atiende las consultas de los medios y protege la reputación de la organización, sobre todo durante los incidentes y las interrupciones del servicio.
health_context:
  - La comunicación sobre los servicios sanitarios debe ser exacta, clara y accesible, porque los pacientes pueden actuar en consecuencia.
  - Las campañas suelen buscar cambiar comportamientos, como animar a los pacientes y al personal asistencial a usar un nuevo servicio digital.
  - Las interrupciones del servicio, los ciberincidentes y las brechas de datos requieren una comunicación rápida y cuidadosa con los pacientes, el personal, los socios y los medios.
  - Las historias sobre pacientes requieren su consentimiento y deben proteger la confidencialidad.
levels:
  - title: Técnico de comunicación
    summary: Redacta y publica contenidos para los canales internos y externos y apoya al equipo de comunicación en el trabajo habitual con los medios y en las campañas.
    responsibilities:
      - Redactar y editar noticias, contenidos de la intranet, boletines y publicaciones en redes sociales.
      - Publicar contenidos aprobados en el sitio web, la intranet y las redes sociales.
      - Registrar las consultas de los medios y seguir la cobertura en los medios.
      - Apoyar las campañas y los eventos con contenidos y logística.
      - Comprobar la exactitud, la accesibilidad y el lenguaje claro de los contenidos.
    qualifications:
      - Experiencia en redacción para distintos públicos, o una cualificación en comunicación o una materia afín, o experiencia equivalente.
  - title: Técnico de comunicación sénior
    summary: Planifica y ejecuta la comunicación de proyectos y servicios, atiende las consultas habituales de los medios y gestiona los canales.
    responsibilities:
      - Planificar y ejecutar la comunicación de los proyectos y de los cambios en los servicios.
      - Responder a las consultas habituales de los medios y redactar notas de prensa y declaraciones.
      - Gestionar los planes de contenidos de los canales digitales y las redes sociales, e informar de su rendimiento.
      - Redactar casos de estudio, incluidas historias de pacientes, con su consentimiento.
      - Asesorar a los colegas sobre cómo escribir con claridad para los pacientes y el público.
      - Orientar a los técnicos de comunicación.
    qualifications:
      - Un grado o una cualificación en comunicación o una materia afín, o experiencia equivalente.
  - title: Líder de comunicación
    summary: Dirige la comunicación de un programa o de un área importante, como la comunicación interna o los canales digitales, y atiende el trabajo delicado con los medios.
    responsibilities:
      - Dirigir la comunicación y la participación de un gran programa, como un nuevo sistema clínico.
      - Planificar y evaluar campañas que animen a los pacientes y al personal a adoptar los servicios digitales.
      - Atender las consultas delicadas de los medios y preparar a los portavoces.
      - Planificar con los equipos operativos la comunicación de los incidentes y las interrupciones del servicio.
      - Asesorar a los directivos sobre cómo comunicar los cambios y los mensajes difíciles.
      - Supervisar a los técnicos de comunicación.
    qualifications:
      - Un grado o una cualificación profesional en comunicación, o experiencia equivalente.
      - Experiencia en la planificación y la evaluación de campañas.
  - title: Gestor de comunicación
    summary: Gestiona el trabajo y los canales del equipo de comunicación, y dirige la relación con los medios y la comunicación de los incidentes.
    responsibilities:
      - Gestionar el equipo de comunicación, su plan de trabajo y su presupuesto.
      - Dirigir el trabajo reactivo y proactivo con los medios, también durante los incidentes y las brechas de datos.
      - Gestionar los canales, la marca y las normas de contenidos de la organización.
      - Asesorar a los directores sobre los riesgos de comunicación y reputacionales.
      - Evaluar la comunicación e informar de su impacto.
      - Trabajar con las organizaciones socias en la comunicación conjunta.
    qualifications:
      - Una cualificación profesional en comunicación, o experiencia equivalente.
      - Experiencia sustancial en relaciones con los medios y en gestión de la comunicación.
    job_evaluation_notes: El esfuerzo emocional refleja el trato ocasional con material angustioso durante los incidentes y en las historias de pacientes.
  - title: Responsable de comunicación
    summary: Dirige la comunicación y la participación de la organización, fija su estrategia y asesora al consejo sobre la reputación.
    responsibilities:
      - Fijar la estrategia de comunicación y participación de la organización.
      - Dirigir y desarrollar la función de comunicación y gestionar su presupuesto.
      - Asesorar al director general y al consejo sobre la reputación, la relación con las partes interesadas y el riesgo de comunicación.
      - Dirigir la comunicación de crisis durante los incidentes graves.
      - Establecer relaciones con socios de alto nivel, periodistas y asociaciones de pacientes.
      - Dar forma a cómo explica la organización al público sus servicios digitales y su uso de los datos.
    qualifications:
      - Una cualificación profesional en comunicación, o experiencia equivalente.
      - Amplia experiencia en la dirección de la comunicación de una organización compleja.
