id: business-architect
summary: >
  Business architects build a clear, joined-up view of how the organisation
  delivers health and care: its capabilities, services, care pathways,
  processes, and information. They use that view to show where change is
  needed, to connect strategy with programmes, and to make sure digital change
  improves care for patients and the working lives of clinicians and care
  staff.
health_context:
  - Care pathways cross teams, settings, and organisations, so business architects model services from the patient's point of view, not only by department.
  - Change in clinical processes can affect patient safety and staff workload, so models are built with clinicians and care staff and checked against real practice.
  - Health and care strategy is shaped by policy, regulation, and funding rules, which architects must translate into practical capability changes.
  - Many capabilities are shared with partner organisations, so architects help agree who does what and where information must flow.
levels:
  - pcf_level: Trainee business architect
    title: Trainee business architect
    band: "5"
    responsibilities:
      - Learn business architecture methods, such as capability, value stream, and process modelling, through training and practice.
      - Gather information about services and care pathways through interviews, documents, and observation.
      - Draft capability maps and process models with guidance from business architects.
      - Help run workshops with clinicians, care staff, and managers, and write up the outputs.
    skills:
      - {skill: health-care-context, level: working}
      - {skill: clinical-safety, level: awareness}
      - {skill: equality-diversity-inclusion, level: awareness}
    qualifications:
      - A degree or equivalent experience in business, analysis, or a related subject.
    job_evaluation: {communication: 4, knowledge: 5, analytical: 4, planning: 2, physical-skills: 2, patient-care: 1, policy: 2, financial-resources: 1, people: 1, information-resources: 4, research: 2, freedom-to-act: 3, physical-effort: 1, mental-effort: 3, emotional-effort: 1, working-conditions: 2}

  - pcf_level: Associate business architect
    title: Associate business architect
    band: "6"
    responsibilities:
      - Model capabilities, services, and care pathways for a part of the organisation.
      - Analyse models to find gaps, duplication, and pain points for patients and staff.
      - Bring together information from different teams and organisations to inform decisions on change.
      - Explain complex service problems to stakeholders using clear models and plain language.
      - Keep the business architecture repository accurate and linked to application and data models.
    skills:
      - {skill: health-care-context, level: practitioner}
      - {skill: clinical-safety, level: awareness}
      - {skill: information-governance, level: awareness}
      - {skill: equality-diversity-inclusion, level: working}
    qualifications:
      - A degree or equivalent experience in business, analysis, or a related subject.
      - Experience of business analysis or service design.
    job_evaluation: {communication: 4, knowledge: 6, analytical: 4, planning: 3, physical-skills: 2, patient-care: 1, policy: 3, financial-resources: 1, people: 2, information-resources: 5, research: 2, freedom-to-act: 4, physical-effort: 1, mental-effort: 3, emotional-effort: 1, working-conditions: 2}

  - pcf_level: Business architect
    title: Business architect
    band: "7"
    responsibilities:
      - Develop current and target business architectures for a major service area, such as urgent care or community services.
      - Translate strategy and policy into capability changes and a roadmap of change.
      - Check that programme and project scope fits the target business architecture.
      - Work with clinical leads to assess how proposed changes affect care pathways, safety, and staff workload.
      - Guide other business architects in methods and tools.
    skills:
      - {skill: health-care-context, level: practitioner}
      - {skill: clinical-safety, level: working}
      - {skill: information-governance, level: working}
      - {skill: equality-diversity-inclusion, level: working}
      - {skill: risk-management, level: working}
    qualifications:
      - Substantial experience of business architecture, business analysis, or service design, at a level equivalent to a master's degree.
    job_evaluation: {communication: 5, knowledge: 7, analytical: 5, planning: 3, physical-skills: 2, patient-care: 1, policy: 3, financial-resources: 1, people: 2, information-resources: 5, research: 2, freedom-to-act: 4, physical-effort: 1, mental-effort: 4, emotional-effort: 1, working-conditions: 2}

  - pcf_level: Lead business architect
    title: Lead business architect
    band: 8b
    responsibilities:
      - Lead the business architecture practice and be accountable for its outputs.
      - Maintain the organisation-wide view of capabilities, services, and care pathways, and keep it easy to understand.
      - Advise directors on the priorities for change and how investment portfolios fit strategy.
      - Work with partner organisations to agree shared capabilities and responsibilities across care pathways.
      - Lead and develop business architects.
    skills:
      - {skill: health-care-context, level: expert}
      - {skill: clinical-safety, level: working}
      - {skill: information-governance, level: working}
      - {skill: equality-diversity-inclusion, level: practitioner}
      - {skill: risk-management, level: practitioner}
      - {skill: people-management, level: practitioner}
    qualifications:
      - Extensive experience of leading business architecture in a complex organisation.
    job_evaluation: {communication: 5, knowledge: 8, analytical: 5, planning: 4, physical-skills: 2, patient-care: 1, policy: 4, financial-resources: 3, people: 3, information-resources: 5, research: 3, freedom-to-act: 5, physical-effort: 1, mental-effort: 4, emotional-effort: 1, working-conditions: 2}
