# Legal skills original to this reference, for legal roles in a digital
# health care organisation.
#
# Each skill has four proficiency levels, matching the UK GDaD PCF scale:
# awareness (1), working (2), practitioner (3), expert (4).
# esco lists the closest ESCO v1.2.1 skills, with the strength of the match:
# exact, close, broad (ESCO skill is wider), or narrow (ESCO skill is narrower).

skills:
  - id: legal-legal-research
    name: Legal research
    description: Finding, reading, and summarising legislation, case law, guidance, and precedents to answer a legal question.
    esco:
      - {uri: http://data.europa.eu/esco/skill/a8585efe-4011-47b2-9aed-cd01bd3652c0, label: legal research, match: exact}
      - {uri: http://data.europa.eu/esco/skill/5b71cb01-0f37-47e0-a617-abcf08c8aa64, label: interpret law, match: broad}
    levels:
      awareness: |
        You can:
        - find legislation, guidance, and precedent documents using legal databases and the organisation's know-how
        - use legal terms correctly
      working: |
        You can:
        - research a defined legal question and summarise the sources clearly
        - check that sources are current and authoritative
        - keep precedent and know-how libraries up to date
      practitioner: |
        You can:
        - research complex or novel questions, such as how existing law applies to new technology
        - analyse conflicting sources and reach a reasoned view
        - track changes in law and guidance and explain their effect on the organisation
      expert: |
        You can:
        - lead research on the most complex and high-risk questions for the organisation
        - anticipate legal developments and prepare the organisation for them
        - contribute to consultations on law and guidance that affect digital health and care

  - id: legal-contract-drafting-and-review
    name: Contract drafting and review
    description: Drafting, reviewing, and negotiating contracts and agreements, such as technology, software licence, cloud, services, and data processing agreements.
    esco:
      - {uri: http://data.europa.eu/esco/skill/5c606d18-6404-4047-b235-350f18e11827, label: contract law, match: broad}
      - {uri: http://data.europa.eu/esco/skill/82ae17ef-a422-4803-923e-d62da42476a9, label: revise legal documents, match: close}
      - {uri: http://data.europa.eu/esco/skill/92721092-fe7c-4689-96bd-4f02385bc0e7, label: manage contracts, match: broad}
      - {uri: http://data.europa.eu/esco/skill/d63c2bad-817d-4116-b4d8-b927cb01212d, label: commercial law, match: broad}
    levels:
      awareness: |
        You can:
        - explain the main parts of a contract, such as parties, term, payment, liability, and termination
        - prepare standard documents from approved templates
      working: |
        You can:
        - review routine agreements, such as non-disclosure and simple services agreements, against the organisation's standards
        - mark up contracts and explain the changes
        - spot clauses that need a lawyer's review, such as unlimited liability or automatic renewal
      practitioner: |
        You can:
        - draft and negotiate complex agreements, such as software licences, cloud hosting, system integration, and data processing agreements
        - advise on risk allocation, including liability caps, service levels, exit, and escrow
        - make sure contracts protect patient data, service continuity, and the organisation's rights in its software and data
        - write and maintain contract templates and playbooks
      expert: |
        You can:
        - set the organisation's contracting standards and risk positions
        - lead negotiations on the most valuable or high-risk agreements
        - advise senior leaders on strategic commercial arrangements, such as partnerships and joint ventures

  - id: legal-legal-advice
    name: Legal advice
    description: Giving clear, practical, and accurate legal advice that helps colleagues make lawful decisions and manage legal risk.
    esco:
      - {uri: http://data.europa.eu/esco/skill/ea451251-71ab-4f89-8c0d-53344ef7004f, label: provide legal advice, match: exact}
      - {uri: http://data.europa.eu/esco/skill/9bb92e10-a5a9-437e-8101-8be2d7f631ff, label: advise on legal decisions, match: close}
      - {uri: http://data.europa.eu/esco/skill/eaece6b2-97f1-49df-b6b9-1691fb3bf797, label: analyse legal enforceability, match: narrow}
    levels:
      awareness: |
        You can:
        - explain when colleagues need legal advice and how to get it
        - take clear instructions and record the facts of a matter
      working: |
        You can:
        - prepare draft advice on routine matters for a lawyer to review
        - answer straightforward questions using approved guidance
        - identify the legal issues in a set of facts
      practitioner: |
        You can:
        - give independent legal advice in your areas of practice
        - explain legal risk in plain English and recommend practical options
        - advise on decisions with legal effect, such as contract awards, data sharing, and changes to services
        - decide when to instruct external lawyers or counsel
      expert: |
        You can:
        - advise the board and executive on the organisation's most significant legal risks
        - give definitive advice on novel, contentious, or high-value matters
        - set the organisation's appetite for legal risk
        - assure the quality of legal advice across the organisation, including external advice

  - id: legal-litigation-and-disputes
    name: Litigation and dispute resolution
    description: Preventing, managing, and resolving disputes and claims, including contract disputes, employment claims, and liaison on clinical negligence claims.
    esco:
      - {uri: http://data.europa.eu/esco/skill/66aad490-1c20-4e25-b189-634a218ee53e, label: legal case management, match: close}
      - {uri: http://data.europa.eu/esco/skill/f79e4715-5776-485c-ab7d-631c9b8d70ad, label: manage contract disputes, match: narrow}
      - {uri: http://data.europa.eu/esco/skill/23b97a3e-dfde-4627-9d97-114a9f3e4cd0, label: negotiate in legal cases, match: narrow}
      - {uri: http://data.europa.eu/esco/skill/db10b60e-efd2-4ba9-a873-d1e2ec37620f, label: court procedures, match: broad}
    levels:
      awareness: |
        You can:
        - explain the main stages of a claim or dispute
        - log claims and track deadlines accurately
      working: |
        You can:
        - collect and organise documents and evidence for a case
        - prepare chronologies, bundles, and witness statement drafts
        - liaise with external lawyers, insurers, or indemnity schemes on routine matters
      practitioner: |
        You can:
        - manage a caseload of disputes and claims from first notice to settlement or hearing
        - assess the merits and value of claims and recommend strategy
        - negotiate settlements and use alternative dispute resolution
        - make sure lessons from claims feed into safety, contract, and service improvements
      expert: |
        You can:
        - lead the organisation's most significant or high-profile disputes
        - set the organisation's approach to litigation, settlement, and reporting of claims
        - advise the board on contingent liabilities and reputational risk

  - id: legal-information-and-data-law
    name: Information and data law
    description: Applying data protection, confidentiality, freedom of information, and cyber security law to health and care data and digital services.
    esco:
      - {uri: http://data.europa.eu/esco/skill/33a82b83-c838-4889-ae62-fae1317481eb, label: protect personal data and privacy, match: close}
      - {uri: http://data.europa.eu/esco/skill/7814e88f-c133-4c3b-b27f-857afa145d42, label: ICT security legislation, match: narrow}
      - {uri: http://data.europa.eu/esco/skill/8d202e22-85e9-47b1-a1e0-3296d17244cd, label: observe confidentiality, match: narrow}
    levels:
      awareness: |
        You can:
        - explain the basic principles of data protection and confidentiality
        - recognise information requests and data breaches and route them correctly
      working: |
        You can:
        - review data sharing and data processing agreements against templates
        - support responses to information requests and data subject rights requests
        - explain the lawful bases for using health data in common situations
      practitioner: |
        You can:
        - advise on data protection, the duty of confidentiality, and information access law for digital services
        - draft and negotiate data sharing agreements and data processing terms, including international transfers
        - advise on data protection impact assessments for new technology, such as AI and analytics platforms
        - advise on data breaches, regulator enquiries, and complaints
      expert: |
        You can:
        - set the organisation's legal position on the use of health and care data
        - lead on high-risk or novel uses of data, such as research, data platforms, and AI
        - represent the organisation with regulators on information law

  - id: legal-legal-administration
    name: Legal administration
    description: Running the administrative processes of a legal team, including matter management, document control, records, deadlines, and invoicing.
    esco:
      - {uri: http://data.europa.eu/esco/skill/c68e4cc4-b842-4660-a84c-48f11c70f657, label: legal department processes, match: close}
      - {uri: http://data.europa.eu/esco/skill/1d7234e4-1c76-4d67-9487-71d8c529cdc9, label: compile legal documents, match: close}
      - {uri: http://data.europa.eu/esco/skill/b769f524-0f25-44d7-8538-5c46710a040e, label: manage digital documents, match: broad}
    levels:
      awareness: |
        You can:
        - open, update, and close matters in the matter management system
        - file and retrieve legal documents securely
        - keep legal and personal information confidential
      working: |
        You can:
        - manage diaries, deadlines, and key dates for a team
        - prepare and format legal documents, bundles, and signing packs
        - check and process external lawyers' invoices
        - manage contract and deed registers
      practitioner: |
        You can:
        - run the legal team's administration and improve its processes
        - report on workload, spending on external lawyers, and turnaround times
        - administer legal technology, such as matter management and e-signature tools
      expert: |
        You can:
        - design the legal operations model for the organisation
        - lead the choice and use of legal technology
        - set service standards and performance measures for legal services

  - id: legal-employment-law
    name: Employment law
    description: Applying employment law to the organisation's people policies, contracts, change programmes, and employment disputes.
    esco:
      - {uri: http://data.europa.eu/esco/skill/97b713f0-b9e8-4903-8dee-7e0b4019a1c0, label: employment law, match: exact}
      - {uri: http://data.europa.eu/esco/skill/08fe5910-8c4c-4679-a988-eb2ded3c4909, label: labour legislation, match: close}
    levels:
      awareness: |
        You can:
        - explain the main employment rights of staff
        - recognise employment issues that need legal advice
      working: |
        You can:
        - help prepare documents for employment claims and hearings
        - review employment contracts and policies against templates
      practitioner: |
        You can:
        - advise on employment matters, such as dismissal, discrimination, transfers of staff, and restructuring
        - manage employment claims and negotiate settlement agreements
        - advise on the use of contractors and the employment status of digital specialists
      expert: |
        You can:
        - advise the board on major workforce change and its legal risks
        - lead high-profile or complex employment disputes
        - shape people policies to meet legal duties and good practice

  - id: legal-intellectual-property
    name: Intellectual property
    description: Protecting and using intellectual property in software, data, content, and inventions, including copyright, licences, open source, and trade marks.
    esco:
      - {uri: http://data.europa.eu/esco/skill/2ad081e6-0a3f-4612-ac15-7ace75d39e26, label: intellectual property law, match: exact}
      - {uri: http://data.europa.eu/esco/skill/e2103a1d-4a84-47a9-b4f7-774787573449, label: copyright legislation, match: narrow}
    levels:
      awareness: |
        You can:
        - explain that software, data, and content are protected by intellectual property rights
        - recognise when a contract or project raises ownership questions
      working: |
        You can:
        - check intellectual property clauses in routine agreements
        - keep records of licences and registered rights
        - explain the main open source licence types and their conditions
      practitioner: |
        You can:
        - advise on who owns software, data, and content made by staff, suppliers, and partners
        - draft licences and intellectual property terms, including open source release of the organisation's code
        - advise on commercial use of the organisation's data and software, and on sharing benefits
      expert: |
        You can:
        - set the organisation's intellectual property and open source policy
        - lead on commercialisation and partnerships involving the organisation's data and software
        - resolve significant intellectual property disputes

  - id: legal-procurement-law
    name: Public procurement law
    description: Applying public procurement rules to buying goods, services, and technology, from choosing a route to market to contract award and challenge.
    esco:
      - {uri: http://data.europa.eu/esco/skill/9b862976-aa05-4bde-8ed6-8f39790edd0f, label: procurement legislation, match: close}
      - {uri: http://data.europa.eu/esco/skill/4600a787-39b0-4bf1-aa69-e586262342f0, label: state aid regulations, match: narrow}
      - {uri: http://data.europa.eu/esco/skill/ce5598ec-5ca4-4f3e-92a2-c55c90ce6038, label: competition law, match: broad}
    levels:
      awareness: |
        You can:
        - explain why public bodies must follow procurement rules
        - recognise when buying activity needs procurement or legal advice
      working: |
        You can:
        - check tender documents for consistency and completeness
        - support the record keeping needed to show a fair and transparent process
      practitioner: |
        You can:
        - advise on routes to market, including frameworks, direct awards, and competitive procedures
        - advise on evaluation, award decisions, and changes to contracts after award
        - respond to supplier challenges and complaints
        - advise on subsidy control and competition risks in partnerships
      expert: |
        You can:
        - set the organisation's approach to procurement legal risk
        - lead on high-value or novel procurements, such as innovation partnerships
        - defend significant procurement challenges

  - id: legal-health-and-care-law
    name: Health and care law
    description: Applying the law that governs health and care services, including consent, capacity, clinical negligence, regulation of services and products, and the organisation's statutory duties.
    esco:
      - {uri: http://data.europa.eu/esco/skill/1709f408-9965-489b-9805-8e1e5d9e483b, label: health care legislation, match: close}
      - {uri: http://data.europa.eu/esco/skill/efb523d0-c998-440d-8639-cd14ba841c4c, label: public law, match: broad}
    levels:
      awareness: |
        You can:
        - explain the organisation's main statutory duties and powers
        - recognise matters that involve patient safety, consent, or clinical negligence
      working: |
        You can:
        - support legal work on incidents, inquests, or clinical claims
        - explain the regulatory framework that applies to the organisation's services
      practitioner: |
        You can:
        - advise on the organisation's powers and duties, including when it can provide or commission a service
        - advise on the regulation of digital health products, such as software as a medical device
        - liaise with clinical negligence schemes and external lawyers on claims involving digital services
        - advise on consent, capacity, and patient rights in digital services
      expert: |
        You can:
        - advise the board on the organisation's statutory duties and governance
        - lead legal work on public inquiries, judicial reviews, and major incidents
        - shape the organisation's response to new health and care law
