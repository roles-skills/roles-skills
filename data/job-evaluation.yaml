# Generic 16-factor job evaluation scheme.
#
# Each factor has numbered levels. Each level has a short summary and a
# points value. A job's total points is the sum of the points for the level it
# reaches on each factor, and the total places the job in a band.
#
# Scores in this reference are illustrative. They show why a role level sits
# in its band. They are not a formal evaluation: a real evaluation scores the
# actual job, from an agreed job description, by a trained panel.
#
# Scoring principles:
# - Score the job, not the person doing it.
# - Score the normal, regular requirements of the job, not rare events.
# - Score the minimum knowledge needed to do the job, not the post holder's
#   qualifications.
# - Choose the level whose summary best fits as a whole; a lower level is
#   implied by a higher one.

factors:
  - id: communication
    name: Communication and relationship skills
    description: Skills needed to communicate with, and build relationships with, colleagues, patients, the public, and partners. Considers how complex, sensitive, or contentious the information is, and any barriers to understanding or acceptance.
    levels:
      "1": Gives and receives routine information orally, mainly with colleagues.
      "2": Gives and receives routine information orally, in writing, or electronically, with colleagues and others.
      "3": Gives routine information needing tact or persuasion, or complex or sensitive information, or straightforward training to groups.
      "4": Gives complex, sensitive, or contentious information needing persuasion, negotiation, or training skills, or highly complex information.
      "5": Gives highly complex or contentious information needing developed persuasion and negotiation, presents to large groups, or communicates where there are significant barriers to acceptance.
      "6": Gives highly complex, highly contentious information where there are significant barriers to acceptance, using the highest level of communication skills.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: knowledge
    name: Knowledge, training, and experience
    description: The knowledge and experience needed to do the job, from any source, including formal training, qualifications, and experience.
    levels:
      "1": A few routine procedures, learned on the job in a short induction.
      "2": A range of routine procedures, learned through on-the-job training and induction.
      "3": A range of procedures, some non-routine, needing base-level theory (for example a level 3 qualification or equivalent experience).
      "4": A range of procedures, mostly non-routine, needing intermediate theory (for example a foundation degree or equivalent experience).
      "5": Expertise in a specialism, underpinned by theory or practical experience (degree level or equivalent).
      "6": Specialist knowledge across the range of the specialism (postgraduate diploma level or equivalent).
      "7": Highly developed specialist knowledge across the range of the specialism (master's level or equivalent).
      "8": Advanced knowledge (doctorate plus further training or equivalent), or specialist knowledge across more than one discipline built over a long period.
    points: {"1": 16, "2": 36, "3": 60, "4": 88, "5": 120, "6": 156, "7": 196, "8": 240}

  - id: analytical
    name: Analytical and judgemental skills
    description: The analysis and judgement needed to process information, solve problems, and make decisions.
    levels:
      "1": Judgements on straightforward facts or situations.
      "2": Judgements on facts or situations, some needing analysis.
      "3": Judgements on a range of facts or situations needing analysis or comparison of options.
      "4": Judgements on complex facts or situations needing analysis, interpretation, and comparison of options.
      "5": Judgements on highly complex facts or situations needing analysis, interpretation, and comparison of options.
    points: {"1": 6, "2": 15, "3": 27, "4": 42, "5": 60}

  - id: planning
    name: Planning and organisational skills
    description: The planning and organising needed to run activities, programmes, services, or strategies.
    levels:
      "1": Organises own day-to-day work.
      "2": Plans straightforward tasks or activities, some ongoing.
      "3": Plans several complex activities, adjusting plans as needed.
      "4": Plans a broad range of complex activities or strategies, adjusting them as needed.
      "5": Forms long-term strategic plans, with uncertainty and effects across the organisation.
    points: {"1": 6, "2": 15, "3": 27, "4": 42, "5": 60}

  - id: physical-skills
    name: Physical skills
    description: The physical skills needed, such as dexterity, coordination, keyboard skills, and driving.
    levels:
      "1": Little need for physical skills.
      "2": Skills gained through practice, such as standard keyboard use or driving.
      "3": Developed skills needing speed or accuracy, such as advanced keyboard use.
      "4": Highly developed skills needing precision or speed and high hand–eye coordination.
      "5": The highest level of precision, speed, and coordination.
    points: {"1": 6, "2": 15, "3": 27, "4": 42, "5": 60}

  - id: patient-care
    name: Responsibility for patient and client care
    description: Responsibility for assessing, treating, caring for, or advising patients and clients. For most digital and corporate roles this is incidental contact only.
    levels:
      "1": Helps patients, clients, or relatives during incidental contact.
      "2": Gives general non-clinical advice, information, or services directly to patients or the public.
      "3": Gives personal care, basic clinical technical services, or basic clinical advice.
      "4": Carries out clinical care, provides clinical technical services, or advises on the care of patients.
      "5": Develops programmes of care, provides specialist clinical technical services, or gives specialised advice on patient care.
      "6": Develops specialised care, gives highly specialised advice, or is accountable for part of a clinical service.
      "7": Accountable for delivering a clinical or care service.
      "8": Corporate responsibility for clinical or care services.
    points: {"1": 4, "2": 9, "3": 15, "4": 22, "5": 30, "6": 39, "7": 49, "8": 60}

  - id: policy
    name: Responsibility for policy and service development
    description: Responsibility for developing and implementing policies and services, and how far the effects reach.
    levels:
      "1": Follows policies set by others; may comment on changes.
      "2": Implements policies for own area and proposes changes to its practices.
      "3": Implements policies for own area and proposes changes that affect other areas.
      "4": Implements policy and develops policy or services for a service or several areas.
      "5": Implements and develops a range of policies or services for a directorate.
      "6": Corporate responsibility for major policy or service development across or beyond the organisation.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: financial-resources
    name: Responsibility for financial and physical resources
    description: Responsibility for money, budgets, equipment, stock, buildings, and other assets.
    levels:
      "1": Takes personal care of equipment and resources used in own work.
      "2": Handles cash or valuables, looks after equipment used by others, controls stock, or authorises small payments.
      "3": Authorises payments, buys some assets or supplies, monitors or holds a delegated budget, or maintains assets.
      "4": Holds or sets the budget for a department or service, or buys or maintains its assets.
      "5": Holds or sets budgets, or manages assets, for several services.
      "6": Corporate responsibility for the organisation's finances or assets.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: people
    name: Responsibility for people
    description: Responsibility for managing, supervising, training, or developing staff, or for providing people (HR) services.
    levels:
      "1": Shows own work routines to new or less experienced colleagues.
      "2": Supervises or coordinates staff day to day, trains others regularly, or gives basic HR advice.
      "3": Manages a group of staff day to day, teaches core or specialist training, or gives core HR advice.
      "4": Line manages a function or department, designs training programmes as a main duty, or delivers a full range of HR services.
      "5": Line manages several departments, or manages training or a large part of HR across the organisation.
      "6": Corporate responsibility for the organisation's people or HR function.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: information-resources
    name: Responsibility for information resources
    description: Responsibility for information and information systems, paper or digital, including records, data, and the systems that hold them.
    levels:
      "1": Records information that the job holder produces.
      "2": Enters or stores data compiled by others, or occasionally writes reports or queries.
      "3": Takes formal minutes, regularly writes reports or queries, or maintains information systems as a significant duty.
      "4": Adapts or designs information systems to others' specifications, or runs information systems for a department as the main duty.
      "5": Designs and develops major information systems, or runs information systems for several services as the main duty.
      "6": Manages and develops information systems across the organisation as the main duty.
      "7": Corporate responsibility for the organisation's information systems.
    points: {"1": 4, "2": 9, "3": 16, "4": 24, "5": 34, "6": 46, "7": 60}

  - id: research
    name: Responsibility for research and development
    description: Responsibility for formal research, development, evaluation, audits, testing, and trials.
    levels:
      "1": Carries out surveys or audits for own work; occasionally takes part in research or testing.
      "2": Regularly does research, development, trials, or equipment and system testing as part of the job.
      "3": Carries out research or development within formal programmes as a main duty.
      "4": Coordinates and carries out research and development programmes.
      "5": Initiates and develops research and development programmes that support the organisation's objectives.
      "6": Initiates and develops research and development programmes with effects beyond the organisation.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: freedom-to-act
    name: Freedom to act
    description: How far the job holder decides what to do and how, and how closely their work is supervised.
    levels:
      "1": Works within set procedures, with supervision close by.
      "2": Follows standard procedures and precedent; someone is usually available to ask; work may be checked.
      "3": Follows defined policies and procedures; work is managed rather than supervised.
      "4": Results are defined, but the job holder decides how to achieve them, within broad policy.
      "5": Works within general policies, and in most cases decides how to interpret them.
      "6": Interprets overall policy and strategy to set goals and standards.
    points: {"1": 5, "2": 12, "3": 21, "4": 32, "5": 45, "6": 60}

  - id: physical-effort
    name: Physical effort
    description: The physical effort needed, considering its frequency, duration, and intensity.
    levels:
      "1": Sitting, standing, and walking, with little physical effort.
      "2": Frequent sitting or standing in a restricted position, or occasional light to moderate effort.
      "3": Frequent light effort for long periods, or frequent moderate effort for short periods.
      "4": Ongoing light effort, frequent moderate effort for long periods, or occasional intense effort.
      "5": Ongoing moderate effort, or frequent intense effort.
    points: {"1": 3, "2": 7, "3": 12, "4": 18, "5": 25}

  - id: mental-effort
    name: Mental effort
    description: The concentration needed, considering its frequency, duration, and how predictable the work is.
    levels:
      "1": General attention; occasional concentration on predictable work.
      "2": Frequent concentration on predictable work, or occasional concentration on unpredictable work.
      "3": Frequent concentration on unpredictable work, or occasional prolonged concentration.
      "4": Frequent prolonged concentration, or occasional intense concentration.
      "5": Frequent intense concentration.
    points: {"1": 3, "2": 7, "3": 12, "4": 18, "5": 25}

  - id: emotional-effort
    name: Emotional effort
    description: The emotional demands of the job, from direct or indirect exposure to distressing circumstances, such as reading distressing case records or handling serious incidents.
    levels:
      "1": Rare exposure, or occasional indirect exposure, to distressing circumstances.
      "2": Occasional exposure, or frequent indirect exposure, to distressing circumstances.
      "3": Frequent exposure to distressing circumstances, or occasional exposure to highly distressing ones.
      "4": Occasional exposure to traumatic circumstances, or frequent exposure to highly distressing ones.
    points: {"1": 5, "2": 11, "3": 18, "4": 25}

  - id: working-conditions
    name: Working conditions
    description: Exposure to unpleasant conditions or hazards. Near-continuous screen use on most days counts at level 2.
    levels:
      "1": Rare exposure to unpleasant conditions.
      "2": Occasional unpleasant conditions, frequent travel or outdoor work, or near-continuous screen use on most days.
      "3": Frequent unpleasant conditions, or occasional highly unpleasant ones.
      "4": Some exposure to hazards, or frequent highly unpleasant conditions.
      "5": Considerable exposure to hazards.
    points: {"1": 3, "2": 7, "3": 12, "4": 18, "5": 25}

# Points range for each band. The lowest possible total is 86 and the highest
# possible total is 1,000; Band 9 ends at 765.
bands:
  - {band: "1", min: 0, max: 160}
  - {band: "2", min: 161, max: 215}
  - {band: "3", min: 216, max: 270}
  - {band: "4", min: 271, max: 325}
  - {band: "5", min: 326, max: 395}
  - {band: "6", min: 396, max: 465}
  - {band: "7", min: 466, max: 539}
  - {band: 8a, min: 540, max: 584}
  - {band: 8b, min: 585, max: 629}
  - {band: 8c, min: 630, max: 674}
  - {band: 8d, min: 675, max: 720}
  - {band: "9", min: 721, max: 765}
